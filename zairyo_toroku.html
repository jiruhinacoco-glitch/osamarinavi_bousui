<script id="nn-kaitei-js">
/* ============================================================
   価格改定の履歴＋価格表の一括取り込み（2026-08-20b）
   ★メーカーの仕入価格表（実物）を見て分かったこと2つを実装した。
     ①価格改定が激しく、1枚の表に改定列が4本ある＝「いつの単価か」が命。
       → 単価を変えたら、前の単価を日付つきで自動で残す（m.hist）。
     ②ああいう表はメーカーから届く＝1品ずつ手で転記するのが実態。
       → Excelからコピーして貼るだけの一括取り込み（製品名で照合→まとめて更新）。
   ★作りは相乗り（§73）：saveDetail を包む。本体のデータ形はそのまま
     （m.hist を足すだけ。保存は items 丸ごとJSONなので自動で残る）。
   ============================================================ */
(function(){
"use strict";
const today=()=>{ const d=new Date(),p=n=>('0'+n).slice(-2); return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate()); };
const yen=v=>'¥'+Math.round(v).toLocaleString('ja-JP');

/* ---------- ① 単価を変えたら履歴に残す ---------- */
function pushHist(m, oldPrice){
  if(!(oldPrice>0)) return;
  m.hist=Array.isArray(m.hist)?m.hist:[];
  const last=m.hist[m.hist.length-1];
  if(last && last.p===oldPrice) return;          /* 同じ値を二重に積まない */
  m.hist.push({d:today(), p:oldPrice});
  if(m.hist.length>12) m.hist=m.hist.slice(-12); /* 直近12回まで */
}
const _sd=window.saveDetail;
window.saveDetail=function(){
  try{
    const m = sel && (sel.type==='item' ? items.find(x=>x.id===sel.id) : items.find(x=>x.catalogId===sel.id));
    if(m){
      const p=parseFloat(document.getElementById('d_price').value);
      const np=p>0?Math.round(p):null;
      if(m.price>0 && np && np!==m.price) pushHist(m, m.price);
    }
  }catch(_){}
  return _sd.apply(this,arguments);
};

/* ---------- 詳細に「価格改定」の行を出す ---------- */
const _rd=window.renderDetail;
window.renderDetail=function(){
  const r=_rd.apply(this,arguments);
  try{
    const m = sel && sel.type==='item' ? items.find(x=>x.id===sel.id)
            : sel ? items.find(x=>x.catalogId===sel.id) : null;
    if(m && Array.isArray(m.hist) && m.hist.length && m.price>0){
      const host=document.getElementById('d_conv');
      if(host && !document.getElementById('nnHistRow')){
        const first=m.hist[0], up=Math.round((m.price-first.p)/first.p*1000)/10;
        const seq=m.hist.map(h=>yen(h.p)+'<small>('+h.d+')</small>').join(' → ')
          +' → <b>'+yen(m.price)+'<small>(現在)</small></b>';
        const d=document.createElement('div'); d.id='nnHistRow';
        d.innerHTML='<b>価格改定</b> '+seq
          +(isFinite(up)&&up!==0?('　<span class="'+(up>0?'up':'dn')+'">'+(up>0?'+':'')+up+'%</span>'):'');
        host.parentNode.insertBefore(d, host.nextSibling);
      }
    }
  }catch(_){}
  return r;
};

/* ---------- ② 価格表の一括取り込み（Excelコピペ／CSV） ---------- */
function norm(s){
  /* 製品名の照合用：空白・全半角・大文字小文字のゆれを吸収する */
  return String(s||'').replace(/[\s　]/g,'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,
    c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).toLowerCase();
}
function parsePaste(text){
  /* 1行＝1品。「名前 (タブかカンマ) …数字…」の形。最後に出てくる数値を単価とみなす
     （実物の価格表は改定列が並ぶ＝一番右（＝最新）の数字が現在の単価）。 */
  const out=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    /* ★区切りはタブ優先。カンマ区切りのときは、先に「桁区切りのカンマ」（8,200 の類）を
       数字にくっつけてから割る。やらないと 8,200 が 8 と 200 に割れて 200円 になる
       （検証で実際になった）。 */
    let cells;
    if(line.indexOf('\t')>=0) cells=line.split('\t');
    else cells=line.replace(/(\d),(?=\d{3}(\D|$))/g,'$1').split(',');
    cells=cells.map(c=>c.trim()).filter(c=>c!=='');
    if(cells.length<2) return;
    const name=cells[0];
    if(!name || /^製品名|^品名|^名称/.test(name)) return;   /* 見出し行は飛ばす */
    let price=null;
    for(let i=cells.length-1;i>=1;i--){
      const v=parseFloat(cells[i].replace(/[¥,円\s]/g,''));
      if(isFinite(v) && v>0){ price=Math.round(v); break; }
    }
    if(price!=null) out.push({name:name, price:price});
  });
  return out;
}
window.nnPriceImportOpen=function(){
  let bg=document.getElementById('nnPimp');
  if(bg){ bg.classList.add('open'); return; }
  bg=document.createElement('div'); bg.className='modal-bg open'; bg.id='nnPimp';
  bg.innerHTML='<div class="modal"><h3>価格表の一括取り込み</h3>'
    +'<p style="font-size:12px;line-height:1.7;color:var(--ink-sub);margin-bottom:8px;">'
    +'メーカーの価格表（Excel）から <b>製品名と単価の列をコピーして、下に貼り付け</b>てください。'
    +'1行＝1品。数字が複数あるときは<b>一番右（最新）</b>を単価として読みます。</p>'
    +'<textarea id="nnPimpTx" rows="8" style="width:100%;font-size:16px;font-family:inherit;'
    +'border:1px solid var(--line);border-radius:8px;padding:8px;" '
    +'placeholder="ポリマリットキャップ\t7,200\nガムクールFX\t14,200\n（Excelで2列を選んでコピー→ここに貼り付け）"></textarea>'
    +'<div id="nnPimpPrev" style="margin:8px 0; max-height:38vh; overflow-y:auto;"></div>'
    +'<div class="btns"><button class="btn-main" id="nnPimpGo" style="display:none">まとめて更新する</button>'
    +'<button class="btn-ghost" id="nnPimpChk">照合する</button>'
    +'<button class="cancel" onclick="document.getElementById(\'nnPimp\').classList.remove(\'open\')">閉じる</button></div></div>';
  document.body.appendChild(bg);
  let plan=[];
  document.getElementById('nnPimpChk').onclick=function(){
    const rows=parsePaste(document.getElementById('nnPimpTx').value);
    const prev=document.getElementById('nnPimpPrev');
    if(!rows.length){ prev.innerHTML='<div style="color:var(--warn);font-size:12.5px;">読める行がありません。「製品名（タブかカンマ）単価」の形で貼ってください。</div>'; return; }
    /* 照合：登録済み → カタログ の順。名前のゆれは norm で吸収 */
    const regByName={}; items.forEach(m=>{ regByName[norm(m.n)]=m; });
    /* ★CATALOG は top-level の const。window には載らない（§47） */
    const catByName={}; ((typeof CATALOG!=='undefined')?CATALOG:[]).forEach(c=>{ if(!catByName[norm(c.n)]) catByName[norm(c.n)]=c; });
    plan=rows.map(r=>{
      const k=norm(r.name);
      const m=regByName[k];
      if(m) return {st:(m.price===r.price?'same':'update'), name:r.name, price:r.price, old:m.price, id:m.id};
      const c=catByName[k];
      if(c) return {st:'new', name:r.name, price:r.price, cat:c};
      return {st:'miss', name:r.name, price:r.price};
    });
    const n={update:0,same:0,new:0,miss:0}; plan.forEach(p=>n[p.st]++);
    prev.innerHTML='<table style="width:100%;border-collapse:collapse;font-size:12px;">'
      +'<tr><th style="text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);">製品名</th>'
      +'<th style="text-align:right;padding:3px 6px;border-bottom:1px solid var(--line);">単価</th>'
      +'<th style="text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);">判定</th></tr>'
      +plan.map(p=>{
        const lab=p.st==='update'?('<span style="color:#1c6b3c;font-weight:800;">更新 '+yen(p.old||0)+'→'+yen(p.price)+'</span>')
          :p.st==='same'?'<span style="color:var(--ink-sub);">同じ（変更なし）</span>'
          :p.st==='new'?'<span style="color:#14449c;font-weight:800;">新規登録（カタログ照合）</span>'
          :'<span style="color:var(--warn);font-weight:800;">見つからない（名前を確認）</span>';
        return '<tr><td style="padding:3px 6px;">'+esc(p.name)+'</td>'
          +'<td style="padding:3px 6px;text-align:right;">'+yen(p.price)+'</td>'
          +'<td style="padding:3px 6px;">'+lab+'</td></tr>';
      }).join('')+'</table>'
      +'<div style="font-size:12px;margin-top:6px;font-weight:700;">更新 '+n.update+'件／新規 '+n.new+'件／変更なし '+n.same+'件／見つからない '+n.miss+'件</div>';
    document.getElementById('nnPimpGo').style.display=(n.update+n.new)?'inline-block':'none';
  };
  document.getElementById('nnPimpGo').onclick=function(){
    let up=0, add=0;
    plan.forEach(p=>{
      if(p.st==='update'){
        const m=items.find(x=>x.id===p.id); if(!m) return;
        pushHist(m, m.price);
        m.price=p.price; m.updatedAt=Date.now(); up++;
      }else if(p.st==='new'){
        const it=newItemFromCatalog(p.cat);
        it.price=p.price; items.push(it); add++;
      }
    });
    if(up+add){ save(); render(); }
    bg.classList.remove('open');
    toast('価格表を取り込みました：更新 '+up+'件／新規 '+add+'件（前の単価は履歴に残しています）');
  };
};

 {c1:'各種副資材',c2:'プライマー',n:'水性プライマーC',sp:'18kg/缶',dt:'アクリル系プライマー',ko:'アスレイヤ水性',warn:'工法のマークが一覧表（■）と紹介ページ（●）で違って見えた'},
 {c1:'各種副資材',c2:'プライマー',n:'速硬化OTプライマーMブルー',sp:'8kg/缶',dt:'速乾性仲介プライマー',ko:'レイヤオール',warn:'工法のマークが一覧表（●）と紹介ページ（■）で違って見えた'},
 {c1:'各種副資材',c2:'保護塗料',n:'SPスーパーサーモコート',sp:'18kg/缶',dt:'高反射・高耐久 水性アクリル系厚膜保護塗料（1色）',ko:'レイヤオール'},
 {c1:'各種副資材',c2:'保護塗料',n:'SPファインカラー',sp:'18kg/缶',dt:'高反射 水性アクリル系保護塗料（4色）',ko:'レイヤオール'},
 {c1:'各種副資材',c2:'保護塗料',n:'SPトナー',sp:'1kg(600ml)/缶',dt:'保護塗料の工程管理用着色剤',ko:'レイヤオール',warn:'「1kg(600ml)」重さと量の両方が書かれている。発注単位を確かめて'},
 {c1:'各種副資材',c2:'通気材',n:'ステンレスベーパスNⅡ',sp:'250mm×250mm×H196mm 1個/箱',dt:'平面部用 ステンレス製通気材',ko:''},
 {c1:'各種副資材',c2:'シーリング材',n:'GCライン',sp:'330ccカート 10本/箱',dt:'変成シリコーン系シーリング材',ko:'レイヤオール・アスレイヤ水性',warn:'330cc と 850cc の2種類がある。別の材料として分けるか確かめて'}
]};

/* 規格の文字 → 発注単位・1単位の内容量・その単位（計算に使う形）。読めないときは null＝人が入れる */
function parseSpec(sp){
  const s=String(sp||'').normalize('NFKC').replace(/,/g,'');
  let m=s.match(/(\d+(?:\.\d+)?)\s*kg\s*\/\s*(缶|袋|セット)/);
  if(m) return {ou:m[2],cv:+m[1],cu:'kg'};
  m=s.match(/(\d+(?:\.\d+)?)\s*(mm|m)\s*[×x]\s*(\d+(?:\.\d+)?)\s*m(?![m\d])/);
  if(m){ const w=m[2]==='mm'?(+m[1])/1000:+m[1]; return {ou:'巻',cv:Math.round(w*(+m[3])*1000)/1000,cu:'㎡'}; }
  m=s.match(/(\d+)\s*本\s*\/\s*箱/); if(m) return {ou:'箱',cv:+m[1],cu:'本'};
  m=s.match(/(\d+)\s*個\s*\/\s*箱/); if(m) return {ou:'箱',cv:+m[1],cu:'個'};
  return null;
}
window.nnCatParseSpec=parseSpec;

let rows=[], maker='', from='';
const $=id=>document.getElementById(id);
function nrm(s){ return String(s||'').normalize('NFKC').replace(/[\s　]/g,'').toLowerCase(); }

window.nnCatReadOpen=function(){
  let bg=$('nnCatRead');
  if(!bg){
    bg=document.createElement('div'); bg.className='modal-bg'; bg.id='nnCatRead';
    bg.innerHTML='<div class="modal" style="width:min(760px,96vw)"><h3>📷 カタログから読み込む</h3><div id="nnCrBody"></div></div>';
    document.body.appendChild(bg);
    bg.addEventListener('click',e=>{ if(e.target===bg) bg.classList.remove('open'); });
  }
  step1(); bg.classList.add('open');
};
function close(){ const b=$('nnCatRead'); if(b) b.classList.remove('open'); }
window.nnCatReadClose=close;

function step1(){
  $('nnCrBody').innerHTML=
    '<p class="nncr-p">メーカーのカタログの<b>表紙・材料一覧（表）・材料紹介</b>のページを撮ってください（何枚でも）。'
    +'品名・規格・分類は自動で入ります。<b>単価・有効面積・アイコンはあとで入力</b>します。</p>'
    +'<label class="nncr-pick"><input type="file" id="nnCrFile" accept="image/*" multiple>📷 写真を撮る／選ぶ</label>'
    +'<div id="nnCrThumbs" class="nncr-thumbs"></div>'
    +'<p class="nncr-note">※写真はこの端末の中だけで使い、保存しません。カタログの商品写真は材料アイコンには使いません（写真は著作物のため）。</p>'
    +(window.NN_CATREAD_API?'':'<p class="nncr-demo">いまは<b>見本（デモ）</b>です。AIの読み取りは準備中のため、「読み取る」を押すと実際のカタログ（アスレイヤ・ネオ）をAIで読んだ結果を表示します。</p>')
    +'<div class="btns"><button class="cancel" onclick="nnCatReadClose()">キャンセル</button>'
    +'<button class="ok" id="nnCrGo">読み取る</button></div>';
  const files=[];
  $('nnCrFile').onchange=function(){
    [].forEach.call(this.files||[],f=>{ files.push(f); const u=URL.createObjectURL(f);
      const im=document.createElement('img'); im.src=u; im.onload=()=>URL.revokeObjectURL(u); $('nnCrThumbs').appendChild(im); });
  };
  $('nnCrGo').onclick=function(){ read(files); };
}

async function read(files){
  const api=window.NN_CATREAD_API;
  if(api){
    if(!files.length){ toast('写真を1枚以上えらんでください'); return; }
    $('nnCrGo').disabled=true; $('nnCrGo').textContent='読み取り中…';
    try{
      const fd=new FormData(); files.forEach((f,i)=>fd.append('p'+i,f));
      const r=await fetch(api,{method:'POST',body:fd}); const d=await r.json();
      maker=String(d.maker||''); from=String(d.from||''); rows=(Array.isArray(d.rows)?d.rows:[]).filter(x=>x&&x.n);
    }catch(e){ toast('読み取りに失敗しました。通信を確かめてください'); $('nnCrGo').disabled=false; $('nnCrGo').textContent='読み取る'; return; }
  }else{
    maker=SAMPLE.maker; from=SAMPLE.from; rows=JSON.parse(JSON.stringify(SAMPLE.rows));
  }
  const have={}; (typeof items!=='undefined'?items:[]).forEach(m=>{ have[nrm(m.n)+'|'+nrm(m.sp)]=1; });
  rows.forEach(r=>{ r.dup=!!have[nrm(r.n)+'|'+nrm(r.sp)]; r.on=!r.dup; r.u=parseSpec(r.sp); });
  step2();
}

function step2(){
  const nW=rows.filter(r=>r.warn||!r.u).length;
  $('nnCrBody').innerHTML=
    '<div class="nncr-head"><label>メーカー名</label><input id="nnCrMaker" value="'+esc(maker)+'">'
    +'<small>読み取り元：'+esc(from||'撮った写真')+'</small></div>'
    +'<p class="nncr-p"><b>'+rows.length+'品</b>を読み取りました。'
    +(nW?'<span class="nncr-wtag">黄色の'+nW+'品</span>は読み取りがあいまいです。写真と見比べて直してください。':'')
    +'チェックを外した行は登録しません。</p>'
    +'<div class="nncr-tbl"><table><thead><tr><th><input type="checkbox" id="nnCrAll" checked></th><th>品名</th><th>規格</th><th>分類</th><th>発注単位・内容量</th><th>工法</th></tr></thead><tbody>'
    +rows.map((r,i)=>{
      const u=r.u, why=r.dup?'登録済み（同じ品名・規格）':(r.warn||(!u?'規格から内容量が読めない。発注単位と内容量を入れて':''));
      return '<tr class="'+(r.dup?'dup':((r.warn||!u)?'warn':''))+'">'
        +'<td><input type="checkbox" data-i="'+i+'" class="nncr-on"'+(r.on?' checked':'')+'></td>'
        +'<td><input data-i="'+i+'" data-k="n" value="'+esc(r.n)+'"><div class="nncr-dt">'+esc(r.dt||'')+'</div>'
        +(why?'<div class="nncr-why">⚠ '+esc(why)+'</div>':'')+'</td>'
        +'<td><input data-i="'+i+'" data-k="sp" value="'+esc(r.sp)+'"></td>'
        +'<td class="nncr-c">'+esc(r.c2||'')+'</td>'
        +'<td class="nncr-u">'+(u?esc(u.cv+u.cu+'／'+u.ou):'<span class="nncr-q">？</span>')+'</td>'
        +'<td class="nncr-c">'+esc(r.ko||'')+'</td></tr>';
    }).join('')+'</tbody></table></div>'
    +'<div class="btns"><button class="cancel" onclick="nnCatReadOpen()">撮り直す</button>'
    +'<button class="ok" id="nnCrReg">チェックした材料を登録</button></div>';
  $('nnCrAll').onchange=function(){ const v=this.checked; rows.forEach(r=>{ if(!r.dup) r.on=v; }); step2(); };
  [].forEach.call(document.querySelectorAll('#nnCrBody .nncr-on'),c=>c.onchange=function(){ rows[+this.dataset.i].on=this.checked; });
  [].forEach.call(document.querySelectorAll('#nnCrBody input[data-k]'),c=>c.onchange=function(){
    const r=rows[+this.dataset.i]; r[this.dataset.k]=this.value.trim(); if(this.dataset.k==='sp'){ r.u=parseSpec(r.sp); step2(); } });
  $('nnCrMaker').onchange=function(){ maker=this.value.trim(); };
  $('nnCrReg').onclick=register;
}

function register(){
  const mk=($('nnCrMaker').value||'').trim()||'（メーカー未設定）';
  const C1=(typeof C1_LIST!=='undefined')?C1_LIST:[];
  let n=0;
  rows.forEach(r=>{ if(!r.on||!r.n) return; const u=r.u||{ou:'個',cv:1,cu:'個'};
    items.push({id:uid(),catalogId:null,maker:mk,n:r.n,s:r.n,
      c1:C1.indexOf(r.c1)>=0?r.c1:'各種副資材',c2:r.c2||'その他',sp:r.sp||'―',dt:r.dt||'',j:'',pk:r.sp||'',cl:'',pr:'標準品',
      us:'',bk:r.ko?('適用工法：'+r.ko):'',pg:'',ou:u.ou,cv:u.cv,cu:u.cu,price:null,
      memo:'カタログから読み込み',src:'catalog',createdAt:Date.now(),updatedAt:Date.now()});
    n++; });
  if(!n){ toast('登録する材料にチェックを入れてください'); return; }
  save(); close();
  try{ showViewKeepSel('mine'); }catch(_){ render(); }
  toast(n+'品を登録しました。単価はあとで入力（⚙データ→価格表の貼り付けでまとめて入れられます）');
}
})();
</script>

<style id="nn-httl-img">
/* ============================================================
   ★2026-08-30g 見出しの平行四辺形を、本人がパワポで作ったフレームの画像に差し替えた（§256）
   ------------------------------------------------------------
   ・形 ＝ icons/httl_frame.png を**3分割（border-image）**で使う。
     左の斜めの端／右の斜めの端 は伸びず、**まん中だけ**が伸びる。
     ＝どんな長さの見出しでも、端の傾き（26.8度）と濃い緑の三角が1画素も崩れない。
     ★右の端を 500px と広く取ってあるのは、濃い緑の三角（左端 x=925）を
       まるごと「伸びない側」に入れるため。ここを狭くすると三角の角度が変わる。
   ・文字 ＝ Noto Sans JP Black（見出しに出る文字だけに絞った 52KB）。
     ★本人がパワポで使った HGP創英角ゴシックUB は Office 専用で、iPhone に無く、
       許諾上ウェブにも載せられない。いちばん近い無料（SIL OFL）の書体に置き換えた。
     ★font-display:swap ＝ 読み終わるまでは端末の書体で出るので、
       表示が1msも遅れない（2026-07-28 の速度の決着を守る）。
   ・色は本人の絵の実測：文字 #502126／フチ 白／枠 #502126（8px＝高さの3.1%）
   ============================================================ */
@font-face{
  font-family:'NNHead';
  src:url('./fonts/notosansjp-black.woff2') format('woff2');  /* 版名は nn-httl-img-js が付け直す（§66） */
  font-weight:400 900; font-style:normal; font-display:swap;
}
.httl{
  font-family:'NNHead','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif !important;
  font-weight:900 !important;
  color:#502126 !important;
  /* 白いフチ。paint-order で**外側**に付く（付けないと字の中に食い込んで細く見える） */
  -webkit-text-stroke:1px #fff !important;
  paint-order:stroke fill;
  text-shadow:none !important;
  letter-spacing:.02em !important;
}
/* 平行四辺形の本体＝本人の画像。CSSで描いていた地・枠・影は全部やめる */
.httl::before{
  transform:none !important;
  background:none !important;
  border-radius:0 !important;
  box-shadow:none !important;
  /* ★em は「その要素の font-size」が基準。現場記録帳には昔の「●」印の指定
     （.httl::before{font-size:9px}）が残っていて、そのままでは端の幅が半分になる。
     見出しの文字の大きさを基準にしたいので、必ず inherit を書くこと。 */
  font-size:inherit !important;
  border-style:solid !important;
  border-color:transparent !important;
  border-width:0 4.4em 0 1.35em !important;
  border-image:var(--nnhttl, url('./icons/httl_frame.png')) 0 500 0 150 fill / 0 4.4em 0 1.35em / 0 stretch !important;
}
html[data-nnphone="1"] .httl{ -webkit-text-stroke-width:.8px !important; }
/* イラストは平行四辺形の内側に。左端は斜めなので、少し右へ寄せないと枠からはみ出す */
.httl > img.hpic{ left:7px !important; }
html[data-nnphone="1"] .httl > img.hpic{ left:5px !important; }
</style>

<title>納まりナビ – 材料登録</title>
<!-- ============================================================
     ★2026-07-28 画面が出るまでが遅い原因は、ここにあった。
     Zen Kaku Gothic New は日本語フォント。Googleはこれを
     「約120個に小分けした指定 × 太さ3種 ＝ 約360個の指定（81KB）」
     という形のCSSで配ってくる。ページを開くたびに、この360個の指定を
     すべて読み込んで、画面上のすべての文字と照合してから描き始めるため、
     中身の重さと関係なく、毎回まるまる待たされていた。

     実測（同一条件）：このCSSがあると画面が出るまでの時間が約2倍
       ホーム        1,152ms → 2,288ms
       現場記録帳    1,940ms → 3,592ms
       現場マップ      544ms →   532ms （このCSSを読まないページ＝変化なし）
     ※「現場マップだけ速い」のは、このページがフォントを読んでいなかったため。

     → 既定では読み込まない。iPhone内蔵の游ゴシック系（ヒラギノ）で表示する。
       下の NN_WEBFONT を true にすると、画面が出たあとに読み込んで
       Zen Kaku Gothic New に切り替える（見た目優先・表示は少し遅くなる）。
     ============================================================ -->
<script>
const NN_WEBFONT=false;       /* true にすると Zen Kaku Gothic New を後読みする */
if(NN_WEBFONT){
  addEventListener('load',()=>setTimeout(()=>{
    const l=document.createElement('link'); l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap';
    document.head.appendChild(l);
  },300));
}
</script>
<style>
/* ============================================================
   納まりナビ 材料登録 — ゲームUIスタイル版
   参考：パワプロ栄冠ナイン系（丸ゴ極太＋縁取り文字／押し込みボタン／
   キャンディバッジ／斜めストライプ帯）
   機能・クラス構成は従来版と完全互換
   ============================================================ */
:root{
  /* 共通8色は common.css に移動（green-deep/green/green-lite/paper/card/ink/ink-sub/line） */
  --green-hi:#48c274; --green-edge:#124a28;
  --orange:#ff9d1e; --orange-deep:#e07800; --orange-edge:#b35f00;
  --yellow:#ffd94d; --yellow-deep:#f0b400;
  --profit:#0a6bd6; --warn:#e04530; --warn-deep:#b0392f; --gold:#a8862a;
  /* ★2026-11-23zr 防水の色は現場記録帳の決まり（§1265 の No. の色）にそろえる：熱アス＝黒 #1e1e1e／改質アスファルト＝濃い赤 #a11d1d／ウレタン（塗膜）＝青 #1f5fc0／塩ビ（シート）＝緑 #22914a／その他＝灰 #6b7378 */
  --c-as:#1e1e1e; --c-kyo:#c08038; --c-kai:#a11d1d; --c-gs:#22914a; --c-tm:#1f5fc0; --c-fs:#6b7378;
  --radius:9px;
  /* 縁取り文字（ゲーム風アウトライン） */
  --stroke-g: 0 1px 1px rgba(18,74,40,.55);
  font-size:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:
    radial-gradient(circle at 18% -8%, rgba(255,255,255,.75), transparent 42%),
    repeating-linear-gradient(-45deg, rgba(46,158,88,.02) 0 22px, transparent 22px 44px),
    var(--paper);
  color:var(--ink); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  font-weight:500;
}
.num{font-variant-numeric:tabular-nums;}
b,strong{font-weight:700;}
/* ---------- ヘッダー：斜めストライプ帯＋縁取りタイトル ---------- */
header{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
    linear-gradient(180deg, var(--green-hi), var(--green) 55%, var(--green-deep));
  color:#fff; display:flex; align-items:center; gap:10px; padding:5px 13px; flex:none;
  border-bottom:2px solid var(--green-edge);
  box-shadow:0 2px 0 rgba(0,0,0,.08);
  position:relative; z-index:20;
}
header .hicon{font-size:19px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));}
header h1{
  font-size:17px; font-weight:900; letter-spacing:.04em;
  text-shadow:var(--stroke-g);
}
header .count{margin-left:auto; font-size:12.5px; font-weight:700; white-space:nowrap; text-shadow:0 1px 0 rgba(0,0,0,.3);}
header .count .np{
  background:linear-gradient(180deg,#ff6a55,var(--warn-deep));
  border:1.5px solid #7d251c; border-radius:999px; padding:1px 8px; margin-left:7px; font-size:11px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 1px 0 #5e1a13;
}
button.new-btn{
  background:linear-gradient(180deg,#ffffff,#e8f5ec);
  color:var(--green-deep); border:1.5px solid var(--green-deep); border-radius:8px;
  font-size:12.5px; font-weight:700; padding:4px 10px; cursor:pointer; letter-spacing:.02em; white-space:nowrap;
  font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 var(--green-edge);
  transition:transform .06s, box-shadow .06s;
}
button.new-btn:hover{background:linear-gradient(180deg,#ffffff,#d7efdf);}
button.new-btn:active{transform:translateY(2px); box-shadow:inset 0 2px 0 rgba(255,255,255,.9), 0 0 0 var(--green-edge);}
/* ---------- ビュータブ：ゲームのモード切替タブ ---------- */
#viewtabs{display:flex; gap:6px; padding:6px 13px 0; background:transparent; flex:none; flex-wrap:wrap;}
/* ★2026-11-17g 見切れ巡回⑦ PC：上の帯の絵（缶と紙）が帯の下へ約15pxはみ出し、「メーカーカタログ（田島244品）」のタブの文字に重なっていた → タブの段を絵の下まで下げる（スマホは重ならないので今までどおり） */
html:not([data-nnphone="1"]) #viewtabs{padding-top:15px;}
#viewtabs button{
  border:1.5px solid #a9b5a5; border-bottom:none;
  background:linear-gradient(180deg,#f2f4ee,#d9ddd2); color:var(--ink-sub);
  border-radius:9px 9px 0 0;
  padding:6px 14px 5px; font-size:13px; font-weight:700; cursor:pointer; letter-spacing:.02em;
  font-family:inherit;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8);
}
#viewtabs button.on{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 12px, transparent 12px 24px),
    linear-gradient(180deg, var(--green-hi), var(--green));
  color:#fff; border-color:var(--green-edge);
  text-shadow:var(--stroke-g);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35);
}
#viewtabs button:not(.on):hover{background:linear-gradient(180deg,#f7f9f3,#cfd4c6);}
/* ---------- 検索・絞り込みバー ---------- */
.toolbar{
  display:flex; align-items:center; gap:7px; padding:5px 13px; background:rgba(46,158,88,.10);
  border-top:2px solid var(--green-deep);
  border-bottom:2px solid #c2ccbe; flex:none; flex-wrap:wrap;
}
.search{flex:0 1 340px; position:relative;}
.search input{
  width:100%; padding:5px 10px 5px 28px; border:1.5px solid #b9c4b4; border-radius:8px;
  font-size:14px; background:#fff; font-family:inherit; font-weight:600;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.08);
}
.search input:focus{border-color:var(--green); outline:none;}
.search::before{content:"🔍"; position:absolute; left:9px; top:6px; font-size:12px; opacity:.6; z-index:1;}
.chips{margin-left:auto; display:flex; gap:7px; flex-wrap:wrap;}
.chip{position:relative;}
.chip>button{
  background:linear-gradient(180deg,#5b675f,#3c4440); color:#fff; border:2px solid #242a27; border-radius:8px; padding:4px 10px;
  font-size:12px; font-weight:700; cursor:pointer; letter-spacing:.02em; font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 2px 0 #1b201d;

}
.chip>button:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 #1b201d;}
.chip>button.active{
  background:linear-gradient(180deg,var(--orange),var(--orange-deep));
  border-color:var(--orange-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 0 var(--orange-edge);
  text-shadow:0 1px 0 rgba(0,0,0,.25);
}
.chip .menu{
  display:none; position:absolute; top:calc(100% + 6px); right:0; z-index:30;
  background:#fff; border:1.5px solid var(--green-deep); border-radius:10px; min-width:180px;
  box-shadow:0 2px 0 var(--green-edge), 0 8px 18px rgba(0,0,0,.18); max-height:280px; overflow:auto;
}
.chip .menu.open{display:block;}
.chip .menu div{padding:7px 12px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; border-bottom:1px solid #edf1ea;}
.chip .menu div:last-child{border-bottom:none;}
.chip .menu div:hover{background:var(--green-lite);}
.chip .menu div.sel{background:linear-gradient(180deg,var(--green-hi),var(--green)); color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.25);}
/* ---------- 本体2ペイン ---------- */
main{flex:1; display:flex; min-height:0;}
#list{
  flex:0 0 46%; max-width:640px; overflow-y:auto; background:#faf9f0; border-right:0;
}
#resizer{flex:0 0 6px; cursor:col-resize; background:transparent; border-left:2px solid #c2ccbe; transition:background .12s;}
#resizer:hover,#resizer.on{background:#ffd94d;}
#detail{flex:1; min-width:0; overflow-y:auto; background:#faf9f0; border-left:2px solid #c2ccbe;}
/* 中分類グループ見出し：リボン帯 */
.ghead{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:9px;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.05) 0 10px, transparent 10px 20px),
    linear-gradient(180deg,#eef6e8,#dcead6);

.ghead small{margin-left:auto; color:var(--ink-sub); font-weight:700;}

/* ★2026-09-30d 行の左の空き（本人「左半分くらいが空白で不自然」§559）：
   ▶の入らない行は▶の場所（14px＋すき間8px）を取らない・左の余白を12→6px。絵は60×45（4:3）に大きく */
.mrow:not(.child){padding-left:6px;}
.mrow .caret:empty{display:none;}
.mrow .nm{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.mhead .h-r span{flex:none;}
.mhead .h-src{width:150px;} .mhead .h-tg{width:132px;} .mhead .h-pr{width:96px; text-align:right;}
/* ★2026-11-23zm 一覧の幅が 560〜760px（ふつうのノートPC）のとき、3つのマスが入りきらず単価の列が右へはみ出して見えなかった
   → この幅では規格を出さず、マスを少し細くする。絵も 40×30 → 36×27 にして行を 35 → 32px */
@container (max-width:760px){
  /* ★2026-11-23zn 本人の画面も、中身の幅はここ（一覧 約625px。全体を拡大して見せている）＝ふつうの見え方がこの段。規格・荷姿の列も出す（90px）。
     足し算：左6＋絵36＋名前（残り）＋規格90＋出典100＋状態104＋単価76＋すき間 → 625px で名前に約165px */
  .mrow .sp, .mhead .h-sp{flex:0 0 90px; min-width:0;}
  .mrow .nm, .mhead .h-nm{flex:1 1 auto; min-width:8em;}
  .mrow.child .nm{flex:1 1 auto;}
  .mrow .right .rc.src, .mhead .h-src{width:100px;}
  .mrow .right .rc.tg, .mhead .h-tg{width:104px;}
  .mrow .right .rc.pr, .mhead .h-pr{width:76px;}
}
@container (max-width:560px){
  .mrow .right .rc.src, .mhead .h-src, .mhead .h-sp, .mrow .sp{display:none;}
  .mrow .nm, .mhead .h-nm{flex:1 1 auto; min-width:6em;}
  .mrow.child .nm{flex:1 1 auto;}
  .mrow .right .rc.tg, .mhead .h-tg{width:auto; min-width:0;}
  .mrow .right .rc.pr, .mhead .h-pr{width:84px;}
}
html[data-nnphone="1"] .mrow .right .rc.src, html[data-nnphone="1"] .mhead{display:none;}
html[data-nnphone="1"] .mrow .right .rc{width:auto;}
/* ★2026-11-23zp 本人「文字のサイズを調整して。材料名をもう少し小さく。少なくとも価格と単位は見切れなく。そのかわり出典は見出し（一覧）に出さなくてよい。詳細に記載」。
   ・一覧の出典のマスをやめた（詳細の見出しの札と「掲載」の行に出る）。空いた幅を 材料名 と 単価 へ。
   ・材料名 13.5 → 12.5px（子の行 12.5 → 12px）。単価のマスは 120px・切らない（「¥128,000／セット」が入る幅）。単位の字は 10 → 10.5px。 */
.mrow .nm{font-size:12.5px;}
.mrow.child .nm{font-size:12px;}
/* ★2026-11-23zq 単価と単位が2段のままだった：前からある .mrow .price small{display:block} がこの指定より後ろにあって勝っていた → 指定を強くして1行に */
.mrow .right .rc.pr .price{white-space:nowrap;}
/* ★2026-11-23zt 詳細の「仕入先ごとの単価」。入力欄は今ある .qty-line（内容量の行）の見た目をそのまま使い、幅だけ決める */
#detail .suprow{margin-top:5px; gap:6px; flex-wrap:nowrap;}
#detail .suprow .supstd{display:inline-flex; align-items:center; gap:3px; flex:none; cursor:pointer; white-space:nowrap;}
#detail .suprow .supstd input{width:auto; margin:0; box-shadow:none; padding:0;}
#detail .suprow .supn{flex:1 1 60px; min-width:56px; width:auto; text-align:left;}
#detail .suprow .supp{flex:0 0 78px; width:78px;}
#detail .suprow .supd{flex:0 0 116px; width:116px; text-align:left; font-weight:600; padding-left:4px; padding-right:2px;}
#detail .suprow .supx{flex:none; padding:3px 8px;}
#detail .suprow>span{flex:none;}
/* ★2026-11-23zs 単価のマスは押すと入力欄になる（.pe）。点線の下線＝ここは直せる、の印 */
.mrow .right .rc.pr.pe{cursor:text;}
.mrow .right .rc.pr.pe .price{border-bottom:1px dotted #9aa89a;}
.mrow .right .rc.pr.pe:hover .price{border-bottom-color:var(--orange);}
.mrow .right .rc.pr .peWrap{display:inline-flex; align-items:center; gap:2px; font-size:12.5px; font-weight:700; white-space:nowrap;}
.mrow .right .rc.pr .peWrap small{font-size:10.5px; color:var(--ink-sub); font-weight:700;}
.mrow .right .rc.pr .peIn{width:62px; height:22px; font:inherit; text-align:right; border:1.5px solid var(--orange); border-radius:4px; padding:0 3px; background:#fff; box-sizing:border-box;}
.mrow .right .rc.pr .price small{display:inline; font-size:10.5px; margin-left:1px;}
.mrow .right .rc.pr{width:120px; overflow:visible;}
.mhead .h-pr{width:120px;}
.mrow .right .rc.tg, .mhead .h-tg{width:112px;}
@container (max-width:760px){
  .mrow .right .rc.pr, .mhead .h-pr{width:120px;}
  .mrow .right .rc.tg, .mhead .h-tg{width:108px;}
  .mrow .sp, .mhead .h-sp{flex:0 0 96px;}
}
@container (max-width:560px){
  .mrow .right .rc.pr, .mhead .h-pr{width:112px;}
  .mrow .right .rc.tg, .mhead .h-tg{width:auto; min-width:0;}
  .mrow .sp, .mhead .h-sp{display:none;}
}
html[data-nnphone="1"] .mrow .tag.src{display:none;}
.mrow .price{font-size:12.5px; font-weight:700; white-space:nowrap; text-align:right;}
.mrow .price small{display:block; font-size:10px; color:var(--ink-sub); font-weight:700;}
.mrow .price.unset{color:var(--warn);}
/* シリーズ子行 */
.mrow.child{padding-left:34px; background:#fcfcf5; min-height:31px;}
.mrow.child:hover{background:#f0faf3;}
.mrow.child .nm{font-size:12.5px; font-weight:700;}
.empty{padding:40px 20px; text-align:center; color:var(--ink-sub); font-size:14px; font-weight:600;}
/* ---------- 右：詳細 ---------- */
.dhead{padding:9px 13px 0;}
.dhead .path{font-size:11px; font-weight:700; color:var(--gold); letter-spacing:.06em;}
.dhead .t{display:flex; align-items:baseline; gap:12px; margin-top:2px;}
.dhead h2{font-size:16.5px; font-weight:700; flex:1; line-height:1.4; letter-spacing:.02em;}
.dhead .meta{display:flex; gap:7px; flex-wrap:wrap; margin-top:5px; font-size:12px; color:var(--ink-sub); align-items:center; font-weight:600;}
.dbody{padding:8px 13px 78px;}
/* ゲームウィンドウ風パネル：太枠＋下エッジ */
.panel{
  background:#fff; border:1px solid #c3d0be; border-radius:8px; padding:8px 11px; margin-bottom:8px;
  box-shadow:0 1px 0 #c9d5c4;
}
.panel h4{
  font-size:11.5px; font-weight:700; color:var(--green-deep); margin:-8px -11px 7px; letter-spacing:.05em; display:flex; align-items:center; gap:8px;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.10) 0 9px, transparent 9px 18px),
    linear-gradient(180deg,#e9f6e4,#d5ecd0);
  padding:4px 11px; border-bottom:1px solid #bcd6b6; border-radius:7px 7px 0 0;
}
.kv{display:grid; grid-template-columns:98px 1fr; gap:4px 9px; font-size:13px;}
.kv dt{color:var(--ink-sub); font-weight:700;}
.kv dd{font-weight:600; line-height:1.55;}
/* 単価パネル */
.price-line{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.price-line .yen{font-size:16px; font-weight:700; color:var(--ink-sub);}
.price-line input{
  width:145px; padding:6px 10px; border:1.5px solid #b9c4b4; border-radius:8px;
  font-size:16.5px; font-weight:700; text-align:right; font-family:inherit;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.08);
}
.price-line input:focus{border-color:var(--orange); outline:none; box-shadow:inset 0 2px 4px rgba(0,0,0,.08), 0 0 0 3px rgba(255,157,30,.25);}
.price-line .per{font-size:14px; font-weight:700;}
.conv{font-size:12px; color:var(--ink-sub); margin-top:5px; min-height:1.2em; font-weight:600;}
.conv b{color:var(--profit); font-size:14px;}
.conv:empty{display:none;}   /* ★2026-09-23aj 換算単価が無いとき約30pxの空白が残っていた */
.qty-line{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:12.5px; flex-wrap:wrap; font-weight:600;}
.qty-line input{width:80px; padding:5px 8px; border:1.5px solid #b9c4b4; border-radius:7px; text-align:right; font-size:13.5px; font-family:inherit; font-weight:700; box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
.qty-line select{padding:5px 7px; border:1.5px solid #b9c4b4; border-radius:7px; font-size:13px; background:#fff; font-family:inherit; font-weight:700;}
.qty-line .why{color:var(--ink-sub); font-size:12px;}
.memo-line{margin-top:8px;}
.memo-line input{width:100%; padding:6px 10px; border:1.5px solid #b9c4b4; border-radius:7px; font-size:13px; font-family:inherit; font-weight:600; box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
.actrow{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center;}
/* 決定ボタン：ゲームの「押し込み」立体ボタン */
.btn-ok{
  background:
    linear-gradient(180deg, var(--green-hi), var(--green) 60%, var(--green-deep));
  color:#fff; border:2px solid var(--green-edge); border-radius:8px; padding:7px 20px; font-size:13.5px; font-weight:700; cursor:pointer; letter-spacing:.03em;
  font-family:inherit;
  text-shadow:var(--stroke-g);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 var(--green-edge), 0 4px 6px rgba(0,0,0,.12);
  transition:transform .06s, box-shadow .06s;
}
.btn-ok:hover{filter:brightness(1.06);}
.btn-ok:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 var(--green-edge);}
.btn-ghost{
  background:linear-gradient(180deg,#ffffff,#eef6ef);
  border:1.5px solid var(--green); color:var(--green-deep); border-radius:8px; padding:5px 13px; font-size:12.5px; font-weight:700; cursor:pointer;
  font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 #9cc4a8;
  transition:transform .06s, box-shadow .06s;
}
.btn-ghost:hover{background:var(--green-lite);}
.btn-ghost:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 #9cc4a8;}
.btn-del{margin-left:auto; background:none; border:0; color:var(--warn); font-size:12px; font-weight:700; cursor:pointer; text-decoration:underline; font-family:inherit;}
.hint{font-size:11.5px; color:var(--ink-sub); margin-top:6px; line-height:1.65; font-weight:600;}
/* シリーズ詳細のサイズ表 */
.sz-tbl{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px; border:1px solid #c3d0be; border-radius:7px; overflow:hidden;}
.sz-tbl th,.sz-tbl td{border-bottom:1px solid #dfe5da; border-right:1px solid #dfe5da; padding:4px 8px; text-align:left; white-space:nowrap;}
.sz-tbl th:last-child,.sz-tbl td:last-child{border-right:none;}
.sz-tbl tr:last-child td{border-bottom:none;}
.sz-tbl th{background:linear-gradient(180deg,#e9f6e4,#d5ecd0); font-weight:700; color:var(--green-deep);}
.sz-tbl td.num{text-align:right; font-weight:700;}
.sz-tbl tr.click{cursor:pointer;}
.sz-tbl tr.click:hover td{background:#f0faf3;}
/* ---------- メーカー切替バー：カプセル選択 ---------- */
#makerbar{display:flex; gap:5px; padding:4px 12px 4px; background:rgba(46,158,88,.07); border-bottom:2px solid #c2ccbe; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; align-items:center;}
#makerbar::-webkit-scrollbar{display:none;}
#makerbar .mlabel{flex:none; font-size:10.5px; font-weight:700; color:var(--ink-sub); margin-right:2px; white-space:nowrap; letter-spacing:.05em;}
#makerbar .mk{
  flex:none; border:1.5px solid #b0bcaa; background:linear-gradient(180deg,#ffffff,#eef1e8); border-radius:7px; padding:3px 10px; font-size:11.5px; font-weight:700; cursor:pointer; white-space:nowrap; color:var(--ink);
  font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 0 #9aa694;
  transition:transform .06s, box-shadow .06s;
}
#makerbar .mk:hover{border-color:var(--green);}
#makerbar .mk:active{transform:translateY(1px); box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 #9aa694;}
#makerbar .mk.on{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.05) 0 10px, transparent 10px 20px),
    linear-gradient(180deg,var(--green-hi),var(--green));
  border-color:var(--green-edge); color:#fff;
  text-shadow:0 1px 0 rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 1px 0 var(--green-edge);
}
#makerbar .mk.soon{
  background:#eceee6; color:#9aa094; border:1.5px dashed #b5bcae;
  box-shadow:none; cursor:not-allowed; opacity:.85;
}
#makerbar .mk.soon:hover{border-color:#b5bcae;}
#makerbar .mk.soon:active{transform:none; box-shadow:none;}
#makerbar .mk .st{font-size:9px; font-weight:700; margin-left:4px; opacity:.85;}
/* ---------- 下部ナビ：ゲームのボトムメニュー ---------- */
nav{
  flex:none;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,#1f5c36,#153f25);
  display:flex; gap:3px; padding:2px 7px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:calc(2px + env(safe-area-inset-bottom)); /* 端末下端の見切れ防止（rev.04 ③） */
  border-top:2px solid #0d2a18;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
}
nav .ni{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfe6d6;
  font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;
  transition:transform .06s;
}
nav .ni .ic{font-size:19px; line-height:1; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));}
nav .ni:hover{background:rgba(255,255,255,.10);}
nav .ni:active{transform:translateY(1px);}
nav .ni.on{
  background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));
  color:#4d3a00; border:1.5px solid #a87f00;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #7d5f00;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
/* ---------- 画像アイコンボタン（ナビ改修指示書 Step3） ---------- */
nav .ni .ic img, nav#nav .ni .ic img{height:44px; display:block;}
nav .ni.hasimg, nav#nav .ni.hasimg{padding:0 3px; margin-top:-13px;}
nav .ni.hasimg > span:last-child, nav#nav .ni.hasimg > span:last-child{display:none;}
nav .ni.hasimg .ic, nav#nav .ni.hasimg .ic{filter:none;}
nav .ni.hasimg.on, nav#nav .ni.hasimg.on{background:none; border:none; box-shadow:none; text-shadow:none;
  filter:drop-shadow(0 0 5px #ffd23f) drop-shadow(0 0 2px #ffd23f);
  transform:scale(1.14);
  transform-origin:center bottom;
  z-index:2; position:relative;
}
nav .ni.hasimg, nav#nav .ni.hasimg{transition:transform .15s ease-out, filter .15s ease-out;}
nav .ni.hasimg:hover, nav#nav .ni.hasimg:hover{transform:scale(1.06);}
nav .ni.hasimg.on:hover, nav#nav .ni.hasimg.on:hover{transform:scale(1.14);}
nav, nav#nav{overflow:visible; padding-top:2px;}
@media (max-width:760px){
  nav, nav#nav{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; justify-content:flex-start;}
  nav::-webkit-scrollbar, nav#nav::-webkit-scrollbar{display:none;}
  nav .ni .ic img, nav#nav .ni .ic img{height:38px;}
  nav .ni.hasimg, nav#nav .ni.hasimg{margin-top:0;}
  nav .ni:first-child, nav#nav .ni:first-child{margin-left:0;}
  nav .ni:last-child, nav#nav .ni:last-child{margin-right:0;}
}
/* --- モバイル対応：ナビのあふれスクロール・縮小・セーフエリア --- */
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
/* ---------- タップ演出（shiyo_toroku基準：タッチ発光） ---------- */
@keyframes tapfx-glow{
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
  60%{opacity:.7;}
  100%{opacity:0; transform:translate(-50%,-50%) scale(2.1);}
}
@keyframes tapfx-ring{
  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.45);}
}
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);
  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .55s ease-out forwards;
}
.tapfx::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:2px solid rgba(255,217,77,.9);
  animation:tapfx-ring .55s ease-out forwards;
}
nav::-webkit-scrollbar{display:none;}
@media(max-width:700px){
  nav .ni{padding:4px 8px; font-size:10px; gap:1px;}
  nav .ni .ic{font-size:19px;}
}

/* ---------- モーダル：ゲームダイアログ ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(12,32,20,.55); display:none; align-items:center; justify-content:center; z-index:100;}
.modal-bg.open{display:flex;}
.modal{
  background:#fffdf4; border:2px solid var(--green-deep); border-radius:10px; width:min(520px,92vw); padding:13px 15px; max-height:88vh; overflow:auto;
  box-shadow:0 3px 0 var(--green-edge), 0 14px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.9);
}
.modal h3{
  font-size:13.5px; font-weight:700; color:#fff; margin:-13px -15px 11px; letter-spacing:.04em;

    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,var(--green-hi),var(--green));

.modal input,.modal select{width:100%; padding:7px 10px; border:1.5px solid #b9c4b4; border-radius:7px; font-size:16px; font-family:inherit; font-weight:600; background:#fff; box-shadow:inset 0 2px 4px rgba(0,0,0,.07);}
.modal input:focus,.modal select:focus{border-color:var(--green); outline:none;}
.modal .mrow2{display:flex; gap:10px;}
.modal .mrow2>div{flex:1;}
.modal .btns{display:flex; gap:8px; justify-content:flex-end; margin-top:13px;}
.modal .btns .cancel{
  background:linear-gradient(180deg,#f2f2ee,#dcdcd4); border:2px solid #a9a99f; border-radius:8px; padding:6px 13px; font-weight:700; cursor:pointer; font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 2px 0 #8b8b81;

}
.modal .btns .cancel:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 0 0 #8b8b81;}

  text-shadow:0 1px 0 rgba(0,0,0,.3);

.modal .btns .ok:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 0 0 var(--orange-edge);}

  box-shadow:0 2px 0 #8c2c1e;
  transition:transform .06s, box-shadow .06s;

.modal .btns .danger:active{transform:translateY(2px); box-shadow:0 0 0 #8c2c1e;}
.modal .sec{border-top:1px dashed #c2ccbc; margin-top:12px; padding-top:10px;}
.modal .sec p{font-size:11.5px; color:var(--ink-sub); margin:4px 0 8px; font-weight:600;}
/* ---------- トースト：ゲーム通知 ---------- */
#toast{position:fixed; left:50%; bottom:82px; transform:translateX(-50%) translateY(20px);
  background:linear-gradient(180deg,#2c3a31,#1a2620); color:#fff; border:1.5px solid #0d1712;
  padding:7px 15px; border-radius:8px; font-size:12.5px; font-weight:700; opacity:0; pointer-events:none; transition:all .25s; z-index:200; max-width:86vw;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 2px 0 #0a110d, 0 6px 12px rgba(0,0,0,.25);}

/* ================= ストレージ ================= */
const storage=(()=>{ let mem=null;
  try{ const t="__t__"; localStorage.setItem(t,"1"); localStorage.removeItem(t);
/* ★2026-08-24v 端末の保存がいっぱいだと localStorage.setItem は例外を投げる。
   受け止めていないと、そこで処理が止まり、利用者には「保存されたつもり」で
   中身だけが消える（いちばん怖い失敗）。受け止めて、理由を知らせる。 */
function nnSet(key, value){
  try{ localStorage.setItem(key, value); return true; }
  catch(err){
    try{ alert('端末の保存容量がいっぱいで保存できませんでした。\n'
      +'古い写真を削除するか、ホームの「設定」からデータを書き出してください。'); }catch(e){}
    return false;
  }
}
    return {get:()=>localStorage.getItem(STORE_KEY), set:v=>nnSet(STORE_KEY,v), persist:true};
  }catch(e){ document.getElementById("memBanner").classList.add("on");
    return {get:()=>mem, set:v=>{mem=v;}, persist:false}; }
})();
let items=[];
/* ★2026-08-24ag 「並びであること」だけでなく「1件ずつが箱であること」まで確かめる。
   [null,1] のような中身だと、そのあとで price を読んだところで止まる。 */
function nnRows(v){ return Array.isArray(v)? v.filter(r=>r&&typeof r==='object'&&!Array.isArray(r)) : null; }
function load(){ try{const raw=storage.get(); if(raw){const d=JSON.parse(raw);
  if(d&&typeof d==='object'){ const r=nnRows(d.items); if(r)items=r; }}}catch(e){items=[];} }

const normS=s=>String(s||"").normalize("NFKC").toLowerCase().replace(/[ァ-ン]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
const yen=n=>(n||n===0)?("¥"+Number(n).toLocaleString("ja-JP")+"-"):"—";

/* ================= 絞り込みチップ（現場記録帳と同方式） ================= */
const FILTERS=[
 {key:'c1',label:'大分類別',opts:()=>C1_LIST.map(k=>C1_SHORT[k]),val:v=>C1_LIST.find(k=>C1_SHORT[k]===v)},
 {key:'c2',label:'中分類別',opts:()=>{
    const c1=filterState.c1;
    const src=view==='cat'?CATALOG:items;
    return [...new Set(src.filter(o=>!c1||o.c1===c1).map(o=>o.c2))];
  }},
 {key:'pr',label:'生産区分',opts:()=>['標準品','受注生産品']},
 {key:'reg',label:'登録状態',opts:()=>view==='cat'?['登録済のみ','未登録のみ']:['単価未設定のみ','単価入力済のみ']},
 {key:'sort',label:'並び順',opts:()=>view==='cat'?['カタログ順','名前順']:['登録が新しい順','分類順','名前順','単価未設定を先に']},
];
const filterState={};
function buildChips(){
  const wrap=document.getElementById('chips'); wrap.innerHTML='';
  FILTERS.forEach(f=>{
    const c=document.createElement('div'); c.className='chip';
    const b=document.createElement('button'); b.textContent=f.label;
    if(filterState[f.key])b.classList.add('active');
    const m=document.createElement('div'); m.className='menu';
    b.onclick=e=>{e.stopPropagation(); document.querySelectorAll('.menu').forEach(x=>{if(x!==m)x.classList.remove('open');}); rebuildMenu(f); m.classList.toggle('open');};
    c.append(b,m); wrap.append(c);
    f._btn=b; f._menu=m;
  });
}
function rebuildMenu(f){
  const m=f._menu; m.innerHTML='';
  const clear=document.createElement('div'); clear.textContent='（解除）';
  clear.onclick=()=>{delete filterState[f.key]; f._btn.classList.remove('active'); render();};
  m.append(clear);
  f.opts().forEach(v=>{
    const d=document.createElement('div'); d.textContent=v;
    const real=f.val?f.val(v):v;
    if(filterState[f.key]===real)d.classList.add('sel');
    d.onclick=()=>{filterState[f.key]=real; f._btn.classList.add('active'); render();};
    m.append(d);
  });
}
document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open')));

/* ================= フィルタ処理 ================= */
function matchQ(o){
  const q=document.getElementById('q').value.trim();
  if(!q)return true;
  return normS([o.n,o.s,o.sp,o.c2,o.maker||'',o.j||''].join(' ')).includes(normS(q));
}
function passCat(c,reg){
  if(filterState.c1&&c.c1!==filterState.c1)return false;
  if(filterState.c2&&c.c2!==filterState.c2)return false;
  if(filterState.pr&&c.pr!==filterState.pr)return false;
  if(filterState.reg==='登録済のみ'&&!reg[c.i])return false;
  if(filterState.reg==='未登録のみ'&&reg[c.i])return false;
  return matchQ(c);
}
function passMine(m){
  if(filterState.c1&&m.c1!==filterState.c1)return false;
  if(filterState.c2&&m.c2!==filterState.c2)return false;
  if(filterState.pr&&m.pr!==filterState.pr)return false;
  if(filterState.reg==='単価未設定のみ'&&m.price>0)return false;
  if(filterState.reg==='単価入力済のみ'&&!(m.price>0))return false;
  return matchQ(m);
}

  document.getElementById('cntCat').textContent=(typeof makerReady==='function'&&!makerReady())?0:CATALOG.length;

  refreshStats();
  const list=document.getElementById('list'); list.innerHTML='';
  if(view==='cat')renderCatList(list); else renderMineList(list);
  if(window.nnCountBar)nnCountBar();      /* 一覧の上に「表示◯件／全◯品」 */

}

function renderCatList(list){
  if(!makerReady()){ list.innerHTML=makerPlaceholder(); return; }
  const reg=regMap();
  let arr=CATALOG.filter(c=>passCat(c,reg));
  if(filterState.sort==='名前順')arr=[...arr].sort((a,b)=>a.n.localeCompare(b.n,'ja'));
  if(!arr.length){list.innerHTML='<div class="empty">該当する材料がありません。検索条件を変えてみてください。</div>';return;}
  // 中分類→シリーズでグループ化（カタログ順維持）
  const groups=[],gmap={};
  arr.forEach(c=>{
    const gk=c.c1+'|'+c.c2;
    if(!gmap[gk]){gmap[gk]={c1:c.c1,c2:c.c2,series:[],smap:{}};groups.push(gmap[gk]);}
    const g=gmap[gk];
    if(!g.smap[c.s]){g.smap[c.s]={name:c.s,items:[]};g.series.push(g.smap[c.s]);}
    g.smap[c.s].items.push(c);
  });
  const frag=document.createDocumentFragment(); frag.append(nnListHead());
  groups.forEach(g=>{
    const total=g.series.reduce((s,x)=>s+x.items.length,0);
    const gh=document.createElement('div'); gh.className='ghead';
    gh.innerHTML=`<span class="badge" style="background:${C1_COLOR[g.c1]}">${esc(C1_SHORT[g.c1])}</span>${esc(g.c2)}<small>${total}品</small>`;
    frag.append(gh);
    g.series.forEach(s=>{
      if(s.items.length===1){frag.append(catRow(s.items[0],reg,false));}

function nnSrc(c){ const pg=String((c&&c.pg)||''); if(!pg||pg==='―') return null;

/* ★2026-11-23zs 一覧の単価のマスを押すと、その場で単価を入れられる（本人「単価は見出し欄で変更できるようにして」）。
   ・登録済みの材料＝単価だけ書きかえて保存。未登録の材料＝金額を入れたら、その金額で登録（詳細の「この材料を登録する」と同じ newItemFromCatalog）。空のままなら何もしない。
   ・Enter か、欄の外を押すと決定。Esc でやめる。全角の数字も読む（§1378）。日本語入力の変換確定の Enter では決めない。
   ・保存のあと一覧を描き直すが、スクロールの位置は戻す（下のほうで直すと一番上へ飛ぶため） */
window.nnPriceEdit=function(ev,kind,id){ ev.stopPropagation(); const cell=ev.currentTarget; if(cell.querySelector('input')) return;
  const find=()=>kind==='item'?items.find(x=>x.id===id):items.find(x=>x.catalogId===id);
  const m=find(), c=kind==='cat'?catById[id]:null, ou=(m&&m.ou)||(c&&c.ou)||'';
  cell.innerHTML='<span class="peWrap">¥<input class="peIn" inputmode="numeric" autocomplete="off" value="'+(m&&m.price>0?m.price:'')+'"><small>／'+esc(ou)+'</small></span>';
  const inp=cell.querySelector('input'); inp.focus(); inp.select(); let done=false;
  const redraw=()=>{ const L=document.getElementById('list'), st=L?L.scrollTop:0; render(); if(L) L.scrollTop=st; };
  const commit=ok=>{ if(done) return; done=true;
    if(ok){ const p=parseFloat(String(inp.value).normalize('NFKC').replace(/[^\d.]/g,'')), price=p>0?Math.round(p):null, mm=find();
      if(mm){ if((mm.price||null)!==price){ mm.price=price; mm.updatedAt=Date.now(); if(Array.isArray(mm.prices)){ const a=nnPrices(mm), s=a.find(x=>x.std); if(s&&price) s.at=nnToday(); nnPricesSet(mm,a); } save(); toast(price?('単価を保存しました：'+mm.n+'　'+yen(price)+'／'+mm.ou):('単価を空にしました：'+mm.n)); } }
      else if(price&&c){ const it=newItemFromCatalog(c); it.price=price; items.push(it); save(); toast('登録しました：'+c.n+'　'+yen(price)+'／'+c.ou); } }
    redraw(); };
  inp.addEventListener('click',e=>e.stopPropagation());
  inp.addEventListener('keydown',e=>{ if(e.isComposing||e.keyCode===229) return; if(e.key==='Enter'){ e.preventDefault(); commit(true); } else if(e.key==='Escape'){ commit(false); } });
  inp.addEventListener('blur',()=>commit(true)); };
/* ★2026-11-23zt 仕入先ごとの単価（本人の課題「商社Aと商社Bで仕入れ値が違う」→「仕入れ単価作って」）。
   ・材料は1行のまま。材料の中に prices＝[{sup:仕入先, price:単価（荷姿あたり）, at:いつの値か(YYYY-MM-DD), std:標準か}] を持つ。標準は1つ。
   ・m.price はいつも「標準の単価」（＝今までと同じ意味）。仕様登録・図面積算・発注など、ほかの所は m.price だけを見ていて、そのまま動く。
   ・古い保存（prices が無い）は、m.price を「仕入先の名前なし・標準」の1行として読む。読むときに形を整える（配列でない・金額が数でない・標準が2つ／無い、を直す）。
   ・m.price をほかの所（詳細の単価の欄・一覧のその場編集・取り込み）が変えたら、m.price のほうを正として標準の行を合わせる。 */
function nnToday(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function nnPrices(m){ if(!m) return [];
  let a=(Array.isArray(m.prices)?m.prices:[]).filter(p=>p&&typeof p==='object'&&!Array.isArray(p))
    .map(p=>({sup:String(p.sup==null?'':p.sup).trim(), price:(+p.price>0?Math.round(+p.price):null), at:/^\d{4}-\d{2}-\d{2}$/.test(String(p.at||''))?String(p.at):'', std:!!p.std, tmp:!!p.tmp}))
    .filter(p=>p.price||p.sup||p.tmp);
  const mp=(+m.price>0)?Math.round(+m.price):null;
  let seen=false; a.forEach(p=>{ if(p.std){ if(seen) p.std=false; seen=true; } });
  if(!seen){ if(a.length){ (a.find(p=>p.price===mp)||a[0]).std=true; } else if(mp){ a=[{sup:'',price:mp,at:'',std:true,tmp:false}]; } }
  let s=a.find(p=>p.std);
  /* ★zu 標準の行に金額が無いのに、ほかの行に m.price と同じ金額があるなら、そちらが標準（壊れた保存で、金額の無い行に m.price を書きこんでしまわない） */
  if(s&&!s.price&&mp){ const t=a.find(p=>p.price===mp); if(t){ s.std=false; t.std=true; s=t; } }
  if(s&&s.price!==mp){ s.price=mp; }   /* m.price が正 */
  return a; }
function nnPricesSet(m,a){ a=a.filter(p=>p.price||p.sup||p.tmp);
  if(a.length&&!a.some(p=>p.std)) (a.find(p=>p.price)||a[0]).std=true;
  const s=a.find(p=>p.std); m.price=(s&&s.price)?s.price:null;
  m.prices=a.map(p=>{ const o={sup:p.sup,price:p.price,at:p.at,std:!!p.std}; if(p.tmp) o.tmp=true; return o; }); m.updatedAt=Date.now(); }

window.nnSup=function(act,i,val){
  const m=sel&&(sel.type==='item'?items.find(x=>x.id===sel.id):items.find(x=>x.catalogId===sel.id)); if(!m) return;
  const a=nnPrices(m), p=a[i];
  if(act==='add'){ a.push({sup:'',price:null,at:nnToday(),std:a.length===0,tmp:true}); }
  else if(!p){ return; }
  else if(act==='std'){ a.forEach((x,k)=>x.std=(k===i)); }
  else if(act==='sup'){ p.sup=String(val||'').trim().slice(0,40); if(p.sup||p.price) p.tmp=false; }
  else if(act==='price'){ const n=parseFloat(String(val==null?'':val).normalize('NFKC').replace(/[^\d.]/g,'')); const np=n>0?Math.round(n):null;
    if(np!==p.price){ p.price=np; p.at=nnToday(); } if(p.sup||p.price) p.tmp=false; else p.tmp=true; }
  else if(act==='at'){ p.at=/^\d{4}-\d{2}-\d{2}$/.test(String(val||''))?String(val):''; }
  else if(act==='del'){ const was=p.std; a.splice(i,1); if(was&&a.length){ a.forEach(x=>x.std=false); (a.find(x=>x.price)||a[0]).std=true; } }
  nnPricesSet(m,a); save();
  const L=document.getElementById('list'), st=L?L.scrollTop:0, D=document.getElementById('detail'), sd=D?D.scrollTop:0; render(); if(L) L.scrollTop=st; const D2=document.getElementById('detail'); if(D2) D2.scrollTop=sd;
  if(act==='add'){ const r=document.querySelectorAll('#d_suppanel .suprow'); const last=r[r.length-1]; const f=last&&last.querySelector('.supn'); if(f) f.focus(); }
  if(act==='std'){ const s=a.find(x=>x.std); toast('標準の単価を変えました：'+m.n+(s&&s.price?'　'+yen(s.price)+'／'+m.ou:'')); } };

    try{
      const c=ctx(), t=c.currentTime;
      // やわらかい水滴風の「ぽん」：低めのサイン波2音（耳に優しい音量）
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(523,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.06,t+0.010);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.15);
      // 軽く上に抜ける倍音
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(784,t);
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.03,t+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
      o2.connect(g2).connect(c.destination);
      o2.start(t+0.005); o2.stop(t+0.12);
    }catch(e){}
  }

  /* ---------- タッチ発光 ---------- */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    /* ★2026-08-13j パソコンの表示倍率（zoom）で割ること。
       clientX/Y は倍率を**かけた後**のpx、style.left/top は倍率を**かける前**のpx。
       割らないと、大きいモニターほど発光が右下の見当違いな場所に出る（§61の落とし穴）。 */
    const _z=window.nnPZ||1;
    el.style.left=(x/_z)+'px'; el.style.top=(y/_z)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 600);
  }

  /* ---------- イベント委譲 ----------
     発光＝画面のどこを触っても出す（触った場所のフィードバック）
     音　＝押せる要素（ボタン・ナビ・チップ・行）に当たったときだけ鳴らす */
  const PRESSABLE='button, .chip>button, .mk, .mrow, .tabs button, #viewtabs button, .btn-ok, .btn-ghost, .sortbtn, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    /* ★下部ナビは専用の音（nav_move.wav）を鳴らすので、ここでは鳴らさない。
       [onclick] にナビも含まれてしまい、1回のタップで2種類の音が重なって
       「ココンコン」と聞こえていた原因。 */
    const tc=(e.target&&e.target.closest)?e.target:null;
    const hit=(!tc||tc.closest('nav .ni'))?null:tc.closest(PRESSABLE);
    if(hit && !hit.disabled && !hit.classList.contains('soon')){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();

/* ================= 左枠リサイザー ================= */
(function(){
  const rz=document.getElementById('resizer'), list=document.getElementById('list');
  /* ★2026-09-30p ドラッグを始めた瞬間に幅が飛ぶ不具合（本人の指摘・§569）。
     以前は「マウスの画面上の位置（clientX）」をそのまま幅にしていた。一覧は左のナビ（約86px）の右から
     始まるので、つかんだ瞬間にナビの幅だけ太く／細くなった。さらに表示倍率（nnPZ）と innerWidth を混ぜていた（§61・§319の罠）。
     → つかんだときの幅（倍率をかける前の offsetWidth）を覚えて、そこからマウスが動いた量÷倍率だけ変える。上限は親の幅の68%。 */
  let drag=null;
  rz.addEventListener('mousedown',e=>{ drag={x:e.clientX, w:list.offsetWidth, z:(window.nnPZ||1)}; rz.classList.add('on'); e.preventDefault(); });
  addEventListener('mousemove',e=>{ if(!drag)return;
    const par=list.parentElement, max=(par?par.clientWidth:document.documentElement.clientWidth)*0.68;
    const w=Math.round(Math.min(Math.max(drag.w+(e.clientX-drag.x)/drag.z,300),Math.max(300,max)));
    list.style.flex='0 0 '+w+'px'; list.style.maxWidth=w+'px';});
  addEventListener('mouseup',()=>{ drag=null; rz.classList.remove('on');});
})();

<script>
/* ============================================================
   スマホ表示モード切替
   ・一覧モード（既定）：デスクトップレイアウトを縮小して全体表示。
     ピンチ（指を広げる）でいつでも拡大可能。
   ・モバイル表示：従来のレスポンシブ表示。
   右下の丸ボタンで切替。設定は端末に記憶され全ページ共通。
   ============================================================ */
(function(){
  const KEY='nn_view_mode', VW=980;
  const vp=document.querySelector('meta[name="viewport"]');
  const phone=Math.min(screen.width,screen.height)<700;
  function getMode(){ try{return localStorage.getItem(KEY)||'ichiran';}catch(e){return 'ichiran';} }
  function apply(m){
    /* ★2026-09-25e いまの表示モードを <html> に出す（1.8倍の拡大は「一覧表示＝幅980を縮める」ときだけにするため） */
    document.documentElement.setAttribute('data-nnvm', m==='ichiran'?'ichiran':'mobile');
    if(m==='ichiran'){ vp.setAttribute('content','width='+VW+', user-scalable=yes, viewport-fit=cover'); }
    else{ vp.setAttribute('content','width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover'); }
    try{localStorage.setItem(KEY,m);}catch(e){}
    const b=document.getElementById('vmToggle');
    if(b){
      b.textContent=(m==='ichiran'?'📱 モバイル表示':'🗂 一覧表示');
      /* 一覧モードは全体が縮小されるためボタンは大きめに作る */
      b.style.fontSize=(m==='ichiran'?'26px':'13px');
      b.style.padding=(m==='ichiran'?'14px 22px':'8px 14px');
      b.style.bottom=(m==='ichiran'?'120px':'72px');
    }
  }
  window.nnToggleView=function(){ apply(getMode()==='ichiran'?'mobile':'ichiran'); };
  if(!phone){ vp.setAttribute('content','width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover'); return; }
  apply(getMode());
  /* 「モバイル表示」切替ボタンは廃止（画面上の残像文字を解消） */
})();
</script>

<script>
/* 一覧モードは画面を980px幅に縮小表示するため、そのままだと下部ナビのアイコンだけが

(function(){
  const VW=980;
  function navScale(){
    const st=(function(){try{return localStorage.getItem('nn_view_mode')||'ichiran';}catch(e){return 'ichiran';}})();
    const phone=Math.min(screen.width,screen.height)<700;
    if(!phone||st!=='ichiran'){
      document.documentElement.style.removeProperty('--navicon');
      document.documentElement.style.removeProperty('--navpad'); return;
    }
    const sw=screen.width||393, sh=screen.height||852;
    const land=innerWidth>innerHeight;
    const dev=land?Math.max(sw,sh):Math.min(sw,sh);
    document.documentElement.setAttribute('data-nnland',land?'1':'0');
    const base=dev>760?46:40;
    const k=Math.max(1,VW/dev);
    document.documentElement.style.setProperty('--navicon',(base*k).toFixed(1)+'px');
    document.documentElement.style.setProperty('--navpad',(2*k).toFixed(1)+'px');
    document.documentElement.style.setProperty('--navgap',((land?8:7)*k).toFixed(1)+'px');
  }
  navScale();
  addEventListener('resize',navScale);
  addEventListener('orientationchange',()=>setTimeout(navScale,300));
  addEventListener('DOMContentLoaded',navScale);
})();

<script>
/* ページ移動を通信ゼロで一瞬にする（サービスワーカーで全ページを端末に常駐させる） */
/* ============ 版チェック（2026-07-28） ============
   端末には速さのためページを保存しているので、こちらで直しても
   古いものが出続けることがある。そこで ver.txt（数バイト）だけを
   毎回見に行き、公開版と違っていたら保存分を捨てて1回だけ読み直す。
   ★公開のたびに ver.txt と、下の NN_VER を同じ文字に更新すること。 */
const NN_VER='2026-11-23zzi';
/* ============ 表示にかかった時間の記録（原因調査用・2026-07-28） ============
   スマホの実機でどこに時間がかかっているかを数字で出す。
   ・net  ＝ページを要求してから最初の返事が来るまで（通信の待ち）
   ・recv ＝中身を受け取り終わるまで
   ・build＝受け取ってから組み立て終わるまで（解析・JS実行）
   ・paint＝画面に中身が出たとき
   結果はホーム画面の左上に出る。原因が分かったらこの仕組みごと外す。 */
addEventListener('load',()=>{setTimeout(()=>{
  try{
    const n=performance.getEntriesByType('navigation')[0]; if(!n)return;
    const fcp=performance.getEntriesByType('paint').filter(p=>p.name==='first-contentful-paint')[0];
    const rs=performance.getEntriesByType('resource');
    let slow=null, rkb=0, fontMs=0, fontN=0;
    rs.forEach(r=>{ rkb+=(r.transferSize||0);
      if(!slow||r.duration>slow.duration)slow=r;
      if(/fonts\.(googleapis|gstatic)/.test(r.name)){fontN++; fontMs=Math.max(fontMs, Math.round(r.responseEnd));}});
    const rec={p:(location.pathname.split('/').pop()||'index').replace('.html','').slice(0,8),
      net:Math.round(n.responseStart), recv:Math.round(n.responseEnd),
      build:Math.round(n.domContentLoadedEventEnd), paint:fcp?Math.round(fcp.startTime):-1,
      load:Math.round(n.loadEventEnd), kb:Math.round((n.transferSize||0)/1024),
      res:rs.length, rkb:Math.round(rkb/1024), fn:fontN, fms:fontMs,
      sl:slow?((slow.name.split('/').pop()||'').slice(0,14)+':'+Math.round(slow.duration)):''};
    const a=JSON.parse(sessionStorage.getItem('nnPerf')||'[]'); a.push(rec);
    sessionStorage.setItem('nnPerf',JSON.stringify(a.slice(-7)));
  }catch(_){}
},400);});
const NN_PAGES=['./index.html','./kirokucho_demo.html','./zumen_sekisan.html','./genba_map_v36.html','./hacchu.html',
  './kokkosho.html','./camera.html','./library.html','./shiyo_toroku.html','./zairyo_toroku.html','./yougo.html','./common.css'];
window.nnVerNow=NN_VER;
(async function(){
  try{
    const r=await fetch('./ver.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const v=(await r.text()).trim();
    window.nnVerNew=v;
    if(!v || v===NN_VER)return;
    /* ★2026-07-28 修正：以前は保存分を消して読み直すだけだったが、
       Safari自身が持っている一時保存（HTTPキャッシュ）は消えないため、
       読み直しても古いページが出続けて更新が止まることがあった。
       全ページを cache:'reload' で取り直してから読み直す。 */
    const n=parseInt(sessionStorage.getItem('nnUpdN_'+v)||'0',10);
    if(n>=2)return;                                   /* 失敗が続いたら止める安全弁 */
    sessionStorage.setItem('nnUpdN_'+v,String(n+1));
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    /* ★2026-10-26zk 本人「最初に立ち上げたとき、メインボタンを押してから開くまでかなり重い」→ 前は 11ページ全部（約6MB）を取り直してから読み直していた。
       今開いているページと common.css だけ取り直す（ほかのページは、開いたときに同じ仕組みでそれぞれ新しくなる） */
    await Promise.all([location.pathname.split('/').pop()||'index.html','common.css'].map(u=>fetch('./'+u,{cache:'reload'}).catch(()=>{})));
    location.reload();
  }catch(_){}
})();
</script>
<script>
/* ★2026-07-28：更新が端末に届かない問題への対策
   ・毎回「新しい版が出ていないか」を確認する（r.update()）
   ・新しい版に切り替わったら、その場で1回だけ自動で読み込み直す
     （＝「再読み込み2回」が不要になり、直したことが必ず反映される） */
/* ★2026-07-28 検証：サービスワーカーを一時的に止める
   ホーム(37KB)も現場記録帳(300KB)も、どちらもタップから約0.9秒。
   中身の重さが10倍近く違うのに時間が同じ＝ページの組み立てではなく、
   移動のたびにかかる「決まった待ち時間」がある、ということ。
   iPhoneのSafariでは、この保存の仕組み（サービスワーカー）が
   眠っていると、移動のたびに起こす時間が数百ミリ秒かかることが知られている。
   → いったん止めて、これが原因かを確かめる。
   NN_USE_SW を true に戻せば、オフライン対応ごと元に戻せる。 */
const NN_USE_SW=false;
if('serviceWorker' in navigator){
  if(NN_USE_SW){
    let nnReloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(nnReloaded)return; nnReloaded=true; location.reload();
    });
    addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(r=>{
        try{r.update();}catch(_){}
        if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage('nn-precache');
      }).catch(()=>{});
    });
  }else{
    /* すでに入っている分を取り除き、保存分も消す（1回だけ読み直す） */
    addEventListener('load',async()=>{
      try{
        const rs=await navigator.serviceWorker.getRegistrations();
        if(rs.length){
          await Promise.all(rs.map(r=>r.unregister()));
          if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));}
          if(!sessionStorage.getItem('nnSwOff')){ sessionStorage.setItem('nnSwOff','1'); location.reload(); }
        }
      }catch(_){}
    });
  }
}
</script>
<script>
/* ============ ナビの操作音（2026-07-28 作り直し） ============
   ★以前は <audio> を2個ずつ用意して音源ファイル(nav_move.wav)を
     読ませていたが、iPhoneでは音声部品の準備が重く、しかも
     いつ終わるか読めないため、画面が出るまでの待ち時間に影響していた。
     → 音源ファイルをやめ、その場で音を合成する方式（Web Audio）に変更。
       ファイル読み込みゼロ・部品ゼロ・音は今までと同じ「やわらかい1音」。
   ============================================================ */
(function(){
  /* ★2026-07-28 音が出たり出なかったりした原因
     ①音の装置(AudioContext)を「ナビを最初に押したとき」に作っていた。
       iPhoneでは作った直後は停止状態で、動き出すまでに少し時間がかかるため、
       その1回目の音が鳴らないことがあった。
     ②画面移動が0.09秒後に始まるので、音が長いと途中で切れていた。
     → 装置は「画面のどこかを最初に触った時点」で作って動かしておく。
       音は0.07秒に短くして、移動が始まる前に鳴り終わるようにする。 */
  let AC=null, last=0;
  function make(){
    if(AC)return AC;
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    try{ AC=new C(); }catch(_){ return null; }
    /* 無音を1粒だけ鳴らして、iPhoneの音の仕組みを起こしておく */
    try{ const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
         s.buffer=b; s.connect(AC.destination); s.start(0); }catch(_){}
    return AC;
  }
  /* ★2026-08-26b 起こしても動かないままの装置がある（電話・他アプリへの切り替えで
     iPhoneが音の仕組みごと止めることがあり、resume が効かない）。
     1秒たっても動かなければ、利用者の操作の中で装置を作り直す
     （作り直しは操作の中なら必ず動く＝§89「操作そのものの中で呼ぶ」と同じ決まり）。 */
  let deadSince=0;
  function ensureRunning(){
    let c=make(); if(!c)return null;
    if(c.state!=='running'){
      try{ c.resume(); }catch(_){}
      if(!deadSince) deadSince=Date.now();
      else if(Date.now()-deadSince>1000){
        try{ c.close(); }catch(_){}
        AC=null; deadSince=0; c=make();
        if(c && c.state!=='running'){ try{ c.resume(); }catch(_){} }
      }
    } else deadSince=0;
    return c;
  }
  function unlock(){ ensureRunning(); }
  addEventListener('pointerdown',unlock,{passive:true,capture:true});
  addEventListener('touchstart',unlock,{passive:true,capture:true});
  /* 画面が戻ってきたときは、止まっている音の装置を起こし直す
     （iPhoneは他のアプリに切り替えると止めることがある） */
  function wake(){ const c=AC; if(c && c.state!=='running'){ try{c.resume();}catch(_){} } }
  addEventListener('pageshow', wake);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) wake(); });

  /* 実際に音を出す部分。ここは「装置が動いている」ときだけ呼ぶ */
  /* ★2026-10-27f 本人「もっとシンプルな音」→ ナビもボタンも同じ短い1音「ピッ」にそろえた */
  function beep(c){
    const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(1047,t);       /* ドの音（高め）を1つだけ */
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3,t+0.003);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.055);
  }
  /* ★2026-10-27f ボタンの音も、この「起こす・作り直す」対策入りの装置で鳴らす。
     以前はボタンだけ対策なしの別の装置で、最初の1回やアプリ切り替えの後に鳴らなかった。
     止まった装置への予約は動き出した瞬間に鳴る（§220）ので、状態を問わず予約する。 */
  window.nnAC=function(){ return ensureRunning(); };
  window.nnTapBeep=function(){ try{ const c=ensureRunning(); if(c) beep(c); }catch(_){} };

  /* ★2026-07-31 「鳴ったり鳴らなかったり」の直し方
     iPhoneは、ページを開いた直後の音の装置が「止まった状態」で始まる。
     動き出す（resume）のは少し後なので、押してすぐ画面が変わると
     音が鳴る前に前のページが消えてしまう＝無音になっていた。
     そこで
       ・鳴らせたかどうかを返す（true＝すぐ鳴った）
       ・すぐ鳴らせなかったときは、動き出したら鳴らす（nnSoundReady で待てる）
     ようにして、ナビ側が「音が出るのを待ってから画面を移る」ようにした。 */
  window.nnSoundReady=null;
  window.nnMoveSound=function(){
    const now=Date.now(); if(now-last<160)return true; last=now;   /* 連続再生を抑える */
    try{
      const c=ensureRunning(); if(!c)return true;
      if(c.state==='running'){ beep(c); return true; }
      /* まだ動いていない：起こしてから鳴らす。ナビ側はこれを待てる */
      window.nnSoundReady=new Promise(function(res){
        let done=false;
        const fin=function(){ if(done)return; done=true; res(); };
        /* ★2026-08-26b 「起きてから鳴らす」だと、起きるのが遅い回は画面が変わって
           鳴らずじまいだった。止まった装置への予約は動き出した瞬間に鳴るので、
           先に鳴る予約だけ入れておく（＝鳴ったり鳴らなかったりの残りを解消）。 */
        try{ beep(c); }catch(_){}
        try{ const p=c.resume(); if(p&&p.then) p.then(fin, fin); else fin(); }catch(_){ fin(); }
        setTimeout(fin, 120);      /* 起きなくても待たせすぎない */
      });
      return false;
    }catch(_){ return true; }
  };
})();
</script>
<script>
/* ============ ナビ：指を触れたまま移動できる操作（2026-07-28 改） ============
   ・指を置いた瞬間にアイコンが光って音が鳴る
   ・そのまま 0.09秒 指が止まっていれば、離すのを待たずに移動する（＝速い）
   ・押したまま横へなぞると指の下のアイコンが反応し、離した先へ移動する
   ・アイコンの外で離せば移動しない（やめられる）
   ============================================================ */
(function(){
  const nav=document.getElementById('nav')||document.querySelector('nav');
  if(!nav)return;
  let dragging=false, cur=null;
  const itemAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('nav .ni'):null; };
  let lastSnd=0;
  function focus(ni){
    if(ni===cur)return;
    if(!ni)return;                     /* アイコンの隙間に指がかかっても、直前の選択を保つ
                                          （指のわずかな揺れで音が連発するのを防ぐ） */
    if(cur)cur.classList.remove('press');
    cur=ni; cur.classList.add('press');
    /* 音を鳴らす。すぐ鳴らせなかったときは、移動を少しだけ待つ（下の go を参照） */
    sndNow=true;
    if(window.nnMoveSound)try{ sndNow=(nnMoveSound()!==false); }catch(_){}
    /* ★先読みの fetch は削除（2026-07-28）。移動処理と取り合って遅くなっていた。 */
  }
  /* ★ここが「遅い」の正体だった（2026-07-28 画面録画の実測で判明）
     以前は「指を離したとき」に初めて移動していた。画面録画を1コマずつ調べると、
     アイコンが光ってから画面が変わるまで約0.9秒、その間まったく何も起きていない。
     ＝ページの読み込みが遅いのではなく、指を離すまで移動を始めていなかった。
     そこで「指を置いて 0.09秒たっても動かさなければ、離すのを待たずに移動する」
     方式にした。なぞって選び直したい場合（指を動かした場合）は今までどおり、
     指を離した先のアイコンへ移動する。 */
  /* ★2026-10-28c 長押しで説明のテロップ（nn_navtip.js）を出すため、移動は「指を離したとき」に戻した。
     光と音は今までどおり指が触れた瞬間（focus）＝押した反応はすぐ見える。0.45秒押し続けたら移動せずテロップ */
  const TIP_MS=450;          /* この時間だけ押し続けたら「長押し」＝移動せず説明を流す */
  const MOVE_PX=10;          /* この距離より動いたら「なぞり操作」とみなす */
  let goTm=0, downPt=null, gone=false, tipOn=false;
  let sndNow=true;
  function go(t){
    if(gone)return;
    if(!t||t.classList.contains('on'))return;
    const m=(t.getAttribute('onclick')||'').match(/navGo\('([^']*)'\s*,\s*'([^']*)'\)/);
    if(!(m&&typeof navGo==='function'))return;
    gone=true;
    /* ★音がすぐ鳴ったときは今までどおり即移動（速さは変えない）。
       鳴らなかったときだけ、音が出るのを最大0.16秒待ってから移動する。 */
    if(sndNow || !window.nnSoundReady){ navGo(m[1],m[2]); return; }
    let moved=false;
    const jump=function(){ if(moved)return; moved=true; navGo(m[1],m[2]); };
    try{ window.nnSoundReady.then(function(){ setTimeout(jump, 30); }); }catch(_){}
    setTimeout(jump, 160);
  }
  function cancelHold(){ if(goTm){clearTimeout(goTm); goTm=0;} }
  nav.addEventListener('pointerdown',e=>{
    const ni=e.target.closest&&e.target.closest('.ni'); if(!ni)return;
    dragging=true; cur=null; gone=false; downPt=[e.clientX,e.clientY]; focus(ni);
    try{nav.setPointerCapture(e.pointerId);}catch(_){}
    cancelHold(); tipOn=false;
    goTm=setTimeout(()=>{ goTm=0; tipOn=true; if(window.nnNavTip&&cur) nnNavTip.show(cur); }, TIP_MS);
  });
  nav.addEventListener('pointermove',e=>{
    if(!dragging)return;
    if(downPt && Math.abs(e.clientX-downPt[0])+Math.abs(e.clientY-downPt[1])>MOVE_PX) cancelHold();
    focus(itemAt(e.clientX,e.clientY));
    if(tipOn&&window.nnNavTip&&cur) nnNavTip.show(cur);   /* 押したままなぞると、指の下のアイコンの説明に替わる */
  });
  function finish(e){
    if(!dragging)return;
    dragging=false; cancelHold();
    const t=cur; if(cur){cur.classList.remove('press'); cur=null;}
    if(tipOn){ tipOn=false; if(window.nnNavTip) nnNavTip.release(); return; }   /* 長押しのあとは移動しない */
    go(t);
  }
  nav.addEventListener('pointerup',finish);
  nav.addEventListener('pointercancel',()=>{dragging=false; cancelHold(); if(tipOn){ tipOn=false; if(window.nnNavTip) nnNavTip.release(); } if(cur){cur.classList.remove('press'); cur=null;}});
  /* 上の処理で移動するので、通常のクリックは止める（二重に移動しないように） */
  nav.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); },true);
})();
</script>

<script id="nn-btmsafe">
/* ============================================================
   たて画面で、下部ナビの下側が画面の外に切れるのを防ぐ（2026-07-29）
   ------------------------------------------------------------
   このページは「一覧モード」のとき、画面を幅980で組み立ててから
   端末の幅に合わせて縮めて表示している。
   iPhoneを「たて」に持つと 393px 幅なので、縮小率は約0.40。
   このとき、画面下端のホームバー用に確保している余白も同じだけ
   縮んでしまい、実際には5〜6px程度しか空かない。
   その結果、ナビの下の段（カメラ・ライブラリなど）の文字が
   ホームバーに重なって「下が見切れている」状態になっていた。
   ここでは、縮小率のぶんだけ余白を大きくして渡し直す。
   ・縮めずに表示している画面（倍率1）では 0 なので、見た目は今まで通り。
   ・レイアウト（並び方・大きさ）は一切変えない。下端の余白だけを直す。
   ============================================================ */
(function(){
  var MIN_REAL = 16;   /* 実際の画面で確保したい下余白（px） */
  /* ★★2026-09-07e 指で拡大しても画面が崩れないように「組み立ての大きさ」で測る（§319）。
     iPhoneは指で拡大すると innerWidth・innerHeight まで**いま見えている範囲**の大きさに
     変わる（パソコンのブラウザは変わらない）。それをそのまま画面の高さ・縮小率に使うと、
     拡大した分だけ中身が短く・小さくなり、下に何も無い帯が出る＝「ズームすると見切れる」。
     documentElement の clientWidth/clientHeight は**拡大しても変わらない**ので、こちらで測る。 */
  function LW(){ var d=document.documentElement; return (d&&d.clientWidth)||window.innerWidth; }
  function LH(){ var d=document.documentElement; return (d&&d.clientHeight)||window.innerHeight; }
  function fit(){
    var pr = true;
    try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = LH() > LW(); }
    var dev = pr ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    var k = (dev > 0) ? (LW() / dev) : 1;
    /* 縮めて表示しているときだけ効かせる（等倍のときは 0＝今まで通り） */
    var v = (k >= 1.5) ? Math.round(MIN_REAL * k) : 0;
    document.documentElement.style.setProperty('--nnsabmin', v + 'px');
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
  addEventListener('load', fit, {once:true});
})();
</script>
<style id="nn-fillh">

   画面のいちばん下まで使い切る（2026-07-29）

   これまでアプリの高さは 100dvh（＝画面の高さ）で指定していたが、

   下の script で「実際に見えている高さ」を測って --nnvh に入れ、

<script id="nn-fillh-js">
/* ============================================================
   画面のいちばん下まで使い切る（2026-07-29）
   ・--nnvh ＝ 実際に見えている画面の高さ
   ・表示中の画面（一覧・ダッシュボード等）の下に余りがあれば、そのぶん伸ばす
   　（すき間があるときだけ動くので、余りが無ければ何もしない）
   ============================================================ */
(function(){
  var VIEWS = null;
  /* ホーム画面のアイコンから起動しているか（＝全画面のアプリとして開いているか） */
  function isStandalone(){
    try{
      if(navigator.standalone === true) return true;
      return matchMedia('(display-mode: standalone)').matches
          || matchMedia('(display-mode: fullscreen)').matches;
    }catch(e){ return false; }
  }
  /* 画面のいちばん下に貼っておく、見えない1pxの目印。
     ★iPhoneをたてに持つと、端末が申告してくる「画面の高さ」が
       実際に見えている高さより小さいことがある（このページのように
       画面を縮めて表示していると起きる）。その申告値をそのまま使うと、
       画面の下のほうに何も置かれない帯（すき間）が残ってしまう。
       目印は画面の下端に貼り付いているので、その位置を測れば
       「本当の下端」が分かる。 */
  var probe = null;
  function probeBottom(){
    if(!probe || !probe.parentNode){
      probe = document.createElement('div');
      probe.id = 'nnBtmProbe';
      probe.setAttribute('style','position:fixed;left:0;bottom:0;width:1px;height:1px;'
        + 'pointer-events:none;opacity:0;z-index:-1;');
      (document.body || document.documentElement).appendChild(probe);
    }
    return probe.getBoundingClientRect().bottom;
  }
  /* ★★2026-09-07e 指で拡大しても画面が崩れないように「組み立ての大きさ」で測る（§319）。
     iPhoneは指で拡大すると innerWidth・innerHeight まで**いま見えている範囲**の大きさに
     変わる（パソコンのブラウザは変わらない）。それをそのまま画面の高さ・縮小率に使うと、
     拡大した分だけ中身が短く・小さくなり、下に何も無い帯が出る＝「ズームすると見切れる」。
     documentElement の clientWidth/clientHeight は**拡大しても変わらない**ので、こちらで測る。 */
  function LW(){ var d=document.documentElement; return (d&&d.clientWidth)||window.innerWidth; }
  function LH(){ var d=document.documentElement; return (d&&d.clientHeight)||window.innerHeight; }
  function isZoomed(){ var vv=window.visualViewport; return !!(vv && vv.width < LW()*0.96); }
  function pageH(){
    var vv = window.visualViewport;
    var h = LH();
    /* 文字入力でキーボードが出ると visualViewport は小さくなるので、大きいほうを採る
       （★指で拡大している間は小さくなって当たり前なので、そのときは見ない） */
    if(vv && !isZoomed() && vv.height > h) h = vv.height;
    /* 目印のほうが下にあれば、そちらが本当の下端。
       ブラウザで開いているときは下のバーの分だけ縮むのが正しいので、この直しは
       ホーム画面から起動したときだけ効かせる。あり得ない大きさは念のため採らない。 */
    if(isStandalone()){
      var t = probeBottom();
      if(t > h + 1 && t < h * 3) h = t;
      /* ★2026-08-27a ホーム画面起動＝全画面なので、画面そのもの（screen）の高さが本当の高さ。
         申告(innerHeight)・visualViewport・目印のすべてが小さいまま嘘をつく端末があり
         （実機スクショの実測：中身が60pt短く、その下にページの背景色が塗られていた）、
         その場合は screen だけが正しい。
         ・iPhoneの screen は向きに関係なく「たて向きの値」なので、よこ向きは短い方を使う
         ・縮小して表示するページ（width=980）ではCSSのpxと合わないが、
           そのときは h が screen よりずっと大きいので下の条件に入らない（保護） */
      var scH = (LW() > LH()) ? Math.min(screen.width, screen.height)
                              : Math.max(screen.width, screen.height);
      var scW = (LW() > LH()) ? Math.max(screen.width, screen.height)
                              : Math.min(screen.width, screen.height);
      /* ★2026-08-27h 縮小して表示するページ（width=980）は、CSSのpxと画面のptが合わない。
         「画面の1pt＝CSSの何px」（innerWidth÷画面の幅）を掛けて、CSSのpxに直してから比べる。
         等倍のページでは innerWidth＝画面の幅なので倍率1＝今までと同じ。
         （直す前は pt のまま比べていたため、縮小ページだけこの直しが一度も効かず、
         　下に約60ptの帯が残っていた＝実機で発生） */
      var sc = (scW > 0) ? scH * (LW() / scW) : scH;
      if(sc > h + 1 && sc < h * 1.6) h = sc;
    }
    return Math.round(h);
  }
  /* ★2026-08-24aa 0.8秒ごとの見直しは「変わったときだけ」にする。
     この処理は画面の高さを測り直すので、そのたびに**画面ぜんぶの置き場所の計算**が走る。
     ・窓の大きさ ・下部ナビの出入り ・表示中の画面 ・表示倍率
     のどれも変わっていなければ、測らずにそのまま戻る（見え方は今までどおり）。
     中身の高さが変わったときは、呼ぶ側が fill(true) で「必ず測る」と伝える。 */
  var _fsig='';
  function fillSig(){
    var vv=window.visualViewport, nav=document.getElementById('nav');
    var s=[LW(), LH(),
           /* ★指で拡大している間は vv の大きさが刻々と変わるので、合図には「拡大中」とだけ入れる */
           isZoomed()?'zoom':(vv?Math.round(vv.width)+'x'+Math.round(vv.height):'-'),
           nav?(nav.style.marginBottom+'|'+nav.style.transform+'|'+nav.className):'-',
           window.nnPZ||1];
    /* ★2026-08-26b ホーム画面から起動したiPhoneは、innerHeight が実際より小さい値の
       まま変わらないことがある（§5-2）。本当の下端（目印）は起動の少し後に伸びるが、
       申告値だけを見る合図では「変わっていない」ことになり、
       「変わったときだけ測る」（2026-08-24ab）が一度も測り直さない
       ＝画面の下に黒い帯が残っていた（実機で発生）。目印も合図に入れる。 */
    if(isStandalone()) s.push(Math.round(probeBottom()));
    if(VIEWS) for(var i=0;i<VIEWS.length;i++){
      var e=document.getElementById(VIEWS[i]);
      s.push(e?(e.className+'/'+(e.style.display||'')):'-');
    }
    return s.join(',');
  }
  function fill(force){
    if(!force){ var sg=fillSig(); if(sg===_fsig) return; _fsig=sg; }
    else _fsig=fillSig();
    /* ★2026-08-11a パソコンで表示倍率（zoom）をかけているときは、
       innerHeight（実画面のpx）をそのまま使うと body の高さが倍率ぶん大きくなる。
       倍率で割って「CSSのpx」に直す。 */
    var _z = window.nnPZ || 1;
    var pb = pageH() / _z;
    document.documentElement.style.setProperty('--nnvh', pb + 'px');
    /* ★2026-08-27h 下部ナビが position:fixed のページ（国交省仕様・現場マップ）では、
       ナビは「申告された画面の下端」に貼り付く。ホーム画面起動のiPhoneが高さを
       実際より小さく申告したままだと（§221）、ナビの下に帯が残る＝CSSでは直せない。
       本当の高さ（pb）との差のぶんだけ下へずらして、本当の下端に貼り直す。
       ふつうの端末・ふつうのページでは差が0なので何も変わらない。 */
    try{
      var _nv=document.getElementById('nav');
      if(_nv && getComputedStyle(_nv).position==='fixed'){
        /* ★2026-09-13u 差は「本当の下端 − fixed の下端が実際に来る場所（目印）」で取る。
           以前は申告された高さ（LH）との差だったため、①申告は正しいのに fixed だけ上に
           止まる端末では押し下げが 0 で帯の下に空きが残り、②申告が小さい端末では
           逆に押し下げ過ぎて2段目が画面の外へ出た（本人の実機）。 */
        var _d=Math.round(pb - probeBottom()/_z);
        _nv.style.bottom=(_d>2)? (-_d+'px') : '';
      }
      /* ▲（ナビを出すボタン）も fixed なので、同じ差のぶん下げる（負の margin で押し下げる） */
      var _vt=document.getElementById('navShowTab');
      if(_vt){ var _d2=Math.round(pb - probeBottom()/_z);
        _vt.style.marginBottom=(_d2>2)? (-_d2+'px') : ''; }
    }catch(_){}
    if(_z !== 1){                      /* 倍率をかけているときは下の余白うめをしない（パソコン用） */
      if(VIEWS) VIEWS.forEach(function(id){ var e=document.getElementById(id); if(e) e.style.minHeight=''; });
      return;
    }
    if(!VIEWS) return;
    var v = null;
    for(var i=0;i<VIEWS.length;i++){
      var e = document.getElementById(VIEWS[i]);
      if(e && e.offsetParent !== null){ v = e; break; }
    }
    if(!v) return;
    /* 下部ナビが場所を取っている高さ（自動で隠れているときは 0） */
    var navOcc = 0;
    var nav = document.getElementById('nav');
    if(nav){
      var ns = getComputedStyle(nav);
      if(ns.display !== 'none' && ns.position !== 'fixed' && ns.position !== 'absolute'){
        var mb = parseFloat(nav.style.marginBottom || '0') || 0;   /* 隠れているときは負の値 */
        navOcc = Math.max(0, nav.offsetHeight + mb);
      }
    }
    if(v.style.minHeight) v.style.minHeight = '';      /* いったん元に戻して測る */
    var r = v.getBoundingClientRect();
    var gap = (pb - navOcc) - r.bottom;                 /* 下に余っている高さ */
    if(gap > 2) v.style.minHeight = Math.round(r.height + gap) + 'px';
  }
  fill(true);
  addEventListener('load', function(){ fill(true); });
  /* ★2026-08-26b 起動直後は画面の高さが何度か変わる（起動アニメ・申告の遅れ）。
     合図が同じでも、最初だけは念のため測り直す（3回だけ・そのあとは今までどおり） */
  [300,1200,3000].forEach(function(t){ setTimeout(function(){ fill(true); }, t); });
  addEventListener('resize', function(){ fill(true); });
  addEventListener('orientationchange', function(){ setTimeout(function(){ fill(true); }, 300); });
  setInterval(fill, 800);        /* ナビの自動開閉・画面の切替に追従する */
  window.nnFillBottom = fill;
})();
</script>

<script id="nn-countbar">
/* ============================================================
   一覧の上に「表示◯件／全◯件」を出す（現場記録帳と同じ親切）
   ・絞り込みチップを押したとき、何件残ったかがすぐ分かる
   ・件数は、すでに画面に出ているグループ見出しの数を足すだけなので、
     絞り込みの中身を知らなくても正しい数になる
   ============================================================ */
window.nnCountBar=function(){
  var list=document.getElementById('list'); if(!list) return;
  var old=list.querySelector('.nncount'); if(old) old.remove();
  var shown=0, unit='品';
  var heads=list.querySelectorAll('.ghead small');
  if(heads.length){
    Array.prototype.forEach.call(heads,function(s){
      var m=String(s.textContent||'').match(/([\d,]+)\s*(\S*)/);
      if(m){ shown+=parseInt(m[1].replace(/,/g,''),10)||0; if(m[2])unit=m[2]; }
    });
  }else{
    shown=list.querySelectorAll('.mrow:not(.child)').length;
  }
  /* ★件数は検索欄と同じ行（ツールバー）の中に置く。
     一覧の上に独立した帯を作ると、その帯のぶんだけ一覧全体が下に押し下げられ、
     ただでさえ狭いスマホのよこ画面で見える件数が減ってしまうため。 */
  var bar=document.getElementById('nnCountSlot');
  if(!bar){
    var tb=document.querySelector('.toolbar'); if(!tb) return;
    bar=document.createElement('span'); bar.id='nnCountSlot'; bar.className='nncount';
    var sc=tb.querySelector('.search');
    if(sc && sc.nextSibling) tb.insertBefore(bar, sc.nextSibling); else tb.appendChild(bar);
  }
  if(!shown){ bar.innerHTML=''; return; }  /* 0件のときは案内文だけ出す */
  var total=0;
  try{ total=(view==='cat'?CATALOG.length:items.length); }catch(e){ total=0; }
  bar.innerHTML='表示 <b>'+shown+'</b>'+unit
    + ((total && total!==shown) ? ' <span class="all">／ 全 '+total+unit+'</span>' : '');
};
/* この script は一覧を組み立てる処理より後に読み込まれるため、
   最初の1回はここから呼ぶ（2回目以降は render() の中から呼ばれる）。 */
try{ nnCountBar(); }catch(e){}
addEventListener('load', function(){ setTimeout(function(){ try{ nnCountBar(); }catch(e){} }, 80); });
</script>

<style id="nn-hdr-std">
/* ============================================================
   上ヘッダーの大きさを全ページでそろえる（2026-07-30／基準＝現場記録帳）
   ------------------------------------------------------------
   ★ページごとに「画面の縮み方」が違うのが原因だった。
     現場記録帳・国交省仕様・仕様登録・材料登録は、幅980で組み立てて
     端末の幅に合わせて約0.40倍に縮めて表示している。
     ライブラリ・カメラ・発注・用語集・現場マップは縮めず等倍で表示している。
     だから同じ「64px」と書いても、前者では画面上25pt・後者では64ptになり、
     ページを移動するたびにヘッダーの厚みが2.5倍も上下していた。
     （実測：現場記録帳45pt ／ ライブラリ・カメラ・発注・用語集・現場マップ99pt）

   直し方：現場記録帳の数値に「そのページの倍率」を掛けて指定する。
     倍率 --nnhm ＝ そのページの組み立て幅 ÷ 980（現場記録帳の組み立て幅）

<script id="nn-hdr-std-js">
/* 倍率 --nnhm を計算して渡す（＝そのページの組み立て幅 ÷ 980） */
(function(){
  function set(){
    try{
      /* ★パソコンでは倍率1（＝今までどおり）にすること。
         パソコンのブラウザは viewport の width=980 指定を無視するため、
         画面を縮めて表示していない。ここで innerWidth/980 を掛けると
         ヘッダーだけ1.5倍に膨らんでしまう。 */
      var dev = Math.min(screen.width || 0, screen.height || 0);
      var phone = dev && dev < 700;
  /* ★★2026-09-07e 指で拡大しても画面が崩れないように「組み立ての大きさ」で測る（§319）。
     iPhoneは指で拡大すると innerWidth・innerHeight まで**いま見えている範囲**の大きさに
     変わる（パソコンのブラウザは変わらない）。それをそのまま画面の高さ・縮小率に使うと、
     拡大した分だけ中身が短く・小さくなり、下に何も無い帯が出る＝「ズームすると見切れる」。
     documentElement の clientWidth/clientHeight は**拡大しても変わらない**ので、こちらで測る。 */
  function LW(){ var d=document.documentElement; return (d&&d.clientWidth)||window.innerWidth; }
  function LH(){ var d=document.documentElement; return (d&&d.clientHeight)||window.innerHeight; }
      var m = phone ? ((LW() || 980) / 980) : 1;
      if(!(m > 0.05 && m < 4)) m = 1;              /* あり得ない値は採らない */
      document.documentElement.style.setProperty('--nnhm', m.toFixed(4));
      /* ノッチの逃げの割り増し（＝そのページの縮小率の逆数）。
         いま向いている方の画面の幅で計算すること。 */
      var pr = true;
      try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = LH() > LW(); }
      var scr = pr ? Math.min(screen.width||0, screen.height||0) : Math.max(screen.width||0, screen.height||0);
      var saf = (phone && scr > 0) ? ((LW() || scr) / scr) : 1;
      if(!(saf > 0.5 && saf < 5)) saf = 1;
      document.documentElement.style.setProperty('--nnsaf', saf.toFixed(4));
    }catch(e){}
  }
  set();
  addEventListener('resize', set);
  addEventListener('orientationchange', function(){ setTimeout(set, 300); });
  addEventListener('load', set, {once:true});
})();
</script>

<script id="nn-pczoom-js">
(function(){
  if(document.documentElement.getAttribute('data-nnphone')==='1'){ window.nnPZ=1; return; }

  function autoZ(){

    document.documentElement.style.setProperty('--nnpzr', z);
    document.documentElement.setAttribute('data-nnpz', z===1 ? 'off' : 'on');
    try{ if(window.nnFillBottom) window.nnFillBottom(); }catch(e){}
    try{ if(window.nnFitMapApp) window.nnFitMapApp(); }catch(e){}
    try{ if(window.nnSecRefresh) window.nnSecRefresh(); }catch(e){}

})();

<script id="nn-httl-js">
/* 見出しの文字だけを span.httl で包む。
   ★右端に置く補助の文字（.r／.cta など）は包まない＝タグの外に残す。
   ★中身を作り直すページ（国交省仕様・ライブラリ等）があるので、
     作り直されたら包み直す（MutationObserver・0.2秒のまとめ）。 */
(function(){
  var SEL='.panel > h4, .wr-box > h4, .dpanel > h4, .proc-card > h4, .notebox-h > h4';
  var STOP=/(^|\s)(r|cta|zx|colgear|sub|hcount|tag)(\s|$)/;
  function wrap(h){
    if(h.getAttribute('data-nnht')==='1') return;
    if(h.querySelector('.httl')){ h.setAttribute('data-nnht','1'); return; }
    var kids=[].slice.call(h.childNodes);
    var sp=document.createElement('span'); sp.className='httl';
    for(var i=0;i<kids.length;i++){
      var n=kids[i];
      if(n.nodeType===1 && STOP.test(' '+String(n.className||'')+' ')) break;
      sp.appendChild(n);
    }
    if(!String(sp.textContent||'').trim()){        /* 包むものが無いときは何もしない */
      while(sp.firstChild) h.insertBefore(sp.firstChild, h.firstChild);
      return;
    }
    h.insertBefore(sp, h.firstChild);
    h.setAttribute('data-nnht','1');
  }
  function run(){ try{ [].forEach.call(document.querySelectorAll(SEL), wrap); }catch(e){} }
  if(document.readyState==='loading') addEventListener('DOMContentLoaded',run); else run();
  addEventListener('load',function(){ setTimeout(run,200); });
  try{
    var t=null;
    new MutationObserver(function(){ if(t)return; t=setTimeout(function(){ t=null; run(); },200); })
      .observe(document.body,{childList:true,subtree:true});
  }catch(e){}
})();
</script>

<script id="nn-trail-js">
/* ============================================================
   指をなぞると光がついてくる（2026-08-19b・本人の指示）
   線を引く・頂点をつまむ等の細かい操作で「いま指がどこにあるか」が分かるようにする。
   ・画面いっぱいの透明なキャンバスを1枚だけ用意し、指が触れている間だけ描く
   ・座標は clientX/Y をそのまま「画面の実px」として使う（表示倍率 zoom の影響を受けない）
   ・pointer-events:none なので、下のボタンや作図の邪魔は一切しない
   ============================================================ */
(function(){
"use strict";
var cv=null, ctx=null, pts=[], raf=null, active=false, lastT=0;
var LIFE=420;                     /* 光が消えるまで(ms) */
function make(){
  if(cv)return;
  cv=document.createElement('canvas');
  cv.id='nnTrail';
  cv.style.cssText='position:fixed; left:0; top:0; width:100%; height:100%;'
    +'pointer-events:none; z-index:9997;';
  document.body.appendChild(cv);
  ctx=cv.getContext('2d');
}
function fit(){
  var r=cv.getBoundingClientRect();
  /* ★2026-08-26b にじむ光なので等倍で十分。2倍だと描く画素が4倍になり、
     指を置いている間ずっとその分の仕事が挟まっていた（ラグの一因）。 */
  var d=1;
  var w=Math.round(r.width*d), h=Math.round(r.height*d);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  return {r:r, k:cv.width/(r.width||1)};   /* k＝画面px→キャンバスpxの倍率（＝dpr） */
}
function draw(){
  if(!cv){ raf=null; return; }
  var g=fit(), k=g.k, now=performance.now();
  ctx.clearRect(0,0,cv.width,cv.height);
  /* 寿命の切れた点を落とす */
  while(pts.length && now-pts[0].t>LIFE) pts.shift();
  if(pts.length>=2){
    /* しっぽ：新しいほど太く明るい */
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var age=(now-b.t)/LIFE; if(age<0)age=0; if(age>1)age=1;
      var al=(1-age)*0.85;
      /* ★2026-08-26b shadowBlur（にじみ）は1本ごとにぼかし計算が走って重いのでやめ、
         「太く薄い線＋細く明るい線」の2度がきで同じ見え方にする */
      ctx.strokeStyle='rgba(255,180,40,'+(al*0.30).toFixed(3)+')';
      ctx.lineWidth=(7+12*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
      ctx.strokeStyle='rgba(255,217,77,'+al.toFixed(3)+')';
      ctx.lineWidth=(2.5+6*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
    }
  }
  /* 指の先の光 */
  if(active && pts.length){
    var p=pts[pts.length-1];
    var gr=ctx.createRadialGradient(p.x*k,p.y*k,0, p.x*k,p.y*k,9*k);
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.45,'rgba(255,217,77,.80)');
    gr.addColorStop(1,'rgba(255,157,30,0)');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(p.x*k,p.y*k,9*k,0,7); ctx.fill();
  }
  if(active || pts.length){ raf=requestAnimationFrame(draw); }
  else { raf=null; ctx.clearRect(0,0,cv.width,cv.height); }
}
function add(e){
  var now=performance.now();
  if(now-lastT<8) return;          /* 詰めすぎない */
  lastT=now;
  pts.push({x:e.clientX, y:e.clientY, t:now});
  if(pts.length>90) pts.shift();
  if(!raf) raf=requestAnimationFrame(draw);
}
var downX=0, downY=0, movedOn=false;
addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse' && e.buttons===0) return;
  /* ★2026-08-26b タップ（動かさない指）では何も描かない。
     以前は押した瞬間から画面いっぱいのキャンバスを毎コマ描き直していて、
     ボタンを押すたびにその仕事が挟まっていた（ラグの一因）。
     7px以上なぞったときだけ描き始める（なぞりの光は今までどおり）。 */
  active=true; movedOn=false; downX=e.clientX; downY=e.clientY;
},true);
addEventListener('pointermove',function(e){
  if(!active)return;
  if(!movedOn){
    if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)<7) return;
    movedOn=true; make(); pts.length=0;
    pts.push({x:downX, y:downY, t:performance.now()});
  }
  add(e);
},true);
function end(){ active=false; movedOn=false; if(!raf&&cv&&pts.length) raf=requestAnimationFrame(draw); }
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  addEventListener(ev,end,true);
});
})();
</script>

<script id="nn-navfit-js">
/* 下部ナビ（緑の帯）を、中のアイコンより低くしない（2026-09-13u）
   帯の高さを決めるCSSが複数あり、端末で勝ち負けが変わって1段ぶんの高さになると
   2段目が切れる（本人の実機）。中身を実測して足りない分だけ min-height を足す。
   ★余白や位置には触らない（足りているときは何もしない）。 */
(function(){
  function nav(){ return document.getElementById('nav') || document.querySelector('body>nav'); }
  function fit(){
    try{
      var n=nav(); if(!n) return;
      var cs=getComputedStyle(n); if(cs.display==='none') return;
      /* スマホのグリッドはCSSで段数と安全領域を確保。旧補正を回転後に残さない。 */
      if(cs.display==='grid'){ n.style.removeProperty('min-height'); return; }
      var r=n.getBoundingClientRect(); if(!(r.width>r.height)) return;   /* 横長の帯のときだけ */
      var top=1e9,bot=-1e9,k=0,list=n.querySelectorAll('.ni');
      for(var i=0;i<list.length;i++){ var q=list[i].getBoundingClientRect(); if(q.height<2)continue;
        k++; if(q.top<top)top=q.top; if(q.bottom>bot)bot=q.bottom; }
      if(!k) return;
      var need=(bot-top)+(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0)
              +(parseFloat(cs.borderTopWidth)||0)+(parseFloat(cs.borderBottomWidth)||0);
      var cur=parseFloat(n.style.minHeight)||0;
      if(need>r.height+1 && need>8 && need<800 && Math.ceil(need)!==cur)
        n.style.setProperty('min-height',Math.ceil(need)+'px','important');
    }catch(e){}
  }
  function soon(){ try{ requestAnimationFrame(function(){ setTimeout(fit,0); }); }catch(e){ setTimeout(fit,0); } }
  soon();
  addEventListener('load',function(){ soon(); setTimeout(fit,400); },{once:true});
  addEventListener('resize',soon);
  addEventListener('orientationchange',function(){ setTimeout(fit,320); });
  try{ var n0=nav(); if(n0) n0.addEventListener('load',soon,true); }catch(e){}
  try{ var mo=new MutationObserver(soon), t=nav(); if(t) mo.observe(t,{childList:true,subtree:true}); }catch(e){}
})();
</script>

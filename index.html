<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>デモ入口</title>
<link rel="stylesheet" href="common.css">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); min-height:100vh; padding:28px 16px 60px;
}
.wrap{max-width:560px; margin:0 auto;}
h1{
  font-size:20px; font-weight:900; letter-spacing:.05em; color:#fff; text-align:center;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
    linear-gradient(180deg, #48c274, var(--green) 55%, var(--green-deep));
  border:2px solid #124a28; border-radius:12px; padding:16px 12px; margin-bottom:8px;
  text-shadow:0 1px 1px rgba(18,74,40,.55);
}
.note{text-align:center; font-size:12.5px; color:var(--ink-sub); font-weight:700; margin-bottom:20px;}
.menu{display:flex; flex-direction:column; gap:10px;}
.menu a{
  display:flex; align-items:center; gap:12px; text-decoration:none;
  background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:11px;
  padding:14px 16px; font-size:15px; font-weight:800;
  box-shadow:0 2px 0 rgba(0,0,0,.06);
  transition:transform .06s;
}
.menu a:hover{border-color:var(--green); background:var(--green-lite);}
.menu a:active{transform:translateY(1px);}
.menu .ic{font-size:22px; flex:none;}
.menu small{margin-left:auto; font-size:11px; color:var(--ink-sub); font-weight:700; white-space:nowrap;}
</style>
</head>
<body>
<div class="wrap">
  <h1>デモ画面 入口</h1>
  <div class="note">見たい画面を選んでください（全8画面）</div>
  <div class="menu">
    <a href="./kirokucho_demo.html"><span class="ic">📋</span>現場記録帳<small>物件・スケジュール管理</small></a>

    <a href="./zairyo_toroku.html"><span class="ic">🧱</span>材料登録<small>材料の登録・単価管理</small></a>
    <a href="./shiyo_toroku.html"><span class="ic">📚</span>仕様登録<small>自社仕様の登録</small></a>
    <a href="./yougo.html"><span class="ic">📖</span>用語集<small>防水用語の辞書</small></a>
  </div>
</div>

<style id="nn-safearea">
/* ============================================================
   iPhone横画面フルスクリーン対応（ノッチ左右の帯をなくす）
   viewport-fit=cover とセットで機能する。
   バー類の中身はセーフエリア分だけ内側に寄せる。
   縦画面・PCでは env() が 0 になるため影響しない。
   ============================================================ */
@media (orientation:landscape) and (max-height:500px){
  header,#viewtabs,#makerbar,.toolbar,#gbbar,nav,footer,#memBanner{
    padding-left:calc(10px + env(safe-area-inset-left,0px));
    padding-right:calc(10px + env(safe-area-inset-right,0px));
  }
  main{padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);}
}
</style>

<style id="nn-tap">
/* ============================================================
   タップ反応の高速化
   ・touch-action:manipulation で「ダブルタップ拡大の判定待ち
     （約300ms）」を無効化し、タップ即反応にする。
     ピンチ（2本指）での拡大縮小は今までどおり使える。
     ※一覧モード（縮小表示）はビューポート幅が固定980pxのため
       この待ち時間が特に長く、体感遅延の主原因だった。
   ・タップ時のグレーの点滅（iOS標準ハイライト）も消して、
     ページ側の押し込みアニメーションだけを見せる。
   ============================================================ */
html{touch-action:manipulation;}
*{-webkit-tap-highlight-color:transparent;}
</style>
</body>
</html>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); min-height:100vh; padding:28px 16px 60px;
}
.wrap{max-width:560px; margin:0 auto;}
h1{
  font-size:20px; font-weight:900; letter-spacing:.05em; color:#fff; text-align:center;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
    linear-gradient(180deg, #48c274, var(--green) 55%, var(--green-deep));
  border:2px solid #124a28; border-radius:12px; padding:16px 12px; margin-bottom:8px;
  text-shadow:0 1px 1px rgba(18,74,40,.55);
}
.note{text-align:center; font-size:12.5px; color:var(--ink-sub); font-weight:700; margin-bottom:20px;}
.menu{display:flex; flex-direction:column; gap:10px;}
.menu a{
  display:flex; align-items:center; gap:12px; text-decoration:none;
  background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:11px;
  padding:14px 16px; font-size:15px; font-weight:800;
  box-shadow:0 2px 0 rgba(0,0,0,.06);
  transition:transform .06s;
}
.menu a:hover{border-color:var(--green); background:var(--green-lite);}
.menu a:active{transform:translateY(1px);}
.menu .ic{font-size:22px; flex:none;}
.menu small{margin-left:auto; font-size:11px; color:var(--ink-sub); font-weight:700; white-space:nowrap;}
</style>
</head>

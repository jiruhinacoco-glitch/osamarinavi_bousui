<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<script id="nn-phonemark">
/* ★端末そのものの幅を見て <html> に data-nnphone="1" を付ける
   （縮小表示のページでは CSS の画面幅が常に980pxになり、画面幅では判定できない） */
(function(){try{
  var d = Math.min(screen.width||0, screen.height||0);
  if(d && d < 700) document.documentElement.setAttribute('data-nnphone','1');
}catch(e){}})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<!-- ============================================================
     ★2026-07-28 画面が出るまでが遅い原因は、ここにあった。
     Zen Kaku Gothic New は日本語フォント。Googleはこれを
     「約120個に小分けした指定 × 太さ3種 ＝ 約360個の指定（81KB）」
     という形のCSSで配ってくる。ページを開くたびに、この360個の指定を
     すべて読み込んで、画面上のすべての文字と照合してから描き始めるため、
     中身の重さと関係なく、毎回まるまる待たされていた。

     実測（同一条件）：このCSSがあると画面が出るまでの時間が約2倍
       ホーム        1,152ms → 2,288ms
       現場記録帳    1,940ms → 3,592ms
       現場マップ      544ms →   532ms （このCSSを読まないページ＝変化なし）
     ※「現場マップだけ速い」のは、このページがフォントを読んでいなかったため。

     → 既定では読み込まない。iPhone内蔵の游ゴシック系（ヒラギノ）で表示する。
       下の NN_WEBFONT を true にすると、画面が出たあとに読み込んで
       Zen Kaku Gothic New に切り替える（見た目優先・表示は少し遅くなる）。
     ============================================================ -->
<script>
const NN_WEBFONT=false;       /* true にすると Zen Kaku Gothic New を後読みする */
if(NN_WEBFONT){
  addEventListener('load',()=>setTimeout(()=>{
    const l=document.createElement('link'); l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap';
    document.head.appendChild(l);
  },300));
}
</script>
<!-- rel=prefetch は Safari が非対応で効かず、他ブラウザでは余計な通信になるため削除（2026-07-28） -->
<style>
/* ============================================================
   納まりナビ ホーム画面（横画面前提・縦でも崩れない）
   20260724_レイアウト変更 rev.02 対応版
   手本PDFを実測し、iPhone横画面（844×390）基準の寸法で配置。
   ※実機のノッチ余白(env)は「パネル位置」には加算しない
   　（加算すると全体が内側に寄りすぎて手本とズレるため）
   ============================================================ */
:root{
  /* green-deep/green/green-lite/paper は common.css に移動 */
  --green-hi:#48c274; --green-edge:#124a28;
  --orange:#ff9d1e; --orange-deep:#e07800; --orange-edge:#b35f00;
  --yellow:#ffd94d; --yellow-deep:#f0b400;
  --edge-gray:#8b8b81; --edge-dark:#1b201d;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  color:#fff;
  /* 背景：画像が置かれれば表示、無ければ下のグレー格子（Blender風）が出る */
  background-color:#3a3d3c;
  background-image:
    url('./images/bg_home.webp'),   /* 740KB/2.0MP のPNG → 90KB/1.3MP のWebPへ差し替え（表示は約980px幅） */
    repeating-linear-gradient(0deg,  rgba(255,255,255,.05) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 42px);
  background-size:cover, auto, auto;
  background-position:center, 0 0, 0 0;
  background-repeat:no-repeat, repeat, repeat;
}

/* ---------- 上部：納まりナビロゴ＋会社名（手本実測：上20px・左22px・高さ23px） ---------- */
header{
  flex:none; display:flex; align-items:flex-start;
  padding:20px 0 0 22px;
  padding-top:calc(20px + env(safe-area-inset-top));
}
.applogo{
  background:linear-gradient(180deg,#245c3a,#183f27);
  color:#fff; font-weight:900; letter-spacing:.06em; white-space:nowrap;
  font-size:15px; line-height:1; padding:4px 13px 4px;
  border:1px solid #0d2a18; box-shadow:0 2px 4px rgba(0,0,0,.4);
}
.applogo em{font-style:normal; color:var(--yellow);}
.company{
  background:#fff; color:#4a504c; font-weight:700; letter-spacing:.14em; white-space:nowrap;
  font-size:14px; line-height:1; padding:4.5px 18px 4.5px;
  box-shadow:0 2px 4px rgba(0,0,0,.4);
}

/* ---------- 本体（背景の上にパネルを配置） ---------- */
main{flex:1; min-height:0; position:relative;}

/* 施工中物件バナー（手本実測：左14px・高さ22px・文字16px・両端斜め） */
.bukken-stack{position:absolute; left:14px; top:12px; display:flex; flex-direction:column; gap:7px; align-items:flex-start;}
.bukken-banner{
  cursor:pointer;
  background:linear-gradient(180deg,#33b264,#23934e);
  color:#fff; font-weight:900; letter-spacing:.1em; white-space:nowrap;
  font-size:16px; line-height:1; padding:3px 26px 3px 14px;
  clip-path:polygon(9px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  text-shadow:0 1px 1px rgba(18,74,40,.55);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
}

/* ---------- 右側クイック（手本実測：右12pxに密着・縦一列） ----------
   メニュー → ［付箋｜設定］ → 用語集 */
.quick{
  /* top:-22px＝ヘッダー帯と同じ高さにメニューを置く（手本実測：上23px） */
  position:absolute; right:12px; top:-22px;
  display:flex; flex-direction:column; align-items:flex-end; gap:9px;
}
.quick .qrow{display:flex; align-items:center; gap:10px;}
/* 【押せる】ハンバーガー（準備中） */
#menuBtn{
  flex:none; width:40px; height:40px; border-radius:50%; border:2px solid #fff;
  background:linear-gradient(180deg,#4e8fe0,#2f6fd6); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3.5px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 0 #1c4c9c;
  transition:transform .06s, box-shadow .06s;
  margin-right:4px;
}
#menuBtn:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 0 0 #1c4c9c;}
#menuBtn i{display:block; width:18px; height:2.5px; border-radius:2px; background:#fff;}
/* ★2026-08-12u：ボタンの絵（icons/btn_menu.png）に差し替え。
   絵は「ボタンそのもの」なので、読めたときだけ 丸・枠・影・白い線を消す。
   読めないときは onerror で絵を外すだけ＝今までの青い丸に戻る（btn_back と同じ考え方）。 */
#menuBtn .mbi{display:none; width:100%; height:100%; object-fit:contain;}
#menuBtn.hasimg{background:none; border:0; box-shadow:none; gap:0;}
#menuBtn.hasimg i{display:none;}
#menuBtn.hasimg .mbi{display:block;}
#menuBtn.hasimg:active{transform:translateY(2px); box-shadow:none;}
/* 登録済仕様の付箋（手本実測：約110×55px・文字11px） */
.fusen{
  position:relative;
  background:#fff; color:#222826;
  border:1px solid #d7dcd4; box-shadow:0 2px 6px rgba(0,0,0,.4);
  text-align:center; padding:7px 12px 6px;
  font-weight:900; letter-spacing:.02em; font-size:11px; line-height:1;
  white-space:nowrap;
}
.fusen .pin{
  position:absolute; top:3px; width:7px; height:7px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff7a66, #c22014 70%);
  box-shadow:0 1px 1px rgba(0,0,0,.5);
}
.fusen .pin.l{left:4px;} .fusen .pin.r{right:4px;}
.fusen .sep{border:0; border-top:1.5px dashed #9aa39c; margin:6px 0;}
/* 【押せる】設定・用語集アイコンボタン
   ★2026-08-12t：絵だけ（背景の白いタイルも緑ラベルも入っていない）の
   アイコンに差し替えたので、白いタイルはここで作り、絵は丸ごと表示する。
   （それまでは絵にタイルと緑ラベルが焼き込まれていて、上から65%だけを
   　切り出して出していた。同じやり方だと新しい絵は下が切れてしまう） */
.qbtn{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  cursor:pointer; border:0; background:none; font-family:inherit;
  transition:transform .1s ease-out;
}
.qbtn .icwrap{
  /* ★2026-08-18b 白いタイル（背景・角丸・影）は本人の指示で削除。絵とラベルだけにする */
  width:68px; height:38px;
  display:flex; align-items:center; justify-content:center;
  overflow:visible; background:none; box-shadow:none; border-radius:0;
}
.qbtn img{height:36px; width:auto; display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));}
.qbtn .lbl{
  background:#fff; color:#222826; font-weight:900; font-size:9px; letter-spacing:.1em;
  border-radius:999px; padding:1.5px 11px; box-shadow:0 1px 3px rgba(0,0,0,.4);
}
.qbtn:hover{transform:scale(1.06);}
.qbtn:active{transform:scale(.94);}
.quick > .qbtn{margin-right:2px;}

/* ---------- 右下：お知らせ＋切替ドット（手本実測：右12px・高さ約70px） ---------- */
.newsbox{
  /* rev.03 ①：ナビと重ならないよう少し上に */
  position:absolute; right:12px; bottom:26px;
  display:flex; flex-direction:column; align-items:center; gap:5px;
}
/* 物件切替ドット（小） */
.dots{
  display:flex; gap:6px; align-items:center;
  background:rgba(17,28,21,.75); border-radius:999px; padding:3px 9px;
}
.dots .dot{
  width:8px; height:8px; border-radius:50%; background:#77857c; cursor:pointer;
  transition:background .15s, transform .15s;
}
.dots .dot.on{background:#3fe087; transform:scale(1.15); box-shadow:0 0 4px rgba(63,224,135,.8);}
/* お知らせ（小型・スクロールバー常時表示） */
.notice{
  width:min(315px, 40vw);
  background:#fff; color:var(--ink);
  border:1px solid #b8b48e; box-shadow:0 3px 8px rgba(0,0,0,.35);
  font-size:8.5px; line-height:1.45;
}
.notice .ttl{
  background:linear-gradient(180deg,#3f9e53,#2c7a41);
  color:#fff; font-weight:900; text-align:center; letter-spacing:.25em;
  font-size:10px; padding:2px 8px; text-shadow:0 1px 1px rgba(18,74,40,.55);
}
.notice .bd{
  padding:3px 8px 5px; max-height:52px; overflow-y:auto;
  scrollbar-width:thin; scrollbar-color:#2c7a41 #e4e8e2;
}
/* スクロールバーを常に見せる（rev.02 ④） */
.notice .bd::-webkit-scrollbar{width:5px;}
.notice .bd::-webkit-scrollbar-track{background:#e4e8e2; border-radius:3px;}
.notice .bd::-webkit-scrollbar-thumb{background:#2c7a41; border-radius:3px;}
.notice .item b{font-weight:900; font-size:9.5px;}
.notice .item .dt{font-weight:900; color:#7a6a20; font-size:9.5px;}
.notice .item .tx{color:#6b736e;}
.notice .sep{border:0; border-top:1px dashed #a9a06a; margin:3px 0;}

/* ---------- 下部ナビ（手本：帯は薄く、アイコンが帯の上にはみ出す） ---------- */
nav{
  flex:none; background:#202623; display:flex; gap:4px; padding:6px 8px; overflow-x:auto;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
}
nav .ni{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfd6d1;
  font-size:12px; font-weight:700; padding:5px 13px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
nav .ni .ic{font-size:23px; line-height:1;}
nav .ni:hover{background:#333b37;}
nav .ni.on{background:var(--green); color:#fff;}
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
nav::-webkit-scrollbar{display:none;}

/* 【押せる】下部ナビ（ゲームUI質感） */
nav#nav, body>nav{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,#1f5c36,#153f25) !important;
  border-top:2px solid #0d2a18;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
  gap:3px; padding:2px 7px;
  /* rev.03 ②：アイコンの文字が画面下ギリギリに来るよう、下の余白は付けない */
  padding-bottom:2px;
}
nav .ni, nav#nav .ni{
  color:#cfe6d6; font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:7px;
  transition:transform .06s;
}
nav .ni .ic, nav#nav .ni .ic{font-size:19px; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));}
nav .ni:hover, nav#nav .ni:hover{background:rgba(255,255,255,.10);}
nav .ni:active, nav#nav .ni:active{transform:translateY(1px);}
nav .ni.on, nav#nav .ni.on{
  background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));
  color:#4d3a00; border:1.5px solid #a87f00;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #7d5f00;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
/* 画像アイコンボタン（rev.02 ⑤：帯を薄くしアイコンを上にはみ出させる） */
nav .ni .ic img, nav#nav .ni .ic img{height:44px; display:block;}
nav .ni.hasimg, nav#nav .ni.hasimg{padding:0 3px; margin-top:-13px;}
nav .ni.hasimg > span:last-child, nav#nav .ni.hasimg > span:last-child{display:none;}
nav .ni.hasimg .ic, nav#nav .ni.hasimg .ic{filter:none;}
nav .ni.hasimg.on, nav#nav .ni.hasimg.on{background:none; border:none; box-shadow:none; text-shadow:none;
  filter:drop-shadow(0 0 5px #ffd23f) drop-shadow(0 0 2px #ffd23f);
  transform:scale(1.14);
  transform-origin:center bottom;
  z-index:2; position:relative;
}
nav .ni.hasimg, nav#nav .ni.hasimg{transition:transform .15s ease-out, filter .15s ease-out;}
nav .ni.hasimg:hover, nav#nav .ni.hasimg:hover{transform:scale(1.06);}
nav .ni.hasimg.on:hover, nav#nav .ni.hasimg.on:hover{transform:scale(1.14);}
nav, nav#nav{overflow:visible; padding-top:2px;}
@media (max-width:760px){
  /* 縦持ち等の狭い幅：横スクロールになるため、はみ出し表示はやめて帯内に収める */
  nav, nav#nav{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; justify-content:flex-start;}
  nav::-webkit-scrollbar, nav#nav::-webkit-scrollbar{display:none;}
  nav .ni .ic img, nav#nav .ni .ic img{height:38px;}
  nav .ni.hasimg, nav#nav .ni.hasimg{margin-top:0;}
  nav .ni:first-child, nav#nav .ni:first-child{margin-left:0;}
  nav .ni:last-child, nav#nav .ni:last-child{margin-right:0;}
}

/* ---------- タップ演出（タッチ発光） ---------- */
@keyframes tapfx-glow{
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
  60%{opacity:.7;}
  100%{opacity:0; transform:translate(-50%,-50%) scale(2.1);}
}
@keyframes tapfx-ring{
  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.45);}
}
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);
  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .55s ease-out forwards;
}
.tapfx::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:2px solid rgba(255,217,77,.9);
  animation:tapfx-ring .55s ease-out forwards;
}

/* ---------- 縦画面：パネルを縦積みにして崩れを防ぐ ---------- */
@media (orientation:portrait){
  header{padding-left:14px;}
  main{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 14px; display:flex; flex-direction:column; gap:14px;}
  .bukken-stack{position:static; align-self:flex-start; margin-left:-14px;}
  .quick{position:static; flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:center; gap:16px;}
  .newsbox{position:static; width:100%; margin-top:auto; margin-bottom:4px;}
  .notice{width:100%;}
  .notice .bd{max-height:none;}
  /* rev.03 タテ②：ナビのアイコンを2段構成に（横スクロールをやめて折り返し） */
  nav, nav#nav{
    flex-wrap:wrap; overflow-x:visible; justify-content:center; row-gap:2px;
    padding-bottom:calc(2px + env(safe-area-inset-bottom));
  }
}
</style>

<!-- 版の表示：スマホに届いている中身がどれかを、お互いに確認するための小さな印。
     不要になったらこの1行と #nnver の指定を消してください。 -->
<div id="nnver">v2026-08-29 a</div>
<script>
/* ============ 実機の計測結果を表示（原因調査用・2026-07-28） ============
   数字の意味（単位はミリ秒）
     net  ＝要求してから最初の返事が来るまで（通信の待ち時間）
     recv ＝中身を受け取り終わるまで
     bld  ＝受け取ってから組み立て終わるまで（解析＋JS実行）
     出  ＝画面に中身が出た時刻
     KB   ＝通信で受け取った量（0＝端末の保存から出した＝通信していない）
   原因が分かったらこの表示ごと外します。 */
(function(){
  const el=document.getElementById('nnver'); if(!el)return;
  let open=false;
  function draw(){
    const ver='v'+(window.nnVerNow||'?').replace(/^(\d{4})-(\d{2})-(\d{2})/,'$1-$2-$3 ');
    if(!open){ el.textContent=ver; return; }
    let a=[]; try{a=JSON.parse(sessionStorage.getItem('nnPerf')||'[]');}catch(_){}
    const c=(x,w)=>String(x).padStart(w);
    let t=ver+'  net recv  bld   出   KB\n';
    a.slice(-5).forEach(r=>{
      t+=`${(r.p+'        ').slice(0,8)}${c(r.net,6)}${c(r.recv,5)}${c(r.build,5)}${c(r.paint,5)}${c(r.kb,5)}\n`;
    });
    const L=a[a.length-1];
    if(L)t+=`部品${L.res}個 ${L.rkb}KB ／ フォント${L.fn}個 ${L.fms}ms\n最も遅い部品 ${L.sl}\n公開中の版 ${window.nnVerNew||'?'}（この画面 ${window.nnVerNow||'?'}）`;
    if(!a.length)t+='（現場記録帳へ行って戻ると出ます）';
    /* ★2026-08-27a 画面の高さの実測（下の帯の調べ用）。
       申告(inner)・visualViewport(vv)・目印(fixedの下端)・screen・--nnvh・起動方法。
       下に帯が出たら、この行のスクショ1枚で原因が確定できる。 */
    try{
      const vv=window.visualViewport, pr=document.getElementById('nnBtmProbe');
      const pb=pr?Math.round(pr.getBoundingClientRect().bottom):-1;
      const nv=(getComputedStyle(document.documentElement).getPropertyValue('--nnvh')||'').trim();
      const sa=(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches)?'アプリ':'ブラウザ';
      t+=`\n高さ 申告${innerHeight} vv${vv?Math.round(vv.height):'-'} 目印${pb} scr${screen.width}x${screen.height} nnvh:${nv} ${sa}`;
    }catch(_){}
    el.textContent=t;
  }
  el.addEventListener('click',()=>{open=!open; el.classList.toggle('open',open); draw();});
  addEventListener('load',()=>setTimeout(draw,700));
  draw();
})();
</script>

<script>
/* ---------- 物件切替ドット（ダミー：将来3Dモデルと連動） ---------- */
const BUKKEN_COUNT=5;
let bukkenIdx=0;
function buildDots(){
  const d=document.getElementById('dots');
  d.innerHTML=Array.from({length:BUKKEN_COUNT},(_,i)=>`<span class="dot ${i===bukkenIdx?'on':''}" onclick="setBukken(${i})"></span>`).join('');
}
function setBukken(i){ bukkenIdx=i; buildDots(); }
buildDots();

/* ---------- 共通下部ナビ（kirokucho_demo から移植） ----------
   ホーム画面のみ：用語集・設定は画面右側のボタンに移したため
   ナビからは外した9個構成（レイアウト変更指示書 2026-07-23） */
const ICONS={
  home:'🏠', kiroku:'📋', map:'🗺️', hacchu:'📝', kokkou:'📗', camera:'📷',
  library:'📁', zumen:'📐', zairyo:'🧱', shiyou:'📚', yougo:'📖', settei:'⚙️',
};
const NAV=[['home','ホーム'],['kiroku','現場記録帳'],['map','現場マップ'],['hacchu','発注'],['kokkou','国交省仕様'],['camera','カメラ'],
           ['library','ライブラリ'],['zumen','図面/積算'],['shiyou','仕様・材料']];
/* 同じフォルダに置いた各ページへのリンク（ファイル名を合わせれば繋がる） */
const NAV_LINKS={home:'./index.html', kiroku:'./kirokucho_demo.html', map:'./genba_map_v36.html', hacchu:'./hacchu.html', kokkou:'./kokkosho.html',
                 camera:'./camera.html', library:'./library.html', yougo:'./yougo.html',
                 zumen:'./zumen_sekisan.html',
                 zairyo:'./zairyo_toroku.html', shiyou:'./shiyo_toroku.html'};
const NAV_ACTIVE='home';
function navGo(k,label){
  if(k===NAV_ACTIVE)return;
  if(NAV_LINKS[k]){ nnGoPage(encodeURI(NAV_LINKS[k])); }
  else if(k==='settei'&&window.nnDataOpen){ nnDataOpen(); }   /* 設定＝データの保存・復元（2026-08-06d） */
  else alert('「'+label+'」は準備中です');
}
/* ページ移動：一瞬フェードしてから移動する（画面が固まったように見えるのを防ぐ） */
window.nnGoPage=function(url){
  /* ★指を離した瞬間（＝タップした瞬間）に、画面いちばん上へ細い進行バーを出す。
     次のページが出来上がるまでの数百ミリ秒、「反応した」ことが必ず目に見える。
     画面は隠さないので、前の画面はそのまま見えたまま。 */
  try{
    if(!document.getElementById('nnbar')){
      const bar=document.createElement('div'); bar.id='nnbar'; bar.innerHTML='<i></i>';
      document.body.appendChild(bar);
      setTimeout(()=>{try{bar.remove();}catch(_){}} ,4000);   /* 念のための自動消去 */
    }
  }catch(_){}
  document.body.classList.add('nn-leaving');
  location.href=url;
};
/* ★先読みの fetch は削除（2026-07-28）。
   ページは端末に保存済みなので先読みの意味がなく、指が触れた瞬間に
   別の取得処理を走らせることで、肝心の画面移動と処理を取り合っていた。 */
function buildNav(){
  const n=document.getElementById('nav');
  n.innerHTML=NAV.map(([k,l])=>{
    const suf=(k===NAV_ACTIVE)?'_on':'';
    return `<div class="ni ${k===NAV_ACTIVE?'on':''}" onclick="navGo('${k}','${l}')">
      <span class="ic"><img src="./icons/nav_${k}${suf}.png" alt="${l}"
        onload="this.closest('.ni').classList.add('hasimg')"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='./icons/nav_${k}.png';}
                 else{this.outerHTML=ICONS['${k}']||'▫️';}"></span><span>${l}</span></div>`;
  }).join('');
  /* あふれ時：アクティブなボタンを中央に
     ★位置の計測（scrollWidth や getBoundingClientRect）は「画面をいったん組み上げる」
       処理なので、ここで行うと画面が出るまでの待ち時間が伸びる。
       画面を出したあと（次の描画のタイミング）にまわす。 */
  addEventListener('load',()=>{
    const on=n.querySelector('.ni.on');
    if(on && n.scrollWidth>n.clientWidth){
      const d=on.getBoundingClientRect().left-n.getBoundingClientRect().left;
      n.scrollLeft+=d-(n.clientWidth-on.offsetWidth)/2;
    }
  },{once:true});
}
buildNav();

/* ---------- タップ演出（発光＋タップ音・kirokucho_demo から移植） ---------- */
(function(){
  /* ゲーム風タップ音（Web Audio合成・音源ファイル不要） */
  let AC=null;
  function ctx(){
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  function tapSound(){
    try{
      const c=ctx(), t=c.currentTime;
      // やわらかい水滴風の「ぽん」：低めのサイン波2音（耳に優しい音量）
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(523,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.06,t+0.010);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.15);
      // 軽く上に抜ける倍音
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(784,t);
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.03,t+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
      o2.connect(g2).connect(c.destination);
      o2.start(t+0.005); o2.stop(t+0.12);
    }catch(e){}
  }

  /* タッチ発光 */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    /* ★2026-08-13j パソコンの表示倍率（zoom）で割ること。
       clientX/Y は倍率を**かけた後**のpx、style.left/top は倍率を**かける前**のpx。
       割らないと、大きいモニターほど発光が右下の見当違いな場所に出る（§61の落とし穴）。 */
    const _z=window.nnPZ||1;
    el.style.left=(x/_z)+'px'; el.style.top=(y/_z)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 600);
  }

  /* イベント委譲：発光＝どこでも／音＝押せる要素のみ */
  const PRESSABLE='button, .dot, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    /* ★下部ナビは専用の音（nav_move.wav）を鳴らすので、ここでは鳴らさない。
       [onclick] にナビも含まれてしまい、1回のタップで2種類の音が重なって
       「ココンコン」と聞こえていた原因。 */
    const tc=(e.target&&e.target.closest)?e.target:null;
    const hit=(!tc||tc.closest('nav .ni'))?null:tc.closest(PRESSABLE);
    if(hit && !hit.disabled){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();
</script>

const NN_VER='2026-08-29a';
/* ============ 表示にかかった時間の記録（原因調査用・2026-07-28） ============
   スマホの実機でどこに時間がかかっているかを数字で出す。
   ・net  ＝ページを要求してから最初の返事が来るまで（通信の待ち）
   ・recv ＝中身を受け取り終わるまで
   ・build＝受け取ってから組み立て終わるまで（解析・JS実行）
   ・paint＝画面に中身が出たとき

addEventListener('load',()=>{setTimeout(()=>{

const NN_PAGES=['./index.html','./kirokucho_demo.html','./zumen_sekisan.html','./genba_map_v36.html','./hacchu.html',
  './kokkosho.html','./camera.html','./library.html','./shiyo_toroku.html','./zairyo_toroku.html','./yougo.html','./common.css'];
window.nnVerNow=NN_VER;
(async function(){

    if(!r.ok)return;

    if(!v || v===NN_VER)return;
    /* ★2026-07-28 修正：以前は保存分を消して読み直すだけだったが、
       Safari自身が持っている一時保存（HTTPキャッシュ）は消えないため、
       読み直しても古いページが出続けて更新が止まることがあった。
       全ページを cache:'reload' で取り直してから読み直す。 */
    const n=parseInt(sessionStorage.getItem('nnUpdN_'+v)||'0',10);
    if(n>=2)return;                                   /* 失敗が続いたら止める安全弁 */

/* ★2026-07-28 検証：サービスワーカーを一時的に止める

   移動のたびにかかる「決まった待ち時間」がある、ということ。

   眠っていると、移動のたびに起こす時間が数百ミリ秒かかることが知られている。
   → いったん止めて、これが原因かを確かめる。
   NN_USE_SW を true に戻せば、オフライン対応ごと元に戻せる。 */
const NN_USE_SW=false;
if('serviceWorker' in navigator){
  if(NN_USE_SW){
    let nnReloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(nnReloaded)return; nnReloaded=true; location.reload();
    });

        try{r.update();}catch(_){}

      }).catch(()=>{});

    addEventListener('load',async()=>{

          if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));}

<script>
/* ============ ナビの操作音（2026-07-28 作り直し） ============
   ★以前は <audio> を2個ずつ用意して音源ファイル(nav_move.wav)を
     読ませていたが、iPhoneでは音声部品の準備が重く、しかも
     いつ終わるか読めないため、画面が出るまでの待ち時間に影響していた。
     → 音源ファイルをやめ、その場で音を合成する方式（Web Audio）に変更。
       ファイル読み込みゼロ・部品ゼロ・音は今までと同じ「やわらかい1音」。
   ============================================================ */
(function(){
  /* ★2026-07-28 音が出たり出なかったりした原因
     ①音の装置(AudioContext)を「ナビを最初に押したとき」に作っていた。
       iPhoneでは作った直後は停止状態で、動き出すまでに少し時間がかかるため、
       その1回目の音が鳴らないことがあった。
     ②画面移動が0.09秒後に始まるので、音が長いと途中で切れていた。
     → 装置は「画面のどこかを最初に触った時点」で作って動かしておく。
       音は0.07秒に短くして、移動が始まる前に鳴り終わるようにする。 */
  let AC=null, last=0;
  function make(){
    if(AC)return AC;
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    try{ AC=new C(); }catch(_){ return null; }
    /* 無音を1粒だけ鳴らして、iPhoneの音の仕組みを起こしておく */
    try{ const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
         s.buffer=b; s.connect(AC.destination); s.start(0); }catch(_){}
    return AC;
  }
  /* ★2026-08-26b 起こしても動かないままの装置がある（電話・他アプリへの切り替えで
     iPhoneが音の仕組みごと止めることがあり、resume が効かない）。
     1秒たっても動かなければ、利用者の操作の中で装置を作り直す
     （作り直しは操作の中なら必ず動く＝§89「操作そのものの中で呼ぶ」と同じ決まり）。 */
  let deadSince=0;
  function ensureRunning(){
    let c=make(); if(!c)return null;
    if(c.state!=='running'){
      try{ c.resume(); }catch(_){}
      if(!deadSince) deadSince=Date.now();
      else if(Date.now()-deadSince>1000){
        try{ c.close(); }catch(_){}
        AC=null; deadSince=0; c=make();
        if(c && c.state!=='running'){ try{ c.resume(); }catch(_){} }
      }
    } else deadSince=0;
    return c;
  }
  function unlock(){ ensureRunning(); }
  addEventListener('pointerdown',unlock,{passive:true,capture:true});
  addEventListener('touchstart',unlock,{passive:true,capture:true});
  /* 画面が戻ってきたときは、止まっている音の装置を起こし直す
     （iPhoneは他のアプリに切り替えると止めることがある） */
  function wake(){ const c=AC; if(c && c.state!=='running'){ try{c.resume();}catch(_){} } }
  addEventListener('pageshow', wake);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) wake(); });

  /* 実際に音を出す部分。ここは「装置が動いている」ときだけ呼ぶ */
  function beep(c){
    const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t);        /* ラの音・単純でやわらかい */
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.38,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.07);
  }

  /* ★2026-07-31 「鳴ったり鳴らなかったり」の直し方
     iPhoneは、ページを開いた直後の音の装置が「止まった状態」で始まる。
     動き出す（resume）のは少し後なので、押してすぐ画面が変わると
     音が鳴る前に前のページが消えてしまう＝無音になっていた。
     そこで
       ・鳴らせたかどうかを返す（true＝すぐ鳴った）
       ・すぐ鳴らせなかったときは、動き出したら鳴らす（nnSoundReady で待てる）
     ようにして、ナビ側が「音が出るのを待ってから画面を移る」ようにした。 */
  window.nnSoundReady=null;
  window.nnMoveSound=function(){
    const now=Date.now(); if(now-last<160)return true; last=now;   /* 連続再生を抑える */
    try{
      const c=ensureRunning(); if(!c)return true;
      if(c.state==='running'){ beep(c); return true; }
      /* まだ動いていない：起こしてから鳴らす。ナビ側はこれを待てる */
      window.nnSoundReady=new Promise(function(res){
        let done=false;
        const fin=function(){ if(done)return; done=true; res(); };
        /* ★2026-08-26b 「起きてから鳴らす」だと、起きるのが遅い回は画面が変わって
           鳴らずじまいだった。止まった装置への予約は動き出した瞬間に鳴るので、
           先に鳴る予約だけ入れておく（＝鳴ったり鳴らなかったりの残りを解消）。 */
        try{ beep(c); }catch(_){}
        try{ const p=c.resume(); if(p&&p.then) p.then(fin, fin); else fin(); }catch(_){ fin(); }
        setTimeout(fin, 120);      /* 起きなくても待たせすぎない */
      });
      return false;
    }catch(_){ return true; }
  };
})();
</script>
<script>
/* ============ ナビ：指を触れたまま移動できる操作（2026-07-28 改） ============
   ・指を置いた瞬間にアイコンが光って音が鳴る
   ・そのまま 0.09秒 指が止まっていれば、離すのを待たずに移動する（＝速い）
   ・押したまま横へなぞると指の下のアイコンが反応し、離した先へ移動する
   ・アイコンの外で離せば移動しない（やめられる）
   ============================================================ */
(function(){
  const nav=document.getElementById('nav')||document.querySelector('nav');
  if(!nav)return;
  let dragging=false, cur=null;
  const itemAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('nav .ni'):null; };
  let lastSnd=0;
  function focus(ni){
    if(ni===cur)return;
    if(!ni)return;                     /* アイコンの隙間に指がかかっても、直前の選択を保つ
                                          （指のわずかな揺れで音が連発するのを防ぐ） */
    if(cur)cur.classList.remove('press');
    cur=ni; cur.classList.add('press');
    /* 音を鳴らす。すぐ鳴らせなかったときは、移動を少しだけ待つ（下の go を参照） */
    sndNow=true;
    if(window.nnMoveSound)try{ sndNow=(nnMoveSound()!==false); }catch(_){}
    /* ★先読みの fetch は削除（2026-07-28）。移動処理と取り合って遅くなっていた。 */
  }
  /* ★ここが「遅い」の正体だった（2026-07-28 画面録画の実測で判明）
     以前は「指を離したとき」に初めて移動していた。画面録画を1コマずつ調べると、
     アイコンが光ってから画面が変わるまで約0.9秒、その間まったく何も起きていない。
     ＝ページの読み込みが遅いのではなく、指を離すまで移動を始めていなかった。
     そこで「指を置いて 0.09秒たっても動かさなければ、離すのを待たずに移動する」
     方式にした。なぞって選び直したい場合（指を動かした場合）は今までどおり、
     指を離した先のアイコンへ移動する。 */
  const HOLD_MS=90;          /* この時間だけ指が止まっていたら、離すのを待たずに移動 */
  const MOVE_PX=10;          /* この距離より動いたら「なぞり操作」とみなす */
  let goTm=0, downPt=null, gone=false;
  let sndNow=true;
  function go(t){
    if(gone)return;
    if(!t||t.classList.contains('on'))return;
    const m=(t.getAttribute('onclick')||'').match(/navGo\('([^']*)'\s*,\s*'([^']*)'\)/);
    if(!(m&&typeof navGo==='function'))return;
    gone=true;
    /* ★音がすぐ鳴ったときは今までどおり即移動（速さは変えない）。
       鳴らなかったときだけ、音が出るのを最大0.16秒待ってから移動する。 */
    if(sndNow || !window.nnSoundReady){ navGo(m[1],m[2]); return; }
    let moved=false;
    const jump=function(){ if(moved)return; moved=true; navGo(m[1],m[2]); };
    try{ window.nnSoundReady.then(function(){ setTimeout(jump, 30); }); }catch(_){}
    setTimeout(jump, 160);
  }
  function cancelHold(){ if(goTm){clearTimeout(goTm); goTm=0;} }
  nav.addEventListener('pointerdown',e=>{
    const ni=e.target.closest&&e.target.closest('.ni'); if(!ni)return;
    dragging=true; cur=null; gone=false; downPt=[e.clientX,e.clientY]; focus(ni);
    try{nav.setPointerCapture(e.pointerId);}catch(_){}
    cancelHold();
    goTm=setTimeout(()=>{ goTm=0; go(cur); }, HOLD_MS);
  });
  nav.addEventListener('pointermove',e=>{
    if(!dragging)return;
    if(downPt && Math.abs(e.clientX-downPt[0])+Math.abs(e.clientY-downPt[1])>MOVE_PX) cancelHold();
    focus(itemAt(e.clientX,e.clientY));
  });
  function finish(e){
    if(!dragging)return;
    dragging=false; cancelHold();
    const t=cur; if(cur){cur.classList.remove('press'); cur=null;}
    go(t);
  }
  nav.addEventListener('pointerup',finish);
  nav.addEventListener('pointercancel',()=>{dragging=false; cancelHold(); if(cur){cur.classList.remove('press'); cur=null;}});

  nav.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); },true);
})();
</script>

       ブラウザで開いているときは下のバーの分だけ縮むのが正しいので、この直しは

         ・縮小して表示するページ（width=980）ではCSSのpxと合わないが、

      var scW = (innerWidth > innerHeight) ? Math.max(screen.width, screen.height)

    var s=[window.innerWidth, window.innerHeight,
           vv?Math.round(vv.width)+'x'+Math.round(vv.height):'-',
           nav?(nav.style.marginBottom+'|'+nav.style.transform+'|'+nav.className):'-',
           window.nnPZ||1];
    /* ★2026-08-26b ホーム画面から起動したiPhoneは、innerHeight が実際より小さい値の
       まま変わらないことがある（§5-2）。本当の下端（目印）は起動の少し後に伸びるが、
       申告値だけを見る合図では「変わっていない」ことになり、
       「変わったときだけ測る」（2026-08-24ab）が一度も測り直さない
       ＝画面の下に黒い帯が残っていた（実機で発生）。目印も合図に入れる。 */
    if(isStandalone()) s.push(Math.round(probeBottom()));
    if(VIEWS) for(var i=0;i<VIEWS.length;i++){
      var e=document.getElementById(VIEWS[i]);
      s.push(e?(e.className+'/'+(e.style.display||'')):'-');
    }
    return s.join(',');
  }
  function fill(force){
    if(!force){ var sg=fillSig(); if(sg===_fsig) return; _fsig=sg; }
    else _fsig=fillSig();
    /* ★2026-08-11a パソコンで表示倍率（zoom）をかけているときは、
       innerHeight（実画面のpx）をそのまま使うと body の高さが倍率ぶん大きくなる。
       倍率で割って「CSSのpx」に直す。 */
    var _z = window.nnPZ || 1;
    var pb = pageH() / _z;
    document.documentElement.style.setProperty('--nnvh', pb + 'px');
    /* ★2026-08-27h 下部ナビが position:fixed のページ（国交省仕様・現場マップ）では、
       ナビは「申告された画面の下端」に貼り付く。ホーム画面起動のiPhoneが高さを
       実際より小さく申告したままだと（§221）、ナビの下に帯が残る＝CSSでは直せない。
       本当の高さ（pb）との差のぶんだけ下へずらして、本当の下端に貼り直す。
       ふつうの端末・ふつうのページでは差が0なので何も変わらない。 */
    try{
      var _nv=document.getElementById('nav');
      if(_nv && getComputedStyle(_nv).position==='fixed'){
        var _d=Math.round(pb - innerHeight/_z);
        _nv.style.bottom=(_d>2)? (-_d+'px') : '';
      }
      /* ▲（ナビを出すボタン）も fixed なので、同じ差のぶん下げる（負の margin で押し下げる） */
      var _vt=document.getElementById('navShowTab');
      if(_vt){ var _d2=Math.round(pb - innerHeight/_z);
        _vt.style.marginBottom=(_d2>2)? (-_d2+'px') : ''; }
    }catch(_){}
    if(_z !== 1){                      /* 倍率をかけているときは下の余白うめをしない（パソコン用） */
      if(VIEWS) VIEWS.forEach(function(id){ var e=document.getElementById(id); if(e) e.style.minHeight=''; });
      return;
    }
    if(!VIEWS) return;
    var v = null;
    for(var i=0;i<VIEWS.length;i++){
      var e = document.getElementById(VIEWS[i]);
      if(e && e.offsetParent !== null){ v = e; break; }
    }
    if(!v) return;
    /* 下部ナビが場所を取っている高さ（自動で隠れているときは 0） */
    var navOcc = 0;
    var nav = document.getElementById('nav');
    if(nav){
      var ns = getComputedStyle(nav);
      if(ns.display !== 'none' && ns.position !== 'fixed' && ns.position !== 'absolute'){
        var mb = parseFloat(nav.style.marginBottom || '0') || 0;   /* 隠れているときは負の値 */
        navOcc = Math.max(0, nav.offsetHeight + mb);
      }
    }
    if(v.style.minHeight) v.style.minHeight = '';      /* いったん元に戻して測る */
    var r = v.getBoundingClientRect();
    var gap = (pb - navOcc) - r.bottom;                 /* 下に余っている高さ */
    if(gap > 2) v.style.minHeight = Math.round(r.height + gap) + 'px';
  }
  fill(true);
  addEventListener('load', function(){ fill(true); });
  /* ★2026-08-26b 起動直後は画面の高さが何度か変わる（起動アニメ・申告の遅れ）。
     合図が同じでも、最初だけは念のため測り直す（3回だけ・そのあとは今までどおり） */
  [300,1200,3000].forEach(function(t){ setTimeout(function(){ fill(true); }, t); });
  addEventListener('resize', function(){ fill(true); });
  addEventListener('orientationchange', function(){ setTimeout(function(){ fill(true); }, 300); });
  setInterval(fill, 800);        /* ナビの自動開閉・画面の切替に追従する */
  window.nnFillBottom = fill;
})();
</script>

<script id="nn-databk-js">
/* データの保存・復元。上の <style id="nn-databk"> とセット。 */
(function(){
"use strict";
/* 書き出し・読み込みの対象キー（このアプリが端末に保存しているものの全一覧）。
   ★新しい保存キーを増やしたら、ここにも1行足すこと（足れないと引っ越しで消える）。 */
const LIST=[
  ['nn_kirokucho_sched_v2','現場記録帳：工程表の編集'],

  ['nn_zumen_saves_v1','図面・積算：保存した図面'],
  ['nn_kirokucho_photo_v1','現場記録帳：現場の写真'],
  ['nn_kirokucho_faces_v1','現場記録帳：屋根・部位の内訳'],
  ['nn_kirokucho_draft_v1','現場記録帳：新規登録の下書き'],
  ['nn_specs_v1','仕様登録：登録した仕様'],
  ['nn_materials_v1','材料登録：登録した材料'],
  ['nn_lib_items','ライブラリ：現場写真'],
  ['nn_lib_reuse','ライブラリ：転用の設定'],
  ['nn_hacchu_hist','発注：発注の履歴'],
  ['nn_hacchu_myco','発注：自社の情報'],
  ['nn_yougo_stars','用語集：お気に入り'],
  ['osamari_custom_sites','現場マップ：登録した現場'],
  ['osamari_roofs','現場マップ：屋根の作図'],
  ['osamari_steps','現場マップ：段差ライン'],
  ['osamari_photos','現場マップ：写真'],
  ['osamari_pos_v2','現場マップ：位置の調整'],
  ['osamari_roof_h','現場マップ：屋根の高さ'],
  ['osamari_pin_alt','現場マップ：ピンの高さ'],
  ['osamari_gmaps_key','現場マップ：地図のかぎ（APIキー）'],
  ['osamari_geo_v8','現場マップ：住所検索の控え'],
  ['nn_tokui_v1','客先登録：元請・仕入業者'],
  ['nn_view_mode','設定：一覧／カードの表示'],
  ['kokko_view','設定：国交省仕様の表示'],
  ['osamari_fov','設定：3Dの画角'],
  ['osamari_panel_w','設定：一覧の幅'],
  /* ★2026-08-24z 図面・積算の見え方の設定も持ち出せるようにした（引っ越しで使い勝手が戻る） */
  ['nn_zumen_theme','設定：図面の昼／夜'],
  ['nn_zumen_grid','設定：図面のマス表示'],
  ['nn_zumen_dims','設定：図面の寸法表示'],
  ['nn_zumen_wfdim','設定：割付の寸法表示'],
  ['nn_zumen_split','設定：図面の2画面'],
  ['nn_zumen_rtblpos','設定：屋根の表の位置'],
];
let built=false;
function $(id){return document.getElementById(id);}
function build(){
  if(built)return; built=true;
  const w=document.createElement('div'); w.id='nnDataBk'; w.hidden=true;
  w.innerHTML=
    '<div class="bk-back"></div>'+
    '<div class="bk-card">'+
      '<div class="bk-head">💾 データの保存・復元<button class="bk-x" type="button" aria-label="閉じる">✕</button></div>'+
      '<div class="bk-body">'+
        '<p class="bk-note">この端末に保存されている入力データ（工程表の編集・図面・材料・写真など）を、'+
        '1つのファイルに書き出して保管できます。機種変更や別の端末への引っ越しのときは、'+
        '書き出しておいたファイルを新しい端末で読み込んでください。</p>'+
        '<div class="bk-btns">'+
          '<button class="bk-btn" type="button" id="nnBkExp">📤 書き出す<br><small>（ファイルに保存）</small></button>'+
          '<button class="bk-btn" type="button" id="nnBkImp">📥 読み込む<br><small>（ファイルから復元）</small></button>'+
        '</div>'+
        '<div class="bk-msg" id="nnBkMsg"></div>'+
        '<div class="bk-sum" id="nnBkSum"></div>'+
        '<input type="file" id="nnBkFile" accept=".json,application/json" hidden>'+
      '</div>'+
    '</div>';
  document.body.appendChild(w);
  w.querySelector('.bk-back').addEventListener('click',close);
  w.querySelector('.bk-x').addEventListener('click',close);
  $('nnBkExp').addEventListener('click',doExport);
  $('nnBkImp').addEventListener('click',function(){ $('nnBkFile').click(); });
  $('nnBkFile').addEventListener('change',onFile);
}
/* 保存の中身をやさしい言葉で数える（配列＝件数、{items:[…]}＝件数、それ以外＝「保存あり」） */
function cnt(raw){
  try{
    const d=JSON.parse(raw);
    if(Array.isArray(d))return d.length+'件';
    if(d&&Array.isArray(d.items))return d.items.length+'件';
    if(d&&typeof d==='object')return Object.keys(d).length+'件';
  }catch(_){}
  return '保存あり';
}
function summary(){
  const el=$('nnBkSum'); if(!el)return;
  let rows='', n=0;
  LIST.forEach(function(kv){
    const v=localStorage.getItem(kv[0]);
    if(v==null)return;
    n++;
    rows+='<div class="row"><span>'+kv[1]+'</span><span class="n">'+cnt(v)+'</span></div>';
  });
  el.innerHTML='<div class="t">いまこの端末にあるデータ（'+n+'種類）</div>'+
    (n? rows : '<div class="row"><span>まだ保存データがありません</span></div>');
}
function msg(t){ const el=$('nnBkMsg'); if(el)el.textContent=t||''; }
function close(){ const w=$('nnDataBk'); if(w)w.hidden=true; }
window.nnDataOpen=function(){ build(); summary(); msg(''); $('nnDataBk').hidden=false; };
/* いまの保存内容をファイル用の形にまとめる（検証からも使うので公開しておく） */
window.nnDataMake=function(){
  const out={app:'納まりナビ', kind:'nn_backup', ver:1, date:new Date().toISOString(), data:{}};
  LIST.forEach(function(kv){
    const v=localStorage.getItem(kv[0]);
    if(v!=null)out.data[kv[0]]=v;
  });
  return out;
};
function doExport(){
  const out=window.nnDataMake();
  const n=Object.keys(out.data).length;
  if(!n){ msg('書き出せるデータがまだありません。各ページで入力すると、ここから書き出せるようになります。'); return; }
  const d=new Date(), p=function(x){return String(x).padStart(2,'0');};
  const fname='osamarinavi_data_'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ try{URL.revokeObjectURL(a.href);}catch(_){} },4000);
  msg('「'+fname+'」（'+n+'種類）を書き出しました。\niPhoneは共有画面が開いたら「"ファイル"に保存」を選んでください。');
  try{ localStorage.setItem('nn_bk_last', String(Date.now())); }catch(_){}
  try{ var el=document.getElementById('nnBkNag'); if(el) el.remove(); }catch(_){}
}
/* ファイルの中身をこの端末に書き込む（検証からも使うので公開しておく） */
window.nnDataApply=function(obj){
  const data=obj&&obj.data;
  if(!(obj&&obj.kind==='nn_backup'&&data&&typeof data==='object')){
    msg('このファイルは納まりナビのデータではないようです。書き出したときの .json ファイルを選んでください。');
    return false;
  }
  const known={}; LIST.forEach(function(kv){known[kv[0]]=1;});
  const keys=Object.keys(data).filter(function(k){return known[k]&&typeof data[k]==='string';});
  if(!keys.length){ msg('読み込めるデータが入っていませんでした。'); return false; }
  const when=(obj.date||'').slice(0,10);
  if(!confirm('ファイルの中身（'+keys.length+'種類'+(when?'・'+when+'に書き出し':'')+'）で、この端末の保存データを上書きします。よろしいですか？'))return false;
  let ok=0, ng=[];
  keys.forEach(function(k){
    try{ localStorage.setItem(k,data[k]); ok++; }
    catch(e){ ng.push(k); }   /* 容量オーバー等。写真が多いと起こり得る */
  });
  summary();
  msg(ng.length
    ? '一部を読み込めませんでした（端末の保存容量が足りない可能性）：'+ng.length+'種類。読み込めた分：'+ok+'種類。'
    : '読み込みました（'+ok+'種類）。各ページを開くと反映されています。');
  return ng.length===0;
};
function onFile(ev){
  const f=ev.target.files&&ev.target.files[0];
  ev.target.value='';                      /* 同じファイルをもう一度選べるように */
  if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    let obj=null;
    try{ obj=JSON.parse(String(r.result)); }
    catch(_){ msg('ファイルを読めませんでした。書き出したときの .json ファイルを選んでください。'); return; }
    window.nnDataApply(obj);
  };
  r.onerror=function(){ msg('ファイルを読めませんでした。'); };
  r.readAsText(f);
}
})();
</script>

<style id="nn-pczoom">
/* ★2026-08-11a パソコンの「表示の大きさ」をモニターに関わらずそろえる（本人の指示）
   ------------------------------------------------------------------
   同じ拡大100%でも、大きいモニター（横に広い）ほど1画面に入るpxが増えるので、
   文字やボタンが相対的に小さく見える。そこで
     倍率 ＝ 画面の横幅 ÷ 1600px（1.00〜1.60の範囲）
   を html に zoom でかけ、どのモニターでも同じ見え方になるようにした。
   ★スマホ（data-nnphone="1"）は今までどおり。倍率はかけない。
   ★2026-08-11b：手動の倍率ボタンは削除（パソコンはブラウザの拡大縮小が使えるため）。 */

<script id="nn-pczoom-js">
(function(){
  if(document.documentElement.getAttribute('data-nnphone')==='1'){ window.nnPZ=1; return; }
  var BASE=1600, MINZ=1.00, MAXZ=1.60;
  function autoZ(){
    var z=(window.innerWidth||1600)/BASE;
    z=Math.round(z*20)/20;                       /* 0.05きざみ */
    return Math.min(MAXZ, Math.max(MINZ, z));
  }
  function apply(){
    var z=autoZ();
    window.nnPZ=z;
    document.documentElement.style.zoom = (z===1 ? '' : z);
    document.documentElement.style.setProperty('--nnpzr', z);
    document.documentElement.setAttribute('data-nnpz', z===1 ? 'off' : 'on');
    try{ if(window.nnFillBottom) window.nnFillBottom(); }catch(e){}
    try{ if(window.nnFitMapApp) window.nnFitMapApp(); }catch(e){}
    try{ if(window.nnSecRefresh) window.nnSecRefresh(); }catch(e){}
  }
  apply();
  addEventListener('resize', apply);
})();
</script>

<script id="nn-trail-js">
/* ============================================================
   指をなぞると光がついてくる（2026-08-19b・本人の指示）
   線を引く・頂点をつまむ等の細かい操作で「いま指がどこにあるか」が分かるようにする。
   ・画面いっぱいの透明なキャンバスを1枚だけ用意し、指が触れている間だけ描く
   ・座標は clientX/Y をそのまま「画面の実px」として使う（表示倍率 zoom の影響を受けない）
   ・pointer-events:none なので、下のボタンや作図の邪魔は一切しない
   ============================================================ */
(function(){
"use strict";
var cv=null, ctx=null, pts=[], raf=null, active=false, lastT=0;
var LIFE=420;                     /* 光が消えるまで(ms) */
function make(){
  if(cv)return;
  cv=document.createElement('canvas');
  cv.id='nnTrail';
  cv.style.cssText='position:fixed; left:0; top:0; width:100%; height:100%;'
    +'pointer-events:none; z-index:9997;';
  document.body.appendChild(cv);
  ctx=cv.getContext('2d');
}
function fit(){
  var r=cv.getBoundingClientRect();
  /* ★2026-08-26b にじむ光なので等倍で十分。2倍だと描く画素が4倍になり、
     指を置いている間ずっとその分の仕事が挟まっていた（ラグの一因）。 */
  var d=1;
  var w=Math.round(r.width*d), h=Math.round(r.height*d);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  return {r:r, k:cv.width/(r.width||1)};   /* k＝画面px→キャンバスpxの倍率（＝dpr） */
}
function draw(){
  if(!cv){ raf=null; return; }
  var g=fit(), k=g.k, now=performance.now();
  ctx.clearRect(0,0,cv.width,cv.height);
  /* 寿命の切れた点を落とす */
  while(pts.length && now-pts[0].t>LIFE) pts.shift();
  if(pts.length>=2){
    /* しっぽ：新しいほど太く明るい */
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var age=(now-b.t)/LIFE; if(age<0)age=0; if(age>1)age=1;
      var al=(1-age)*0.85;
      /* ★2026-08-26b shadowBlur（にじみ）は1本ごとにぼかし計算が走って重いのでやめ、
         「太く薄い線＋細く明るい線」の2度がきで同じ見え方にする */
      ctx.strokeStyle='rgba(255,180,40,'+(al*0.30).toFixed(3)+')';
      ctx.lineWidth=(7+12*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
      ctx.strokeStyle='rgba(255,217,77,'+al.toFixed(3)+')';
      ctx.lineWidth=(2.5+6*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
    }
  }
  /* 指の先の光 */
  if(active && pts.length){
    var p=pts[pts.length-1];
    var gr=ctx.createRadialGradient(p.x*k,p.y*k,0, p.x*k,p.y*k,9*k);
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.45,'rgba(255,217,77,.80)');
    gr.addColorStop(1,'rgba(255,157,30,0)');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(p.x*k,p.y*k,9*k,0,7); ctx.fill();
  }
  if(active || pts.length){ raf=requestAnimationFrame(draw); }
  else { raf=null; ctx.clearRect(0,0,cv.width,cv.height); }
}
function add(e){
  var now=performance.now();
  if(now-lastT<8) return;          /* 詰めすぎない */
  lastT=now;
  pts.push({x:e.clientX, y:e.clientY, t:now});
  if(pts.length>90) pts.shift();
  if(!raf) raf=requestAnimationFrame(draw);
}
var downX=0, downY=0, movedOn=false;
addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse' && e.buttons===0) return;
  /* ★2026-08-26b タップ（動かさない指）では何も描かない。
     以前は押した瞬間から画面いっぱいのキャンバスを毎コマ描き直していて、
     ボタンを押すたびにその仕事が挟まっていた（ラグの一因）。
     7px以上なぞったときだけ描き始める（なぞりの光は今までどおり）。 */
  active=true; movedOn=false; downX=e.clientX; downY=e.clientY;
},true);
addEventListener('pointermove',function(e){
  if(!active)return;
  if(!movedOn){
    if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)<7) return;
    movedOn=true; make(); pts.length=0;
    pts.push({x:downX, y:downY, t:performance.now()});
  }
  add(e);
},true);
function end(){ active=false; movedOn=false; if(!raf&&cv&&pts.length) raf=requestAnimationFrame(draw); }
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  addEventListener(ev,end,true);
});
})();
</script>

<script id="nn-bknag-js">
/* ★2026-08-20a バックアップの促し。データが端末の中にしか無いのがこのアプリの弱点なので、
   「30日以上書き出していない＆保存データがある」ときだけ、ホームに1行だけ出す。
   [あとで]＝7日間出さない。書き出すと消える（doExport が nn_bk_last を控える）。 */
(function(){
try{
  var now=Date.now();
  var snooze=+localStorage.getItem('nn_bk_snooze')||0; if(now<snooze) return;
  var last=+localStorage.getItem('nn_bk_last')||0;
  if(now-last < 30*864e5) return;
  var has=false;
  for(var i=0;i<localStorage.length;i++){ if(/^nn_|^osamari_|^kokko_/.test(localStorage.key(i))){ has=true; break; } }
  if(!has) return;
  var d=document.createElement('div'); d.id='nnBkNag';
  d.innerHTML='<span>💾 データのバックアップが30日以上ありません（データはこの端末の中だけに保存されています）</span>'
    +'<button type="button" id="nnBkGo">書き出す</button><button type="button" id="nnBkLater">あとで</button>';
  document.body.appendChild(d);
  document.getElementById('nnBkGo').onclick=function(){ d.remove(); if(window.nnDataOpen) nnDataOpen(); };
  document.getElementById('nnBkLater').onclick=function(){
    try{ localStorage.setItem('nn_bk_snooze', String(now+7*864e5)); }catch(_){}
    d.remove();
  };
}catch(e){}
})();
</script>

<script id="nn-persist-js">
/* ★2026-08-20a データ保全：ブラウザに「この保存は消さないで」と頼む。
   頼んでおくと、端末の容量が逼迫したときに localStorage が自動削除されにくくなる
   （iOS/Android とも対応。使えない環境では黙って何もしない）。 */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}

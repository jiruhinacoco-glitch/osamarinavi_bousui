<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="納まりナビ">
<meta name="robots" content="noindex, nofollow">
<title>納まりナビ – ホーム</title>
<link rel="stylesheet" href="common.css">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   納まりナビ ホーム画面（横画面前提・縦でも崩れない）
   20260724_レイアウト変更について(スマホヨコ画面) rev.01 対応版
   ・全体を小さく詰めてメイン画面（3D背景）を広く使う
   ・左上：納まりナビ＋会社名（小）／施工中物件バナー（小）
   ・右上：メニュー→［付箋｜設定］→用語集（小・右寄せ）
   ・右下：お知らせ（小型・右寄せ）＋直上に切替ドット
   ・下部ナビ：アイコンを従来の0.8倍に縮小（9個構成）
   ============================================================ */
:root{
  /* green-deep/green/green-lite/paper は common.css に移動 */
  --green-hi:#48c274; --green-edge:#124a28;
  --orange:#ff9d1e; --orange-deep:#e07800; --orange-edge:#b35f00;
  --yellow:#ffd94d; --yellow-deep:#f0b400;
  --edge-gray:#8b8b81; --edge-dark:#1b201d;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  color:#fff;
  /* 背景：画像が置かれれば表示、無ければ下のグレー格子（Blender風）が出る */
  background-color:#3a3d3c;
  background-image:
    url('./images/bg_home.png'),
    repeating-linear-gradient(0deg,  rgba(255,255,255,.05) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 42px);
  background-size:cover, auto, auto;
  background-position:center, 0 0, 0 0;
  background-repeat:no-repeat, repeat, repeat;
}

/* ---------- 上部：納まりナビロゴ＋会社名（画面の角にぴったり・小） ---------- */
header{
  flex:none; display:flex; align-items:flex-start; gap:0;
  padding:0;
  padding-top:env(safe-area-inset-top);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
.applogo{
  background:linear-gradient(180deg,#245c3a,#183f27);
  color:#fff; font-weight:900; letter-spacing:.05em; white-space:nowrap;
  font-size:clamp(11px,1.9vw,14px); padding:4px 12px;
  border:1px solid #0d2a18; box-shadow:0 2px 4px rgba(0,0,0,.4);
}
.applogo em{font-style:normal; color:var(--yellow);}
.company{
  background:#fff; color:#4a504c; font-weight:700; letter-spacing:.12em; white-space:nowrap;
  font-size:clamp(11px,1.9vw,14px); padding:4px 16px;
  box-shadow:0 2px 4px rgba(0,0,0,.4);
}
header .sp{flex:1;}
/* 【押せる】ハンバーガー（準備中） */
#menuBtn{
  flex:none; width:38px; height:38px; border-radius:50%; border:2px solid #fff;
  background:linear-gradient(180deg,#4e8fe0,#2f6fd6); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3.5px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 0 #1c4c9c;
  transition:transform .06s, box-shadow .06s;
  margin:6px 10px 0 0;
}
#menuBtn:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 0 0 #1c4c9c;}
#menuBtn i{display:block; width:17px; height:2.5px; border-radius:2px; background:#fff;}

/* ---------- 本体（背景の上にパネルを配置） ---------- */
main{flex:1; min-height:0; position:relative;}

/* 施工中物件バナー（左上・右端斜めカット・小） */
.bukken-banner{
  position:absolute; left:0; top:14px;
  background:linear-gradient(180deg,#33b264,#23934e);
  color:#fff; font-weight:900; letter-spacing:.08em; white-space:nowrap;
  font-size:clamp(12px,2.2vw,15px); padding:4px 28px 4px 14px;
  padding-left:calc(14px + env(safe-area-inset-left));
  clip-path:polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
  text-shadow:0 1px 1px rgba(18,74,40,.55);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
}

/* お知らせ＋切替ドットの箱（右下・ドットは常にお知らせの真上） */
.newsbox{
  position:absolute; right:12px; bottom:8px;
  display:flex; flex-direction:column; align-items:center; gap:5px;
}
/* 物件切替ドット（小） */
.dots{
  display:flex; gap:6px; align-items:center;
  background:rgba(17,28,21,.75); border-radius:999px; padding:3px 9px;
}
.dots .dot{
  width:8px; height:8px; border-radius:50%; background:#77857c; cursor:pointer;
  transition:background .15s, transform .15s;
}
.dots .dot.on{background:#3fe087; transform:scale(1.15); box-shadow:0 0 4px rgba(63,224,135,.8);}

/* お知らせ（小型・右寄せ） */
.notice{
  width:min(320px, 40vw);
  background:#fff; color:var(--ink);
  border:1px solid #b8b48e; box-shadow:0 3px 8px rgba(0,0,0,.35);
  font-size:9.5px; line-height:1.5;
}
.notice .ttl{
  background:linear-gradient(180deg,#3f9e53,#2c7a41);
  color:#fff; font-weight:900; text-align:center; letter-spacing:.2em;
  font-size:10.5px; padding:2px 8px; text-shadow:0 1px 1px rgba(18,74,40,.55);
}
.notice .bd{padding:4px 9px 6px; max-height:72px; overflow-y:auto;}
.notice .item b{font-weight:900; font-size:10px;}
.notice .item .dt{font-weight:900; color:#7a6a20; font-size:10px;}
.notice .item .tx{color:#6b736e;}
.notice .sep{border:0; border-top:1px dashed #a9a06a; margin:4px 0;}

/* ---------- 右側クイック（［付箋｜設定］→用語集・小・右寄せ） ---------- */
.quick{
  position:absolute; right:10px; top:8px;
  display:flex; flex-direction:column; align-items:flex-end; gap:8px;
}
.quick .qrow{display:flex; align-items:center; gap:8px;}
/* 登録済仕様の付箋（コンパクト） */
.fusen{
  position:relative;
  background:#fff; color:#222826;
  border:1px solid #d7dcd4; box-shadow:0 2px 6px rgba(0,0,0,.4);
  text-align:center; padding:5px 12px 4px;
  font-weight:900; letter-spacing:.03em; font-size:10.5px;
  white-space:nowrap;
}
.fusen .pin{
  position:absolute; top:3px; width:7px; height:7px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff7a66, #c22014 70%);
  box-shadow:0 1px 1px rgba(0,0,0,.5);
}
.fusen .pin.l{left:4px;} .fusen .pin.r{right:4px;}
.fusen .sep{border:0; border-top:1.5px dashed #9aa39c; margin:4px 0;}
/* 【押せる】設定・用語集アイコンボタン（小）
   ナビ用アイコン画像は下部に緑ラベルが焼き込まれているため、
   上部のアイコン部分だけを表示し、ラベルは白ピルで付ける */
.qbtn{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  cursor:pointer; border:0; background:none; font-family:inherit;
  transition:transform .1s ease-out;
}
.qbtn .icwrap{height:33px; overflow:hidden; border-radius:6px; box-shadow:0 2px 3px rgba(0,0,0,.4);}
.qbtn img{height:50px; display:block;}
.qbtn .lbl{
  background:#fff; color:#222826; font-weight:900; font-size:9.5px; letter-spacing:.08em;
  border-radius:999px; padding:1px 10px; box-shadow:0 1px 3px rgba(0,0,0,.4);
}
.qbtn:hover{transform:scale(1.06);}
.qbtn:active{transform:scale(.94);}

/* ---------- 下部ナビ（共通ナビ・ホームは9個構成） ---------- */
nav{
  flex:none; background:#202623; display:flex; gap:4px; padding:6px 8px; overflow-x:auto;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
}
nav .ni{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfd6d1;
  font-size:12px; font-weight:700; padding:5px 13px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
nav .ni .ic{font-size:23px; line-height:1;}
nav .ni:hover{background:#333b37;}
nav .ni.on{background:var(--green); color:#fff;}
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
nav::-webkit-scrollbar{display:none;}

/* 【押せる】下部ナビ（ゲームUI質感） */
nav#nav, body>nav{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,#1f5c36,#153f25) !important;
  border-top:2px solid #0d2a18;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
  gap:3px; padding:4px 7px;
  padding-bottom:calc(4px + env(safe-area-inset-bottom));
}
nav .ni, nav#nav .ni{
  color:#cfe6d6; font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:7px;
  transition:transform .06s;
}
nav .ni .ic, nav#nav .ni .ic{font-size:19px; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));}
nav .ni:hover, nav#nav .ni:hover{background:rgba(255,255,255,.10);}
nav .ni:active, nav#nav .ni:active{transform:translateY(1px);}
nav .ni.on, nav#nav .ni.on{
  background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));
  color:#4d3a00; border:1.5px solid #a87f00;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #7d5f00;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
/* 画像アイコンボタン（rev.01 ⑥：既存×0.8倍 56px→45px） */
nav .ni .ic img, nav#nav .ni .ic img{height:45px; display:block;}
nav .ni.hasimg, nav#nav .ni.hasimg{padding:2px 3px;}
nav .ni.hasimg > span:last-child, nav#nav .ni.hasimg > span:last-child{display:none;}
nav .ni.hasimg .ic, nav#nav .ni.hasimg .ic{filter:none;}
nav .ni.hasimg.on, nav#nav .ni.hasimg.on{background:none; border:none; box-shadow:none; text-shadow:none;
  filter:drop-shadow(0 0 5px #ffd23f) drop-shadow(0 0 2px #ffd23f);
  transform:scale(1.14);
  transform-origin:center bottom;
  z-index:2; position:relative;
}
nav .ni.hasimg, nav#nav .ni.hasimg{transition:transform .15s ease-out, filter .15s ease-out;}
nav .ni.hasimg:hover, nav#nav .ni.hasimg:hover{transform:scale(1.06);}
nav .ni.hasimg.on:hover, nav#nav .ni.hasimg.on:hover{transform:scale(1.14);}
nav, nav#nav{overflow:visible; padding-top:5px;}
@media (max-width:760px){
  nav, nav#nav{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; justify-content:flex-start;}
  nav::-webkit-scrollbar, nav#nav::-webkit-scrollbar{display:none;}
  /* rev.01 ⑥：既存×0.8倍 48px→38px */
  nav .ni .ic img, nav#nav .ni .ic img{height:38px;}
  nav .ni:first-child, nav#nav .ni:first-child{margin-left:0;}
  nav .ni:last-child, nav#nav .ni:last-child{margin-right:0;}
}

/* ---------- タップ演出（タッチ発光） ---------- */
@keyframes tapfx-glow{
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
  60%{opacity:.7;}
  100%{opacity:0; transform:translate(-50%,-50%) scale(2.1);}
}
@keyframes tapfx-ring{
  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.8);}
}
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);
  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .3s ease-out forwards;
}
.tapfx::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:2px solid rgba(255,217,77,.9);
  animation:tapfx-ring .3s ease-out forwards;
}

/* ---------- 縦画面：パネルを縦積みにして崩れを防ぐ ---------- */
@media (orientation:portrait){
  main{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 14px; display:flex; flex-direction:column; gap:14px;}
  .bukken-banner{position:static; align-self:flex-start; margin-left:-14px;}
  .quick{position:static; flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:center; gap:16px;}
  .newsbox{position:static; width:100%; margin-top:auto;}
  .notice{width:100%;}
  .notice .bd{max-height:none;}
}
</style>
</head>
<body>

<header>
  <div class="applogo">納まり<em>ナビ</em></div>
  <div class="company">株式会社〇〇〇〇</div>
  <div class="sp"></div>
  <button id="menuBtn" onclick="alert('メニューは準備中です')" aria-label="メニュー"><i></i><i></i><i></i></button>
</header>

<main>
  <!-- 施工中物件（ダミー） -->
  <div class="bukken-banner">施工中物件：７件</div>

  <!-- 右側クイック：［付箋｜設定］＋用語集 -->
  <div class="quick">
    <div class="qrow">
      <div class="fusen">
        <span class="pin l"></span><span class="pin r"></span>
        登録済仕様：20件
        <hr class="sep">
        作成中：3件
      </div>
      <button class="qbtn" onclick="navGo('settei','設定')">
        <span class="icwrap"><img src="./icons/nav_settei.png" alt="設定" onerror="this.parentElement.outerHTML='⚙️'"></span>
        <span class="lbl">設定</span>
      </button>
    </div>
    <button class="qbtn" onclick="navGo('yougo','用語集')">
      <span class="icwrap"><img src="./icons/nav_yougo.png" alt="用語集" onerror="this.parentElement.outerHTML='📖'"></span>
      <span class="lbl">用語集</span>
    </button>
  </div>

  <!-- 右下：物件切替ドット（ダミー5件・将来3Dモデルと連動）＋お知らせ -->
  <div class="newsbox">
  <div class="dots" id="dots"></div>
  <section class="notice">
    <div class="ttl">お知らせ</div>
    <div class="bd">
      <div class="item">
        <span class="dt">2026.7.23</span>
        <b>【3DCGアニメーション追加】</b><br>
        <span class="tx">ウレタン塗膜防水の断熱通気工法の3DCGを新たに追加しました。</span>
      </div>
      <hr class="sep">
      <div class="item">
        <span class="dt">2026.7.20</span>
        <b>【材料追加】</b><br>
        <span class="tx">アルミ笠木の各種サイズを新たに追加しました。</span>
      </div>
    </div>
  </section>
  </div>
</main>

<nav id="nav"></nav>

<script>
/* ---------- 物件切替ドット（ダミー：将来3Dモデルと連動） ---------- */
const BUKKEN_COUNT=5;
let bukkenIdx=0;
function buildDots(){
  const d=document.getElementById('dots');
  d.innerHTML=Array.from({length:BUKKEN_COUNT},(_,i)=>`<span class="dot ${i===bukkenIdx?'on':''}" onclick="setBukken(${i})"></span>`).join('');
}
function setBukken(i){ bukkenIdx=i; buildDots(); }
buildDots();

/* ---------- 共通下部ナビ（kirokucho_demo から移植） ----------
   ホーム画面のみ：用語集・設定は画面右側のボタンに移したため
   ナビからは外した9個構成（レイアウト変更指示書 2026-07-23） */
const ICONS={
  home:'🏠', kiroku:'📋', map:'🗺️', hacchu:'📝', kokkou:'📗', camera:'📷',
  library:'📁', zumen:'📐', zairyo:'🧱', shiyou:'📚', yougo:'📖', settei:'⚙️',
};
const NAV=[['home','ホーム'],['kiroku','現場記録帳'],['map','現場マップ'],['hacchu','発注'],['kokkou','国交省仕様'],['camera','カメラ'],
           ['library','ライブラリ'],['zumen','図面/積算'],['shiyou','仕様・材料']];
/* 同じフォルダに置いた各ページへのリンク（ファイル名を合わせれば繋がる） */
const NAV_LINKS={home:'./index.html', kiroku:'./kirokucho_demo.html', map:'./genba_map_v36.html', hacchu:'./hacchu.html', kokkou:'./kokkosho.html',
                 camera:'./camera.html', library:'./library.html', yougo:'./yougo.html',
                 zairyo:'./zairyo_toroku.html', shiyou:'./shiyo_toroku.html'};
const NAV_ACTIVE='home';
function navGo(k,label){
  if(k===NAV_ACTIVE)return;
  if(NAV_LINKS[k]){ location.href=encodeURI(NAV_LINKS[k]); }
  else alert('「'+label+'」は準備中です');
}
function buildNav(){
  const n=document.getElementById('nav');
  n.innerHTML=NAV.map(([k,l])=>{
    const suf=(k===NAV_ACTIVE)?'_on':'';
    return `<div class="ni ${k===NAV_ACTIVE?'on':''}" onclick="navGo('${k}','${l}')">
      <span class="ic"><img src="./icons/nav_${k}${suf}.png" alt="${l}"
        onload="this.closest('.ni').classList.add('hasimg')"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='./icons/nav_${k}.png';}
                 else{this.outerHTML=ICONS['${k}']||'▫️';}"></span><span>${l}</span></div>`;
  }).join('');
  /* あふれ時：アクティブなボタンを中央に */
  const on=n.querySelector('.ni.on');
  if(on && n.scrollWidth>n.clientWidth){
    const d=on.getBoundingClientRect().left-n.getBoundingClientRect().left;
    n.scrollLeft+=d-(n.clientWidth-on.offsetWidth)/2;
  }
}
buildNav();

/* ---------- タップ演出（発光＋タップ音・kirokucho_demo から移植） ---------- */
(function(){
  /* ゲーム風タップ音（Web Audio合成・音源ファイル不要） */
  let AC=null;
  function ctx(){
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  function tapSound(){
    try{
      const c=ctx(), t=c.currentTime;
      // 明るい「ピコッ」：矩形波の短い上昇ブリップ
      const o=c.createOscillator(), g=c.createGain();
      o.type='square';
      o.frequency.setValueAtTime(620,t);
      o.frequency.exponentialRampToValueAtTime(1040,t+0.035);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.16,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.10);
      // 下支えの「ポッ」：サイン波の短い下降
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(300,t);
      o2.frequency.exponentialRampToValueAtTime(170,t+0.055);
      g2.gain.setValueAtTime(0.10,t);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
      o2.connect(g2).connect(c.destination);
      o2.start(t); o2.stop(t+0.08);
    }catch(e){}
  }

  /* タッチ発光 */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    el.style.left=x+'px'; el.style.top=y+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 340);
  }

  /* イベント委譲：発光＝どこでも／音＝押せる要素のみ */
  const PRESSABLE='button, .ni, .dot, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    const hit=e.target.closest(PRESSABLE);
    if(hit && !hit.disabled){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();
</script>

<style id="nn-safearea">
/* ============================================================
   iPhone横画面フルスクリーン対応（ノッチ左右の帯をなくす）
   viewport-fit=cover とセットで機能する。
   バー類の中身はセーフエリア分だけ内側に寄せる。
   縦画面・PCでは env() が 0 になるため影響しない。
   ※ホーム画面は上部バーがデザインの一部のため、横画面でも隠さない。
   ============================================================ */
@media (orientation:landscape) and (max-height:500px){
  nav{
    padding-left:calc(10px + env(safe-area-inset-left,0px)) !important;

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<script id="nn-phonemark">
/* ★端末そのものの幅を見て <html> に data-nnphone="1" を付ける
   （縮小表示のページでは CSS の画面幅が常に980pxになり、画面幅では判定できない） */
(function(){try{
  var d = Math.min(screen.width||0, screen.height||0);
  if(d && d < 700) document.documentElement.setAttribute('data-nnphone','1');
}catch(e){}})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>納まりナビ – ホーム</title>
<link rel="stylesheet" href="common.css">
<!-- ============================================================
     ★2026-07-28 画面が出るまでが遅い原因は、ここにあった。
     Zen Kaku Gothic New は日本語フォント。Googleはこれを
     「約120個に小分けした指定 × 太さ3種 ＝ 約360個の指定（81KB）」
     という形のCSSで配ってくる。ページを開くたびに、この360個の指定を
     すべて読み込んで、画面上のすべての文字と照合してから描き始めるため、
     中身の重さと関係なく、毎回まるまる待たされていた。

     実測（同一条件）：このCSSがあると画面が出るまでの時間が約2倍
       ホーム        1,152ms → 2,288ms
       現場記録帳    1,940ms → 3,592ms
       現場マップ      544ms →   532ms （このCSSを読まないページ＝変化なし）
     ※「現場マップだけ速い」のは、このページがフォントを読んでいなかったため。

     → 既定では読み込まない。iPhone内蔵の游ゴシック系（ヒラギノ）で表示する。
       下の NN_WEBFONT を true にすると、画面が出たあとに読み込んで
       Zen Kaku Gothic New に切り替える（見た目優先・表示は少し遅くなる）。
     ============================================================ -->
<script>
const NN_WEBFONT=false;       /* true にすると Zen Kaku Gothic New を後読みする */
if(NN_WEBFONT){
  addEventListener('load',()=>setTimeout(()=>{
    const l=document.createElement('link'); l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap';
    document.head.appendChild(l);
  },300));
}
</script>
<!-- rel=prefetch は Safari が非対応で効かず、他ブラウザでは余計な通信になるため削除（2026-07-28） -->
<style>
/* ============================================================
   納まりナビ ホーム画面（横画面前提・縦でも崩れない）
   20260724_レイアウト変更 rev.02 対応版
   手本PDFを実測し、iPhone横画面（844×390）基準の寸法で配置。
   ※実機のノッチ余白(env)は「パネル位置」には加算しない
   　（加算すると全体が内側に寄りすぎて手本とズレるため）
   ============================================================ */
:root{
  /* green-deep/green/green-lite/paper は common.css に移動 */
  --green-hi:#48c274; --green-edge:#124a28;
  --orange:#ff9d1e; --orange-deep:#e07800; --orange-edge:#b35f00;
  --yellow:#ffd94d; --yellow-deep:#f0b400;
  --edge-gray:#8b8b81; --edge-dark:#1b201d;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  color:#fff;
  /* 背景：画像が置かれれば表示、無ければ下のグレー格子（Blender風）が出る */
  background-color:#3a3d3c;
  background-image:
    url('./images/bg_home.webp'),   /* 740KB/2.0MP のPNG → 90KB/1.3MP のWebPへ差し替え（表示は約980px幅） */
    repeating-linear-gradient(0deg,  rgba(255,255,255,.05) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 42px);
  background-size:cover, auto, auto;
  background-position:center, 0 0, 0 0;
  background-repeat:no-repeat, repeat, repeat;
}

/* ---------- 上部：納まりナビロゴ＋会社名（手本実測：上20px・左22px・高さ23px） ---------- */
header{
  flex:none; display:flex; align-items:flex-start;
  padding:20px 0 0 22px;
  padding-top:calc(20px + env(safe-area-inset-top));
}
.applogo{
  background:linear-gradient(180deg,#245c3a,#183f27);
  color:#fff; font-weight:900; letter-spacing:.06em; white-space:nowrap;
  font-size:15px; line-height:1; padding:4px 13px 4px;
  border:1px solid #0d2a18; box-shadow:0 2px 4px rgba(0,0,0,.4);
}
.applogo em{font-style:normal; color:var(--yellow);}
.company{
  background:#fff; color:#4a504c; font-weight:700; letter-spacing:.14em; white-space:nowrap;
  font-size:14px; line-height:1; padding:4.5px 18px 4.5px;
  box-shadow:0 2px 4px rgba(0,0,0,.4);
}

/* ---------- 本体（背景の上にパネルを配置） ---------- */
main{flex:1; min-height:0; position:relative;}

/* 施工中物件バナー（手本実測：左14px・高さ22px・文字16px・両端斜め） */
.bukken-banner{
  position:absolute; left:14px; top:12px;
  background:linear-gradient(180deg,#33b264,#23934e);
  color:#fff; font-weight:900; letter-spacing:.1em; white-space:nowrap;
  font-size:16px; line-height:1; padding:3px 26px 3px 14px;
  clip-path:polygon(9px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  text-shadow:0 1px 1px rgba(18,74,40,.55);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
}

/* ---------- 右側クイック（手本実測：右12pxに密着・縦一列） ----------
   メニュー → ［付箋｜設定］ → 用語集 */
.quick{
  /* top:-22px＝ヘッダー帯と同じ高さにメニューを置く（手本実測：上23px） */
  position:absolute; right:12px; top:-22px;
  display:flex; flex-direction:column; align-items:flex-end; gap:9px;
}
.quick .qrow{display:flex; align-items:center; gap:10px;}
/* 【押せる】ハンバーガー（準備中） */
#menuBtn{
  flex:none; width:40px; height:40px; border-radius:50%; border:2px solid #fff;
  background:linear-gradient(180deg,#4e8fe0,#2f6fd6); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3.5px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 0 #1c4c9c;
  transition:transform .06s, box-shadow .06s;
  margin-right:4px;
}
#menuBtn:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 0 0 #1c4c9c;}
#menuBtn i{display:block; width:18px; height:2.5px; border-radius:2px; background:#fff;}
/* 登録済仕様の付箋（手本実測：約110×55px・文字11px） */
.fusen{
  position:relative;
  background:#fff; color:#222826;
  border:1px solid #d7dcd4; box-shadow:0 2px 6px rgba(0,0,0,.4);
  text-align:center; padding:7px 12px 6px;
  font-weight:900; letter-spacing:.02em; font-size:11px; line-height:1;
  white-space:nowrap;
}
.fusen .pin{
  position:absolute; top:3px; width:7px; height:7px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff7a66, #c22014 70%);
  box-shadow:0 1px 1px rgba(0,0,0,.5);
}
.fusen .pin.l{left:4px;} .fusen .pin.r{right:4px;}
.fusen .sep{border:0; border-top:1.5px dashed #9aa39c; margin:6px 0;}
/* 【押せる】設定・用語集アイコンボタン
   ナビ用アイコン画像は下部に緑ラベルが焼き込まれているため、
   上部のアイコン部分だけを表示し、ラベルは白ピルで付ける */
.qbtn{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  cursor:pointer; border:0; background:none; font-family:inherit;
  transition:transform .1s ease-out;
}
.qbtn .icwrap{height:34px; overflow:hidden; border-radius:6px; box-shadow:0 2px 3px rgba(0,0,0,.4);}
.qbtn img{height:52px; display:block;}
.qbtn .lbl{
  background:#fff; color:#222826; font-weight:900; font-size:9px; letter-spacing:.1em;
  border-radius:999px; padding:1.5px 11px; box-shadow:0 1px 3px rgba(0,0,0,.4);
}
.qbtn:hover{transform:scale(1.06);}
.qbtn:active{transform:scale(.94);}
.quick > .qbtn{margin-right:2px;}

/* ---------- 右下：お知らせ＋切替ドット（手本実測：右12px・高さ約70px） ---------- */
.newsbox{
  /* rev.03 ①：ナビと重ならないよう少し上に */
  position:absolute; right:12px; bottom:26px;
  display:flex; flex-direction:column; align-items:center; gap:5px;
}
/* 物件切替ドット（小） */
.dots{
  display:flex; gap:6px; align-items:center;
  background:rgba(17,28,21,.75); border-radius:999px; padding:3px 9px;
}
.dots .dot{
  width:8px; height:8px; border-radius:50%; background:#77857c; cursor:pointer;
  transition:background .15s, transform .15s;
}
.dots .dot.on{background:#3fe087; transform:scale(1.15); box-shadow:0 0 4px rgba(63,224,135,.8);}
/* お知らせ（小型・スクロールバー常時表示） */
.notice{
  width:min(315px, 40vw);
  background:#fff; color:var(--ink);
  border:1px solid #b8b48e; box-shadow:0 3px 8px rgba(0,0,0,.35);
  font-size:8.5px; line-height:1.45;
}
.notice .ttl{
  background:linear-gradient(180deg,#3f9e53,#2c7a41);
  color:#fff; font-weight:900; text-align:center; letter-spacing:.25em;
  font-size:10px; padding:2px 8px; text-shadow:0 1px 1px rgba(18,74,40,.55);
}
.notice .bd{
  padding:3px 8px 5px; max-height:52px; overflow-y:auto;
  scrollbar-width:thin; scrollbar-color:#2c7a41 #e4e8e2;
}
/* スクロールバーを常に見せる（rev.02 ④） */
.notice .bd::-webkit-scrollbar{width:5px;}
.notice .bd::-webkit-scrollbar-track{background:#e4e8e2; border-radius:3px;}
.notice .bd::-webkit-scrollbar-thumb{background:#2c7a41; border-radius:3px;}
.notice .item b{font-weight:900; font-size:9.5px;}
.notice .item .dt{font-weight:900; color:#7a6a20; font-size:9.5px;}
.notice .item .tx{color:#6b736e;}
.notice .sep{border:0; border-top:1px dashed #a9a06a; margin:3px 0;}

/* ---------- 下部ナビ（手本：帯は薄く、アイコンが帯の上にはみ出す） ---------- */
nav{
  flex:none; background:#202623; display:flex; gap:4px; padding:6px 8px; overflow-x:auto;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
}
nav .ni{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfd6d1;
  font-size:12px; font-weight:700; padding:5px 13px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
nav .ni .ic{font-size:23px; line-height:1;}
nav .ni:hover{background:#333b37;}
nav .ni.on{background:var(--green); color:#fff;}
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
nav::-webkit-scrollbar{display:none;}

/* 【押せる】下部ナビ（ゲームUI質感） */
nav#nav, body>nav{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,#1f5c36,#153f25) !important;
  border-top:2px solid #0d2a18;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
  gap:3px; padding:2px 7px;
  /* rev.03 ②：アイコンの文字が画面下ギリギリに来るよう、下の余白は付けない */
  padding-bottom:2px;
}
nav .ni, nav#nav .ni{
  color:#cfe6d6; font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:7px;
  transition:transform .06s;
}
nav .ni .ic, nav#nav .ni .ic{font-size:19px; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));}
nav .ni:hover, nav#nav .ni:hover{background:rgba(255,255,255,.10);}
nav .ni:active, nav#nav .ni:active{transform:translateY(1px);}
nav .ni.on, nav#nav .ni.on{
  background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));
  color:#4d3a00; border:1.5px solid #a87f00;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #7d5f00;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
/* 画像アイコンボタン（rev.02 ⑤：帯を薄くしアイコンを上にはみ出させる） */
nav .ni .ic img, nav#nav .ni .ic img{height:44px; display:block;}
nav .ni.hasimg, nav#nav .ni.hasimg{padding:0 3px; margin-top:-13px;}
nav .ni.hasimg > span:last-child, nav#nav .ni.hasimg > span:last-child{display:none;}
nav .ni.hasimg .ic, nav#nav .ni.hasimg .ic{filter:none;}
nav .ni.hasimg.on, nav#nav .ni.hasimg.on{background:none; border:none; box-shadow:none; text-shadow:none;
  filter:drop-shadow(0 0 5px #ffd23f) drop-shadow(0 0 2px #ffd23f);
  transform:scale(1.14);
  transform-origin:center bottom;
  z-index:2; position:relative;
}
nav .ni.hasimg, nav#nav .ni.hasimg{transition:transform .15s ease-out, filter .15s ease-out;}
nav .ni.hasimg:hover, nav#nav .ni.hasimg:hover{transform:scale(1.06);}
nav .ni.hasimg.on:hover, nav#nav .ni.hasimg.on:hover{transform:scale(1.14);}
nav, nav#nav{overflow:visible; padding-top:2px;}
@media (max-width:760px){
  /* 縦持ち等の狭い幅：横スクロールになるため、はみ出し表示はやめて帯内に収める */
  nav, nav#nav{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; justify-content:flex-start;}
  nav::-webkit-scrollbar, nav#nav::-webkit-scrollbar{display:none;}
  nav .ni .ic img, nav#nav .ni .ic img{height:38px;}
  nav .ni.hasimg, nav#nav .ni.hasimg{margin-top:0;}
  nav .ni:first-child, nav#nav .ni:first-child{margin-left:0;}
  nav .ni:last-child, nav#nav .ni:last-child{margin-right:0;}
}

/* ---------- タップ演出（タッチ発光） ---------- */
@keyframes tapfx-glow{
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
  60%{opacity:.7;}
  100%{opacity:0; transform:translate(-50%,-50%) scale(2.1);}
}
@keyframes tapfx-ring{
  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.8);}
}
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);
  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .3s ease-out forwards;
}
.tapfx::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:2px solid rgba(255,217,77,.9);
  animation:tapfx-ring .3s ease-out forwards;
}

/* ---------- 縦画面：パネルを縦積みにして崩れを防ぐ ---------- */
@media (orientation:portrait){
  header{padding-left:14px;}
  main{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 14px; display:flex; flex-direction:column; gap:14px;}
  .bukken-banner{position:static; align-self:flex-start; margin-left:-14px;}
  .quick{position:static; flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:center; gap:16px;}
  .newsbox{position:static; width:100%; margin-top:auto; margin-bottom:4px;}
  .notice{width:100%;}
  .notice .bd{max-height:none;}
  /* rev.03 タテ②：ナビのアイコンを2段構成に（横スクロールをやめて折り返し） */
  nav, nav#nav{
    flex-wrap:wrap; overflow-x:visible; justify-content:center; row-gap:2px;
    padding-bottom:calc(2px + env(safe-area-inset-bottom));
  }
}
</style>

<!-- 版の表示：スマホに届いている中身がどれかを、お互いに確認するための小さな印。
     不要になったらこの1行と #nnver の指定を消してください。 -->
<div id="nnver">v2026-08-03 e</div>
<script>
/* ============ 実機の計測結果を表示（原因調査用・2026-07-28） ============
   数字の意味（単位はミリ秒）
     net  ＝要求してから最初の返事が来るまで（通信の待ち時間）
     recv ＝中身を受け取り終わるまで
     bld  ＝受け取ってから組み立て終わるまで（解析＋JS実行）
     出  ＝画面に中身が出た時刻
     KB   ＝通信で受け取った量（0＝端末の保存から出した＝通信していない）
   原因が分かったらこの表示ごと外します。 */
(function(){
  const el=document.getElementById('nnver'); if(!el)return;
  let open=false;
  function draw(){
    const ver='v'+(window.nnVerNow||'?').replace(/^(\d{4})-(\d{2})-(\d{2})/,'$1-$2-$3 ');
    if(!open){ el.textContent=ver; return; }
    let a=[]; try{a=JSON.parse(sessionStorage.getItem('nnPerf')||'[]');}catch(_){}
    const c=(x,w)=>String(x).padStart(w);
    let t=ver+'  net recv  bld   出   KB\n';
    a.slice(-5).forEach(r=>{
      t+=`${(r.p+'        ').slice(0,8)}${c(r.net,6)}${c(r.recv,5)}${c(r.build,5)}${c(r.paint,5)}${c(r.kb,5)}\n`;
    });
    const L=a[a.length-1];
    if(L)t+=`部品${L.res}個 ${L.rkb}KB ／ フォント${L.fn}個 ${L.fms}ms\n最も遅い部品 ${L.sl}\n公開中の版 ${window.nnVerNew||'?'}（この画面 ${window.nnVerNow||'?'}）`;
    if(!a.length)t+='（現場記録帳へ行って戻ると出ます）';
    el.textContent=t;
  }
  el.addEventListener('click',()=>{open=!open; el.classList.toggle('open',open); draw();});
  addEventListener('load',()=>setTimeout(draw,700));
  draw();
})();
</script>

<script>
/* ---------- 物件切替ドット（ダミー：将来3Dモデルと連動） ---------- */
const BUKKEN_COUNT=5;
let bukkenIdx=0;
function buildDots(){
  const d=document.getElementById('dots');
  d.innerHTML=Array.from({length:BUKKEN_COUNT},(_,i)=>`<span class="dot ${i===bukkenIdx?'on':''}" onclick="setBukken(${i})"></span>`).join('');
}
function setBukken(i){ bukkenIdx=i; buildDots(); }
buildDots();

/* ---------- 共通下部ナビ（kirokucho_demo から移植） ----------
   ホーム画面のみ：用語集・設定は画面右側のボタンに移したため
   ナビからは外した9個構成（レイアウト変更指示書 2026-07-23） */
const ICONS={
  home:'🏠', kiroku:'📋', map:'🗺️', hacchu:'📝', kokkou:'📗', camera:'📷',
  library:'📁', zumen:'📐', zairyo:'🧱', shiyou:'📚', yougo:'📖', settei:'⚙️',
};
const NAV=[['home','ホーム'],['kiroku','現場記録帳'],['map','現場マップ'],['hacchu','発注'],['kokkou','国交省仕様'],['camera','カメラ'],
           ['library','ライブラリ'],['zumen','図面/積算'],['shiyou','仕様・材料']];
/* 同じフォルダに置いた各ページへのリンク（ファイル名を合わせれば繋がる） */
const NAV_LINKS={home:'./index.html', kiroku:'./kirokucho_demo.html', map:'./genba_map_v36.html', hacchu:'./hacchu.html', kokkou:'./kokkosho.html',
                 camera:'./camera.html', library:'./library.html', yougo:'./yougo.html',
                 zumen:'./zumen_sekisan.html',
                 zairyo:'./zairyo_toroku.html', shiyou:'./shiyo_toroku.html'};
const NAV_ACTIVE='home';
function navGo(k,label){
  if(k===NAV_ACTIVE)return;
  if(NAV_LINKS[k]){ nnGoPage(encodeURI(NAV_LINKS[k])); }
  else alert('「'+label+'」は準備中です');
}
/* ページ移動：一瞬フェードしてから移動する（画面が固まったように見えるのを防ぐ） */
window.nnGoPage=function(url){
  /* ★指を離した瞬間（＝タップした瞬間）に、画面いちばん上へ細い進行バーを出す。
     次のページが出来上がるまでの数百ミリ秒、「反応した」ことが必ず目に見える。
     画面は隠さないので、前の画面はそのまま見えたまま。 */
  try{
    if(!document.getElementById('nnbar')){
      const bar=document.createElement('div'); bar.id='nnbar'; bar.innerHTML='<i></i>';
      document.body.appendChild(bar);
      setTimeout(()=>{try{bar.remove();}catch(_){}} ,4000);   /* 念のための自動消去 */
    }
  }catch(_){}
  document.body.classList.add('nn-leaving');
  location.href=url;
};
/* ★先読みの fetch は削除（2026-07-28）。
   ページは端末に保存済みなので先読みの意味がなく、指が触れた瞬間に
   別の取得処理を走らせることで、肝心の画面移動と処理を取り合っていた。 */
function buildNav(){
  const n=document.getElementById('nav');
  n.innerHTML=NAV.map(([k,l])=>{
    const suf=(k===NAV_ACTIVE)?'_on':'';
    return `<div class="ni ${k===NAV_ACTIVE?'on':''}" onclick="navGo('${k}','${l}')">
      <span class="ic"><img src="./icons/nav_${k}${suf}.png" alt="${l}"
        onload="this.closest('.ni').classList.add('hasimg')"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='./icons/nav_${k}.png';}
                 else{this.outerHTML=ICONS['${k}']||'▫️';}"></span><span>${l}</span></div>`;
  }).join('');
  /* あふれ時：アクティブなボタンを中央に
     ★位置の計測（scrollWidth や getBoundingClientRect）は「画面をいったん組み上げる」
       処理なので、ここで行うと画面が出るまでの待ち時間が伸びる。
       画面を出したあと（次の描画のタイミング）にまわす。 */
  addEventListener('load',()=>{
    const on=n.querySelector('.ni.on');
    if(on && n.scrollWidth>n.clientWidth){
      const d=on.getBoundingClientRect().left-n.getBoundingClientRect().left;
      n.scrollLeft+=d-(n.clientWidth-on.offsetWidth)/2;
    }
  },{once:true});
}
buildNav();

/* ---------- タップ演出（発光＋タップ音・kirokucho_demo から移植） ---------- */
(function(){
  /* ゲーム風タップ音（Web Audio合成・音源ファイル不要） */
  let AC=null;
  function ctx(){
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  function tapSound(){
    try{
      const c=ctx(), t=c.currentTime;
      // やわらかい水滴風の「ぽん」：低めのサイン波2音（耳に優しい音量）
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(523,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.06,t+0.010);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.15);
      // 軽く上に抜ける倍音
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(784,t);
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.03,t+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
      o2.connect(g2).connect(c.destination);
      o2.start(t+0.005); o2.stop(t+0.12);
    }catch(e){}
  }

  /* タッチ発光 */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    el.style.left=x+'px'; el.style.top=y+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 340);
  }

  /* イベント委譲：発光＝どこでも／音＝押せる要素のみ */
  const PRESSABLE='button, .dot, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    /* ★下部ナビは専用の音（nav_move.wav）を鳴らすので、ここでは鳴らさない。
       [onclick] にナビも含まれてしまい、1回のタップで2種類の音が重なって
       「ココンコン」と聞こえていた原因。 */
    const hit=e.target.closest('nav .ni')?null:e.target.closest(PRESSABLE);
    if(hit && !hit.disabled){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();
</script>

<script>
/* ページ移動を通信ゼロで一瞬にする（サービスワーカーで全ページを端末に常駐させる） */
/* ============ 版チェック（2026-07-28） ============
   端末には速さのためページを保存しているので、こちらで直しても
   古いものが出続けることがある。そこで ver.txt（数バイト）だけを
   毎回見に行き、公開版と違っていたら保存分を捨てて1回だけ読み直す。
   ★公開のたびに ver.txt と、下の NN_VER を同じ文字に更新すること。 */
const NN_VER='2026-08-03e';
/* ============ 表示にかかった時間の記録（原因調査用・2026-07-28） ============
   スマホの実機でどこに時間がかかっているかを数字で出す。
   ・net  ＝ページを要求してから最初の返事が来るまで（通信の待ち）
   ・recv ＝中身を受け取り終わるまで
   ・build＝受け取ってから組み立て終わるまで（解析・JS実行）
   ・paint＝画面に中身が出たとき
   結果はホーム画面の左上に出る。原因が分かったらこの仕組みごと外す。 */
addEventListener('load',()=>{setTimeout(()=>{
  try{
    const n=performance.getEntriesByType('navigation')[0]; if(!n)return;
    const fcp=performance.getEntriesByType('paint').filter(p=>p.name==='first-contentful-paint')[0];
    const rs=performance.getEntriesByType('resource');
    let slow=null, rkb=0, fontMs=0, fontN=0;
    rs.forEach(r=>{ rkb+=(r.transferSize||0);
      if(!slow||r.duration>slow.duration)slow=r;
      if(/fonts\.(googleapis|gstatic)/.test(r.name)){fontN++; fontMs=Math.max(fontMs, Math.round(r.responseEnd));}});
    const rec={p:(location.pathname.split('/').pop()||'index').replace('.html','').slice(0,8),
      net:Math.round(n.responseStart), recv:Math.round(n.responseEnd),
      build:Math.round(n.domContentLoadedEventEnd), paint:fcp?Math.round(fcp.startTime):-1,
      load:Math.round(n.loadEventEnd), kb:Math.round((n.transferSize||0)/1024),
      res:rs.length, rkb:Math.round(rkb/1024), fn:fontN, fms:fontMs,
      sl:slow?((slow.name.split('/').pop()||'').slice(0,14)+':'+Math.round(slow.duration)):''};
    const a=JSON.parse(sessionStorage.getItem('nnPerf')||'[]'); a.push(rec);
    sessionStorage.setItem('nnPerf',JSON.stringify(a.slice(-7)));
  }catch(_){}
},400);});
const NN_PAGES=['./index.html','./kirokucho_demo.html','./genba_map_v36.html','./hacchu.html',
  './kokkosho.html','./camera.html','./library.html','./shiyo_toroku.html','./zairyo_toroku.html','./yougo.html','./common.css'];
window.nnVerNow=NN_VER;
(async function(){
  try{
    const r=await fetch('./ver.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const v=(await r.text()).trim();
    window.nnVerNew=v;
    if(!v || v===NN_VER)return;
    /* ★2026-07-28 修正：以前は保存分を消して読み直すだけだったが、
       Safari自身が持っている一時保存（HTTPキャッシュ）は消えないため、
       読み直しても古いページが出続けて更新が止まることがあった。
       全ページを cache:'reload' で取り直してから読み直す。 */
    const n=parseInt(sessionStorage.getItem('nnUpdN_'+v)||'0',10);
    if(n>=2)return;                                   /* 失敗が続いたら止める安全弁 */
    sessionStorage.setItem('nnUpdN_'+v,String(n+1));
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    await Promise.all(NN_PAGES.map(u=>fetch(u,{cache:'reload'}).catch(()=>{})));
    location.reload();
  }catch(_){}
})();
</script>
<script>
/* ★2026-07-28：更新が端末に届かない問題への対策
   ・毎回「新しい版が出ていないか」を確認する（r.update()）
   ・新しい版に切り替わったら、その場で1回だけ自動で読み込み直す
     （＝「再読み込み2回」が不要になり、直したことが必ず反映される） */
/* ★2026-07-28 検証：サービスワーカーを一時的に止める
   ホーム(37KB)も現場記録帳(300KB)も、どちらもタップから約0.9秒。
   中身の重さが10倍近く違うのに時間が同じ＝ページの組み立てではなく、
   移動のたびにかかる「決まった待ち時間」がある、ということ。
   iPhoneのSafariでは、この保存の仕組み（サービスワーカー）が
   眠っていると、移動のたびに起こす時間が数百ミリ秒かかることが知られている。
   → いったん止めて、これが原因かを確かめる。
   NN_USE_SW を true に戻せば、オフライン対応ごと元に戻せる。 */
const NN_USE_SW=false;
if('serviceWorker' in navigator){
  if(NN_USE_SW){
    let nnReloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(nnReloaded)return; nnReloaded=true; location.reload();
    });
    addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(r=>{
        try{r.update();}catch(_){}
        if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage('nn-precache');
      }).catch(()=>{});
    });
  }else{
    /* すでに入っている分を取り除き、保存分も消す（1回だけ読み直す） */
    addEventListener('load',async()=>{
      try{
        const rs=await navigator.serviceWorker.getRegistrations();
        if(rs.length){
          await Promise.all(rs.map(r=>r.unregister()));
          if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));}
          if(!sessionStorage.getItem('nnSwOff')){ sessionStorage.setItem('nnSwOff','1'); location.reload(); }
        }
      }catch(_){}
    });
  }
}
</script>
<script>
/* ============ ナビの操作音（2026-07-28 作り直し） ============
   ★以前は <audio> を2個ずつ用意して音源ファイル(nav_move.wav)を
     読ませていたが、iPhoneでは音声部品の準備が重く、しかも
     いつ終わるか読めないため、画面が出るまでの待ち時間に影響していた。
     → 音源ファイルをやめ、その場で音を合成する方式（Web Audio）に変更。
       ファイル読み込みゼロ・部品ゼロ・音は今までと同じ「やわらかい1音」。
   ============================================================ */
(function(){
  /* ★2026-07-28 音が出たり出なかったりした原因
     ①音の装置(AudioContext)を「ナビを最初に押したとき」に作っていた。
       iPhoneでは作った直後は停止状態で、動き出すまでに少し時間がかかるため、
       その1回目の音が鳴らないことがあった。
     ②画面移動が0.09秒後に始まるので、音が長いと途中で切れていた。
     → 装置は「画面のどこかを最初に触った時点」で作って動かしておく。
       音は0.07秒に短くして、移動が始まる前に鳴り終わるようにする。 */
  let AC=null, last=0;
  function make(){
    if(AC)return AC;
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    try{ AC=new C(); }catch(_){ return null; }
    /* 無音を1粒だけ鳴らして、iPhoneの音の仕組みを起こしておく */
    try{ const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
         s.buffer=b; s.connect(AC.destination); s.start(0); }catch(_){}
    return AC;
  }
  function unlock(){ const c=make(); if(c && c.state==='suspended'){ try{c.resume();}catch(_){} } }
  addEventListener('pointerdown',unlock,{passive:true,capture:true});
  addEventListener('touchstart',unlock,{passive:true,capture:true});
  /* 画面が戻ってきたときは、止まっている音の装置を起こし直す
     （iPhoneは他のアプリに切り替えると止めることがある） */
  function wake(){ const c=AC; if(c && c.state!=='running'){ try{c.resume();}catch(_){} } }
  addEventListener('pageshow', wake);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) wake(); });

  /* 実際に音を出す部分。ここは「装置が動いている」ときだけ呼ぶ */
  function beep(c){
    const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t);        /* ラの音・単純でやわらかい */
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.38,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.07);
  }

  /* ★2026-07-31 「鳴ったり鳴らなかったり」の直し方
     iPhoneは、ページを開いた直後の音の装置が「止まった状態」で始まる。
     動き出す（resume）のは少し後なので、押してすぐ画面が変わると
     音が鳴る前に前のページが消えてしまう＝無音になっていた。
     そこで
       ・鳴らせたかどうかを返す（true＝すぐ鳴った）
       ・すぐ鳴らせなかったときは、動き出したら鳴らす（nnSoundReady で待てる）
     ようにして、ナビ側が「音が出るのを待ってから画面を移る」ようにした。 */
  window.nnSoundReady=null;
  window.nnMoveSound=function(){
    const now=Date.now(); if(now-last<160)return true; last=now;   /* 連続再生を抑える */
    try{
      const c=make(); if(!c)return true;
      if(c.state==='running'){ beep(c); return true; }
      /* まだ動いていない：起こしてから鳴らす。ナビ側はこれを待てる */
      window.nnSoundReady=new Promise(function(res){
        let done=false;
        const fire=function(){ if(done)return; done=true; try{ beep(c); }catch(_){} res(); };
        try{ const p=c.resume(); if(p&&p.then) p.then(fire, fire); else fire(); }catch(_){ fire(); }
        setTimeout(fire, 120);      /* 起きなくても待たせすぎない */
      });
      return false;
    }catch(_){ return true; }
  };
})();
</script>
<script>
/* ============ ナビ：指を触れたまま移動できる操作（2026-07-28 改） ============
   ・指を置いた瞬間にアイコンが光って音が鳴る
   ・そのまま 0.09秒 指が止まっていれば、離すのを待たずに移動する（＝速い）
   ・押したまま横へなぞると指の下のアイコンが反応し、離した先へ移動する
   ・アイコンの外で離せば移動しない（やめられる）
   ============================================================ */
(function(){
  const nav=document.getElementById('nav')||document.querySelector('nav');
  if(!nav)return;
  let dragging=false, cur=null;
  const itemAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('nav .ni'):null; };
  let lastSnd=0;
  function focus(ni){
    if(ni===cur)return;
    if(!ni)return;                     /* アイコンの隙間に指がかかっても、直前の選択を保つ
                                          （指のわずかな揺れで音が連発するのを防ぐ） */
    if(cur)cur.classList.remove('press');
    cur=ni; cur.classList.add('press');
    /* 音を鳴らす。すぐ鳴らせなかったときは、移動を少しだけ待つ（下の go を参照） */
    sndNow=true;
    if(window.nnMoveSound)try{ sndNow=(nnMoveSound()!==false); }catch(_){}
    /* ★先読みの fetch は削除（2026-07-28）。移動処理と取り合って遅くなっていた。 */
  }
  /* ★ここが「遅い」の正体だった（2026-07-28 画面録画の実測で判明）
     以前は「指を離したとき」に初めて移動していた。画面録画を1コマずつ調べると、
     アイコンが光ってから画面が変わるまで約0.9秒、その間まったく何も起きていない。
     ＝ページの読み込みが遅いのではなく、指を離すまで移動を始めていなかった。
     そこで「指を置いて 0.09秒たっても動かさなければ、離すのを待たずに移動する」
     方式にした。なぞって選び直したい場合（指を動かした場合）は今までどおり、
     指を離した先のアイコンへ移動する。 */
  const HOLD_MS=90;          /* この時間だけ指が止まっていたら、離すのを待たずに移動 */
  const MOVE_PX=10;          /* この距離より動いたら「なぞり操作」とみなす */
  let goTm=0, downPt=null, gone=false;
  let sndNow=true;
  function go(t){
    if(gone)return;
    if(!t||t.classList.contains('on'))return;
    const m=(t.getAttribute('onclick')||'').match(/navGo\('([^']*)'\s*,\s*'([^']*)'\)/);
    if(!(m&&typeof navGo==='function'))return;
    gone=true;
    /* ★音がすぐ鳴ったときは今までどおり即移動（速さは変えない）。
       鳴らなかったときだけ、音が出るのを最大0.16秒待ってから移動する。 */
    if(sndNow || !window.nnSoundReady){ navGo(m[1],m[2]); return; }
    let moved=false;
    const jump=function(){ if(moved)return; moved=true; navGo(m[1],m[2]); };
    try{ window.nnSoundReady.then(function(){ setTimeout(jump, 30); }); }catch(_){}
    setTimeout(jump, 160);
  }
  function cancelHold(){ if(goTm){clearTimeout(goTm); goTm=0;} }
  nav.addEventListener('pointerdown',e=>{
    const ni=e.target.closest&&e.target.closest('.ni'); if(!ni)return;
    dragging=true; cur=null; gone=false; downPt=[e.clientX,e.clientY]; focus(ni);
    try{nav.setPointerCapture(e.pointerId);}catch(_){}
    cancelHold();
    goTm=setTimeout(()=>{ goTm=0; go(cur); }, HOLD_MS);
  });
  nav.addEventListener('pointermove',e=>{
    if(!dragging)return;
    if(downPt && Math.abs(e.clientX-downPt[0])+Math.abs(e.clientY-downPt[1])>MOVE_PX) cancelHold();
    focus(itemAt(e.clientX,e.clientY));
  });
  function finish(e){
    if(!dragging)return;
    dragging=false; cancelHold();
    const t=cur; if(cur){cur.classList.remove('press'); cur=null;}
    go(t);
  }
  nav.addEventListener('pointerup',finish);
  nav.addEventListener('pointercancel',()=>{dragging=false; cancelHold(); if(cur){cur.classList.remove('press'); cur=null;}});
  /* 上の処理で移動するので、通常のクリックは止める（二重に移動しないように） */
  nav.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); },true);
})();
</script>

<script id="nn-fillh-js">
/* ============================================================
   画面のいちばん下まで使い切る（2026-07-29）
   ・--nnvh ＝ 実際に見えている画面の高さ
   ・表示中の画面（一覧・ダッシュボード等）の下に余りがあれば、そのぶん伸ばす
   　（すき間があるときだけ動くので、余りが無ければ何もしない）
   ============================================================ */
(function(){
  var VIEWS = null;
  /* ホーム画面のアイコンから起動しているか（＝全画面のアプリとして開いているか） */
  function isStandalone(){
    try{
      if(navigator.standalone === true) return true;
      return matchMedia('(display-mode: standalone)').matches
          || matchMedia('(display-mode: fullscreen)').matches;
    }catch(e){ return false; }
  }
  /* 画面のいちばん下に貼っておく、見えない1pxの目印。
     ★iPhoneをたてに持つと、端末が申告してくる「画面の高さ」が
       実際に見えている高さより小さいことがある（このページのように
       画面を縮めて表示していると起きる）。その申告値をそのまま使うと、
       画面の下のほうに何も置かれない帯（すき間）が残ってしまう。
       目印は画面の下端に貼り付いているので、その位置を測れば
       「本当の下端」が分かる。 */
  var probe = null;
  function probeBottom(){
    if(!probe || !probe.parentNode){
      probe = document.createElement('div');
      probe.id = 'nnBtmProbe';
      probe.setAttribute('style','position:fixed;left:0;bottom:0;width:1px;height:1px;'
        + 'pointer-events:none;opacity:0;z-index:-1;');
      (document.body || document.documentElement).appendChild(probe);
    }
    return probe.getBoundingClientRect().bottom;
  }
  function pageH(){
    var vv = window.visualViewport;
    var h = innerHeight;
    /* 文字入力でキーボードが出ると visualViewport は小さくなるので、大きいほうを採る */
    if(vv && vv.height > h) h = vv.height;
    /* 目印のほうが下にあれば、そちらが本当の下端。
       ブラウザで開いているときは下のバーの分だけ縮むのが正しいので、この直しは
       ホーム画面から起動したときだけ効かせる。あり得ない大きさは念のため採らない。 */
    if(isStandalone()){
      var t = probeBottom();
      if(t > h + 1 && t < h * 3) h = t;
    }
    return Math.round(h);
  }
  function fill(){
    var pb = pageH();
    document.documentElement.style.setProperty('--nnvh', pb + 'px');
    if(!VIEWS) return;
    var v = null;
    for(var i=0;i<VIEWS.length;i++){
      var e = document.getElementById(VIEWS[i]);
      if(e && e.offsetParent !== null){ v = e; break; }
    }
    if(!v) return;
    /* 下部ナビが場所を取っている高さ（自動で隠れているときは 0） */
    var navOcc = 0;
    var nav = document.getElementById('nav');
    if(nav){
      var ns = getComputedStyle(nav);
      if(ns.display !== 'none' && ns.position !== 'fixed' && ns.position !== 'absolute'){
        var mb = parseFloat(nav.style.marginBottom || '0') || 0;   /* 隠れているときは負の値 */
        navOcc = Math.max(0, nav.offsetHeight + mb);
      }
    }
    if(v.style.minHeight) v.style.minHeight = '';      /* いったん元に戻して測る */
    var r = v.getBoundingClientRect();
    var gap = (pb - navOcc) - r.bottom;                 /* 下に余っている高さ */
    if(gap > 2) v.style.minHeight = Math.round(r.height + gap) + 'px';
  }
  fill();
  addEventListener('load', fill);
  addEventListener('resize', fill);
  addEventListener('orientationchange', function(){ setTimeout(fill, 300); });
  setInterval(fill, 800);        /* ナビの自動開閉・画面の切替に追従する */
  window.nnFillBottom = fill;
})();
</script>

<script id="nn-sbar-js">
(function(){
  /* スクロールする箱の候補。ページ全体を総当たりすると重いので、
     各ページで実際に使われている枠に絞る（見つからなければページ全体に付ける）。 */
  var SEL = 'main,#view,#content,#list,#detail,#mainview,#schedview,#dashboard,#grid,'
          + '.wrap,.sp-tblwrap,.tbwrap,.listwrap,#app';
  var sb=null, thumb=null, target=null, raf=0, drag=null, tick=0;

  function build(){
    sb=document.createElement('div'); sb.id='nnSb';
    thumb=document.createElement('i'); sb.appendChild(thumb);
    document.body.appendChild(sb);
    thumb.addEventListener('pointerdown', function(e){
      if(!target) return;
      drag={y:e.clientY, top:parseFloat(thumb.style.top)||0,
            trackH:sb.clientHeight, th:thumb.offsetHeight};
      try{ thumb.setPointerCapture(e.pointerId); }catch(_){}
      e.preventDefault();
    });
    thumb.addEventListener('pointermove', function(e){
      if(!drag || !target) return;
      var maxTop=Math.max(0, drag.trackH-drag.th);
      var t=Math.min(maxTop, Math.max(0, drag.top + (e.clientY-drag.y)));
      thumb.style.top=t+'px';
      var sh=target.scrollHeight, ch=target.clientHeight;
      var to=(maxTop ? t/maxTop : 0) * (sh-ch);
      if(target===win()) scrollTo(0,to); else target.scrollTop=to;
    });
    function end(){ drag=null; }
    thumb.addEventListener('pointerup', end);
    thumb.addEventListener('pointercancel', end);
  }
  function win(){ return document.scrollingElement || document.documentElement; }
  function isPage(el){ return el===win() || el===document.body || el===document.documentElement; }

  function findPane(){
    var best=null, area=0, list=document.querySelectorAll(SEL);
    for(var i=0;i<list.length;i++){
      var e=list[i];
      if(e.id==='nnSb') continue;
      var cs=getComputedStyle(e);
      if(cs.display==='none' || cs.visibility==='hidden') continue;
      if(!/auto|scroll/.test(cs.overflowY)) continue;
      if(e.scrollHeight <= e.clientHeight+4) continue;
      var r=e.getBoundingClientRect();
      if(r.width<60 || r.height<80) continue;
      if(r.bottom<0 || r.top>innerHeight) continue;
      var a=r.width*r.height;
      if(a>area){ area=a; best=e; }
    }
    if(best) return best;
    var de=win();
    return (de.scrollHeight > de.clientHeight+4) ? de : null;
  }
  function onScroll(){ if(!raf) raf=requestAnimationFrame(function(){ raf=0; sync(false); }); }

  function sync(research){
    if(!sb) build();
    /* 箱探しは重いので、いまの箱が使えなくなったときと、ときどきだけ行う */
    var need = research || !target ||
      (!isPage(target) && (!target.offsetParent || target.scrollHeight<=target.clientHeight+4));
    if(need){
      var el=findPane();
      if(el!==target){
        if(target) (isPage(target)?window:target).removeEventListener('scroll', onScroll);
        target=el;
        if(target) (isPage(target)?window:target).addEventListener('scroll', onScroll, {passive:true});
      }
    }
    if(!target){ sb.classList.remove('on'); return; }
    var sh=target.scrollHeight, ch=target.clientHeight;
    if(sh<=ch+4){ sb.classList.remove('on'); return; }
    var top, h;
    if(isPage(target)){ top=6; h=Math.max(60, innerHeight-12); }
    else{
      var r=target.getBoundingClientRect();
      top=Math.round(Math.max(2, r.top+6));
      h=Math.max(60, Math.round(Math.min(ch-12, innerHeight-top-6)));
    }
    sb.style.top=top+'px'; sb.style.height=h+'px';
    sb.classList.add('on');
    var trackH=sb.clientHeight;
    var th=Math.max(24, Math.round(trackH*ch/sh));
    var maxTop=Math.max(0, trackH-th);
    thumb.style.height=th+'px';
    if(!drag){
      var st=isPage(target) ? (window.pageYOffset||target.scrollTop||0) : target.scrollTop;
      thumb.style.top=Math.round(maxTop*st/(sh-ch))+'px';
    }
  }
  /* 表示の速さを落とさないよう、画面が出たあとに動かし始める */
  addEventListener('load', function(){ setTimeout(function(){ sync(true); }, 150); });
  addEventListener('scroll', onScroll, {passive:true});
  addEventListener('resize', function(){ sync(true); });
  addEventListener('orientationchange', function(){ setTimeout(function(){ sync(true); }, 320); });
  setInterval(function(){ tick++; sync(tick % 4 === 0); }, 500);
  window.nnSyncSb=function(){ sync(true); };
})();
</script>

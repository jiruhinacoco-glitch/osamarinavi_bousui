<script id="nn-kasagi-js">
/* アルミ笠木。本体（build3D）は書き換えず、上から包んで飾りを足す（§119の型）。 */
(function(){
"use strict";
/* ---- 田島ルーフィング ライナーコービングS の寸法表 ----
   [品名, パラペット幅の下限, 上限, 本体の幅, 板厚, 本体の長さ, コーナーの寸法] （mm） */
var TBL=[
  ['135',  80,105, 135,1.3,4000,'495×495'],
  ['150', 106,120, 150,1.3,4000,'495×495'],
  ['175', 121,140, 175,1.3,4000,'495×495'],
  ['200', 141,165, 200,1.3,4000,'495×495'],
  ['225', 166,190, 225,1.5,4000,'495×495'],
  ['250', 191,215, 250,1.6,4000,'495×495'],
  ['275', 216,240, 275,1.7,4000,'495×495'],
  ['300', 241,265, 300,2.0,4000,'495×495'],
  ['325', 266,290, 325,2.0,4000,'495×495'],
  ['350', 291,315, 350,2.0,4000,'495×495'],
  ['400', 316,365, 400,2.5,3000,'700×700'],
  ['450', 366,415, 450,3.0,3000,'700×700'],
  ['500M',416,460, 500,2.0,3000,'800×800']
];
/* 断面の高さ（全品番で共通）。★外壁側が高く、屋上側が低い＝雨を屋上へ流す（本人の確認） */
var H_OUT=0.072, H_IN=0.060;
/* デモ用の概算単価 */
var PRICE_M=7500, PRICE_CORNER=12000;
window.NN_COPING_TBL=TBL;
window.nnCopingPick=function(wMm){
  for(var i=0;i<TBL.length;i++){ var r=TBL[i]; if(wMm>=r[1] && wMm<=r[2])
    return {code:r[0], w:r[3], t:r[4], len:r[5], corner:r[6]}; }
  return null;                                    /* 表の範囲外（80未満／460超） */
};
function sM(){ return (typeof state!=='undefined'&&state.scaleM)?state.scaleM:0.5; }
function hasK(e){ return !!(e&&e.kasagi); }

/* ---- ① 笠木が乗る辺を集める（パラペットで、笠木ONの辺だけ） ---- */
window.nnKasagiList=function(){
  var out=[]; var P=(typeof state!=='undefined'&&state.polys)?state.polys:[];
  P.forEach(function(poly,pi){
    try{
      ringsOf(poly).forEach(function(ring){
        var N=ring.pts.length;
        for(var i=0;i<N;i++){
          var e=ek(ring.edges[i]); if(e.k!=='para' || e.h<=0) continue;
          if(!hasK(ring.edges[i])) continue;
          var a=ring.pts[i], b=ring.pts[(i+1)%N];
          var thM=nnWallTh(e);
          var pick=nnCopingPick(Math.round(thM*1000));
          out.push({p:pi, r:ring.r, e:i, a:a, b:b, poly:poly, ring:ring,
            lenM:Math.hypot(b.x-a.x,b.y-a.y)*sM(), th:thM, wMm:Math.round(thM*1000),
            pick:pick, lv:(+poly.lv||0), hh:e.h/1000});
        }
      });
    }catch(_){}
  });
  return out;
};
/* ---- ② 屋根ごとの ON/OFF ---- */
window.nnKasagiSet=function(pi, on){
  var poly=state.polys[pi]; if(!poly) return; var n=0;
  try{ ringsOf(poly).forEach(function(ring){
    (ring.edges||[]).forEach(function(ed){ var e=ek(ed);
      if(e.k==='para' && e.h>0){ if(on) ed.kasagi=1; else delete ed.kasagi; n++; } }); }); }catch(_){}
  if(!n){ try{ toast('この屋根にはパラペットの辺がありません'); }catch(_){} return; }
  try{ saveState(); }catch(_){}
  try{ recalc(); }catch(_){}
  try{ draw(); }catch(_){}
  try{ if(typeof dirty3d!=='undefined')dirty3d=true;
       if((typeof tab!=='undefined'&&tab==='d3')||document.body.classList.contains('nnsplit2')) build3D(); }catch(_){}
  try{ nnKsgRender(); }catch(_){}
  try{ toast((poly.name||'屋根')+'の笠木を'+(on?'付けました':'外しました')+'（'+n+'辺）'); }catch(_){}
};
window.nnKasagiOn=function(pi){
  var poly=state.polys[pi]; if(!poly) return false; var on=false;
  try{ ringsOf(poly).forEach(function(ring){
    (ring.edges||[]).forEach(function(ed){ if(ed.kasagi) on=true; }); }); }catch(_){}
  return on;
};
/* ---- ③ 積算（品番ごとに 長さ・本数・コーナー数） ---- */
window.nnKasagiAgg=function(){
  var g={}, L=nnKasagiList();
  L.forEach(function(t){
    if(!t.pick) return;                        /* 表の範囲外は計上しない（画面で知らせる） */
    var o=g[t.pick.code]||(g[t.pick.code]={code:t.pick.code, w:t.pick.w, len:0, corner:0,
      unit:t.pick.len/1000, cname:t.pick.corner});
    o.len+=t.lenM;
  });
  /* コーナー＝笠木のある辺どうしが出会う角の数 */
  var byRing={};
  L.forEach(function(t){ var k=t.p+'/'+t.r; (byRing[k]=byRing[k]||{edges:{}, t:t}).edges[t.e]=t; });
  Object.keys(byRing).forEach(function(k){
    var o=byRing[k], ring=o.t.ring, N=ring.pts.length;
    Object.keys(o.edges).forEach(function(is){
      var i=+is, nx=(i+1)%N;
      if(o.edges[nx]){ var pk=o.edges[i].pick; if(pk&&g[pk.code]) g[pk.code].corner++; }
    });
  });
  return g;
};
window.nnKasagiRows=function(){
  var g=nnKasagiAgg(), rows=[];
  Object.keys(g).forEach(function(k){ var o=g[k];
    if(o.len<=0) return;
    var hon=Math.ceil(o.len/o.unit);
    rows.push(['アルミ笠木 ライナーコービングS'+o.code+'（L='+o.unit.toFixed(1)+'m×'+hon+'本）',
      o.len, 'm', PRICE_M]);
    if(o.corner>0) rows.push(['同 コーナー（'+o.cname+'）', o.corner, '個', PRICE_CORNER]);
  });
  return rows;
};
/* ---- ④ 3D（build3D のあとに飾りとして足す） ---- */
var kg=null;
function three(){ return (typeof T!=='undefined')&&T&&T.scene; }
function clearG(){
  if(!kg) return;
  try{ kg.traverse(function(o){ if(o.geometry) o.geometry.dispose(); }); }catch(_){}
  try{ if(kg.parent)kg.parent.remove(kg); }catch(_){}
  kg=null;
}
/* 2本の「ずらした線」の交点＝留め継ぎ（本体の joint と同じ考え方） */
function offLine(a,b,n,d){ return {a:{x:a.x+n.x*d, y:a.y+n.y*d}, b:{x:b.x+n.x*d, y:b.y+n.y*d}}; }
function cross(l1,l2,fallback){
  var d1={x:l1.b.x-l1.a.x, y:l1.b.y-l1.a.y}, d2={x:l2.b.x-l2.a.x, y:l2.b.y-l2.a.y};
  var den=d1.x*d2.y-d1.y*d2.x; if(Math.abs(den)<1e-9) return fallback;
  var t=((l2.a.x-l1.a.x)*d2.y-(l2.a.y-l1.a.y)*d2.x)/den;
  var p={x:l1.a.x+d1.x*t, y:l1.a.y+d1.y*t};
  if(Math.hypot(p.x-fallback.x,p.y-fallback.y)>2.0) return fallback;   /* 尖りすぎは切る */
  return p;
}
function band(O0,O1,I1,I0, yb, yo, yi, mat){
  var v=new Float32Array([
    O0.x,yb,O0.y,  O1.x,yb,O1.y,  I1.x,yb,I1.y,  I0.x,yb,I0.y,   /* 0-3 下 */
    O0.x,yo,O0.y,  O1.x,yo,O1.y,  I1.x,yi,I1.y,  I0.x,yi,I0.y ]); /* 4-7 上 */
  var idx=[4,5,6, 4,6,7,   0,3,2, 0,2,1,   0,1,5, 0,5,4,
           3,7,6, 3,6,2,   0,4,7, 0,7,3,   1,2,6, 1,6,5];
  var g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(v,3));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}
window.nnKasagiSync=function(){
  if(!three()) return;
  clearG();
  var L=nnKasagiList(); if(!L.length) return;
  kg=new THREE.Group(); kg.name='nnKasagi'; T.scene.add(kg);
  var s=sM();
  var mat=(window.nnMat? nnMat('alum',0xc9ced2,true)
    : new THREE.MeshStandardMaterial({color:0xc9ced2, roughness:0.34, metalness:0.85, side:THREE.DoubleSide}));
  /* リングごとに、隣の辺との留め継ぎで角をそろえる */
  var byRing={};
  L.forEach(function(t){ var k=t.p+'/'+t.r; (byRing[k]=byRing[k]||{list:{}, t:t}).list[t.e]=t; });
  Object.keys(byRing).forEach(function(k){
    var o=byRing[k], ring=o.t.ring, poly=o.t.poly, N=ring.pts.length;
    var pm=ring.pts.map(function(q){ return {x:q.x*s, y:q.y*s}; });
    function info(i){
      var t=o.list[i]; if(!t) return null;
      var a=pm[i], b=pm[(i+1)%N];
      var n=ringNormal(poly, ring.pts, ring.pts[i], ring.pts[(i+1)%N]);   /* 内向き */
      var pick=t.pick;
      var wc=(pick?pick.w:t.wMm)/1000;                 /* 笠木の幅（m） */
      var ov=Math.max(0,(wc-t.th)/2);                  /* 外側・内側への出（m） */
      return {a:a, b:b, n:{x:n.x,y:n.y}, ov:ov, th:t.th, t:t, hh:t.hh};
    }
    /* ★2026-08-27g 隣と高さが違う角では、笠木も留め継ぎ（45度）にしない。
       高いほうが角を通しで作り、低いほうはその手前で止める（壁と同じ考え方）。
       ★2026-08-27h 出隅と入隅で分ける（壁の jointH と同じ直し）。
       出隅で高いほうを伸ばすと建物の外に飛び出す（実機で発生）→角で切る。 */
    var ringArea=pm.reduce(function(s2,q,idx){ var n2=pm[(idx+1)%N]; return s2+(q.x*n2.y-n2.x*q.y); },0);
    function endPt(cur, other, dir){
      if(!other) return null;
      var dh=(other.hh||0)-(cur.hh||0);
      if(Math.abs(dh)<0.002) return null;              /* 同じ高さ＝今までどおり留め継ぎ */
      var L=Math.hypot(cur.b.x-cur.a.x, cur.b.y-cur.a.y)||1;
      var ux=(cur.b.x-cur.a.x)/L, uy=(cur.b.y-cur.a.y)/L;
      var eA=(dir<0)?other:cur, eB=(dir<0)?cur:other;  /* 角に入ってくる辺 → 出ていく辺 */
      var cr=(eA.b.x-eA.a.x)*(eB.b.y-eB.a.y)-(eA.b.y-eA.a.y)*(eB.b.x-eB.a.x);
      var convex=(cr>0)===(ringArea>0);
      var d;
      if(dh<0) d=convex?0:((other.th||0)+(other.ov||0)); /* こちらが高い：出隅は角で切る／入隅だけ通す */
      else     d=convex?(other.th||0):0;                 /* こちらが低い：出隅だけ相手の壁の面で止める */
      var t=(dir<0?1:-1)*(dh>0?1:-1)*d;
      var P=(dir<0)?cur.a:cur.b;
      var q={x:P.x+ux*t, y:P.y+uy*t};
      return {O:{x:q.x-cur.n.x*cur.ov, y:q.y-cur.n.y*cur.ov},
              I:{x:q.x+cur.n.x*(cur.th+cur.ov), y:q.y+cur.n.y*(cur.th+cur.ov)}};
    }
    Object.keys(o.list).forEach(function(is){
      var i=+is, cur=info(i); if(!cur) return;
      var prev=info((i+N-1)%N), next=info((i+1)%N);
      /* 外側の線（内向き法線の逆へ ov）と内側の線（内向きへ th+ov） */
      var lO=offLine(cur.a,cur.b,cur.n,-cur.ov), lI=offLine(cur.a,cur.b,cur.n,cur.th+cur.ov);
      var O0=lO.a, O1=lO.b, I0=lI.a, I1=lI.b;
      var eP=endPt(cur,prev,-1), eN=endPt(cur,next,+1);
      if(eP){ O0=eP.O; I0=eP.I; }
      else if(prev){ var pO=offLine(prev.a,prev.b,prev.n,-prev.ov), pI=offLine(prev.a,prev.b,prev.n,prev.th+prev.ov);
        O0=cross(pO,lO,O0); I0=cross(pI,lI,I0); }
      if(eN){ O1=eN.O; I1=eN.I; }
      else if(next){ var nO=offLine(next.a,next.b,next.n,-next.ov), nI=offLine(next.a,next.b,next.n,next.th+next.ov);
        O1=cross(lO,nO,O1); I1=cross(lI,nI,I1); }
      var yb=cur.t.lv+cur.t.hh;                        /* パラペットの天端（ここに乗る） */
      kg.add(band(O0,O1,I1,I0, yb, yb+H_OUT, yb+H_IN, mat));
    });
  });
  try{ T.rev=(T.rev|0)+1; }catch(_){}
};
var _b3=window.build3D;
if(typeof _b3==='function'){
  window.build3D=function(){ var r=_b3.apply(this,arguments);
    try{ nnKasagiSync(); }catch(_){} return r; };
}
/* ---- ⑤ 図面(2D)：笠木のある辺に細い金属色の線を重ねる ---- */
var _dw=window.draw;
if(typeof _dw==='function'){
  window.draw=function(){ var r=_dw.apply(this,arguments);
    try{ draw2d(); }catch(_){} return r; };
}
function draw2d(){
  if(typeof tab!=='undefined' && tab!=='zu') return;
  var L=nnKasagiList(); if(!L.length) return;
  var cv=document.getElementById('cv'); if(!cv) return;
  var ctx=cv.getContext('2d'); if(!ctx) return;
  ctx.save();
  L.forEach(function(t){
    ctx.beginPath();
    ctx.moveTo(gx2px(t.a.x), gy2px(t.a.y)); ctx.lineTo(gx2px(t.b.x), gy2px(t.b.y));
    ctx.strokeStyle=t.pick?'#4a6b8a':'#b23b2e'; ctx.lineWidth=2.4; ctx.setLineDash([]);
    ctx.stroke();
  });
  ctx.restore();
}
/* ---- ⑥ 一覧の小窓 ---- */
function box(){
  var d=document.getElementById('nnKsgBox');
  if(!d){ var w=document.getElementById('canvaswrap'); if(!w)return null;
    d=document.createElement('div'); d.id='nnKsgBox'; w.appendChild(d); }
  return d;
}
function place(){
  var d=document.getElementById('nnKsgBox'); if(!d||!d.classList.contains('on'))return;
  try{
    var z=(window.nnPZ||1);
    var w=document.getElementById('canvaswrap'), tb=document.getElementById('toolbar');
    if(!w)return; var wr=w.getBoundingClientRect(); var top=18;
    if(tb){ var tr=tb.getBoundingClientRect(); if(tr.height>0) top=(tr.bottom-wr.top)/z+8; }
    d.style.top=Math.round(top)+'px';
    d.style.maxHeight=Math.max(140, Math.round(wr.height/z-top-56))+'px';
  }catch(_){}
}
addEventListener('resize',function(){ setTimeout(place,60); });
window.nnKasagiPanel=function(){
  var d=box(); if(!d)return;
  if(d.classList.contains('on')){ d.classList.remove('on'); return; }
  /* 取り合いの小窓と場所が同じなので、開くときは相手を閉じる */
  try{ var o=document.getElementById('nnTorBox'); if(o&&o.classList.contains('on')) nnTorPanel(); }catch(_){}
  d.classList.add('on'); place(); nnKsgRender();
};
window.nnKsgRender=function(){
  var d=document.getElementById('nnKsgBox'); if(!d||!d.classList.contains('on'))return;
  var P=(typeof state!=='undefined'&&state.polys)?state.polys:[];
  var head='<h5><b>⌂ アルミ笠木</b><button class="kxc" onclick="nnKasagiPanel()" title="閉じる">✕</button></h5>';
  if(!P.length){ d.innerHTML=head+'<div class="knone">先に屋根をかいてください。</div>'; return; }
  var L=nnKasagiList();
  var rows=P.map(function(poly,pi){
    var on=nnKasagiOn(pi);
    var mine=L.filter(function(t){ return t.p===pi; });
    var len=mine.reduce(function(a,t){ return a+t.lenM; },0);
    var pk=mine.length?mine[0].pick:null;
    var wMm=mine.length?mine[0].wMm:null;
    /* ★天端幅が辺ごとに違うと品番も分かれる。1つ目だけ出すと誤解するので、
       分かれているときは品番ごとの長さと本数を並べる。 */
    var many={}; mine.forEach(function(t){ var c=t.pick?t.pick.code:'—';
      (many[c]=many[c]||{len:0, pick:t.pick})['len']+=t.lenM; });
    var codes=Object.keys(many);
    /* 笠木を付けていない屋根でも、天端幅から品番の見当を出す */
    if(!mine.length){
      try{ ringsOf(poly).forEach(function(ring){ (ring.edges||[]).forEach(function(ed){
        var e=ek(ed); if(e.k==='para'&&e.h>0&&wMm==null){ wMm=Math.round(nnWallTh(e)*1000); pk=nnCopingPick(wMm); } }); }); }catch(_){}
    }
    var body;
    if(wMm==null){ body='<div class="krl">パラペットの辺がありません</div>'; }
    else if(!pk){ body='<div class="krl kng">天端 '+wMm+'mm は対応表の範囲外です（80〜460mm）</div>'; }
    else {
      var hon=len>0?Math.ceil(len/(pk.len/1000)):0;
      if(on && codes.length>1){
        body='<div class="krl">天端幅が辺ごとに違うので、品番が分かれます<br>'
          +codes.map(function(c){ var o=many[c];
            if(!o.pick) return '<span class="kng">範囲外 '+(Math.round(o.len*10)/10)+'m</span>';
            return '<b>S'+c+'</b> '+(Math.round(o.len*10)/10)+'m → '
              +Math.ceil(o.len/(o.pick.len/1000))+'本'; }).join('<br>')+'</div>';
      } else {
        body='<div class="krl">天端 '+wMm+'mm → <b>ライナーコービングS'+pk.code+'</b>'
          +'（幅'+pk.w+'・板厚'+pk.t+'・L='+(pk.len/1000).toFixed(1)+'m）'
          +(on?'<br>長さ <b>'+(Math.round(len*10)/10)+'m</b> → 本体 <b>'+hon+'本</b>':'')
          +'</div>';
      }
    }
    return '<div class="kri '+(on?'on':'')+'">'
      +'<div class="krh"><span>'+nnEsc(poly.name||('屋根'+(pi+1)))+'</span>'
      +'<button class="ktg '+(on?'on':'')+'" onclick="nnKasagiSet('+pi+','+(on?'false':'true')+')">'
      +(on?'✓ 笠木あり':'笠木なし')+'</button></div>'+body+'</div>';
  }).join('');
  var ag=nnKasagiAgg(), sum=Object.keys(ag).map(function(k){ var o=ag[k];
    return 'S'+o.code+' '+Math.ceil(o.len/o.unit)+'本＋コーナー'+o.corner+'個'; }).join('／');
  d.innerHTML=head+rows+'<div class="ksum">'
    +(sum?'積算に計上：'+nnEsc(sum):'笠木を「あり」にすると、本数とコーナー数が積算に出ます。')
    +'<br>※品番は田島ルーフィング ライナーコービングSの寸法表から自動で選んでいます。単価はデモ用の概算です。</div>';
};
var _rc=window.recalc;
if(typeof _rc==='function'){

if(typeof _tp==='function'){

if(typeof window.nnEsc!=='function'){
  window.nnEsc=function(v){ return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };

/* ---- ⑦ 御見積書（紙）にも出す ----
   ★画面の積算（recalc）にだけ出して、御見積書（nnEstimateData）に足し忘れると
     「画面の金額」と「元請に出す紙の金額」が食い違う。笠木と取り合いをここでまとめて足す。
   ★数量は小数1位に丸めてから単価を掛ける（紙の「数量×単価」と金額を合わせるため）。 */
var _ed=window.nnEstimateData;
if(typeof _ed==='function'){
  window.nnEstimateData=function(){
    var d=_ed.apply(this,arguments);
    var r1=function(v){ return Math.round(v*10)/10; };
    try{ nnKasagiRows().forEach(function(r){
      d.rows.push({n:r[0], q:(r[2]==='個')?r[1]:r1(r[1]), u:r[2], p:r[3]}); }); }catch(_){}
    try{ if(window.nnTorAgg){ var ta=nnTorAgg();
      Object.keys(ta).forEach(function(k){ var t=ta[k]; if(t.len>0)
        d.rows.push({n:'取り合い処理（'+t.label+'）', q:r1(t.len), u:'m', p:t.price}); }); } }catch(_){}
    return d;
  };
}
})();
</script>

<script id="nn-phototex-js">
/* ============================================================
   ★2026-08-27e コンクリートの質感を「本物の写真」にする
   ・写真は3Dタブを開いたときだけ読む（ページを開く速さは今までどおり）
   ・読めなかったとき（圏外・置いていない）は、今までの手描きの質感のまま
   ・build3D と nnMat 本体は書き換えず、上から包む（§119の型）
   ============================================================ */
(function(){
"use strict";
/* 1タイルが実物で何メートルぶんか。写真は横長（2:1）なので、
   世界の上でも 2:1 の四角に貼らないと、粒や気泡が縦につぶれて見える。 */
var TILE_W=2.0, TILE_H=1.0;
var st=0;                       /* 0=まだ 1=読み中 2=できた 3=だめだった */
var texC=null, texN=null, texR=null;
function ready(){ try{ return typeof THREE!=='undefined' && THREE && THREE.TextureLoader; }catch(_){ return false; } }
function setup(t, srgb){
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  /* 幾何のUVは「1mあたり NN_TEX_PER_M タイル」なので、そのぶん割り戻す */
  var per=(typeof NN_TEX_PER_M!=='undefined')?NN_TEX_PER_M:4;
  t.repeat.set(1/(per*TILE_W), 1/(per*TILE_H));
  t.anisotropy=8;
  if(srgb && THREE.SRGBColorSpace) t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function apply(m){
  if(!m || !texC) return;
  /* ★2026-08-27g 写真は材質の色に「掛け算」される。もとの色（灰色 0.72くらい）に
     写真（平均0.72）を掛けると 0.52 まで沈み、**写真より白っぽく・のっぺり**して
     「テクスチャと違う」と見える（本人の指摘）。
     色みは残したまま、いちばん明るい成分が1.0になるようにそろえて、
     写真そのものの濃淡が出るようにする。（1つの材質につき1回だけ） */
  try{
    if(!m.userData._nnPhotoCol && m.color){
      var mx=Math.max(m.color.r, m.color.g, m.color.b)||1;
      m.color.setRGB(Math.min(1,m.color.r/mx), Math.min(1,m.color.g/mx), Math.min(1,m.color.b/mx));
      m.userData._nnPhotoCol=1;
    }
  }catch(_){}
  m.map=texC;
  m.bumpMap=null;                                   /* 凸凹は法線マップに任せる */
  if(texN){ m.normalMap=texN; if(m.normalScale) m.normalScale.set(1,1); }
  /* ★つやの具合（roughnessMap）は material.roughness に掛け算されるので、
     この写真が作られたときの前提どおり 1.0 にしてから当てる。
     0.95 のままだと、写真の意図より一段つやが出てしまう。 */
  if(texR){ m.roughnessMap=texR; m.roughness=1.0; }
  m.needsUpdate=true;
}
function applyAll(){
  try{ _nnMatCache.forEach(function(m,k){ if(/^(concrete|wall)\|/.test(k)) apply(m); }); }catch(_){}
  try{ if(typeof T!=='undefined'&&T){ T.rev=(T.rev|0)+1; if(T.sun&&T.sun.shadow) T.sun.shadow.needsUpdate=true; } }catch(_){}
}
window.nnPhotoTexLoad=function(){
  if(st||!ready()) return;
  st=1;
  /* ★同じ名前で中身を差し替えたときに古い絵が使われないよう、URLに版名を付ける（§66） */
  var v=(typeof NN_VER!=='undefined'&&NN_VER)?('?v='+NN_VER):'';
  var L=new THREE.TextureLoader(), left=3, bad=0;
  var done=function(){ if(--left>0) return;
    if(bad||!texC){ st=3; return; }                 /* 読めなければ今までの質感のまま */
    st=2; applyAll(); };
  L.load('./textures/concrete_color.jpg'+v,
    function(t){ texC=setup(t,true); done(); },
    undefined, function(){ bad=1; done(); });
  L.load('./textures/concrete_normal.jpg'+v,
    function(t){ texN=setup(t,false); done(); },
    undefined, function(){ done(); });              /* 凸凹だけ無くても色は使える */
  L.load('./textures/concrete_rough.jpg'+v,
    function(t){ texR=setup(t,false); done(); },
    undefined, function(){ done(); });              /* つやの具合も無くてよい */
};
window.nnPhotoTexState=function(){ return st; };
/* できあがった材質にも当てる（あとから作られたものを取りこぼさない） */
var _mat=window.nnMat;
if(typeof _mat==='function'){
  window.nnMat=function(kind, color, dbl){
    var m=_mat.apply(this,arguments);
    if(st===2 && (kind==='concrete'||kind==='wall')) apply(m);
    return m;
  };
}
var _b3=window.build3D;
if(typeof _b3==='function'){
  window.build3D=function(){ var r=_b3.apply(this,arguments);
    try{ nnPhotoTexLoad(); }catch(_){} return r; };
}
})();
</script>


<script id="nn-genkyo-js">
/* ============================================================
   ★2026-08-28c 現況（何の状態を見せるか）＝§231
   本人の指示「「躯体」「既存防水」「改修後防水」のどれかを選べるようにし、
   選択したものが表現される仕様に変更してほしい」。
   改修の打ち合わせで見せたい3つの状態を、屋根ごとに切り替える。

   ・躯体      … 防水前の下地そのもの。防水層を下地（RC・W造など）の材質に。継目は出さない
   ・既存防水  … 改修前。色あせ・汚れのまだら。継目は残る（既存の重ね）
   ・改修後防水（既定）… いままでどおり、仕様どおりの新しい仕上がり

   作り：build3D 本体は書き換えず、
   ①部位ごとのヒント（window._nnGkHint）を build3D が立てる（1行だけ足した）
   ②nnMat をいちばん外側で包み、防水層の材質だけ差し替える
   ★数量・見積は1円も変わらない（見た目だけの切り替え）。
   ★「躯体」は nnMat('concrete') を通すので、下地（§140）に合わせて
     W造なら木、S＋デッキなら亜鉛めっき…と自動で変わる。
   ============================================================ */
(function(){
  var GK={
    body :{label:'躯体（防水前の下地）', short:'躯体'},
    exist:{label:'既存防水（改修前）',   short:'既存防水'}
  };
  window.NN_GENKYO=GK;
  window.NN_GENKYO_NEW='改修後防水';     /* 既定（値は空）のときの呼び名 */

  /* ---- その場で描く質感（画像ファイルを増やさない・§80と同じ考え方） ---- */
  var _tex={};
  var OLD_TILE_M=2.0;    /* 質感の1タイルを実寸2mにする（0.25mのままだと細かい格子に見える） */
  function noise(i){ var x=Math.sin(i*12.9898)*43758.5453; return x-Math.floor(x); }
  function texOldAs(){
    if(_tex.exist) return _tex.exist;
    var S=256, c=document.createElement('canvas'); c.width=c.height=S;
    var g=c.getContext('2d');
    g.fillStyle='#6e6a63'; g.fillRect(0,0,S,S);
    /* ★継ぎ目が出ないように、端に近いものは反対側にも描く（巻き付け・§225と同じ手） */
    function wrap(fn){ for(var dx=-1;dx<=1;dx++) for(var dy=-1;dy<=1;dy++) fn(dx*S,dy*S); }
    /* 色あせ・汚れのまだら */
    for(var k=0;k<22;k++){
      var x=noise(k*3+1)*S, y=noise(k*3+2)*S, r=26+noise(k*3+3)*54;
      var dark=noise(k*7+5)>0.5;
      wrap(function(ox,oy){
        var rg=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r);
        rg.addColorStop(0, dark?'rgba(46,43,38,.34)':'rgba(150,146,136,.26)');
        rg.addColorStop(1,'rgba(0,0,0,0)');
        g.fillStyle=rg; g.beginPath(); g.arc(x+ox,y+oy,r,0,7); g.fill();
      });
    }
    /* 砂の粒（残っているところ・減っているところ） */
    for(var i=0;i<6000;i++){
      var px=noise(i*2+11)*S, py=noise(i*2+12)*S, v=120+noise(i*5+13)*80;
      g.fillStyle='rgba('+(v|0)+','+((v-6)|0)+','+((v-16)|0)+','+(0.10+noise(i+17)*0.26)+')';
      g.fillRect(px,py,1,1);
    }
    var t=new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    /* 幾何のUVは「メートル×NN_TEX_PER_M」なので、1タイル＝OLD_TILE_M になるように割る（§225） */
    var per=(typeof NN_TEX_PER_M!=='undefined')?NN_TEX_PER_M:4;
    t.repeat.set(1/(per*OLD_TILE_M), 1/(per*OLD_TILE_M));
    t.anisotropy=8;
    if(THREE.SRGBColorSpace) t.colorSpace=THREE.SRGBColorSpace;
    _tex.exist=t; return t;
  }

  /* ---- 防水層の材質を差し替える（nnMat をいちばん外側で包む） ---- */
  var _mat=window.nnMat;
  var _cache={};
  function memMat(gk, kind, dbl){
    var key=gk+'|'+kind+'|'+(dbl?1:0);
    if(_cache[key]) return _cache[key];
    var m;
    if(gk==='body'){
      /* 防水前の下地そのもの。'concrete' を通すので、下地（§140）に合わせて
         W造なら木、S＋デッキなら亜鉛めっき…と自動で変わる */
      m=_mat.call(null, 'concrete', 0xbcbfb7, dbl);
    }else{
      m=new THREE.MeshStandardMaterial({
        color:0xe6e4e0, roughness:0.92, metalness:0.0,
        side: dbl ? THREE.DoubleSide : THREE.FrontSide });
      try{ m.map=texOldAs(); m.bumpMap=texOldAs(); m.bumpScale=0.30; }catch(_){}
      m.userData.nnShared=1;   /* 使い回すので dispose しない（§177） */
    }
    _cache[key]=m; return m;
  }
  var _invisible=null;
  function invisible(){
    if(!_invisible){ _invisible=new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false});
      _invisible.userData.nnShared=1; }
    return _invisible;
  }
  if(typeof _mat==='function'){
    window.nnMat=function(kind, color, dbl){
      var gk=window._nnGkHint;
      if(gk && GK[gk]){
        /* 防水層（シート・塩ビ・ウレタン）＝現況の見た目に差し替える */
        if(kind==='sheet'||kind==='vinyl'||kind==='coat') return memMat(gk, kind, dbl);
        /* 継目（はみ出しアス）は、まだ防水していない「躯体」では出さない */
        if((kind==='bead'||kind==='seam') && gk==='body') return invisible();
      }
      return _mat.apply(this, arguments);
    };
  }

  /* ---- 継目を出さない現況では、透明にした部品を「描かない」ようにする ----
     透明のまま残すと絵には出ないが、描く手間（draw call）はかかる（§178の教訓）。 */
  function three(){ try{ return (typeof T!=='undefined')&&T&&T.scene; }catch(_){ return false; } }
  window.nnGenkyoSync=function(){
    if(!three()) return;
    try{
      var iv=_invisible;
      if(iv) T.group.traverse(function(o){ if(o.isMesh && o.material===iv) o.visible=false; });
    }catch(_){}
  };
  /* build3D のあとに必ず通す */
  if(typeof build3D==='function' && !build3D._nnGk){
    var _b=window.build3D;
    window.build3D=function(){ var r=_b.apply(this,arguments);
      try{ nnGenkyoSync(); }catch(_){} return r; };
    window.build3D._nnGk=1;
  }

  /* ---- 屋根ごとに選ぶ（屋根の表の「現況」の列から） ---- */
  window.nnGenkyoSet=function(i, v){
    var p=state.polys[i]; if(!p) return;
    if(v && GK[v]) p.genkyo=v; else delete p.genkyo;
    try{ saveState(); }catch(_){}
    try{ draw(); }catch(_){}
    try{ dirty3d=true;
      if(tab==='d3'||document.body.classList.contains('nnsplit2')) build3D(); }catch(_){}
    try{ toast((p.name||'この屋根')+'：'+((v&&GK[v])?GK[v].label:NN_GENKYO_NEW)); }catch(_){}
  };

  /* ★屋根の表は「このブロックより前」で1回組み立てられる（nn-rtbl-js の末尾で nnRoofTbl(true)）。
     図面を保存したまま開き直すと、その1回が NN_GENKYO のできる前に走るため、
     現況のプルダウンが1つだけになっていた（検証で発覚）。
     このブロックを読み終えた時点で、もう一度だけ組み立て直す。 */
  try{ if(window.nnRoofTbl) nnRoofTbl(true); }catch(_){}
})();
</script>

<script id="nn-sectdraw-js">
/* 断面作図。上の <style id="nn-sectdraw"> とセット。 */
(function(){
"use strict";
const box=document.getElementById('secwrap');
const w=document.createElement('div'); w.id='sdWrap';
w.innerHTML='<canvas id="sdCv"></canvas>';
box.appendChild(w);
const cv=document.getElementById('sdCv'), c=cv.getContext('2d');

/* --- 道具バー（#secFree の中＝描くモードのときだけ出る） --- */
const bar=document.getElementById('secFree');
bar.innerHTML=
  '<button class="sdb" id="sd_draw">✎ 描く</button>'
 +'<button class="sdb" id="sd_edit">⇱ 修正</button>'
 +'<button class="sdb" id="sd_pan">✥ 移動</button>'
 +'<button class="sdb" id="sd_pt">⊕ 点</button>'
 +'<button class="sdb" id="sd_wp">🛡 防水層</button>'
 +'<button class="sdb" id="sd_undo">↩</button>'
 +'<button class="sdb" id="sd_redo">↪</button>'
 +'<button class="sdb" id="sd_zin">＋</button>'
 +'<button class="sdb" id="sd_zout">−</button>'
 +'<button class="sdb" id="sd_fit">⊡ 全体</button>'
 +'<button class="sdb" id="sd_cell">▦ 100mm</button>'
 +'<button class="sdb" id="sd_dim">📏 寸法</button>'
 +'<button class="sdb" id="sd_sample">📐 見本</button>'
 +'<button class="sdb" id="sd_clear">🗑</button>'
 +'<span class="lb hidesp" title="奥行き">奥行</span><input id="sd_depth" title="奥行き（m）" type="number" inputmode="decimal" min="0.2" step="0.5" value="2">';

/* --- 保存されるデータ（state に入れるので図面と一緒に保存・復元される） --- */
function S(){
  if(!state.sect) state.sect={cell:0.1, pts:[], closed:false, wp:[], depth:2};
  const s=state.sect;
  if(!Array.isArray(s.pts))s.pts=[];
  if(!Array.isArray(s.wp))s.wp=[];
  if(!(s.cell>0))s.cell=0.1;
  if(!(s.depth>0))s.depth=2;
  return s;
}
let tool='draw';
let labBox=[];                      /* 寸法札の当たり判定（描くたびに作り直す） */
let dimsOn=true;                    /* 寸法を出すか */
let drag=null;                      /* 移動（パン）・頂点つかみ */
let view={px:0, ox:0, oy:0, set:false, ever:false};      /* px＝1mの画面px。ever＝一度でも合わせたか */
let aim=null;                                /* スマホの赤い照準（世界座標） */
let live=null;                               /* いま引いている先（世界座標） */
let undoStack=[], redoStack=[];
let pinch=null, down=null;

const PHONE=document.documentElement.getAttribute('data-nnphone')==='1';
const DPR=()=>Math.min(2, window.devicePixelRatio||1);

function snapshot(){ const s=S(); return JSON.stringify({pts:s.pts, closed:s.closed, wp:s.wp}); }
function pushUndo(){ undoStack.push(snapshot()); if(undoStack.length>60)undoStack.shift(); redoStack.length=0; }
function apply(js){ const s=S(), o=JSON.parse(js); s.pts=o.pts; s.closed=o.closed; s.wp=o.wp; }
function save(){ try{ if(typeof saveState==='function') saveState(); }catch(_){} }

/* --- 画面 ↔ 世界 --- */
function fit(){
  const s=S(), W=cv.clientWidth||box.clientWidth, H=cv.clientHeight||box.clientHeight;
  const barH=(document.getElementById('secBar')||{}).offsetHeight||44;
  if(!s.pts.length){ view.px=Math.max(28, Math.min(W,H)/12)/s.cell*s.cell*0+ (34/s.cell);
                     view.ox=W*0.30; view.oy=(H+barH)/2+ (H-barH)*0.18; view.set=true; return; }
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  s.pts.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);});
  const dw=Math.max(0.3,x1-x0), dh=Math.max(0.3,y1-y0);
  view.px=Math.min((W-90)/dw, (H-barH-90)/dh);
  view.ox=45-x0*view.px+((W-90)-dw*view.px)/2;
  view.oy=barH+45+y1*view.px+((H-barH-90)-dh*view.px)/2;
  view.set=true;
}
const X=x=>view.ox+x*view.px, Y=y=>view.oy-y*view.px;
const wx=px=>(px-view.ox)/view.px, wy=py=>(view.oy-py)/view.px;
/* ★キャンバスの「中の画素数」は resize したときに固まる。入れ物の大きさが変わったのに
   合わせ直す前に座標を計算すると、その比率のぶんタップ位置がズレる（§24と同じ罠。
   実測で最大12%＝27pxズレて、始点をタップしても図形が閉じられなかった）。
   だから「使う直前に必ず合わせる」。 */
function ensureSize(){
  const wrap=document.getElementById('sdWrap');
  const d=DPR(), W=wrap.clientWidth||1, H=wrap.clientHeight||1;
  if(cv.width!==Math.round(W*d)||cv.height!==Math.round(H*d)){
    cv.width=Math.round(W*d); cv.height=Math.round(H*d);
    if(!view.ever) view.set=false;
    return true;
  }
  return false;
}
function pos(e){
  if(ensureSize()) nnSdDraw();
  const r=cv.getBoundingClientRect();
  const kx=cv.width/r.width, ky=cv.height/r.height, d=DPR();
  return {x:(e.clientX-r.left)*kx/d, y:(e.clientY-r.top)*ky/d};
}

/* --- 打点の決まり（平面図と同じ考え方・§56 §57 §93） --- */
function snapPt(rawX, rawY){
  const s=S(), cell=s.cell, pts=s.pts;
  const gx=Math.round(rawX/cell)*cell, gy=Math.round(rawY/cell)*cell;
  if(!pts.length) return {x:gx, y:gy};                 /* 1点目は交差点 */
  /* ★「閉じる」は何よりも優先する（§35の教訓と同じ）。
     始点の近くを狙っているのに、5度・長さのきざみが働いて始点を通り越すと、
     いつまでも図形が閉じられなくなる。始点の26px以内なら始点そのものを返す。 */
  if(pts.length>=3 && !s.closed){
    const a=pts[0];
    if(Math.hypot((rawX-a.x)*view.px, (rawY-a.y)*view.px)<=26) return {x:a.x, y:a.y};
  }
  const pv=pts[pts.length-1];
  /* ①交差点 ②直前の点から 5度きざみ・長さ cell/10 きざみ の、近いほうを採る */
  const dx=rawX-pv.x, dy=rawY-pv.y, L=Math.hypot(dx,dy);
  let cand=[{x:gx,y:gy}];
  if(L>1e-6){
    const st=5*Math.PI/180, ls=cell/10;
    const a=Math.round(Math.atan2(dy,dx)/st)*st;
    const l=Math.max(ls, Math.round(L/ls)*ls);
    cand.push({x:pv.x+Math.cos(a)*l, y:pv.y+Math.sin(a)*l});
  }
  let best=cand[0], bd=1e9;
  cand.forEach(q=>{ const d=Math.hypot(q.x-rawX,q.y-rawY); if(d<bd){bd=d;best=q;} });
  /* ③始点・既存点への たてよこ そろえ（画面12px以内） */
  const tol=12/view.px;
  let ax=null, ay=null;
  pts.forEach(q=>{ if(Math.abs(q.x-best.x)<tol && (ax===null||Math.abs(q.x-best.x)<Math.abs(ax-best.x))) ax=q.x;
                   if(Math.abs(q.y-best.y)<tol && (ay===null||Math.abs(q.y-best.y)<Math.abs(ay-best.y))) ay=q.y; });
  if(ax!==null)best={x:ax,y:best.y};
  if(ay!==null)best={x:best.x,y:ay};
  return {x:+best.x.toFixed(4), y:+best.y.toFixed(4)};
}
function nearStart(p){
  const s=S(); if(s.pts.length<3||s.closed)return false;
  const a=s.pts[0];
  return Math.hypot(X(p.x)-X(a.x), Y(p.y)-Y(a.y))<=26;
}

/* --- 頂点を拾う --- */
function vertexAt(px,py){
  const s=S(); let hit=-1, hd=18;
  s.pts.forEach((q,i)=>{ const d=Math.hypot(px-X(q.x), py-Y(q.y)); if(d<hd){hd=d; hit=i;} });
  return hit;
}
/* --- 寸法札を拾う --- */
function labAt(px,py){
  for(let i=labBox.length-1;i>=0;i--){ const b=labBox[i];
    if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h) return b.e; }
  return -1;
}
/* --- 辺を拾う（防水層の指定用） --- */
function edgeAt(px,py){
  const s=S(), n=s.pts.length; if(n<2)return -1;
  const m=s.closed?n:n-1;
  let hit=-1, hd=16;
  for(let i=0;i<m;i++){
    const a=s.pts[i], b=s.pts[(i+1)%n];
    const ax=X(a.x),ay=Y(a.y),bx=X(b.x),by=Y(b.y);
    const vx=bx-ax, vy=by-ay, L2=vx*vx+vy*vy||1;
    let t=((px-ax)*vx+(py-ay)*vy)/L2; t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(px-(ax+vx*t), py-(ay+vy*t));
    if(d<hd){hd=d; hit=i;}
  }
  return hit;
}

/* --- 描く --- */
function fmtMM(m){ const mm=Math.round(m*1000); return mm>=1000?(mm/1000).toFixed(mm%1000?2:0)+'m':mm+'mm'; }
window.nnSdDraw=function(){
  const wrap=document.getElementById('sdWrap');
  if(!wrap||!wrap.classList.contains('on'))return;
  const s=S(), d=DPR();
  const W=wrap.clientWidth, H=wrap.clientHeight;
  /* ★描き始めたあとは、画面の大きさが変わっても倍率・位置は変えない
     （毎回 fit() すると描いている途中で図が飛び、狙った所に打てなくなる）。
     向きを変えたときと「⊡ 全体」を押したときだけ合わせ直す。 */
  ensureSize();
  if(!view.set){ fit(); view.ever=true; }
  c.setTransform(d,0,0,d,0,0);
  const TH=(typeof nnTH==='function')?nnTH():{paper:'#fbfcf9'};
  const dark=(typeof nnTheme!=='undefined'&&nnTheme==='dark');
  c.clearRect(0,0,W,H); c.fillStyle=TH.paper||'#fbfcf9'; c.fillRect(0,0,W,H);
  labBox=[];

  /* 方眼（平面図と同じ薄い水色） */
  const cellPx=s.cell*view.px;
  if(cellPx>=5){
    const g0=dark?'#1b3140':'#dcecf7', g1=dark?'#3a7a99':'#a6cee4';
    const i0=Math.floor(wx(0)/s.cell), i1=Math.ceil(wx(W)/s.cell);
    const j0=Math.floor(wy(H)/s.cell), j1=Math.ceil(wy(0)/s.cell);
    const bold=Math.max(1,Math.round(0.5/s.cell));
    for(let i=i0;i<=i1;i++){ c.strokeStyle=(i%bold===0)?g1:g0; c.lineWidth=1;
      c.beginPath(); c.moveTo(X(i*s.cell),0); c.lineTo(X(i*s.cell),H); c.stroke(); }
    for(let j=j0;j<=j1;j++){ c.strokeStyle=(j%bold===0)?g1:g0; c.lineWidth=1;
      c.beginPath(); c.moveTo(0,Y(j*s.cell)); c.lineTo(W,Y(j*s.cell)); c.stroke(); }
  }
  /* GL（y=0）の線 */
  c.strokeStyle=dark?'#6f8a5e':'#8aa07a'; c.lineWidth=1.4; c.setLineDash([7,5]);
  c.beginPath(); c.moveTo(0,Y(0)); c.lineTo(W,Y(0)); c.stroke(); c.setLineDash([]);

  const ink=dark?'#dbe7ee':'#0a3c1f';
  const sp=(typeof spec==='function')?spec():{color:'#5a4a42',name:''};
  const n=s.pts.length;

  /* 面（閉じていれば薄く塗る） */
  if(s.closed&&n>=3){
    c.beginPath(); s.pts.forEach((p,i)=>i?c.lineTo(X(p.x),Y(p.y)):c.moveTo(X(p.x),Y(p.y))); c.closePath();
    c.fillStyle=dark?'rgba(120,140,160,.22)':'rgba(150,150,140,.30)'; c.fill();
    /* ★下地（構造体）らしいハッチ（2026-08-18h） */
    try{ if(window.nnKouzouHatch2D) nnKouzouHatch2D(c, s.pts, X, Y, dark); }catch(_){}
  }
  /* 確定した辺 */
  const m=s.closed?n:n-1;
  for(let i=0;i<m;i++){
    const a=s.pts[i], b=s.pts[(i+1)%n];
    const isWp=s.wp.indexOf(i)>=0;
    c.strokeStyle=isWp?(sp.color||'#5a4a42'):(dark?'#9fc9e8':'#0a3c1f');
    c.lineWidth=isWp?2:1;      /* ★平面図と同じ細さに寄せる（4.5px は太すぎた・§124） */
    c.beginPath(); c.moveTo(X(a.x),Y(a.y)); c.lineTo(X(b.x),Y(b.y)); c.stroke();
    /* 寸法 */
    const L=Math.hypot(b.x-a.x,b.y-a.y);
    if(dimsOn && L*view.px>26) dimLab(fmtMM(L), (X(a.x)+X(b.x))/2, (Y(a.y)+Y(b.y))/2, a, b, dark, null, i);
  }
  /* 頂点 */
  s.pts.forEach(p=>{ c.beginPath(); c.arc(X(p.x),Y(p.y),3.2,0,7);
    c.fillStyle='#fff'; c.fill(); c.lineWidth=1; c.strokeStyle=dark?'#9fc9e8':'#0a3c1f'; c.stroke(); });

  /* いま引いている線 */
  const tgt=aim||live;
  if(tool==='draw'&&!s.closed&&n&&tgt){
    const a=s.pts[n-1];
    if(Math.hypot(X(tgt.x)-X(a.x),Y(tgt.y)-Y(a.y))>3){
      c.strokeStyle='#b34c00'; c.lineWidth=1; c.setLineDash([5,4]);
      c.beginPath(); c.moveTo(X(a.x),Y(a.y)); c.lineTo(X(tgt.x),Y(tgt.y)); c.stroke(); c.setLineDash([]);
      if(dimsOn) dimLab(fmtMM(Math.hypot(tgt.x-a.x,tgt.y-a.y)), (X(a.x)+X(tgt.x))/2, (Y(a.y)+Y(tgt.y))/2, a, tgt, dark, '#b34c00');
    }
  }
  /* 「ここで閉じる」の輪 */
  if(tool==='draw'&&!s.closed&&n>=3){
    const a=s.pts[0];
    c.strokeStyle='#b34c00'; c.lineWidth=1.6; c.beginPath(); c.arc(X(a.x),Y(a.y),11,0,7); c.stroke();
    c.fillStyle='#b34c00'; c.font='800 10.5px sans-serif'; c.textAlign='center';
    c.fillText('ここで閉じる', X(a.x), Y(a.y)+26); c.textAlign='left';
  }
  /* 赤い照準（スマホ） */
  if(aim){
    const ax=X(aim.x), ay=Y(aim.y);
    c.strokeStyle='#e01b1b'; c.lineWidth=1.4;
    c.beginPath(); c.arc(ax,ay,10,0,7); c.stroke();
    c.beginPath(); c.moveTo(ax-16,ay); c.lineTo(ax+16,ay); c.moveTo(ax,ay-16); c.lineTo(ax,ay+16); c.stroke();
  }
  /* 案内 */
  const note=document.getElementById('secNote');
  const HINT={draw:'✎ 描く：タップで点を打つ（1マス＝'+fmtMM(s.cell)+'／線は5度きざみ）。始点をタップで閉じる',
    edit:'⇱ 修正：頂点をつまんで動かす／寸法の札をタップで長さを数値入力',
    pan:'✥ 移動：指でなぞると図が動く（2本指ならどの道具でも拡大縮小）',
    pt:'⊕ 点：辺をタップで点を足す／頂点をタップで点を消す',
    wp:'🛡 防水層：辺をタップで防水層を巻く面に（もう一度タップで解除）'};
  if(note) note.textContent = (HINT[tool]||'')
    + (n ? ('　｜　'+n+'点'+(s.closed?('・防水層'+s.wp.length+'辺・奥行き'+s.depth+'m　→「⬔ 3Dで見る」'):'（まだ閉じていません）')) : '');
};
function dimLab(txt,mx,my,a,b,dark,col,ei){
  const ang=Math.atan2(Y(b.y)-Y(a.y), X(b.x)-X(a.x));
  const nx=Math.sin(ang), ny=-Math.cos(ang);
  const x=mx+nx*13, y=my+ny*13;
  c.font='800 11px sans-serif'; c.textAlign='center'; c.textBaseline='middle';
  const w2=c.measureText(txt).width+8;
  if(ei!==undefined&&ei!==null) labBox.push({e:ei, x:x-w2/2, y:y-9, w:w2, h:18});
  c.fillStyle=dark?'rgba(16,26,34,.92)':'rgba(255,255,255,.94)';
  c.fillRect(x-w2/2,y-8,w2,16);
  c.strokeStyle=col||(dark?'#7cc0ff':'#14449c'); c.lineWidth=.8; c.strokeRect(x-w2/2,y-8,w2,16);
  c.fillStyle=col||(dark?'#7cc0ff':'#14449c'); c.fillText(txt,x,y);
  c.textAlign='left'; c.textBaseline='alphabetic';
}

/* --- 操作 --- */
function place(p){
  const s=S();
  if(s.closed)return;
  if(nearStart(p)){ pushUndo(); s.closed=true; save(); nnSdDraw(); return; }
  pushUndo(); s.pts.push(p); save(); nnSdDraw();
}
cv.addEventListener('pointerdown',function(e){
  const s=S();
  if(e.pointerType!=='mouse'&&down&&e.pointerId!==down.id){
    pinch={a:down.pt, b:pos(e), px:view.px, ox:view.ox, oy:view.oy}; aim=null; drag=null; nnSdDraw(); return;
  }
  const p=pos(e);
  down={id:e.pointerId, pt:p, t:Date.now(), moved:0};
  drag=null;
  if(tool==='pan'){ drag={k:'pan', sx:p.x, sy:p.y, ox:view.ox, oy:view.oy}; return; }
  if(tool==='edit'){
    const vi=vertexAt(p.x,p.y);
    if(vi>=0){ pushUndo(); drag={k:'vtx', i:vi}; }
    return;
  }
  if(tool==='wp'||tool==='pt'){ return; }
  /* 描く */
  if(PHONE||e.pointerType!=='mouse'){
    aim=snapPt(wx(p.x+36), wy(p.y-52));
  }else{
    place(snapPt(wx(p.x), wy(p.y)));
  }
  nnSdDraw();
});
cv.addEventListener('pointermove',function(e){
  const p=pos(e);
  if(pinch){
    const b=p, d0=Math.hypot(pinch.b.x-pinch.a.x, pinch.b.y-pinch.a.y)||1;
    const d1=Math.hypot(b.x-pinch.a.x, b.y-pinch.a.y);
    const k=Math.max(.2,Math.min(6,d1/d0));
    const mx=(pinch.a.x+b.x)/2, my=(pinch.a.y+b.y)/2;
    view.px=pinch.px*k;
    view.ox=mx-(mx-pinch.ox)*k; view.oy=my-(my-pinch.oy)*k;
    nnSdDraw(); return;
  }
  if(down) down.moved=Math.max(down.moved, Math.hypot(p.x-down.pt.x,p.y-down.pt.y));
  if(drag&&drag.k==='pan'){
    view.ox=drag.ox+(p.x-drag.sx); view.oy=drag.oy+(p.y-drag.sy); nnSdDraw(); return;
  }
  if(drag&&drag.k==='vtx'){
    /* 頂点は1mm単位で動かす */
    const s=S(), q=s.pts[drag.i];
    if(q){ q.x=Math.round(wx(p.x)*1000)/1000; q.y=Math.round(wy(p.y)*1000)/1000; nnSdDraw(); }
    return;
  }
  if(tool==='draw'){
    if(down&&(PHONE||e.pointerType!=='mouse')){ aim=snapPt(wx(p.x+36), wy(p.y-52)); nnSdDraw(); }
    else if(!down&&e.pointerType==='mouse'&&S().pts.length&&!S().closed){ live=snapPt(wx(p.x),wy(p.y)); nnSdDraw(); }
  }
});
/* パソコンはホイールで拡大縮小（指のピンチと同じこと） */
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  const p=pos(e), k=e.deltaY>0?1/1.12:1.12;
  view.px=Math.max(20,Math.min(20000,view.px*k));
  view.ox=p.x-(p.x-view.ox)*k; view.oy=p.y-(p.y-view.oy)*k;
  nnSdDraw();
},{passive:false});
function up(e){
  const p=down?down.pt:null;
  if(pinch){ pinch=null; down=null; aim=null; return; }
  if(!down){ return; }
  const moved=down.moved;
  const q=pos(e);
  if(drag&&drag.k==='vtx'){ save(); }
  else if(tool==='wp'&&moved<8){
    const i=edgeAt(q.x,q.y);
    if(i>=0){ const s=S(); pushUndo(); const k=s.wp.indexOf(i); if(k>=0)s.wp.splice(k,1); else s.wp.push(i);
      save(); nnSdDraw(); }
  }else if(tool==='pt'&&moved<8){
    const s=S(), vi=vertexAt(q.x,q.y);
    if(vi>=0){
      if(s.pts.length<=3){ toast('これ以上は減らせません（3点は必要）'); }
      else{ pushUndo(); s.pts.splice(vi,1);
        s.wp=s.wp.filter(k=>k<s.pts.length).map(k=>k>vi?k-1:k);
        save(); toast('点を消しました'); }
    }else{
      const ei=edgeAt(q.x,q.y);
      if(ei>=0){ pushUndo();
        const a=s.pts[ei], b=s.pts[(ei+1)%s.pts.length];
        const vx=X(b.x)-X(a.x), vy=Y(b.y)-Y(a.y), L2=vx*vx+vy*vy||1;
        let t=((q.x-X(a.x))*vx+(q.y-Y(a.y))*vy)/L2; t=Math.max(0.05,Math.min(0.95,t));
        s.pts.splice(ei+1,0,{x:+(a.x+(b.x-a.x)*t).toFixed(4), y:+(a.y+(b.y-a.y)*t).toFixed(4)});
        s.wp=s.wp.map(k=>k>ei?k+1:k);
        save(); toast('点を足しました'); }
    }
  }else if(tool==='edit'&&moved<8){
    /* 寸法の札をタップ → その辺の長さを数値で入れる（終点が動く） */
    const ei=labAt(q.x,q.y);
    if(ei>=0) editLen(ei);
  }else if(tool==='draw'&&aim&&(PHONE||e.pointerType!=='mouse')){
    place(aim);
  }
  aim=null; down=null; drag=null; nnSdDraw();
}
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,up));

/* --- 辺の長さを数値で入れる（終点が動く。向きは保つ） --- */
function editLen(ei){
  const s=S(), n=s.pts.length;
  const a=s.pts[ei], b=s.pts[(ei+1)%n];
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
  if(L<1e-6)return;
  const ask=(window.nnNumAsk)||null;
  const apply=v=>{ const mm=parseFloat(v); if(!(mm>0))return;
    /* ★2026-08-24z 上限。断面の1辺が100mを超えることは無い。
       とんでもない数字を入れると図が巨大になり、描き直しが固まる。 */
    if(mm>100000){ if(window.toast)toast('100000mm（100m）までです'); return; }
    pushUndo();
    const k=(mm/1000)/L;
    const t=s.pts[(ei+1)%n];
    t.x=+(a.x+dx*k).toFixed(4); t.y=+(a.y+dy*k).toFixed(4);
    save(); nnSdDraw(); };
  if(ask) ask('辺の長さ（mm）', String(Math.round(L*1000)), apply);
  else { const v=prompt('辺の長さ（mm）', String(Math.round(L*1000))); if(v!==null)apply(v); }
}

/* --- 見本の断面（よくあるパラペット納まり） --- */
function sample(){
  const s=S();
  if(s.pts.length && !confirm('いま描いてある断面を、見本の断面に置き換えますか？'))return;
  pushUndo();
  /* 平場900 ＋ 立上り300 ＋ 天端250 ＋ スラブ150（単位はm・上が＋） */
  s.cell=0.1; s.closed=true; s.depth=2;
  s.pts=[{x:0,y:0},{x:0.9,y:0},{x:0.9,y:0.3},{x:1.15,y:0.3},{x:1.15,y:-0.15},{x:0,y:-0.15}];
  s.wp=[0,1,2];                      /* 平場・立上り・天端に防水層 */
  view.set=false; view.ever=false;
  nnBtnTx(document.getElementById('sd_cell'), '▦ '+fmtMM(s.cell));
  save(); nnSdDraw();
  toast('見本の断面を入れました（平場900・立上り300・天端250）');
}

/* --- ボタン --- */
const TOOLS=['draw','edit','pan','pt','wp'];
function setTool(t){ tool=t; live=null; aim=null; drag=null;
  TOOLS.forEach(k=>{ const b=document.getElementById('sd_'+k); if(b)b.classList.toggle('on',k===t); });
  nnSdDraw(); }
TOOLS.forEach(k=>document.getElementById('sd_'+k).addEventListener('click',()=>setTool(k)));
setTool(tool);   /* ★2026-08-25a 最初の道具（✎描く）にも選択の印を付ける。
                    今まではタップして初めて印が付き、開いた直後は何が選ばれているか分からなかった */
function zoom(k){
  const W=cv.clientWidth||1, H=cv.clientHeight||1, mx=W/2, my=H/2;
  view.px=Math.max(20,Math.min(20000,view.px*k));
  view.ox=mx-(mx-view.ox)*k; view.oy=my-(my-view.oy)*k;
  nnSdDraw();
}
document.getElementById('sd_zin').addEventListener('click',()=>zoom(1.25));
document.getElementById('sd_zout').addEventListener('click',()=>zoom(1/1.25));
document.getElementById('sd_sample').addEventListener('click',sample);
document.getElementById('sd_dim').addEventListener('click',function(){
  dimsOn=!dimsOn; this.classList.toggle('on',dimsOn); nnSdDraw(); });
document.getElementById('sd_undo').addEventListener('click',()=>{
  if(!undoStack.length)return; redoStack.push(snapshot()); apply(undoStack.pop()); save(); nnSdDraw(); });
document.getElementById('sd_redo').addEventListener('click',()=>{
  if(!redoStack.length)return; undoStack.push(snapshot()); apply(redoStack.pop()); save(); nnSdDraw(); });
document.getElementById('sd_clear').addEventListener('click',()=>{
  const s=S(); if(!s.pts.length)return;
  if(!confirm('描いた断面を全部消しますか？'))return;
  pushUndo(); s.pts=[]; s.closed=false; s.wp=[]; view.set=false; view.ever=false; save(); nnSdDraw(); });
document.getElementById('sd_fit').addEventListener('click',()=>{ view.set=false; nnSdDraw(); });
const CELLS=[0.05,0.1,0.25,0.5];
document.getElementById('sd_cell').addEventListener('click',function(){
  const s=S(); let i=CELLS.indexOf(s.cell); s.cell=CELLS[(i+1)%CELLS.length];
  nnBtnTx(this, '▦ '+fmtMM(s.cell)); save(); nnSdDraw(); });
document.getElementById('sd_depth').addEventListener('change',function(){
  const s=S(); s.depth=Math.max(0.2,+this.value||2); save(); nnSdDraw(); });

/* 世界座標→画面座標（検証スクリプト用。内部の X()/Y() と同じもの） */
window.nnSdXY=(x,y)=>({x:X(x), y:Y(y)});
window.nnSdRefresh=function(){
  const s=S();
  nnBtnTx(document.getElementById('sd_cell'), '▦ '+fmtMM(s.cell));
  document.getElementById('sd_depth').value=s.depth;
  document.getElementById('sd_dim').classList.toggle('on',dimsOn);
  setTool(tool); view.set=false; view.ever=false; nnSdDraw();
};
addEventListener('resize',()=>{ try{ nnSdDraw(); }catch(_){}} );          /* 倍率は保つ */
addEventListener('orientationchange',()=>setTimeout(()=>{ view.set=false; try{ nnSdDraw(); }catch(_){}},250));
})();
</script>

<script id="nn-kouzou-js">
/* ============================================================
   下地（構造体）の選択と表現（2026-08-18h・本人の指示）
   RC／S＋ALC／SRC／W／S＋ルーフデッキ を選べるようにし、
   ①2Dの断面図 ②PDF ③3D の3か所で「本当にその構造体らしく」見せる。
   ・2D＝断面の中のハッチ（描き方は構造ごとに違う）
   ・3D＝材質（その場で描いた質感）＋構造の形（デッキの波・垂木・ALCの目地）
   ============================================================ */
(function(){
"use strict";
window.NN_KOUZOU=[
  {k:'rc',    n:'RC（鉄筋コンクリート）',        c:0xd4d0c6, tex:'conc'},
  {k:'salc',  n:'S＋ALC（鉄骨＋ALCパネル）',    c:0xe2e0d8, tex:'alc'},
  {k:'src',   n:'SRC（鉄骨鉄筋コンクリート）',  c:0xcfcbc1, tex:'conc'},
  {k:'w',     n:'W（木造）',                     c:0xc9a97a, tex:'wood'},
  {k:'sdeck', n:'S＋ルーフデッキ（鉄骨＋デッキ）', c:0xbcc3c8, tex:'deck'}
];
const BY=k=>NN_KOUZOU.find(x=>x.k===k)||NN_KOUZOU[0];
window.nnKouzou=()=>{ if(!state.kouzou)state.kouzou='rc'; return BY(state.kouzou); };

/* ---------- その場で描く質感（画像ファイルを増やさない・§80と同じ考え方） ---------- */
let _tex={};
function seq(n,s){ let v=s||1; const o=[]; for(let i=0;i<n;i++){ v=(v*1103515245+12345)&0x7fffffff; o.push(v/0x7fffffff); } return o; }
function mkTex(key,paint){
  if(_tex[key])return _tex[key];
  const cv=document.createElement('canvas'); cv.width=cv.height=256;
  paint(cv.getContext('2d'));
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  _tex[key]=t; return t;
}
function alcTex(){ return mkTex('alc',c=>{
  c.fillStyle='#eceae2'; c.fillRect(0,0,256,256);
  const r=seq(1800,7);
  for(let i=0;i<600;i++){                       /* 気泡（ALCの特徴） */
    const x=r[i*3]*256, y=r[i*3+1]*256, rad=1+r[i*3+2]*2.6;
    c.beginPath(); c.arc(x,y,rad,0,7);
    c.fillStyle='rgba(150,148,138,'+(0.18+r[i*3+2]*0.30)+')'; c.fill();
  }
  c.strokeStyle='rgba(120,118,110,.35)'; c.lineWidth=2;         /* パネルの目地 */
  c.beginPath(); c.moveTo(0,4); c.lineTo(256,4); c.stroke();
}); }
function woodTex(){ return mkTex('wood',c=>{
  c.fillStyle='#c9a97a'; c.fillRect(0,0,256,256);
  const r=seq(900,11);
  for(let i=0;i<70;i++){                        /* 木目 */
    const y=r[i*4]*256, a=0.06+r[i*4+1]*0.16, wv=6+r[i*4+2]*16;
    c.strokeStyle='rgba(120,86,48,'+a+')'; c.lineWidth=0.8+r[i*4+3]*2.2;
    c.beginPath();
    for(let x=0;x<=256;x+=8) c.lineTo(x, y+Math.sin(x/wv+i)*3.2);
    c.stroke();
  }
  c.strokeStyle='rgba(90,64,34,.30)'; c.lineWidth=2;            /* 合板の継ぎ目 */
  c.beginPath(); c.moveTo(0,2); c.lineTo(256,2); c.stroke();
}); }
function deckTex(){ return mkTex('deck',c=>{
  const g=c.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#cfd6db'); g.addColorStop(.5,'#b3bcc3'); g.addColorStop(1,'#c8d0d6');
  c.fillStyle=g; c.fillRect(0,0,256,256);
  const r=seq(600,23);
  for(let i=0;i<300;i++){                       /* 亜鉛めっきのまだら */
    const x=r[i*2]*256, y=r[i*2+1]*256;
    c.fillStyle='rgba(255,255,255,'+(0.05+r[i*2]*0.10)+')';
    c.beginPath(); c.arc(x,y,2+r[i*2+1]*5,0,7); c.fill();
  }
}); }
window.nnKouzouTex=function(kind){
  try{
    if(kind==='alc')return alcTex();
    if(kind==='wood')return woodTex();
    if(kind==='deck')return deckTex();
  }catch(_){}
  return null;
};

/* ---------- 3Dの材質：nnMat を包んで「躯体（concrete）」だけ下地に差し替える ---------- */
const _mat=window.nnMat;
window.nnMat=function(kind,color,dbl){
  if(kind==='concrete'){
    /* ★2026-08-23h 屋根ごとの下地：build3D が組み立て中の部位の下地（_nnKzHint）を優先 */
    const K=window._nnKzHint?BY(window._nnKzHint):nnKouzou();
    if(K.tex!=='conc'){
      const m=new THREE.MeshStandardMaterial({color:K.c,
        roughness:(K.tex==='deck'?0.42:K.tex==='wood'?0.72:0.90),
        metalness:(K.tex==='deck'?0.55:0.0),
        side: dbl?THREE.DoubleSide:THREE.FrontSide});
      const t=nnKouzouTex(K.tex);
      if(t){ m.map=t; m.bumpMap=t; m.bumpScale=(K.tex==='deck'?0.10:0.26); }
      return m;
    }
    return _mat.call(this,kind,K.c,dbl);        /* RC・SRC はコンクリート質感のまま色だけ合わせる */
  }
  return _mat.apply(this,arguments);
};

/* ---------- 2Dの断面ハッチ（描いた輪郭の中に、構造らしい模様を描く） ---------- */
window.nnKouzouHatch2D=function(c, pts, X, Y, dark){
  if(!pts||pts.length<3)return;
  const K=nnKouzou();
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  pts.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);});
  c.save();
  c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(X(p.x),Y(p.y)):c.moveTo(X(p.x),Y(p.y))); c.closePath(); c.clip();
  const L=X(x1)-X(x0), H=Y(y0)-Y(y1);
  const g=(a)=>dark?'rgba(190,205,215,'+a+')':'rgba(70,70,64,'+a+')';
  if(K.tex==='conc'){
    /* コンクリート＝45度の細線＋骨材の点 */
    c.strokeStyle=g(.30); c.lineWidth=.8;
    for(let d=-H; d<L+H; d+=9){ c.beginPath(); c.moveTo(X(x0)+d, Y(y0)); c.lineTo(X(x0)+d+H, Y(y1)); c.stroke(); }
    c.fillStyle=g(.34);
    const r=seq(900,3);
    for(let i=0;i<220;i++){ const x=X(x0)+r[i*3]*L, y=Y(y1)+r[i*3+1]*H;
      c.beginPath(); c.arc(x,y,.9+r[i*3+2]*1.7,0,7); c.fill(); }
    if(K.k==='src'){
      /* SRC＝中に鉄骨（H形鋼）の記号 */
      const cx=(X(x0)+X(x1))/2, cy=(Y(y0)+Y(y1))/2, w=Math.min(46,L*0.34), h=Math.min(34,H*0.5);
      c.strokeStyle=dark?'#9fd0ff':'#14449c'; c.lineWidth=2.4;
      c.beginPath();
      c.moveTo(cx-w/2,cy-h/2); c.lineTo(cx+w/2,cy-h/2);
      c.moveTo(cx-w/2,cy+h/2); c.lineTo(cx+w/2,cy+h/2);
      c.moveTo(cx,cy-h/2); c.lineTo(cx,cy+h/2);
      c.stroke();
    }
  }else if(K.tex==='alc'){
    /* ALC＝パネルの目地（600mmごと）＋気泡 */
    c.strokeStyle=g(.34); c.lineWidth=1.4;
    for(let x=Math.ceil(x0/0.6)*0.6; x<x1; x+=0.6){ c.beginPath(); c.moveTo(X(x),Y(y0)); c.lineTo(X(x),Y(y1)); c.stroke(); }
    c.fillStyle=g(.22);
    const r=seq(900,5);
    for(let i=0;i<260;i++){ const x=X(x0)+r[i*3]*L, y=Y(y1)+r[i*3+1]*H;
      c.beginPath(); c.arc(x,y,1.0+r[i*3+2]*1.5,0,7); c.fill(); }
  }else if(K.tex==='wood'){
    /* W＝木造屋根の断面：上に野地板（合板12mm×2枚）、その下に垂木（45×105 @455）。
       ★全体を木で塗りつぶさない。実際の木造は「板＋垂木＋空き」なので、そう描かないと構造に見えない。 */
    const top=y1;
    c.strokeStyle=g(.45); c.lineWidth=1.1;
    [0.012,0.024].forEach(t=>{ const yy=top-t; if(yy<=y0)return;
      c.beginPath(); c.moveTo(X(x0),Y(yy)); c.lineTo(X(x1),Y(yy)); c.stroke(); });
    /* 野地板の木目（上の帯だけ） */
    c.strokeStyle=g(.20); c.lineWidth=.8;
    const r=seq(600,9);
    for(let i=0;i<10;i++){ const yy=Y(top)+ (Y(top-0.024)-Y(top))*((i+0.5)/10);
      c.beginPath();
      for(let x=X(x0); x<=X(x1); x+=12) c.lineTo(x, yy+Math.sin(x/17+i)*1.2);
      c.stroke(); }
    /* 垂木（455mmピッチ・45×105 の四角） */
    const bw=0.045, bh=0.105, pitch=0.455, ry=top-0.024;
    c.strokeStyle=g(.60); c.lineWidth=1.3;
    c.fillStyle=dark?'rgba(190,205,215,.10)':'rgba(120,95,55,.16)';
    for(let x=x0+0.05; x<x1-bw; x+=pitch){
      const yb=Math.max(y0, ry-bh);
      c.beginPath(); c.rect(X(x), Y(ry), (X(x+bw)-X(x)), (Y(yb)-Y(ry)));
      c.fill(); c.stroke();
      /* 木口のしるし（×） */
      c.beginPath(); c.moveTo(X(x),Y(ry)); c.lineTo(X(x+bw),Y(yb));
      c.moveTo(X(x+bw),Y(ry)); c.lineTo(X(x),Y(yb)); c.stroke();
    }
  }else if(K.tex==='deck'){
    /* S＋ルーフデッキ＝躯体の中は鋼板の面（45度の細線）だけ。波は下にぶら下げる（下で描く） */
    c.strokeStyle=g(.22); c.lineWidth=.8;
    for(let d=-H; d<L+H; d+=14){ c.beginPath(); c.moveTo(X(x0)+d, Y(y0)); c.lineTo(X(x0)+d+H, Y(y1)); c.stroke(); }
  }
  c.restore();

  /* ★デッキは「描いた躯体の下に付く」＝クリップの外に描く。
     こうしないと3Dでも下面が見えず（カメラは水平までしか下がらない）、構造が分からない。 */
  if(K.tex==='deck'){
    const P=0.15, HT=0.05;
    c.save();
    c.strokeStyle=dark?'rgba(190,205,215,.75)':'rgba(70,70,64,.75)'; c.lineWidth=1.6;
    c.lineJoin='round';
    c.beginPath(); let first=true;
    for(let x=x0; x<x1+P; x+=P){
      [[x,y0],[x+P*0.22,y0-HT],[x+P*0.62,y0-HT],[x+P*0.84,y0]].forEach(q=>{
        const sx=X(Math.min(q[0],x1)), sy=Y(q[1]);
        if(first){ c.moveTo(sx,sy); first=false; } else c.lineTo(sx,sy);
      });
      if(x+P*0.84>=x1)break;
    }
    c.stroke();
    c.fillStyle=dark?'rgba(190,205,215,.55)':'rgba(90,95,100,.60)';
    c.font='800 10.5px sans-serif'; c.textAlign='left';
    c.fillText('デッキプレート t1.2（山高50・ピッチ150）', X(x0), Y(y0-HT)+16);
    c.textAlign='left'; c.restore();
  }
};

/* ---------- 3Dの構造の形（断面を押し出した立体に足す） ----------
   デッキ＝台形の波／木造＝垂木／ALC＝パネルの目地。RC・SRCは形を足さない（質感だけ）。 */
window.nnKouzouMesh3D=function(group, sect, D){
  const K=nnKouzou(); if(K.tex==='conc')return;
  const pts=sect.pts;
  let x0=1e9,x1=-1e9,y0=1e9;
  pts.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);});
  const W=x1-x0; if(W<=0)return;
  const add=(shape,mat,z)=>{
    const gg=new THREE.ExtrudeGeometry(shape,{depth:(z||D),bevelEnabled:false});
    gg.translate(0,0,-(z||D)/2);
    if(typeof nnUvMetric==='function'){ try{ nnUvMetric(gg, NN_TEX_PER_M, NN_TEX_PER_M); }catch(_){} }
    const m=new THREE.Mesh(gg,mat); m.castShadow=true; m.receiveShadow=true; m.name='nnKouzou'; group.add(m);
  };
  const mk=(color,rough,metal,texKind)=>{
    const m=new THREE.MeshStandardMaterial({color, roughness:rough, metalness:metal, side:THREE.DoubleSide});
    const t=nnKouzouTex(texKind); if(t){ m.map=t; m.bumpMap=t; m.bumpScale=0.18; }
    return m;
  };
  if(K.tex==='deck'){
    /* デッキプレート＝厚さ1.2mmの鋼板を、2Dの断面図と同じ「上向きの台形の波」で作る。
       下面が見えるので、下から見ると波形の天井（デッキの裏）に見える。 */
    const P=0.15, HT=0.05, TH2=0.0012, mat=mk(K.c,0.42,0.55,'deck');
    const prof=[];
    for(let x=x0; x<x1+P; x+=P){
      prof.push([Math.min(x1,x),y0], [Math.min(x1,x+P*0.22),y0-HT],
                [Math.min(x1,x+P*0.62),y0-HT], [Math.min(x1,x+P*0.84),y0]);
      if(x+P*0.84>=x1)break;
    }
    const up=prof.map(q=>[q[0],q[1]]);
    const dn=prof.slice().reverse().map(q=>[q[0],q[1]-TH2]);   /* 板厚1.2mm */
    const sh=new THREE.Shape(up.concat(dn).map(q=>new THREE.Vector2(q[0],q[1])));
    add(sh,mat);
  }else if(K.tex==='wood'){
    /* 垂木（45×105 @455mm）を下面の下に並べる */
    const mat=mk(0xb08b58,0.72,0,'wood'), bw=0.045, bh=0.105, pitch=0.455;
    for(let x=x0+0.05; x<x1-bw; x+=pitch){
      const sh=new THREE.Shape([[x,y0],[x+bw,y0],[x+bw,y0-bh],[x,y0-bh]].map(q=>new THREE.Vector2(q[0],q[1])));
      add(sh,mat);
    }
  }else if(K.tex==='alc'){
    /* パネルの目地（600mmごと・幅10mm・深さ8mm の溝を表す細い板） */
    const mat=new THREE.MeshStandardMaterial({color:0x9a978d, roughness:0.95, side:THREE.DoubleSide});
    for(let x=Math.ceil(x0/0.6)*0.6; x<x1; x+=0.6){
      const sh=new THREE.Shape([[x-0.005,y0],[x+0.005,y0],[x+0.005,y0+0.008],[x-0.005,y0+0.008]]
        .map(q=>new THREE.Vector2(q[0],q[1])));
      add(sh,mat);
    }
  }
};

/* ---------- PDF用のハッチ（SVGのパターン） ---------- */
window.nnKouzouSvgDefs=function(){
  const K=nnKouzou();
  const line=(sw,col)=>'<pattern id="kz" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    +'<rect width="3" height="3" fill="#f2f1ec"/><line x1="0" y1="0" x2="0" y2="3" stroke="'+col+'" stroke-width="'+sw+'"/></pattern>';
  if(K.tex==='alc') return '<pattern id="kz" width="4" height="4" patternUnits="userSpaceOnUse">'
    +'<rect width="4" height="4" fill="#f2f1ea"/><circle cx="1.3" cy="1.3" r="0.5" fill="#b9b6ac"/>'
    +'<circle cx="3.1" cy="2.8" r="0.4" fill="#b9b6ac"/></pattern>';
  if(K.tex==='wood') return '<pattern id="kz" width="6" height="2" patternUnits="userSpaceOnUse">'
    +'<rect width="6" height="2" fill="#efe0c8"/><line x1="0" y1="1.7" x2="6" y2="1.7" stroke="#b98f55" stroke-width="0.3"/></pattern>';
  if(K.tex==='deck') return '<pattern id="kz" width="4" height="4" patternUnits="userSpaceOnUse">'
    +'<rect width="4" height="4" fill="#eaeef1"/><line x1="0" y1="0" x2="0" y2="4" stroke="#9aa6ae" stroke-width="0.35"/></pattern>';
  return line(0.3,'#9a978d');     /* RC・SRC */
};
window.nnKouzouFill=()=>'url(#kz)';

/* ---------- UI（積算・設定パネル＋断面バー） ---------- */
function opts(){ return NN_KOUZOU.map(x=>'<option value="'+x.k+'">'+x.n+'</option>').join(''); }
/* ★バー用は短い名前。「RC（鉄筋コンクリート）」のままだと1行まるごと使ってしまう */
const SHORT={rc:'RC', salc:'S＋ALC', src:'SRC', w:'W（木造）', sdeck:'S＋デッキ'};
function optsShort(){ return NN_KOUZOU.map(x=>'<option value="'+x.k+'" title="'+x.n+'">'+(SHORT[x.k]||x.n)+'</option>').join(''); }
function onChange(v){
  state.kouzou=v;
  document.querySelectorAll('.nnKzSel').forEach(el=>{ el.value=v; });
  try{ if(typeof saveState==='function') saveState(); }catch(_){}
  try{ if(window.nnSdDraw) nnSdDraw(); }catch(_){}
  try{ if(window.nnSecDraw) nnSecDraw(); }catch(_){}
  try{ dirty3d=true; if(tab==='d3') build3D(); }catch(_){}
}
window.nnKouzouSet=onChange;
function build(){
  const side=document.getElementById('side');
  if(side && !document.getElementById('nnKzPanel')){
    const d=document.createElement('div'); d.className='panel'; d.id='nnKzPanel';
    d.innerHTML='<h4>下地（構造体）</h4>'
      +'<select class="nnKzSel" style="width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:8px; font-size:13px; font-weight:800; font-family:inherit; background:#fff;">'+opts()+'</select>'
      +'<div style="font-size:11.5px; color:var(--ink-sub); font-weight:700; margin-top:6px; line-height:1.6">'
      +'断面図のハッチ・PDF・3Dの質感が、選んだ構造体のものに変わります。</div>';
    side.insertBefore(d, side.firstChild);
  }
  const bar=document.getElementById('secBar');
  if(bar && !document.getElementById('nnKzBar')){
    const sp=document.createElement('span'); sp.id='nnKzBar'; sp.style.display='contents';
    sp.innerHTML='<span class="lb hidesp">下地</span>'
      +'<select class="nnKzSel" id="nnKzBarSel" title="下地（構造体）">'+optsShort()+'</select>';
    const anchor=document.getElementById('secFree');
    bar.insertBefore(sp, anchor?anchor.nextSibling:null);
  }
  document.querySelectorAll('.nnKzSel').forEach(el=>{
    if(el._nnKz)return; el._nnKz=1;
    el.value=(state.kouzou||'rc');
    el.addEventListener('change',function(){ onChange(this.value); });
  });
}
addEventListener('load',()=>{ build(); setTimeout(build,600); });
build();
})();
</script>

<script id="nn-trail-js">
/* ============================================================
   指をなぞると光がついてくる（2026-08-19b・本人の指示）
   線を引く・頂点をつまむ等の細かい操作で「いま指がどこにあるか」が分かるようにする。
   ・画面いっぱいの透明なキャンバスを1枚だけ用意し、指が触れている間だけ描く
   ・座標は clientX/Y をそのまま「画面の実px」として使う（表示倍率 zoom の影響を受けない）
   ・pointer-events:none なので、下のボタンや作図の邪魔は一切しない
   ============================================================ */
(function(){
"use strict";
var cv=null, ctx=null, pts=[], raf=null, active=false, lastT=0;
var LIFE=420;                     /* 光が消えるまで(ms) */
function make(){
  if(cv)return;
  cv=document.createElement('canvas');
  cv.id='nnTrail';
  cv.style.cssText='position:fixed; left:0; top:0; width:100%; height:100%;'
    +'pointer-events:none; z-index:9997;';
  document.body.appendChild(cv);
  ctx=cv.getContext('2d');
}
function fit(){
  var r=cv.getBoundingClientRect();
  /* ★2026-08-26b にじむ光なので等倍で十分。2倍だと描く画素が4倍になり、
     指を置いている間ずっとその分の仕事が挟まっていた（ラグの一因）。 */
  var d=1;
  var w=Math.round(r.width*d), h=Math.round(r.height*d);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  return {r:r, k:cv.width/(r.width||1)};   /* k＝画面px→キャンバスpxの倍率（＝dpr） */
}
function draw(){
  if(!cv){ raf=null; return; }
  var g=fit(), k=g.k, now=performance.now();
  ctx.clearRect(0,0,cv.width,cv.height);
  /* 寿命の切れた点を落とす */
  while(pts.length && now-pts[0].t>LIFE) pts.shift();
  if(pts.length>=2){
    /* しっぽ：新しいほど太く明るい */
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var age=(now-b.t)/LIFE; if(age<0)age=0; if(age>1)age=1;
      var al=(1-age)*0.85;
      /* ★2026-08-26b shadowBlur（にじみ）は1本ごとにぼかし計算が走って重いのでやめ、
         「太く薄い線＋細く明るい線」の2度がきで同じ見え方にする */
      ctx.strokeStyle='rgba(255,180,40,'+(al*0.30).toFixed(3)+')';
      ctx.lineWidth=(7+12*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
      ctx.strokeStyle='rgba(255,217,77,'+al.toFixed(3)+')';
      ctx.lineWidth=(2.5+6*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
    }
  }
  /* 指の先の光 */
  if(active && pts.length){
    var p=pts[pts.length-1];
    var gr=ctx.createRadialGradient(p.x*k,p.y*k,0, p.x*k,p.y*k,9*k);
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.45,'rgba(255,217,77,.80)');
    gr.addColorStop(1,'rgba(255,157,30,0)');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(p.x*k,p.y*k,9*k,0,7); ctx.fill();
  }
  if(active || pts.length){ raf=requestAnimationFrame(draw); }
  else { raf=null; ctx.clearRect(0,0,cv.width,cv.height); }
}
function add(e){
  var now=performance.now();
  if(now-lastT<8) return;          /* 詰めすぎない */
  lastT=now;
  pts.push({x:e.clientX, y:e.clientY, t:now});
  if(pts.length>90) pts.shift();
  if(!raf) raf=requestAnimationFrame(draw);
}
var downX=0, downY=0, movedOn=false;
addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse' && e.buttons===0) return;
  /* ★2026-08-26b タップ（動かさない指）では何も描かない。
     以前は押した瞬間から画面いっぱいのキャンバスを毎コマ描き直していて、
     ボタンを押すたびにその仕事が挟まっていた（ラグの一因）。
     7px以上なぞったときだけ描き始める（なぞりの光は今までどおり）。 */
  active=true; movedOn=false; downX=e.clientX; downY=e.clientY;
},true);
addEventListener('pointermove',function(e){
  if(!active)return;
  if(!movedOn){
    if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)<7) return;
    movedOn=true; make(); pts.length=0;
    pts.push({x:downX, y:downY, t:performance.now()});
  }
  add(e);
},true);
function end(){ active=false; movedOn=false; if(!raf&&cv&&pts.length) raf=requestAnimationFrame(draw); }
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  addEventListener(ev,end,true);
});
})();
</script>

<script id="nn-detail-js">
/* ============================================================
   標準納まり詳細図（2026-08-19e・作り直し）
   ★版dは「参考図に載っている要素を並べた」だけで、図面として読めなかった。
     参考図（公共建築工事標準詳細図）を画素で実測して分かった差は5つ。
       ①躯体＝薄いグレー塗り＋まばらな二重斜線（細かいハッチではない）
       ②防水層＝太い黒帯（一目で追える）
       ③文字＝図の高さの約3.7%（版dは約1%＝1/4の大きさだった）
       ④引出線＝指す先のすぐ脇から短く。図を横断させない
       ⑤図が紙の主役（版dは紙の左半分だけ）
     この5点を数値で決め打ちして描き直したのがこのファイル。
   ★世界座標は mm・y は上が＋。原点＝立上り内側の面（x=0）×
     平場コンクリート下地の面（y=0）。
   ★寸法の数値は必ず「実物の mm」を渡すこと（座標の差は紙の mm）。
   ============================================================ */
(function(){
"use strict";

/* ---------- 見え方の決め事（ここを変えれば図全体の印象が変わる） ---------- */
const STY={
  txtDim : 4.0,     /* 寸法の数値（紙mm） */
  txtLead: 3.6,     /* 引出線の文字 */
  txtNote: 3.0,     /* 注記・層構成 */
  wBody  : 0.6,     /* 躯体の輪郭 */
  wWp    : 5,       /* 防水層の帯（実物mm。紙では×縮尺） */
  wWpMin : 1.1,     /* 防水層の帯の紙上の最小の太さ */
  wDim   : 0.22,    /* 寸法線 */
  wExt   : 0.15,    /* 寸法補助線 */
  wLead  : 0.22,    /* 引出線 */
  leadMax: 30,      /* 引出線の長さの上限（紙mm）★これを超えると図を横断する */
  cBody  : '#e6e6e6'
};

/* ---------- ① 役物の断面の形（mm・原点は取り付け位置） ---------- */
const PARTS={
  /* アルミニウム製押え金物：右へ出て先端が下へ垂れる（使う側で左右反転） */
  osae:function(D,T,L){ D=D||25; T=T||2.2; L=L||10;
    return [[0,0],[D,0],[D,-L],[D-T,-L],[D-T,-T],[0,-T]]; },
  /* アルミ笠木（コーピング）：天端にかぶせ両側が垂れる */
  kasagi:function(W,T,L){ T=T||2.2; L=L||26;
    return [[0,0],[W,0],[W,-L],[W-T,-L],[W-T,-T],[T,-T],[T,-L],[0,-L]]; },
  cant:function(A){ return [[0,0],[A,0],[A,A]]; },
  seal:function(A){ return [[0,0],[A,0],[0,A]]; }
};

/* ---------- ③ ハッチング（参考図の見え方に合わせた） ---------- */
function hatchDefs(){
  return '<defs>'
  /* 躯体：まばらな二重斜線（塗りは別に敷く） */
  +'<pattern id="hRC" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
  +'<line x1="0" y1="0" x2="0" y2="13" stroke="#8b8b8b" stroke-width="0.35"/>'
  +'<line x1="1.6" y1="0" x2="1.6" y2="13" stroke="#8b8b8b" stroke-width="0.35"/></pattern>'
  /* 外壁仕上げ：同じ斜線を逆向きに、もっとまばらに */
  +'<pattern id="hFin" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">'
  +'<line x1="0" y1="0" x2="0" y2="11" stroke="#9aa0a0" stroke-width="0.3"/></pattern>'
  /* 断熱材：緑のクロス */
  +'<pattern id="hIns" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
  +'<line x1="0" y1="0" x2="0" y2="3.2" stroke="#2f8a45" stroke-width="0.34"/>'
  +'<line x1="0" y1="0" x2="3.2" y2="0" stroke="#2f8a45" stroke-width="0.34"/></pattern>'
  /* モルタル・成形キャント材：水色の点 */
  +'<pattern id="hMor" width="2.6" height="2.6" patternUnits="userSpaceOnUse">'
  +'<circle cx="1.3" cy="1.3" r="0.34" fill="#3f8fc0"/></pattern>'
  /* シール材：濃い緑のクロス */
  +'<pattern id="hSeal" width="1.8" height="1.8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
  +'<line x1="0" y1="0" x2="0" y2="1.8" stroke="#1d6b34" stroke-width="0.38"/>'
  +'<line x1="0" y1="0" x2="1.8" y2="0" stroke="#1d6b34" stroke-width="0.38"/></pattern>'
  +'</defs>';
}

/* ---------- ② 寸法の作法 ---------- */
function mkDim(A){
  const D={};
  D.ext=(x1,y1,x2,y2)=>A.line(x1,y1,x2,y2,STY.wExt,'#555');
  D.h=function(xa,xb,yLine,yFrom,val,ref,sz){
    const s=(yFrom>yLine?-1:1);
    D.ext(xa,yFrom,xa,yLine-s*2); D.ext(xb,yFrom,xb,yLine-s*2);
    A.line(xa,yLine,xb,yLine,STY.wDim,'#111');
    A.dot(xa,yLine,0.7,'#111'); A.dot(xb,yLine,0.7,'#111');
    A.text((xa+xb)/2, yLine-1.6, (ref?'(':'')+Math.round(val)+(ref?')':''), sz||STY.txtDim,'middle','#111',false);
  };
  D.v=function(ya,yb,xLine,xFrom,val,ref,sz){
    const s=(xFrom>xLine?-1:1);
    D.ext(xFrom,ya,xLine-s*2,ya); D.ext(xFrom,yb,xLine-s*2,yb);
    A.line(xLine,ya,xLine,yb,STY.wDim,'#111');
    A.dot(xLine,ya,0.7,'#111'); A.dot(xLine,yb,0.7,'#111');
    A.text(xLine-1.8, (ya+yb)/2+1.4, (ref?'(':'')+Math.round(val)+(ref?')':''), sz||STY.txtDim,'end','#111',false);
  };
  return D;
}

/* ---------- 破断線 ---------- */
function breakLine(A,x1,y1,x2,y2,amp){
  const n=8, dx=(x2-x1)/n, dy=(y2-y1)/n, a=amp||2.0;
  const nx=-(y2-y1), ny=(x2-x1), L=Math.hypot(nx,ny)||1;
  const ux=nx/L*a, uy=ny/L*a, pts=[[x1,y1]];
  for(let i=1;i<n;i++) pts.push([x1+dx*i+ux*(i%2?1:-1), y1+dy*i+uy*(i%2?1:-1)]);
  pts.push([x2,y2]);
  A.pl(pts,null,0.3,'#333',null,false);
}

const PRESETS={
  /* ★型は「端末の納まり」で分ける。工法（材料）は別に選ぶので、名前に工法を入れない
     （版dは「塗膜防水…」の題で工法AS-T1の層構成が出て、図と説明が食い違っていた） */
  osae  :{name:'立上り端末（アルミニウム製押え金物）', no:'-D1'},
  kasagi:{name:'パラペット天端（アルミ笠木）',        no:'-D2'},
  sheet :{name:'立上り端末（シート端末押え）',        no:'-D3'}
};

/* ============================================================ */
window.nnDetailPDF=function(kind,opt){
  const KIT=window.nnSheetKit;
  if(!KIT){ if(window.toast)toast('図面の部品が読み込めませんでした'); return; }
  const A=KIT.mk(), SH=KIT.sheetGeom(true);
  const pre=PRESETS[kind]||PRESETS.osae; kind=PRESETS[kind]?kind:'osae';
  const P=Object.assign({H:300, tw:180, cant:70, ins:50, slab:150, osD:25,
                         outFin:20, roof:210, under:0, topFin:25, slabShow:80}, opt||{});
  P.termH=Math.max(P.ins+P.cant+40, P.H-90);

  A.S.push(hatchDefs());
  KIT.frame(A,SH);

  /* --- 版面のわりつけ：図が主役。右の帯に文字をまとめる --- */
  const padT=10;                                  /* 図面名の下 */
  const colW=(SH.ax1-SH.ax0)*0.66;                /* 図の列 */
  const rx0=SH.ax0+colW+6;                        /* 右の列の左端 */
  /* ★寸法線と数値が入る余白を「先に」引いてから縮尺を決める。
     これをやらないと図が図枠からはみ出す（版dで実際にはみ出した）。 */
  const mL=45, mT=28, mB=10, mR=6;
  const figX0=SH.ax0+mL, figY0=SH.ay0+padT+mT;
  const figW=colW-mL-mR, figH=(SH.ay1-SH.ay0)-padT-mT-mB;

  /* --- 縮尺（キリのいい値。1/2 が入るなら 1/2） --- */
  const wMM=P.roof+P.tw+P.outFin, hMM=P.H+P.slabShow;
  let sc=null; [2,5,10,20,50].forEach(s=>{ if(!sc && wMM/s<=figW && hMM/s<=figH) sc=s; });
  if(!sc) sc=50;
  const K=1/sc;

  const ox=figX0+(figW-wMM*K)/2+P.roof*K;
  const oy=figY0+(figH-hMM*K)/2+P.H*K;
  const X=x=>ox+x*K, Y=y=>oy-y*K;
  const poly=(pts,fill,sw,col)=>A.pl(pts.map(p=>[X(p[0]),Y(p[1])]),fill,sw,col,null,true);

  A.text(SH.ax0+2, SH.ay0+8, pre.name+'　S=1/'+sc, 5.4,'start','#111',true);
  if(P.spObj) A.text(SH.ax0+2, SH.ay0+14.6, '工法：'+P.spObj.code+'｜'+P.spObj.name, 3.2,'start','#444');

  const H=P.H, tw=P.tw, cant=P.cant, ins=P.ins, slab=P.slab, oF=P.outFin;
  const rL=-P.roof, bot=-P.slabShow, term=P.termH, sB=-P.slabShow;

  /* --- 躯体（L形：平場スラブ＋パラペット）＝薄グレー塗り＋まばらな二重斜線 --- */
  const bodyPts=[[rL,0],[0,0],[0,H],[tw,H],[tw,bot],[0,bot],[0,sB],[rL,sB]];
  poly(bodyPts, STY.cBody, 0, 'none');
  poly(bodyPts, 'url(#hRC)', STY.wBody, '#111');
  breakLine(A,X(rL),Y(0),X(rL),Y(sB),1.8);
  breakLine(A,X(0),Y(bot),X(tw+oF),Y(bot),1.8);

  /* --- 外壁仕上げ --- */
  if(oF>0){
    poly([[tw,H],[tw+oF,H],[tw+oF,bot],[tw,bot]], '#f0f1f0', 0, 'none');
    poly([[tw,H],[tw+oF,H],[tw+oF,bot],[tw,bot]], 'url(#hFin)', 0.35, '#666');
  }

  /* --- 断熱材 --- */
  if(ins>0){
    poly([[rL,0],[0,0],[0,ins],[rL,ins]], '#fff', 0, 'none');
    poly([[rL,0],[0,0],[0,ins],[rL,ins]], 'url(#hIns)', 0.35, '#2f8a45');
  }
  /* --- 成形キャント材 --- */
  poly(PARTS.cant(cant).map(p=>[-cant+p[0], ins+p[1]]), '#fff', 0, 'none');
  poly(PARTS.cant(cant).map(p=>[-cant+p[0], ins+p[1]]), 'url(#hMor)', 0.35, '#2f6f9a');

  /* --- 防水層＝太い黒帯（一目で追える太さにする） --- */
  const wpTop=(kind==='kasagi')? H-8 : term;
  const wpW=Math.max(STY.wWpMin, STY.wWp*K);
  A.pl([[X(rL),Y(ins)],[X(-cant),Y(ins)],[X(0),Y(ins+cant)],[X(0),Y(wpTop)]]
        .map(p=>[p[0],p[1]]), null, wpW, '#111', null, false);

  if(kind==='kasagi'){
    poly(PARTS.kasagi(tw+oF+18).map(p=>[-9+p[0], H+9+p[1]]), '#333', 0.4, '#111');
    poly(PARTS.seal(14).map(p=>[tw+oF-p[0], H-18+p[1]]), 'url(#hSeal)', 0.32, '#1d6b34');
    poly(PARTS.seal(14).map(p=>[-9+p[0], H-18+p[1]]), 'url(#hSeal)', 0.32, '#1d6b34');
  }else{
    /* 押え金物＝黒く塗る（小さくても必ず見える） */
    poly(PARTS.osae(P.osD).map(p=>[-p[0], term+p[1]]), '#111', 0.3, '#111');
    /* ステンレスビス */
    A.line(X(-P.osD+4),Y(term-5),X(26),Y(term-5),Math.max(0.45,1.2*K),'#111');
    /* シール材 */
    poly(PARTS.seal(14).map(p=>[-p[0], term+p[1]]), 'url(#hSeal)', 0.32, '#1d6b34');
    /* 天端の仕上げ（外側へ回し込む） */
    A.pl([[X(-wpW/K/2),Y(H)],[X(tw+oF),Y(H)],[X(tw+oF),Y(H-P.topFin)]],
         null, Math.max(0.6,2.0*K), '#111', null, false);
  }

  /* ---------- 寸法：左にたて、上によこ ---------- */
  const D=mkDim(A);
  const vx1=X(rL)-8, vx2=X(rL)-20;
  D.v(Y(H), Y(0), vx2, X(rL), H, false, 4.6);
  A.text(vx2-1.8, (Y(H)+Y(0))/2+8, '（水上300以上）', 2.9,'end','#333');
  D.v(Y(H), Y(term), vx1, X(-P.osD), H-term, true);
  D.v(Y(term), Y(ins+cant), vx1, X(0), term-(ins+cant), true);
  D.v(Y(ins+cant), Y(0), vx1, X(-cant), ins+cant, true);
  const ty1=Y(H)-10, ty2=Y(H)-20;
  D.h(X(0), X(tw), ty1, Y(H), tw, true);
  D.h(X(tw), X(tw+oF), ty1, Y(H), oF, true);
  D.h(X(-P.osD), X(tw+oF), ty2, Y(H), P.osD+tw+oF, true);
  D.h(X(-P.osD), X(0), Y(term)+13, Y(term), P.osD, true);
  D.h(X(-cant), X(0), Y(ins)+11, Y(ins), cant, true);
  if(ins>0) D.v(Y(ins), Y(0), X(rL)+26, X(rL+70), ins, true, 3.2);

  /* ---------- 引出線：屋根側の空き（void）に置く ----------
     ★文字を上に固めると、下の部材（スラブ・躯体）へ引く線が
       図を130mmも縦断していた。**文字の高さを、指す先の高さに合わせて並べる**と
       線はほぼ水平になり、横断が消える（実測 130mm → 40mm 以下）。 */
  const elbow=X(rL)+84;
  const items=[];
  const add=(px,py,txt,sub)=>items.push({px:px,py:py,txt:txt,sub:sub});
  if(kind==='kasagi'){
    /* ★笠木は左端を指す（右端を指すと線が天端を横断する） */
    add(X(-7), Y(H+16), 'アルミ笠木（コーピング）');
    add(X(-5), Y(H-14), '（シール材）');
  }else{
    add(X(tw*0.45), Y(H), kind==='sheet'?'（指定仕上材）':'（塗膜防水又は指定仕上材のいずれか）');
    add(X(-6), Y(term+9), '（シール材）');
    add(X(-P.osD*0.5), Y(term-5), 'アルミニウム製押え金物', 'ステンレスビス＠450以下');
  }
  add(X(-1.5), Y((term+ins+cant)/2), '防水層');
  add(X(-cant*0.45), Y(ins+cant*0.32), 'モルタル又は成形キャント材');
  if(ins>0) add(X(rL*0.45), Y(ins*0.5), '断熱材');
  add(X(rL*0.55), Y(sB*0.5), 'コンクリート下地（スラブ）');
  /* ★躯体は「壁の高いところ」を指す。下端を指すと引出線が図を斜めに縦断する */
  add(X(tw*0.55), Y((ins+cant+H)/2), 'コンクリート躯体（パラペット）');
  /* 指す先の高さの順に並べ、上から詰める（重ならないだけ下げる） */
  items.sort((a,b)=>a.py-b.py);
  /* ★文字は屋根側の空き（void）の中だけに置く。外れると図の材料に重なる。
     並べ方：①指す先の高さを希望値にする ②上から押し下げて重なりを解く
     ③はみ出したら下端から引き上げる。②だけだと下の数個が下端で団子になる
     （試作で「コンクリート下地」「躯体」が断熱材の上で重なった）。 */
  const yTop=Y(H)+6, yBot=Y(ins)-5, gap=7.2;
  items.forEach(it=>{ it.h=it.sub?11:7.2; it.want=Math.min(Math.max(it.py,yTop),yBot); });
  let prev=-1e9;
  items.forEach(it=>{ it.ly=Math.max(it.want, prev+gap); prev=it.ly+(it.h-7.2); });
  let nx=yBot;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(it.ly+(it.h-7.2)>nx) it.ly=nx-(it.h-7.2);
    nx=it.ly-gap;
  }
  if(items.length && items[0].ly<yTop){ const d=yTop-items[0].ly; items.forEach(it=>it.ly+=d); }
  items.forEach(it=>{
    A.lead(it.px, it.py, elbow, it.ly, it.txt, true, STY.txtLead);
    if(it.sub) A.text(elbow-9-1.5, it.ly+3.8, it.sub, STY.txtLead,'end','#111');
  });

  /* ---------- 右の帯：凡例・層構成・注記 ---------- */
  let ty=SH.ay0+padT+4;
  const box=(x,y,w,h,fill)=>{ A.rect(x,y,w,h,0.25,fill,'#666'); };
  A.text(rx0, ty, '凡　例', 4.0,'start','#111',true); ty+=5.4;
  [['url(#hRC)','コンクリート躯体・下地'],['url(#hIns)','断熱材'],
   ['url(#hMor)','モルタル・成形キャント材'],['url(#hSeal)','シール材'],
   ['url(#hFin)','外壁仕上げ（別途）']].forEach(r=>{
    A.rect(rx0+1, ty-3.4, 9, 4.4, 0.25, STY.cBody, '#666');
    A.rect(rx0+1, ty-3.4, 9, 4.4, 0.25, r[0], '#666');
    A.text(rx0+13, ty, r[1], STY.txtNote,'start','#222'); ty+=5.6;
  });
  A.rect(rx0+1, ty-3.4, 9, 1.6, 0, '#111', '#111');
  A.text(rx0+13, ty, '防水層（太線）', STY.txtNote,'start','#222'); ty+=8;

  A.text(rx0, ty, '層構成（下から順＝施工の順番）', 4.0,'start','#111',true); ty+=5.6;
  let LS=[]; try{ if(window.nnLayersOf && P.spObj) LS=nnLayersOf(P.spObj)||[]; }catch(_){ LS=[]; }
  const rows=(LS&&LS.length?LS:[['コンクリート下地','不陸調整・清掃・乾燥確認'],
    ['プライマー','ローラー塗布'],['防水層','工法の層構成のとおり'],
    ['立上り端末','押え金物＋シーリング']]);
  rows.slice(0,6).forEach((r,i)=>{
    A.text(rx0+2, ty, '①②③④⑤⑥'[i]+' '+(r[0]||r)+(r[1]?('　（'+r[1]+'）'):''), STY.txtNote,'start','#222'); ty+=4.6; });
  ty+=5;
  A.text(rx0, ty, '注　記', 4.0,'start','#111',true); ty+=5.4;
  const note2=(kind==='kasagi')
    ? '2．笠木の継手はジョイント金具＋シールとし、水下側へ重ねる。'
    : '2．押え金物のビス間隔は 450mm 以下、端部は 50mm 以内に留める。';
  ['1．寸法の（　）は参考寸法。現場実測により決定する。', note2,
   '3．立上り高さ H は水上で 300mm 以上を確保する。',
   '4．スラブ厚・躯体寸法は構造図による（本図は破断して表す）。',
   '5．本図は防水施工用の納まり図であり、建築確認申請図ではない。'
  ].forEach(t=>{ A.text(rx0+2, ty, t, STY.txtNote,'start','#333'); ty+=4.6; });

  KIT.nameBox(A,SH,'納まり詳細図','1/'+sc);
  /* ★表題欄の図面名称は長すぎると紙からはみ出す（版dの作りでは実測10mmはみ出した）。
     「納まり詳細図（…）」と入れ子にせず、型の名前だけを入れる。 */
  KIT.titleStrip(A,SH,pre.name,'1/'+sc,pre.no);

  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+SH.PW+'mm" height="'+SH.PH+'mm" '
    +'viewBox="0 0 '+SH.PW+' '+SH.PH+'"><rect width="'+SH.PW+'" height="'+SH.PH+'" fill="#fff"/>'
    +A.S.join('')+'</svg>';
  KIT.openSheet(svg, true, '納まり詳細図');
};

<script id="nn-mitsu-js">
/* ============================================================
   御見積書＋数量根拠書（2026-08-20a）★図面→数量→見積の一本道を完成させる
   ・図面から自動算出した数量（recalc と同じ関数：quantities/spec/wariAgg）で
     A4たての御見積書を出す。宛先は客先登録（ホームで登録した元請）から選べる。
   ・2枚目に「数量根拠書」：部位ごとに 平場＝実測面積／立上り＝辺長×H の内訳を表で出す。
     ★数字の根拠を見せられることが、手書き見積との一番の違い＝売りになるところ。
   ・単価はいまの工法（SPECS）のもの。諸経費率・出精値引き・税率・有効期限は窓で調整。
   ============================================================ */
(function(){
"use strict";
const yen=v=>'¥'+Math.round(v).toLocaleString('ja-JP');
const esc2=t=>String(t==null?'':t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function today(){ const d=new Date(),p=n=>('0'+n).slice(-2); return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate()); }
/* ★2026-08-24ac 日数が数字でないときは30日として扱う。
   守らないと、御見積書の有効期限に「NaN/aN/aN まで」と刷られる（実際に出ていた）。 */
function plusDays(n){ const k=isFinite(+n)?Math.max(1,+n):30;
  const d=new Date(Date.now()+k*864e5),p=x=>('0'+x).slice(-2);
  return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate()); }

/* 自社情報（発注ページと同じ保存を使う。無ければ既定） */
function myCo(){
  let m={co:'株式会社三浦工業', addr:'札幌市西区二十四軒4条5丁目', tel:'011-6XX-XXXX', fax:'011-6XX-XXXX', tanto:'佐野'};
  try{ const x=JSON.parse(localStorage.getItem('nn_hacchu_myco')||'null'); if(x&&x.co&&x.co!=='（株）〇〇防水工業') m=x; }catch(_){}
  return m;
}
/* 客先登録（ホームの nn_tokui_v1）から元請の一覧を読む */
function motoList(){
  try{ const d=JSON.parse(localStorage.getItem('nn_tokui_v1')||'null'); if(d&&Array.isArray(d.moto)) return d.moto; }catch(_){}
  return [];
}

/* ---------- 数量と根拠を1か所で集める（recalc と同じ関数を使う＝数字がズレない） ---------- */
window.nnEstimateData=function(){
  const sp=spec(), s=state.scaleM;
  /* ★2026-08-23j 平場（p.spec）と立上り・天端（p.specT）の仕様を別々に集計（全部同じなら今までと同じ） */
  const gH={}, hOrd=[], gV={}, vOrd=[];
  let hira=0,tachi=0,tenba=0,kabe=0,agoL=0,agoA=0,per=0;
  const polys=[];
  state.polys.forEach(p=>{
    const q=quantities(p,s), psp=specOfPoly(p), pspV=specTOfPoly(p);
    let g=gH[psp.code]; if(!g){ g=gH[psp.code]={sp:psp,hira:0}; hOrd.push(g); }
    g.hira+=q.hira;
    let v=gV[pspV.code]; if(!v){ v=gV[pspV.code]={sp:pspV,tachi:0,tenba:0,agoA:0}; vOrd.push(v); }
    v.tachi+=q.tachi; v.tenba+=q.tenba; v.agoA+=q.agoA||0;
    hira+=q.hira; tachi+=q.tachi; tenba+=q.tenba; kabe+=q.kabe; agoL+=q.agoL||0; agoA+=q.agoA||0; per+=q.per;
    /* ★根拠：立上りは「高さごとの辺長の合計」、天端は「幅ごと」でまとめる。
       辺ごとに全部書くと表が読めなくなるので、同じ寸法をまとめる（実際の拾い書きと同じ）。 */
    const byH={}, byW={}; let kb=0;
    ringsOf(p).forEach(ring=>{
      const pts=ring.pts;
      for(let i=0;i<pts.length;i++){
        const L=edgeLenM(pts[i],pts[(i+1)%pts.length],s);
        const e=ek(ring.edges[i]);
        if(e.k==='para' && e.h>0){ byH[e.h]=(byH[e.h]||0)+L; if(e.w>0) byW[e.w]=(byW[e.w]||0)+L; }
        else if(e.k==='kabe' && e.h>0){ byH[e.h]=(byH[e.h]||0)+L; kb+=L; }
      }
    });
    polys.push({name:p.name, spec:psp.code, specT:pspV.code, hira:q.hira, tachi:q.tachi, tenba:q.tenba, per:q.per, byH:byH, byW:byW, kabe:kb});
  });
  /* ★数量は小数1位に丸めてから単価を掛ける。
     丸める前の数量で掛けると、表示の「数量×単価」と金額が合わず、
     元請の担当者が電卓で検算したときに落ちる（実際に 101.3×5,800≠587,250 になっていた）。 */
  const r1=v=>Math.round(v*10)/10;
  const multi=hOrd.length>1||vOrd.length>1||(hOrd[0]&&vOrd[0]&&hOrd[0].sp.code!==vOrd[0].sp.code);
  const rowsAll=[];
  hOrd.forEach(g=>{
    rowsAll.push({n:'平場防水（'+g.sp.code+'）', q:r1(g.hira), u:'㎡', p:g.sp.prices.hira});
  });
  vOrd.forEach(g=>{
    const tag=multi?('（'+g.sp.code+'）'):'';
    rowsAll.push({n:'立上り防水'+tag, q:r1(g.tachi), u:'㎡', p:g.sp.prices.tachi});
    rowsAll.push({n:'天端防水'+tag, q:r1(g.tenba), u:'㎡', p:g.sp.prices.tenba});
    if(g.agoA>0) rowsAll.push({n:'水切りアゴ廻り防水'+tag, q:r1(g.agoA), u:'㎡', p:g.sp.prices.tachi});
  });
  const rows=rowsAll.filter(r=>r.q>0);
  if(kabe>0) rows.push({n:'端末金物（押え金物＋シール）', q:r1(kabe), u:'m', p:TERM_PRICE});
  /* 役物（置いた数×登録単価） */
  const cnt={};
  (state.parts||[]).forEach(it=>{ cnt[it.p]=(cnt[it.p]||0)+1; });
  const parts=[];
  Object.keys(cnt).forEach(id=>{
    const P=(window.nnPartsLib?nnPartsLib():[]).find(x=>x.id===id);
    if(P) parts.push({n:P.name, q:cnt[id], u:'個', p:+P.price||0});
  });
  const wa=(sp.type==='sheet')?wariAgg():null;
  return {sp:sp, rows:rows, parts:parts, wa:wa, per:per, polys:polys,
          hira:hira, tachi:tachi, tenba:tenba};
};

/* ---------- 入口の窓 ---------- */

  if(!state.polys.length){ toast('先に①図面で屋根の部位をかいてください（見積は図面から自動算出します）'); return; }

    +'<label>有効期限<input id="nm_days" type="number" inputmode="decimal" value="30" min="1" step="1"> 日間</label>'
    +'<div class="bt"><button id="nm_go" type="button">📄 見積書を出す（根拠書つき）</button>'
    +'<button id="nm_cl" type="button">✕ 閉じる</button></div></div>';
  document.body.appendChild(box);
  const sel=box.querySelector('#nm_to');
  const syncFree=()=>{ box.querySelector('#nm_freeRow').style.display=(sel.value==='_free'||!moto.length)?'flex':'none'; };

  box.querySelector('#nm_go').onclick=function(){
    const m=moto.find(x=>x.id===sel.value)||null;
    const opt={
      toName:(m?m.name:(box.querySelector('#nm_free').value||'（宛先未入力）')),
      toTanto:m?m.tanto:'', joken:m?(m.joken||''):'', site:m?(m.site||''):'',
      title:box.querySelector('#nm_title').value||'防水改修工事',

<script id="nn-d3fit-js">
/* ============================================================
   ★2026-08-21a 3Dの「全体表示」を実測方式にした
   これまでは T.r ＝ 建物の大きさ × 1.5 の目安だけで決めていた。
   画角（50度）も画面の縦横比もツールバーの厚みも見ていないので、
   よこ向き（横に広くて縦が短い）だと**下が画面外に切れていた**
   （実機の写真を画素で数えて確認：いちばん下の行に屋根の画素が1426個あった）。
   ここでは実際に立体の隅を画面へ投影して、収まるまで距離を下げる。
   ============================================================ */
(function(){
"use strict";
/* ツールバーが覆っている高さ（3Dの絵はその下に中心が来るようにする） */
function topCover(){
  try{
    if(typeof T==='undefined'||!T||!T.renderer) return 0;
    if(document.body.classList.contains('nnsplit2')) return 0;   /* 2画面のときは覆わない */
    const el=T.renderer.domElement, tb=document.getElementById('toolbar');
    if(!tb || getComputedStyle(tb).display==='none') return 0;
    const a=tb.getBoundingClientRect(), b=el.getBoundingClientRect();
    if(!a.height) return 0;
    return Math.max(0, Math.min(b.height*0.45, a.bottom-b.top+6));
  }catch(_){ return 0; }
}
/* 絵の中心をツールバーの下へずらす（setViewOffset＝カメラの写す範囲をずらす） */
window.nnD3ViewOffset=function(){
  try{
    if(typeof T==='undefined'||!T||!T.camera||!T.renderer) return;
    const el=T.renderer.domElement, W=el.clientWidth||1, H=el.clientHeight||1;
    const top=Math.round(topCover());
    const c=T.camera;
    /* T.voX / T.voY ＝ 絵を右へ／下へ何px ずらすか（全体表示のときに実測して入れる）。
       まだ測っていないときは、ツールバーの厚みの半分だけ下げる。 */
    const sx=(typeof T.voX==='number')?T.voX:0;
    const sy=(typeof T.voY==='number')?T.voY:(top/2);
    if((Math.abs(sx)>1||Math.abs(sy)>1) && c.setViewOffset) c.setViewOffset(W, H, -sx, -sy, W, H);
    else if(c.clearViewOffset) c.clearViewOffset();
    c.aspect=W/H; c.updateProjectionMatrix();
  }catch(_){}
};
/* 立体が画面に収まるまで距離を下げる（投影して実測・4回で収束） */
window.nnD3FitR=function(){
  try{
    if(typeof T==='undefined'||!T||!T.camera||!T.renderer||!T.group) return;
    if(typeof THREE==='undefined') return;
    const el=T.renderer.domElement, W=el.clientWidth||0, H=el.clientHeight||0;
    if(W<40||H<40) return;
    const box=new THREE.Box3().setFromObject(T.group);
    if(box.isEmpty()||!isFinite(box.min.x)) return;
    const cs=[];
    for(let i=0;i<8;i++) cs.push(new THREE.Vector3(
      (i&1)?box.max.x:box.min.x, (i&2)?box.max.y:box.min.y, (i&4)?box.max.z:box.min.z));
    const top=Math.round(topCover());
    const useW=Math.max(40, W-16), useH=Math.max(40, H-top-10);   /* まわりに余白を残す */
    const wantX=W/2, wantY=top+(H-top)/2;   /* 絵の真ん中を持ってきたい場所 */
    const c=T.camera;
    T.voX=0; T.voY=0;
    for(let k=0;k<6;k++){
      nnD3ViewOffset();
      c.position.set(T.tx + T.r*Math.sin(T.phi)*Math.cos(T.theta),
                     0.4 + T.r*Math.cos(T.phi),
                     T.tz + T.r*Math.sin(T.phi)*Math.sin(T.theta));
      c.lookAt(T.tx,0.4,T.tz); c.updateMatrixWorld();
      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      for(const v of cs){
        const q=v.clone().project(c);
        const sx=(q.x*0.5+0.5)*W, sy=(-q.y*0.5+0.5)*H;
        if(sx<x0)x0=sx; if(sx>x1)x1=sx; if(sy<y0)y0=sy; if(sy>y1)y1=sy;
      }
      /* ★見ているのは高さ0.4mの点なので、塔屋のように背の高い建物は絵が上へ寄る。
         大きさを合わせるだけでは上が切れる。**中心のズレも一緒に直す**。 */
      T.voX += wantX-(x0+x1)/2;
      T.voY += wantY-(y0+y1)/2;
      const pw=Math.max(1,x1-x0), ph=Math.max(1,y1-y0);
      const need=Math.max(pw/useW, ph/useH);
      if(k>0 && need>0.95 && need<1.02) break;
      T.r=Math.max(0.6, Math.min(2500, T.r*need*1.04));
    }
    /* ★最後にもう一度「中心のズレ」だけ測って直す。
       距離(T.r)を変えたあとの位置で測り直さないと、直前に測ったズレが古くなって
       そのぶん画面の外に出る（実測で下が23pxはみ出した）。 */
    nnD3ViewOffset();
    c.position.set(T.tx + T.r*Math.sin(T.phi)*Math.cos(T.theta),
                   0.4 + T.r*Math.cos(T.phi),
                   T.tz + T.r*Math.sin(T.phi)*Math.sin(T.theta));
    c.lookAt(T.tx,0.4,T.tz); c.updateMatrixWorld();
    { let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      for(const v of cs){
        const q=v.clone().project(c);
        const sx=(q.x*0.5+0.5)*W, sy=(-q.y*0.5+0.5)*H;
        if(sx<x0)x0=sx; if(sx>x1)x1=sx; if(sy<y0)y0=sy; if(sy>y1)y1=sy;
      }
      T.voX += wantX-(x0+x1)/2;
      T.voY += wantY-(y0+y1)/2;
    }
    nnD3ViewOffset();
    /* ★2026-08-27a 合わせたときの画面の大きさとカメラを控えておく。
       画面の大きさが変わったのに（回転・タブ切替直後のレイアウト遅れ）カメラが
       そのままだと、絵が画面からはみ出したまま二度と直らない（実機のよこ向きで発生）。
       下の nnD3FitHeal が「カメラを誰も触っていないときだけ」合わせ直す。 */
    T.fitW=W; T.fitH=H;
    T.fitCam={theta:T.theta, phi:T.phi, r:T.r, tx:T.tx, tz:T.tz};
    T.sig=''; T.rev=(T.rev|0)+1;
  }catch(_){}
};
/* ★2026-08-27a 画面の大きさが「合わせたとき」と変わっていたら、全体表示をやり直す。
   ・使う人がカメラを動かしたあとは絶対に動かさない（§152 の決まりはそのまま）
   ・最初の合わせが空振りしていた（画面がまだ0pxだった）ときもここで拾う
   描画ループから毎コマ呼ばれる（中身は数値の比較だけなので軽い）。 */
window.nnD3FitHeal=function(w,h){
  try{
    if(typeof T==='undefined'||!T) return;
    if(typeof d3FitKey!=='undefined' && d3FitKey==='') return;   /* まだ一度も全体表示していない */
    if(!(w>40 && h>40)) return;
    if(!(typeof state!=='undefined' && state.polys && state.polys.length)) return;
    if(T.fitW==null){ nnD3FitR(); return; }      /* 最初の合わせが空振りしていた */
    const c=T.fitCam;
    const same=c && T.theta===c.theta && T.phi===c.phi && T.r===c.r
                 && T.tx===c.tx && T.tz===c.tz;
    if(!same) return;                            /* 使う人が動かした＝勝手に戻さない */
    if(Math.abs(w-T.fitW)>w*0.02+2 || Math.abs(h-T.fitH)>h*0.02+2) nnD3FitR();
  }catch(_){}
};
/* 画面の向きが変わったら合わせ直す */
addEventListener('orientationchange',()=>setTimeout(()=>{
  try{ if(typeof tab!=='undefined'&&tab==='d3'){ window.d3WantFit=true; nnD3FitR(); } }catch(_){}
},350));
})();
</script>

<script id="nn-uimg-js">
/* ★2026-08-21b 下絵（写真）の選択と削除
   ・「選択」ツールで写真をタップすると選べる（オレンジの点線わく＋赤い✕）
   ・選ぶと画面の左下に小さなカードが出る（動かす／回す／透明度／削除）
   ・✕ボタン・🗑削除・Deleteキー・全削除、どれでも消せる
   本体のコードは書き換えず、末尾で包む方式（他の機能が変わっても壊れない） */
(function(){
"use strict";
if(typeof state==='undefined') return;
const wrap=document.getElementById('canvaswrap');
if(!wrap) return;

window.nnUSel=false;          /* いま下絵を選んでいるか */
let _ux=null;                 /* 画面上の✕ボタンの位置 */

/* 下絵が画面のどこに、どんな大きさで出ているか（draw() と同じ式） */
function box(){
  if(!state.underlay || typeof uImg==='undefined' || !uImg) return null;
  const u=state.underlay;
  const w=uImg.width * u.mPerPx / state.scaleM * cellPx;
  const h=uImg.height* u.mPerPx / state.scaleM * cellPx;
  return {w,h, cx:gx2px(u.x)+w/2, cy:gy2px(u.y)+h/2, rad:(+u.rot||0)*Math.PI/180};
}
/* その画面座標が写真の上か（回転していても正しく見る） */
function hit(px,py){
  const b=box(); if(!b) return false;
  const dx=px-b.cx, dy=py-b.cy, c=Math.cos(-b.rad), s=Math.sin(-b.rad);
  return Math.abs(dx*c-dy*s)<=b.w/2 && Math.abs(dx*s+dy*c)<=b.h/2;
}

/* ---- 小さなカード ---- */
const card=document.createElement('div');
card.id='nnUcard';
card.innerHTML=
   '<span class="ut">🖼 下絵</span>'
  +'<button id="nnU_move" title="ドラッグで動かす（もう一度押すと終了）">✥ 動かす</button>'
  +'<button id="nnU_rl" title="左に1度まわす">⟲</button>'
  +'<button id="nnU_rr" title="右に1度まわす">⟳</button>'
  +'<span class="uu">透明度</span><input type="range" id="nnU_op" min="10" max="100">'
  +'<button id="nnU_del" class="del" title="この写真を削除">🗑 削除</button>'
  +'<button id="nnU_x" title="選択をやめる">✕</button>';
wrap.appendChild(card);
const $=id=>document.getElementById(id);
$('nnU_move').onclick=()=>{ try{ uMoveToggle(); }catch(_){} sync(); };
$('nnU_rl').onclick=()=>rot(-1);
$('nnU_rr').onclick=()=>rot(1);
$('nnU_op').oninput=function(){ try{ uSetOp(this.value); }catch(_){} };
$('nnU_del').onclick=()=>askDelete();
$('nnU_x').onclick=()=>select(false);
function rot(d){
  if(!state.underlay)return;
  const v=(+state.underlay.rot||0)+d;
  try{ uSetRot(v); }catch(_){}
  const el=$('urotin'); if(el) el.value=v;
}
/* ★カードの高さの置き場所は毎回はかって決める。
   下には「案内文」と（スマホの）「📊 積算・設定」があり、
   案内文は道具によって行数が変わるので、決め打ちだと重なる。
   ★rect は表示倍率（zoom）をかけた後のpx、style.bottom はかける前のpx（§61）。 */
function place(){
  let b = (document.documentElement.getAttribute('data-nnphone')==='1') ? 64 : 58;
  try{
    const Z=window.nnPZ||1, w=wrap.getBoundingClientRect();
    ['hint','nnSideBtn'].forEach(id=>{
      const e=document.getElementById(id); if(!e) return;
      const st=getComputedStyle(e); if(st.display==='none'||st.visibility==='hidden') return;
      const r=e.getBoundingClientRect(); if(!r.width||!r.height) return;
      b=Math.max(b, (w.bottom-r.top)/Z + 10);
    });
  }catch(_){}
  card.style.bottom=Math.round(b)+'px';
}
function sync(){
  const on=!!(state.underlay && window.nnUSel && (typeof tab==='undefined'||tab==='zu'));
  card.classList.toggle('on',on);
  if(!on){ return; }
  place();
  $('nnU_move').classList.toggle('on', !!umove);
  const op=$('nnU_op');
  if(document.activeElement!==op) op.value=Math.round((state.underlay.op==null?0.6:state.underlay.op)*100);
}
window.nnUCardSync=sync;

/* ---- 選ぶ／やめる ---- */
function select(on){
  window.nnUSel=!!(on && state.underlay);
  if(!window.nnUSel && umove){ try{ uMoveToggle(); }catch(_){} }   /* 位置調整も一緒に終わる */
  sync(); draw();
}
window.nnUSelect=select;

/* ---- 消す ---- */
function kill(){
  state.underlay=null;
  if(typeof uImg!=='undefined') uImg=null;
  umove=false; window.nnUSel=false; _ux=null;
  try{ uCalibCancel(); }catch(_){}
  const mb=$('umove'); if(mb) mb.classList.remove('on');
  saveState(); try{ uStatus(); }catch(_){}
  sync(); draw();
}
window.nnUKill=kill;
function askDelete(){
  if(!state.underlay){ toast('下絵はありません'); return; }
  if(!confirm('下絵（読み込んだ写真）を削除しますか？\n（作図した図面はそのまま残ります）')) return;
  kill(); toast('下絵を削除しました');
}
window.nnUAskDelete=askDelete;

/* ---- 選んでいる間は、オレンジの点線わくと赤い✕を描く ---- */
const _draw=window.draw;
window.draw=function(){
  const r=_draw.apply(this,arguments);
  try{
    _ux=null;
    if(window.nnUSel && state.underlay && !umove) mark();
    sync();
  }catch(_){}
  return r;
};
function mark(){
  const b=box(); if(!b) return;
  ctx.save(); ctx.translate(b.cx,b.cy); ctx.rotate(b.rad);
  ctx.strokeStyle='#e8760a'; ctx.lineWidth=2; ctx.setLineDash([8,5]);
  ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h); ctx.setLineDash([]); ctx.restore();
  /* ✕は回したあとの右上の角に置く */
  const bx=b.cx+(b.w/2)*Math.cos(b.rad)+(b.h/2)*Math.sin(b.rad);
  const by=b.cy+(b.w/2)*Math.sin(b.rad)-(b.h/2)*Math.cos(b.rad);
  _ux={x:bx,y:by};
  ctx.beginPath(); ctx.arc(bx,by,12,0,7);
  ctx.fillStyle='#b0392f'; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='800 14px sans-serif'; ctx.textAlign='center';
  ctx.fillText('✕',bx,by+5); ctx.textAlign='left';
}

/* ---- 「選択」ツールでのタップ ---- */
const _pick=window.pickEdge;
window.pickEdge=function(){
  /* ✕を押したときは削除が最優先（辺を選ばない） */
  const X=window.nnUSel?_ux:null;
  if(X && Math.hypot(mouse.x-X.x, mouse.y-X.y)<17){ askDelete(); return; }
  _pick.apply(this,arguments);
  /* 辺に当たらなかったところが写真の上なら、写真を選ぶ */
  if(!sel && hit(mouse.x,mouse.y)) select(true);
  else if(sel) select(false);
};

/* ---- 🗑削除ボタン ---- */
const _sd=window.smartDelete;
window.smartDelete=function(){
  if(window.nnUSel && state.underlay){ askDelete(); return; }
  /* ほかに消すものが何も無いのに下絵だけ在るときも、下絵の削除をたずねる
     （写真を1枚置いただけの状態で「削除するものがありません」で詰むのを防ぐ） */
  const nothingElse =
      !(window.nnPartSelIdx && nnPartSelIdx()>=0)
   && !((tool==='draw'||tool==='hole') && drawPts.length)
   && !rsel.length && !psel.length
   && !(state.active>=0 && state.polys[state.active]);
  if(nothingElse && state.underlay){ askDelete(); return; }
  return _sd.apply(this,arguments);
};

/* ---- 全削除（部位・役物と一緒に消す） ---- */
const _ca=window.clearAll;
window.clearAll=function(){
  if(!state.underlay) return _ca.apply(this,arguments);
  const nq=state.polys.length, np=(window.nnPartsCount?nnPartsCount():0);
  const what=[nq?('部位 '+nq+'件'):'', np?('役物 '+np+'件'):'', '下絵（写真）'].filter(Boolean).join('と');
  if(!confirm(what+' をすべて削除しますか？')) return;
  const h0=(window.nnHistMark?nnHistMark():-1);
  if(nq||np){
    /* 元の全削除にもう一度たずねさせないよう、この呼び出しの間だけ確認を通す */
    const _c=window.confirm;
    window.confirm=()=>true;
    try{ _ca.call(window); }finally{ window.confirm=_c; }
  }
  kill();
  try{ if(window.nnHistCollapse) nnHistCollapse(h0); }catch(_){}
  toast(what+' を削除しました');
};

/* ---- Delete キー／Esc ---- */
addEventListener('keydown',e=>{
  if(!window.nnUSel || !state.underlay) return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName||'')) return;
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); askDelete(); }
  else if(e.key==='Escape'){ select(false); }
});

/* ---- 案内文に一言足す ---- */
const _hint=window.updateHint;
if(typeof _hint==='function'){
  window.updateHint=function(){
    const r=_hint.apply(this,arguments);
    try{
      const h=document.getElementById('hint');
      if(h && state.underlay && typeof tool!=='undefined' && tool==='sel' && !calib)
        h.innerHTML += '｜<b>写真をタップすると選べます</b>（動かす・透明度・削除）';
    }catch(_){}
    return r;
  };
  try{ updateHint(); }catch(_){}
}

/* ---- 下絵を消したり読み込んだりしたらカードを合わせる ---- */
const _ud=window.uDelete;
if(typeof _ud==='function') window.uDelete=function(){ const r=_ud.apply(this,arguments); if(!state.underlay){ window.nnUSel=false; sync(); } return r; };
const _st=window.setTab;
if(typeof _st==='function') window.setTab=function(t){ const r=_st.apply(this,arguments); sync(); return r; };
sync();
})();
</script>

<script id="nn-zmenu-js">
/* ★2026-08-22a 図面・積算の入口メニュー
   ・①平面図をかく ②矩計図をかく ＝「自分でつくるもの」（大きいカード）
   ・3D／積算／提出書類 ＝「①②から自動でできるもの」（下の段・点線の枠）
   ・↩戻る は「メニューへ → ホームへ」の順に戻る（仕様登録の 詳細→一覧→ホーム と同じ考え方）
   本体は書き換えず、末尾で組み立てる方式。 */
(function(){
"use strict";
if(typeof state==='undefined') return;
const mainEl=document.querySelector('main'); if(!mainEl) return;

const el=document.createElement('div'); el.id='nnZMenu';
el.innerHTML=
 '<div class="zmWrap">'
+  '<div class="zmHead">図面・積算　—　何をしますか？</div>'

+ '</div>';
mainEl.appendChild(el);

const $=id=>document.getElementById(id);
const fx=(v,n)=>(Math.round(v*Math.pow(10,n))/Math.pow(10,n)).toLocaleString('ja-JP');

function hasPlan(){ return state.polys && state.polys.length>0; }
function hasSect(){ return !!(state.sect && state.sect.closed && state.sect.pts && state.sect.pts.length>=3); }

/* 各カードの状態を書き替える（開くたび・戻るたびに呼ぶ） */
function refresh(){
  let area=0, est=0;
  try{
    const d=nnEstimateData();
    area=d.hira||0;
    (d.rows||[]).forEach(r=>est+=r.q*r.p);
    (d.parts||[]).forEach(r=>est+=r.q*r.p);
  }catch(_){}
  const s1=$('zmS1');
  if(hasPlan()){ s1.className='st ok'; s1.textContent='✓ 屋根 '+state.polys.length+'面／'+fx(area,1)+'㎡'; }
  else { s1.className='st'; s1.textContent='まだ かいていません'; }
  const s2=$('zmS2');
  if(hasSect()){ s2.className='st ok'; s2.textContent='✓ かきました'; }

  const ready=hasPlan()||hasSect();
  const m=el.querySelectorAll('.zmMini');
  m[0].classList.toggle('ready',ready);
  m[1].classList.toggle('ready',hasPlan());
  m[2].classList.toggle('ready',hasPlan());

  $('zmS4').innerHTML = hasPlan() ? '<span class="num">概算 ¥'+fx(est,0)+'</span>' : '①をかくと数量が出ます';

window.nnZMenuRefresh=refresh;

/* 開く／閉じる */
function open(){ document.body.classList.add('nn-zmenu'); refresh(); }

window.nnZMenuOpen=open;
window.nnZMenuClose=close;
window.nnZMenuOn=()=>document.body.classList.contains('nn-zmenu');

/* 右パネル（積算・設定）を開いて、目当ての場所まで送る */
function side(targetId){
  const sd=document.getElementById('side'); if(!sd) return;
  sd.classList.add('open');                       /* スマホは引き出し */
  setTimeout(()=>{ const t=document.getElementById(targetId);
    if(t) t.scrollIntoView({block:'start'}); },80);
}

el.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]'); if(!b) return;
  const go=b.dataset.go;
  if(go==='zu'){ close(); setTab('zu'); if(!hasPlan())setTool('draw'); return; }
  if(go==='sec'){ close(); setTab('sec'); return; }
  if(go==='d3'){
    if(!hasPlan()&&!hasSect()){ toast('先に ① 平面図をかきます'); close(); setTab('zu'); setTool('draw'); return; }
    close(); setTab('d3'); return;
  }
  if(go==='sekisan'||go==='docs'){
    if(!hasPlan()){ toast('先に ① 平面図をかきます'); close(); setTab('zu'); setTool('draw'); return; }
    close(); setTab('zu'); side(go==='docs'?'nnPlanBox':'sekisan'); return;
  }
  if(go==='open'){ close(); try{ nnOpenDwg(); }catch(_){} return; }
  if(go==='photo'){ close(); try{ nnPhotoOpen(); }catch(_){} return; }
});

/* ↩ 戻る＝「メニューへ → ホームへ」の順 */
const _back=window.nnBack;
window.nnBack=function(){
  if(!window.nnZMenuOn()){ open(); return; }
  return _back.apply(this,arguments);
};

/* 最初はメニューから。ただし他のページから用事つきで来たときは、そのまま中身へ。
   ★?photo=1 や ?open= は、このスクリプトより前で history.replaceState により
     消されている（location.search はもう空）。だから印（nnSkipMenu）で見ること。 */
if(!window.nnSkipMenu && !/[?&](photo=1|open=)/.test(location.search)) open();
})();

/* ★どのイベントでも「その場で」座標を計算する。
   以前は打点時に「最後の mousemove の座標」を使っていたため、
   iPhone（mousemove が来ない）ではタップと無関係の場所に点が打たれていた。 */
function updMouse(e){
  const r=cv.getBoundingClientRect();
  /* ★中の画素数と見た目の大きさがズレていても正しい位置になるよう、
     倍率を掛けて「キャンバスの中の座標」に直す（ズレが無ければ倍率1）。 */
  const kx=r.width ? (cv.width/devicePixelRatio)/r.width : 1;
  const ky=r.height? (cv.height/devicePixelRatio)/r.height : 1;
  mouse.x=(e.clientX-r.left)*kx; mouse.y=(e.clientY-r.top)*ky;
  mouse.rawx=px2gx(mouse.x); mouse.rawy=px2gy(mouse.y);
  mouse.shift=!!e.shiftKey;
  const _s=nnSnapPt(mouse.rawx, mouse.rawy);   /* 方眼＋「直前の点の真下・真横」 */
  mouse.gx=_s.x; mouse.gy=_s.y;
}
/* 触った直後は、あとから来る「まねごとのマウスイベント」を無視する
   （iPhoneはタップ後に mousedown 等を合成して送ってくるため、二重になる） */
let _lastTouchT=0;
const _touchNow=()=>{ _lastTouchT=Date.now(); };
const _ignoreMouse=()=>Date.now()-_lastTouchT<900;

cv.addEventListener('mousemove',e=>{
  if(_ignoreMouse())return;
  updMouse(e);
  if(mouse.pan){ ox+=mouse.x-mouse.px; oy+=mouse.y-mouse.py; mouse.px=mouse.x; mouse.py=mouse.y; }
  if(udrag&&state.underlay){
    state.underlay.x=udrag.ux+(mouse.rawx-udrag.sx);
    state.underlay.y=udrag.uy+(mouse.rawy-udrag.sy);
  }
  if(urot&&state.underlay){
    state.underlay.rot=urot.rot0+(mouse.x-urot.sx)*0.2;
    const ui=document.getElementById('urotin'); if(ui)ui.value=state.underlay.rot.toFixed(1);
  }
  if(marq){ marq.x1=mouse.rawx; marq.y1=mouse.rawy; }
  if(rdrag){
    const dx=nnSnapMove(mouse.rawx-rdrag.sx), dy=nnSnapMove(mouse.rawy-rdrag.sy);
    rdrag.base.forEach(b=>{ const pt=b.r<0?state.polys[b.p].pts[b.i]:state.polys[b.p].holes[b.r].pts[b.i]; pt.x=b.x+dx; pt.y=b.y+dy; });
  }
  if(edrag){ nnEdgeDragMove(); }
  draw();
});
/* ★⊕点：つまんだ頂点を「動かさずに離した」＝タップ＝頂点を消す（2026-08-26a） */
function nnRdragEnd(){
  if(!rdrag)return;
  if(rdrag.tapDel && Math.hypot(mouse.rawx-rdrag.sx, mouse.rawy-rdrag.sy)*cellPx<6){
    const h=rdrag.tapDel; rdrag=null; nnDelVertex(h); return;
  }
  rdrag=null; saveState();
}
function handleDown(e){
  if(tab==='d3')return;
  updMouse(e);                     /* ★押した場所で必ず座標を取り直す */
  /* ★寸法・角度の札を押したら、数値で直す（打点はしない）。
     ただし「ここで閉じる」に当たっているときは、閉じるほうを優先する。 */
  if((tool==='draw'||tool==='hole') && e.button===0 && drawPts.length){
    const rr=nnResolvePoint(mouse.gx, mouse.gy, px2gx(mouse.x), px2gy(mouse.y));
    if(!rr.close){
      const hb=nnLabelAt(mouse.x, mouse.y);
      if(hb){ nnLabelEdit(hb); return; }
    }
  }
  /* スケール合わせ：2点クリック（スナップなしの生座標） */
  if(calib && e.button===0){
    const g={x:mouse.rawx, y:mouse.rawy};
    if(!calib.p1){ calib.p1=g; updateHint(); }
    else if(!calib.p2){
      calib.p2=g; draw();
      const box=document.getElementById('calibbox');
      box.style.left=Math.min(mouse.x+14, cv.parentElement.clientWidth-300)+'px';
      box.style.top=Math.max(mouse.y-40,60)+'px';
      box.style.display='block';
      document.getElementById('calibm').value=''; document.getElementById('calibm').focus();
    }
    draw(); return;
  }
  /* 下絵：✕ボタン／位置調整ドラッグ／右ドラッグ回転 */
  if(umove && state.underlay){
    if(e.button===0 && _uxBtn && Math.hypot(mouse.x-_uxBtn.x, mouse.y-_uxBtn.y)<14){ uDelete(); return; }
    if(e.button===0){ udrag={sx:mouse.rawx, sy:mouse.rawy, ux:state.underlay.x, uy:state.underlay.y}; return; }
    if(e.button===2){ urot={sx:mouse.x, rot0:+state.underlay.rot||0}; return; }
  }
  if(tool==='pan' || e.button===1){ mouse.pan=true; mouse.px=mouse.x; mouse.py=mouse.y; cv.style.cursor='grabbing'; return; }
  if(e.button===2)return;
  if(tab==='wf'){
    if(e.button===0)wfPick();
    return;
  }
  /* 中抜き描画：アクティブ部位の内側に穴ポリゴンを描く */
  if(tool==='hole' && e.button===0){
    if(state.active<0){ toast('先に部位を選択してください'); return; }
    const r=nnResolvePoint(mouse.gx, mouse.gy, px2gx(mouse.x), px2gy(mouse.y));
    if(r.close){ closeShape('hole'); return; }
    const g=r.g;
    if(drawPts.length && drawPts[drawPts.length-1].x===g.x && drawPts[drawPts.length-1].y===g.y)return;
    drawPts.push(g); drawRedo=[]; histBtns(); draw(); return;
  }
  /* 段差ライン：外周→内部点…→外周 で部位を2分割 */
  if(tool==='split' && e.button===0){
    if(state.active<0){ toast('先に部位を選択してください'); return; }
    const poly=state.polys[state.active];
    if(!splitPts){
      const ins=nearestOnBoundary(poly, mouse.rawx, mouse.rawy);
      if(!ins||ins.distPx>18){ toast('外周の辺の上をクリックして開始してください'); return; }
      splitPts={ins1:ins, mids:[]};
      updateHint(); draw(); return;
    }
    const ins2=nearestOnBoundary(poly, mouse.rawx, mouse.rawy);
    if(ins2&&ins2.distPx<=18){
      if(Math.hypot(ins2.pt.x-splitPts.ins1.pt.x, ins2.pt.y-splitPts.ins1.pt.y)<0.3){ toast('開始点と同じ位置では分割できません'); return; }
      doSplit(poly, splitPts.ins1, ins2, splitPts.mids);
      splitPts=null; return;
    }
    splitPts.mids.push({x:mouse.gx,y:mouse.gy}); draw(); return;
  }
  /* 範囲選択：矩形ドラッグ／選択済み頂点の移動ドラッグ */
  if(tool==='rect' && e.button===0){
    if(rsel.length && rselHit(mouse.rawx, mouse.rawy)){
      rdrag={sx:mouse.rawx, sy:mouse.rawy,
        base:rsel.map(({p,r,i})=>{const pt=r<0?state.polys[p].pts[i]:state.polys[p].holes[r].pts[i];return {p,r,i,x:pt.x,y:pt.y};})};
      return;
    }
    marq={x0:mouse.rawx, y0:mouse.rawy, x1:mouse.rawx, y1:mouse.rawy};
    return;
  }
  /* ▭長方形：1回目＝角を置く／2回目＝対角で確定（2026-08-26a） */
  if(tool==='box' && e.button===0){
    if(!boxP1){ boxP1={x:mouse.gx, y:mouse.gy}; histBtns(); draw(); updateHint(); return; }
    boxCommit({x:mouse.gx, y:mouse.gy}); return;
  }
  /* ⊕点：頂点の上＝つまむ（動かさず離せば削除）／辺の上＝点を足す（2026-08-26a） */
  if(tool==='addpt' && e.button===0){
    const hv=nnVertexAt();
    if(hv){
      const pt=hv.r<0?state.polys[hv.p].pts[hv.i]:state.polys[hv.p].holes[hv.r].pts[hv.i];
      rdrag={sx:mouse.rawx, sy:mouse.rawy, tapDel:hv,
             base:[{p:hv.p, r:hv.r, i:hv.i, x:pt.x, y:pt.y}]};
      return;
    }
    nnPtAdd(); return;
  }
  if(tool==='draw'){
    const r=nnResolvePoint(mouse.gx, mouse.gy, px2gx(mouse.x), px2gy(mouse.y));
    if(r.close){ closeShape('draw'); return; }
    const g=r.g;
    if(drawPts.length && drawPts[drawPts.length-1].x===g.x && drawPts[drawPts.length-1].y===g.y)return;
    drawPts.push(g); drawRedo=[]; histBtns(); draw(); return;
  }
  if(tool==='sel'){
    /* ★2026-08-26a 選択中の辺をもう一度つかんだら、法線方向へドラッグで動かせる */
    if(sel && nnSelEdgeHit()){ nnEdgeDragStart(); return; }
    pickEdge();
  }
}
cv.addEventListener('mousedown',e=>{ if(_ignoreMouse())return; handleDown(e); });
function finishMarq(){
  if(!marq)return;
  const x0=Math.min(marq.x0,marq.x1), x1=Math.max(marq.x0,marq.x1);
  const y0=Math.min(marq.y0,marq.y1), y1=Math.max(marq.y0,marq.y1);
  rsel=[];
  state.polys.forEach((p,pi)=>ringsOf(p).forEach(ring=>ring.pts.forEach((pt,i)=>{
    if(pt.x>=x0&&pt.x<=x1&&pt.y>=y0&&pt.y<=y1)rsel.push({p:pi,r:ring.r,i});
  })));
  /* ★2026-08-19f 役物も範囲選択の対象にする（中心が枠の中に入っていれば選ぶ） */
  psel=(window.nnPartsInRect?nnPartsInRect(x0,y0,x1,y1):[]);
  if(window.nnPartsHilite) nnPartsHilite(psel);
  marq=null;
  document.getElementById('tl_rdel').style.display=(rsel.length||psel.length)?'inline-block':'none';
  const msg=[rsel.length?(rsel.length+'頂点'):'', psel.length?(psel.length+'役物'):''].filter(Boolean).join('と');
  if(msg)toast(msg+'を選択（「選択を削除」またはDeleteキーで削除）');
  draw();
}
addEventListener('mouseup',()=>{
  if(mouse.pan){ mouse.pan=false; cv.style.cursor=tool==='pan'?'grab':'default'; }
  if(udrag){ udrag=null; saveState(); }
  if(urot){ urot=null; saveState(); }
  nnRdragEnd();
  if(edrag){ nnEdgeDragEnd(); }
  if(marq){ finishMarq(); }
});
/* 選択頂点群のヒット判定（選択中の頂点のバウンディングボックス内か） */
function rselHit(gx,gy){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  rsel.forEach(({p,r,i})=>{const pt=r<0?state.polys[p].pts[i]:state.polys[p].holes[r].pts[i];
    x0=Math.min(x0,pt.x);x1=Math.max(x1,pt.x);y0=Math.min(y0,pt.y);y1=Math.max(y1,pt.y);});
  const m=0.6;
  return gx>=x0-m&&gx<=x1+m&&gy>=y0-m&&gy<=y1+m;
}
/* 範囲選択の削除：頂点を除去（3点未満になった部位は部位ごと削除） */
function rectDelete(){
  /* ★2026-08-19f 役物だけを選んでいるときも消せるようにする */
  const np=(psel&&psel.length&&window.nnPartsDelete)?nnPartsDelete(psel):0;
  psel=[];
  if(!rsel.length){
    if(np){ document.getElementById('tl_rdel').style.display='none';
      saveState(); draw(); toast('役物 '+np+'件 を削除しました'); }
    return;
  }
  const byRing={};
  rsel.forEach(({p,r,i})=>{ const k=p+'_'+r; (byRing[k]=byRing[k]||{p,r,idxs:[]}).idxs.push(i); });
  const killPolys=[];
  Object.values(byRing).forEach(({p,r,idxs})=>{
    const poly=state.polys[p];
    const ring=r<0?{pts:poly.pts,edges:poly.edges}:poly.holes[r];
    idxs.sort((a,b)=>b-a).forEach(i=>{ ring.pts.splice(i,1); ring.edges.splice(i,1); });
    if(r>=0 && ring.pts.length<3) poly.holes[r]=null;
    if(r<0 && poly.pts.length<3) killPolys.push(p);
  });
  state.polys.forEach(p=>{ if(p.holes)p.holes=p.holes.filter(Boolean); });
  killPolys.sort((a,b)=>b-a).forEach(p=>state.polys.splice(p,1));
  if(state.active>=state.polys.length)state.active=state.polys.length-1;
  rsel=[]; sel=null;
  document.getElementById('tl_rdel').style.display='none';
  saveState(); renderPolyList(); renderEdgeEdit(); draw();
  toast((np?('役物'+np+'件と'):'')+(killPolys.length?'頂点と部位を削除しました':'選択した頂点を削除しました'));
}
/* ★長押しの選択を、念のためJSでも止める（CSSが効かない場合の保険） */
['selectstart','dragstart'].forEach(ev=>{
  cv.addEventListener(ev,e=>e.preventDefault());
  const w=document.getElementById('canvaswrap'); if(w)w.addEventListener(ev,e=>e.preventDefault());
});
cv.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(umove)return; /* 位置調整中の右ドラッグ＝回転 */
  if((tool==='draw'||tool==='hole')&&drawPts.length){ drawPts.pop(); draw(); }
  if(tool==='box'&&boxP1){ boxP1=null; histBtns(); draw(); }
  if(tool==='split'&&splitPts){ if(splitPts.mids.length)splitPts.mids.pop(); else splitPts=null; draw(); }
});
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){ e.preventDefault(); undoStep(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){ e.preventDefault(); redoStep(); return; }
  if((e.key==='Delete'||e.key==='Backspace')&&(rsel.length||psel.length)&&tab==='zu'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); rectDelete(); return; }
  if(e.key==='Escape'){ try{ if(window.pick3)pick3(null); }catch(_){}   /* ★面の選択も解除 */
    drawPts=[]; splitPts=null; boxP1=null; edrag=null; wfSel=null; if(calib)uCalibCancel(); rsel=[]; psel=[]; if(window.nnPartsHilite)nnPartsHilite([]); marq=null; document.getElementById('tl_rdel').style.display='none'; renderWfSel(); draw(); }
  if(e.key==='Enter' && drawPts.length>=3) closePoly();
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  updMouse(e);
  const k=e.deltaY<0?1.12:1/1.12;
  const gx=px2gx(mouse.x), gy=px2gy(mouse.y);
  cellPx=Math.min(500,Math.max(0.4,cellPx*k));
  ox=mouse.x-gx*cellPx; oy=mouse.y-gy*cellPx;
  draw();
},{passive:false});

/* ============================================================
   ★スマホの指の操作（2026-08-01）
   ・1回タップ＝打点（指を離した位置で確定。ズレたら離す前に直せる）
   ・1本指ドラッグ＝移動ツール等のドラッグ（押した瞬間から）
   ・2本指＝つまんで拡大縮小＋そのまま動かして表示位置の移動
   マウスの処理（mousedown等）はそのまま残し、指のときだけこちらを通す。
   ============================================================ */
(function(){
  const pts=new Map();
  let pinch=null, tapC=null;
  /* 押した瞬間からドラッグする道具。★2026-08-26a ⊕点（頂点をつまむ）と、
     「選択」で選んだ辺をもう一度つかんだとき（辺ドラッグ）も仲間に入れた */
  const DRAG_TOOLS=()=>(tool==='pan' || tool==='rect' || umove || tool==='addpt'
    || (tool==='sel' && sel && nnSelEdgeHit()));
  function mid2(){
    const a=[...pts.values()];
    return {d:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y), x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2};
  }
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    _touchNow();
    /* ★引き出しが開いたまま作図面に触れたら、まず引き出しを閉じるだけにする。
       （閉じると同時に点が打たれる誤操作を防ぐ） */
    const sd=document.getElementById('side');
    if(sd && sd.classList.contains('open')){ sd.classList.remove('open'); return; }
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){
      /* 2本目の指が来たら、1本目で始めたドラッグ・タップは取り消してピンチへ */
      tapC=null;
      mouse.pan=false; udrag=null; urot=null; rdrag=null; marq=null;
      nnAim.on=false;                       /* 2本目の指が来たら照準は取り消してピンチへ */
      const m=mid2();
      const r=cv.getBoundingClientRect();
      const kx=r.width ? (cv.width/devicePixelRatio)/r.width : 1;
      const ky=r.height? (cv.height/devicePixelRatio)/r.height : 1;
      pinch={d0:m.d, cell0:cellPx, kx, ky,
             gx:((m.x-r.left)*kx-ox)/cellPx, gy:((m.y-r.top)*ky-oy)/cellPx};
      return;
    }
    updMouse(e);
    if(DRAG_TOOLS()){ handleDown(e); }
    else if(tool==='draw'||tool==='hole'||tool==='box'){
      /* ★赤い照準：指の右上に出す。指を動かして狙いを合わせ、離した場所に打点。
         「指の真下＝見えない場所」に点が打たれる問題の根本対策。 */
      aimUpdate(e);
      /* ★寸法・角度の札を押したときは、照準をやめて数値入力にする。
         ただし照準が「ここで閉じる」に入っているときは、閉じるほうを優先。
         （▭長方形は札の編集対象が無いので照準だけ） */
      if(!nnAim.close && tool!=='box'){
        const hb=nnLabelAt(mouse.x, mouse.y);
        if(hb){ nnAim.on=false; draw(); nnLabelEdit(hb); return; }
      }
    }
    else{
      /* タップ候補：離したときに動いていなければ打点する */
      tapC={x:e.clientX, y:e.clientY, t:Date.now()};
    }
  });
  cv.addEventListener('pointermove',e=>{
    if(e.pointerType==='mouse'||!pts.has(e.pointerId))return;
    _touchNow();
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    e.preventDefault();
    if(pts.size>=2 && pinch){
      const m=mid2(), r=cv.getBoundingClientRect();
      if(m.d>10 && pinch.d0>10)
        cellPx=Math.min(500,Math.max(0.4, pinch.cell0*m.d/pinch.d0));
      ox=(m.x-r.left)*pinch.kx - pinch.gx*cellPx;
      oy=(m.y-r.top )*pinch.ky - pinch.gy*cellPx;
      draw();
      return;
    }
    if(nnAim.on && pts.size===1){ aimUpdate(e); return; }
    if(tapC && Math.hypot(e.clientX-tapC.x, e.clientY-tapC.y)>9){
      tapC=null;               /* 動いた＝タップではない（誤打点を防ぐ） */
    }
    updMouse(e);
    /* 1本指ドラッグ中の追従（移動ツール・下絵・範囲選択のときだけ動く） */
    if(mouse.pan){ ox+=mouse.x-mouse.px; oy+=mouse.y-mouse.py; mouse.px=mouse.x; mouse.py=mouse.y; }
    if(udrag&&state.underlay){
      state.underlay.x=udrag.ux+(mouse.rawx-udrag.sx);
      state.underlay.y=udrag.uy+(mouse.rawy-udrag.sy);
    }
    if(marq){ marq.x1=mouse.rawx; marq.y1=mouse.rawy; }
    if(rdrag){
      const dx=nnSnapMove(mouse.rawx-rdrag.sx), dy=nnSnapMove(mouse.rawy-rdrag.sy);
      rdrag.base.forEach(b=>{ const pt=b.r<0?state.polys[b.p].pts[b.i]:state.polys[b.p].holes[b.r].pts[b.i]; pt.x=b.x+dx; pt.y=b.y+dy; });
    }
    if(edrag){ nnEdgeDragMove(); }
    draw();
  },{passive:false});
  function up(e){
    if(e.pointerType==='mouse')return;
    _touchNow();
    pts.delete(e.pointerId);
    if(pts.size<2) pinch=null;
    if(nnAim.on && pts.size===0){ aimCommit(); }
    if(tapC && Date.now()-tapC.t<800){
      updMouse(e);
      handleDown({button:0, clientX:e.clientX, clientY:e.clientY, shiftKey:false});
    }
    tapC=null;
    if(pts.size===0){
      /* ドラッグの後始末（mouseup と同じ） */
      if(mouse.pan){ mouse.pan=false; }
      if(udrag){ udrag=null; saveState(); }
      if(urot){ urot=null; saveState(); }
      nnRdragEnd();
      if(edrag){ nnEdgeDragEnd(); }
      if(marq){ finishMarq(); }
      draw();
    }
  }
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,up));

  /* ★照準の位置：指の位置から「右上へ36px/52px」ずらした場所。
     指で隠れないので、どこに打たれるかが必ず見える。 */
  const AIM_DX=36, AIM_DY=-52;
  function aimUpdate(e){
    const r=cv.getBoundingClientRect();
    const kx=r.width ? (cv.width/devicePixelRatio)/r.width : 1;
    const ky=r.height? (cv.height/devicePixelRatio)/r.height : 1;
    const x=(e.clientX+AIM_DX-r.left)*kx, y=(e.clientY+AIM_DY-r.top)*ky;
    const _rx=(x-ox)/cellPx, _ry=(y-oy)/cellPx;        /* 丸める前の狙い（閉じる判定に使う） */
    const _s=nnSnapPt(_rx, _ry);                       /* 方眼＋「直前の点の真下・真横」 */
    const res=nnResolvePoint(_s.x, _s.y, _rx, _ry);

/* ============================================================
   ★2026-08-26a 作図の操作性①〜④（本人の依頼「提示した機能を対応してみて」）
   ①▭長方形 … 角を2回タップで長方形の屋根（現場の屋根はほぼ長方形＝最速の描き方）
   ②⊕点 … 辺タップ＝点を足す／頂点タップ＝点を消す／頂点をつまんで動かす
   　　＋「選択」で選んだ辺は、もう一度つかむと法線方向へドラッグで動かせる
   ③⧉複製 … 部位を丸ごと複製（辺の設定・仕様・下地も一緒に写す）

function boxCommit(g){
  const a=boxP1; if(!a)return;
  if(Math.abs(g.x-a.x)<1e-9 || Math.abs(g.y-a.y)<1e-9){
    toast('幅か奥行きが0です。対角（ななめ向かい）の角をタップしてください'); return;
  }
  const x0=Math.min(a.x,g.x), x1=Math.max(a.x,g.x);
  const y0=Math.min(a.y,g.y), y1=Math.max(a.y,g.y);
  const pts=[{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x0,y:y1}];
  const defH=+document.getElementById('defH').value||0;
  const defW=+document.getElementById('defW').value||0;
  const poly={ name:'屋根'+circled(state.polys.length+1), lv:0, pts,
    edges:pts.map(()=>({h:defH,w:defW,k:defH>0?'para':'free'})) };
  state.polys.push(poly); state.active=state.polys.length-1;
  boxP1=null; histBtns(); saveState(); renderPolyList(); draw(); updateHint();
  const s=state.scaleM;
  toast(poly.name+' を作成しました（'+f1((x1-x0)*s)+'m × '+f1((y1-y0)*s)+'m ＝ '
    +f1((x1-x0)*(y1-y0)*s*s)+'㎡）。続けてもう1つかけます');
}

function nnVertexAt(){

  })));

}
/* ⊕点：頂点を1つ消す（3点未満になる削除は断る） */
function nnDelVertex(hit){
  const poly=state.polys[hit.p]; if(!poly)return;
  const ring=hit.r<0?{pts:poly.pts,edges:poly.edges}:(poly.holes||[])[hit.r];
  if(!ring||!ring.pts||!ring.pts[hit.i])return;
  if(ring.pts.length<=3){ toast('3点未満にはできません（部位ごと消すなら 🗑削除）'); draw(); return; }

     （rectDelete と同じ決まり：pts と edges を同じ番号で1つずつ抜く） */
  ring.pts.splice(hit.i,1); ring.edges.splice(hit.i,1);

/* ⊕点：いちばん近い辺の上に点を1つ足す（打点位置は辺の上・長さ10cmきざみ） */
function nnPtAdd(){
  let best=null, bd=(typeof NN_PHONE!=='undefined'&&NN_PHONE)?14:9;
  state.polys.forEach((poly,pi)=>ringsOf(poly).forEach(ring=>{
    const pts=ring.pts;
    for(let i=0;i<pts.length;i++){
      const a=pts[i], b=pts[(i+1)%pts.length];
      const d=distToSeg(mouse.x,mouse.y, gx2px(a.x),gy2px(a.y), gx2px(b.x),gy2px(b.y));
      if(d<bd){ bd=d; best={p:pi, r:ring.r, e:i}; }
    }
  }));
  if(!best){ toast('辺の上＝点を足す／頂点の上＝点を消す（線の近くをタップしてください）'); return; }
  const poly=state.polys[best.p];
  const ring=best.r<0?{pts:poly.pts,edges:poly.edges}:poly.holes[best.r];
  const a=ring.pts[best.e], b=ring.pts[(best.e+1)%ring.pts.length];
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
  let t=((mouse.rawx-a.x)*dx+(mouse.rawy-a.y)*dy)/(L*L);
  t=Math.max(0.05, Math.min(0.95, t));
  /* 打点は辺の上から外さない。始点からの距離だけ 10cm きざみに丸める */
  const stepG=Math.max(1e-6, nnLenStepM()/(state.scaleM||1));
  const d0=Math.min(L*0.98, Math.max(stepG, Math.round(t*L/stepG)*stepG));
  const tt=d0/L;
  const np={x:Math.round((a.x+dx*tt)*1e6)/1e6, y:Math.round((a.y+dy*tt)*1e6)/1e6};
  /* 辺 e が a→新しい点 になり、新しい辺（同じ設定の写し）が 新しい点→b を受け持つ
     （nnEdgeSplitRange と同じ決まり：pts と edges を同じ番号に同じ数だけ入れる） */
  ring.pts.splice(best.e+1,0,np);
  ring.edges.splice(best.e+1,0,Object.assign({},ring.edges[best.e]));
  state.active=best.p; sel=null;
  saveState(); renderPolyList(); renderEdgeEdit(); draw();
  toast('点を足しました（そのまま つまんで動かせます）');
}

window.nnFitView=function(){

  let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9,has=false;

  state.polys.forEach(p=>ringsOf(p).forEach(r=>r.pts.forEach(q=>acc(q.x,q.y))));
  drawPts.forEach(q=>acc(q.x,q.y));

  }

  if(!(topPx>=0) || topPx>H*0.6) topPx=0;

/* 外周上の最近傍点：{e:辺番号, t:0-1, pt, distPx} */
function nearestOnBoundary(poly, gx, gy){
  let best=null;
  const pts=poly.pts;
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    const dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy||1;
    let t=((gx-a.x)*dx+(gy-a.y)*dy)/L2; t=Math.max(0.02,Math.min(0.98,t));
    const px_=a.x+t*dx, py_=a.y+t*dy;
    const dpx=Math.hypot((gx-px_)*cellPx,(gy-py_)*cellPx);
    if(!best||dpx<best.distPx)best={e:i,t,pt:{x:Math.round(px_*10)/10,y:Math.round(py_*10)/10},distPx:dpx};
  }
  return best;
}
/* 段差ライン：部位を2分割 */
function doSplit(poly, ins1, ins2, mids){
  const defH=+document.getElementById('defH').value||300;
  const pts=poly.pts, edges=poly.edges, n=pts.length;
  /* 境界ノード列（各ノードは「次の辺」の属性を持つ）に挿入点を差し込む */
  const nodes=[];
  for(let i=0;i<n;i++){
    nodes.push({pt:pts[i], prop:edges[i], ins:null});
    const here=[ins1,ins2].filter(s=>s.e===i).sort((a,b)=>a.t-b.t);
    here.forEach(s=>nodes.push({pt:s.pt, prop:edges[i], ins:s}));
  }
  const i1=nodes.findIndex(nd=>nd.ins===ins1);
  const i2=nodes.findIndex(nd=>nd.ins===ins2);
  if(i1<0||i2<0){ toast('分割に失敗しました'); return; }
  const M=nodes.length;
  const walk=(from,to)=>{ /* from→to（前進）で境界の点＆辺属性を収集 */
    const P=[], E=[];
    let k=from;
    while(true){
      P.push({...nodes[k].pt});
      if(k===to)break;
      E.push({...ek(nodes[k].prop)});
      k=(k+1)%M;
    }
    return {P,E};
  };
  const A=walk(i1,i2), B=walk(i2,i1);
  const kabeE=()=>({h:defH,w:0,k:'kabe'});
  /* リングA＝境界(i1→i2)＋段差ライン逆順、リングB＝境界(i2→i1)＋段差ライン順 */
  const ringA={pts:[...A.P, ...[...mids].reverse()], edges:[...A.E, ...Array(mids.length+1).fill(0).map(kabeE)]};
  const ringB={pts:[...B.P, ...mids],               edges:[...B.E, ...Array(mids.length+1).fill(0).map(kabeE)]};
  if(ringA.pts.length<3||ringB.pts.length<3){ toast('分割ラインが短すぎます'); return; }
  const mk=(ring,suffix)=>({ name:poly.name+suffix, lv:poly.lv, pts:ring.pts, edges:ring.edges, holes:[] });
  const pA=mk(ringA,'-A'), pB=mk(ringB,'-B');
  /* 元の穴は重心が含まれる側へ引き継ぐ */
  (poly.holes||[]).forEach(hh=>{
    const c=polyCenter(hh.pts);
    (pointInPoly(pA.pts,c.x,c.y)?pA:pB).holes.push(hh);
  });
  const idx=state.polys.indexOf(poly);
  state.polys.splice(idx,1,pA,pB);
  state.active=idx; sel=null;
  saveState(); renderPolyList(); renderEdgeEdit(); draw();
  toast('2つの部位に分割しました。それぞれのGL+（高さ）を設定してください。分割線は壁当り扱いです');
}

function pickEdge(){
  let best=null, bd=9;
  state.polys.forEach((poly,pi)=>{
    ringsOf(poly).forEach(ring=>{
      const pts=ring.pts;
      for(let i=0;i<pts.length;i++){
        const a=pts[i], b=pts[(i+1)%pts.length];
        const d=distToSeg(mouse.x,mouse.y, gx2px(a.x),gy2px(a.y), gx2px(b.x),gy2px(b.y));
        if(d<bd){ bd=d; best={p:pi,r:ring.r,e:i}; }
      }
    });
  });
  sel=best;
  if(best){ state.active=best.p; renderPolyList(); }
  renderEdgeEdit(); draw();
}
/* 選択中リングの辺配列を取得 */
function selRing(){
  const poly=state.polys[sel.p];
  return sel.r<0 ? {pts:poly.pts, edges:poly.edges} : poly.holes[sel.r];
}
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy||1;
  const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/L2));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

window.edgeSetAngle=function(v){
  if(!sel)return;

  const a=ring.pts[sel.e], b=ring.pts[(sel.e+1)%n];
  const L=Math.hypot(b.x-a.x, b.y-a.y);
  const th=(+v||0)*Math.PI/180;
  b.x=Math.round((a.x+L*Math.cos(th))*10)/10;
  b.y=Math.round((a.y+L*Math.sin(th))*10)/10;

};

function edgeSet(k,v){
  if(!sel)return;
  const e=selRing().edges[sel.e];
  /* ★2026-08-24ai 打ち間違いで数量が桁違いになるのを防ぐ上限（mm）。
     立上り30m・天端10m・アゴ3m・壁の厚み3m。実物はこの1/10以下。 */
  const MX={h:30000, w:10000, agoD:3000, wall:3000};

/* 全部位の割付集計（シート工法のみ） */
function wariAgg(){
  const sp=spec(), s=state.scaleM;
  if(sp.type!=='sheet'||!state.polys.length)return null;
  let lens=[], nPieces=0, totalLen=0;
  state.polys.forEach(p=>{
    const ptsM=p.pts.map(q=>({x:q.x*s,y:q.y*s}));
    const holesM=(p.holes||[]).map(hh=>hh.pts.map(q=>({x:q.x*s,y:q.y*s})));
    const lay=wari(ptsM, holesM, sp.sheetW, state.lapMm/1000, state.endLapMm/1000, sp.rollLen, dirOf(p), state.chidori);
    lens=lens.concat(lay.lens); nPieces+=lay.nPieces; totalLen+=lay.totalLen;
  });
  return {nPieces, totalLen, rolls:ffdRolls(lens, sp.rollLen)};
}
function recalc(){
  const sp=spec(), s=state.scaleM;
  /* ★2026-08-23j 平場（p.spec）と立上り・天端（p.specT）で仕様を別々に選べる。
     仕様ごとに行を分けて集計する。全部同じ仕様なら今までとまったく同じ表。 */
  const gH={}, hOrd=[], gV={}, vOrd=[];
  let hira=0,tachi=0,tenba=0,kabe=0,agoL=0,agoA=0,per=0;
  state.polys.forEach(p=>{
    const q=quantities(p,s), spH=specOfPoly(p), spV=specTOfPoly(p);
    let h=gH[spH.code]; if(!h){ h=gH[spH.code]={sp:spH,hira:0}; hOrd.push(h); }
    h.hira+=q.hira;
    let v=gV[spV.code]; if(!v){ v=gV[spV.code]={sp:spV,tachi:0,tenba:0,kabe:0,agoL:0,agoA:0}; vOrd.push(v); }
    v.tachi+=q.tachi; v.tenba+=q.tenba; v.kabe+=q.kabe; v.agoL+=q.agoL||0; v.agoA+=q.agoA||0;
    hira+=q.hira; tachi+=q.tachi; tenba+=q.tenba; kabe+=q.kabe; agoL+=q.agoL||0; agoA+=q.agoA||0; per+=q.per;
  });
  const multi=hOrd.length>1||vOrd.length>1||(hOrd[0]&&vOrd[0]&&hOrd[0].sp.code!==vOrd[0].sp.code);
  const rows=[];
  hOrd.forEach(g=>{
    const tag=multi?('（'+g.sp.code+'）'):'';
    rows.push(['平場'+tag, g.hira, '㎡', g.sp.prices.hira]);
  });
  vOrd.forEach(g=>{
    const tag=multi?('（'+g.sp.code+'）'):'';
    if(!multi||g.tachi>0) rows.push(['立上り'+tag, g.tachi, '㎡', g.sp.prices.tachi]);
    if(!multi||g.tenba>0) rows.push(['天端'+tag, g.tenba, '㎡', g.sp.prices.tenba]);
    if(g.kabe>0) rows.push(['端末金物（壁当り）'+tag, g.kabe, 'm', TERM_PRICE]);
    if(g.agoA>0) rows.push(['水切りアゴ廻り（'+f1(g.agoL)+'m）'+tag, g.agoA, '㎡', g.sp.prices.tachi]);
  });
  /* ★2026-08-27c 取り合い（仕様の違う屋根どうしの境界）の処理を計上する */
  try{ if(window.nnKasagiRows) nnKasagiRows().forEach(r=>rows.push(r)); }catch(_){}
  try{
    if(window.nnTorAgg){ const ta=nnTorAgg();
      Object.keys(ta).forEach(k=>{ const t=ta[k];
        if(t.len>0) rows.push(['取り合い処理（'+t.label+'）', t.len, 'm', t.price]); }); }
  }catch(_){}
  let total=0;
  const tr=rows.map(r=>{
    const amt=r[1]*r[3]; total+=amt;
    return `<tr><td>${r[0]}</td><td class="num">${f1(r[1])} ${r[2]}</td><td class="num">¥${fmt(r[3])}</td><td class="num">¥${fmt(amt)}</td></tr>`;
  }).join('');

  /* 材料概算 */
  let matHtml='';
  if(state.polys.length){
    if(sp.type==='sheet'){
      const wa=wariAgg();
      const rollsTachi=tachi>0?Math.ceil(tachi/(sp.sheetW*sp.rollLen)*1.15):0;
      matHtml+=`<div class="matline">シート（平場・割付/取り都合）<span class="v">${wa?wa.rolls:0} 巻</span></div>`;
      matHtml+=`<div class="matline">シート（立上り・役物 概算）<span class="v">${rollsTachi} 巻</span></div>`;
    }else{
      matHtml+=`<div class="matline">主材（塗膜・平場${f1(hira)}㎡）<span class="v">概算 ${Math.ceil(hira*3.0/18)} 缶(18kg)</span></div>`;
    }
    const primer=Math.ceil((hira+tachi+tenba)*0.2/16*10)/10;
    matHtml+=`<div class="matline">プライマー（0.2kg/㎡・16kg缶）<span class="v">${Math.ceil(primer)} 缶</span></div>`;
  }

  document.getElementById('sekisan').innerHTML = state.polys.length ? `
    <table class="qt"><tr><th>部位</th><th>数量</th><th>単価</th><th>金額</th></tr>${tr}</table>
    <div class="total"><span class="l">見積合計（税別）</span><span class="v">¥${fmt(total)}</span></div>
    <div style="margin-top:9px;font-size:12px;font-weight:800;color:var(--green-deep);">材料概算</div>
    ${matHtml}
    <div class="note">${multi?'※屋根ごとに仕様が違うため、仕様別に集計しています。材料概算・割付は全体の設定（'+sp.code+'）基準です。<br>':''}周長 ${f1(per)}m｜数量は図面から自動算出。ロス率：平場シート5%・立上り15%込み。<br>※単価・歩掛・ロス率はデモ用の概算値です。ドレン・脱気筒・入隅出隅役物等は未計上（壁当り端末金物は計上済み）。</div>
  ` : '<div class="nosel">図面を作成すると数量と概算見積がここに表示されます。</div>';

  renderWfResult(hira);
  wfLegend();
}
/* 選択中の部位を回転（中心＝重心、自由角度） */
function polyRotate(sign){
  const p=state.polys[state.active];
  if(!p){ toast('回転する部位を選択してください'); return; }
  const deg=(+document.getElementById('rotdeg').value||0)*sign;
  const rad=deg*Math.PI/180, c=polyCenter(p.pts);
  const rot=pt=>({
    x:Math.round((c.x+(pt.x-c.x)*Math.cos(rad)-(pt.y-c.y)*Math.sin(rad))*100)/100,
    y:Math.round((c.y+(pt.x-c.x)*Math.sin(rad)+(pt.y-c.y)*Math.cos(rad))*100)/100
  });
  p.pts=p.pts.map(rot);
  (p.holes||[]).forEach(hh=>{ hh.pts=hh.pts.map(rot); });
  saveState(); renderPolyList(); draw();
}
function renderWfResult(){
  const d=document.getElementById('wfresult'); if(!d)return;
  const sp=spec(), s=state.scaleM;
  if(sp.type!=='sheet'){ d.innerHTML=`<div class="nosel">「${sp.name}」は塗膜工法のため、シート割付の対象外です（通気緩衝シートの割付は本デモでは省略）。</div>`; return; }
  if(!state.polys.length){ d.innerHTML='<div class="nosel">図面を作成すると割付結果が表示されます。</div>'; return; }
  const wa=wariAgg();
  d.innerHTML=`
    <div class="matline">シート枚数（平場）<span class="v">${wa.nPieces} 枚</span></div>
    <div class="matline">総延長（ラップ込み実延長）<span class="v">${f1(wa.totalLen)} m</span></div>
    <div class="matline">必要巻数（${sp.sheetName}・取り都合計算）<span class="v" style="color:var(--profit)">${wa.rolls} 巻</span></div>
    <div class="note" style="margin-top:5px">取り都合＝1巻から取れる枚数を計算して巻数を算出。端部切りしろは別途。</div>`;
}

    maxY=Math.max(maxY,Math.max(lv,lvDeck)+1);
    const shape=new THREE.Shape(ptsM.map(p=>new THREE.Vector2(p.x,p.y)));
    (poly.holes||[]).forEach(hh=>{
      shape.holes.push(new THREE.Path(hh.pts.map(q=>new THREE.Vector2(q.x*s,q.y*s))));
    });
    /* 躯体：★2026-08-23g「下にある部位の屋根」から立ち上げる。
       これまで常に地面(0)からだったので、1面の高さ（GL+）を変えると、その上に
       載っている塔屋などが「地面からの塔」として露出し、建物そのものの高さが
       変わった・分解したように見えた（本人の指摘）。
       自分の足元が別の部位の中にあるなら、その部位の屋根から立ち上げる。 */
    let baseLv=0;
    try{
      const c0=polyCenter(poly.pts);
      state.polys.forEach(o=>{ if(o===poly)return;
        const ol=+o.lv||0;                       /* ★2026-08-24a 相手の平場（屋根の面）で比べる */
        if(ol<bodyLv && ol>baseLv && pointInPoly(o.pts,c0.x,c0.y)) baseLv=ol; });
    }catch(_){}
    /* 躯体は「面」ではなく「立体（㎥）」。天板は平場の高さ。 */
    const topY = bodyLv;
    const depth = (topY-baseLv)>0 ? (topY-baseLv) : 0.15;
    const bodyG=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:false});
    bodyG.rotateX(Math.PI/2);
    const body=new THREE.Mesh(bodyG, nnMat('concrete', lv>0?0xcdc6ba:0xb9bcb4));
    body.name='nnBody'; body.userData.bodyIdx=nnPi;
    body.position.y=topY; nnShade(body,true,true); g.add(body);
    /* ★2026-08-23w 平場を持ち上げたら、その分だけ「床スラブ（立体）」を立ち上げる。
       ＝四方に必ず側面が出る。パラペット・天端は lv のままなので独立して残る。 */
    /* 防水層（仕様色） */
    const memG=new THREE.ShapeGeometry(shape); memG.rotateX(Math.PI/2);
    nnUvMetric(memG, NN_TEX_PER_M, NN_TEX_PER_M);   /* 砂の粒を実寸に */
    const mem=new THREE.Mesh(memG, nnMat(nnMemKind(sp), nnMemColor(sp), true));
    mem.position.y=lvDeck+0.012; nnShade(mem,false,true);   /* ★青い面＝GL+の高さで動く */
    mem.userData.polyIdx=nnPi;   /* ★2026-08-23f 3Dで屋根の面をタップ→この部位を選ぶ */
    g.add(mem);
    /* ★継目（溶融アスファルトのはみ出し）の作り。丸く盛り上がった黒い帯。
       ★2026-08-12b ① 端が「外壁の面」とぴったり重なって、外壁にぽつぽつ黒い点として
          顔を出していた。端を30mm内側で止めて壁の中に隠す。
       ② 立上りに回す継目の位置を seamCuts に集めて、下のパラペットの処理で使う。 */
    const seamMat=nnMat('bead', 0x14120f);
    /* ★2026-08-12q 現場写真と比べて太すぎたので半分に（直径24mm→12mm）。
       実物のはみ出しアスは細くて平たく、ところどころ消えかかっている。 */
    const BEAD_R=0.006;
    const seamCuts=[];
    /* ★2026-08-12d 以前は端を30mmずつ短くしていた（外壁から顔を出すのを隠すため）。
       そのせいで継目どうしの交わるところに60mmのすき間ができ、
       「はみ出しアスがつながっていない」状態になっていた。
       いまは下の nnInsetOutline で「立上りが貼りかかる線」までで止めるので、
       短くする必要がない。端は貼りかけの継目とぴったり突き合う。 */
    const seamBead=(len, alongX, cx, cy, cz)=>{
      if(len<0.05) return null;
      const gm=nnBeadGeomT(len, BEAD_R, alongX?'z':'x', 0.52);   /* 平たくつぶす */
      const m=new THREE.Mesh(gm, seamMat);
      m.name='nnFlatSeam';            /* 平場の継目（検証で見分けるため） */
      m.position.set(cx, cy, cz); g.add(m); return m;
    };
    /* シート割り付けの継目を3D表示（トグル） */
    if(sp.type==='sheet' && show3dWari){
      const BEAD_Y=lvDeck+0.016;          /* ★シート面（GL+）より少し上に出す */
      const holesM=(poly.holes||[]).map(hh=>hh.pts.map(q=>({x:q.x*s,y:q.y*s})));
      const lay=wari(ptsM, holesM, sp.sheetW, state.lapMm/1000, state.endLapMm/1000, sp.rollLen, dirOf(poly), state.chidori);
      /* ★2026-08-12d 継目を描く範囲は「立上りのシートが貼りかかる線」まで。
         割り付けの計算（wari）は今までどおり屋根いっぱいで行い、
         **描くときだけ**内側の輪郭で切る。実物も、平場の継目は立上りの下に隠れる。 */
      const cutPts=nnInsetOutline(poly, poly.pts, poly.edges, s, 0.12);
      const cutHoles=(poly.holes||[]).map(hh=>nnInsetOutline(poly, hh.pts, hh.edges, s, 0.12));
      const HDIR=dirOf(poly)==='h';
      /* 座標の入れ替え：T2＝帯に沿う向きのスキャン用／T3＝それと直交する向きのスキャン用 */
      const T2=q=>HDIR?q:{x:q.y,y:q.x};
      const T3=q=>HDIR?{x:q.y,y:q.x}:q;
      lay.bands.forEach((b,bi)=>{
        /* 帯境界（サイドラップ位置）の継目線 */
        if(bi>0){
          const segs=scanSegsH(cutPts.map(T2), cutHoles.map(hh=>hh.map(T2)), b.lo+1e-5);
          segs.forEach(sg=>{
            const len=sg[1]-sg[0]; if(len<0.05)return;
            const cx=HDIR?(sg[0]+sg[1])/2:b.lo, cz=HDIR?b.lo:(sg[0]+sg[1])/2;
            seamBead(len, HDIR, cx, BEAD_Y, cz);
            seamCuts.push(HDIR?{ax:'z',v:b.lo}:{ax:'x',v:b.lo});
          });
        }
        /* エンドラップ（シート切断）位置の継目線
           ★2026-08-06s 以前は「帯の幅ぶんの棒」を屋根の形と無関係に置いていたため、
             凸凹した屋根では継目線が屋根の外へはみ出していた。
             その位置で屋根の中に入っている区間を求め、帯の範囲と重なる分だけ描く。
           ★2026-08-08d さらに「次の帯に隠れる分」を描かないようにした。
             シートは幅ぜんぶ（b.lo〜b.hi）あるが、次のシートが b.lo+eff から上に載るので、
             そこから先の切断線は本来は見えない。2Dは後の帯で塗りつぶされるので隠れるが、
             3Dは全部同じ高さに置いていたため、短手の継目線だけ 100mm（サイドラップぶん）
             はみ出して見えていた。次の帯の lo で頭を止める。 */
        const bNext=lay.bands[bi+1];
        const visHi=bNext?Math.min(b.hi, bNext.lo):b.hi;
        b.segs.forEach(sg=>{
          sg.pieces.forEach((p,pi)=>{
            if(pi===0)return;
            const cross=scanSegsH(cutPts.map(T3), cutHoles.map(hh=>hh.map(T3)), p.s+1e-5);
            cross.forEach(cs=>{
              const lo=Math.max(cs[0], b.lo), hi=Math.min(cs[1], visHi);
              const len=hi-lo; if(len<0.05)return;
              const cx=HDIR?p.s:(lo+hi)/2, cz=HDIR?(lo+hi)/2:p.s;
              seamBead(len, !HDIR, cx, BEAD_Y, cz);
              seamCuts.push(HDIR?{ax:'x',v:p.s}:{ax:'z',v:p.s});
            });
          });
        });
      });
    }
    /* 辺ごとの立上り（外周＋中抜きの縁）
       ★2026-08-06i 作り直し：壁・笠木は「辺ごとの直方体」をやめ、
       角で互いに突き合わせた台形（留め継ぎ）を押し出して作る。
       直方体だと90度以外の角で壁どうしが届かず、パラペットがずれて見えた
       （90度は隣の壁の厚みがすき間を偶然隠していただけ）。 */
    ringsOf(poly).forEach(ring=>{
      /* ★2026-08-23j 立上り・天端は「立上りの仕様（p.specT）」の色・質感で描く。
         平場（mem・平場の継目）は上の sp（p.spec）のまま。 */
      const sp=specTOfPoly(poly);
      const rpts=ring.pts;
      const rptsM=rpts.map(p=>({x:p.x*s,y:p.y*s}));
      const N=rptsM.length;
      /* 各辺の情報（壁の無い辺は null） */
      const eds=[];
      for(let i=0;i<N;i++){
        const e=ek(ring.edges[i]);
        if(e.h<=0){ eds.push(null); continue; }
        const a=rptsM[i], b=rptsM[(i+1)%N];
        eds.push({e, a, b,
          len:Math.hypot(b.x-a.x,b.y-a.y),
          hh:e.h/1000,
          th:nnWallTh(e),
          nrm:ringNormal(poly, rpts, rpts[i], rpts[(i+1)%N]),
          ang:Math.atan2(b.y-a.y, b.x-a.x)});
      }
      /* 辺 ed の線を、屋根の内側へ off だけずらした上の点P（offが負なら外側） */
      const offPt=(ed,P,off)=>({x:P.x+ed.nrm.x*off, y:P.y+ed.nrm.y*off});
      /* 角P（edA→edB の継ぎ目）：それぞれ offA/offB ずらした2本の線の交点＝留め継ぎの角。
         隣に壁が無い・平行・極端に尖った角は、そのまま直角に切る */
      function joint(edA, edB, P, offA, offB){
        if(!edA) return offPt(edB,P,offB);
        if(!edB) return offPt(edA,P,offA);
        const p1=offPt(edA,P,offA), d1={x:edA.b.x-edA.a.x, y:edA.b.y-edA.a.y};
        const p2=offPt(edB,P,offB), d2={x:edB.b.x-edB.a.x, y:edB.b.y-edB.a.y};
        const den=d1.x*d2.y-d1.y*d2.x;
        if(Math.abs(den)<1e-9) return p2;
        const t=((p2.x-p1.x)*d2.y-(p2.y-p1.y)*d2.x)/den;
        const ix=p1.x+d1.x*t, iy=p1.y+d1.y*t;
        /* ★2026-08-23s この歯止めが厳しすぎて、少し鋭い角だと「直角に切る」に落ち、
           パラペットの角が斜めに切れて見えていた（本人の指摘）。大きく緩める。 */
        if(Math.hypot(ix-P.x, iy-P.y) > (Math.abs(offA)+Math.abs(offB))*14+1.5) return p2;
        return {x:ix, y:iy};
      }
      /* ★2026-08-27g 隣の壁と高さが違う角は「留め継ぎ（45度）」にしてはいけない。
         留め継ぎの合わせ目は45度の面なので、高さがそろっているうちは
         両方の壁に挟まれて見えない。ところが片方だけ高くすると、
         その差のぶんだけ**45度の面がむき出し**になり、
         「断面が斜めにカットされている」ように見える（本人の指摘・2026-08-27）。
         実物は、高いほうが角を通しで作り、低いほうがその内側に突き当たる。
         dir: -1＝辺の始点側（相手は prev）／+1＝終点側（相手は next） */
      function jointH(other, ed, P, offSelf, dir){
        if(!other) return offPt(ed,P,offSelf);
        const dh=(other.hh||0)-(ed.hh||0);
        if(Math.abs(dh)<0.002)                       /* 同じ高さ＝今までどおり留め継ぎ */
          return (dir<0) ? joint(other,ed,P,offSelf,offSelf) : joint(ed,other,P,offSelf,offSelf);
        const L=ed.len||1, ux=(ed.b.x-ed.a.x)/L, uy=(ed.b.y-ed.a.y)/L;
        /* ★2026-08-27h その角が出隅か入隅かで、やることが変わる（§227の飛び出しの直し）。
           ・出隅＝2枚の壁の帯はもともと角で重なっている。
             高いほうは「角でまっすぐ切る」だけでよい。伸ばすと建物の外に飛び出す（実機で発生）。
             低いほうだけ、高いほうの内側の面で止める（重なりを消す）。
           ・入隅＝帯どうしは角で届かない。高いほうを相手の厚みぶん通してすき間をふさぐ。
             低いほうを切るとかえって穴があくので、そのまま角まで。 */
        const eA=(dir<0)?other:ed, eB=(dir<0)?ed:other;   /* 角に入ってくる辺 → 出ていく辺 */
        const cr=(eA.b.x-eA.a.x)*(eB.b.y-eB.a.y)-(eA.b.y-eA.a.y)*(eB.b.x-eB.a.x);
        const convex=(cr>0)===(ringArea>0);
        const t0=(dir<0?1:-1)*(dh>0?1:-1)*(other.th||0);
        const t=(dh<0) ? (convex?0:t0)      /* こちらが高い：出隅は角で切る／入隅だけ通す */
                       : (convex?t0:0);     /* こちらが低い：出隅だけ相手の内側で止める */
        return offPt(ed,{x:P.x+ux*t, y:P.y+uy*t},offSelf);
      }
      /* ★2026-08-12m 出隅（縦の角）かどうか。
         多角形の回り方（符号付き面積）と、その角の外積の符号が同じなら出っぱった角＝出隅。 */
      const ringArea=rptsM.reduce((s2,p,idx)=>{const n2=rptsM[(idx+1)%N]; return s2+(p.x*n2.y-n2.x*p.y);},0);
      const isConvex=k=>{
        const P=rptsM[(k+N-1)%N], Q=rptsM[k], R=rptsM[(k+1)%N];
        const cr=(Q.x-P.x)*(R.y-Q.y)-(Q.y-P.y)*(R.x-Q.x);
        return (cr>0)===(ringArea>0) && Math.abs(cr)>1e-9;
      };
      /* 平面の多角形を高さhで押し出して置く（yTop＝上端の高さ） */
      function stripN(q0,h,yTop,color,kind){
        let q=q0.slice();
        const area=q.reduce((s2,p,idx)=>{const n2=q[(idx+1)%q.length]; return s2+(p.x*n2.y-n2.x*p.y);},0);
        if(area<0)q=q.slice().reverse();
        const sh=new THREE.Shape(q.map(p=>new THREE.Vector2(p.x,p.y)));
        const gm=new THREE.ExtrudeGeometry(sh,{depth:h,bevelEnabled:false});
        nnUvMetric(gm, NN_TEX_PER_M, NN_TEX_PER_M);
        gm.rotateX(Math.PI/2);
        const m=new THREE.Mesh(gm, nnMat(kind||'concrete', color, true));
        m.position.y=yTop; nnShade(m,true,true); g.add(m);
      }
      const strip=(o1,o2,i2,i1,h,yTop,color,kind)=>stripN([o1,o2,i2,i1],h,yTop,color,kind);
      /* ★2026-08-12k 面取り（斜めの面）を1枚置く。
         4点それぞれに高さを持てるので、45度の斜面が作れる。
         `strip` は「押し出し」なので垂直の面しか作れず、面取りには使えない。 */
      function slope(p1,y1,p2,y2,p3,y3,p4,y4,color,kind){
        const gm=new THREE.BufferGeometry();
        gm.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
          p1.x,y1,p1.y,  p2.x,y2,p2.y,  p3.x,y3,p3.y,
          p1.x,y1,p1.y,  p3.x,y3,p3.y,  p4.x,y4,p4.y ]), 3));
        /* ★2026-08-15 面取りの斜面だけ「砂付仕上げ」にならなかった（本人の指摘）。
           原因はこの板に**貼り付ける座標（UV）が無かった**こと。
           three.js は UV が無い面には模様（砂の粒）を貼れず、のっぺりした色板になる。
           他の面と同じ「1m＝NN_TEX_PER_M」の実寸で貼れるよう、ここで作る。 */
        const d3=(a,ya,b,yb)=>Math.hypot(b.x-a.x, yb-ya, b.y-a.y);
        const u2=d3(p1,y1,p2,y2), v2=d3(p2,y2,p3,y3);
        const u3=d3(p4,y4,p3,y3), v1=d3(p1,y1,p4,y4);
        const K=NN_TEX_PER_M;
        const U=[0,0, u2*K,0, u3*K,v2*K,  0,0, u3*K,v2*K, 0,v1*K];
        gm.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(U), 2));
        gm.computeVertexNormals();
        const m=new THREE.Mesh(gm, nnMat(kind||'concrete', color, true));
        nnShade(m,true,true); g.add(m); return m;
      }
      /* ★2026-08-23e はみ出しアスの道具は、パラペットの中から辺のループの外へ出した。
         壁当り（壁面）の立上りでも同じ継目を使うため（中身は変えていない）。 */
        /* 2点のあいだに丸い帯（はみ出しアス）を置く */
        /* ★2026-08-12p 斜めに置く継目（面取りの上を通す用）。
           面取りは45度の斜面なので、横向きでも縦向きでもない。
           棒の向きをそのまま3Dで合わせる。 */
        const beadSlope=(p1,y1,p2,y2)=>{
          const dx=p2.x-p1.x, dy=y2-y1, dz=p2.y-p1.y;
          const L=Math.hypot(dx,dy,dz); if(L<0.01) return;
          /* ★2026-08-23x 半分の太さ。丸のままだと天端の縁から6mm突き出て、
             外から見たとき等間隔の「謎のライン」に見える（本人の指摘・2回目）。 */
          const gm=nnBeadGeom(L, BEAD_R*0.5);
          const m=new THREE.Mesh(gm, seamMat);
          m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),
            new THREE.Vector3(dx/L, dy/L, dz/L));
          m.position.set((p1.x+p2.x)/2, (y1+y2)/2, (p1.y+p2.y)/2);
          m.name='nnChamBead'; g.add(m);
        };
        /* ★2026-08-12i 棒どうしが直角に出会うところに「玉」を置く。
           丸い棒の端は平らな面なので、直角に突き合わせると必ず断面の差が段になる
           （位置は合っているのに段に見える、の正体）。
           玉を1つ置くと、両方の棒がその中に埋まって continuous に見える。
           ★玉は棒とほぼ同じ太さ（1.08倍）。大きくすると「こぶ」に見える。
           ★**継ぎ目にだけ置く**こと。棒の自由端（何も繋がらない端）に置くと、
             そこだけ丸くふくらんで、かえって目立つ。 */
        const beadBall=(x,yy,z,small)=>{
          const gm=nnBallGeom(BEAD_R*(small?0.55:1.08));
          const m=new THREE.Mesh(gm, seamMat);
          m.position.set(x, yy, z); m.name='nnBeadBall'; g.add(m);
        };
        /* ★2026-08-12g round=true のときはつぶさない。
           天端の継目は、立上りの縦の継目（丸いまま）と突き合わせるので、
           断面をそろえないと合わせ目に段ができる。 */
        const beadBetween=(p1,p2,yy,round,thin)=>{
          const dx=p2.x-p1.x, dz=p2.y-p1.y, L=Math.hypot(dx,dz);
          if(L<0.08) return;
          /* ★2026-08-24a thin＝天端の上。太いと等間隔の「線」に見えるので、ごく細くする */
          const gm=nnBeadGeomT(L, BEAD_R*(thin||1), 'z', round?1:0.52);
          const m=new THREE.Mesh(gm, seamMat);
          m.position.set((p1.x+p2.x)/2, yy, (p1.y+p2.y)/2);
          m.rotation.y=-Math.atan2(dz,dx); g.add(m);
        };
      for(let i=0;i<N;i++){
        const ed=eds[i]; if(!ed)continue;
        const prev=eds[(i+N-1)%N], next=eds[(i+1)%N];
        const e=ed.e, hh=ed.hh, th=ed.th, nrm=ed.nrm, a=ed.a, b=ed.b, len=ed.len, ang=ed.ang;
        const P0=rptsM[i], P1=rptsM[(i+1)%N];
        if(e.k==='para'){
          /* 壁：外側の線＝辺そのもの。内側＝厚みth。角は隣の壁と留め継ぎ */
          /* ★2026-08-12a パラペットの色を建物（躯体）と同じに（本人の指示）。
             以前は 0xcfd2ca で、建物より白く浮いて見えていた。 */
          /* ★2026-08-12k 天端の外側の角に「面取り」を作る（本人の指摘）。
             実物のパラペットは、型枠に面木を入れて角を45度に落としてある。
             `strip`（押し出し）では斜面が作れないので、3つに分けて組む。
               ①本体（下端〜面取りの下）②面取りぶん内側に寄せた帯 ③その間の斜面 */
          const CH=Math.min(0.02, th*0.25, hh*0.25);      /* 天端の面取り（既定20mm） */
          const wCol=(lv>0?0xcdc6ba:0xb9bcb4);
          /* ★2026-08-15 出隅（縦の角）の面取りは**廃止**（本人の指示）。
             2026-08-12m に入れたが、角に小さな三角の面ができて
             「謎の面取り。なんかおかしい」と見えていた（特にパラペットの
             足元＝スラブとの境目に、明るい三角が残っていた）。
             いまは角を今までどおり留め継ぎ（joint）でそのまま突き合わせる。
             ※天端の面取り（CH）は残す。こちらは実物どおりで、指摘も無い。 */
          const O0=jointH(prev,ed,P0,0,-1);
          const O1=jointH(next,ed,P1,0,+1);
          const K0=jointH(prev,ed,P0,CH,-1);
          const K1=jointH(next,ed,P1,CH,+1);
          const I1=jointH(next,ed,P1,th,+1);
          const I0=jointH(prev,ed,P0,th,-1);
          /* ★2026-08-12n 天端の**内側**の角（天端と立上りが出会うところ）も面取りする。
             ここが「角ばっている」と指摘された場所。実物も面木で落としてある。
             内側へ CH だけ引っ込めた線 IK を作り、その間を斜面でつなぐ。 */
          const IK1=jointH(next,ed,P1,th-CH,+1);
          const IK0=jointH(prev,ed,P0,th-CH,-1);
          strip(O0,O1,I1,I0,  hh-CH, lv+hh-CH, wCol, 'concrete');   /* ①本体 */
          strip(K0,K1,IK1,IK0, CH,   lv+hh,    wCol, 'concrete');   /* ②天端寄りの帯 */
          slope(O0,lv+hh-CH, O1,lv+hh-CH, K1,lv+hh, K0,lv+hh, wCol, 'concrete');  /* ③外の斜面 */
          slope(IK0,lv+hh, IK1,lv+hh, I1,lv+hh-CH, I0,lv+hh-CH, wCol, 'concrete');/* ④内の斜面 */
          /* ★2026-08-12a 立上り防水層が見えなかった原因：
             nrm は「屋根の内側向き」なので、0.012 だけずらすと**壁の中に埋まっていた**
             （壁は 0 から th まで内側に向かって厚みがある）。
             内側の面（th）のさらに手前に貼る。 */
          /* ★2026-08-15 出隅の角をふさぐ三角柱も、上の面取り廃止に合わせて削除した。
             角は留め継ぎ（joint）で両側の壁が直接突き合うので、すき間はできない。 */
          const fo=th+0.006;
          /* ★2026-08-12e 以前は「辺の長さ(len)ぶんの板」を辺の中央に置いていた。
             内側へ fo ずらすと角では板どうしが届かず、**出隅で立上り防水層が切れて**いた。
             壁と同じ留め継ぎ（joint）で角の点を出し、**角から角まで**の板にする。
             ★2026-08-27g 高さが違う角では壁の作りが変わるので、こちらも合わせる。 */
          const fA=jointH(prev,ed,P0,fo,-1);
          const fB=jointH(next,ed,P1,fo,+1);
          const fdx=fB.x-fA.x, fdz=fB.y-fA.y, fL=Math.hypot(fdx,fdz);
          if(fL>0.01){
            /* ★2026-08-12j 立上り防水層は**天端の上の面まで**伸ばす。
               以前は壁の上端（lv+hh）で終わっていたので、その上に
               天端防水層の「厚み12mm・6mm奥まった小口」が帯になって見えていた。
               ＝パラペットの全長に走る「謎の継ぎ目（段）」の正体。
               上まで伸ばすと小口が隠れ、立上りから天端へ1枚でつながって見える。 */
            const fH=hh-CH;      /* ★2026-08-12n 内側の面取りの手前まで。上は斜面が受ける */
            const fg=new THREE.PlaneGeometry(fL,fH);
            nnUvMetric(fg, fL*NN_TEX_PER_M, fH*NN_TEX_PER_M);
            const face=new THREE.Mesh(fg, nnMat(nnMemKind(sp), nnMemColor(sp), true));
            face.position.set((fA.x+fB.x)/2, lv+fH/2, (fA.y+fB.y)/2);
            face.rotation.y=-Math.atan2(fdz,fdx); nnShade(face,false,true); g.add(face);
          }
          /* ★2026-08-12b 立上りにも継目を回す（現場写真どおり）。
             ・入隅（立上りの根元）と天端（立上りの上端）に横の継目
             ・平場の継目が壁に当たるところに縦の継目
             どれも平場と同じ「丸く盛り上がった黒い帯」。 */
          /* ★2026-08-12c 立上りの作りを現場写真どおりに直した（本人の指示）。
             ・**天端まで防水層を回す**（笠木が無いので、シートは天端を覆って納まる）
             ・**立上りのシートは平場に少し貼りかける**。だから継目（はみ出しアス）は
               入隅ではなく、**壁から少し離れた平場の上**に出る
             ・**縦の継目はシート幅の間隔**で入る（以前は平場の継目が壁に当たる場所に
               入れていたので、間隔が広すぎ、しかも平場と同じ位置になっていた）
             ・**平場と立上りの継目は同じ場所に来ない**ようにずらす（千鳥）。
               同じ位置で重なると水みちになるため。 */
          if(sp.type==='sheet' && show3dWari && hh>0.02){
            /* ① 貼りかけの端（平場の上・壁から120mm）に出るはみ出しアス
               ★2026-08-12d 角は隣の辺と留め継ぎでつなぐ。
                 辺ごとに垂直に出すだけだと、出隅・入隅で継目が切れていた。 */
            const LAPIN=th+0.12;
            const lapOf=x=>x?(x.th+0.12):LAPIN;
            beadBetween(joint(prev,ed,P0,lapOf(prev),LAPIN),
                        joint(ed,next,P1,LAPIN,lapOf(next)), lv+0.016);
            /* ★2026-08-12e ② 天端の外側の端に出していた「はみ出しアス」は削除した。
               そこはシートの端が納まるだけで、重ね合わせが無い＝アスファルトは出ない。
               出しているせいで、天端に謎の帯が残っているように見えていた（本人の指摘）。 */
            /* ③ 縦の継目：シート幅の間隔で。平場の継目と重ならないよう半ピッチずらす */
            const pitch=Math.max(0.45,(sp.sheetW||1.0)-(state.lapMm||100)/1000);
            const H=hh+0.12+0.02;                     /* 平場の貼りかけぶんも含めて回す */
            for(let dd=pitch*0.5, _n=0; dd<len-0.06 && _n<NN_SEAM_MAX; dd+=pitch, _n++){
              /* ★2026-08-12j 角のすぐ横には縦の継目を立てない。
                 角には「角の縦の継目」がすでに1本あるので、そこへ 0.3m 以内に
                 もう1本立つと、天端の上で継目の端が2〜3本重なって
                 **段のような塊**に見える（本人の指摘の「謎の継ぎ目」）。
                 実際の現場でも、角のすぐ横で継ぐことはしない。 */
              if(dd<0.30 || dd>len-0.30) continue;
              const t=dd/len;
              const px=a.x+(b.x-a.x)*t, pz=a.y+(b.y-a.y)*t;
              /* 立上り面の縦 */
              /* ★2026-08-12f 以前は「つぶした棒」を hh-0.01 の高さで置いていた。
                 ・つぶすと立上りでは光が当たらず**平たい黒い線**にしか見えない
                 ・上端が天端より22mm低く、**天端の手前で切れて**いた
                 → つぶさずに丸いまま、平場の継目から天端の上まで1本で通す。 */
              /* ★2026-08-12g 天端の継目（横）の「上端」まで伸ばす。
                 天端の面ちょうどで止めると、横の継目だけ8mm高くて段に見える。 */
              /* ★2026-08-12p 天端の内側に面取りが入ったので、継目もそこで折れる。
                 縦は面取りの手前まで → 面取りの上は斜めの継目 → 天端へ。 */
              const vTop=lv+hh-CH, vBot=lv+0.016, vLen=vTop-vBot;
              const gm=nnBeadGeom(vLen, BEAD_R);
              const m=new THREE.Mesh(gm, seamMat);
              m.position.set(px+nrm.x*fo, (vTop+vBot)/2, pz+nrm.y*fo); g.add(m);
              const ck={x:px+nrm.x*(th-CH), y:pz+nrm.y*(th-CH)};
              beadSlope({x:px+nrm.x*fo, y:pz+nrm.y*fo}, vTop, ck, lv+hh+0.012);
              beadBall(px+nrm.x*fo, vTop, pz+nrm.y*fo, 1);   /* 面取りの下の折れ（小さく） */
              beadBall(ck.x, lv+hh+0.012, ck.y, 1);          /* 面取りの上の折れ（小さく） */
              beadBall(px+nrm.x*fo, vBot, pz+nrm.y*fo);   /* 平場との継ぎ目 */
              /* 平場に貼りかけた部分の縦（壁から120mmぶん） */
              const q1={x:px+nrm.x*(th+0.004), y:pz+nrm.y*(th+0.004)};
              const q2={x:px+nrm.x*LAPIN,      y:pz+nrm.y*LAPIN};
              beadBetween(q1,q2, lv+0.016);
              /* ★2026-08-23x 天端のはみ出しアスは出す（消したら「消えている」と指摘された）。
                 「外から見ると線が並ぶ」対策は2つ：
                 ・低くつぶす（round を付けない＝高さ約半分）→ 天端の縁から突き出ない
                 ・外側の縁から60mm離して始める → 外壁側のシルエットに出ない */
              /* ★2026-08-24b 天端のはみ出しアスは「見える太さ」で、ただし天端の内側寄り
                 だけに置く。外側の縁まで渡すと、上から見て等間隔の線に見える（§167）。 */
              /* ★2026-08-24c 天端の端（端末）まで通す。途中で止めると
                 「端末まで伸びてない」＝納まりとしておかしい（本人の指摘）。 */
              const r1={x:px+nrm.x*CH,      y:pz+nrm.y*CH};
              const r2={x:px+nrm.x*(th-CH), y:pz+nrm.y*(th-CH)};
              beadBetween(r1,r2, lv+hh+0.012, false, 0.85);
            }
            /* ★2026-08-12e ④ 出隅の納まり（頂いた現場写真どおり）。
               角ではシートをそのまま曲げられないので、切って重ねる（きんちゃく折り）。
               そのため実物の角には
                 ・角に沿った縦の継目が1本
                 ・天端を渡る継目
                 ・平場側へ斜めに出る継目（重ねた三角のふち）
               が必ず出る。最初からこの形で作る。 */
            if(next && next.e && next.e.k==='para' && next.hh>0.02){
              const nfo=next.th+0.006;
              const cB=joint(ed,next,P1,fo,nfo);          /* 立上り面の角 */
              /* 角の縦の継目（平場から天端まで） */
              const cTop=lv+hh-CH, cBot=lv+0.016, cLen=cTop-cBot;
              const gmC=nnBeadGeom(cLen, BEAD_R);
              const mC=new THREE.Mesh(gmC, seamMat);
              mC.position.set(cB.x, (cTop+cBot)/2, cB.y); g.add(mC);
              const cBk=joint(ed,next,P1,th-CH,(next?next.th-CH:th-CH));
              beadSlope(cB, cTop, cBk, lv+hh+0.012);
              beadBall(cB.x, cTop, cB.y, 1); beadBall(cBk.x, lv+hh+0.012, cBk.y, 1);
              beadBall(cB.x, cBot, cB.y);
              /* ★2026-08-12g 角の天端は「斜めに渡す」のをやめた。
                 斜めだと見る向きによって空中の塊に見える（本人の指摘が2回）。
                 実物どおり、**両側の辺それぞれに直角**の継目を1本ずつ入れる
                 （角では両側のシートがそこで終わるので、L字に2本出るのが正しい）。
                 向きも他の天端の継目とそろうので、浮いて見えない。 */
              /* ★2026-08-15 その「L字に2本」も削除した（本人の指摘）。
                 角では2本が外側の縁でV字に出会うので、外壁側の出隅に
                 「なぞのはみ出しアス」が乗っているようにしか見えなかった。
                 角の縦の継目と、平場へ斜めに出る継目だけで、
                 シートを重ねてあることは十分に分かる。 */
              /* ★2026-08-12f 天端を斜めに渡る継目は削除した。
                 角では天端を斜めに横切るので、見る向きによって
                 「斜め上に飛び出している」ように見えてしまう（本人の指摘）。
                 角の縦の継目だけで、重ねてあることは十分わかる。 */
              /* 平場へ斜めに出る継目（角を二等分する向き） */
              /* ★2026-08-12g 斜めの継目は「貼りかけの線の角」でぴたりと止める。
                 以前は二等分線の向きへ決め打ちの長さで伸ばしていたので、
                 止まるべきところを通り越していた（本人の指摘）。 */
              beadBetween(cB, joint(ed,next,P1,LAPIN,lapOf(next)), lv+0.016);
            }
          }
          /* ★2026-08-12c ① 天端の防水層（笠木が無いので、シートが天端を覆って納まる）。
             壁と同じ留め継ぎの角を使って、外へ20mmだけ出す。 */
          /* ★2026-08-12j 内側の端は**壁の内面（th）で止める**。
             立上りの板（fo＝th+6mm）と同じ位置にすると、面がぴったり重なって
             どちらを描くか毎回入れ替わり、天端の際に**ちらつく帯（謎の継ぎ目）**が出る。
             立上りの板を天端の上まで伸ばしたので、天端の板の小口はその裏に隠れる。 */
          /* ★2026-08-12k 天端の防水層は、面取りの内側（CH）から内面（th）まで。
             面取りの斜面にもシートが回るので、斜めの板を1枚足して外の面まで下ろす。 */
          strip(K0,K1,IK1,IK0, 0.012, lv+hh+0.012, nnMemColor(sp), nnMemKind(sp));
          slope(K0,lv+hh+0.012, K1,lv+hh+0.012, O1,lv+hh-CH, O0,lv+hh-CH,
                nnMemColor(sp), nnMemKind(sp));
          /* 内側の面取りにも防水層を回す（立上りの上端 → 天端の内側の端） */
          slope(IK0,lv+hh+0.012, IK1,lv+hh+0.012,
                joint(ed,next,P1,th+0.006,(next?next.th+0.006:th+0.006)), lv+hh-CH,
                joint(prev,ed,P0,(prev?prev.th+0.006:th+0.006),th+0.006), lv+hh-CH,
                nnMemColor(sp), nnMemKind(sp));
          /* ★2026-08-12a 笠木は出さない（本人の指示。現段階では不要）。 */
        }else if(e.k==='kabe'){
          /* 壁当り：段差ライン等で上位レベルの部位と辺を共有していれば、外壁高さ＝レベル差を自動採用 */
          let wallUp=2.6;
          const shared=findSharedLevel(poly, rpts[i], rpts[(i+1)%N]);
          /* ★2026-08-28c 隣の部位と辺を共有しているなら、外壁は立てない（wallUp=0）。
             その壁は「隣の部位の躯体」そのもので、すでに建っているから。
             以前は隣の高さまでの外壁をここでも立てていたので、
             隣の躯体と背中合わせに**同じ壁がもう1枚**でき、
             ・図面に何もしていないのに壁面が勝手に現れる
             ・その壁が隣の躯体（例：W造の木）を覆い隠して、下地の見た目が変わる
             という状態になっていた（本人の指摘）。
             既定の2.6mは「図面にない隣の建物の外壁」に立て替えるためのものなので、
             辺を共有する相手がいないときだけ使う。
             ★2026-08-06r 中抜き（穴）の縁が「壁当り」のときも、既定の外壁は立てない。 */
          if(shared!=null) wallUp=0;
          else if(ring.r>=0) wallUp=0;
          strip(joint(prev,ed,P0,0,0), joint(ed,next,P1,0,0),
                joint(ed,next,P1,th,(next?next.th:th)),
                joint(prev,ed,P0,(prev?prev.th:th),th),
                hh+wallUp, lv+hh+wallUp, 0xd8d0c2, 'wall');
          maxY=Math.max(maxY,lv+hh+wallUp);
          /* ★2026-08-23e 壁当りの立上り防水を「パラペットと同じ作り」にそろえた。
             本人の指摘「壁面にすると、露出アスの場合、立上り防水の仕上がりでなくなる」。
             パラペットには入れた直しが、壁当りだけ古いまま残っていた（4つ）。
             ①角から角まで（joint）にする。以前は「辺の長さぶんの板を辺の中央に置く」
               作りだったので、出隅・入隅で板どうしが届かず**防水層が切れていた**（§70と同じ）。
             ②UVを実寸に（nnUvMetric）。無いと砂の粒が辺の長さいっぱいに引き伸ばされ、
               **のっぺりした板**にしか見えない＝「仕上がりでなくなる」の主因（§80と同じ）。
             ③露出アス（シート）なら、平場への貼りかけ・その端のはみ出しアス・
               縦の継目を入れる。ここが無いと、砂付の面があっても施工した姿にならない。
             ④端末の押え金物が**壁の中に埋まっていた**（内側へ0.028＝壁の厚み0.15の内部）。
               防水層の手前に出し、上にシーリングを載せる（§68と同じ取り違え）。 */
          const fo=th+0.006;
          const fA=joint(prev,ed,P0,(prev?prev.th+0.006:fo),fo);
          const fB=joint(ed,next,P1,fo,(next?next.th+0.006:fo));
          const fdx=fB.x-fA.x, fdz=fB.y-fA.y, fL=Math.hypot(fdx,fdz);
          const fang=Math.atan2(fdz,fdx);
          if(fL>0.01){
            const fg=new THREE.PlaneGeometry(fL,hh);
            nnUvMetric(fg, fL*NN_TEX_PER_M, hh*NN_TEX_PER_M);
            const face=new THREE.Mesh(fg, nnMat(nnMemKind(sp), nnMemColor(sp), true));
            face.position.set((fA.x+fB.x)/2, lv+hh/2, (fA.y+fB.y)/2);
            face.rotation.y=-fang; nnShade(face,false,true); g.add(face);
            /* 端末＝押え金物（アルミ）＋その上のシーリング。防水層の手前に置く */
            const mo=fo+0.013;
            const mA=joint(prev,ed,P0,(prev?prev.th+0.019:mo),mo);
            const mB=joint(ed,next,P1,mo,(next?next.th+0.019:mo));
            const mL=Math.hypot(mB.x-mA.x, mB.y-mA.y), mang=Math.atan2(mB.y-mA.y, mB.x-mA.x);
            if(mL>0.01){
              const bar=new THREE.Mesh(new THREE.BoxGeometry(mL,0.05,0.014), nnMat('alum', 0xc3cad2));
              bar.position.set((mA.x+mB.x)/2, lv+hh-0.035, (mA.y+mB.y)/2);
              bar.rotation.y=-mang; nnShade(bar,true,true); g.add(bar);
              const sg=nnBeadGeomT(mL, 0.007, 'z', 0.7);
              const seal=new THREE.Mesh(sg, nnMat('seam', 0x9aa0a4));
              seal.position.set((mA.x+mB.x)/2, lv+hh-0.008, (mA.y+mB.y)/2);
              seal.rotation.y=-mang; seal.name='nnKabeSeal'; g.add(seal);
            }
          }
          /* ★露出アス（シート）の継目。平場と同じ「丸く盛り上がった黒い帯」。
             ・平場に貼りかけた端（壁から120mm）に出る横の継目
             ・シート幅の間隔で立ち上がる縦の継目（平場の継目と重ならないよう半ピッチずらす） */
          if(sp.type==='sheet' && show3dWari && hh>0.02 && fL>0.01){
            const LAPIN=th+0.12;
            const lapOf=x=>x?(x.th+0.12):LAPIN;
            beadBetween(joint(prev,ed,P0,lapOf(prev),LAPIN),
                        joint(ed,next,P1,LAPIN,lapOf(next)), lv+0.016);
            const pitch=Math.max(0.45,(sp.sheetW||1.0)-(state.lapMm||100)/1000);
            for(let dd=pitch*0.5, _n=0; dd<fL-0.06 && _n<NN_SEAM_MAX; dd+=pitch, _n++){
              if(dd<0.30 || dd>fL-0.30) continue;      /* 角のすぐ横には立てない（§75） */
              const px=fA.x+Math.cos(fang)*dd, pz=fA.y+Math.sin(fang)*dd;
              const vBot=lv+0.016, vTop=lv+hh-0.02, vLen=vTop-vBot;
              if(vLen<0.05) continue;
              const gm=nnBeadGeom(vLen, BEAD_R);
              const m=new THREE.Mesh(gm, seamMat);
              m.position.set(px, (vBot+vTop)/2, pz); g.add(m);
              beadBall(px, vBot, pz);                  /* 平場との継ぎ目 */
              /* 平場に貼りかけた部分の縦（壁から120mmぶん） */
              const q1={x:px+nrm.x*(0.004), y:pz+nrm.y*(0.004)};
              const q2={x:px+nrm.x*(LAPIN-fo), y:pz+nrm.y*(LAPIN-fo)};
              beadBetween(q1,q2, lv+0.016);
            }
          }
        }
      }
    });
  });
  window._nnKzHint=null;   /* ★下地ヒントの後片付け（2026-08-23h） */
  window._nnGkHint=null;   /* ★現況ヒントの後片付け（2026-08-28b） */
  /* ★2026-08-05d カメラの位置を決め直すのは「形が変わったとき」と「⌂全体表示」だけ。
     以前は build3D() のたびに毎回やり直していたので、
     「割り付け表示」を押しただけでカメラが初期位置に戻ってしまっていた。 */
  /* ★2026-08-11j 影の範囲を建物の大きさに合わせる。
     決め打ちのままだと、大きい屋根では影が途中で切れ、小さい屋根では影が粗くなる。 */
  if(T.sun && state.polys.length){
    const cx=(minX+maxX)/2, cz=(minZ+maxZ)/2;
    const rad=Math.max(4, Math.hypot(maxX-minX, maxZ-minZ)/2 + maxY);
    T.sun.target.position.set(cx, 0, cz);
    T.sun.position.set(cx + rad*0.75, maxY + rad*1.25, cz + rad*0.55);
    const c2=T.sun.shadow.camera;
    c2.left=-rad*1.35; c2.right=rad*1.35; c2.top=rad*1.35; c2.bottom=-rad*1.35;
    c2.near=0.5; c2.far=rad*4.5; c2.updateProjectionMatrix();
    T.sun.target.updateMatrixWorld();
    if(T.ground){ T.ground.position.set(cx, -0.002, cz); T.ground.scale.set(rad*6, rad*6, 1); }
    if(!window.nnDragBusy) T.sun.shadow.needsUpdate=true;   /* ★ドラッグ中は影を作り直さない */
  }
  /* ★2026-08-13d 全削除で空になったときも影を1回計算し直す。
     これが無いと、建物を消しても最後の影が地面に残り続ける（実際に指摘された）。 */
  else if(T.sun && !window.nnDragBusy){ T.sun.shadow.needsUpdate=true; }
  T.rev=(T.rev|0)+1;   /* 組み直したので描き直す（上の「変わったときだけ描く」の合図） */
  if(state.polys.length){
    /* ★2026-08-22b カメラを合わせ直すのは「最初の1回」と「視点ボタン（d3WantFit）」だけ。
       以前は形の外接箱が変わるたび（key!==d3FitKey）に合わせ直していたため、
       パラペット→壁当りに変える・役物を置く・削除する等の編集のたびに
       カメラが勝手に全体表示へ戻っていた（本人の指摘「カメラは絶対に動かすな」）。
       編集で建物が画面から外れたときは、視点ボタン（図面と同じ／斜めから）で戻せる。 */
    if(d3WantFit || d3FitKey===''){
      T.tx=(minX+maxX)/2; T.tz=(minZ+maxZ)/2;
      T.r=Math.max(maxX-minX, maxZ-minZ, maxY*1.6, 4)*1.5;   /* 目安。下で実測して合わせ直す */
      /* ★2026-08-21a 目安の式（大きさ×1.5）は画角も画面の縦横比もツールバーの厚みも
         見ていないので、よこ向きのように「横に広くて縦が短い」画面だと下が切れていた。
         実際に立体を画面へ投影して、はみ出さない距離まで下げる。 */
      if(window.nnD3FitR) nnD3FitR();
      d3FitKey='done'; d3WantFit=false;
    }
  }
  /* ★2026-08-24j 継目が多い（大きな図面）ときは、同じ形をまとめて1回で描く */
  try{ nnInstanceBeads(g); }catch(_){}
  dirty3d=false;
}

/* ★2026-08-24ae 下絵の読み込みを軽くした。
   下絵は長辺1600pxに縮めてから保存するのに、その前に
   「ファイル全体を文字（base64）にする」やり方だった。
   いまのスマホ・ドローンの写真は10MBを超えるので、その文字だけで記憶を大きく食う。
   ブラウザが直に読む道（createImageBitmap）を先に使い、使えない端末では
   一時のURLを使う（どちらも文字を作らない）。保存する中身は今までと同じ。 */
function uLoadFile(file){
  if(!file)return;
  const legacy=()=>{
    const u=URL.createObjectURL(file);
    const im=new Image();
    im.onload=()=>{ uLoadSource(im, im.width, im.height, false); try{URL.revokeObjectURL(u);}catch(_){} };
    im.onerror=()=>{ try{URL.revokeObjectURL(u);}catch(_){} toast('この画像は読み込めませんでした'); };
    im.src=u;
  };
  if(window.createImageBitmap){
    let done=false;
    try{ createImageBitmap(file).then(bm=>{ done=true; uLoadSource(bm, bm.width, bm.height, true); })
                                .catch(()=>{ if(!done) legacy(); });
      return;
    }catch(_){ /* 下の道へ */ }
  }
  legacy();
}
/* Ctrl+V での貼り付けにも対応 */
document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items; if(!items)return;
  for(const it of items){
    if(it.type.startsWith('image/')){
      uLoadFile(it.getAsFile());
      e.preventDefault(); return;
    }
  }
});
/* 文字（データURL）から読む道は残してある（ほかから呼ばれても動くように） */
function uLoadImage(dataUrl){
  const img=new Image();
  img.onload=()=>uLoadSource(img, img.width, img.height, false);
  img.onerror=()=>toast('この画像は読み込めませんでした');
  img.src=dataUrl;
}
function uLoadSource(src, sw, sh, close){
  /* 保存容量対策：長辺1600pxに縮小してJPEG化 */
  const k=Math.min(1,1600/Math.max(sw,sh));
  const c=document.createElement('canvas');
  c.width=Math.round(sw*k); c.height=Math.round(sh*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  if(close){ try{ src.close(); }catch(_){} }
  const jpg=c.toDataURL('image/jpeg',0.85);
  uImg=new Image();
  uImg.onload=()=>{
    /* 初期配置：画面中央付近・幅40マスで仮表示 */
    state.underlay={ img:jpg, x:Math.round(px2gx(60)), y:Math.round(px2gy(60)),
      mPerPx:(40*state.scaleM)/uImg.width, op:0.6, rot:0, calibrated:false };
    document.getElementById('uop').value=60; document.getElementById('uopv').textContent='60%';
    document.getElementById('urotin').value=0;
    saveState(); uStatus(); draw();
    toast('下絵を読み込みました。次に「⚖ スケール合わせ」で寸法を合わせてください');
  };
  uImg.src=jpg;
}

function uCalibStart(){
  if(!state.underlay){ toast('先に下絵画像を読み込んでください'); return; }

  document.getElementById('ucalib').classList.add('on');
  calib={p1:null,p2:null};

function uCalibApply(){
  const R=+document.getElementById('calibm').value;
  if(!R||R<=0||!calib||!calib.p1||!calib.p2){ toast('距離(m)を入力してください'); return; }
  const u=state.underlay;
  const Dcells=Math.hypot(calib.p2.x-calib.p1.x, calib.p2.y-calib.p1.y); /* クリック2点の距離（マス） */
  if(Dcells<0.05){ toast('2点が近すぎます'); return; }
  /* 画像の見た目は一切変えず、方眼の縮尺（1マス＝何m）の側を合わせる */
  const newS=R/Dcells;
  u.mPerPx*=newS/state.scaleM;   /* 画面上の画像サイズを不変に保つ補正 */
  state.scaleM=newS;
  u.calibrated=true;
  scaleselCustom(newS);
  uCalibCancel(); saveState(); renderPolyList(); uStatus(); draw();
  toast(`縮尺を合わせました：1マス＝${fmtScale(newS)}m（画像はそのまま、寸法だけ実寸になります）`);
}
function fmtScale(s){ return Math.abs(s-Math.round(s*100)/100)<1e-9 ? String(Math.round(s*100)/100) : s.toFixed(3); }
function scaleselCustom(s){
  const selEl=document.getElementById('scalesel');
  let opt=document.getElementById('sc_custom');
  if(!opt){ opt=document.createElement('option'); opt.id='sc_custom'; selEl.appendChild(opt); }
  opt.value=s; opt.textContent=`1マス＝${fmtScale(s)}m（実寸合わせ）`;
  selEl.value=String(s);
}

(function(){
  const B=[
    ['d3_zin',  ()=>d3Zoom(1/1.3), ()=>d3Zoom(1/1.012)],
    ['d3_zout', ()=>d3Zoom(1.3),   ()=>d3Zoom(1.012)],
    ['d3_tup',  ()=>d3Tilt(-12),   ()=>d3Tilt(-0.5)],
    ['d3_tdn',  ()=>d3Tilt(12),    ()=>d3Tilt(0.5)],
    ['d3_rl',   ()=>d3Rot(-45),    ()=>d3Rot(-0.9)],
    ['d3_rr',   ()=>d3Rot(45),     ()=>d3Rot(0.9)]
  ];
  let raf=null, step=null, held=false, timer=null, armed=null;
  function frame(){ if(!step){ raf=null; return; } step(); raf=requestAnimationFrame(frame); }
  function begin(fn){ held=true; step=fn; if(!raf) raf=requestAnimationFrame(frame); }
  function stop(){ step=null; if(raf){ cancelAnimationFrame(raf); raf=null; } }
  B.forEach(([id,tap,hold])=>{
    const b=document.getElementById(id); if(!b)return;
    b.addEventListener('pointerdown',e=>{
      e.preventDefault(); armed=id; held=false;
      if(timer)clearTimeout(timer);
      timer=setTimeout(()=>begin(hold),250);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{
      if(armed!==id)return;
      armed=null;
      if(timer){ clearTimeout(timer); timer=null; }
      const w=held; held=false; stop();
      if(!w) tap();
    }));
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
})();

   別の取得処理を走らせることで、肝心の画面移動と処理を取り合っていた。 */
function buildNav(){
  const n=document.getElementById('nav');
  n.innerHTML=NAV.map(([k,l])=>{
    const suf=(k===NAV_ACTIVE)?'_on':'';
    return `<div class="ni ${k===NAV_ACTIVE?'on':''}" onclick="navGo('${k}','${l}')">

                 else{this.outerHTML=ICONS['${k}']||'▫️';}"></span><span>${l}</span></div>`;
  }).join('');
  /* あふれ時：アクティブなボタンを中央に
     ★位置の計測（scrollWidth や getBoundingClientRect）は「画面をいったん組み上げる」
       処理なので、ここで行うと画面が出るまでの待ち時間が伸びる。
       画面を出したあと（次の描画のタイミング）にまわす。 */
  addEventListener('load',()=>{
    const on=n.querySelector('.ni.on');
    if(on && n.scrollWidth>n.clientWidth){
      const d=on.getBoundingClientRect().left-n.getBoundingClientRect().left;
      n.scrollLeft+=d-(n.clientWidth-on.offsetWidth)/2;
    }
  },{once:true});
}

/* ---------- タップ演出（shiyo_toroku基準：発光＋タップ音） ---------- */
(function(){
  /* ---------- ゲーム風タップ音（Web Audio合成・音源ファイル不要） ---------- */
  let AC=null;
  function ctx(){
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  function tapSound(){
    try{
      const c=ctx(), t=c.currentTime;
      // やわらかい水滴風の「ぽん」：低めのサイン波2音（耳に優しい音量）
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(523,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.06,t+0.010);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.15);
      // 軽く上に抜ける倍音
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(784,t);
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.03,t+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
      o2.connect(g2).connect(c.destination);
      o2.start(t+0.005); o2.stop(t+0.12);
    }catch(e){}
  }

  /* ---------- タッチ発光 ---------- */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    /* ★2026-08-13j パソコンの表示倍率（zoom）で割ること。
       clientX/Y は倍率を**かけた後**のpx、style.left/top は倍率を**かける前**のpx。
       割らないと、大きいモニターほど発光が右下の見当違いな場所に出る（§61の落とし穴）。 */
    const _z=window.nnPZ||1;
    el.style.left=(x/_z)+'px'; el.style.top=(y/_z)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 600);
  }

  /* ---------- イベント委譲 ----------
     発光＝画面のどこを触っても出す（触った場所のフィードバック）
     音　＝押せる要素（ボタン・ナビ・チップ・行）に当たったときだけ鳴らす */
  const PRESSABLE='button, .chip>button, .mk, .mrow, .tabs button, #viewtabs button, .btn-ok, .btn-ghost, .sortbtn, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    /* ★下部ナビは専用の音（nav_move.wav）を鳴らすので、ここでは鳴らさない。
       [onclick] にナビも含まれてしまい、1回のタップで2種類の音が重なって
       「ココンコン」と聞こえていた原因。 */
    const tc=(e.target&&e.target.closest)?e.target:null;
    const hit=(!tc||tc.closest('nav .ni'))?null:tc.closest(PRESSABLE);
    if(hit && !hit.disabled && !hit.classList.contains('soon')){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();
</script>

/* ★見た目は小さくても、指で反応する範囲は外側に7px広げる。
   押しそこねたタップがキャンバスに抜けて、変な場所に打点されていた。 */
html[data-nnphone="1"] .tbtn{position:relative;}
html[data-nnphone="1"] .tbtn::after{content:''; position:absolute; inset:-7px;}
/* ★2026-08-03e 戻る・進む・削除は小さくて押しづらいので、

   （左右に広げすぎると隣のボタンの範囲を奪うので、上下を厚くするのが安全） */

html[data-nnphone="1"] #tl_redo{min-width:46px; padding:7px 8px; font-size:15px;}
html[data-nnphone="1"] #tl_del{min-width:56px; padding:7px 8px;}

html[data-nnphone="1"] .tbtn.hasimg{min-width:46px; padding:5px 8px;}

html:not([data-nnphone="1"]) .tbtn img.tbi{height:19px; width:auto; display:block;}
/* ★1マスの選択：iPhoneの自動拡大を避けるため、プルダウンをやめてボタン＋小さな一覧にする

html[data-nnphone="1"] #tl_redo::after,

   ツールバーは1行に入りきらず、右端の「サンプル形状」「全削除」が
   見切れて押せなかった（＝サンプルが消せない原因）。

     ピンチ（2本指）での拡大縮小は今までどおり使える。

   ============================================================ */
html{touch-action:manipulation;
  /* ★2026-07-28 iPhoneの「文字の自動拡大」を止める。
     iOS Safari は、幅の広い枠に入った文章の文字を勝手に大きくする。

  -webkit-text-size-adjust:100%; text-size-adjust:100%;}

   16px以上にすれば拡大しない。見た目を詰めたいときは余white（padding）で調整する。
   ※ピンチ（2本指）での拡大は今までどおり使えます。 */
input:not([type=checkbox]):not([type=radio]):not([type=range]),
textarea{font-size:16px !important;}
/* ★2026-08-06m <select>（プルダウン）はこの指定から外した。
   iPhoneで画面が勝手に拡大するのは「キーボードが出る入力欄」だけで、
   プルダウンはピッカーが出るだけなので拡大しない。
   16pxを強制していたせいで、ページ側の指定（12.5px等）が全部打ち消され、
   絞り込みのプルダウンだけが一覧の見出しより大きく表示されていた。 */

<script>
/* ページ移動を通信ゼロで一瞬にする（サービスワーカーで全ページを端末に常駐させる） */
/* ============ 版チェック（2026-07-28） ============
   端末には速さのためページを保存しているので、こちらで直しても
   古いものが出続けることがある。そこで ver.txt（数バイト）だけを
   毎回見に行き、公開版と違っていたら保存分を捨てて1回だけ読み直す。
   ★公開のたびに ver.txt と、下の NN_VER を同じ文字に更新すること。 */
const NN_VER='2026-08-29g';
/* ============ 表示にかかった時間の記録（原因調査用・2026-07-28） ============
   スマホの実機でどこに時間がかかっているかを数字で出す。
   ・net  ＝ページを要求してから最初の返事が来るまで（通信の待ち）
   ・recv ＝中身を受け取り終わるまで
   ・build＝受け取ってから組み立て終わるまで（解析・JS実行）
   ・paint＝画面に中身が出たとき
   結果はホーム画面の左上に出る。原因が分かったらこの仕組みごと外す。 */
addEventListener('load',()=>{setTimeout(()=>{
  try{
    const n=performance.getEntriesByType('navigation')[0]; if(!n)return;
    const fcp=performance.getEntriesByType('paint').filter(p=>p.name==='first-contentful-paint')[0];
    const rs=performance.getEntriesByType('resource');
    let slow=null, rkb=0, fontMs=0, fontN=0;
    rs.forEach(r=>{ rkb+=(r.transferSize||0);
      if(!slow||r.duration>slow.duration)slow=r;
      if(/fonts\.(googleapis|gstatic)/.test(r.name)){fontN++; fontMs=Math.max(fontMs, Math.round(r.responseEnd));}});
    const rec={p:(location.pathname.split('/').pop()||'index').replace('.html','').slice(0,8),
      net:Math.round(n.responseStart), recv:Math.round(n.responseEnd),
      build:Math.round(n.domContentLoadedEventEnd), paint:fcp?Math.round(fcp.startTime):-1,
      load:Math.round(n.loadEventEnd), kb:Math.round((n.transferSize||0)/1024),
      res:rs.length, rkb:Math.round(rkb/1024), fn:fontN, fms:fontMs,
      sl:slow?((slow.name.split('/').pop()||'').slice(0,14)+':'+Math.round(slow.duration)):''};
    const a=JSON.parse(sessionStorage.getItem('nnPerf')||'[]'); a.push(rec);
    sessionStorage.setItem('nnPerf',JSON.stringify(a.slice(-7)));
  }catch(_){}
},400);});
const NN_PAGES=['./index.html','./kirokucho_demo.html','./zumen_sekisan.html','./genba_map_v36.html','./hacchu.html',
  './kokkosho.html','./camera.html','./library.html','./shiyo_toroku.html','./zairyo_toroku.html','./yougo.html','./common.css'];
window.nnVerNow=NN_VER;
(async function(){
  try{
    const r=await fetch('./ver.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const v=(await r.text()).trim();
    window.nnVerNew=v;
    if(!v || v===NN_VER)return;
    /* ★2026-07-28 修正：以前は保存分を消して読み直すだけだったが、
       Safari自身が持っている一時保存（HTTPキャッシュ）は消えないため、
       読み直しても古いページが出続けて更新が止まることがあった。
       全ページを cache:'reload' で取り直してから読み直す。 */
    const n=parseInt(sessionStorage.getItem('nnUpdN_'+v)||'0',10);
    if(n>=2)return;                                   /* 失敗が続いたら止める安全弁 */
    sessionStorage.setItem('nnUpdN_'+v,String(n+1));
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    await Promise.all(NN_PAGES.map(u=>fetch(u,{cache:'reload'}).catch(()=>{})));
    location.reload();
  }catch(_){}
})();

<script>
/* ★2026-07-28：更新が端末に届かない問題への対策
   ・毎回「新しい版が出ていないか」を確認する（r.update()）
   ・新しい版に切り替わったら、その場で1回だけ自動で読み込み直す
     （＝「再読み込み2回」が不要になり、直したことが必ず反映される） */
/* ★2026-07-28 検証：サービスワーカーを一時的に止める
   ホーム(37KB)も現場記録帳(300KB)も、どちらもタップから約0.9秒。
   中身の重さが10倍近く違うのに時間が同じ＝ページの組み立てではなく、
   移動のたびにかかる「決まった待ち時間」がある、ということ。
   iPhoneのSafariでは、この保存の仕組み（サービスワーカー）が
   眠っていると、移動のたびに起こす時間が数百ミリ秒かかることが知られている。
   → いったん止めて、これが原因かを確かめる。
   NN_USE_SW を true に戻せば、オフライン対応ごと元に戻せる。 */
const NN_USE_SW=false;
if('serviceWorker' in navigator){
  if(NN_USE_SW){
    let nnReloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(nnReloaded)return; nnReloaded=true; location.reload();
    });
    addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(r=>{
        try{r.update();}catch(_){}
        if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage('nn-precache');
      }).catch(()=>{});
    });
  }else{
    /* すでに入っている分を取り除き、保存分も消す（1回だけ読み直す） */
    addEventListener('load',async()=>{
      try{
        const rs=await navigator.serviceWorker.getRegistrations();
        if(rs.length){
          await Promise.all(rs.map(r=>r.unregister()));
          if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));}
          if(!sessionStorage.getItem('nnSwOff')){ sessionStorage.setItem('nnSwOff','1'); location.reload(); }
        }
      }catch(_){}
    });
  }
}
</script>
<script>
/* ============ ナビの操作音（2026-07-28 作り直し） ============
   ★以前は <audio> を2個ずつ用意して音源ファイル(nav_move.wav)を
     読ませていたが、iPhoneでは音声部品の準備が重く、しかも
     いつ終わるか読めないため、画面が出るまでの待ち時間に影響していた。
     → 音源ファイルをやめ、その場で音を合成する方式（Web Audio）に変更。
       ファイル読み込みゼロ・部品ゼロ・音は今までと同じ「やわらかい1音」。
   ============================================================ */
(function(){
  /* ★2026-07-28 音が出たり出なかったりした原因
     ①音の装置(AudioContext)を「ナビを最初に押したとき」に作っていた。
       iPhoneでは作った直後は停止状態で、動き出すまでに少し時間がかかるため、
       その1回目の音が鳴らないことがあった。
     ②画面移動が0.09秒後に始まるので、音が長いと途中で切れていた。
     → 装置は「画面のどこかを最初に触った時点」で作って動かしておく。
       音は0.07秒に短くして、移動が始まる前に鳴り終わるようにする。 */
  let AC=null, last=0;
  function make(){
    if(AC)return AC;
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    try{ AC=new C(); }catch(_){ return null; }
    /* 無音を1粒だけ鳴らして、iPhoneの音の仕組みを起こしておく */
    try{ const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
         s.buffer=b; s.connect(AC.destination); s.start(0); }catch(_){}
    return AC;
  }
  /* ★2026-08-26b 起こしても動かないままの装置がある（電話・他アプリへの切り替えで
     iPhoneが音の仕組みごと止めることがあり、resume が効かない）。
     1秒たっても動かなければ、利用者の操作の中で装置を作り直す
     （作り直しは操作の中なら必ず動く＝§89「操作そのものの中で呼ぶ」と同じ決まり）。 */
  let deadSince=0;
  function ensureRunning(){
    let c=make(); if(!c)return null;
    if(c.state!=='running'){
      try{ c.resume(); }catch(_){}
      if(!deadSince) deadSince=Date.now();
      else if(Date.now()-deadSince>1000){
        try{ c.close(); }catch(_){}
        AC=null; deadSince=0; c=make();
        if(c && c.state!=='running'){ try{ c.resume(); }catch(_){} }
      }
    } else deadSince=0;
    return c;
  }
  function unlock(){ ensureRunning(); }
  addEventListener('pointerdown',unlock,{passive:true,capture:true});
  addEventListener('touchstart',unlock,{passive:true,capture:true});
  /* 画面が戻ってきたときは、止まっている音の装置を起こし直す
     （iPhoneは他のアプリに切り替えると止めることがある） */
  function wake(){ const c=AC; if(c && c.state!=='running'){ try{c.resume();}catch(_){} } }
  addEventListener('pageshow', wake);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) wake(); });

  /* 実際に音を出す部分。ここは「装置が動いている」ときだけ呼ぶ */
  function beep(c){
    const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t);        /* ラの音・単純でやわらかい */
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.38,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.07);
  }

  /* ★2026-07-31 「鳴ったり鳴らなかったり」の直し方
     iPhoneは、ページを開いた直後の音の装置が「止まった状態」で始まる。
     動き出す（resume）のは少し後なので、押してすぐ画面が変わると
     音が鳴る前に前のページが消えてしまう＝無音になっていた。
     そこで
       ・鳴らせたかどうかを返す（true＝すぐ鳴った）
       ・すぐ鳴らせなかったときは、動き出したら鳴らす（nnSoundReady で待てる）
     ようにして、ナビ側が「音が出るのを待ってから画面を移る」ようにした。 */
  window.nnSoundReady=null;
  window.nnMoveSound=function(){
    const now=Date.now(); if(now-last<160)return true; last=now;   /* 連続再生を抑える */
    try{
      const c=ensureRunning(); if(!c)return true;
      if(c.state==='running'){ beep(c); return true; }
      /* まだ動いていない：起こしてから鳴らす。ナビ側はこれを待てる */
      window.nnSoundReady=new Promise(function(res){
        let done=false;
        const fin=function(){ if(done)return; done=true; res(); };
        /* ★2026-08-26b 「起きてから鳴らす」だと、起きるのが遅い回は画面が変わって
           鳴らずじまいだった。止まった装置への予約は動き出した瞬間に鳴るので、
           先に鳴る予約だけ入れておく（＝鳴ったり鳴らなかったりの残りを解消）。 */
        try{ beep(c); }catch(_){}
        try{ const p=c.resume(); if(p&&p.then) p.then(fin, fin); else fin(); }catch(_){ fin(); }
        setTimeout(fin, 120);      /* 起きなくても待たせすぎない */
      });
      return false;
    }catch(_){ return true; }
  };
})();
</script>
<script>
/* ============ ナビ：指を触れたまま移動できる操作（2026-07-28 改） ============
   ・指を置いた瞬間にアイコンが光って音が鳴る
   ・そのまま 0.09秒 指が止まっていれば、離すのを待たずに移動する（＝速い）
   ・押したまま横へなぞると指の下のアイコンが反応し、離した先へ移動する
   ・アイコンの外で離せば移動しない（やめられる）
   ============================================================ */
(function(){
  const nav=document.getElementById('nav')||document.querySelector('nav');
  if(!nav)return;
  let dragging=false, cur=null;
  const itemAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('nav .ni'):null; };
  let lastSnd=0;
  function focus(ni){
    if(ni===cur)return;
    if(!ni)return;                     /* アイコンの隙間に指がかかっても、直前の選択を保つ
                                          （指のわずかな揺れで音が連発するのを防ぐ） */
    if(cur)cur.classList.remove('press');
    cur=ni; cur.classList.add('press');
    /* 音を鳴らす。すぐ鳴らせなかったときは、移動を少しだけ待つ（下の go を参照） */
    sndNow=true;
    if(window.nnMoveSound)try{ sndNow=(nnMoveSound()!==false); }catch(_){}
    /* ★先読みの fetch は削除（2026-07-28）。移動処理と取り合って遅くなっていた。 */
  }
  /* ★ここが「遅い」の正体だった（2026-07-28 画面録画の実測で判明）
     以前は「指を離したとき」に初めて移動していた。画面録画を1コマずつ調べると、
     アイコンが光ってから画面が変わるまで約0.9秒、その間まったく何も起きていない。
     ＝ページの読み込みが遅いのではなく、指を離すまで移動を始めていなかった。
     そこで「指を置いて 0.09秒たっても動かさなければ、離すのを待たずに移動する」
     方式にした。なぞって選び直したい場合（指を動かした場合）は今までどおり、
     指を離した先のアイコンへ移動する。 */
  const HOLD_MS=90;          /* この時間だけ指が止まっていたら、離すのを待たずに移動 */
  const MOVE_PX=10;          /* この距離より動いたら「なぞり操作」とみなす */
  let goTm=0, downPt=null, gone=false;
  let sndNow=true;
  function go(t){
    if(gone)return;
    if(!t||t.classList.contains('on'))return;
    const m=(t.getAttribute('onclick')||'').match(/navGo\('([^']*)'\s*,\s*'([^']*)'\)/);
    if(!(m&&typeof navGo==='function'))return;
    gone=true;
    /* ★音がすぐ鳴ったときは今までどおり即移動（速さは変えない）。
       鳴らなかったときだけ、音が出るのを最大0.16秒待ってから移動する。 */
    if(sndNow || !window.nnSoundReady){ navGo(m[1],m[2]); return; }
    let moved=false;
    const jump=function(){ if(moved)return; moved=true; navGo(m[1],m[2]); };
    try{ window.nnSoundReady.then(function(){ setTimeout(jump, 30); }); }catch(_){}
    setTimeout(jump, 160);
  }
  function cancelHold(){ if(goTm){clearTimeout(goTm); goTm=0;} }
  nav.addEventListener('pointerdown',e=>{
    const ni=e.target.closest&&e.target.closest('.ni'); if(!ni)return;
    dragging=true; cur=null; gone=false; downPt=[e.clientX,e.clientY]; focus(ni);
    try{nav.setPointerCapture(e.pointerId);}catch(_){}
    cancelHold();
    goTm=setTimeout(()=>{ goTm=0; go(cur); }, HOLD_MS);
  });
  nav.addEventListener('pointermove',e=>{
    if(!dragging)return;
    if(downPt && Math.abs(e.clientX-downPt[0])+Math.abs(e.clientY-downPt[1])>MOVE_PX) cancelHold();
    focus(itemAt(e.clientX,e.clientY));
  });
  function finish(e){
    if(!dragging)return;
    dragging=false; cancelHold();
    const t=cur; if(cur){cur.classList.remove('press'); cur=null;}
    go(t);
  }
  nav.addEventListener('pointerup',finish);
  nav.addEventListener('pointercancel',()=>{dragging=false; cancelHold(); if(cur){cur.classList.remove('press'); cur=null;}});
  /* 上の処理で移動するので、通常のクリックは止める（二重に移動しないように） */
  nav.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); },true);
})();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<script id="nn-phonemark">
/* ★端末そのものの幅を見て <html> に data-nnphone="1" を付ける
   （縮小表示のページでは CSS の画面幅が常に980pxになり、画面幅では判定できない） */
(function(){try{
  var d = Math.min(screen.width||0, screen.height||0);
  if(d && d < 700) document.documentElement.setAttribute('data-nnphone','1');
}catch(e){}})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="納まりナビ">
<link rel="manifest" href="./manifest.json">
<title>納まりナビ – 図面・積算</title>
<link rel="stylesheet" href="common.css">
<style>
/* ============================================================
   納まりナビ 図面作成・積算 デモ
   ------------------------------------------------------------
   方眼紙に辺を結んで屋根形状を作成
   → 辺ごとに立上り高さ・天端幅
   → 登録仕様の選定で数量・金額を自動算出
   → 3D反映／シート割付図・巻数算出
   単価・歩掛・シート規格はすべてデモ用の概算値です。
   ============================================================ */
:root{
  /* 共通8色は common.css（--green-deep 等）。ここはこのページ固有の分だけ */
  --green-hi:#48c274; --green-edge:#124a28;
  --yellow:#ffd94d; --yellow-deep:#f0b400;
  --stroke-g: 0 1px 1px rgba(18,74,40,.55);
  --profit:#0a6bd6; --sel:#e8760a;
  --radius:10px; font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
}
header{padding-top:calc(5px + env(safe-area-inset-top)) !important;}
/* 横画面（スマホ）：帯を隠して作図面積を広げる（他ページと同じ振る舞い） */
@media (orientation:landscape) and (max-height:500px){
  header{display:none !important;}
}
header{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
    linear-gradient(180deg, var(--green-hi), var(--green) 55%, var(--green-deep));
  color:#fff; display:flex; align-items:center; gap:10px; padding:5px 13px; flex:none;
  border-bottom:2px solid var(--green-edge);
  box-shadow:0 2px 0 rgba(0,0,0,.08);
  position:relative; z-index:20;
}
header .hicon{font-size:19px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));}
header h1{font-size:17px; font-weight:900; letter-spacing:.04em; text-shadow:var(--stroke-g);}
header .demo-note{margin-left:auto; font-size:11.5px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.35); border-radius:6px; padding:4px 10px; font-weight:700; white-space:nowrap;}
/* タブ */
#viewtabs{display:flex; gap:8px; padding:10px 18px 0; background:var(--paper); flex:none;}
#viewtabs button{border:1px solid var(--line); background:#e3e7e0; color:var(--ink-sub); border-radius:9px 9px 0 0;
  padding:9px 22px; font-size:14.5px; font-weight:800; cursor:pointer; letter-spacing:.03em;}
#viewtabs button.on{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}
#viewtabs button:not(.on):hover{background:#d7dcd2;}
/* 本体 */
main{flex:1; display:flex; min-height:0; border-top:2px solid var(--green-deep);}
#canvaswrap{flex:1; min-width:0; position:relative; background:#fbfcf9;}
#cv{display:block; width:100%; height:100%; cursor:crosshair; touch-action:none;}
#three-wrap{display:none; position:absolute; inset:0; background:#e8ece6;}
#three-wrap.on{display:block;}
#three-hint{position:absolute; left:12px; bottom:12px; background:rgba(30,42,36,.85); color:#fff; font-size:12px; font-weight:700; border-radius:8px; padding:7px 12px; z-index:5; line-height:1.6;}
/* ツールバー（キャンバス上部） */
#toolbar{
  position:absolute; top:10px; left:10px; right:10px; z-index:6; display:flex; gap:8px; align-items:center; flex-wrap:wrap; pointer-events:none;
}
#toolbar>*{pointer-events:auto;}
.tbtn{border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 14px; font-size:13.5px; font-weight:800; cursor:pointer; color:var(--ink); box-shadow:0 2px 6px rgba(0,0,0,.08);}
.tbtn.on{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}
.tbtn.warn{color:#b0392f;}
.tsel{border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 8px; font-size:13px; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.08);}
#hint{
  position:absolute; left:12px; bottom:12px; z-index:6; background:rgba(30,42,36,.85); color:#fff;
  font-size:12.5px; font-weight:700; border-radius:8px; padding:7px 12px; max-width:70%; line-height:1.6;
}
/* 右サイドバー */
#side{flex:0 0 372px; max-width:44%; overflow-y:auto; background:#f7f8f5; border-left:1px solid var(--line); padding:12px 12px 90px;}
.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin-bottom:10px;}
.panel h4{font-size:14px; font-weight:800; color:var(--green-deep); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.panel h4 .r{margin-left:auto; font-size:11.5px; color:var(--ink-sub); font-weight:700;}
/* 部位リスト */
.brow{display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:7px; cursor:pointer; font-size:13.5px; font-weight:700;}
.brow:hover{background:var(--green-lite);}
.brow.on{background:var(--green-lite); box-shadow:inset 0 0 0 2px var(--green);}
.brow .nm{flex:1; border:0; background:transparent; font:inherit; font-weight:800; min-width:0;}
.brow .ar{font-size:12px; color:var(--ink-sub); white-space:nowrap;}
.brow .dl{color:#b0392f; font-weight:800; cursor:pointer; padding:0 4px;}
.addb{width:100%; margin-top:6px; border:1px dashed var(--green); background:#fff; color:var(--green-deep); border-radius:8px; padding:8px; font-weight:800; font-size:13px; cursor:pointer;}
.addb:hover{background:var(--green-lite);}
/* 辺エディタ */
.erow{display:flex; align-items:center; gap:8px; margin:7px 0; font-size:13px; font-weight:700;}
.erow label{flex:0 0 108px; color:var(--ink-sub);}
.erow input[type=number]{width:90px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; text-align:right;}
.erow .u{color:var(--ink-sub); font-size:12px;}
.ebtn{border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 10px; font-size:12px; font-weight:800; cursor:pointer;}
.ebtn:hover{background:var(--green-lite);}
.nosel{font-size:12.5px; color:var(--ink-sub); font-weight:700; padding:4px 2px; line-height:1.7;}
/* 仕様 */
#specsel{width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; font-weight:700;}
.specinfo{margin-top:7px; font-size:12px; color:var(--ink-sub); font-weight:700; line-height:1.7;}
.specinfo b{color:var(--ink);}
.swatch{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:4px; border:1px solid rgba(0,0,0,.2);}
/* 積算表 */
table.qt{width:100%; border-collapse:collapse; font-size:13px;}
table.qt th{background:var(--green-lite); color:var(--green-deep); font-size:12px; padding:5px 7px; text-align:left; border:1px solid var(--line);}
table.qt td{padding:5px 7px; border:1px solid #e6e9e3; font-variant-numeric:tabular-nums;}
table.qt td.num{text-align:right; font-weight:700;}
.total{margin-top:8px; background:var(--green-deep); color:#fff; border-radius:8px; padding:9px 12px; display:flex; align-items:baseline;}
.total .l{font-size:13px; font-weight:800;}
.total .v{margin-left:auto; font-size:20px; font-weight:800; letter-spacing:.02em;}
.matline{font-size:12.5px; font-weight:700; margin:3px 0; display:flex;}
.matline .v{margin-left:auto; font-weight:800; color:var(--ink);}
.note{font-size:11px; color:var(--ink-sub); margin-top:7px; line-height:1.6;}
/* 割付コントロール */
.wrow{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; font-weight:700;}
.wrow .seg{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden;}
.wrow .seg button{border:0; background:#fff; padding:6px 14px; font-size:12.5px; font-weight:800; cursor:pointer; color:var(--ink-sub);}
.wrow .seg button.on{background:var(--green-deep); color:#fff;}
.wrow input[type=number]{width:80px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; text-align:right;}
/* トースト */
#toast{position:fixed; left:50%; bottom:86px; transform:translateX(-50%); background:#1e2a24; color:#fff; padding:10px 20px; border-radius:9px; font-size:13.5px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s; z-index:900; max-width:90vw;}
#toast.show{opacity:.95;}
/* 下絵（航空写真トレース） */
.guide{background:var(--green-lite); border:1px solid #cfe0d5; border-radius:8px; padding:8px 10px; font-size:11.8px; line-height:1.75; color:#2b4536; font-weight:700; margin-bottom:8px;}
.guide b{color:var(--green-deep);}
.ubtns{display:flex; gap:6px; flex-wrap:wrap;}
.ubtn{border:1px solid var(--line); background:#fff; border-radius:7px; padding:7px 11px; font-size:12.5px; font-weight:800; cursor:pointer;}
.ubtn:hover{background:var(--green-lite);}
.ubtn.on{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}
.ubtn.danger{color:#b0392f; border-color:#e4b6b0;}
.ubtn.danger:hover{background:#fdf3f2;}
.urow{display:flex; align-items:center; gap:8px; margin:8px 0 2px; font-size:12.5px; font-weight:700;}
.urow input[type=range]{flex:1; accent-color:var(--green-deep);}
.ustat{font-size:11.5px; color:var(--ink-sub); font-weight:700; margin-top:5px; line-height:1.6;}
.ustat b{color:var(--profit);}
#calibbox{position:absolute; z-index:20; background:#fff; border:2px solid var(--sel); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.25); padding:12px 14px; display:none; width:280px;}
#calibbox h5{font-size:13px; font-weight:800; color:var(--sel); margin-bottom:7px;}
#calibbox input{width:110px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; text-align:right; font-size:14px; font-weight:700;}
#calibbox .cb{border:0; border-radius:7px; padding:7px 14px; font-weight:800; cursor:pointer; font-size:12.5px;}
/* 辺種別チップ */
.kindsel{display:flex; gap:4px; margin:6px 0;}
.kindsel button{flex:1; border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 2px; font-size:11.5px; font-weight:800; cursor:pointer; color:var(--ink-sub); line-height:1.3;}
.kindsel button.on{border-width:2px;}
.kindsel button.k-para.on{background:#e3ecfb; color:#1a5dc8; border-color:#1a5dc8;}
.kindsel button.k-kabe.on{background:#fdeedd; color:#a05a10; border-color:#a05a10;}
.kindsel button.k-free.on{background:#eef0ea; color:#5c6662; border-color:#8a978c;}
.kindnote{font-size:11px; color:var(--ink-sub); line-height:1.6; font-weight:700; margin-top:4px;}
.lvin{width:64px !important; padding:3px 5px !important; border:1px solid var(--line); border-radius:6px; font-size:12px; text-align:right; font-weight:700;}
.lvlbl{font-size:10.5px; color:var(--ink-sub); font-weight:800; white-space:nowrap;}
/* ★帯の中のタブと？ボタン（2026-08-02） */
#hdTabs{display:flex; gap:4px; margin-left:auto;}
#hdTabs button{
  border:1.5px solid var(--green-edge,#124a28); border-radius:8px; cursor:pointer;
  background:linear-gradient(180deg,#ffffff,#e8f5ec); color:var(--green-deep,#1c6b3c);
  font-family:inherit; font-size:12.5px; font-weight:800; padding:7px 12px; white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 var(--green-edge,#124a28);}
#hdTabs button.on{
  background:linear-gradient(180deg,var(--yellow,#ffd94d),var(--yellow-deep,#f0b400));
  color:#4d3a00; border-color:#a87f00; box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #7d5f00;}
#hdTabs button:active{transform:translateY(1px);}
#hdHelp{
  border:1.5px solid var(--green-edge,#124a28); border-radius:8px; cursor:pointer;
  background:linear-gradient(180deg,#ffffff,#e8f5ec); color:var(--green-deep,#1c6b3c);
  font-family:inherit; font-size:12.5px; font-weight:900; padding:7px 11px; white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 var(--green-edge,#124a28);}
#hdHelp:active{transform:translateY(1px);}
#hdHelp .ht{margin-left:3px; font-weight:800;}

/* ★3Dの操作パッド */
/* ★2026-08-05d 下が見切れないよう、上下の位置を決めて中で送れるようにする。
   右下の ▲（ナビを出すボタン）にも重ならないよう bottom を空ける。 */
#d3pad{position:absolute; right:8px; top:52px; z-index:7;
  bottom:calc(58px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; justify-content:flex-start; align-items:flex-end; gap:5px;
  overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
/* ★2026-08-08d よこ画面（高さ393pt）は1列8個＝355pxが入りきらず、
   下の2〜3個が右下の▲（ナビを出すボタン）と重なっていた。
   画面が低いときは2列にする＝4段（175px）で必ず収まる。 */
@media (max-height:560px){
  #d3pad{display:grid; grid-template-columns:repeat(2,46px); gap:5px;
         justify-content:end; align-content:start; overflow:visible;
         bottom:auto; max-height:calc(100% - 110px);}
  #d3pad button{width:46px; height:38px;}
}
#d3pad::-webkit-scrollbar{display:none;}
#d3pad button{
  width:46px; height:40px; border:1px solid var(--line); border-radius:9px; cursor:pointer;
  background:rgba(255,255,255,.96); color:var(--ink); font-family:inherit;
  font-size:15px; font-weight:900; line-height:1.05; padding:2px 0;
  box-shadow:0 2px 6px rgba(0,0,0,.14);}
#d3pad button i{display:block; font-style:normal; font-size:8.5px; font-weight:800; color:var(--ink-sub);}
#d3pad button:active{transform:translateY(1px); background:var(--green-lite);}

/* ★操作方法（？）の説明ページ */
#nnHelp{position:fixed; inset:0; z-index:600; display:none; background:rgba(20,28,24,.55);}
#nnHelp.on{display:flex; align-items:center; justify-content:center;}
#nnHelp .hp{
  width:min(92vw,560px); max-height:84vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:#fffdf4; border:2px solid var(--green-deep); border-radius:14px;
  box-shadow:0 14px 40px rgba(0,0,0,.4); padding:0 16px 16px;}
#nnHelp .hp h3{
  position:sticky; top:0; background:#fffdf4; z-index:2;
  font-size:15px; color:var(--green-deep); padding:13px 0 9px; margin:0 0 4px;
  border-bottom:2px solid var(--green-lite); display:flex; align-items:center;}
#nnHelp .hp h3 .cl{
  margin-left:auto; border:1.5px solid #9aa39d; background:#fff; color:#555;
  border-radius:999px; font-family:inherit; font-size:12.5px; font-weight:800;
  padding:5px 14px; cursor:pointer;}
#nnHelp .hp h4{font-size:13px; color:var(--green-deep); margin:12px 0 4px;}
#nnHelp .hp p, #nnHelp .hp li{font-size:12.5px; font-weight:700; line-height:1.8; color:var(--ink);}
#nnHelp .hp ul{padding-left:18px; margin:2px 0;}
#nnHelp .hp b{color:#b34700;}

/* ---------- 下部ナビ ---------- */
nav{
  flex:none;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,#1f5c36,#153f25);
  display:flex; gap:3px; padding:2px 7px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:calc(2px + env(safe-area-inset-bottom)); /* 端末下端の見切れ防止（rev.04 ③） */
  border-top:2px solid #0d2a18;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
}
nav::-webkit-scrollbar{display:none;}
nav .ni{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfe6d6;
  font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;
  transition:transform .06s;
}
nav .ni .ic{font-size:19px; line-height:1; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));}
nav .ni:hover{background:rgba(255,255,255,.10);}
nav .ni:active{transform:translateY(1px);}
nav .ni.on{
  background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));
  color:#4d3a00; border:1.5px solid #a87f00;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #7d5f00;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
/* ---------- 画像アイコンボタン（ナビ改修指示書 Step3） ---------- */
nav .ni .ic img, nav#nav .ni .ic img{height:44px; display:block;}
nav .ni.hasimg, nav#nav .ni.hasimg{padding:0 3px; margin-top:-13px;}
nav .ni.hasimg > span:last-child, nav#nav .ni.hasimg > span:last-child{display:none;}
nav .ni.hasimg .ic, nav#nav .ni.hasimg .ic{filter:none;}
nav .ni.hasimg.on, nav#nav .ni.hasimg.on{background:none; border:none; box-shadow:none; text-shadow:none;
  filter:drop-shadow(0 0 5px #ffd23f) drop-shadow(0 0 2px #ffd23f);
  transform:scale(1.14);
  transform-origin:center bottom;
  z-index:2; position:relative;
}
nav .ni.hasimg, nav#nav .ni.hasimg{transition:transform .15s ease-out, filter .15s ease-out;}
nav .ni.hasimg:hover, nav#nav .ni.hasimg:hover{transform:scale(1.06);}
nav .ni.hasimg.on:hover, nav#nav .ni.hasimg.on:hover{transform:scale(1.14);}
nav, nav#nav{overflow:visible; padding-top:2px;}
@media (max-width:760px){
  nav, nav#nav{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; justify-content:flex-start;}
  nav::-webkit-scrollbar, nav#nav::-webkit-scrollbar{display:none;}
  nav .ni .ic img, nav#nav .ni .ic img{height:38px;}
  nav .ni.hasimg, nav#nav .ni.hasimg{margin-top:0;}
  nav .ni:first-child, nav#nav .ni:first-child{margin-left:0;}
  nav .ni:last-child, nav#nav .ni:last-child{margin-right:0;}
}
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
/* ---------- タップ演出（shiyo_toroku基準：タッチ発光） ---------- */
@keyframes tapfx-glow{
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
  60%{opacity:.7;}
  100%{opacity:0; transform:translate(-50%,-50%) scale(2.1);}
}
@keyframes tapfx-ring{
  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.45);}
}
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);
  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .55s ease-out forwards;
}
.tapfx::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:2px solid rgba(255,217,77,.9);
  animation:tapfx-ring .55s ease-out forwards;
}
@media (max-width:820px){
  main{flex-direction:column;}
  #side{flex:0 0 46%; max-width:none; border-left:0; border-top:1px solid var(--line);}
  #toolbar{right:6px; left:6px;}
}
</style>
</head>
<body>
<header>
  <button class="new-btn nn-back nn-backimg" onclick="nnBack()" title="ひとつ前に戻る"><img src="./icons/btn_back.png" alt="戻る" onerror="var b=this.parentElement;b.classList.remove('nn-backimg');b.textContent='↩';"></button>
  <span class="hicon"><img src="./icons/icon_zumen.png" alt="" style="height:28px;vertical-align:middle" onerror="this.parentElement.textContent='📐'"></span>
  <h1><img src="./icons/title_zumen.png" alt="図面・積算" style="height:28px;vertical-align:middle" onerror="this.outerHTML='図面・積算'"></h1>
  <span class="hco">株式会社三浦工業<small>図面をかく → 数量・見積を自動算出</small></span>
  <!-- ★タブは帯の中（2026-08-02）。帯の下は全部方眼紙にする -->
  <div id="hdTabs">

<script>
/* ============================================================
   計算ロジック（純関数）— 図形・数量・割付
   ============================================================ */
/* 多角形面積（座標はマス単位、scaleM=1マスのm数）→ ㎡ */
function polyAreaM(pts, s){
  let a=0;
  for(let i=0;i<pts.length;i++){
    const p=pts[i], q=pts[(i+1)%pts.length];
    a += p.x*q.y - q.x*p.y;
  }
  return Math.abs(a)/2 * s*s;
}
function edgeLenM(a,b,s){ return Math.hypot(b.x-a.x, b.y-a.y)*s; }
function pointInPoly(pts,x,y){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i].x, yi=pts[i].y, xj=pts[j].x, yj=pts[j].y;
    /* ★2026-08-12d ここは `inside=true` になっていた（=一度でも交わったら中と判定）。
       正しくは交わるたびに裏返す。この誤りのせいで、部位の**左側**にある点が
       すべて「中」と判定され、左の辺だけ内向き法線が外向きのままになっていた。
       ＝左の辺の立上り防水層が建物の外側に貼られていた（本人の指摘）。 */
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
/* 水平走査線 y と多角形の交差区間 [[x1,x2],...]（座標系は任意単位） */
function scanSegs(pts,y){
  const xs=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    if((a.y>y)!==(b.y>y)){
      xs.push(a.x + (y-a.y)*(b.x-a.x)/(b.y-a.y));
    }
  }
  xs.sort((p,q)=>p-q);
  const segs=[];
  for(let i=0;i+1<xs.length;i+=2) segs.push([xs[i],xs[i+1]]);
  return segs;
}
/* 部位のリング列挙：外周＋中抜き（穴） r=-1が外周、0..が穴 */
function ringsOf(poly){
  /* ★2026-08-24z 点が3つ未満の輪は使わない。
     「戻る」や点の削除で 0個・1個・2個の形はできてしまい、
     そのまま3Dを組むと undefined.x で落ちて**3Dが動かなくなる**（実測）。 */
  const ok=r=>r && r.pts && r.pts.length>=3;
  if(!poly) return [];   /* ★2026-08-24ai 部位が無いときに呼ばれても落とさない */
  const out=[]; const o0={pts:poly.pts, edges:poly.edges, r:-1};
  if(ok(o0)) out.push(o0);
  (poly.holes||[]).forEach((h,i)=>{ const o={pts:h.pts, edges:h.edges, r:i}; if(ok(o)) out.push(o); });
  return out;
}
/* ★2026-08-24z 座標の見張り。
   数字でない・とんでもなく大きい座標が入ると、
   割付や継目の「一定間隔でくり返す」処理が何億回も回って**画面が固まる**
   （実測：1e9 の座標を入れたら操作を受け付けなくなった）。
   編集のたびに通る commit() と、読み込みのときに必ず通す。 */
/* ★1つの辺に立てる縦の継目の本数の上限。
   ふつうは 0.9m 間隔なので、200mの辺でも222本。400あれば十分で、
   これ以上は「寸法に とんでもない数字を打った」ときだけ当たる。 */
const NN_SEAM_MAX=400;
const NN_XY_MAX=8000;                        /* マス単位。1マス0.5mなら4km。
   いちばん大きい屋上（300m）でも 1200マス、建物がいくつも離れて建っていても
   4000マスに収まるので、これで足りる。大きくするほど、変な数字を入れたときに重くなる。 */
function nnSaneRing(r){
  if(!r || !Array.isArray(r.pts)) return;
  /* ★入れ物（配列）は作り替えないこと。作り替えると、つかんでいる最中の頂点の
     参照が古い配列を見たままになり、指の操作が効かなくなる。 */
  for(let i=r.pts.length-1;i>=0;i--){
    const q=r.pts[i];
    if(!q || !isFinite(+q.x) || !isFinite(+q.y)){ r.pts.splice(i,1); continue; }
    q.x=Math.max(-NN_XY_MAX,Math.min(NN_XY_MAX,+q.x));
    q.y=Math.max(-NN_XY_MAX,Math.min(NN_XY_MAX,+q.y));
  }
  if(Array.isArray(r.edges) && r.edges.length>r.pts.length) r.edges.length=r.pts.length;
}
function nnSanePolys(list){
  if(!Array.isArray(list)) return;
  /* ★2026-08-24ag 使えない部位（null・数字・文字など）はここで取り除く。
     残しておくと、あとで poly.name を読んだところで止まる。 */
  for(let i=list.length-1;i>=0;i--){
    const p=list[i];
    if(!p || typeof p!=='object' || Array.isArray(p) || !Array.isArray(p.pts)){ list.splice(i,1); continue; }
    nnSaneRing(p);
    if(Array.isArray(p.holes)){ for(let j=p.holes.length-1;j>=0;j--){
      const h=p.holes[j];
      if(!h || typeof h!=='object' || Array.isArray(h) || !Array.isArray(h.pts)){ p.holes.splice(j,1); continue; }
      nnSaneRing(h); } } else p.holes=[];
    p.lv=Math.max(0, Math.min(1000, isFinite(+p.lv)?+p.lv:0));   /* ★2026-08-24ai GL+は0〜1000m */
  }

window.nnSanePolys=nnSanePolys;
/* 穴を差し引いた正味面積 */
function areaNetM(poly, s){
  let a=polyAreaM(poly.pts, s);
  (poly.holes||[]).forEach(h=>{ a-=polyAreaM(h.pts, s); });
  return a;
}
/* 穴を考慮した内外判定 */
function insidePts(poly, x, y){
  if(!pointInPoly(poly.pts,x,y))return false;
  return !(poly.holes||[]).some(h=>pointInPoly(h.pts,x,y));
}
/* 区間の差（segsからcutsを引く） */
function subSegs(segs, cuts){
  let res=segs;
  cuts.forEach(c=>{
    const nx=[];
    res.forEach(sg=>{
      if(c[1]<=sg[0]||c[0]>=sg[1]){ nx.push(sg); return; }
      if(c[0]>sg[0])nx.push([sg[0],c[0]]);
      if(c[1]<sg[1])nx.push([c[1],sg[1]]);
    });
    res=nx.filter(sg=>sg[1]-sg[0]>1e-6);

}
/* 穴つき走査：外周の区間から穴の区間を引く */
function scanSegsH(outerPts, holes, y){
  let segs=scanSegs(outerPts,y);
  (holes||[]).forEach(h=>{ segs=subSegs(segs, scanSegs(h,y)); });
  return segs;
}
/* シート1本の走り（長さL）を巻長で分割：エンドラップ込み・千鳥用に1枚目長さ可変 */
function splitPieces(L, rollLen, endLap, firstLen){
  /* ★2026-08-24ai エンドラップ（長手の重ね）に とんでもない数字を打つと
     画面が固まっていた（実測：999999999 と打つと200万回のくり返し）。
     ・重ねしろは巻長より大きくならない（重ねが巻長を超えるのは実物であり得ない）
     ・くり返しにも上限を置く（万一の暴走を止める） */
  rollLen=Math.max(0.5, +rollLen||10);
  endLap=Math.min(Math.max(0, +endLap||0), rollLen*0.9);
  const f=Math.min(firstLen||rollLen, rollLen);
  if(L<=f+1e-9)return [{s:0,e:L}];
  const adv=Math.max(rollLen-endLap, 0.5);
  const out=[{s:0,e:f}];
  let st=f-endLap, n=0;
  const NMAX=4000;
  while(st<L-1e-9 && n<NMAX){
    const en=Math.min(st+rollLen, L);
    out.push({s:st,e:en});
    if(en>=L-1e-9)break;
    st+=adv; n++;
  }
  return out;
}
/* 取り都合：各シート長を1巻(rollLen)からどう取るか（First-Fit-Decreasing）→ 必要巻数 */
function ffdRolls(lens, rollLen){
  const a=[...lens].sort((x,y)=>y-x);
  const bins=[];
  a.forEach(L=>{
    const i=bins.findIndex(rest=>rest>=L-1e-9);
    if(i<0)bins.push(rollLen-L); else bins[i]-=L;
  });
  return bins.length;
}
/* シート割付（穴・千鳥対応）：chidori=trueで偶奇の帯の1枚目を半巻にして継ぎ目をずらす */
function wari(ptsM, holesM, sheetW, sideLap, endLap, rollLen, dir, chidori){
  const T=p=>dir==='v'?{x:p.y,y:p.x}:p;
  const P=ptsM.map(T);
  const HS=(holesM||[]).map(h=>h.map(T));
  let minY=Infinity, maxY=-Infinity;
  P.forEach(p=>{ if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; });
  const eff=Math.max(sheetW-sideLap, 0.05);
  const bands=[], lens=[]; let totalLen=0, nPieces=0, bi=0;
  const EPS=1e-4;
  /* ★2026-08-24z くり返しの上限。おかしな座標が入っても画面が固まらないように。
     ふつうの屋根（30m×20m）は22帯・66枚ほど。200m×200mでも4千枚台なので、
     この上限に当たるのは「寸法に とんでもない数字を打った」ときだけ。 */
  const BMAX=8000, PMAX=8000;
  for(let y0=minY; y0<maxY-EPS && bi<BMAX && nPieces<PMAX; y0+=eff, bi++){
    const hi=Math.min(y0+sheetW, maxY);
    const yc=Math.min(y0+eff/2, maxY-EPS)+1e-6;
    const raw=scanSegsH(P, HS, yc).filter(sg=>sg[1]-sg[0]>EPS);
    if(!raw.length)continue;
    const firstLen=(chidori&&bi%2===1)?rollLen/2:rollLen;
    const segs=raw.map(sg=>{
      const pieces=splitPieces(sg[1]-sg[0], rollLen, endLap, firstLen)
        .map(p=>({s:sg[0]+p.s, e:sg[0]+p.e}));
      pieces.forEach(p=>{ const L=p.e-p.s; lens.push(L); totalLen+=L; nPieces++; });
      return {a:sg[0], b:sg[1], pieces};
    });
    bands.push({lo:y0, hi, bi, segs});
  }
  return {bands, lens, nPieces, totalLen};
}
/* 辺の正規化：k=para(パラペット:立上り+天端) / kabe(壁当り:立上りのみ・端末金物) / free(立上りなし) */
/* ★2026-08-28e 弧（§232）のまとまりを求める共通の道具。
   画面の図面（draw）と、元請に出す図面（nn-draw-js）の両方から使う。
   ここを1本にしておかないと、片方だけ直して食い違う（§146の教訓）。
   返すもの：
     groups … [{id, idx:[辺の番号], mid:まん中の辺, a:始点, b:終点,
                arcLenM:弧の長さ, chordM:弦の長さ, R:半径}]
     inner  … 弧の「途中の頂点」の番号（通り芯を立ててはいけない点）
     edgeArc… 辺の番号 → まとまり（弧でなければ undefined） */
function nnArcGroups(ring, sM){
  const out={groups:[], inner:new Set(), edgeArc:{}};
  if(!ring||!ring.pts||!ring.edges)return out;
  const pts=ring.pts, N=pts.length, m={};
  for(let i=0;i<N;i++){ const a=ek(ring.edges[i]).arc; if(a!=null){ (m[a]=m[a]||[]).push(i); } }
  Object.keys(m).forEach(k=>{
    const idx=m[k]; if(idx.length<2)return;
    const g={id:+k, idx:idx, mid:idx[Math.floor(idx.length/2)]};
    g.a=pts[idx[0]]; g.b=pts[(idx[idx.length-1]+1)%N];
    let tot=0; idx.forEach(q=>{ tot+=edgeLenM(pts[q], pts[(q+1)%N], sM); });
    g.arcLenM=tot;
    g.chordM=edgeLenM(g.a, g.b, sM);
    let sag=0; const vx=g.b.x-g.a.x, vy=g.b.y-g.a.y, LL=Math.hypot(vx,vy)||1;
    idx.forEach(q=>{ const P=pts[q];
      sag=Math.max(sag, Math.abs(((P.x-g.a.x)*vy-(P.y-g.a.y)*vx)/LL)); });
    sag*=sM;
    g.R=(sag>0.001)?((g.chordM*g.chordM/4+sag*sag)/(2*sag)):0;
    idx.forEach((q,qi)=>{ out.edgeArc[q]=g; if(qi>0) out.inner.add(q); });
    out.groups.push(g);
  });
  return out;
}
window.nnArcGroups=nnArcGroups;
function ek(e){
  const h=+(e&&e.h)||0, w=+(e&&e.w)||0;
  const k=(e&&e.k) || (h>0?'para':'free');
  /* ago=水切りアゴの有無（パラペットだけ）／agoD=アゴの出(mm) */
  const ago=!!(e&&e.ago) && k==='para';
  const agoD=Math.max(20, +(e&&e.agoD)||100);
  const wall=+(e&&e.wall)||0;   /* ★2026-08-23n 壁の厚み（mm・0＝既定） */
  /* ★2026-08-27c 取り合い（仕様の違う屋根どうしの境界）の納まり。
     mikiri=見切り＋シール／kasane=重ね／tachi=立上りで縁を切る。
     torUp は「重ね」のときにどちら側が上に乗るか（0=この辺の側／1=相手側）。 */
  const TORK={mikiri:1,kasane:1,tachi:1};
  const tor=(e&&TORK[e.tor])?e.tor:'';
  const torUp=!!(e&&e.torUp);
  /* ★2026-08-28d arc＝同じ弧に属する辺をまとめる番号（§232）。
     ek は「知っている項目だけ」を返すので、ここに足さないと図面の札の間引きが効かない。 */
  const arc=(e&&e.arc!=null&&isFinite(+e.arc))?+e.arc:null;
  /* ★2026-08-28h アルミ笠木の有無。ここに足さないと、段差ラインで屋根を2つに
     分けたときに（辺を ek で作り直すので）笠木が全部消えていた（実測 4本→0本）。 */
  const kasagi=!!(e&&e.kasagi);
  return {h,w,k,ago,agoD,wall,tor,torUp,arc,kasagi};
}
/* 部位1つの数量：{hira, tachi, tenba, kabe(壁当り端末m), per} */
/* ★2026-08-23n 壁の厚み（m）。辺ごとに e.wall(mm) を持てる（無ければ従来どおり
   パラペット＝天端W／壁当り＝150mm）。「面を厚く/薄く」で変わるのはここ。 */
function nnWallTh(e){
  if(e && e.wall>0) return Math.max(0.02, e.wall/1000);
  return (e && e.k==='para') ? Math.max((e.w||0)/1000, 0.08) : 0.15;
}
window.nnWallTh=nnWallTh;
function quantities(poly, s){
  let tachi=0, tenba=0, kabe=0, agoL=0, agoA=0, per=0;
  ringsOf(poly).forEach(ring=>{
    const pts=ring.pts;
    for(let i=0;i<pts.length;i++){
      const L=edgeLenM(pts[i],pts[(i+1)%pts.length],s);
      per+=L;
      const e=ek(ring.edges[i]);
      if(e.k==='para' && e.h>0){
        tachi+=L*e.h/1000; if(e.w>0) tenba+=L*e.w/1000;
        /* 水切りアゴ：出＋垂れの分だけ防水を巻き込むので、その面積を別に拾う */
        if(e.ago){ agoL+=L; agoA+=L*(e.agoD+AGO_LIP)/1000; }
      }
      else if(e.k==='kabe' && e.h>0){ tachi+=L*e.h/1000; kabe+=L; }
    }
  });
  return { hira:areaNetM(poly,s), tachi, tenba, kabe, agoL, agoA, per };
}

  /* ★2026-08-24ai 立上り・天端・アゴ・壁の厚みに上限（mm）。
     とんでもない数字を打つと、数量が 4e298㎡ のような値になって見積が意味をなさない。
     実物は 立上り100〜2000／天端50〜600／アゴ50〜300／壁50〜500 なので、
     下の上限に当たるのは打ち間違いのときだけ。 */
  const cap=(v,mx)=>{ v=+v; return isFinite(v)?Math.max(0,Math.min(mx,v)):0; };
  const normE=e=>{ const o={h:cap(e.h,30000), w:cap(e.w,10000), k:e.k||((+e.h||0)>0?'para':'free')};
    if(e.ago)o.ago=1; if(e.agoD)o.agoD=cap(e.agoD,3000)||100;
    if(cap(e.wall,3000)>0)o.wall=cap(e.wall,3000);   /* ★2026-08-23n 壁の厚み（面を厚く/薄く） */
    /* ★2026-08-27c 取り合いの納まり。ここに書き足さないと、保存して開き直したとき
       この項目だけ捨てられて既定（見切り）に戻る（normE は知っている項目しか写さない）。 */
    if(['mikiri','kasane','tachi'].indexOf(e.tor)>=0){ o.tor=e.tor; if(e.torUp)o.torUp=1; }
    /* ★2026-08-27d アルミ笠木の有無（ここに足さないと保存されない） */
    if(e.kasagi) o.kasagi=1;
    /* ★2026-08-28d 弧の印（同じ弧の辺どうしをまとめる番号）。
       ここに足さないと、開き直したときに札が16個に戻る（§223と同じ罠）。 */
    if(e.arc!=null && isFinite(+e.arc)) o.arc=+e.arc;
    return o; };
  (state.polys||[]).forEach(p=>{
    p.lv=+p.lv||0;
    /* ★2026-08-23h GL+（青い防水面）と躯体の高さを分離。旧データは同じ値から始める */
    /* ★2026-08-24p bodyLv（躯体の高さ）は廃止した。
       3Dの組み立ては poly.lv しか見ていないのに、この項目だけ別に持っていたため、
       保存して開き直したあと平場を下げると「塔屋の壁の足元が古い高さのまま」になり、
       建物が宙に浮いていた。古い保存データに入っていても捨てる。 */
    if(p.bodyLv!=null) delete p.bodyLv;
    if(p.spec && !SPECS.some(sx=>sx.code===p.spec)) delete p.spec;                  /* 屋根ごとの防水仕様（平場） */
    if(p.specT && !SPECS.some(sx=>sx.code===p.specT)) delete p.specT;               /* 立上り・天端の仕様 */
    if(p.kouzou && ['rc','salc','src','w','sdeck'].indexOf(p.kouzou)<0) delete p.kouzou; /* 屋根ごとの下地 */
    /* ★2026-08-28c 屋根ごとの現況（躯体／既存防水／改修後防水）。
       知らない値は捨てて「改修後防水」（既定）に戻す。
       版 2026-08-28b の値は読み替える（oldas・hogo＝改修前の姿 → 既存防水）。 */
    if(p.genkyo==='oldas'||p.genkyo==='hogo') p.genkyo='exist';
    if(p.genkyo && ['body','exist'].indexOf(p.genkyo)<0) delete p.genkyo;
    if((+p.lv||0)<0) p.lv=0;                    /* ★2026-08-24b 地下防水は対象外＝GL+0mが最低 */
    if(p.dir!=='h'&&p.dir!=='v'&&p.dir!=='short')delete p.dir;   /* 部位ごとの流し方向 */
    p.edges=(p.edges||[]).map(normE);
    p.holes=(p.holes||[]).map(hh=>({pts:hh.pts, edges:(hh.edges||[]).map(normE)}));
  });
  if(state.underlay&&state.underlay.img){ uImg=new Image(); uImg.onload=()=>draw(); uImg.src=state.underlay.img; }
  hist=[nnHistSnap()]; hi=0;
}

  try{ draw(); }catch(_){}

function draw(){
  /* ★2026-08-24z 描く前に座標を見張る。
     とんでもなく大きい座標（寸法に 999999 と打つ、など）のまま線を引くと、
     ブラウザの絵を描く部分が何百万個もの点線を刻もうとして**画面が固まる**
     （JS側でくり返しを止めても直らない。絵を描く処理の中で止まるため）。 */
  try{ nnSanePolys(state.polys); nnSaneRing({pts:drawPts}); }catch(_){}
  const W=cv.width/devicePixelRatio, H=cv.height/devicePixelRatio;
  ctx.clearRect(0,0,W,H);
  nnLabBox=[]; nnLabHit=[];        /* 札の置き場所と当たり判定を毎回つくり直す */
  /* --- 下絵（航空写真）：回転対応 --- */
  _uxBtn=null;
  if(uImg && state.underlay){
    const u=state.underlay;
    const wpx=uImg.width * u.mPerPx / state.scaleM * cellPx;
    const hpx=uImg.height* u.mPerPx / state.scaleM * cellPx;
    const cx=gx2px(u.x)+wpx/2, cy=gy2px(u.y)+hpx/2;
    const rad=(+u.rot||0)*Math.PI/180;
    try{
      ctx.save(); ctx.globalAlpha=u.op??0.6;
      ctx.translate(cx,cy); ctx.rotate(rad);
      ctx.drawImage(uImg, -wpx/2, -hpx/2, wpx, hpx);
      ctx.restore();
    }catch(err){ ctx.restore(); }
    if(umove){
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(rad);
      ctx.strokeStyle='#e8760a'; ctx.lineWidth=2; ctx.setLineDash([8,5]);
      ctx.strokeRect(-wpx/2,-hpx/2,wpx,hpx); ctx.setLineDash([]);
      ctx.restore();
      /* ✕削除ボタン（回転後の右上コーナー） */
      const bx=cx + (wpx/2)*Math.cos(rad) - (-hpx/2)*Math.sin(rad);
      const by=cy + (wpx/2)*Math.sin(rad) + (-hpx/2)*Math.cos(rad);
      _uxBtn={x:bx,y:by};
      ctx.beginPath(); ctx.arc(bx,by,11,0,7);
      ctx.fillStyle='#b0392f'; ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='800 13px sans-serif'; ctx.textAlign='center';
      ctx.fillText('✕',bx,by+4.5); ctx.textAlign='left';
    }
  }
  /* スケール合わせ中の点 */
  if(calib){
    [calib.p1,calib.p2].forEach((p,i)=>{
      if(!p)return;
      ctx.beginPath(); ctx.arc(gx2px(p.x),gy2px(p.y),7,0,7);
      ctx.strokeStyle='#e8760a'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#e8760a'; ctx.font='800 12px sans-serif';
      ctx.fillText(i+1, gx2px(p.x)+10, gy2px(p.y)-8);
    });
    if(calib.p1&&calib.p2){
      ctx.beginPath(); ctx.moveTo(gx2px(calib.p1.x),gy2px(calib.p1.y)); ctx.lineTo(gx2px(calib.p2.x),gy2px(calib.p2.y));
      ctx.strokeStyle='#e8760a'; ctx.lineWidth=2; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  /* --- 方眼（ズームに応じて間引く適応ステップ） --- */
  const boldEvery=Math.max(1,Math.round(1/state.scaleM)); /* 1mごとに太線 */
  let step=1; const STEPS=[1,2,5,10,20,50,100,200,500];
  for(const st of STEPS){ if(st*cellPx>=8){ step=st; break; } step=st; }
  const gx0=Math.floor(px2gx(0)/step)*step, gx1=Math.ceil(px2gx(W)/step)*step;
  const gy0=Math.floor(px2gy(0)/step)*step, gy1=Math.ceil(px2gy(H)/step)*step;
  const _T=nnTH();                       /* ★方眼の色はテーマから（本物の方眼紙どおり薄い水色） */
  if(nnGridOn())for(let x=gx0;x<=gx1;x+=step){
    const bold=(step===1)? x%boldEvery===0 : x%(step*5)===0;
    ctx.strokeStyle = bold ? _T.g2 : _T.g1;
    ctx.lineWidth = bold ? 1 : .5;
    ctx.beginPath(); ctx.moveTo(gx2px(x),0); ctx.lineTo(gx2px(x),H); ctx.stroke();
  }
  if(nnGridOn())for(let y=gy0;y<=gy1;y+=step){
    const bold=(step===1)? y%boldEvery===0 : y%(step*5)===0;
    ctx.strokeStyle = bold ? _T.g2 : _T.g1;
    ctx.lineWidth = bold ? 1 : .5;
    ctx.beginPath(); ctx.moveTo(0,gy2px(y)); ctx.lineTo(W,gy2px(y)); ctx.stroke();
  }
  /* 1mスケール表示 */
  ctx.fillStyle=_T.scale; ctx.font='700 11px sans-serif';
  /* ★fmtScale は後ろのスクリプトで定義される。3D部品（CDN）の読み込みが遅いと
     後ろの定義がまだ無いまま draw が呼ばれることがあるので、無ければ素の数値で出す */
  {
    const _sc=(typeof fmtScale==='function')?fmtScale(state.scaleM):state.scaleM;
    const _st=(typeof nnLenStepM==='function')?nnLenStepM():0.1;
    const _as=(typeof NN_ANG_STEP!=='undefined')?NN_ANG_STEP:5;
    /* ★打点の決まりも一緒に出す（角度5度きざみ・長さ10cmきざみ） */
    /* ★スマホは1行の幅がぎりぎりなので、そろえの説明はパソコンのときだけ足す */
    const _sol=(document.documentElement.getAttribute('data-nnphone')==='1')
      ? '' : '（始点や角の真上・真下・真横には自動でそろう）';
    const _rule=`線は ${_as}度きざみ・長さ ${Math.round(_st*100)}cmきざみ${_sol}`;
    ctx.fillText(nnGridOn()
      ? `方眼：1マス＝${_sc}m（太線＝1m）　／　${_rule}`
      : `マス非表示（1マス＝${_sc}m のまま）　／　${_rule}`, 12, H-10);
  }

  /* --- 各部位 --- */
  const sp=spec();
  if(tab==='wf')wfHit=[];
  state.polys.forEach((poly,pi)=>{
    const on=pi===state.active;
    const sp=specOfPoly(poly);   /* ★2026-08-23h 屋根ごとの防水仕様の色で塗る */
    /* 面（中抜きは evenodd で抜く） */
    ctx.beginPath();
    poly.pts.forEach((p,i)=> i? ctx.lineTo(gx2px(p.x),gy2px(p.y)) : ctx.moveTo(gx2px(p.x),gy2px(p.y)));
    ctx.closePath();
    (poly.holes||[]).forEach(hh=>{
      hh.pts.forEach((p,i)=> i? ctx.lineTo(gx2px(p.x),gy2px(p.y)) : ctx.moveTo(gx2px(p.x),gy2px(p.y)));
      ctx.closePath();
    });
    ctx.fillStyle=hexA(sp.fill, on?0.5:0.3); ctx.fill('evenodd');
    /* 割り付けストライプ（②タブ） */
    if(tab==='wf' && sp.type==='sheet') drawBands(poly, pi, sp);
    /* 辺（外周＋穴のすべてのリング） */
    ringsOf(poly).forEach(ring=>{
      const rpts=ring.pts;
      for(let i=0;i<rpts.length;i++){
        const a=rpts[i], b=rpts[(i+1)%rpts.length];
        const e=ek(ring.edges[i]);
        const isSel=sel&&sel.p===pi&&sel.r===ring.r&&sel.e===i;
        ctx.beginPath(); ctx.moveTo(gx2px(a.x),gy2px(a.y)); ctx.lineTo(gx2px(b.x),gy2px(b.y));
        ctx.setLineDash(e.k==='free'||e.h<=0?[6,4]:[]);
        /* ★2026-08-16u 辺は「方眼の太線と同じ太さ（1px）」にする（本人の指示）。
           《なぜ細くするか》太いと、細かい納まりを描くときに線が場所を食って
           狙いが定まらない＝細かい描写に移れないため。
           細くすると見えにくくなるので、**色は濃くする**（濃い緑／濃い茶／黒に近い灰）。
           ★選択中の辺だけは 1.6px。同じ太さにすると「いまどの辺を編集しているか」が
             分からなくなるため（ここだけは太さで見分ける）。 */
        ctx.strokeStyle=isSel?'#e8760a':(e.k==='kabe'?'#5c3408':(on?'#0a3c1f':'#39463d'));
        ctx.lineWidth=isSel?1.6:1;
        ctx.stroke(); ctx.setLineDash([]);
        /* ★2026-08-23v 天端（パラペットの上の面）を図面に描く。
           外側へ「天端幅 W」ぶん出した帯＝実際の平面図と同じ見え方（本人の指示）。
           ★2026-08-27a 角の納まりを「留め継ぎ」に直した。
           以前は辺の両端をWぶん伸ばしてつなげていたので、角で隣の帯を突き抜けて
           四隅が十字に飛び出して見えた（本人の指摘「なぜ4隅の外側が飛び出している？」）。
           いまは 隣も帯なら「外側の線どうしの交点」で突き合わせ（3Dの joint と同じ考え方）、
           隣に帯が無ければ角でまっすぐ止める。 */
        if(e.k==='para' && e.h>0 && e.w>0){
          const nT=ringNormal(poly,rpts,a,b);
          const dpx=(e.w/1000/(state.scaleM||1))*cellPx;
          if(dpx>0.6){
            const nEdge=rpts.length;
            const bandOf=(j)=>{
              const ej=ek(ring.edges[j]);
              if(!(ej.k==='para' && ej.h>0 && ej.w>0)) return null;
              const dj=(ej.w/1000/(state.scaleM||1))*cellPx;
              if(dj<=0.6) return null;
              const pa=rpts[j], pb=rpts[(j+1)%nEdge];
              return {ax:gx2px(pa.x), ay:gy2px(pa.y), bx:gx2px(pb.x), by:gy2px(pb.y),
                      n:ringNormal(poly,rpts,pa,pb), d:dj};
            };
            const me={ax:gx2px(a.x), ay:gy2px(a.y), bx:gx2px(b.x), by:gy2px(b.y), n:nT, d:dpx};
            const outerEnd=(other, px, py)=>{
              const base={x:px+me.n.x*me.d, y:py+me.n.y*me.d};   /* 隣に帯が無い＝角で止める */
              if(!other) return base;
              let ux=me.bx-me.ax, uy=me.by-me.ay, L=Math.hypot(ux,uy)||1; ux/=L; uy/=L;
              let vx=other.bx-other.ax, vy=other.by-other.ay; L=Math.hypot(vx,vy)||1; vx/=L; vy/=L;
              const cr=ux*vy-uy*vx;
              if(Math.abs(cr)<1e-6) return base;                 /* ほぼ一直線＝そのまま */
              const A1x=me.ax+me.n.x*me.d, A1y=me.ay+me.n.y*me.d;
              const A2x=other.ax+other.n.x*other.d, A2y=other.ay+other.n.y*other.d;
              const t=((A2x-A1x)*vy-(A2y-A1y)*vx)/cr;
              const Px=A1x+ux*t, Py=A1y+uy*t;
              /* とがりすぎる角は暴走させず角の真上で止める（3Dのjointと同じ保険） */
              if(Math.hypot(Px-base.x, Py-base.y) > Math.max(me.d,other.d)*4+8) return base;
              return {x:Px, y:Py};
            };
            const oA=outerEnd(bandOf((i-1+nEdge)%nEdge), me.ax, me.ay);
            const oB=outerEnd(bandOf((i+1)%nEdge),       me.bx, me.by);
            ctx.beginPath();
            ctx.moveTo(me.ax,me.ay); ctx.lineTo(me.bx,me.by);
            ctx.lineTo(oB.x,oB.y); ctx.lineTo(oA.x,oA.y);
            ctx.closePath();
            ctx.fillStyle=isSel?'rgba(232,118,10,.22)':'rgba(120,132,124,.20)';
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(oA.x,oA.y); ctx.lineTo(oB.x,oB.y);
            ctx.strokeStyle=isSel?'#e8760a':(on?'#0a3c1f':'#39463d'); ctx.lineWidth=1;
            ctx.stroke();
          }
        }
        /* 水切りアゴ＝外側に青い点線（3Dの出っ張りと対応） */
        if(e.k==='para'&&e.ago&&e.h>0){
          const nrmA=ringNormal(poly,rpts,a,b);
          ctx.beginPath();
          ctx.moveTo(gx2px(a.x)+nrmA.x*5, gy2px(a.y)+nrmA.y*5);
          ctx.lineTo(gx2px(b.x)+nrmA.x*5, gy2px(b.y)+nrmA.y*5);
          ctx.strokeStyle=isSel?'#e8760a':'#2456b8'; ctx.lineWidth=1.5;
          ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
        }
        /* 壁当り＝防水面と反対側に平行線（外壁の表現） */
        if(e.k==='kabe'&&e.h>0){
          const nrmW=ringNormal(poly,rpts,a,b);
          ctx.beginPath();
          ctx.moveTo(gx2px(a.x)-nrmW.x*5, gy2px(a.y)-nrmW.y*5);
          ctx.lineTo(gx2px(b.x)-nrmW.x*5, gy2px(b.y)-nrmW.y*5);
          ctx.strokeStyle=isSel?'#e8760a':'#b08040'; ctx.lineWidth=1.5; ctx.stroke();
        }
        /* 寸法（m）：辺の画面上の長さで表示を間引き（重なり対策） */
        const mx=(gx2px(a.x)+gx2px(b.x))/2, my=(gy2px(a.y)+gy2px(b.y))/2;
        const L=edgeLenM(a,b,state.scaleM);
        const epx=Math.hypot(b.x-a.x,b.y-a.y)*cellPx;
        /* ★2026-08-28d 弧（§232）は細切れの折れ線なので、1本ずつ札を出すと
           16個も並んで図面が読めない。弧ぜんぶで「まん中の1本」にだけ出し、
           文字は弧全体の長さ（R◯◯m）にする。 */
        let arcMid=true, arcTxt=null;
        if(e.arc!=null){
          const AG=nnArcGroups(ring, state.scaleM).edgeArc[i];
          if(AG){
            arcMid=(i===AG.mid);
            arcTxt='弧 '+f1(AG.arcLenM)+'m'+(AG.R>0?'（R'+f1(AG.R)+'m）':'');
          }
        }
        if((typeof nnDimsOn==='undefined'||nnDimsOn) && (e.arc!=null ? arcMid : (epx>=34)) && cellPx>=8){
          const nrm=ringNormal(poly,rpts,a,b);
          ctx.font='700 '+(NN_PHONE?11.5:15)+'px sans-serif';
          const txt=arcTxt||(f1(L)+'m');
          const w=ctx.measureText(txt).width+7;
          /* ★2026-08-05d 重なり回避。割付表示ではシート番号の札が先に登録されているので、
             寸法と H◯◯◯ は自動で外側へ逃げる。 */
          const bh=NN_PHONE?14:18;
          const dp=nnPlaceBox(mx-nrm.x*15, my-nrm.y*15, w, bh, -nrm.x, -nrm.y);
          ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillRect(dp.x-w/2,dp.y-bh/2,w,bh);
          ctx.fillStyle='#33413a'; ctx.textAlign='center'; ctx.fillText(txt,dp.x,dp.y+bh*0.28);
          if(e.h>0 && epx>=48){
            const tag=(e.k==='kabe'?'壁H':'H')+e.h+(e.ago?'+アゴ':'');
            ctx.font='800 '+(NN_PHONE?10:12.5)+'px sans-serif';
            const tw=ctx.measureText(tag).width+8;
            /* ★割付表示のときは、屋根の中はシートの札で埋まっているので
               H◯◯◯ も外側（寸法の外）に出す。図面表示のときは今までどおり内側。 */
            const hOut=(tab==='wf');
            const hb=NN_PHONE?15:18;
            const hp=hOut ? nnPlaceBox(mx-nrm.x*34, my-nrm.y*34, tw, hb, -nrm.x, -nrm.y)
                          : nnPlaceBox(mx+nrm.x*18, my+nrm.y*18, tw, hb,  nrm.x,  nrm.y);
            ctx.fillStyle=isSel?'#e8760a':(e.k==='kabe'?'#a05a10':'#2456b8');
            roundRect(ctx,hp.x-tw/2,hp.y-hb/2,tw,hb,4); ctx.fill();
            ctx.fillStyle='#fff'; ctx.fillText(tag,hp.x,hp.y+hb*0.24);
          }
          ctx.textAlign='left';
        }
      }
      /* ∠角度表示（トグル） */
      if(showAngles && cellPx>=13){
        for(let i=0;i<rpts.length;i++){
          const cur=rpts[i];
          const pv=rpts[(i-1+rpts.length)%rpts.length];
          const nx=rpts[(i+1)%rpts.length];
          const u1={x:pv.x-cur.x,y:pv.y-cur.y}, u2={x:nx.x-cur.x,y:nx.y-cur.y};
          const l1=Math.hypot(u1.x,u1.y)||1, l2=Math.hypot(u2.x,u2.y)||1;
          let deg=Math.acos(Math.max(-1,Math.min(1,(u1.x*u2.x+u1.y*u2.y)/(l1*l2))))*180/Math.PI;
          let bx=u1.x/l1+u2.x/l2, by=u1.y/l1+u2.y/l2;
          const bl=Math.hypot(bx,by);
          if(bl<1e-6){ bx=-u1.y/l1; by=u1.x/l1; } else { bx/=bl; by/=bl; }
          if(!insidePts(poly, cur.x+bx*0.05, cur.y+by*0.05)){ bx=-bx; by=-by; deg=360-deg; }
          const px_=gx2px(cur.x)+bx*20, py_=gy2px(cur.y)+by*20;
          const t=Math.round(deg)+'°';
          ctx.font='800 10.5px sans-serif';
          const tw=ctx.measureText(t).width;
          ctx.fillStyle='rgba(60,68,64,.88)';
          roundRect(ctx,px_-tw/2-4,py_-8,tw+8,15,4); ctx.fill();
          ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(t,px_,py_+3); ctx.textAlign='left';
        }
      }
      /* 頂点 */
      rpts.forEach(p=>{
        /* ★2026-08-16u 辺を細くしたので、頂点の丸も小さく・色を濃く（線とそろえる）。
           ただし小さくしすぎると指でつまめないので、当たり判定は今までどおり広い。 */
        ctx.beginPath(); ctx.arc(gx2px(p.x),gy2px(p.y),on?3.2:2.4,0,7);
        ctx.fillStyle=on?'#0a3c1f':'#39463d'; ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
      });
    });
    /* 部位名＋レベル */
    const c=polyCenter(poly.pts);
    ctx.font='800 13px sans-serif'; ctx.fillStyle=on?'#1e5c3a':'#5c6662'; ctx.textAlign='center';
    ctx.fillText(poly.name, gx2px(c.x), gy2px(c.y));
    if(cellPx>=14){
      ctx.font='800 11px sans-serif'; ctx.fillStyle='#8a978c';
      ctx.fillText('GL+'+(+poly.lv||0).toFixed(1)+'m', gx2px(c.x), gy2px(c.y)+15);
    }
    ctx.textAlign='left';
  });
  /* 段差ライン描画中のプレビュー */
  if(splitPts){
    ctx.strokeStyle='#8430ce'; ctx.lineWidth=2.5; ctx.setLineDash([9,5]);
    ctx.beginPath();
    ctx.moveTo(gx2px(splitPts.ins1.pt.x), gy2px(splitPts.ins1.pt.y));
    splitPts.mids.forEach(m=>ctx.lineTo(gx2px(m.x),gy2px(m.y)));
    ctx.lineTo(gx2px(mouse.gx), gy2px(mouse.gy));
    ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(gx2px(splitPts.ins1.pt.x), gy2px(splitPts.ins1.pt.y),6,0,7);
    ctx.fillStyle='#8430ce'; ctx.fill();
  }
  if(tool==='split'&&!splitPts&&state.active>=0){
    /* 開始点候補（外周への吸着プレビュー） */
    const ins=nearestOnBoundary(state.polys[state.active], mouse.rawx, mouse.rawy);
    if(ins&&ins.distPx<18){
      ctx.beginPath(); ctx.arc(gx2px(ins.pt.x),gy2px(ins.pt.y),7,0,7);
      ctx.strokeStyle='#8430ce'; ctx.lineWidth=3; ctx.stroke();
    }
  }

  /* --- 範囲選択：矩形と選択頂点 --- */
  if(marq){
    ctx.strokeStyle='#e8760a'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
    ctx.strokeRect(gx2px(Math.min(marq.x0,marq.x1)), gy2px(Math.min(marq.y0,marq.y1)),
      Math.abs(gx2px(marq.x1)-gx2px(marq.x0)), Math.abs(gy2px(marq.y1)-gy2px(marq.y0)));
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(232,118,10,.08)';
    ctx.fillRect(gx2px(Math.min(marq.x0,marq.x1)), gy2px(Math.min(marq.y0,marq.y1)),
      Math.abs(gx2px(marq.x1)-gx2px(marq.x0)), Math.abs(gy2px(marq.y1)-gy2px(marq.y0)));
  }
  rsel.forEach(({p,r,i})=>{
    const poly=state.polys[p]; if(!poly)return;
    const pt=r<0?poly.pts[i]:(poly.holes[r]&&poly.holes[r].pts[i]); if(!pt)return;
    ctx.fillStyle='#e8760a';
    ctx.fillRect(gx2px(pt.x)-5, gy2px(pt.y)-5, 10, 10);
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.strokeRect(gx2px(pt.x)-5, gy2px(pt.y)-5, 10, 10);
  });
  /* --- 描画中プレビュー（2026-08-02e 作り直し）
     ・打点が済んで「辺になった」線は <b>青の実線＋寸法を常時表示</b>（＝完了の合図）
     ・いま引いている途中の線だけオレンジの点線
     ・角には三角定規と同じ「丸い弧＋角度」。いま作っている角はオレンジで生きたまま動く */
  if((tool==='draw'||tool==='hole') && drawPts.length){
    /* ★2026-08-16u 作図中の線も方眼と同じ太さに合わせ、色を濃くした（本人の指示）。
       白フチ（太い下地）はやめる＝これが「太く見える」いちばんの原因だった。 */
    const BL='#0b2c6b', OR='#b34c00';                       /* 確定＝濃い青／作図中＝濃いオレンジ */
    const P=drawPts.map(p=>({x:gx2px(p.x), y:gy2px(p.y)}));
    const cur={x:gx2px(mouse.gx), y:gy2px(mouse.gy)};
    ctx.lineJoin='round'; ctx.lineCap='round';
    /* ① 確定した辺＝青の実線（白フチ付きで方眼の上でもくっきり） */
    if(P.length>=2){
      ctx.beginPath();
      P.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
      ctx.strokeStyle=BL; ctx.lineWidth=1; ctx.stroke();
    }
    /* ★指を離した直後は「いま引いている線」の長さが0になる。
       0.0m の札や点が残ると汚いので、長さが出るまで出さない。 */
    const liveOn = Math.hypot(cur.x-P[P.length-1].x, cur.y-P[P.length-1].y) > 3;
    /* ② いま引いている途中の線＝オレンジの点線 */
    if(liveOn){
      ctx.beginPath();
      ctx.moveTo(P[P.length-1].x, P[P.length-1].y); ctx.lineTo(cur.x, cur.y);
      ctx.strokeStyle=OR; ctx.lineWidth=1;
      ctx.setLineDash([6,5]); ctx.stroke(); ctx.setLineDash([]);
    }
    /* ②' そろえる線の目印（2026-08-13m）
       始点や既存の角の「真上・真下・真横」に止まったとき、どこにそろえたかを紫の細い線で見せる。
       これが出ていれば、閉じる辺が確実に垂直（水平）になる。 */
    if(nnAlignHit && Math.abs(nnAlignHit.g.x-mouse.gx)<1e-6 && Math.abs(nnAlignHit.g.y-mouse.gy)<1e-6){
      const AL='#8b2fd6';
      ctx.save();
      nnAlignHit.lines.forEach(ln=>{
        const tp={x:gx2px(ln.t.x), y:gy2px(ln.t.y)};
        ctx.beginPath(); ctx.moveTo(tp.x,tp.y); ctx.lineTo(cur.x,cur.y);
        ctx.strokeStyle=AL; ctx.lineWidth=1.1; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.rect(tp.x-3.5,tp.y-3.5,7,7);
        ctx.strokeStyle=AL; ctx.lineWidth=1.4; ctx.stroke();
      });
      const ax=nnAlignHit.lines.map(l=>l.axis);
      ctx.font='800 10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=AL;
      /* ★札は画面の端で切れないように内側へ寄せる */
      const _lx=Math.max(46, Math.min(cur.x, cv.width/devicePixelRatio-46));
      ctx.fillText((ax.indexOf('x')>=0?'たて':'')+(ax.indexOf('y')>=0?'よこ':'')+' そろえ', _lx, cur.y+16);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.restore();
    }
    /* ③ 頂点の丸 */
    P.forEach((p,i)=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,i===0?3.2:2.2,0,7);
      ctx.fillStyle=i===0?OR:BL; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
    });
    /* ④ 確定した辺の寸法＝常時表示（青） */
    for(let i=1;i<P.length;i++)
      drawDimLabel(P[i-1], P[i], f1(edgeLenM(drawPts[i-1],drawPts[i],state.scaleM))+'m', BL, i);
    /* ⑤ 角度：確定した角は青、いま作っている角はオレンジ（青い札はタップで数値入力） */
    for(let i=1;i<P.length-1;i++) drawAngleMark(P[i], P[i-1], P[i+1], BL, i);
    if(P.length>=2 && liveOn) drawAngleMark(P[P.length-1], P[P.length-2], cur, OR);
    /* ★始点の磁石マーク：3点以上あれば「ここをタップで閉じる」の輪を出す */
    if(P.length>=3){
      const f=P[0];
      const rr=Math.max(0.45, 26/cellPx)*cellPx;
      ctx.beginPath(); ctx.arc(f.x,f.y,rr,0,7);
      ctx.strokeStyle='rgba(232,118,10,.55)'; ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
      /* 文字は輪の「下」に置く（右に置くと1本目の寸法と重なる） */
      ctx.font='800 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#c56408'; ctx.fillText('ここで閉じる', f.x, f.y+rr+11);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    }
    /* ⑥ いま引いている線の長さ（オレンジ） */
    if(liveOn) drawDimLabel(P[P.length-1], cur,
      f1(edgeLenM(drawPts[drawPts.length-1],{x:mouse.gx,y:mouse.gy},state.scaleM))+'m', OR);
  }
  /* ▭長方形のプレビュー（2026-08-26a）：1つ目の角〜いまの狙いまで点線の枠＋よこ・たての寸法 */
  if(tool==='box' && boxP1){
    const a=boxP1, s=state.scaleM;
    const bx=nnAim.on&&nnAim.g?nnAim.g.x:mouse.gx, by=nnAim.on&&nnAim.g?nnAim.g.y:mouse.gy;
    const X0=gx2px(Math.min(a.x,bx)), Y0=gy2px(Math.min(a.y,by));
    const Wd=Math.abs(gx2px(bx)-gx2px(a.x)), Hd=Math.abs(gy2px(by)-gy2px(a.y));
    ctx.strokeStyle='#b34c00'; ctx.lineWidth=1; ctx.setLineDash([6,5]);
    ctx.strokeRect(X0,Y0,Wd,Hd); ctx.setLineDash([]);
    ctx.fillStyle='rgba(232,118,10,.06)'; ctx.fillRect(X0,Y0,Wd,Hd);
    if(Wd>6 && Hd>6){
      drawDimLabel({x:X0,y:Y0},{x:X0+Wd,y:Y0}, f1(Math.abs(bx-a.x)*s)+'m', '#b34c00');
      drawDimLabel({x:X0,y:Y0},{x:X0,y:Y0+Hd}, f1(Math.abs(by-a.y)*s)+'m', '#b34c00');
    }
    ctx.beginPath(); ctx.arc(gx2px(a.x),gy2px(a.y),3.2,0,7);
    ctx.fillStyle='#b34c00'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
  }
  /* 辺ドラッグ中：元の位置（点線）と動かした量（2026-08-26a） */
  if(edrag){
    ctx.strokeStyle='#8a978c'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(gx2px(edrag.a0.x),gy2px(edrag.a0.y)); ctx.lineTo(gx2px(edrag.b0.x),gy2px(edrag.b0.y));
    ctx.stroke(); ctx.setLineDash([]);
    if(Math.abs(edrag.moved)>1e-9){
      const mx=(gx2px(edrag.a.x)+gx2px(edrag.b.x))/2, my=(gy2px(edrag.a.y)+gy2px(edrag.b.y))/2;
      ctx.font='800 11px sans-serif'; ctx.fillStyle='#b34c00'; ctx.textAlign='center';
      ctx.fillText(f1(Math.abs(edrag.moved)*state.scaleM)+'m 動かしました', mx, my-10);
      ctx.textAlign='left';
    }
  }
  /* スナップ点（マウス用。照準が出ているときは照準に譲る） */
  if((tool==='draw'||(tool==='box'&&!boxP1)) && tab==='zu' && !nnAim.on){
    ctx.beginPath(); ctx.arc(gx2px(mouse.gx),gy2px(mouse.gy),4,0,7);
    ctx.strokeStyle='#e8760a'; ctx.lineWidth=1.4; ctx.stroke();
  }
  /* ★赤い照準：指の右上に出る打点マーク。離すとここに打たれる */
  if((tool==='draw'||tool==='hole'||tool==='box') && nnAim.on && nnAim.g){
    const X=gx2px(nnAim.g.x), Y=gy2px(nnAim.g.y);
    ctx.strokeStyle='rgba(214,30,24,.45)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X-16,Y); ctx.lineTo(X+16,Y);
    ctx.moveTo(X,Y-16); ctx.lineTo(X,Y+16); ctx.stroke();
    ctx.beginPath(); ctx.arc(X,Y,10,0,7);
    ctx.fillStyle='rgba(230,40,30,.18)'; ctx.fill();
    ctx.strokeStyle='rgba(214,30,24,.8)'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.beginPath(); ctx.arc(X,Y,3,0,7);
    ctx.fillStyle='#e02020'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
    if(nnAim.close){
      ctx.font='800 11px sans-serif'; ctx.fillStyle='#c01818';
      ctx.fillText('離すと閉じる', X+14, Y-12);
    }
  }
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
/* ★寸法ラベル（白い座ぶとん付き）を辺の真ん中に出す。
   「線が辺になった」ことがひと目で分かるよう、確定した辺には常時つける。 */
/* ★2026-08-03e 札（寸法・角度）の置き場所と、指で押せる範囲をまとめて管理する。
   ・nnLabBox＝もう置いた札の場所。新しい札が重なるときは外へ逃がす（④の対策）
   ・nnLabHit＝タップで数値を直せる札の当たり判定（②） */
let nnLabBox=[], nnLabHit=[];
function nnPlaceBox(x,y,w,h,dx,dy){
  const hit=(bx,by)=>nnLabBox.some(b=>Math.abs(bx-b.x)<(w+b.w)/2+3 && Math.abs(by-b.y)<(h+b.h)/2+3);
  /* 逃がす向きを4つ試す：外向き → 内向き → 辺に沿って左右
     （割付表示はシートの札が密なので、1方向だけだと逃げ場が無くなる） */
  const px=-dy, py=dx;                       /* 辺に沿った向き */
  const dirs=[[dx,dy],[-dx,-dy],[px,py],[-px,-py]];
  let best={x, y};
  for(const [ux,uy] of dirs){
    let X=x, Y=y, k=0;
    while(hit(X,Y) && k<10){ X+=ux*13; Y+=uy*13; k++; }
    if(!hit(X,Y)){ best={x:X, y:Y}; break; }
  }
  nnLabBox.push({x:best.x, y:best.y, w, h});
  return best;
}
/* ★帯（シート）の中で、札を帯に沿ってだけずらして重なりを避ける。
   lo〜hi の範囲から出ないので、別のシートの上に乗ることはない。 */
function nnSlideLabel(x,y,w,h,horiz,lo,hi){
  const hit=(bx,by)=>nnLabBox.some(b=>Math.abs(bx-b.x)<(w+b.w)/2+3 && Math.abs(by-b.y)<(h+b.h)/2+3);
  const base=horiz?x:y;
  if(!(hi>lo)) return base;
  for(const d of [0,22,-22,44,-44,66,-66,88,-88]){
    const v=Math.max(lo, Math.min(hi, base+d));
    if(!hit(horiz?v:x, horiz?y:v)) return v;
  }
  return base;
}
function drawDimLabel(a,b,txt,col,meta){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  let nx=-(b.y-a.y), ny=(b.x-a.x); const L=Math.hypot(nx,ny)||1; nx/=L; ny/=L;
  ctx.save();
  ctx.font='800 '+(NN_PHONE?12:15.5)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+11, h=NN_PHONE?19:23;
  const p=nnPlaceBox(mx+nx*14, my+ny*14, w, h, nx, ny);
  roundRect(ctx, p.x-w/2, p.y-h/2, w, h, 6);
  ctx.fillStyle='rgba(255,255,255,.94)'; ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=1.1; ctx.stroke();
  ctx.fillStyle=col; ctx.fillText(txt, p.x, p.y);
  ctx.restore();
  if(meta) nnLabHit.push({x:p.x, y:p.y, w:Math.max(w,42), h:30, kind:'dim', i:meta});
}
/* ★角度のしるし：三角定規の図と同じ「角の中の丸い弧＋度数」。
   vtx＝角の頂点、pA・pB＝そこから出ている2本の線の先。 */
function drawAngleMark(vtx,pA,pB,col,meta){
  const l1=Math.hypot(pA.x-vtx.x,pA.y-vtx.y), l2=Math.hypot(pB.x-vtx.x,pB.y-vtx.y);
  if(l1<6||l2<6)return;
  const a1=Math.atan2(pA.y-vtx.y, pA.x-vtx.x);
  const a2=Math.atan2(pB.y-vtx.y, pB.x-vtx.x);
  let d=a2-a1; while(d<=-Math.PI)d+=2*Math.PI; while(d>Math.PI)d-=2*Math.PI;
  const deg=Math.abs(d)*180/Math.PI;
  if(!isFinite(deg)||deg<1)return;
  const R=Math.max(11, Math.min(27, l1*0.42, l2*0.42));
  ctx.save();
  /* 角の中を薄く塗る（どの角の話かが分かる） */
  ctx.beginPath(); ctx.moveTo(vtx.x,vtx.y);
  ctx.arc(vtx.x,vtx.y,R,a1,a2,d<0); ctx.closePath();
  ctx.fillStyle=hexA(col,.16); ctx.fill();
  /* 弧 */
  ctx.beginPath(); ctx.arc(vtx.x,vtx.y,R,a1,a2,d<0);
  ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke();
  /* 度数（角の外側・2等分線の上） */
  const mid=a1+d/2;
  const txt=Math.round(deg)+'°';
  ctx.font='800 '+(NN_PHONE?12.5:15.5)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+9, h=NN_PHONE?19:23;
  const p=nnPlaceBox(vtx.x+Math.cos(mid)*(R+15), vtx.y+Math.sin(mid)*(R+15),
                     w, h, Math.cos(mid), Math.sin(mid));
  roundRect(ctx, p.x-w/2, p.y-h/2, w, h, 6);
  ctx.fillStyle='rgba(255,255,255,.94)'; ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=1.1; ctx.stroke();
  ctx.fillStyle=col; ctx.fillText(txt, p.x, p.y);
  ctx.restore();
  if(meta) nnLabHit.push({x:p.x, y:p.y, w:Math.max(w,42), h:30, kind:'ang', i:meta});
}
/* ★札をタップしたか？（画面に見えているとおりの場所で判定） */
function nnLabelAt(mx,my){
  for(let i=nnLabHit.length-1;i>=0;i--){
    const b=nnLabHit[i];
    if(Math.abs(mx-b.x)<=b.w/2 && Math.abs(my-b.y)<=b.h/2) return b;
  }
  return null;
}
/* ★札をタップしたときに数値で直す。
   ・寸法＝その辺の長さ。あとに続く点はまとめて平行移動する（形はそのまま）
   ・角度＝その角の角度。あとに続く点をその角を中心に回す（長さはそのまま） */
function nnLabelEdit(b){
  /* ★prompt() はiPhoneが日本語キーボードを出してしまうため、自前の入力窓
     nnNumAsk（数字専用キーパッド）に置き換えた（2026-08-06g）。
     窓は後から答えが返る作りなので、続きはコールバックの中で行う。 */
  if(b.kind==='dim'){
    const i=b.i;
    const cur=edgeLenM(drawPts[i-1],drawPts[i],state.scaleM);
    nnNumAsk('この辺の長さ（m）を入力', f1(cur), function(v){
      if(v===null)return;
      const L=parseFloat(String(v).replace(/[^0-9.]/g,''));
      if(!isFinite(L)||L<=0){ toast('数値を入れてください'); return; }
      /* ★2026-08-24z 上限。屋根の1辺が1kmを超えることは無い。
         とんでもない数字を入れると図面が壊れ、描き直しに何秒もかかる。 */
      if(L>1000){ toast('長さは 1000m までです'); return; }
      const a=drawPts[i-1], p=drawPts[i];
      const dx=p.x-a.x, dy=p.y-a.y, len=Math.hypot(dx,dy)||1;
      const k=(L/state.scaleM)/len;
      const ddx=(a.x+dx*k)-p.x, ddy=(a.y+dy*k)-p.y;
      for(let j=i;j<drawPts.length;j++){ drawPts[j].x+=ddx; drawPts[j].y+=ddy; }
      toast('長さを '+f1(L)+'m にしました');
      drawRedo=[]; histBtns(); draw();
    });
  }else{
    const i=b.i;
    const A=drawPts[i-1], V=drawPts[i], B=drawPts[i+1];
    const a1=Math.atan2(A.y-V.y, A.x-V.x), a2=Math.atan2(B.y-V.y, B.x-V.x);
    let d=a2-a1; while(d<=-Math.PI)d+=2*Math.PI; while(d>Math.PI)d-=2*Math.PI;
    const cur=Math.abs(d)*180/Math.PI;
    nnNumAsk('この角の角度（度）を入力', String(Math.round(cur)), function(v){
      if(v===null)return;
      let deg=parseFloat(String(v).replace(/[^0-9.]/g,''));
      if(!isFinite(deg)){ toast('数値を入れてください'); return; }
      deg=Math.max(1, Math.min(179, deg));
      const rot=(d<0?-1:1)*deg*Math.PI/180 - d;
      const c=Math.cos(rot), sn=Math.sin(rot);
      for(let j=i+1;j<drawPts.length;j++){
        const px=drawPts[j].x-V.x, py=drawPts[j].y-V.y;
        drawPts[j]={x:V.x+px*c-py*sn, y:V.y+px*sn+py*c};
      }
      toast('角度を '+Math.round(deg)+'° にしました');
      drawRedo=[]; histBtns(); draw();
    });
  }
  return true;
}
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function polyCenter(pts){ let x=0,y=0; pts.forEach(p=>{x+=p.x;y+=p.y;}); return {x:x/pts.length,y:y/pts.length}; }
/* リング対応：防水面側を向く法線（穴の辺は穴の外側＝屋根面側） */
function ringNormal(poly,rpts,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
  let nx=dy/L, ny=-dx/L;
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  if(!insidePts(poly, mx+nx*0.03, my+ny*0.03)){ nx=-nx; ny=-ny; }
  return {x:nx,y:ny};
}
/* ★2026-08-12d 屋根の輪郭を「壁の厚み＋余白」だけ内側へずらした輪郭を作る。
   平場の継目（はみ出しアス）は、立上りのシートが貼りかかる位置で止めなければならない。
   （立上りが平場に120mm貼りかかるので、その下の継目は隠れて見えないのが実物）
   角は隣の辺とのずらした線どうしの交点＝留め継ぎにする。 */
function nnInsetOutline(poly, rpts, edges, s, extra){
  const N=rpts.length;
  const P=rpts.map(q=>({x:q.x*s, y:q.y*s}));
  const info=[];
  for(let i=0;i<N;i++){
    const e=ek(edges[i]);
    const th=nnWallTh(e);
    /* ★2026-08-23x extra が負のとき＝「固定量だけ細める」モード（床スラブ用）。
       壁の厚みぶん細めると防水面が庇のようにはみ出して「キノコ状」になるため、
       壁の中に隠れる最小量（|extra|）だけ細める。 */
    const off=(e.h>0) ? ((extra<0)?(-extra):(th+extra)) : 0;
    info.push({a:P[i], b:P[(i+1)%N], off:off,
      nrm:ringNormal(poly, rpts, rpts[i], rpts[(i+1)%N])});
  }
  const out=[];
  for(let i=0;i<N;i++){
    const cur=info[i], prv=info[(i+N-1)%N];
    const p1={x:prv.a.x+prv.nrm.x*prv.off, y:prv.a.y+prv.nrm.y*prv.off};
    const d1={x:prv.b.x-prv.a.x, y:prv.b.y-prv.a.y};
    const p2={x:cur.a.x+cur.nrm.x*cur.off, y:cur.a.y+cur.nrm.y*cur.off};
    const d2={x:cur.b.x-cur.a.x, y:cur.b.y-cur.a.y};
    const den=d1.x*d2.y-d1.y*d2.x;
    if(Math.abs(den)<1e-9){ out.push(p2); continue; }
    const t=((p2.x-p1.x)*d2.y-(p2.y-p1.y)*d2.x)/den;
    const ix=p1.x+d1.x*t, iy=p1.y+d1.y*t;
    out.push((Math.hypot(ix-P[i].x, iy-P[i].y) > (prv.off+cur.off)*4+0.3) ? p2 : {x:ix,y:iy});
  }
  return out;
}
/* 辺の内向き単位法線（px空間） */
/* 割り付けストライプ描画（穴・千鳥・シート選択対応） */
function drawBands(poly, pi, sp){
  const s=state.scaleM;
  const ptsM=poly.pts.map(p=>({x:p.x*s, y:p.y*s}));
  const holesM=(poly.holes||[]).map(hh=>hh.pts.map(p=>({x:p.x*s,y:p.y*s})));
  const PDIR=dirOf(poly);
  const lay=wari(ptsM, holesM, sp.sheetW, state.lapMm/1000, state.endLapMm/1000, sp.rollLen, PDIR, state.chidori);
  const H=PDIR==='h';
  const toX=v=>gx2px(v/s), toY=v=>gy2px(v/s);
  ctx.save();
  ctx.beginPath();
  poly.pts.forEach((p,i)=> i? ctx.lineTo(gx2px(p.x),gy2px(p.y)) : ctx.moveTo(gx2px(p.x),gy2px(p.y)));
  ctx.closePath();
  (poly.holes||[]).forEach(hh=>{
    hh.pts.forEach((p,i)=> i? ctx.lineTo(gx2px(p.x),gy2px(p.y)) : ctx.moveTo(gx2px(p.x),gy2px(p.y)));
    ctx.closePath();
  });
  ctx.clip('evenodd');
  let n=0;
  const lapC=hexA(sp.color,.55), cutC=hexA(sp.color,.9);
  lay.bands.forEach((b,bIdx)=>{
    const tint = b.bi%2 ? hexA(sp.color,.26) : hexA(sp.color,.15);
    if(H){ ctx.fillStyle=tint; ctx.fillRect(-99999, toY(b.lo), 999999, toY(b.hi)-toY(b.lo)); }
    else { ctx.fillStyle=tint; ctx.fillRect(toX(b.lo), -99999, toX(b.hi)-toX(b.lo), 999999); }
    if(bIdx>0){
      const lapW=state.lapMm/1000;
      if(H){ ctx.fillStyle=lapC; ctx.fillRect(-99999, toY(b.lo), 999999, Math.max(2,toY(b.lo+lapW)-toY(b.lo))); }
      else { ctx.fillStyle=lapC; ctx.fillRect(toX(b.lo), -99999, Math.max(2,toX(b.lo+lapW)-toX(b.lo)), 999999); }
    }
    b.segs.forEach(sg=>{
      sg.pieces.forEach((pc,pci)=>{
        n++;
        wfHit.push({pi, n, dir:PDIR, lo:b.lo, hi:b.hi, s:pc.s, e:pc.e,
          hasNext:pci<sg.pieces.length-1, hasNextBand:b.hi< (H?Math.max(...ptsM.map(q=>q.y)):Math.max(...ptsM.map(q=>q.x)))-1e-6});
        if(pci>0){
          const prev=sg.pieces[pci-1];
          if(H){
            ctx.fillStyle=lapC; ctx.fillRect(toX(pc.s), toY(b.lo), Math.max(2,toX(prev.e)-toX(pc.s)), toY(b.hi)-toY(b.lo));
            ctx.strokeStyle=cutC; ctx.lineWidth=1.5;
            ctx.beginPath(); ctx.moveTo(toX(pc.s), toY(b.lo)); ctx.lineTo(toX(pc.s), toY(b.hi)); ctx.stroke();
          }else{
            ctx.fillStyle=lapC; ctx.fillRect(toX(b.lo), toY(pc.s), toX(b.hi)-toX(b.lo), Math.max(2,toY(prev.e)-toY(pc.s)));
            ctx.strokeStyle=cutC; ctx.lineWidth=1.5;
            ctx.beginPath(); ctx.moveTo(toX(b.lo), toY(pc.s)); ctx.lineTo(toX(b.hi), toY(pc.s)); ctx.stroke();
          }
        }
        /* 選択中シートのハイライト */
        if(wfSel && wfSel.pi===pi && wfSel.n===n){
          ctx.fillStyle='rgba(26,115,232,.35)';
          if(H)ctx.fillRect(toX(pc.s),toY(b.lo),toX(pc.e)-toX(pc.s),toY(b.hi)-toY(b.lo));
          else ctx.fillRect(toX(b.lo),toY(pc.s),toX(b.hi)-toX(b.lo),toY(pc.e)-toY(pc.s));
          ctx.strokeStyle='#1a73e8'; ctx.lineWidth=2.5;
          if(H)ctx.strokeRect(toX(pc.s),toY(b.lo),toX(pc.e)-toX(pc.s),toY(b.hi)-toY(b.lo));
          else ctx.strokeRect(toX(b.lo),toY(pc.s),toX(b.hi)-toX(b.lo),toY(pc.e)-toY(pc.s));
        }
        const plenPx=(H?toX(pc.e)-toX(pc.s):toY(pc.e)-toY(pc.s));
        const bandPx=(H?toY(b.hi)-toY(b.lo):toX(b.hi)-toX(b.lo));
        if(plenPx>=(nnWfDimOn()?52:26) && bandPx>=13){
          /* ★2026-08-08d 1枚あたりの寸法は既定で出さない（番号だけ）。
             ツールバーの「📏 寸法」で出し入れできる。 */
          const label=nnWfDimOn()?`${circled(n)} ${f1(pc.e-pc.s)}m`:`${circled(n)}`;
          ctx.font='800 11px sans-serif';
          if(H){
            let lx=(toX(pc.s)+toX(pc.e))/2; const ly=(toY(b.lo)+toY(b.hi))/2;
            const tw=ctx.measureText(label).width;
            /* ★シート番号の札は「そのシートの帯の中」に置くのが正しいので、
               逃がすときも帯に沿って左右にずらすだけにする（帯から出さない）。 */
            lx=nnSlideLabel(lx, ly, tw+8, 15, true,
                            toX(pc.s)+(tw+8)/2+2, toX(pc.e)-(tw+8)/2-2);
            nnLabBox.push({x:lx, y:ly, w:tw+8, h:15});
            ctx.fillStyle='rgba(255,255,255,.88)'; ctx.fillRect(lx-tw/2-4, ly-8, tw+8, 15);
            ctx.fillStyle='#3a352f'; ctx.textAlign='center'; ctx.fillText(label, lx, ly+3.5); ctx.textAlign='left';
          }else{
            const lx=(toX(b.lo)+toX(b.hi))/2; let ly=(toY(pc.s)+toY(pc.e))/2;
            const tw0=ctx.measureText(label).width;
            ly=nnSlideLabel(lx, ly, 15, tw0+8, false,
                            toY(pc.s)+(tw0+8)/2+2, toY(pc.e)-(tw0+8)/2-2);
            nnLabBox.push({x:lx, y:ly, w:15, h:tw0+8});   /* 縦書きなので幅と高さが逆 */
            ctx.save(); ctx.translate(lx,ly); ctx.rotate(Math.PI/2);
            const tw=ctx.measureText(label).width;
            ctx.fillStyle='rgba(255,255,255,.88)'; ctx.fillRect(-tw/2-4,-8,tw+8,15);
            ctx.fillStyle='#3a352f'; ctx.textAlign='center'; ctx.fillText(label,0,3.5); ctx.textAlign='left';
            ctx.restore();
          }
        }
      });
    });
    ctx.strokeStyle=hexA(sp.color,.75); ctx.lineWidth=1;
    if(H){ ctx.beginPath(); ctx.moveTo(-99999,toY(b.lo)); ctx.lineTo(999999,toY(b.lo)); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(toX(b.lo),-99999); ctx.lineTo(toX(b.lo),999999); ctx.stroke(); }
  });
  ctx.restore();
}

<script>

/* ★スナップ：打点は必ず方眼の「交差点」（1マス単位）。

   もっと細かく打ちたいときは「1マス＝0.25m」に変える。 */
function snapG(v){ return Math.round(v); }
/* ★2026-08-08b→c 打点の決め方を「方眼の交差点」から
   「直前の点からの 角度5度きざみ ＋ 長さ10cmきざみ」に変えた。

   《なぜ変えたか》
   交差点にしか打てないと、直前の点から引ける向きが交差点の並びで決まってしまい、
   90度の次は135度…と飛び、その間の角度が**物理的に選べなかった**。
   （方眼の引力が強すぎる、という指摘。実際そのとおりだった）

   《いまの決まり》
   ・1点目 … 今までどおり方眼の交差点（図面が方眼に対してまっすぐ始まる）
   ・2点目以降 … 直前の点から見た
        角度＝5度きざみ（0/5/10…355度。0度＝右、90度＝下）
        長さ＝10cmきざみ（1マスが0.25m以下のときは5cmきざみ）
     ＝ どの向きにも引けて、寸法も角度もキリのいい数字になる。
   ・0度・90度・180度・270度も5の倍数なので、**真横・真下は今までどおり必ず引ける**。
   ・既存の角への吸着（nnResolvePoint の vertexMagnet）と「ここで閉じる」は今までどおり。
   ★モードではなく常時この動き（切り替えは無し）。 */
const NN_ANG_STEP=5;                 /* 角度のきざみ（度） */
/* ★2026-08-08d 頂点の位置を直すときは 1マス単位では粗すぎる（1マス＝1mだと1m単位）。
   細かい作業なので 0.1m 単位（1マス0.25m以下なら0.05m単位）にする。 */
function nnSnapMove(v){
  const st=Math.max(1e-6, nnLenStepM()/(state.scaleM||1));
  return Math.round(v/st)*st;
}
function nnLenStepM(){ return (state.scaleM<=0.25)?0.05:0.1; }   /* 長さのきざみ（m） */
function nnSnapPt(rawx, rawy){
  nnAlignHit=null;
  const g={x:snapG(rawx), y:snapG(rawy)};
  /* ★2026-08-26a ▭長方形の角は「方眼の交差点＋既存の角への吸着」。
     隣の屋根の角に吸い付くので、続けてかけばぴったり繋がる。 */
  if(tool==='box') return vertexMagnet(g);
  if(tool!=='draw' && tool!=='hole') return g;
  if(!drawPts.length) return g;                 /* 1点目は方眼の交差点 */
  const prev=drawPts[drawPts.length-1];
  const dx=rawx-prev.x, dy=rawy-prev.y;
  const len=Math.hypot(dx,dy);
  if(len<1e-9) return {x:prev.x, y:prev.y};
  /* 角度を5度きざみに丸める。★Shiftを押している間は90度きざみ＝水平・垂直だけ */
  const stepA=(typeof mouse!=='undefined'&&mouse.shift)?90:NN_ANG_STEP;
  const deg=Math.round(Math.atan2(dy,dx)*180/Math.PI/stepA)*stepA;
  const rad=deg*Math.PI/180;
  /* 長さを10cm（または5cm）きざみに丸める。0にはしない */
  const stepG=Math.max(1e-6, nnLenStepM()/(state.scaleM||1));
  const L=Math.max(stepG, Math.round(len/stepG)*stepG);
  const r6=v=>Math.round(v*1e6)/1e6;            /* 小数の誤差を落とす */
  const c={x:r6(prev.x+Math.cos(rad)*L), y:r6(prev.y+Math.sin(rad)*L)};
  return nnAlignSnap(prev, c, rawx, rawy);
}
/* ★2026-08-13m 「そろえる線」（始点や既存の角の真上・真下・真横）に止まるようにした
   《なぜ要るか》
   角度5度きざみ・長さ10cmきざみだけだと、打点は「直前の点から見た位置」で決まるので、
   始点の真下（＝x が始点とぴったり同じ）に止められる保証がまったく無かった。
   最後の1点を始点の真下に置きたいのに、いくら狙っても数cmずれる
   ＝閉じる辺が垂直にならない（本人の指摘「垂直方向のところに止まらない」）。
   《決まり》
   ・そろえる相手＝始点／作図中の他の点／既存の部位の角（直前の点は除く。
     直前の点の真下・真横は 90度・0度の角度きざみでもともと引けるため）。
   ・狙いが「相手の真上・真下・真横の線」から画面12px以内なら、その線にぴたりと止める。
     ①線と交わる向きに引いているとき＝角度はそのまま・長さだけ合わせる
     ②線とほぼ平行に引いているとき（真下へ下ろす等）＝横へ寄せて線に載せる
   ・始点を最優先（閉じるために使うのはたいてい始点だから）。
   ★このときだけ「長さ10cmきざみ」を外れる。狙ったところに止まることのほうが大事。
   ★画面には紫の細い線（そろえた相手までの目印）が出るので、なぜ止まったかが分かる。 */
var nnAlignHit=null;   /* ★var＝巻き上げ。draw() はこの行より前にあるが、先に呼ばれても落ちない */
function nnAlignTargets(){
  const out=[];
  for(let i=0;i<drawPts.length-1;i++) out.push({p:drawPts[i], pri:(i===0?0:1)});
  try{ state.polys.forEach(p=>ringsOf(p).forEach(r=>r.pts.forEach(pt=>out.push({p:pt, pri:2})))); }catch(e){}
  return out;
}
function nnAlignSnap(prev, c, rawx, rawy){
  if(!(cellPx>0)) return c;
  const TOL=Math.min(12/cellPx, 0.8);           /* 画面12px（広げすぎない） */
  const ux=c.x-prev.x, uy=c.y-prev.y;
  const L0=Math.hypot(ux,uy); if(L0<1e-9) return c;
  const nx=ux/L0, ny=uy/L0;
  const minL=Math.max(1e-6, nnLenStepM()/(state.scaleM||1))*0.5;
  let bx=null, by=null;
  const consider=(t, axis)=>{
    const val  = axis==='x' ? t.p.x : t.p.y;
    const dcmp = axis==='x' ? nx   : ny;
    const base = axis==='x' ? prev.x : prev.y;
    let cand=null;
    if(Math.abs(dcmp)>0.2){                     /* 線と交わる向き＝長さだけ合わせる */
      const tt=(val-base)/dcmp;
      if(tt>minL) cand={x:prev.x+nx*tt, y:prev.y+ny*tt};
    }else{                                      /* 線とほぼ平行＝横へ寄せて線に載せる */
      cand = axis==='x' ? {x:val, y:c.y} : {x:c.x, y:val};
    }
    if(!cand) return;
    if(Math.hypot(cand.x-prev.x, cand.y-prev.y) < minL) return;
    const d=Math.hypot(cand.x-rawx, cand.y-rawy);
    if(d>=TOL) return;
    const b={x:cand.x, y:cand.y, score:d*(1+t.pri*0.15), axis, val, t:t.p};
    if(axis==='x'){ if(!bx||b.score<bx.score) bx=b; } else { if(!by||b.score<by.score) by=b; }
  };
  const T=nnAlignTargets();
  T.forEach(t=>consider(t,'x'));
  T.forEach(t=>consider(t,'y'));
  const r6=v=>Math.round(v*1e6)/1e6;
  /* ★たてとよこ、両方に相手がいるときは「その交わる点」に置く。
     ＝いま引く辺は水平（相手の高さにそろう）、閉じる辺は垂直（始点の真下）になる。
     どちらか片方だけを選ぶと、もう片方が数cmずれて図面が閉じない。 */
  if(bx && by){
    const ip={x:bx.val, y:by.val};
    if(Math.hypot(ip.x-rawx, ip.y-rawy) < TOL*1.5 && Math.hypot(ip.x-prev.x, ip.y-prev.y) > minL){
      const g={x:r6(ip.x), y:r6(ip.y)};
      nnAlignHit={g, lines:[{axis:'x',val:bx.val,t:bx.t},{axis:'y',val:by.val,t:by.t}]};
      return g;
    }
  }
  const best = (!bx) ? by : (!by ? bx : (bx.score<=by.score?bx:by));
  if(!best) return c;
  const g={x:r6(best.x), y:r6(best.y)};
  nnAlignHit={g, lines:[{axis:best.axis, val:best.val, t:best.t}]};
  return g;
}
/* ★頂点の磁石（2026-08-06i 弱めた）：
   打点はもともと方眼の交差点に丸まる（snapG）ので、格子の上にある頂点とは
   磁石が無くても一致する。磁石が要るのは「数値入力で格子から外れた頂点」だけ。
   以前は画面26px（縮小表示だと1マス以上）で吸っていたため、既存の屋根の
   近くに2棟目をかくと頂点に持っていかれ、まっすぐな線が引けなかった。
   ※図形を閉じる磁石は nnResolvePoint 側（26pxのまま）なので影響しない。 */
function vertexMagnet(g){
  const R=Math.min(12/cellPx, 0.45);     /* 半マスを上限に、画面12px分だけ */
  let best=null, bd=R;
  const test=(pt)=>{ const d=Math.hypot(pt.x-g.x, pt.y-g.y); if(d<bd){ bd=d; best={x:pt.x,y:pt.y}; } };
  if(drawPts.length>=3) test(drawPts[0]);            /* 始点（閉じる用） */
  state.polys.forEach(p=>ringsOf(p).forEach(r=>r.pts.forEach(test)));
  return best||g;
}
/* ★打点の解決（2026-08-02d）
   ・向きの制限は無し＝好きな向きに直線が引ける（斜めもOK）
   ・ただし打点は必ず方眼の交差点（snapG が1マス単位に丸める）
   ・既存の屋根の角が画面26px以内にあれば、そこへ吸い付く（隣とぴったり繋がる）
   ・始点の近く（画面26px）なら「閉じる」扱いにする */
function nnResolvePoint(gx,gy,rx,ry){
  const g={x:gx, y:gy};
  if(drawPts.length>=3){
    const f=drawPts[0];
    const R=Math.max(0.6, 26/cellPx);
    /* ★2026-08-23q 始点に戻れない不具合の修正（本人の指摘）。
       打点は「角度5度きざみ・長さ10cmきざみ」に丸めるので、始点を狙っても
       丸めたあとの座標が始点から離れ、閉じられないことがあった（大きな図面ほど顕著）。
       丸める前の狙い（生の座標）でも始点判定する。 */
    if(Math.hypot(g.x-f.x, g.y-f.y) < R) return {g:{x:f.x,y:f.y}, close:true};
    if(rx!=null && Math.hypot(rx-f.x, ry-f.y) < R) return {g:{x:f.x,y:f.y}, close:true};
  }
  return {g:vertexMagnet(g), close:false};
}
/* 図形を閉じる（自由な直線なので、そのまま始点へ結べばよい） */
function closeShape(kind){
  if(kind==='hole') closeHole(); else closePoly();
}

  try{ if(window.nnScaleLabel)nnScaleLabel(); }catch(e){} }
function setSpec(c){ state.specCode=c; wfSel=null; renderWfSel(); saveState(); renderSpec(); draw(); }
/* ★2026-08-06k シートの流し方向は「部位ごと」に決められる。
   poly.dir が 'h'（横流し）／'v'（縦流し）／'short'（短手に流す）なら
   その部位だけその向き。未設定なら全体の設定（state.dir）に従う。
   'short'＝その部位の外接四角形の短い辺に沿ってロールを流す
   （横長の屋根なら縦流し・縦長の屋根なら横流し）。 */
function shortDir(poly){
  let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  ((poly&&poly.pts)||[]).forEach(p=>{ mnx=Math.min(mnx,p.x); mxx=Math.max(mxx,p.x);
                                      mny=Math.min(mny,p.y); mxy=Math.max(mxy,p.y); });
  if(mxx<mnx)return state.dir==='v'?'v':'h';
  return ((mxx-mnx)>=(mxy-mny))?'v':'h';        /* 横長→縦流し／縦長→横流し */
}
function dirOf(poly){
  const d=(poly&&poly.dir)||'';
  if(d==='h'||d==='v')return d;
  if(d==='short')return shortDir(poly);
  if(state.dir==='short')return shortDir(poly);  /* 全体で「短手」を選んだとき */
  return state.dir==='v'?'v':'h';
}
const DIR_LB={h:'横流し', v:'縦流し'};

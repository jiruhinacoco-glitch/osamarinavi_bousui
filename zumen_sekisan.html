/* ---------- 図面に置く ---------- */
function startPlace(id, byUser){
  /* ★2026-08-28e もう一度押したら「置くのをやめる」。
     ただし §180 の教訓どおり、解除するのは**ボタンを押したとき（byUser）だけ**。
     プログラムの中から続けて呼ばれたときに裏返ると、置けなくなる。 */
  if(byUser && placing===id){ nnPlaceStop(); toast('置くのをやめました'); return; }
  placing=id; sel=-1; bar();
  const side=document.getElementById('side');
  if(side) side.classList.remove('open');          /* スマホは引き出しを閉じて作図面を出す */
  toast((typeof tab!=='undefined'&&tab==='d3'?'3Dの屋根をタップすると「':'図面をタップすると「')+(byId(id)||{}).name+'」を置きます');
}
/* ★キャンバスの当たり判定は、本体の作図処理より先に取る（capture）。
     置く操作のときだけ横取りし、それ以外は素通りさせる。 */
function canvasXY(e){
  const cv=document.getElementById('cv');
  const r=cv.getBoundingClientRect();
  const kx=r.width ? (cv.width/(window.devicePixelRatio||1))/r.width : 1;
  const ky=r.height? (cv.height/(window.devicePixelRatio||1))/r.height : 1;
  return {x:(e.clientX-r.left)*kx, y:(e.clientY-r.top)*ky};
}
let hi=[];                       /* 範囲選択でまとめて選んだ役物の番号 */
function hitPart(gx,gy){
  const s=state.scaleM;
  for(let i=(state.parts||[]).length-1;i>=0;i--){
    const it=state.parts[i], P=byId(it.p); if(!P) continue;
    const a=-(it.r||0)*Math.PI/180;
    const dx=gx-it.x, dy=gy-it.y;
    const ux= dx*Math.cos(a)-dy*Math.sin(a), uy= dx*Math.sin(a)+dy*Math.cos(a);
    if(Math.abs(ux)<=(P.w/1000)/s/2 && Math.abs(uy)<=(P.d/1000)/s/2) return i;
  }
  return -1;
}
function onCanvasDown(e){
  const cv=document.getElementById('cv'); if(!cv) return;
  const p=canvasXY(e);
  const gx=(p.x-ox)/cellPx, gy=(p.y-oy)/cellPx;
  if(placing){
    e.preventDefault(); e.stopPropagation();
    state.parts=state.parts||[];
    state.parts.push({p:placing, x:Math.round(gx*10)/10, y:Math.round(gy*10)/10, r:0});
    const nm=(byId(placing)||{}).name||'';
    /* ★2026-08-28e 続けて置けるようにした（置くモードを終わらせない）。
       脱気筒は「100㎡に1箇所」、ドレンも複数あるのがふつうで、
       1個ごとにボタンを押し直すのは手間だった（巡回で発見）。
       終わるのは Esc／同じボタンをもう一度／道具を変えたとき。 */
    sel=state.parts.length-1;
    saveState(); draw(); bar();
    toast('「'+nm+'」を置きました（続けて置けます／Esc で終わり）');
    return;
  }
  /* ★2026-08-16g ツールの名前は 'sel'。'select' を見ていたので、
     「選択」にしても役物には永久に当たらなかった（＝選べない・消せない）。 */
  if(typeof tool!=='undefined' && (tool==='sel'||tool==='select')){
    const i=hitPart(gx,gy);
    if(i>=0){ e.preventDefault(); e.stopPropagation(); sel=i; draw(); bar(); return; }
  }
  if(sel>=0){ sel=-1; bar(); draw(); }
}
/* ---------- 選んだときの操作バー ---------- */
function bar(){
  let b=document.getElementById('nnPartBar');
  if(!b){
    b=document.createElement('div'); b.id='nnPartBar';
    b.innerHTML='<span class="nm"></span>'
      +'<button type="button" data-b="rot">⟲ 90°回す</button>'
      +'<button type="button" data-b="dup">⧉ 複製</button>'
      +'<button type="button" class="del" data-b="del">🗑 削除</button>'
      +'<button type="button" data-b="close">✕</button>';
    document.body.appendChild(b);
    b.querySelectorAll('button').forEach(x=>x.addEventListener('click',()=>{
      const a=x.dataset.b, it=(state.parts||[])[sel];
      if(a==='close'||!it){ sel=-1; bar(); draw(); return; }
      if(a==='rot'){ it.r=((it.r||0)+90)%360; }
      else if(a==='dup'){ state.parts.push({p:it.p, x:it.x+1, y:it.y+1, r:it.r||0}); sel=state.parts.length-1; }
      else if(a==='del'){ state.parts.splice(sel,1); sel=-1; }
      saveState(); draw(); bar();
    }));
  }
  const it=(state.parts||[])[sel], P=it&&byId(it.p);
  if(!P){ b.classList.remove('on'); return; }
  b.querySelector('.nm').textContent=P.name||'';
  b.classList.add('on');
}
/* ---------- 図面に描く ---------- */
function drawParts(){
  if(!state.parts||!state.parts.length) return;
  /* ★2026-08-13d タブ名は 'zu'（'draw'ではない）。取り違えで①図面タブに役物が一切出ていなかった */
  if(typeof tab!=='undefined' && tab!=='zu' && tab!=='wf') return;
  const s=state.scaleM, cv=document.getElementById('cv');
  const ctx2=cv&&cv.getContext('2d'); if(!ctx2) return;
  state.parts.forEach((it,i)=>{
    const P=byId(it.p); if(!P) return;
    const w=(P.w/1000)/s*cellPx, h=(P.d/1000)/s*cellPx;
    ctx2.save();
    ctx2.translate(ox+it.x*cellPx, oy+it.y*cellPx);
    ctx2.rotate((it.r||0)*Math.PI/180);
    const on=(i===sel)||hi.indexOf(i)>=0;
    ctx2.fillStyle   = on?'rgba(255,193,7,.34)':'rgba(20,68,156,.14)';
    ctx2.strokeStyle = on?'#e08b00':'#14449c';
    ctx2.lineWidth   = on?3:2;
    ctx2.fillRect(-w/2,-h/2,w,h);
    ctx2.strokeRect(-w/2,-h/2,w,h);
    /* 対角線（役物の記号） */
    ctx2.lineWidth=1; ctx2.beginPath();
    ctx2.moveTo(-w/2,-h/2); ctx2.lineTo(w/2,h/2);
    ctx2.moveTo(w/2,-h/2);  ctx2.lineTo(-w/2,h/2); ctx2.stroke();
    ctx2.restore();
    /* 名前は回さずに水平で書く（読みやすさ優先）。
       ★小さい役物は箱の上に出す（中に入らず「どこに置いたか分からない」ため） */
    {
      const tx=ox+it.x*cellPx, ty=oy+it.y*cellPx;
      const small=Math.min(w,h)<16;
      ctx2.save();
      ctx2.font='700 '+(NN_PHONE?11:12.5)+'px system-ui,sans-serif'; ctx2.textAlign='center'; ctx2.textBaseline='middle';
      ctx2.lineWidth=3; ctx2.strokeStyle='rgba(255,255,255,.9)';
      const ly=small? ty-h/2-10 : ty;
      ctx2.strokeText(P.name, tx, ly); ctx2.fillStyle=on?'#c96a00':'#14449c'; ctx2.fillText(P.name, tx, ly);
      ctx2.restore();
    }
  });
}
/* ---------- 3Dに出す ---------- */
function levelAt(gx,gy){
  let lv=0;
  state.polys.forEach(p=>{ if(insidePts(p,gx,gy)) lv=Math.max(lv,+p.lv||0); });
  return lv;
}
function parts3D(){
  if(typeof T==='undefined'||!T||!T.group) return;
  if(typeof THREE==='undefined') return;
  if(!state.parts||!state.parts.length) return;
  const s=state.scaleM;
  state.parts.forEach((it,pi)=>{
    const P=byId(it.p); if(!P) return;
    const h=(+P.h||0)/1000; if(h<=0.01) return;      /* 平らな役物は箱にしない */
    const w=(+P.w||0)/1000, d=(+P.d||0)/1000;
    const lv=levelAt(it.x,it.y);
    const gm=new THREE.BoxGeometry(w,h,d);
    const m=new THREE.Mesh(gm, nnMat('concrete', 0xb4aea2, false));
    m.position.set(it.x*s, lv+0.02+h/2, it.y*s);
    m.rotation.y=-(it.r||0)*Math.PI/180;
    m.castShadow=true; m.receiveShadow=true;
    m.name='nnPart';
    m.userData.partIdx=pi;    /* ★2026-08-16h 3Dでタップして選べるように番号を持たせる */
    T.group.add(m);
  });
}
/* ---------- 積算に足す ---------- */
function partsTable(){
  const host=document.getElementById('sekisan'); if(!host) return;
  const old=document.getElementById('nnPartsQt'); if(old) old.remove();
  const cnt={};
  (state.parts||[]).forEach(it=>{ cnt[it.p]=(cnt[it.p]||0)+1; });
  const ids=Object.keys(cnt); if(!ids.length) return;
  let sum=0, addM2=0, sealM=0;
  const tr=ids.map(id=>{
    const P=byId(id); if(!P) return '';
    const n=cnt[id], amt=n*(+P.price||0);
    sum+=amt; addM2+=n*(+P.addM2||0); sealM+=n*(+P.sealM||0);
    return '<tr><td>'+esc(P.name)+'</td><td class="num">'+n+' 個</td>'
      +'<td class="num">'+fmtY(P.price)+'</td><td class="num">'+fmtY(amt)+'</td></tr>';
  }).join('');
  const d=document.createElement('div'); d.id='nnPartsQt';
  d.innerHTML='<h5>🔩 役物・架台</h5><table><tr><th>名称</th><th>数量</th><th>単価</th><th>金額</th></tr>'+tr
    +'</table><div style="font-size:11.5px;color:var(--ink-sub,#5b6b5e);margin-top:5px;line-height:1.7;">'
    +'まわりの増し貼り 合計 '+(Math.round(addM2*10)/10)+' ㎡／シール 合計 '+(Math.round(sealM*10)/10)+' m'
    +'（上の平場・立上りとは別に見ておく手間です）</div>';
  host.appendChild(d);
}

/* ---------- 本体の処理に相乗りする ---------- */
function hook(){
  const cv=document.getElementById('cv');
  if(cv && !cv._nnPartsHooked){
    cv._nnPartsHooked=true;
    cv.addEventListener('pointerdown', onCanvasDown, true);
  }
  if(!window._nnPartsWrapped){
    window._nnPartsWrapped=true;
    const _draw=window.draw;
    window.draw=function(){ const r=_draw.apply(this,arguments); try{ drawParts(); }catch(e){} return r; };
    const _b3=window.build3D;
    if(typeof _b3==='function') window.build3D=function(){ const r=_b3.apply(this,arguments); try{ parts3D(); }catch(e){} return r; };
    const _rc=window.recalc;
    if(typeof _rc==='function') window.recalc=function(){ const r=_rc.apply(this,arguments); try{ partsTable(); }catch(e){} return r; };
  }
}
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  state.parts=Array.isArray(state.parts)?state.parts.filter(x=>x&&x.p):[];

}

function hookExt(){
  if(typeof THREE==='undefined'||!T||!T.renderer)return;

    const sM=state.scaleM||0.5;
    const gx=hit.point.x/sM, gy=hit.point.z/sM;
    nnNumAsk('押し出し：幅（m）','2',function(w){ if(w===null)return;
      nnNumAsk('押し出し：奥行（m）','0.5',function(d){ if(d===null)return;
        nnNumAsk('押し出し：高さ（m）','0.6',function(h){ if(h===null)return;
          /* ★2026-08-24z 上限もつける（打ち間違いで巨大な箱ができないように） */
          w=Math.max(0.05,Math.min(200,+w||1)); d=Math.max(0.05,Math.min(200,+d||0.5)); h=Math.max(0,Math.min(200,+h||0.5));
          const name='押出し '+w+'×'+d+'×'+h+'m';
          let it=(window.nnPartsLib? nnPartsLib().find(x=>x.name===name) : null);
          if(!it && window.nnPartsAddLib){
            it=nnPartsAddLib({id:'x'+Date.now().toString(36), name, kind:'other',
              w:Math.round(w*1000), d:Math.round(d*1000), h:Math.round(h*1000),
              price:0, addM2:0, sealM:0, memo:'3Dの押し出しで作成'});
          }
          if(!it){ toast('役物の登録に失敗しました'); return; }
          state.parts=state.parts||[];
          state.parts.push({p:it.id, x:Math.round(gx*10)/10, y:Math.round(gy*10)/10, r:0});
          saveState(); draw(); try{ build3D(); }catch(_){}
          toast('置きました：'+name+'（2D図面の同じ位置にも出ています。役物と同じく移動・削除できます）');
        });});});
  });
}
setInterval(hookExt,800);
})();
</script>

<script id="nn-3dedit-js">
/* ============================================================
   ⑪ 3Dで辺をタップ → その辺だけ立上り高さ・水切りアゴを編集
   ★3Dの組み立て（build3D）には手を入れず、できあがった上に
     「見えない当たり判定」「アゴの立体」「選択の色」を後から載せる。
     こうしておくと、3Dの作りが変わってもこの機能は壊れない。
   ============================================================ */
(function(){
  var deco=null;              /* 飾り専用のまとまり（毎回作り直す） */

  function three(){ return (typeof THREE!=='undefined') && T && T.scene; }

  /* 飾りを入れる箱を用意（3Dの本体とは別に持つので、組み直されても消えない） */
  /* ★2026-08-24i 飾り（当たり判定・赤いハイライト）の材質は使い回す */
  var _decoMats={};
  function nnDecoMat(k){
    if(_decoMats[k]) return _decoMats[k];
    var m;
    if(k==='inv') m=new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false});
    else          m=new THREE.MeshBasicMaterial({color:0xff4136, transparent:true,
                        opacity:0.42, depthTest:false, side:THREE.DoubleSide});
    m.userData.nnShared=1; _decoMats[k]=m; return m;
  }
  function decoGroup(){
    if(!three())return null;
    if(!deco || deco.parent!==T.scene){ deco=new THREE.Group(); T.scene.add(deco); }
    while(deco.children.length){
      var c=deco.children[0];
      /* ★2026-08-24i 形だけ解放する。材質を捨てると three.js が組み立てた
         シェーダーまで解放され、次のコマで作り直しになる（実測：組み直し1回に
         つきシェーダー2本を再コンパイル＝これがドラッグ中のフリーズの正体）。
         材質は下の3つを使い回すので溜まらない。 */
      if(c.geometry && !c.geometry.userData.nnShared && c.geometry.dispose)c.geometry.dispose();
      deco.remove(c);
    }
    return deco;
  }

  /* 辺1本ぶんの位置と向き（3D本体と同じ計算のしかたにそろえてある） */
  function edgeGeom(poly, ring, i){
    var s=state.scaleM, N=ring.pts.length;
    var e=ek(ring.edges[i]);
    var a={x:ring.pts[i].x*s, y:ring.pts[i].y*s};
    var b={x:ring.pts[(i+1)%N].x*s, y:ring.pts[(i+1)%N].y*s};
    return { e:e, a:a, b:b,
      len:Math.hypot(b.x-a.x,b.y-a.y),
      hh:e.h/1000,
      th:nnWallTh(e),
      lv:+poly.lv||0,
      nrm:ringNormal(poly, ring.pts, ring.pts[i], ring.pts[(i+1)%N]),
      ang:Math.atan2(b.y-a.y, b.x-a.x) };
  }

  function put(g, geo, mat, cx, cy, cz, ang, pk){
    var m=new THREE.Mesh(geo, mat);
    m.position.set(cx, cy, cz); m.rotation.y=-ang;
    if(pk)m.userData.pick=pk;
    g.add(m); return m;
  }
  /* ★2026-08-24z 見えない当たり判定の箱は「1辺1mの箱を1つ」だけ作って、
     大きさを変えて使い回す。作り直すたびに箱を400個も作って捨てていたので、
     指を動かすたびに引っかかる原因になっていた（実測：屋根20面で1回22ms）。 */
  var _unitBox=null;
  function unitBox(){
    if(!_unitBox){ _unitBox=new THREE.BoxGeometry(1,1,1);
      _unitBox.userData.nnShared=1;
      _unitBox.userData.nnKeep=1;   /* ずっと使い回す（置き場から出ていくことはない）印 */ }
    return _unitBox;
  }
  function putBox(g, w, h, d, mat, cx, cy, cz, ang, pk){
    var m=put(g, unitBox(), mat, cx, cy, cz, ang, pk);
    m.scale.set(Math.max(w,1e-4), Math.max(h,1e-4), Math.max(d,1e-4));
    return m;
  }

  /* 飾りを作り直す（当たり判定・アゴ・選択色） */
  window.nn3dSync=function(){
    if(!three())return;
    var g=decoGroup(); if(!g)return;
    (state.polys||[]).forEach(function(poly,pi){
      /* ★2026-08-23u 平場を選んでいるときは、その平場を赤く塗る（他の面と同じ見せ方） */
      if(nnIsSel({p:pi,r:-1,e:-1,f:'deck'})){
        try{
          var sM=state.scaleM||0.5;
          /* ★2026-08-24c 赤くするのは「平場」だけ。輪郭のままだと天端（パラペットの上）まで
             赤く見える（ハイライトは depthTest なしで手前に描くため）。
             立上りの内側の線まで細めてから塗る。 */
          var _dp=poly.pts.map(function(q){return new THREE.Vector2(q.x*sM,q.y*sM);});
          try{ var _ip=nnInsetOutline(poly, poly.pts, poly.edges, sM, 0.006);
               if(_ip && _ip.length>=3) _dp=_ip.map(function(q){return new THREE.Vector2(q.x,q.y);}); }catch(_){}
          var shp=new THREE.Shape(_dp);
          (poly.holes||[]).forEach(function(h){ shp.holes.push(new THREE.Path(
            h.pts.map(function(q){return new THREE.Vector2(q.x*sM,q.y*sM);}))); });
          var dg=new THREE.ShapeGeometry(shp); dg.rotateX(Math.PI/2);
          var dm=new THREE.Mesh(dg, nnDecoMat('red'));
          dm.position.y=(+poly.lv||0)+0.03; dm.renderOrder=999;
          dm.userData.pick={p:pi,r:-1,e:-1,f:'deck'}; dm.userData.face='deck';
          g.add(dm);
        }catch(_){}
      }
      ringsOf(poly).forEach(function(ring){
        for(var i=0;i<ring.pts.length;i++){
          var G=edgeGeom(poly,ring,i), e=G.e, pk={p:pi, r:ring.r, e:i};
          var mx=(G.a.x+G.b.x)/2, mz=(G.a.y+G.b.y)/2;
          if(G.len<0.02)continue;

          /* ① 見えない当たり判定。立上りが無い辺も選べるように必ず置く。
             ★2026-08-23k 壁（躯体）の面ぜんぶを対象にする。以前は立上り300mmの帯しか
                無かったので、塔屋の壁の真ん中をクリックしても何も選べなかった（本人の指摘）。 */
          /* ★2026-08-23z 壁は「躯体＋床スラブ」の高さぶん見えている。
             平場の高さ（lv）で測る。§2026-08-24p で高さの持ち主を lv に一本化した。 */
          var _bl0=(+poly.lv||0);   /* ★2026-08-24p 高さは lv に一本化 */
          var _b0=nnBaseLvOf(poly);
          var wallH0=Math.max(0, _bl0-_b0);
          var pth=Math.min(2.0, Math.max(0.4, G.len*0.04));
          var ph=wallH0+Math.max(G.hh,0.3);
          var inv=nnDecoMat('inv');
          /* ★2026-08-23r 面ごとに当たり判定を分ける（外壁／立上りの内側／天端）。
             どの面をつかんだかで、ドラッグの意味が変わる。 */
          putBox(g, G.len, ph, 0.30, inv,
              mx-G.nrm.x*0.14, _b0+ph/2, mz-G.nrm.y*0.14, G.ang,
              {p:pk.p,r:pk.r,e:pk.e,f:'out'});
          if(G.hh>0.02){
            putBox(g, G.len, G.hh, 0.22, inv,
                mx+G.nrm.x*(G.th+0.11), G.lv+G.hh/2, mz+G.nrm.y*(G.th+0.11), G.ang,
                {p:pk.p,r:pk.r,e:pk.e,f:'in'});
            if(e.k==='para')
              putBox(g, G.len, 0.16, G.th, inv,
                  mx+G.nrm.x*G.th/2, G.lv+G.hh+0.08, mz+G.nrm.y*G.th/2, G.ang,
                  {p:pk.p,r:pk.r,e:pk.e,f:'top'});
            /* ★2026-08-23u 押し出しなどで新しく出てくる「端部の小口」も選べるようにする。
               ドラッグ＝その辺を辺の向きに伸ばす／縮める。 */
            var ux=(G.b.x-G.a.x)/G.len, uz=(G.b.y-G.a.y)/G.len;
            putBox(g, 0.16, G.hh, G.th+0.06, inv,
                G.a.x+G.nrm.x*G.th/2+ux*0.08, G.lv+G.hh/2, G.a.y+G.nrm.y*G.th/2+uz*0.08, G.ang,
                {p:pk.p,r:pk.r,e:pk.e,f:'endA'});
            putBox(g, 0.16, G.hh, G.th+0.06, inv,
                G.b.x+G.nrm.x*G.th/2-ux*0.08, G.lv+G.hh/2, G.b.y+G.nrm.y*G.th/2-uz*0.08, G.ang,
                {p:pk.p,r:pk.r,e:pk.e,f:'endB'});
          }

          /* ② 水切りアゴ：天端の外側に庇状の出っ張り＋先端の垂れ＋裏に回した防水層 */
          if(e.ago && e.h>0){
            var dOut=e.agoD/1000, lip=AGO_LIP/1000, top=G.lv+G.hh;
            var ax=mx+G.nrm.x*(G.th+dOut/2), az=mz+G.nrm.y*(G.th+dOut/2);
            nnShade(put(g, new THREE.BoxGeometry(G.len,0.05,dOut),
              nnMat('concrete',0xc9cec6), ax, top-0.025, az, G.ang, pk), true, true);
            put(g, new THREE.BoxGeometry(G.len,0.008,dOut),
              nnMat(nnMemKind(spec()), nnMemColor(spec())), ax, top-0.054, az, G.ang, pk);
            var ex=mx+G.nrm.x*(G.th+dOut-0.014), ez=mz+G.nrm.y*(G.th+dOut-0.014);
            nnShade(put(g, new THREE.BoxGeometry(G.len,lip+0.02,0.028),
              nnMat('alum',0x9aa2a8), ex, top-0.05-(lip+0.02)/2, ez, G.ang, pk), true, false);
          }

          /* ③ 選んだ面を光らせる（★2026-08-23k 本人のモック：面ぜんぶが赤くなり、
                赤い点線の枠が付く。壁の高さ（躯体）＋立上りの全体を覆う）。 */
          if(nnIsSel({p:pk.p,r:pk.r,e:pk.e,f:(sel&&sel.p===pk.p&&sel.r===pk.r&&sel.e===pk.e)?sel.f:'out'})
             || nnIsSel({p:pk.p,r:pk.r,e:pk.e,f:'out'})){
            var _bl=(+poly.lv||0);   /* ★2026-08-24p 高さは lv に一本化 */
            var _base=nnBaseLvOf(poly);
            var wallH=Math.max(0, _bl-_base);                 /* 躯体（壁）の高さ */
            /* ★2026-08-28b 外壁の面は「地面から笠木の下まで」ひとつながり。
               実物の外壁は屋根のところで切れておらず、パラペットの外側の面は
               その続きなので、赤も同じところまで伸ばす。
               以前は躯体のぶんだけで止めていたため、笠木のすぐ下に
               色の付かない帯が残り「赤い面が途中で終わっている」と見えていた（本人の指摘）。
               ※当たり判定（f:'out' の箱）は前から立上りぶんまで覆っているので、
                 「押せる範囲」と「赤くなる範囲」がずれていたのが不具合の正体。
               ★2026-08-23m の「パラペットを含めない」は、当時ハイライトが箱で、
                 内側・天端まで染まっていたことへの手当て。§2026-08-23p で
                 「外側の面だけ（板1枚）」にした時点で役目を終えている。 */
            var hlH=wallH+G.hh;
            if(hlH<0.12) hlH=0.12;
            var hlT=(e.ago&&e.h>0)?(G.th+e.agoD/1000):G.th;
            var m=nnDecoMat('red');
            /* ★2026-08-23p 赤くするのは「クリックした外側の面」だけ（板1枚）。
               箱にすると内側・天端まで染まり「パラペット全体が赤い」になっていた。 */
            /* ★2026-08-23r 点線の枠は出さない（本人の指示）。選んだ面だけを赤く塗る。 */
            var F=sel.f||'out', hl;
            if(F==='in'){
              hl=new THREE.Mesh(new THREE.PlaneGeometry(G.len, G.hh), m);
              hl.position.set(mx+G.nrm.x*(G.th+0.012), G.lv+G.hh/2, mz+G.nrm.y*(G.th+0.012));
              hl.rotation.y=-G.ang+Math.PI;
            }else if(F==='top'){
              hl=new THREE.Mesh(new THREE.PlaneGeometry(G.len, G.th), m);
              hl.position.set(mx+G.nrm.x*G.th/2, G.lv+G.hh+0.014, mz+G.nrm.y*G.th/2);
              hl.rotation.x=-Math.PI/2; hl.rotation.z=G.ang;
            }else if(F==='endA'||F==='endB'){
              var P0=(F==='endA')?G.a:G.b;
              hl=new THREE.Mesh(new THREE.PlaneGeometry(G.th, G.hh), m);
              hl.position.set(P0.x+G.nrm.x*G.th/2, G.lv+G.hh/2, P0.y+G.nrm.y*G.th/2);
              hl.rotation.y=-G.ang+Math.PI/2;
            }else{
              hl=new THREE.Mesh(new THREE.PlaneGeometry(G.len+0.02, hlH+0.02), m);
              hl.position.set(mx-G.nrm.x*0.012, _base+hlH/2, mz-G.nrm.y*0.012);
              hl.rotation.y=-G.ang;
            }
            hl.renderOrder=999; hl.userData.pick=pk; hl.userData.face=(sel.f||'out');
            g.add(hl);
          }
        }
      });
    });
    if(T)T.rev=(T.rev|0)+1;     /* 変わったので描き直す */
    render3dEdit();
  };

  /* build3D のあとに必ず飾りを載せ直す */
  if(typeof build3D==='function' && !build3D._nn3d){
    var _b3=build3D;
    window.build3D=function(){ var r=_b3.apply(this,arguments); try{ nn3dSync(); }catch(_){} return r; };
    window.build3D._nn3d=1;
  }
  /* 3Dタブに切り替えたときもカードを出す */
  if(typeof setTab==='function' && !setTab._nn3d){
    var _st=setTab;
    window.setTab=function(t){ var r=_st.apply(this,arguments); if(t==='d3'){ try{ nn3dSync(); }catch(_){} } return r; };
    window.setTab._nn3d=1;
  }

  /* ── 3Dのタップで辺を選ぶ ───────────────────────────── */
  /* ★2026-08-23z Shift＋クリックで面を追加選択（平場と天端を一緒に動かすため） */
  window.nnSelMulti=[];
  function pkEq(a,b){ return a&&b&&a.p===b.p&&a.r===b.r&&a.e===b.e&&(a.f||'out')===(b.f||'out'); }
  window.nnIsSel=function(pk){
    if(pkEq(sel,pk))return true;
    for(var i=0;i<nnSelMulti.length;i++) if(pkEq(nnSelMulti[i],pk))return true;
    return false;
  };
  window.nnSelAdd=function(pk){
    if(!pk)return;
    if(!sel){ pick3(pk); return; }
    if(pkEq(sel,pk)) return;                       /* いま選んでいる面は外さない */
    for(var i=0;i<nnSelMulti.length;i++) if(pkEq(nnSelMulti[i],pk)){
      nnSelMulti.splice(i,1); nn3dSync(); draw();
      try{ toast('選択から外しました（'+(nnSelMulti.length+1)+'面）'); }catch(_){} return; }
    nnSelMulti.push({p:pk.p,r:pk.r,e:pk.e,f:pk.f||'out'});
    nn3dSync(); draw();
    try{ toast('選択に追加しました（'+(nnSelMulti.length+1)+'面）　そのままドラッグ＝まとめて動かす'); }catch(_){}
  };
  window.pick3=function(pk){
    if(nnSelMulti.length){ nnSelMulti=[]; }        /* ふつうのクリックで選び直し */
    if(!pk){ sel=null; renderEdgeEdit(); nn3dSync(); draw(); return; }
    /* ★2026-08-23t 同じ面をもう一度タップしたら選択を解除（カードの✕を廃止したため）。 */
    if(sel && sel.p===pk.p && sel.r===pk.r && sel.e===pk.e && (sel.f||'out')===(pk.f||'out')){
      sel=null; renderEdgeEdit(); nn3dSync(); draw();
      try{ toast('選択をやめました'); }catch(_){}
      return;
    }
    sel={p:pk.p, r:pk.r, e:pk.e, f:pk.f||'out'};   /* ★2026-08-23r どの面をつかんだか */
    if(state.polys[pk.p]) state.active=pk.p;
    if(typeof renderPolyList==='function') renderPolyList();
    renderEdgeEdit(); nn3dSync(); draw();
  };

  function hookPick(){
    if(!three() || !T.renderer)return;
    var el=T.renderer.domElement;
    if(el._nn3dPick)return; el._nn3dPick=1;
    var dp=null, dt=0;
    el.addEventListener('pointerdown',function(e){ dp=[e.clientX,e.clientY]; dt=Date.now(); });
    /* ★2026-08-16h タップの受け口はこの1本だけにする。
       以前は「空タップで選択解除」を別の受け口でやっていたが、辺を選んだ瞬間に
       当たり判定を作り直すため、2本目の受け口が「作り直し直後でまだ位置計算前」の
       箱を調べて空振り→即解除、という「選んでもすぐ外れる」不具合になっていた。 */
    el.addEventListener('pointerup',function(e){
      if(window._nnAimUsedId===e.pointerId){ dp=null; return; }  /* ★スマホの照準が処理ずみ（2026-08-23d） */
      if(!dp)return;
      var moved=Math.hypot(e.clientX-dp[0], e.clientY-dp[1]); dp=null;
      if(moved>8 || Date.now()-dt>700)return;      /* ドラッグ・長押しは視点操作 */
      if(window._nnExtOn)return;                    /* 「押し出し」中は譲る */
      if(window.nnD3DrawOn && nnD3DrawOn())return;   /* ★3D描画中はそちらに譲る（2026-08-23a） */
      if(tab!=='d3')return;
      window._nnShift=!!e.shiftKey;      /* ★2026-08-23z Shift＝追加選択 */
      /* ★2026-08-23u 面・辺の選択は「選択」ツールのときだけ（本人の指示） */
      if(typeof tool!=='undefined' && tool!=='sel' && tool!=='select'
         && !(window.nnPlacingId&&nnPlacingId())) return;
      var r=el.getBoundingClientRect();
      if(!r.width||!r.height)return;
      var v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
      var rc=new THREE.Raycaster(); rc.setFromCamera(v, T.camera);
      /* 部材スタンプを持っているなら、タップした屋根の上に置く */
      if(window.nnPlacingId && nnPlacingId()){
        var hitsAll=rc.intersectObjects(T.scene.children,true)||[];
        var hp=null;
        for(var k=0;k<hitsAll.length;k++){
          var o=hitsAll[k].object;
          if(o!==T.ground && !(o.userData&&o.userData.pick)){ hp=hitsAll[k]; break; }
        }
        if(hp){ var sM=state.scaleM||0.5; nnPlaceAtGrid(hp.point.x/sM, hp.point.z/sM);
                try{ dirty3d=true; build3D(); }catch(_){} }
        else toast('屋根の上をタップしてください');
        return;
      }
      /* ★2026-08-23c 立体の「✥ 移動」中：タップした場所が移動先（何よりも優先） */
      if(window.nnSolMoveTo && nnSolMoveTo(rc)) return;
      /* ★作り直した直後の箱でも正しく当たるよう、位置計算を先に済ませる */
      try{ if(deco)deco.updateMatrixWorld(true); T.group.updateMatrixWorld(true); }catch(_){}
      /* ★2026-08-23k 壁の当たり判定を「面ぜんぶ」に広げたので、壁の手前に置いた
         役物・立体のほうを先に見る（順番を入れ替えないと、笠木や押し出した箱を
         タップしても後ろの壁が選ばれてしまう）。 */
      /* 役物（笠木・ドレン等の箱）に当たったら、それを選ぶ（下に操作バーが出る） */
      var hits2=rc.intersectObjects(T.group.children,true)||[];
      for(var j=0;j<hits2.length;j++){
        var o2=hits2[j].object;
        if(o2 && o2.userData && o2.userData.partIdx!=null && window.nnPartSelect){
          /* ★2026-08-23d 役物を選んだら立体の選択は外す（バーとカードの二重表示防止） */
          try{ if(window.nnSolSelIdx&&nnSolSelIdx()>=0&&window.nnSolSelect)nnSolSelect(-1); }catch(_){}
          if(window.nnPolyDesel)nnPolyDesel();
          nnPartSelect(o2.userData.partIdx); return;
        }
      }
      /* ★3Dでかいた立体（押出し・引込み）に当たったら、それを選ぶ（2026-08-23a） */
      if(window.nnSolPickAt && nnSolPickAt(rc)){ if(window.nnPolyDesel)nnPolyDesel(); return; }
      /* 壁・パラペットの面（辺）に当たったら、その辺を選ぶ */
      var hits=rc.intersectObjects(deco?deco.children:[], true)||[];
      for(var i=0;i<hits.length;i++){
        var pk=hits[i].object && hits[i].object.userData && hits[i].object.userData.pick;
        if(pk){ if(window._nnShift) nnSelAdd(pk); else pick3(pk);
          if(window.nnPolyDesel)nnPolyDesel(); return; }
      }
      /* ★2026-08-23f 屋根の面（平場）をタップ＝その部位を選ぶ（青くハイライト・
         右の一覧と連動・高さをその場で変えられる。PDFの指示どおり） */
      if(window.nnPolyPickAt && nnPolyPickAt(rc)){
        if(typeof sel!=='undefined'&&sel)pick3(null);
        try{ if(window.nnPartSelIdx&&nnPartSelIdx()>=0&&window.nnPartSelect)nnPartSelect(-1); }catch(_){}
        try{ if(window.nnSolSelIdx&&nnSolSelIdx()>=0&&window.nnSolSelect)nnSolSelect(-1); }catch(_){}
        return;
      }
      /* 何も無い所＝選択をやめる */
      if(typeof sel!=='undefined' && sel) pick3(null);
      if(window.nnPartSelIdx && nnPartSelIdx()>=0 && window.nnPartSelect) nnPartSelect(-1);
      if(window.nnSolSelIdx && nnSolSelIdx()>=0 && window.nnSolSelect) nnSolSelect(-1);
      if(window.nnPolyDesel) nnPolyDesel();
    });
  }

  /* ── 3D画面の左下に出る編集カード ───────────────────── */
  function card(){

  /* ★2026-08-23k 足元の高さ（下にある部位の屋根から立ち上げる・build3Dと同じ理屈） */
  /* ★2026-08-24b 部位の全リング（外周＋穴）を返す小道具と、立上りHの控え */
  window.nnRingsAll=function(poly){
    var out=[{r:-1, pts:poly.pts, edges:poly.edges}];
    (poly.holes||[]).forEach(function(h,i){ out.push({r:i, pts:h.pts, edges:h.edges}); });
    return out;
  };
  window.nnGrabH=function(poly){
    var o={}; try{ nnRingsAll(poly).forEach(function(rg,ri){
      (rg.edges||[]).forEach(function(ed,ei){ o[ri+':'+ei]=+ed.h||0; }); }); }catch(_){}
    return o;
  };
  window.nnBaseLvOf=function(poly){
    var lv=(+poly.lv||0), base=0;
    try{
      var c0=polyCenter(poly.pts);
      (state.polys||[]).forEach(function(o){ if(o===poly)return;
        var ol=(+o.lv||0);
        if(ol<lv && ol>base && pointInPoly(o.pts,c0.x,c0.y)) base=ol; });
    }catch(_){}
    return base;
  };
  /* ★2026-08-23k 選んだ面を「押し出す／引っ込める」＝その辺を法線方向へ平行移動。
     隣の辺は頂点を共有しているので自動で伸び縮みする（モックの赤い矢印の動き）。 */
  /* ★2026-08-23n 「面を厚く／薄く」＝選んだ壁の厚みを変える（本人の指示）。
     建物の形（輪郭）は動かさない。 */
  window.nnEdgeThick=function(dmm){
    if(!sel || !state.polys[sel.p]){ toast('先に壁の面をタップしてください'); return; }
    var ring=selRing(), e=ring.edges[sel.e]; if(!e)return;

    e.wall=nv;
    try{ saveState(); }catch(_){}
    try{ recalc(); }catch(_){}
    try{ draw(); }catch(_){}
    try{ dirty3d=true; build3D(); }catch(_){}

  };
  window.nnEdgeThickSet=function(v){

    e.wall=Math.max(20,Math.min(1000,+v||150));

  window.nnEdgeThickAsk=function(){

  window.nnEdgeOffset=function(dm){
    if(!sel || !state.polys[sel.p] || sel.f==='deck'){ toast('先に壁の面をタップしてください'); return; }
    var poly=state.polys[sel.p], ring=selRing();
    if(!ring || !ring.pts || !ring.pts[sel.e]){ toast('先に壁の面をタップしてください'); return; }
    var pts=ring.pts, N=pts.length, i=sel.e;
    var a=pts[i], b=pts[(i+1)%N];
    var dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
    var nx=dy/L, ny=-dx/L;
    var cx=(a.x+b.x)/2+nx*0.02, cy=(a.y+b.y)/2+ny*0.02;
    var inside=pointInPoly(poly.pts,cx,cy);
    if(sel.r<0 ? inside : !inside){ nx=-nx; ny=-ny; }   /* 外周は外向き／中抜きは逆 */
    /* ★2026-08-24z 一度に動かせるのは50mまで（打ち間違いで図面が壊れないように） */
    var dmc=Math.max(-50, Math.min(50, +dm||0));
    if(dmc!==(+dm||0)) toast('一度に動かせるのは 50m までです');
    var gstep=dmc/(state.scaleM||0.5);                 /* m → マス */
    var back=[{x:a.x,y:a.y},{x:b.x,y:b.y}];
    var rd=function(v){ return Math.round(v*100)/100; };
    a.x=rd(a.x+nx*gstep); a.y=rd(a.y+ny*gstep);
    b.x=rd(b.x+nx*gstep); b.y=rd(b.y+ny*gstep);
    /* 潰れ・裏返りの防止（引っ込めすぎたら元に戻す） */
    var okA=true;
    try{ okA=polyAreaM(poly.pts,state.scaleM)>0.5; }catch(_){}
    if(!okA){ a.x=back[0].x; a.y=back[0].y; b.x=back[1].x; b.y=back[1].y;
      toast('これ以上は引っ込められません'); return; }
    try{ if(window.nnSyncSharedEdges)nnSyncSharedEdges(); }catch(_){}
    try{ saveState(); }catch(_){}
    try{ renderPolyList(); }catch(_){}
    try{ recalc(); }catch(_){}
    try{ draw(); }catch(_){}
    try{ dirty3d=true; build3D(); }catch(_){}
    try{ toast((dm>0?'押し出しました ＋':'引っ込めました ')+f1(Math.abs(dm))+'m'); }catch(_){}
  };
  window.nnEdgeOffsetAsk=function(){
    if(!sel){ toast('先に壁の面をタップしてください'); return; }
    if(window.nnNumAsk) nnNumAsk('面を動かす長さ（mm）　＋＝押出し／−＝引込み', 500, function(v){
      if(v==null)return; nnEdgeOffset((+v||0)/1000); });
    else nnEdgeOffset(0.5);
  };
  window.render3dEdit=function(){
    var d=card(); if(!d)return;
    if(!sel || !state.polys[sel.p]){
      /* ★2026-08-23d スマホは「何も選んでいないときの案内」を出さない。
         小さい画面の左下に常駐して、立体カード・役物バーと重なっていた。
         使い方は帯の「？」に入っている。パソコンは今までどおり出す。 */
      if(typeof NN_PHONE!=='undefined'&&NN_PHONE){ d.style.display='none'; d.innerHTML=''; return; }
      d.style.display='';
      d.innerHTML='<div class="d3e-non">パラペットや壁をタップ＝<b>その辺だけ</b>立上り・アゴを編集<br>笠木・ドレン等をタップ＝下のバーで 回す・複製・削除</div>';
      return;
    }
    /* ★2026-08-23p 左下のカードは出さない（本人の指示「わかりづらい・直感操作にしたい」）。
       面をドラッグして押し出す・厚みは屋根の表から。 */
    /* ★2026-08-24p ここにあった「辺の編集カードを組み立てる約40行」は、
       上の return より後ろにあって一度も動かない死んだコードだったので削除した。
       （辺の設定は 3Dなら面をドラッグ、数値なら屋根の表から行う） */
    d.style.display='none'; d.innerHTML='';
  };
  /* ★2026-08-23p 選んだ外側の面をドラッグ＝そのまま躯体ごと押し出す（直感操作）。
     画面のドラッグ量を「面の法線方向のメートル」に直して、辺を平行移動する。 */
  window.nnFaceDrag=function(){
    if(!three()||!T.renderer)return;
    var el=T.renderer.domElement;
    if(el._nnFaceDrag)return; el._nnFaceDrag=1;
    var st=null;
    window.nnFaceBusy=function(){ return !!st; };   /* ★カメラ側が見る（§229） */
    function faceInfo(){
      if(!sel||!state.polys[sel.p])return null;
      var poly=state.polys[sel.p], ring=selRing();
      var N=ring.pts.length, a=ring.pts[sel.e], b=ring.pts[(sel.e+1)%N];
      var sM=state.scaleM||0.5;
      var dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
      var nx=dy/L, ny=-dx/L;
      var cx=(a.x+b.x)/2+nx*0.02, cy=(a.y+b.y)/2+ny*0.02;
      if(sel.r<0 ? pointInPoly(poly.pts,cx,cy) : !pointInPoly(poly.pts,cx,cy)){ nx=-nx; ny=-ny; }
      var mid=new THREE.Vector3((a.x+b.x)/2*sM, (+poly.lv||0)+0.4, (a.y+b.y)/2*sM);
      var out=new THREE.Vector3(mid.x+nx*sM, mid.y, mid.z+ny*sM);   /* 1マスぶん外へ */
      var r=el.getBoundingClientRect();
      var p1=mid.clone().project(T.camera), p2=out.clone().project(T.camera);
      var sx=(p2.x-p1.x)*r.width/2, sy=-(p2.y-p1.y)*r.height/2;     /* 画面上の外向き（px） */
      var len=Math.hypot(sx,sy)||1;
      return {ux:sx/len, uy:sy/len, mPerPx:(sM)/len, a:a, b:b, nx:nx, ny:ny, sM:sM};
    }
    /* ★2026-08-28a ドラッグを取り消して元に戻す（2本目の指が来たとき用・§229）。 */
    function cancelDrag(){
      if(!st)return;
      try{
        if(st.deck!=null){ var pp=state.polys[st.deck];
          if(pp){ if(st.h0s) nnRingsAll(pp).forEach(function(rg,ri){ (rg.edges||[]).forEach(function(ed,ei){
              var k=ri+':'+ei; if(st.h0s[k]!=null) ed.h=st.h0s[k]; }); });
            pp.lv=st.lv0; }
        }else if(st.fi){
          var ring=selRing(), ed=ring?ring.edges[sel.e]:null;
          var F=(sel&&sel.f)||'out';
          if(F==='top'){ if(ed)ed.h=st.h0; }
          else if(F==='in'){ if(ed)ed.w=st.w0; }
          else{ st.fi.a.x=st.ax; st.fi.a.y=st.ay; st.fi.b.x=st.bx; st.fi.b.y=st.by; }
        }
      }catch(_){}
      st=null;
      try{ nnBuild3DSoon(); }catch(_){}
    }
    el.addEventListener('pointerdown',function(e){
      if(tab!=='d3')return;
      /* ★2026-08-28a 2本目の指が来たら、面のドラッグはやめてピンチに譲る（§229）。
         止めずに素通しする＝2本ともカメラ側に届いて、ふつうのピンチになる。
         以前はここで st を作り直していたため、面を選んだままだと
         二本指のズームが永久にできなかった（「操作が途中で崩れる」の正体）。 */
      if(st && e.pointerId!==st.pid){ cancelDrag(); return; }
      /* ★2026-08-23u 面の選択とドラッグは「選択」ツールのときだけ（本人の指示）。
         ほかの道具に切り替えれば発動しない＝選択モードから抜けられる。 */
      if(typeof tool!=='undefined' && tool!=='sel' && tool!=='select')return;
      if(window.nnD3DrawOn && nnD3DrawOn())return;      /* 3D描画中は譲る */
      /* ★2026-08-28d 3Dでかいた立体（押出し・引込み）の面をつかんだら、そちらに譲る（§232-C） */
      if(window.nnSolDragTry && nnSolDragTry(e))return;
      var r=el.getBoundingClientRect();
      var v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
      var rc=new THREE.Raycaster(); rc.setFromCamera(v,T.camera);
      try{ if(deco)deco.updateMatrixWorld(true); }catch(_){}
      var hits=rc.intersectObjects(deco?deco.children:[],true)||[];
      var on=false, deckHit=-1;
      for(var i=0;i<hits.length;i++){ var o=hits[i].object;
        if(o&&o.userData&&o.userData.face==='deck'){
          /* ★2026-08-23u 選んだ平場の赤い面をつかんだ＝そのまま平場のドラッグへ */
          deckHit=(o.userData.pick&&o.userData.pick.p!=null)?o.userData.pick.p:-1; break; }
        if(o&&o.userData&&o.userData.face){ on=true; break; } }
      if(deckHit>=0){ var pd=state.polys[deckHit];
        if(e.shiftKey){ try{ nnSelAdd({p:deckHit,r:-1,e:-1,f:'deck'}); }catch(_){}
          e.preventDefault(); e.stopPropagation(); return; }
        var _wb2=false;
        try{ for(var q2=0;q2<nnSelMulti.length;q2++){ var m2=nnSelMulti[q2];
          if(m2.p===deckHit && m2.f!=='deck'){ _wb2=true; break; } } }catch(_){}
        if(pd){ st={pid:e.pointerId, deck:deckHit, was:1, withBody:_wb2, h0s:nnGrabH(pd), x:e.clientX, y:e.clientY, moved:0,
              lv0:+pd.lv||0,
              mPerPx:(T.r||20)*0.00048};
          e.preventDefault(); e.stopPropagation();
          try{ el.setPointerCapture(e.pointerId); }catch(_){}
          return; } }
      /* 選んだ面のハイライトが薄くて掴めないときも、同じ辺の当たり判定なら掴めるように */
      if(!on){ for(var i2=0;i2<hits.length;i2++){ var o2=hits[i2].object;
        var pk2=o2&&o2.userData&&o2.userData.pick;
        if(pk2&&sel&&pk2.p===sel.p&&pk2.r===sel.r&&pk2.e===sel.e&&(pk2.f||'out')===(sel.f||'out')){ on=true; break; } } }
      /* ★2026-08-23s 平場（屋根の面）をつかんだら、上下ドラッグで高さを変える
         （面のハイライトに当たらなかったときだけ見る） */
      /* ★2026-08-24g 天端・壁などの面に当たっているときは平場をつかまない。
         これが「天端を選択できない」の正体（平場のつかみが先に横取りしていた）。 */
      var faceAhead=false;
      for(var fh=0; fh<hits.length; fh++){ var fo=hits[fh].object;
        if(fo && fo.userData && fo.userData.pick){ faceAhead=true; break; } }
      /* 面を選んでいる状態でその面をつかんだら、必ず「面のドラッグ」にする */
      if(!on && faceAhead && sel && (sel.f||'out')!=='deck') on=true;
      if(!on && !faceAhead && !(sel && (sel.f||'out')!=='deck')){
        var hitsA=rc.intersectObjects(T.group.children,true)||[];
        for(var k=0;k<hitsA.length;k++){ var om=hitsA[k].object;
          if(om&&om.userData&&om.userData.polyIdx!=null){
            var pi=om.userData.polyIdx, pp=state.polys[pi]; if(!pp)break;
            /* ★2026-08-23u 平場も他の面と同じ扱い：赤く選択され、ドラッグで平場だけ動く
               （躯体・パラペットは動かさない。天端とは別物） */
            if(e.shiftKey){ try{ nnSelAdd({p:pi,r:-1,e:-1,f:'deck'}); }catch(_){}
              e.preventDefault(); e.stopPropagation(); return; }
            var _was=(sel && sel.f==='deck' && sel.p===pi)?1:0;
            try{ pick3({p:pi, r:-1, e:-1, f:'deck'}); }catch(_){}
            var _wb=false;
            try{ for(var q=0;q<nnSelMulti.length;q++){ var mm=nnSelMulti[q];
              if(mm.p===pi && mm.f!=='deck'){ _wb=true; break; } } }catch(_){}
            st={pid:e.pointerId, deck:pi, was:_was, moved:0, withBody:_wb, h0s:nnGrabH(pp), x:e.clientX, y:e.clientY,
                lv0:+pp.lv||0,
                mPerPx:(T.r||20)*0.00048};
            e.preventDefault(); e.stopPropagation();
            try{ el.setPointerCapture(e.pointerId); }catch(_){}
            return;
          }
          if(om&&om.userData&&om.userData.pick)continue;
        }
      }
      if(!on)return;
      if(e.shiftKey){
        for(var h=0;h<hits.length;h++){ var ho=hits[h].object;
          if(ho&&ho.userData&&ho.userData.pick){ try{ nnSelAdd(ho.userData.pick); }catch(_){}
            e.preventDefault(); e.stopPropagation(); return; } }
      }
      var fi=faceInfo(); if(!fi)return;
      var _r=selRing(), _e=_r?ek(_r.edges[sel.e]):{h:0,w:0};
      st={pid:e.pointerId, x:e.clientX, y:e.clientY, fi:fi, ax:fi.a.x, ay:fi.a.y, bx:fi.b.x, by:fi.b.y, moved:0,
          h0:_e.h, w0:_e.w};
      e.preventDefault(); e.stopPropagation();
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
    }, true);
    el.addEventListener('pointermove',function(e){
      if(!st)return;
      if(st.pid!=null && e.pointerId!=null && e.pointerId!==st.pid)return;  /* ★別の指は対象外（§229） */
      e.preventDefault(); e.stopPropagation();
      var dx=e.clientX-st.x, dy=e.clientY-st.y;
      if(st.deck!=null){                       /* ★平場だけを上下（躯体は動かさない） */
        var pp=state.polys[st.deck]; if(!pp)return;
        st.moved=Math.max(st.moved||0, Math.abs(dx)+Math.abs(dy));
        var dh=Math.round((-dy*st.mPerPx)*20)/20;   /* 5cmきざみ */
        /* ★2026-08-24e 立上りHは控えから毎回作り直す（ドラッグ中の積み重なりを防ぐ） */
        try{ if(st.h0s) nnRingsAll(pp).forEach(function(rg,ri){
          (rg.edges||[]).forEach(function(ed,ei){ var k=ri+':'+ei;
            if(st.h0s[k]!=null) ed.h=st.h0s[k]; }); }); }catch(_){}
        pp.lv=st.lv0;
        if(st.withBody){
          /* ★2026-08-24p Shiftで「平場」と「天端（壁）」を一緒に選んでいるとき＝
             まとめて同じ量だけ上下する。立上りHは変えない（＝天端も一緒に上がる）。
             ※これまでは効かない項目（bodyLv）に書いていたので、見た目は
               ふつうのドラッグと同じだった（＝この機能が動いていなかった）。 */
          pp.lv=Math.max(0, Math.round((st.lv0+dh)*1000)/1000);
        }else{
          nnSetDeckLv(pp, st.lv0+dh);   /* 天端の上端は動かさない・GL+0mが最低・立上り150mmが下限 */
        }
        nnBuild3DSoon();
        try{ toast(pp.name+'　平場 GL+'+f1(pp.lv)+'m'); }catch(_){}
        return;
      }
      var F=(sel&&sel.f)||'out';
      var ring=selRing(), ed=ring?ring.edges[sel.e]:null;
      if(F==='top'){                       /* 天端をつかんで上下＝立上りHを変える */
        var mmH=Math.round((st.h0 - dy*st.fi.mPerPx*1000)/10)*10;
        mmH=Math.max(0, Math.min(3000, mmH));
        if(ed){ ed.h=mmH; if(mmH>0&&ed.k==='free')ed.k='para'; }
        st.moved=Math.abs(dy);
        nnBuild3DSoon();
        try{ toast('立上り H '+mmH+'mm'); }catch(_){}
        return;
      }
      if(F==='endA'||F==='endB'){                    /* ★端部＝辺の向きに伸ばす／縮める */
        var ex=st.fi.b.x-st.fi.a.x, ey=st.fi.b.y-st.fi.a.y, eL=Math.hypot(ex,ey)||1;
        var exn=ex/eL, eyn=ey/eL;
        var sM2=st.fi.sM;
        var pA=new THREE.Vector3(st.ax*sM2, 0.4, st.ay*sM2);
        var pB=new THREE.Vector3((st.ax+exn)*sM2, 0.4, (st.ay+eyn)*sM2);
        var rr=T.renderer.domElement.getBoundingClientRect();
        var q1=pA.clone().project(T.camera), q2=pB.clone().project(T.camera);
        var sx2=(q2.x-q1.x)*rr.width/2, sy2=-(q2.y-q1.y)*rr.height/2;
        var l2=Math.hypot(sx2,sy2)||1;
        var mv=(dx*(sx2/l2)+dy*(sy2/l2))*(sM2/l2)/sM2;   /* → マス */
        var rd2=function(v){ return Math.round(v*100)/100; };
        if(F==='endA'){ st.fi.a.x=rd2(st.ax+exn*mv); st.fi.a.y=rd2(st.ay+eyn*mv); }
        else          { st.fi.b.x=rd2(st.bx+exn*mv); st.fi.b.y=rd2(st.by+eyn*mv); }
        st.moved=Math.abs(dx)+Math.abs(dy);
        nnBuild3DSoon();
        try{ toast('端を '+f1(Math.abs(mv*sM2))+'m '+(mv>=0?'伸ばす':'縮める')); }catch(_){}
        return;
      }
      var px=dx*st.fi.ux+dy*st.fi.uy;               /* 外向きの画面px */
      var dm=px*st.fi.mPerPx;                        /* → メートル */
      st.moved=Math.abs(px);
      if(F==='in'){                        /* 立上りの内側をつかむ＝天端W（厚み）を変える */
        var mmW=Math.round((st.w0 - dm*1000)/10)*10;
        mmW=Math.max(30, Math.min(2000, mmW));
        if(ed) ed.w=mmW;
        nnBuild3DSoon();
        try{ toast('天端 W '+mmW+'mm'); }catch(_){}
        return;
      }
      var g=dm/st.fi.sM;                             /* → マス */
      var rd=function(v){ return Math.round(v*100)/100; };
      st.fi.a.x=rd(st.ax+st.fi.nx*g); st.fi.a.y=rd(st.ay+st.fi.ny*g);
      st.fi.b.x=rd(st.bx+st.fi.nx*g); st.fi.b.y=rd(st.by+st.fi.ny*g);
      nnBuild3DSoon();
      try{ toast((dm>=0?'押し出し ＋':'引込み ')+f1(Math.abs(dm))+'m'); }catch(_){}
    }, true);
    /* ★2026-08-23r ダブルクリック＝その面の寸法を数値で決める */
    el.addEventListener('dblclick',function(e){
      if(tab!=='d3'||!sel)return;
      var F=sel.f||'out', ring=selRing(), ed=ring?ring.edges[sel.e]:null; if(!ed)return;
      e.preventDefault(); e.stopPropagation();
      if(F==='top'){
        if(window.nnNumAsk)nnNumAsk('立上り H（mm）', ek(ed).h, function(v){ if(v==null)return;
          ed.h=Math.max(0,Math.min(3000,+v||0)); if(ed.h>0&&ed.k==='free')ed.k='para';
          try{ saveState(); recalc(); draw(); dirty3d=true; build3D(); }catch(_){} });
      }else if(F==='in'){
        if(window.nnNumAsk)nnNumAsk('天端 W（mm）', ek(ed).w, function(v){ if(v==null)return;
          ed.w=Math.max(30,Math.min(2000,+v||0));
          try{ saveState(); recalc(); draw(); dirty3d=true; build3D(); }catch(_){} });
      }else{
        if(window.nnNumAsk)nnNumAsk('この面を動かす長さ（mm）　＋＝外へ／−＝内へ', 500,
          function(v){ if(v==null)return; nnEdgeOffset((+v||0)/1000); });
      }
    }, true);
    var end=function(e){
      if(!st)return;
      if(st.pid!=null && e && e.pointerId!=null && e.pointerId!==st.pid)return;  /* ★別の指の up では終わらせない（§229） */
      /* ★2026-08-23u 同じ要素に付いた「統一の受け口」に処理ずみを伝える。
         同じ要素どうしでは stopPropagation では止まらないため、この印を使う */
      try{ if(e&&e.pointerId!=null){ window._nnAimUsedId=e.pointerId;
        setTimeout(function(){ window._nnAimUsedId=null; },0); } }catch(_){}
      if(st.deck!=null){ var _mv=st.moved||0, _was=st.was; st=null;
        try{ e&&e.stopImmediatePropagation&&e.stopImmediatePropagation(); }catch(_){}
        if(_mv<5 && _was && sel && sel.f==='deck'){ try{ pick3(null); toast('選択をやめました'); }catch(_){} return; }
        try{ if(window.nnSyncSharedEdges)nnSyncSharedEdges(); }catch(_){}
        try{ saveState(); renderPolyList(); recalc(); draw(); dirty3d=true; build3D(); }catch(_){}
        return; }
      /* ★2026-08-23t ほとんど動かさずに離した＝ただのクリック → 選択を解除する
         （カードの✕を廃止したので、同じ面をもう一度押せば外れるようにする） */
      if((st.moved||0)<5){ st=null; try{ pick3(null); toast('選択をやめました'); }catch(_){} return; }
      var poly=state.polys[sel.p];
      if(!sel.f || sel.f==='out'){
        var ok=true; try{ ok=polyAreaM(poly.pts,state.scaleM)>0.5; }catch(_){}
        if(!ok){ st.fi.a.x=st.ax; st.fi.a.y=st.ay; st.fi.b.x=st.bx; st.fi.b.y=st.by;
          nnBuild3DSoon(); }
      }
      st=null;
      try{ if(window.nnSyncSharedEdges)nnSyncSharedEdges(); }catch(_){}
      try{ saveState(); renderPolyList(); recalc(); draw(); }catch(_){}
    };
    el.addEventListener('pointerup',end,true);
    el.addEventListener('pointercancel',end,true);
  };
  setTimeout(function(){ try{ nnFaceDrag(); }catch(_){} }, 900);
  setInterval(function(){ try{ nnFaceDrag(); }catch(_){} }, 2500);
  /* 起動時に一度だけ空のカードを出しておく */
  setTimeout(function(){ try{ render3dEdit(); }catch(_){} }, 600);
})();
</script>
<style id="nn-3dtools">
/* ★2026-08-16g 3Dでもツールバーを使う。3D専用のボタンはツールバーの下へ逃がす */
body.nn3dbar #d3wari, body.nn3dbar #d3ext{ top:var(--nn3dtop,118px) !important; }
body.nn3dbar #d3pad{ top:var(--nn3dtop,118px) !important; }
#d3edit .d3e-range{width:100%; margin-top:4px; padding:5px; font-size:10.5px; font-weight:800;
  border:1.2px solid #b9a0d8; background:#f3edfb; color:#5a2f9c; border-radius:6px; cursor:pointer;}
</style>
<script id="nn-3dtools-js">
/* ============================================================
   ⑫ 3Dの操作をひととおり使えるようにする（2026-08-16g）
   ・ツールバーを3Dでも出す（2D専用の道具を押したら図面タブへ移る）
   ・3Dの何もない所をタップ＝選択をやめる／Escでもやめる
   ・部材スタンプは3Dでもタップした場所に置ける
   ・辺のうち「ユーザーが決めた範囲」だけを切り出して編集できる
   ============================================================ */
(function(){
  /* ── ツールバーの高さを測って、3D専用ボタンをその下へ ── */
  function fitBar(){
    const tb=document.getElementById('toolbar');
    if(!tb)return;
    const h=(tab==='d3'&&tb.style.display!=='none')?tb.getBoundingClientRect().height:0;
    const z=(window.nnPZ||1);
    document.documentElement.style.setProperty('--nn3dtop', (h/z+18)+'px');
  }
  setInterval(fitBar, 700);

  /* ── 道具を3Dで押したときの動き（★2026-08-16h 道具の性質で分ける）──
     ・選択／移動＝3Dに元からある操作なので、タブは動かさず使い方だけ案内する
       （以前は「選択」を押すと図面タブへ弾き出されて「変な動き」になっていた）
     ・描画・中抜き・範囲選択・段差ライン＝図面でしか使えないので、
       図面タブへ移る。ただし黙って移らず、理由をトーストで伝える。 */
  if(typeof setTool==='function' && !setTool._nn3dt){
    const _sT=setTool;
    const NAMES={hole:'中抜き', rect:'範囲選択', split:'段差ライン',
                 box:'長方形', addpt:'点の追加・削除'};   /* ★2026-08-26a */
    window.setTool=function(t){
      if(typeof tab!=='undefined' && tab==='d3'){
        if(t==='draw'){ toast('3D描画：面（平場・立上り・天端）をタップ → 2点目で長方形 → 押出し／引込み'); }
        else if(t==='sel'){ toast('3Dでは、パラペットや壁・役物を直接タップすると選べます'); }
        else if(t==='pan'){ toast('3Dはドラッグで移動、ホイール（2本指）で拡大縮小できます'); }
        else if(NAMES[t]){
          try{ setTab('zu'); }catch(_){}
          toast('①図面タブに移りました（'+NAMES[t]+'は図面でかくときの道具です）');
        }
      }
      return _sT.apply(this,arguments);
    };
    window.setTool._nn3dt=1;
  }
  /* ── 2画面ボタンを3Dで押したら、図面＋3Dの2画面にして図面タブへ ──
     （以前は状態だけ切り替わって見た目が何も変わらず、押しても無反応に見えた） */
  addEventListener('load',function(){
    const _sp=window.nnSplitToggle;
    if(typeof _sp!=='function' || _sp._nn3dt) return;
    window.nnSplitToggle=function(){
      if(typeof tab!=='undefined' && tab==='d3'){
        const on=document.body.classList.contains('nnsplit2');
        try{ setTab('zu'); }catch(_){}
        if(!document.body.classList.contains('nnsplit2')) return _sp.apply(this,arguments);
        return;
      }
      return _sp.apply(this,arguments);
    };
    window.nnSplitToggle._nn3dt=1;
  });
  /* ── 戻る・進むを3Dにも効かせる（組み直さないと立体が古いままになる） ── */
  ['undoStep','redoStep'].forEach(function(n){
    const f=window[n];
    if(typeof f!=='function' || f._nn3dt) return;
    window[n]=function(){
      const r=f.apply(this,arguments);
      if(typeof tab!=='undefined' && tab==='d3'){ try{ dirty3d=true; build3D(); }catch(_){} }
      return r;
    };
    window[n]._nn3dt=1;
  });

  /* ── Escで3Dの選択をやめる ── */
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(typeof tab!=='undefined' && tab==='d3' && typeof sel!=='undefined' && sel){
      e.preventDefault(); if(window.pick3) pick3(null);
    }
  });

  /* ★2026-08-16h 「空タップで解除」「スタンプを置く」の受け口は nn-3dedit-js の
     タップ処理に一本化した。ここに2本目の受け口があると、選んだ直後の
     作り直しと競走して「選んでもすぐ外れる」が起きる（実際に起きた）。 */

  /* ── ④ 辺の「一部だけ」を切り出して編集する ──────────────
     考え方：新しい仕組みを作らず、辺を分けて（頂点を足して）
     その部分を1本の辺にする。こうすると 図面・3D・積算 が
     今までどおりそのまま正しく動く。 */
  window.nnEdgeSplitRange=function(startM, lenM){
    if(typeof sel==='undefined' || !sel){ toast('先に辺を選んでください'); return false; }
    const ring=selRing(), N=ring.pts.length, i=sel.e;
    const a=ring.pts[i], b=ring.pts[(i+1)%N];
    const totM=edgeLenM(a,b,state.scaleM);
    let s0=Math.max(0, +startM||0);
    let L =Math.max(0.1, +lenM||0);
    if(s0>=totM-0.05){ toast('開始位置がこの辺の長さ（'+f1(totM)+'m）を超えています'); return false; }
    const s1=Math.min(totM, s0+L);
    const t0=s0/totM, t1=s1/totM;
    const at=t=>({ x:Math.round((a.x+(b.x-a.x)*t)*1000)/1000,
                   y:Math.round((a.y+(b.y-a.y)*t)*1000)/1000 });
    const s=ek(ring.edges[i]);
    const cp=()=>({k:s.k, h:s.h, w:s.w, ago:!!s.ago, agoD:s.agoD});
    const ins=[];
    if(t0>0.002) ins.push(at(t0));
    if(t1<0.998) ins.push(at(t1));
    if(!ins.length){ toast('辺の全体になります。そのまま編集できます'); return false; }
    ring.pts.splice(i+1, 0, ...ins);
    ring.edges.splice(i+1, 0, ...ins.map(cp));
    sel={p:sel.p, r:sel.r, e:(t0>0.002 ? i+1 : i)};
    if(typeof afterEdgeChange==='function') afterEdgeChange();
    else { saveState(); renderEdgeEdit(); draw(); }
    toast('この辺を分けました。いま選んでいるのは '+f1(s1-s0)+'m の部分です');
    return true;
  };
  /* ★2026-08-28d 選んだ辺を「弧（アール）」にする＝§232
     本人の依頼「孤を描けるようにもしたい」。曲面のパラペット・R形状の屋上のため。
     ★新しい仕組みは作らない。辺を細かい折れ線に置き換えるだけにしてある。
       こうすると 面積・割付・3D・断面・PDF が今までどおり全部そのまま正しく動く
       （§120 の「範囲で編集」と同じ考え方）。 */
  window.NN_ARC_SEG=16;                 /* 弧を何本の直線で表すか */
  window.nnEdgeArc=function(bulgeMm){
    if(typeof sel==='undefined' || !sel){ toast('先に辺を選んでください'); return false; }
    const ring=selRing(); if(!ring||!ring.pts){ toast('先に辺を選んでください'); return false; }
    const N=ring.pts.length, i=sel.e;
    if(!(i>=0&&i<N)){ toast('先に辺を選んでください'); return false; }
    const a=ring.pts[i], b=ring.pts[(i+1)%N];
    const sM=state.scaleM||0.5;
    const chordM=edgeLenM(a,b,sM);
    if(chordM<0.05){ toast('この辺は短すぎます'); return false; }
    /* 膨らみ（サジッタ）＝弦の中央から弧までの距離。±で膨らむ向きが変わる */
    let sag=(+bulgeMm||0)/1000;
    const lim=chordM*4;                                     /* 暴走防止（§214の型） */
    if(Math.abs(sag)<0.01){ toast('膨らみは10mm以上で入れてください'); return false; }
    sag=Math.max(-lim, Math.min(lim, sag));
    /* 弦の長さ c とサジッタ s から半径 R＝(c²/4 + s²)/(2s) */
    const c=chordM, sg=Math.abs(sag), R=(c*c/4 + sg*sg)/(2*sg);
    const half=Math.min(1, c/(2*R));
    const ang=2*Math.asin(half)*(1);                         /* 弧の中心角 */
    const dir=(sag>=0)?1:-1;
    /* マス座標で作る（pts はマス単位） */
    const ax=a.x, ay=a.y, bx=b.x, by=b.y;
    const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len;                              /* 弦の向き */
    /* ★「＋＝外へ」にそろえる。ringNormal は内向きを返すので、その逆が外向き。
       中抜き（穴）の縁でも ringNormal が向きを面倒みてくれる。 */
    let nx=-uy, ny=ux;
    try{
      const inw=ringNormal(state.polys[sel.p], ring.pts, a, b);
      if(inw && (Math.abs(inw.x)+Math.abs(inw.y))>1e-9){ nx=-inw.x; ny=-inw.y;
        const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl; }
    }catch(_){}
    const mx=(ax+bx)/2, my=(ay+by)/2;
    const sagG=sg/sM, Rg=R/sM;                               /* マス単位に直す */
    const h=Rg-sagG;                                         /* 中心までの距離（弦から） */
    const cx=mx-nx*h*dir, cy=my-ny*h*dir;                    /* 円の中心 */
    const a0=Math.atan2(ay-cy, ax-cx), a1=Math.atan2(by-cy, bx-cx);
    let d0=a1-a0;                                            /* 短いほうの回りを採る */
    while(d0>Math.PI) d0-=2*Math.PI;
    while(d0<-Math.PI) d0+=2*Math.PI;
    if(ang>Math.PI-1e-6 && Math.abs(d0)<Math.PI-1e-6) d0=(d0>=0?1:-1)*(2*Math.PI-Math.abs(d0));
    const SEG=Math.max(4, Math.min(64, NN_ARC_SEG|0));
    const r3=v=>Math.round(v*1000)/1000;
    const ins=[];
    for(let k=1;k<SEG;k++){
      const t=a0+d0*(k/SEG);
      ins.push({x:r3(cx+Math.cos(t)*Rg), y:r3(cy+Math.sin(t)*Rg)});
    }
    if(!ins.length){ toast('弧にできませんでした'); return false; }
    /* ★弧を作った辺には印（arc）を付ける。図面の寸法の札を、細切れの1本ずつではなく
       「弧ぜんぶで1つ」だけ出すために使う（16本ぶんの札が並ぶと図面が読めない）。 */
    const aid=Math.floor(Date.now()%1e7)+Math.floor(Math.random()*1000);
    /* ★2026-08-28e 元の辺の中身は「そのまま写す」こと。
       ek() で作り直すと、ek が知らない項目（アルミ笠木・壁の厚み・取り合い）が
       ごっそり消える（巡回で発見。弧にすると笠木が外れていた）。 */
    const src=ring.edges[i]||{};
    const cp=()=>Object.assign({}, src, {arc:aid});
    ring.edges[i]=Object.assign({}, src, {arc:aid});
    ring.pts.splice(i+1, 0, ...ins);
    ring.edges.splice(i+1, 0, ...ins.map(cp));
    sel={p:sel.p, r:sel.r, e:i};
    if(typeof afterEdgeChange==='function') afterEdgeChange();
    else { saveState(); renderEdgeEdit(); draw(); }
    try{ if(window.nnSyncSharedEdges) nnSyncSharedEdges(); }catch(_){}
    try{ recalc(); }catch(_){}
    try{ dirty3d=true; if(tab==='d3'||document.body.classList.contains('nnsplit2')) build3D(); }catch(_){}
    toast('この辺を弧にしました（膨らみ '+Math.round(sag*1000)+'mm・半径 '+f1(R)+'m）');
    return true;
  };
  /* 数字キーパッドで膨らみを聞く（ツールバーの「◜ 弧」から） */
  window.nnEdgeArcAsk=function(){
    if(typeof sel==='undefined' || !sel){ toast('「選択」で弧にしたい辺をタップしてから押してください'); return; }
    const ring=selRing(); if(!ring){ toast('先に辺を選んでください'); return; }
    const N=ring.pts.length, i=sel.e;
    const chordM=edgeLenM(ring.pts[i], ring.pts[(i+1)%N], state.scaleM||0.5);
    const ask=window.nnNumAsk||function(t,d0,cb){ const r=prompt(t,d0); cb(r===null?null:r); };
    ask('弧の膨らみ（mm）　＋＝外へ／−＝内へ　辺の長さ '+f1(chordM)+'m',
        String(Math.round(chordM*1000/6)), function(v){
      if(v==null)return;
      nnEdgeArc(+v||0);
    });
  };
  /* 数字キーパッドで開始位置と長さを聞く */
  window.nnEdgeRangeAsk=function(){
    if(typeof sel==='undefined' || !sel){ toast('先に辺を選んでください'); return; }
    const ring=selRing(), N=ring.pts.length;
    const a=ring.pts[sel.e], b=ring.pts[(sel.e+1)%N];
    const totM=edgeLenM(a,b,state.scaleM);
    const ask=(window.nnNumAsk)||function(t,d,cb){ const v=prompt(t,d); cb(v===null?null:v); };
    ask('この辺（'+f1(totM)+'m）の どこから？（m）','0',function(s0){
      if(s0===null)return;
      ask('その先 何m ぶんを変える？','2.5',function(L){
        if(L===null)return;
        nnEdgeSplitRange(s0,L);
      });
    });
  };

  /* 3Dの編集カードにも「範囲で編集」を足す（カードは作り直されるので後から挿す） */
  setInterval(function(){
    const d=document.getElementById('d3edit');
    if(!d || !d.querySelector('.d3e-all') || d.querySelector('.d3e-range')) return;
    const btn=document.createElement('button');
    btn.className='d3e-range';
    btn.textContent='📏 この辺の一部だけ変える';
    btn.onclick=function(){ nnEdgeRangeAsk(); };
    d.appendChild(btn);
  }, 400);
})();
</script>

<script id="nn-httl-js">
/* 見出しの文字だけを span.httl で包む。
   ★右端に置く補助の文字（.r／.cta など）は包まない＝タグの外に残す。
   ★中身を作り直すページ（国交省仕様・ライブラリ等）があるので、
     作り直されたら包み直す（MutationObserver・0.2秒のまとめ）。 */
(function(){
  var SEL='.panel > h4, .wr-box > h4, .dpanel > h4, .proc-card > h4, .notebox-h > h4';
  var STOP=/(^|\s)(r|cta|zx|colgear|sub|hcount|tag)(\s|$)/;
  function wrap(h){
    if(h.getAttribute('data-nnht')==='1') return;
    if(h.querySelector('.httl')){ h.setAttribute('data-nnht','1'); return; }
    var kids=[].slice.call(h.childNodes);
    var sp=document.createElement('span'); sp.className='httl';
    for(var i=0;i<kids.length;i++){
      var n=kids[i];
      if(n.nodeType===1 && STOP.test(' '+String(n.className||'')+' ')) break;
      sp.appendChild(n);
    }
    if(!String(sp.textContent||'').trim()){        /* 包むものが無いときは何もしない */
      while(sp.firstChild) h.insertBefore(sp.firstChild, h.firstChild);
      return;
    }
    h.insertBefore(sp, h.firstChild);
    h.setAttribute('data-nnht','1');
  }
  function run(){ try{ [].forEach.call(document.querySelectorAll(SEL), wrap); }catch(e){} }
  if(document.readyState==='loading') addEventListener('DOMContentLoaded',run); else run();
  addEventListener('load',function(){ setTimeout(run,200); });
  try{
    var t=null;
    new MutationObserver(function(){ if(t)return; t=setTimeout(function(){ t=null; run(); },200); })
      .observe(document.body,{childList:true,subtree:true});
  }catch(e){}
})();
</script>

<script id="nn-adj-js">
/* ============================================================
   ★2026-08-16s 2つめの屋根を隣に描くとき、境界の辺を引かなくてよいようにした
   ------------------------------------------------------------
   《本人の指示》
   ・「屋根が隣接するときの、境界となるエッジをわざわざ引かなくてもよいようにして」
   ・「屋根1が2階・屋根2が1階のとき、その境界に立上りパラペットが2つできることがあるが不要」

   《やり方》
   ①作図中、**始点が既存の屋根の輪郭の上**にあり、いま置こうとしている点も
     **同じ屋根の輪郭の上**なら、そこで「閉じる」ことができる。
     足りない境界の線は、その屋根の輪郭をなぞって**自動で補う**。
     ★どちら回りでなぞるかは「できあがる面積が小さいほう」を採る。
       逆回りは既存の屋根をぐるりと囲んでしまい、面積がその分だけ大きくなるので、
       これだけで確実に見分けられる。
   ②できた境界の辺は、**両側で立上りが二重にならない**ように種別を決める。
     ・高さ（GL）が同じ … 両方「立上りなし」（同じ屋根面の切れ目なので立上りは無い）
     ・高さが違う      … 低いほう＝「壁当り」／高いほう＝そのまま（パラペット）
     手で境界をなぞって描いたときも同じように直す（closePoly のあとに1回だけ）。
   ============================================================ */
(function(){
'use strict';
const EPS=1e-9;
/* 「線の上」とみなす近さ（マス）。画面6px相当。 */
function tol(){ return Math.min(0.12, 6/(window.cellPx||40)); }

/* 点 p が線分 a-b の上にあるか。乗っていれば {t, d, x, y} */
function onSeg(a,b,p,t0){
  const dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy;
  if(L2<EPS) return null;
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;
  if(t<-0.002||t>1.002) return null;
  t=Math.max(0,Math.min(1,t));
  const qx=a.x+dx*t, qy=a.y+dy*t, d=Math.hypot(p.x-qx,p.y-qy);
  return d<=t0 ? {t:t, d:d, x:qx, y:qy} : null;
}
/* 点がどの部位の外周のどの辺に乗っているか（いちばん近いもの） */
function ringHit(p, t0){
  let best=null;
  (state.polys||[]).forEach(function(poly,pi){
    const pts=poly.pts||[]; const n=pts.length;
    for(let i=0;i<n;i++){
      const h=onSeg(pts[i], pts[(i+1)%n], p, t0);
      if(h && (!best || h.d<best.d)) best={pi:pi, i:i, t:h.t, d:h.d, x:h.x, y:h.y};
    }
  });
  return best;
}
/* リング上の位置 s（＝辺番号＋その中の割合）から s へ、前向きに通る頂点をならべる */
function fwdVerts(pts, sB, sA){
  const n=pts.length, out=[];
  let target=(sA>sB+1e-6)? sA : sA+n;
  let s=Math.floor(sB+1e-6)+1, guard=0;
  while(s<target-1e-6 && guard++<n+2){ out.push(pts[((s%n)+n)%n]); s++; }
  return out;
}
function ringPaths(poly, hA, hB){
  const pts=poly.pts, n=pts.length;
  const sA=hA.i+hA.t, sB=hB.i+hB.t;
  const f=fwdVerts(pts, sB, sA);                       /* B→A（番号が増える向き） */
  const b=fwdVerts(pts, sA, sB).slice().reverse();     /* B→A（番号が減る向き） */
  return [f, b];
}
function areaOf(pts){
  let a=0; for(let i=0;i<pts.length;i++){ const p=pts[i], q=pts[(i+1)%pts.length];
    a+=p.x*q.y-q.x*p.y; } return Math.abs(a)/2;
}

/* いま「隣に合わせて閉じられる」状態か。閉じられるなら中身を返す */
let PEND=null;
function checkAdj(g){
  PEND=null;
  if(typeof tool==='undefined' || tool!=='draw') return null;
  if(!drawPts || drawPts.length<2) return null;
  const t0=tol();
  const hA=ringHit(drawPts[0], Math.max(t0, 0.06));    /* 始点は既存の角に吸っている想定 */
  if(!hA) return null;
  const hB=ringHit(g, t0);
  if(!hB || hB.pi!==hA.pi) return null;
  const poly=state.polys[hA.pi];
  const B={x:hB.x, y:hB.y};
  const last=drawPts[drawPts.length-1];
  const base=drawPts.slice();
  if(Math.hypot(B.x-last.x, B.y-last.y)>1e-6) base.push(B);
  if(base.length<3) return null;
  const paths=ringPaths(poly, hA, hB);
  let best=null;
  paths.forEach(function(path){
    const cand=base.concat(path);
    if(cand.length<3) return;
    const a=areaOf(cand);
    if(a<1e-6) return;
    if(!best || a<best.area) best={pts:cand, path:path, area:a, from:base.length};
  });
  if(!best) return null;
  PEND={pi:hA.pi, pts:best.pts, from:best.from-1, endB:B};   /* from-1＝Bへ向かう辺の番号 */
  return PEND;
}
window.nnAdjPending=function(){ return PEND; };

/* ---- ① 打点の判定に「隣に合わせて閉じる」を足す ---- */
const _resolve=window.nnResolvePoint;
window.nnResolvePoint=function(gx,gy){
  const r=_resolve(gx,gy);
  if(r.close){ PEND=null; return r; }                  /* 始点タップの閉じが優先 */
  const a=checkAdj(r.g);
  if(a) return {g:{x:a.endB.x, y:a.endB.y}, close:true, adj:true};
  return r;
};

/* ---- ② 閉じるときに、境界の線を自動で足す ---- */
const _closePoly=window.closePoly;
window.closePoly=function(){
  const a=PEND;
  if(!a){ _closePoly(); nnSyncSharedEdges(); return; }
  const keep=drawPts.slice();
  drawPts=a.pts.slice();                                /* 境界をなぞった形にしてから作る */
  try{ _closePoly(); }catch(e){ drawPts=keep; PEND=null; throw e; }
  PEND=null;
  const poly=state.polys[state.polys.length-1];
  if(poly){
    /* 自動で足した辺（Bから先＋閉じの辺）に印を付ける＝あとで種別をそろえる */
    for(let i=a.from;i<poly.edges.length;i++) poly.edges[i].adj=1;
  }
  nnSyncSharedEdges();
  try{ saveState(); renderPolyList(); draw(); }catch(e){}
  toast('となりの屋根との境界は自動でつなぎました（種別も合わせています）');
};

/* ---- ③ 重なっている辺の種別をそろえる（立上りを二重にしない） ---- */
function segOverlap(a1,a2,b1,b2){
  /* 2つの線分がほぼ同じ直線に乗っていて、どれだけ重なっているか（マス） */
  const ux=a2.x-a1.x, uy=a2.y-a1.y, L=Math.hypot(ux,uy);
  if(L<1e-6) return 0;
  const nx=-uy/L, ny=ux/L;
  const d1=Math.abs((b1.x-a1.x)*nx+(b1.y-a1.y)*ny);
  const d2=Math.abs((b2.x-a1.x)*nx+(b2.y-a1.y)*ny);
  if(d1>tol()||d2>tol()) return 0;                     /* 平行でない・離れている */
  const t1=((b1.x-a1.x)*ux+(b1.y-a1.y)*uy)/(L*L);
  const t2=((b2.x-a1.x)*ux+(b2.y-a1.y)*uy)/(L*L);
  const lo=Math.max(0, Math.min(t1,t2)), hi=Math.min(1, Math.max(t1,t2));
  return Math.max(0,(hi-lo))*L;
}
function setKind(e, k, defH, defW){
  e.k=k;
  if(k==='free'){ e.h=0; e.w=0; e.ago=false; }
  if(k==='kabe'){ e.w=0; e.ago=false; if(!e.h)e.h=defH; }
  if(k==='para'){ if(!e.h)e.h=defH; if(!e.w)e.w=defW; }
}
window.nnSyncSharedEdges=function(){
  const P=state.polys||[]; if(P.length<2) return 0;
  const defH=+((document.getElementById('defH')||{}).value)||300;
  const defW=+((document.getElementById('defW')||{}).value)||250;
  let n=0;
  for(let a=0;a<P.length;a++)for(let b=a+1;b<P.length;b++){
    const A=P[a], B=P[b];
    for(let i=0;i<A.pts.length;i++){
      const a1=A.pts[i], a2=A.pts[(i+1)%A.pts.length];
      const la=Math.hypot(a2.x-a1.x, a2.y-a1.y); if(la<1e-6) continue;
      for(let j=0;j<B.pts.length;j++){
        const b1=B.pts[j], b2=B.pts[(j+1)%B.pts.length];
        const lb=Math.hypot(b2.x-b1.x, b2.y-b1.y); if(lb<1e-6) continue;
        const ov=segOverlap(a1,a2,b1,b2);
        if(ov < Math.min(la,lb)*0.5) continue;          /* 半分以上重なっていれば「境界」 */
        const ea=A.edges[i], eb=B.edges[j]; if(!ea||!eb) continue;
        const lvA=(+A.lv||0), lvB=(+B.lv||0);   /* ★2026-08-24p 平場の高さで比べる（bodyLv は廃止） */
        if(Math.abs(lvA-lvB)<1e-6){                     /* 同じ高さ＝ただの切れ目 */
          setKind(ea,'free',defH,defW); setKind(eb,'free',defH,defW);
        }else if(lvA<lvB){                              /* Aが下＝Aは壁当り／上のBはパラペット */
          setKind(ea,'kabe',defH,defW); if(eb.k!=='para') setKind(eb,'para',defH,defW);
        }else{
          setKind(eb,'kabe',defH,defW); if(ea.k!=='para') setKind(ea,'para',defH,defW);
        }
        n++;
      }
    }
  }
  if(n){ try{ recalc(); dirty3d=true; if(tab==='d3')build3D(); }catch(e){} }
  return n;
};
/* 部位の高さ（GL+）を変えたときも、境界の種別を合わせ直す */
const _setLv=window.setLv;
if(typeof _setLv==='function'){
  window.setLv=function(){ const r=_setLv.apply(null,arguments);
    try{ nnSyncSharedEdges(); saveState(); draw(); }catch(e){} return r; };
}

/* ---- ④ 「ここで閉じる（境界は自動）」の見せ方 ---- */
const _draw=window.draw;
window.draw=function(){
  _draw();
  try{
    const a=PEND; if(!a) return;
    const ctx2=cv.getContext('2d');
    const X=x=>ox+x*cellPx, Y=y=>oy+y*cellPx;
    ctx2.save();
    /* 自動で足す境界を、紫の点線で見せる */
    ctx2.setLineDash([7,5]); ctx2.lineWidth=2.2; ctx2.strokeStyle='#8e44ad';
    ctx2.beginPath();
    for(let i=a.from;i<a.pts.length;i++){
      const p=a.pts[i], q=a.pts[(i+1)%a.pts.length];
      ctx2.moveTo(X(p.x),Y(p.y)); ctx2.lineTo(X(q.x),Y(q.y));
    }
    ctx2.stroke(); ctx2.setLineDash([]);
    /* 閉じる場所の輪と案内 */
    const e=a.endB;
    ctx2.beginPath(); ctx2.arc(X(e.x),Y(e.y),13,0,Math.PI*2);
    ctx2.strokeStyle='#8e44ad'; ctx2.lineWidth=2; ctx2.stroke();
    ctx2.font='bold 12px system-ui, sans-serif'; ctx2.textAlign='center';
    ctx2.lineWidth=3; ctx2.strokeStyle='#fff';
    ctx2.strokeText('ここで閉じる（境界は自動）', X(e.x), Y(e.y)+28);
    ctx2.fillStyle='#8e44ad';
    ctx2.fillText('ここで閉じる（境界は自動）', X(e.x), Y(e.y)+28);
    ctx2.restore();
  }catch(err){}
};
})();
</script>

<script id="nn-tbname-js">
(function(){
/* 長押し(0.45秒)でボタンの名前を出す。離すと消える。長押しだったときは click を1回だけ抑止
   （名前を確かめたいだけなのに機能が動いてしまうのを防ぐ）。 */
var tip=document.createElement('div'); tip.id='nnTbName'; document.body.appendChild(tip);
var tm=null, long=false, cur=null;
function nameOf(b){
  /* ★2026-08-27d スマホで記号だけに短くしたボタンは、短くする前の名前を data-nm に控えてある */
  if(b.dataset&&b.dataset.nm) return b.dataset.nm;
  var tx=b.querySelector('.tbtx');
  var t=(tx&&tx.textContent.trim())||b.title||'';
  if(!t){ /* 絵文字だけのボタン（↩等）は title が頼り */ t=b.getAttribute('aria-label')||''; }
  return t;
}
function show(b){
  var t=nameOf(b); if(!t) return;
  tip.textContent=t; tip.style.display='block';
  var Z=window.nnPZ||1, r=b.getBoundingClientRect();
  /* rect は倍率後のpx・style は倍率前のpx（§61）。割ってから入れる */
  tip.style.left=Math.max(4, r.left/Z)+'px';
  var tr=tip.getBoundingClientRect();
  var top=(r.top - tr.height - 8)/Z;
  if(top<4) top=(r.bottom+8)/Z;
  tip.style.top=top+'px';
  /* 右端で切れるときは左へ寄せる */
  tr=tip.getBoundingClientRect();
  if(tr.right>innerWidth-4) tip.style.left=Math.max(4,(innerWidth-4-tr.width))/Z+'px';
}
function hide(){ tip.style.display='none'; if(tm){clearTimeout(tm); tm=null;} cur=null; }
document.addEventListener('pointerdown',function(e){
  var b=e.target.closest&&e.target.closest('#toolbar .tbtn'); if(!b) return;
  long=false; cur=b;
  tm=setTimeout(function(){ long=true; show(b); },450);
},true);
document.addEventListener('pointerup',function(){ if(tm){clearTimeout(tm); tm=null;} setTimeout(hide,long?600:0); },true);
document.addEventListener('pointercancel',hide,true);
/* 長押しだったタップの click は1回だけ止める（機能を動かさない） */
document.addEventListener('click',function(e){
  if(long && cur && e.target.closest && e.target.closest('#toolbar .tbtn')===cur){
    e.stopPropagation(); e.preventDefault(); long=false;
  }
},true);
})();
</script>

<script id="nn-sec3d-js">
/* ============================================================
   断面 → 3D（2026-08-18g・描いた断面を押し出す）
   ③断面で描いた輪郭（state.sect）を、指定した奥行きぶん押し出して立体にする。
   「防水層」に指定した辺には、外側に少し離した帯（実物の色）を同じ奥行きで付ける。
   ★build3D 本体は触らず包むだけ（§119の型）。ヘッダーの④3D＝いつもの図面の3D。
   ============================================================ */
(function(){
"use strict";
let SECT3D=false, KEEP=false;

/* 輪郭の回り方（符号付き面積）。外向きの法線を出すのに使う */
function areaOf(pts){ let a=0; for(let i=0;i<pts.length;i++){ const p=pts[i],q=pts[(i+1)%pts.length]; a+=p.x*q.y-q.x*p.y; } return a/2; }

function buildSectMesh(){
  const s=state.sect; if(!s||!s.closed||s.pts.length<3)return;
  const D=Math.max(0.2,+s.depth||2);
  const sp=(typeof spec==='function')?spec():{color:'#5a4a42'};
  const g=T.group;
  /* --- 躯体（断面を押し出し） --- */
  const shape=new THREE.Shape(s.pts.map(p=>new THREE.Vector2(p.x,p.y)));
  const geo=new THREE.ExtrudeGeometry(shape,{depth:D,bevelEnabled:false});
  geo.translate(0,0,-D/2);
  if(typeof nnUvMetric==='function'){ try{ nnUvMetric(geo, NN_TEX_PER_M, NN_TEX_PER_M); }catch(_){} }
  const mBody=(typeof nnMat==='function')?nnMat('concrete',0xd9d5cc,true)
    :new THREE.MeshStandardMaterial({color:0xd9d5cc, side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(geo,mBody);
  mesh.castShadow=true; mesh.receiveShadow=true; g.add(mesh);

  /* --- 防水層（指定した辺の外側に帯を貼る） --- */
  const sgn=areaOf(s.pts)>0?1:-1;      /* 反時計回りなら +。外向き法線の符号に使う */
  const col=(typeof nnMemColor==='function')?nnMemColor(sp):0x8f948d;
  const mWp=(typeof nnMat==='function')?nnMat('sheet',col,true)
    :new THREE.MeshStandardMaterial({color:col, side:THREE.DoubleSide});
  const T1=0.004, T2=0.026;            /* 面から 4mm〜26mm（3Dで層が見えるように少し厚く） */
  /* 点が輪郭の中かどうか（外向きを確実に決めるため。回り方の判定だけに頼らない） */
  function inPoly(x,y,pts){
    let inside=false;
    for(let i=0,j=pts.length-1;i<pts.length;j=i++){
      const xi=pts[i].x, yi=pts[i].y, xj=pts[j].x, yj=pts[j].y;
      if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/((yj-yi)||1e-12)+xi)) inside=!inside;
    }
    return inside;
  }
  (s.wp||[]).forEach(i=>{
    const a=s.pts[i], b=s.pts[(i+1)%s.pts.length];
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy); if(L<1e-6)return;
    /* 外向き法線。回り方で決めたあと、実際に外に出ているか確かめて必要なら反転する */
    let nx=(dy/L)*sgn, ny=(-dx/L)*sgn;
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, t=Math.max(0.002,L*0.02);
    if(inPoly(mx+nx*t, my+ny*t, s.pts)){ nx=-nx; ny=-ny; }
    const q=[[a.x+nx*T1,a.y+ny*T1],[b.x+nx*T1,b.y+ny*T1],[b.x+nx*T2,b.y+ny*T2],[a.x+nx*T2,a.y+ny*T2]];
    const sh=new THREE.Shape(q.map(v=>new THREE.Vector2(v[0],v[1])));
    const gg=new THREE.ExtrudeGeometry(sh,{depth:D,bevelEnabled:false});
    gg.translate(0,0,-D/2);
    if(typeof nnUvMetric==='function'){ try{ nnUvMetric(gg, NN_TEX_PER_M, NN_TEX_PER_M); }catch(_){} }
    const mm=new THREE.Mesh(gg,mWp); mm.castShadow=true; mm.receiveShadow=true; mm.name='nnSectWp'; g.add(mm);
  });

  /* --- 下地（構造体）の形（2026-08-18h）：デッキの波・木造の垂木・ALCの目地 --- */
  try{ if(window.nnKouzouMesh3D) nnKouzouMesh3D(g, s, D); }catch(e){}

  /* --- カメラを断面に合わせる（polys が空なので build3D 側の全体表示は走らない） --- */
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  s.pts.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);});
  T.tx=(x0+x1)/2; T.tz=0;
  T.r=Math.max(x1-x0, y1-y0, D, 1)*2.4;
  if(T.sun&&T.sun.shadow){ T.sun.shadow.needsUpdate=true; }
}

/* build3D を包む：断面3Dモード中は「部位ゼロで組んでから」断面の立体を足す */
const _b3=window.build3D;
window.build3D=function(){
  if(!SECT3D) return _b3.apply(this,arguments);
  const kp=state.polys, ka=state.active;
  state.polys=[]; state.active=0;
  try{ _b3.apply(this,arguments); }
  finally{ state.polys=kp; state.active=ka; }
  try{ if(typeof T!=='undefined'&&T&&T.group) buildSectMesh(); }catch(e){ console&&console.warn&&console.warn(e); }
  try{ T.rev=(T.rev|0)+1; }catch(_){}
};

/* ⬔ボタン経由でないタブ移動でモード解除（ヘッダーの④3D＝いつもの図面の3D）。
   ★2026-08-19i ただし「部位が1つも無くて断面だけ描いてある」ときは、
     ④3D を押しても真っ白になっていた（断面は⬔ボタン経由でしか3Dにならなかった）。
     その場合は断面の3Dを見せる。部位があるときは今までどおり図面の3D。 */
const _st=window.setTab;
window.setTab=function(t){
  if(!KEEP && SECT3D){ SECT3D=false; try{ dirty3d=true; }catch(_){} }
  const r=_st.apply(this,arguments);
  if(t==='d3' && !KEEP && !SECT3D){
    const noPoly=!(state.polys && state.polys.length);
    const s=state.sect;
    const hasSect=!!(s && s.closed && s.pts.length>=3);
    if(noPoly && hasSect){
      SECT3D=true; try{ dirty3d=true; }catch(_){}
      try{ build3D(); }catch(_){}
      let n=0;(function arm(){ if(typeof T!=='undefined'&&T){ if(window.d3ViewIso) d3ViewIso(); }
        else if(n++<40){ setTimeout(arm,150); } })();
      if(typeof toast==='function') toast('③断面で描いた断面を3Dにしました（奥行き'+(s.depth||2)+'m）');
    }
  }
  return r;
};

window.nnSec3D=function(){
  const s=state.sect;
  if(!s||!s.closed||s.pts.length<3){
    if(typeof toast==='function') toast('先に断面の輪郭を描いて、始点をタップして閉じてください');
    return;
  }
  SECT3D=true;
  try{ dirty3d=true; }catch(_){}
  KEEP=true; try{ setTab('d3'); } finally { KEEP=false; }
  /* ★3Dを初めて開くときは three.js の読み込みが非同期でカメラ(T)がまだ無い。
     できるまで待ってから角度を入れる（最大6秒） */
  let n=0;
  (function arm(){
    if(typeof T!=='undefined' && T){ if(window.d3ViewIso) d3ViewIso(); }
    else if(n++<40){ setTimeout(arm,150); }
  })();
  if(typeof toast==='function') toast('描いた断面を3Dにしました（奥行き'+(s.depth||2)+'m）。①図面・③断面に戻ると解除されます');
};
window.nnSectIs3D=()=>SECT3D;
})();
</script>

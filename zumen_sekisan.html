<script id="nn-3ddraw-js">
/* ============================================================
   ★2026-08-23a 3D直接編集
   ①「描画」ツールのまま3Dの面をタップ：1点目で面が決まり（平場・立上り側面・
     天端どれでも）、赤い点線がついてくる。2点目で長方形が確定。
   ② カードから「⬆押出し」「⬇引込み」→ 奥行きを数字で入れると、その面の
     向きへ立体が生える／へこみの印が付く。3Dでかいた立体はどれも
     「選択」でタップして選べ、🗑・Deleteキー・全削除で消せる。
   ③ 役物スタンプ（ドレン・脱気筒・笠木…）は3Dでゴースト（半透明の緑）が
     指についてきて、どこに置かれるかがリアルタイムで見える。
   build3D 本体には手を入れない（§119 と同じ、上に載せる方式）。
   ============================================================ */
(function(){
"use strict";
var armed=false, sg=null, gg=null, DS=null, selSol=-1;
var pvLine=null, pvRect=null, pvDots=[];

function ok3(){ return (typeof THREE!=='undefined') && (typeof T!=='undefined') && T && T.scene && T.renderer; }
function active(){ return ok3() && typeof tab!=='undefined' && tab==='d3' && typeof tool!=='undefined' && tool==='draw'; }
window.nnD3DrawOn=function(){ return active() && !!DS; };
function pend(){ return !!(DS && !DS.b && !DS.closed); }   /* まだ次の点を待っている */
window.nnSolSelIdx=function(){ return selSol; };

/* ── まとまり（組み直されても消えない。T.scene 直下＝§119の deco と同じ） ── */
function solGrp(){ if(!ok3())return null;
  if(!sg||sg.parent!==T.scene){ sg=new THREE.Group(); sg.name='nnSolG'; T.scene.add(sg); }
  return sg; }
function ghostGrp(){ if(!ok3())return null;
  if(!gg||gg.parent!==T.scene){ gg=new THREE.Group(); gg.name='nnGhostG'; T.scene.add(gg); }
  return gg; }
/* ★2026-08-28f 使い回している物かどうかの見分け。
   このページの決まりは `userData.nnShared`（§177）。3Dでかいた立体まわりだけ
   `_nnShared` という別の印を使っていたため、**使い回しの材質まで捨てて**いた。
   捨てるとシェーダー（絵の描き方）も作り直しになり、ドラッグ1コマで6回も
   作り直していた（実測240回／40コマ）。§178でいちど直した「固まる」原因と同じ。 */
function nnShared(o){ return !!(o && (o._nnShared || (o.userData && o.userData.nnShared))); }
function nnFree(o){
  if(o.geometry && o.geometry.dispose && !nnShared(o.geometry)) o.geometry.dispose();
  if(o.material){
    if(o.material.map && o.material.map.dispose && !nnShared(o.material.map)) o.material.map.dispose();
    if(o.material.dispose && !nnShared(o.material)) o.material.dispose();
  }
}
function clearGrp(g){ while(g&&g.children.length){ var c=g.children[0];
  c.traverse&&c.traverse(nnFree);
  g.remove(c);} }

/* ── 面の座標系：法線 n から「面の中のよこ u・たて v」を決める ──
   壁（たての面）＝ u は水平・v は上向き。平場・天端（よこの面）＝ u=+x。 */
function basisFor(n){
  var up=new THREE.Vector3(0,1,0), u;
  if(Math.abs(n.dot(up))>0.9) u=new THREE.Vector3(1,0,0);
  else u=new THREE.Vector3().crossVectors(up,n).normalize();
  var v=new THREE.Vector3().crossVectors(n,u).normalize();
  return {u:u,v:v};
}
var SNAP=0.05;                                     /* 面の中は5cmきざみ */
function snap(x){ return Math.round(x/SNAP)*SNAP; }
function toPlane(pt){ var q=new THREE.Vector3().subVectors(pt,DS.p0);
  return [snap(q.dot(DS.u)), snap(q.dot(DS.v))]; }
function toWorld(cu,cv){ return new THREE.Vector3().copy(DS.p0)
  .addScaledVector(DS.u,cu).addScaledVector(DS.v,cv); }

/* ── レイ（タップ位置）→ 3Dの当たり／作図面上の点 ── */
function rayAt(e){
  var el=T.renderer.domElement, r=el.getBoundingClientRect();
  if(!r.width||!r.height)return null;
  var v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  var rc=new THREE.Raycaster(); rc.setFromCamera(v, T.camera); return rc;
}
function faceHit(rc){
  var tg=[T.group]; if(sg)tg.push(sg);
  try{ T.group.updateMatrixWorld(true); if(sg)sg.updateMatrixWorld(true); }catch(_){}
  var hits=rc.intersectObjects(tg,true)||[];
  for(var i=0;i<hits.length;i++){
    var o=hits[i].object;
    if(!hits[i].face)continue;
    if(o.userData&&o.userData.pick)continue;               /* 見えない当たり判定は無視 */
    if(o.name==='nnSolLab')continue;                        /* 立体の寸法札（面から浮いている）も無視 */
    if(o.material&&o.material.transparent&&o.material.opacity<0.1)continue;
    var n=hits[i].face.normal.clone().transformDirection(o.matrixWorld).normalize();
    /* ★2026-08-28d 「見えている側」を面の表にする。
       防水層の平場は両面の板で、向きが裏（下向き）のことがある。そのままだと
       押し出したものが屋根の下へもぐってしまう（実際にもぐっていた）。 */
    if(n.dot(rc.ray.direction)>0) n.negate();
    return {point:hits[i].point.clone(), n:n};
  }
  return null;
}
function planePt(rc){                               /* 決めた面の上へレイを落とす */
  var ro=rc.ray.origin, rd=rc.ray.direction;
  var dn=rd.dot(DS.n); if(Math.abs(dn)<1e-6)return null;
  var t=new THREE.Vector3().subVectors(DS.p0,ro).dot(DS.n)/dn;
  if(t<0)return null;
  return new THREE.Vector3().copy(ro).addScaledVector(rd,t);
}

/* ── かいている最中の見た目（赤い点線・角の点・寸法の札） ── */
function dashMat(){ return new THREE.LineDashedMaterial({color:0xd8321e, dashSize:0.12, gapSize:0.07, depthTest:false}); }
function setLine(name, pts){
  var g=solGrp(); if(!g)return;
  var old=g.getObjectByName(name); if(old){ old.geometry.dispose(); old.material.dispose(); g.remove(old); }
  if(!pts)return null;
  var geo=new THREE.BufferGeometry().setFromPoints(pts);
  var ln=new THREE.Line(geo, dashMat()); ln.computeLineDistances();
  ln.name=name; ln.renderOrder=998; g.add(ln);
  if(name==='nnPvLine')pvLine=ln; else pvRect=ln;
  return ln;
}
function dot(pt){
  var g=solGrp(); if(!g)return;
  var m=new THREE.Mesh(new THREE.SphereGeometry(0.045,10,10),
    new THREE.MeshBasicMaterial({color:0xd8321e, depthTest:false}));
  m.position.copy(pt); m.renderOrder=999; m.name='nnPvDot'; g.add(m); pvDots.push(m);
}
function clearPv(){
  var g=sg; if(!g)return;
  ['nnPvLine','nnPvRect'].forEach(function(nm){ var o=g.getObjectByName(nm);
    if(o){ o.geometry.dispose(); o.material.dispose(); g.remove(o);} });
  pvDots.forEach(function(m){ if(m.parent){ m.geometry.dispose(); m.material.dispose(); m.parent.remove(m);} });
  pvDots=[]; pvLine=pvRect=null;
  if(T)T.rev=(T.rev|0)+1;
}
function lab(){ var d=document.getElementById('nnD3Lab');
  if(!d){ d=document.createElement('div'); d.id='nnD3Lab';
    var w=document.getElementById('three-wrap'); if(w)w.appendChild(d); }
  return d; }
function labAt(e, txt){
  var d=lab(); if(!d)return;
  var w=document.getElementById('three-wrap'); if(!w)return;
  var r=w.getBoundingClientRect(), Z=window.nnPZ||1;
  d.style.display='block';
  d.style.left=((e.clientX-r.left)/Z+16)+'px';
  d.style.top =((e.clientY-r.top)/Z-30)+'px';
  d.textContent=txt;
}
function labOff(){ var d=document.getElementById('nnD3Lab'); if(d)d.style.display='none'; }

/* ── カード（長方形が決まったら／立体を選んだら 出る） ── */
function card(){ var d=document.getElementById('nnD3Card');
  if(!d){ d=document.createElement('div'); d.id='nnD3Card';
    var w=document.getElementById('three-wrap'); if(w)w.appendChild(d); }
  return d; }
function cardOff(){ var d=document.getElementById('nnD3Card'); if(d)d.classList.remove('on'); }
function f2(x){ return (Math.round(x*100)/100).toFixed(2); }
function showRectCard(){
  var d=card(); if(!d)return;
  var W=Math.abs(DS.b[0]-DS.a[0]), H=Math.abs(DS.b[1]-DS.a[1]);
  d.innerHTML='<span class="tt">長方形 '+f2(W)+' × '+f2(H)+' m</span>'
    +'<button class="pr" onclick="nnSolAsk(\'out\')">⬆ 押出し</button>'
    +'<button class="pr" onclick="nnSolAsk(\'out\',\'cyl\')">⚪ 円柱</button>'
    +'<button class="in" onclick="nnSolAsk(\'in\')">⬇ 引込み</button>'
    +'<button onclick="nnSolRectDim()">✎ 寸法</button>'
    +'<button onclick="nnD3PolyFromRect()">⬡ 形を変える</button>'
    +'<button onclick="nnD3DrawCancel()">✕ やり直す</button>';
  d.classList.add('on');
}
/* ★2026-08-28d 面の上に「自由な形」をかく＝§232
   本人の依頼「その発生した面を全て、出したり引っ込めたり、その面の一部の区画を
   出したり引っ込めたりしたい」。長方形だけでは屋上の区画は表せないので、
   多角形＋弧（アール）をかけるようにした。 */
function polyPts(){ return (DS&&DS.pts)?DS.pts:null; }
function drawPolyPv(closed){
  var P=polyPts(); if(!P||P.length<1)return;
  var w=P.map(function(q){ return toWorld(q[0],q[1]); });
  if(closed&&w.length>2) w.push(w[0].clone());
  setLine('nnPvRect', w.length>1?w:null);
  T.rev=(T.rev|0)+1;
}
function polyAreaUV(P){ var s2=0; for(var i=0;i<P.length;i++){ var q=P[(i+1)%P.length];
  s2+=P[i][0]*q[1]-q[0]*P[i][1]; } return Math.abs(s2)/2; }
function showPolyCard(){
  var d=card(); if(!d)return;
  var P=polyPts()||[];
  d.innerHTML='<span class="tt">自由な形　'+P.length+'点'
      +(P.length>2?('　'+f2(polyAreaUV(P))+'㎡'):'')+'</span>'
    +'<button onclick="nnD3PolyArc()">◜ 直前の辺を弧に</button>'
    +'<button onclick="nnD3PolyUndo()">↩ 1点戻す</button>'
    +(P.length>2?'<button class="pr" onclick="nnD3PolyClose()">✓ 閉じる</button>':'')
    +'<button onclick="nnD3DrawCancel()">✕ やり直す</button>';
  d.classList.add('on');
}
/* 長方形の4隅から「自由な形」に切り替える（弧にしたい辺があるとき） */
window.nnD3PolyFromRect=function(){
  if(!DS||!DS.b){ toast('先に長方形をかいてください'); return; }
  var A=DS.a,B=DS.b;
  DS.pts=[[A[0],A[1]],[B[0],A[1]],[B[0],B[1]],[A[0],B[1]]];
  DS.b=null; DS.closed=true;
  drawPolyPv(true); showPolyCard();
  toast('自由な形にしました（◜ で辺を弧にできます／タップで点を足せます）');
};
window.nnD3PolyStart=function(){
  if(!DS||!DS.a){ toast('先に面をタップしてください'); return; }
  DS.pts=[[DS.a[0],DS.a[1]]]; DS.b=null; DS.closed=false;
  drawPolyPv(false); showPolyCard();
  toast(NN_PHONE?'指を置いて狙い、離すと点が増えます。始点をタップで閉じます'
                :'タップで点を足します。始点をタップすると閉じます');
};
window.nnD3PolyUndo=function(){
  var P=polyPts(); if(!P)return;
  if(P.length<=1){ nnD3DrawCancel(); return; }
  P.pop(); DS.closed=false; drawPolyPv(false); showPolyCard();
};
window.nnD3PolyClose=function(){

    +'<button class="in" onclick="nnSolAsk(\'in\')">⬇ 引込み</button>'

/* 直前の辺（閉じているときは最後の辺）を弧にする。＋＝左へ／−＝右へ膨らむ */
window.nnD3PolyArc=function(){
  var P=polyPts(); if(!P||P.length<2){ toast('2点以上かいてから押してください'); return; }
  var i=P.length-2, j=P.length-1;
  if(DS.closed){ i=P.length-1; j=0; }
  var a=P[i], b=P[j];
  var c=Math.hypot(b[0]-a[0], b[1]-a[1]);
  if(c<0.05){ toast('この辺は短すぎます'); return; }
  var ask=window.nnNumAsk||function(t,d0,cb){ var r=prompt(t,d0); cb(r===null?null:r); };
  ask('弧の膨らみ（mm）　＋と−で向きが変わります　辺の長さ '+f2(c)+'m',
      String(Math.round(c*1000/6)), function(v){
    if(v==null)return;
    var sag=(+v||0)/1000;
    if(Math.abs(sag)<0.01){ toast('膨らみは10mm以上で入れてください'); return; }
    sag=Math.max(-c*4, Math.min(c*4, sag));
    var sg=Math.abs(sag), R=(c*c/4+sg*sg)/(2*sg);
    var ux=(b[0]-a[0])/c, uy=(b[1]-a[1])/c;
    var nx=-uy, ny=ux, dir=(sag>=0)?1:-1;
    var mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    var h=R-sg, cx=mx-nx*h*dir, cy=my-ny*h*dir;
    var a0=Math.atan2(a[1]-cy,a[0]-cx), a1=Math.atan2(b[1]-cy,b[0]-cx);
    var d0=a1-a0; while(d0>Math.PI)d0-=2*Math.PI; while(d0<-Math.PI)d0+=2*Math.PI;
    var SEG=Math.max(4, Math.min(48, (window.NN_ARC_SEG|0)||16));
    var ins=[];
    for(var k=1;k<SEG;k++){ var t=a0+d0*(k/SEG);
      ins.push([Math.round((cx+Math.cos(t)*R)*1000)/1000, Math.round((cy+Math.sin(t)*R)*1000)/1000]); }
    P.splice(i+1, 0, ...ins);
    drawPolyPv(!!DS.closed);
    if(DS.closed) nnD3PolyClose(); else showPolyCard();
    toast('弧にしました（膨らみ '+Math.round(sag*1000)+'mm・半径 '+f2(R)+'m）');
  });
};

/* ── 立体を組み立てる（build3D のあとに毎回のせ直す） ── */
/* ★2026-08-28f 寸法の札の絵は「同じ文字なら使い回す」（巡回で見つけた漏れの対策）。
   立体を作り直すたびに新しい絵を作っていたので、面をドラッグして奥行きを変えると
   毎コマ1枚ずつ GPU に絵が溜まり続けていた（2秒のドラッグで約8MB）。
   §183の「黒くなる・落ちる」と同じ仕組みなので、必ず使い回すこと。
   ★使い回す絵には `_nnShared` の印を付け、後片付けで捨てないようにする。 */
/* ★2026-08-28f 立体まわりの材質も使い回す（作り直すとシェーダーの作り直しになる）。
   毎コマ新しく作っていたので、面をドラッグすると1コマで4回もシェーダーを
   作り直していた（§178でいちど直した「固まる」原因と同じ）。 */
var _nnSolMat={};
function solMat(key, make){
  var m=_nnSolMat[key];
  if(!m){ m=make(); m.userData.nnShared=1; _nnSolMat[key]=m; }
  return m;
}
var _nnLabTex={}, _nnLabSeq=[];
function txLabel(txt){
  var key=String(txt);
  var hit=_nnLabTex[key];
  if(hit){ var i=_nnLabSeq.indexOf(key); if(i>=0)_nnLabSeq.splice(i,1); _nnLabSeq.push(key); return hit; }
  var c=document.createElement('canvas'); c.width=256; c.height=64;
  var x=c.getContext('2d'); x.fillStyle='rgba(20,40,28,.85)'; x.fillRect(0,0,256,64);
  x.fillStyle='#fff'; x.font='800 30px sans-serif'; x.textAlign='center'; x.textBaseline='middle';
  x.fillText(txt,128,34);
  var t=new THREE.CanvasTexture(c); t.needsUpdate=true; t._nnShared=1;
  _nnLabTex[key]=t; _nnLabSeq.push(key);
  while(_nnLabSeq.length>24){                 /* 長く使っていないものから捨てる（24枚で頭打ち） */
    var old=_nnLabSeq.shift(), o=_nnLabTex[old];
    if(o){ try{ o.dispose(); }catch(_){} delete _nnLabTex[old]; }
  }
  return t;
}
/* 札の材質も文字ごとに使い回す（絵だけ使い回しても、材質を作り直せばシェーダーが作り直しになる） */
var _nnLabMat={};
function labMat(txt){
  var key=String(txt), m=_nnLabMat[key];
  if(!m){
    m=new THREE.MeshBasicMaterial({map:txLabel(key), transparent:true, depthTest:false});
    m.userData.nnShared=1; _nnLabMat[key]=m;
    /* 絵の置き場から消えた文字は、材質も捨てる（置き場は24枚で頭打ち） */
    Object.keys(_nnLabMat).forEach(function(k){
      if(k!==key && !_nnLabTex[k]){ try{ _nnLabMat[k].dispose(); }catch(_){} delete _nnLabMat[k]; } });
  }
  return m;
}
/* ★2026-08-28d 自由な形（多角形・弧）を、その形のまま押し出す／へこませる。
   ExtrudeGeometry は「平面の形＋奥行き」で立体を作るので、面の座標系（u,v,n）を
   そのまま向きに使えば、どの面の上でも同じように扱える。 */
function polyShape(pts){
  var sh=new THREE.Shape();
  sh.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) sh.lineTo(pts[i][0], pts[i][1]);
  sh.closePath(); return sh;
}
function polyBody(it,idx,u,v,n,p0,W,H){
  var g=solGrp(); if(!g)return;
  var depth=(it.mode==='in')?0.012:Math.max(0.02,it.d);
  var root=new THREE.Group(); root.matrixAutoUpdate=false;
  /* 面から少しだけ浮かせて置く（面とぴったり重ねるとチラつくため） */
  var base=new THREE.Vector3().copy(p0).addScaledVector(n,(it.mode==='in')?0:0.002);
  root.matrix.copy(new THREE.Matrix4().makeBasis(u,v,n).setPosition(base));
  var gm=new THREE.ExtrudeGeometry(polyShape(it.pts),{depth:depth, bevelEnabled:false});
  var body=new THREE.Mesh(gm, (it.mode==='in')
    ? solMat('in', function(){ return new THREE.MeshStandardMaterial({color:0x39424a, roughness:0.9}); })
    : nnMat('concrete',0xd6dad2,false));
  body.castShadow=true; body.receiveShadow=true;
  body.userData.solIdx=idx;
  var eg=new THREE.LineSegments(new THREE.EdgesGeometry(gm),
    solMat('edge', function(){ return new THREE.LineBasicMaterial({color:0x39463d}); }));
  body.add(eg);
  /* 札は「形の重心」に置く。外接の四角の真ん中だと、L字のときへこみ（何も無い所）に出る */
  var cu=(it.a[0]+it.b[0])/2, cv=(it.a[1]+it.b[1])/2;
  (function(){ var A=0,gx=0,gy=0,P=it.pts;
    for(var q=0;q<P.length;q++){ var a1=P[q], b1=P[(q+1)%P.length];
      var cr=a1[0]*b1[1]-b1[0]*a1[1];
      A+=cr; gx+=(a1[0]+b1[0])*cr; gy+=(a1[1]+b1[1])*cr; }
    if(Math.abs(A)>1e-6){ cu=gx/(3*A); cv=gy/(3*A); }
  })();
  var lb=new THREE.Mesh(new THREE.PlaneGeometry(0.62,0.155),
    labMat((it.mode==='in'?'引込み ':'押出し ')+Math.round(it.d*1000)));
  lb.position.set(cu,cv,(it.mode==='in')?0.02:depth+0.02); lb.renderOrder=997;
  lb.name='nnSolLab'; body.add(lb);
  if(idx===selSol){
    var hl=new THREE.Mesh(new THREE.ExtrudeGeometry(polyShape(it.pts),{depth:depth+0.04, bevelEnabled:false}),
      solMat('hl', function(){ return new THREE.MeshBasicMaterial({color:0xe8760a, transparent:true, opacity:0.4, depthTest:false}); }));
    hl.position.set(0,0,-0.02); hl.renderOrder=999; body.add(hl);
  }
  root.add(body); g.add(root);
}
window.nnSolRender=function(){
  if(!ok3())return;
  var g=solGrp(); if(!g)return;
  /* かいている途中の赤い線は残し、立体だけ作り直す */
  for(var i=g.children.length-1;i>=0;i--){
    var c=g.children[i];
    if(c.name==='nnPvLine'||c.name==='nnPvRect'||c.name==='nnPvDot')continue;
    /* ★2026-08-28f 形と絵は捨て、使い回している物（nnShared）は捨てない。
       絵を捨てないと GPU に溜まり続け、使い回しの材質を捨てるとシェーダーが作り直しになる。 */
    c.traverse(nnFree);
    g.remove(c);
  }
  (state.d3sol||[]).forEach(function(it,idx){
    /* ★保存が壊れていても落ちないように（§210の型） */
    if(!it||typeof it!=='object'||!it.a||!it.b||!it.u||!it.v||!it.n||!it.p)return;
    if(it.shape==='poly'){
      if(!Array.isArray(it.pts)) it.shape='box';
      else{
        it.pts=it.pts.filter(function(q){ return Array.isArray(q)&&isFinite(+q[0])&&isFinite(+q[1]); })
                     .map(function(q){ return [+q[0],+q[1]]; });
        if(it.pts.length<3) it.shape='box';
      }
    }
    var u=new THREE.Vector3().fromArray(it.u), v=new THREE.Vector3().fromArray(it.v),
        n=new THREE.Vector3().fromArray(it.n), p0=new THREE.Vector3().fromArray(it.p);
    var W=Math.abs(it.b[0]-it.a[0]), H=Math.abs(it.b[1]-it.a[1]);
    if(W<0.01||H<0.01)return;
    if(it.shape==='poly'&&it.pts&&it.pts.length>=3){ polyBody(it,idx,u,v,n,p0,W,H); return; }
    var cu=(it.a[0]+it.b[0])/2, cv=(it.a[1]+it.b[1])/2;
    var root=new THREE.Group(); root.matrixAutoUpdate=false;
    var depth=(it.mode==='in')?0.012:Math.max(0.02,it.d);
    var ctr=new THREE.Vector3().copy(p0).addScaledVector(u,cu).addScaledVector(v,cv)
              .addScaledVector(n,(it.mode==='in')?0.006:depth/2+0.002);
    root.matrix.copy(new THREE.Matrix4().makeBasis(u,v,n).setPosition(ctr));
    var body;
    if(it.mode==='in'){
      /* 引込み＝濃い色のくぼみ板＋内側の枠（CSGは使わず「へこんで見える」印にする） */
      body=new THREE.Mesh(new THREE.BoxGeometry(W,H,depth),
        solMat('in', function(){ return new THREE.MeshStandardMaterial({color:0x39424a, roughness:0.9}); }));
      var inn=Math.min(0.04, Math.min(W,H)*0.18);
      var fr=new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(W-inn*2,H-inn*2,depth+0.002)),
        solMat('inFr', function(){ return new THREE.LineBasicMaterial({color:0x11161a}); }));
      body.add(fr);
    }else if(it.shape==='cyl'){
      /* ★2026-08-23c 円柱（配管・丸ダクト用）。断面はかいた長方形に内接するだ円（W×H）。
         材質はステンレス調＝配管を想定。だ円は geometry 側に焼き込む
         （mesh.scale だと子の札・光る箱までゆがむ）。 */
      var cg=new THREE.CylinderGeometry(W/2,W/2,depth,24);
      cg.rotateX(Math.PI/2); cg.scale(1,H/W,1);
      body=new THREE.Mesh(cg, nnMat('alum',0xc6ccd2,false));
      body.castShadow=true; body.receiveShadow=true;
    }else{
      body=new THREE.Mesh(new THREE.BoxGeometry(W,H,depth), nnMat('concrete',0xd6dad2,false));
      body.castShadow=true; body.receiveShadow=true;
    }
    body.userData.solIdx=idx;
    var eg=new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry),
      solMat('edge', function(){ return new THREE.LineBasicMaterial({color:0x39463d}); }));
    body.add(eg);
    /* 寸法の札（何がどれだけ出ている／へこんでいるかを常に見せる） */
    var lb=new THREE.Mesh(new THREE.PlaneGeometry(0.62,0.155),
      labMat((it.mode==='in'?'引込み ':(it.shape==='cyl'?'円柱 ':'押出し '))+Math.round(it.d*1000)));
    lb.position.set(0,0,(it.mode==='in')?0.02:depth/2+0.02); lb.renderOrder=997;
    lb.name='nnSolLab';                       /* ★作図の当たり判定からは除く（浮いた札の上にかかない） */
    body.add(lb);
    if(idx===selSol){
      var hl=new THREE.Mesh(new THREE.BoxGeometry(W+0.04,H+0.04,depth+0.04),
        solMat('hl', function(){ return new THREE.MeshBasicMaterial({color:0xe8760a, transparent:true, opacity:0.4, depthTest:false}); }));
      hl.renderOrder=999; body.add(hl);
    }
    root.add(body); g.add(root);
  });
  T.rev=(T.rev|0)+1;
};

window.nnSolAsk=function(mode, shape){

  var ask=window.nnNumAsk||function(t,d0,cb){ var r=prompt(t,d0); cb(r===null?null:r); };
  ask(mode==='in'?'引込みの深さ（mm）':(shape==='cyl'?'円柱の長さ（mm）':'押出しの奥行き（mm）'),'300',function(v){
    if(v===null)return;
    var mm=Math.max(10, Math.min(5000, +v||300));
    state.d3sol=state.d3sol||[];
    var rec={p:[DS.p0.x,DS.p0.y,DS.p0.z], n:DS.n.toArray(), u:DS.u.toArray(), v:DS.v.toArray(),
      d:mm/1000, mode:mode, shape:shape||'box'};
    if(isP){                                  /* ★自由な形：点の一覧＋外接の四角（大きさの表示・移動に使う） */
      var PP=DS.pts.map(function(q){ return [q[0],q[1]]; });
      var xs=PP.map(function(q){return q[0];}), ys=PP.map(function(q){return q[1];});
      rec.a=[Math.min.apply(null,xs), Math.min.apply(null,ys)];
      rec.b=[Math.max.apply(null,xs), Math.max.apply(null,ys)];

    }else{ rec.a=DS.a.slice(); rec.b=DS.b.slice(); }

    var msg=(mode==='in'?'引込み':(isP?'自由な形':(shape==='cyl'?'円柱':'押出し')))+'を作りました（選択ツールでタップ＝移動・寸法・削除ができます）';
    nnD3DrawCancel();

  });

window.nnSolPickAt=function(rc){

    if(o&&o.userData&&o.userData.solIdx!=null){

/* ============================================================
   ★2026-08-28d 作った立体の「表の面」をドラッグして、出し入れする（§232-C）
   本人の依頼「出したり引っ込めたりしたらそこにまた必ず面が生まれる。
   その発生した面を全て、出したり、引っ込めたりしたい」。
   ・押出し／引込みの立体の "表の面"（法線が n の向き）をつかむと奥行きが変わる
   ・その面の上にさらに長方形・自由な形をかけば、また出し入れできる（積み重ね）
   カメラは動かさない（面ドラッグと同じ印 nnFaceBusy を使う・§229）
   ============================================================ */
var solDrag=null;
function solBusyWrap(){                     /* カメラ側に「いま面をつかんでいる」と伝える */
  var f=window.nnFaceBusy;
  if(f && f._nnSolWrapped)return;
  var w=function(){ return !!solDrag || (f?f():false); };
  w._nnSolWrapped=1; window.nnFaceBusy=w;
}
function solCancel(){
  if(!solDrag)return;
  var it=(state.d3sol||[])[solDrag.idx];
  if(it && solDrag.d0!=null) it.d=solDrag.d0;
  solDrag=null; try{ nnSolRender(); }catch(_){}
}
function solMove(ev){
  if(!solDrag || ev.pointerId!==solDrag.pid)return;
  var it=(state.d3sol||[])[solDrag.idx]; if(!it){ solDrag=null; return; }
  var dx=ev.clientX-solDrag.x, dy=ev.clientY-solDrag.y;
  var mv=Math.hypot(dx,dy); if(mv>solDrag.moved)solDrag.moved=mv;
  var m=(dx*solDrag.ux+dy*solDrag.uy)*solDrag.mPerPx;
  it.d=Math.max(0.01, Math.min(5, Math.round((solDrag.d0+m)*200)/200));   /* 5mmきざみ */
  try{ nnSolRender(); showSolCard(); }catch(_){}
  ev.preventDefault();
}
function solUp(ev){
  if(!solDrag)return;
  if(ev.type==='pointermove')return;
  if(ev.pointerId!=null && ev.pointerId!==solDrag.pid && ev.type!=='pointercancel')return;
  var moved=solDrag.moved, it=(state.d3sol||[])[solDrag.idx];
  solDrag=null;
  if(moved>3 && it){ saveState(); toast((it.mode==='in'?'引込み':'押出し')+' '+Math.round(it.d*1000)+'mm'); }
}
var solWired=false;
function solWire(){
  if(solWired)return; solWired=true;
  addEventListener('pointermove', solMove, true);
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(t){
    addEventListener(t, solUp, true); });
  addEventListener('blur', function(){ solDrag=null; });
}
window.nnSolDragging=function(){ return !!solDrag; };
window.nnSolDragTry=function(e){
  if(!ok3()||!sg)return false;
  if(typeof tab==='undefined'||tab!=='d3')return false;
  if(typeof tool!=='undefined'&&tool!=='sel'&&tool!=='select')return false;
  /* ★2本目の指が来たら、つかみをやめてピンチに譲る（§229と同じ決まり） */
  if(solDrag && e.pointerId!==solDrag.pid){ solCancel(); return false; }
  var rc=rayAt(e); if(!rc)return false;
  try{ sg.updateMatrixWorld(true); }catch(_){}
  var hits=rc.intersectObjects(sg.children,true)||[], hit=null;
  for(var i=0;i<hits.length;i++){
    var o=hits[i].object; if(!hits[i].face)continue;
    if(o.name==='nnSolLab')continue;
    if(o.material&&o.material.transparent&&o.material.opacity<0.5)continue;   /* 選択中の橙は素通し */
    var oo=o; while(oo && (!oo.userData||oo.userData.solIdx==null) && oo.parent) oo=oo.parent;
    if(oo&&oo.userData&&oo.userData.solIdx!=null){ hit={idx:oo.userData.solIdx, h:hits[i]}; break; }
  }
  if(!hit)return false;
  var it=(state.d3sol||[])[hit.idx]; if(!it)return false;
  if(selSol!==hit.idx){ try{ nnSolSelect(hit.idx); }catch(_){} }
  var nv=new THREE.Vector3().fromArray(it.n);
  var fn=hit.h.face.normal.clone().transformDirection(hit.h.object.matrixWorld).normalize();
  if(fn.dot(nv)<0.85){                       /* 表の面以外＝選ぶだけ（横の面は動かさない） */
    e.preventDefault(); e.stopPropagation(); return true; }
  var el=T.renderer.domElement, r=el.getBoundingClientRect();
  var u=new THREE.Vector3().fromArray(it.u), v=new THREE.Vector3().fromArray(it.v),
      p0=new THREE.Vector3().fromArray(it.p);
  var cu=(it.a[0]+it.b[0])/2, cv=(it.a[1]+it.b[1])/2;
  var mid=new THREE.Vector3().copy(p0).addScaledVector(u,cu).addScaledVector(v,cv);
  var out=new THREE.Vector3().copy(mid).addScaledVector(nv,0.5);
  var p1=mid.clone().project(T.camera), p2=out.clone().project(T.camera);
  var sx=(p2.x-p1.x)*r.width/2, sy=-(p2.y-p1.y)*r.height/2;
  var len=Math.hypot(sx,sy); if(len<1)return false;         /* 真正面から見ていると動かせない */
  solBusyWrap(); solWire();
  solDrag={pid:e.pointerId, idx:hit.idx, d0:it.d, x:e.clientX, y:e.clientY,
           ux:sx/len, uy:sy/len, mPerPx:0.5/len, moved:0};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault(); e.stopPropagation();
  return true;
};

/* ★2026-08-23c 選んだ立体を「動かす」「寸法を数字で直す」。
   ゼロから役物を組むには、置いてから位置と寸法を追い込めることが要る。 */
var mvOn=false;
window.nnSolMoveOn=function(){
  if(selSol<0)return; mvOn=true;
  toast('移動先をタップしてください（同じ面の上を 5cmきざみで動かせます）');
};
window.nnSolMoveTo=function(rc){                    /* 統一タップ受け口から呼ばれる */
  if(!mvOn||selSol<0)return false;
  var it=(state.d3sol||[])[selSol]; if(!it){ mvOn=false; return false; }
  var n=new THREE.Vector3().fromArray(it.n), u=new THREE.Vector3().fromArray(it.u),
      v=new THREE.Vector3().fromArray(it.v), p0=new THREE.Vector3().fromArray(it.p);
  var ro=rc.ray.origin, rd=rc.ray.direction, dn=rd.dot(n);
  if(Math.abs(dn)<1e-6){ toast('その向きからは動かせません。少し視点を回してからタップしてください'); return true; }
  var t=new THREE.Vector3().subVectors(p0,ro).dot(n)/dn;
  if(t<0){ toast('その向きからは動かせません'); return true; }
  var q=new THREE.Vector3().copy(ro).addScaledVector(rd,t).sub(p0);
  var cu=snap(q.dot(u)), cv=snap(q.dot(v));
  var w2=it.b[0]-it.a[0], h2=it.b[1]-it.a[1];        /* 大きさはそのまま・中心だけ移す */
  if(it.shape==='poly'&&it.pts){                     /* 自由な形は点をまとめて同じだけ動かす */
    var dx=(cu-w2/2)-it.a[0], dy=(cv-h2/2)-it.a[1];
    it.pts=it.pts.map(function(q){ return [q[0]+dx, q[1]+dy]; });
  }
  it.a=[cu-w2/2, cv-h2/2]; it.b=[cu+w2/2, cv+h2/2];
  mvOn=false; saveState(); nnSolRender(); showSolCard(); toast('移動しました');
  return true;
};
window.nnSolDimEdit=function(){
  var it=(state.d3sol||[])[selSol]; if(!it)return;
  var ask=window.nnNumAsk||function(t,d0,cb){ var r=prompt(t,d0); cb(r===null?null:r); };
  if(it.shape==='poly'){        /* 自由な形は「よこ・たて」が決まらないので奥行きだけ */
    ask('奥行き（mm）', String(Math.round(it.d*1000)), function(v0){
      if(v0==null)return;
      it.d=Math.max(10,Math.min(5000,+v0||it.d*1000))/1000;
      saveState(); nnSolRender(); showSolCard();
    });
    return;
  }
  function upd(k,mm){ var s=(it.b[k]>=it.a[k])?1:-1;  /* a側の角は動かさない */
    it.b[k]=it.a[k]+s*Math.max(10,Math.min(100000,mm))/1000; }   /* ★2026-08-24z 上限100m */
  ask('よこ（mm）', String(Math.round(Math.abs(it.b[0]-it.a[0])*1000)), function(v1){
    if(v1!=null)upd(0,+v1||0);
    ask('たて（mm）', String(Math.round(Math.abs(it.b[1]-it.a[1])*1000)), function(v2){
      if(v2!=null)upd(1,+v2||0);
      ask('奥行き（mm）', String(Math.round(it.d*1000)), function(v3){
        if(v3!=null)it.d=Math.max(10,Math.min(5000,+v3||it.d*1000))/1000;
        saveState(); nnSolRender(); showSolCard();
      });
    });
  });
};

/* ── 打点・プレビューの中身（マウスとスマホの照準で共用する） ── */
function commitDrawAt(cx,cy){
  var rc=rayAt({clientX:cx,clientY:cy}); if(!rc)return;
  if(!DS){                                        /* 1点目＝どの面にかくかが決まる */
    var h=faceHit(rc); if(!h){ toast('屋根・立上り・天端の面をタップしてください'); return; }
    var bs=basisFor(h.n);
    DS={p0:h.point, n:h.n, u:bs.u, v:bs.v, a:null, b:null};
    DS.a=toPlane(h.point);
    dot(toWorld(DS.a[0],DS.a[1]));
    T.rev=(T.rev|0)+1;
    toast(NN_PHONE?'指を置くと赤い照準が出ます。狙って離すと2点目＝長方形':'2点目をタップすると長方形になります（同じ面の上で）');
    return;
  }
  if(DS.pts){                                     /* ★自由な形＝タップのたびに点が増える */
    if(DS.closed)return;
    var pp=planePt(rc); if(!pp)return;
    var qq=toPlane(pp), P=DS.pts;
    if(P.length>=3 && Math.hypot(qq[0]-P[0][0], qq[1]-P[0][1])<0.16){ nnD3PolyClose(); return; }
    var lastq=P[P.length-1];
    if(Math.hypot(qq[0]-lastq[0], qq[1]-lastq[1])<0.02){
      toast('同じ位置です。少し離してタップしてください'); return; }
    if(P.length>=200){ toast('点が多すぎます。ここで閉じてください'); return; }
    P.push(qq); dot(toWorld(qq[0],qq[1]));
    setLine('nnPvLine',null); labOff();
    drawPolyPv(false); showPolyCard();
    return;
  }
  if(!DS.b){                                      /* 2点目＝長方形が確定 */
    var pt=planePt(rc); if(!pt)return;
    DS.b=toPlane(pt);
    if(Math.abs(DS.b[0]-DS.a[0])<0.02||Math.abs(DS.b[1]-DS.a[1])<0.02){
      toast('同じ位置です。少し離してタップしてください'); DS.b=null; return; }
    dot(toWorld(DS.b[0],DS.b[1]));
    setLine('nnPvLine',null);
    var A=DS.a,B=DS.b;
    setLine('nnPvRect',[toWorld(A[0],A[1]),toWorld(B[0],A[1]),toWorld(B[0],B[1]),toWorld(A[0],B[1]),toWorld(A[0],A[1])]);
    labOff(); T.rev=(T.rev|0)+1;
    showRectCard();
  }
}
function lineAt(cx,cy){                            /* かいている途中の赤い点線＋寸法 */
  if(!pend())return;
  var rc=rayAt({clientX:cx,clientY:cy}); if(!rc)return;
  var pt=planePt(rc); if(!pt)return;
  var q=toPlane(pt);
  var fr=DS.pts? DS.pts[DS.pts.length-1] : DS.a;
  setLine('nnPvLine',[toWorld(fr[0],fr[1]),toWorld(q[0],q[1])]);
  labAt({clientX:cx,clientY:cy}, DS.pts
    ? (f2(Math.hypot(q[0]-fr[0], q[1]-fr[1]))+' m')
    : (f2(Math.abs(q[0]-DS.a[0]))+' × '+f2(Math.abs(q[1]-DS.a[1]))+' m'));
  T.rev=(T.rev|0)+1;
}
function ghostAt(cx,cy){                           /* 役物スタンプのゴースト */
  var rc2=rayAt({clientX:cx,clientY:cy}); if(!rc2)return;
  var h2=faceHit(rc2);
  var g=ghostGrp(); if(!g)return;
  if(!h2){ clearGrp(g); labOff(); T.rev=(T.rev|0)+1; return; }
  var P=(window.nnPartsLib?nnPartsLib():[]).find(function(x){return x.id===nnPlacingId();})||{};
  var w=Math.max(0.08,(+P.w||150)/1000), d=Math.max(0.08,(+P.d||150)/1000), hh=Math.max(0.05,(+P.h||100)/1000);
  if(!g.children.length){
    var gh=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),
      new THREE.MeshBasicMaterial({color:0x2e9e58, transparent:true, opacity:0.45, depthWrite:false}));
    gh.name='nnGhost'; gh.raycast=function(){};
    var pin=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,1.1,6),
      new THREE.MeshBasicMaterial({color:0xd8321e, depthTest:false}));
    pin.name='nnGhostPin'; pin.raycast=function(){}; pin.renderOrder=999;
    g.add(gh); g.add(pin);
  }
  var gh2=g.getObjectByName('nnGhost'), pin2=g.getObjectByName('nnGhostPin');
  gh2.scale.set(w,hh,d);
  var sM=state.scaleM||0.5;
  var gx=Math.round(h2.point.x/sM*10)/10, gy=Math.round(h2.point.z/sM*10)/10;   /* 置く処理と同じ丸め */
  gh2.position.set(gx*sM, h2.point.y+hh/2+0.01, gy*sM);
  pin2.position.set(gx*sM, h2.point.y+0.56, gy*sM);
  labAt({clientX:cx,clientY:cy},(P.name||'役物')+(NN_PHONE?'　離すと設置':'　タップで設置'));
  T.rev=(T.rev|0)+1;
}
function placeCommitAt(cx,cy){                     /* スタンプを照準の位置に置く */
  var rc=rayAt({clientX:cx,clientY:cy}); if(!rc)return;
  var hp=faceHit(rc);
  if(hp){ var sM=state.scaleM||0.5; nnPlaceAtGrid(hp.point.x/sM, hp.point.z/sM);
    try{ dirty3d=true; build3D(); }catch(_){} }
  else toast('屋根の上をタップしてください');
  if(gg)clearGrp(gg); labOff();
}

/* ── タップの受け口（描画ツール＋3Dのときだけ） ── */
function hook(){
  if(armed||!ok3())return; armed=true;
  var el=T.renderer.domElement, dp=null, dt=0;
  el.addEventListener('pointerdown',function(e){ dp=[e.clientX,e.clientY]; dt=Date.now(); });
  el.addEventListener('pointerup',function(e){
    if(window._nnAimUsedId===e.pointerId)return;   /* ★スマホの照準が処理ずみ（二重打点の防止） */
    if(!active()){ return; }
    if(window.nnPlacingId&&nnPlacingId())return;   /* スタンプ中は置く処理（受け口）に譲る */
    if(!dp)return;
    var moved=Math.hypot(e.clientX-dp[0], e.clientY-dp[1]); dp=null;
    if(moved>8||Date.now()-dt>700)return;          /* ドラッグ・長押し＝視点操作 */
    commitDrawAt(e.clientX,e.clientY);
  });
  el.addEventListener('pointermove',function(e){
    /* ①かいている途中：赤い点線と寸法がついてくる */
    if(active()&&pend()){ lineAt(e.clientX,e.clientY); return; }
    /* ②役物スタンプのゴースト：どこに置かれるかがリアルタイムで見える */
    if(ok3()&&typeof tab!=='undefined'&&tab==='d3'&&window.nnPlacingId&&nnPlacingId()){
      ghostAt(e.clientX,e.clientY); return;
    }
    /* ゴーストの後片付け（スタンプをやめたとき） */
    if(gg&&gg.children.length&&!(window.nnPlacingId&&nnPlacingId())){ clearGrp(gg); labOff(); if(T)T.rev=(T.rev|0)+1; }
  });

  /* ── ★2026-08-23d スマホは「赤い照準」（§28・§32 と同じ操作感）──
     指の真下に照準なしで打点する方式は、指で隠れて狙えない（2Dと現場マップで
     捨てた操作）。3Dも同じにする：指を置くと右上（+36,-52）に赤い照準が出て、
     指を動かして狙い、離した瞬間に照準の位置で 打点／設置／移動 する。
     照準中はカメラを動かさない（capture で止める）。2本目の指が来たら照準を
     やめてピンチに譲る。対象は 描画ツール・スタンプ設置・✥移動 の3つ。 */
  var wrapEl=document.getElementById('three-wrap');
  if(wrapEl && !wrapEl._nnAim){ wrapEl._nnAim=1;
    var AIMDX=36, AIMDY=-52;
    wrapEl.addEventListener('pointerdown',function(e){
      if(e.pointerType==='mouse')return;
      if(!aimable())return;
      if(aim){ aimHide(); aim=null; return; }      /* 2本目の指＝ピンチに譲る */
      if(e.target!==T.renderer.domElement)return;  /* パッドやカードの上では照準にしない */
      aim={id:e.pointerId, x:e.clientX, y:e.clientY};
      aimPreview();
    },true);
    wrapEl.addEventListener('pointermove',function(e){
      if(!aim||e.pointerId!==aim.id)return;
      if(!aimable()){ aimHide(); aim=null; return; }
      aim.x=e.clientX; aim.y=e.clientY;
      aimPreview();
      e.preventDefault(); e.stopPropagation();     /* ★カメラの移動に渡さない */
    },{capture:true,passive:false});
    var aimUp=function(e){
      if(!aim||e.pointerId!==aim.id)return;
      var qx=aim.x+AIMDX, qy=aim.y+AIMDY;
      var doCommit=(e.type==='pointerup')&&aimable();
      aimHide(); labOff(); aim=null;
      /* ★あとから動く el 側の受け口に「この指は処理ずみ」と伝える（二重打点の防止）。
         stopPropagation は使わない＝カメラ側の指の後片付け（tEnd）はそのまま動く */
      window._nnAimUsedId=e.pointerId;
      setTimeout(function(){ window._nnAimUsedId=null; },0);
      if(!doCommit)return;
      if(mvOn){ var rc=rayAt({clientX:qx,clientY:qy}); if(rc)nnSolMoveTo(rc); return; }
      if(window.nnPlacingId&&nnPlacingId()){ placeCommitAt(qx,qy); return; }
      if(typeof tool!=='undefined'&&tool==='draw') commitDrawAt(qx,qy);
    };
    wrapEl.addEventListener('pointerup',aimUp,true);
    wrapEl.addEventListener('pointercancel',aimUp,true);
  }
  function aimable(){
    return NN_PHONE && ok3() && typeof tab!=='undefined' && tab==='d3' && !window._nnExtOn &&
      ( (typeof tool!=='undefined'&&tool==='draw') || (window.nnPlacingId&&nnPlacingId()) || mvOn );
  }
  function aimPreview(){
    var qx=aim.x+36, qy=aim.y-52;
    if(mvOn){ aimShow(qx,qy,'移動先'); return; }
    if(window.nnPlacingId&&nnPlacingId()){ aimShow(qx,qy,''); ghostAt(qx,qy); return; }
    if(pend()){ aimShow(qx,qy,''); lineAt(qx,qy); return; }
    aimShow(qx,qy,'始点');
  }
}
function aimEl(){ var d=document.getElementById('nnD3Aim');
  if(!d){ d=document.createElement('div'); d.id='nnD3Aim';
    d.innerHTML='<i></i><b></b>';
    var w=document.getElementById('three-wrap'); if(w)w.appendChild(d); }
  return d; }
function aimShow(cx,cy,txt){
  var d=aimEl(); if(!d)return;
  var w=document.getElementById('three-wrap'); if(!w)return;
  var r=w.getBoundingClientRect(), Z=window.nnPZ||1;
  d.style.display='block';
  d.style.left=((cx-r.left)/Z)+'px';
  d.style.top =((cy-r.top)/Z)+'px';
  var b=d.querySelector('b'); if(b)b.textContent=txt||'';
}
function aimHide(){ var d=document.getElementById('nnD3Aim'); if(d)d.style.display='none'; }
var aim=null;
setInterval(hook, 800);
/* ツールやタブが変わったら、かきかけを片付ける */
setInterval(function(){
  if(DS&&!active()) nnD3DrawCancel();
  if(selSol>=0&&(typeof tab==='undefined'||tab!=='d3')){ selSol=-1; cardOff(); }
  if(mvOn&&(selSol<0||typeof tab==='undefined'||tab!=='d3')) mvOn=false;
},500);

/* build3D のあとに立体をのせ直す */
(function wrap(){
  if(typeof build3D!=='function'||build3D._nnSol){ setTimeout(wrap,400); return; }
  var _b=window.build3D;
  window.build3D=function(){ var r=_b.apply(this,arguments); try{ nnSolRender(); }catch(_){} return r; };
  window.build3D._nnSol=1;
})();

/* 🗑削除・全削除・Deleteキー・Esc に立体も参加させる */
(function wrapDel(){
  var _sd=window.smartDelete;
  if(typeof _sd==='function'&&!_sd._nnSol){
    window.smartDelete=function(){
      if(selSol>=0){ nnSolDelete(); return; }
      return _sd.apply(this,arguments);
    };
    window.smartDelete._nnSol=1;
  }
  var _ca=window.clearAll;
  if(typeof _ca==='function'&&!_ca._nnSol){
    window.clearAll=function(){
      var n=(state.d3sol||[]).length;
      if(!n) return _ca.apply(this,arguments);
      var others=(state.polys||[]).length||(window.nnPartsCount?nnPartsCount():0)||state.underlay;
      if(!others){
        if(!confirm('3Dでかいた立体 '+n+'件 をすべて削除しますか？'))return;
        state.d3sol=[]; selSol=-1; saveState(); nnSolRender(); cardOff();
        toast('3Dの立体を削除しました'); return;
      }
      var before=(state.polys||[]).length;
      var h0=(window.nnHistMark?nnHistMark():-1);
      var r=_ca.apply(this,arguments);
      /* 本体側で確認して消したとき（＝部位が0になったとき）は立体も一緒に消す */
      if((state.polys||[]).length===0 && before>0){
        state.d3sol=[]; selSol=-1; saveState(); nnSolRender(); cardOff();
      }
      /* ★2026-08-28i 保存が2回走るので、戻る・進むの記録は1つにまとめる
         （まとめないと ↩1回目が「何も起きない」ように見える） */
      try{ if(window.nnHistCollapse) nnHistCollapse(h0); }catch(_){}
      return r;
    };
    window.clearAll._nnSol=1;
  }
})();
setTimeout(function(){ /* smartDelete/clearAll が後から差し替わる保険 */
  var _sd=window.smartDelete;
  if(typeof _sd==='function'&&!_sd._nnSol){
    window.smartDelete=function(){ if(selSol>=0){ nnSolDelete(); return; } return _sd.apply(this,arguments); };
    window.smartDelete._nnSol=1;
  }
},1200);
addEventListener('keydown',function(e){
  if(typeof tab==='undefined'||tab!=='d3')return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName||''))return;
  if(e.key==='Escape'){ if(DS){ e.preventDefault(); nnD3DrawCancel(); } else if(selSol>=0){ e.preventDefault(); nnSolSelect(-1); } }
  if((e.key==='Delete'||e.key==='Backspace')&&selSol>=0){ e.preventDefault(); nnSolDelete(); }
});
})();
</script>

<script id="nn-rich3d-js">
/* ============================================================
   ★2026-08-23b リッチ3D部品（鳩小屋）＋ Blender(.glb) 読み込み口
   ①鳩小屋は、3Dでは「コンクリ台座＋箱＋笠木＋ステンレス配管（エルボで
     下りて支持ブロックへ）」の本物らしい姿で出る（写真を参考にした手続きモデル）。
   ②models/<kind>.glb を置くと、手続きモデルの代わりに **Blenderで作った
     モデル（PBRテクスチャ付き）** が読み込まれる。§63でPBR・環境光・影は
     整備済みなので、Blenderで焼いた質感がそのまま出る。
   ★parts3D（箱で描く既存処理）には手を入れない：箱を見えなくして、
     同じ位置にリッチモデルを重ねる（選択・回転・削除は箱がそのまま受ける）。
   ============================================================ */
(function(){
"use strict";
var GLB_CACHE={};                 /* kind → 'none'（無い）| THREE.Group（読めた） */
var GLB_LOADING={};
window.NN_GLB_BASE=window.NN_GLB_BASE||'models/';

function ok3(){ return (typeof THREE!=='undefined') && (typeof T!=='undefined') && T && T.group; }

/* ---- GLTFLoader は必要になったときだけ読む（§63 の nnLoadThree と同じ考え方） ---- */
var glLoaded=false, glLoading=false, glQ=[];
window.nnLoadGLTF=function(cb){
  if(glLoaded || (window.THREE&&THREE.GLTFLoader)){ glLoaded=true; cb(true); return; }
  glQ.push(cb);
  if(glLoading)return; glLoading=true;
  var sc=document.createElement('script');
  sc.src='vendor/GLTFLoader.js';
  sc.onload=function(){ glLoaded=true; glQ.forEach(function(f){f(true);}); glQ=[]; };
  sc.onerror=function(){ glLoading=false; glQ.forEach(function(f){f(false);}); glQ=[]; };
  document.head.appendChild(sc);
};
/* .glb を読む（kindごとに1回だけ確かめる。無ければ手続きモデルに戻る） */
function probeGLB(kind){
  if(GLB_CACHE[kind]!==undefined || GLB_LOADING[kind])return;
  GLB_LOADING[kind]=true;
  nnLoadGLTF(function(ok){
    if(!ok||!THREE.GLTFLoader){ GLB_CACHE[kind]='none'; GLB_LOADING[kind]=false; return; }
    new THREE.GLTFLoader().load(window.NN_GLB_BASE+kind+'.glb',
      function(g){ GLB_CACHE[kind]=g.scene; GLB_LOADING[kind]=false;
        try{ dirty3d=true; build3D(); }catch(_){}
        toast('Blenderモデル（'+kind+'.glb）を読み込みました'); },
      undefined,
      function(){ GLB_CACHE[kind]='none'; GLB_LOADING[kind]=false; });
  });
}

/* ---- 鳩小屋の手続きモデル（写真準拠：台座・箱・笠木・配管・支持ブロック） ---- */
function buildHatogoya(w,d,h){
  var g=new THREE.Group();
  var mBody=new THREE.MeshStandardMaterial({color:0xdfe2de, roughness:0.55, metalness:0.05});
  var mConc=nnMat('concrete',0xb6b0a4,false);
  var mPipe=nnMat('alum',0xc6ccd2,false);        /* ステンレス（§63 の金属質感） */

  /* コンクリの台座 */
  var base=new THREE.Mesh(new THREE.BoxGeometry(w+0.12,0.12,d+0.12), mConc);
  base.position.y=0.06; base.castShadow=base.receiveShadow=true; g.add(base);
  /* 箱の本体 */
  var bodyH=Math.max(0.3,h-0.22);
  var body=new THREE.Mesh(new THREE.BoxGeometry(w,bodyH,d), mBody);
  body.position.y=0.12+bodyH/2; body.castShadow=body.receiveShadow=true; g.add(body);
  /* 笠木（ひさし付きのふた）＋水切りの垂れ */
  var cap=new THREE.Mesh(new THREE.BoxGeometry(w+0.16,0.09,d+0.16), mBody);
  cap.position.y=0.12+bodyH+0.045; cap.castShadow=true; g.add(cap);
  var lip=new THREE.Mesh(new THREE.BoxGeometry(w+0.16,0.05,0.02), mBody);
  lip.position.set(0, 0.12+bodyH-0.02, (d+0.16)/2-0.01); g.add(lip);
  /* 配管：前面から水平に出て、エルボで下りて支持ブロックへ（本数は幅なり） */
  var n=Math.max(1,Math.min(6,Math.round(w/0.24)));
  var R=0.042, out=0.55, py=0.12+bodyH*0.55;
  for(var i=0;i<n;i++){
    var px=-w/2+ (w/(n+1))*(i+1);
    var hz=new THREE.Mesh(new THREE.CylinderGeometry(R,R,out,14), mPipe);
    hz.rotation.x=Math.PI/2; hz.position.set(px, py, d/2+out/2);
    hz.castShadow=true; g.add(hz);
    var fl=new THREE.Mesh(new THREE.CylinderGeometry(R+0.025,R+0.025,0.025,14), mPipe);
    fl.rotation.x=Math.PI/2; fl.position.set(px, py, d/2+0.012); g.add(fl);
    var el=new THREE.Mesh(new THREE.TorusGeometry(0.09,R,10,12,Math.PI/2), mPipe);
    el.position.set(px, py-0.09, d/2+out); el.rotation.y=Math.PI/2; el.rotation.z=Math.PI/2;
    el.castShadow=true; g.add(el);
    var vlen=Math.max(0.05, py-0.09-0.12);
    var vt=new THREE.Mesh(new THREE.CylinderGeometry(R,R,vlen,14), mPipe);
    vt.position.set(px, 0.12+vlen/2-0.005, d/2+out+0.09); vt.castShadow=true; g.add(vt);
    var blk=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.12,0.16), mConc);
    blk.position.set(px, 0.06, d/2+out+0.09); blk.castShadow=blk.receiveShadow=true; g.add(blk);
  }
  return g;
}
/* ---- 階段の手続きモデル（段板・側桁・手すり）。
   Blenderの models/kaidan.glb を置けば、そちらが優先される。 ---- */
function buildKaidan(w,d,h){
  var g=new THREE.Group();
  var mSteel=nnMat('alum',0xb9c0c6,false);
  var mStep =new THREE.MeshStandardMaterial({color:0x9aa2a8, roughness:0.7, metalness:0.35});
  var RISE=0.19;                                   /* 蹴上げ190mm＝屋上の階段のふつうの寸法 */
  var nStep=Math.max(2, Math.min(40, Math.round(h/RISE)));
  var rise=h/nStep, tread=d/nStep;
  for(var i=1;i<=nStep;i++){                       /* 段板 */
    var st=new THREE.Mesh(new THREE.BoxGeometry(w, 0.035, tread*0.96), mStep);
    st.position.set(0, rise*i-0.018, -d/2 + tread*(i-0.5));
    st.castShadow=st.receiveShadow=true; g.add(st);
  }
  var run=Math.hypot(d,h), ang=Math.atan2(h,d);    /* 側桁（両側の斜めの板） */
  for(var sgn=-1; sgn<=1; sgn+=2){
    var sr=new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.24, run), mSteel);
    sr.position.set(sgn*(w/2+0.02), h/2-0.10, 0);
    sr.rotation.x=-ang; sr.castShadow=true; g.add(sr);
    var hr=new THREE.Mesh(new THREE.CylinderGeometry(0.019,0.019,run,10), mSteel);
    hr.position.set(sgn*(w/2+0.02), h/2+0.85, 0);
    hr.rotation.x=Math.PI/2-ang; hr.castShadow=true; g.add(hr);
    var nPost=Math.max(2, Math.min(8, Math.round(run/0.9)));
    for(var k=0;k<=nPost;k++){                     /* 手すりの支柱 */
      var t=k/nPost;
      var po=new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,0.95,8), mSteel);
      po.position.set(sgn*(w/2+0.02), h*t+0.42, -d/2+d*t);
      po.castShadow=true; g.add(po);
    }
  }
  return g;
}
var RICH={ hatogoya: buildHatogoya, kaidan: buildKaidan };

/* ---- build3D のあと：対象の箱を隠して、同じ位置にリッチモデルを重ねる ----
   モデルは T.group に入れる＝次の組み直しで自動的に消える（後片付けいらず）。 */
function sync(){
  if(!ok3())return;
  var boxes=[];
  T.group.children.forEach(function(m){ if(m.name==='nnPart'&&m.userData&&m.userData.partIdx!=null)boxes.push(m); });
  boxes.forEach(function(m){
    if(m.userData._nnRichDone)return;   /* ★同じ組み直しの中で2回呼ばれても二重に置かない */
    m.userData._nnRichDone=1;
    var it=(state.parts||[])[m.userData.partIdx]; if(!it)return;
    var P=(window.nnPartsLib?nnPartsLib():[]).find(function(x){return x.id===it.p;}); if(!P)return;
    var kind=P.kind;
    /* ★2026-08-23c ユーザーが3Dで組んで登録した役物（custom）はここで組み立てる */
    var custom=(P.custom&&P.custom.sols&&P.custom.sols.length)?P.custom:null;
    if(!custom && !RICH[kind])return;
    if(!custom) probeGLB(kind);
    var w=(+P.w||600)/1000, d=(+P.d||600)/1000, h=(+P.h||600)/1000;
    var model;
    if(custom && window.nnCustomBuild){
      model=nnCustomBuild(P);
    }else if(GLB_CACHE[kind] && GLB_CACHE[kind]!=='none'){
      /* Blenderのモデル：横幅を部品のWに合わせて等倍で縮尺 */
      model=GLB_CACHE[kind].clone(true);
      var bb=new THREE.Box3().setFromObject(model);
      var sz=new THREE.Vector3(); bb.getSize(sz);
      var k=w/Math.max(0.001,sz.x);
      model.scale.setScalar(k);
      bb.setFromObject(model);
      model.position.y=-bb.min.y;      /* 底を地面に */
      var wrapg=new THREE.Group(); wrapg.add(model); model=wrapg;
      model.traverse(function(o){ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
    }else{
      model=RICH[kind](w,d,h);
    }
    m.visible=false;                   /* 箱は見えなくする（当たり判定・選択はそのまま生きる） */
    /* 箱と同じ位置・回転に置く。タップで部品を選べるよう partIdx も持たせる */
    model.position.set(m.position.x, m.position.y-((+P.h||0)/2000)-0.02, m.position.z);
    model.rotation.y=m.rotation.y;
    model.traverse(function(o){ o.userData.partIdx=m.userData.partIdx; });
    T.group.add(model);
  });
  if(T)T.rev=(T.rev|0)+1;
}
(function wrap(){
  if(typeof build3D!=='function'||build3D._nnRich){ setTimeout(wrap,400); return; }
  var _b=window.build3D;
  /* ★sync は「1コマあとで」呼ぶこと。nn-parts-js が DOMContentLoaded で build3D を
     もう一度包み直すため、箱を作る parts3D が包みのいちばん外側（＝最後）になる。
     即時に呼ぶと箱がまだ無い時点で走って空振りする（実際に空振りした）。 */
  window.build3D=function(){ var r=_b.apply(this,arguments);
    setTimeout(function(){ try{ sync(); }catch(_){} },0); return r; };
  window.build3D._nnRich=1;
})();
window.nnRichSync=sync;
})();
</script>

/* ============================================================
   ★2026-08-23c ゼロから役物を組んで登録する（本人の指示）

<script id="nn-custompart-js">
(function(){
"use strict";
/* 組んだ立体（state.d3sol）をまとめて、ひとつの「役物」としてライブラリに登録する。
   登録した役物は custom（形の一覧）を持ち、3Dでは nnCustomBuild が同じ姿に組み立てる。
   置く・回す・複製・削除・積算・保存は §73 の役物システムがそのまま受ける。 */

function V(a){ return new THREE.Vector3().fromArray(a); }

/* 立体1件の「中心・大きさ」（nnSolRender と同じ決め方） */
function solBox(it){
  var u=V(it.u), v=V(it.v), n=V(it.n), p0=V(it.p);
  var W=Math.abs(it.b[0]-it.a[0]), H=Math.abs(it.b[1]-it.a[1]);
  var depth=(it.mode==='in')?0.012:Math.max(0.02,it.d);
  var cu=(it.a[0]+it.b[0])/2, cv=(it.a[1]+it.b[1])/2;
  var ctr=new THREE.Vector3().copy(p0).addScaledVector(u,cu).addScaledVector(v,cv)
            .addScaledVector(n,(it.mode==='in')?0.006:depth/2+0.002);
  return {u:u,v:v,n:n,ctr:ctr,W:W,H:H,depth:depth};
}

window.nnSolRegister=function(){
  if(typeof THREE==='undefined'){ toast('3Dの部品を読み込み中です。少し待ってからもう一度'); return; }
  var sols=state.d3sol||[];
  if(!sols.length){ toast('先に「描画」で箱・円柱をかいてください'); return; }
  if(!confirm('3Dでかいた立体 '+sols.length+'件 を、ひとつの役物としてまとめて登録します。\n'
    +'登録すると立体は役物に置き換わり、他の現場でもそのまま使い回せます。よろしいですか？'))return;
  var name=prompt('役物の名前（例：鳩小屋 900×700）','自作の役物');
  if(name===null)return; name=String(name).trim()||'自作の役物';
  var ask=window.nnNumAsk||function(t,d0,cb){ var r=prompt(t,d0); cb(r===null?null:r); };
  ask('単価（円/個・かからなければ 0）','0',function(pv){
    if(pv===null)return;
    /* 全立体の外接箱（世界座標）を測る */
    var mn=new THREE.Vector3( 1e9, 1e9, 1e9), mx=new THREE.Vector3(-1e9,-1e9,-1e9);
    sols.forEach(function(it){
      var s=solBox(it);
      for(var sx=-1;sx<=1;sx+=2)for(var sy=-1;sy<=1;sy+=2)for(var sz=-1;sz<=1;sz+=2){
        var c=new THREE.Vector3().copy(s.ctr)
          .addScaledVector(s.u,sx*s.W/2).addScaledVector(s.v,sy*s.H/2).addScaledVector(s.n,sz*s.depth/2);
        mn.min(c); mx.max(c);
      }
    });
    /* 基準点＝外接箱の「底面の中心」。ここを役物の置き位置（＝箱の中心）にする */
    var C=new THREE.Vector3((mn.x+mx.x)/2, mn.y, (mn.z+mx.z)/2);
    var item={ id:'c'+Date.now().toString(36), name:name, kind:'custom',
      w:Math.max(50,Math.round((mx.x-mn.x)*1000)), d:Math.max(50,Math.round((mx.z-mn.z)*1000)),
      h:Math.max(50,Math.round((mx.y-mn.y)*1000)),
      price:Math.max(0,+pv||0), addM2:0, sealM:0, memo:'3Dで自作した役物',
      custom:{ sols: sols.map(function(it){
        return { p:[it.p[0]-C.x, it.p[1]-C.y, it.p[2]-C.z], n:it.n.slice(), u:it.u.slice(), v:it.v.slice(),
                 a:it.a.slice(), b:it.b.slice(), d:it.d, mode:it.mode, shape:it.shape||'box',
                 pts:(it.pts?it.pts.map(function(q){return [q[0],q[1]];}):undefined) };
      }) } };
    if(!window.nnPartsAddLib){ toast('役物の登録先が見つかりません'); return; }
    nnPartsAddLib(item);
    /* 同じ場所に1個置き直す（見た目が消えないように・§85⑩と同じ流儀） */
    var sM=state.scaleM||0.5;
    state.parts=state.parts||[];
    state.parts.push({p:item.id, x:Math.round(C.x/sM*10)/10, y:Math.round(C.z/sM*10)/10, r:0});
    state.d3sol=[];
    if(window.nnSolSelect)try{ nnSolSelect(-1); }catch(_){}
    saveState();
    try{ dirty3d=true; build3D(); recalc(); }catch(_){}
    toast('「'+name+'」を役物に登録しました。🔩 役物・架台から、他の現場でもそのまま置けます');
  });
};

/* 登録した役物を3Dに組み立てる（nn-rich3d-js の sync から呼ばれる）。
   見た目は nnSolRender と同じ作法（箱＝コンクリ調・円柱＝ステンレス調・引込み＝濃い板）。
   寸法の札は付けない（部品として置いたあとは、札だらけだとうるさい）。 */
window.nnCustomBuild=function(P){
  var g=new THREE.Group();
  ((P.custom&&P.custom.sols)||[]).forEach(function(it){
    var s=solBox(it);
    if(s.W<0.01||s.H<0.01)return;
    var root=new THREE.Group(); root.matrixAutoUpdate=false;
    var body;
    if(it.shape==='poly'&&it.pts&&it.pts.length>=3){   /* ★2026-08-28d 自由な形 */
      var p0c=new THREE.Vector3().fromArray(it.p);
      root.matrix.copy(new THREE.Matrix4().makeBasis(s.u,s.v,s.n).setPosition(p0c));
      var shc=new THREE.Shape(); shc.moveTo(it.pts[0][0],it.pts[0][1]);
      for(var ci=1;ci<it.pts.length;ci++) shc.lineTo(it.pts[ci][0],it.pts[ci][1]);
      shc.closePath();
      body=new THREE.Mesh(new THREE.ExtrudeGeometry(shc,{depth:s.depth,bevelEnabled:false}),
        (it.mode==='in')? new THREE.MeshStandardMaterial({color:0x39424a, roughness:0.9})
                        : nnMat('concrete',0xd6dad2,false));
      body.castShadow=true; body.receiveShadow=true;
      body.add(new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry),
        new THREE.LineBasicMaterial({color:0x39463d})));
      root.add(body); g.add(root); return;
    }
    root.matrix.copy(new THREE.Matrix4().makeBasis(s.u,s.v,s.n).setPosition(s.ctr));
    if(it.mode==='in'){
      body=new THREE.Mesh(new THREE.BoxGeometry(s.W,s.H,s.depth),
        new THREE.MeshStandardMaterial({color:0x39424a, roughness:0.9}));
    }else if(it.shape==='cyl'){
      var cg=new THREE.CylinderGeometry(s.W/2,s.W/2,s.depth,24);
      cg.rotateX(Math.PI/2); cg.scale(1,s.H/s.W,1);
      body=new THREE.Mesh(cg, nnMat('alum',0xc6ccd2,false));
    }else{
      body=new THREE.Mesh(new THREE.BoxGeometry(s.W,s.H,s.depth), nnMat('concrete',0xd6dad2,false));
    }
    body.castShadow=true; body.receiveShadow=true;
    var eg=new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry),
      new THREE.LineBasicMaterial({color:0x39463d}));
    body.add(eg);
    root.add(body); g.add(root);
  });
  return g;
};

/* 「📦 役物に登録」ボタン：3Dタブで、かいた立体があるときだけ出す */
setInterval(function(){
  var on=(typeof tab!=='undefined'&&tab==='d3'&&typeof state!=='undefined'&&(state.d3sol||[]).length>0);
  var b=document.getElementById('nnSolReg');

    var w=document.getElementById('three-wrap'); if(!w)return;
    b=document.createElement('button'); b.id='nnSolReg'; b.type='button';
    b.textContent='📦 役物に登録';
    b.onclick=function(){ nnSolRegister(); };
    w.appendChild(b);
  }
  b.style.display=on?'block':'none';
},600);
})();
</script>

<script id="nn-rtbl-js">
(function(){

/* ★窓と同じ作法：境界線にマウスを置くと ↔／↕ になり、ドラッグで大きさが変わる。
   移動は上の帯か緑の見出し行をつかむ。右上の ✕ で閉じる。 */
function wireDrag(t){

  var EDGE=7;

    var Z=window.nnPZ||1, r=t.getBoundingClientRect();

    if(L)return 'l'; if(R)return 'r'; if(B)return 'b';

  });

      try{ nnRoofTbl(false); }catch(_){}

    }
    var ed=edgeOf(e);
    var move=!ed && !!(tg&&tg.closest&&(tg.closest('.rhd')||tg.closest('th')));
    if(!ed&&!move)return;
    e.preventDefault(); e.stopPropagation();
    var Z=window.nnPZ||1;

        if(st.ed==='l'||st.ed==='lb'){ pos.w=Math.max(260, st.w0-dx); pos.x=st.x0+(st.w0-pos.w); }

/* ★2026-08-23k その屋根の「いちばん多い立上りH・天端W」（表に出す代表値） */
function majorHWof(p){
  var ch={}, cw={}, bh=300, bw=250, mh=0, mw=0;
  try{
    ringsOf(p).forEach(function(ring){
      (ring.edges||[]).forEach(function(e0){
        var e=ek(e0); if(e.k==='free')return;
        ch[e.h]=(ch[e.h]||0)+1; if(ch[e.h]>mh){ mh=ch[e.h]; bh=e.h; }
        if(e.k==='para'){ cw[e.w]=(cw[e.w]||0)+1; if(cw[e.w]>mw){ mw=cw[e.w]; bw=e.w; } }
      });

  return {h:bh, w:bw};

        else if(e.k==='para'){ e.w=val; }

/* ★2026-08-23k 長い屋根名が枠から見切れないよう、入るところまで文字を小さくする */

     はみ出し具合の比から必要な大きさを一発で見当づけるので、ふつうは1〜2周で終わる。 */
var _nnFitSig='', _nnFitSizes=[];
function fitNames(t){
  try{
    var els=[].slice.call(t.querySelectorAll('.rnm'));
    if(!els.length)return;
    /* ★2026-08-28j 名前と表の幅が前と同じなら、測らずに前の大きさをそのまま当てる。

       （測ると、作り直した直後の表ぜんぶの置き場所を計算し直すことになって重い） */
    /* ★合図に画面の寸法を読まないこと。作り直した直後に少しでも寸法を読むと、
       表ぜんぶの置き場所の計算が走ってそこで約90msかかる（計測ずみ）。
       表の幅は「手で広げた値（pos.w）」と窓の幅で足りる。 */
    var sig=((pos&&pos.w)||0)+'x'+window.innerWidth+'|'
      +els.map(function(el){ return el.value; }).join('\u0001');
    if(sig===_nnFitSig && _nnFitSizes.length===els.length){
      els.forEach(function(el,i){ el.style.setProperty('font-size', _nnFitSizes[i]+'px','important'); });
      return;
    }
    var fs=els.map(function(el){ el.style.setProperty('font-size','12px','important'); return 12; });
    for(var pass=0; pass<3; pass++){
      /* ① まとめて測る（読むだけなので置き場所の計算は1回で済む） */
      var need=els.map(function(el){ return [el.scrollWidth, el.clientWidth]; });
      /* ② まとめて書く */
      var again=false;
      els.forEach(function(el,i){
        var sw=need[i][0], cw=need[i][1];
        if(sw<=cw+1 || fs[i]<=7.5) return;
        var v=Math.max(7.5, Math.floor(fs[i]*cw/sw*2)/2 - (pass?0.5:0));
        if(v>=fs[i]) v=fs[i]-0.5;
        fs[i]=v; el.style.setProperty('font-size', v+'px','important'); again=true;
      });
      if(!again)break;

    _nnFitSig=sig; _nnFitSizes=fs;
  }catch(_){}
}

<script id="nn-ctxlost-js">
/* ★2026-08-24 「形状が黒になる」の原因と直し
   スマホ（とくにiPhone）は、ほかのアプリに切り替えたり、端末の記憶が足りなくなると、
   3Dを描くための土台（WebGLのコンテキスト）を取り上げることがある。
   このとき2つの問題が起きていた。
   ①受け口が無いと、ブラウザは土台を返してくれない
     （webglcontextlost のときに preventDefault() を呼んで初めて、返す約束になる）。
   ②土台が返ってきても、空の光（環境光・PMREM）は作り直されない。
     材質は空の光を見て色を決めるので、光が無いと建物が真っ黒に描かれる。
     ＝これが「形状が黒になる」の正体（実測：暗い画素 0.1% → 29.8%）。
   直し方＝受け口を作り、返ってきたら空の光を作り直して組み立て直す。
   ★init3D 本体は触らず、あとから包んで受け口を足している（§119 と同じやり方）。 */
(function(){
  function nnWireCtxLost(){
    if(typeof T==='undefined' || !T || !T.renderer) return;
    var el = T.renderer.domElement;
    if(!el || el._nnCtxWired) return;
    el._nnCtxWired = 1;

    /* 土台を取り上げられたとき */
    el.addEventListener('webglcontextlost', function(e){
      /* ★これを呼ばないと、ブラウザは二度と土台を返さない（＝黒いまま） */
      e.preventDefault();
      window.nnGLLost = 1;
      try{ if(window.toast) toast('3Dの表示をいったん休みます（すぐ戻ります）'); }catch(_){}
    }, false);

    /* 土台が返ってきたとき */
    el.addEventListener('webglcontextrestored', function(){
      window.nnGLLost = 0;
      try{
        var dark = (typeof nnTheme!=='undefined' && nnTheme==='dark');
        /* ①空の光を作り直す（これをしないと建物が真っ黒になる） */
        try{ T.scene.environment = nnMakeEnv(T.renderer, dark); }catch(_){ T.scene.environment = null; }
        /* ②影を計算し直す */
        try{ if(T.sun && T.sun.shadow) T.sun.shadow.needsUpdate = true; }catch(_){}
        /* ③組み立て直して、描き直させる */
        try{ if(typeof build3D==='function') build3D(); }catch(_){}
        T.sig = ''; T.rev = (T.rev|0)+1; T.draw = 2;
      }catch(_){}
      try{ if(window.toast) toast('3Dの表示が戻りました'); }catch(_){}
    }, false);

    /* 休んでいる間は描かない（無駄に電池を使わないため）。
       描く処理を包むだけなので、ふだんの動きは今までどおり。 */
    if(!T.renderer._nnDrawWrapped){
      T.renderer._nnDrawWrapped = 1;
      var _render = T.renderer.render.bind(T.renderer);
      T.renderer.render = function(a,b){ if(window.nnGLLost) return; return _render(a,b); };
    }
  }
  window.nnWireCtxLost = nnWireCtxLost;

  /* init3D を包んで、3Dが立ち上がった直後に受け口を付ける */
  var _init = window.init3D;
  if(typeof _init==='function'){
    window.init3D = function(){
      var r = _init.apply(this, arguments);
      try{ nnWireCtxLost(); }catch(_){}
      return r;
    };
  }
  /* すでに立ち上がっていたら、その場で付ける */
  try{ nnWireCtxLost(); }catch(_){}
  /* 3Dは「タブを開いたとき」に立ち上がるので、念のため少しの間だけ見張る */
  var n=0, iv=setInterval(function(){ n++; try{ nnWireCtxLost(); }catch(_){}

})();

<script id="nn-toriai-js">
/* 取り合い。本体（build3D・draw）は書き換えず、上から包んで飾りを足す（§119の型）。 */
(function(){
"use strict";
var KINDS={
  mikiri:{label:'見切り＋シール', price:3800, hint:'アルミ見切り材で縁を切り、上をシーリングで納める'},
  kasane:{label:'重ね',          price:2600, hint:'片方の防水層を150mm乗り上げて重ねる'},
  tachi :{label:'立上りで縁切り', price:5200, hint:'境界に高さ100mmの立上りを作って縁を切る'}
};
window.NN_TOR_KINDS=KINDS;
function sM(){ return (typeof state!=='undefined'&&state.scaleM)?state.scaleM:0.5; }
function torOf(e){ var k=e&&e.tor; return KINDS[k]?k:'mikiri'; }   /* 未設定は見切りが既定 */

/* ---- ① 取り合いを見つける（隣り合う辺で、平場の仕様が違うもの） ----
   ・重なりが短い方の辺の半分以上あれば「境界」
   ・平場の高さが同じ（段差があるときは壁当り／パラペットで縁が切れる＝取り合いではない）
   ・両方の平場の防水仕様が違う                                            */
function segOv(a1,a2,b1,b2,tol){
  var ux=a2.x-a1.x, uy=a2.y-a1.y, L=Math.hypot(ux,uy); if(L<1e-6)return 0;
  var nx=-uy/L, ny=ux/L;
  if(Math.abs((b1.x-a1.x)*nx+(b1.y-a1.y)*ny)>tol) return 0;
  if(Math.abs((b2.x-a1.x)*nx+(b2.y-a1.y)*ny)>tol) return 0;
  var t1=((b1.x-a1.x)*ux+(b1.y-a1.y)*uy)/(L*L);
  var t2=((b2.x-a1.x)*ux+(b2.y-a1.y)*uy)/(L*L);
  var lo=Math.max(0,Math.min(t1,t2)), hi=Math.min(1,Math.max(t1,t2));
  return Math.max(0,hi-lo)*L;
}
window.nnToriaiList=function(){
  var out=[]; var P=(typeof state!=='undefined'&&state.polys)?state.polys:[];
  if(P.length<2) return out;
  var tol=0.35;                                   /* マス単位のずれ許容 */
  for(var a=0;a<P.length;a++)for(var b=a+1;b<P.length;b++){
    var A=P[a], B=P[b];
    if(Math.abs((+A.lv||0)-(+B.lv||0))>1e-6) continue;      /* 段差がある＝取り合いではない */
    var spA, spB;
    try{ spA=specOfPoly(A); spB=specOfPoly(B); }catch(_){ continue; }
    if(!spA||!spB||spA.code===spB.code) continue;           /* 同じ仕様なら取り合いではない */
    for(var i=0;i<A.pts.length;i++){
      var a1=A.pts[i], a2=A.pts[(i+1)%A.pts.length];
      var la=Math.hypot(a2.x-a1.x,a2.y-a1.y); if(la<1e-6) continue;
      for(var j=0;j<B.pts.length;j++){
        var b1=B.pts[j], b2=B.pts[(j+1)%B.pts.length];
        var lb=Math.hypot(b2.x-b1.x,b2.y-b1.y); if(lb<1e-6) continue;
        var ov=segOv(a1,a2,b1,b2,tol);
        if(ov<Math.min(la,lb)*0.5) continue;
        var ea=A.edges[i], eb=B.edges[j]; if(!ea||!eb) continue;
        out.push({pa:a, ea:i, pb:b, eb:j, a1:a1, a2:a2,
          lenM:ov*sM(), spA:spA, spB:spB, kind:torOf(ea), up:!!ea.torUp,
          key:a+'-'+i+'/'+b+'-'+j});
      }
    }
  }
  return out;
};
/* ---- ② 納まりを決める（両方の辺に同じ値を書く） ---- */
window.nnTorSet=function(idx, kind){
  var L=nnToriaiList(), t=L[idx]; if(!t) return;
  if(!KINDS[kind]) return;
  var ea=state.polys[t.pa].edges[t.ea], eb=state.polys[t.pb].edges[t.eb];
  ea.tor=kind; eb.tor=kind;
  after('取り合いを「'+KINDS[kind].label+'」にしました');
};
window.nnTorSwap=function(idx){
  var L=nnToriaiList(), t=L[idx]; if(!t) return;
  var ea=state.polys[t.pa].edges[t.ea], eb=state.polys[t.pb].edges[t.eb];
  var v=!ea.torUp; ea.torUp=v; eb.torUp=v;
  after('乗せる側を入れ替えました');
};
function after(msg){
  try{ saveState(); }catch(_){}
  try{ recalc(); }catch(_){}
  try{ draw(); }catch(_){}
  try{ if(typeof dirty3d!=='undefined')dirty3d=true; if(typeof tab!=='undefined'&&tab==='d3')build3D();
       else if(document.body.classList.contains('nnsplit2'))build3D(); }catch(_){}
  try{ nnTorRender(); }catch(_){}
  try{ if(msg&&window.toast)toast(msg); }catch(_){}
}
/* ---- ③ 積算 ---- */
window.nnTorAgg=function(){
  var g={};
  nnToriaiList().forEach(function(t){
    var o=g[t.kind]||(g[t.kind]={len:0,label:KINDS[t.kind].label,price:KINDS[t.kind].price});
    o.len+=t.lenM;
  });
  return g;
};
/* ---- ④ 図面(2D)に取り合いを描く ---- */
var _draw=window.draw;
if(typeof _draw==='function'){
  window.draw=function(){
    var r=_draw.apply(this,arguments);
    try{ draw2d(); }catch(_){}
    return r;
  };
}
function draw2d(){
  if(typeof tab!=='undefined' && tab!=='zu' && tab!=='wari') return;
  var cv=document.getElementById('cv'); if(!cv) return;
  var ctx=cv.getContext('2d'); if(!ctx) return;
  var L=nnToriaiList(); if(!L.length) return;
  var sel=(window._nnTorSel==null)?-1:window._nnTorSel;
  ctx.save();
  L.forEach(function(t,i){
    var x1=gx2px(t.a1.x), y1=gy2px(t.a1.y), x2=gx2px(t.a2.x), y2=gy2px(t.a2.y);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.setLineDash(i===sel?[]:[7,4]);
    ctx.strokeStyle=(i===sel)?'#e8760a':'#6b3fa0';
    ctx.lineWidth=(i===sel)?3:2.2;
    ctx.stroke(); ctx.setLineDash([]);
    /* 札（取り合いの種類と仕様） */
    var mx=(x1+x2)/2, my=(y1+y2)/2, ang=Math.atan2(y2-y1,x2-x1);
    var nx=Math.sin(ang), ny=-Math.cos(ang);
    var tx=mx+nx*24, ty=my+ny*24;   /* 辺の寸法の札と重ならないよう外へ出す */
    var s1='取合 '+t.spA.code+'／'+t.spB.code;
    var s2=KINDS[t.kind].label;
    ctx.font='700 9.5px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    var w=Math.max(ctx.measureText(s1).width, ctx.measureText(s2).width)+10;
    ctx.fillStyle='rgba(255,255,255,.92)';
    ctx.strokeStyle='#6b3fa0'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.rect(tx-w/2, ty-11, w, 22); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#6b3fa0';
    ctx.fillText(s1, tx, ty-5); ctx.fillText(s2, tx, ty+6);
  });
  ctx.restore();
}
/* ---- ⑤ 3D（build3D のあとに飾りを足す。本体は触らない） ---- */
var torG=null;
function three(){ return (typeof T!=='undefined')&&T&&T.scene; }
function clearG(){
  if(!torG) return;
  try{ torG.traverse(function(o){
    if(o.geometry&&!(o.geometry.userData&&o.geometry.userData.nnShared)) o.geometry.dispose(); }); }catch(_){}
  try{ if(torG.parent)torG.parent.remove(torG); }catch(_){}
  torG=null;
}
window.nnTorSync=function(){
  if(!three()) return;
  clearG();
  var L=nnToriaiList(); if(!L.length) return;
  torG=new THREE.Group(); torG.name='nnToriai'; T.scene.add(torG);
  var s=sM();
  L.forEach(function(t,i){
    var lv=(+state.polys[t.pa].lv||0);
    var ax=t.a1.x*s, az=t.a1.y*s, bx=t.a2.x*s, bz=t.a2.y*s;
    var dx=bx-ax, dz=bz-az, len=Math.hypot(dx,dz); if(len<1e-4) return;
    var ux=dx/len, uz=dz/len;          /* 辺に沿う向き */
    var nx=-uz, nz=ux;                 /* 辺と直角 */
    var cx=(ax+bx)/2, cz=(az+bz)/2, ang=Math.atan2(dz,dx);
    var hi=(window._nnTorSel===i);
    if(t.kind==='mikiri'){
      /* アルミ見切り材（30W×20H）＋上にシーリング */
      var g1=new THREE.BoxGeometry(len, 0.020, 0.030);
      var m1=mat(hi?0xff8c1a:0xb9bfc4, 0.34, 0.85);
      var b1o=new THREE.Mesh(g1,m1); b1o.position.set(cx, lv+0.012, cz); b1o.rotation.y=-ang;
      torG.add(b1o);
      var g2=new THREE.BoxGeometry(len, 0.008, 0.016);
      var b2o=new THREE.Mesh(g2, mat(hi?0xff8c1a:0x9aa0a4, 0.55, 0));
      b2o.position.set(cx, lv+0.026, cz); b2o.rotation.y=-ang; torG.add(b2o);
    }else if(t.kind==='kasane'){
      /* 片方の防水層を150mm乗り上げる（乗る側は torUp で入れ替え） */
      var side=t.up?-1:1;
      var col=t.up?colOf(t.spB):colOf(t.spA);
      var g3=new THREE.BoxGeometry(len, 0.006, 0.150);
      var b3=new THREE.Mesh(g3, mat(hi?0xff8c1a:col, 0.75, 0));
      b3.position.set(cx+nx*0.075*side, lv+0.021, cz+nz*0.075*side); b3.rotation.y=-ang;
      torG.add(b3);
      /* 端部のシール（丸棒） */
      var g4=new THREE.CylinderGeometry(0.008,0.008,len,6);
      g4.rotateZ(Math.PI/2);
      var b4=new THREE.Mesh(g4, mat(hi?0xff8c1a:0x2b2b2b, 0.6, 0));
      b4.position.set(cx+nx*0.150*side, lv+0.026, cz+nz*0.150*side); b4.rotation.y=-ang;
      torG.add(b4);
    }else{
      /* 立上りで縁を切る（高さ100mm・厚み60mm）＋天端キャップ */
      var g5=new THREE.BoxGeometry(len, 0.100, 0.060);
      var b5=new THREE.Mesh(g5, mat(hi?0xff8c1a:0xc9c3b8, 0.9, 0));
      b5.position.set(cx, lv+0.050, cz); b5.rotation.y=-ang; torG.add(b5);
      var g6=new THREE.BoxGeometry(len, 0.010, 0.080);
      var b6=new THREE.Mesh(g6, mat(hi?0xff8c1a:0xb9bfc4, 0.34, 0.85));
      b6.position.set(cx, lv+0.105, cz); b6.rotation.y=-ang; torG.add(b6);
    }
  });
  try{ T.rev=(T.rev|0)+1; }catch(_){}
};
function colOf(sp){ try{ return parseInt(String(sp.fill||'#8f948d').replace('#',''),16)||0x8f948d; }
  catch(_){ return 0x8f948d; } }
function mat(col, rough, metal){
  try{ if(window.nnMat) return nnMat(metal>0.2?'metal':'sheet', col, true); }catch(_){}
  return new THREE.MeshStandardMaterial({color:col, roughness:rough, metalness:metal||0, side:THREE.DoubleSide});
}
var _b3=window.build3D;
if(typeof _b3==='function'){
  window.build3D=function(){
    var r=_b3.apply(this,arguments);
    try{ nnTorSync(); }catch(_){}
    return r;
  };
}
/* ---- ⑥ 一覧の小窓 ---- */
function box(){
  var d=document.getElementById('nnTorBox');
  if(!d){ var w=document.getElementById('canvaswrap'); if(!w)return null;
    d=document.createElement('div'); d.id='nnTorBox'; w.appendChild(d); }
  return d;
}
window.nnTorPanel=function(){
  var d=box(); if(!d)return;
  if(d.classList.contains('on')){ d.classList.remove('on'); window._nnTorSel=null;
    try{ draw(); nnTorSync(); }catch(_){} return; }
  d.classList.add('on'); place(); nnTorRender();
};
/* ★ツールバーは方眼の上に浮いているので、その下に置く（重なると押せなくなる）。
   高さも「画面に収まるところまで」で頭を打たせる（§21の型）。 */
function place(){
  var d=document.getElementById('nnTorBox'); if(!d||!d.classList.contains('on'))return;
  try{
    var z=(window.nnPZ||1);
    var w=document.getElementById('canvaswrap'), tb=document.getElementById('toolbar');
    if(!w)return;
    var wr=w.getBoundingClientRect();
    var top=18;
    if(tb){ var tr=tb.getBoundingClientRect(); if(tr.height>0) top=(tr.bottom-wr.top)/z+8; }
    d.style.bottom=''; d.style.top=Math.round(top)+'px';
    d.style.maxHeight=Math.max(140, Math.round(wr.height/z-top-56))+'px';
  }catch(_){}
}
addEventListener('resize',function(){ setTimeout(place,60); });
window.nnTorRender=function(){
  var d=document.getElementById('nnTorBox'); if(!d||!d.classList.contains('on'))return;
  var L=nnToriaiList();
  var head='<h5><b>⇹ 取り合い（'+L.length+'か所）</b>'
    +'<button class="txc" onclick="nnTorPanel()" title="閉じる">✕</button></h5>';
  if(!L.length){
    d.innerHTML=head+'<div class="tnone">取り合いはまだありません。<br>'
      +'<b>隣り合う屋根で、平場の防水仕様を別々にする</b>と、その境界が自動でここに出ます'
      +'（屋根の表の「仕様」の欄で変えられます）。<br>'
      +'※高さ（GL+）が違う境界は、パラペット／壁当りで縁が切れるので取り合いにはなりません。</div>';
    return;
  }
  var rows=L.map(function(t,i){
    var on=(window._nnTorSel===i);
    var bs=Object.keys(KINDS).map(function(k){
      return '<button class="'+(t.kind===k?'on':'')+'" onclick="event.stopPropagation();nnTorSet('+i+',\''+k+'\')" title="'
        +KINDS[k].hint+'">'+KINDS[k].label+'</button>'; }).join('');
    var up=(t.kind==='kasane')
      ? '<button class="trs" onclick="event.stopPropagation();nnTorSwap('+i+')">⇅ 乗せる側を入れ替え（いま '
        +(t.up?nnEsc(state.polys[t.pb].name||'屋根'):nnEsc(state.polys[t.pa].name||'屋根'))+' が上）</button>'
      : '';
    return '<div class="tri '+(on?'on':'')+'" onclick="nnTorPick('+i+')">'
      +'<div class="trh">'+nnEsc(state.polys[t.pa].name||'屋根')+' <em>'+nnEsc(t.spA.code)+'</em>'
      +' ⇔ '+nnEsc(state.polys[t.pb].name||'屋根')+' <em>'+nnEsc(t.spB.code)+'</em></div>'
      +'<div class="trl">長さ '+(Math.round(t.lenM*10)/10)+'m ／ '+KINDS[t.kind].hint+'</div>'
      +'<div class="trb">'+bs+'</div>'+up+'</div>';
  }).join('');
  var ag=nnTorAgg(), sum=Object.keys(ag).map(function(k){
    return ag[k].label+' '+(Math.round(ag[k].len*10)/10)+'m'; }).join('／');
  d.innerHTML=head+rows+'<div class="tsum">積算に「取り合い処理」として計上されます：'+nnEsc(sum)+'</div>';
};
window.nnTorPick=function(i){
  window._nnTorSel=(window._nnTorSel===i)?null:i;
  try{ draw(); }catch(_){}
  try{ nnTorSync(); }catch(_){}
  try{ nnTorRender(); }catch(_){}
};
/* 図面を変えたら一覧も作り直す（仕様を変えた・辺を動かした等） */
var _rc=window.recalc;
if(typeof _rc==='function'){
  window.recalc=function(){ var r=_rc.apply(this,arguments);
    try{ nnTorRender(); }catch(_){} return r; };
}
/* nnEsc が無いページでも落ちないように */
if(typeof window.nnEsc!=='function'){
  window.nnEsc=function(v){ return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
}
})();
</script>

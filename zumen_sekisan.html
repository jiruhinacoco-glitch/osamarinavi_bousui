   画面のいちばん下まで使い切る（2026-07-29）
   ・--nnvh ＝ 実際に見えている画面の高さ
   ・表示中の画面（一覧・ダッシュボード等）の下に余りがあれば、そのぶん伸ばす
   　（すき間があるときだけ動くので、余りが無ければ何もしない）
   ============================================================ */
(function(){
  var VIEWS = null;
  /* ホーム画面のアイコンから起動しているか（＝全画面のアプリとして開いているか） */
  function isStandalone(){
    try{
      if(navigator.standalone === true) return true;
      return matchMedia('(display-mode: standalone)').matches
          || matchMedia('(display-mode: fullscreen)').matches;
    }catch(e){ return false; }
  }
  /* 画面のいちばん下に貼っておく、見えない1pxの目印。
     ★iPhoneをたてに持つと、端末が申告してくる「画面の高さ」が
       実際に見えている高さより小さいことがある（このページのように
       画面を縮めて表示していると起きる）。その申告値をそのまま使うと、
       画面の下のほうに何も置かれない帯（すき間）が残ってしまう。
       目印は画面の下端に貼り付いているので、その位置を測れば
       「本当の下端」が分かる。 */
  var probe = null;
  function probeBottom(){
    if(!probe || !probe.parentNode){
      probe = document.createElement('div');
      probe.id = 'nnBtmProbe';
      probe.setAttribute('style','position:fixed;left:0;bottom:0;width:1px;height:1px;'
        + 'pointer-events:none;opacity:0;z-index:-1;');
      (document.body || document.documentElement).appendChild(probe);
    }
    return probe.getBoundingClientRect().bottom;
  }
  function pageH(){
    var vv = window.visualViewport;
    var h = innerHeight;
    /* 文字入力でキーボードが出ると visualViewport は小さくなるので、大きいほうを採る */
    if(vv && vv.height > h) h = vv.height;
    /* 目印のほうが下にあれば、そちらが本当の下端。
       ブラウザで開いているときは下のバーの分だけ縮むのが正しいので、この直しは
       ホーム画面から起動したときだけ効かせる。あり得ない大きさは念のため採らない。 */
    if(isStandalone()){
      var t = probeBottom();
      if(t > h + 1 && t < h * 3) h = t;
      /* ★2026-08-27a ホーム画面起動＝全画面なので、画面そのもの（screen）の高さが本当の高さ。
         申告(innerHeight)・visualViewport・目印のすべてが小さいまま嘘をつく端末があり
         （実機スクショの実測：中身が60pt短く、その下にページの背景色が塗られていた）、
         その場合は screen だけが正しい。
         ・iPhoneの screen は向きに関係なく「たて向きの値」なので、よこ向きは短い方を使う
         ・縮小して表示するページ（width=980）ではCSSのpxと合わないが、
           そのときは h が screen よりずっと大きいので下の条件に入らない（保護） */
      var scH = (innerWidth > innerHeight) ? Math.min(screen.width, screen.height)
                                           : Math.max(screen.width, screen.height);
      var scW = (innerWidth > innerHeight) ? Math.max(screen.width, screen.height)
                                           : Math.min(screen.width, screen.height);
      /* ★2026-08-27h 縮小して表示するページ（width=980）は、CSSのpxと画面のptが合わない。
         「画面の1pt＝CSSの何px」（innerWidth÷画面の幅）を掛けて、CSSのpxに直してから比べる。
         等倍のページでは innerWidth＝画面の幅なので倍率1＝今までと同じ。
         （直す前は pt のまま比べていたため、縮小ページだけこの直しが一度も効かず、
         　下に約60ptの帯が残っていた＝実機で発生） */
      var sc = (scW > 0) ? scH * (innerWidth / scW) : scH;
      if(sc > h + 1 && sc < h * 1.6) h = sc;
    }
    return Math.round(h);
  }
  /* ★2026-08-24aa 0.8秒ごとの見直しは「変わったときだけ」にする。
     この処理は画面の高さを測り直すので、そのたびに**画面ぜんぶの置き場所の計算**が走る。
     ・窓の大きさ ・下部ナビの出入り ・表示中の画面 ・表示倍率
     のどれも変わっていなければ、測らずにそのまま戻る（見え方は今までどおり）。
     中身の高さが変わったときは、呼ぶ側が fill(true) で「必ず測る」と伝える。 */
  var _fsig='';
  function fillSig(){
    var vv=window.visualViewport, nav=document.getElementById('nav');
    var s=[window.innerWidth, window.innerHeight,
           vv?Math.round(vv.width)+'x'+Math.round(vv.height):'-',
           nav?(nav.style.marginBottom+'|'+nav.style.transform+'|'+nav.className):'-',
           window.nnPZ||1];
    /* ★2026-08-26b ホーム画面から起動したiPhoneは、innerHeight が実際より小さい値の
       まま変わらないことがある（§5-2）。本当の下端（目印）は起動の少し後に伸びるが、
       申告値だけを見る合図では「変わっていない」ことになり、
       「変わったときだけ測る」（2026-08-24ab）が一度も測り直さない
       ＝画面の下に黒い帯が残っていた（実機で発生）。目印も合図に入れる。 */
    if(isStandalone()) s.push(Math.round(probeBottom()));
    if(VIEWS) for(var i=0;i<VIEWS.length;i++){
      var e=document.getElementById(VIEWS[i]);
      s.push(e?(e.className+'/'+(e.style.display||'')):'-');
    }
    return s.join(',');
  }
  function fill(force){
    if(!force){ var sg=fillSig(); if(sg===_fsig) return; _fsig=sg; }
    else _fsig=fillSig();
    /* ★2026-08-11a パソコンで表示倍率（zoom）をかけているときは、
       innerHeight（実画面のpx）をそのまま使うと body の高さが倍率ぶん大きくなる。
       倍率で割って「CSSのpx」に直す。 */
    var _z = window.nnPZ || 1;
    var pb = pageH() / _z;
    document.documentElement.style.setProperty('--nnvh', pb + 'px');
    /* ★2026-08-27h 下部ナビが position:fixed のページ（国交省仕様・現場マップ）では、
       ナビは「申告された画面の下端」に貼り付く。ホーム画面起動のiPhoneが高さを
       実際より小さく申告したままだと（§221）、ナビの下に帯が残る＝CSSでは直せない。
       本当の高さ（pb）との差のぶんだけ下へずらして、本当の下端に貼り直す。
       ふつうの端末・ふつうのページでは差が0なので何も変わらない。 */
    try{
      var _nv=document.getElementById('nav');
      if(_nv && getComputedStyle(_nv).position==='fixed'){
        var _d=Math.round(pb - innerHeight/_z);
        _nv.style.bottom=(_d>2)? (-_d+'px') : '';
      }
      /* ▲（ナビを出すボタン）も fixed なので、同じ差のぶん下げる（負の margin で押し下げる） */
      var _vt=document.getElementById('navShowTab');
      if(_vt){ var _d2=Math.round(pb - innerHeight/_z);
        _vt.style.marginBottom=(_d2>2)? (-_d2+'px') : ''; }
    }catch(_){}
    if(_z !== 1){                      /* 倍率をかけているときは下の余白うめをしない（パソコン用） */
      if(VIEWS) VIEWS.forEach(function(id){ var e=document.getElementById(id); if(e) e.style.minHeight=''; });
      return;
    }
    if(!VIEWS) return;
    var v = null;
    for(var i=0;i<VIEWS.length;i++){
      var e = document.getElementById(VIEWS[i]);
      if(e && e.offsetParent !== null){ v = e; break; }
    }
    if(!v) return;
    /* 下部ナビが場所を取っている高さ（自動で隠れているときは 0） */
    var navOcc = 0;
    var nav = document.getElementById('nav');
    if(nav){
      var ns = getComputedStyle(nav);
      if(ns.display !== 'none' && ns.position !== 'fixed' && ns.position !== 'absolute'){
        var mb = parseFloat(nav.style.marginBottom || '0') || 0;   /* 隠れているときは負の値 */
        navOcc = Math.max(0, nav.offsetHeight + mb);
      }
    }
    if(v.style.minHeight) v.style.minHeight = '';      /* いったん元に戻して測る */
    var r = v.getBoundingClientRect();
    var gap = (pb - navOcc) - r.bottom;                 /* 下に余っている高さ */
    if(gap > 2) v.style.minHeight = Math.round(r.height + gap) + 'px';
  }
  fill(true);
  addEventListener('load', function(){ fill(true); });
  /* ★2026-08-26b 起動直後は画面の高さが何度か変わる（起動アニメ・申告の遅れ）。
     合図が同じでも、最初だけは念のため測り直す（3回だけ・そのあとは今までどおり） */
  [300,1200,3000].forEach(function(t){ setTimeout(function(){ fill(true); }, t); });
  addEventListener('resize', function(){ fill(true); });
  addEventListener('orientationchange', function(){ setTimeout(function(){ fill(true); }, 300); });
  setInterval(fill, 800);        /* ナビの自動開閉・画面の切替に追従する */
  window.nnFillBottom = fill;
})();
</script>

<style id="nn-hdr-std">
/* ============================================================

     だから同じ「64px」と書いても、前者では画面上25pt・後者では64ptになり、

     （実測：現場記録帳45pt ／ ライブラリ・カメラ・発注・用語集・現場マップ99pt）

     倍率 --nnhm ＝ そのページの組み立て幅 ÷ 980（現場記録帳の組み立て幅）
     ・幅980のページ  → 1.00（今までどおり）

/* ★`header` だけだと、現場マップの `header#topbar`（ID付き＝より強い指定）に負ける。

<script id="nn-hdr-std-js">
/* 倍率 --nnhm を計算して渡す（＝そのページの組み立て幅 ÷ 980） */
(function(){
  function set(){
    try{
      /* ★パソコンでは倍率1（＝今までどおり）にすること。
         パソコンのブラウザは viewport の width=980 指定を無視するため、
         画面を縮めて表示していない。ここで innerWidth/980 を掛けると
         ヘッダーだけ1.5倍に膨らんでしまう。 */
      var dev = Math.min(screen.width || 0, screen.height || 0);
      var phone = dev && dev < 700;
      var m = phone ? ((innerWidth || 980) / 980) : 1;
      if(!(m > 0.05 && m < 4)) m = 1;              /* あり得ない値は採らない */
      document.documentElement.style.setProperty('--nnhm', m.toFixed(4));
      /* ノッチの逃げの割り増し（＝そのページの縮小率の逆数）。
         いま向いている方の画面の幅で計算すること。 */
      var pr = true;
      try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = innerHeight > innerWidth; }
      var scr = pr ? Math.min(screen.width||0, screen.height||0) : Math.max(screen.width||0, screen.height||0);
      var saf = (phone && scr > 0) ? ((innerWidth || scr) / scr) : 1;
      if(!(saf > 0.5 && saf < 5)) saf = 1;
      document.documentElement.style.setProperty('--nnsaf', saf.toFixed(4));
    }catch(e){}
  }
  set();
  addEventListener('resize', set);
  addEventListener('orientationchange', function(){ setTimeout(set, 300); });
  addEventListener('load', set, {once:true});
})();
</script>

/* ============================================================
   ★図面を3種類PDFで出す（2026-08-05g）
     ①平面図　　　　… 通り芯＋寸法チェーン。表題欄は下の横帯（一般的な建築図面の形）
     ②断面詳細図　　… パラペット納まり 1/5。引出線で材料名を書く
     ③施工層構成図　… アイソメ（斜め）で層と工程が分かる図
   ★寸法線の端は「●」。斜め線（スラッシュ）は使わない。
   ★SVGで描く＝PDFにベクターで入るので、拡大しても線がぼやけない。
   ============================================================ */
(function(){
  const PKEY='nn_zumen_plan_v1';
  const P0={title:'', addr:'', client:'', author:'', no:'A-01', north:'up', paper:'a3'};
  function loadP(){ try{ return Object.assign({}, P0, JSON.parse(localStorage.getItem(PKEY)||'{}')); }catch(e){ return Object.assign({},P0); } }
  function saveP(p){ try{ localStorage.setItem(PKEY, JSON.stringify(p)); }catch(e){} }
  let PL=loadP();

  /* ---------- 積算・設定パネルに入力欄とボタンを足す ---------- */
  function row(k,lab,ph){
    return '<div class="prow"><label>'+lab+'</label><input type="text" data-k="'+k+'" placeholder="'+ph+'"></div>';
  }
  function build(){
    const host=document.getElementById('sekisan');
    if(!host || document.getElementById('nnPlanBox')) return;
    const box=document.createElement('div'); box.id='nnPlanBox';
    box.innerHTML=
      '<h4>📄 図面を出す（元請提出用）</h4>'
     +row('title','工事名','例：サン太平レジデンス 屋上防水改修')
     +row('addr','場所','例：札幌市西区太平10条6丁目')
     +row('client','元請・発注者','例：株式会社◯◯建設')
     +row('author','作成者','例：株式会社三浦工業 三浦')
     +row('no','図面番号','A-01')
     +'<div class="prow"><label>北の向き</label><select data-k="north">'
     +'<option value="up">図面の上</option><option value="right">図面の右</option>'
     +'<option value="down">図面の下</option><option value="left">図面の左</option></select></div>'
     +'<div class="prow"><label>用紙</label><select data-k="paper">'
     +'<option value="a3">A3 横（推奨）</option><option value="a4">A4 横</option></select></div>'
     +'<button id="nnPlanBtn" class="pbtn" type="button">📄 平面図</button>'
     +'<button id="nnSectBtn" class="pbtn" type="button">📐 断面詳細図（パラペット納まり）</button>'
     +'<button id="nnWariBtn" class="pbtn" type="button">🧵 割付図（平場のシート割り）</button>'
     +'<div class="pnote">押すと印刷画面が開きます。iPhoneは共有ボタンから「PDFとして保存」でファイルにできます。<br>'
     +'※現地実測にもとづく<b>施工用の図面</b>です（建築確認申請図ではありません）。</div>';
    host.parentNode.insertBefore(box, host);
    box.querySelectorAll('input,select').forEach(el=>{
      const k=el.dataset.k; el.value=PL[k]||'';
      const up=()=>{ PL[k]=el.value; saveP(PL); };
      el.addEventListener('change',up); el.addEventListener('input',up);
    });
    const go=(id,fn)=>document.getElementById(id).addEventListener('click',()=>{
      try{ fn(); }catch(e){ console.error(e); toast('図面の作成に失敗しました'); } });
    /* ★2026-08-22a 施工層構成図（アイソメ）のボタンは、ひとまず外した（本人の指示）。
       PDFを作る処理（nnIsoPDF）は残してあるので、戻すときはボタンを1行足すだけ。 */
    go('nnPlanBtn',()=>nnPlanPDF()); go('nnSectBtn',()=>nnSectionPDF());
    go('nnWariBtn',()=>nnWariPDF());
  }
  if(document.readyState==='loading') addEventListener('DOMContentLoaded',build); else build();
  setTimeout(build,400);

  /* ============================================================
     共通の道具
     ============================================================ */
  const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const SCALES=[10,20,25,30,50,75,100,150,200,250,300,500,600,1000];
  const dstr=()=>new Date().toLocaleDateString('ja-JP');

  /* 工法ごとの層構成（下から順＝施工の順番） */
  const LAYERS={
    'AS-T1':[['コンクリート下地','不陸調整・清掃・乾燥確認','#c9c9c9'],
             ['アスファルトプライマー','ローラー塗布 0.2kg/㎡','#e6dcc6'],
             ['改質アスシート（下層）','トーチ張り 重ね100mm','#9a8577'],
             ['改質アスシート（上層・砂付）','トーチ張り 千鳥張り','#6f5a4c'],
             ['立上り端末','押え金物＋シーリング','#b9c6d8']],
    'AS-J3':[['コンクリート下地','不陸調整・清掃・乾燥確認','#c9c9c9'],
             ['プライマー','ローラー塗布','#e6dcc6'],
             ['粘着層付改質アスシート（下層）','常温粘着 重ね100mm','#9a8577'],
             ['改質アスシート（上層・砂付）','常温粘着 千鳥張り','#6f5a4c'],
             ['立上り端末','押え金物＋シーリング','#b9c6d8']],
    'X-2'  :[['コンクリート下地','不陸調整・清掃・乾燥確認','#c9c9c9'],
             ['ウレタン用プライマー','ローラー塗布','#e6dcc6'],
             ['通気緩衝シート','脱気筒 100㎡に1箇所','#a9b79a'],
             ['ウレタン塗膜防水材 2層','規定厚 3.0mm','#7d9166'],
             ['トップコート','保護塗料 0.2kg/㎡','#c3d4ad']],
    'S-M2' :[['コンクリート下地','不陸調整・清掃・乾燥確認','#c9c9c9'],
             ['絶縁用シート','敷設','#e2e2e6'],
             ['固定ディスク＋アンカー','規定ピッチ','#9aa6b3'],
             ['塩ビシート t=1.5mm','ディスク誘導加熱','#7c8894'],
             ['立上り端末','端部金物＋シーリング','#b9c6d8']],
    'AS-N' :[['コンクリート下地','不陸調整・清掃・乾燥確認','#c9c9c9'],
             ['アスファルトプライマー','ローラー塗布','#e6dcc6'],
             ['ルーフィング積層','溶融アスファルト 3層','#5f5750'],
             ['砂付あなあきルーフィング','絶縁層','#7a7168'],
             ['立上り端末','押え金物＋シーリング','#b9c6d8']],
  };
  const layersOf=sp=>LAYERS[sp.code]||LAYERS['AS-T1'];
  /* ★断面詳細図モード（画面）からも同じ層構成・代表寸法を使う（1箇所で管理する） */
  window.nnLayersOf=layersOf; window.nnMajorHW=()=>majorHW();
  /* ★2026-08-19d 図面の部品（用紙・図枠・表題欄・線と寸法の道具）を外へ公開する。
     「標準納まり詳細図」（nn-detail-js）が同じ書式で描けるようにするため。
     ここを1箇所にしておかないと、図面ごとに枠や表題欄の見た目がずれる。 */
  window.nnSheetKit={mk:mk, sheetGeom:sheetGeom, frame:frame, titleStrip:titleStrip,
    nameBox:nameBox, openSheet:openSheet, dstr:dstr, getPL:function(){ return PL; }};

  function mk(){
    const S=[]; const r2=v=>Math.round(v*100)/100;
    const A={S:S, r2:r2};
    A.line=(x1,y1,x2,y2,w,c,d)=>S.push('<line x1="'+r2(x1)+'" y1="'+r2(y1)+'" x2="'+r2(x2)+'" y2="'+r2(y2)+
      '" stroke="'+(c||'#111')+'" stroke-width="'+(w||0.2)+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>');
    A.text=(x,y,t,sz,anc,c,bold,rot)=>S.push('<text x="'+r2(x)+'" y="'+r2(y)+'" font-size="'+(sz||3)+
      '" text-anchor="'+(anc||'start')+'" fill="'+(c||'#111')+'" font-family="sans-serif"'+
      (bold?' font-weight="700"':'')+(rot?' transform="rotate('+r2(rot)+' '+r2(x)+' '+r2(y)+')"':'')+'>'+esc(t)+'</text>');
    /* ★2026-08-29a 枠に入る長さまで切る（入らない分は「…」）。
       元請に出す紙なので、長い工事名・場所が枠から飛び出して
       紙の外まで伸びるのを防ぐ（工程表PDFの A.fit と同じ考え方）。
       日本語は1文字＝文字サイズ、英数・半角カナは0.55倍として見積もる。 */
    A.fit=(t,sz,w)=>{
      t=String(t==null?'':t);
      if(!(w>0)||!(sz>0)) return t;
      const cw=c=>(/[\x20-\x7e\uff61-\uff9f]/.test(c)?0.55:1)*sz;
      let sum=0; for(let i=0;i<t.length;i++) sum+=cw(t[i]);
      if(sum<=w) return t;
      const lim=w-sz;                       /* 「…」のぶんを空ける */
      let out='', s2=0;
      for(let i=0;i<t.length;i++){ const d=cw(t[i]); if(s2+d>lim) break; out+=t[i]; s2+=d; }
      return out+'…';
    };
    A.rect=(x,y,w,h,sw,fill,c,dash)=>S.push('<rect x="'+r2(x)+'" y="'+r2(y)+'" width="'+r2(w)+'" height="'+r2(h)+
      '" fill="'+(fill||'none')+'" stroke="'+(c||'#111')+'" stroke-width="'+(sw||0.25)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>');
    A.pl=(pts,fill,sw,c,dash,close)=>S.push('<path d="M'+pts.map((p,i)=>(i?'L':'')+r2(p[0])+' '+r2(p[1])).join(' ')+
      (close?' Z':'')+'" fill="'+(fill||'none')+'" stroke="'+(c||'#111')+'" stroke-width="'+(sw||0.3)+
      '" stroke-linejoin="round" stroke-linecap="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>');
    A.dot=(x,y,r,c)=>S.push('<circle cx="'+r2(x)+'" cy="'+r2(y)+'" r="'+(r||0.6)+'" fill="'+(c||'#111')+'"/>');
    A.circ=(x,y,r,sw,fill,c)=>S.push('<circle cx="'+r2(x)+'" cy="'+r2(y)+'" r="'+r2(r)+'" fill="'+(fill||'none')+
      '" stroke="'+(c||'#111')+'" stroke-width="'+(sw||0.25)+'"/>');
    /* ★寸法線：端は●。数値は線の「上」（線に沿って回す） */
    A.dim=(x1,y1,x2,y2,txt,sz,c)=>{
      const col=c||'#111';
      A.line(x1,y1,x2,y2,0.2,col);
      A.dot(x1,y1,0.6,col); A.dot(x2,y2,0.6,col);
      let ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
      if(ang>90)ang-=180; if(ang<-90)ang+=180;
      const rad=ang*Math.PI/180, ux=Math.sin(rad), uy=-Math.cos(rad);   /* 回したあとの「上」 */
      A.text((x1+x2)/2+ux*1.4, (y1+y2)/2+uy*1.4, txt, sz||3, 'middle', col, true, ang);
    };
    /* 引出線：指す先に●、途中で折れて、水平線の上に文字 */
    A.lead=(x,y,tx,ty,txt,toLeft,sz)=>{
      A.dot(x,y,0.6,'#111');
      A.line(x,y,tx,ty,0.18,'#333');
      const ex=tx+(toLeft?-9:9);
      A.line(tx,ty,ex,ty,0.18,'#333');
      A.text(ex+(toLeft?-1.5:1.5), ty-1.2, txt, sz||2.9, toLeft?'end':'start', '#111');
    };
    return A;
  }

  function sheetGeom(A3){
    const PW=A3?420:297, PH=A3?297:210, M=8;
    const ix0=M, iy0=M, ix1=PW-M, iy1=PH-M;
    const tbH=A3?26:22;
    return {PW,PH,M,ix0,iy0,ix1,iy1,tbH, ax0:ix0+5, ay0:iy0+5, ax1:ix1-5, ay1:iy1-tbH-8};
  }
  function frame(A,SH){
    A.rect(SH.ix0,SH.iy0,SH.ix1-SH.ix0,SH.iy1-SH.iy0,0.7);
    A.rect(SH.ix0+2,SH.iy0+2,SH.ix1-SH.ix0-4,SH.iy1-SH.iy0-4,0.25);
  }
  /* ★表題欄は下の横帯（一般的な建築図面の形） */
  function titleStrip(A,SH,dname,scaleTxt,suffix){
    const x0=SH.ix0+2, x1=SH.ix1-2, y0=SH.iy1-2-SH.tbH, h=SH.tbH;
    A.rect(x0,y0,x1-x0,h,0.5,'#fff');
    const c1=x0+(x1-x0)*0.28, c2=x0+(x1-x0)*0.50;
    A.line(c1,y0,c1,y0+h,0.4); A.line(c2,y0,c2,y0+h,0.4);
    A.text(x0+4, y0+7, '納まりナビ で作成', 2.8,'start','#888');
    const lcw=c1-(x0+4)-2;                 /* 左の欄に使える幅 */
    A.text(x0+4, y0+15, A.fit(PL.author||'—',4.4,lcw), 4.4,'start','#111',true);
    if(PL.client) A.text(x0+4, y0+21.5, A.fit('元請：'+PL.client,2.8,lcw), 2.8,'start','#333');
    A.line(c1,y0+6.5,c2,y0+6.5,0.3);
    A.text(c1+2.5, y0+4.8, '備　考', 2.8,'start','#333',true);
    A.text(c1+2.5, y0+11.5, '現地実測にもとづく防水施工用図面', 2.6,'start','#222');
    A.text(c1+2.5, y0+16, '建築確認申請図ではない', 2.6,'start','#222');
    A.text(c1+2.5, y0+20.5, '寸法単位＝m（詳細図は mm）', 2.6,'start','#222');
    const w=x1-c2, lw=w*0.16, vw=w*0.34, rh=h/3;
    const rows=[['縮　尺',scaleTxt,'工事名称',PL.title||'—'],
                ['作成年月日',dstr(),'場　所',PL.addr||'—'],
                ['図面番号',(PL.no||'A-01')+suffix,'図面名称',dname]];
    rows.forEach((r,i)=>{
      const yy=y0+rh*i;
      if(i) A.line(c2,yy,x1,yy,0.3);
      A.line(c2+lw,yy,c2+lw,yy+rh,0.3);
      A.line(c2+lw+vw,yy,c2+lw+vw,yy+rh,0.4);
      A.line(c2+lw+vw+lw,yy,c2+lw+vw+lw,yy+rh,0.3);
      A.text(c2+1.5, yy+rh/2+1, r[0], 2.6,'start','#333',true);
      A.text(c2+lw+1.5, yy+rh/2+1, A.fit(r[1],3,vw-3), 3,'start','#111',true);
      A.text(c2+lw+vw+1.5, yy+rh/2+1, r[2], 2.6,'start','#333',true);
      A.text(c2+lw+vw+lw+1.5, yy+rh/2+1, A.fit(r[3],3,x1-(c2+lw+vw+lw)-3), 3,'start','#111',true);
    });
  }
  /* 図面名＋縮尺の箱（表題欄のすぐ上・右端） */
  function nameBox(A,SH,dname,scaleTxt){
    const bw=76, bh=9.5, x=SH.ix1-2-bw, y=SH.iy1-2-SH.tbH-bh-1.5;
    A.rect(x,y,bw,bh,0.5,'#fff');
    A.text(x+3, y+6.8, A.fit(dname+'　S:'+scaleTxt,4.2,bw-6), 4.2,'start','#111',true);
  }
  function openSheet(svg, A3, title){
    /* ★用紙は必ず「よこ」。
       `size:A3 landscape` という書き方は、環境によっては無視されて
       たて長の紙に回転して入ってしまう（Windows の「Microsoft Print to PDF」等）。
       実寸（420mm 297mm）で書くほうが確実に効く。
       それでもたてになる環境のために「90°回して印刷」も用意した。 */
    const W=A3?420:297, H=A3?297:210;
    const w=window.open('','_blank');
    if(!w){ toast('ポップアップがブロックされました。設定でこのサイトを許可してください'); return; }
    w.document.write('<!doctype html><html lang="ja"><head><meta charset="utf-8">'
      +'<title>'+esc(title)+'</title>'
      +'<style id="pgYoko">@page{size:'+W+'mm '+H+'mm; margin:0;}</style>'
      +'<style id="pgTate">@page{size:'+H+'mm '+W+'mm; margin:0;}</style>'
      +'<style>'
      +'html,body{margin:0;padding:0;background:#f2f2f2;}'
      +'#nnbar{position:fixed;left:0;right:0;top:0;z-index:9;background:#1c6b3c;color:#fff;'
      +'font:14px/1.6 system-ui,-apple-system,sans-serif;padding:9px 14px;display:flex;gap:10px;'
      +'align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.25);}'
      +'#nnbar b{font-size:15px;}'
      +'#nnbar button{font:inherit;font-weight:800;padding:7px 14px;border:0;border-radius:7px;'
      +'background:#fff;color:#1c6b3c;cursor:pointer;}'
      +'#nnbar button.on{background:#ffd34d;color:#5a3a00;}'
      +'#nnbar .s{font-size:12px;opacity:.92;}'
      +'#nnwrap{padding:64px 10px 24px;}'
      +'svg{display:block;margin:0 auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.22);max-width:100%;height:auto;}'
      +'@media print{'
      +'#nnbar{display:none!important;} #nnwrap{padding:0;}'
      +'body{background:#fff;} svg{box-shadow:none;margin:0;max-width:none;width:'+W+'mm;height:'+H+'mm;}'
      +'body.rot svg{position:absolute;left:0;top:0;transform:translateX('+H+'mm) rotate(90deg);transform-origin:0 0;}'
      +'}'
      +'</style></head><body>'
      +'<div id="nnbar"><button type="button" onclick="nnDocBack()">← 図面に戻る</button>'
      +'<b>この図面は「よこ（'+(A3?'A3':'A4')+'横）」で印刷してください</b>'
      +'<button type="button" onclick="print()">🖨 印刷 / PDFに保存</button>'
      +'<button type="button" id="rotBtn">⟳ 用紙がたてになるとき</button>'

      +'選べないときは ⟳ を押してから印刷してください。</span></div>'
      +'<div id="nnwrap">'+svg+'</div>'
      +'<script>var NN_BACK='+JSON.stringify(location.href)+';'
      +'function nnDocBack(){'
      +'try{window.close();}catch(e){}'
      +'setTimeout(function(){'
      +'if(window.closed)return;'
      +'var did=false;'
      +'try{if(history.length>1){did=true;history.back();}}catch(e){}'
      +'setTimeout(function(){try{location.replace(NN_BACK);}catch(e){}}, did?600:0);'
      +'},250);'
      +'}'
      +'(function(){'
      +'var yoko=document.getElementById("pgYoko").sheet, tate=document.getElementById("pgTate").sheet;'
      +'tate.disabled=true;'
      +'var b=document.getElementById("rotBtn");'
      +'b.onclick=function(){var on=document.body.classList.toggle("rot");'
      +'yoko.disabled=on; tate.disabled=!on; b.classList.toggle("on",on);'
      +'b.textContent=on?"⟳ 90°回して印刷：ON":"⟳ 用紙がたてになるとき";};'
      +'window.onload=function(){setTimeout(function(){window.print();},350);};'
      +'})();<\/script>'
      +'</body></html>');
    w.document.close();
  }
  const HATCH_C='<pattern id="cc" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    +'<line x1="0" y1="0" x2="0" y2="2" stroke="#8a8a8a" stroke-width="0.16"/></pattern>';
  function hatchRoof(sp){
    return '<pattern id="hh" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
      +'<line x1="0" y1="0" x2="0" y2="2.4" stroke="'+sp.color+'" stroke-width="0.18" opacity="0.55"/></pattern>';
  }
  function svgWrap(SH, defs, S){
    return '<svg xmlns="http://www.w3.org/2000/svg" width="'+SH.PW+'mm" height="'+SH.PH+'mm" viewBox="0 0 '+SH.PW+' '+SH.PH+'">'
      +'<defs>'+defs+'</defs><rect width="'+SH.PW+'" height="'+SH.PH+'" fill="#fff"/>'+S.join('')+'</svg>';
  }
  function bboxM(){
    let a=1e9,b=-1e9,c=1e9,d=-1e9; const sM=state.scaleM;
    state.polys.forEach(p=>p.pts.forEach(q=>{ a=Math.min(a,q.x*sM); b=Math.max(b,q.x*sM); c=Math.min(c,q.y*sM); d=Math.max(d,q.y*sM); }));
    return {minX:a,maxX:b,minY:c,maxY:d,w:Math.max(0.5,b-a),h:Math.max(0.5,d-c)};
  }
  /* 立上り・天端の代表値（詳細図・アイソメに使う） */
  function majorHW(){
    const cnt={};
    state.polys.forEach(p=>ringsOf(p).forEach(r=>r.pts.forEach((q,i)=>{
      const e=ek(r.edges[i]);
      if(e.k==='para'&&e.h>0){ const k=e.h+'/'+(e.w||250); cnt[k]=(cnt[k]||0)+1; }
    })));
    let best='300/250', mx=0;
    for(const k in cnt) if(cnt[k]>mx){ mx=cnt[k]; best=k; }
    const v=best.split('/');
    return {H:+v[0]||300, W:+v[1]||250};
  }
  /* ★通り芯：頂点のx・yを重複をまとめて並べたもの */
  function axesOf(){
    const ux=[], uy=[];
    /* ★2026-08-28e 弧（§232）の途中の頂点からは通り芯を立てない。
       立てると16本の芯が並んで、丸囲みが重なって読めなくなる（実際になった）。
       弧の始点と終点は残すので、位置は分かる。 */
    state.polys.forEach(p=>ringsOf(p).forEach(r=>{
      const AG=nnArcGroups(r, state.scaleM);
      r.pts.forEach((q,qi)=>{ if(AG.inner.has(qi))return; ux.push(q.x); uy.push(q.y); });
    }));
    const uniq=a=>{
      const o=[...new Set(a.map(v=>Math.round(v*100)/100))].sort((p,q)=>p-q);
      const out=[]; o.forEach(v=>{ if(!out.length || v-out[out.length-1]>0.06) out.push(v); });
      while(out.length>14){ for(let i=1;i<out.length-1;i+=1){ out.splice(i,1); if(out.length<=14) break; } }
      return out;
    };
    return {x:uniq(ux), y:uniq(uy)};
  }

    [['工法', sp.name],

  window.nnPlanPDF=function(){
    if(!state.polys.length){ toast('先に屋根を作図してください'); return; }
    const sM=state.scaleM, sp=spec(), A3=(PL.paper!=='a4');
    const SH=sheetGeom(A3), A=mk();
    frame(A,SH);

    const infoW=A3?84:66, bx0=SH.ax1-infoW;
    const px0=SH.ax0+28, px1=bx0-26, py0=SH.ay0+24, py1=SH.ay1-28;

    let SC=SCALES[SCALES.length-1];
    for(const c of SCALES){ if(B.w*1000/c<=px1-px0 && B.h*1000/c<=py1-py0){ SC=c; break; } }
    const mm=v=>v*1000/SC;
    const ox=px0+((px1-px0)-mm(B.w))/2, oy=py0+((py1-py0)-mm(B.h))/2;
    const X=x=>ox+mm(x*sM-B.minX), Y=y=>oy+mm(y*sM-B.minY);
    const obx0=ox, obx1=ox+mm(B.w), oby0=oy, oby1=oy+mm(B.h);

    /* --- 通り芯（一点鎖線＋丸囲みの記号） --- */
    const AX=axesOf();
    AX.x.forEach((v,i)=>{
      const x=X(v);
      A.line(x, oby0-3, x, oby1+19, 0.15, '#999', '5 1.4 1 1.4');

    AX.y.forEach((v,i)=>{
      const y=Y(v);
      A.line(obx0-19, y, obx1+3, y, 0.15, '#999', '5 1.4 1 1.4');
      A.circ(obx0-22.6, y, 2.9, 0.25, '#fff');
      A.text(obx0-22.6, y+1.1, 'Y'+i, 2.5,'middle','#333',true);
    });
    /* --- 寸法チェーン（上＝X／右＝Y）。端は● --- */
    const d1=9, d2=18;
    AX.x.forEach(v=>{ const x=X(v); A.line(x, oby0-2, x, oby0-d2-2, 0.12,'#666'); });
    for(let i=0;i+1<AX.x.length;i++)
      A.dim(X(AX.x[i]), oby0-d1, X(AX.x[i+1]), oby0-d1, f1((AX.x[i+1]-AX.x[i])*sM), 2.8);
    A.dim(obx0, oby0-d2, obx1, oby0-d2, f1(B.w)+' m', 3.4);
    AX.y.forEach(v=>{ const y=Y(v); A.line(obx1+2, y, obx1+d2+2, y, 0.12,'#666'); });
    for(let i=0;i+1<AX.y.length;i++)
      A.dim(obx1+d1, Y(AX.y[i]), obx1+d1, Y(AX.y[i+1]), f1((AX.y[i+1]-AX.y[i])*sM), 2.8);
    A.dim(obx1+d2, oby0, obx1+d2, oby1, f1(B.h)+' m', 3.4);

    /* --- 屋根 --- */
    const edgeTag=e=> e.h>0 ? ((e.k==='kabe'?'壁当り H':'H')+e.h+(e.w>0?' / W'+e.w:'')) : '';
    state.polys.forEach(poly=>{
      const cnt={};
      poly.pts.forEach((q,i)=>{ const t=edgeTag(ek(poly.edges[i])); if(t) cnt[t]=(cnt[t]||0)+1; });
      let major='', mx=1;
      for(const k in cnt){ if(cnt[k]>mx){ mx=cnt[k]; major=k; } }
      poly._major=major;
    });
    const nameBoxes=[];
    state.polys.forEach((poly,pi)=>{
      let d='M'+poly.pts.map((q,i)=>(i?'L':'')+A.r2(X(q.x))+' '+A.r2(Y(q.y))).join(' ')+' Z';
      (poly.holes||[]).forEach(h=>{ d+=' M'+h.pts.map((q,i)=>(i?'L':'')+A.r2(X(q.x))+' '+A.r2(Y(q.y))).join(' ')+' Z'; });
      A.S.push('<path d="'+d+'" fill="url(#hh)" fill-rule="evenodd" stroke="none"/>');
      A.S.push('<path d="'+d+'" fill="none" fill-rule="evenodd" stroke="#111" stroke-width="0.6" stroke-linejoin="round"/>');
      const c=poly.pts.reduce((a,q)=>({x:a.x+X(q.x)/poly.pts.length, y:a.y+Y(q.y)/poly.pts.length}),{x:0,y:0});
      const nm=poly.name||('屋根'+circled(pi+1));
      const bw2=Math.max(26, nm.length*2.1), bh2=poly._major?14:10;
      let cy2=c.y;
      for(const dy of [0,8,-8,16,-16,24,-24,32,-32]){
        cy2=c.y+dy;
        if(!nameBoxes.some(b=>Math.abs(b.x-c.x)<(bw2+b.w)/2 && Math.abs(b.y-cy2)<(bh2+b.h)/2)) break;
      }
      nameBoxes.push({x:c.x,y:cy2,w:bw2,h:bh2});
      A.rect(c.x-bw2/2, cy2-4.6, bw2, bh2, 0, '#fff', 'none');
      A.text(c.x, cy2, nm, 3.6,'middle','#111',true);
      A.text(c.x, cy2+4.4, 'GL+'+f1(+poly.lv||0)+'m　'+f1(quantities(poly,sM).hira)+'㎡', 2.6,'middle','#333');
      if(poly._major) A.text(c.x, cy2+8.4, poly._major, 2.6,'middle','#14449c',true);
    });
    /* ★斜めの辺だけ、その辺の寸法を出す（縦横は通り芯のチェーンで足りている） */
    state.polys.forEach(poly=>ringsOf(poly).forEach(ring=>{
      const pts=ring.pts, n=pts.length;
      /* ★2026-08-28e 弧は「1本ずつ」寸法を出さない（16個並んで図面が数字だらけになる）。
         実際の図面と同じく、弧ぜんぶで「R◯◯m（弧◯◯m）」を まん中に1つだけ出す。 */
      const AG=nnArcGroups(ring, sM);
      AG.groups.forEach(g=>{
        const mi=g.mid, a=pts[mi], b=pts[(mi+1)%n];
        const ax=X(a.x), ay=Y(a.y), bx=X(b.x), by=Y(b.y);
        const ex=bx-ax, ey=by-ay, el=Math.hypot(ex,ey)||1;
        let nx=ey/el, ny=-ex/el;
        const cx=pts.reduce((s2,q)=>s2+X(q.x),0)/n, cy=pts.reduce((s2,q)=>s2+Y(q.y),0)/n;
        if(((ax+bx)/2+nx*2-cx)*nx+((ay+by)/2+ny*2-cy)*ny < 0){ nx=-nx; ny=-ny; }
        /* ★札は「屋根の内側」に置く。外側は寸法チェーンが走っているので必ず重なる。
           弦の長さは総寸法（通り芯のチェーン）に出ているので、ここでは出さない。 */
        const tx=(ax+bx)/2-nx*11, ty=(ay+by)/2-ny*11;
        A.line((ax+bx)/2-nx*1.5,(ay+by)/2-ny*1.5, tx, ty, 0.12,'#666');
        const rw=26;
        A.rect(tx-rw/2, ty-2.6, rw, 5.2, 0, '#fff', 'none');
        A.text(tx, ty+1.2, 'R'+f1(g.R)+' m', 3.0,'middle','#14449c',true);
      });
      for(let i=0;i<n;i++){
        if(AG.edgeArc[i]) continue;                                     /* 弧は上でまとめた */
        const a=pts[i], b=pts[(i+1)%n];
        if(Math.abs(a.x-b.x)<0.02 || Math.abs(a.y-b.y)<0.02) continue;   /* 縦横は飛ばす */
        const L=edgeLenM(a,b,sM); if(L<0.2) continue;
        const ax=X(a.x), ay=Y(a.y), bx=X(b.x), by=Y(b.y);
        const ex=bx-ax, ey=by-ay, el=Math.hypot(ex,ey)||1;
        let nx=ey/el, ny=-ex/el;
        const cx=pts.reduce((s2,q)=>s2+X(q.x),0)/n, cy=pts.reduce((s2,q)=>s2+Y(q.y),0)/n;
        if(((ax+bx)/2+nx*2-cx)*nx+((ay+by)/2+ny*2-cy)*ny < 0){ nx=-nx; ny=-ny; }
        const off=7;
        A.line(ax+nx*1.5, ay+ny*1.5, ax+nx*(off+2), ay+ny*(off+2), 0.12,'#666');
        A.line(bx+nx*1.5, by+ny*1.5, bx+nx*(off+2), by+ny*(off+2), 0.12,'#666');
        A.dim(ax+nx*off, ay+ny*off, bx+nx*off, by+ny*off, f1(L)+' m', 2.8);
      }
    }));

    /* --- 右の情報ブロック --- */
    let by=SH.ay0+4;
    (function(){
      const cx=SH.ax1-12, cy=by+9, rot={up:0,right:90,down:180,left:270}[PL.north]||0;
      A.S.push('<g transform="rotate('+rot+' '+cx+' '+cy+')">'
        +'<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="none" stroke="#111" stroke-width="0.25"/>'
        +'<path d="M'+cx+' '+(cy-6.2)+' L'+(cx+2.6)+' '+(cy+3.4)+' L'+cx+' '+(cy+1.2)+' L'+(cx-2.6)+' '+(cy+3.4)+' Z" fill="#111"/></g>');
      A.text(cx, cy-8.6, 'N', 3.2,'middle','#111',true);
    })();
    by+=22;
    A.text(bx0, by, '凡 例', 3.6,'start','#111',true); by+=2;
    A.rect(bx0, by, 7, 4.5, 0.25, 'url(#hh)');
    A.text(bx0+9, by+3.4, sp.name, 2.7,'start','#111'); by+=8;
    A.text(bx0, by, 'H＝立上り高さ(mm)　W＝天端幅(mm)', 2.6,'start','#333'); by+=4;
    A.text(bx0, by, 'X0…／Y0…＝通り芯　寸法単位＝m', 2.6,'start','#333'); by+=6.5;
    /* ★スケールバー（白黒の棒）は2026-08-06r に削除（縮尺は表題欄と図面名の箱に出ている） */
    A.text(bx0, by, '数 量 表', 3.6,'start','#111',true); by+=2.5;
    let tH=0,tT=0,tB=0,tP=0;
    const qrows=state.polys.map((p,i)=>{ const q=quantities(p,sM);
      tH+=q.hira; tT+=q.tachi; tB+=q.tenba; tP+=q.per;
      return [p.name||('屋根'+circled(i+1)), f1(q.hira), f1(q.tachi), f1(q.tenba), f1(q.per)]; });
    const bw=infoW-2, cw=[bw*0.34,bw*0.17,bw*0.17,bw*0.16,bw*0.16], cxs=[bx0];
    cw.forEach((w,i)=>cxs.push(cxs[i]+w));
    const th=5;
    A.rect(bx0, by, bw, th, 0.25, '#eef2ec');
    ['部 位','平場㎡','立上り㎡','天端㎡','周長m'].forEach((t,i)=>A.text(cxs[i]+cw[i]/2, by+3.5, t, 2.5,'middle','#111',true));
    by+=th;
    qrows.forEach(v=>{ A.rect(bx0, by, bw, th, 0.18);
      v.forEach((t,i)=>A.text(i===0?cxs[i]+1.5:cxs[i]+cw[i]-1.5, by+3.5, t, 2.5, i===0?'start':'end','#111'));
      by+=th; });
    A.rect(bx0, by, bw, th, 0.25, '#f4f7f2');
    ['合 計', f1(tH), f1(tT), f1(tB), f1(tP)].forEach((t,i)=>
      A.text(i===0?cxs[i]+1.5:cxs[i]+cw[i]-1.5, by+3.5, t, 2.6, i===0?'start':'end','#111',true));
    by+=th+7;
    A.text(bx0, by, '注 記', 3.6,'start','#111',true); by+=4.5;
    ['1. 本図は現地実測にもとづく防水施工用の平面図である。',
     '2. 建築確認申請図・構造図ではない。',
     '3. 数量は本図から自動算出した概算。役物・ドレン・',
     '　 脱気筒・入隅出隅の材料は別途とする。',
     '4. 既存下地の状態により、範囲・工法を変更する場合がある。',
     '5. 寸法に相違がある場合は現場実測を優先する。'
    ].forEach(t=>{ A.text(bx0, by, t, 2.5,'start','#222'); by+=3.8; });

    nameBox(A,SH,'平面図','1/'+SC);
    titleStrip(A,SH,'平面図','1/'+SC+'（A'+(A3?'3':'4')+'横）','');
    openSheet(svgWrap(SH, hatchRoof(sp)+HATCH_C, A.S), A3, (PL.title||'防水施工')+' 平面図');
  };

  /* ============================================================
     ②断面詳細図（パラペット納まり 1/5）
     ============================================================ */
  window.nnSectionPDF=function(){
    if(!state.polys.length){ toast('先に屋根を作図してください'); return; }
    const sp=spec(), A3=(PL.paper!=='a4'), HW=majorHW();
    const SH=sheetGeom(A3), A=mk();
    frame(A,SH);
    const H=HW.H, Wp=HW.W, DS=A3?5:8, q=v=>v/DS, SL=700;   /* SL＝スラブを描く長さ(mm) */
    const O={x:SH.ax0+34+q(Wp+70), y:SH.ay0+28+q(H+70)};
    const gx=v=>O.x+q(v), gy=v=>O.y-q(v);

    A.text(SH.ax0, SH.ay0+6, 'パラペット（立上り）納まり 断面詳細図　S=1/'+DS, 5,'start','#111',true);

    /* --- 躯体（スラブ／パラペット。パラペットの下端は破断線） --- */
    A.rect(gx(0), gy(0), q(SL), q(150), 0.5, 'url(#cc)');
    A.pl([[gx(-Wp),gy(H)],[gx(0),gy(H)],[gx(0),gy(-260)],
          [gx(-Wp*0.30),gy(-230)],[gx(-Wp*0.62),gy(-290)],[gx(-Wp),gy(-260)]],
         'url(#cc)', 0.5, '#111', null, true);
    /* 入隅の面木（三角） */
    A.pl([[gx(0),gy(0)],[gx(75),gy(0)],[gx(0),gy(75)]], '#e8e2d6', 0.3, '#555', null, true);

    /* --- 防水層（3本線＝層のかさなり） --- */
    const offPath=(pts,d)=>{
      const N=[];
      for(let i=0;i+1<pts.length;i++){ const dx=pts[i+1][0]-pts[i][0], dy=pts[i+1][1]-pts[i][1], l=Math.hypot(dx,dy)||1; N.push([dy/l,-dx/l]); }
      const out=[[pts[0][0]+N[0][0]*d, pts[0][1]+N[0][1]*d]];
      for(let i=1;i<pts.length-1;i++){
        const a=[pts[i][0]+N[i-1][0]*d, pts[i][1]+N[i-1][1]*d], da=[pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]];
        const b=[pts[i][0]+N[i][0]*d, pts[i][1]+N[i][1]*d], db=[pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]];
        const den=da[0]*db[1]-da[1]*db[0];
        if(Math.abs(den)<1e-9){ out.push(b); continue; }
        const t=((b[0]-a[0])*db[1]-(b[1]-a[1])*db[0])/den;
        out.push([a[0]+da[0]*t, a[1]+da[1]*t]);
      }
      const L=pts.length-1;
      out.push([pts[L][0]+N[L-1][0]*d, pts[L][1]+N[L-1][1]*d]);
      return out;
    };
    const base=[[SL,0],[75,0],[0,75],[0,H],[-Wp,H],[-Wp,H-70]];
    [4,9,14].forEach((d,i)=>A.pl(offPath(base,d).map(p=>[gx(p[0]),gy(p[1])]), 'none', i===2?0.45:0.3, sp.color));

    /* --- アルミ笠木＋シーリング --- */
    A.pl([[gx(38),gy(H-16)],[gx(38),gy(H+30)],[gx(-Wp-38),gy(H+30)],[gx(-Wp-38),gy(H-16)]],'none',0.4,'#333');
    A.pl([[gx(30),gy(H-16)],[gx(30),gy(H+22)],[gx(-Wp-30),gy(H+22)],[gx(-Wp-30),gy(H-16)]],'none',0.3,'#555');
    A.line(gx(-Wp*0.5), gy(H+22), gx(-Wp*0.5), gy(H+15), 0.5,'#333');
    A.pl([[gx(-Wp-38),gy(H+30)],[gx(-Wp-14),gy(H+30)],[gx(-Wp-38),gy(H+12)]],'#111',0.2,'#111',null,true);

    /* --- 寸法（端は●） --- */
    const dxL=gx(-Wp)-16;
    A.line(gx(-Wp)-2, gy(0), dxL-2, gy(0), 0.12,'#666');
    A.line(gx(-Wp)-2, gy(H), dxL-2, gy(H), 0.12,'#666');
    A.dim(dxL, gy(0), dxL, gy(H), '立上り H'+H, 3.2);
    A.text(dxL+3.4, (gy(0)+gy(H))/2, '（水上 150 以上）', 2.5,'middle','#555',false,-90);
    const dyT=gy(H)-22;
    A.line(gx(-Wp), gy(H+32), gx(-Wp), dyT-2, 0.12,'#666');
    A.line(gx(0), gy(H+32), gx(0), dyT-2, 0.12,'#666');
    A.dim(gx(-Wp), dyT, gx(0), dyT, '天端 W'+Wp, 3.2);
    A.line(gx(SL)+2, gy(0), gx(SL)+11, gy(0), 0.12,'#666');
    A.line(gx(SL)+2, gy(-150), gx(SL)+11, gy(-150), 0.12,'#666');
    A.dim(gx(SL)+9, gy(0), gx(SL)+9, gy(-150), '150', 2.8);

    /* --- 水勾配の記号（スラブの上のあいている所） --- */
    (function(){
      const tx=gx(SL*0.42), ty=gy(H*0.42);
      A.pl([[tx,ty],[tx+24,ty],[tx+24,ty+4.6]],'none',0.4,'#111',null,true);
      A.text(tx+12, ty-1.6, '1/100', 3,'middle','#111',true);
      A.text(tx+12, ty+9, '水勾配', 3,'middle','#111',true);
    })();

    /* --- 引出線（★右に1列そろえる。指す先には●） --- */
    const LX=gx(SL)+34, y0=SH.ay0+28;
    const lab=(px,py,ly,txt)=>{
      A.dot(px,py,0.6,'#111');
      A.line(px,py, LX-10, ly, 0.18,'#333');
      A.line(LX-10, ly, LX, ly, 0.18,'#333');
      A.text(LX+1.5, ly-1.2, txt, 2.9,'start','#111');
    };
    lab(gx(-Wp-30), gy(H+27), y0+7,  'シーリング');
    lab(gx(-Wp*0.5), gy(H+26), y0+16, 'アルミ笠木（端末押え）');
    lab(gx(8), gy(H*0.62), y0+29, '防水層 立上り（'+sp.name+'）');
    lab(gx(26), gy(26), y0+43, '入隅面木（三角）');
    lab(gx(SL*0.5), gy(11), y0+59, '防水層 平場');
    lab(gx(SL*0.75), gy(-80), y0+77, 'コンクリートスラブ（下地）');
    lab(gx(-Wp*0.5), gy(-200), y0+109, 'コンクリート躯体（パラペット）');

    /* --- 層構成と注記（絵の下） --- */
    const LS=layersOf(sp);
    let ly=gy(-290)+12, lx=SH.ax0;
    A.text(lx, ly, '層構成（下から順＝施工の順番）', 3.8,'start','#111',true); ly+=5;
    A.text(lx, ly, sp.code+'｜'+sp.name, 2.9,'start','#111',true); ly+=4.8;
    LS.forEach((t,i)=>{ A.text(lx, ly, circled(i+1)+' '+t[0]+'　（'+t[1]+'）', 2.7,'start','#222'); ly+=4.3; });
    ly+=3;
    A.text(lx, ly, '※本図は概略の納まりです。工法・下地の状態により、出入隅の形状等が一部異なります。', 2.7,'start','#c01818');

    nameBox(A,SH,'断面詳細図','1/'+DS);
    titleStrip(A,SH,'断面詳細図（パラペット納まり）','1/'+DS,'-S');
    openSheet(svgWrap(SH, HATCH_C, A.S), A3, (PL.title||'防水施工')+' 断面詳細図');
  };

  /* ============================================================
     ★描いた断面のPDF（2026-08-18g）
     ③断面で描いた輪郭（state.sect）を、キリのいい縮尺でそのまま断面詳細図にする。
     「防水層」に指定した辺は工法の色で太く描き、寸法・層構成・注記を添える。
     ============================================================ */
  window.nnSectDrawPDF=function(){
    const s=state.sect;
    if(!s||!s.closed||s.pts.length<3){ toast('先に断面の輪郭を描いて、始点をタップして閉じてください'); return; }
    const sp=spec(), A3=(PL.paper!=='a4');
    const SH=sheetGeom(A3), A=mk();
    frame(A,SH);
    /* 輪郭の大きさ（mm） */
    const P=s.pts.map(p=>({x:p.x*1000, y:p.y*1000}));
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    P.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);});
    const wMM=Math.max(1,x1-x0), hMM=Math.max(1,y1-y0);
    /* 図を置ける範囲（右は引出線・層構成のぶんを空ける） */
    const boxX=SH.ax0+26, boxY=SH.ay0+16;
    const boxW=(SH.ax1-SH.ax0)*0.60, boxH=(SH.ay1-SH.ay0)-30;
    /* キリのいい縮尺（1/n）を選ぶ */
    const CAND=[1,2,5,10,20,25,50,100];
    let DS=CAND[CAND.length-1];
    for(const d of CAND){ if(wMM/d<=boxW && hMM/d<=boxH){ DS=d; break; } }
    const q=v=>v/DS;
    const Ox=boxX+(boxW-q(wMM))/2-q(x0), Oy=boxY+(boxH-q(hMM))/2+q(y1);
    const gx=v=>Ox+q(v), gy=v=>Oy-q(v);

    A.text(SH.ax0, SH.ay0+6, (PL.title||'防水施工')+'　断面詳細図（部位専用図）　S=1/'+DS, 5,'start','#111',true);

    /* --- 躯体（描いた輪郭） --- */
    A.pl(P.map(p=>[gx(p.x),gy(p.y)]), (window.nnKouzouFill?nnKouzouFill():'url(#cc)'), 0.6, '#111', null, true);

    /* --- 防水層に指定した辺（工法の色で太く） --- */
    function areaOf(a){ let v=0; for(let i=0;i<a.length;i++){ const p=a[i],r=a[(i+1)%a.length]; v+=p.x*r.y-r.x*p.y; } return v/2; }
    const sgn=areaOf(P)>0?1:-1;
    (s.wp||[]).forEach(i=>{
      const a=P[i], b=P[(i+1)%P.length];
      const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy); if(L<1e-6)return;
      const nx=(dy/L)*sgn, ny=(-dx/L)*sgn, off=10;      /* 面から10mm外側を通す */
      A.pl([[gx(a.x+nx*off),gy(a.y+ny*off)],[gx(b.x+nx*off),gy(b.y+ny*off)]], 'none', 1.1, sp.color||'#5a4a42');
    });

    /* --- 寸法（各辺・25mm以上の辺だけ） --- */
    (function(){
      const n=P.length, sgn2=-sgn;
      for(let i=0;i<n;i++){
        const a=P[i], b=P[(i+1)%n];
        const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
        if(q(L)<7) continue;                                  /* 紙の上で7mm未満は入れない */
        const nx=(dy/L)*sgn2, ny=(-dx/L)*sgn2, off=6*DS;      /* 紙で6mm外へ */
        A.dim(gx(a.x+nx*off),gy(a.y+ny*off),gx(b.x+nx*off),gy(b.y+ny*off), Math.round(L)+'', 2.9, '#14449c');
        A.line(gx(a.x),gy(a.y),gx(a.x+nx*off),gy(a.y+ny*off),0.15,'#8899aa');
        A.line(gx(b.x),gy(b.y),gx(b.x+nx*off),gy(b.y+ny*off),0.15,'#8899aa');
      }
    })();
    /* --- 全体寸法（幅・高さ） --- */
    A.dim(gx(x0),gy(y0)-10, gx(x1),gy(y0)-10, '全幅 '+Math.round(wMM), 3.1, '#111');
    A.dim(gx(x0)-14,gy(y0), gx(x0)-14,gy(y1), '全高 '+Math.round(hMM), 3.1, '#111');
    /* --- GL（y=0）の高さがあれば一点鎖線 --- */
    if(y0<0 && y1>0){
      A.line(gx(x0)-8, gy(0), gx(x1)+8, gy(0), 0.25, '#666', '6 2 1 2');
      A.text(gx(x1)+9, gy(0)+1, '▽ GL', 2.8,'start','#666');
    }

    /* --- 右：工法・層構成・注記 --- */
    const rx=SH.ax0+boxW+34;
    let ry=SH.ay0+16;
    A.text(rx, ry, '工法・層構成', 3.6,'start','#111',true); ry+=6;
    A.text(rx, ry, sp.name, 3.1,'start','#333'); ry+=6;
    layersOf(sp).forEach((L,i)=>{
      A.rect(rx, ry-3, 3.4, 3.4, 0.2, L[2]);
      A.text(rx+5.2, ry, (i+1)+'. '+L[0]+'　'+L[1], 2.9,'start','#111');
      ry+=5.2;
    });
    ry+=4;
    A.text(rx, ry, '断面の情報', 3.6,'start','#111',true); ry+=6;
    [['全幅', Math.round(wMM)+' mm'],
     ['全高', Math.round(hMM)+' mm'],
     ['頂点数', P.length+' 点'],
     ['防水層を巻く辺', (s.wp||[]).length+' 辺'],
     ['奥行き（3D表示用）', (s.depth||2)+' m']].forEach(r=>{
      A.text(rx, ry, r[0], 2.9,'start','#555');
      A.text(rx+42, ry, r[1], 2.9,'start','#111');
      ry+=5;
    });
    ry+=4;
    A.text(rx, ry, '注記', 3.4,'start','#111',true); ry+=5.4;
    ['1. 寸法の単位は mm。現地実測にもとづく施工用の断面図です。',
     '2. 太線（色つき）が防水層の位置を示します。厚さは実寸ではありません。',
     '3. 下地の状態により、納まりは現場で調整することがあります。',
     '4. 本図は建築確認申請図ではありません。'].forEach(t=>{
      A.text(rx, ry, t, 2.6,'start','#333'); ry+=4.2;
    });

    /* 下地の名前も図面に出す */
    if(window.nnKouzou) A.text(SH.ax0, SH.ay0+11.5, '下地：'+nnKouzou().n, 3.2,'start','#333');
    nameBox(A,SH,'断面詳細図','1/'+DS);
    titleStrip(A,SH,'断面詳細図（部位専用図）','1/'+DS+'（A'+(A3?'3':'4')+'横）','-S');
    openSheet(svgWrap(SH, HATCH_C+(window.nnKouzouSvgDefs?nnKouzouSvgDefs():''), A.S), A3,
      (PL.title||'防水施工')+' 断面詳細図');
  };

  /* ============================================================
     ③施工層構成図（アイソメ）
     ★斜め上から見た絵。層を1枚ずつずらして描くので、
       どの材料がどの順番で載るかが一目で分かる。
     ============================================================ */
  window.nnIsoPDF=function(){
    if(!state.polys.length){ toast('先に屋根を作図してください'); return; }
    const sM=state.scaleM, sp=spec(), A3=(PL.paper!=='a4'), HW=majorHW();
    const SH=sheetGeom(A3), A=mk();
    frame(A,SH);
    const LS=layersOf(sp), n=LS.length;

    /* 模型の寸法（mm・見やすさのため厚みは誇張） */
    const W=2600, D=1700, T=200, t=70, sx=250, sz=110, Pw=260, Hp=1000;
    /* アイソメの軸 */
    const IX=[0.866,0.5], IY=[-0.866,0.5];
    let k=1, Ox=0, Oy=0;
    const raw=(x,y,z)=>[ (x*IX[0]+y*IY[0]), (x*IX[1]+y*IY[1]-z) ];
    /* 全体の入る大きさを測って k を決める */
    (function(){
      const pts=[];
      [[0,-Pw,-T],[W,-Pw,-T],[W,D,-T],[0,D,-T],[0,-Pw,Hp],[W,-Pw,Hp],[W,D,n*t],[0,D,n*t]]
        .forEach(p=>pts.push(raw(p[0],p[1],p[2])));
      const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
      const w=Math.max(...xs)-Math.min(...xs), h=Math.max(...ys)-Math.min(...ys);
      const boxW=(SH.ax1-SH.ax0)*0.60, boxH=(SH.ay1-SH.ay0)-18;
      k=Math.min(boxW/w, boxH/h);
      Ox=SH.ax0+4-Math.min(...xs)*k; Oy=SH.ay0+16-Math.min(...ys)*k;
    })();
    const P=(x,y,z)=>{ const r=raw(x,y,z); return [Ox+r[0]*k, Oy+r[1]*k]; };

    A.text(SH.ax0, SH.ay0+6, '施工層構成図（アイソメ）　'+sp.code+'｜'+sp.name, 5,'start','#111',true);

    /* 断面の輪郭（y,z）を x0〜x1 に押し出して描く */
    function prism(prof, x0, x1, cTop, cSide, cCap){
      let area=0;
      for(let i=0;i<prof.length;i++){ const a=prof[i], b=prof[(i+1)%prof.length]; area+=a[0]*b[1]-b[0]*a[1]; }
      const pr=(area<0)?prof.slice().reverse():prof;
      for(let i=0;i<pr.length;i++){
        const a=pr[i], b=pr[(i+1)%pr.length];
        const dy=b[0]-a[0], dz=b[1]-a[1], l=Math.hypot(dy,dz)||1;
        const nx=dz/l, ny=-dy/l;
        if(nx*0.7+ny*0.7 <= 0.02) continue;              /* 見えない面は描かない */
        A.pl([P(x1,a[0],a[1]),P(x1,b[0],b[1]),P(x0,b[0],b[1]),P(x0,a[0],a[1])], (ny>0.5?cTop:cSide), 0.2,'#444',null,true);
      }
      A.pl(pr.map(p=>P(x1,p[0],p[1])), cCap, 0.28,'#333',null,true);
    }
    const dark=(c,f)=>{
      const m=/^#(..)(..)(..)$/.exec(c); if(!m) return c;
      const v=i=>('0'+Math.max(0,Math.min(255,Math.round(parseInt(m[i],16)*f))).toString(16)).slice(-2);
      return '#'+v(1)+v(2)+v(3);
    };
    /* 躯体（スラブ＋パラペット） */
    prism([[D,-T],[-Pw,-T],[-Pw,Hp],[0,Hp],[0,0],[D,0]], 0, W, '#dcdcdc', '#c2c2c2', '#cfcfcf');
    /* 層（下から順にずらして重ねる） */
    for(let i=0;i<n;i++){
      const z0=i*t, z1=(i+1)*t, y0=i*t, y1=(i+1)*t, top=Hp-i*sz;
      const prof=[[D,z0],[y0,z0],[y0,top],[y1,top],[y1,z1],[D,z1]];
      const col=LS[i][2];
      prism(prof, 0, W-i*sx, col, dark(col,0.78), dark(col,0.9));
    }
    /* 引出線＝各層の見えている端に番号と材料名 */
    const LX=SH.ax0+(SH.ax1-SH.ax0)*0.615;
    A.text(LX, SH.ay0+22, '層構成（下から順に施工）', 3.4,'start','#111',true);
    for(let i=0;i<n;i++){
      /* ★指す先は「その層の見えている切り口」＝立上り側の断面（右の階段の面）。
         平場の上を指すと、上に載っている層に隠れて何を指しているか分からない。 */
      const p=P(W-i*sx, (i+0.85)*t, (Hp-i*sz)*0.62);
      /* ★番号は「下から上へ」並べる。上から並べると引出線が全部交差して読めない
           （下の層ほど手前・下に見えるため）。積む順そのものなので分かりやすい。 */
      const ty=SH.ay0+30+(n-1-i)*13;
      A.dot(p[0],p[1],0.7,'#111');
      A.line(p[0],p[1], LX-6, ty, 0.18,'#333');
      A.line(LX-6, ty, LX, ty, 0.18,'#333');
      A.circ(LX+3.4, ty-1, 3.2, 0.3, LS[i][2]);
      A.text(LX+3.4, ty+0.1, String(i+1), 2.7,'middle','#111',true);
      A.text(LX+8, ty+0.2, LS[i][0], 3.2,'start','#111',true);
      A.text(LX+8, ty+4.6, LS[i][1], 2.6,'start','#555');
    }
    /* 立上りと平場の案内 */
    A.text(P(W*0.55, D*0.05, 0)[0], P(W*0.55, D*0.05, 0)[1]+7, '平場', 3.4,'middle','#111',true);
    A.text(P(W*0.12,-Pw*0.5,Hp)[0], P(W*0.12,-Pw*0.5,Hp)[1]-3, '立上り（パラペット）', 3.2,'middle','#111',true);
    A.text(SH.ax0, SH.ay1-2, '※層の厚みは分かりやすくするため誇張しています（実寸ではありません）。', 2.6,'start','#c01818');

    /* 工程表 */
    let ty=SH.ay0+30+n*13+8;
    const tx=LX, tw=SH.ax1-LX;
    A.text(tx, ty, '工程と数量', 3.8,'start','#111',true); ty+=3;
    let tHira=0,tTachi=0,tTenba=0,tPer=0;
    state.polys.forEach(p=>{ const q2=quantities(p,sM); tHira+=q2.hira; tTachi+=q2.tachi; tTenba+=q2.tenba; tPer+=q2.per; });
    const cw2=[tw*0.10, tw*0.48, tw*0.42], cx2=[tx, tx+tw*0.10, tx+tw*0.58], th2=5.4;
    A.rect(tx, ty, tw, th2, 0.25, '#eef2ec');
    ['順','工程（材料）','範囲・数量'].forEach((t,i)=>A.text(cx2[i]+2, ty+3.7, t, 2.6,'start','#111',true));
    ty+=th2;
    const areaTxt='平場 '+f1(tHira)+'㎡ ＋ 立上り '+f1(tTachi)+'㎡';
    LS.forEach((L,i)=>{
      A.rect(tx, ty, tw, th2, 0.18);
      A.text(cx2[0]+2, ty+3.7, String(i+1), 2.6,'start','#111',true);
      A.text(cx2[1]+2, ty+3.7, L[0], 2.6,'start','#111');
      A.text(cx2[2]+2, ty+3.7, (i===n-1? '天端 '+f1(tTenba)+'㎡ ／ 周長 '+f1(tPer)+'m' : areaTxt), 2.5,'start','#333');
      ty+=th2;
    });
    ty+=5;
    A.text(tx, ty, '注 記', 3.4,'start','#111',true); ty+=4.2;
    ['1. 本図は材料と施工順序を示す模式図である。',
     '2. 厚さ・大きさは実寸ではない。寸法は平面図・断面詳細図による。',
     '3. 役物（ドレン・脱気筒・入隅出隅）は別途とする。',
     '4. 気温・下地含水率により、工程の間隔を調整する。'
    ].forEach(t=>{ A.text(tx, ty, t, 2.5,'start','#222'); ty+=3.8; });

    nameBox(A,SH,'施工層構成図','NTS');
    titleStrip(A,SH,'施工層構成図（アイソメ）','NTS（尺度なし）','-D');
    openSheet(svgWrap(SH, HATCH_C, A.S), A3, (PL.title||'防水施工')+' 施工層構成図');
  };
})();
</script>

<script id="nn-numpad-js">
/* nnNumAsk(見出し, 最初の値, 答えを受け取る関数)。
   OK＝入力文字列を渡す／キャンセル・背景タップ＝null を渡す。 */
(function(){
"use strict";
let cb=null, w=null, inp=null;
function build(){
  if(w)return;
  w=document.createElement('div'); w.id='nnNumDlg';
  w.innerHTML='<div class="card"><div class="t"></div>'
    +'<input type="text" inputmode="decimal" pattern="[0-9.]*" autocomplete="off" enterkeyhint="done">'
    +'<div class="btns"><button type="button" class="ng">キャンセル</button><button type="button" class="okb">OK</button></div></div>';
  document.body.appendChild(w);
  inp=w.querySelector('input');
  w.addEventListener('pointerdown',function(e){ if(e.target===w)fin(null); });
  w.querySelector('.ng').addEventListener('click',function(){ fin(null); });
  w.querySelector('.okb').addEventListener('click',function(){ fin(inp.value); });
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); fin(inp.value); } });
}
function fin(v){
  if(!w)return;
  w.classList.remove('open');
  try{ inp.blur(); }catch(_){}
  const f=cb; cb=null;
  if(f)f(v);
}
window.nnNumAsk=function(title, initial, fn){
  build();
  cb=fn;
  w.querySelector('.t').textContent=title;
  inp.value=(initial==null)?'':String(initial);
  w.classList.add('open');
  /* タップの流れの中で focus すれば、その場でキーパッドが開く */
  try{ inp.focus({preventScroll:true}); inp.select(); }catch(_){}
};
})();
</script>

<script id="nn-sect-js">
/* 断面詳細図モード。上の <style id="nn-sect"> とセット。 */
(function(){
"use strict";
const wrap=document.getElementById('canvaswrap');
const box=document.createElement('div'); box.id='secwrap';
box.innerHTML='<canvas id="secCv"></canvas>'
  +'<div id="secBar">'
  /* ★2026-08-19g ラベルの文字（部位／辺／下地）はスマホでは出さない。
     たて画面で断面バーが164px＝図面タブ(95px)より69px厚く、作図面が1割狭かった。 */
  +'<span class="lb hidesp">部位</span><select id="sec_poly" title="部位"></select>'
  +'<span class="lb hidesp">辺</span><select id="sec_edge" title="辺"></select>'
  /* ★2026-08-18g 断面は「平面図と同じように描く」方式（本人の指示）。UIは nn-sectdraw-js が差し込む */
  +'<span id="secFree" style="display:none"></span>'
  +'<button class="pdf" type="button" id="sec_3d" style="margin-left:auto">⬔ 3Dで見る</button>'
  +'<button class="pdf" type="button" id="sec_theme" style="margin-left:6px">🌙 画面</button>'
  +'<button class="pdf" type="button" id="sec_pdf" style="margin-left:6px">📐 PDFで出す</button>'
  +'</div>'
  +'<div id="secNote"></div>';
wrap.appendChild(box);
const cvS=document.getElementById('secCv');
const cS=cvS.getContext('2d');
let selP=0, selE=-1;      /* selE=-1 は「いちばん多い納まり（代表）」 */
/* ★2026-08-18f 直接入力モード（部位専用図）。図面が無いときは自動でこのモード。
   値は 3D変換（nn-sec3d-js）とPDFでも使うので window に公開する */
let freeChosen=false;   /* ユーザーが自分で「断面を描く」を選んだか（自動フォールバックと区別する） */
function freeMode(){ return selP==='free' || !state.polys.length; }
window._nnSecFreeMode=freeMode;
function syncFreeUI(){
  const on=freeMode();
  document.getElementById('secFree').style.display=on?'contents':'none';
  document.getElementById('sec_edge').style.display=on?'none':'';
  document.querySelectorAll('#secBar .lb')[1].style.display=on?'none':'';
  const dw=document.getElementById('sdWrap');
  if(dw){ dw.classList.toggle('on',on); if(on && window.nnSdRefresh) setTimeout(nnSdRefresh,0); }
}

/* --- 選べる辺の一覧（立上りのある辺だけ） --- */
function edgesOf(pi){
  const p=state.polys[pi]; if(!p)return [];
  const out=[];
  ringsOf(p).forEach((r,ri)=>r.pts.forEach((q,i)=>{
    const e=ek(r.edges[i]||{});
    if(e.h>0) out.push({ri, i, e, label:'辺'+(out.length+1)+'（'+(e.k==='kabe'?'壁当り':'パラペット')+' H'+e.h+(e.k==='kabe'?'':' / W'+(e.w||0))+'）'});
  }));
  return out;
}
function fillSelects(){
  const sp=document.getElementById('sec_poly'), se=document.getElementById('sec_edge');
  sp.innerHTML='<option value="free">✎ 自分で描く</option>'
    +state.polys.map((p,i)=>'<option value="'+i+'">'+nnEsc(p.name||('部位'+(i+1)))+'</option>').join('');
  if(!state.polys.length) selP='free';
  /* ★図面ができたら従来どおり部位で開く（自分で「直接入力」を選んだときだけ維持） */
  else if(selP==='free' && !freeChosen) selP=0;
  sp.value=(selP==='free')?'free':String(Math.min(+selP||0,Math.max(0,state.polys.length-1)));
  const eds=edgesOf(+sp.value||0);
  se.innerHTML='<option value="-1">いちばん多い納まり（代表）</option>'
    +eds.map((x,i)=>'<option value="'+i+'">'+nnEsc(x.label)+'</option>').join('');
  se.value=String(selE);
}
document.getElementById('sec_poly').addEventListener('change',function(){
  selP=(this.value==='free')?'free':(+this.value||0);
  freeChosen=(selP==='free');
  selE=-1; fillSelects(); nnSecDraw(); });
document.getElementById('sec_3d').addEventListener('click',()=>{ if(window.nnSec3D)nnSec3D(); });
document.getElementById('sec_edge').addEventListener('change',function(){ selE=+this.value; nnSecDraw(); });
document.getElementById('sec_pdf').addEventListener('click',()=>{
  if(freeMode()){ if(window.nnSectDrawPDF) nnSectDrawPDF(); return; }
  if(window.nnSectionPDF) nnSectionPDF();
});
document.getElementById('sec_theme').addEventListener('click',()=>{ if(window.nnToggleTheme){ nnToggleTheme(); nnSecDraw(); } });

/* --- いま描く納まりの寸法（立上りH・天端W・種別） --- */
function target(){
  const eds=edgesOf(selP);
  if(selE>=0 && eds[selE]) return {h:eds[selE].e.h, w:eds[selE].e.w||0, k:eds[selE].e.k, lb:eds[selE].label};
  const m=(window.nnMajorHW?nnMajorHW():{H:300,W:250});
  return {h:m.H, w:m.W, k:'para', lb:'いちばん多い納まり（代表）'};
}

/* --- 断面詳細図を描く --- */
window.nnSecDraw=function(){
  const wrapEl=document.getElementById('secwrap');
  if(!wrapEl||!wrapEl.classList.contains('on'))return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=wrapEl.clientWidth, Hh=wrapEl.clientHeight;
  if(cvS.width!==Math.round(W*dpr)||cvS.height!==Math.round(Hh*dpr)){
    cvS.width=Math.round(W*dpr); cvS.height=Math.round(Hh*dpr);
  }
  cS.setTransform(dpr,0,0,dpr,0,0);
  const TH=(typeof nnTH==='function')?nnTH():{paper:'#fbfcf9',scale:'#8a978c',labBg:'rgba(255,255,255,.94)',dim:'#14449c'};
  const dark=(typeof nnTheme!=='undefined'&&nnTheme==='dark');
  cS.clearRect(0,0,W,Hh); cS.fillStyle=TH.paper; cS.fillRect(0,0,W,Hh);

  const note=document.getElementById('secNote');
  syncFreeUI();
  if(freeMode()){ note.textContent=''; return; }   /* 描くモードは作図キャンバスが描く */
  if(!state.polys.length){ note.textContent='屋根をかくと、その立上りの納まり詳細が出ます。'; return; }
  const sp=spec(), t=target();
  const HH=Math.max(50,t.h), WW=Math.max(0,t.w||0), KABE=(t.k==='kabe');
  note.textContent='立上り '+HH+'mm ／ 天端 '+(KABE?'—':WW+'mm')+'　'+t.lb;

  /* 図の範囲（mm）。原点＝入隅（平場と立上りの交わり） */
  const PL=900, SLAB=150, CAP=40, BRK=420;          /* 平場の長さ・スラブ厚・笠木・破断線までの深さ */
  const x0=-PL-60, x1=WW+180, y0=-(SLAB+BRK), y1=HH+CAP+130;
  const barH=(document.getElementById('secBar')||{}).offsetHeight||40;
  /* ★2026-08-08e パソコンの左たてナビは画面いっぱいの高さなので、下の余白には数えない */
  const _nv=document.getElementById('nav');
  const navH=(_nv && _nv.offsetWidth < innerWidth*0.5) ? 0 : ((_nv&&_nv.offsetHeight)||0);
  /* 右は引出線の文字ぶん、下は層構成と下部ナビのぶんを空ける。
     ★よこ画面（高さ393pt）は縦の余裕が無い。層構成まで入れると図が豆粒になるので、
       低い画面では層構成を省いて図を大きく見せる（層構成はPDFに入っている）。 */
  const lowH=(Hh-barH)<430;
  const showLayers=!lowH;
  const padL=30, padR=Math.min(210, Math.max(118, W*0.25)), padT=barH+34;
  const padB=(showLayers?152:46)+Math.min(96,navH);
  const kx=(W-padL-padR)/(x1-x0), ky=(Hh-padT-padB)/(y1-y0);
  const K=Math.max(0.02,Math.min(kx,ky));
  /* ★X(mm)=ox+mm*K なので ox は「原点(0mm)の画面位置」。
     図の左端 x0 を padL に合わせるには x0*K のぶんを引いておく（引き忘れると図が画面外に出る）。 */
  const ox=padL-x0*K+((W-padL-padR)-(x1-x0)*K)/2;
  const oy=padT+y1*K+((Hh-padT-padB)-(y1-y0)*K)/2;
  const X=mm=>ox+mm*K, Y=mm=>oy-mm*K;

  const bodyC=dark?'#33414e':'#d9d5cc', bodyE=dark?'#5a6b7a':'#8d9298';
  const ink=dark?'#dbe7ee':'#233';
  const dimC=dark?'#7cc0ff':'#14449c';

  /* --- 躯体（スラブ＋パラペット。下端は破断線） --- */
  cS.fillStyle=bodyC; cS.strokeStyle=bodyE; cS.lineWidth=1.2;
  cS.beginPath();
  cS.moveTo(X(-PL),Y(0)); cS.lineTo(X(0),Y(0));
  if(!KABE){ cS.lineTo(X(0),Y(HH)); cS.lineTo(X(WW),Y(HH)); cS.lineTo(X(WW),Y(-SLAB)); }
  else { cS.lineTo(X(0),Y(HH+900)); cS.lineTo(X(220),Y(HH+900)); cS.lineTo(X(220),Y(-SLAB)); }
  cS.lineTo(X(-PL),Y(-SLAB));
  cS.closePath(); cS.fill(); cS.stroke();
  /* ★破断線＝躯体の左端に、スラブの厚みの範囲でギザギザを描く（この先は省略、の意味）。
     躯体の外に飛び出させないこと（図面として意味が変わってしまう）。 */
  cS.strokeStyle=bodyE; cS.lineWidth=1.5; cS.beginPath();
  cS.moveTo(X(-PL), Y(0));
  let sgn=1;
  for(let yy=0; yy>-SLAB; yy-=SLAB/4){ cS.lineTo(X(-PL)+sgn*6, Y(yy-SLAB/8)); sgn=-sgn; }
  cS.lineTo(X(-PL), Y(-SLAB));
  cS.stroke();

  /* --- 入隅の面木（三角 75×75） --- */
  if(!KABE||true){
    cS.fillStyle=dark?'#4a4230':'#e8e2d6'; cS.strokeStyle=dark?'#6d6248':'#8a8172'; cS.lineWidth=1;
    cS.beginPath(); cS.moveTo(X(0),Y(0)); cS.lineTo(X(75),Y(0)); cS.lineTo(X(0),Y(75)); cS.closePath();
    cS.fill(); cS.stroke();
  }

  /* --- 防水層（層のかさなりを3本の平行線で表す） --- */
  const path=[[-PL,0],[75,0],[0,75],[0,HH]];
  if(!KABE)path.push([WW,HH]);
  const drawLayer=(off,wdt,col)=>{
    cS.strokeStyle=col; cS.lineWidth=wdt; cS.lineJoin='round'; cS.lineCap='round';
    cS.beginPath();
    /* 平場→面木→立上り→天端。offはその面から外向きの離れ（mm） */
    cS.moveTo(X(-PL),Y(off));
    cS.lineTo(X(75),Y(off));
    cS.lineTo(X(off),Y(75));
    cS.lineTo(X(off),Y(HH));
    if(!KABE)cS.lineTo(X(WW),Y(HH+off));
    cS.stroke();
  };
  drawLayer(3, 2.0, dark?'#7a8f6a':'#9db38f');       /* 下地処理・プライマー相当 */
  drawLayer(9, 3.4, sp.color||'#5a4a42');            /* 主材（工法色） */
  drawLayer(15,2.0, dark?'#c3d4ad':'#c9c2b4');       /* 仕上げ・保護 */

  /* --- 笠木（アルミ）とシーリング --- */
  if(!KABE){
    cS.fillStyle=dark?'#6b7a89':'#9aa2ab'; cS.strokeStyle=dark?'#8b9aa9':'#6f7780'; cS.lineWidth=1;
    cS.beginPath(); cS.rect(X(-35),Y(HH+CAP+18), (WW+70)*K, CAP*K); cS.fill(); cS.stroke();
    /* シーリング（笠木の下端・内側） */
    cS.fillStyle=dark?'#caa66a':'#d8b477';
    cS.beginPath(); cS.rect(X(-35),Y(HH+18), 26*K, 18*K); cS.fill();
  }

  /* ===== 寸法（数値はすべて横書き） ===== */
  const dimTx=(tx,x,y)=>{
    cS.font='800 12px sans-serif'; cS.textAlign='center'; cS.textBaseline='middle';
    const w=cS.measureText(tx).width+10;
    cS.fillStyle=TH.labBg; cS.fillRect(x-w/2,y-9,w,18);
    cS.strokeStyle=dimC; cS.lineWidth=.9; cS.strokeRect(x-w/2,y-9,w,18);
    cS.fillStyle=dimC; cS.fillText(tx,x,y); cS.textAlign='left'; cS.textBaseline='alphabetic';
  };
  const dot=(x,y)=>{ cS.beginPath(); cS.arc(x,y,2.6,0,7); cS.fillStyle=dimC; cS.fill(); };
  cS.strokeStyle=dimC; cS.lineWidth=1;
  /* 立上りH（左に縦の寸法線。★数値は横書きで線の左に置く） */
  const hx=X(-PL)-14;
  cS.beginPath(); cS.moveTo(hx,Y(0)); cS.lineTo(hx,Y(HH)); cS.stroke();
  dot(hx,Y(0)); dot(hx,Y(HH));
  cS.beginPath(); cS.moveTo(hx,Y(0)); cS.lineTo(X(0),Y(0)); cS.moveTo(hx,Y(HH)); cS.lineTo(X(0),Y(HH)); cS.stroke();
  dimTx('立上り H='+HH, hx+2, (Y(0)+Y(HH))/2);
  /* 天端W（上に横の寸法線） */
  if(!KABE&&WW>0){
    const wy=Y(HH+CAP+58);
    cS.beginPath(); cS.moveTo(X(0),wy); cS.lineTo(X(WW),wy); cS.stroke();
    dot(X(0),wy); dot(X(WW),wy);
    cS.beginPath(); cS.moveTo(X(0),wy); cS.lineTo(X(0),Y(HH)); cS.moveTo(X(WW),wy); cS.lineTo(X(WW),Y(HH)); cS.stroke();
    dimTx('天端 W='+WW, (X(0)+X(WW))/2, wy-16);
  }
  /* スラブ厚 */
  const sx=X(-PL)+40;
  cS.beginPath(); cS.moveTo(sx,Y(0)); cS.lineTo(sx,Y(-SLAB)); cS.stroke();
  dot(sx,Y(0)); dot(sx,Y(-SLAB));
  dimTx('スラブ t='+SLAB, sx+58, (Y(0)+Y(-SLAB))/2);

  /* ===== 引出線＋材料名（右に1列そろえる。文字は横書き） ===== */
  const items=[];
  if(!KABE){ items.push(['アルミ笠木＋シーリング', WW/2, HH+CAP+40]);
             items.push(['防水層 天端まで巻き込み', WW*0.7, HH+12]); }
  items.push(['防水層（立上り）', 12, HH*0.55]);
  items.push(['入隅 面木 75×75', 40, 40]);
  items.push(['防水層（平場）', -PL*0.45, 12]);
  items.push(['コンクリート躯体', -PL*0.75, -SLAB*0.6]);
  const list=lowH?items.filter((_,i)=>i<4):items;   /* 低い画面は主要な4つだけ */
  const lx=W-padR+26;
  cS.font=(lowH?'700 11px':'700 12px')+' sans-serif'; cS.textBaseline='middle';
  list.forEach((it,i)=>{
    const ty=padT+22+i*(lowH?22:26);
    const px=X(it[1]), py=Y(it[2]);
    cS.strokeStyle=dark?'#8aa0ad':'#666'; cS.lineWidth=.9;
    cS.beginPath(); cS.moveTo(px,py); cS.lineTo(lx-12,ty); cS.lineTo(lx-4,ty); cS.stroke();
    cS.beginPath(); cS.arc(px,py,2.4,0,7); cS.fillStyle=dark?'#8aa0ad':'#666'; cS.fill();
    cS.fillStyle=ink; cS.fillText(it[0], lx, ty);
  });
  cS.textBaseline='alphabetic';

  /* ===== 見出し・層構成（横書き） ===== */
  cS.fillStyle=ink; cS.font='800 14px sans-serif';
  cS.fillText('断面詳細図（'+(KABE?'壁当り':'パラペット立上り')+'の納まり）', 12, barH+20);
  cS.fillStyle=TH.scale; cS.font='700 11px sans-serif';
  cS.fillText(sp.name+'　／　1mm＝'+K.toFixed(2)+'px　／　寸法の単位＝mm', 12, barH+36);

  if(!showLayers)return;                 /* 低い画面では層構成は出さない（図を大きく見せる） */
  const LS=(window.nnLayersOf?nnLayersOf(sp):[]);
  let ly=Hh-padB+34;
  cS.fillStyle=ink; cS.font='800 12px sans-serif';
  cS.fillText('層構成（下から順＝施工の順番）', 12, ly); ly+=17;
  cS.font='700 11.5px sans-serif';
  LS.forEach((L,i)=>{
    if(ly>Hh-8)return;
    cS.fillStyle=L[2]; cS.fillRect(12, ly-9, 11, 11);
    cS.strokeStyle=bodyE; cS.lineWidth=.8; cS.strokeRect(12, ly-9, 11, 11);
    cS.fillStyle=ink; cS.fillText((i+1)+'. '+L[0]+'　'+L[1], 30, ly);
    ly+=16;
  });
};

window.nnSecRefresh=function(){ fillSelects(); nnSecDraw(); };
addEventListener('resize',()=>{ try{ nnSecDraw(); }catch(_){}} );
addEventListener('orientationchange',()=>setTimeout(()=>{ try{ nnSecDraw(); }catch(_){}},250));
fillSelects();
})();
</script>

<script id="nn-photo-js">
/* 写真取り込みモード。上の <style id="nn-photo"> とセット。 */
(function(){
"use strict";
let img=null;                 /* 読み込んだ写真 */
let step=0;                   /* 0:写真待ち 1:四隅 2:寸法入力済→なぞる 3:閉じた */
let corners=[];               /* 写真座標の四隅（左上→右上→右下→左下） */
let realW=10, realD=8;        /* 四隅で囲んだ長方形の実寸（m） */
let H=null;                   /* 射影変換の行列（写真→平面m） */
let trace=[];                 /* なぞった点（写真座標） */
let view={s:1,x:0,y:0};       /* 表示の拡大と位置 */
let drag=null, pinch=null, movedPt=null;

/* ---- 画面を作る ---- */
const box=document.createElement('div'); box.id='nnPhoto';
box.innerHTML='<canvas id="nnPhCv"></canvas>'
 +'<div id="nnPhTop">'
 +'<b>📷 写真から起こす</b><span class="step" id="nnPhStep"></span>'
 +'<button type="button" id="nnPhPick" class="ghost">写真を選ぶ</button>'
 +'<button type="button" id="nnPhSize" class="ghost" disabled>実寸を入れる</button>'
 +'<button type="button" id="nnPhUndo" class="ghost" disabled>1点戻す</button>'
 +'<button type="button" id="nnPhDone" disabled>図面に取り込む</button>'
 +'<button type="button" id="nnPhClose" class="x">✕ 閉じる</button>'
 +'</div>'
 +'<div id="nnPhHelp"></div>'
 +'<input type="file" accept="image/*" id="nnPhFile">';
document.body.appendChild(box);
const cv=document.getElementById('nnPhCv'), cx=cv.getContext('2d');

/* ---- 射影変換（4点対応から3×3行列を解く） ---- */
function solve8(A,b){                       /* ガウス消去（8元1次） */
  const n=8, M=A.map((r,i)=>r.concat([b[i]]));
  for(let i=0;i<n;i++){
    let p=i; for(let r=i+1;r<n;r++) if(Math.abs(M[r][i])>Math.abs(M[p][i])) p=r;
    if(Math.abs(M[p][i])<1e-12) return null;
    const t=M[i]; M[i]=M[p]; M[p]=t;
    for(let r=0;r<n;r++){ if(r===i)continue;
      const f=M[r][i]/M[i][i];
      for(let c=i;c<=n;c++) M[r][c]-=f*M[i][c];
    }
  }
  return M.map((r,i)=>M[i][n]/M[i][i]);
}
function homography(src,dst){
  const A=[], b=[];
  for(let i=0;i<4;i++){
    const u=src[i].x, v=src[i].y, X=dst[i].x, Y=dst[i].y;
    A.push([u,v,1,0,0,0,-u*X,-v*X]); b.push(X);
    A.push([0,0,0,u,v,1,-u*Y,-v*Y]); b.push(Y);
  }
  const h=solve8(A,b);
  return h?[h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1]:null;
}
function applyH(M,p){
  const d=M[6]*p.x+M[7]*p.y+M[8];
  if(Math.abs(d)<1e-12)return null;
  return {x:(M[0]*p.x+M[1]*p.y+M[2])/d, y:(M[3]*p.x+M[4]*p.y+M[5])/d};
}
window.nnPhotoH=()=>H;                       /* 検証用 */

/* ---- 表示（画面 ↔ 写真の座標） ---- */
function fit(){
  if(!img)return;
  const W=cv.clientWidth, Hh=cv.clientHeight;
  const s=Math.min((W-24)/img.width,(Hh-150)/img.height);
  view.s=s; view.x=(W-img.width*s)/2; view.y=(Hh-img.height*s)/2+18;
}
const toScr=p=>({x:view.x+p.x*view.s, y:view.y+p.y*view.s});
const toImg=p=>({x:(p.x-view.x)/view.s, y:(p.y-view.y)/view.s});

/* ---- 案内文 ---- */
const HELP=[
 '① <b>「写真を選ぶ」</b>で、屋上全体が1枚に入っている写真を読み込みます。斜めから撮ったものでかまいません。',
 '② 写真の中の<b>平らな面（平場）の四隅</b>を、<b>左上 → 右上 → 右下 → 左下</b>の順にタップします。<br>点は指でドラッグして直せます。段差の上と下をまたがないでください。',
 '③ <b>「実寸を入れる」</b>で、その四角形の<b>実際の幅と奥行き（m）</b>を入れます。',
 '④ 屋根の輪郭を順にタップしてなぞります。<b>始点をもう一度タップすると閉じます。</b><br>斜めの写真でも、真上から見た正しい形に直しています。',
 '⑤ <b>「図面に取り込む」</b >で図面の部位になります。立上りの高さを入れれば <b>③断面</b> や <b>④3D</b> で既存の姿が見られます。'];
function ui(){
  const st=document.getElementById('nnPhStep');
  const n=!img?0:(corners.length<4?1:(!H?2:(trace.length>=3&&closed?4:3)));
  st.textContent=['写真を選んでください','四隅：'+corners.length+'/4','実寸を入れてください',
                  'なぞる：'+trace.length+'点','取り込めます'][n];
  document.getElementById('nnPhHelp').innerHTML=HELP[n];
  document.getElementById('nnPhSize').disabled=(corners.length<4);
  document.getElementById('nnPhUndo').disabled=!(corners.length||trace.length);
  document.getElementById('nnPhDone').disabled=!(H&&closed&&trace.length>=3);
}
let closed=false;

/* ---- 描画 ---- */
function draw(){
  const W=cv.clientWidth, Hh=cv.clientHeight, dpr=Math.min(2,devicePixelRatio||1);
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(Hh*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(Hh*dpr); }
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.fillStyle='#0f1418'; cx.fillRect(0,0,W,Hh);
  if(img){
    cx.drawImage(img, view.x, view.y, img.width*view.s, img.height*view.s);
  }else{
    cx.fillStyle='#9fb3bd'; cx.font='700 14px sans-serif'; cx.textAlign='center';
    cx.fillText('「写真を選ぶ」から現場写真を読み込んでください', W/2, Hh/2); cx.textAlign='left';
    return;
  }
  /* 四隅 */
  if(corners.length){
    cx.strokeStyle='#ffcf4d'; cx.lineWidth=2; cx.setLineDash([7,4]);
    cx.beginPath();
    corners.forEach((p,i)=>{ const q=toScr(p); i?cx.lineTo(q.x,q.y):cx.moveTo(q.x,q.y); });
    if(corners.length===4)cx.closePath();
    cx.stroke(); cx.setLineDash([]);
    corners.forEach((p,i)=>{
      const q=toScr(p);
      cx.beginPath(); cx.arc(q.x,q.y,9,0,7); cx.fillStyle='rgba(255,207,77,.9)'; cx.fill();
      cx.strokeStyle='#5a4300'; cx.lineWidth=1.5; cx.stroke();
      cx.fillStyle='#3a2c00'; cx.font='900 11px sans-serif'; cx.textAlign='center';
      cx.fillText(String(i+1), q.x, q.y+4); cx.textAlign='left';
    });
  }
  /* なぞった線 */
  if(trace.length){
    cx.strokeStyle='#7fe0a0'; cx.lineWidth=3; cx.lineJoin='round';
    cx.beginPath();
    trace.forEach((p,i)=>{ const q=toScr(p); i?cx.lineTo(q.x,q.y):cx.moveTo(q.x,q.y); });
    if(closed)cx.closePath();
    cx.stroke();
    trace.forEach((p,i)=>{ const q=toScr(p);
      cx.beginPath(); cx.arc(q.x,q.y,5.5,0,7);
      cx.fillStyle=(i===0&&!closed)?'#ffd24d':'#7fe0a0'; cx.fill();
      cx.strokeStyle='#0f2a1a'; cx.lineWidth=1.2; cx.stroke(); });
    /* 実寸の表示（射影変換後の長さ） */
    if(H&&trace.length>=2){
      cx.font='800 12px sans-serif';
      for(let i=0;i+1<trace.length+(closed?1:0);i++){
        const a=trace[i], b=trace[(i+1)%trace.length];
        const A=applyH(H,a), B=applyH(H,b); if(!A||!B)continue;
        const L=Math.hypot(B.x-A.x,B.y-A.y);
        const qa=toScr(a), qb=toScr(b), mx=(qa.x+qb.x)/2, my=(qa.y+qb.y)/2;
        const t=L.toFixed(2)+'m', w=cx.measureText(t).width+9;
        cx.fillStyle='rgba(12,22,28,.86)'; cx.fillRect(mx-w/2,my-9,w,18);
        cx.fillStyle='#bff0d0'; cx.textAlign='center'; cx.fillText(t,mx,my+4); cx.textAlign='left';
      }
    }
  }
}
window.nnPhDraw=draw;

/* ---- 入力 ---- */
function nearIdx(list,p,r){
  for(let i=list.length-1;i>=0;i--){ const q=toScr(list[i]); if(Math.hypot(q.x-p.x,q.y-p.y)<=r) return i; }
  return -1;
}
const pts=new Map();
cv.addEventListener('pointerdown',e=>{
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ const a=[...pts.values()];
    pinch={d:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y), s:view.s,
           mx:(a[0].x+a[1].x)/2, my:(a[0].y+a[1].y)/2, vx:view.x, vy:view.y};
    drag=null; movedPt=null; return; }
  if(!img)return;
  const r=cv.getBoundingClientRect(), p={x:e.clientX-r.left, y:e.clientY-r.top};
  /* 既に置いた点をつかんだら移動 */
  const ci=nearIdx(corners,p,18);
  if(ci>=0){ movedPt={kind:'c',i:ci}; return; }
  const ti=nearIdx(trace,p,16);
  if(ti>=0&&H){ movedPt={kind:'t',i:ti}; return; }
  drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false,p};
});
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=cv.getBoundingClientRect(), p={x:e.clientX-r.left, y:e.clientY-r.top};
  if(pinch&&pts.size>=2){
    const a=[...pts.values()];
    const d=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);
    const ns=Math.max(.05,Math.min(12, pinch.s*d/(pinch.d||1)));
    const mx=pinch.mx-r.left, my=pinch.my-r.top;
    view.x=mx-(mx-pinch.vx)*(ns/pinch.s); view.y=my-(my-pinch.vy)*(ns/pinch.s);
    view.s=ns; draw(); return;
  }
  if(movedPt){
    const q=toImg(p);
    if(movedPt.kind==='c'){ corners[movedPt.i]=q; if(corners.length===4&&H)recalcH(); }
    else trace[movedPt.i]=q;
    draw(); return;
  }
  if(drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.hypot(dx,dy)>6)drag.moved=true;
    view.x=drag.vx+dx; view.y=drag.vy+dy; draw();
  }
});
function up(e){
  const had=drag, mv=movedPt;
  pts.delete(e.pointerId);
  if(pts.size<2)pinch=null;
  if(mv){ movedPt=null; ui(); return; }
  drag=null;
  if(!img||!had||had.moved)return;
  const p=had.p;
  if(corners.length<4){ corners.push(toImg(p)); if(corners.length===4)toast('四隅ができました。「実寸を入れる」を押してください'); draw(); ui(); return; }
  if(!H){ toast('先に「実寸を入れる」を押してください'); return; }
  if(closed)return;
  const q=toImg(p);
  if(trace.length>=3){
    const f=toScr(trace[0]);
    if(Math.hypot(f.x-p.x,f.y-p.y)<22){ closed=true; toast('形が閉じました。「図面に取り込む」で図面になります'); draw(); ui(); return; }
  }
  trace.push(q); draw(); ui();
}
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,up));

/* ---- ボタン ---- */
document.getElementById('nnPhPick').addEventListener('click',()=>document.getElementById('nnPhFile').click());
document.getElementById('nnPhFile').addEventListener('change',function(){
  const f=this.files&&this.files[0]; this.value='';
  if(!f)return;
  /* ★2026-08-24ae 写真の読み込みを軽くした。
     ここは「なぞって形を起こす」だけで写真そのものは保存しないので、
     ファイル全体を文字（base64）にする必要がない。
     いまのスマホの写真は1枚10MBを超え、文字にするとさらに1.33倍になって
     古い端末では落ちることがある。ブラウザが直に読む道を先に使う。 */
  const use=(src,w,h,close)=>{
    if(w>4000){ const sc=4000/w; const c=document.createElement('canvas');
      c.width=Math.round(w*sc); c.height=Math.round(h*sc);
      c.getContext('2d').drawImage(src,0,0,c.width,c.height);
      if(close){ try{ src.close(); }catch(_){} }
      img=c;
    } else img=src;
    corners=[]; trace=[]; H=null; closed=false; fit(); draw(); ui();
  };
  const legacy=()=>{
    const u=URL.createObjectURL(f);
    const im=new Image();
    im.onload=()=>{ use(im, im.width, im.height, false); try{URL.revokeObjectURL(u);}catch(_){} };
    im.onerror=()=>{ try{URL.revokeObjectURL(u);}catch(_){} toast('この写真は読み込めませんでした'); };
    im.src=u;
  };
  if(window.createImageBitmap){
    let done=false;
    try{ createImageBitmap(f).then(bm=>{ done=true; use(bm, bm.width, bm.height, true); })
                             .catch(()=>{ if(!done) legacy(); });
      return;
    }catch(_){ /* 下の道へ */ }
  }
  legacy();
});
function recalcH(){
  H=homography(corners,[{x:0,y:0},{x:realW,y:0},{x:realW,y:realD},{x:0,y:realD}]);
}
document.getElementById('nnPhSize').addEventListener('click',()=>{
  if(corners.length<4)return;
  nnNumAsk('四隅で囲んだ範囲の【幅】（m）', String(realW), function(v){
    if(v===null)return;
    const w=parseFloat(String(v).replace(/[^0-9.]/g,'')); if(!isFinite(w)||w<=0){toast('数値を入れてください');return;}
    /* ★2026-08-24z 実寸の上限・下限。小さすぎる値を入れると縮尺が何千倍にもなり、
       起こした図面が巨大になって描き直しが固まる。 */
    if(w<0.1||w>1000){ toast('0.1m〜1000m で入れてください'); return; }
    realW=w;
    nnNumAsk('同じ範囲の【奥行き】（m）', String(realD), function(v2){
      if(v2===null)return;
      const d=parseFloat(String(v2).replace(/[^0-9.]/g,'')); if(!isFinite(d)||d<=0){toast('数値を入れてください');return;}
      if(d<0.1||d>1000){ toast('0.1m〜1000m で入れてください'); return; }
      realD=d; recalcH();
      toast(H?('実寸を設定しました（'+realW+'m × '+realD+'m）。輪郭をなぞってください'):'四隅の順番を見直してください');
      draw(); ui();
    });
  });
});
document.getElementById('nnPhUndo').addEventListener('click',()=>{
  if(closed){ closed=false; }
  else if(trace.length) trace.pop();
  else if(corners.length){ corners.pop(); H=null; }
  draw(); ui();
});
document.getElementById('nnPhClose').addEventListener('click',()=>{ box.classList.remove('on'); });
document.getElementById('nnPhDone').addEventListener('click',()=>{
  if(!(H&&closed&&trace.length>=3))return;
  const s=state.scaleM;
  const pts2=trace.map(p=>{ const m=applyH(H,p); return m?{x:+(m.x/s).toFixed(2), y:+(m.y/s).toFixed(2)}:null; }).filter(Boolean);
  if(pts2.length<3){ toast('うまく変換できませんでした。四隅を置き直してください'); return; }
  /* 図面のあいている場所へ寄せる（既にある部位と重ならないように右へ） */
  let mx=-1e9; state.polys.forEach(p=>p.pts.forEach(q=>{ mx=Math.max(mx,q.x); }));
  const off=(mx>-1e8)?(mx+3):0;
  let mnx=1e9,mny=1e9; pts2.forEach(q=>{mnx=Math.min(mnx,q.x);mny=Math.min(mny,q.y);});
  const moved=pts2.map(q=>({x:+(q.x-mnx+off).toFixed(2), y:+(q.y-mny+2).toFixed(2)}));
  const defH=+document.getElementById('defH').value||300, defW=+document.getElementById('defW').value||250;
  state.polys.push({name:'写真から起こした屋根'+(state.polys.length+1), lv:0, pts:moved,
    edges:moved.map(()=>({h:defH,w:defW,k:defH>0?'para':'free'})), holes:[]});
  state.active=state.polys.length-1;
  saveState(); renderPolyList(); setTab('zu'); window.draw&&window.draw();
  box.classList.remove('on');
  toast('図面に取り込みました。立上りの高さを直すと 3D で既存の姿が見られます');
});
addEventListener('resize',()=>{ if(box.classList.contains('on')){ draw(); } });

/* ★スマホ（特にたて画面）はボタンの文字が長いとバーが3段になり、
   写真の見える面積が減る。文字を短くして1〜2段に収める。 */
if(typeof NN_PHONE!=='undefined'&&NN_PHONE){
  const sh=(id,t)=>{ const el=document.getElementById(id); if(el)el.textContent=t; };
  sh('nnPhPick','📁 写真'); sh('nnPhSize','📏 実寸'); sh('nnPhUndo','↩ 戻す');
  sh('nnPhDone','✓ 取り込む'); sh('nnPhClose','✕');
  const b=box.querySelector('#nnPhTop b'); if(b)b.textContent='📷 写真から起こす';
}
window.nnPhotoOpen=function(){
  box.classList.add('on');
  if(img)fit();
  draw(); ui();
};
window.nnPhotoState=()=>({hasImg:!!img, corners:corners.length, H:!!H, trace:trace.length, closed});
window.nnPhotoTestLoad=function(w,h){          /* 検証用：写真の代わりに白い絵を入れる */
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.fillStyle='#888'; g.fillRect(0,0,w,h);
  const im=new Image(); im.onload=()=>{ img=im; corners=[]; trace=[]; H=null; closed=false; fit(); draw(); ui(); };
  im.src=c.toDataURL();
};
window.nnPhotoTestTap=function(ix,iy){          /* 検証用：写真座標で1点置く */
  if(corners.length<4){ corners.push({x:ix,y:iy}); if(corners.length===4){} }
  else if(H){ if(trace.length>=3&&Math.hypot(trace[0].x-ix,trace[0].y-iy)<6){ closed=true; } else trace.push({x:ix,y:iy}); }
  draw(); ui();
};
window.nnPhotoTestSize=function(w,d){ realW=w; realD=d; recalcH(); draw(); ui(); return !!H; };
window.nnPhotoTestDone=function(){ document.getElementById('nnPhDone').click(); };
ui();
})();
</script>

/* ★2026-08-11a パソコンの「表示の大きさ」をモニターに関わらずそろえる（本人の指示）
   ------------------------------------------------------------------
   同じ拡大100%でも、大きいモニター（横に広い）ほど1画面に入るpxが増えるので、
   文字やボタンが相対的に小さく見える。そこで
     倍率 ＝ 画面の横幅 ÷ 1600px（1.00〜1.60の範囲）
   を html に zoom でかけ、どのモニターでも同じ見え方になるようにした。

<script id="nn-pczoom-js">
(function(){
  if(document.documentElement.getAttribute('data-nnphone')==='1'){ window.nnPZ=1; return; }
  var BASE=1600, MINZ=1.00, MAXZ=1.60;
  function autoZ(){
    var z=(window.innerWidth||1600)/BASE;
    z=Math.round(z*20)/20;                       /* 0.05きざみ */
    return Math.min(MAXZ, Math.max(MINZ, z));
  }
  function apply(){
    var z=autoZ();
    window.nnPZ=z;
    document.documentElement.style.zoom = (z===1 ? '' : z);
    document.documentElement.style.setProperty('--nnpzr', z);
    document.documentElement.setAttribute('data-nnpz', z===1 ? 'off' : 'on');
    try{ if(window.nnFillBottom) window.nnFillBottom(); }catch(e){}
    try{ if(window.nnFitMapApp) window.nnFitMapApp(); }catch(e){}
    try{ if(window.nnSecRefresh) window.nnSecRefresh(); }catch(e){}
  }
  apply();
  addEventListener('resize', apply);
})();
</script>

<script id="nn-parts-js">

(function(){

             ['pipe','配管貫通'],['hatch','タラップ・ハッチ'],

 {id:'p1', name:'たて型ドレン 75φ', kind:'drain', w:300,d:300,h:0,  price:8000,  addM2:0.6, sealM:1.2, memo:'改修用ドレン共'},
 {id:'p2', name:'空調架台 600×600', kind:'stand', w:600,d:600,h:300, price:12000, addM2:0.9, sealM:2.4, memo:'脚4本・増し貼り共'},
 {id:'p3', name:'脱気筒',           kind:'vent',  w:200,d:200,h:250, price:9000,  addM2:0.4, sealM:0.8, memo:'100㎡に1箇所'},
];

  try{ const o=JSON.parse(localStorage.getItem(PKEY)||'null');
       /* ★2026-08-24ag 1件ずつが箱であることまで確かめる（[null,1] を通さない）。

       if(o&&typeof o==='object'&&Array.isArray(o.items)){

const byId=id=>LIB.find(x=>x.id===id)||null;

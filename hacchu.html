<html lang="ja">
<head>
<meta charset="UTF-8">

<script id="nn-phonemark">
/* ★端末そのものの幅を見て <html> に data-nnphone="1" を付ける
   （縮小表示のページでは CSS の画面幅が常に980pxになり、画面幅では判定できない） */
(function(){try{
  var d = Math.min(screen.width||0, screen.height||0);
  if(d && d < 700) document.documentElement.setAttribute('data-nnphone','1');
}catch(e){}})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>納まりナビ – 発注</title>
<link rel="stylesheet" href="common.css">
<style>
/* ============================================================
   納まりナビ 発注
   現場記録帳・材料登録と同一のデザイン言語（緑ヘッダー／下部ナビ）
   ============================================================ */
:root{
  /* 共通カラーパレットは common.css に移動（--green-deep 等） */
  /* ゲーム風ヘッダー/ナビ用（zairyo基準） */
  --green-hi:#48c274; --green-edge:#124a28;
  --yellow:#ffd94d; --yellow-deep:#f0b400; --warn-deep:#b0392f;
  --stroke-g: 0 1px 1px rgba(18,74,40,.55);
  --profit:#0a6bd6; --warn:#b0392f; --gold:#8a7a2a;
  --radius:10px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); height:100vh; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
.num{font-variant-numeric:tabular-nums;}
/* ---------- ヘッダー ---------- */
header{padding-top:calc(5px + env(safe-area-inset-top)) !important;}
/* 横画面（スマホ）：上部の帯（ヘッダー）を非表示にして表示領域を広げる
   ※タップ高速化とノッチ左右の余白は、文末の nn-tap / nn-safearea ブロック参照 */
@media (orientation:landscape) and (max-height:500px){
  header{display:none !important;}
}
header{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
    linear-gradient(180deg, var(--green-hi), var(--green) 55%, var(--green-deep));
  color:#fff; display:flex; align-items:center; gap:10px; padding:5px 13px; flex:none;
  border-bottom:2px solid var(--green-edge);
  box-shadow:0 2px 0 rgba(0,0,0,.08);
  position:relative; z-index:20;
}
header .hicon{font-size:19px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));}
header h1{
  font-size:17px; font-weight:900; letter-spacing:.04em;
  text-shadow:var(--stroke-g);
}
header .count{margin-left:auto; font-size:12.5px; font-weight:700; white-space:nowrap; text-shadow:0 1px 0 rgba(0,0,0,.3);}
/* ---------- ビュータブ ---------- */
#viewtabs{display:flex; gap:8px; padding:10px 18px 0; background:var(--paper); flex:none; flex-wrap:wrap;}
#viewtabs button{border:1px solid var(--line); background:#e3e7e0; color:var(--ink-sub); border-radius:9px 9px 0 0;
  padding:9px 20px; font-size:14.5px; font-weight:800; cursor:pointer; letter-spacing:.03em;}
#viewtabs button.on{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}
#viewtabs button:not(.on):hover{background:#d7dcd2;}
/* ---------- 本体 ---------- */
main{flex:1; overflow-y:auto; background:#f7f8f5; border-top:1px solid var(--line);}
.wrap{max-width:860px; margin:0 auto; padding:14px 14px 100px;}
/* ---------- 汎用 ---------- */
.panel{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; margin-bottom:12px;}
.panel h4{font-size:13px; font-weight:800; color:var(--green-deep); margin-bottom:9px; letter-spacing:.04em; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.panel h4 .sub{font-weight:700; color:var(--ink-sub); font-size:11.5px;}
.badge{display:inline-block; color:#fff; border-radius:4px; padding:2px 8px; font-size:11.5px; font-weight:800; letter-spacing:.03em; white-space:nowrap;}
.tag{display:inline-block; border-radius:4px; padding:2px 7px; font-size:11.5px; font-weight:800; white-space:nowrap;}
.tag.done{background:var(--green-lite); color:var(--green-deep); border:1px solid #b8dcc4;}
.tag.cnt{background:#eef0ea; color:var(--ink-sub); border:1px solid var(--line); font-weight:700;}
.tag.warn{background:#fbe9e7; color:var(--warn); border:1px solid #e8b0a8;}
.tag.blue{background:#e7f0fb; color:var(--profit); border:1px solid #b9d3f0;}
.btn-ok{background:var(--green); color:#fff; border:0; border-radius:7px; padding:12px 26px; font-size:15px; font-weight:800; cursor:pointer; letter-spacing:.05em;}
.btn-ok:hover{background:var(--green-deep);}
.btn-ok:disabled{background:#a8b5ad; cursor:not-allowed;}
.btn-ghost{background:#fff; border:2px solid var(--green); color:var(--green-deep); border-radius:7px; padding:9px 16px; font-size:13.5px; font-weight:800; cursor:pointer;}
.btn-ghost:hover{background:var(--green-lite);}
.btn-mini{background:#fff; border:1.5px solid var(--green); color:var(--green-deep); border-radius:6px; padding:6px 12px; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap;}
.btn-mini:hover{background:var(--green-lite);}
.hint{font-size:12.5px; color:var(--ink-sub); line-height:1.7;}
.empty{padding:36px 16px; text-align:center; color:var(--ink-sub); font-size:14px; line-height:1.9;}
/* ---------- ステップバー ---------- */
.steps{display:flex; gap:0; margin-bottom:12px; background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.steps div{flex:1; text-align:center; padding:9px 4px; font-size:12.5px; font-weight:800; color:var(--ink-sub); background:#f0f2ee; border-right:1px solid var(--line); white-space:nowrap;}
.steps div:last-child{border-right:0;}
.steps div.on{background:var(--green); color:#fff;}
.steps div.ok{background:var(--green-lite); color:var(--green-deep);}
/* ---------- 現場カード ---------- */
.gcard{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; margin-bottom:10px; cursor:pointer; display:flex; flex-direction:column; gap:6px;
}
.gcard:hover{border-color:var(--green); box-shadow:0 2px 8px rgba(42,122,79,.12);}
.gcard.dim{opacity:.6; cursor:default;}
.gcard.dim:hover{border-color:var(--line); box-shadow:none;}
.gcard .top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.gcard .nm{font-weight:800; font-size:15px; flex:1; min-width:160px;}
.gcard .meta{font-size:12.5px; color:var(--ink-sub); display:flex; gap:12px; flex-wrap:wrap;}
.gcard .last{font-size:12px; color:var(--profit); font-weight:700;}
.st-shiko{background:#1f66c0;} .st-jucyu{background:var(--green);} .st-mitsu{background:#8a8f8b;}
/* ---------- 発注編集 ---------- */
.frow{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px;}
.frow label{font-size:12.5px; font-weight:800; color:var(--ink-sub); min-width:74px;}
.frow select,.frow input[type=date],.frow input[type=text]{
  padding:9px 11px; border:1px solid var(--line); border-radius:7px; font-size:14.5px; background:#fff; flex:1; min-width:150px;
}
.frow select:focus,.frow input:focus{border-color:var(--green); outline:none;}
/* 明細表 */
.item-tbl{width:100%; border-collapse:collapse; font-size:13.5px;}
.item-tbl th,.item-tbl td{border:1px solid var(--line); padding:7px 8px; white-space:nowrap;}
.item-tbl th{background:var(--green-lite); font-weight:800; font-size:12px; color:var(--green-deep);}
.item-tbl td.nm{white-space:normal; min-width:130px; font-weight:700;}
.item-tbl td.nm small{display:block; font-weight:600; color:var(--ink-sub); font-size:11px;}
.item-tbl td.r{text-align:right;}
.item-tbl input.qty{width:64px; padding:7px 6px; border:1px solid var(--line); border-radius:6px; text-align:right; font-size:15px; font-weight:800;}
.item-tbl input.qty:focus{border-color:var(--green); outline:none;}
.item-tbl input.uprice{width:86px; padding:7px 6px; border:1px solid var(--line); border-radius:6px; text-align:right; font-size:14px; font-weight:800;}
.lockprice{font-weight:800; display:inline-flex; align-items:center; gap:4px; cursor:help;}
.lockprice .lk{font-size:12px;}
.item-tbl .del{color:var(--warn); font-weight:800; cursor:pointer; font-size:15px; padding:0 4px;}
.tbl-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.total-line{display:flex; justify-content:flex-end; align-items:baseline; gap:10px; margin-top:10px; font-size:14px; font-weight:800;}
.total-line .big{font-size:21px; color:var(--green-deep);}
/* 送信方法トグル */
.sendsel{display:flex; gap:8px; flex-wrap:wrap;}
.sendsel button{
  flex:1; min-width:130px; border:2px solid var(--line); background:#fff; border-radius:9px;
  padding:11px 10px; font-size:14px; font-weight:800; cursor:pointer; color:var(--ink-sub); text-align:left; line-height:1.5;
}
.sendsel button small{display:block; font-size:11.5px; font-weight:700;}
.sendsel button.on{border-color:var(--green); background:var(--green-lite); color:var(--green-deep);}
/* ---------- 発注書プレビュー（A4風） ---------- */
.sheet{
  background:#fff; border:1px solid #c9cec6; border-radius:4px; box-shadow:0 3px 14px rgba(0,0,0,.10);
  padding:26px 24px; max-width:640px; margin:0 auto; font-size:12.5px; line-height:1.65;
}
.sheet .s-title{text-align:center; font-size:21px; font-weight:800; letter-spacing:.5em; padding-left:.5em; margin-bottom:4px;}
.sheet .s-no{text-align:right; font-size:11.5px; color:var(--ink-sub);}
.sheet .s-head{display:flex; justify-content:space-between; gap:14px; margin-top:12px; flex-wrap:wrap;}
.sheet .s-to{flex:1; min-width:200px;}
.sheet .s-to .toname{font-size:16.5px; font-weight:800; border-bottom:2px solid var(--ink); padding-bottom:3px; margin-bottom:6px;}
.sheet .s-from{width:230px; font-size:11.5px; position:relative;}
.sheet .s-from .co{font-size:14px; font-weight:800;}
.sheet .s-from .seal{
  position:absolute; right:2px; top:2px; width:44px; height:44px; border:2px solid #c33; border-radius:4px;
  color:#c33; font-size:9px; display:flex; align-items:center; justify-content:center; text-align:center; opacity:.85; font-weight:800;
}
.sheet .s-kv{display:grid; grid-template-columns:82px 1fr; gap:2px 8px; margin-top:12px; font-size:12.5px;}
.sheet .s-kv dt{font-weight:800; color:var(--ink-sub);}
.sheet table{width:100%; border-collapse:collapse; margin-top:12px; font-size:12px;}
.sheet th,.sheet td{border:1px solid #888; padding:5px 7px;}
.sheet th{background:#f0f2ee; font-weight:800;}
.sheet td.r{text-align:right; font-variant-numeric:tabular-nums;}
.sheet .s-total td{font-weight:800; font-size:13.5px;}
.sheet .s-note{margin-top:10px; font-size:11.5px; color:var(--ink-sub); border:1px dashed #aaa; border-radius:4px; padding:7px 9px; min-height:2.2em;}
/* ---------- 履歴 ---------- */
.hgroup{margin-bottom:14px;}
.hgroup .gh{font-size:13px; font-weight:800; color:var(--green-deep); padding:4px 2px 6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.hrow{
  background:#fff; border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.hrow .d{font-size:12.5px; font-weight:800; color:var(--ink-sub); white-space:nowrap;}
.hrow .v{font-weight:800; font-size:13.5px;}
.hrow .amt{margin-left:auto; font-weight:800; font-size:14.5px; white-space:nowrap;}
.hrow .acts{display:flex; gap:6px; flex-wrap:wrap;}
.send-fax{background:#8a4a12;} .send-mail{background:#1f66c0;}
/* ---------- 発注先カード ---------- */
.vcard{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px;}
.vcard .vh{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
.vcard .vh .nm{font-weight:800; font-size:15.5px; flex:1;}
.vcard .kv{display:grid; grid-template-columns:96px 1fr; gap:5px 10px; font-size:13.5px;}
.vcard .kv dt{color:var(--ink-sub); font-weight:700;}
.vcard .kv dd{font-weight:600;}
/* 自社情報フォーム */
.myform{display:grid; grid-template-columns:96px 1fr; gap:8px 10px; align-items:center; font-size:13.5px;}
.myform label{font-weight:800; color:var(--ink-sub);}
.myform input{padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px;}
.myform input:focus{border-color:var(--green); outline:none;}
/* ---------- モーダル ---------- */
.modal-bg{display:none; position:fixed; inset:0; background:rgba(20,26,22,.5); z-index:60; align-items:center; justify-content:center; padding:14px;}
.modal-bg.open{display:flex;}
.modal{background:#fff; border-radius:12px; max-width:520px; width:100%; max-height:88dvh; overflow-y:auto; padding:18px;}
.modal h3{font-size:16px; font-weight:800; color:var(--green-deep); margin-bottom:12px;}
.modal .mrow2{display:flex; gap:10px; margin-top:14px; justify-content:flex-end; flex-wrap:wrap;}
.spinner{display:inline-block; width:17px; height:17px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:sp .8s linear infinite; vertical-align:-3px; margin-right:7px;}
@keyframes sp{to{transform:rotate(360deg);}}
/* ---------- トースト ---------- */
#toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(20px);
  background:#202623; color:#fff; padding:11px 20px; border-radius:9px; font-size:14px; font-weight:700;
  opacity:0; pointer-events:none; transition:.25s; z-index:99; max-width:90vw; text-align:center; line-height:1.6;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
/* ---------- 下部ナビ ---------- */
nav{
  flex:none;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,#1f5c36,#153f25);
  display:flex; gap:3px; padding:2px 7px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:calc(2px + env(safe-area-inset-bottom)); /* 端末下端の見切れ防止（rev.04 ③） */
  border-top:2px solid #0d2a18;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
}
nav::-webkit-scrollbar{display:none;}
nav .ni{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfe6d6;
  font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;
  transition:transform .06s;
}
nav .ni .ic{font-size:19px; line-height:1; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));}
nav .ni:hover{background:rgba(255,255,255,.10);}
nav .ni:active{transform:translateY(1px);}
nav .ni.on{
  background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));
  color:#4d3a00; border:1.5px solid #a87f00;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #7d5f00;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
/* ---------- 画像アイコンボタン（ナビ改修指示書 Step3） ---------- */
nav .ni .ic img, nav#nav .ni .ic img{height:44px; display:block;}
nav .ni.hasimg, nav#nav .ni.hasimg{padding:0 3px; margin-top:-13px;}
nav .ni.hasimg > span:last-child, nav#nav .ni.hasimg > span:last-child{display:none;}
nav .ni.hasimg .ic, nav#nav .ni.hasimg .ic{filter:none;}
nav .ni.hasimg.on, nav#nav .ni.hasimg.on{background:none; border:none; box-shadow:none; text-shadow:none;
  filter:drop-shadow(0 0 5px #ffd23f) drop-shadow(0 0 2px #ffd23f);
  transform:scale(1.14);
  transform-origin:center bottom;
  z-index:2; position:relative;
}
nav .ni.hasimg, nav#nav .ni.hasimg{transition:transform .15s ease-out, filter .15s ease-out;}
nav .ni.hasimg:hover, nav#nav .ni.hasimg:hover{transform:scale(1.06);}
nav .ni.hasimg.on:hover, nav#nav .ni.hasimg.on:hover{transform:scale(1.14);}
nav, nav#nav{overflow:visible; padding-top:2px;}
@media (max-width:760px){
  nav, nav#nav{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; justify-content:flex-start;}
  nav::-webkit-scrollbar, nav#nav::-webkit-scrollbar{display:none;}
  nav .ni .ic img, nav#nav .ni .ic img{height:38px;}
  nav .ni.hasimg, nav#nav .ni.hasimg{margin-top:0;}
  nav .ni:first-child, nav#nav .ni:first-child{margin-left:0;}
  nav .ni:last-child, nav#nav .ni:last-child{margin-right:0;}
}
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
/* ---------- タップ演出（shiyo_toroku基準：タッチ発光） ---------- */
@keyframes tapfx-glow{
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
  60%{opacity:.7;}
  100%{opacity:0; transform:translate(-50%,-50%) scale(2.1);}
}
@keyframes tapfx-ring{
  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.45);}
}
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);
  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .55s ease-out forwards;
}
.tapfx::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:2px solid rgba(255,217,77,.9);
  animation:tapfx-ring .55s ease-out forwards;
}
/* ---------- モバイル ---------- */
@media (max-width:640px){
  :root{font-size:14px;}
  header h1{font-size:18px;}
  header .count{display:none;}
  #viewtabs{padding:8px 10px 0; gap:5px;}
  #viewtabs button{padding:8px 12px; font-size:13px;}
  .wrap{padding:10px 8px 100px;}
  .sheet{padding:16px 12px;}
  .sheet .s-from{width:100%;}
  nav .ni{padding:4px 8px; font-size:10px; gap:1px;}
  nav .ni .ic{font-size:19px;}
}
</style>

<script>
/* ================= 下部ナビ（各デモページと共通） ================= */
const NAV=[['home','ホーム'],['kiroku','現場記録帳'],['map','現場マップ'],['hacchu','発注'],['kokkou','国交省仕様'],['camera','カメラ'],
           ['library','ライブラリ'],['zumen','図面/積算'],['shiyou','仕様・材料']];
/* rev.04 ②：用語集・設定はナビから削除（ホームの右側ボタンと同じ扱い） */
const NAV_LINKS={home:'./index.html', kiroku:'./kirokucho_demo.html', map:'./genba_map_v36.html', hacchu:'./hacchu.html', kokkou:'./kokkosho.html',
                 camera:'./camera.html', library:'./library.html', yougo:'./yougo.html',
                 zumen:'./zumen_sekisan.html',
                 zairyo:'./zairyo_toroku.html', shiyou:'./shiyo_toroku.html'};
const NAV_ACTIVE='hacchu';
const ICONS={header:'📠', home:'🏠', kiroku:'📋', map:'🗺️', hacchu:'📝', kokkou:'📗', camera:'📷',

function navGo(k,label){

      <span class="ic"><img src="./icons/nav_${k}${suf}.png" alt="${l}"
        onload="this.closest('.ni').classList.add('hasimg')"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='./icons/nav_${k}.png';}
                 else{this.outerHTML=ICONS['${k}']||'▫️';}"></span><span>${l}</span></div>`;
  }).join('');
  /* あふれ時：アクティブなボタンを中央に
     ★位置の計測（scrollWidth や getBoundingClientRect）は「画面をいったん組み上げる」
       処理なので、ここで行うと画面が出るまでの待ち時間が伸びる。
       画面を出したあと（次の描画のタイミング）にまわす。 */
  addEventListener('load',()=>{
    const on=n.querySelector('.ni.on');
    if(on && n.scrollWidth>n.clientWidth){
      const d=on.getBoundingClientRect().left-n.getBoundingClientRect().left;
      n.scrollLeft+=d-(n.clientWidth-on.offsetWidth)/2;
    }
  },{once:true});
}

/* ---------- タップ演出（shiyo_toroku基準：発光＋タップ音） ---------- */
(function(){
  /* ---------- ゲーム風タップ音（Web Audio合成・音源ファイル不要） ---------- */
  let AC=null;
  function ctx(){
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  function tapSound(){
    try{
      const c=ctx(), t=c.currentTime;
      // やわらかい水滴風の「ぽん」：低めのサイン波2音（耳に優しい音量）
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(523,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.06,t+0.010);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.15);
      // 軽く上に抜ける倍音
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(784,t);
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.03,t+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
      o2.connect(g2).connect(c.destination);
      o2.start(t+0.005); o2.stop(t+0.12);
    }catch(e){}
  }

  /* ---------- タッチ発光 ---------- */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    /* ★2026-08-13j パソコンの表示倍率（zoom）で割ること。
       clientX/Y は倍率を**かけた後**のpx、style.left/top は倍率を**かける前**のpx。
       割らないと、大きいモニターほど発光が右下の見当違いな場所に出る（§61の落とし穴）。 */
    const _z=window.nnPZ||1;
    el.style.left=(x/_z)+'px'; el.style.top=(y/_z)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 600);
  }

  /* ---------- イベント委譲 ----------
     発光＝画面のどこを触っても出す（触った場所のフィードバック）
     音　＝押せる要素（ボタン・ナビ・チップ・行）に当たったときだけ鳴らす */
  const PRESSABLE='button, .chip>button, .mk, .mrow, .tabs button, #viewtabs button, .btn-ok, .btn-ghost, .sortbtn, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    /* ★下部ナビは専用の音（nav_move.wav）を鳴らすので、ここでは鳴らさない。
       [onclick] にナビも含まれてしまい、1回のタップで2種類の音が重なって
       「ココンコン」と聞こえていた原因。 */
    const tc=(e.target&&e.target.closest)?e.target:null;
    const hit=(!tc||tc.closest('nav .ni'))?null:tc.closest(PRESSABLE);
    if(hit && !hit.disabled && !hit.classList.contains('soon')){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();

          ? `<span class="lockprice" onclick="toast('見積時に取り決めた単価が適用されています。<br>変更は記録帳の受注情報から行います')"><span class="lk">🔒</span>${yen(l.p)}</span>`
          : `<input class="uprice num" type="number" min="0" value="${l.p||''}" placeholder="単価" onchange="edLine(${i},'p',this.value)">`}</td>
        <td class="r"><input class="qty num" type="number" min="0" value="${l.q||''}" placeholder="0" onchange="edLine(${i},'q',this.value)"></td>
        <td>${l.ref?esc(l.u):`<select style="padding:6px;border:1px solid var(--line);border-radius:6px;font-size:13px" onchange="draft.lines[${i}].u=this.value">${['個','缶','set','本','巻','箱','枚','袋','L','kg'].map(u=>`<option ${u===l.u?'selected':''}>${u}</option>`).join('')}</select>`}</td>
        <td class="r num" style="font-weight:800">${l.q>0?yen(l.q*l.p):'—'}</td>
        <td class="del" onclick="delLine(${i})">✕</td>
      </tr>`).join('')}
    </table></div>
    <div style="margin-top:9px"><button class="btn-mini" onclick="addLine()">＋ 取決め外の材料を追加（単価入力）</button></div>
    <div class="total-line">合計（税抜）<span class="big num">${yen(draftTotal())}</span></div>
  </div>
  <div class="panel">
    <h4>備考（発注書に記載）</h4>
    <input type="text" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:14px"
      value="${esc(draft.note)}" placeholder="例：午前中着でお願いします／搬入は正面ゲートより" onchange="draft.note=this.value">
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn-ghost" onclick="draft=null;render()">← 現場選択へ戻る</button>
    <button class="btn-ok" style="flex:1" ${draftTotal()>0?'':'disabled'} onclick="draft.step=3;render()">発注書を確認する →</button>
  </div>`;
}

function setVendor(vid){ draft.vid=vid; draft.via=vById(vid).def; render(); }
function edLine(i,k,v){ const n=parseFloat(v); draft.lines[i][k]=isNaN(n)?0:n; render(); }
function delLine(i){ draft.lines.splice(i,1); if(!draft.lines.length)addLine(); render(); }
function addLine(){ draft.lines.push({ref:null,n:'',sp:'',u:'個',p:0,q:0,lock:false}); render(); }

/* ========== ③ プレビュー＆送信 ========== */
function sheetHtml(d, no){
  const g=gById(d.gid), v=vById(d.vid);
  const lines=d.lines.filter(l=>l.q>0);
  const total=lines.reduce((s,l)=>s+l.q*l.p,0);
  return `<div class="sheet">
    <div class="s-no">発注No. ${esc(no)}<br>発注日：${fmtD(d.date||today())}</div>
    <div class="s-title">発注書</div>
    <div class="s-head">
      <div class="s-to">
        <div class="toname">${esc(v.name)}　御中</div>
        <div style="font-size:11.5px;color:var(--ink-sub)">${esc(v.tanto)}</div>
        <div style="margin-top:8px;font-size:12px">下記の通り発注いたします。</div>
      </div>
      <div class="s-from">
        <div class="seal">印</div>
        <div class="co">${esc(myCo.co)}</div>
        <div>${esc(myCo.addr)}</div>
        <div>TEL：${esc(myCo.tel)}／FAX：${esc(myCo.fax)}</div>
        <div>担当：${esc(myCo.tanto)}</div>
      </div>
    </div>
    <dl class="s-kv">
      <dt>納入場所</dt><dd>${esc(g.name)}　${esc(g.addr)}</dd>
      <dt>希望納期</dt><dd>${d.due?fmtD(d.due):'追って連絡'}</dd>
    </dl>
    <table>
      <tr><th style="width:44%">品名・規格</th><th>数量</th><th>単位</th><th>単価</th><th>金額</th></tr>
      ${lines.map(l=>`<tr><td>${esc(l.n)}　${esc(l.sp)}</td><td class="r">${l.q}</td><td>${esc(l.u)}</td><td class="r">${yen(l.p)}</td><td class="r">${yen(l.q*l.p)}</td></tr>`).join('')}
      <tr class="s-total"><td colspan="4" style="text-align:right">合計（税抜）</td><td class="r">${yen(total)}</td></tr>
    </table>
    <div class="s-note">備考：${esc(d.note||'')}</div>
  </div>`;
}

function renderPreview(c){
  const v=vById(draft.vid);
  const no='HC-'+today().replace(/-/g,'').slice(2)+'-'+String(history.length+1).padStart(2,'0');
  draft._no=no;
  c.innerHTML = stepBar(3) + `
  <div class="panel">
    <h4>送信方法 <span class="sub">発注先ごとの既定を初期選択。ここでいつでも切替できます</span></h4>
    <div class="sendsel">
      <button class="${draft.via==='fax'?'on':''}" onclick="draft.via='fax';render()">📠 FAXで送る<small>${esc(v.fax)}</small></button>
      <button class="${draft.via==='mail'?'on':''}" onclick="draft.via='mail';render()">✉️ メールで送る<small>${esc(v.mail)}</small></button>
    </div>
  </div>
  ${sheetHtml(draft, no)}
  <div class="hint" style="text-align:center;margin-top:8px">↑ この書式（自社情報・捺印枠）は「発注先・自社書式」タブで編集できます</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
    <button class="btn-ghost" onclick="draft.step=2;render()">← 明細に戻る</button>
    <button class="btn-ghost" onclick="nnHacchuPDF(draft, draft._no)">📄 発注書PDF（印刷・保存）</button>
    <button class="btn-ok" style="flex:1" onclick="openSend()">${draft.via==='fax'?'📠 FAX送信する':'✉️ メール送信する'}</button>
  </div>`;
}

function openSend(){
  const v=vById(draft.vid);
  const bg=document.getElementById('sendModal'), b=document.getElementById('sendModalBody');
  b.innerHTML=`<h3>${draft.via==='fax'?'📠 FAX送信の確認':'✉️ メール送信の確認'}</h3>
    <div style="font-size:14px;line-height:2">
      <b>${esc(v.name)}</b>（${esc(v.tanto)}）宛<br>
      ${draft.via==='fax'?`FAX番号：<b>${esc(v.fax)}</b>`:`宛先：<b>${esc(v.mail)}</b>`}<br>
      発注No.${esc(draft._no)}／合計 <b>${yen(draftTotal())}</b>（税抜）
    </div>
    <div class="hint" style="margin-top:8px">${draft.via==='fax'?'※ インターネットFAX経由で発注書PDFを送信します（デモでは送信を模擬します）':'※ 発注書PDFを添付してメール送信します（デモでは送信を模擬します）'}</div>
    <div class="mrow2">
      <button class="btn-ghost" onclick="closeSend()">キャンセル</button>
      <button class="btn-ok" id="sendGo" onclick="doSend()">送信する</button>
    </div>`;
  bg.classList.add('open');
}
function closeSend(){ document.getElementById('sendModal').classList.remove('open'); }
function doSend(){
  const btn=document.getElementById('sendGo');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>送信中…';
  setTimeout(()=>{
    history.unshift({id:uid(), gid:draft.gid, vid:draft.vid, date:today(), due:draft.due, via:draft.via,
      no:draft._no, note:draft.note, lines:JSON.parse(JSON.stringify(draft.lines.filter(l=>l.q>0)))});
    save(); closeSend();
    toast((draft.via==='fax'?'📠 FAX送信しました':'✉️ メール送信しました')+'<br>発注履歴に記録しました');
    draft=null; showView('hist');
  },1300);
}

/* ========== ② 発注履歴 ========== */
function renderHist(c){
  if(!history.length){ c.innerHTML='<div class="empty">発注履歴はまだありません。<br>「発注作成」から最初の発注書を作りましょう。</div>'; return; }
  const byG={};
  history.forEach(h=>{ (byG[h.gid]=byG[h.gid]||[]).push(h); });
  c.innerHTML = `<div class="hint" style="margin-bottom:10px">施工中の現場は「↺ 同じ内容で再発注」から、取決め単価のまま数量だけ変えて継続発注できます。</div>` +
  Object.keys(byG).map(gid=>{
    const g=gById(gid);
    const stCls=g.st==='施工中'?'st-shiko':((g.st==='受注済'||g.st==='契約済')?'st-jucyu':'st-mitsu');
    return `<div class="hgroup">
      <div class="gh"><span class="badge ${stCls}">${g.st}</span>${esc(g.name)}</div>
      ${byG[gid].map(h=>{
        const v=vById(h.vid); const total=h.lines.reduce((s,l)=>s+l.q*l.p,0);
        return `<div class="hrow">
          <span class="d">${fmtD(h.date)}</span>
          <span class="badge ${h.via==='fax'?'send-fax':'send-mail'}">${h.via==='fax'?'📠 FAX':'✉️ メール'}</span>
          <span class="v">${esc(v.name)}</span>
          <span class="tag cnt">No.${esc(h.no)}</span>
          <span class="amt num">${yen(total)}</span>
          <span class="acts">
            <button class="btn-mini" onclick="viewHist('${h.id}')">発注書を見る</button>
            <button class="btn-mini" onclick="reorder('${h.id}')">↺ 同じ内容で再発注</button>
          </span>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}
function viewHist(id){
  const h=history.find(x=>x.id===id); if(!h)return;
  const bg=document.getElementById('sendModal'), b=document.getElementById('sendModalBody');
  b.innerHTML=`<h3>送信済み発注書（No.${esc(h.no)}）</h3>${sheetHtml(h,h.no)}
    <div class="mrow2"><button class="btn-ghost" onclick="closeSend()">閉じる</button>
    <button class="btn-ghost" onclick="nnHacchuPDF(history.find(x=>x.id==='${h.id}'),'${esc(h.no)}')">📄 発注書PDF</button>
    <button class="btn-ok" onclick="closeSend();reorder('${h.id}')">↺ 同じ内容で再発注</button></div>`;
  bg.classList.add('open');
}
function reorder(id){
  const h=history.find(x=>x.id===id); if(!h)return;
  startDraft(h.gid, h);
  showView('new');
  toast('前回の発注内容を読み込みました。<br>数量を確認して送信してください');
}

/* ========== ③ 発注先・自社書式 ========== */
function renderVend(c){
  c.innerHTML = `
  <div class="panel">
    <h4>自社書式（発注書に反映） <span class="sub">1度登録すれば全発注書に自動で載ります</span></h4>
    <div class="myform">
      <label>社名</label><input value="${esc(myCo.co)}" onchange="myCo.co=this.value;save();toast('保存しました')">
      <label>住所</label><input value="${esc(myCo.addr)}" onchange="myCo.addr=this.value;save();toast('保存しました')">
      <label>TEL</label><input value="${esc(myCo.tel)}" onchange="myCo.tel=this.value;save();toast('保存しました')">
      <label>FAX</label><input value="${esc(myCo.fax)}" onchange="myCo.fax=this.value;save();toast('保存しました')">
      <label>担当者</label><input value="${esc(myCo.tanto)}" onchange="myCo.tanto=this.value;save();toast('保存しました')">
    </div>
    <div class="hint" style="margin-top:9px">※ 将来：客先（商社）指定のExcel/PDFフォーマットを取り込んで、発注先ごとに書式を差し替える機能を予定。現デモでは共通の自社書式1種です。</div>
  </div>
  <div class="panel">
    <h4>発注先（商社）</h4>
    ${VENDORS.map(v=>`<div class="vcard">
      <div class="vh"><span class="nm">${esc(v.name)}</span>
        <span class="tag ${v.def==='fax'?'warn':'blue'}">既定：${v.def==='fax'?'📠 FAX':'✉️ メール'}</span></div>
      <dl class="kv">
        <dt>担当</dt><dd>${esc(v.tanto)}</dd>
        <dt>FAX</dt><dd class="num">${esc(v.fax)}</dd>
        <dt>メール</dt><dd>${esc(v.mail)}</dd>
      </dl>
    </div>`).join('')}
    <div class="hint">※ 本実装では発注先の追加・編集、現場ごとの既定発注先の設定が可能になります。</div>
  </div>`;
}

render();
</script>

<style id="nn-safearea">
/* ============================================================
   iPhone横画面フルスクリーン対応（ノッチ左右の帯をなくす）
   viewport-fit=cover とセットで機能する。
   バー類の中身はセーフエリア分だけ内側に寄せる。

   ============================================================ */
@media (orientation:landscape) and (max-height:500px){
  header,#viewtabs,#makerbar,.toolbar,#gbbar,nav,footer,#memBanner{
    padding-left:calc(10px + env(safe-area-inset-left,0px)) !important;
    padding-right:calc(10px + env(safe-area-inset-right,0px)) !important;
  }

}
</style>

<style id="nn-tap">
/* ============================================================
   タップ反応の高速化
   ・touch-action:manipulation で「ダブルタップ拡大の判定待ち
     （約300ms）」を無効化し、タップ即反応にする。
     ピンチ（2本指）での拡大縮小は今までどおり使える。
     ※一覧モード（縮小表示）はビューポート幅が固定980pxのため
       この待ち時間が特に長く、体感遅延の主原因だった。
   ・タップ時のグレーの点滅（iOS標準ハイライト）も消して、
     ページ側の押し込みアニメーションだけを見せる。
   ============================================================ */
html{touch-action:manipulation;
  /* ★2026-07-28 iPhoneの「文字の自動拡大」を止める。
     iOS Safari は、幅の広い枠に入った文章の文字を勝手に大きくする。
     そのため表の「工程」列や、見出し行の文字だけが不自然に大きくなっていた。 */
  -webkit-text-size-adjust:100%; text-size-adjust:100%;}
/* ★2026-07-28 入力欄をタップすると画面が勝手に寄る（自動ズーム）のを止める。
   iOSは「文字が16px未満の入力欄」を触ると自動で拡大する仕様。
   16px以上にすれば拡大しない。見た目を詰めたいときは余white（padding）で調整する。
   ※ピンチ（2本指）での拡大は今までどおり使えます。 */
input:not([type=checkbox]):not([type=radio]):not([type=range]),
textarea{font-size:16px !important;}
/* ★2026-08-06m <select>（プルダウン）はこの指定から外した。
   iPhoneで画面が勝手に拡大するのは「キーボードが出る入力欄」だけで、
   プルダウンはピッカーが出るだけなので拡大しない。
   16pxを強制していたせいで、ページ側の指定（12.5px等）が全部打ち消され、
   絞り込みのプルダウンだけが一覧の見出しより大きく表示されていた。 */
/* 移動中の進行バー（画面いちばん上・細い線）。タップした瞬間に必ず出る */
#nnbar{position:fixed; left:0; right:0; top:0; height:4px; z-index:100000; pointer-events:none;
  background:rgba(0,0,0,.18);}
#nnbar i{display:block; height:100%; width:38%; border-radius:0 3px 3px 0;
  background:linear-gradient(90deg,#ffd23f,#ffb020); box-shadow:0 0 8px rgba(255,210,63,.8);
  animation:nnbarMove .65s cubic-bezier(.4,0,.2,1) infinite;}
@keyframes nnbarMove{from{transform:translateX(-100%)} to{transform:translateX(300%)}}
*{-webkit-tap-highlight-color:transparent;}
</style>
<style id="nn-navhome">
/* ============================================================
   下部ナビ：ホーム画面の下部ナビ準拠
   ・タテ画面はアイコンを2段構成（横スクロールをやめて折り返し）

   ============================================================ */
@media (orientation:portrait){

}
nav#nav, body>nav{transition:margin-bottom .3s ease, transform .3s ease; position:relative; z-index:80;}
#navShowTab{
  position:fixed; right:10px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); z-index:95;
  width:40px; height:40px; border-radius:50%; border:2px solid #ffd94d; display:none;
  background:linear-gradient(180deg,#2e8b4f,#1c6b3c); color:#ffd94d; font-size:16px; font-weight:900;
  box-shadow:0 2px 6px rgba(0,0,0,.45); cursor:pointer; font-family:inherit; line-height:1;
}
#navShowTab:active{transform:translateY(1px);}

/* ============ 全ページ共通：ページ移動を速く・滑らかに（2026-07-26） ============ */
/* ★body に transform を付けると position:fixed の基準が画面ではなく本文全体になり、
   下部ナビや固定ボタンが画面下に留まらなくなる。透明度だけで演出すること */
@keyframes nnPageIn{from{opacity:0} to{opacity:1}}
body{animation:nnPageIn .10s ease-out both;}
/* ★以前は移動前に画面を消していた（opacity:0）が、
   次のページが出るまでの「真っ白な時間」が長く見える原因だったのでやめた。
   前の画面は、次の画面が出るまでそのまま表示しておく。 */
body.nn-leaving{opacity:1;}
@media (prefers-reduced-motion:reduce){ body{animation:none;} body.nn-leaving{transition:none;} }

/* ============ タップ反応の高速化（全ページ共通・2026-07-26） ============
   ・touch-action:manipulation ＝ 「ダブルタップ拡大かどうか」を見極めるための
     約300msの待ち時間をなくす。指を離した瞬間に反応するようになる。
     ピンチ（2本指）での拡大縮小は今までどおり使える。
   ・押した瞬間に見た目を変える（処理の完了を待たずに手応えを返す） */
html,body{touch-action:manipulation;}
*{-webkit-tap-highlight-color:transparent;}
button,a,label,select,input,summary,.ni,.chip>button,.mk,.mrow,.card,.click,.row,.item,.tab,
.stchip,.dfrow,.dfclear,.kcell,.kbtn,.pcard,.alert-row,.drow2,.ftag,.freset,.calnav,
.zx,.colgear,.sortbtn,.back-list,.spec-card,.seg,[onclick],[role=button]{touch-action:manipulation;}
button:active,.ni:active,.chip>button:active,.mk:active,.stchip:active,.kcell:active,.kbtn:active,
.pcard:active,.alert-row:active,.drow2:active,.ftag:active,.freset:active,.back-list:active,
.spec-card:active,[onclick]:active{filter:brightness(.94);}
@media (prefers-reduced-motion:reduce){
  button:active,.ni:active,.pcard:active,[onclick]:active{filter:none;}
}

/* ============ 下部ナビ：アイコンを帯の中央に・選択中をさらに大きく（2026-07-26） ============
   これまで margin-top:-13px でアイコンを上にずらしていたため、帯からはみ出して
   本文に重なっていた。ずらしをやめ、帯の中で上下中央に置く。 */
/* ★帯の厚みには「画面下端のホームバー用の余白」も含まれる。丸ごと足すと実機で
   帯が1.5倍ほど厚くなるため、半分弱だけ確保する。
   ★アイコンは帯より大きくして上にはみ出させる（押しやすさを確保しつつ帯は薄く保つ）。
     帯の高さ＝アイコンの82％＋ホームバー余白。下端で揃えるので、はみ出しは上だけ。 */

/* ② タテ画面はアイコンを2段に分ける（横に詰め込まず、1つずつ大きく押しやすく）
   ※縮小表示のページは画面幅が980px扱いになるため、向きはJSが data-nnland で伝える */

  nav, nav#nav{flex-wrap:wrap !important; --navgap:10px;

:root[data-nnland="0"] nav .ni, :root[data-nnland="0"] nav#nav .ni{

<script>
/* ページ移動を通信ゼロで一瞬にする（サービスワーカーで全ページを端末に常駐させる） */
/* ============ 版チェック（2026-07-28） ============
   端末には速さのためページを保存しているので、こちらで直しても
   古いものが出続けることがある。そこで ver.txt（数バイト）だけを
   毎回見に行き、公開版と違っていたら保存分を捨てて1回だけ読み直す。
   ★公開のたびに ver.txt と、下の NN_VER を同じ文字に更新すること。 */
const NN_VER='2026-08-19g';
/* ============ 表示にかかった時間の記録（原因調査用・2026-07-28） ============
   スマホの実機でどこに時間がかかっているかを数字で出す。
   ・net  ＝ページを要求してから最初の返事が来るまで（通信の待ち）
   ・recv ＝中身を受け取り終わるまで
   ・build＝受け取ってから組み立て終わるまで（解析・JS実行）
   ・paint＝画面に中身が出たとき
   結果はホーム画面の左上に出る。原因が分かったらこの仕組みごと外す。 */
addEventListener('load',()=>{setTimeout(()=>{
  try{
    const n=performance.getEntriesByType('navigation')[0]; if(!n)return;
    const fcp=performance.getEntriesByType('paint').filter(p=>p.name==='first-contentful-paint')[0];
    const rs=performance.getEntriesByType('resource');
    let slow=null, rkb=0, fontMs=0, fontN=0;
    rs.forEach(r=>{ rkb+=(r.transferSize||0);
      if(!slow||r.duration>slow.duration)slow=r;
      if(/fonts\.(googleapis|gstatic)/.test(r.name)){fontN++; fontMs=Math.max(fontMs, Math.round(r.responseEnd));}});
    const rec={p:(location.pathname.split('/').pop()||'index').replace('.html','').slice(0,8),
      net:Math.round(n.responseStart), recv:Math.round(n.responseEnd),
      build:Math.round(n.domContentLoadedEventEnd), paint:fcp?Math.round(fcp.startTime):-1,
      load:Math.round(n.loadEventEnd), kb:Math.round((n.transferSize||0)/1024),
      res:rs.length, rkb:Math.round(rkb/1024), fn:fontN, fms:fontMs,
      sl:slow?((slow.name.split('/').pop()||'').slice(0,14)+':'+Math.round(slow.duration)):''};
    const a=JSON.parse(sessionStorage.getItem('nnPerf')||'[]'); a.push(rec);
    sessionStorage.setItem('nnPerf',JSON.stringify(a.slice(-7)));
  }catch(_){}
},400);});
const NN_PAGES=['./index.html','./kirokucho_demo.html','./zumen_sekisan.html','./genba_map_v36.html','./hacchu.html',
  './kokkosho.html','./camera.html','./library.html','./shiyo_toroku.html','./zairyo_toroku.html','./yougo.html','./common.css'];
window.nnVerNow=NN_VER;
(async function(){
  try{
    const r=await fetch('./ver.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const v=(await r.text()).trim();
    window.nnVerNew=v;
    if(!v || v===NN_VER)return;
    /* ★2026-07-28 修正：以前は保存分を消して読み直すだけだったが、
       Safari自身が持っている一時保存（HTTPキャッシュ）は消えないため、
       読み直しても古いページが出続けて更新が止まることがあった。
       全ページを cache:'reload' で取り直してから読み直す。 */
    const n=parseInt(sessionStorage.getItem('nnUpdN_'+v)||'0',10);
    if(n>=2)return;                                   /* 失敗が続いたら止める安全弁 */
    sessionStorage.setItem('nnUpdN_'+v,String(n+1));
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    await Promise.all(NN_PAGES.map(u=>fetch(u,{cache:'reload'}).catch(()=>{})));
    location.reload();
  }catch(_){}
})();
</script>
<script>
/* ★2026-07-28：更新が端末に届かない問題への対策
   ・毎回「新しい版が出ていないか」を確認する（r.update()）
   ・新しい版に切り替わったら、その場で1回だけ自動で読み込み直す
     （＝「再読み込み2回」が不要になり、直したことが必ず反映される） */
/* ★2026-07-28 検証：サービスワーカーを一時的に止める
   ホーム(37KB)も現場記録帳(300KB)も、どちらもタップから約0.9秒。
   中身の重さが10倍近く違うのに時間が同じ＝ページの組み立てではなく、
   移動のたびにかかる「決まった待ち時間」がある、ということ。
   iPhoneのSafariでは、この保存の仕組み（サービスワーカー）が
   眠っていると、移動のたびに起こす時間が数百ミリ秒かかることが知られている。
   → いったん止めて、これが原因かを確かめる。
   NN_USE_SW を true に戻せば、オフライン対応ごと元に戻せる。 */
const NN_USE_SW=false;
if('serviceWorker' in navigator){
  if(NN_USE_SW){
    let nnReloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(nnReloaded)return; nnReloaded=true; location.reload();
    });
    addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(r=>{
        try{r.update();}catch(_){}
        if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage('nn-precache');
      }).catch(()=>{});
    });
  }else{
    /* すでに入っている分を取り除き、保存分も消す（1回だけ読み直す） */
    addEventListener('load',async()=>{
      try{
        const rs=await navigator.serviceWorker.getRegistrations();
        if(rs.length){
          await Promise.all(rs.map(r=>r.unregister()));
          if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));}
          if(!sessionStorage.getItem('nnSwOff')){ sessionStorage.setItem('nnSwOff','1'); location.reload(); }
        }
      }catch(_){}
    });
  }
}
</script>
<script>
/* ============ ナビの操作音（2026-07-28 作り直し） ============
   ★以前は <audio> を2個ずつ用意して音源ファイル(nav_move.wav)を
     読ませていたが、iPhoneでは音声部品の準備が重く、しかも
     いつ終わるか読めないため、画面が出るまでの待ち時間に影響していた。
     → 音源ファイルをやめ、その場で音を合成する方式（Web Audio）に変更。
       ファイル読み込みゼロ・部品ゼロ・音は今までと同じ「やわらかい1音」。
   ============================================================ */
(function(){
  /* ★2026-07-28 音が出たり出なかったりした原因
     ①音の装置(AudioContext)を「ナビを最初に押したとき」に作っていた。
       iPhoneでは作った直後は停止状態で、動き出すまでに少し時間がかかるため、
       その1回目の音が鳴らないことがあった。
     ②画面移動が0.09秒後に始まるので、音が長いと途中で切れていた。
     → 装置は「画面のどこかを最初に触った時点」で作って動かしておく。
       音は0.07秒に短くして、移動が始まる前に鳴り終わるようにする。 */
  let AC=null, last=0;
  function make(){
    if(AC)return AC;
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    try{ AC=new C(); }catch(_){ return null; }
    /* 無音を1粒だけ鳴らして、iPhoneの音の仕組みを起こしておく */
    try{ const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
         s.buffer=b; s.connect(AC.destination); s.start(0); }catch(_){}
    return AC;
  }
  function unlock(){ const c=make(); if(c && c.state==='suspended'){ try{c.resume();}catch(_){} } }
  addEventListener('pointerdown',unlock,{passive:true,capture:true});
  addEventListener('touchstart',unlock,{passive:true,capture:true});
  /* 画面が戻ってきたときは、止まっている音の装置を起こし直す
     （iPhoneは他のアプリに切り替えると止めることがある） */
  function wake(){ const c=AC; if(c && c.state!=='running'){ try{c.resume();}catch(_){} } }
  addEventListener('pageshow', wake);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) wake(); });

  /* 実際に音を出す部分。ここは「装置が動いている」ときだけ呼ぶ */
  function beep(c){
    const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t);        /* ラの音・単純でやわらかい */
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.38,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.07);
  }

  /* ★2026-07-31 「鳴ったり鳴らなかったり」の直し方
     iPhoneは、ページを開いた直後の音の装置が「止まった状態」で始まる。
     動き出す（resume）のは少し後なので、押してすぐ画面が変わると
     音が鳴る前に前のページが消えてしまう＝無音になっていた。
     そこで
       ・鳴らせたかどうかを返す（true＝すぐ鳴った）
       ・すぐ鳴らせなかったときは、動き出したら鳴らす（nnSoundReady で待てる）
     ようにして、ナビ側が「音が出るのを待ってから画面を移る」ようにした。 */
  window.nnSoundReady=null;
  window.nnMoveSound=function(){
    const now=Date.now(); if(now-last<160)return true; last=now;   /* 連続再生を抑える */
    try{
      const c=make(); if(!c)return true;
      if(c.state==='running'){ beep(c); return true; }
      /* まだ動いていない：起こしてから鳴らす。ナビ側はこれを待てる */
      window.nnSoundReady=new Promise(function(res){
        let done=false;
        const fire=function(){ if(done)return; done=true; try{ beep(c); }catch(_){} res(); };
        try{ const p=c.resume(); if(p&&p.then) p.then(fire, fire); else fire(); }catch(_){ fire(); }
        setTimeout(fire, 120);      /* 起きなくても待たせすぎない */
      });
      return false;
    }catch(_){ return true; }
  };
})();
</script>
<script>
/* ============ ナビ：指を触れたまま移動できる操作（2026-07-28 改） ============
   ・指を置いた瞬間にアイコンが光って音が鳴る
   ・そのまま 0.09秒 指が止まっていれば、離すのを待たずに移動する（＝速い）
   ・押したまま横へなぞると指の下のアイコンが反応し、離した先へ移動する
   ・アイコンの外で離せば移動しない（やめられる）
   ============================================================ */
(function(){
  const nav=document.getElementById('nav')||document.querySelector('nav');
  if(!nav)return;
  let dragging=false, cur=null;
  const itemAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('nav .ni'):null; };
  let lastSnd=0;
  function focus(ni){
    if(ni===cur)return;
    if(!ni)return;                     /* アイコンの隙間に指がかかっても、直前の選択を保つ
                                          （指のわずかな揺れで音が連発するのを防ぐ） */
    if(cur)cur.classList.remove('press');
    cur=ni; cur.classList.add('press');
    /* 音を鳴らす。すぐ鳴らせなかったときは、移動を少しだけ待つ（下の go を参照） */
    sndNow=true;
    if(window.nnMoveSound)try{ sndNow=(nnMoveSound()!==false); }catch(_){}
    /* ★先読みの fetch は削除（2026-07-28）。移動処理と取り合って遅くなっていた。 */
  }
  /* ★ここが「遅い」の正体だった（2026-07-28 画面録画の実測で判明）
     以前は「指を離したとき」に初めて移動していた。画面録画を1コマずつ調べると、
     アイコンが光ってから画面が変わるまで約0.9秒、その間まったく何も起きていない。
     ＝ページの読み込みが遅いのではなく、指を離すまで移動を始めていなかった。
     そこで「指を置いて 0.09秒たっても動かさなければ、離すのを待たずに移動する」
     方式にした。なぞって選び直したい場合（指を動かした場合）は今までどおり、
     指を離した先のアイコンへ移動する。 */
  const HOLD_MS=90;          /* この時間だけ指が止まっていたら、離すのを待たずに移動 */
  const MOVE_PX=10;          /* この距離より動いたら「なぞり操作」とみなす */
  let goTm=0, downPt=null, gone=false;
  let sndNow=true;
  function go(t){
    if(gone)return;
    if(!t||t.classList.contains('on'))return;
    const m=(t.getAttribute('onclick')||'').match(/navGo\('([^']*)'\s*,\s*'([^']*)'\)/);
    if(!(m&&typeof navGo==='function'))return;
    gone=true;
    /* ★音がすぐ鳴ったときは今までどおり即移動（速さは変えない）。
       鳴らなかったときだけ、音が出るのを最大0.16秒待ってから移動する。 */
    if(sndNow || !window.nnSoundReady){ navGo(m[1],m[2]); return; }
    let moved=false;
    const jump=function(){ if(moved)return; moved=true; navGo(m[1],m[2]); };
    try{ window.nnSoundReady.then(function(){ setTimeout(jump, 30); }); }catch(_){}
    setTimeout(jump, 160);
  }
  function cancelHold(){ if(goTm){clearTimeout(goTm); goTm=0;} }
  nav.addEventListener('pointerdown',e=>{
    const ni=e.target.closest&&e.target.closest('.ni'); if(!ni)return;
    dragging=true; cur=null; gone=false; downPt=[e.clientX,e.clientY]; focus(ni);
    try{nav.setPointerCapture(e.pointerId);}catch(_){}
    cancelHold();
    goTm=setTimeout(()=>{ goTm=0; go(cur); }, HOLD_MS);
  });
  nav.addEventListener('pointermove',e=>{
    if(!dragging)return;
    if(downPt && Math.abs(e.clientX-downPt[0])+Math.abs(e.clientY-downPt[1])>MOVE_PX) cancelHold();
    focus(itemAt(e.clientX,e.clientY));
  });
  function finish(e){
    if(!dragging)return;
    dragging=false; cancelHold();
    const t=cur; if(cur){cur.classList.remove('press'); cur=null;}
    go(t);
  }
  nav.addEventListener('pointerup',finish);
  nav.addEventListener('pointercancel',()=>{dragging=false; cancelHold(); if(cur){cur.classList.remove('press'); cur=null;}});
  /* 上の処理で移動するので、通常のクリックは止める（二重に移動しないように） */
  nav.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); },true);
})();
</script>

   iPhoneをたてに持つと、この値が実際に見えている高さより小さくなり、
   画面の下のほうに、何も置かれない帯（すき間）ができていた。
   下の script で「実際に見えている高さ」を測って --nnvh に入れ、
   それをアプリの高さに使う。
   ※ズレが無いときは今までと同じ値になるので、見た目は変わらない。

<script id="nn-fillh-js">
/* ============================================================
   画面のいちばん下まで使い切る（2026-07-29）
   ・--nnvh ＝ 実際に見えている画面の高さ
   ・表示中の画面（一覧・ダッシュボード等）の下に余りがあれば、そのぶん伸ばす
   　（すき間があるときだけ動くので、余りが無ければ何もしない）
   ============================================================ */
(function(){
  var VIEWS = null;
  /* ホーム画面のアイコンから起動しているか（＝全画面のアプリとして開いているか） */
  function isStandalone(){
    try{
      if(navigator.standalone === true) return true;
      return matchMedia('(display-mode: standalone)').matches
          || matchMedia('(display-mode: fullscreen)').matches;
    }catch(e){ return false; }
  }
  /* 画面のいちばん下に貼っておく、見えない1pxの目印。
     ★iPhoneをたてに持つと、端末が申告してくる「画面の高さ」が
       実際に見えている高さより小さいことがある（このページのように
       画面を縮めて表示していると起きる）。その申告値をそのまま使うと、
       画面の下のほうに何も置かれない帯（すき間）が残ってしまう。
       目印は画面の下端に貼り付いているので、その位置を測れば
       「本当の下端」が分かる。 */
  var probe = null;
  function probeBottom(){
    if(!probe || !probe.parentNode){
      probe = document.createElement('div');
      probe.id = 'nnBtmProbe';
      probe.setAttribute('style','position:fixed;left:0;bottom:0;width:1px;height:1px;'
        + 'pointer-events:none;opacity:0;z-index:-1;');
      (document.body || document.documentElement).appendChild(probe);
    }
    return probe.getBoundingClientRect().bottom;
  }
  function pageH(){
    var vv = window.visualViewport;
    var h = innerHeight;
    /* 文字入力でキーボードが出ると visualViewport は小さくなるので、大きいほうを採る */
    if(vv && vv.height > h) h = vv.height;
    /* 目印のほうが下にあれば、そちらが本当の下端。
       ブラウザで開いているときは下のバーの分だけ縮むのが正しいので、この直しは
       ホーム画面から起動したときだけ効かせる。あり得ない大きさは念のため採らない。 */
    if(isStandalone()){
      var t = probeBottom();
      if(t > h + 1 && t < h * 3) h = t;
    }
    return Math.round(h);
  }
  function fill(){
    /* ★2026-08-11a パソコンで表示倍率（zoom）をかけているときは、
       innerHeight（実画面のpx）をそのまま使うと body の高さが倍率ぶん大きくなる。
       倍率で割って「CSSのpx」に直す。 */
    var _z = window.nnPZ || 1;
    var pb = pageH() / _z;
    document.documentElement.style.setProperty('--nnvh', pb + 'px');
    if(_z !== 1){                      /* 倍率をかけているときは下の余白うめをしない（パソコン用） */
      if(VIEWS) VIEWS.forEach(function(id){ var e=document.getElementById(id); if(e) e.style.minHeight=''; });
      return;
    }
    if(!VIEWS) return;
    var v = null;
    for(var i=0;i<VIEWS.length;i++){
      var e = document.getElementById(VIEWS[i]);
      if(e && e.offsetParent !== null){ v = e; break; }
    }
    if(!v) return;
    /* 下部ナビが場所を取っている高さ（自動で隠れているときは 0） */
    var navOcc = 0;
    var nav = document.getElementById('nav');
    if(nav){
      var ns = getComputedStyle(nav);
      if(ns.display !== 'none' && ns.position !== 'fixed' && ns.position !== 'absolute'){
        var mb = parseFloat(nav.style.marginBottom || '0') || 0;   /* 隠れているときは負の値 */
        navOcc = Math.max(0, nav.offsetHeight + mb);
      }
    }
    if(v.style.minHeight) v.style.minHeight = '';      /* いったん元に戻して測る */
    var r = v.getBoundingClientRect();
    var gap = (pb - navOcc) - r.bottom;                 /* 下に余っている高さ */
    if(gap > 2) v.style.minHeight = Math.round(r.height + gap) + 'px';
  }
  fill();
  addEventListener('load', fill);
  addEventListener('resize', fill);
  addEventListener('orientationchange', function(){ setTimeout(fill, 300); });
  setInterval(fill, 800);        /* ナビの自動開閉・画面の切替に追従する */
  window.nnFillBottom = fill;
})();
</script>

<script id="nn-hdr-std-js">
/* 倍率 --nnhm を計算して渡す（＝そのページの組み立て幅 ÷ 980） */
(function(){
  function set(){
    try{
      /* ★パソコンでは倍率1（＝今までどおり）にすること。
         パソコンのブラウザは viewport の width=980 指定を無視するため、
         画面を縮めて表示していない。ここで innerWidth/980 を掛けると
         ヘッダーだけ1.5倍に膨らんでしまう。 */
      var dev = Math.min(screen.width || 0, screen.height || 0);
      var phone = dev && dev < 700;
      var m = phone ? ((innerWidth || 980) / 980) : 1;
      if(!(m > 0.05 && m < 4)) m = 1;              /* あり得ない値は採らない */
      document.documentElement.style.setProperty('--nnhm', m.toFixed(4));
      /* ノッチの逃げの割り増し（＝そのページの縮小率の逆数）。
         いま向いている方の画面の幅で計算すること。 */
      var pr = true;
      try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = innerHeight > innerWidth; }
      var scr = pr ? Math.min(screen.width||0, screen.height||0) : Math.max(screen.width||0, screen.height||0);
      var saf = (phone && scr > 0) ? ((innerWidth || scr) / scr) : 1;
      if(!(saf > 0.5 && saf < 5)) saf = 1;
      document.documentElement.style.setProperty('--nnsaf', saf.toFixed(4));
    }catch(e){}
  }
  set();
  addEventListener('resize', set);
  addEventListener('orientationchange', function(){ setTimeout(set, 300); });
  addEventListener('load', set, {once:true});
})();
</script>

<script id="nn-pczoom-js">
(function(){
  if(document.documentElement.getAttribute('data-nnphone')==='1'){ window.nnPZ=1; return; }
  var BASE=1600, MINZ=1.00, MAXZ=1.60;
  function autoZ(){
    var z=(window.innerWidth||1600)/BASE;
    z=Math.round(z*20)/20;                       /* 0.05きざみ */
    return Math.min(MAXZ, Math.max(MINZ, z));
  }
  function apply(){
    var z=autoZ();
    window.nnPZ=z;
    document.documentElement.style.zoom = (z===1 ? '' : z);
    document.documentElement.style.setProperty('--nnpzr', z);
    document.documentElement.setAttribute('data-nnpz', z===1 ? 'off' : 'on');
    try{ if(window.nnFillBottom) window.nnFillBottom(); }catch(e){}
    try{ if(window.nnFitMapApp) window.nnFitMapApp(); }catch(e){}
    try{ if(window.nnSecRefresh) window.nnSecRefresh(); }catch(e){}

<script id="nn-httl-js">
/* 見出しの文字だけを span.httl で包む。
   ★右端に置く補助の文字（.r／.cta など）は包まない＝タグの外に残す。
   ★中身を作り直すページ（国交省仕様・ライブラリ等）があるので、
     作り直されたら包み直す（MutationObserver・0.2秒のまとめ）。 */
(function(){
  var SEL='.panel > h4, .wr-box > h4, .dpanel > h4, .proc-card > h4, .notebox-h > h4';
  var STOP=/(^|\s)(r|cta|zx|colgear|sub|hcount|tag)(\s|$)/;
  function wrap(h){
    if(h.getAttribute('data-nnht')==='1') return;
    if(h.querySelector('.httl')){ h.setAttribute('data-nnht','1'); return; }
    var kids=[].slice.call(h.childNodes);
    var sp=document.createElement('span'); sp.className='httl';
    for(var i=0;i<kids.length;i++){
      var n=kids[i];
      if(n.nodeType===1 && STOP.test(' '+String(n.className||'')+' ')) break;
      sp.appendChild(n);
    }
    if(!String(sp.textContent||'').trim()){        /* 包むものが無いときは何もしない */
      while(sp.firstChild) h.insertBefore(sp.firstChild, h.firstChild);
      return;
    }
    h.insertBefore(sp, h.firstChild);
    h.setAttribute('data-nnht','1');
  }
  function run(){ try{ [].forEach.call(document.querySelectorAll(SEL), wrap); }catch(e){} }
  if(document.readyState==='loading') addEventListener('DOMContentLoaded',run); else run();
  addEventListener('load',function(){ setTimeout(run,200); });
  try{
    var t=null;
    new MutationObserver(function(){ if(t)return; t=setTimeout(function(){ t=null; run(); },200); })
      .observe(document.body,{childList:true,subtree:true});
  }catch(e){}
})();
</script>

function show(){ pad.classList.add('open'); }
function hide(){ pad.classList.remove('open');
  if(target){ target.classList.remove('nnpad-target'); target=null; } }
function setVal(){ document.getElementById('nnPadVal').textContent = buf===''?'0':Number(buf).toLocaleString('ja-JP'); }
function commit(){
  if(!target) return;
  target.value = buf===''?'':buf;
  target.dispatchEvent(new Event('change'));   /* edLine が走って再計算・再描画される */
}
function labelOf(inp){
  const tr=inp.closest('tr');
  const nm=tr?tr.querySelector('.nm'):null;
  const kind=inp.classList.contains('qty')?'数量':'単価';
  return (nm?nm.textContent.trim().split('\n')[0].slice(0,14):'')+'　'+kind;
}
function openFor(inp){
  if(!pad) build();
  if(target) target.classList.remove('nnpad-target');
  target=inp; target.classList.add('nnpad-target');
  buf=String(inp.value||'').replace(/[^0-9]/g,'');
  document.getElementById('nnPadLb').textContent=labelOf(inp);
  setVal(); show();
  /* 対象行が見えるようにスクロール（パッドの裏に隠れないように） */
  try{ inp.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){}
}
function key(k){
  if(k==='ok'){ commit(); hide(); return; }
  if(k==='next'){
    /* ★commit すると再描画で DOM が作り直されるので、位置は先に控えておく（§87の教訓と同じ） */
    const cls=target.classList.contains('qty')?'.qty':'.uprice';
    const idx=[...document.querySelectorAll('#content input'+cls)].indexOf(target);
    commit();
    setTimeout(()=>{ const all=[...document.querySelectorAll('#content input'+cls)];
      const t=all[idx+1]; if(t) openFor(t); else hide(); },60);
    return; }
  if(k==='bs'){ buf=buf.slice(0,-1); }
  else if(k==='c'){ buf=''; }
  else{ if(buf.length<8) buf+=k; buf=buf.replace(/^0+(?=\d)/,''); }
  setVal();
}
/* 数量・単価の入力欄：タップでパッドを開く。preventDefault でフォーカスを止め、
   iOSのキーボードを出さない（§89：pointerdown の preventDefault はフォーカス移動を止める） */
document.addEventListener('pointerdown',e=>{
  const inp=e.target.closest && e.target.closest('#content input.qty, #content input.uprice');
  if(!inp) return;
  e.preventDefault(); e.stopPropagation();
  openFor(inp);
},true);
/* パッドの外（入力欄でもない所）を押したら閉じる */
document.addEventListener('pointerdown',e=>{
  if(!pad || !pad.classList.contains('open')) return;
  if(pad.contains(e.target)) return;
  if(e.target.closest && e.target.closest('#content input.qty, #content input.uprice')) return;
  commit(); hide();
},false);
})();
</script>

<script id="nn-trail-js">
/* ============================================================
   指をなぞると光がついてくる（2026-08-19b・本人の指示）
   線を引く・頂点をつまむ等の細かい操作で「いま指がどこにあるか」が分かるようにする。
   ・画面いっぱいの透明なキャンバスを1枚だけ用意し、指が触れている間だけ描く
   ・座標は clientX/Y をそのまま「画面の実px」として使う（表示倍率 zoom の影響を受けない）
   ・pointer-events:none なので、下のボタンや作図の邪魔は一切しない
   ============================================================ */
(function(){
"use strict";
var cv=null, ctx=null, pts=[], raf=null, active=false, lastT=0;
var LIFE=420;                     /* 光が消えるまで(ms) */
function make(){
  if(cv)return;
  cv=document.createElement('canvas');
  cv.id='nnTrail';
  cv.style.cssText='position:fixed; left:0; top:0; width:100%; height:100%;'
    +'pointer-events:none; z-index:9997;';
  document.body.appendChild(cv);
  ctx=cv.getContext('2d');
}
function fit(){
  var r=cv.getBoundingClientRect();
  var d=Math.min(2, window.devicePixelRatio||1);
  var w=Math.round(r.width*d), h=Math.round(r.height*d);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  return {r:r, k:cv.width/(r.width||1)};   /* k＝画面px→キャンバスpxの倍率（＝dpr） */
}
function draw(){
  if(!cv){ raf=null; return; }
  var g=fit(), k=g.k, now=performance.now();
  ctx.clearRect(0,0,cv.width,cv.height);
  /* 寿命の切れた点を落とす */
  while(pts.length && now-pts[0].t>LIFE) pts.shift();
  if(pts.length>=2){
    /* しっぽ：新しいほど太く明るい */
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var age=(now-b.t)/LIFE; if(age<0)age=0; if(age>1)age=1;
      var al=(1-age)*0.85;
      ctx.strokeStyle='rgba(255,217,77,'+al.toFixed(3)+')';
      ctx.lineWidth=(2.5+6*(1-age))*k;
      ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.shadowColor='rgba(255,180,40,'+(al*0.9).toFixed(3)+')';
      ctx.shadowBlur=9*k*(1-age);
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
    }
    ctx.shadowBlur=0;
  }
  /* 指の先の光 */
  if(active && pts.length){
    var p=pts[pts.length-1];
    var gr=ctx.createRadialGradient(p.x*k,p.y*k,0, p.x*k,p.y*k,9*k);
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.45,'rgba(255,217,77,.80)');
    gr.addColorStop(1,'rgba(255,157,30,0)');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(p.x*k,p.y*k,9*k,0,7); ctx.fill();
  }
  if(active || pts.length){ raf=requestAnimationFrame(draw); }
  else { raf=null; ctx.clearRect(0,0,cv.width,cv.height); }
}
function add(e){
  var now=performance.now();
  if(now-lastT<8) return;          /* 詰めすぎない */
  lastT=now;
  pts.push({x:e.clientX, y:e.clientY, t:now});
  if(pts.length>90) pts.shift();
  if(!raf) raf=requestAnimationFrame(draw);
}
addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse' && e.buttons===0) return;
  make(); active=true; pts.length=0; add(e);
},true);
addEventListener('pointermove',function(e){
  if(!active)return;
  add(e);
},true);
function end(){ active=false; if(!raf&&cv) raf=requestAnimationFrame(draw); }
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  addEventListener(ev,end,true);
});
})();
</script>

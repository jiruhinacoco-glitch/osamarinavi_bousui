<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>納まりナビ – 用語集</title>
<link rel="stylesheet" href="common.css">
<style>
/* ============================================================
   納まりナビ 用語集
   新人・事務・手間請け若手向け：定義＋「現場ではこう使う」
   デザイン言語は各デモと共通（緑ヘッダー／下部ナビ）
   ============================================================ */
:root{
  /* 共通カラーパレットは common.css に移動（--green-deep 等） */
  /* ゲーム風ヘッダー/ナビ用（zairyo基準） */
  --green-hi:#48c274; --green-edge:#124a28;
  --yellow:#ffd94d; --yellow-deep:#f0b400; --warn-deep:#b0392f;
  --stroke-g: 0 1px 1px rgba(18,74,40,.55);
  --profit:#0a6bd6; --warn:#b0392f; --gold:#8a7a2a;
  --radius:10px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); height:100vh; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
header{padding-top:calc(5px + env(safe-area-inset-top)) !important;}
header{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
    linear-gradient(180deg, var(--green-hi), var(--green) 55%, var(--green-deep));
  color:#fff; display:flex; align-items:center; gap:10px; padding:5px 13px; flex:none;
  border-bottom:2px solid var(--green-edge);
  box-shadow:0 2px 0 rgba(0,0,0,.08);
  position:relative; z-index:20;
}
header .hicon{font-size:19px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));}
header h1{
  font-size:17px; font-weight:900; letter-spacing:.04em;
  text-shadow:var(--stroke-g);
}
header .count{margin-left:auto; font-size:12.5px; font-weight:700; white-space:nowrap; text-shadow:0 1px 0 rgba(0,0,0,.3);}
/* ---------- 検索 ---------- */
.searchbar{padding:10px 14px 8px; background:var(--paper); flex:none;}
.searchbar .box{
  display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--line);
  border-radius:10px; padding:4px 6px 4px 12px; max-width:720px; margin:0 auto;
}
.searchbar .box:focus-within{border-color:var(--green);}
.searchbar input{flex:1; border:0; outline:none; font-size:15px; padding:8px 0; background:none; min-width:60px;}
.searchbar .clr{border:0; background:none; font-size:15px; color:var(--ink-sub); cursor:pointer; padding:6px 8px;}
/* ---------- 分類チップ＋五十音 ---------- */
.catbar{display:flex; gap:6px; padding:0 14px 7px; background:var(--paper); flex:none; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; align-items:center;}
.catbar::-webkit-scrollbar{display:none;}
.catbar .ct{flex:none; border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:6px 14px; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap; color:var(--ink-sub);}
.catbar .ct.on{background:var(--green); border-color:var(--green-deep); color:#fff;}
.catbar .ct.star{color:var(--gold);}
.catbar .ct.star.on{background:var(--gold); border-color:#6e6222; color:#fff;}
.kanabar{display:flex; gap:4px; padding:0 14px 9px; background:var(--paper); flex:none; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.kanabar::-webkit-scrollbar{display:none;}
.kanabar button{flex:none; min-width:38px; border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 4px; font-size:13px; font-weight:800; cursor:pointer; color:var(--ink-sub);}
.kanabar button.on{background:var(--green-deep); border-color:var(--green-deep); color:#fff;}
/* ---------- 本体 ---------- */
main{flex:1; overflow-y:auto; background:#f7f8f5; border-top:1px solid var(--line); -webkit-overflow-scrolling:touch;}
.wrap{max-width:760px; margin:0 auto; padding:10px 12px 100px;}
.result-note{font-size:12.5px; color:var(--ink-sub); font-weight:700; margin:2px 2px 10px; line-height:1.7;}
.ghead{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px;
  background:#e4ebe2; color:var(--green-deep); font-weight:800; font-size:13px;
  padding:6px 14px; border-bottom:1px solid var(--line); letter-spacing:.1em; border-radius:6px; margin:10px 0 6px;
}
.ghead small{margin-left:auto; color:var(--ink-sub); font-weight:700; letter-spacing:0;}
/* ---------- 用語行（アコーディオン） ---------- */
.trow{background:#fff; border:1px solid var(--line); border-radius:9px; margin-bottom:7px; overflow:hidden;}
.trow .head{display:flex; align-items:center; gap:9px; padding:11px 12px; cursor:pointer;}
.trow .head:hover{background:#f2f8f4;}
.trow .term{font-weight:800; font-size:15px;}
.trow .yomi{font-size:11.5px; color:var(--ink-sub); font-weight:700;}
.tag{display:inline-block; border-radius:4px; padding:2px 8px; font-size:10.5px; font-weight:800; white-space:nowrap;}
.tag.c1{background:var(--green-lite); color:var(--green-deep); border:1px solid #b8dcc4;}
.tag.c2{background:#e7f0fb; color:var(--profit); border:1px solid #b9d3f0;}
.tag.c3{background:#fdeee0; color:#8a4a12; border:1px solid #e8c090;}
.tag.c4{background:#eef0ea; color:var(--ink-sub); border:1px solid var(--line);}
.tag.c5{background:#f3edda; color:var(--gold); border:1px solid #dcd0a0;}
.trow .star{margin-left:auto; font-size:17px; cursor:pointer; color:#c9cec6; flex:none; padding:0 2px;}
.trow .star.on{color:#e0b428;}
.trow .caret{color:var(--ink-sub); font-size:11px; flex:none; transition:transform .15s;}
.trow.open .caret{transform:rotate(90deg);}
.trow .body{display:none; padding:0 14px 13px; border-top:1px dashed var(--line);}
.trow.open .body{display:block;}
.trow .def{font-size:14px; line-height:1.85; padding-top:11px;}
.usage{
  margin-top:10px; background:#f4f8f5; border-left:4px solid var(--green); border-radius:0 7px 7px 0;
  padding:9px 12px; font-size:13px; line-height:1.8;
}
.usage b{font-size:11px; color:var(--green-deep); display:block; letter-spacing:.05em; margin-bottom:2px;}
.warnbox{
  margin-top:9px; background:#fdf6f5; border-left:4px solid var(--warn); border-radius:0 7px 7px 0;
  padding:9px 12px; font-size:13px; line-height:1.8;
}
.warnbox b{font-size:11px; color:var(--warn); display:block; letter-spacing:.05em; margin-bottom:2px;}
.rel{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.rel .rl{font-size:11px; font-weight:800; color:var(--ink-sub);}
.rel .rt{background:#fff; border:1.5px solid var(--green); color:var(--green-deep); border-radius:13px; padding:4px 12px; font-size:12px; font-weight:800; cursor:pointer;}
.rel .rt:hover{background:var(--green-lite);}
.rel .pg{background:#f3edda; border:1.5px solid #dcd0a0; color:var(--gold); border-radius:13px; padding:4px 12px; font-size:12px; font-weight:800; cursor:pointer;}
.empty{padding:40px 16px; text-align:center; color:var(--ink-sub); font-size:14px; line-height:2;}
/* ---------- トースト ---------- */
#toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(20px);
  background:#202623; color:#fff; padding:11px 20px; border-radius:9px; font-size:14px; font-weight:700;
  opacity:0; pointer-events:none; transition:.25s; z-index:99; max-width:90vw; text-align:center; line-height:1.6;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
/* ---------- 下部ナビ ---------- */
nav{
  flex:none;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,#1f5c36,#153f25);
  display:flex; gap:3px; padding:4px 7px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:calc(4px + env(safe-area-inset-bottom));
  border-top:2px solid #0d2a18;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
}
nav::-webkit-scrollbar{display:none;}
nav .ni{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfe6d6;
  font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;
  transition:transform .06s;
}
nav .ni .ic{font-size:19px; line-height:1; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));}
nav .ni:hover{background:rgba(255,255,255,.10);}
nav .ni:active{transform:translateY(1px);}
nav .ni.on{
  background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));
  color:#4d3a00; border:1.5px solid #a87f00;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #7d5f00;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
/* ---------- タップ演出（shiyo_toroku基準：タッチ発光） ---------- */
@keyframes tapfx-glow{
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
  60%{opacity:.7;}
  100%{opacity:0; transform:translate(-50%,-50%) scale(2.1);}
}
@keyframes tapfx-ring{
  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.8);}
}
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);
  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .3s ease-out forwards;
}
.tapfx::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:2px solid rgba(255,217,77,.9);
  animation:tapfx-ring .3s ease-out forwards;
}
@media (max-width:640px){
  :root{font-size:14px;}
  header h1{font-size:18px;}
  .wrap{padding:8px 8px 100px;}
  nav .ni{padding:4px 8px; font-size:10px; gap:1px;}
  nav .ni .ic{font-size:19px;}
  nav .ni .ic img{height:18px !important;}
}
</style>
</head>
<body>

<header>
  <span class="hicon"><img src="./icons/logo.png" alt="" style="height:28px;vertical-align:middle" onerror="this.parentElement.textContent=ICONS.header"></span>
  <h1>用語集</h1>
  <span class="count" id="hcount"></span>
</header>

<div class="searchbar">
  <div class="box">🔍
    <input id="q" placeholder="用語・読み・意味から検索（例：ふくれ、にんく、X-1）" oninput="render()">
    <button class="clr" onclick="document.getElementById('q').value='';render()">✕</button>
  </div>
</div>

<div class="catbar" id="catbar"></div>
<div class="kanabar" id="kanabar"></div>

<main><div class="wrap" id="content"></div></main>

<div id="toast"></div>
<nav id="nav"></nav>

<script>
/* ================= 下部ナビ（各デモページと共通） ================= */
const NAV=[['home','ホーム'],['kiroku','現場記録帳'],['map','現場マップ'],['hacchu','発注'],['kokkou','国交省仕様'],['camera','カメラ'],
           ['library','ライブラリ'],['zumen','図面/積算'],['shiyou','仕様・材料'],['yougo','用語集'],['settei','設定']];
const NAV_LINKS={kiroku:'./kirokucho_demo.html', map:'./genba_map_v36.html', hacchu:'./hacchu.html', kokkou:'./kokkosho.html',
                 camera:'./camera.html', library:'./library.html', yougo:'./yougo.html',
                 zairyo:'./zairyo_toroku.html', shiyou:'./shiyo_toroku.html'};
const NAV_ACTIVE='yougo';
const ICONS={header:'🔤', home:'🏠', kiroku:'📋', map:'🗺️', hacchu:'📝', kokkou:'📗', camera:'📷',
  library:'📁', zumen:'📐', zairyo:'🧱', shiyou:'📚', yougo:'📖', settei:'⚙️'};
function navGo(k,label){
  if(k===NAV_ACTIVE)return;
  if(NAV_LINKS[k]){ location.href=encodeURI(NAV_LINKS[k]); }
  else alert('「'+label+'」は準備中です');
}
function buildNav(){
  const n=document.getElementById('nav');
  n.innerHTML=NAV.map(([k,l])=>{
    const suf=(k===NAV_ACTIVE)?'_on':'';
    return `<div class="ni ${k===NAV_ACTIVE?'on':''}" onclick="navGo('${k}','${l}')">
      <span class="ic"><img src="./icons/nav_${k}${suf}.png" alt="${l}"
        onload="this.closest('.ni').classList.add('hasimg')"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='./icons/nav_${k}.png';}
                 else{this.outerHTML=ICONS['${k}']||'▫️';}"></span><span>${l}</span></div>`;
  }).join('');
  /* あふれ時：アクティブなボタンを中央に */
  const on=n.querySelector('.ni.on');
  if(on && n.scrollWidth>n.clientWidth){
    const d=on.getBoundingClientRect().left-n.getBoundingClientRect().left;
    n.scrollLeft+=d-(n.clientWidth-on.offsetWidth)/2;
  }
}
buildNav();

/* ---------- タップ演出（shiyo_toroku基準：発光＋タップ音） ---------- */
(function(){
  /* ---------- ゲーム風タップ音（Web Audio合成・音源ファイル不要） ---------- */
  let AC=null;
  function ctx(){
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  function tapSound(){
    try{
      const c=ctx(), t=c.currentTime;
      // 明るい「ピコッ」：矩形波の短い上昇ブリップ
      const o=c.createOscillator(), g=c.createGain();
      o.type='square';
      o.frequency.setValueAtTime(620,t);
      o.frequency.exponentialRampToValueAtTime(1040,t+0.035);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.16,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.10);
      // 下支えの「ポッ」：サイン波の短い下降
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(300,t);
      o2.frequency.exponentialRampToValueAtTime(170,t+0.055);
      g2.gain.setValueAtTime(0.10,t);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
      o2.connect(g2).connect(c.destination);
      o2.start(t); o2.stop(t+0.08);
    }catch(e){}
  }

  /* ---------- タッチ発光 ---------- */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    el.style.left=x+'px'; el.style.top=y+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 340);
  }

  /* ---------- イベント委譲 ----------
     発光＝画面のどこを触っても出す（触った場所のフィードバック）
     音　＝押せる要素（ボタン・ナビ・チップ・行）に当たったときだけ鳴らす */
  const PRESSABLE='button, .ni, .chip>button, .mk, .mrow, .tabs button, #viewtabs button, .btn-ok, .btn-ghost, .sortbtn, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    const hit=e.target.closest(PRESSABLE);
    if(hit && !hit.disabled && !hit.classList.contains('soon')){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2600);}

/* ================= 分類 ================= */
const CATS=[
 {id:'bui', nm:'部位', cls:'c1'},
 {id:'kou', nm:'工法・材料', cls:'c2'},
 {id:'sekou', nm:'施工・現場', cls:'c3'},
 {id:'shiyou', nm:'仕様・図面', cls:'c4'},
 {id:'shou', nm:'商習慣・関係者', cls:'c5'},
];
const catCls=id=>(CATS.find(c=>c.id===id)||{}).cls||'c4';
const catNm=id=>(CATS.find(c=>c.id===id)||{}).nm||'';

/* ================= 用語データ =================
   t:用語 y:読み c:分類 d:定義 u:現場ではこう使う w:⚠注意(任意) r:関連語 pg:関連ページ(任意) */
const TERMS=[
/* ---- 部位 ---- */
{t:'パラペット', y:'ぱらぺっと', c:'bui',
 d:'屋上やバルコニーの外周に立ち上がった低い壁。防水層の端末を納める最重要部位のひとつ。',
 u:'「パラペットの立上りは何ミリある？端末どこで仕舞う？」',

{t:'立上り', y:'たちあがり', c:'bui',
 d:'平場から垂直に立ち上がる防水施工面。パラペットやハト小屋、架台の側面など。平場より施工難度が高く、漏水リスクも集中する。',
 u:'「立上りは補強布入れて2層で塗って」',
 r:['平場','入隅','端末']},
{t:'平場', y:'ひらば', c:'bui',

{t:'天端', y:'てんば', c:'bui',

 u:'「天端の勾配、内側に向いてるからモルタルで直してから」',
 w:'天端の水勾配が屋上側（内勾配）だと天端に水が乗り続ける。現調で必ず確認。',
 r:['笠木','パラペット']},
{t:'笠木', y:'かさぎ', c:'bui',
 d:'パラペットや手すり壁の天端に被せる仕上げ材（アルミ・スチール・モルタル等）。ジョイント部からの浸水が多い。',
 u:'「笠木のジョイント、オープンジョイントかシールか見てきて」',
 r:['天端','パラペット','シーリング']},
{t:'入隅', y:'いりずみ', c:'bui',
 d:'壁と床など2つの面が内側に折れて交わる凹んだ角。平場と立上りの取合いが代表例。応力が集中しやすく、増張りや面木で補強する。',
 u:'「入隅は増張り一発入れてから本張りして」',
 r:['出隅','面木','増張り']},
{t:'出隅', y:'でずみ', c:'bui',
 d:'2つの面が外側に折れて交わる出っ張った角。シートが浮きやすく、役物処理や補強が必要。',
 u:'「出隅は成形役物使うか、現場加工か決めといて」',

{t:'ドレン', y:'どれん', c:'bui',

{t:'ストレーナー', y:'すとれーなー', c:'bui',

{t:'オーバーフロー管', y:'おーばーふろーかん', c:'bui',

/* ================= 読み→五十音行 ================= */
const ROWS=[['あ','あいうえお'],['か','かきくけこがぎぐげご'],['さ','さしすせそざじずぜぞ'],['た','たちつてとだぢづでど'],
            ['な','なにぬねの'],['は','はひふへほばびぶべぼぱぴぷぺぽ'],['ま','まみむめも'],['や','やゆよ'],
            ['ら','らりるれろ'],['わ','わをん'],['英','']];
function rowOf(y){
  const ch=(y||'').charAt(0);
  for(const [r,chars] of ROWS){ if(chars.includes(ch))return r; }
  return '英';
}
TERMS.forEach(t=>t.row=rowOf(t.y));

/* ================= 永続化：ブックマーク ================= */
let stars={};
try{ stars=JSON.parse(localStorage.getItem('nn_yougo_stars')||'{}'); }catch(e){}
function saveStars(){ localStorage.setItem('nn_yougo_stars',JSON.stringify(stars)); }

/* ================= 状態 ================= */
let curCat=''; let curRow=''; let starOnly=false;
let openTerm=null;

/* ================= バー描画 ================= */
function renderBars(){
  const cb=document.getElementById('catbar');
  cb.innerHTML=`<span class="ct ${!curCat&&!starOnly?'on':''}" onclick="curCat='';starOnly=false;render()">すべて</span>`
    +CATS.map(c=>`<span class="ct ${curCat===c.id?'on':''}" onclick="curCat='${c.id}';starOnly=false;render()">${c.nm}</span>`).join('')
    +`<span class="ct star ${starOnly?'on':''}" onclick="starOnly=!starOnly;render()">★ 覚え中 (${Object.keys(stars).filter(k=>stars[k]).length})</span>`;
  const kb=document.getElementById('kanabar');
  kb.innerHTML=`<button class="${!curRow?'on':''}" onclick="curRow='';render()">全</button>`
    +ROWS.map(([r])=>`<button class="${curRow===r?'on':''}" onclick="curRow='${r}';render()">${r}</button>`).join('');
}

/* ================= 本体描画 ================= */
function filtered(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let list=TERMS.slice();
  if(curCat)list=list.filter(t=>t.c===curCat);
  if(curRow)list=list.filter(t=>t.row===curRow);
  if(starOnly)list=list.filter(t=>stars[t.t]);
  if(q)list=list.filter(t=>(t.t+t.y+t.d+(t.u||'')+(t.r||[]).join('')).toLowerCase().includes(q));
  list.sort((a,b)=>a.y.localeCompare(b.y,'ja'));
  return list;
}
function render(){
  renderBars();
  document.getElementById('hcount').textContent=`全 ${TERMS.length} 語`;
  const c=document.getElementById('content');
  const list=filtered();
  if(!list.length){ c.innerHTML='<div class="empty">該当する用語がありません。<br>検索語や絞り込みを変えてみてください。</div>'; return; }
  /* 行ごとにグループ */
  const groups={};
  list.forEach(t=>{ (groups[t.row]=groups[t.row]||[]).push(t); });
  const rowOrder=ROWS.map(r=>r[0]);
  c.innerHTML=`<div class="result-note">わからない言葉に出会ったら、まずここ。★を付けると「覚え中」で自分だけの復習リストになります。<br>※本実装では、アプリ内のどの画面でも用語を長押しすると、この解説がポップアップします。</div>`
   + rowOrder.filter(r=>groups[r]).map(r=>`
    <div class="ghead">${r}<small>${groups[r].length}語</small></div>
    ${groups[r].map(t=>termRow(t)).join('')}`).join('');
}
function termRow(t){
  const open=openTerm===t.t;
  return `<div class="trow ${open?'open':''}" id="tr-${esc(t.t)}">
    <div class="head" onclick="toggleTerm('${esc(t.t)}')">
      <span class="caret">▶</span>
      <span class="term">${esc(t.t)}</span>
      <span class="yomi">${esc(t.y)}</span>
      <span class="tag ${catCls(t.c)}">${catNm(t.c)}</span>
      <span class="star ${stars[t.t]?'on':''}" onclick="event.stopPropagation();toggleStar('${esc(t.t)}')">★</span>
    </div>
    <div class="body">
      <div class="def">${esc(t.d)}</div>
      ${t.u?`<div class="usage"><b>現場ではこう使う</b>${esc(t.u)}</div>`:''}
      ${t.w?`<div class="warnbox"><b>⚠ 注意</b>${esc(t.w)}</div>`:''}
      ${(t.r&&t.r.length)||t.pg?`<div class="rel">
        ${(t.r&&t.r.length)?`<span class="rl">関連語：</span>${t.r.map(r=>`<span class="rt" onclick="jumpTerm('${esc(r)}')">${esc(r)}</span>`).join('')}`:''}
        ${t.pg?`<span class="pg" onclick="goPage('${t.pg}')">📎 関連ページ：${esc((NAV.find(n=>n[0]===t.pg)||['',''])[1])}</span>`:''}
      </div>`:''}
    </div>
  </div>`;
}
function toggleTerm(t){ openTerm=(openTerm===t)?null:t; render(); scrollToTerm(t); }
function toggleStar(t){ stars[t]=!stars[t]; saveStars(); render(); }
function jumpTerm(name){
  const t=TERMS.find(x=>x.t===name);
  if(!t){ toast(`「${esc(name)}」は独立項目としては未収録です`); return; }
  /* フィルタを解除して開く */
  curCat=''; curRow=''; starOnly=false;
  document.getElementById('q').value='';
  openTerm=name; render(); scrollToTerm(name);
}
function scrollToTerm(name){
  setTimeout(()=>{ const el=document.getElementById('tr-'+name); if(el)el.scrollIntoView({behavior:'smooth',block:'center'}); },60);
}
function goPage(k){
  if(NAV_LINKS[k])location.href=NAV_LINKS[k];
  else toast('このページは別デモ／未実装です');
}

render();
</script>

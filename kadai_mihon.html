<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>役物の見本（基礎・高置架台）｜納まりナビ</title>
<link rel="stylesheet" href="common.css">
<!-- ★2026-11-16k 本人「役物・架台を、形の型をこちらで用意して、ユーザーは寸法を入れるだけで仕上がるように。視覚的にあると理想」→ 高置架台の見本。
     ★2026-11-16m 本人「架台というのは役物（基礎）のこと。高置架台はそれで残して、基礎のタイプをいろんな形状で同じように」
     → 「基礎（役物）」のタブに 角形・丸形・布基礎・L字・コの字・ボルト基礎（小） の6つ。「高置架台」はタブを分けて残した。
     メニューには出さない（見てもらう用）。3Dの部品は図面・積算と同じ vendor/three.min.js（r159・同梱）。数量の数え方は仮（本人に確かめてから本番へ）。 -->
<style>
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:'Zen Kaku Gothic New',sans-serif; background:#f2eedf; color:#243027; display:flex; flex-direction:column;}
header{background:linear-gradient(#3fae68,#1f7a45); border-bottom:3px solid #124a28; padding:8px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
header .back{background:linear-gradient(#5fd17f,#2e9e58); border:2px solid #124a28; color:#fff; font-weight:900; font-size:15px; padding:5px 12px; box-shadow:0 3px 0 #124a28; text-decoration:none;}
header h1{font-size:22px; font-weight:900; color:#fff; letter-spacing:.06em; background:#1c6b3c; padding:3px 20px 3px 14px; transform:skewX(-12deg); border:2px solid #fff; box-shadow:0 3px 0 #0d3b20;}
header h1 span{display:inline-block; transform:skewX(12deg);}
header .tag{background:#ffd45c; color:#5a3b00; font-weight:900; font-size:12px; padding:3px 8px; border:2px solid #8a5a00;}
header .sub{color:#e9ffe9; font-size:13px; font-weight:700;}
main{flex:1; min-height:0; display:grid; grid-template-columns:340px minmax(0,1fr); gap:12px; padding:12px;}
.side{display:flex; flex-direction:column; gap:10px; min-height:0; overflow:auto;}
.box{background:#fff; border:2px solid #1c6b3c; box-shadow:0 3px 0 #124a28;}
.box h2{background:#1c6b3c; color:#fff; font-size:14px; font-weight:900; padding:5px 10px; letter-spacing:.05em;}
.cats{display:grid; grid-template-columns:1fr 1fr; gap:0; border-bottom:2px solid #1c6b3c;}
.cats button{font:inherit; font-size:14px; font-weight:900; padding:7px 4px; border:0; background:#e3e9e2; color:#5b665e;}
.cats button.on{background:#ffd45c; color:#5a3b00;}
.types{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:8px;}
.types button{font:inherit; font-size:12px; font-weight:900; padding:4px 2px 5px; border:2px solid #6b7a70; background:#eef1ec; color:#3f4a42; display:flex; flex-direction:column; align-items:center; gap:2px;}
.types button svg{width:44px; height:30px;}
.types button.on{border-color:#124a28; background:linear-gradient(#5fd17f,#2e9e58); color:#fff; box-shadow:0 3px 0 #124a28;}
.types button.on svg *{stroke:#fff;}
.f{display:grid; grid-template-columns:104px minmax(0,1fr) 68px; align-items:center; gap:6px; padding:7px 10px; border-top:1px solid #dfe5dd;}
.f.first{border-top:0;}
.f label{font-size:13px; font-weight:900; color:#1c6b3c;}
.f input[type=range]{width:100%; accent-color:#2e9e58;}
.f input[type=number]{width:68px; font:inherit; font-size:14px; font-weight:900; text-align:right; padding:3px 4px; border:2px solid #9aa79e;}
.f .u{grid-column:3; font-size:11px; color:#5b665e; text-align:right; margin-top:-4px;}
.f.sel{grid-template-columns:104px minmax(0,1fr);}
.f.sel .opts{display:flex; gap:4px; flex-wrap:wrap; align-items:center;}
.f.sel button{font:inherit; font-size:13px; font-weight:900; padding:4px 9px; border:2px solid #9aa79e; background:#fff; color:#3f4a42;}
.f.sel button.on{border-color:#124a28; background:#2e9e58; color:#fff;}
.f.sel .opts span{font-size:11px; color:#5b665e;}
.qty table{width:100%; border-collapse:collapse; font-size:13px;}
.qty th,.qty td{border-top:1px solid #dfe5dd; padding:6px 10px; text-align:left;}
.qty th{color:#1c6b3c; font-weight:900; width:50%; background:#f2f7f1;}
.qty td{font-weight:900; text-align:right; font-variant-numeric:tabular-nums;}
.qty td b{font-size:17px; color:#c0201a;}
.qty tr.sep th,.qty tr.sep td{border-top:2px solid #1c6b3c;}
.qty .note{font-size:11px; color:#5b665e; padding:6px 10px 8px; line-height:1.5; border-top:1px solid #dfe5dd;}
.view{position:relative; background:#cfd8de; border:2px solid #1c6b3c; box-shadow:0 3px 0 #124a28; min-height:0; overflow:hidden; touch-action:none;}
.view canvas{display:block; width:100%; height:100%;}
.view .hint{position:absolute; left:8px; top:8px; background:rgba(255,255,255,.9); border:2px solid #1c6b3c; font-size:12px; font-weight:700; padding:4px 8px;}
.view .leg{position:absolute; right:8px; top:8px; background:#fff; border:2px solid #1c6b3c; font-size:12px; font-weight:700; padding:5px 8px; display:flex; flex-direction:column; gap:3px;}
.view .leg i{display:inline-block; width:14px; height:10px; margin-right:5px; vertical-align:middle; border:1px solid #333;}
.view .vb{position:absolute; left:8px; bottom:8px; display:flex; gap:6px;}
.view .vb button{font:inherit; font-size:13px; font-weight:900; padding:5px 10px; border:2px solid #124a28; background:#fff; color:#1c6b3c; box-shadow:0 2px 0 #124a28;}
.view .err{position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-weight:900; color:#c0201a; background:#fff;}
.reg #regBtn{display:block; width:calc(100% - 20px); margin:10px; font:inherit; font-size:15px; font-weight:900; color:#fff; padding:9px 6px; border:2px solid #7a3600; background:linear-gradient(#ffb44a,#f07a00); box-shadow:0 3px 0 #7a3600;}
.reg .regmsg{font-size:12px; color:#3f4a42; padding:0 10px 10px; line-height:1.55;}
.reg .regmsg.ok{color:#1c6b3c; font-weight:900;}
.reg .regmsg a{color:#c0201a; font-weight:900;}
/* スマホ・縦長：3Dを上、入力を下 */
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr); grid-template-rows:46vh auto; overflow:auto;}
  .view{order:-1;}
  .side{overflow:visible;}
  header h1{font-size:18px;}
  header .sub{display:none;}
  .view .hint{top:auto; bottom:44px; font-size:11px;}
}
</style>
</head>
<body>
<header>
  <a class="back" href="./zumen_sekisan.html">◀ 戻る</a>
  <h1><span>役物の見本</span></h1>
  <span class="tag">見本</span>
  <span class="sub">型を選んで寸法を入れると、その形と数量がすぐ出ます</span>
</header>
<main>
  <div class="side">
    <div class="box">
      <h2>① 型を選ぶ</h2>
      <div class="cats" id="cats"><button type="button" data-c="kiso" class="on">基礎（役物）</button><button type="button" data-c="kodai">高置架台</button></div>
      <div class="types" id="types"></div>
    </div>
    <div class="box" id="formBox">
      <h2>② 寸法を入れる</h2>
      <div id="form"></div>
    </div>
    <div class="box qty">
      <h2>③ 出てくる数量（自動）</h2>
      <table id="qty"></table>
      <div class="note" id="note"></div>
    </div>
    <div class="box reg">
      <h2>④ 図面・積算で使う</h2>
      <button type="button" id="regBtn">📥 この形を「役物・架台」に登録</button>
      <div class="regmsg" id="regMsg">登録すると、図面・積算の「🔩 役物・架台」に入り、図面に置けば数量と見積に乗ります（単価はあとで ✎ 編集 で入れてください）。</div>
    </div>
  </div>
  <div class="view" id="view">
    <div class="hint">指（マウス）でぐるっと回せます・2本指（ホイール）で拡大</div>
    <div class="leg" id="leg"></div>
    <div class="vb"><button type="button" id="vReset">正面に戻す</button><button type="button" id="vTop">真上から</button></div>
    <div class="err" id="err">3Dを読み込めませんでした（vendor/three.min.js）</div>
  </div>
</main>
<script>
/* ===== 型の一覧（ここに足せば型が増える） ===== */
var ICON={
  kaku:'<svg viewBox="0 0 44 30"><path d="M6 12 L22 6 L38 12 L22 18Z M6 12 V20 L22 26 V18 M38 12 V20 L22 26" fill="none" stroke="#3f4a42" stroke-width="2"/></svg>',
  maru:'<svg viewBox="0 0 44 30"><ellipse cx="22" cy="9" rx="10" ry="4" fill="none" stroke="#3f4a42" stroke-width="2"/><path d="M12 9 V21 A10 4 0 0 0 32 21 V9" fill="none" stroke="#3f4a42" stroke-width="2"/></svg>',
  nuno:'<svg viewBox="0 0 44 30"><path d="M2 14 L30 6 L42 9 L14 17Z M2 14 V19 L14 22 V17 M42 9 V14 L14 22" fill="none" stroke="#3f4a42" stroke-width="2"/></svg>',
  lji:'<svg viewBox="0 0 44 30"><path d="M8 6 H16 V18 H36 V25 H8Z" fill="none" stroke="#3f4a42" stroke-width="2"/></svg>',
  koji:'<svg viewBox="0 0 44 30"><path d="M6 5 H13 V18 H31 V5 H38 V25 H6Z" fill="none" stroke="#3f4a42" stroke-width="2"/></svg>',
  bolt:'<svg viewBox="0 0 44 30"><rect x="5" y="12" width="12" height="10" fill="none" stroke="#3f4a42" stroke-width="2"/><rect x="27" y="12" width="12" height="10" fill="none" stroke="#3f4a42" stroke-width="2"/><path d="M9 12 V6 M13 12 V6 M31 12 V6 M35 12 V6" stroke="#3f4a42" stroke-width="2"/></svg>',
  ago:'<svg viewBox="0 0 44 30"><rect x="4" y="5" width="36" height="6" fill="none" stroke="#3f4a42" stroke-width="2"/><path d="M9 11 V25 H35 V11" fill="none" stroke="#3f4a42" stroke-width="2"/><path d="M9 20 H35" stroke="#3f4a42" stroke-width="1.4" stroke-dasharray="2 2"/></svg>',
  post1:'<svg viewBox="0 0 44 30"><rect x="12" y="15" width="20" height="11" fill="none" stroke="#3f4a42" stroke-width="2"/><path d="M22 15 V2" stroke="#3f4a42" stroke-width="3"/></svg>',
  post2:'<svg viewBox="0 0 44 30"><rect x="5" y="16" width="34" height="10" fill="none" stroke="#3f4a42" stroke-width="2"/><path d="M14 16 V3 H30 V16" fill="none" stroke="#3f4a42" stroke-width="3"/></svg>',
  kodai:'<svg viewBox="0 0 44 30"><path d="M6 10 H38 M6 10 V26 M22 10 V26 M38 10 V26" fill="none" stroke="#3f4a42" stroke-width="2.4"/><rect x="10" y="3" width="24" height="7" fill="none" stroke="#3f4a42" stroke-width="2"/></svg>'
};
var TYPES={
  kiso:[
    {id:'kaku', name:'角形', shape:'rect', d:{W:900, D:600, H:300, wrap:1, up:200, anc:4, n:1, gap:600}},
    {id:'maru', name:'丸形', shape:'circle', d:{R:400, H:300, wrap:1, up:200, anc:0, n:1, gap:600}},
    {id:'nuno', name:'布基礎', shape:'rect', d:{W:3000, D:300, H:300, wrap:1, up:200, anc:0, n:2, gap:900}, rowZ:true},
    {id:'lji',  name:'L字', shape:'L', d:{A:1500, B:1200, T:300, H:300, wrap:1, up:200, anc:0, n:1, gap:600}},
    {id:'koji', name:'コの字', shape:'U', d:{A:1800, B:1200, T:300, H:300, wrap:1, up:200, anc:0, n:1, gap:600}},
    {id:'bolt', name:'ボルト基礎', shape:'rect', d:{W:300, D:300, H:200, wrap:1, up:150, anc:4, n:4, gap:600}},
    /* ★2026-11-16p 本人の現場写真3枚から：①アゴ付きの設備基礎（防水はアゴ下まで・足元に増し貼り） ②支柱1本の基礎 ③支柱2本の基礎（どちらも塗膜で天端まで包む） */
    {id:'ago', name:'アゴ付き', shape:'ago', d:{W:1600, D:1200, H:500, O:80, TC:150, mh:200, ms:150, n:1, gap:600}},
    {id:'post1', name:'支柱基礎', shape:'post', d:{W:350, D:350, H:300, np:1, pd:49, ps:400, n:1, gap:1500}},
    {id:'post2', name:'支柱2本', shape:'post', d:{W:700, D:350, H:250, np:2, pd:49, ps:450, n:1, gap:1500, top:2, TS:30, edge:2, ER:20}}
  ],
  kodai:[ {id:'kodai', name:'鋼製の高置架台', d:{W:1800, D:900, H:400, cols:3, leg:75, up:150, skirt:100, unit:1}} ]
};
var F={  /* 寸法の欄 */
  W:{lab:'幅', min:150, max:6000, step:50, u:'mm'}, D:{lab:'奥行', min:150, max:3000, step:50, u:'mm'},
  R:{lab:'直径', min:150, max:2000, step:50, u:'mm'},
  A:{lab:'横の長さ', min:600, max:5000, step:50, u:'mm'}, B:{lab:'縦の長さ', min:600, max:5000, step:50, u:'mm'}, T:{lab:'基礎の幅', min:150, max:1000, step:50, u:'mm'},
  H:{lab:'高さ', min:100, max:1200, step:10, u:'mm'},
  wrap:{lab:'防水の範囲', sel:[1,0], name:['天端まで巻く','立上りだけ']},
  up:{lab:'立上りの高さ', min:50, max:1200, step:10, u:'mm', show:function(p){ return !p.wrap; }},
  anc:{lab:'アンカーボルト', sel:[0,2,4,6], unit:'本／1個'},
  n:{lab:'個数', min:1, max:8, step:1, u:'個'}, gap:{lab:'すき間', min:100, max:3000, step:50, u:'mm', show:function(p){ return p.n>1; }},
  O:{lab:'アゴの出', min:30, max:300, step:10, u:'mm'}, TC:{lab:'アゴの厚み', min:50, max:400, step:10, u:'mm'},
  mh:{lab:'増し貼り 立上り', min:100, max:600, step:10, u:'mm'}, ms:{lab:'増し貼り 張り出し', min:50, max:300, step:10, u:'mm'},
  top:{lab:'天端の形', sel:[0,1,2,3], name:['平ら','片流れ','山形','かまぼこ']},
  TS:{lab:'天端の高低差', min:5, max:200, step:5, u:'mm', show:function(p){ return p.top>0; }},
  edge:{lab:'上の角', sel:[0,1,2], name:['そのまま','面取り','丸み']},
  ER:{lab:'角の大きさ', min:5, max:80, step:5, u:'mm', show:function(p){ return p.edge>0; }},
  np:{lab:'支柱の本数', sel:[1,2,3], unit:'本'}, pd:{lab:'支柱の太さ', sel:[34,49,61,76], unit:'mmφ'},
  ps:{lab:'支柱の間隔', min:100, max:3000, step:10, u:'mm', show:function(p){ return p.np>1; }},
  cols:{lab:'脚の列', sel:[2,3,4], unit:'本×2列'}, leg:{lab:'脚の太さ', sel:[50,75,100], unit:'mm角'},
  skirt:{lab:'足元の張り出し', min:50, max:300, step:10, u:'mm'}, unit:{lab:'空調機', sel:[1,0], name:['のせる','のせない']}
};
var KEYS={rect:['W','D','H','top','TS','edge','ER','wrap','up','anc','n','gap'], circle:['R','H','wrap','up','n','gap'], L:['A','B','T','H','wrap','up','n','gap'], U:['A','B','T','H','wrap','up','n','gap'],
  ago:['W','D','H','O','TC','mh','ms','n','gap'], post:['W','D','H','top','TS','edge','ER','np','pd','ps','n','gap'],
  kodai:['W','D','H','cols','leg','up','skirt','unit']};
var FSH={ago:{H:{lab:'アゴ下までの高さ', min:150, max:1500, step:10, u:'mm'}}};
var FK={kodai:{H:{lab:'脚の高さ', min:150, max:1200, step:10, u:'mm'}, up:{lab:'増し張り 立上り', min:100, max:400, step:10, u:'mm'}, W:{lab:'幅', min:600, max:4000, step:50, u:'mm'}, D:{lab:'奥行', min:400, max:2000, step:50, u:'mm'}}};
var cat='kiso', T=TYPES.kiso[0], VAL={};
function P(){ if(!VAL[T.id]){ VAL[T.id]=JSON.parse(JSON.stringify(T.d)); fix(VAL[T.id]); } return VAL[T.id]; }
function keysOf(){ return KEYS[T.shape||'kodai']; }
function fdef(k){ return (cat==='kodai'&&FK.kodai[k])||(T.shape&&FSH[T.shape]&&FSH[T.shape][k])||F[k]; }

/* ===== 画面（型のボタン・入力の欄） ===== */
function drawTypes(){
  document.getElementById('types').innerHTML=TYPES[cat].map(function(t){ return '<button type="button" data-t="'+t.id+'"'+(t===T?' class="on"':'')+'>'+ICON[t.id]+t.name+'</button>'; }).join('');
}
function drawForm(){
  var p=P(), first=true;
  document.getElementById('form').innerHTML=keysOf().map(function(k){
    var f=fdef(k); if(f.show&&!f.show(p)) return ''; var c=first?' first':''; first=false;
    if(f.sel) return '<div class="f sel'+c+'"><label>'+f.lab+'</label><div class="opts">'+f.sel.map(function(v,i){ return '<button type="button" data-k="'+k+'" data-v="'+v+'"'+(p[k]===v?' class="on"':'')+'>'+(f.name?f.name[i]:v)+'</button>'; }).join('')+(f.unit?'<span>'+f.unit+'</span>':'')+'</div></div>';
    var mx=(k==='up'&&cat==='kiso')?p.H:f.max;
    return '<div class="f'+c+'"><label for="r_'+k+'">'+f.lab+'</label><input type="range" id="r_'+k+'" min="'+f.min+'" max="'+mx+'" step="'+f.step+'" value="'+p[k]+'"><input type="number" id="n_'+k+'" min="'+f.min+'" max="'+mx+'" step="'+f.step+'" value="'+p[k]+'"><span class="u">'+f.u+'</span></div>';
  }).join('');
}
function fix(p){ /* 形として成り立つように直す（立上り≦高さ、L・コの字の幅＜長さ、増し貼り≦高さ、支柱は基礎の中、角の大きさ≦高さ・幅の半分） */
  if(p.top==null&&(T.shape==='rect'||T.shape==='post')){ p.top=0; p.TS=30; p.edge=0; p.ER=20; }
  if(p.ER!=null){ var em=Math.max(5,Math.floor((Math.min(p.H,p.W/2,p.D/2)-10)/5)*5); if(p.ER>em) p.ER=em; }
  if(p.mh!=null&&p.mh>p.H) p.mh=p.H;
  if(p.ps!=null){ var lim=Math.max(100,p.W-p.pd-60); if(p.ps>lim) p.ps=Math.floor(lim/10)*10; }
  if(p.up!=null&&p.H!=null&&cat==='kiso'&&p.up>p.H) p.up=p.H;
  if(p.T!=null){ p.T=Math.min(p.T, Math.floor(Math.min(p.A,p.B)/2/50)*50||150); }
}
document.getElementById('cats').addEventListener('click',function(e){ var b=e.target.closest('button[data-c]'); if(!b||b.dataset.c===cat) return; cat=b.dataset.c; T=TYPES[cat][0]; [].forEach.call(this.children,function(x){ x.classList.toggle('on',x===b); }); drawTypes(); drawForm(); lastKey=''; update(); });
document.getElementById('types').addEventListener('click',function(e){ var b=e.target.closest('button[data-t]'); if(!b) return; T=TYPES[cat].find(function(t){ return t.id===b.dataset.t; }); drawTypes(); drawForm(); lastKey=''; update(); });
var form=document.getElementById('form');
form.addEventListener('input',function(e){
  var t=e.target, k=t.id&&t.id.slice(2), p=P(); if(!k||!(k in p)) return;
  var v=Math.round(+t.value||0), mn=+t.min, mx=+t.max; if(t.type==='number'&&(v<mn||v>mx)) return;   /* 打ちかけの数字では形を変えない */
  p[k]=v; var o=document.getElementById((t.type==='range'?'n_':'r_')+k); if(o) o.value=v;
  var before=JSON.stringify(p); fix(p); if(k==='H'||JSON.stringify(p)!==before) drawForm();
  update();
});
form.addEventListener('change',function(e){ var t=e.target; if(t.type!=='number') return; var k=t.id.slice(2), p=P(); var v=Math.min(+t.max,Math.max(+t.min,Math.round(+t.value||+t.min))); p[k]=v; fix(p); drawForm(); update(); });
form.addEventListener('click',function(e){ var b=e.target.closest('button[data-k]'); if(!b) return; P()[b.dataset.k]=+b.dataset.v; fix(P()); drawForm(); update(); });

/* ===== 数量（3Dとは別に、寸法から直接数える） ===== */
function f2(v){ return (Math.round(v*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function kisoQty(p){
  var H=p.H/1000, per, top, cx, cc;   /* 1個あたり：周り（m）・天端（㎡）・出隅の数・入隅の数（たての角） */
  if(T.shape==='circle'){ var r=p.R/2000; per=2*Math.PI*r; top=Math.PI*r*r; cx=0; cc=0; }
  else if(T.shape==='rect'){ var w=p.W/1000, d=p.D/1000; per=2*(w+d); top=w*d; cx=4; cc=0; }

      if(T.shape==='rect'&&shaped(p)){ var rr=(p.edge?p.ER:0)/1000;   /* 形の調整あり */
        if(p.wrap) shapedMesh(p,q.w+2*e,q.d+2*e,H+e,rr+e,mats.mash,x,z);
        else { shapedMesh(p,q.w,q.d,H,rr,mats.conc,x,z); box(q.w+2*e,h,q.d+2*e,mats.mash,x,h/2,z); }
      } else {
      box(q.w,H,q.d,mats.conc,x,H/2,z);
      var ch=p.wrap?H+e:h; box(q.w+2*e,ch,q.d+2*e,mats.mash,x,ch/2,z); }
      if(!p.wrap) box(q.w+2*e+0.02,0.02,q.d+2*e+0.02,mats.seal,x,h,z);
      box(q.w+2*e+0.05,0.01,q.d+2*e+0.05,mats.iri,x,0.005,z);
    });
    var anc=T.shape==='rect'?(p.anc||0):0;
    if(anc){ var w=p.W/1000, d=p.D/1000, ix=Math.min(0.08,w/4), iz=Math.min(0.08,d/4), pts=[];
      if(anc===2) pts=[[-w/2+ix,0],[w/2-ix,0]];
      else { pts=[[-w/2+ix,-d/2+iz],[w/2-ix,-d/2+iz],[-w/2+ix,d/2-iz],[w/2-ix,d/2-iz]]; if(anc===6) pts.push([0,-d/2+iz],[0,d/2-iz]); }
      pts.forEach(function(q){ var ty=shaped(p)?topAt(p,w,d,H,(p.edge?p.ER:0)/1000,q[0],q[1]):H; cyl(0.012,0.14,mats.steel,ox+q[0],ty+0.07,oz+q[1]); if(p.wrap) cyl(0.03,0.04,mats.seal,ox+q[0],ty+0.02+e,oz+q[1]); });
    }
  }
  return {ex:alongZ?ex:(tot+ex), ez:alongZ?(tot+ez):ez, H:H};
}
function buildKodai(){
  var p=P(), W=p.W/1000, D=p.D/1000, H=p.H/1000, a=p.leg/1000, up=p.up/1000, s=p.skirt/1000, nc=p.cols, bh=0.1;
  var xs=[]; for(var i=0;i<nc;i++) xs.push(-W/2+a/2+(W-a)*i/(nc-1)); var zs=[-D/2+a/2, D/2-a/2];
  xs.forEach(function(x){ zs.forEach(function(z){ box(a,H,a,mats.steel,x,H/2,z); box(a+0.012,up,a+0.012,mats.mash,x,up/2,z); box(a+2*s,0.012,a+2*s,mats.mash,x,0.006,z); box(a+0.03,0.018,a+0.03,mats.seal,x,up+0.009,z); box(a*1.6,0.012,a*1.6,mats.steel,x,H-0.006,z); }); });
  zs.forEach(function(z){ box(W,bh,a,mats.beam,0,H+bh/2,z); }); xs.forEach(function(x){ box(a,bh*0.8,D,mats.beam,x,H+bh*0.4,0); });
  var uh=0; if(p.unit){ uh=Math.min(1.1,Math.max(0.5,W*0.42)); box(W*0.92,uh,D*0.86,mats.unit,0,H+bh+uh/2,0); }
  return {ex:W, ez:D, H:H+bh+uh};
}
function build(){
  if(!G) return; clear();
  var b=cat==='kiso'?buildKiso():buildKodai();
  tgt.y=Math.max(0.15,b.H/2);
  /* 大きさが変わったら、全体が入る距離まで引いて映す（細長い画面ほど引く） */
  var key=T.id+':'+b.ex.toFixed(2)+'x'+b.ez.toFixed(2)+'x'+b.H.toFixed(2);
  if(key!==lastKey){ lastKey=key; var v=document.getElementById('view'), asp=v.clientWidth/Math.max(1,v.clientHeight); rot.r=Math.min(40,Math.max(2.2,(Math.max(b.ex,b.ez)*1.3+b.H+0.6)*(asp<1.3?1.3/asp:1))); }
  need=true;
}
function ctrl(v){
  var pts={}, pd=0;
  v.addEventListener('pointerdown',function(e){ v.setPointerCapture(e.pointerId); pts[e.pointerId]={x:e.clientX,y:e.clientY}; });
  v.addEventListener('pointermove',function(e){
    if(!pts[e.pointerId]) return; var ids=Object.keys(pts);
    if(ids.length===1){ var p=pts[e.pointerId]; rot.th-=(e.clientX-p.x)*0.008; rot.ph=Math.min(1.5,Math.max(0.15,rot.ph-(e.clientY-p.y)*0.008)); need=true; }
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    if(ids.length===2){ var A=pts[ids[0]],B=pts[ids[1]], d=Math.hypot(A.x-B.x,A.y-B.y); if(pd){ rot.r=Math.min(40,Math.max(1.2,rot.r*pd/d)); need=true; } pd=d; }
  });
  var up=function(e){ delete pts[e.pointerId]; pd=0; }; v.addEventListener('pointerup',up); v.addEventListener('pointercancel',up);
  v.addEventListener('wheel',function(e){ e.preventDefault(); rot.r=Math.min(40,Math.max(1.2,rot.r*(e.deltaY>0?1.1:0.9))); need=true; },{passive:false});
  document.getElementById('vReset').onclick=function(){ rot.th=-0.75; rot.ph=0.9; lastKey=''; build(); };
  document.getElementById('vTop').onclick=function(){ rot.ph=0.15; rot.th=0; need=true; };
}
function loop(){
  requestAnimationFrame(loop); if(!need) return; need=false;   /* 動いたときだけ描く */
  var v=document.getElementById('view'), w=v.clientWidth, h=v.clientHeight; R.setSize(w,h,false); C.aspect=w/Math.max(1,h); C.updateProjectionMatrix();
  C.position.set(tgt.x+rot.r*Math.sin(rot.ph)*Math.sin(rot.th), tgt.y+rot.r*Math.cos(rot.ph), tgt.z+rot.r*Math.sin(rot.ph)*Math.cos(rot.th)); C.lookAt(tgt.x,tgt.y,tgt.z);
  R.render(S,C);
}

 {id:'p3', name:'脱気筒', kind:'vent', w:300,d:300,h:400, price:9000, addM2:0.4, sealM:0.8, memo:'100㎡に1箇所'}];

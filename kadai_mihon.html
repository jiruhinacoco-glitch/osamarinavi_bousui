     ★2026-11-16m 本人「架台というのは役物（基礎）のこと。高置架台はそれで残して、基礎のタイプをいろんな形状で同じように」

<style>

table.tm{width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums;}

#tplCur .memo i{display:block; font-style:normal; font-weight:900; color:#1c6b3c; font-size:11px;}

<header>

  <h1><span>役物の見本</span></h1>

<main>
  <div class="side">
    <div class="box">

function fix(p){ /* 形として成り立つように直す（立上り≦高さ、L・コの字の幅＜長さ、増し貼り≦高さ、支柱は基礎の中、角の大きさ≦高さ・幅の半分） */

  if(p.ER!=null){ var em=Math.max(5,Math.floor((Math.min(p.H,p.W/2,p.D/2)-10)/5)*5); if(p.ER>em) p.ER=em; }
  if(p.vc==null&&p.W!=null&&p.D!=null&&(T.shape==='rect'||T.shape==='post'||T.shape==='ago'||T.shape==='hato')){ p.vc=0; p.VR=50; }
  if(p.VR!=null){ var vm=Math.max(10,Math.floor((Math.min(p.W,p.D)/2-5)/5)*5); if(p.VR>vm) p.VR=vm; }
  if(p.mh!=null&&p.mh>p.H) p.mh=p.H;
  if(p.ps!=null){ var lim=Math.max(100,p.W-p.pd-60); if(p.ps>lim) p.ps=Math.floor(lim/10)*10; }

  if(T.shape==='hato'){ if(p.up>p.H) p.up=p.H; if(p.ow>p.W-100) p.ow=Math.max(100,Math.floor((p.W-100)/10)*10); if(p.oh>p.H-100) p.oh=Math.max(100,Math.floor((p.H-100)/10)*10);

}

function kisoQty(p){
  var H=p.H/1000, per, top, cx, cc;   /* 1個あたり：周り（m）・天端（㎡）・出隅の数・入隅の数（たての角） */
  if(T.shape==='circle'){ var r=p.R/2000; per=2*Math.PI*r; top=Math.PI*r*r; cx=0; cc=0; }
  else if(T.shape==='rect'){ var w=p.W/1000, d=p.D/1000; per=perOf(p,w,d); top=areaOf(p,w,d); cx=4; cc=0; }
  else if(T.shape==='L'){ var a=p.A/1000, b=p.B/1000, t=p.T/1000; per=2*(a+b); top=t*(a+b-t); cx=5; cc=1; }
  else { var a2=p.A/1000, b2=p.B/1000, t2=p.T/1000; per=2*(a2+b2)+2*(b2-t2); top=a2*t2+2*t2*(b2-t2); cx=6; cc=2; }
  var h=p.wrap?H:Math.min(p.up,p.H)/1000, n=p.n, anc=(T.shape==='rect'&&p.wrap?(p.anc||0):0);   /* 立上りだけのときは天端に防水が無いので、ボルト周りの処理は数えない */
  var side=per*h, wp=side+(p.wrap?top:0);
  if(shaped(p)&&p.wrap){ var sd=shapeData(p,p.W/1000,p.D/1000,H,(p.edge?p.ER:0)/1000); side=sd.wallA; top=sd.topA; wp=side+top; }   /* 形の調整あり：形そのものの面積（角の丸み・勾配を含む） */
  return {n:n, per:per, side:side, top:top, wp:wp, cx:cx, cc:cc, anc:anc, h:h};
}

/* ===== 断面からつくる：3D（断面をそのまま長さ方向へ伸ばす） ===== */
function buildFree(){
  var p=P(), q=freeQty(p), L=p.L/1000, n=p.n, g=p.gap/1000;
  if(!q.ok){ return {ex:1, ez:1, H:0.3}; }
  var cx=(Math.min.apply(null,p.pts.map(function(v){ return v[0]; }))+Math.max.apply(null,p.pts.map(function(v){ return v[0]; })))/2;
  var sh=new THREE.Shape(); p.pts.forEach(function(v,i){ var x=(v[0]-cx)/1000, y=v[1]/1000; if(i) sh.lineTo(x,y); else sh.moveTo(x,y); }); sh.closePath();
  var W=q.W/1000, step=W+g, tot=step*(n-1);
  for(var i=0;i<n;i++){
    var geo=new THREE.ExtrudeGeometry(sh,{depth:L, bevelEnabled:false, curveSegments:1}); geo.translate(0,0,-L/2);
    var m=new THREE.Mesh(geo,mats.mash); m.rotation.y=Math.PI/2; m.position.z=-tot/2+i*step; G.add(m);
    var eg=new THREE.EdgesGeometry(geo,20), ln=new THREE.LineSegments(eg,mats.edge); ln.rotation.y=Math.PI/2; ln.position.z=m.position.z; G.add(ln);
    if(q.hasBase){ var bw=q.baseW; box(L+0.05,0.01,bw+0.05,mats.iri,0,0.005,m.position.z); }
  }
  return {ex:L, ez:tot+W, H:q.H/1000};
}

  if(!FD.hlMat) FD.hlMat=new THREE.MeshBasicMaterial({color:0xffd23c, transparent:true, opacity:0.5, side:THREE.DoubleSide, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2});
  if(!FD.hlLine) FD.hlLine=new THREE.LineBasicMaterial({color:0xff7a00, depthTest:false, transparent:true});
  var f=FD.sel, d=HL_DIR[f], tr=hlPick(f), o=0.004;
  if(tr.length){
    var pos=new Float32Array(tr.length*9);
    tr.forEach(function(t,i){ [t.a,t.b,t.c].forEach(function(v,j){ pos[i*9+j*3]=v.x+d[0]*o; pos[i*9+j*3+1]=v.y+d[1]*o; pos[i*9+j*3+2]=v.z+d[2]*o; }); });
    var g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));

    try{ var gm=(THREE.BufferGeometryUtils&&THREE.BufferGeometryUtils.mergeVertices)?THREE.BufferGeometryUtils.mergeVertices(g,0.0005):g;
      var ln=new THREE.LineSegments(new THREE.EdgesGeometry(gm,25),FD.hlLine); ln.renderOrder=6; FD.hl.add(ln); if(gm!==g) gm.dispose(); }catch(e){}
    S.add(FD.hl);
  }
  if(bar){ var k=faceKey(f), fd=fdef(k); bar.style.display='flex';
    bar.querySelector('.fn').textContent=FACE_NAME[f]+'：'+fd.lab+' '+P()[k]+'mm'; }
  need=true;
}
/* 寸法を Δmm 変える（押し出し＝＋）。押した面だけが動くよう全体をずらす */
function pushFace(dmm){
  var f=FD.sel, k=f&&faceKey(f); if(!k) return; var p=P(), fd=fdef(k), v0=p[k];
  var v=Math.max(fd.min,Math.min((k==='up'&&cat==='kiso')?p.H:fd.max, Math.round((v0+dmm)/fd.step)*fd.step)); if(v===v0) return;
  p[k]=v; fix(p); var dv=(p[k]-v0)/1000;
  if(f==='px') G.position.x+=dv/2; else if(f==='nx') G.position.x-=dv/2; else if(f==='pz') G.position.z+=dv/2; else if(f==='nz') G.position.z-=dv/2;
  drawForm(); update();
}
function faceStep(){ var k=FD.sel&&faceKey(FD.sel); return k?Math.max(fdef(k).step,(k==='H'||k==='bl')?10:50):50; }
function faceDragStart(e){
  if(!FD.sel||pickFace(e)!==FD.sel) return false;
  var bb=bodyBox(), c=bb.getCenter(new THREE.Vector3()), n=HL_DIR[FD.sel];
  var a=c.clone().project(C), b2=c.clone().add(new THREE.Vector3(n[0],n[1],n[2])).project(C), r=R.domElement.getBoundingClientRect();
  var sx=(b2.x-a.x)/2*r.width, sy=-(b2.y-a.y)/2*r.height, L2=sx*sx+sy*sy; if(L2<4) return false;   /* 面がほぼ正面＝向きが分からないときは回すほうへ */
  FD.drag={x:e.clientX, y:e.clientY, sx:sx, sy:sy, L2:L2, acc:0}; return true; }
function faceDragMove(e){ var d=FD.drag; var dm=((e.clientX-d.x)*d.sx+(e.clientY-d.y)*d.sy)/d.L2*1000;   /* 画面で動かした量を、面の向きへの長さ（mm）に直す */
  d.acc+=dm; d.x=e.clientX; d.y=e.clientY; var k=faceKey(FD.sel), st=k?fdef(k).step:50; var n=Math.trunc(d.acc/st);   /* 欄の刻み（幅50mm・高さ10mm）ずつ動かす */ if(n){ d.acc-=n*st; pushFace(n*st); } }
function ctrl(v){
  var pts={}, pd=0, down=null;
  v.addEventListener('pointerdown',function(e){ if(e.target.closest&&e.target.closest('button,#faceBar')) return; v.setPointerCapture(e.pointerId);
    /* 選んだ面の上から始めたら、回さずに押し出し・引っ込め（先に始めない＝回す処理は動かない・§164） */
    if(Object.keys(pts).length===0&&faceDragStart(e)){ return; }
    pts[e.pointerId]={x:e.clientX,y:e.clientY}; down=Object.keys(pts).length===1?{x:e.clientX,y:e.clientY,t:Date.now()}:null; });
  v.addEventListener('pointermove',function(e){
    if(FD.drag){ faceDragMove(e); return; }
    if(!pts[e.pointerId]) return; var ids=Object.keys(pts);
    if(ids.length===1){ var p=pts[e.pointerId]; rot.th-=(e.clientX-p.x)*0.008; rot.ph=Math.min(1.5,Math.max(0.15,rot.ph-(e.clientY-p.y)*0.008)); need=true; }
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    if(ids.length===2){ var A=pts[ids[0]],B=pts[ids[1]], d=Math.hypot(A.x-B.x,A.y-B.y); if(pd){ rot.r=Math.min(40,Math.max(1.2,rot.r*pd/d)); need=true; } pd=d; }
  });
  var up=function(e){ if(FD.drag){ FD.drag=null; lastKey=''; build(); return; }
    /* 動かさずに離した＝クリック（タップ）：面を選ぶ／何も無い所なら選択をやめる */
    if(e.type==='pointerup'&&down&&Object.keys(pts).length===1&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6&&Date.now()-down.t<500){ var f=pickFace(e); FD.sel=(f&&faceKey(f))?f:null; hlRemember(FD.sel); drawHl(); }
    delete pts[e.pointerId]; pd=0; if(!Object.keys(pts).length) down=null; }; v.addEventListener('pointerup',up); v.addEventListener('pointercancel',up);
  document.getElementById('faceBar').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.fx){ FD.sel=null; drawHl(); return; } pushFace((+b.dataset.fd)*faceStep()); });
  v.addEventListener('wheel',function(e){ e.preventDefault(); rot.r=Math.min(40,Math.max(1.2,rot.r*(e.deltaY>0?1.1:0.9))); need=true; },{passive:false});
  document.getElementById('vReset').onclick=function(){ rot.th=-0.75; rot.ph=0.9; lastKey=''; build(); };
  document.getElementById('vTop').onclick=function(){ rot.ph=0.15; rot.th=0; need=true; };
}
function loop(){
  requestAnimationFrame(loop); if(!need) return; need=false;   /* 動いたときだけ描く */
  var v=document.getElementById('view'), w=v.clientWidth, h=v.clientHeight; R.setSize(w,h,false); C.aspect=w/Math.max(1,h); C.updateProjectionMatrix();
  C.position.set(tgt.x+rot.r*Math.sin(rot.ph)*Math.sin(rot.th), tgt.y+rot.r*Math.cos(rot.ph), tgt.z+rot.r*Math.sin(rot.ph)*Math.cos(rot.th)); C.lookAt(tgt.x,tgt.y,tgt.z);

}

/* ===== ④ 図面・積算の「🔩 役物・架台」（localStorage nn_zumen_parts_v1）へ登録 ===== */
var PKEY='nn_zumen_parts_v1';
/* 登録が1件も無い端末では、図面・積算は見本3件を出している（保存はしていない）。ここで書くと見本が消えるので、同じ見本を先に入れておく */
var ZSAMPLE=[{id:'p1', name:'タテ改修ドレン 75φ', kind:'drain', w:325,d:325,h:60, price:8000, addM2:0.6, sealM:1.3, memo:'改修用ドレン共'},
 {id:'p2', name:'空調架台 600×600', kind:'stand', w:600,d:600,h:300, price:12000, addM2:0.9, sealM:2.4, memo:'脚4本・増し貼り共'},
 {id:'p3', name:'脱気筒', kind:'vent', w:300,d:300,h:400, price:9000, addM2:0.4, sealM:0.8, memo:'100㎡に1箇所'}];
function r2(v){ return Math.round(v*100)/100; }
function partOf(){
  var p=P();
  if(T.shape==='free'){ var fq=freeQty(p); return {name:'断面の役物 '+p.L+'×'+Math.round(fq.W)+'×H'+Math.round(fq.H), kind:'stand', w:p.L, d:Math.round(fq.W), h:Math.round(fq.H), price:0, addM2:r2(fq.all), sealM:0,
    memo:'型：断面からつくる（'+p.pts.length+'点）／防水 側面・上面'+r2(fq.side)+'㎡'+(p.ends?'＋両端'+r2(fq.endA)+'㎡':'')+'／出隅'+r2(fq.cxL)+'m・入隅'+r2(fq.ccL)+'m', tpl:{cat:cat, type:T.id, p:JSON.parse(JSON.stringify(p))}}; }
  if(cat==='hato'){ var hq=hatoQty(p), ih=hq.part; ih.tpl={cat:cat, type:T.id, p:JSON.parse(JSON.stringify(p))}; return ih; }
  if(cat==='kiso'&&SPC[T.shape]){ var sq=spQty(p), it=sq.part; it.tpl={cat:cat, type:T.id, p:JSON.parse(JSON.stringify(p))}; return it; }
  if(cat==='kiso'){
    var q=kisoQty(p), w, d, dim;
    if(T.shape==='circle'){ w=d=p.R; dim='φ'+p.R; } else if(T.shape==='rect'){ w=p.W; d=p.D; dim=p.W+'×'+p.D; } else { w=p.A; d=p.B; dim=p.A+'×'+p.B+'（幅'+p.T+'）'; }
    var nm=(T.id==='bolt'?'ボルト基礎':T.id==='nuno'?'布基礎':T.name+'基礎')+' '+dim+'×H'+p.H+(shaped(p)?'（'+shapeLab(p)+'）':'');
    var memo='型：'+T.name+'／防水：'+(p.wrap?'天端まで巻く':'立上りだけ（H'+Math.min(p.up,p.H)+'）')+'／入隅 '+r2(q.per)+'m／出隅'+q.cx+'・入隅'+q.cc+(q.anc?'／ボルト'+q.anc+'本':'');

  }

    memo:'型：鋼製の高置架台／脚'+p.leg+'mm角×'+n2+'本／増し張り立上り'+p.up+'・張り出し'+p.skirt, tpl:{cat:cat, type:T.id, p:JSON.parse(JSON.stringify(p))}};

/* ===== 登録に「形」を一緒に残す（★2026-11-18h 本人「図面の3Dでも、役物作成で作った形そのままで出す」） =====
   図面・積算の3Dは 登録の 幅×奥行×高さ の箱しか描けなかった（片流れ・ボルト・笠・扉が写らない）。
   → ここで組んだ形（三角形）を、色ごとに mm の整数で詰めて登録（geo）に入れる。図面・積算はそれをそのまま描く。
   ・1個ぶんだけ（個数 n は 1 にして組む。登録の寸法・数量も1個あたり）　・足元の緑の帯（平場との入隅の目印）と寸法線は入れない
   ・形：{v:1, m:[{c:色, p:頂点(Int16・mm・xyz), i:三角形(Uint16)}]} を base64 で。大きすぎる（合計40万字超・頂点6万超）ときは付けない＝箱のまま */
function b64(u8){ var t='', n=u8.length; for(var i=0;i<n;i+=8192) t+=String.fromCharCode.apply(null,u8.subarray(i,Math.min(n,i+8192))); return btoa(t); }
function geoFor(tp){
  if(!tp||!G||typeof THREE==='undefined'||!TYPES[tp.cat]) return null;
  var t=TYPES[tp.cat].find(function(x){ return x.id===tp.type; }); if(!t||!tp.p) return null;
  var cat0=cat, T0=T, had=Object.prototype.hasOwnProperty.call(VAL,t.id), v0=VAL[t.id], gp=G.position.clone(), dims0=DIMS, out=null;
  try{
    cat=tp.cat; T=t; VAL[t.id]=JSON.parse(JSON.stringify(tp.p)); var p=VAL[t.id]; fix(p); if('n' in p) p.n=1;
    G.position.set(0,0,0); clear(); DIMS=[];
    if(cat==='free') buildFree(); else if(cat==='hato') buildHato(); else if(cat==='kiso') buildKiso(); else buildKodai();
    var by={}, A=new THREE.Vector3();
    G.children.forEach(function(o){
      if(!o.isMesh||o.material===mats.iri||!o.geometry||!o.geometry.attributes.position) return;
      o.updateMatrix(); var pa=o.geometry.attributes.position, ix=o.geometry.index, n=ix?ix.count:pa.count, c=o.material.color.getHex();
      var g=by[c]||(by[c]={c:c, map:{}, v:[], i:[]});
      for(var k=0;k+2<n;k+=3){ var tri=[];
        for(var j=0;j<3;j++){ A.fromBufferAttribute(pa,ix?ix.getX(k+j):k+j).applyMatrix4(o.matrix);
          var x=Math.round(A.x*1000), y=Math.round(A.y*1000), z=Math.round(A.z*1000), key=x+','+y+','+z, id=g.map[key];
          if(id==null){ id=g.map[key]=g.v.length/3; g.v.push(x,y,z); } tri.push(id); }
        if(tri[0]!==tri[1]&&tri[1]!==tri[2]&&tri[0]!==tri[2]) g.i.push(tri[0],tri[1],tri[2]); }
    });
    var m=[], tot=0, okk=true;
    Object.keys(by).forEach(function(k){ var g=by[k]; if(!g.i.length) return; if(g.v.length/3>65535) okk=false;
      if(g.v.some(function(q){ return q>32767||q<-32768; })) okk=false;
      var e={c:g.c, p:b64(new Uint8Array(new Int16Array(g.v).buffer)), i:b64(new Uint8Array(new Uint16Array(g.i).buffer))}; tot+=e.p.length+e.i.length; m.push(e); });
    if(okk&&m.length&&tot<=400000) out={v:1, m:m};

}
/* 前に登録した役物（形なし）にも形を付ける。このページを開いたとき／図面・積算が裏で開いたとき（?fill=1）に1回 */
function fillGeo(){

  if(ch){ try{ localStorage.setItem(PKEY, JSON.stringify({items:items})); }catch(e){} build(); }
}

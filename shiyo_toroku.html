<script id="nn-phonemark">
/* ============================================================
   ★このページは「幅980で組み立ててから画面に合わせて縮める」作り。
     そのため CSS から見た画面の幅は、スマホでも 980px になる。
     ＝「スマホのときだけ効かせたい指定」が一度も効かなかった。
     ここでは端末そのものの幅を見て、<html> に data-nnphone="1" を付ける。
     （パソコンでは付かないので、今までの見た目のまま）
   ============================================================ */
(function(){try{
  var d = Math.min(screen.width||0, screen.height||0);
  if(d && d < 700) document.documentElement.setAttribute('data-nnphone','1');
}catch(e){}})();
</script>

/* ホーム画面起動（スタンドアロン）時：ステータスバー下への潜り込みを回避 */
header{padding-top:calc(5px + env(safe-area-inset-top)) !important;}
/* 横画面（スマホ）：上部の帯（ヘッダー）を非表示にして表示領域を広げる
   ※タップ高速化とノッチ左右の余白は、文末の nn-tap / nn-safearea ブロック参照 */
@media (orientation:landscape) and (max-height:500px){
  header{display:none !important;}
}

<title>納まりナビ – 仕様登録</title>
<style>
:root{
  /* 共通カラーパレットは common.css に移動（--green-deep 等） */
  --profit:#0a6bd6; --warn:#b0392f; --gold:#8a7a2a;
  --c-as:#8c2f2f; --c-kai:#c05a20; --c-gs:#2a7a8c; --c-tm:#1f66c0; --c-cm:#6a5a8c;
  --radius:10px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
}
.num{font-variant-numeric:tabular-nums;}
header{background:linear-gradient(135deg,var(--green-deep),var(--green)); color:#fff; display:flex; align-items:center; gap:14px; padding:10px 18px; flex:none;}
header .hicon{font-size:22px;}
header h1{font-size:21px; font-weight:800; letter-spacing:.06em;}
header .count{margin-left:auto; font-size:15px; font-weight:700; opacity:.95; white-space:nowrap;}
button.new-btn{background:#fff; color:var(--green-deep); border:2px solid #b8e6c9; border-radius:8px; font-size:14px; font-weight:800; padding:8px 14px; cursor:pointer; letter-spacing:.03em; white-space:nowrap;}
button.new-btn:hover{background:#dff5e7;}
#viewtabs{display:flex; gap:8px; padding:10px 18px 0; background:var(--paper); flex:none; flex-wrap:wrap;}
#viewtabs button{border:1px solid var(--line); background:#e3e7e0; color:var(--ink-sub); border-radius:9px 9px 0 0; padding:9px 22px; font-size:14.5px; font-weight:800; cursor:pointer; letter-spacing:.03em;}
#viewtabs button.on{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}
#viewtabs button:not(.on):hover{background:#d7dcd2;}
.toolbar{display:flex; align-items:center; gap:10px; padding:8px 18px; background:#dfe3db; border-bottom:1px solid var(--line); flex:none; flex-wrap:wrap;}
.search{flex:0 1 340px; position:relative;}
.search input{width:100%; padding:7px 10px 7px 30px; border:1px solid var(--line); border-radius:8px; font-size:15px; background:#fff;}
.search::before{content:"🔍"; position:absolute; left:8px; top:6px; font-size:13px; opacity:.55;}
.chips{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap;}
.chip{position:relative;}
.chip>button{background:#3c4440; color:#fff; border:0; border-radius:6px; padding:6px 12px; font-size:13.5px; font-weight:700; cursor:pointer; letter-spacing:.03em;}
.chip>button.active{background:var(--green);}
.chip .menu{display:none; position:absolute; top:calc(100% + 4px); right:0; z-index:30; background:#fff; border:1px solid var(--line); border-radius:8px; min-width:200px; box-shadow:0 6px 18px rgba(0,0,0,.18); max-height:300px; overflow:auto;}
.chip .menu.open{display:block;}
.chip .menu div{padding:9px 14px; font-size:14px; cursor:pointer; white-space:nowrap;}
.chip .menu div:hover{background:var(--green-lite);}
.chip .menu div.sel{background:var(--green); color:#fff;}
main{flex:1; display:flex; min-height:0;}
#list{flex:0 0 42%; max-width:600px; overflow-y:auto; background:#f7f8f5;}
#resizer{flex:0 0 6px; cursor:col-resize; background:transparent; border-left:1px solid var(--line); transition:background .12s;}
#resizer:hover,#resizer.on{background:#bcd9c6;}
#detail{flex:1; min-width:0; overflow-y:auto; background:#f7f8f5; border-left:1px solid var(--line);}
.ghead{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; background:#e4ebe2; color:var(--green-deep); font-weight:800; font-size:12.5px; padding:5px 14px; border-bottom:1px solid var(--line); letter-spacing:.04em;}
.ghead small{margin-left:auto; color:var(--ink-sub); font-weight:700;}
.mrow{display:flex; align-items:center; gap:9px; padding:8px 12px 8px 14px; background:#fff; border-bottom:1px solid #e7eae4; cursor:pointer; min-height:44px;}
.mrow:hover{background:#f2f8f4;}
.mrow.sel{background:var(--green-lite); box-shadow:inset 4px 0 0 var(--green);}
.mrow .code{font-weight:800; font-size:15px; white-space:nowrap; min-width:64px;}
.mrow .nm{font-size:12.5px; color:var(--ink-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:40px;}
.mrow .right{margin-left:auto; display:flex; align-items:center; gap:6px; flex:none;}
.badge{display:inline-block; color:#fff; border-radius:4px; padding:2px 8px; font-size:11.5px; font-weight:800; letter-spacing:.03em; white-space:nowrap;}
.tag{display:inline-block; border-radius:4px; padding:2px 7px; font-size:11.5px; font-weight:800; white-space:nowrap;}
.tag.jc{background:#fdeee0; color:#8a4a12; border:1px solid #e8c090;}
.tag.done{background:var(--green-lite); color:var(--green-deep); border:1px solid #b8dcc4;}
.tag.cnt{background:#eef0ea; color:var(--ink-sub); border:1px solid var(--line); font-weight:700;}
.tag.jass{background:#eef2fb; color:#1f4e9c; border:1px solid #b9c9e8;}
.tag.shin{background:#e8f3ec; color:#1e5c3a; border:1px solid #b8dcc4;}
.tag.kai{background:#fdf3e0; color:#8a5a12; border:1px solid #e8cf90;}
.empty{padding:40px 20px; text-align:center; color:var(--ink-sub); font-size:14px; line-height:2;}
.dhead{padding:14px 18px 0;}
.dhead .path{font-size:12px; font-weight:800; color:var(--gold); letter-spacing:.05em;}
.dhead h2{font-size:19px; font-weight:800; line-height:1.4; margin-top:2px;}
.dhead h2 input{font-size:18px; font-weight:800; width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:7px;}
.dhead .meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:7px; font-size:13px; color:var(--ink-sub); align-items:center;}
.dbody{padding:12px 18px 90px;}
.panel{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:12px;}
.panel h4{font-size:13px; font-weight:800; color:var(--green-deep); margin-bottom:8px; letter-spacing:.04em; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.panel h4 .sub{font-weight:700; color:var(--ink-sub); font-size:11.5px;}
.step-tbl{width:100%; border-collapse:collapse; font-size:13px;}
.step-tbl th,.step-tbl td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top;}
.step-tbl th{background:var(--green-lite); font-weight:800; white-space:nowrap;}
.step-tbl td.num{text-align:right; white-space:nowrap;}
.step-tbl .stno{white-space:nowrap; font-weight:800; text-align:center; width:44px;}
.matchip{display:inline-block; margin:1px 2px 1px 0; padding:1px 7px; border-radius:4px; font-size:11.5px; font-weight:700; background:#eef2fb; color:#1f4e9c; border:1px solid #b9c9e8; white-space:nowrap;}
.matchip.reg{background:var(--green-lite); color:var(--green-deep); border-color:#b8dcc4;}
.matchip.nop{background:#fbeae6; color:var(--warn); border-color:#e8b0a8;}
.cost-line{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; font-size:13.5px;}
.cost-line .big{font-size:21px; font-weight:800; color:var(--profit);}
.cost-note{font-size:12px; color:var(--ink-sub); margin-top:6px; line-height:1.7;}
.notebox{font-size:12.5px; color:var(--ink-sub); line-height:1.8; background:#fbfcf9; border:1px dashed var(--line); border-radius:8px; padding:9px 12px;}
.actrow{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;}
.btn-ok{background:var(--green); color:#fff; border:0; border-radius:7px; padding:11px 26px; font-size:14.5px; font-weight:800; cursor:pointer; letter-spacing:.05em;}
.btn-ok:hover{background:var(--green-deep);}
.btn-ghost{background:#fff; border:2px solid var(--green); color:var(--green-deep); border-radius:7px; padding:9px 18px; font-size:13.5px; font-weight:800; cursor:pointer;}
.btn-ghost:hover{background:var(--green-lite);}
.btn-del{margin-left:auto; background:none; border:0; color:var(--warn); font-size:13px; font-weight:800; cursor:pointer; text-decoration:underline;}
.hint{font-size:12.5px; color:var(--ink-sub); line-height:1.7;}
/* マイ仕様編集行 */
.estep{display:grid; grid-template-columns:44px 1.3fr 1.2fr 92px 100px 30px; gap:6px; align-items:center; padding:6px 0; border-bottom:1px solid #eef0ea;}
.estep input,.estep select{width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; background:#fff;}
.estep .stno2{text-align:center; font-weight:800; font-size:12.5px;}
.estep .cost{font-size:12px; font-weight:800; text-align:right; white-space:nowrap;}
.estep .xdel{background:none; border:0; color:var(--warn); font-size:15px; cursor:pointer;}
.ehead{display:grid; grid-template-columns:44px 1.3fr 1.2fr 92px 100px 30px; gap:6px; font-size:11px; font-weight:800; color:var(--ink-sub); padding-bottom:4px; border-bottom:2px solid var(--line);}
/* ---------- メーカー切替バー ---------- */
#makerbar{display:flex; gap:6px; padding:7px 14px 6px; background:#e7ebe3; border-bottom:1px solid var(--line); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; align-items:center;}
#makerbar::-webkit-scrollbar{display:none;}
#makerbar .mlabel{flex:none; font-size:11.5px; font-weight:800; color:var(--ink-sub); margin-right:2px; white-space:nowrap;}
#makerbar .mk{flex:none; border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:5px 13px; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap; color:var(--ink);}
#makerbar .mk:hover{border-color:var(--green);}
#makerbar .mk.on{background:var(--green); border-color:var(--green-deep); color:#fff;}
#makerbar .mk.soon{opacity:.55;}
#makerbar .mk .st{font-size:9.5px; font-weight:700; margin-left:4px; opacity:.85;}
nav{flex:none; background:#202623; display:flex; gap:4px; padding:6px 8px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:calc(6px + env(safe-area-inset-bottom));}
nav .ni{display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfd6d1; font-size:12px; font-weight:700; padding:5px 13px; border-radius:8px; cursor:pointer; white-space:nowrap;}
nav .ni .ic{font-size:23px; line-height:1;}
nav .ni:hover{background:#333b37;}
nav .ni.on{background:var(--green); color:#fff;}
/* --- モバイル対応：ナビのあふれスクロール・縮小・セーフエリア --- */
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
nav::-webkit-scrollbar{display:none;}
@media(max-width:700px){
  nav .ni{padding:4px 8px; font-size:10px; gap:1px;}
  nav .ni .ic{font-size:19px;}
}

.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100;}
.modal-bg.open{display:flex;}
.modal{background:#fff; border-radius:12px; width:min(520px,92vw); padding:20px 22px; max-height:88vh; overflow:auto;}
.modal h3{font-size:16px; font-weight:800; color:var(--green-deep); margin-bottom:14px;}
.modal label{display:block; font-size:14px; font-weight:700; color:var(--ink-sub); margin:10px 0 3px;}
.modal input,.modal select{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px; font-size:16px;}
.modal .btns{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
.modal .btns .cancel{background:#eee; border:0; border-radius:7px; padding:9px 16px; font-weight:700; cursor:pointer;}
.modal .btns .ok{background:var(--green); color:#fff; border:0; border-radius:7px; padding:9px 20px; font-weight:800; cursor:pointer;}
.modal .btns .danger{background:#fff; color:var(--warn); border:2px solid var(--warn); border-radius:7px; padding:8px 16px; font-weight:800; cursor:pointer; margin-right:auto;}
.modal .sec{border-top:1px solid var(--line); margin-top:16px; padding-top:14px;}
.modal .sec p{font-size:12.5px; color:var(--ink-sub); margin:4px 0 8px;}
#toast{position:fixed; left:50%; bottom:78px; transform:translateX(-50%) translateY(20px); background:#1e2a24; color:#fff; padding:10px 18px; border-radius:9px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:all .25s; z-index:200; max-width:86vw;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#memBanner{display:none; background:#8a5a2b; color:#fff; font-size:12px; text-align:center; padding:4px 12px; flex:none;}
#memBanner.on{display:block;}
.back-list{display:none;}
@media(max-width:900px){
  header{padding:10px 12px; gap:10px; flex-wrap:wrap;}
  header h1{font-size:18px;}
  #viewtabs{overflow-x:auto; flex-wrap:nowrap; padding:10px 10px 0; scrollbar-width:none;}
  #viewtabs::-webkit-scrollbar{display:none;}
  #viewtabs button{white-space:nowrap; padding:8px 14px; font-size:13px;}
  .toolbar{padding:8px 10px;}
  .search{flex:1 1 100%;}
  .search input{font-size:16px;}
  .chips{margin-left:0; width:100%;}
  #list{flex:1 1 100%; max-width:none;}
  #resizer{display:none;}
  #mainview.show-detail #list{display:none;}
  #mainview:not(.show-detail) #detail{display:none;}
  #detail{border-left:0;}
  .back-list{display:inline-block; background:#3c4440; color:#fff; border:0; border-radius:7px; padding:9px 16px; font-size:14.5px; font-weight:700; cursor:pointer; margin-bottom:10px;}
  .dhead{padding:12px 12px 0;}
  .dbody{padding:12px 12px 90px;}
  .estep,.ehead{grid-template-columns:34px 1fr 1fr 70px 80px 26px;}
  .mrow .nm{display:none;}
}
</style>
<!-- ============================================================
     ★2026-07-28 画面が出るまでが遅い原因は、ここにあった。
     Zen Kaku Gothic New は日本語フォント。Googleはこれを
     「約120個に小分けした指定 × 太さ3種 ＝ 約360個の指定（81KB）」
     という形のCSSで配ってくる。ページを開くたびに、この360個の指定を
     すべて読み込んで、画面上のすべての文字と照合してから描き始めるため、
     中身の重さと関係なく、毎回まるまる待たされていた。

     実測（同一条件）：このCSSがあると画面が出るまでの時間が約2倍
       ホーム        1,152ms → 2,288ms
       現場記録帳    1,940ms → 3,592ms
       現場マップ      544ms →   532ms （このCSSを読まないページ＝変化なし）
     ※「現場マップだけ速い」のは、このページがフォントを読んでいなかったため。

     → 既定では読み込まない。iPhone内蔵の游ゴシック系（ヒラギノ）で表示する。
       下の NN_WEBFONT を true にすると、画面が出たあとに読み込んで
       Zen Kaku Gothic New に切り替える（見た目優先・表示は少し遅くなる）。
     ============================================================ -->
<script>
const NN_WEBFONT=false;       /* true にすると Zen Kaku Gothic New を後読みする */
if(NN_WEBFONT){
  addEventListener('load',()=>setTimeout(()=>{
    const l=document.createElement('link'); l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap';
    document.head.appendChild(l);
  },300));
}
</script>
<style id="nn-skin">
/* ============================================================
   NNスキン v1 — 納まりナビ共通デザインレイヤー
   （材料登録と同一トーン：Zen Kaku Gothic New／コンパクト／
     押し込みボタン／黄色選択ハイライト）
   ▼アフォーダンス原則
   ・押せる＝浮いている（グラデ＋下エッジ影＋押すと沈む）
   ・押せない情報＝フラット（影なし・光沢なし）
   ・無効＝グレー破線＋薄色（cursor:not-allowed）
   ============================================================ */
:root{
  /* green-deep/green/green-lite/paper は common.css に移動 */
  --green-hi:#48c274; --green-edge:#124a28;
  --orange:#ff9d1e; --orange-deep:#e07800; --orange-edge:#b35f00;
  --yellow:#ffd94d; --yellow-deep:#f0b400;
  --edge-gray:#8b8b81; --edge-dark:#1b201d;
}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:
    radial-gradient(circle at 18% -8%, rgba(255,255,255,.75), transparent 42%),
    repeating-linear-gradient(-45deg, rgba(46,158,88,.02) 0 22px, transparent 22px 44px),
    var(--paper);
}
b,strong{font-weight:700;}

/* ---------- ヘッダー ---------- */
header{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
    linear-gradient(180deg, var(--green-hi), var(--green) 55%, var(--green-deep)) !important;
  border-bottom:2px solid var(--green-edge);
  box-shadow:0 2px 0 rgba(0,0,0,.08);
  gap:10px; padding:5px 13px;
}
header h1{font-size:17px; font-weight:900; letter-spacing:.04em; text-shadow:0 1px 1px rgba(18,74,40,.55);}
header .hicon{font-size:19px;}
header .count{font-size:12.5px; font-weight:700;}

/* ---------- 【押せる】汎用ボタン群：浮き＋押し込み ---------- */
button.new-btn{
  background:linear-gradient(180deg,#ffffff,#e8f5ec);
  color:var(--green-deep); border:1.5px solid var(--green-deep); border-radius:8px;
  font-size:12.5px; font-weight:700; padding:4px 10px; letter-spacing:.02em; font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 var(--green-edge);
  transition:transform .06s, box-shadow .06s;
}
button.new-btn:hover{background:linear-gradient(180deg,#ffffff,#d7efdf);}
button.new-btn:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 var(--green-edge);}

.btn-ok{
  background:linear-gradient(180deg, var(--green-hi), var(--green) 60%, var(--green-deep));
  color:#fff; border:1.5px solid var(--green-edge); border-radius:8px;
  padding:7px 20px; font-size:13.5px; font-weight:700; letter-spacing:.03em; font-family:inherit;
  text-shadow:0 1px 1px rgba(18,74,40,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 var(--green-edge), 0 4px 6px rgba(0,0,0,.12);
  transition:transform .06s, box-shadow .06s;
}
.btn-ok:hover{filter:brightness(1.06); background:linear-gradient(180deg, var(--green-hi), var(--green) 60%, var(--green-deep));}
.btn-ok:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 var(--green-edge);}
.btn-ghost{
  background:linear-gradient(180deg,#ffffff,#eef6ef);
  border:1.5px solid var(--green); color:var(--green-deep); border-radius:8px;
  padding:5px 13px; font-size:12.5px; font-weight:700; font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 #9cc4a8;
  transition:transform .06s, box-shadow .06s;
}
.btn-ghost:hover{background:var(--green-lite);}
.btn-ghost:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 #9cc4a8;}
.btn-del{font-size:12px; font-weight:700; font-family:inherit;}

/* kokkosho: CTAボタン */
.cta{
  border-radius:8px; font-weight:700; font-family:inherit;
  transition:transform .06s, box-shadow .06s;
}
.cta.primary{
  background:linear-gradient(180deg, var(--green-hi), var(--green) 60%, var(--green-deep));
  border:1.5px solid var(--green-edge); color:#fff;
  text-shadow:0 1px 1px rgba(18,74,40,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 var(--green-edge);

           ['library','ライブラリ'],['zumen','図面/積算'],['shiyou','仕様・材料']];
/* rev.04 ②：用語集・設定はナビから削除（ホームの右側ボタンと同じ扱い） */
const NAV_ACTIVE='shiyou';

/* ===== 登録メーカー（選択すると該当メーカーの国交省仕様に切替。初期表示は田島） ===== */
const MAKERS=[
 {name:'田島ルーフィング', short:'田島', cat:'アス・改質アス', ready:true},
 {name:'日新工業', short:'日新工業', cat:'アス・改質アス', ready:false},
 {name:'昭石化工', short:'昭石化工', cat:'アス・改質アス', ready:false},

 {name:'ディックプルーフィング', short:'ディック', cat:'ウレタン塗膜', ready:false},

 {name:'住ベシート防水', short:'住ベ', cat:'塩ビシート', ready:false},
];

function makerObj(){ return MAKERS.find(x=>x.name===MAKER); }
function makerReady(){ const m=makerObj(); return !!(m&&m.ready); }
function buildMakerBar(){

/* 使用量文字列 → 数値（0.2（0.4）→0.2、0.4〜0.6→中央0.5、—/合計表記→null） */
function parseUsage(s){
  if(!s||s==="—")return null;
  const t=String(s).normalize("NFKC");
  if(/同上|合計|総使用量/.test(t)&&!/^[\d.]/.test(t.trim()))return null;
  const range=t.match(/([\d.]+)\s*[〜~-]\s*([\d.]+)/);
  if(range)return (parseFloat(range[1])+parseFloat(range[2]))/2;
  const m=t.match(/([\d.]+)/);
  return m?parseFloat(m[1]):null;
}

/* ================= 材料マッチング（対応製品名 → 材料マスタ） =================
   カタログ製品名・シリーズ名を長い順に走査し、対応製品文字列に含まれるものを検出 */
const NAME_INDEX=(()=>{
  const idx=[]; const seen=new Set();
  CATALOG.forEach(c=>{
    if(!seen.has(c.n)){seen.add(c.n); idx.push({key:c.n, type:'item', id:c.i, series:c.s});}
  });
  const sMap={};
  CATALOG.forEach(c=>{ (sMap[c.s]=sMap[c.s]||[]).push(c.i); });
  Object.keys(sMap).forEach(sn=>{
    if(sMap[sn].length>1 && !seen.has(sn)){seen.add(sn); idx.push({key:sn, type:'series', id:sMap[sn][0], series:sn, ids:sMap[sn]});}
  });
  idx.sort((a,b)=>b.key.length-a.key.length);
  return idx;
})();
function matchMats(text){
  if(!text||text==="—")return [];
  let t=String(text).normalize("NFKC");
  const hits=[];
  /* 「OTプライマー類」「OTコート類」→前方一致で代表候補 */
  const rui=t.match(/([A-Za-zＡ-Ｚa-z0-9ァ-ヶー・]+)類/g)||[];
  NAME_INDEX.forEach(e=>{
    if(t.includes(e.key)){ hits.push(e); t=t.split(e.key).join("＼"); }
  });
  rui.forEach(r=>{
    const pre=r.replace(/類$/,"");
    if(pre.length>=3){
      const cands=NAME_INDEX.filter(e=>e.type==='item'&&e.key.startsWith(pre));
      cands.slice(0,4).forEach(c=>{ if(!hits.some(h=>h.id===c.id))hits.push(c); });
    }
  });
  return hits;
}
const matReg=id=>materials.find(m=>m.catalogId===id);
/* 工程の㎡あたり材料費（確定材料＋単価がある場合のみ） */
function stepCost(matId,u,coef){
  const m=matReg(matId); if(!m||!(m.price>0)||!(m.cv>0))return null;
  const unitPrice=m.price/m.cv;                 /* 円/(kg,㎡,m,個…) */
  if(u!=null&&u>0){                             /* 使用量あり → kg/㎡×円/kg想定 */
    if(m.cu==="kg")return u*unitPrice;
    return null;
  }
  if(m.cu==="㎡")return (coef==null?1.0:coef)*unitPrice;   /* シート・断熱材 → 係数×円/㎡ */
  return null;
}

function matchQ(o){
  const q=document.getElementById('q').value.trim();

  const hay=[o.code,o.name,o.sub,o.src].concat((o.steps||[]).map(st=>st.w+" "+(st.p||"")+" "+(st.matName||""))).join(" ");
  return normS(hay).includes(normS(q));
}
function passSpec(o){

      <button class="btn-ok" onclick="showView('std')">📗 標準仕様プリセットから選ぶ</button></div>`;return;
  }
  if(!arr.length){list.innerHTML='<div class="empty">該当する仕様がありません。</div>';return;}
  const frag=document.createDocumentFragment();
  arr.forEach(sp=>{
    const el=document.createElement('div');
    el.className='mrow'+(sel&&sel.type==='mine'&&sel.id===sp.id?' sel':'');
    const cost=mySpecCost(sp);
    el.innerHTML=`<span class="badge" style="background:${CAT_COLOR[sp.cat]||'var(--c-cm)'}">${esc(CAT_SHORT[sp.cat]||'—')}</span>

        <span class="tag cnt">${sp.steps.length}工程</span>
      </span>`;
    el.onclick=()=>selectAndShow({type:'mine',id:sp.id});
    frag.append(el);
  });
  list.append(frag);
}

/* ================= プリセット詳細 ================= */

function matChips(hits){
  if(!hits.length)return '<span style="color:var(--ink-sub)">—</span>';
  return hits.map(h=>{
    const reg=h.type==='item'?matReg(h.id):null;
    const cls=reg?(reg.price>0?'reg':'nop'):'';
    const lb=h.type==='series'?h.key+'（サイズ選択）':h.key;
    const st=reg?(reg.price>0?'✓':'単価未'):'未登録';
    return `<span class="matchip ${cls}" title="材料ID:${h.type==='series'?h.ids.join(','):h.id}">${esc(lb)}<small>｜${st}</small></span>`;
  }).join('');
}
function renderStdDetail(d){

          <tr><th>工程</th><th>材料・工法</th><th>使用量<br>(kg/㎡)</th><th>対応製品　＋　材料マスタ照合</th><th>使用量<br>(kg/㎡)</th><th>円/㎡</th></tr>

/* ================= プリセット → マイ仕様登録 ================= */
function registerPreset(pid){
  const sp=specById[pid];
  const steps=sp.steps.map(st=>{
    const hits=matchMats(st.p);
    const first=hits.find(h=>h.type==='item');
    const u=parseUsage(st.pu);
    const mat=first?catById[first.id]:null;
    return {no:st.no, w:st.w, matId:first?first.id:null,
            matName:mat?mat.n:st.p, srcP:st.p,
            u:u, coef:(u==null&&mat&&mat.cu==='㎡')?1.0:null};
  });
  const it={id:uid(), presetId:sp.id, code:sp.code, name:sp.name, cat:sp.cat, sub:sp.sub,
            src:sp.src, ap:sp.ap, note:sp.note, steps, memo:'',
            createdAt:Date.now(), updatedAt:Date.now()};
  mySpecs.push(it); save();
  sel={type:'mine',id:it.id};
  showViewKeepSel('mine');
  toast('マイ仕様に登録しました：'+sp.code);
}
function showViewKeepSel(v){ const s=sel; showView(v); sel=s; render(); }

}

/* ================= マイ仕様：計算 ================= */
function mySpecCost(sp){
  let total=0,counted=0,uncounted=0;
  sp.steps.forEach(st=>{
    const c=st.matId?stepCost(st.matId,st.u,st.coef):null;
    if(c!=null){total+=c;counted++;}else{uncounted++;}
  });
  return {total:counted?total:null,counted,uncounted};
}

/* ================= マイ仕様 詳細（編集） ================= */

}

      <h2><input value="${esc(sp.code)}" style="width:180px;display:inline-block;margin-right:8px" onchange="edSpec('code',this.value)"><input value="${esc(sp.name)}" style="width:calc(100% - 200px);display:inline-block" onchange="edSpec('name',this.value)"></h2>

function curSpec(){ return mySpecs.find(x=>x.id===sel.id); }
function edSpec(k,v){ const sp=curSpec(); if(!sp)return; sp[k]=v; sp.updatedAt=Date.now(); save(); }
function edStep(i,k,v){
  const sp=curSpec(); if(!sp)return; const st=sp.steps[i]; if(!st)return;
  if(k==='u'||k==='coef'){ const n=parseFloat(v); st[k]=isNaN(n)?null:n; }
  else if(k==='matId'){
    st.matId=v||null;
    const mat=v?catById[v]:null;
    st.matName=mat?mat.n:(materials.find(m=>m.id===v)||{}).n||'';
    if(mat&&mat.cu==='㎡'&&st.u==null&&st.coef==null)st.coef=1.0;
  }
  else st[k]=v;
  sp.updatedAt=Date.now(); save(); render();
}
function addStep(){
  const sp=curSpec(); if(!sp)return;
  sp.steps.push({no:String(sp.steps.length+1),w:'',matId:null,matName:'',srcP:'',u:null,coef:null});
  sp.updatedAt=Date.now(); save(); render();
}
function delStep(i){
  const sp=curSpec(); if(!sp)return;
  if(sp.steps.length<=1){toast('工程は1つ以上必要です');return;}
  sp.steps.splice(i,1); sp.updatedAt=Date.now(); save(); render();
}
function dupSpec(id){
  const sp=mySpecs.find(x=>x.id===id); if(!sp)return;
  const cp=JSON.parse(JSON.stringify(sp));
  cp.id=uid(); cp.code=sp.code+'（複製）'; cp.createdAt=Date.now(); cp.updatedAt=Date.now();
  mySpecs.push(cp); save();
  sel={type:'mine',id:cp.id}; render(); toast('複製しました');
}
function delSpec(id){
  const sp=mySpecs.find(x=>x.id===id); if(!sp)return;
  if(!confirm(`「${sp.code}　${sp.name}」を削除しますか？`))return;
  mySpecs=mySpecs.filter(x=>x.id!==id);
  if(sel&&sel.type==='mine'&&sel.id===id)sel=null;
  save(); render(); toast('削除しました');
}

/* ================= CSV・バックアップ ================= */
function openDataModal(){document.getElementById('dataModal').classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}
function exportCsv(){
  if(!mySpecs.length){toast('マイ仕様がありません');return;}
  const head=['仕様ID','仕様コード','仕様名','分類','工法','出典','適用','工程','材料・工法','材料ID','使用材料','使用量(kg/㎡)','数量係数(㎡/㎡)','円/㎡','メモ'];
  const rows=[];
  mySpecs.forEach(sp=>{
    sp.steps.forEach(st=>{
      const c=st.matId?stepCost(st.matId,st.u,st.coef):null;
      rows.push([sp.id,sp.code,sp.name,sp.cat,sp.sub,sp.src,sp.ap,st.no,st.w,st.matId||'',st.matName||'',st.u??'',st.coef??'',c!=null?Math.round(c*10)/10:'',sp.memo||'']);
    });
  });
  const csv='\uFEFF'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  download(`納まりナビ_仕様登録_${new Date().toISOString().slice(0,10)}.csv`,new Blob([csv],{type:'text/csv'}));
  toast('CSVをダウンロードしました');
}
function backup(){
  download(`納まりナビ_仕様バックアップ_${new Date().toISOString().slice(0,10)}.json`,
    new Blob([JSON.stringify({app:'nn-specs',v:1,exportedAt:new Date().toISOString(),items:mySpecs},null,1)],{type:'application/json'}));
  toast('バックアップを保存しました');
}
function restore(input){
  const f=input.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!Array.isArray(d.items))throw 0;
      if(mySpecs.length&&!confirm(`現在の${mySpecs.length}件を置き換えて復元しますか？`))return;
      mySpecs=d.items; save(); sel=null; render(); toast(mySpecs.length+'件を復元しました'); closeModal('dataModal');
    }catch(e){toast('ファイルを読み込めませんでした');}
  };
  rd.readAsText(f); input.value='';
}
function wipe(){
  if(!mySpecs.length){toast('データはありません');return;}
  if(!confirm(`マイ仕様 ${mySpecs.length}件 をすべて削除します。よろしいですか？`))return;
  if(!confirm('本当に削除しますか？この操作は元に戻せません。'))return;
  mySpecs=[]; save(); sel=null; render(); toast('すべて削除しました'); closeModal('dataModal');
}

/* ================= 下部ナビ ================= */
function navGo(k,label){
  if(k===NAV_ACTIVE)return;
  if(NAV_LINKS[k]){ nnGoPage(encodeURI(NAV_LINKS[k])); }
  else alert('「'+label+'」は準備中です');
}
/* ページ移動：押した瞬間に画面がフェードし始めるので「固まった」感じがなくなる */
window.nnGoPage=function(url){
  /* ★指を離した瞬間（＝タップした瞬間）に、画面いちばん上へ細い進行バーを出す。
     次のページが出来上がるまでの数百ミリ秒、「反応した」ことが必ず目に見える。
     画面は隠さないので、前の画面はそのまま見えたまま。 */
  try{
    if(!document.getElementById('nnbar')){
      const bar=document.createElement('div'); bar.id='nnbar'; bar.innerHTML='<i></i>';
      document.body.appendChild(bar);
      setTimeout(()=>{try{bar.remove();}catch(_){}} ,4000);   /* 念のための自動消去 */
    }
  }catch(_){}
  document.body.classList.add('nn-leaving');
  location.href=url;
};
/* ★先読みの fetch は削除（2026-07-28）。
   ページは端末に保存済みなので先読みの意味がなく、指が触れた瞬間に
   別の取得処理を走らせることで、肝心の画面移動と処理を取り合っていた。 */
function buildNav(){
  const n=document.getElementById('nav');
  n.innerHTML=NAV.map(([k,l])=>{
    const suf=(k===NAV_ACTIVE)?'_on':'';
    return `<div class="ni ${k===NAV_ACTIVE?'on':''}" onclick="navGo('${k}','${l}')">
      <span class="ic"><img src="./icons/nav_${k}${suf}.png" alt="${l}"
        onload="this.closest('.ni').classList.add('hasimg')"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='./icons/nav_${k}.png';}
                 else{this.outerHTML=ICONS['${k}']||'▫️';}"></span><span>${l}</span></div>`;
  }).join('');
  /* あふれ時：アクティブなボタンを中央に
     ★位置の計測（scrollWidth や getBoundingClientRect）は「画面をいったん組み上げる」
       処理なので、ここで行うと画面が出るまでの待ち時間が伸びる。
       画面を出したあと（次の描画のタイミング）にまわす。 */
  addEventListener('load',()=>{
    const on=n.querySelector('.ni.on');
    if(on && n.scrollWidth>n.clientWidth){
      const d=on.getBoundingClientRect().left-n.getBoundingClientRect().left;
      n.scrollLeft+=d-(n.clientWidth-on.offsetWidth)/2;
    }
  },{once:true});
}

/* ================= リサイザー ================= */
(function(){
  const rz=document.getElementById('resizer'), list=document.getElementById('list');
  let drag=false;
  rz.addEventListener('mousedown',e=>{drag=true; rz.classList.add('on'); e.preventDefault();});
  addEventListener('mousemove',e=>{if(!drag)return;
    const w=Math.min(Math.max(e.clientX,280),innerWidth*0.68);
    list.style.flex='0 0 '+w+'px'; list.style.maxWidth=w+'px';});
  addEventListener('mouseup',()=>{drag=false; rz.classList.remove('on');});
})();

/* ================= 起動 ================= */
load();
window.NN_SPEC={version:1,presets:SPECS,getSpecs:()=>JSON.parse(JSON.stringify(mySpecs)),storageKey:SPEC_KEY};
buildNav(); buildMakerBar();
buildChips();
render();
</script>

<script>
/* ============================================================
   スマホ表示モード切替

     ピンチ（指を広げる）でいつでも拡大可能。

   右下の丸ボタンで切替。設定は端末に記憶され全ページ共通。
   ============================================================ */
(function(){
  const KEY='nn_view_mode', VW=980;
  const vp=document.querySelector('meta[name="viewport"]');
  const phone=Math.min(screen.width,screen.height)<700;
  function getMode(){ try{return localStorage.getItem(KEY)||'ichiran';}catch(e){return 'ichiran';} }
  function apply(m){
    if(m==='ichiran'){ vp.setAttribute('content','width='+VW+', user-scalable=yes, viewport-fit=cover'); }
    else{ vp.setAttribute('content','width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover'); }
    try{localStorage.setItem(KEY,m);}catch(e){}
    const b=document.getElementById('vmToggle');
    if(b){
      b.textContent=(m==='ichiran'?'📱 モバイル表示':'🗂 一覧表示');
      /* 一覧モードは全体が縮小されるためボタンは大きめに作る */
      b.style.fontSize=(m==='ichiran'?'26px':'13px');
      b.style.padding=(m==='ichiran'?'14px 22px':'8px 14px');
      b.style.bottom=(m==='ichiran'?'120px':'72px');
    }
  }
  window.nnToggleView=function(){ apply(getMode()==='ichiran'?'mobile':'ichiran'); };
  if(!phone){ vp.setAttribute('content','width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover'); return; }
  apply(getMode());
  /* 「モバイル表示」切替ボタンは廃止（画面上の残像文字を解消） */
})();
</script>
<!-- ============ ゲーム風タップ音＋タッチ発光エフェクト ============ -->
<style>
/* タッチ位置の発光（黄白のグロー＋広がるリング） */
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);
  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .55s ease-out forwards;
}
.tapfx::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:2px solid rgba(255,217,77,.9);
  animation:tapfx-ring .55s ease-out forwards;
}
@keyframes tapfx-glow{
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
  60%{opacity:.7;}
  100%{opacity:0; transform:translate(-50%,-50%) scale(2.1);}
}
@keyframes tapfx-ring{
  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.45);}
}
</style>
<script>
(function(){
  /* ---------- ゲーム風タップ音（Web Audio合成・音源ファイル不要） ---------- */
  let AC=null;
  function ctx(){
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  function tapSound(){
    try{
      const c=ctx(), t=c.currentTime;
      // やわらかい水滴風の「ぽん」：低めのサイン波2音（耳に優しい音量）
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(523,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.06,t+0.010);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.15);
      // 軽く上に抜ける倍音
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(784,t);
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.03,t+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
      o2.connect(g2).connect(c.destination);
      o2.start(t+0.005); o2.stop(t+0.12);
    }catch(e){}
  }

  /* ---------- タッチ発光 ---------- */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    /* ★2026-08-13j パソコンの表示倍率（zoom）で割ること。
       clientX/Y は倍率を**かけた後**のpx、style.left/top は倍率を**かける前**のpx。
       割らないと、大きいモニターほど発光が右下の見当違いな場所に出る（§61の落とし穴）。 */
    const _z=window.nnPZ||1;
    el.style.left=(x/_z)+'px'; el.style.top=(y/_z)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 600);
  }

  /* ---------- イベント委譲 ----------
     発光＝画面のどこを触っても出す（触った場所のフィードバック）
     音　＝押せる要素（ボタン・ナビ・チップ・行）に当たったときだけ鳴らす */
  const PRESSABLE='button, .chip>button, .mk, .mrow, .tabs button, #viewtabs button, .btn-ok, .btn-ghost, .sortbtn, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    /* ★下部ナビは専用の音（nav_move.wav）を鳴らすので、ここでは鳴らさない。
       [onclick] にナビも含まれてしまい、1回のタップで2種類の音が重なって
       「ココンコン」と聞こえていた原因。 */
    const tc=(e.target&&e.target.closest)?e.target:null;
    const hit=(!tc||tc.closest('nav .ni'))?null:tc.closest(PRESSABLE);
    if(hit && !hit.disabled && !hit.classList.contains('soon')){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();
</script>

      document.documentElement.style.removeProperty('--navpad'); return;
    }
    const sw=screen.width||393, sh=screen.height||852;
    const land=innerWidth>innerHeight;
    const dev=land?Math.max(sw,sh):Math.min(sw,sh);
    document.documentElement.setAttribute('data-nnland',land?'1':'0');
    const base=dev>760?46:40;
    const k=Math.max(1,VW/dev);
    document.documentElement.style.setProperty('--navicon',(base*k).toFixed(1)+'px');
    document.documentElement.style.setProperty('--navpad',(2*k).toFixed(1)+'px');
    document.documentElement.style.setProperty('--navgap',((land?8:7)*k).toFixed(1)+'px');
  }
  navScale();
  addEventListener('resize',navScale);
  addEventListener('orientationchange',()=>setTimeout(navScale,300));
  addEventListener('DOMContentLoaded',navScale);
})();
</script>
<script>
/* ページ移動を通信ゼロで一瞬にする（サービスワーカーで全ページを端末に常駐させる） */
/* ============ 版チェック（2026-07-28） ============
   端末には速さのためページを保存しているので、こちらで直しても
   古いものが出続けることがある。そこで ver.txt（数バイト）だけを
   毎回見に行き、公開版と違っていたら保存分を捨てて1回だけ読み直す。
   ★公開のたびに ver.txt と、下の NN_VER を同じ文字に更新すること。 */
const NN_VER='2026-08-24ai';
/* ============ 表示にかかった時間の記録（原因調査用・2026-07-28） ============
   スマホの実機でどこに時間がかかっているかを数字で出す。
   ・net  ＝ページを要求してから最初の返事が来るまで（通信の待ち）
   ・recv ＝中身を受け取り終わるまで
   ・build＝受け取ってから組み立て終わるまで（解析・JS実行）
   ・paint＝画面に中身が出たとき
   結果はホーム画面の左上に出る。原因が分かったらこの仕組みごと外す。 */
addEventListener('load',()=>{setTimeout(()=>{
  try{
    const n=performance.getEntriesByType('navigation')[0]; if(!n)return;
    const fcp=performance.getEntriesByType('paint').filter(p=>p.name==='first-contentful-paint')[0];
    const rs=performance.getEntriesByType('resource');
    let slow=null, rkb=0, fontMs=0, fontN=0;
    rs.forEach(r=>{ rkb+=(r.transferSize||0);
      if(!slow||r.duration>slow.duration)slow=r;
      if(/fonts\.(googleapis|gstatic)/.test(r.name)){fontN++; fontMs=Math.max(fontMs, Math.round(r.responseEnd));}});
    const rec={p:(location.pathname.split('/').pop()||'index').replace('.html','').slice(0,8),
      net:Math.round(n.responseStart), recv:Math.round(n.responseEnd),
      build:Math.round(n.domContentLoadedEventEnd), paint:fcp?Math.round(fcp.startTime):-1,
      load:Math.round(n.loadEventEnd), kb:Math.round((n.transferSize||0)/1024),
      res:rs.length, rkb:Math.round(rkb/1024), fn:fontN, fms:fontMs,
      sl:slow?((slow.name.split('/').pop()||'').slice(0,14)+':'+Math.round(slow.duration)):''};
    const a=JSON.parse(sessionStorage.getItem('nnPerf')||'[]'); a.push(rec);
    sessionStorage.setItem('nnPerf',JSON.stringify(a.slice(-7)));
  }catch(_){}
},400);});
const NN_PAGES=['./index.html','./kirokucho_demo.html','./zumen_sekisan.html','./genba_map_v36.html','./hacchu.html',
  './kokkosho.html','./camera.html','./library.html','./shiyo_toroku.html','./zairyo_toroku.html','./yougo.html','./common.css'];
window.nnVerNow=NN_VER;
(async function(){
  try{
    const r=await fetch('./ver.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const v=(await r.text()).trim();
    window.nnVerNew=v;
    if(!v || v===NN_VER)return;
    /* ★2026-07-28 修正：以前は保存分を消して読み直すだけだったが、
       Safari自身が持っている一時保存（HTTPキャッシュ）は消えないため、
       読み直しても古いページが出続けて更新が止まることがあった。
       全ページを cache:'reload' で取り直してから読み直す。 */
    const n=parseInt(sessionStorage.getItem('nnUpdN_'+v)||'0',10);
    if(n>=2)return;                                   /* 失敗が続いたら止める安全弁 */
    sessionStorage.setItem('nnUpdN_'+v,String(n+1));
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    await Promise.all(NN_PAGES.map(u=>fetch(u,{cache:'reload'}).catch(()=>{})));
    location.reload();
  }catch(_){}
})();
</script>
<script>
/* ★2026-07-28：更新が端末に届かない問題への対策
   ・毎回「新しい版が出ていないか」を確認する（r.update()）
   ・新しい版に切り替わったら、その場で1回だけ自動で読み込み直す
     （＝「再読み込み2回」が不要になり、直したことが必ず反映される） */
/* ★2026-07-28 検証：サービスワーカーを一時的に止める
   ホーム(37KB)も現場記録帳(300KB)も、どちらもタップから約0.9秒。
   中身の重さが10倍近く違うのに時間が同じ＝ページの組み立てではなく、
   移動のたびにかかる「決まった待ち時間」がある、ということ。
   iPhoneのSafariでは、この保存の仕組み（サービスワーカー）が
   眠っていると、移動のたびに起こす時間が数百ミリ秒かかることが知られている。
   → いったん止めて、これが原因かを確かめる。
   NN_USE_SW を true に戻せば、オフライン対応ごと元に戻せる。 */
const NN_USE_SW=false;
if('serviceWorker' in navigator){
  if(NN_USE_SW){
    let nnReloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(nnReloaded)return; nnReloaded=true; location.reload();
    });
    addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(r=>{
        try{r.update();}catch(_){}
        if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage('nn-precache');
      }).catch(()=>{});
    });
  }else{
    /* すでに入っている分を取り除き、保存分も消す（1回だけ読み直す） */
    addEventListener('load',async()=>{
      try{
        const rs=await navigator.serviceWorker.getRegistrations();
        if(rs.length){
          await Promise.all(rs.map(r=>r.unregister()));
          if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));}
          if(!sessionStorage.getItem('nnSwOff')){ sessionStorage.setItem('nnSwOff','1'); location.reload(); }
        }
      }catch(_){}
    });
  }
}
</script>
<script>
/* ============ ナビの操作音（2026-07-28 作り直し） ============
   ★以前は <audio> を2個ずつ用意して音源ファイル(nav_move.wav)を
     読ませていたが、iPhoneでは音声部品の準備が重く、しかも
     いつ終わるか読めないため、画面が出るまでの待ち時間に影響していた。
     → 音源ファイルをやめ、その場で音を合成する方式（Web Audio）に変更。
       ファイル読み込みゼロ・部品ゼロ・音は今までと同じ「やわらかい1音」。
   ============================================================ */
(function(){
  /* ★2026-07-28 音が出たり出なかったりした原因
     ①音の装置(AudioContext)を「ナビを最初に押したとき」に作っていた。
       iPhoneでは作った直後は停止状態で、動き出すまでに少し時間がかかるため、
       その1回目の音が鳴らないことがあった。
     ②画面移動が0.09秒後に始まるので、音が長いと途中で切れていた。
     → 装置は「画面のどこかを最初に触った時点」で作って動かしておく。
       音は0.07秒に短くして、移動が始まる前に鳴り終わるようにする。 */
  let AC=null, last=0;
  function make(){
    if(AC)return AC;
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    try{ AC=new C(); }catch(_){ return null; }
    /* 無音を1粒だけ鳴らして、iPhoneの音の仕組みを起こしておく */
    try{ const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
         s.buffer=b; s.connect(AC.destination); s.start(0); }catch(_){}
    return AC;
  }
  function unlock(){ const c=make(); if(c && c.state==='suspended'){ try{c.resume();}catch(_){} } }
  addEventListener('pointerdown',unlock,{passive:true,capture:true});
  addEventListener('touchstart',unlock,{passive:true,capture:true});
  /* 画面が戻ってきたときは、止まっている音の装置を起こし直す
     （iPhoneは他のアプリに切り替えると止めることがある） */
  function wake(){ const c=AC; if(c && c.state!=='running'){ try{c.resume();}catch(_){} } }
  addEventListener('pageshow', wake);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) wake(); });

  /* 実際に音を出す部分。ここは「装置が動いている」ときだけ呼ぶ */
  function beep(c){
    const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t);        /* ラの音・単純でやわらかい */
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.38,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.07);
  }

  /* ★2026-07-31 「鳴ったり鳴らなかったり」の直し方
     iPhoneは、ページを開いた直後の音の装置が「止まった状態」で始まる。
     動き出す（resume）のは少し後なので、押してすぐ画面が変わると
     音が鳴る前に前のページが消えてしまう＝無音になっていた。
     そこで
       ・鳴らせたかどうかを返す（true＝すぐ鳴った）
       ・すぐ鳴らせなかったときは、動き出したら鳴らす（nnSoundReady で待てる）
     ようにして、ナビ側が「音が出るのを待ってから画面を移る」ようにした。 */
  window.nnSoundReady=null;
  window.nnMoveSound=function(){
    const now=Date.now(); if(now-last<160)return true; last=now;   /* 連続再生を抑える */
    try{
      const c=make(); if(!c)return true;
      if(c.state==='running'){ beep(c); return true; }
      /* まだ動いていない：起こしてから鳴らす。ナビ側はこれを待てる */
      window.nnSoundReady=new Promise(function(res){
        let done=false;
        const fire=function(){ if(done)return; done=true; try{ beep(c); }catch(_){} res(); };
        try{ const p=c.resume(); if(p&&p.then) p.then(fire, fire); else fire(); }catch(_){ fire(); }
        setTimeout(fire, 120);      /* 起きなくても待たせすぎない */
      });
      return false;
    }catch(_){ return true; }
  };
})();
</script>
<script>
/* ============ ナビ：指を触れたまま移動できる操作（2026-07-28 改） ============
   ・指を置いた瞬間にアイコンが光って音が鳴る
   ・そのまま 0.09秒 指が止まっていれば、離すのを待たずに移動する（＝速い）
   ・押したまま横へなぞると指の下のアイコンが反応し、離した先へ移動する
   ・アイコンの外で離せば移動しない（やめられる）
   ============================================================ */
(function(){
  const nav=document.getElementById('nav')||document.querySelector('nav');
  if(!nav)return;
  let dragging=false, cur=null;
  const itemAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('nav .ni'):null; };
  let lastSnd=0;
  function focus(ni){
    if(ni===cur)return;
    if(!ni)return;                     /* アイコンの隙間に指がかかっても、直前の選択を保つ
                                          （指のわずかな揺れで音が連発するのを防ぐ） */
    if(cur)cur.classList.remove('press');
    cur=ni; cur.classList.add('press');
    /* 音を鳴らす。すぐ鳴らせなかったときは、移動を少しだけ待つ（下の go を参照） */
    sndNow=true;
    if(window.nnMoveSound)try{ sndNow=(nnMoveSound()!==false); }catch(_){}
    /* ★先読みの fetch は削除（2026-07-28）。移動処理と取り合って遅くなっていた。 */
  }
  /* ★ここが「遅い」の正体だった（2026-07-28 画面録画の実測で判明）
     以前は「指を離したとき」に初めて移動していた。画面録画を1コマずつ調べると、
     アイコンが光ってから画面が変わるまで約0.9秒、その間まったく何も起きていない。
     ＝ページの読み込みが遅いのではなく、指を離すまで移動を始めていなかった。
     そこで「指を置いて 0.09秒たっても動かさなければ、離すのを待たずに移動する」
     方式にした。なぞって選び直したい場合（指を動かした場合）は今までどおり、
     指を離した先のアイコンへ移動する。 */
  const HOLD_MS=90;          /* この時間だけ指が止まっていたら、離すのを待たずに移動 */
  const MOVE_PX=10;          /* この距離より動いたら「なぞり操作」とみなす */
  let goTm=0, downPt=null, gone=false;
  let sndNow=true;
  function go(t){
    if(gone)return;
    if(!t||t.classList.contains('on'))return;
    const m=(t.getAttribute('onclick')||'').match(/navGo\('([^']*)'\s*,\s*'([^']*)'\)/);
    if(!(m&&typeof navGo==='function'))return;
    gone=true;
    /* ★音がすぐ鳴ったときは今までどおり即移動（速さは変えない）。
       鳴らなかったときだけ、音が出るのを最大0.16秒待ってから移動する。 */
    if(sndNow || !window.nnSoundReady){ navGo(m[1],m[2]); return; }
    let moved=false;
    const jump=function(){ if(moved)return; moved=true; navGo(m[1],m[2]); };
    try{ window.nnSoundReady.then(function(){ setTimeout(jump, 30); }); }catch(_){}
    setTimeout(jump, 160);
  }
  function cancelHold(){ if(goTm){clearTimeout(goTm); goTm=0;} }
  nav.addEventListener('pointerdown',e=>{
    const ni=e.target.closest&&e.target.closest('.ni'); if(!ni)return;
    dragging=true; cur=null; gone=false; downPt=[e.clientX,e.clientY]; focus(ni);
    try{nav.setPointerCapture(e.pointerId);}catch(_){}
    cancelHold();
    goTm=setTimeout(()=>{ goTm=0; go(cur); }, HOLD_MS);
  });
  nav.addEventListener('pointermove',e=>{
    if(!dragging)return;
    if(downPt && Math.abs(e.clientX-downPt[0])+Math.abs(e.clientY-downPt[1])>MOVE_PX) cancelHold();
    focus(itemAt(e.clientX,e.clientY));
  });
  function finish(e){
    if(!dragging)return;
    dragging=false; cancelHold();
    const t=cur; if(cur){cur.classList.remove('press'); cur=null;}
    go(t);
  }
  nav.addEventListener('pointerup',finish);
  nav.addEventListener('pointercancel',()=>{dragging=false; cancelHold(); if(cur){cur.classList.remove('press'); cur=null;}});
  /* 上の処理で移動するので、通常のクリックは止める（二重に移動しないように） */
  nav.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); },true);
})();
</script>

<script id="nn-btmsafe">
/* ============================================================
   たて画面で、下部ナビの下側が画面の外に切れるのを防ぐ（2026-07-29）
   ------------------------------------------------------------
   このページは「一覧モード」のとき、画面を幅980で組み立ててから
   端末の幅に合わせて縮めて表示している。
   iPhoneを「たて」に持つと 393px 幅なので、縮小率は約0.40。
   このとき、画面下端のホームバー用に確保している余白も同じだけ
   縮んでしまい、実際には5〜6px程度しか空かない。
   その結果、ナビの下の段（カメラ・ライブラリなど）の文字が
   ホームバーに重なって「下が見切れている」状態になっていた。
   ここでは、縮小率のぶんだけ余白を大きくして渡し直す。
   ・縮めずに表示している画面（倍率1）では 0 なので、見た目は今まで通り。
   ・レイアウト（並び方・大きさ）は一切変えない。下端の余白だけを直す。
   ============================================================ */
(function(){
  var MIN_REAL = 16;   /* 実際の画面で確保したい下余白（px） */
  function fit(){
    var pr = true;
    try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = innerHeight > innerWidth; }
    var dev = pr ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    var k = (dev > 0) ? (innerWidth / dev) : 1;
    /* 縮めて表示しているときだけ効かせる（等倍のときは 0＝今まで通り） */
    var v = (k >= 1.5) ? Math.round(MIN_REAL * k) : 0;
    document.documentElement.style.setProperty('--nnsabmin', v + 'px');
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
  addEventListener('load', fit, {once:true});
})();
</script>

<script id="nn-fillh-js">

   画面のいちばん下まで使い切る（2026-07-29）
   ・--nnvh ＝ 実際に見えている画面の高さ
   ・表示中の画面（一覧・ダッシュボード等）の下に余りがあれば、そのぶん伸ばす
   　（すき間があるときだけ動くので、余りが無ければ何もしない）
   ============================================================ */
(function(){
  var VIEWS = null;
  /* ホーム画面のアイコンから起動しているか（＝全画面のアプリとして開いているか） */
  function isStandalone(){
    try{
      if(navigator.standalone === true) return true;
      return matchMedia('(display-mode: standalone)').matches
          || matchMedia('(display-mode: fullscreen)').matches;
    }catch(e){ return false; }
  }
  /* 画面のいちばん下に貼っておく、見えない1pxの目印。
     ★iPhoneをたてに持つと、端末が申告してくる「画面の高さ」が
       実際に見えている高さより小さいことがある（このページのように
       画面を縮めて表示していると起きる）。その申告値をそのまま使うと、
       画面の下のほうに何も置かれない帯（すき間）が残ってしまう。
       目印は画面の下端に貼り付いているので、その位置を測れば
       「本当の下端」が分かる。 */
  var probe = null;
  function probeBottom(){
    if(!probe || !probe.parentNode){
      probe = document.createElement('div');
      probe.id = 'nnBtmProbe';
      probe.setAttribute('style','position:fixed;left:0;bottom:0;width:1px;height:1px;'
        + 'pointer-events:none;opacity:0;z-index:-1;');
      (document.body || document.documentElement).appendChild(probe);
    }
    return probe.getBoundingClientRect().bottom;
  }
  function pageH(){
    var vv = window.visualViewport;
    var h = innerHeight;
    /* 文字入力でキーボードが出ると visualViewport は小さくなるので、大きいほうを採る */
    if(vv && vv.height > h) h = vv.height;
    /* 目印のほうが下にあれば、そちらが本当の下端。
       ブラウザで開いているときは下のバーの分だけ縮むのが正しいので、この直しは
       ホーム画面から起動したときだけ効かせる。あり得ない大きさは念のため採らない。 */
    if(isStandalone()){
      var t = probeBottom();
      if(t > h + 1 && t < h * 3) h = t;
    }
    return Math.round(h);
  }
  /* ★2026-08-24aa 0.8秒ごとの見直しは「変わったときだけ」にする。
     この処理は画面の高さを測り直すので、そのたびに**画面ぜんぶの置き場所の計算**が走る。
     ・窓の大きさ ・下部ナビの出入り ・表示中の画面 ・表示倍率
     のどれも変わっていなければ、測らずにそのまま戻る（見え方は今までどおり）。
     中身の高さが変わったときは、呼ぶ側が fill(true) で「必ず測る」と伝える。 */
  var _fsig='';
  function fillSig(){
    var vv=window.visualViewport, nav=document.getElementById('nav');
    var s=[window.innerWidth, window.innerHeight,
           vv?Math.round(vv.width)+'x'+Math.round(vv.height):'-',
           nav?(nav.style.marginBottom+'|'+nav.style.transform+'|'+nav.className):'-',
           window.nnPZ||1];
    if(VIEWS) for(var i=0;i<VIEWS.length;i++){
      var e=document.getElementById(VIEWS[i]);
      s.push(e?(e.className+'/'+(e.style.display||'')):'-');
    }
    return s.join(',');
  }
  function fill(force){
    if(!force){ var sg=fillSig(); if(sg===_fsig) return; _fsig=sg; }
    else _fsig=fillSig();
    /* ★2026-08-11a パソコンで表示倍率（zoom）をかけているときは、
       innerHeight（実画面のpx）をそのまま使うと body の高さが倍率ぶん大きくなる。
       倍率で割って「CSSのpx」に直す。 */
    var _z = window.nnPZ || 1;
    var pb = pageH() / _z;
    document.documentElement.style.setProperty('--nnvh', pb + 'px');
    if(_z !== 1){                      /* 倍率をかけているときは下の余白うめをしない（パソコン用） */
      if(VIEWS) VIEWS.forEach(function(id){ var e=document.getElementById(id); if(e) e.style.minHeight=''; });
      return;
    }
    if(!VIEWS) return;
    var v = null;
    for(var i=0;i<VIEWS.length;i++){
      var e = document.getElementById(VIEWS[i]);
      if(e && e.offsetParent !== null){ v = e; break; }
    }
    if(!v) return;
    /* 下部ナビが場所を取っている高さ（自動で隠れているときは 0） */
    var navOcc = 0;
    var nav = document.getElementById('nav');
    if(nav){
      var ns = getComputedStyle(nav);
      if(ns.display !== 'none' && ns.position !== 'fixed' && ns.position !== 'absolute'){
        var mb = parseFloat(nav.style.marginBottom || '0') || 0;   /* 隠れているときは負の値 */
        navOcc = Math.max(0, nav.offsetHeight + mb);
      }
    }
    if(v.style.minHeight) v.style.minHeight = '';      /* いったん元に戻して測る */
    var r = v.getBoundingClientRect();
    var gap = (pb - navOcc) - r.bottom;                 /* 下に余っている高さ */
    if(gap > 2) v.style.minHeight = Math.round(r.height + gap) + 'px';
  }
  fill(true);
  addEventListener('load', function(){ fill(true); });
  addEventListener('resize', function(){ fill(true); });
  addEventListener('orientationchange', function(){ setTimeout(function(){ fill(true); }, 300); });
  setInterval(fill, 800);        /* ナビの自動開閉・画面の切替に追従する */
  window.nnFillBottom = fill;
})();
</script>

<script id="nn-countbar">
/* ============================================================

  var total=0;

    + ((total && total!==shown) ? ' <span class="all">／ 全 '+total+unit+'</span>' : '');

<script id="nn-hdr-std-js">
/* 倍率 --nnhm を計算して渡す（＝そのページの組み立て幅 ÷ 980） */
(function(){
  function set(){
    try{
      /* ★パソコンでは倍率1（＝今までどおり）にすること。
         パソコンのブラウザは viewport の width=980 指定を無視するため、
         画面を縮めて表示していない。ここで innerWidth/980 を掛けると
         ヘッダーだけ1.5倍に膨らんでしまう。 */
      var dev = Math.min(screen.width || 0, screen.height || 0);
      var phone = dev && dev < 700;
      var m = phone ? ((innerWidth || 980) / 980) : 1;
      if(!(m > 0.05 && m < 4)) m = 1;              /* あり得ない値は採らない */
      document.documentElement.style.setProperty('--nnhm', m.toFixed(4));
      /* ノッチの逃げの割り増し（＝そのページの縮小率の逆数）。
         いま向いている方の画面の幅で計算すること。 */
      var pr = true;
      try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = innerHeight > innerWidth; }
      var scr = pr ? Math.min(screen.width||0, screen.height||0) : Math.max(screen.width||0, screen.height||0);
      var saf = (phone && scr > 0) ? ((innerWidth || scr) / scr) : 1;
      if(!(saf > 0.5 && saf < 5)) saf = 1;
      document.documentElement.style.setProperty('--nnsaf', saf.toFixed(4));
    }catch(e){}
  }
  set();
  addEventListener('resize', set);
  addEventListener('orientationchange', function(){ setTimeout(set, 300); });
  addEventListener('load', set, {once:true});
})();
</script>

html:not([data-nnphone="1"]){ --nnnavw:86px; }
html:not([data-nnphone="1"]) body{ padding-left:var(--nnnavw) !important; }
html:not([data-nnphone="1"]) nav,
html:not([data-nnphone="1"]) nav#nav,
html:not([data-nnphone="1"]) body>nav{
  position:fixed !important; left:0 !important; right:auto !important;
  top:0 !important; bottom:0 !important;
  width:var(--nnnavw) !important; height:auto !important; max-height:none !important;
  flex-direction:column !important; flex-wrap:nowrap !important;
  justify-content:flex-start !important; align-items:center !important;
  gap:6px !important;
  padding:10px 4px calc(10px + env(safe-area-inset-bottom,0px)) 4px !important;
  overflow-y:auto !important; overflow-x:hidden !important;
  /* ★自動で隠れる動き（marginBottom と translateY）を打ち消す。
     インラインの style よりCSSの !important のほうが強い。 */
  margin:0 !important; transform:none !important;
  border-top:none !important; border-right:2px solid #0d2a18 !important;
  z-index:70 !important;
}
html:not([data-nnphone="1"]) nav::-webkit-scrollbar,
html:not([data-nnphone="1"]) nav#nav::-webkit-scrollbar{ width:0; display:none; }
html:not([data-nnphone="1"]) nav .ni,
html:not([data-nnphone="1"]) nav#nav .ni{
  margin:0 !important; padding:2px 0 !important; width:100% !important;
}
html:not([data-nnphone="1"]) nav .ni.hasimg,
html:not([data-nnphone="1"]) nav#nav .ni.hasimg{ margin:0 !important; }
html:not([data-nnphone="1"]) nav .ni .ic img,
html:not([data-nnphone="1"]) nav#nav .ni .ic img{
  height:auto !important; width:calc(var(--nnnavw) - 18px) !important; margin:0 auto !important;
}
/* 右下の▲（隠れたナビを出すボタン）はパソコンでは使わない */
html:not([data-nnphone="1"]) #navShowTab{ display:none !important; }
/* 画面いっぱいに広げている固定の部品を、左のナビのぶんだけ右へ寄せる */
html:not([data-nnphone="1"]) #nnver{ left:calc(var(--nnnavw) + 6px) !important; }
html:not([data-nnphone="1"]) #nnbar{ left:var(--nnnavw) !important; }
html:not([data-nnphone="1"]) #setup{ left:var(--nnnavw) !important; }
</style>

<style id="nn-pczoom">
/* ★2026-08-11a パソコンの「表示の大きさ」をモニターに関わらずそろえる（本人の指示）
   ------------------------------------------------------------------
   同じ拡大100%でも、大きいモニター（横に広い）ほど1画面に入るpxが増えるので、
   文字やボタンが相対的に小さく見える。そこで
     倍率 ＝ 画面の横幅 ÷ 1600px（1.00〜1.60の範囲）
   を html に zoom でかけ、どのモニターでも同じ見え方になるようにした。
   ★スマホ（data-nnphone="1"）は今までどおり。倍率はかけない。
   ★2026-08-11b：手動の倍率ボタンは削除（パソコンはブラウザの拡大縮小が使えるため）。 */
</style>
<script id="nn-pczoom-js">
(function(){
  if(document.documentElement.getAttribute('data-nnphone')==='1'){ window.nnPZ=1; return; }
  var BASE=1600, MINZ=1.00, MAXZ=1.60;
  function autoZ(){
    var z=(window.innerWidth||1600)/BASE;
    z=Math.round(z*20)/20;                       /* 0.05きざみ */
    return Math.min(MAXZ, Math.max(MINZ, z));
  }
  function apply(){
    var z=autoZ();
    window.nnPZ=z;
    document.documentElement.style.zoom = (z===1 ? '' : z);
    document.documentElement.style.setProperty('--nnpzr', z);
    document.documentElement.setAttribute('data-nnpz', z===1 ? 'off' : 'on');
    try{ if(window.nnFillBottom) window.nnFillBottom(); }catch(e){}
    try{ if(window.nnFitMapApp) window.nnFitMapApp(); }catch(e){}
    try{ if(window.nnSecRefresh) window.nnSecRefresh(); }catch(e){}
  }
  apply();
  addEventListener('resize', apply);
})();
</script>

<style id="nn-httl">
/* ★2026-08-16r 付箋タグの見出し（現場記録帳と同じ）＋そのすぐ下の境界線。
   本人の指示「現場一覧のページにある、付箋タグとの境界線。これ他のページにも付与して」。
   ★形は ::before の斜めの箱で作り、文字は本体に置く（文字はまっすぐのまま読める）。
   ★大きさは指定しない＝各ページの h4 の文字サイズをそのまま使う（ページごとの統一を壊さない）。 */
.panel > h4, .wr-box > h4, .dpanel > h4, .proc-card > h4{
  position:relative; z-index:1; overflow:visible !important;
  padding-bottom:7px !important; margin-bottom:9px !important;
  border-bottom:2px solid #bcd3c4;
}
.httl{
  position:relative !important; z-index:0 !important;
  display:inline-flex !important; align-items:center !important; justify-content:flex-start !important;
  background:none !important; border:0 !important; border-radius:0 !important; box-shadow:none !important;
  color:#000 !important; font-family:inherit !important; font-weight:900 !important;
  -webkit-text-stroke:.3px #000;
  letter-spacing:.04em !important; line-height:1 !important;
  text-shadow:0 1px 0 rgba(255,255,255,.60) !important;
  white-space:nowrap !important; flex:0 0 auto !important;
  padding:9px 22px !important; margin:2px 12px 2px 10px !important;
}
.httl::before{
  content:'' !important; display:block !important;
  position:absolute; left:0; right:0; top:0; bottom:0; z-index:-1;
  pointer-events:none;                    /* 飾りなので当たり判定に入れない */
  transform:skewX(-19deg); border-radius:2px;
  background:linear-gradient(180deg,
      #a4e3bd 0%, #e6fbee 11%, #e1f9ea 36%,
      #96e3b6 40%, #8ddfae 90%, #63c48f 100%);
  border:2px solid #2f9e60;
  box-shadow:2px 3px 3px rgba(50,72,60,.38);
}
html[data-nnphone="1"] .httl{ padding:6px 15px !important; margin:2px 9px 2px 7px !important; }
html[data-nnphone="1"] .httl::before{ border-width:1.5px; box-shadow:1px 2px 2px rgba(50,72,60,.38); }
html[data-nnphone="1"] .panel > h4, html[data-nnphone="1"] .wr-box > h4,
html[data-nnphone="1"] .proc-card > h4{
  padding-bottom:4px !important; margin-bottom:6px !important; }
</style>
<script id="nn-httl-js">
/* 見出しの文字だけを span.httl で包む。
   ★右端に置く補助の文字（.r／.cta など）は包まない＝タグの外に残す。
   ★中身を作り直すページ（国交省仕様・ライブラリ等）があるので、
     作り直されたら包み直す（MutationObserver・0.2秒のまとめ）。 */
(function(){
  var SEL='.panel > h4, .wr-box > h4, .dpanel > h4, .proc-card > h4, .notebox-h > h4';
  var STOP=/(^|\s)(r|cta|zx|colgear|sub|hcount|tag)(\s|$)/;
  function wrap(h){
    if(h.getAttribute('data-nnht')==='1') return;
    if(h.querySelector('.httl')){ h.setAttribute('data-nnht','1'); return; }
    var kids=[].slice.call(h.childNodes);
    var sp=document.createElement('span'); sp.className='httl';
    for(var i=0;i<kids.length;i++){
      var n=kids[i];
      if(n.nodeType===1 && STOP.test(' '+String(n.className||'')+' ')) break;
      sp.appendChild(n);
    }
    if(!String(sp.textContent||'').trim()){        /* 包むものが無いときは何もしない */
      while(sp.firstChild) h.insertBefore(sp.firstChild, h.firstChild);
      return;
    }
    h.insertBefore(sp, h.firstChild);
    h.setAttribute('data-nnht','1');
  }
  function run(){ try{ [].forEach.call(document.querySelectorAll(SEL), wrap); }catch(e){} }
  if(document.readyState==='loading') addEventListener('DOMContentLoaded',run); else run();
  addEventListener('load',function(){ setTimeout(run,200); });
  try{
    var t=null;
    new MutationObserver(function(){ if(t)return; t=setTimeout(function(){ t=null; run(); },200); })
      .observe(document.body,{childList:true,subtree:true});
  }catch(e){}
})();
</script>

<script id="nn-trail-js">
/* ============================================================
   指をなぞると光がついてくる（2026-08-19b・本人の指示）
   線を引く・頂点をつまむ等の細かい操作で「いま指がどこにあるか」が分かるようにする。
   ・画面いっぱいの透明なキャンバスを1枚だけ用意し、指が触れている間だけ描く
   ・座標は clientX/Y をそのまま「画面の実px」として使う（表示倍率 zoom の影響を受けない）
   ・pointer-events:none なので、下のボタンや作図の邪魔は一切しない
   ============================================================ */
(function(){
"use strict";
var cv=null, ctx=null, pts=[], raf=null, active=false, lastT=0;
var LIFE=420;                     /* 光が消えるまで(ms) */
function make(){
  if(cv)return;
  cv=document.createElement('canvas');
  cv.id='nnTrail';
  cv.style.cssText='position:fixed; left:0; top:0; width:100%; height:100%;'
    +'pointer-events:none; z-index:9997;';
  document.body.appendChild(cv);
  ctx=cv.getContext('2d');
}
function fit(){
  var r=cv.getBoundingClientRect();
  var d=Math.min(2, window.devicePixelRatio||1);
  var w=Math.round(r.width*d), h=Math.round(r.height*d);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  return {r:r, k:cv.width/(r.width||1)};   /* k＝画面px→キャンバスpxの倍率（＝dpr） */
}
function draw(){
  if(!cv){ raf=null; return; }
  var g=fit(), k=g.k, now=performance.now();
  ctx.clearRect(0,0,cv.width,cv.height);
  /* 寿命の切れた点を落とす */
  while(pts.length && now-pts[0].t>LIFE) pts.shift();
  if(pts.length>=2){
    /* しっぽ：新しいほど太く明るい */
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var age=(now-b.t)/LIFE; if(age<0)age=0; if(age>1)age=1;
      var al=(1-age)*0.85;
      ctx.strokeStyle='rgba(255,217,77,'+al.toFixed(3)+')';
      ctx.lineWidth=(2.5+6*(1-age))*k;
      ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.shadowColor='rgba(255,180,40,'+(al*0.9).toFixed(3)+')';
      ctx.shadowBlur=9*k*(1-age);
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
    }
    ctx.shadowBlur=0;
  }
  /* 指の先の光 */
  if(active && pts.length){
    var p=pts[pts.length-1];
    var gr=ctx.createRadialGradient(p.x*k,p.y*k,0, p.x*k,p.y*k,9*k);
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.45,'rgba(255,217,77,.80)');
    gr.addColorStop(1,'rgba(255,157,30,0)');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(p.x*k,p.y*k,9*k,0,7); ctx.fill();
  }
  if(active || pts.length){ raf=requestAnimationFrame(draw); }
  else { raf=null; ctx.clearRect(0,0,cv.width,cv.height); }
}
function add(e){
  var now=performance.now();
  if(now-lastT<8) return;          /* 詰めすぎない */
  lastT=now;
  pts.push({x:e.clientX, y:e.clientY, t:now});
  if(pts.length>90) pts.shift();
  if(!raf) raf=requestAnimationFrame(draw);
}
addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse' && e.buttons===0) return;
  make(); active=true; pts.length=0; add(e);
},true);
addEventListener('pointermove',function(e){
  if(!active)return;
  add(e);
},true);
function end(){ active=false; if(!raf&&cv) raf=requestAnimationFrame(draw); }
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  addEventListener(ev,end,true);
});
})();
</script>

<script id="nn-persist-js">
/* ★2026-08-20a データ保全：ブラウザに「この保存は消さないで」と頼む。
   頼んでおくと、端末の容量が逼迫したときに localStorage が自動削除されにくくなる
   （iOS/Android とも対応。使えない環境では黙って何もしない）。 */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
</script>
</body>

     読み終わる（DOMContentLoaded）まで中身を見せず、一度に出す。その間は、前のページで実際に出ていた
     緑のヘッダーと下のナビの「枠」だけを同じ位置に描く（位置は画面に対する割合で sessionStorage に覚える）。
     visibility なので中では普通に組み立てる（大きさを測る処理に影響なし）。念のため 3秒で必ず出す。 -->
<style id="nn-boot">html.nn-boot body{visibility:hidden !important;}
html.nn-boot.nn-bf::before,html.nn-boot.nn-bf::after{content:'';position:fixed;z-index:2147483000;pointer-events:none;}

<script id="nn-boot-js">(function(){var d=document.documentElement;d.classList.add('nn-boot');

try{var f=JSON.parse(sessionStorage.getItem(key())||'null');if(f&&f.h&&f.n){var P=function(v){return (v*100).toFixed(3)+'%';};
 [['bhx',f.h[0]],['bhy',f.h[1]],['bhw',f.h[2]],['bhh',f.h[3]],['bnx',f.n[0]],['bny',f.n[1]],['bnw',f.n[2]],['bnh',f.n[3]]].forEach(function(a){d.style.setProperty('--'+a[0],P(a[1]));});

 if(!h||!n||!cw||!ch)return;var a=h.getBoundingClientRect(),b=n.getBoundingClientRect();if(a.height<8||b.height<8||b.top>=ch-2)return;
 var r=function(x){return [x.left/cw,x.top/ch,x.width/cw,x.height/ch];};sessionStorage.setItem(key(),JSON.stringify({h:r(a),n:r(b)}));}catch(e){}}

<script id="nn-phonemark">
/* ============================================================
   ★このページは「幅980で組み立ててから画面に合わせて縮める」作り。
     そのため CSS から見た画面の幅は、スマホでも 980px になる。
     ＝「スマホのときだけ効かせたい指定」が一度も効かなかった。
     ここでは端末そのものの幅を見て、<html> に data-nnphone="1" を付ける。
     （パソコンでは付かないので、今までの見た目のまま）
   ============================================================ */
(function(){try{
  var d = Math.min(screen.width||0, screen.height||0);
  if(d && d < 700) document.documentElement.setAttribute('data-nnphone','1');
}catch(e){}})();
</script>

<title>納まりナビ – 仕様登録</title>
<style>
:root{
  /* 共通カラーパレットは common.css に移動（--green-deep 等） */
  --profit:#0a6bd6; --warn:#b0392f; --gold:#8a7a2a;
  /* ★2026-11-23zr 防水の色は現場記録帳の決まり（§1265 の No. の色）にそろえる：熱アス＝黒 #1e1e1e／改質アスファルト＝濃い赤 #a11d1d／ウレタン（塗膜）＝青 #1f5fc0／塩ビ（シート）＝緑 #22914a／その他＝灰 #6b7378 */
  --c-as:#1e1e1e; --c-kai:#a11d1d; --c-gs:#22914a; --c-tm:#1f5fc0; --c-cm:#6b7378;
  --radius:10px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
}
.num{font-variant-numeric:tabular-nums;}
header{background:linear-gradient(135deg,var(--green-deep),var(--green)); color:#fff; display:flex; align-items:center; gap:14px; padding:10px 18px; flex:none;}
header .hicon{font-size:22px;}
header h1{font-size:21px; font-weight:800; letter-spacing:.06em;}
header .count{margin-left:auto; font-size:15px; font-weight:700; opacity:.95; white-space:nowrap;}
button.new-btn{background:#fff; color:var(--green-deep); border:2px solid #b8e6c9; border-radius:8px; font-size:14px; font-weight:800; padding:8px 14px; cursor:pointer; letter-spacing:.03em; white-space:nowrap;}
button.new-btn:hover{background:#dff5e7;}
#viewtabs{display:flex; gap:8px; padding:10px 18px 0; background:var(--paper); flex:none; flex-wrap:wrap;}
#viewtabs button{border:1px solid var(--line); background:#e3e7e0; color:var(--ink-sub); border-radius:9px 9px 0 0; padding:9px 22px; font-size:14.5px; font-weight:800; cursor:pointer; letter-spacing:.03em;}
#viewtabs button.on{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}
#viewtabs button:not(.on):hover{background:#d7dcd2;}
.toolbar{display:flex; align-items:center; gap:10px; padding:8px 18px; background:#dfe3db; border-bottom:1px solid var(--line); flex:none; flex-wrap:wrap;}
.search{flex:0 1 340px; position:relative;}
.search input{width:100%; padding:7px 10px 7px 30px; border:1px solid var(--line); border-radius:8px; font-size:15px; background:#fff;}
.search::before{content:"🔍"; position:absolute; left:8px; top:6px; font-size:13px; opacity:.55;}
.chips{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap;}
.chip{position:relative;}
.chip>button{background:#3c4440; color:#fff; border:0; border-radius:6px; padding:6px 12px; font-size:13.5px; font-weight:700; cursor:pointer; letter-spacing:.03em;}
.chip>button.active{background:var(--green);}
.chip .menu{display:none; position:absolute; top:calc(100% + 4px); right:0; z-index:30; background:#fff; border:1px solid var(--line); border-radius:8px; min-width:200px; box-shadow:0 6px 18px rgba(0,0,0,.18); max-height:300px; overflow:auto;}
.chip .menu.open{display:block;}
.chip .menu div{padding:9px 14px; font-size:14px; cursor:pointer; white-space:nowrap;}
.chip .menu div:hover{background:var(--green-lite);}
.chip .menu div.sel{background:var(--green); color:#fff;}
main{flex:1; display:flex; min-height:0;}
#list{flex:0 0 42%; max-width:600px; overflow-y:auto; background:#f7f8f5;}
#resizer{flex:0 0 6px; cursor:col-resize; background:transparent; border-left:1px solid var(--line); transition:background .12s;}
#resizer:hover,#resizer.on{background:#bcd9c6;}
#detail{flex:1; min-width:0; overflow-y:auto; background:#f7f8f5; border-left:1px solid var(--line);}
.ghead{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; background:#e4ebe2; color:var(--green-deep); font-weight:800; font-size:12.5px; padding:5px 14px; border-bottom:1px solid var(--line); letter-spacing:.04em;}
.ghead small{margin-left:auto; color:var(--ink-sub); font-weight:700;}
.mrow{display:flex; align-items:center; gap:9px; padding:8px 12px 8px 14px; background:#fff; border-bottom:1px solid #e7eae4; cursor:pointer; min-height:44px;}
.mrow:hover{background:#f2f8f4;}
.mrow.sel{background:var(--green-lite); box-shadow:inset 4px 0 0 var(--green);}
.mrow .code{font-weight:800; font-size:15px; white-space:nowrap; min-width:64px; line-height:1.15;}
.mrow .code{flex:none; width:88px; min-width:88px !important; overflow:hidden;}   /* 番号の幅をそろえて、右の絵を縦一列に */
.mrow .code small{display:block; font-size:10px; font-weight:700; color:var(--ink-sub); letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
/* 工法の絵：行の高さ（44px）に収まる 54×34px の枠。★2026-10-11c 絵ごとに縦横の比率が違う（幅192〜371px）ので、
   「枠に収める」だと見た目の大きさがばらばら（S-F1 と S-M2 など）→ 枠いっぱいに敷き詰めて全部同じ大きさに（はみ出す端だけ切る） */
.mrow .kic{flex:none; width:54px; height:34px; display:flex; align-items:center; justify-content:center;}
.mrow .kic img{width:54px; height:34px; object-fit:cover; object-position:center; display:block; border:1px solid #c9d2c6; border-radius:2px; box-sizing:border-box;}
/* 詳細（右側）：見出しの右上に大きめの絵（全部同じ大きさ） */
.dhead{position:relative;}
.dhead .dkic{position:absolute; top:12px; right:16px; width:132px; height:88px;}
.dhead .dkic img{width:132px; height:88px; object-fit:cover; object-position:center; display:block; border:1.5px solid #c9d2c6; border-radius:3px; box-sizing:border-box;}
.dhead:has(.dkic){padding-right:164px;}
html[data-nnphone="1"] .dhead .dkic{top:10px; right:10px; width:96px; height:64px;}
html[data-nnphone="1"] .dhead .dkic img{width:96px; height:64px;}
html[data-nnphone="1"] .dhead:has(.dkic){padding-right:114px;}
.mrow .nm{font-size:12.5px; color:var(--ink-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:40px;}
.mrow .right{margin-left:auto; display:flex; align-items:center; gap:6px; flex:none;}
/* ★2026-09-25b スマホ：右の札（新築・改修／◯工程）が画面の右へ5pxはみ出した → 縮めてよい・入らなければ折り返す */
html[data-nnphone="1"] .mrow .right{flex:0 1 auto; min-width:0; flex-wrap:nowrap;}
html[data-nnphone="1"] .mrow .right>*{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.badge{display:inline-block; color:#fff; border-radius:4px; padding:2px 8px; font-size:11.5px; font-weight:800; letter-spacing:.03em; white-space:nowrap;}
.tag{display:inline-block; border-radius:4px; padding:2px 7px; font-size:11.5px; font-weight:800; white-space:nowrap;}
.tag.jc{background:#fdeee0; color:#8a4a12; border:1px solid #e8c090;}
.tag.done{background:var(--green-lite); color:var(--green-deep); border:1px solid #b8dcc4;}
.tag.cnt{background:#eef0ea; color:var(--ink-sub); border:1px solid var(--line); font-weight:700;}
.tag.jass{background:#eef2fb; color:#1f4e9c; border:1px solid #b9c9e8;}
.tag.shin{background:#e8f3ec; color:#1e5c3a; border:1px solid #b8dcc4;}
.tag.kai{background:#fdf3e0; color:#8a5a12; border:1px solid #e8cf90;}
.empty{padding:40px 20px; text-align:center; color:var(--ink-sub); font-size:14px; line-height:2;}
.dhead{padding:14px 18px 0;}
.dhead .path{font-size:12px; font-weight:800; color:var(--gold); letter-spacing:.05em;}
.dhead h2{font-size:19px; font-weight:800; line-height:1.4; margin-top:2px;}
.dhead h2 input{font-size:18px; font-weight:800; width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:7px;}
.dhead .hrow{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap;}
.dhead .hrow h2{margin:0;}
.dhead .hrow .meta{margin-top:0;}
/* 工程イラスト（3D）＋工程の説明 */
.stage{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:12px; margin-bottom:12px;}
.st3d{position:relative; aspect-ratio:16/10; background:linear-gradient(180deg,#f7f8f5,#e8ece6); border:2px solid #c9d2c6; border-radius:3px; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.st3d > img{width:62%; height:62%; object-fit:contain; opacity:.9;}
.st3d .stlab{position:absolute; left:8px; top:8px; background:#1c6b3c; color:#fff; font-weight:900; font-size:13px; padding:2px 10px; border-radius:2px;}
.st3d .stbar{position:absolute; left:8px; right:8px; bottom:8px; display:flex; gap:3px;}
.st3d .stbar i{flex:1; height:7px; background:#d6dbd3; border-radius:1px;}
.st3d .stbar i.on{background:#2e9e58;} .st3d .stbar i.cur{background:#e07800;}
.st3d .stsoon{position:absolute; right:8px; top:8px; font-size:11px; font-weight:800; color:#7a847d; background:#fff; border:1px dashed #b9c2b6; padding:1px 7px; border-radius:2px;}
.stinfo{background:#fff; border:2px solid #c9d2c6; border-radius:3px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; min-width:0;}
.stinfo .sih{display:flex; align-items:center; gap:8px;}
.stinfo .sih b{font-size:16px; font-weight:900; color:#1c6b3c;}
.stinfo .sih span{font-size:12px; font-weight:800; color:var(--ink-sub);}
.stinfo .sih button{margin-left:auto;}
.stinfo button{font:inherit; font-size:12.5px; font-weight:900; border:1.5px solid #a9a99f; background:linear-gradient(180deg,#f2f2ee,#dcdcd4); border-radius:3px; padding:3px 10px; cursor:pointer;}
.stinfo button:disabled{opacity:.4; cursor:default;}
.silist{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:3px; overflow:auto; max-height:220px;}
.silist li{font-size:13px; padding:3px 6px; border-radius:2px; cursor:pointer;}
.silist li:hover{background:#f2f8f4;}
.silist li b{display:inline-block; min-width:22px; color:#1c6b3c;}
.sidl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:13.5px;}
.sidl dt{font-weight:900; color:var(--ink-sub); font-size:12px; padding-top:2px; white-space:nowrap;}
.sidl dd{margin:0; font-weight:700;}
.sinav{display:flex; gap:8px; margin-top:auto;} .sinav button{flex:1;}
.step-tbl tr.strow{cursor:pointer;}
.step-tbl tr.strow:hover td{background:#f2f8f4;}
.step-tbl tr.strow.done td{background:#f4f7f3;}
.step-tbl tr.strow.on td{background:#fff3c4;}
.step-tbl tr.strow.on td.stno{box-shadow:inset 4px 0 0 #e07800;}
html[data-nnphone="1"] .stage{grid-template-columns:1fr;}
.dhead .meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:7px; font-size:13px; color:var(--ink-sub); align-items:center;}
.dbody{padding:12px 18px 90px;}
.panel{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:12px;}
.panel h4{font-size:13px; font-weight:800; color:var(--green-deep); margin-bottom:8px; letter-spacing:.04em; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.panel h4 .sub{font-weight:700; color:var(--ink-sub); font-size:11.5px;}
.step-tbl{width:100%; border-collapse:collapse; font-size:13px;}
.step-tbl th,.step-tbl td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:middle;}   /* ★2026-10-11c 高さは中央（本人） */
.step-tbl th{background:var(--green-lite); font-weight:800; white-space:nowrap;}
.step-tbl td.num{text-align:right; white-space:nowrap;}
.step-tbl td.use,.step-tbl th.use{text-align:center;}   /* 使用量（kg/㎡）は上下左右とも中央（本人） */
.step-tbl .stno{white-space:nowrap; font-weight:800; text-align:center; width:44px;}
.matchip{display:inline-block; margin:1px 2px 1px 0; padding:1px 7px; border-radius:4px; font-size:11.5px; font-weight:700; background:#eef2fb; color:#1f4e9c; border:1px solid #b9c9e8; white-space:nowrap;}
.matchip.reg{background:var(--green-lite); color:var(--green-deep); border-color:#b8dcc4;}
.matchip.nop{background:#fbeae6; color:var(--warn); border-color:#e8b0a8;}
.cost-line{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; font-size:13.5px;}
.cost-line .big{font-size:21px; font-weight:800; color:var(--profit);}
.cost-note{font-size:12px; color:var(--ink-sub); margin-top:6px; line-height:1.7;}
.notebox{font-size:12.5px; color:var(--ink-sub); line-height:1.8; background:#fbfcf9; border:1px dashed var(--line); border-radius:8px; padding:9px 12px;}
.actrow{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;}
.btn-ok{background:var(--green); color:#fff; border:0; border-radius:7px; padding:11px 26px; font-size:14.5px; font-weight:800; cursor:pointer; letter-spacing:.05em;}
.btn-ok:hover{background:var(--green-deep);}
.btn-ghost{background:#fff; border:2px solid var(--green); color:var(--green-deep); border-radius:7px; padding:9px 18px; font-size:13.5px; font-weight:800; cursor:pointer;}
.btn-ghost:hover{background:var(--green-lite);}
.btn-del{margin-left:auto; background:none; border:0; color:var(--warn); font-size:13px; font-weight:800; cursor:pointer; text-decoration:underline;}
.hint{font-size:12.5px; color:var(--ink-sub); line-height:1.7;}
/* マイ仕様編集行 */
.estep{display:grid; grid-template-columns:44px 1.3fr 1.2fr 92px 100px 30px; gap:6px; align-items:center; padding:6px 0; border-bottom:1px solid #eef0ea;}
.estep input,.estep select{width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; background:#fff;}
.estep .stno2{text-align:center; font-weight:800; font-size:12.5px;}
.estep .cost{font-size:12px; font-weight:800; text-align:right; white-space:nowrap;}
.estep .xdel{background:none; border:0; color:var(--warn); font-size:15px; cursor:pointer;}
.ehead{display:grid; grid-template-columns:44px 1.3fr 1.2fr 92px 100px 30px; gap:6px; font-size:11px; font-weight:800; color:var(--ink-sub); padding-bottom:4px; border-bottom:2px solid var(--line);}
/* ---------- メーカー切替バー ---------- */
#makerbar{display:flex; gap:6px; padding:7px 14px 6px; background:#e7ebe3; border-bottom:1px solid var(--line); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; align-items:center;}
#makerbar::-webkit-scrollbar{display:none;}
#makerbar .mlabel{flex:none; font-size:11.5px; font-weight:800; color:var(--ink-sub); margin-right:2px; white-space:nowrap;}
#makerbar .mk{flex:none; border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:5px 13px; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap; color:var(--ink);}
#makerbar .mk:hover{border-color:var(--green);}
#makerbar .mk.on{background:var(--green); border-color:var(--green-deep); color:#fff;}
#makerbar .mk.soon{opacity:.55;}
#makerbar .mk .st{font-size:9.5px; font-weight:700; margin-left:4px; opacity:.85;}
nav{flex:none; background:#202623; display:flex; gap:4px; padding:6px 8px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:calc(6px + env(safe-area-inset-bottom));}
nav .ni{display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfd6d1; font-size:12px; font-weight:700; padding:5px 13px; border-radius:8px; cursor:pointer; white-space:nowrap;}
nav .ni .ic{font-size:23px; line-height:1;}
nav .ni:hover{background:#333b37;}
nav .ni.on{background:var(--green); color:#fff;}
/* --- モバイル対応：ナビのあふれスクロール・縮小・セーフエリア --- */
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
nav::-webkit-scrollbar{display:none;}
@media(max-width:700px){
  nav .ni{padding:4px 8px; font-size:10px; gap:1px;}

<!-- ============================================================
     ★2026-07-28 画面が出るまでが遅い原因は、ここにあった。
     Zen Kaku Gothic New は日本語フォント。Googleはこれを
     「約120個に小分けした指定 × 太さ3種 ＝ 約360個の指定（81KB）」
     という形のCSSで配ってくる。ページを開くたびに、この360個の指定を
     すべて読み込んで、画面上のすべての文字と照合してから描き始めるため、
     中身の重さと関係なく、毎回まるまる待たされていた。

     実測（同一条件）：このCSSがあると画面が出るまでの時間が約2倍
       ホーム        1,152ms → 2,288ms
       現場記録帳    1,940ms → 3,592ms
       現場マップ      544ms →   532ms （このCSSを読まないページ＝変化なし）
     ※「現場マップだけ速い」のは、このページがフォントを読んでいなかったため。

     → 既定では読み込まない。iPhone内蔵の游ゴシック系（ヒラギノ）で表示する。
       下の NN_WEBFONT を true にすると、画面が出たあとに読み込んで
       Zen Kaku Gothic New に切り替える（見た目優先・表示は少し遅くなる）。
     ============================================================ -->
<script>
const NN_WEBFONT=false;       /* true にすると Zen Kaku Gothic New を後読みする */
if(NN_WEBFONT){
  addEventListener('load',()=>setTimeout(()=>{
    const l=document.createElement('link'); l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap';
    document.head.appendChild(l);
  },300));
}
</script>

/* 使用量文字列 → 数値（0.2（0.4）→0.2、0.4〜0.6→中央0.5、—/合計表記→null） */
function parseUsage(s){
  if(!s||s==="—")return null;
  const t=String(s).normalize("NFKC");
  if(/同上|合計|総使用量/.test(t)&&!/^[\d.]/.test(t.trim()))return null;
  const range=t.match(/([\d.]+)\s*[〜~-]\s*([\d.]+)/);
  if(range)return (parseFloat(range[1])+parseFloat(range[2]))/2;
  const m=t.match(/([\d.]+)/);
  return m?parseFloat(m[1]):null;
}

/* ================= 材料マッチング（対応製品名 → 材料マスタ） =================
   カタログ製品名・シリーズ名を長い順に走査し、対応製品文字列に含まれるものを検出 */
const NAME_INDEX=(()=>{
  const idx=[]; const seen=new Set();
  CATALOG.forEach(c=>{
    if(!seen.has(c.n)){seen.add(c.n); idx.push({key:c.n, type:'item', id:c.i, series:c.s});}
  });
  const sMap={};
  CATALOG.forEach(c=>{ (sMap[c.s]=sMap[c.s]||[]).push(c.i); });
  Object.keys(sMap).forEach(sn=>{
    if(sMap[sn].length>1 && !seen.has(sn)){seen.add(sn); idx.push({key:sn, type:'series', id:sMap[sn][0], series:sn, ids:sMap[sn]});}
  });
  idx.sort((a,b)=>b.key.length-a.key.length);
  return idx;
})();
function matchMats(text){
  if(!text||text==="—")return [];
  let t=String(text).normalize("NFKC");
  const hits=[];
  /* 「OTプライマー類」「OTコート類」→前方一致で代表候補 */
  const rui=t.match(/([A-Za-zＡ-Ｚa-z0-9ァ-ヶー・]+)類/g)||[];
  NAME_INDEX.forEach(e=>{
    if(t.includes(e.key)){ hits.push(e); t=t.split(e.key).join("＼"); }
  });
  rui.forEach(r=>{
    const pre=r.replace(/類$/,"");
    if(pre.length>=3){
      const cands=NAME_INDEX.filter(e=>e.type==='item'&&e.key.startsWith(pre));
      cands.slice(0,4).forEach(c=>{ if(!hits.some(h=>h.id===c.id))hits.push(c); });
    }
  });
  return hits;
}

/* 工程の㎡あたり材料費（確定材料＋単価がある場合のみ） */
/* ★2026-11-23zf→zg uu＝量の単位（工程に付いていれば）。無し＝今までどおり kg/㎡。'か所/㎡' は 枚・個・本 で数える材料（ディスク・アンカー）に効く：か所×（1枚・1本の値段）。
   単位と材料の数え方が合わないときは計算しない（まちがった金額を出さない） */
function stepCost(matId,u,coef,uu){
  const m=matReg(matId); if(!m||!(m.price>0)||!(m.cv>0))return null;
  const unitPrice=m.price/m.cv;                 /* 円/(kg,㎡,m,個…) */
  if(uu&&uu!=='kg/㎡') return (uu==='か所/㎡'&&u>0&&/^(個|枚|本|か所)$/.test(m.cu))?u*unitPrice:null;
  if(u!=null&&u>0){                             /* 使用量あり → kg/㎡×円/kg想定 */
    if(m.cu==="kg")return u*unitPrice;
    return null;
  }
  if(m.cu==="㎡")return (coef==null?1.0:coef)*unitPrice;   /* シート・断熱材 → 係数×円/㎡ */
  return null;
}

    c.append(b,m); wrap.append(c);
    f._btn=b; f._menu=m;
  });

/* ★2026-10-28（自動の不具合直し・巡回 chipmenu）メニューは右端をボタンの右端にそろえる作り（right:0）。仕様登録はボタンが左端に並ぶので、
   幅の広いメニュー（分類別など）が画面の左の外へ約200pxはみ出し、選択肢が見えず押せなかった（スマホ）。
   → 開いた直後に位置を測り、画面の外へ出ていたら内側へずらす。表示倍率（zoom）のpxを混ぜない＝画面上の幅÷元の幅で割って style に戻す（罠1） */
function nnMenuFit(m){ if(!m) return; m.style.right=''; if(!m.classList.contains('open')) return;
  const r=m.getBoundingClientRect(), cw=document.documentElement.clientWidth, z=(r.width/(m.offsetWidth||1))||1; let dx=0;
  if(r.left<4) dx=4-r.left; else if(r.right>cw-4) dx=(cw-4)-r.right;
  if(dx) m.style.right=(-dx/z)+'px'; }
function rebuildMenu(f){
  const m=f._menu; m.innerHTML='';
  const clear=document.createElement('div'); clear.textContent='（解除）';
  clear.onclick=()=>{delete filterState[f.key]; f._btn.classList.remove('active'); render();};
  m.append(clear);
  f.opts().forEach(v=>{
    const d=document.createElement('div'); d.textContent=v;
    const real=f.val?f.val(v):v;
    if(filterState[f.key]===real)d.classList.add('sel');
    d.onclick=()=>{filterState[f.key]=real; f._btn.classList.add('active'); render();};
    m.append(d);
  });
}
document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open')));

function matchQ(o){
  const q=document.getElementById('q').value.trim();
  if(!q)return true;
  const hay=[o.code,o.name,o.sub,o.src].concat((o.steps||[]).map(st=>st.w+" "+(st.p||"")+" "+(st.matName||""))).join(" ");
  return normS(hay).includes(normS(q));
}
function passSpec(o){
  if(filterState.cat&&o.cat!==filterState.cat)return false;
  if(filterState.sub&&o.sub!==filterState.sub)return false;
  if(filterState.ap&&o.ap!==filterState.ap)return false;
  if(filterState.src==='JASS8'&&!o.src.includes('JASS8'))return false;
  if(filterState.src==='公共建築工事標準仕様書'&&(o.src.includes('JASS8')||o.mk))return false;
  if(filterState.src==='メーカーのカタログ'&&!o.mk)return false;   /* ★2026-11-23z */
  return matchQ(o);
}

  /* ★2026-10-13z スマホ：「全体 ◯工程・㎡あたり概算材料費・注記」は重要でないので、いちばん下の箱（#stsum）へ。絵の下の欄は工程を選んだときだけ出す（本人） */

/* ================= プリセット → マイ仕様登録 ================= */
function registerPreset(pid){
  const sp=specById[pid];
  const steps=sp.steps.map(st=>{
    const hits=matchMats(st.p);
    const first=hits.find(h=>h.type==='item');
    const u=parseUsage(st.pu);
    const mat=first?catById[first.id]:null;
    return {no:st.no, w:st.w, matId:first?first.id:null,
            matName:mat?mat.n:st.p, srcP:st.p,
            u:u, coef:(u==null&&mat&&mat.cu==='㎡')?1.0:null, uu:st.uu||null};
  });

/* ================= マイ仕様：計算 ================= */
function mySpecCost(sp){
  let total=0,counted=0,uncounted=0;
  sp.steps.forEach(st=>{
    const c=st.matId?stepCost(st.matId,st.u,st.coef,st.uu):null;
    if(c!=null){total+=c;counted++;}else{uncounted++;}
  });
  return {total:counted?total:null,counted,uncounted};
}

/* ★2026-11-19c 本人「メーカーの仕様を納まりナビで作ると知的財産的によくない。お客さんが自分で施工の方法を作れるように。
   登録したら、図面・積算の3Dで工程を押すだけで、建物の形に合わせて各工程の完成した状態と数量が分かるように」
   → 工程ごとの「作り方」（st.mk）：場所・やり方・シートの大きさ・ラップ・増し張りの場所と幅。メーカーの決まりは入れない（お客さんが入れる値）。
   図面・積算（zumen_sekisan.html の nn-mk-js）が、同じ記号の自社仕様のこの値を読んで、工程ごとの3Dと数量を出す。まずは平場だけ */
const MK_HOW=[['','（使わない）'],['nuru','塗る'],['tsuki','突きつけで張る'],['kasane','重ねて張る'],['mashi','増し張り']];
const MK_BU=[['hira','平場'],['tachi','立上り']];
function mkOf(st){ const m=(st.mk&&typeof st.mk==='object'&&!Array.isArray(st.mk))?st.mk:{}; return m; }
function mkGuess(w){ w=String(w||'');
  if(/プライマー|下地調整|接着剤塗/.test(w)) return {bu:'hira',how:'nuru'};
  if(/入隅|出隅/.test(w)&&/増し?張/.test(w)) return {bu:'hira',how:'mashi',at:'iri',w:200,sw:1,sl:10};
  if(/増し?張/.test(w)) return {bu:'hira',how:'mashi',at:'seam',w:200,pl:1100,sw:1,sl:10};
  if(/部分粘着|非露出|下張/.test(w)) return {bu:'hira',how:'tsuki',dir:'L',lapS:100,sw:1,sl:10};
  if(/砂付|露出|上張|シート/.test(w)) return {bu:'hira',how:'kasane',sw:1,sl:10,lapS:100,lapL:100};
  return null; }
function nnMkPanel(sp){
  const sel=(o,v)=>o.map(([k,l])=>`<option value="${k}"${String(v||'')===k?' selected':''}>${l}</option>`).join('');
  const num=(i,k,v,ph,u)=>`<label class="mkn"><input type="number" step="any" min="0" value="${v??''}" placeholder="${ph}" onchange="edMk(${i},'${k}',this.value)">${u}</label>`;
  const rows=sp.steps.map((st,i)=>{ const m=mkOf(st), h=m.how||'';
    const sheet=(h==='tsuki'||h==='kasane'||h==='mashi');
    return `<div class="mkrow"><span class="mkno">${esc(st.no)}</span><span class="mkw" title="${esc(st.w)}">${esc(st.w||'（工程名なし）')}</span>
      <select onchange="edMk(${i},'how',this.value)" title="やり方">${sel(MK_HOW,h)}</select>
      ${h?`<select onchange="edMk(${i},'bu',this.value)" title="場所">${sel(MK_BU,m.bu||'hira')}</select>`:''}
      ${sheet?`<span class="mkg"><i>シート</i>${num(i,'sw',m.sw,'1','m幅')}${num(i,'sl',m.sl,'10','m巻')}</span>`:''}
      ${h==='tsuki'?`<span class="mkg"><i>突きつけ</i><select onchange="edMk(${i},'dir',this.value)" title="どの継ぎ目を突き付けるか">${sel([['L','長手だけ（幅方向は重ね）'],['both','長手も幅方向も']],m.dir||'L')}</select>${(m.dir||'L')==='L'?num(i,'lapS',m.lapS,'100','mm幅方向の重ね'):''}</span>`:''}
      ${h==='kasane'?`<span class="mkg"><i>ラップ</i>${num(i,'lapS',m.lapS,'100','mm短手')}${num(i,'lapL',m.lapL,'100','mm長手')}</span>`:''}
      ${(h==='kasane'||h==='tsuki')&&m.bu==='tachi'?`<span class="mkg"><i>平場へ</i>${num(i,'kake',m.kake,'100','mm張り掛け')}</span>`:''}
      ${h==='mashi'?`<span class="mkg"><i>増し張り</i><select onchange="edMk(${i},'at',this.value)" title="どこに貼るか">${sel([['seam','下の層の突き付けの継ぎ目'],['iri','入隅（平場と立上りの境）']],m.at||'seam')}</select>${num(i,'w',m.w,'200','mm幅')}${(m.at||'seam')==='seam'?num(i,'pl',m.pl,'0','mm 1か所の長さ（0＝続けて）'):''}</span>`:''}
    </div>`; }).join('');
  const any=sp.steps.some(st=>mkOf(st).how);
  return `<div class="panel mkpanel"><h4>作り方（図面・積算の3Dと数量に使う）<span class="sub">工程ごとに、どこに・どう施工するかを入れると、図面・積算の3Dで工程を押すだけで その建物の形に合わせた各工程の状態と数量が出ます（いまは平場）</span></h4>
    ${rows}
    <div class="actrow" style="margin-top:8px">
      <button class="btn-ghost" onclick="nnMkFill()" title="工程名（プライマー・部分粘着・増し張り・砂付…）から、やり方を仮に入れます。あとで直せます">工程名から仮に入れる</button>
      <button class="btn-ghost" onclick="nnMkAddMashi()" title="突きつけで張る工程のすぐ後に、継ぎ目の増し張り（幅200mm・1か所1,100mm）の工程を足します">＋ 継ぎ目の増し張りの工程を足す</button>
      <button class="btn-ghost" onclick="nnMkAddIri()" title="最初のシートの工程の前に、入隅の増し張り（幅200mm＝平場100・立上り100）の工程を足します">＋ 入隅の増し張りの工程を足す</button>
    </div>
    <div class="cost-note">※入れる値（ラップ・増し張りの幅など）は、自社の施工のやり方やメーカーの施工要領書を見て、自社で決めてください。<br>参考（国交省 公共建築工事標準仕様書）：改質アスファルトシートの重ね幅は幅方向・長手方向とも100mm以上。部分粘着シートは幅方向100mm以上重ね、長手方向は100mm以上重ねるか、突き付けて200×1,100mm以上の増張り。出隅・入隅はシートを張る前に幅200mm程度の増張り。${any?'':'<br>まだ何も入っていません。'}</div>
  </div>`;
}
function edMk(i,k,v){ const sp=curSpec(); if(!sp)return; const st=sp.steps[i]; if(!st)return;
  const m=Object.assign({},mkOf(st));
  if(k==='how'||k==='bu'||k==='at'||k==='dir'){ m[k]=v; if(k==='how'&&v){ const g=mkGuess(v==='nuru'?'プライマー':v==='mashi'?'増し張り':v==='tsuki'?'部分粘着':'砂付')||{}; Object.keys(g).forEach(q=>{ if(m[q]==null||q==='how') m[q]=g[q]; }); m.how=v; } }
  else { const n=parseFloat(v); if(isNaN(n)||n<0) delete m[k]; else m[k]=n; }
  if(!m.how) delete st.mk; else st.mk=m;
  sp.updatedAt=Date.now(); save(); render(); }
window.nnMkFill=function(){ const sp=curSpec(); if(!sp)return; let n=0;
  sp.steps.forEach(st=>{ if(mkOf(st).how) return; const g=mkGuess(st.w+' '+(st.matName||'')); if(g){ st.mk=g; n++; } });
  sp.updatedAt=Date.now(); save(); render(); toast(n?(n+'つの工程に、やり方を仮に入れました。値を確かめてください'):'工程名から推測できる工程がありませんでした（1つずつ選んでください）'); };
window.nnMkAddIri=function(){ const sp=curSpec(); if(!sp)return;
  if(sp.steps.some(st=>mkOf(st).how==='mashi'&&mkOf(st).at==='iri')){ toast('もう入隅の増し張りの工程があります'); return; }
  let i=sp.steps.findIndex(st=>{ const h=mkOf(st).how; return h==='tsuki'||h==='kasane'; }); if(i<0) i=sp.steps.length;
  const ref=sp.steps[i]||sp.steps[0]||{};
  sp.steps.splice(i,0,{no:'',w:'入隅の増し張り',matId:ref.matId||null,matName:ref.matName||'',srcP:'',u:null,coef:null,mk:{bu:'hira',how:'mashi',at:'iri',w:200,sw:1,sl:10}});
  sp.steps.forEach((st,k)=>{ st.no=String(k+1); });
  sp.updatedAt=Date.now(); save(); render(); toast('入隅の増し張りの工程を足しました（'+(i+1)+'工程目・シートを張る前）'); };
window.nnMkAddMashi=function(){ const sp=curSpec(); if(!sp)return;
  const i=sp.steps.findIndex(st=>mkOf(st).how==='tsuki');
  if(i<0){ toast('先に「突きつけで張る」工程を選んでください'); return; }
  if(sp.steps[i+1]&&mkOf(sp.steps[i+1]).how==='mashi'){ toast('もう増し張りの工程があります'); return; }
  const m=mkOf(sp.steps[i]);
  sp.steps.splice(i+1,0,{no:'',w:'増し張り（突きつけ部）',matId:sp.steps[i].matId||null,matName:sp.steps[i].matName||'',srcP:'',u:null,coef:null,mk:{bu:'hira',how:'mashi',at:'seam',w:200,pl:1100,sw:m.sw||1,sl:m.sl||10}});
  sp.steps.forEach((st,k)=>{ st.no=String(k+1); });
  sp.updatedAt=Date.now(); save(); render(); toast('増し張りの工程を足しました（'+(i+2)+'工程目）'); };
function edStep(i,k,v){
  const sp=curSpec(); if(!sp)return; const st=sp.steps[i]; if(!st)return;
  if(k==='u'||k==='coef'){ const n=parseFloat(v); st[k]=isNaN(n)?null:n; }
  else if(k==='matId'){
    st.matId=v||null;
    const mat=v?catById[v]:null;
    st.matName=mat?mat.n:(materials.find(m=>m.id===v)||{}).n||'';
    if(mat&&mat.cu==='㎡'&&st.u==null&&st.coef==null)st.coef=1.0;
  }
  else st[k]=v;
  sp.updatedAt=Date.now(); save(); render();
}
function addStep(){
  const sp=curSpec(); if(!sp)return;
  sp.steps.push({no:String(sp.steps.length+1),w:'',matId:null,matName:'',srcP:'',u:null,coef:null});
  sp.updatedAt=Date.now(); save(); render();
}
function delStep(i){
  const sp=curSpec(); if(!sp)return;
  if(sp.steps.length<=1){toast('工程は1つ以上必要です');return;}
  sp.steps.splice(i,1); sp.updatedAt=Date.now(); save(); render();
}
function dupSpec(id){
  const sp=mySpecs.find(x=>x.id===id); if(!sp)return;
  const cp=JSON.parse(JSON.stringify(sp));
  cp.id=uid(); cp.code=sp.code+'（複製）'; cp.createdAt=Date.now(); cp.updatedAt=Date.now();
  mySpecs.push(cp); save();
  sel={type:'mine',id:cp.id}; render(); toast('複製しました');
}
function delSpec(id){
  const sp=mySpecs.find(x=>x.id===id); if(!sp)return;
  if(!confirm(`「${sp.code}　${sp.name}」を削除しますか？`))return;
  mySpecs=mySpecs.filter(x=>x.id!==id);
  if(sel&&sel.type==='mine'&&sel.id===id)sel=null;
  save(); render(); toast('削除しました');
}

/* ================= CSV・バックアップ ================= */
function openDataModal(){document.getElementById('dataModal').classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}
function exportCsv(){
  if(!mySpecs.length){toast('マイ仕様がありません');return;}
  const head=['仕様ID','仕様番号','仕様名','分類','工法','出典','適用','工程','材料・工法','材料ID','使用材料','使用量(kg/㎡)','数量係数(㎡/㎡)','円/㎡','メモ'];
  const rows=[];
  mySpecs.forEach(sp=>{
    sp.steps.forEach(st=>{
      const c=st.matId?stepCost(st.matId,st.u,st.coef,st.uu):null;
      rows.push([sp.id,sp.code,sp.name,sp.cat,sp.sub,sp.src,sp.ap,st.no,st.w,st.matId||'',st.matName||'',st.u??'',st.coef??'',c!=null?Math.round(c*10)/10:'',sp.memo||'']);
    });
  });
  const csv='\uFEFF'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  download(`納まりナビ_仕様登録_${new Date().toISOString().slice(0,10)}.csv`,new Blob([csv],{type:'text/csv'}));
  toast('CSVをダウンロードしました');
}
function backup(){
  download(`納まりナビ_仕様バックアップ_${new Date().toISOString().slice(0,10)}.json`,
    new Blob([JSON.stringify({app:'nn-specs',v:1,exportedAt:new Date().toISOString(),items:mySpecs},null,1)],{type:'application/json'}));
  toast('バックアップを保存しました');
}
function restore(input){
  const f=input.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!Array.isArray(d.items))throw 0;
      if(mySpecs.length&&!confirm(`現在の${mySpecs.length}件を置き換えて復元しますか？`))return;
      mySpecs=d.items; save(); sel=null; render(); toast(mySpecs.length+'件を復元しました'); closeModal('dataModal');
    }catch(e){toast('ファイルを読み込めませんでした');}
  };
  rd.readAsText(f); input.value='';
}
function wipe(){
  if(!mySpecs.length){toast('データはありません');return;}
  if(!confirm(`マイ仕様 ${mySpecs.length}件 をすべて削除します。よろしいですか？`))return;
  if(!confirm('本当に削除しますか？この操作は元に戻せません。'))return;
  mySpecs=[]; save(); sel=null; render(); toast('すべて削除しました'); closeModal('dataModal');
}

function navGo(k,label){
  if(k===NAV_ACTIVE)return;
  if(NAV_LINKS[k]){ nnGoPage(encodeURI(NAV_LINKS[k])); }
  else alert('「'+label+'」は準備中です');
}
/* ページ移動：押した瞬間に画面がフェードし始めるので「固まった」感じがなくなる */
window.nnGoPage=function(url){
  /* ★指を離した瞬間（＝タップした瞬間）に、画面いちばん上へ細い進行バーを出す。
     次のページが出来上がるまでの数百ミリ秒、「反応した」ことが必ず目に見える。
     画面は隠さないので、前の画面はそのまま見えたまま。 */
  try{
    if(!document.getElementById('nnbar')){
      const bar=document.createElement('div'); bar.id='nnbar'; bar.innerHTML='<i></i>';
      document.body.appendChild(bar);
      setTimeout(()=>{try{bar.remove();}catch(_){}} ,4000);   /* 念のための自動消去 */
    }
  }catch(_){}
  document.body.classList.add('nn-leaving');
  /* ★2026-10-27i ゲームのような切り替え：幕を閉じてから移動（nn_trans.js） */
  if(window.nnTransGo){ nnTransGo(url); return; }
  location.href=url;
};
/* ★先読みの fetch は削除（2026-07-28）。
   ページは端末に保存済みなので先読みの意味がなく、指が触れた瞬間に
   別の取得処理を走らせることで、肝心の画面移動と処理を取り合っていた。 */
function buildNav(){
  const n=document.getElementById('nav');
  n.innerHTML=NAV.map(([k,l])=>{
    const suf=(k===NAV_ACTIVE)?'_on':'';
    return `<div class="ni ${k===NAV_ACTIVE?'on':''}" onclick="navGo('${k}','${l}')">
      <span class="ic"><img src="./icons/nav_${k}${suf}.png?v=2026-10-29c" alt="${l}"
        onload="this.closest('.ni').classList.add('hasimg')"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='./icons/nav_${k}.png';}
                 else{this.outerHTML=ICONS['${k}']||'▫️';}"></span><span>${l}</span></div>`;
  }).join('');
  /* あふれ時：アクティブなボタンを中央に
     ★位置の計測（scrollWidth や getBoundingClientRect）は「画面をいったん組み上げる」
       処理なので、ここで行うと画面が出るまでの待ち時間が伸びる。
       画面を出したあと（次の描画のタイミング）にまわす。 */
  addEventListener('load',()=>{
    const on=n.querySelector('.ni.on');
    if(on && n.scrollWidth>n.clientWidth){
      const d=on.getBoundingClientRect().left-n.getBoundingClientRect().left;
      n.scrollLeft+=d-(n.clientWidth-on.offsetWidth)/2;
    }
  },{once:true});
}

/* ================= リサイザー ================= */
(function(){
  const rz=document.getElementById('resizer'), list=document.getElementById('list');
  /* ★2026-10-11a 境目がマウスから大きくずれて左右に飛んでいた（本人の動画・§628）：
     ①マウスの位置（clientX＝画面全体の左から・表示倍率をかけた後）をそのまま一覧の幅（倍率をかける前）にしていた
       → 一覧の左端（左のメニュー帯）を引き、表示倍率で割る（CLAUDE.md 罠1）
     ②画面の外やほかの物の上で指・マウスを離すと「つかんだまま」が残り、ただ動かすだけで境目が動いた
       → つかんだ相手を捕まえる（pointer capture）・ボタンが押されていなければ終わる・窓から出たら終わる */
  let drag=false, pid=null;
  const zoomOf=()=>{ const r=list.getBoundingClientRect(); return (list.offsetWidth&&r.width)?r.width/list.offsetWidth:1; };
  const end=()=>{ if(!drag)return; drag=false; rz.classList.remove('on'); document.body.style.userSelect='';
    try{ if(pid!=null&&rz.hasPointerCapture&&rz.hasPointerCapture(pid)) rz.releasePointerCapture(pid); }catch(_){} pid=null; };
  rz.addEventListener('pointerdown',e=>{ if(e.button!==0)return; drag=true; pid=e.pointerId; rz.classList.add('on'); document.body.style.userSelect='none';
    try{ rz.setPointerCapture(pid); }catch(_){} e.preventDefault(); });
  rz.addEventListener('pointermove',e=>{ if(!drag)return; if(e.pointerType==='mouse'&&!(e.buttons&1)){ end(); return; }
    const z=zoomOf(), left=list.getBoundingClientRect().left, box=list.parentElement;
    const max=(box?box.clientWidth:document.documentElement.clientWidth)*0.68;
    const w=Math.round(Math.min(Math.max((e.clientX-left)/z-rz.offsetWidth/2,280),max));   /* 境目の真ん中がマウスの所に来るように */
    list.style.flex='0 0 '+w+'px'; list.style.maxWidth=w+'px'; });
  rz.addEventListener('pointerup',end); rz.addEventListener('pointercancel',end); rz.addEventListener('lostpointercapture',end);
  addEventListener('blur',end);
})();

/* ================= 起動 ================= */
load();
window.NN_SPEC={version:1,presets:SPECS,getSpecs:()=>JSON.parse(JSON.stringify(mySpecs)),storageKey:SPEC_KEY};
buildNav(); buildMakerBar();
buildChips();
render();
</script>

/* ============================================================
   スマホ表示モード切替
   ・一覧モード（既定）：デスクトップレイアウトを縮小して全体表示。
     ピンチ（指を広げる）でいつでも拡大可能。
   ・モバイル表示：従来のレスポンシブ表示。
   右下の丸ボタンで切替。設定は端末に記憶され全ページ共通。
   ============================================================ */
(function(){
  const KEY='nn_view_mode', VW=980;
  const vp=document.querySelector('meta[name="viewport"]');
  const phone=Math.min(screen.width,screen.height)<700;
  function getMode(){ try{return localStorage.getItem(KEY)||'ichiran';}catch(e){return 'ichiran';} }
  function apply(m){
    /* ★2026-09-25e いまの表示モードを <html> に出す（1.8倍の拡大は「一覧表示＝幅980を縮める」ときだけにするため） */
    document.documentElement.setAttribute('data-nnvm', m==='ichiran'?'ichiran':'mobile');
    if(m==='ichiran'){ vp.setAttribute('content','width='+VW+', user-scalable=yes, viewport-fit=cover'); }
    else{ vp.setAttribute('content','width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover'); }
    try{localStorage.setItem(KEY,m);}catch(e){}
    const b=document.getElementById('vmToggle');
    if(b){
      b.textContent=(m==='ichiran'?'📱 モバイル表示':'🗂 一覧表示');
      /* 一覧モードは全体が縮小されるためボタンは大きめに作る */
      b.style.fontSize=(m==='ichiran'?'26px':'13px');
      b.style.padding=(m==='ichiran'?'14px 22px':'8px 14px');
      b.style.bottom=(m==='ichiran'?'120px':'72px');
    }
  }
  window.nnToggleView=function(){ apply(getMode()==='ichiran'?'mobile':'ichiran'); };
  if(!phone){ vp.setAttribute('content','width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover'); return; }
  apply(getMode());
  /* 「モバイル表示」切替ボタンは廃止（画面上の残像文字を解消） */
})();
</script>

<style>

.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);

<script>
(function(){
  /* ---------- ゲーム風タップ音（Web Audio合成・音源ファイル不要） ---------- */
  let AC=null;
  function ctx(){
    if(window.nnAC){ const s=window.nnAC(); if(s) return s; }   /* ★2026-10-27f 対策入りの共通の装置を使う */
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  function tapSound(){
    if(window.nnTapBeep){ window.nnTapBeep(); return; }   /* ★2026-10-27f 共通の短い1音（下は予備） */
    try{
      const c=ctx(), t=c.currentTime;
      // やわらかい水滴風の「ぽん」：低めのサイン波2音（耳に優しい音量）
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(523,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.06,t+0.010);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.15);
      // 軽く上に抜ける倍音
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(784,t);
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.03,t+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
      o2.connect(g2).connect(c.destination);
      o2.start(t+0.005); o2.stop(t+0.12);
    }catch(e){}
  }

  /* ---------- タッチ発光 ---------- */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    /* ★2026-08-13j パソコンの表示倍率（zoom）で割ること。
       clientX/Y は倍率を**かけた後**のpx、style.left/top は倍率を**かける前**のpx。
       割らないと、大きいモニターほど発光が右下の見当違いな場所に出る（§61の落とし穴）。 */
    const _z=window.nnPZ||1;
    el.style.left=(x/_z)+'px'; el.style.top=(y/_z)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 600);
  }

  /* ---------- イベント委譲 ----------
     発光＝画面のどこを触っても出す（触った場所のフィードバック）
     音　＝押せる要素（ボタン・ナビ・チップ・行）に当たったときだけ鳴らす */
  const PRESSABLE='button, .chip>button, .mk, .mrow, .tabs button, #viewtabs button, .btn-ok, .btn-ghost, .sortbtn, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    /* ★下部ナビは専用の音（nav_move.wav）を鳴らすので、ここでは鳴らさない。
       [onclick] にナビも含まれてしまい、1回のタップで2種類の音が重なって
       「ココンコン」と聞こえていた原因。 */
    const tc=(e.target&&e.target.closest)?e.target:null;
    const hit=(!tc||tc.closest('nav .ni'))?null:tc.closest(PRESSABLE);
    if(hit && !hit.disabled && !hit.classList.contains('soon')){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();
</script>

   ・新しい版に切り替わったら、その場で1回だけ自動で読み込み直す
     （＝「再読み込み2回」が不要になり、直したことが必ず反映される） */
/* ★2026-07-28 検証：サービスワーカーを一時的に止める
   ホーム(37KB)も現場記録帳(300KB)も、どちらもタップから約0.9秒。
   中身の重さが10倍近く違うのに時間が同じ＝ページの組み立てではなく、
   移動のたびにかかる「決まった待ち時間」がある、ということ。
   iPhoneのSafariでは、この保存の仕組み（サービスワーカー）が
   眠っていると、移動のたびに起こす時間が数百ミリ秒かかることが知られている。
   → いったん止めて、これが原因かを確かめる。
   NN_USE_SW を true に戻せば、オフライン対応ごと元に戻せる。 */
const NN_USE_SW=false;
if('serviceWorker' in navigator){
  if(NN_USE_SW){
    let nnReloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(nnReloaded)return; nnReloaded=true; location.reload();
    });
    addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(r=>{
        try{r.update();}catch(_){}
        if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage('nn-precache');
      }).catch(()=>{});
    });

    /* すでに入っている分を取り除き、保存分も消す（1回だけ読み直す） */
    addEventListener('load',async()=>{
      try{
        const rs=await navigator.serviceWorker.getRegistrations();
        if(rs.length){
          await Promise.all(rs.map(r=>r.unregister()));
          if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));}
          if(!sessionStorage.getItem('nnSwOff')){ sessionStorage.setItem('nnSwOff','1'); location.reload(); }
        }
      }catch(_){}
    });
  }
}

<script>
/* ============ ナビの操作音（2026-07-28 作り直し） ============
   ★以前は <audio> を2個ずつ用意して音源ファイル(nav_move.wav)を
     読ませていたが、iPhoneでは音声部品の準備が重く、しかも
     いつ終わるか読めないため、画面が出るまでの待ち時間に影響していた。
     → 音源ファイルをやめ、その場で音を合成する方式（Web Audio）に変更。
       ファイル読み込みゼロ・部品ゼロ・音は今までと同じ「やわらかい1音」。
   ============================================================ */
(function(){
  /* ★2026-07-28 音が出たり出なかったりした原因
     ①音の装置(AudioContext)を「ナビを最初に押したとき」に作っていた。
       iPhoneでは作った直後は停止状態で、動き出すまでに少し時間がかかるため、
       その1回目の音が鳴らないことがあった。
     ②画面移動が0.09秒後に始まるので、音が長いと途中で切れていた。
     → 装置は「画面のどこかを最初に触った時点」で作って動かしておく。
       音は0.07秒に短くして、移動が始まる前に鳴り終わるようにする。 */
  let AC=null, last=0;
  function make(){
    if(AC)return AC;
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    try{ AC=new C(); }catch(_){ return null; }
    /* 無音を1粒だけ鳴らして、iPhoneの音の仕組みを起こしておく */
    try{ const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
         s.buffer=b; s.connect(AC.destination); s.start(0); }catch(_){}
    return AC;
  }
  /* ★2026-08-26b 起こしても動かないままの装置がある（電話・他アプリへの切り替えで
     iPhoneが音の仕組みごと止めることがあり、resume が効かない）。
     1秒たっても動かなければ、利用者の操作の中で装置を作り直す
     （作り直しは操作の中なら必ず動く＝§89「操作そのものの中で呼ぶ」と同じ決まり）。 */
  let deadSince=0;
  function ensureRunning(){
    let c=make(); if(!c)return null;
    if(c.state!=='running'){
      try{ c.resume(); }catch(_){}
      if(!deadSince) deadSince=Date.now();
      else if(Date.now()-deadSince>1000){
        try{ c.close(); }catch(_){}
        AC=null; deadSince=0; c=make();
        if(c && c.state!=='running'){ try{ c.resume(); }catch(_){} }
      }
    } else deadSince=0;
    return c;
  }
  function unlock(){ ensureRunning(); }
  addEventListener('pointerdown',unlock,{passive:true,capture:true});
  addEventListener('touchstart',unlock,{passive:true,capture:true});
  /* 画面が戻ってきたときは、止まっている音の装置を起こし直す
     （iPhoneは他のアプリに切り替えると止めることがある） */
  function wake(){ const c=AC; if(c && c.state!=='running'){ try{c.resume();}catch(_){} } }
  addEventListener('pageshow', wake);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) wake(); });

  /* 実際に音を出す部分。ここは「装置が動いている」ときだけ呼ぶ */
  /* ★2026-10-27f 本人「もっとシンプルな音」→ ナビもボタンも同じ短い1音「ピッ」にそろえた */
  function beep(c){
    const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(1047,t);       /* ドの音（高め）を1つだけ */
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3,t+0.003);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.055);
  }
  /* ★2026-10-27f ボタンの音も、この「起こす・作り直す」対策入りの装置で鳴らす。
     以前はボタンだけ対策なしの別の装置で、最初の1回やアプリ切り替えの後に鳴らなかった。
     止まった装置への予約は動き出した瞬間に鳴る（§220）ので、状態を問わず予約する。 */
  window.nnAC=function(){ return ensureRunning(); };
  window.nnTapBeep=function(){ try{ const c=ensureRunning(); if(c) beep(c); }catch(_){} };

  /* ★2026-07-31 「鳴ったり鳴らなかったり」の直し方
     iPhoneは、ページを開いた直後の音の装置が「止まった状態」で始まる。
     動き出す（resume）のは少し後なので、押してすぐ画面が変わると
     音が鳴る前に前のページが消えてしまう＝無音になっていた。
     そこで
       ・鳴らせたかどうかを返す（true＝すぐ鳴った）
       ・すぐ鳴らせなかったときは、動き出したら鳴らす（nnSoundReady で待てる）
     ようにして、ナビ側が「音が出るのを待ってから画面を移る」ようにした。 */
  window.nnSoundReady=null;
  window.nnMoveSound=function(){
    const now=Date.now(); if(now-last<160)return true; last=now;   /* 連続再生を抑える */
    try{
      const c=ensureRunning(); if(!c)return true;
      if(c.state==='running'){ beep(c); return true; }
      /* まだ動いていない：起こしてから鳴らす。ナビ側はこれを待てる */
      window.nnSoundReady=new Promise(function(res){
        let done=false;
        const fin=function(){ if(done)return; done=true; res(); };
        /* ★2026-08-26b 「起きてから鳴らす」だと、起きるのが遅い回は画面が変わって
           鳴らずじまいだった。止まった装置への予約は動き出した瞬間に鳴るので、
           先に鳴る予約だけ入れておく（＝鳴ったり鳴らなかったりの残りを解消）。 */
        try{ beep(c); }catch(_){}
        try{ const p=c.resume(); if(p&&p.then) p.then(fin, fin); else fin(); }catch(_){ fin(); }
        setTimeout(fin, 120);      /* 起きなくても待たせすぎない */
      });
      return false;
    }catch(_){ return true; }
  };
})();
</script>

    if(ni===cur)return;
    if(!ni)return;                     /* アイコンの隙間に指がかかっても、直前の選択を保つ
                                          （指のわずかな揺れで音が連発するのを防ぐ） */
    if(cur)cur.classList.remove('press');
    cur=ni; cur.classList.add('press');
    /* 音を鳴らす。すぐ鳴らせなかったときは、移動を少しだけ待つ（下の go を参照） */
    sndNow=true;
    if(window.nnMoveSound)try{ sndNow=(nnMoveSound()!==false); }catch(_){}
    /* ★先読みの fetch は削除（2026-07-28）。移動処理と取り合って遅くなっていた。 */
  }
  /* ★ここが「遅い」の正体だった（2026-07-28 画面録画の実測で判明）
     以前は「指を離したとき」に初めて移動していた。画面録画を1コマずつ調べると、
     アイコンが光ってから画面が変わるまで約0.9秒、その間まったく何も起きていない。
     ＝ページの読み込みが遅いのではなく、指を離すまで移動を始めていなかった。
     そこで「指を置いて 0.09秒たっても動かさなければ、離すのを待たずに移動する」
     方式にした。なぞって選び直したい場合（指を動かした場合）は今までどおり、
     指を離した先のアイコンへ移動する。 */
  /* ★2026-10-28c 長押しで説明のテロップ（nn_navtip.js）を出すため、移動は「指を離したとき」に戻した。
     光と音は今までどおり指が触れた瞬間（focus）＝押した反応はすぐ見える。0.45秒押し続けたら移動せずテロップ */
  const TIP_MS=450;          /* この時間だけ押し続けたら「長押し」＝移動せず説明を流す */
  const MOVE_PX=10;          /* この距離より動いたら「なぞり操作」とみなす */
  let goTm=0, downPt=null, gone=false, tipOn=false;
  let sndNow=true;
  function go(t){
    if(gone)return;
    if(!t||t.classList.contains('on'))return;
    const m=(t.getAttribute('onclick')||'').match(/navGo\('([^']*)'\s*,\s*'([^']*)'\)/);
    if(!(m&&typeof navGo==='function'))return;
    gone=true;
    /* ★音がすぐ鳴ったときは今までどおり即移動（速さは変えない）。
       鳴らなかったときだけ、音が出るのを最大0.16秒待ってから移動する。 */
    if(sndNow || !window.nnSoundReady){ navGo(m[1],m[2]); return; }
    let moved=false;
    const jump=function(){ if(moved)return; moved=true; navGo(m[1],m[2]); };
    try{ window.nnSoundReady.then(function(){ setTimeout(jump, 30); }); }catch(_){}
    setTimeout(jump, 160);
  }
  function cancelHold(){ if(goTm){clearTimeout(goTm); goTm=0;} }
  nav.addEventListener('pointerdown',e=>{
    const ni=e.target.closest&&e.target.closest('.ni'); if(!ni)return;
    dragging=true; cur=null; gone=false; downPt=[e.clientX,e.clientY]; focus(ni);
    try{nav.setPointerCapture(e.pointerId);}catch(_){}
    cancelHold(); tipOn=false;
    goTm=setTimeout(()=>{ goTm=0; tipOn=true; if(window.nnNavTip&&cur) nnNavTip.show(cur); }, TIP_MS);
  });
  nav.addEventListener('pointermove',e=>{
    if(!dragging)return;
    if(downPt && Math.abs(e.clientX-downPt[0])+Math.abs(e.clientY-downPt[1])>MOVE_PX) cancelHold();
    focus(itemAt(e.clientX,e.clientY));
    if(tipOn&&window.nnNavTip&&cur) nnNavTip.show(cur);   /* 押したままなぞると、指の下のアイコンの説明に替わる */
  });
  function finish(e){
    if(!dragging)return;
    dragging=false; cancelHold();
    const t=cur; if(cur){cur.classList.remove('press'); cur=null;}
    if(tipOn){ tipOn=false; if(window.nnNavTip) nnNavTip.release(); return; }   /* 長押しのあとは移動しない */
    go(t);
  }
  nav.addEventListener('pointerup',finish);
  nav.addEventListener('pointercancel',()=>{dragging=false; cancelHold(); if(tipOn){ tipOn=false; if(window.nnNavTip) nnNavTip.release(); } if(cur){cur.classList.remove('press'); cur=null;}});
  /* 上の処理で移動するので、通常のクリックは止める（二重に移動しないように） */
  nav.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); },true);
})();
</script>

<script id="nn-btmsafe">
/* ============================================================
   たて画面で、下部ナビの下側が画面の外に切れるのを防ぐ（2026-07-29）
   ------------------------------------------------------------
   このページは「一覧モード」のとき、画面を幅980で組み立ててから
   端末の幅に合わせて縮めて表示している。
   iPhoneを「たて」に持つと 393px 幅なので、縮小率は約0.40。
   このとき、画面下端のホームバー用に確保している余白も同じだけ
   縮んでしまい、実際には5〜6px程度しか空かない。
   その結果、ナビの下の段（カメラ・ライブラリなど）の文字が
   ホームバーに重なって「下が見切れている」状態になっていた。
   ここでは、縮小率のぶんだけ余白を大きくして渡し直す。
   ・縮めずに表示している画面（倍率1）では 0 なので、見た目は今まで通り。
   ・レイアウト（並び方・大きさ）は一切変えない。下端の余白だけを直す。
   ============================================================ */
(function(){
  var MIN_REAL = 16;   /* 実際の画面で確保したい下余白（px） */
  /* ★★2026-09-07e 指で拡大しても画面が崩れないように「組み立ての大きさ」で測る（§319）。
     iPhoneは指で拡大すると innerWidth・innerHeight まで**いま見えている範囲**の大きさに
     変わる（パソコンのブラウザは変わらない）。それをそのまま画面の高さ・縮小率に使うと、
     拡大した分だけ中身が短く・小さくなり、下に何も無い帯が出る＝「ズームすると見切れる」。
     documentElement の clientWidth/clientHeight は**拡大しても変わらない**ので、こちらで測る。 */
  function LW(){ var d=document.documentElement; return (d&&d.clientWidth)||window.innerWidth; }
  function LH(){ var d=document.documentElement; return (d&&d.clientHeight)||window.innerHeight; }
  function fit(){
    var pr = true;
    try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = LH() > LW(); }
    var dev = pr ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    var k = (dev > 0) ? (LW() / dev) : 1;
    /* 縮めて表示しているときだけ効かせる（等倍のときは 0＝今まで通り） */
    var v = (k >= 1.5) ? Math.round(MIN_REAL * k) : 0;
    document.documentElement.style.setProperty('--nnsabmin', v + 'px');
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
  addEventListener('load', fit, {once:true});
})();
</script>
<style id="nn-fillh">

   iPhoneをたてに持つと、この値が実際に見えている高さより小さくなり、
   画面の下のほうに、何も置かれない帯（すき間）ができていた。
   下の script で「実際に見えている高さ」を測って --nnvh に入れ、
   それをアプリの高さに使う。
   ※ズレが無いときは今までと同じ値になるので、見た目は変わらない。

<script id="nn-fillh-js">
/* ============================================================
   画面のいちばん下まで使い切る（2026-07-29）
   ・--nnvh ＝ 実際に見えている画面の高さ
   ・表示中の画面（一覧・ダッシュボード等）の下に余りがあれば、そのぶん伸ばす
   　（すき間があるときだけ動くので、余りが無ければ何もしない）
   ============================================================ */
(function(){
  var VIEWS = null;
  /* ホーム画面のアイコンから起動しているか（＝全画面のアプリとして開いているか） */
  function isStandalone(){
    try{
      if(navigator.standalone === true) return true;
      return matchMedia('(display-mode: standalone)').matches
          || matchMedia('(display-mode: fullscreen)').matches;
    }catch(e){ return false; }
  }
  /* 画面のいちばん下に貼っておく、見えない1pxの目印。
     ★iPhoneをたてに持つと、端末が申告してくる「画面の高さ」が
       実際に見えている高さより小さいことがある（このページのように
       画面を縮めて表示していると起きる）。その申告値をそのまま使うと、
       画面の下のほうに何も置かれない帯（すき間）が残ってしまう。
       目印は画面の下端に貼り付いているので、その位置を測れば
       「本当の下端」が分かる。 */
  var probe = null;
  function probeBottom(){
    if(!probe || !probe.parentNode){
      probe = document.createElement('div');
      probe.id = 'nnBtmProbe';
      probe.setAttribute('style','position:fixed;left:0;bottom:0;width:1px;height:1px;'
        + 'pointer-events:none;opacity:0;z-index:-1;');
      (document.body || document.documentElement).appendChild(probe);
    }
    return probe.getBoundingClientRect().bottom;
  }
  /* ★★2026-09-07e 指で拡大しても画面が崩れないように「組み立ての大きさ」で測る（§319）。
     iPhoneは指で拡大すると innerWidth・innerHeight まで**いま見えている範囲**の大きさに
     変わる（パソコンのブラウザは変わらない）。それをそのまま画面の高さ・縮小率に使うと、
     拡大した分だけ中身が短く・小さくなり、下に何も無い帯が出る＝「ズームすると見切れる」。
     documentElement の clientWidth/clientHeight は**拡大しても変わらない**ので、こちらで測る。 */
  function LW(){ var d=document.documentElement; return (d&&d.clientWidth)||window.innerWidth; }
  function LH(){ var d=document.documentElement; return (d&&d.clientHeight)||window.innerHeight; }
  function isZoomed(){ var vv=window.visualViewport; return !!(vv && vv.width < LW()*0.96); }
  function pageH(){
    var vv = window.visualViewport;
    var h = LH();
    /* 文字入力でキーボードが出ると visualViewport は小さくなるので、大きいほうを採る
       （★指で拡大している間は小さくなって当たり前なので、そのときは見ない） */
    if(vv && !isZoomed() && vv.height > h) h = vv.height;
    /* 目印のほうが下にあれば、そちらが本当の下端。
       ブラウザで開いているときは下のバーの分だけ縮むのが正しいので、この直しは
       ホーム画面から起動したときだけ効かせる。あり得ない大きさは念のため採らない。 */
    if(isStandalone()){
      var t = probeBottom();
      if(t > h + 1 && t < h * 3) h = t;
      /* ★2026-08-27a ホーム画面起動＝全画面なので、画面そのもの（screen）の高さが本当の高さ。
         申告(innerHeight)・visualViewport・目印のすべてが小さいまま嘘をつく端末があり
         （実機スクショの実測：中身が60pt短く、その下にページの背景色が塗られていた）、
         その場合は screen だけが正しい。
         ・iPhoneの screen は向きに関係なく「たて向きの値」なので、よこ向きは短い方を使う
         ・縮小して表示するページ（width=980）ではCSSのpxと合わないが、
           そのときは h が screen よりずっと大きいので下の条件に入らない（保護） */
      var scH = (LW() > LH()) ? Math.min(screen.width, screen.height)
                              : Math.max(screen.width, screen.height);
      var scW = (LW() > LH()) ? Math.max(screen.width, screen.height)
                              : Math.min(screen.width, screen.height);
      /* ★2026-08-27h 縮小して表示するページ（width=980）は、CSSのpxと画面のptが合わない。
         「画面の1pt＝CSSの何px」（innerWidth÷画面の幅）を掛けて、CSSのpxに直してから比べる。
         等倍のページでは innerWidth＝画面の幅なので倍率1＝今までと同じ。
         （直す前は pt のまま比べていたため、縮小ページだけこの直しが一度も効かず、
         　下に約60ptの帯が残っていた＝実機で発生） */
      var sc = (scW > 0) ? scH * (LW() / scW) : scH;
      if(sc > h + 1 && sc < h * 1.6) h = sc;
    }
    return Math.round(h);
  }
  /* ★2026-08-24aa 0.8秒ごとの見直しは「変わったときだけ」にする。
     この処理は画面の高さを測り直すので、そのたびに**画面ぜんぶの置き場所の計算**が走る。
     ・窓の大きさ ・下部ナビの出入り ・表示中の画面 ・表示倍率
     のどれも変わっていなければ、測らずにそのまま戻る（見え方は今までどおり）。
     中身の高さが変わったときは、呼ぶ側が fill(true) で「必ず測る」と伝える。 */
  var _fsig='';
  function fillSig(){
    var vv=window.visualViewport, nav=document.getElementById('nav');
    var s=[LW(), LH(),
           /* ★指で拡大している間は vv の大きさが刻々と変わるので、合図には「拡大中」とだけ入れる */
           isZoomed()?'zoom':(vv?Math.round(vv.width)+'x'+Math.round(vv.height):'-'),
           nav?(nav.style.marginBottom+'|'+nav.style.transform+'|'+nav.className):'-',
           window.nnPZ||1];
    /* ★2026-08-26b ホーム画面から起動したiPhoneは、innerHeight が実際より小さい値の
       まま変わらないことがある（§5-2）。本当の下端（目印）は起動の少し後に伸びるが、
       申告値だけを見る合図では「変わっていない」ことになり、
       「変わったときだけ測る」（2026-08-24ab）が一度も測り直さない
       ＝画面の下に黒い帯が残っていた（実機で発生）。目印も合図に入れる。 */
    if(isStandalone()) s.push(Math.round(probeBottom()));
    if(VIEWS) for(var i=0;i<VIEWS.length;i++){
      var e=document.getElementById(VIEWS[i]);
      s.push(e?(e.className+'/'+(e.style.display||'')):'-');
    }
    return s.join(',');
  }
  function fill(force){
    if(!force){ var sg=fillSig(); if(sg===_fsig) return; _fsig=sg; }
    else _fsig=fillSig();
    /* ★2026-08-11a パソコンで表示倍率（zoom）をかけているときは、
       innerHeight（実画面のpx）をそのまま使うと body の高さが倍率ぶん大きくなる。
       倍率で割って「CSSのpx」に直す。 */
    var _z = window.nnPZ || 1;
    var pb = pageH() / _z;
    document.documentElement.style.setProperty('--nnvh', pb + 'px');
    /* ★2026-08-27h 下部ナビが position:fixed のページ（国交省仕様・現場マップ）では、
       ナビは「申告された画面の下端」に貼り付く。ホーム画面起動のiPhoneが高さを
       実際より小さく申告したままだと（§221）、ナビの下に帯が残る＝CSSでは直せない。
       本当の高さ（pb）との差のぶんだけ下へずらして、本当の下端に貼り直す。
       ふつうの端末・ふつうのページでは差が0なので何も変わらない。 */
    try{
      var _nv=document.getElementById('nav');
      if(_nv && getComputedStyle(_nv).position==='fixed'){
        /* ★2026-09-13u 差は「本当の下端 − fixed の下端が実際に来る場所（目印）」で取る。
           以前は申告された高さ（LH）との差だったため、①申告は正しいのに fixed だけ上に
           止まる端末では押し下げが 0 で帯の下に空きが残り、②申告が小さい端末では
           逆に押し下げ過ぎて2段目が画面の外へ出た（本人の実機）。 */
        var _d=Math.round(pb - probeBottom()/_z);
        _nv.style.bottom=(_d>2)? (-_d+'px') : '';
      }
      /* ▲（ナビを出すボタン）も fixed なので、同じ差のぶん下げる（負の margin で押し下げる） */
      var _vt=document.getElementById('navShowTab');
      if(_vt){ var _d2=Math.round(pb - probeBottom()/_z);
        _vt.style.marginBottom=(_d2>2)? (-_d2+'px') : ''; }
    }catch(_){}
    if(_z !== 1){                      /* 倍率をかけているときは下の余白うめをしない（パソコン用） */
      if(VIEWS) VIEWS.forEach(function(id){ var e=document.getElementById(id); if(e) e.style.minHeight=''; });
      return;
    }
    if(!VIEWS) return;
    var v = null;
    for(var i=0;i<VIEWS.length;i++){
      var e = document.getElementById(VIEWS[i]);
      if(e && e.offsetParent !== null){ v = e; break; }
    }
    if(!v) return;
    /* 下部ナビが場所を取っている高さ（自動で隠れているときは 0） */
    var navOcc = 0;
    var nav = document.getElementById('nav');
    if(nav){
      var ns = getComputedStyle(nav);
      if(ns.display !== 'none' && ns.position !== 'fixed' && ns.position !== 'absolute'){
        var mb = parseFloat(nav.style.marginBottom || '0') || 0;   /* 隠れているときは負の値 */
        navOcc = Math.max(0, nav.offsetHeight + mb);
      }
    }
    if(v.style.minHeight) v.style.minHeight = '';      /* いったん元に戻して測る */
    var r = v.getBoundingClientRect();
    var gap = (pb - navOcc) - r.bottom;                 /* 下に余っている高さ */
    if(gap > 2) v.style.minHeight = Math.round(r.height + gap) + 'px';
  }
  fill(true);
  addEventListener('load', function(){ fill(true); });
  /* ★2026-08-26b 起動直後は画面の高さが何度か変わる（起動アニメ・申告の遅れ）。
     合図が同じでも、最初だけは念のため測り直す（3回だけ・そのあとは今までどおり） */
  [300,1200,3000].forEach(function(t){ setTimeout(function(){ fill(true); }, t); });

<script id="nn-countbar">
/* ============================================================
   一覧の上に「表示◯件／全◯件」を出す（現場記録帳と同じ親切）
   ・絞り込みチップを押したとき、何件残ったかがすぐ分かる

     絞り込みの中身を知らなくても正しい数になる
   ============================================================ */
window.nnCountBar=function(){
  var list=document.getElementById('list'); if(!list) return;
  var old=list.querySelector('.nncount'); if(old) old.remove();
  var shown=0, unit='件';
  var heads=list.querySelectorAll('.ghead small');
  if(heads.length){
    Array.prototype.forEach.call(heads,function(s){
      var m=String(s.textContent||'').match(/([\d,]+)\s*(\S*)/);
      if(m){ shown+=parseInt(m[1].replace(/,/g,''),10)||0; if(m[2])unit=m[2]; }
    });
  }else{
    shown=list.querySelectorAll('.mrow:not(.child)').length;
  }
  /* ★件数は検索欄と同じ行（ツールバー）の中に置く。
     一覧の上に独立した帯を作ると、その帯のぶんだけ一覧全体が下に押し下げられ、
     ただでさえ狭いスマホのよこ画面で見える件数が減ってしまうため。 */
  var bar=document.getElementById('nnCountSlot');
  if(!bar){

    bar=document.createElement('span'); bar.id='nnCountSlot'; bar.className='nncount';
    var sc=tb.querySelector('.search');

  if(!shown){ bar.innerHTML=''; return; }  /* 0件のときは案内文だけ出す */
  var total=0;
  try{ total=(view==='mine'?mySpecs.length:SPECS.filter(function(o){ return (view==='mk')===!!o.mk; }).length); }catch(e){ total=0; }
  bar.innerHTML='表示 <b>'+shown+'</b>'+unit
    + ((total && total!==shown) ? ' <span class="all">／ 全 '+total+unit+'</span>' : '');
};

   最初の1回はここから呼ぶ（2回目以降は render() の中から呼ばれる）。 */

<script id="nn-hdr-std-js">
/* 倍率 --nnhm を計算して渡す（＝そのページの組み立て幅 ÷ 980） */
(function(){
  function set(){
    try{
      /* ★パソコンでは倍率1（＝今までどおり）にすること。
         パソコンのブラウザは viewport の width=980 指定を無視するため、
         画面を縮めて表示していない。ここで innerWidth/980 を掛けると
         ヘッダーだけ1.5倍に膨らんでしまう。 */
      var dev = Math.min(screen.width || 0, screen.height || 0);
      var phone = dev && dev < 700;
  /* ★★2026-09-07e 指で拡大しても画面が崩れないように「組み立ての大きさ」で測る（§319）。
     iPhoneは指で拡大すると innerWidth・innerHeight まで**いま見えている範囲**の大きさに
     変わる（パソコンのブラウザは変わらない）。それをそのまま画面の高さ・縮小率に使うと、
     拡大した分だけ中身が短く・小さくなり、下に何も無い帯が出る＝「ズームすると見切れる」。
     documentElement の clientWidth/clientHeight は**拡大しても変わらない**ので、こちらで測る。 */
  function LW(){ var d=document.documentElement; return (d&&d.clientWidth)||window.innerWidth; }
  function LH(){ var d=document.documentElement; return (d&&d.clientHeight)||window.innerHeight; }
      var m = phone ? ((LW() || 980) / 980) : 1;
      if(!(m > 0.05 && m < 4)) m = 1;              /* あり得ない値は採らない */
      document.documentElement.style.setProperty('--nnhm', m.toFixed(4));
      /* ノッチの逃げの割り増し（＝そのページの縮小率の逆数）。
         いま向いている方の画面の幅で計算すること。 */
      var pr = true;
      try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = LH() > LW(); }
      var scr = pr ? Math.min(screen.width||0, screen.height||0) : Math.max(screen.width||0, screen.height||0);
      var saf = (phone && scr > 0) ? ((LW() || scr) / scr) : 1;
      if(!(saf > 0.5 && saf < 5)) saf = 1;
      document.documentElement.style.setProperty('--nnsaf', saf.toFixed(4));
    }catch(e){}
  }
  set();
  addEventListener('resize', set);
  addEventListener('orientationchange', function(){ setTimeout(set, 300); });
  addEventListener('load', set, {once:true});
})();
</script>

<script id="nn-pczoom-js">
(function(){
  if(document.documentElement.getAttribute('data-nnphone')==='1'){ window.nnPZ=1; return; }

  function autoZ(){

    document.documentElement.style.setProperty('--nnpzr', z);
    document.documentElement.setAttribute('data-nnpz', z===1 ? 'off' : 'on');

    try{ if(window.nnFitMapApp) window.nnFitMapApp(); }catch(e){}

   本人の指示「現場一覧のページにある、付箋タグとの境界線。これ他のページにも付与して」。
   ★形は ::before の斜めの箱で作り、文字は本体に置く（文字はまっすぐのまま読める）。
   ★大きさは指定しない＝各ページの h4 の文字サイズをそのまま使う（ページごとの統一を壊さない）。 */

.httl::before{

<script id="nn-httl-js">
/* 見出しの文字だけを span.httl で包む。
   ★右端に置く補助の文字（.r／.cta など）は包まない＝タグの外に残す。
   ★中身を作り直すページ（国交省仕様・ライブラリ等）があるので、
     作り直されたら包み直す（MutationObserver・0.2秒のまとめ）。 */
(function(){
  var SEL='.panel > h4, .wr-box > h4, .dpanel > h4, .proc-card > h4, .notebox-h > h4';
  var STOP=/(^|\s)(r|cta|zx|colgear|sub|hcount|tag)(\s|$)/;
  function wrap(h){
    if(h.getAttribute('data-nnht')==='1') return;
    if(h.querySelector('.httl')){ h.setAttribute('data-nnht','1'); return; }
    var kids=[].slice.call(h.childNodes);
    var sp=document.createElement('span'); sp.className='httl';
    for(var i=0;i<kids.length;i++){
      var n=kids[i];
      if(n.nodeType===1 && STOP.test(' '+String(n.className||'')+' ')) break;
      sp.appendChild(n);
    }
    if(!String(sp.textContent||'').trim()){        /* 包むものが無いときは何もしない */
      while(sp.firstChild) h.insertBefore(sp.firstChild, h.firstChild);
      return;
    }
    h.insertBefore(sp, h.firstChild);
    h.setAttribute('data-nnht','1');
  }
  function run(){ try{ [].forEach.call(document.querySelectorAll(SEL), wrap); }catch(e){} }
  if(document.readyState==='loading') addEventListener('DOMContentLoaded',run); else run();
  addEventListener('load',function(){ setTimeout(run,200); });
  try{
    var t=null;
    new MutationObserver(function(){ if(t)return; t=setTimeout(function(){ t=null; run(); },200); })
      .observe(document.body,{childList:true,subtree:true});
  }catch(e){}
})();
</script>

<script id="nn-trail-js">
/* ============================================================
   指をなぞると光がついてくる（2026-08-19b・本人の指示）
   線を引く・頂点をつまむ等の細かい操作で「いま指がどこにあるか」が分かるようにする。
   ・画面いっぱいの透明なキャンバスを1枚だけ用意し、指が触れている間だけ描く
   ・座標は clientX/Y をそのまま「画面の実px」として使う（表示倍率 zoom の影響を受けない）
   ・pointer-events:none なので、下のボタンや作図の邪魔は一切しない
   ============================================================ */
(function(){
"use strict";
var cv=null, ctx=null, pts=[], raf=null, active=false, lastT=0;
var LIFE=420;                     /* 光が消えるまで(ms) */
function make(){
  if(cv)return;
  cv=document.createElement('canvas');
  cv.id='nnTrail';
  cv.style.cssText='position:fixed; left:0; top:0; width:100%; height:100%;'
    +'pointer-events:none; z-index:9997;';
  document.body.appendChild(cv);
  ctx=cv.getContext('2d');
}
function fit(){
  var r=cv.getBoundingClientRect();
  /* ★2026-08-26b にじむ光なので等倍で十分。2倍だと描く画素が4倍になり、
     指を置いている間ずっとその分の仕事が挟まっていた（ラグの一因）。 */
  var d=1;
  var w=Math.round(r.width*d), h=Math.round(r.height*d);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  return {r:r, k:cv.width/(r.width||1)};   /* k＝画面px→キャンバスpxの倍率（＝dpr） */
}
function draw(){
  if(!cv){ raf=null; return; }
  var g=fit(), k=g.k, now=performance.now();
  ctx.clearRect(0,0,cv.width,cv.height);
  /* 寿命の切れた点を落とす */
  while(pts.length && now-pts[0].t>LIFE) pts.shift();
  if(pts.length>=2){
    /* しっぽ：新しいほど太く明るい */
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var age=(now-b.t)/LIFE; if(age<0)age=0; if(age>1)age=1;
      var al=(1-age)*0.85;
      /* ★2026-08-26b shadowBlur（にじみ）は1本ごとにぼかし計算が走って重いのでやめ、
         「太く薄い線＋細く明るい線」の2度がきで同じ見え方にする */
      ctx.strokeStyle='rgba(255,180,40,'+(al*0.30).toFixed(3)+')';
      ctx.lineWidth=(7+12*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
      ctx.strokeStyle='rgba(255,217,77,'+al.toFixed(3)+')';
      ctx.lineWidth=(2.5+6*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
    }
  }
  /* 指の先の光 */
  if(active && pts.length){
    var p=pts[pts.length-1];
    var gr=ctx.createRadialGradient(p.x*k,p.y*k,0, p.x*k,p.y*k,9*k);
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.45,'rgba(255,217,77,.80)');
    gr.addColorStop(1,'rgba(255,157,30,0)');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(p.x*k,p.y*k,9*k,0,7); ctx.fill();
  }
  if(active || pts.length){ raf=requestAnimationFrame(draw); }
  else { raf=null; ctx.clearRect(0,0,cv.width,cv.height); }
}
function add(e){
  var now=performance.now();
  if(now-lastT<8) return;          /* 詰めすぎない */
  lastT=now;
  pts.push({x:e.clientX, y:e.clientY, t:now});
  if(pts.length>90) pts.shift();
  if(!raf) raf=requestAnimationFrame(draw);
}
var downX=0, downY=0, movedOn=false;
addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse' && e.buttons===0) return;
  /* ★2026-08-26b タップ（動かさない指）では何も描かない。
     以前は押した瞬間から画面いっぱいのキャンバスを毎コマ描き直していて、
     ボタンを押すたびにその仕事が挟まっていた（ラグの一因）。
     7px以上なぞったときだけ描き始める（なぞりの光は今までどおり）。 */
  active=true; movedOn=false; downX=e.clientX; downY=e.clientY;
},true);
addEventListener('pointermove',function(e){
  if(!active)return;
  if(!movedOn){
    if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)<7) return;
    movedOn=true; make(); pts.length=0;
    pts.push({x:downX, y:downY, t:performance.now()});
  }
  add(e);
},true);
function end(){ active=false; movedOn=false; if(!raf&&cv&&pts.length) raf=requestAnimationFrame(draw); }
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  addEventListener(ev,end,true);
});
})();
</script>

<script id="nn-navfit-js">
/* 下部ナビ（緑の帯）を、中のアイコンより低くしない（2026-09-13u）
   帯の高さを決めるCSSが複数あり、端末で勝ち負けが変わって1段ぶんの高さになると
   2段目が切れる（本人の実機）。中身を実測して足りない分だけ min-height を足す。
   ★余白や位置には触らない（足りているときは何もしない）。 */
(function(){
  function nav(){ return document.getElementById('nav') || document.querySelector('body>nav'); }
  function fit(){
    try{
      var n=nav(); if(!n) return;
      var cs=getComputedStyle(n); if(cs.display==='none') return;
      /* スマホのグリッドはCSSで段数と安全領域を確保。旧補正を回転後に残さない。 */
      if(cs.display==='grid'){ n.style.removeProperty('min-height'); return; }
      var r=n.getBoundingClientRect(); if(!(r.width>r.height)) return;   /* 横長の帯のときだけ */
      var top=1e9,bot=-1e9,k=0,list=n.querySelectorAll('.ni');
      for(var i=0;i<list.length;i++){ var q=list[i].getBoundingClientRect(); if(q.height<2)continue;
        k++; if(q.top<top)top=q.top; if(q.bottom>bot)bot=q.bottom; }
      if(!k) return;
      var need=(bot-top)+(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0)
              +(parseFloat(cs.borderTopWidth)||0)+(parseFloat(cs.borderBottomWidth)||0);
      var cur=parseFloat(n.style.minHeight)||0;
      if(need>r.height+1 && need>8 && need<800 && Math.ceil(need)!==cur)
        n.style.setProperty('min-height',Math.ceil(need)+'px','important');
    }catch(e){}
  }
  function soon(){ try{ requestAnimationFrame(function(){ setTimeout(fit,0); }); }catch(e){ setTimeout(fit,0); } }
  soon();
  addEventListener('load',function(){ soon(); setTimeout(fit,400); },{once:true});
  addEventListener('resize',soon);
  addEventListener('orientationchange',function(){ setTimeout(fit,320); });
  try{ var n0=nav(); if(n0) n0.addEventListener('load',soon,true); }catch(e){}
  try{ var mo=new MutationObserver(soon), t=nav(); if(t) mo.observe(t,{childList:true,subtree:true}); }catch(e){}
})();
</script>
<script id="nn-persist-js">

   頼んでおくと、端末の容量が逼迫したときに localStorage が自動削除されにくくなる
   （iOS/Android とも対応。使えない環境では黙って何もしない）。 */

</script>

<style id="nn-httl-img">
/* ============================================================
   ★2026-08-30g 見出しの平行四辺形を、本人がパワポで作ったフレームの画像に差し替えた（§256）
   ------------------------------------------------------------
   ・形 ＝ icons/httl_frame.png を**3分割（border-image）**で使う。
     左の斜めの端／右の斜めの端 は伸びず、**まん中だけ**が伸びる。
     ＝どんな長さの見出しでも、端の傾き（26.8度）と濃い緑の三角が1画素も崩れない。
     ★右の端を 500px と広く取ってあるのは、濃い緑の三角（左端 x=925）を
       まるごと「伸びない側」に入れるため。ここを狭くすると三角の角度が変わる。
   ・文字 ＝ Noto Sans JP Black（見出しに出る文字だけに絞った 52KB）。
     ★本人がパワポで使った HGP創英角ゴシックUB は Office 専用で、iPhone に無く、
       許諾上ウェブにも載せられない。いちばん近い無料（SIL OFL）の書体に置き換えた。
     ★font-display:swap ＝ 読み終わるまでは端末の書体で出るので、
       表示が1msも遅れない（2026-07-28 の速度の決着を守る）。
   ・色は本人の絵の実測：文字 #502126／フチ 白／枠 #502126（8px＝高さの3.1%）
   ============================================================ */
@font-face{
  font-family:'NNHead';
  src:url('./fonts/notosansjp-black.woff2') format('woff2');  /* 版名は nn-httl-img-js が付け直す（§66） */
  font-weight:400 900; font-style:normal; font-display:swap;
}

  font-weight:900 !important;

  -webkit-text-stroke:1px #fff !important;

}
/* 平行四辺形の本体＝本人の画像。CSSで描いていた地・枠・影は全部やめる */
.httl::before{

  /* ★em は「その要素の font-size」が基準。現場記録帳には昔の「●」印の指定
     （.httl::before{font-size:9px}）が残っていて、そのままでは端の幅が半分になる。

}
html[data-nnphone="1"] .httl{ -webkit-text-stroke-width:.8px !important; }
/* イラストは平行四辺形の内側に。左端は斜めなので、少し右へ寄せないと枠からはみ出す */

<script id="nn-httl-img-js">
/* ★同じ名前で絵を差し替えたときのために、URLに版名を付ける（§66の罠）。
   JSが動かなくてもCSS側の予備（版名なしのURL）で出る。 */
(function(){ try{
  var v=(typeof NN_VER!=='undefined'&&NN_VER)?('?v='+NN_VER):'';
  document.documentElement.style.setProperty('--nnhttl',"url('./icons/httl_frame.png"+v+"')");

   大きさは --s3w（3Dの幅 px）／--s3h（枠の高さ px・つまみ込み）。ダブルクリックで元に戻す。保存は nn_stage_size（nn-stage-size-js）。

<script id="nn-stage-size-js">
/* ★2026-10-11k 3D工程イラストの枠の大きさを「つまみ」で変える（本人「サイズを自由に変更できるように。左右、高さ、全体」・§639）
   .stage の2列目（右端のつまみ）・2行目（下のつまみ）・その角（両方）を掴んで動かす。
   幅は --s3w（3Dの列の px）、高さは --s3h（枠全体の px）。ダブルクリックで元（自動）に戻す。
   保存 nn_stage_size＝{w,h}（px・zoom をかける前。マウスの動きは zoom で割る＝罠1）。 */
(function(){
'use strict';
const KEY='nn_stage_size';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null')||{}; }catch(_){ return {}; } }
function save(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(_){ } }
function apply(){ const st=document.querySelector('#detail .dstd .stage'); if(!st) return; const o=load();
  if(o.w>0) st.style.setProperty('--s3w',o.w+'px'); else st.style.removeProperty('--s3w');
  if(o.h>0){ st.classList.add('szd'); st.style.setProperty('--s3h',(o.h+12)+'px'); } else { st.classList.remove('szd'); st.style.removeProperty('--s3h'); } }
window.nnStageSizeApply=apply;
document.addEventListener('pointerdown',e=>{ const g=e.target.closest('.stage .stgrip'); if(!g) return; const st=g.closest('.stage'), el=document.getElementById('st3d'); if(!st||!el) return;
  e.preventDefault(); try{ g.setPointerCapture(e.pointerId); }catch(_){ } g.classList.add('on');
  const z=st.getBoundingClientRect().width/(st.offsetWidth||1);
  const w0=el.offsetWidth, h0=el.offsetHeight, x0=e.clientX, y0=e.clientY, kx=/x/.test(g.className), ky=/y/.test(g.className), o=load();
  const move=ev=>{ if(kx) o.w=Math.round(Math.min(st.offsetWidth-212,Math.max(200,w0+(ev.clientX-x0)/z))); if(ky) o.h=Math.round(Math.min(3000,Math.max(160,h0+(ev.clientY-y0)/z))); save(o); apply(); };
  const up=()=>{ g.classList.remove('on'); g.removeEventListener('pointermove',move); g.removeEventListener('pointerup',up); g.removeEventListener('pointercancel',up); };
  g.addEventListener('pointermove',move); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up); });
document.addEventListener('dblclick',e=>{ const g=e.target.closest('.stage .stgrip'); if(!g) return; const o=load(); if(/x/.test(g.className)) delete o.w; if(/y/.test(g.className)) delete o.h; save(o); apply(); });
/* 詳細を描くたびに当てる（stageDraw を包む） */
const _sd=window.stageDraw; if(typeof _sd==='function') window.stageDraw=function(sp){ _sd(sp); apply(); };
})();
</script>

<script id="nn-pick-js">
(function(){
  var L=window.NN_PICK; if(!L||!L.length) return;
  var hd=document.querySelector('body > header'); if(!hd) return;
  var box=document.createElement('div'); box.id='nnPick';
  var v=(typeof NN_VER!=='undefined'&&NN_VER)?('?v='+NN_VER):'';
  box.innerHTML=L.map(function(o,i){
    return '<button type="button" class="nnPk '+(o.c||'c-green')+'" data-i="'+i+'">'
      +'<span class="pkIc"><img src="./icons/'+o.img+'.png'+v+'" alt="" onerror="this.remove()">'+(o.mark?'<i>'+o.mark+'</i>':'')+'</span>'
      +'<b class="pkT" data-t="'+o.t+'">'+o.t+'</b><small>'+(o.d||'')+'</small></button>';
  }).join('');
  hd.insertAdjacentElement('afterend',box);
  var B=document.body;
  function open(){ B.classList.add('nn-pick'); box.scrollTop=0; }
  function close(){ B.classList.remove('nn-pick'); try{ window.dispatchEvent(new Event('resize')); }catch(_){} }
  window.nnPickOpen=open; window.nnPickOn=function(){ return B.classList.contains('nn-pick'); };
  box.addEventListener('click',function(e){ var b=e.target.closest('.nnPk'); if(!b) return;
    var o=L[+b.dataset.i]; if(o.leave){ o.go(); return; } close(); try{ o.go(); }catch(_){} });
  /* ↩ 戻る：中身を見ているときは入口へ（入口ならいつもどおり前のページへ） */
  var prev=window.nnBack;
  window.nnBack=function(){ if(!B.classList.contains('nn-pick')){ open(); return; } return prev&&prev.apply(this,arguments); };
  open();
})();
</script>
<script id="nn-mkgo-js">
/* ★2026-11-19e 本人（図面・積算の3D）「どうやって工程まで行くの？」→「直して」。図面・積算から ?spec=記号 で来たら、入口を飛ばしてその仕様を開く。
   自社仕様（同じ記号のいちばん新しいもの）があれば作り方の欄まで送る／無ければ国交省仕様を開き、「マイ仕様に登録」を押したら作り方の欄まで送る */
(function(){
  var code=''; try{ code=new URLSearchParams(location.search).get('spec')||''; }catch(_){}
  if(!code) return;
  function toMk(){ setTimeout(function(){ var e=document.querySelector('#detail .mkpanel'); if(e){ e.scrollIntoView({block:'start'}); e.classList.add('mkflash'); setTimeout(function(){ e.classList.remove('mkflash'); },2200); } },120); }
  function go(){
    try{ document.body.classList.remove('nn-pick'); }catch(_){}
    var mine=(typeof mySpecs!=='undefined'?mySpecs:[]).filter(function(x){ return String(x.code)===code; }).sort(function(a,b){ return (+b.updatedAt||0)-(+a.updatedAt||0); })[0];
    if(mine){ showView('mine'); selectAndShow({type:'mine',id:mine.id}); toMk(); toast('自社仕様「'+code+'」の作り方の欄です'); return; }
    var pre=(typeof SPECS!=='undefined'?SPECS:[]).filter(function(x){ return String(x.code)===code; })[0];
    if(pre){ showView(pre.mk?'mk':'std'); selectAndShow({type:'std',id:pre.id});
      var _r=window.registerPreset||(typeof registerPreset==='function'?registerPreset:null);
      if(_r){ window.registerPreset=function(){ var r=_r.apply(this,arguments); toMk(); return r; }; try{ registerPreset=window.registerPreset; }catch(_){} }
      toast('「📚 マイ仕様に登録」を押すと、作り方を入れられます'); return; }
    toast('仕様「'+code+'」が見つかりませんでした。＋新規仕様登録で同じ記号の仕様を作ってください');
  }
  if(document.readyState==='complete') setTimeout(go,50); else addEventListener('load',function(){ setTimeout(go,50); });
})();
</script>

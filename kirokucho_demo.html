<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=980, user-scalable=yes, viewport-fit=cover">
<script id="nn-phonemark">
/* ============================================================
   ★端末そのものの幅を見て <html> に data-nnphone="1" を付ける。
     （縮小表示のページでは CSS から見た画面幅が常に980pxになるため、
       「スマホのときだけ」の指定を画面幅で書くと絶対に効かない）
   ============================================================ */
(function(){try{
  var d = Math.min(screen.width||0, screen.height||0);
  if(d && d < 700) document.documentElement.setAttribute('data-nnphone','1');
}catch(e){}})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="納まりナビ">

<style>
/* ホーム画面起動（スタンドアロン）時：ステータスバー下への潜り込みを回避 */
header{padding-top:calc(5px + env(safe-area-inset-top)) !important;}
/* rev.9：横画面でも上部バナー（ヘッダー）は表示する（コンパクトに） */
@media (orientation:landscape) and (max-height:500px){
  header{padding-top:3px !important; padding-bottom:3px !important;}
}
</style>
<title>納まりナビ – 現場記録帳（デモ）</title>
<style>
/* ============================================================
   納まりナビ 現場記録帳 デモ
   ------------------------------------------------------------
   ■ アイコン差し替えについて
   下の ICONS 定義（<script>内の const ICONS）に絵文字/SVGを
   置いています。本番ではここを
     ICONS.home = '<img src="./icons/home.png">'
   のように、佐野さん自作のアイコン画像パスに差し替えるだけです。
   ============================================================ */
:root{
  /* 共通カラーパレットは common.css に移動（--green-deep 等） */
  --profit:#0a6bd6;
  --st-hikiai:#8a63c9; --st-mitsumori:#3d8fd1; --st-chosa:#2aa198;
  --st-juchu:#d1862a; --st-sekou:#d9a520; --st-kansei:#3a9e52;
  --hou-as:#8c2f2f; --hou-x:#1f66c0; --hou-pq:#5c6670; --hou-asi:#a04a20;
  --radius:10px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
}
/* ---------- ヘッダー ---------- */
header{
  background:linear-gradient(135deg,var(--green-deep),var(--green));
  color:#fff; display:flex; align-items:center; gap:14px; padding:10px 18px; flex:none;
}
header .hicon{font-size:22px;}
header h1{font-size:21px; font-weight:800; letter-spacing:.06em;}
header .count{margin-left:auto; font-size:16px; font-weight:700; opacity:.95;}
button.new-btn{
  background:#fff; color:var(--green-deep); border:2px solid #b8e6c9; border-radius:8px;
  font-size:15px; font-weight:800; padding:9px 18px; cursor:pointer; letter-spacing:.05em;
}
button.new-btn:hover{background:#dff5e7;}
/* ---------- 検索・絞り込みバー ---------- */
.toolbar{
  display:flex; align-items:center; gap:10px; padding:8px 18px; background:#dfe3db;
  border-bottom:1px solid var(--line); flex:none; flex-wrap:wrap;
}
.search{flex:0 1 340px; position:relative;}
.search input{
  width:100%; padding:7px 10px 7px 30px; border:1px solid var(--line); border-radius:8px;
  font-size:15px; background:#fff;
}
.search::before{content:"🔍"; position:absolute; left:8px; top:6px; font-size:13px; opacity:.55;}
.chips{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap;}
.chip{position:relative;}
.chip>button{
  background:#3c4440; color:#fff; border:0; border-radius:6px; padding:6px 12px;
  font-size:13.5px; font-weight:700; cursor:pointer; letter-spacing:.03em;
}
.chip>button.active{background:var(--green);}
.chip .menu{
  display:none; position:absolute; top:calc(100% + 4px); right:0; z-index:30;
  background:#fff; border:1px solid var(--line); border-radius:8px; min-width:160px;
  box-shadow:0 6px 18px rgba(0,0,0,.18); max-height:240px; overflow:auto;
}
.chip .menu.open{display:block;}
.chip .menu div{padding:10px 14px; font-size:14.5px; cursor:pointer; white-space:nowrap;}
.chip .menu div:hover{background:var(--green-lite);}
.chip .menu div.sel{background:var(--green); color:#fff;}
/* ---------- 本体2ペイン ---------- */
main{flex:1; display:flex; min-height:0;}
/* 左：物件リスト */
#list{
  flex:0 0 46%; max-width:640px; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px;
}
.pcard{
  background:var(--card); border:1px solid var(--line); border-left:5px solid var(--line);
  border-radius:var(--radius); padding:10px 14px; cursor:pointer; transition:box-shadow .12s;
}
.pcard:hover{box-shadow:0 3px 10px rgba(0,0,0,.10);}
.pcard.sel{border-left-color:var(--green); box-shadow:0 0 0 2px var(--green-lite),0 3px 10px rgba(0,0,0,.10);}
.pcard .row1{display:flex; align-items:baseline; gap:10px;}
.pcard h3{font-size:16.5px; font-weight:800; flex:1; line-height:1.35;}
.pcard .area{font-size:13.5px; color:var(--ink-sub); white-space:nowrap;}
.pcard .roofs{margin:6px 0 4px; display:flex; flex-direction:column; gap:3px;}
.roofline{font-size:13.5px; color:var(--ink-sub); display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center;}
.badge{
  display:inline-block; color:#fff; border-radius:4px; padding:2px 8px; font-size:12px; font-weight:800; letter-spacing:.04em;
}
.b-as{background:var(--hou-as);} .b-x{background:var(--hou-x);}
.b-pq{background:var(--hou-pq);} .b-asi{background:var(--hou-asi);}
.pcard .row3{display:flex; align-items:center; gap:10px; margin-top:5px; font-size:13.5px; color:var(--ink-sub); flex-wrap:wrap;}
.status{border-radius:5px; padding:3px 10px; font-size:12.5px; font-weight:800; color:#fff;}
.pcard .money{margin-left:auto; text-align:right;}
.pcard .money .order{font-size:15px; font-weight:800;}
.pcard .money .profit{font-size:14.5px; font-weight:800; color:var(--profit);}
/* 右：詳細 */
#detail{flex:1; min-width:0; overflow-y:auto; background:#f7f8f5; border-left:1px solid var(--line);}
.dhead{padding:14px 18px 0;}
.dhead .t{display:flex; align-items:baseline; gap:12px;}
.dhead h2{font-size:19px; font-weight:800; flex:1;}
.dhead .meta{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; font-size:14px; color:var(--ink-sub); align-items:center;}
.dhead .meta b{color:var(--ink); font-size:15px;}
.dhead .profit{color:var(--profit); font-weight:800;}
/* タブ */
.tabs{display:flex; gap:2px; margin:12px 18px 0; border-bottom:2px solid var(--line); flex-wrap:wrap;}
.tabs button{
  border:0; background:transparent; padding:10px 18px; font-size:15px; font-weight:700; color:var(--ink-sub);
  cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px;
}
.tabs button.on{color:var(--green-deep); border-bottom-color:var(--green);}
.tabbody{padding:14px 18px 90px;}
/* 概要グリッド */
.g-kpi{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:12px;}
.kpi{background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px;}
.kpi .l{font-size:12.5px; color:var(--ink-sub); font-weight:700;}
.kpi .v{font-size:18px; font-weight:800; margin-top:2px;}
.kpi.hl{border-color:var(--profit); box-shadow:inset 0 0 0 1px var(--profit);}
.kpi.hl .v{color:var(--profit);}
.g-two{display:grid; grid-template-columns:1fr 300px; gap:14px; align-items:start;}
@media(max-width:1100px){.g-two{grid-template-columns:1fr;}}
.panel{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:12px;}
.panel h4{font-size:13px; font-weight:800; color:var(--green-deep); margin-bottom:8px; letter-spacing:.04em;}
.kv{display:grid; grid-template-columns:120px 1fr; gap:6px 10px; font-size:14.5px;}
.kv dt{color:var(--ink-sub); font-weight:700;}
.kv dd{font-weight:600;}
.tantou{background:#8a7a2a; color:#fff; border-radius:4px; padding:2px 9px; font-size:12.5px; font-weight:700; margin-left:6px;}
.rooftbl{width:100%; border-collapse:collapse; font-size:14px;}
.rooftbl th,.rooftbl td{border:1px solid var(--line); padding:7px 9px; text-align:left;}
.rooftbl th{background:var(--green-lite); font-weight:800;}
.kabuse{background:#3c4440; color:#fff; border-radius:4px; padding:2px 8px; font-size:12px; font-weight:700;}
/* ドーナツ */
.donut-wrap{display:flex; gap:12px; align-items:center;}
.legend{font-size:13.5px; display:flex; flex-direction:column; gap:5px;}
.legend .li{display:flex; align-items:center; gap:6px;}
.legend .sw{width:12px; height:12px; border-radius:3px; flex:none;}
/* 写真・資料 placeholder */
.ph-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px;}
.ph{aspect-ratio:4/3; background:#e4e7e0; border:1px dashed #b9c0b5; border-radius:8px;
  display:flex; align-items:center; justify-content:center; font-size:26px; color:#93a09a;}
.hint{font-size:13.5px; color:var(--ink-sub); margin-top:10px; line-height:1.7;}
/* 人工テーブル */
.jin-tbl{width:100%; border-collapse:collapse; font-size:14.5px;}
.jin-tbl th,.jin-tbl td{border:1px solid var(--line); padding:8px 10px;}
.jin-tbl th{background:var(--green-lite); font-weight:800;}
.jin-tbl td.num{text-align:right; font-variant-numeric:tabular-nums;}
.jin-tbl tfoot td{font-weight:800; background:#f2f4ef;}
.addrow{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;}
.addrow input{padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:15px;}
.addrow input.dt{width:130px;} .addrow input.n{width:80px;} .addrow input.m{flex:1; min-width:140px;}
.addrow button{background:var(--green); color:#fff; border:0; border-radius:6px; padding:10px 18px; font-weight:800; cursor:pointer;}
/* 工程バー */
.gantt{display:flex; flex-direction:column; gap:8px;}
.gr{display:grid; grid-template-columns:130px 1fr; gap:8px; align-items:center; font-size:12.5px;}
.gbar{height:18px; border-radius:5px; background:var(--green-lite); position:relative; overflow:hidden;}
.gbar>i{position:absolute; top:0; bottom:0; border-radius:5px; background:var(--green);}
/* エクスポート */
.exp-btns{display:flex; gap:10px; flex-wrap:wrap;}
.exp-btns button{background:#fff; border:2px solid var(--green); color:var(--green-deep);
  border-radius:8px; padding:10px 18px; font-size:14px; font-weight:800; cursor:pointer;}
.exp-btns button:hover{background:var(--green-lite);}
/* 下部ナビ */
nav{
  flex:none; background:#202623; display:flex; gap:4px; padding:6px 8px; overflow-x:auto;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
}
nav .ni{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfd6d1;
  font-size:12px; font-weight:700; padding:5px 13px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
nav .ni .ic{font-size:23px; line-height:1;}
nav .ni:hover{background:#333b37;}
nav .ni.on{background:var(--green); color:#fff;}
/* --- モバイル対応：ナビのあふれスクロール・縮小・セーフエリア --- */
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
nav::-webkit-scrollbar{display:none;}
@media(max-width:700px){
  nav .ni{padding:4px 8px; font-size:10px; gap:1px;}
  nav .ni .ic{font-size:19px;}
}

/* モーダル */
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100;}
.modal-bg.open{display:flex;}
.modal{background:#fff; border-radius:12px; width:min(520px,92vw); padding:20px 22px; max-height:88vh; overflow:auto;}
.modal h3{font-size:16px; font-weight:800; color:var(--green-deep); margin-bottom:14px;}
.modal label{display:block; font-size:14px; font-weight:700; color:var(--ink-sub); margin:10px 0 3px;}
.modal input,.modal select{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:7px; font-size:16px;}
.modal .btns{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
.modal .btns .cancel{background:#eee; border:0; border-radius:7px; padding:9px 16px; font-weight:700; cursor:pointer;}
.modal .btns .ok{background:var(--green); color:#fff; border:0; border-radius:7px; padding:9px 20px; font-weight:800; cursor:pointer;}
.empty{padding:40px 20px; text-align:center; color:var(--ink-sub); font-size:14px;}
/* 追加工事 */
.ex-tbl{width:100%; border-collapse:collapse; font-size:14px; margin-bottom:12px;}
.ex-tbl th,.ex-tbl td{border:1px solid var(--line); padding:8px 10px;}
.ex-tbl th{background:#fdeee0; font-weight:800; color:#8a4a12;}
.ex-tbl td.num{text-align:right; font-variant-numeric:tabular-nums;}
.ex-status{display:inline-block; border-radius:5px; padding:3px 10px; font-size:12px; font-weight:800; color:#fff; white-space:nowrap;}
.exs-hassei{background:#8a8f88;} .exs-nemawashi{background:#3d8fd1;} .exs-koushou{background:#d9a520;}
.exs-kaishu{background:#3a9e52;} .exs-fuseiritsu{background:#b0392f;}
.ex-summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-bottom:14px;}
.ex-sum-card{border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff;}
.ex-sum-card .l{font-size:11px; color:var(--ink-sub); font-weight:700;}
.ex-sum-card .v{font-size:15px; font-weight:800; margin-top:2px;}
.ex-sum-card.warn{border-color:#d9a520; background:#fffaf0;} .ex-sum-card.warn .v{color:#a06a00;}
.ex-sum-card.good{border-color:#3a9e52; background:#f3fbf5;} .ex-sum-card.good .v{color:#1e7a3a;}
.ex-sum-card.risk{border-color:#b0392f; background:#fdf2f1;} .ex-sum-card.risk .v{color:#a02a20;}
.kpi.warn2{border-color:#d9a520; box-shadow:inset 0 0 0 1px #d9a520;} .kpi.warn2 .v{color:#a06a00;}
/* リストカードの追加工事フラグ */
.exflag{display:inline-flex; align-items:center; gap:3px; background:#fdeee0; color:#8a4a12; border:1px solid #e8c090;
  border-radius:5px; padding:2px 9px; font-size:12px; font-weight:800;}
/* ---------- ダッシュボード ---------- */
#dashboard{flex:1; overflow-y:auto; padding:10px 14px 90px; display:none;}
.dash-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:10px;}
.dk{background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 12px;}
.dk .l{font-size:12px; color:var(--ink-sub); font-weight:700;}
.dk .v{font-size:19px; font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums;}
.dk .s{font-size:12px; color:var(--ink-sub); margin-top:2px;}
.dk.green{border-color:var(--green); background:#f3faf5;} .dk.green .v{color:var(--green-deep);}
.dk.blue .v{color:var(--profit);}
.dk.warn{border-color:#d9a520; background:#fffaf0;} .dk.warn .v{color:#a06a00;}
.dash-grid{display:grid; grid-template-columns:1.15fr 1fr; gap:10px;}
@media(max-width:860px){.dash-grid{grid-template-columns:1fr;}}
.dpanel{background:#fff; border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:10px;}
.dpanel h4{font-size:13.5px; font-weight:800; color:var(--green-deep); margin-bottom:10px; letter-spacing:.04em; display:flex; align-items:center; gap:8px;}
.dpanel h4 .cta{margin-left:auto; font-size:11.5px; color:var(--profit); cursor:pointer; font-weight:700;}
.mini-tbl{width:100%; border-collapse:collapse; font-size:14px;}
.mini-tbl th,.mini-tbl td{border-bottom:1px solid var(--line); padding:8px 9px; text-align:left;}
.mini-tbl th{font-size:11px; color:var(--ink-sub); font-weight:800; background:transparent;}
.mini-tbl td.num{text-align:right; font-variant-numeric:tabular-nums;}
.mini-tbl tr.click{cursor:pointer;}
.mini-tbl tr.click:hover td{background:var(--green-lite);}
.alert-row{display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid #e8c090; background:#fffaf3;
  border-radius:8px; margin-bottom:8px; cursor:pointer; font-size:12.5px;}
.alert-row:hover{background:#fdeee0;}
.alert-row .amt{margin-left:auto; font-weight:800; color:#a06a00; white-space:nowrap;}
.alert-row .nm{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bars{display:flex; align-items:flex-end; gap:10px; height:120px; padding:4px 2px 0;}
.bars .bcol{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0;}
.bars .bar{width:70%; background:linear-gradient(180deg,var(--green),#1e5c3a); border-radius:4px 4px 0 0;}
.bars .bl{font-size:10.5px; color:var(--ink-sub); white-space:nowrap;}
.bars .bv{font-size:10px; font-weight:800; color:var(--green-deep); white-space:nowrap;}
.go-list-btn{display:block; width:100%; text-align:center; background:var(--green); color:#fff; border:0;
  border-radius:10px; padding:13px; font-size:15px; font-weight:800; cursor:pointer; letter-spacing:.05em; margin-top:4px;}
.go-list-btn:hover{background:var(--green-deep);}
.back-dash{background:#3c4440; color:#fff; border:0; border-radius:6px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer;}
.back-dash:hover{background:var(--green-deep);}
/* ドロップゾーン */
.dropzone{
  border:2px dashed #9db8a6; border-radius:10px; background:#f2f8f4; padding:22px 14px;
  text-align:center; color:#4a6b57; font-size:13.5px; font-weight:700; margin-bottom:12px; transition:background .12s,border-color .12s;
}
.dropzone.over{background:#dff2e6; border-color:var(--green);}
.dropzone small{display:block; font-weight:500; color:var(--ink-sub); margin-top:4px;}
.dropzone .pick{color:var(--green-deep); text-decoration:underline; cursor:pointer;}
/* 写真サムネイル */
.ph-grid .thumb{aspect-ratio:4/3; border-radius:8px; overflow:hidden; border:1px solid var(--line); position:relative; cursor:pointer; background:#000;}
.ph-grid .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.ph-grid .thumb .nm{position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); color:#fff; font-size:10.5px; padding:2px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
/* 資料リスト */
.doc-list{display:flex; flex-direction:column; gap:8px;}
.doc{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 12px;}
.doc .dic{font-size:20px;}
.doc .nm{flex:1; font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.doc .sz{font-size:11.5px; color:var(--ink-sub); white-space:nowrap;}
.doc button{background:var(--green-lite); border:1px solid var(--green); color:var(--green-deep); border-radius:6px; padding:5px 12px; font-size:12px; font-weight:800; cursor:pointer;}
/* トースト */
#toast{position:fixed; left:50%; bottom:78px; transform:translateX(-50%) translateY(20px); background:#1e2a24; color:#fff;
  padding:10px 18px; border-radius:9px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:all .25s; z-index:200; max-width:86vw;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
/* ---------- モバイル対応（900px以下） ---------- */
.back-list{display:none;}
@media(max-width:900px){
  header{padding:10px 12px; gap:10px; flex-wrap:wrap;}
  header h1{font-size:18px;}
  header .count{font-size:13px;}
  button.new-btn{font-size:13.5px; padding:8px 12px;}
  .toolbar{padding:8px 10px;}
  .search{flex:1 1 100%;}
  .chips{margin-left:0; width:100%;}
  #list{flex:1 1 100%; max-width:none; padding:10px;}
  #mainview.show-detail #list{display:none;}
  #mainview:not(.show-detail) #detail{display:none;}
  #detail{border-left:0;}
  .back-list{display:inline-block; background:#3c4440; color:#fff; border:0; border-radius:7px;
    padding:9px 16px; font-size:14.5px; font-weight:700; cursor:pointer; margin-bottom:10px;}
  .dhead{padding:12px 12px 0;}
  .tabbody{padding:12px 12px 90px;}
  .tabs{margin:12px 12px 0; overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}

<!-- ============================================================

     Zen Kaku Gothic New は日本語フォント。Googleはこれを
     「約120個に小分けした指定 × 太さ3種 ＝ 約360個の指定（81KB）」
     という形のCSSで配ってくる。ページを開くたびに、この360個の指定を

     中身の重さと関係なく、毎回まるまる待たされていた。

     実測（同一条件）：このCSSがあると画面が出るまでの時間が約2倍
       ホーム        1,152ms → 2,288ms
       現場記録帳    1,940ms → 3,592ms
       現場マップ      544ms →   532ms （このCSSを読まないページ＝変化なし）

       下の NN_WEBFONT を true にすると、画面が出たあとに読み込んで

  background:linear-gradient(180deg, var(--green-hi), var(--green) 60%, var(--green-deep));
  color:#fff; border:1.5px solid var(--green-edge); border-radius:8px;
  padding:7px 20px; font-size:13.5px; font-weight:700; letter-spacing:.03em; font-family:inherit;
  text-shadow:0 1px 1px rgba(18,74,40,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 var(--green-edge), 0 4px 6px rgba(0,0,0,.12);
  transition:transform .06s, box-shadow .06s;
}
.btn-ok:hover{filter:brightness(1.06); background:linear-gradient(180deg, var(--green-hi), var(--green) 60%, var(--green-deep));}
.btn-ok:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 var(--green-edge);}
.btn-ghost{
  background:linear-gradient(180deg,#ffffff,#eef6ef);
  border:1.5px solid var(--green); color:var(--green-deep); border-radius:8px;
  padding:5px 13px; font-size:12.5px; font-weight:700; font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 #9cc4a8;
  transition:transform .06s, box-shadow .06s;
}
.btn-ghost:hover{background:var(--green-lite);}
.btn-ghost:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 #9cc4a8;}
.btn-del{font-size:12px; font-weight:700; font-family:inherit;}

/* kokkosho: CTAボタン */
.cta{
  border-radius:8px; font-weight:700; font-family:inherit;
  transition:transform .06s, box-shadow .06s;
}
.cta.primary{
  background:linear-gradient(180deg, var(--green-hi), var(--green) 60%, var(--green-deep));
  border:1.5px solid var(--green-edge); color:#fff;
  text-shadow:0 1px 1px rgba(18,74,40,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 var(--green-edge);
}
.cta.primary:hover{filter:brightness(1.06); background:linear-gradient(180deg, var(--green-hi), var(--green) 60%, var(--green-deep));}
.cta.primary:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 var(--green-edge);}
.cta.ghost{
  background:linear-gradient(180deg,#ffffff,#eef6ef); border:1.5px solid var(--green); color:var(--green-deep);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 #9cc4a8;
}
.cta.ghost:hover{background:var(--green-lite);}
.cta.ghost:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 #9cc4a8;}

/* ---------- 【押せる】タブ ---------- */
#viewtabs{gap:6px; padding:6px 13px 0;}
#viewtabs button{
  border:1.5px solid #a9b5a5; border-bottom:none;
  background:linear-gradient(180deg,#f2f4ee,#d9ddd2); color:#5f6a64;
  border-radius:9px 9px 0 0; padding:6px 14px 5px; font-size:13px; font-weight:700; letter-spacing:.02em; font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
}
#viewtabs button.on{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 12px, transparent 12px 24px),
    linear-gradient(180deg, var(--green-hi), var(--green));
  color:#fff; border-color:var(--green-edge);
  text-shadow:0 1px 1px rgba(18,74,40,.55);
}
#viewtabs button:not(.on):hover{background:linear-gradient(180deg,#f7f9f3,#cfd4c6);}

/* kirokucho: 詳細内タブ（下線式→ピル式） */
.tabs{gap:5px; margin:8px 13px 0; border-bottom:2px solid var(--green); padding-bottom:0;}
.tabs button{
  border:1.5px solid #a9b5a5; border-bottom:none; border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,#f2f4ee,#d9ddd2); color:#5f6a64;
  font-weight:700; font-family:inherit; padding:5px 13px 4px; font-size:12.5px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8); cursor:pointer;
}
.tabs button.on{
  background:linear-gradient(180deg, var(--green-hi), var(--green));
  color:#fff; border-color:var(--green-edge);
  text-shadow:0 1px 1px rgba(18,74,40,.55);
}
.tabs button:not(.on):hover{background:linear-gradient(180deg,#f7f9f3,#cfd4c6); color:#3c4440;}

/* kokkosho: 新築/改修モードタブ・工法タブ */
.mode-tabs{background:rgba(0,0,0,.28); border-radius:9px; padding:3px;}
.mode-tabs button{
  border-radius:7px; font-weight:700; font-family:inherit;
  transition:transform .06s;
}
.mode-tabs button.active{
  background:linear-gradient(180deg,#ffffff,#e8f0e8); color:var(--green-deep);
  box-shadow:inset 0 1px 0 #fff, 0 2px 0 rgba(0,0,0,.35);
}
.hou-tabs button{
  font-family:inherit; font-weight:700; border-radius:8px;
  box-shadow:0 2px 0 rgba(0,0,0,.22);
  transition:transform .06s, box-shadow .06s;
}
.hou-tabs button:active{transform:translateY(2px); box-shadow:0 0 0 rgba(0,0,0,.22);}
.hou-tabs button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 rgba(0,0,0,.3);}

/* ---------- 【押せる】絞り込みチップ・並替等の小ボタン ---------- */
.chip>button{
  background:linear-gradient(180deg,#5b675f,#3c4440); color:#fff; border:1.5px solid #242a27; border-radius:8px;
  padding:4px 10px; font-size:12px; font-weight:700; letter-spacing:.02em; font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 2px 0 var(--edge-dark);
  transition:transform .06s, box-shadow .06s;
}
.chip>button:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 var(--edge-dark);}
.chip>button.active{
  background:linear-gradient(180deg,var(--orange),var(--orange-deep));
  border-color:var(--orange-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 0 var(--orange-edge);
  text-shadow:0 1px 0 rgba(0,0,0,.25);
}
.chip .menu{border:1.5px solid var(--green-deep); border-radius:10px; box-shadow:0 2px 0 var(--green-edge), 0 8px 18px rgba(0,0,0,.18);}
.chip .menu div{font-weight:700;}
.chip .menu div.sel{background:linear-gradient(180deg,var(--green-hi),var(--green)); color:#fff;}
.sortbtn,.range-bar button{
  font-family:inherit; font-weight:700; border-radius:7px;
  box-shadow:0 2px 0 rgba(0,0,0,.18);
  transition:transform .06s, box-shadow .06s; cursor:pointer;
}
.sortbtn:active,.range-bar button:active{transform:translateY(2px); box-shadow:0 0 0 rgba(0,0,0,.18);}

/* ---------- 【押せる】下部ナビ ---------- */
nav#nav, body>nav{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,#1f5c36,#153f25) !important;
  border-top:2px solid #0d2a18;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
  gap:3px; padding:2px 7px;
  padding-bottom:calc(2px + env(safe-area-inset-bottom)); /* 端末下端の見切れ防止（rev.04 ③） */
}
nav .ni, nav#nav .ni{
  color:#cfe6d6; font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:7px;
  transition:transform .06s;
}
nav .ni .ic, nav#nav .ni .ic{font-size:19px; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));}
nav .ni:hover, nav#nav .ni:hover{background:rgba(255,255,255,.10);}
nav .ni:active, nav#nav .ni:active{transform:translateY(1px);}
nav .ni.on, nav#nav .ni.on{
  background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));
  color:#4d3a00; border:1.5px solid #a87f00;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #7d5f00;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
/* ---------- 画像アイコンボタン（ナビ改修指示書 Step3） ---------- */
nav .ni .ic img, nav#nav .ni .ic img{height:44px; display:block;}
nav .ni.hasimg, nav#nav .ni.hasimg{padding:0 3px; margin-top:-13px;}
nav .ni.hasimg > span:last-child, nav#nav .ni.hasimg > span:last-child{display:none;}
nav .ni.hasimg .ic, nav#nav .ni.hasimg .ic{filter:none;}
nav .ni.hasimg.on, nav#nav .ni.hasimg.on{background:none; border:none; box-shadow:none; text-shadow:none;
  filter:drop-shadow(0 0 5px #ffd23f) drop-shadow(0 0 2px #ffd23f);
  transform:scale(1.14);
  transform-origin:center bottom;
  z-index:2; position:relative;
}
nav .ni.hasimg, nav#nav .ni.hasimg{transition:transform .15s ease-out, filter .15s ease-out;}
nav .ni.hasimg:hover, nav#nav .ni.hasimg:hover{transform:scale(1.06);}
nav .ni.hasimg.on:hover, nav#nav .ni.hasimg.on:hover{transform:scale(1.14);}
nav, nav#nav{overflow:visible; padding-top:2px;}
@media (max-width:760px){
  nav, nav#nav{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; justify-content:flex-start;}
  nav::-webkit-scrollbar, nav#nav::-webkit-scrollbar{display:none;}
  nav .ni .ic img, nav#nav .ni .ic img{height:38px;}
  nav .ni.hasimg, nav#nav .ni.hasimg{margin-top:0;}
  nav .ni:first-child, nav#nav .ni:first-child{margin-left:0;}
  nav .ni:last-child, nav#nav .ni:last-child{margin-right:0;}
}
/* ---------- タップ演出（shiyo_toroku基準：タッチ発光） ---------- */
@keyframes tapfx-glow{
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
  60%{opacity:.7;}
  100%{opacity:0; transform:translate(-50%,-50%) scale(2.1);}
}
@keyframes tapfx-ring{
  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.8);}
}
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);
  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .3s ease-out forwards;
}
.tapfx::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:2px solid rgba(255,217,77,.9);
  animation:tapfx-ring .3s ease-out forwards;
}

/* ---------- 【押せる】行・カード：ホバー＋黄色選択 ---------- */
.mrow{cursor:pointer;}
.mrow:hover{background:#f0faf3;}
.mrow.sel{
  background:linear-gradient(180deg,#fff6d6,#ffedaf);
  box-shadow:inset 4px 0 0 var(--orange), inset 0 -1px 0 var(--yellow-deep);
}
.pcard{cursor:pointer; border-radius:9px; transition:transform .08s, box-shadow .08s;}
.pcard:hover{transform:translateY(-1px); box-shadow:0 3px 0 #c9d5c4, 0 6px 14px rgba(0,0,0,.10);}
.pcard.sel{
  background:linear-gradient(180deg,#fffbe8,#fff3c4);
  border-left-color:var(--orange) !important;
  box-shadow:inset 4px 0 0 var(--orange), 0 2px 0 var(--yellow-deep), 0 3px 10px rgba(0,0,0,.08);
}
.spec-card{cursor:pointer; border:1.5px solid #c3d0be; border-radius:10px; box-shadow:0 2px 0 #c9d5c4; transition:transform .08s, box-shadow .08s, border-color .08s;}
.spec-card:hover{transform:translateY(-1px); border-color:var(--green); box-shadow:0 3px 0 #9cc4a8, 0 6px 14px rgba(0,0,0,.10);}
.wz-opt{
  cursor:pointer; border-radius:8px; border-width:1.5px;
  box-shadow:0 2px 0 #d5dccf;
  transition:transform .06s, box-shadow .06s, border-color .06s;
}
.wz-opt:hover{border-color:var(--green);}
.wz-opt:active{transform:translateY(2px); box-shadow:0 0 0 #d5dccf;}
.wz-opt.sel{
  background:linear-gradient(180deg,#fff6d6,#ffedaf);
  border-color:var(--orange-edge); box-shadow:inset 3px 0 0 var(--orange), 0 2px 0 var(--yellow-deep);
}
.qa .q{cursor:pointer;}
.qa .q:hover{background:#f0faf3;}

/* ---------- 【押せない】情報表示：フラット化 ---------- */
.badge,.tag,.pill,.status,.matchip{
  cursor:default;
  border-radius:5px;
  box-shadow:none;
  text-shadow:none;
}
.kpi,.sk,.dkm{box-shadow:none;}
.ghead{
  background:linear-gradient(180deg,#eef6e8,#dcead6);
  color:var(--green-deep); font-weight:700; font-size:11.5px; padding:3px 12px;
  border-bottom:1px solid #bfd0b8;
}

/* ---------- 【無効】準備中・使用不可 ---------- */
#makerbar .mk.soon,.wz-opt.disabled,button:disabled{
  background:#eceee6 !important; color:#9aa094 !important;
  border:1.5px dashed #b5bcae !important;
  box-shadow:none !important; text-shadow:none !important;
  cursor:not-allowed !important; opacity:.75 !important;
  transform:none !important; pointer-events:auto;
}
.wz-opt.disabled{pointer-events:none;}

/* ---------- パネル・見出し帯 ---------- */
.panel{
  border:1px solid #c3d0be; border-radius:8px; padding:8px 11px; margin-bottom:8px;
  box-shadow:0 1px 0 #c9d5c4;
}
.panel h4{
  font-size:11.5px; font-weight:700; color:var(--green-deep); margin:-8px -11px 7px;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.10) 0 9px, transparent 9px 18px),
    linear-gradient(180deg,#e9f6e4,#d5ecd0);
  padding:4px 11px; border-bottom:1px solid #bcd6b6; border-radius:7px 7px 0 0;
  display:flex; align-items:center; gap:7px; flex-wrap:wrap; letter-spacing:.03em;
}

/* ---------- ツールバー・検索 ---------- */
.toolbar{gap:7px; padding:5px 13px; border-top:2px solid var(--green-deep); background:rgba(46,158,88,.10);}
.search input{padding:5px 10px 5px 28px; border:1.5px solid #b9c4b4; border-radius:8px; font-size:14px; font-family:inherit; font-weight:500; box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
.search input:focus{border-color:var(--green); outline:none;}
.search::before{left:9px; top:6px; font-size:12px;}

/* ---------- モーダル ---------- */
.modal{
  background:#fffdf4; border:2px solid var(--green-deep); border-radius:10px; padding:13px 15px;
  box-shadow:0 3px 0 var(--green-edge), 0 14px 32px rgba(0,0,0,.3);
}
.modal h3{
  font-size:13.5px; font-weight:700; color:#fff; margin:-13px -15px 11px; letter-spacing:.04em;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,var(--green-hi),var(--green));
  padding:7px 15px; border-bottom:2px solid var(--green-edge); border-radius:7px 7px 0 0;
  text-shadow:0 1px 1px rgba(18,74,40,.55);
}
.modal label{font-size:12.5px; font-weight:700; margin:8px 0 2px;}
.modal input,.modal select,.modal textarea{border:1.5px solid #b9c4b4; border-radius:7px; padding:7px 10px; font-family:inherit; background:#fff; box-shadow:inset 0 2px 4px rgba(0,0,0,.07);}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--green); outline:none;}
.modal .btns{gap:8px; margin-top:13px;}
.modal .btns .cancel{
  background:linear-gradient(180deg,#f2f2ee,#dcdcd4); border:1.5px solid #a9a99f; border-radius:8px; padding:6px 13px; font-weight:700; font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 2px 0 var(--edge-gray);
  transition:transform .06s, box-shadow .06s;
}
.modal .btns .cancel:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 0 0 var(--edge-gray);}
.modal .btns .ok{
  background:linear-gradient(180deg,var(--orange),var(--orange-deep)); color:#fff; border:1.5px solid var(--orange-edge); border-radius:8px; padding:6px 17px; font-weight:700; letter-spacing:.02em; font-family:inherit;
  text-shadow:0 1px 0 rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 0 var(--orange-edge);
  transition:transform .06s, box-shadow .06s;
}
.modal .btns .ok:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 0 0 var(--orange-edge);}
.modal .btns .danger{
  border:1.5px solid var(--warn,#e04530); border-radius:8px; padding:6px 12px; font-weight:700; font-family:inherit;
  box-shadow:0 2px 0 #8c2c1e;
  transition:transform .06s, box-shadow .06s;
}
.modal .btns .danger:active{transform:translateY(2px); box-shadow:0 0 0 #8c2c1e;}
.modal .sec{border-top:1px dashed #c2ccbc; margin-top:12px; padding-top:10px;}

/* ---------- トースト ---------- */
#toast,.toast{
  background:linear-gradient(180deg,#2c3a31,#1a2620); color:#fff; border:1.5px solid #0d1712;
  padding:7px 15px; border-radius:8px; font-size:12.5px; font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 2px 0 #0a110d, 0 6px 12px rgba(0,0,0,.25);
}

/* ---------- メーカーバー（仕様登録） ---------- */
#makerbar{gap:5px; padding:4px 12px 4px; background:rgba(46,158,88,.07);}
#makerbar .mk{
  border:1.5px solid #b0bcaa; background:linear-gradient(180deg,#ffffff,#eef1e8); border-radius:7px; padding:3px 10px; font-size:11.5px; font-weight:700; font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 0 #9aa694;
  transition:transform .06s, box-shadow .06s;
}
#makerbar .mk:hover{border-color:var(--green);}
#makerbar .mk:active{transform:translateY(1px); box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 #9aa694;}
#makerbar .mk.on{
  background:linear-gradient(180deg,var(--green-hi),var(--green));
  border-color:var(--green-edge); color:#fff;
  text-shadow:0 1px 0 rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 1px 0 var(--green-edge);
}

/* ============ v2移行分の追加スタイル（現行デザイン踏襲） ============ */
.rail{display:flex;overflow-x:auto;border:1px solid var(--line);border-radius:9px}
.rail span{flex:1 0 auto;min-width:72px;text-align:center;font-size:12px;font-weight:800;padding:8px 6px;background:#f2f4ef;color:var(--ink-sub);border-right:1px solid var(--line)}
.rail span:last-child{border-right:0}
.rail span.past{background:var(--green-lite);color:var(--green-deep)}
.rail span.now{background:linear-gradient(180deg,var(--green-hi),var(--green));color:#fff;text-shadow:0 1px 1px rgba(18,74,40,.55)}
.rail span em{display:block;font-style:normal;font-size:10px;font-weight:700;opacity:.9}
.pbars{display:grid;grid-template-columns:62px 1fr 130px;gap:8px 10px;align-items:center;font-size:12.5px;font-weight:800}
.pbars .lb{color:var(--ink-sub)}
.ptrack{height:20px;background:#eef1ea;border:1px solid var(--line);border-radius:7px;overflow:hidden;position:relative}
.ptrack i{display:block;height:100%}
.ptrack u{position:absolute;top:-1px;bottom:-1px;width:2px;background:#7e8a72;text-decoration:none}
.pbars .vv{text-align:right;font-variant-numeric:tabular-nums}
.pace{margin-top:12px;border:1px solid var(--line);border-radius:9px;padding:14px 13px 9px;background:#fbfdf5}
.pace.bad{border-color:#e8b0a8;background:#fdf7f5}
.pace .pr{display:flex;align-items:center;gap:10px;margin-bottom:14px}

.pace .pt2 b{position:absolute;top:-9px;transform:translateX(-50%);font-size:11.5px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:1.6;white-space:nowrap}
.pace .pd{font-size:12px;font-weight:700;color:var(--ink-sub);border-top:1px dashed var(--line);padding-top:7px;line-height:1.6}

.cline{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.cline .lb{flex:0 0 52px;font-size:12px;font-weight:800;color:#fff;text-align:center;border-radius:7px;padding:3px 0;background:linear-gradient(180deg,var(--green-hi),var(--green));text-shadow:0 1px 1px rgba(18,74,40,.55)}
.cline .lb.o{background:linear-gradient(180deg,#e0a04a,#b57a1f)}
.cbar{flex:1;display:flex;height:22px;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.cbar i{display:block;height:100%;font-style:normal;font-size:11px;font-weight:800;line-height:20px;text-align:center;white-space:nowrap;overflow:hidden;color:#25301f;border-right:1px solid rgba(255,255,255,.65)}
.cbar i:last-child{border-right:0}
.cline .cpct{flex:0 0 auto;min-width:58px;text-align:center;font-size:14.5px;font-weight:800;background:#fff;border:1.5px solid var(--line);padding:2px 8px}
.ninq{display:flex;gap:22px;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line);font-weight:800}
.ninq .k{font-size:12px;color:var(--ink-sub)} .ninq .v{font-size:19px;margin-left:6px}

  display:flex; flex-direction:column; min-width:0; box-shadow:0 1px 0 rgba(0,0,0,.06);}
/* グループ見出し：分類名＋件数（白抜き・はっきり読める大きさ） */
.kgh{color:#fff; font-family:var(--font-title); font-weight:800; font-size:14px; letter-spacing:.06em;
  padding:3px 7px; line-height:1; text-shadow:0 1px 0 rgba(0,0,0,.3);
  display:flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap;}
.kgh b{font-size:19px; font-weight:800; letter-spacing:.02em; opacity:.98; line-height:1;}
.kgh b u{text-decoration:none; font-size:12px; font-weight:700; margin-left:1px; letter-spacing:0;}
/* 指標セル */
.kgb{display:grid; flex:1; min-width:0;}
.kgrp.g3 .kgb{grid-template-columns:1fr 1fr 1.42fr;}
.kgrp.g2 .kgb{grid-template-columns:1fr 1fr;}
/* 指標名・金額・補足の3段は、どのセルも同じ高さに固定して横一直線にそろえる
   （粗利率だけ「見積→実行」の副題が入るため、名前の枠に余裕を持たせている） */
.kcell{padding:6px 5px 7px; text-align:center; cursor:pointer; min-width:0;
  display:flex; flex-direction:column; justify-content:flex-start; transition:background .1s;}
.kgm{min-height:31px; display:flex; flex-direction:column; justify-content:center;}
.kgv{min-height:23px; display:flex; align-items:center; justify-content:center;}
.kgs{min-height:29px;}
.kcell + .kcell{border-left:1px solid var(--line);}      /* 指標どうしの境界線 */
.kcell:hover{background:#f7faf5;}
.kgm{font-family:var(--font-title); font-weight:800; font-size:11.5px; letter-spacing:.04em; line-height:1.25;}
.kgm i{display:block; font-style:normal; font-size:9px; font-weight:700; opacity:.75; letter-spacing:0; margin-top:1px;}
.kgv{font-size:17.5px; font-weight:800; line-height:1.15; margin-top:3px; white-space:nowrap;}
.kgv s{text-decoration:none; font-size:11.5px;}
.kgv .ar2{color:var(--ink-sub); font-size:15px; margin:0 1px;}
.kgs{font-size:9.5px; color:var(--ink-sub); font-weight:700; line-height:1.5; margin-top:3px; white-space:nowrap;}
.kgs .dn3{color:var(--warn); font-weight:800;}
/* 色分け：完成＝緑／契約＝橙／見積＝青／完成〜契約＝緑から橙へ */
.kgrp.grn{border-color:#4e9d6d;} .kgrp.grn .kgh{background:linear-gradient(180deg,#33915a,#1c6b3c);} .kgrp.grn .kgm{color:#1c6b3c;}
.kgrp.org{border-color:#c9925c;} .kgrp.org .kgh{background:linear-gradient(180deg,#c47a2c,#96530f);} .kgrp.org .kgm{color:#96530f;}
.kgrp.blue{border-color:#7fa8d4;} .kgrp.blue .kgh{background:linear-gradient(180deg,#3d84c6,#1a5590);} .kgrp.blue .kgm{color:#1a5590;}
.kgrp.mix{border-color:#a89f77;} .kgrp.mix .kgh{background:linear-gradient(100deg,#2f8b55,#a4661f);} .kgrp.mix .kgm{color:#6d6a2c;}
.kgrp.grn .kcell.on,.kgrp.grn .kcell:active{background:#eef6ef;}
@media(max-width:760px){ .kgrps{grid-template-columns:1fr 1fr; gap:7px;} }
/* 予実：見積→実行の変化を一目で分かるようにする「▼」の行 */
.cdown{margin-bottom:5px !important;}
.cdown .lb.ar{background:none; box-shadow:none; color:var(--warn); text-shadow:none;
  font-size:17px; line-height:1; padding:0; font-weight:800;}
.cdown .ddx{font-size:11.5px; font-weight:800; color:var(--ink-sub); white-space:nowrap; overflow:hidden;}
.cdown .ddx b{color:var(--warn); font-size:13.5px;}
.cdown .ddx b.up{color:var(--green-deep);}
.cdown .ddx .dnote{font-weight:700; font-size:10.5px; opacity:.85;}
/* ============ タップ反応の高速化（2026-07-26） ============
   ★重要：この指定は以前「印刷用ウィンドウのHTML文字列」の中に書かれており、
   アプリ本体には一度も効いていなかった。ここに置くことで初めて有効になる。
   ・touch-action:manipulation ＝ ダブルタップ拡大の判定待ち（約300ms）を無効化。
     一覧モード（幅980pxで拡大可能）ではこの待ちが特に長く、体感遅延の主原因だった。
     ピンチ（2本指）での拡大縮小は今までどおり使える。 */
html,body{touch-action:manipulation;}
*{-webkit-tap-highlight-color:transparent;}
button,a,input,select,label,.ni,.stchip,.dfrow,.dfclear,.kcell,.kbtn,.alert-row,.drow2,.click,
.stseg,.calnav,.zx,.colgear,.sortbtn,.chip>button,.mk,.seg,.cbar i,[onclick]{touch-action:manipulation;}
/* 押した瞬間の手応え（処理を待たずに見た目が反応する） */
.kcell:active,.alert-row:active,.drow2:active,.dfrow:active{background:#eef3ea;}
.stchip:active,.calnav:active,.range-btn:active{transform:translateY(1px);}

/* ステータス行の文字を大きく（1行に収まるよう余白側で調整し、狭い画面では折り返す） */
.stbar{gap:5px;}
.stbar .lb{font-size:14px;}
.stchip{font-size:13.5px; padding:4px 10px;}
.stchip b{font-size:15px;}
.dfbtn-car{font-size:11px;}
.stbar .rng{font-size:13px; gap:4px;}
.stbar .rng input[type=date]{width:104px; padding:4px 5px; font-size:12.5px;}
.stbar .range-btn{padding:4px 9px; font-size:12.5px;}
@media(max-width:900px){ .stbar{flex-wrap:wrap; overflow-x:visible;} .stbar .rng{margin-left:auto;} }
.dfrow{font-size:13.5px;} .dfrow .vc{font-size:11.5px;} .dfclear{font-size:12.5px;}

/* ============ 現場一覧：行を薄く・右上に母数・右にスクロールバー（2026-07-26） ============
   栄冠クロスのプレゼントBOX画面を参考に、1件の帯を約半分の高さに詰める。
   書体・配色は変えず、余白と行数だけを詰めている。 */
.pcard{padding:4px 12px 5px; border-left-width:4px; border-radius:8px;}
.pcard .row1{gap:8px;}
.pcard h3{font-size:15px; line-height:1.3;}
.pcard .area{font-size:12px;}
.pcard .roofs{margin:1px 0 0; gap:0;}
.roofline{font-size:12.5px; gap:3px 7px;}
.pcard .badge{font-size:11px; padding:1px 7px;}
.pcard .row3{margin-top:1px; font-size:12.5px; gap:8px;}
.pcard .status{font-size:11.5px; padding:2px 8px;}
/* 受注金額と利益予定額を横並びにして1行に収める（以前は改行して2行ぶんの高さがあった） */
.pcard .money{display:inline-flex; align-items:baseline; gap:12px; white-space:nowrap;}
.pcard .money br{display:none;}
.pcard .money .order{font-size:13.5px;}
.pcard .money .profit{font-size:13.5px;}
#list{gap:5px; padding:8px 24px 8px 10px;}

/* 右上の全体母数（スクロールしても上に残る） */
.listhead{margin:-2px 4px 2px 0; text-align:right; padding:0 2px 2px;}
.listhead .lc{font-family:var(--font-title); font-size:13px; font-weight:800; color:var(--green-deep);
  background:#fff; border:1.5px solid #b4d3bf; border-radius:999px; padding:3px 12px;
  box-shadow:0 1px 0 rgba(0,0,0,.06);}
.listhead .lc b{font-size:16px;}
.listhead .lc u{text-decoration:none; font-size:11px; margin-left:1px;}

/* 右のスクロールバー（iPhoneでは標準のバーが出ないため自前で描く） */
main#mainview{position:relative;}
#list{scrollbar-width:none;}
#list::-webkit-scrollbar{display:none;}
#listsb{position:fixed; right:4px; width:13px; border-radius:999px; display:none;
  background:#e5eae1; box-shadow:inset 0 0 0 1.5px #c6d0c0, inset 0 2px 4px rgba(0,0,0,.10); z-index:60;}
#listsb.on{display:block;}
#listsb i{position:absolute; left:1.5px; right:1.5px; min-height:34px; border-radius:999px;
  background:linear-gradient(180deg,#63b184,#2f7a4d); border:1px solid #256b41;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 1px 3px rgba(0,0,0,.28); cursor:grab; touch-action:none;}
#listsb i:active{cursor:grabbing; background:linear-gradient(180deg,#4f9f72,#256b41);}

/* ============ 現場一覧：1画面ずつの切り替え（2026-07-26） ============
   左に一覧・右に詳細の分割をやめ、「一覧が全画面 → 選んだ現場が全画面」にする。
   （分割はスマホの縦・横どちらでも窮屈で操作しづらいため） */
#list{flex:1 1 100%; max-width:none; padding:12px;}
#detail{border-left:0;}
#resizer{display:none;}
#mainview.show-detail #list{display:none;}
#mainview:not(.show-detail) #detail{display:none;}
/* 詳細を見ている間は検索バーを隠して、現場の情報だけで1画面を使う */
body.nn-detail #toolbar{display:none !important;}
/* 「← 現場一覧へ戻る」を常に表示（以前は900px以下だけだった） */
.back-list{display:inline-block; background:linear-gradient(180deg,#4c554f,#343b37); color:#fff;
  border:1px solid #2b312e; border-radius:8px; padding:8px 16px; font-size:14.5px; font-weight:800;
  font-family:var(--font-title); cursor:pointer; margin-bottom:10px; box-shadow:0 2px 0 #232825;}
.back-list:active{transform:translateY(2px); box-shadow:none;}


/* ============ ゲームUI風の手触り（2026-07-26） ============
   ・画面を切り替えると中身が下から浮かび上がる
   ・数字はポンと弾んで出る／バーは伸びる
   ・押した瞬間に沈む。効果音は操作の種類ごとに鳴らし分け（JS側） */
@keyframes nnRise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@keyframes nnPop{0%{opacity:0; transform:scale(.82)} 60%{opacity:1; transform:scale(1.06)} 100%{transform:none}}
@keyframes nnGrowX{from{transform:scaleX(0)} to{transform:scaleX(1)}}
@keyframes nnGrowY{from{transform:scaleY(0)} to{transform:scaleY(1)}}
@keyframes nnShine{from{transform:translateX(-130%)} to{transform:translateX(130%)}}
@keyframes nnDrop{from{opacity:0; transform:translateY(-10px) scaleY(.94)} to{opacity:1; transform:none}}
/* 登場演出は「枠ごと1回」だけにする。
   以前は中の要素すべて（一覧なら77枚）に個別のアニメを付けていたため、
   タブを押すたびに大量の再計算が走り、かえって重くなっていた。 */
#dashboard:is(.nn-in,.nn-in2),#schedview:is(.nn-in,.nn-in2),#mainview:is(.nn-in,.nn-in2){animation:nnRise .28s cubic-bezier(.2,.9,.3,1) both;}
#dashboard:is(.nn-in,.nn-in2) .kgv{animation:nnPop .4s .1s cubic-bezier(.2,1.3,.4,1) both;}
#dashboard:is(.nn-in,.nn-in2) .cbar i{transform-origin:left center; animation:nnGrowX .5s .08s cubic-bezier(.2,.9,.3,1) both;}
#dashboard:is(.nn-in,.nn-in2) .bars2 .stack{transform-origin:bottom; animation:nnGrowY .45s .12s cubic-bezier(.2,.9,.3,1) both;}
.kgh{position:relative; overflow:hidden;}
#dashboard:is(.nn-in,.nn-in2) .kgh::after{content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%);
  animation:nnShine .8s .18s ease-out both;}
/* 内訳・プルダウンは上から降りてくる */
#dtlbox .dpanel{animation:nnDrop .22s cubic-bezier(.2,.9,.3,1) both; transform-origin:top;}
.dfmenu.open{animation:nnDrop .16s ease-out both; transform-origin:top;}
.costdtl{animation:nnDrop .2s ease-out both; transform-origin:top;}
/* 押した瞬間に沈む（処理を待たずに手応えが返る） */
.kcell:active,.kbtn:active,.pcard:active,.alert-row:active,.drow2:active,.stchip:active,
#viewtabs button:active,.freset:active,.ftag:active,.back-list:active,.calnav:active{
  transform:translateY(1px) scale(.985);}
.pcard{transition:transform .07s, box-shadow .12s, background .12s;}
.kcell{transition:transform .07s, background .1s;}
/* 選択中の現場は少し浮かせて目立たせる */
#list .pcard.armed{transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.14);}
/* 動きを減らす設定の端末では演出を止める */
@media (prefers-reduced-motion:reduce){
  #dashboard:is(.nn-in,.nn-in2) > *,#dashboard:is(.nn-in,.nn-in2) .kgrp,#dashboard:is(.nn-in,.nn-in2) .kgv,
  #dashboard:is(.nn-in,.nn-in2) .cbar i,
  #dashboard:is(.nn-in,.nn-in2) .bars2 .stack,#dashboard:is(.nn-in,.nn-in2) .kgh::after,
  #mainview:is(.nn-in,.nn-in2) #list .pcard,
  #dtlbox .dpanel,.dfmenu.open,.costdtl{animation:none !important;}
}


/* ③ ページ移動を滑らかに：入ったらふわっと出る／出るときは一瞬フェード */
/* ★body に transform を付けると position:fixed の基準が画面ではなく本文全体になり、
   下部ナビや固定ボタンが画面下に留まらなくなる。透明度だけで演出すること */
@keyframes nnPageIn{from{opacity:0} to{opacity:1}}
body{animation:nnPageIn .10s ease-out both;}
/* ★以前は移動前に画面を消していた（opacity:0）が、
   次のページが出るまでの「真っ白な時間」が長く見える原因だったのでやめた。
   前の画面は、次の画面が出るまでそのまま表示しておく。 */
body.nn-leaving{opacity:1;}
/* ④ 下部ナビのアイコンを実寸で全ページ統一（一覧モードの縮小率を打ち消す） */
nav .ni .ic img, nav#nav .ni .ic img{height:var(--navicon,44px) !important;}
nav .ni.hasimg, nav#nav .ni.hasimg{padding:var(--navpad,3px) calc(var(--navpad,3px) + 1px) !important;}
@media (prefers-reduced-motion:reduce){ body{animation:none;} body.nn-leaving{transition:none;} }

/* ============ スケジュール画面の見直し（2026-07-26） ============ */
/* ① 天気マークを大きく（小さすぎて何の天気か読み取れなかった） */
.hd-wx .wxc a{display:flex; flex-direction:column; align-items:center; gap:0; line-height:1;
  font-size:26px; text-decoration:none;}
.hd-wx .wxc .pp{font-size:10.5px; font-weight:800; line-height:1.2;}
.hd-wx .wxc{padding:2px 0 3px;}
.hd-wx .gname{padding:4px 8px; font-size:12.5px !important;}
/* ② 現場の枠の無駄な余白を圧縮（特に現場名の上） */
.sc-card{padding:6px 10px 8px; margin-bottom:8px;}
.sc-head{margin-bottom:4px !important; row-gap:2px;}
.sc-head h3{margin:0; line-height:1.25;}
.sc-head .addr{margin-top:0; line-height:1.3;}
.sc-head .m{line-height:1.3;}
#schedview{padding-top:4px;}
/* ③④ タブ下は説明をやめ、件数と表示幅だけの細い帯に */
.schbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:0 2px 6px; padding:3px 8px; background:#fff; border:1px solid var(--line); border-radius:7px;}
.schbar .schcnt{font-family:var(--font-title); font-size:13px; font-weight:800; color:var(--green-deep);}
.schbar .schcnt i{font-style:normal; font-size:18px; margin:0 1px;}
.schbar .zoombar{margin-left:auto;}
.schbar .rowlbl-red{font-size:11.5px;}
/* ① 絞り込みボタン：未選択＝黒（点線をやめる）／選択中＝緑 */
.stbar .dfil .stchip,#chips .dfil .stchip{
  background:linear-gradient(180deg,#5b675f,#3c4440); color:#fff; border:1.5px solid #242a27; border-radius:8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 2px 0 #232825; text-shadow:0 1px 0 rgba(0,0,0,.3);
  transition:transform .06s, box-shadow .06s;}
.stbar .dfil .stchip:hover,#chips .dfil .stchip:hover{border-color:#111; color:#fff;}
.stbar .dfil .stchip:active,#chips .dfil .stchip:active{transform:translateY(2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 #232825;}
.stbar .dfil .stchip.on,#chips .dfil .stchip.on{
  background:linear-gradient(180deg,var(--green-hi,#43b06c),var(--green)); border-color:var(--green-edge,#1c6b3c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 0 var(--green-edge,#1c6b3c);}
.stbar .dfil .stchip .dfbtn-car{opacity:.9;}

/* ② 内訳パネル：どのグループを開いているか、見出しを同じ色で着色 */
.dtlp{border-width:2px !important;}
.dtlp > h4{margin:-6px -9px 8px; padding:5px 10px; color:#fff; border-radius:5px 5px 0 0;
  text-shadow:0 1px 0 rgba(0,0,0,.3);}
.dtlp > h4 .cta{color:rgba(255,255,255,.92);}
.dtlp > h4 .zx{color:#fff;}
.dtlp.grn{border-color:#2f7a4d !important;} .dtlp.grn > h4{background:linear-gradient(180deg,#33915a,#1c6b3c);}
.dtlp.org{border-color:#a5651a !important;} .dtlp.org > h4{background:linear-gradient(180deg,#c47a2c,#96530f);}
.dtlp.blue{border-color:#1a5590 !important;} .dtlp.blue > h4{background:linear-gradient(180deg,#3d84c6,#1a5590);}
.dtlp.mix{border-color:#8a7c3c !important;} .dtlp.mix > h4{background:linear-gradient(100deg,#2f8b55,#a4661f);}

/* ② いま何で絞り込んでいるかの表示＋③ 検索リセット */
.filbar{display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin:-2px 0 7px; padding:5px 10px;
  background:#fffdf2; border:1.5px solid #e6d9a8; border-radius:8px;}
.filbar .fl,.lfil .fl{font-family:var(--font-title); font-size:11.5px; font-weight:800; color:#8a6a12; flex:none;}
.ftag{display:inline-flex; align-items:center; gap:5px; background:#fff; border:1.5px solid var(--green-edge,#2a8a4e);
  color:var(--green-deep); border-radius:999px; padding:2px 9px; font-size:12px; font-weight:800; cursor:pointer; white-space:nowrap;}
.ftag i{font-style:normal; font-size:9.5px; font-weight:700; color:var(--ink-sub); background:#eef3ea;
  border-radius:4px; padding:1px 5px;}
.ftag u{text-decoration:none; font-size:11px; color:var(--ink-sub);}
.ftag:hover{background:var(--green-lite);} .ftag:hover u{color:var(--warn);}
.freset{margin-left:auto; flex:none; font-family:var(--font-title); font-size:12px; font-weight:800; cursor:pointer;
  background:linear-gradient(180deg,#7b8681,#565f5a); color:#fff; border:1px solid #454d49; border-radius:999px;
  padding:4px 13px; box-shadow:0 2px 0 #3c433f;}
.freset:active{transform:translateY(2px); box-shadow:none;}
/* 現場一覧の先頭（右上の件数と同じ行に置く） */
.listhead{display:flex; align-items:center; gap:8px; justify-content:flex-end;}
.lfil{display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin-right:auto; pointer-events:auto;
  background:#fffdf2; border:1.5px solid #e6d9a8; border-radius:8px; padding:3px 8px;}
.lfil .freset{margin-left:4px;}
#chips .dfil{position:relative;}
#chips{gap:6px;}
#chips .dfrow.sel{background:var(--green-lite); border-radius:6px;}

/* ① 金額の見方の注記（KPIグループの直下に小さく） */
.kgnote{font-size:10.5px; line-height:1.6; color:var(--ink-sub); font-weight:600;
  margin:-2px 2px 8px; padding:4px 10px; background:#fbfaf3; border:1px solid #e2e5da; border-radius:6px;}
.kgnote b{font-weight:800; color:var(--green-deep);}
/* ⑤ 受注率の段階（引合い・調査・見積・契約）：枠を詰めて文字を中央に */
.steps2 b{padding:3px 12px; align-items:center; line-height:1.2;}
.steps2 b i{font-size:17px; line-height:1;}
.steps2{gap:5px; margin-bottom:6px;}
/* ⑥ 現場一覧：1回目タップの選択表示 */
#list .pcard.armed{outline:2px solid var(--yellow-deep,#d9a520); outline-offset:-2px; background:#fff6d6;}
/* ⑦ ▼内訳を楕円のボタンに（押せることが分かるように） */
.kbtn{align-self:center; margin-top:4px; padding:2px 11px 3px; border:1.2px solid; border-radius:999px;
  font-family:var(--font-title); font-size:10px; font-weight:800; line-height:1.4; letter-spacing:.02em;
  background:#fff; white-space:nowrap; box-shadow:0 1px 0 rgba(0,0,0,.07);}
.kgrp.grn .kbtn{border-color:#8dc2a2; color:#1c6b3c;}
.kgrp.org .kbtn{border-color:#dcae7e; color:#96530f;}
.kgrp.blue .kbtn{border-color:#9dc0e2; color:#1a5590;}
.kgrp.mix .kbtn{border-color:#c3bc94; color:#6d6a2c;}
.kgrp.grn .kcell:hover .kbtn{background:#e6f3ea;}
.kgrp.org .kcell:hover .kbtn{background:#fbeedf;}
.kgrp.blue .kcell:hover .kbtn{background:#e7f0fb;}
.kgrp.mix .kcell:hover .kbtn{background:#f3f1e3;}
.kcell:active .kbtn{transform:translateY(1px); box-shadow:none;}
/* ⑧ タブの上下の余白を詰める（文字サイズはそのまま） */
#viewtabs{padding-top:3px; padding-bottom:0;}
#viewtabs button{padding-top:7px; padding-bottom:8px; line-height:1.35; font-size:14px;}
/* ② パネル見出しは折り返さない（⤢だけ次行に落ちて空白ができるのを防ぐ） */
.dpanel h4{flex-wrap:nowrap;}
.dpanel h4 .cta{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dpanel h4 .colgear,.dpanel h4 .zx{flex:none;}
/* ② 円グラフ：1回目タップの選択状態 */
.stseg{cursor:pointer;}
.stseg:hover{filter:brightness(1.08);}
.stseg.armed2{filter:brightness(1.2) drop-shadow(0 0 5px rgba(0,0,0,.45)); animation:stblink .7s ease-in-out infinite alternate;}
@keyframes stblink{from{opacity:1} to{opacity:.55}}
/* ① 予実：凡例と費目増減をすっきり見せる */
.chart-legend .lgnote{color:var(--ink-sub); opacity:.8; font-weight:700;}
.dpanel .hint.ydiff{font-size:10px; font-weight:700; opacity:.85; margin-top:3px;}
/* ③ 月別グラフ：金額の「万」を小さく */
.bv2 s{text-decoration:none; font-size:9px; font-weight:700; margin-left:1px;}
/* ⑤ 入金予定：30日以内・90日以内を右へ寄せる */
.ninq{align-items:baseline;}
.ninq .nynote{margin-right:auto; font-size:10.5px; font-weight:700; color:var(--ink-sub);
  background:#fdf6e2; border:1px solid #e8dcb6; border-radius:5px; padding:2px 8px;}
/* ヘッダーの「＋新規作成」を大きく（rev.10/11で小さくした指定を上書き） */
header button.new-btn.newbig{font-size:17px !important; padding:3px 13px 4px !important; letter-spacing:.02em; line-height:1.25;}

/* ============ rev.13：絞り込みプルダウン・KPIカード追加（2026-07-26 追記5） ============ */
/* ① ステータスチップ廃止 → 元請別／メーカー別／工法別／仕様別のプルダウン */
.dfil{flex:none; position:relative;}
.dfbtn-car{margin-left:3px; font-size:9px; opacity:.85;}
.dfmenu{display:none; position:fixed; z-index:120; background:#fff; border:1.5px solid var(--green-deep);
  border-radius:10px; box-shadow:0 2px 0 var(--green-edge), 0 10px 22px rgba(0,0,0,.22);
  min-width:216px; max-width:min(330px,92vw); max-height:min(310px,58vh); overflow-y:auto; padding:4px; text-align:left;}
.dfmenu.open{display:none;}          /* 元の位置では出さない（下の #nnPortal で出す） */
#nnPortal.dfmenu.open{display:block;}  /* 画面直下に出すメニュー本体 */
#nnPortal{position:fixed; z-index:1200;}
.dfrow{display:flex; align-items:center; gap:7px; padding:7px 9px; font-size:12.5px; font-weight:700;
  cursor:pointer; border-radius:6px; white-space:nowrap;}
.dfrow:hover{background:var(--green-lite);}
.dfrow input{width:16px; height:16px; accent-color:var(--green); flex:none; margin:0;}
.dfrow .vn{flex:1; overflow:hidden; text-overflow:ellipsis;}
.dfrow .vc{font-size:10.5px; font-weight:800; color:var(--ink-sub); flex:none;}
.dfclear{padding:7px 9px; font-size:11.5px; font-weight:800; color:var(--green-deep); cursor:pointer;
  border-bottom:1px solid var(--line); border-radius:6px 6px 0 0;}
.dfclear:hover{background:var(--green-lite);}
/* ② KPIカード：タイトルの下に件数（大きめ表示） */
.kpc .t .tc{display:block; font-size:14.5px; font-weight:800; line-height:1.35;}
/* ③ KPIカード9枚：スクロールなしで全幅に1列で並べる（予実・要対応などの見出しはカードの下） */
.kpi5{display:grid; grid-template-columns:1fr 1fr 1.55fr 2px 1fr 1fr 1fr 1fr 1.25fr 1fr; gap:6px; margin-bottom:7px;}
.kpi5 .kpc{display:flex; flex-direction:column; min-width:0;}
/* 見出しは語の途中で折り返さない（「完成工事高 粗／利」のような改行を防ぐ） */
.kpi5 .kpc .t{white-space:normal; overflow:visible; font-size:12px; line-height:1.35; padding:5px 4px 4px;
  min-height:60px; display:flex; flex-direction:column; justify-content:center; word-break:keep-all; overflow-wrap:break-word;}
.kpi5 .kpc .b{margin-top:auto; padding:6px 5px 7px;}
.kpi5 .kpc .v{font-size:18px; white-space:nowrap;}
.kpi5 .kpc .v s{font-size:12.5px;}
.kpi5 .kpc .v .ar2{font-size:16px;}
.kpi5 .kpc .s2{font-size:10px; line-height:1.5; margin-top:3px; white-space:nowrap;}
@media(max-width:760px){ .kpi5{grid-template-columns:repeat(3,minmax(0,1fr));} .kpi5 .kdiv{display:none;} }
/* ④ 色分け：完成＝緑／契約＝琥珀／見積＝青／完成〜契約＝緑→琥珀のグラデーション */
.kpc.mix{border-color:#cfc9a2;}
.kpc.mix .t{background:linear-gradient(90deg,#e4efdc,#fdeee0); color:#5f5a1c;}
/* ⑥ 見出し：小さな漢字は極太にするとフトコロ（画の間）がつぶれて読めなくなる。
   太さは700程度に抑え、代わりに「字を大きく・字間を広く・地色とのコントラストを強く」して力強さを出す。
   ★栄冠クロスのフォントが届いたら、--font-title の先頭に font-face 名を足すだけで全見出しが切り替わる */
:root{--font-title:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;}
.kpi5 .kpc .t,.dpanel h4 .httl,#viewtabs button,.mini-tbl th,.msec,.stbar .lb,.modal h3,.stchip{
  font-family:var(--font-title); font-weight:700; letter-spacing:.05em;}
.dpanel h4 .httl{font-size:13px; text-shadow:0 1px 1px rgba(18,74,40,.5);}
/* カード見出し：上段に分類（小さめ）、下段に指標名（大きく）の2段。ぱっと見て指標名が拾えるようにする */
.kpi5 .kpc .t{color:#fff; border-bottom:0; padding:5px 4px; min-height:58px; gap:1px;
  text-shadow:0 1px 0 rgba(0,0,0,.3); white-space:normal; word-break:keep-all; overflow-wrap:break-word;
  background:linear-gradient(180deg,#33915a,#1c6b3c);}
.kpi5 .kpc .t .cat{font-size:10px; font-weight:700; letter-spacing:.04em; line-height:1.25; opacity:.93;}
.kpi5 .kpc .t .met{font-size:15px; font-weight:800; letter-spacing:.08em; line-height:1.3;}
.kpi5 .kpc .t .tc{font-size:13.5px; font-weight:800; letter-spacing:.02em; line-height:1.3; opacity:.96;}
.kpi5 .kpc.org .t{background:linear-gradient(180deg,#c47a2c,#96530f);}
.kpi5 .kpc.blue .t{background:linear-gradient(180deg,#3d84c6,#1a5590);}
.kpi5 .kpc.mix .t{background:linear-gradient(100deg,#2f8b55,#a4661f);}
.kpi5 .kpc.grn{border-color:#5aa576;} .kpi5 .kpc.org{border-color:#cd9a68;}
.kpi5 .kpc.blue{border-color:#84acd8;} .kpi5 .kpc.mix{border-color:#a9a17a;}
/* ⑦ 単位（件・億・万・%）は数字より少し小さく：数字を引き立てる */
.kpc .t .tc u{font-style:normal; text-decoration:none; font-size:10.5px; font-weight:700; margin-left:1px; letter-spacing:0;}
.kpi5 .kpc .v s{font-size:12px; font-weight:800;}
/* ⑤ 要対応の行：文字を小さくして件数を多く見せる */
.alert-row{padding:6px 9px; font-size:11px; gap:8px;}

.alert-row .apw .plb,.alert-row .apw .pv{font-size:8.5px;}
</style>

/* ---------- 変換アダプタ：新データ（予実モデル）→ 記録帳の物件モデル ---------- */
const RATE=META.romu_tanka, CAP=META.kyokyuu_ninku_month;
const TODAY=new Date(2026,6,25);            /* サンプルデータの「今日」 */
const ST_MAP={kan:'完成済',kou:'施工中',keiyaku:'契約済',mit:'見積済',chosa:'見積済(調査済)',hikiai:'引合いあり'};
const HOU_MAP=k=>k.includes('ウレタン')?'ウレタン塗膜':k.includes('アスファルト')?'改質アス':k.includes('塩ビ')?'塩ビシート':k.includes('FRP')?'FRP防水':'シーリング';
const CODE_MAP=k=>{const mm=k.match(/\(([^)]+)\)/); return mm?mm[1]:k.slice(0,6);};
const D=si=>{if(!si)return null;const a=si.split('-');if(a.length<3||isNaN(+a[2]))return null;return new Date(+a[0],+a[1]-1,+a[2]);};
const slashD=si=>si?si.replaceAll('-','/'):'';
const man=v=>Math.round(v/10000).toLocaleString('ja-JP');
const oku=v=>{const mm=Math.round(v/10000);return mm>=10000?Math.floor(mm/10000)+'億'+(mm%10000).toLocaleString('ja-JP'):mm.toLocaleString('ja-JP');};
/* KPIカード用：単位（件・億）を数字より小さく表示して数字を引き立てる */
const kcnt=n=>`${n}<u>件</u>`;
const koku=v=>oku(v).replace('億','<s>億</s>');
/* KPIグループ（完成工事高／契約高／見積済／完成〜契約）の組み立て
   ・グループ見出し＝分類名＋件数（グループ内で共通なので1回だけ）
   ・その中に指標セル（金額・粗利…）を境界線で区切って並べる */
/* 内訳パネルを、どのグループのものか色で示すための対応表 */
const DTL_CLS={kansei:'grn',arari:'grn',juchu:'org',juchuGro:'org',mitsumori:'blue',mitsuGro:'blue',kankei:'mix',kankeiGro:'mix'};
const kcell=(k,m,v,s2,sub)=>`<div class="kcell" onclick="toggleDtl('${k}')"><div class="kgm">${m}${sub?`<i>${sub}</i>`:''}</div><div class="kgv num">${v}</div><div class="kgs">${s2}</div><span class="kbtn">▼ 内訳</span></div>`;
const kgrp=(cls,name,n,cells)=>`<div class="kgrp ${cls} g${cells.length}"><div class="kgh">${name}<b>${n}<u>件</u></b></div><div class="kgb">${cells.join('')}</div></div>`;
const props=RAW.map((d,i)=>{
  const bTot=d.y.reduce((a,b)=>a+b,0);
  const aTot=d.a?d.a.reduce((a,b)=>a+b,0):0;
  const cost=d.a||d.y;   /* 完成＝実績、施工中・見積＝予算をコストとして表示 */
  const p={
    id:i+1, code:d.id, name:d.n, addr:d.ad,
    date:slashD(d.kb||d.cb), status:ST_MAP[d.st], stRaw:d.st,
    hou:HOU_MAP(d.ko), kouhou:d.ko, spec:CODE_MAP(d.ko), kind:'改修',
    moto:d.e, tantou:'', shiire:d.mk, shiireTan:'', maker:d.mk, sozai:d.sz,
    m:d.m, un:d.un, tan:d.tan,
    order:d.amt, mat:cost[0], jin:cost[1], other:cost[2], keihi:cost[3],
    mitsumori:'', genba:slashD(d.cb), kansei:slashD(d.fb),
    yotei:(d.fy&&D(d.fy))?slashD(d.fy):(d.fy||''),
    nissu:0, prog:d.p, cs:0, nin:d.nin, sh:d.sh,
    kbD:D(d.kb), cbD:D(d.cb), fbD:D(d.fb), sbD:D(d.sb), nbD:D(d.nb), tb:d.tb,
    y:d.y, a:d.a, bTot, aTot,
    roofs:[{n:'施工範囲',hiraba:d.m,hCode:CODE_MAP(d.ko),tachi:0,tCode:'',yaku:0,yCode:'',kabuse:''}],
    jinku:[], extras:[], files:[]
  };
  p.bGro=d.amt-bTot; p.bGrp=d.amt?p.bGro/d.amt*100:0;
  if(d.a){ p.cs=Math.round(aTot/bTot*100);
    if(d.st==='kan'){ p.aGro=d.amt-aTot; p.aGrp=p.aGro/d.amt*100; } }
  /* 年度（4月〜翌3月）と地域（市区町村）を絞り込み用に持たせる */
  {const dt=p.kbD||p.cbD; const y=dt?(dt.getMonth()>=3?dt.getFullYear():dt.getFullYear()-1):null;
   p.nendo=y?`${y}年度`:'年度未定';}
  p.area=(p.addr.match(/^[^市]+市|^[^町]+町/)||['その他'])[0];
  p.needNin=Math.round(d.y[1]/RATE);
  if(d.st==='kan'&&d.m&&d.un==='㎡')p.bu=d.nin/d.m;
  return p;
});

function catOf(name){
  const e=name.split('.').pop().toLowerCase();
  if(['jpg','jpeg','png','gif','webp','heic','bmp'].includes(e))return'photo';
  if(['dwg','jww','dxf'].includes(e))return'zumen';
  return'doc'; // pdf/xlsx/docx/その他 → 保管資料
}
const CAT_LABEL={photo:'写真',zumen:'作成図面',doc:'保管資料'};
function docIcon(name){
  const e=name.split('.').pop().toLowerCase();
  if(e==='pdf')return'📕'; if(['xlsx','xls','csv'].includes(e))return'📊';
  if(['dwg','jww','dxf'].includes(e))return'📐'; if(['doc','docx'].includes(e))return'📘'; return'📄';
}
function toast(msg){const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2600);}
function handleFiles(pid, fileList){
  const p=props.find(x=>x.id===pid); if(!p)return;
  const summary={photo:0,doc:0,zumen:0};
  [...fileList].forEach(f=>{
    const cat=catOf(f.name);
    const rec={name:f.name, size:f.size, cat, url:URL.createObjectURL(f), date:new Date().toLocaleDateString('ja-JP')};
    p.files.push(rec); summary[cat]++;
  });
  const parts=Object.entries(summary).filter(([k,v])=>v>0).map(([k,v])=>`${CAT_LABEL[k]}へ${v}件`);
  toast('自動振り分けしました → '+parts.join('／'));
  renderDetail();
}
function wireDrop(el, pid){
  el.addEventListener('dragover',e=>{e.preventDefault(); el.classList.add('over');});
  el.addEventListener('dragleave',()=>el.classList.remove('over'));
  el.addEventListener('drop',e=>{e.preventDefault(); el.classList.remove('over'); if(e.dataTransfer.files.length)handleFiles(pid,e.dataTransfer.files);});
}
function pickFiles(pid){
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true;
  inp.onchange=()=>handleFiles(pid,inp.files); inp.click();
}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';}

/* ---------- 絞り込みチップ ---------- */
/* ---------- 現場一覧の絞り込み（ダッシュボードと同じチェックボックス＋件数方式） ---------- */
const nendoCmp=(a,b)=>{const A=a[0],B=b[0]; if(A==='年度未定')return 1; if(B==='年度未定')return -1; return B.localeCompare(A);};

const LIST_FIL=[
 {key:'nendo',label:'年度別',   val:p=>p.nendo, sort:(a,b)=>nendoCmp(a,b)},
 {key:'moto', label:'元請別',   val:p=>p.moto},
 {key:'status',label:'ステータス別',val:p=>p.status},
 {key:'hou',  label:'工法別',   val:p=>p.hou},
 {key:'area', label:'地域別',   val:p=>p.area},
];
const listFil={}; LIST_FIL.forEach(f=>listFil[f.key]=new Set());
const filterState={};                 /* 利益別（並び替え）だけは従来どおり単一選択 */
let lfOpen=null, lfVals={}, lfPos=null;

function lfCounts(){
  LIST_FIL.forEach(f=>{
    const m=new Map(); props.forEach(p=>{const v=f.val(p)||'—'; m.set(v,(m.get(v)||0)+1);});
    lfVals[f.key]=[...m.entries()].sort(f.sort||((a,b)=>b[1]-a[1]));
  });
}
function lfPass(p){ return LIST_FIL.every(f=>!listFil[f.key].size||listFil[f.key].has(f.val(p)||'—')); }
function lfTags(){
  const t=[]; LIST_FIL.forEach(f=>{ if(listFil[f.key].size) [...listFil[f.key]].forEach(v=>t.push([f.key,f.label.replace('別',''),v])); });
  const pf=filterState['profit']; if(pf)t.push(['profit','並び',pf]);
  return t;
}
window.lfDrop=function(k,v){ if(k==='profit'){delete filterState['profit'];} else listFil[k].delete(v); buildChips(); render(); };
window.lfResetAll=function(){
  if(window.nnSfx)nnSfx('reset');
  LIST_FIL.forEach(f=>listFil[f.key].clear());
  delete filterState['profit'];
  const q=document.getElementById('q'); if(q)q.value='';
  lfOpen=null; buildChips(); render();
};
window.lfToggle=function(e,k){
  e.stopPropagation();
  if(e.preventDefault)e.preventDefault();
  window.__nnMenuTap=Date.now();
  const wrap=(e.target.closest&&e.target.closest('.dfil'))||document.querySelector('#chips .dfil[data-k="'+k+'"]');
  if(!wrap)return;
  const willOpen=(lfOpen!==k);
  document.querySelectorAll('#chips .dfil.open').forEach(x=>{x.classList.remove('open'); const m=x.querySelector('.dfmenu'); if(m)m.classList.remove('open');});
  lfOpen=willOpen?k:null; lfPos=null;
  nnClosePortal();
  if(willOpen){ wrap.classList.add('open'); nnShowPortal(wrap.querySelector('.dfmenu'), wrap.querySelector('button'), 0); }
};
window.lfChk=function(e,k,i){
  const v=lfVals[k][i][0], set=listFil[k];
  if(set.has(v))set.delete(v); else set.add(v);
  buildChips(); render();
  /* 開いたままにする */
  const wrap=document.querySelector(`#chips .dfil[data-k="${k}"]`);
  if(wrap){ wrap.classList.add('open'); lfOpen=k; nnShowPortal(wrap.querySelector('.dfmenu'), wrap.querySelector('button'), 0); }
};
window.lfSort=function(e,v){
  e.stopPropagation();
  if(filterState['profit']===v)delete filterState['profit']; else filterState['profit']=v;
  lfOpen=null; buildChips(); render();
};
function placeLfMenu(){
  if(!lfOpen)return;
  const w=document.querySelector('#chips .dfil.open'); if(!w)return;
  const m=w.querySelector('.dfmenu'); if(!m)return;
  const pos=nnFitMenu(m, w.querySelector('button').getBoundingClientRect());
  m.style.top=pos.top+'px'; m.style.left=pos.left+'px';
}
document.addEventListener('pointerdown',ev=>{
  if(Date.now()-(window.__nnMenuTap||0)<50)return;      /* 開いた直後の同じタップでは閉じない */
  if(ev.target.closest&&ev.target.closest('#nnPortal'))return;   /* メニューの中は閉じない */
  if(lfOpen&&!(ev.target.closest&&ev.target.closest('#chips .dfil'))){
    lfOpen=null; nnClosePortal();
    document.querySelectorAll('#chips .dfil.open').forEach(x=>{x.classList.remove('open'); const m=x.querySelector('.dfmenu'); if(m)m.classList.remove('open');});
  }
});

function buildChips(){
  lfCounts();
  const wrap=document.getElementById('chips');

/* ---------- ユーティリティ ---------- */
const yen=n=>n?('¥'+n.toLocaleString('ja-JP')+'-'):'—';
const profitOf=p=>{const c=p.mat+p.jin+p.keihi+p.other; return p.order? p.order-c : null;};
const profitRate=p=>{const pr=profitOf(p); return (pr!=null&&p.order&&(p.mat+p.jin+p.keihi+p.other)>0)? (pr/p.order*100):null;};
const EX_ST_CLS={'発生':'exs-hassei','打診中':'exs-nemawashi','交渉中':'exs-koushou','回収済み':'exs-kaishu','不成立':'exs-fuseiritsu'};
const exPending=p=>(p.extras||[]).filter(e=>e.status==='発生'||e.status==='打診中'||e.status==='交渉中').reduce((s,e)=>s+(e.amt||0),0);
const exCollected=p=>(p.extras||[]).filter(e=>e.status==='回収済み').reduce((s,e)=>s+(e.amt||0),0);
const exOpenCount=p=>(p.extras||[]).filter(e=>e.status!=='回収済み'&&e.status!=='不成立').length;

/* ---------- リスト描画 ---------- */
let selectedId=props[0].id;
function filtered(){
  const q=document.getElementById('q').value.trim();
  let arr=props.filter(p=>{
    if(q && !(p.name.includes(q)||p.addr.includes(q)))return false;
    return lfPass(p);
  });
  const pf=filterState['profit'];
  if(pf==='利益額が大きい順')arr=[...arr].sort((a,b)=>(profitOf(b)??-1)-(profitOf(a)??-1));
  if(pf==='利益率が高い順')arr=[...arr].sort((a,b)=>(profitRate(b)??-1)-(profitRate(a)??-1));
  return arr;
}
let listArmTimer=null, listRestTm=null;
/* 現場一覧の描画。
   以前は77件を1枚ずつ createElement → innerHTML → append していたため、
   HTMLの解析とDOM挿入が77回発生し、タブを押してから1秒以上かかっていた。
   まとめて1つの文字列を作り、1回で流し込む方式に変更（タップの反応が数倍速くなる）。
   カードの押下は「まとめて1つの受け口」で処理する（イベント委譲）。 */
/* 「表示◯件／全◯件」を検索欄と同じ行の右端に出す。無ければ作る。 */
function nnSetListCount(html){
  var bar=document.getElementById('toolbar'); if(!bar) return;
  var el=document.getElementById('nnLC');
  if(!el){ el=document.createElement('span'); el.id='nnLC'; el.className='lc'; bar.appendChild(el); }
  el.innerHTML=html;
}
function render(){
  const arr=filtered();
  document.getElementById('cnt').textContent=props.length;
  const list=document.getElementById('list');
  const tg=lfTags();
  /* ★「表示◯件／全◯件」は検索欄と同じ行（ツールバー）に出す。
     一覧の上に独立した行を作ると、その行のぶん一覧全体が下に押し下げられ、
     ただでさえ狭いスマホで見える件数が減ってしまうため。
     絞り込み中のタグがあるときだけ、これまでどおり上の行を出す。 */
  nnSetListCount(`表示 <b>${arr.length}</b><u>件</u> ／ 全 <b>${props.length}</b><u>件</u>`);
  const head=tg.length?`<div class="listhead"><span class="lfil">
      <span class="fl">絞り込み中</span>
      ${tg.map(([k,lb,v])=>`<span class="ftag" onclick="lfDrop('${k}','${String(v).replace(/'/g,"\\'")}')"><i>${lb}</i>${v}<u>✕</u></span>`).join('')}
      <button class="freset" onclick="lfResetAll()">✕ 検索をリセット</button>
    </span></div>`:'';
  const cards=arr.map(p=>{
    const pr=profitOf(p), ex=exOpenCount(p);
    return `<div class="pcard${p.id===selectedId?' sel':''}" data-pid="${p.id}">
      <div class="row1"><h3>${p.name}</h3><span class="area">数量：${(p.m||0).toLocaleString()}${p.un||'㎡'}</span></div>
      <div class="roofs">
        <div class="roofline"><b>${p.kouhou||p.hou}</b>　<span class="badge ${badgeCls(p.spec||'')}">${p.spec||'—'}</span>
        　${(p.m||0).toLocaleString()}${p.un||'㎡'}${p.tan?`　単価 ¥${p.tan.toLocaleString()}/${p.un}`:''}　${p.maker||''}</div>
      </div>
      <div class="row3">
        <span>${p.addr}</span><span>${p.date}</span>
        <span class="status" style="background:${ST_COLOR[p.status]}">${p.status}</span>
        <span>元請：${p.moto}</span>
        ${ex?`<span class="exflag">⚠ 追加工事未回収 ${ex}件</span>`:''}
        <span class="money">
          <span class="order">受注金額：${yen(p.order)}</span><br>
          <span class="profit">利益予定額：${pr!=null?yen(pr):'策定中'}</span>
        </span>
      </div></div>`;
  });
  if(!arr.length){
    list.innerHTML = head + '<div class="empty">該当する物件がありません。検索条件を変えてみてください。</div>';
  }else{
    /* まず画面に映る分だけ出して即座に表示し、残りは次のフレームで足す。
       77件を一度に並べるとレイアウト計算に1秒近くかかり、タップが重く感じるため */
    const FIRST=14;
    list.innerHTML = head + cards.slice(0,FIRST).join('');
    if(cards.length>FIRST){
      clearTimeout(listRestTm);
      listRestTm=setTimeout(()=>requestAnimationFrame(()=>{
        const cur=document.getElementById('list'); if(cur!==list)return;
        list.insertAdjacentHTML('beforeend', cards.slice(FIRST).join(''));
        if(window.syncListSb)syncListSb();
      }),0);
    }
  }
  /* 詳細は隠れているときは作らない（見えないものを組み立てて待たされないように） */
  if(document.getElementById('mainview').classList.contains('show-detail')) renderDetail();
  if(window.syncListSb)syncListSb();
}
/* カードの押下。
   ★指が触れた瞬間（pointerdown）に着色する。クリック確定を待つと、指を離してから
     色が付くまで一拍あり「反応が鈍い」と感じるため。 */
let pdWasArmed=false;
document.addEventListener('pointerdown',ev=>{
  const el=ev.target.closest&&ev.target.closest('#list .pcard'); if(!el)return;
  pdWasArmed=el.classList.contains('armed');
  if(pdWasArmed)return;                       /* 2回目のタップ＝移動なので、ここでは何もしない */
  document.querySelectorAll('#list .pcard.armed').forEach(x=>x.classList.remove('armed'));
  document.querySelectorAll('#list .pcard.sel').forEach(x=>x.classList.remove('sel'));
  el.classList.add('armed'); el.classList.add('sel');
  selectedId=+el.dataset.pid;
  if(window.nnSfx)nnSfx('select');
  clearTimeout(listArmTimer);
  listArmTimer=setTimeout(()=>{document.querySelectorAll('#list .pcard.armed').forEach(x=>x.classList.remove('armed'));},2600);
},{passive:true,capture:true});
document.addEventListener('click',ev=>{
  const el=ev.target.closest&&ev.target.closest('#list .pcard'); if(!el)return;
  if(!pdWasArmed)return;                      /* 1回目は pointerdown で着色済み */
  el.classList.remove('armed');
  if(window.nnSfx)nnSfx('move');
  selectedId=+el.dataset.pid; openDetailFull();
});

/* ---------- ドーナツチャート（SVG） ---------- */
function donut(p){
  const pr=profitOf(p);
  const items=[
    ['材料費',p.mat,'#3a9e52'],['労務費',p.jin,'#e07b2a'],['現場経費',p.keihi,'#7a5cc9'],['外注費',p.other,'#c9a63c'],
    ['利益',Math.max(pr??0,0),'#2456b8']
  ].filter(x=>x[1]>0);
  const total=items.reduce((s,x)=>s+x[1],0);
  if(!total)return '<p class="hint">受注金額・コストが未入力のため、構成グラフはまだ表示できません。</p>';
  let acc=0; const R=52, C=2*Math.PI*R;
  const segs=items.map(x=>{
    const frac=x[1]/total, off=C*acc; acc+=frac;
    return `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${x[2]}" stroke-width="26"
      stroke-dasharray="${C*frac} ${C-C*frac}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
  }).join('');
  return `<div class="donut-wrap">
    <svg width="140" height="140" viewBox="0 0 140 140">${segs}
      <text x="70" y="66" text-anchor="middle" font-size="12" font-weight="800" fill="#222">利益率</text>
      <text x="70" y="82" text-anchor="middle" font-size="14" font-weight="800" fill="#2456b8">${profitRate(p)!=null?profitRate(p).toFixed(1)+'%':'—'}</text>
    </svg>
    <div class="legend">${items.map(x=>`<div class="li"><span class="sw" style="background:${x[2]}"></span>${x[0]}　¥${x[1].toLocaleString()}-</div>`).join('')}</div>
  </div>`;
}

const isoOf=d=>d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';
function openModal(id){
  editId=id||null;

  g('f_fy').value=p?(p.yotei||''):''; g('f_sb').value=p?isoOf(p.sbD):''; g('f_nb').value=p?isoOf(p.nbD):'';
  g('f_sh').value=p?(p.sh||''):'';
  [0,1,2,3].forEach(i=>{g('f_y'+i).value=(p&&p.y&&p.y[i])?p.y[i]:''; g('f_a'+i).value=(p&&p.a&&p.a[i])?p.a[i]:'';});
  g('f_p').value=p&&p.prog?p.prog:''; g('f_nin').value=p&&p.nin?p.nin:''; g('f_tb').value=p&&p.tb?p.tb:'';
  document.getElementById('modalbg').classList.add('open');
}
function closeModal(){document.getElementById('modalbg').classList.remove('open'); editId=null;}
function recalcProp(p){
  p.bTot=(p.y||[0,0,0,0]).reduce((s2,b)=>s2+b,0);
  p.bGro=p.order-p.bTot; p.bGrp=p.order?p.bGro/p.order*100:0;
  if(p.a){p.aTot=p.a.reduce((s2,b)=>s2+b,0); p.cs=p.bTot?Math.round(p.aTot/p.bTot*100):0;
    if(p.stRaw==='kan'){p.aGro=p.order-p.aTot; p.aGrp=p.order?p.aGro/p.order*100:0;}}
  else{p.aTot=0; p.cs=0;}
  p.needNin=Math.round((p.y&&p.y[1]||0)/RATE);
  if(p.stRaw==='kan'&&p.m&&p.un==='㎡'&&p.nin)p.bu=p.nin/p.m;
}
function saveProperty(){
  const g=k=>document.getElementById(k);
  const name=g('f_name').value.trim();
  if(!name){alert('工事名を入力してください');return;}
  const st=g('f_st').value, stRaw=ST_INV[st]||'hikiai';
  const ko=g('f_ko').value;
  const m=+g('f_m').value||0, tan=+g('f_tan').value||0;
  let amt=+g('f_amt').value||0; if(!amt&&m&&tan)amt=m*tan;
  let y=[0,1,2,3].map(i=>+g('f_y'+i).value||0);
  if(amt&&y.every(v=>!v)){y=[Math.round(amt*.30),Math.round(amt*.28),Math.round(amt*.06),Math.round(amt*.14)];}
  const aVals=[0,1,2,3].map(i=>+g('f_a'+i).value||0);
  const a=aVals.some(v=>v)?aVals:null;
  let p;
  if(editId){ p=props.find(x=>x.id===editId); }
  else{ p={id:++SEQ,code:'J'+SEQ,jinku:[],extras:[],files:[],kind:'改修',tantou:'',shiire:'',shiireTan:'',nissu:0,bu:null}; props.unshift(p); }
  const mk=KO_MASTER[ko]||['—','—'];
  Object.assign(p,{name, addr:g('f_addr').value.trim()||'（住所未入力）', moto:g('f_moto').value.trim()||'（元請未入力）',
    status:st, stRaw, kouhou:ko, hou:HOU_MAP(ko), spec:CODE_MAP(ko), maker:mk[0], sozai:mk[1], shiire:mk[0],
    m, un:g('f_un').value, tan, order:amt,
    sh:g('f_sh').value.trim(), yotei:g('f_fy').value.trim(),
    prog:+g('f_p').value||0, nin:+g('f_nin').value||0, tb:g('f_tb').value.trim()||null,
    y, a});
  const DI=v=>v?new Date(v+'T00:00:00'):null;
  p.kbD=DI(g('f_kb').value); p.cbD=DI(g('f_cb').value); p.fbD=DI(g('f_fb').value);
  p.sbD=DI(g('f_sb').value); p.nbD=DI(g('f_nb').value);
  const SL=d=>d?`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`:'';
  p.date=SL(p.kbD)||SL(p.cbD)||p.date||''; p.genba=SL(p.cbD); p.kansei=SL(p.fbD);
  if(!p.yotei&&p.fbD)p.yotei=SL(p.fbD);
  const src=a||y;
  p.mat=src[0]; p.jin=src[1]; p.other=src[2]; p.keihi=src[3];
  p.roofs=[{n:'施工範囲',hiraba:m,hCode:CODE_MAP(ko),tachi:0,tCode:'',yaku:0,yCode:'',kabuse:''}];
  recalcProp(p);
  const newId=p.id;
  closeModal(); buildChips(); dashDirty=true;
  toast(editId?'物件情報を更新しました':'物件を登録しました：'+name);
  editId=null;
  if(view==='dash'){renderDash();}else{selectedId=newId; render();}
}

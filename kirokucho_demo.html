/* 天気リンク先（tenki.jp）：過去日はその日の実況天気ページ、本日以降は2週間天気ページ */
const WX_SRC={
 '札幌':{fc:'https://tenki.jp/forecast/1/2/1400/1100/10days.html',
         past:(y,m,d)=>`https://tenki.jp/past/${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}/weather/1/2/47412/`,
         label:'札幌'},
 '東京':{fc:'https://tenki.jp/forecast/3/16/4410/13101/10days.html',
         past:(y,m,d)=>`https://tenki.jp/past/${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}/weather/3/16/47662/`,
         label:'東京（大手町）'}
};
const wxCity=p=>(p.addr.startsWith('東京')||p.addr.startsWith('神奈川')||p.addr.startsWith('横浜'))?'東京':'札幌';
function wxUrl(city,dt){
  const t0=new Date(); t0.setHours(0,0,0,0);
  const d=new Date(dt); d.setHours(0,0,0,0);
  return d<t0 ? WX_SRC[city].past(d.getFullYear(),d.getMonth()+1,d.getDate()) : WX_SRC[city].fc;
}
/* 日別の天気（日付＋都市から生成する表示用データ。過去=実況、本日〜13日後=予報、それ以降=なし） */
const WX_ICONS=[['☀️',0],['🌤️',10],['⛅',30],['☁️',40],['🌦️',60],['🌧️',80]];
const WX_MB={'札幌':[0,1,5,11,17,21,25,26,22,16,9,2],'東京':[10,11,14,19,23,26,31,33,29,23,18,13]};
function wxHash(s){let h=7;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}
function wxOf(city,dt){
  const t0=new Date(); t0.setHours(0,0,0,0);
  const d=new Date(dt); d.setHours(0,0,0,0);
  const diff=Math.round((d-t0)/864e5);
  if(diff>13)return null;
  const h=wxHash(city+isoD(d));
  const [ic,p0]=WX_ICONS[h%WX_ICONS.length];
  const base=WX_MB[city][d.getMonth()];
  /* ★2026-08-14k h は >>>0 で符号なしにしてあるが、そのあとの >> は「符号あり」のシフト。
     h が 2^31 を超えると負に戻り、%2 が -1 を返して降水確率が「-10%」になっていた（実際に出た）。
     シフトはすべて >>>（符号なし）を使うこと。 */
  const hi=base+((h>>>3)%5)-1, lo=hi-7-((h>>>5)%3);
  return {i:ic,p:Math.min(90,p0+((h>>>7)%2)*10),h:hi,l:lo,past:diff<0};
}

/* 元請（総合工程表）の初期データを自社の防水施工日程から生成 */
function ensureMotoGantt(p){
  if(p.motoGantt)return;
  ensureGantt(p);
  const b=p.gantt.find(r=>r.name==='防水施工')||p.gantt[Math.min(3,p.gantt.length-1)];
  const S=new Date(b.start), E=new Date(b.end);
  const R=(n,base1,off1,base2,off2)=>({name:n,start:isoD(addD(base1,off1)),end:isoD(addD(base2,off2)),memo:''});
  p.motoGantt = p.kind==='新築' ? [
    R('躯体工事',S,-55,S,-12),
    R('設備基礎工事',S,-18,S,-4),
    R('防水工事',S,0,E,0),
    R('断熱・保護コンクリート',E,-2,E,12),
    R('外装仕上工事',E,6,E,26),
    R('設備工事',E,10,E,30),
    R('検査・引渡し',E,28,E,34),
  ] : [
    R('足場仮設工事',S,-38,S,-24),
    R('補修工事',S,-26,S,-8),
    R('シーリング工事',S,-12,S,2),
    R('外壁塗装工事',S,-4,S,14),
    R('付帯塗装工事',S,10,E,-6),
    R('防水工事',S,0,E,0),
    R('設備工事',E,-4,E,10),
  ];
}
const isBousuiRow=n=>(n||'').includes('防水');

/* 工程データの保存・復元（このブラウザに自動保存。編集内容はいつでも見返せます） */
const SCHED_KEY='nn_kirokucho_sched_v2';
function saveSched(){
  try{
    const o={};
    props.forEach(p=>{ if(p.gantt||p.motoGantt) o[p.id]={g:p.gantt||null,m:p.motoGantt||null}; });
    localStorage.setItem(SCHED_KEY,JSON.stringify(o));
  }catch(e){}
}
function loadSched(){
  try{
    const o=JSON.parse(localStorage.getItem(SCHED_KEY)||'{}');
    props.forEach(p=>{ const s=o[p.id]; if(s){ if(s.g)p.gantt=s.g; if(s.m)p.motoGantt=s.m; } });
  }catch(e){}
}
loadSched();

/* ガント描画（全行編集可：工程名・開始・終了・メモ・追加・削除） */
function schedGantt(rows,opts){
  opts=opts||{};
  let min=null,max=null;
  rows.forEach(r=>{const a=new Date(r.start),b2=new Date(r.end); if(!min||a<min)min=a; if(!max||b2>max)max=b2;});
  if(!min){min=new Date(); max=addD(min,30);}
  min=addD(min,-2); max=addD(max,2);
  const days=[]; for(let t=new Date(min); t<=max && days.length<170; t=addD(t,1)) days.push(new Date(t));
  const todayIso=isoD(new Date());
  const wd=['日','月','火','水','木','金','土'];
  const monthCells=[]; let cur=null,cnt=0;
  days.forEach(dt=>{const key=dt.getFullYear()+'年'+(dt.getMonth()+1)+'月'; if(key!==cur){if(cur)monthCells.push([cur,cnt]); cur=key; cnt=1;}else cnt++;});
  monthCells.push([cur,cnt]);
  const L=opts.listKey, pid=opts.pid;
  const wxSrc=opts.city?WX_SRC[opts.city]:null;
  const wxRow=wxSrc?`<tr class="hd-wx">
      <th class="gname" style="font-size:12px; font-weight:800;">
        天気（${WX_SRC[opts.city].label}）
      </th>
      ${days.map(dt=>{const w=wxOf(opts.city,dt); const iso=isoD(dt);
        if(!w)return `<th class="wxc na" title="2週間より先の予報はまだ提供されていません">—</th>`;
        const url=wxUrl(opts.city,dt);
        const tip=w.past
          ? `${dt.getMonth()+1}/${dt.getDate()}の実況天気（tenki.jp）を開く｜最高${w.h}℃／最低${w.l}℃／降水${w.p}%`
          : `2週間天気（tenki.jp）を開く｜${dt.getMonth()+1}/${dt.getDate()} 予報：最高${w.h}℃／最低${w.l}℃／降水${w.p}%`;
        return `<th class="wxc ${w.p>=60?'rain':''} ${w.past?'past':''} ${iso===todayIso?'gtoday':''}" title="${tip}">
          <a href="${url}" target="_blank" rel="noopener">${w.i}<span class="pp">${w.p}%</span></a></th>`;}).join('')}
    </tr>`:'';
  return `<div class="gwrap sched ${schedZoom==='wide'?'zoom-wide':''}"><table class="gtbl">
    <thead>
      <tr><th class="gname">${opts.head||'工程／開始・終了'}</th>${monthCells.map(m=>`<th colspan="${m[1]}">${m[0]}</th>`).join('')}</tr>
      <tr class="hd-day"><th class="gname"></th>${days.map(dt=>{const iso=isoD(dt);const w=dt.getDay();return `<th class="${w===6?'sat':w===0?'sun':''} ${iso===todayIso?'gtoday':''}">${dt.getDate()}</th>`;}).join('')}</tr>
      <tr class="hd-wd"><th class="gname"></th>${days.map(dt=>{const iso=isoD(dt);const w=dt.getDay();return `<th class="${w===6?'sat wd-sat':w===0?'sun wd-sun':''} ${iso===todayIso?'gtoday':''}">${wd[w]}</th>`;}).join('')}</tr>
      ${wxRow}
    </thead><tbody>
    ${rows.map((r,idx)=>{
      const red=opts.moto&&isBousuiRow(r.name);
      return `<tr>
      <td class="gname" draggable="true" ondragstart="gDS(${pid},'${L}',${idx})" ondragover="event.preventDefault()" ondrop="gDR(${pid},'${L}',${idx})">
        <div class="grow-edit">
          <input type="text" class="gname-in ${red?'rowlbl-red':''}" value="${(r.name||'').replace(/"/g,'&quot;')}"
            onchange="gUpdS(${pid},'${L}',${idx},'name',this.value)">
          <span class="del" onclick="gDelS(${pid},'${L}',${idx})" title="この工程を削除">✕</span>
        </div>
        <div class="grow-edit" style="margin-top:3px">
          <input type="date" value="${r.start}" onchange="gUpdS(${pid},'${L}',${idx},'start',this.value)">
          <input type="date" value="${r.end}" onchange="gUpdS(${pid},'${L}',${idx},'end',this.value)">
        </div></td>
      ${days.map(dt=>{const iso=isoD(dt);const w=dt.getDay();
        const on=iso>=r.start&&iso<=r.end;
        const fc=on?(red?'fill red':(opts.blue?'fill blue':'fill')):'';
        const cmv=((r.cm||{})[iso]||'').replace(/"/g,'&quot;');
        return `<td class="gd ${fc} ${w===6?'sat':w===0?'sun':''} ${iso===todayIso?'gtoday':''}" onclick="cellMemo(${pid},'${L}',${idx},'${iso}')"${cmv?` title="${cmv}"`:''}>${cmv?'<span class=\'cmk\'>！</span>':''}</td>`;}).join('')}
    </tr>`;}).join('')}
    </tbody></table></div>
  <div class="gedit">
    <input type="text" id="ga_n_${pid}_${L}" placeholder="工程名">
    <input type="date" id="ga_s_${pid}_${L}"><input type="date" id="ga_e_${pid}_${L}">
    <button onclick="gAddS(${pid},'${L}')">工程を追加</button>
  </div>`;
}
function gUpdS(pid,list,idx,k,v){
  const p=props.find(x=>x.id===pid);
  p[list][idx][k]=v; saveSched(); renderSched(view);
}
function gDelS(pid,list,idx){
  const p=props.find(x=>x.id===pid);
  if(!confirm('この工程を削除しますか？')) return;
  p[list].splice(idx,1); saveSched(); renderSched(view);
}
function gAddS(pid,list){
  const p=props.find(x=>x.id===pid);
  const n=document.getElementById(`ga_n_${pid}_${list}`).value.trim();
  const s1=document.getElementById(`ga_s_${pid}_${list}`).value;
  const e1=document.getElementById(`ga_e_${pid}_${list}`).value;
  if(!n||!s1||!e1){alert('工程名・開始日・終了日を入力してください');return;}

let schedZoom='month';
function zoomSet(z){schedZoom=z;renderSched(view);}
const cmHidden=new Set();
function cmToggle(key){cmHidden.has(key)?cmHidden.delete(key):cmHidden.add(key);renderSched(view);}
function memoList(p,list){
  const items=[];
  (p[list]||[]).forEach(r=>Object.entries(r.cm||{}).forEach(([iso,t])=>items.push({iso,name:r.name,t})));
  if(!items.length)return '';
  items.sort((a,b)=>a.iso.localeCompare(b.iso));
  const wd=['日','月','火','水','木','金','土'];
  const key=p.id+'_'+list, hid=cmHidden.has(key);
  return `<div class="cmlist">
    <div class="cml-head"><span class="cmk">！</span>マスのメモ（${items.length}件）
      <span class="cml-tgl" onclick="cmToggle('${key}')">${hid?'表示する':'一時的に隠す'}</span></div>
    ${hid?'':`<ul>${items.map(m=>{const d=new Date(m.iso);
      return `<li><span class="cmk">！</span><b>${d.getMonth()+1}/${d.getDate()}(${wd[d.getDay()]})</b><span class="pn">［${m.name}］</span>${m.t}</li>`;}).join('')}</ul>`}
  </div>`;
}
let _dragRow=null;
function gDS(pid,l,i){_dragRow={pid,l,i};}
function gDR(pid,l,i){
  if(!_dragRow||_dragRow.pid!==pid||_dragRow.l!==l){_dragRow=null;return;}
  const p=props.find(x=>x.id===pid); const a=p[l];
  const[mv]=a.splice(_dragRow.i,1); a.splice(i,0,mv);
  _dragRow=null; saveSched(); renderSched(view);
}
function cellMemo(pid,l,idx,iso){
  const p=props.find(x=>x.id===pid); const r=p[l][idx];
  r.cm=r.cm||{};
  const v=prompt(iso.replaceAll('-','/')+'　'+r.name+'\nメモ（空欄で削除）',r.cm[iso]||'');
  if(v===null)return;
  if(v.trim()==='')delete r.cm[iso]; else r.cm[iso]=v.trim();
  saveSched(); renderSched(view);
}

window.nnGoPage=function(url){
  /* ★指を離した瞬間（＝タップした瞬間）に、画面いちばん上へ細い進行バーを出す。
     次のページが出来上がるまでの数百ミリ秒、「反応した」ことが必ず目に見える。
     画面は隠さないので、前の画面はそのまま見えたまま。 */
  try{
    if(!document.getElementById('nnbar')){
      const bar=document.createElement('div'); bar.id='nnbar'; bar.innerHTML='<i></i>';
      document.body.appendChild(bar);
      setTimeout(()=>{try{bar.remove();}catch(_){}} ,4000);   /* 念のための自動消去 */
    }
  }catch(_){}
  document.body.classList.add('nn-leaving');
  location.href=url;
};
/* ★先読みの fetch は削除（2026-07-28）。
   ページは端末に保存済みなので先読みの意味がなく、指が触れた瞬間に
   別の取得処理を走らせることで、肝心の画面移動と処理を取り合っていた。 */
function buildNav(){
  const n=document.getElementById('nav');
  n.innerHTML=NAV.map(([k,l])=>{
    const suf=(k===NAV_ACTIVE)?'_on':'';
    return `<div class="ni ${k===NAV_ACTIVE?'on':''}" onclick="navGo('${k}','${l}')">
      <span class="ic"><img src="./icons/nav_${k}${suf}.png" alt="${l}"
        onload="this.closest('.ni').classList.add('hasimg')"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='./icons/nav_${k}.png';}
                 else{this.outerHTML=ICONS['${k}']||'▫️';}"></span><span>${l}</span></div>`;
  }).join('');
  /* あふれ時：アクティブなボタンを中央に
     ★位置の計測（scrollWidth や getBoundingClientRect）は「画面をいったん組み上げる」
       処理なので、ここで行うと画面が出るまでの待ち時間が伸びる。
       画面を出したあと（次の描画のタイミング）にまわす。 */
  addEventListener('load',()=>{
    const on=n.querySelector('.ni.on');
    if(on && n.scrollWidth>n.clientWidth){
      const d=on.getBoundingClientRect().left-n.getBoundingClientRect().left;
      n.scrollLeft+=d-(n.clientWidth-on.offsetWidth)/2;
    }
  },{once:true});
}

/* ---------- タップ演出（shiyo_toroku基準：発光＋タップ音） ---------- */
(function(){
  /* ---------- ゲーム風タップ音（Web Audio合成・音源ファイル不要） ---------- */
  let AC=null;
  function ctx(){
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  /* 種類ごとの効果音（ゲームUI風）。音は合成なので音源ファイル不要 */
  function tone(freq,at,dur,vol,type){
    try{ const c=ctx(), t=c.currentTime+at;
      const o=c.createOscillator(), g=c.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  window.nnSfx=function(kind){
    /* 音の生成は描画の後に回す（初回のAudioContext作成が画面の反応を遅らせないように） */
    setTimeout(()=>nnSfxNow(kind),0);
  };
  function nnSfxNow(kind){
    switch(kind){
      case 'open':   tone(523,0,.10,.05); tone(784,.045,.12,.035); break;   /* 開く：上がる2音 */
      case 'close':  tone(659,0,.09,.04); tone(392,.045,.11,.03);  break;   /* 閉じる：下がる2音 */
      case 'select': tone(880,0,.07,.045); break;                          /* 選択：短く高い音 */
      case 'move':   tone(659,0,.08,.05); tone(880,.05,.10,.045); tone(1175,.10,.14,.03); break; /* 移動：上昇3音 */
      case 'back':   tone(587,0,.08,.04); tone(392,.05,.12,.035); break;   /* 戻る */
      case 'reset':  tone(392,0,.07,.035); tone(523,.05,.07,.035); tone(659,.10,.13,.04); break;
      default:       tapSound();
    }
  };
  function tapSound(){
    try{
      const c=ctx(), t=c.currentTime;
      // やわらかい水滴風の「ぽん」：低めのサイン波2音（耳に優しい音量）
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(523,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.06,t+0.010);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.15);
      // 軽く上に抜ける倍音
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(784,t);
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.03,t+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
      o2.connect(g2).connect(c.destination);
      o2.start(t+0.005); o2.stop(t+0.12);
    }catch(e){}
  }

  /* ---------- タッチ発光 ---------- */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    /* ★2026-08-13j パソコンの表示倍率（zoom）で割ること。
       clientX/Y は倍率を**かけた後**のpx、style.left/top は倍率を**かける前**のpx。
       割らないと、大きいモニターほど発光が右下の見当違いな場所に出る（§61の落とし穴）。 */
    const _z=window.nnPZ||1;
    el.style.left=(x/_z)+'px'; el.style.top=(y/_z)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 600);
  }

  /* ---------- イベント委譲 ----------
     発光＝画面のどこを触っても出す（触った場所のフィードバック）
     音　＝押せる要素（ボタン・ナビ・チップ・行）に当たったときだけ鳴らす */
  /* ★下部ナビ(.ni)は専用の音を鳴らすため対象外にする（音が二重に鳴るのを防ぐ） */
  const PRESSABLE='button, .chip>button, .mk, .mrow, .tabs button, #viewtabs button, .btn-ok, .btn-ghost, .sortbtn, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    /* ★下部ナビは専用の音（nav_move.wav）を鳴らすので、ここでは鳴らさない。
       [onclick] にナビも含まれてしまい、1回のタップで2種類の音が重なって
       「ココンコン」と聞こえていた原因。 */
    const tc=(e.target&&e.target.closest)?e.target:null;
    const hit=(!tc||tc.closest('nav .ni'))?null:tc.closest(PRESSABLE);
    if(hit && !hit.disabled && !hit.classList.contains('soon')){
      const now=Date.now();
      if(now-last>70){ last=now; setTimeout(tapSound,0); }   // 連打の二重発音を抑制。音は描画の後に回す
    }
  }, {passive:true});
})();

let view='dash';
/* 画面の登場演出：中身が下から浮かび上がる。0.7秒後にクラスを外して通常状態に戻す */
let nnEnterTm=null, nnEnterFlip=false, nnEnterFirst=true;
function nnEnter(id){
  /* ★最初の1回（ページを開いた直後）は流さない。
     ページ全体の登場演出がすでに動いているうえ、ここで演出を流すと
     「画面に出るまでの待ち時間」がまるまる伸びてしまうため。 */
  if(nnEnterFirst){ nnEnterFirst=false; return; }
  const el=document.getElementById(id); if(!el)return;
  /* ★以前は void el.offsetWidth で強制的に再計算させていたが、
     これがスマホで1秒以上かかる最大の原因だった（画面全体の再計算）。
     クラス名を2つ交互に切り替えるだけにして、再計算をゼロにする。 */
  nnEnterFlip=!nnEnterFlip;
  const add=nnEnterFlip?'nn-in':'nn-in2', del=nnEnterFlip?'nn-in2':'nn-in';
  el.classList.remove(del);
  el.classList.add(add);
  clearTimeout(nnEnterTm);
  nnEnterTm=setTimeout(()=>{el.classList.remove('nn-in');el.classList.remove('nn-in2');},1100);
  if(window.nnSfx)nnSfx('move');
}
function showView(v){
  nnClosePortal(); dfOpen=null; lfOpen=null;
  if(window.nnExitPanelEdit)window.nnExitPanelEdit();   /* パネル編集モードを終了（震えの持ち越し防止） */
  view=v;
  const sched=(v==='zentai'||v==='jisha');
  document.getElementById('dashboard').style.display = v==='dash' ? 'block':'none';
  document.getElementById('schedview').style.display = sched ? 'block':'none';
  document.getElementById('mainview').style.display  = v==='list' ? 'flex':'none';
  document.getElementById('toolbar').style.display   = v==='list' ? 'flex':'none';
  document.getElementById('viewtabs').style.display  = 'flex';
  ['dash','list','zentai','jisha'].forEach(k=>{const b=document.getElementById('vt_'+k); if(b)b.classList.toggle('on',v===k);});
  /* ★2026-08-14c 詳細を開くと body に nn-detail が付き、検索・絞り込みの帯が隠れる。
     showView('list') では show-detail しか外していなかったので、
     いちど詳細を開くと**帯が二度と戻らなかった**（本人の指摘「検索タグを入れなさい」）。
     詳細を表示していない画面では必ず外すこと。 */
  if(v==='list') document.getElementById('mainview').classList.remove('show-detail');
  document.body.classList.remove('nn-detail');
  if(v==='dash'){ if(dashDirty)renderDash(); } else if(sched) renderSched(v); else render();
  /* 画面が切り替わったときだけ登場アニメーションを流す（毎回の再描画では流さない） */
  nnEnter(v==='dash'?'dashboard':(sched?'schedview':'mainview'));
  if(window.schedListSb) schedListSb();
}

  dfOpen=willOpen?k:null; dfScroll=0;

  if(willOpen){ wrap.classList.add('open'); nnShowPortal(wrap.querySelector('.dfmenu'), wrap.querySelector('button'), 0); }

/* ============================================================
   ★2026-07-28 絞り込みプルダウンを「画面の直下」に出す方式に変更
   これまでプルダウンは絞り込みバーの中に置いていた。バーは横スクロール
   する枠で、さらに登場アニメーション（transform）が付いているため、

     これで、どんな枠の中のボタンから開いても必ず画面内に出る。
   ============================================================ */
function nnPortal(){

function nnShowPortal(src, btn, scrollTop){
  if(!src||!btn)return null;
  const p=nnPortal();
  p.className='dfmenu open';
  p.innerHTML=src.innerHTML;
  p.style.display='block';

/* ★プルダウンが画面からはみ出さないよう、高さを空き場所に合わせて決める。
   下に入らなければボタンの上へ出す。（はみ出して「押しても反応がない」ように
   見えていたため） */
function nnFitMenu(m, b){
  /* ★2026-08-13j パソコンの表示倍率（zoom）を必ず考えること。
     `getBoundingClientRect()` は倍率を**かけた後**のpx、`style.top/left` と
     `offsetWidth/scrollHeight` は倍率を**かける前**のpx。混ぜると、
     大きいモニター（倍率1.2〜1.6）ほどメニューが離れた場所に出る（§61の落とし穴）。
     ここでは「かけた後のpx」でそろえて計算し、最後に倍率で割って返す。 */
  const Z=window.nnPZ||1;
  const vv=window.visualViewport;
  const VH=vv?vv.height:innerHeight, VW=vv?vv.width:innerWidth;
  const OX=vv?vv.offsetLeft:0, OY=vv?vv.offsetTop:0;
  const below=(OY+VH)-(b.bottom+4)-10, above=(b.top-4)-(OY)-10;
  const useAbove = below<150 && above>below;
  const room=Math.max(120, Math.min(310, useAbove?above:below));   /* かけた後のpx */
  m.style.maxHeight=(room/Z)+'px';                                  /* CSSはかける前のpx */
  const h=Math.min(m.scrollHeight*Z+10, room);                      /* かけた後のpxにそろえる */
  const mw=m.offsetWidth*Z;
  const top = useAbove ? Math.max(OY+6, b.top-4-h) : Math.min(b.bottom+4, OY+VH-h-8);
  return {top:Math.max(OY+6, top)/Z,
          left:Math.max(OX+6, Math.min(b.left, OX+VW-mw-6))/Z};
}

let dashRestRaf=0, dashChunkTm=0;
function nnChunks(d,list){
  if(dashRestRaf){cancelAnimationFrame(dashRestRaf); dashRestRaf=0;}
  if(dashChunkTm){clearTimeout(dashChunkTm); dashChunkTm=0;}
  let i=0;
  const step=()=>{
    dashRestRaf=requestAnimationFrame(()=>{
      dashRestRaf=0;
      dashChunkTm=setTimeout(()=>{
        dashChunkTm=0;
        if(i>=list.length){ if(window.schedListSb)schedListSb(); return; }
        d.insertAdjacentHTML('beforeend',list[i++]);
        step();
      },0);
    });
  };
  step();
}

/* ---------- 画面共通の自前スクロールバー（iPhoneは標準のバーが操作中しか出ないため） ----------
   ダッシュボード／現場一覧／現場の詳細／スケジュールのうち、いま表示中の枠に自動で連動する */
(function(){
  const sb=document.getElementById('listsb'); if(!sb)return;
  const thumb=sb.querySelector('i');
  let target=null, raf=0, drag=null;
  function pane(){
    const mv=document.getElementById('mainview');
    if(view==='dash')return document.getElementById('dashboard');
    if(view==='zentai'||view==='jisha')return document.getElementById('schedview');
    if(view==='list')return (mv&&mv.classList.contains('show-detail'))?document.getElementById('detail'):document.getElementById('list');
    return null;
  }
  function onScroll(){ if(!raf)raf=requestAnimationFrame(()=>{raf=0; syncListSb();}); }
  window.syncListSb=function(){
    const el=pane();
    if(el!==target){
      if(target)target.removeEventListener('scroll',onScroll);
      target=el;
      if(target)target.addEventListener('scroll',onScroll,{passive:true});
    }
    if(!target||!target.offsetParent){ sb.classList.remove('on'); return; }
    const sh=target.scrollHeight, ch=target.clientHeight;
    if(sh<=ch+2){ sb.classList.remove('on'); return; }
    const r=target.getBoundingClientRect();
    sb.style.top=Math.round(r.top+6)+'px';
    sb.style.height=Math.max(60,Math.round(ch-12))+'px';
    sb.classList.add('on');
    const trackH=sb.clientHeight;
    const th=Math.max(34, Math.round(trackH*ch/sh));
    const maxTop=Math.max(0,trackH-th);
    thumb.style.height=th+'px';
    thumb.style.top=Math.round(maxTop*target.scrollTop/(sh-ch))+'px';
  };
  /* ★位置合わせは「画面を出したあと」に行う。
     描画の直前に行うと、画面が出るまでの待ち時間にそのまま上乗せされるため。 */
  window.schedListSb=function(){ requestAnimationFrame(()=>setTimeout(()=>{try{syncListSb();}catch(_){}} ,0)); };
  addEventListener('resize',()=>syncListSb());
  const jump=nt=>{ if(!target)return;
    const maxTop=Math.max(0,sb.clientHeight-thumb.offsetHeight);
    target.scrollTop=(target.scrollHeight-target.clientHeight)*(maxTop?nt/maxTop:0);
  };
  thumb.addEventListener('pointerdown',e=>{
    drag={y:e.clientY, top:parseFloat(thumb.style.top)||0};
    try{thumb.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault(); e.stopPropagation();
  });
  thumb.addEventListener('pointermove',e=>{
    if(!drag)return;
    const maxTop=Math.max(0,sb.clientHeight-thumb.offsetHeight);
    const nt=Math.max(0,Math.min(maxTop, drag.top+(e.clientY-drag.y)));
    thumb.style.top=nt+'px'; jump(nt);
  });
  const endDrag=()=>{drag=null;};
  thumb.addEventListener('pointerup',endDrag); thumb.addEventListener('pointercancel',endDrag);
  sb.addEventListener('pointerdown',e=>{
    if(e.target===thumb)return;
    const th=thumb.offsetHeight, maxTop=Math.max(0,sb.clientHeight-th);
    jump(Math.max(0,Math.min(maxTop, e.clientY-sb.getBoundingClientRect().top-th/2)));
    syncListSb();
  });
  /* 中身が変わったときも追従（内訳の開閉・絞り込みなど） */
  setInterval(()=>{ if(!drag)syncListSb(); }, 700);
})();

/* ---------- 左枠リサイザー ---------- */
(function(){
  const rz=document.getElementById('resizer'), list=document.getElementById('list');
  let drag=false;
  rz.addEventListener('mousedown',e=>{drag=true; rz.classList.add('on'); e.preventDefault();});

    const w=Math.min(Math.max(e.clientX,300), innerWidth*0.68);
    list.style.flex='0 0 '+w+'px'; list.style.maxWidth=w+'px';});

/* ★requestAnimationFrame だけでは「その回の描画」に間に合ってしまい、
   結局ダッシュボードが出来上がるまで画面が出ない（＝1〜2秒真っ白）。

<script>
/* ============================================================
   スマホ表示モード切替
   ・一覧モード（既定）：デスクトップレイアウトを縮小して全体表示。
     ピンチ（指を広げる）でいつでも拡大可能。
   ・モバイル表示：従来のレスポンシブ表示。
   右下の丸ボタンで切替。設定は端末に記憶され全ページ共通。
   ============================================================ */
(function(){
  const KEY='nn_view_mode', VW=980;
  const vp=document.querySelector('meta[name="viewport"]');
  const phone=Math.min(screen.width,screen.height)<700;
  function getMode(){ try{return localStorage.getItem(KEY)||'ichiran';}catch(e){return 'ichiran';} }
  /* 一覧モードは画面を980px幅に縮小して表示するため、そのままだと下部ナビのアイコンだけが
     他ページ（等倍表示）より小さく見える。縮小率のぶんだけ拡大して実寸を揃える。
     ★横向きと縦向きで画面の幅がまったく違うので、いま向いている方の幅で計算すること
       （縦の幅で固定すると、横向きのときに2倍以上に膨らむ） */
  function navScale(m){
    if(m!=='ichiran'){
      document.documentElement.style.removeProperty('--navicon');
      document.documentElement.style.removeProperty('--navpad');
      return;
    }
    const sw=screen.width||393, sh=screen.height||852;
    const land=innerWidth>innerHeight;                  /* 一覧モードでは幅が980固定なので高さと比べて判定できる */
    const dev=land?Math.max(sw,sh):Math.min(sw,sh);     /* いまの向きでの画面の幅（ポイント） */
    document.documentElement.setAttribute('data-nnland',land?'1':'0');
    const base=dev>760?46:40;                           /* 他ページが同じ幅で使っている大きさに合わせる */
    const k=Math.max(1,VW/dev);
    document.documentElement.style.setProperty('--navicon',(base*k).toFixed(1)+'px');
    document.documentElement.style.setProperty('--navpad',(2*k).toFixed(1)+'px');
    document.documentElement.style.setProperty('--navgap',((land?8:7)*k).toFixed(1)+'px');
  }
  /* 画面を回したら計算し直す */
  addEventListener('orientationchange',()=>setTimeout(()=>navScale(getMode()),300));
  addEventListener('resize',()=>navScale(getMode()));
  function apply(m){
    if(m==='ichiran'){ vp.setAttribute('content','width='+VW+', user-scalable=yes, viewport-fit=cover'); }
    else{ vp.setAttribute('content','width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover'); }
    navScale(m);
    try{localStorage.setItem(KEY,m);}catch(e){}
    const b=document.getElementById('vmToggle');
    if(b){
      b.textContent=(m==='ichiran'?'📱 モバイル表示':'🗂 一覧表示');
      /* 一覧モードは全体が縮小されるためボタンは大きめに作る */
      b.style.fontSize=(m==='ichiran'?'26px':'13px');
      b.style.padding=(m==='ichiran'?'14px 22px':'8px 14px');
      b.style.bottom=(m==='ichiran'?'120px':'72px');
    }
  }
  window.nnToggleView=function(){ apply(getMode()==='ichiran'?'mobile':'ichiran'); };
  if(!phone){ vp.setAttribute('content','width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover'); navScale('mobile'); return; }
  function mkBtn(){
    if(document.getElementById('vmToggle'))return;
    const b=document.createElement('button'); b.id='vmToggle';
    b.setAttribute('style','position:fixed;right:10px;bottom:72px;z-index:9999;'
      +'background:#1e5c3a;color:#fff;border:2px solid rgba(255,255,255,.65);'
      +'border-radius:999px;font-weight:800;letter-spacing:.03em;'
      +'box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer;opacity:.93;');
    b.onclick=window.nnToggleView;
    document.body.appendChild(b);
    apply(getMode());
  }
  apply(getMode());
  /* 「モバイル表示」切替ボタンは廃止（画面上の残像文字を解消） */
})();
</script>

<script>

   スマホの実機でどこに時間がかかっているかを数字で出す。
   ・net  ＝ページを要求してから最初の返事が来るまで（通信の待ち）
   ・recv ＝中身を受け取り終わるまで
   ・build＝受け取ってから組み立て終わるまで（解析・JS実行）

      build:Math.round(n.domContentLoadedEventEnd), paint:fcp?Math.round(fcp.startTime):-1,

     （＝「再読み込み2回」が不要になり、直したことが必ず反映される） */
/* ★2026-07-28 検証：サービスワーカーを一時的に止める
   ホーム(37KB)も現場記録帳(300KB)も、どちらもタップから約0.9秒。
   中身の重さが10倍近く違うのに時間が同じ＝ページの組み立てではなく、
   移動のたびにかかる「決まった待ち時間」がある、ということ。
   iPhoneのSafariでは、この保存の仕組み（サービスワーカー）が
   眠っていると、移動のたびに起こす時間が数百ミリ秒かかることが知られている。
   → いったん止めて、これが原因かを確かめる。
   NN_USE_SW を true に戻せば、オフライン対応ごと元に戻せる。 */
const NN_USE_SW=false;
if('serviceWorker' in navigator){
  if(NN_USE_SW){
    let nnReloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(nnReloaded)return; nnReloaded=true; location.reload();
    });
    addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(r=>{
        try{r.update();}catch(_){}
        if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage('nn-precache');
      }).catch(()=>{});
    });
  }else{
    /* すでに入っている分を取り除き、保存分も消す（1回だけ読み直す） */
    addEventListener('load',async()=>{
      try{
        const rs=await navigator.serviceWorker.getRegistrations();
        if(rs.length){
          await Promise.all(rs.map(r=>r.unregister()));
          if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));}
          if(!sessionStorage.getItem('nnSwOff')){ sessionStorage.setItem('nnSwOff','1'); location.reload(); }
        }
      }catch(_){}
    });
  }
}
</script>
<script>
/* ============ ナビの操作音（2026-07-28 作り直し） ============
   ★以前は <audio> を2個ずつ用意して音源ファイル(nav_move.wav)を
     読ませていたが、iPhoneでは音声部品の準備が重く、しかも
     いつ終わるか読めないため、画面が出るまでの待ち時間に影響していた。
     → 音源ファイルをやめ、その場で音を合成する方式（Web Audio）に変更。
       ファイル読み込みゼロ・部品ゼロ・音は今までと同じ「やわらかい1音」。
   ============================================================ */
(function(){
  /* ★2026-07-28 音が出たり出なかったりした原因
     ①音の装置(AudioContext)を「ナビを最初に押したとき」に作っていた。
       iPhoneでは作った直後は停止状態で、動き出すまでに少し時間がかかるため、
       その1回目の音が鳴らないことがあった。
     ②画面移動が0.09秒後に始まるので、音が長いと途中で切れていた。
     → 装置は「画面のどこかを最初に触った時点」で作って動かしておく。
       音は0.07秒に短くして、移動が始まる前に鳴り終わるようにする。 */
  let AC=null, last=0;
  function make(){
    if(AC)return AC;
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    try{ AC=new C(); }catch(_){ return null; }
    /* 無音を1粒だけ鳴らして、iPhoneの音の仕組みを起こしておく */
    try{ const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
         s.buffer=b; s.connect(AC.destination); s.start(0); }catch(_){}
    return AC;
  }
  function unlock(){ const c=make(); if(c && c.state==='suspended'){ try{c.resume();}catch(_){} } }
  addEventListener('pointerdown',unlock,{passive:true,capture:true});
  addEventListener('touchstart',unlock,{passive:true,capture:true});
  /* 画面が戻ってきたときは、止まっている音の装置を起こし直す
     （iPhoneは他のアプリに切り替えると止めることがある） */
  function wake(){ const c=AC; if(c && c.state!=='running'){ try{c.resume();}catch(_){} } }
  addEventListener('pageshow', wake);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) wake(); });

  /* 実際に音を出す部分。ここは「装置が動いている」ときだけ呼ぶ */
  function beep(c){
    const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t);        /* ラの音・単純でやわらかい */
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.38,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.07);
  }

  /* ★2026-07-31 「鳴ったり鳴らなかったり」の直し方
     iPhoneは、ページを開いた直後の音の装置が「止まった状態」で始まる。
     動き出す（resume）のは少し後なので、押してすぐ画面が変わると
     音が鳴る前に前のページが消えてしまう＝無音になっていた。
     そこで
       ・鳴らせたかどうかを返す（true＝すぐ鳴った）
       ・すぐ鳴らせなかったときは、動き出したら鳴らす（nnSoundReady で待てる）
     ようにして、ナビ側が「音が出るのを待ってから画面を移る」ようにした。 */
  window.nnSoundReady=null;
  window.nnMoveSound=function(){
    const now=Date.now(); if(now-last<160)return true; last=now;   /* 連続再生を抑える */
    try{
      const c=make(); if(!c)return true;
      if(c.state==='running'){ beep(c); return true; }
      /* まだ動いていない：起こしてから鳴らす。ナビ側はこれを待てる */
      window.nnSoundReady=new Promise(function(res){
        let done=false;
        const fire=function(){ if(done)return; done=true; try{ beep(c); }catch(_){} res(); };
        try{ const p=c.resume(); if(p&&p.then) p.then(fire, fire); else fire(); }catch(_){ fire(); }
        setTimeout(fire, 120);      /* 起きなくても待たせすぎない */
      });
      return false;
    }catch(_){ return true; }
  };
})();
</script>
<script>
/* ============ ナビ：指を触れたまま移動できる操作（2026-07-28 改） ============
   ・指を置いた瞬間にアイコンが光って音が鳴る
   ・そのまま 0.09秒 指が止まっていれば、離すのを待たずに移動する（＝速い）
   ・押したまま横へなぞると指の下のアイコンが反応し、離した先へ移動する
   ・アイコンの外で離せば移動しない（やめられる）
   ============================================================ */
(function(){
  const nav=document.getElementById('nav')||document.querySelector('nav');
  if(!nav)return;
  let dragging=false, cur=null;
  const itemAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('nav .ni'):null; };
  let lastSnd=0;
  function focus(ni){
    if(ni===cur)return;
    if(!ni)return;                     /* アイコンの隙間に指がかかっても、直前の選択を保つ
                                          （指のわずかな揺れで音が連発するのを防ぐ） */
    if(cur)cur.classList.remove('press');
    cur=ni; cur.classList.add('press');
    /* 音を鳴らす。すぐ鳴らせなかったときは、移動を少しだけ待つ（下の go を参照） */
    sndNow=true;
    if(window.nnMoveSound)try{ sndNow=(nnMoveSound()!==false); }catch(_){}
    /* ★先読みの fetch は削除（2026-07-28）。移動処理と取り合って遅くなっていた。 */
  }
  /* ★ここが「遅い」の正体だった（2026-07-28 画面録画の実測で判明）
     以前は「指を離したとき」に初めて移動していた。画面録画を1コマずつ調べると、
     アイコンが光ってから画面が変わるまで約0.9秒、その間まったく何も起きていない。
     ＝ページの読み込みが遅いのではなく、指を離すまで移動を始めていなかった。
     そこで「指を置いて 0.09秒たっても動かさなければ、離すのを待たずに移動する」
     方式にした。なぞって選び直したい場合（指を動かした場合）は今までどおり、
     指を離した先のアイコンへ移動する。 */
  const HOLD_MS=90;          /* この時間だけ指が止まっていたら、離すのを待たずに移動 */
  const MOVE_PX=10;          /* この距離より動いたら「なぞり操作」とみなす */
  let goTm=0, downPt=null, gone=false;
  let sndNow=true;
  function go(t){
    if(gone)return;
    if(!t||t.classList.contains('on'))return;
    const m=(t.getAttribute('onclick')||'').match(/navGo\('([^']*)'\s*,\s*'([^']*)'\)/);
    if(!(m&&typeof navGo==='function'))return;
    gone=true;
    /* ★音がすぐ鳴ったときは今までどおり即移動（速さは変えない）。
       鳴らなかったときだけ、音が出るのを最大0.16秒待ってから移動する。 */
    if(sndNow || !window.nnSoundReady){ navGo(m[1],m[2]); return; }
    let moved=false;
    const jump=function(){ if(moved)return; moved=true; navGo(m[1],m[2]); };
    try{ window.nnSoundReady.then(function(){ setTimeout(jump, 30); }); }catch(_){}
    setTimeout(jump, 160);
  }
  function cancelHold(){ if(goTm){clearTimeout(goTm); goTm=0;} }
  nav.addEventListener('pointerdown',e=>{
    const ni=e.target.closest&&e.target.closest('.ni'); if(!ni)return;
    dragging=true; cur=null; gone=false; downPt=[e.clientX,e.clientY]; focus(ni);
    try{nav.setPointerCapture(e.pointerId);}catch(_){}
    cancelHold();
    goTm=setTimeout(()=>{ goTm=0; go(cur); }, HOLD_MS);
  });
  nav.addEventListener('pointermove',e=>{
    if(!dragging)return;
    if(downPt && Math.abs(e.clientX-downPt[0])+Math.abs(e.clientY-downPt[1])>MOVE_PX) cancelHold();
    focus(itemAt(e.clientX,e.clientY));
  });
  function finish(e){
    if(!dragging)return;
    dragging=false; cancelHold();
    const t=cur; if(cur){cur.classList.remove('press'); cur=null;}
    go(t);
  }
  nav.addEventListener('pointerup',finish);
  nav.addEventListener('pointercancel',()=>{dragging=false; cancelHold(); if(cur){cur.classList.remove('press'); cur=null;}});
  /* 上の処理で移動するので、通常のクリックは止める（二重に移動しないように） */
  nav.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); },true);
})();
</script>

<script id="nn-btmsafe">
/* ============================================================
   たて画面で、下部ナビの下側が画面の外に切れるのを防ぐ（2026-07-29）
   ------------------------------------------------------------
   このページは「一覧モード」のとき、画面を幅980で組み立ててから
   端末の幅に合わせて縮めて表示している。
   iPhoneを「たて」に持つと 393px 幅なので、縮小率は約0.40。
   このとき、画面下端のホームバー用に確保している余白も同じだけ
   縮んでしまい、実際には5〜6px程度しか空かない。
   その結果、ナビの下の段（カメラ・ライブラリなど）の文字が
   ホームバーに重なって「下が見切れている」状態になっていた。
   ここでは、縮小率のぶんだけ余白を大きくして渡し直す。
   ・縮めずに表示している画面（倍率1）では 0 なので、見た目は今まで通り。
   ・レイアウト（並び方・大きさ）は一切変えない。下端の余白だけを直す。
   ============================================================ */
(function(){
  var MIN_REAL = 16;   /* 実際の画面で確保したい下余白（px） */
  function fit(){
    var pr = true;
    try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = innerHeight > innerWidth; }
    var dev = pr ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    var k = (dev > 0) ? (innerWidth / dev) : 1;
    /* 縮めて表示しているときだけ効かせる（等倍のときは 0＝今まで通り） */
    var v = (k >= 1.5) ? Math.round(MIN_REAL * k) : 0;
    document.documentElement.style.setProperty('--nnsabmin', v + 'px');
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
  addEventListener('load', fit, {once:true});
})();
</script>
<style id="nn-fillh">
/* ============================================================
   画面のいちばん下まで使い切る（2026-07-29）
   ------------------------------------------------------------
   これまでアプリの高さは 100dvh（＝画面の高さ）で指定していたが、
   iPhoneをたてに持つと、この値が実際に見えている高さより小さくなり、
   画面の下のほうに、何も置かれない帯（すき間）ができていた。
   下の script で「実際に見えている高さ」を測って --nnvh に入れ、
   それをアプリの高さに使う。
   ※ズレが無いときは今までと同じ値になるので、見た目は変わらない。
   ============================================================ */

<script id="nn-fillh-js">
/* ============================================================
   画面のいちばん下まで使い切る（2026-07-29）
   ・--nnvh ＝ 実際に見えている画面の高さ
   ・表示中の画面（一覧・ダッシュボード等）の下に余りがあれば、そのぶん伸ばす
   　（すき間があるときだけ動くので、余りが無ければ何もしない）
   ============================================================ */
(function(){
  var VIEWS = ['dashboard','mainview','schedview'];
  /* ホーム画面のアイコンから起動しているか（＝全画面のアプリとして開いているか） */
  function isStandalone(){
    try{
      if(navigator.standalone === true) return true;
      return matchMedia('(display-mode: standalone)').matches
          || matchMedia('(display-mode: fullscreen)').matches;
    }catch(e){ return false; }
  }
  /* 画面のいちばん下に貼っておく、見えない1pxの目印。
     ★iPhoneをたてに持つと、端末が申告してくる「画面の高さ」が
       実際に見えている高さより小さいことがある（このページのように
       画面を縮めて表示していると起きる）。その申告値をそのまま使うと、
       画面の下のほうに何も置かれない帯（すき間）が残ってしまう。
       目印は画面の下端に貼り付いているので、その位置を測れば
       「本当の下端」が分かる。 */
  var probe = null;
  function probeBottom(){
    if(!probe || !probe.parentNode){
      probe = document.createElement('div');
      probe.id = 'nnBtmProbe';
      probe.setAttribute('style','position:fixed;left:0;bottom:0;width:1px;height:1px;'
        + 'pointer-events:none;opacity:0;z-index:-1;');
      (document.body || document.documentElement).appendChild(probe);
    }
    return probe.getBoundingClientRect().bottom;
  }
  function pageH(){
    var vv = window.visualViewport;
    var h = innerHeight;
    /* 文字入力でキーボードが出ると visualViewport は小さくなるので、大きいほうを採る */
    if(vv && vv.height > h) h = vv.height;
    /* 目印のほうが下にあれば、そちらが本当の下端。
       ブラウザで開いているときは下のバーの分だけ縮むのが正しいので、この直しは
       ホーム画面から起動したときだけ効かせる。あり得ない大きさは念のため採らない。 */
    if(isStandalone()){
      var t = probeBottom();
      if(t > h + 1 && t < h * 3) h = t;
    }
    return Math.round(h);
  }
  function fill(){
    /* ★★2026-08-16z ピンチで拡大している間は、高さを測り直さない。
       拡大中は「見えている範囲」と「組み立ての座標」がずれるため、
       ここで body の高さや minHeight を計算し直すと盛大に狂い、
       画面の下に巨大な空白が出て「ズームすると画面が変になる」（実機で発生）。
       見えている幅（visualViewport.width）が組み立て幅（innerWidth）より
       狭い＝拡大中、で見分ける。拡大をやめれば resize が来て測り直される。 */
    var vvz = window.visualViewport;
    if(vvz && vvz.width < window.innerWidth * 0.96) return;
    /* ★2026-08-11a パソコンで表示倍率（zoom）をかけているときは、
       innerHeight（実画面のpx）をそのまま使うと body の高さが倍率ぶん大きくなる。
       倍率で割って「CSSのpx」に直す。 */
    var _z = window.nnPZ || 1;
    var pb = pageH() / _z;
    document.documentElement.style.setProperty('--nnvh', pb + 'px');
    if(_z !== 1){                      /* 倍率をかけているときは下の余白うめをしない（パソコン用） */
      if(VIEWS) VIEWS.forEach(function(id){ var e=document.getElementById(id); if(e) e.style.minHeight=''; });
      return;
    }
    if(!VIEWS) return;
    var v = null;
    for(var i=0;i<VIEWS.length;i++){
      var e = document.getElementById(VIEWS[i]);
      if(e && e.offsetParent !== null){ v = e; break; }
    }
    if(!v) return;
    /* 下部ナビが場所を取っている高さ（自動で隠れているときは 0） */
    var navOcc = 0;
    var nav = document.getElementById('nav');
    if(nav){
      var ns = getComputedStyle(nav);
      if(ns.display !== 'none' && ns.position !== 'fixed' && ns.position !== 'absolute'){
        var mb = parseFloat(nav.style.marginBottom || '0') || 0;   /* 隠れているときは負の値 */
        navOcc = Math.max(0, nav.offsetHeight + mb);
      }
    }
    if(v.style.minHeight) v.style.minHeight = '';      /* いったん元に戻して測る */
    var r = v.getBoundingClientRect();
    var gap = (pb - navOcc) - r.bottom;                 /* 下に余っている高さ */
    if(gap > 2) v.style.minHeight = Math.round(r.height + gap) + 'px';
  }
  fill();
  addEventListener('load', fill);
  addEventListener('resize', fill);
  addEventListener('orientationchange', function(){ setTimeout(fill, 300); });
  setInterval(fill, 800);        /* ナビの自動開閉・画面の切替に追従する */
  window.nnFillBottom = fill;
})();

<script id="nn-hdr-std-js">
/* 倍率 --nnhm を計算して渡す（＝そのページの組み立て幅 ÷ 980） */
(function(){
  function set(){
    try{
      /* ★パソコンでは倍率1（＝今までどおり）にすること。
         パソコンのブラウザは viewport の width=980 指定を無視するため、
         画面を縮めて表示していない。ここで innerWidth/980 を掛けると
         ヘッダーだけ1.5倍に膨らんでしまう。 */
      var dev = Math.min(screen.width || 0, screen.height || 0);
      var phone = dev && dev < 700;
      var m = phone ? ((innerWidth || 980) / 980) : 1;
      if(!(m > 0.05 && m < 4)) m = 1;              /* あり得ない値は採らない */
      document.documentElement.style.setProperty('--nnhm', m.toFixed(4));
      /* ノッチの逃げの割り増し（＝そのページの縮小率の逆数）。
         いま向いている方の画面の幅で計算すること。 */
      var pr = true;
      try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = innerHeight > innerWidth; }
      var scr = pr ? Math.min(screen.width||0, screen.height||0) : Math.max(screen.width||0, screen.height||0);
      var saf = (phone && scr > 0) ? ((innerWidth || scr) / scr) : 1;
      if(!(saf > 0.5 && saf < 5)) saf = 1;
      document.documentElement.style.setProperty('--nnsaf', saf.toFixed(4));
    }catch(e){}
  }
  set();
  addEventListener('resize', set);
  addEventListener('orientationchange', function(){ setTimeout(set, 300); });
  addEventListener('load', set, {once:true});
})();
</script>

<script id="nn-nowline-js">
/* ★いまの時刻を「その日の何％の位置か」に直して、CSS変数に入れるだけ。
   0時＝0%／12時＝50%／24時＝100%。1分ごとに更新するので線が少しずつ右へ動く。 */
(function(){
  function nnNowLine(){
    const d=new Date();
    const pct=((d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds())/86400)*100;
    document.documentElement.style.setProperty('--nnnow', pct.toFixed(3)+'%');
  }
  nnNowLine();
  setInterval(nnNowLine, 60000);                 /* 1分ごと */
  addEventListener('pageshow', nnNowLine);       /* 画面に戻ったとき */
  addEventListener('visibilitychange', ()=>{ if(!document.hidden) nnNowLine(); });
})();
</script>


<script id="nn-todayscroll-js">
/* ============================================================
   ★2026-08-05 工程表を開いた瞬間、「今日の列」が画面の真ん中あたりに来るよう
   自動で横スクロールする。
   ・これが無いと、表は左端（工事の開始月）を映した状態で開くので、
     今日を見るのに毎回スクロールが必要だった（赤い線も画面外で意味がない）。
   ・表は作り直されるたびに新しい箱になるので、
     「まだ寄せていない箱」を見つけて1回だけ寄せる（data-nncent が目印）。
   ・今日の列が無い表（工期が過去／未来だけの表）は、何もしない。
   ============================================================ */
(function(){
  function centerOne(w){
    if(!w || w.dataset.nncent==='1') return;
    /* ★5か月表示では日付・曜日の行が display:none になるので、
       幅0の（見えていない）マスを掴まないよう、幅のあるものを選ぶ。 */
    const c=[...w.querySelectorAll('.gtoday')].find(el=>el.getBoundingClientRect().width>0);
    if(!c) return;                       /* 今日の列が無い表はそのまま */
    const wr=w.getBoundingClientRect(), cr=c.getBoundingClientRect();
    if(wr.width<=0 || cr.width<=0) return;   /* まだ画面に出ていない（幅0）ときは次の機会に */
    /* ★左の「工程／開始・終了」の列は貼り付いたまま動かない（sticky）ので、
       その幅を除いた「実際にマスが見えている範囲」の真ん中に合わせる。
       箱全体の真ん中にすると、今日が左に寄って見える。 */
    const gn=w.querySelector('.gtbl .gname');
    const nameW=gn ? gn.getBoundingClientRect().width : 0;
    const viewL=wr.left + nameW, viewR=wr.right;
    w.scrollLeft += (cr.left + cr.width/2) - (viewL + (viewR-viewL)/2);
    w.dataset.nncent='1';
  }
  function centerAll(){
    document.querySelectorAll('.gwrap').forEach(centerOne);
  }
  /* 表が作り直されたら、次のコマで寄せる（幅が決まってから測るため） */
  let waiting=false;
  function later(){
    if(waiting) return;
    waiting=true;
    requestAnimationFrame(()=>{ waiting=false; centerAll(); });
  }
  const targets=['schedview','mainview','dashboard'];
  function watch(){
    targets.forEach(id=>{
      const el=document.getElementById(id);
      if(!el || el.dataset.nnwatch==='1') return;
      el.dataset.nnwatch='1';
      new MutationObserver(later).observe(el,{childList:true, subtree:true});
    });
    later();
  }
  if(document.readyState==='loading') addEventListener('DOMContentLoaded',watch);
  else watch();
  /* 画面の向きが変わると幅が変わるので、寄せ直す */
  addEventListener('orientationchange',()=>{
    setTimeout(()=>{ document.querySelectorAll('.gwrap').forEach(w=>w.removeAttribute('data-nncent')); centerAll(); },420);
  });
  window.nnCenterToday=centerAll;      /* 手動で呼びたいとき用 */
})();
</script>


<style id="nn-kotei">
/* ★2026-08-06b 工程表PDFのボタン（施工中カードの見出し） */
.sc-head .nnkbtn{font-family:inherit; font-size:12px; font-weight:800; color:#fff;
  background:var(--green-deep,#1c6b3c); border:0; border-radius:7px; padding:6px 10px; cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,.2); white-space:nowrap;}
.sc-head .nnkbtn:active{transform:translateY(1px);}
</style>

<script id="nn-kotei-js">
/* ============================================================
   ★工程表（バーチャート）をPDFで出す（2026-08-06b）
   ねらい：元請に出す「総合工程表」を1タップで作る。
   ・元請工程（総合）と自社工程（防水工事）を1枚に並べる
   ・A3横／図枠／工事概要の帯／凡例／備考／表題欄
   ・今日の位置に赤い縦線（現場の打合せでそのまま使える）
   ・SVGで描く＝PDFにベクターで入るので、拡大しても線がぼやけない
   ============================================================ */
(function(){
  const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const dnum=iso=>{ const a=String(iso||'').split('-'); return Date.UTC(+a[0],(+a[1]||1)-1,+a[2]||1)/864e5; };
  const dobj=n=>new Date(n*864e5);
  const WD=['日','月','火','水','木','金','土'];
  const md=n=>{ const d=dobj(n); return (d.getUTCMonth()+1)+'/'+d.getUTCDate(); };

  function mk(){
    const S=[]; const r2=v=>Math.round(v*100)/100;
    const A={S:S,r2:r2};
    A.line=(x1,y1,x2,y2,w,c,d)=>S.push('<line x1="'+r2(x1)+'" y1="'+r2(y1)+'" x2="'+r2(x2)+'" y2="'+r2(y2)+
      '" stroke="'+(c||'#111')+'" stroke-width="'+(w||0.2)+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>');
    A.text=(x,y,t,sz,anc,c,bold,rot)=>S.push('<text x="'+r2(x)+'" y="'+r2(y)+'" font-size="'+(sz||3)+
      '" text-anchor="'+(anc||'start')+'" fill="'+(c||'#111')+'" font-family="sans-serif"'+
      (bold?' font-weight="700"':'')+(rot?' transform="rotate('+r2(rot)+' '+r2(x)+' '+r2(y)+')"':'')+'>'+esc(t)+'</text>');
    A.rect=(x,y,w,h,sw,fill,c,rx)=>S.push('<rect x="'+r2(x)+'" y="'+r2(y)+'" width="'+r2(Math.max(0,w))+'" height="'+r2(Math.max(0,h))+
      '" fill="'+(fill||'none')+'" stroke="'+(c||'#111')+'" stroke-width="'+(sw||0.25)+'"'+(rx?' rx="'+rx+'"':'')+'/>');
    /* ★枠からはみ出さないよう、入りきらない分は「…」で切る
       （日本語は1文字＝文字サイズ、英数は約0.55倍として見積もる） */
    A.wid=(t,sz)=>{ let w=0; for(const ch of String(t)) w+=(ch.charCodeAt(0)>0x2E80?sz:sz*0.55); return w; };
    A.fit=(t,sz,maxW)=>{ t=String(t==null?'':t);
      if(A.wid(t,sz)<=maxW) return t;
      let out='';
      for(const ch of t){ if(A.wid(out+ch,sz)+sz>maxW) break; out+=ch; }
      return out+'…'; };
    return A;
  }

  window.nnKoteiPDF=function(pid){
    const p=props.find(x=>x.id===pid);
    if(!p){ toast('物件が見つかりません'); return; }
    try{ ensureGantt(p); ensureMotoGantt(p); }catch(e){}

    /* --- 行をつくる（元請 → 自社の順） --- */
    const rows=[];
    if((p.motoGantt||[]).length){
      rows.push({grp:1, name:'【元請工程（総合）】'});
      p.motoGantt.forEach(r=>rows.push({name:r.name,start:r.start,end:r.end,memo:r.memo,moto:true,
        hi:(r.name||'').includes('防水')}));
    }
    if((p.gantt||[]).length){
      rows.push({grp:1, name:'【自社工程（防水工事）】'});
      p.gantt.forEach(r=>rows.push({name:r.name,start:r.start,end:r.end,memo:r.memo,
        hi:(r.name||'').includes('防水施工')}));
    }
    const bars=rows.filter(r=>!r.grp && r.start && r.end);
    if(!bars.length){ toast('工程が登録されていません'); return; }

    let n0=1e9, n1=-1e9;
    bars.forEach(r=>{ n0=Math.min(n0,dnum(r.start)); n1=Math.max(n1,dnum(r.end)); });
    n0-=2; n1+=2;
    const nDays=Math.max(7, n1-n0+1);

    /* --- 紙 --- */
    const PW=420, PH=297, M=8, tbH=26;
    const ix0=M, iy0=M, ix1=PW-M, iy1=PH-M;
    const ax0=ix0+5, ay0=iy0+5, ax1=ix1-5, ay1=iy1-tbH-8;
    const A=mk();
    A.rect(ix0,iy0,ix1-ix0,iy1-iy0,0.7);
    A.rect(ix0+2,iy0+2,ix1-ix0-4,iy1-iy0-4,0.25);

    A.text(ax0, ay0+6, '工程表（バーチャート）', 5.4,'start','#111',true);

    /* --- 工事概要の帯 --- */
    const ymd=n=>{ const d=dobj(n); return d.getUTCFullYear()+'/'+('0'+(d.getUTCMonth()+1)).slice(-2)+'/'+('0'+d.getUTCDate()).slice(-2); };
    let rs=1e9, re=-1e9;
    bars.forEach(r=>{ rs=Math.min(rs,dnum(r.start)); re=Math.max(re,dnum(r.end)); });
    const ov=[['工　事　名', p.name||'—'],['工事場所', p.addr||'—'],['元　　請', p.moto||'—'],
              ['工　　期', ymd(rs)+' 〜 '+ymd(re)],
              ['数　　量', (p.m||0).toLocaleString()+(p.un||'㎡')],
              ['工　　法', p.spec||'—'],['メーカー', p.makerFull||p.maker||'—'],['進　　捗', (p.prog||0)+' %']];
    const ovY=ay0+10, ovH=13, cwv=(ax1-ax0)/4;
    A.rect(ax0, ovY, ax1-ax0, ovH, 0.4, '#f6f8f4');
    ov.forEach((r,i)=>{
      const col=i%4, row=(i/4)|0;
      const x=ax0+cwv*col, y=ovY+ovH/2*row;
      if(col) A.line(x, y, x, y+ovH/2, 0.2,'#bbb');
      if(row) A.line(ax0, y, ax1, y, 0.2,'#bbb');
      A.text(x+2, y+4.4, r[0], 2.6,'start','#555',true);
      A.text(x+20, y+4.4, A.fit(r[1],3,cwv-22), 3,'start','#111',true);
    });

    /* --- 表の枠 --- */
    const nameW=54, dtW=32, tx0=ax0, gx0=ax0+nameW+dtW, gx1=ax1;
    const tyTop=ovY+ovH+5;
    const cw=(gx1-gx0)/nDays;
    const unit=(cw>=2.2)?'day':'week';
    const hdH=(unit==='day')?12:9;                 /* 月／日／曜日 */
    const bodyTop=tyTop+hdH;
    const legendH=34;
    const rowH=Math.min(11, Math.max(4.2, (ay1-legendH-bodyTop)/rows.length));
    const bodyBot=bodyTop+rowH*rows.length;
    const X=n=>gx0+(n-n0)*cw;

    /* 見出し（月／日／曜日 または 月／週） */
    A.rect(tx0, tyTop, gx1-tx0, hdH, 0.4, '#eef2ec');
    A.text(tx0+2, tyTop+hdH/2+1.2, '工　程', 3,'start','#111',true);
    A.text(tx0+nameW+2, tyTop+hdH/2+1.2, '開始 〜 終了（日数）', 2.7,'start','#111',true);
    A.line(tx0+nameW, tyTop, tx0+nameW, bodyBot, 0.25,'#999');
    A.line(gx0, tyTop, gx0, bodyBot, 0.4);
    /* 月の区切り */
    let mStart=n0, mLab=null;
    for(let n=n0;n<=n1+1;n++){
      const d=dobj(n), key=(n<=n1)?(d.getUTCFullYear()+'年'+(d.getUTCMonth()+1)+'月'):null;
      if(mLab===null){ mLab=key; mStart=n; continue; }
      if(key!==mLab){
        A.text((X(mStart)+X(n))/2, tyTop+4.4, mLab, 3,'middle','#111',true);
        A.line(X(n), tyTop, X(n), bodyBot, 0.35,'#888');
        mLab=key; mStart=n;
      }
    }
    A.line(tx0, tyTop+6, gx1, tyTop+6, 0.25,'#999');
    if(unit==='day'){
      for(let n=n0;n<=n1;n++){
        const d=dobj(n), w=d.getUTCDay(), x=X(n);
        if(w===0||w===6) A.rect(x, tyTop+6, cw, bodyBot-(tyTop+6), 0, w===0?'#fdeeee':'#eef3fb','none');
        if(cw>=2.6){
          A.text(x+cw/2, tyTop+9.4, String(d.getUTCDate()), 2.3,'middle', w===0?'#c03028':w===6?'#2456b8':'#333');
          A.text(x+cw/2, tyTop+11.9, WD[w], 2.1,'middle', w===0?'#c03028':w===6?'#2456b8':'#666');
        }
        if(cw>=1.2) A.line(x, tyTop+6, x, bodyBot, 0.08,'#dde2d8');
      }
    }else{
      for(let n=n0;n<=n1;n++){
        const d=dobj(n);
        if(d.getUTCDay()===1){                      /* 月曜ごとに目盛り */
          A.line(X(n), tyTop+6, X(n), bodyBot, 0.12,'#cfd6c9');
          A.text(X(n)+1, tyTop+9.2, md(n), 2.1,'start','#555');
        }
      }
    }
    A.line(tx0, tyTop+hdH, gx1, tyTop+hdH, 0.4);

    /* --- 行 --- */
    rows.forEach((r,i)=>{
      const y=bodyTop+rowH*i;
      if(r.grp){
        A.rect(tx0, y, gx1-tx0, rowH, 0.25, '#e6ede2');
        A.text(tx0+2, y+rowH/2+1.2, r.name, 3,'start','#1c6b3c',true);
        return;
      }
      A.line(tx0, y+rowH, gx1, y+rowH, 0.15,'#c9d2c4');
      A.text(tx0+3, y+rowH/2+1.1, r.name, 2.9,'start', r.hi?'#b0281c':'#111', true);
      const a=dnum(r.start), b=dnum(r.end), dd=b-a+1;
      A.text(tx0+nameW+2, y+rowH/2+1.1, md(a)+' 〜 '+md(b)+'（'+dd+'日）', 2.5,'start','#444');
      const bx=X(a), bw=Math.max(cw*0.7, dd*cw);
      const col=r.hi ? (r.moto?'#c0392b':'#1e5c3a') : (r.moto?'#9aa6b3':'#3a9e52');
      A.rect(bx+0.3, y+rowH*0.22, bw-0.6, rowH*0.56, 0.2, col, '#33413a', 0.8);
      if(bw>10) A.text(bx+bw/2, y+rowH*0.5+1.1, dd+'日', 2.3,'middle','#fff',true);
    });
    A.rect(tx0, tyTop, gx1-tx0, bodyBot-tyTop, 0.4);

    /* --- 今日の赤い縦線 --- */
    (function(){
      const T=new Date(), tn=Date.UTC(T.getFullYear(),T.getMonth(),T.getDate())/864e5;
      if(tn<n0||tn>n1) return;
      const fr=(T.getHours()*60+T.getMinutes())/1440;
      const x=X(tn)+cw*fr;
      A.line(x, tyTop+6, x, bodyBot, 0.5, '#e02020');
      A.S.push('<path d="M'+A.r2(x-1.6)+' '+A.r2(tyTop+6)+' L'+A.r2(x+1.6)+' '+A.r2(tyTop+6)+
               ' L'+A.r2(x)+' '+A.r2(tyTop+9)+' Z" fill="#e02020"/>');
      A.text(x, tyTop+4.6, '本日 '+md(tn), 2.5,'middle','#e02020',true);
    })();

    /* --- 凡例と備考 --- */
    let ly=bodyBot+6;
    const lg=[['#9aa6b3','元請工程'],['#c0392b','元請工程のうち防水工事'],['#3a9e52','自社工程'],['#1e5c3a','防水施工（本工事）']];
    A.text(tx0, ly+3, '凡例', 3,'start','#111',true);
    let lx=tx0+12;
    lg.forEach(g=>{ A.rect(lx, ly, 7, 3.4, 0.2, g[0], '#33413a', 0.8);
      A.text(lx+9, ly+3, g[1], 2.7,'start','#222'); lx+=9+g[1].length*2.8+8; });
    A.line(lx, ly+1.7, lx+8, ly+1.7, 0.5,'#e02020');
    A.text(lx+10, ly+3, '本日', 2.7,'start','#222');
    ly+=7;
    const memos=rows.filter(r=>!r.grp && r.memo).map(r=>r.name+'：'+r.memo);
    A.text(tx0, ly+3, '備考', 3,'start','#111',true);
    const note = memos.length ? memos.join('　／　')
      : '天候（降雨・降雪・強風）により工程を調整する。防水工事は下地乾燥を確認のうえ着手する。';
    A.text(tx0+12, ly+3, note.length>150?note.slice(0,150)+'…':note, 2.6,'start','#222');
    ly+=5;
    A.text(tx0, ly+3, '※ 本工程表は現時点の予定です。元請工程の変更にあわせて随時更新します。', 2.6,'start','#c01818');

    /* --- 表題欄（下の横帯・図面と同じ形） --- */
    (function(){
      let PLv={}; try{ PLv=JSON.parse(localStorage.getItem('nn_zumen_plan_v1')||'{}'); }catch(e){}
      const x0=ix0+2, x1=ix1-2, y0=iy1-2-tbH, h=tbH;
      A.rect(x0,y0,x1-x0,h,0.5,'#fff');
      const c1=x0+(x1-x0)*0.28, c2=x0+(x1-x0)*0.50;
      A.line(c1,y0,c1,y0+h,0.4); A.line(c2,y0,c2,y0+h,0.4);
      A.text(x0+4, y0+7, '納まりナビ で作成', 2.8,'start','#888');
      A.text(x0+4, y0+15, PLv.author||'株式会社三浦工業', 4.4,'start','#111',true);
      if(p.moto) A.text(x0+4, y0+21.5, '元請：'+p.moto, 2.8,'start','#333');
      A.line(c1,y0+6.5,c2,y0+6.5,0.3);
      A.text(c1+2.5, y0+4.8, '備　考', 2.8,'start','#333',true);
      A.text(c1+2.5, y0+11.5, '現地実測・元請工程にもとづく施工用工程表', 2.6,'start','#222');
      A.text(c1+2.5, y0+16, '工程は天候・元請都合により変更する場合がある', 2.6,'start','#222');
      A.text(c1+2.5, y0+20.5, '赤い縦線＝作成時点の本日', 2.6,'start','#222');
      const w=x1-c2, lw=w*0.16, vw=w*0.34, rh=h/3;
      const rr=[['縮　尺','NTS（尺度なし）','工事名称',p.name||'—'],
                ['作成年月日',new Date().toLocaleDateString('ja-JP'),'場　所',p.addr||'—'],
                ['図面番号',(PLv.no||'A-01')+'-K','図面名称','工程表（バーチャート）']];
      rr.forEach((r,i)=>{
        const yy=y0+rh*i;
        if(i)A.line(c2,yy,x1,yy,0.3);
        A.line(c2+lw,yy,c2+lw,yy+rh,0.3);
        A.line(c2+lw+vw,yy,c2+lw+vw,yy+rh,0.4);
        A.line(c2+lw+vw+lw,yy,c2+lw+vw+lw,yy+rh,0.3);
        A.text(c2+1.5, yy+rh/2+1, r[0], 2.6,'start','#333',true);
        A.text(c2+lw+1.5, yy+rh/2+1, A.fit(r[1],3,vw-3), 3,'start','#111',true);
        A.text(c2+lw+vw+1.5, yy+rh/2+1, r[2], 2.6,'start','#333',true);
        A.text(c2+lw+vw+lw+1.5, yy+rh/2+1, A.fit(r[3],3,x1-(c2+lw+vw+lw)-3), 3,'start','#111',true);
      });
      const bw2=76, bh2=9.5, bxx=ix1-2-bw2, byy=y0-bh2-1.5;
      A.rect(bxx,byy,bw2,bh2,0.5,'#fff');
      A.text(bxx+3, byy+6.8, '工程表　S:NTS', 4.2,'start','#111',true);
    })();

    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+PW+'mm" height="'+PH+'mm" viewBox="0 0 '+PW+' '+PH+'">'
      +'<rect width="'+PW+'" height="'+PH+'" fill="#fff"/>'+A.S.join('')+'</svg>';
    openKoteiSheet(svg, PW, PH, (p.name||'工事')+' 工程表');
  };

  /* ★用紙は必ず「よこ」。size:A3 landscape という書き方は環境によって無視され、
     たて紙に回転して入ってしまう。実寸で書くほうが確実。
     それでもたてになる環境用に「90°回して印刷」も付けている。 */
  function openKoteiSheet(svg, W, H, title){
    const w=window.open('','_blank');
    if(!w){ toast('ポップアップがブロックされました。設定でこのサイトを許可してください'); return; }
    w.document.write('<!doctype html><html lang="ja"><head><meta charset="utf-8">'
      +'<title>'+esc(title)+'</title>'
      +'<style id="pgYoko">@page{size:'+W+'mm '+H+'mm; margin:0;}</style>'
      +'<style id="pgTate">@page{size:'+H+'mm '+W+'mm; margin:0;}</style>'
      +'<style>'
      +'html,body{margin:0;padding:0;background:#f2f2f2;}'
      +'#nnbar2{position:fixed;left:0;right:0;top:0;z-index:9;background:#1c6b3c;color:#fff;'
      +'font:14px/1.6 system-ui,-apple-system,sans-serif;padding:9px 14px;display:flex;gap:10px;'
      +'align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.25);}'
      +'#nnbar2 button{font:inherit;font-weight:800;padding:7px 14px;border:0;border-radius:7px;'
      +'background:#fff;color:#1c6b3c;cursor:pointer;}'
      +'#nnbar2 button.on{background:#ffd34d;color:#5a3a00;}'
      +'#nnbar2 .s{font-size:12px;opacity:.92;}'
      +'#nnwrap2{padding:64px 10px 24px;}'
      +'svg{display:block;margin:0 auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.22);max-width:100%;height:auto;}'
      +'@media print{#nnbar2{display:none!important;} #nnwrap2{padding:0;} body{background:#fff;}'
      +'svg{box-shadow:none;margin:0;max-width:none;width:'+W+'mm;height:'+H+'mm;}'
      +'body.rot svg{position:absolute;left:0;top:0;transform:translateX('+H+'mm) rotate(90deg);transform-origin:0 0;}}'
      +'</style></head><body>'
      +'<div id="nnbar2"><button type="button" onclick="nnDocBack()">← 記録帳に戻る</button>'
      +'<b>この工程表は「よこ（A3横）」で印刷してください</b>'
      +'<button type="button" onclick="print()">🖨 印刷 / PDFに保存</button>'
      +'<button type="button" id="rotBtn2">⟳ 用紙がたてになるとき</button>'
      +'<span class="s">印刷画面で「用紙サイズ：A3」「向き：横」を選ぶと、そのまま入ります。'
      +'選べないときは ⟳ を押してから印刷してください。</span></div>'
      +'<div id="nnwrap2">'+svg+'</div>'
      +'<script>var NN_BACK='+JSON.stringify(location.href)+';'
      +'function nnDocBack(){'
      +'try{window.close();}catch(e){}'
      +'setTimeout(function(){'
      +'if(window.closed)return;'
      +'var did=false;'
      +'try{if(history.length>1){did=true;history.back();}}catch(e){}'
      +'setTimeout(function(){try{location.replace(NN_BACK);}catch(e){}}, did?600:0);'
      +'},250);'
      +'}'
      +'(function(){'
      +'var yo=document.getElementById("pgYoko").sheet, ta=document.getElementById("pgTate").sheet;'
      +'ta.disabled=true; var b=document.getElementById("rotBtn2");'
      +'b.onclick=function(){var on=document.body.classList.toggle("rot");'
      +'yo.disabled=on; ta.disabled=!on; b.classList.toggle("on",on);'
      +'b.textContent=on?"⟳ 90°回して印刷：ON":"⟳ 用紙がたてになるとき";};'
      +'window.onload=function(){setTimeout(function(){window.print();},350);};'
      +'})();<\/script>'
      +'</body></html>');
    w.document.close();
  }
})();
</script>


<style id="nn-defect">
/* ============================================================
   不具合・現場条件タグ（2026-08-06e）
   膨れ・口開き・漏水などの防水の不具合を、物件にタグとして付けて
   一覧カード・物件詳細に表示し、「不具合別」で絞り込めるようにする。
   ・アイコン画像は icons/def_<キー>.png（背景透過PNG・高さ168px・幅は絵なり）。
     置くだけで文字チップの左に絵が出る。無い間は文字だけ（onerrorで自動非表示）。
   ・グループごとに色を分ける：症状=赤／原因=茶／部位の注意=緑／対応・宿題=黄
   ・保存は localStorage('nn_kirokucho_def_v1')＝{物件番号J◯◯◯:[キー,…]}。
     保存が無い物件はサンプル（SAMPLE）を表示する。
   ============================================================ */
.defrow{display:flex; flex-wrap:wrap; gap:4px 5px; margin-top:6px; align-items:center;}
.defrow .dlb{font-size:12px; font-weight:800; color:var(--ink-sub,#5a6b52); white-space:nowrap;}
.defrow .dnone{font-size:12px; color:#999;}
.defchip{display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:999px;

.defchip img{height:15px; width:auto; display:block;}
.defchip.g-sym  {color:#b23b2e; border-color:#c46a5e; background:#fdeeea;}
.defchip.g-cause{color:#7a4a1d; border-color:#a5804f; background:#f6eee2;}
.defchip.g-part {color:#4f6b2e; border-color:#87a05e; background:#f0f4e3;}
.defchip.g-todo {color:#a8730a; border-color:#cfa14a; background:#fdf3d7;}
.defrow .defedit{font-size:12px; font-weight:800;}
/* 編集画面：選ばれていないチップは灰色、タップで色が付く */
#nnDefModal .modal{width:min(640px,94vw);}
#nnDefModal .dnote{font-size:12.5px; color:#666; margin:-6px 0 4px;}
#nnDefModal .dgh{font-size:13px; font-weight:800; color:var(--green-deep,#1c6b3c); margin:12px 0 5px;
  border-left:4px solid var(--green-deep,#1c6b3c); padding-left:7px;}
#nnDefModal .dgrid{display:flex; flex-wrap:wrap; gap:6px;}
#nnDefModal .defchip{cursor:pointer; font-size:13.5px; padding:5px 11px; user-select:none;}
#nnDefModal .defchip:not(.on){color:#888; border-color:#ccc; background:#fafafa;}
#nnDefModal .defchip.on::before{content:'✓ '; font-weight:900;}
/* 絞り込みメニューのグループ見出し */
.dfmenu .dfgh{font-size:11.5px; font-weight:800; color:#888; padding:6px 10px 2px; border-top:1px solid #eee;}
</style>
<script id="nn-defect-js">
/* 不具合・現場条件タグ。上の <style id="nn-defect"> とセット。
   本文側の差し込み7か所（R1〜R7）から window.nnDef◯◯ を呼ぶ。 */
(function(){
"use strict";
const GROUPS={sym:'症状（見つけた不具合）', cause:'原因・環境', part:'部位の注意', todo:'対応・宿題'};
const DEFS=[
 ['fukure','膨れ','sym'],['kuchiaki','口開き','sym'],['tsuppari','突っ張り','sym'],['rosui','漏水','sym'],
 ['choking','チョーキング','sym'],['genmo','減耗','sym'],['sunaochi_geki','砂落ち激しい','sym'],['sunaochi','砂落ち','sym'],
 ['gamahada','ガマ肌','sym'],['pool','プール','sym'],['drain','ドレン詰まり','sym'],['osamari','納まり不良','sym'],
 ['toriai_furyo','取り合い不良','sym'],['tanmatsu','端末不具合','sym'],
 ['shokubutsu','植物繁茂','sym'],
 ['shitaji','下地起因','cause'],['togai','凍害','cause'],
 ['fukuzatsu','複雑形状','part'],['kyosho','狭小部位','part'],['toriai','取り合い発生','part'],
 ['settyaku','要接着試験','todo'],['hikinuki','要引き抜き試験','todo'],
 ['maker','メーカー相談','todo'],['maker_chu','メーカー相談中','todo'],['maker_zumi','メーカー相談済','todo'],
];
const BYKEY={}; DEFS.forEach(d=>BYKEY[d[0]]=d);
const BYLABEL={}; DEFS.forEach(d=>BYLABEL[d[1]]=d[0]);
const KEY='nn_kirokucho_def_v1';
let store={};
try{ store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(_){ store={}; }
function saveStore(){ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(_){}}
/* サンプル（調査済・見積済・施工中・引合いの物件に、ありそうな組み合わせで）
   ★一覧の先頭は完成済が50件並ぶので、最初の画面でもタグが目に入るよう
     完成済の先頭あたりにも「工事前の調査で見つかっていた不具合の記録」として付けてある */
const SAMPLE={
 J002:['fukure','shitaji'],
 J005:['kuchiaki'],
 J006:['choking','shokubutsu'],
 J007:['drain','pool'],
 J008:['sunaochi'],
 J064:['fukure','kuchiaki','drain'],
 J065:['fukure','sunaochi_geki','pool','settyaku'],
 J066:['choking','genmo','rosui','maker_chu'],
 J067:['gamahada','shitaji','hikinuki'],
 J068:['tanmatsu','toriai','fukuzatsu'],
 J057:['kuchiaki','tsuppari','togai','maker_zumi'],
 J069:['shokubutsu','sunaochi','drain'],
 J058:['sunaochi','pool'],
 J060:['tanmatsu','kyosho'],
 J051:['toriai_furyo','osamari'],
 J053:['fukure','drain'],
 J070:['rosui','maker'],
 J072:['rosui','fukure'],
};
/* 各物件に反映（自分で編集した保存があれば保存を優先） */
props.forEach(p=>{ p.defects=(store[p.code]||SAMPLE[p.code]||[]).filter(k=>BYKEY[k]).slice(); });

function chipHTML(k, cls, on){
  const d=BYKEY[k]; if(!d)return '';
  return `<span class="defchip g-${d[2]}${on?' on':''}"${cls||''}><img src="./icons/def_${k}.png" alt="" onerror="this.style.display='none'">${d[1]}</span>`;
}
/* 一覧カード（detail=0）と物件詳細（detail=1）のタグの行 */
window.nnDefRow=function(p,detail){
  const chips=(p.defects||[]).map(k=>chipHTML(k)).join('');
  if(!detail) return chips?`<div class="defrow">${chips}</div>`:'';
  return `<div class="defrow"><span class="dlb">不具合・現場条件：</span>${chips||'<span class="dnone">なし</span>'}
    <button class="icon-mini defedit" onclick="nnDefEdit(${p.id})" title="不具合・現場条件タグを付け外しする">✎ タグを編集</button></div>`;
};

/* ★2026-08-11y 物件詳細の右に「劣化・現場条件」の枠を出す（本人の指示）。
   その物件に付いているタグを、絵（icons/def_<キー>.png）と名前で並べる。
   絵が無いタグは名前だけ出る（onerror で絵を消す）。 */
window.nnDefPanel=function(p){
  const ks=(p.defects||[]);
  const items = ks.length
    ? ks.map(k=>{ const d=BYKEY[k]; if(!d)return '';
        return `<div class="dpitem">
          <span class="dpim"><img src="./icons/def_${k}.png" alt=""
            onerror="this.closest('.dpitem').classList.add('noimg'); this.remove();"></span>
          <span class="defchip g-${d[2]}">${d[1]}</span>
        </div>`; }).join('')
    : '<div class="dpnone">登録なし</div>';
  return `<aside class="nndefpanel"><div class="dpgrid">${items}</div></aside>`;
};

/* ---------- 編集（物件詳細の「✎ タグを編集」） ---------- */
let edId=null;
function ensureModal(){
  if(document.getElementById('nnDefModal'))return;
  const w=document.createElement('div'); w.id='nnDefModal'; w.className='modal-bg';
  w.innerHTML=`<div class="modal"><h3>不具合・現場条件タグ</h3>
    <p class="dnote">当てはまるものをタップして付け外しします（複数OK）。その場で保存されます。</p>
    <div id="nnDefBody"></div>
    <div class="btns"><button class="ok" onclick="nnDefClose()">閉じる</button></div></div>`;
  w.addEventListener('click',e=>{ if(e.target===w)nnDefClose(); });
  document.body.appendChild(w);
}
function paint(){
  const p=props.find(x=>x.id===edId); if(!p)return;
  document.getElementById('nnDefBody').innerHTML=Object.keys(GROUPS).map(g=>
    `<div class="dgh">${GROUPS[g]}</div><div class="dgrid">${
      DEFS.filter(d=>d[2]===g).map(d=>
        `<span class="defchip g-${d[2]}${p.defects.includes(d[0])?' on':''}" onclick="nnDefTgl('${d[0]}')"><img src="./icons/def_${d[0]}.png" alt="" onerror="this.style.display='none'">${d[1]}</span>`
      ).join('')}</div>`).join('');
}
window.nnDefEdit=function(id){ edId=id; ensureModal(); paint(); document.getElementById('nnDefModal').classList.add('open'); };
/* ★2026-08-14g 新規・編集フォームの「🏷 タグを選ぶ」から、一覧・詳細と同じ編集画面を開く。
   新規（まだ保存していない物件）は id が無いので、保存してから選んでもらう。 */
window.nnFormDefEdit=function(){
  if(typeof editId==='undefined' || !editId){ toast('タグは保存したあと、一覧の「✎ タグを編集」から選べます'); return; }
  nnDefEdit(editId);
};
window.nnDefTgl=function(k){
  const p=props.find(x=>x.id===edId); if(!p)return;
  const i=p.defects.indexOf(k); if(i>=0)p.defects.splice(i,1); else p.defects.push(k);
  store[p.code]=p.defects.slice(); saveStore(); paint();
};
window.nnDefClose=function(){
  document.getElementById('nnDefModal').classList.remove('open');
  buildChips(); render();      /* 一覧カード・詳細・絞り込みの件数に反映 */
};

/* ---------- 絞り込み（「不具合別」チップ） ---------- */
const defFil=new Set();
window.nnDefPass=function(p){
  if(!defFil.size)return true;
  const s=p.defects||[]; let hit=false; defFil.forEach(k=>{ if(s.includes(k))hit=true; });
  return hit;                 /* 複数チェック＝どれか1つでも付いていれば表示（他の絞り込みと同じOR方式） */
};
window.nnDefTags=function(t){ defFil.forEach(k=>{ const d=BYKEY[k]; if(d)t.push(['defect','不具合',d[1]]); }); };
window.nnDefDrop=function(label){ const k=BYLABEL[label]; if(k)defFil.delete(k); };
window.nnDefClear=function(){ defFil.clear(); };
window.nnDefChipHTML=function(){
  const counts={}; props.forEach(p=>(p.defects||[]).forEach(k=>counts[k]=(counts[k]||0)+1));
  const rows=Object.keys(GROUPS).map(g=>{
    const items=DEFS.filter(d=>d[2]===g&&counts[d[0]]);
    if(!items.length)return '';
    return `<div class="dfgh">${GROUPS[g]}</div>`+items.map(d=>
      `<label class="dfrow"><input type="checkbox" ${defFil.has(d[0])?'checked':''} onchange="nnDefChk(event,'${d[0]}')"><span class="vn">${d[1]}</span><span class="vc">${counts[d[0]]}件</span></label>`).join('');
  }).join('');
  return `<span class="dfil${lfOpen==='defect'?' open':''}" data-k="defect">
      <button class="stchip ${defFil.size?'on':''}" onpointerdown="lfToggle(event,'defect')" onclick="event.preventDefault();event.stopPropagation();">不具合${defFil.size?`<b>${defFil.size}</b>`:''}<span class="dfbtn-car">▼</span></button>
      <div class="dfmenu${lfOpen==='defect'?' open':''}" onpointerdown="event.stopPropagation()">
        <div class="dfclear" onclick="event.stopPropagation();nnDefClear();buildChips();render();">✕ すべて解除（全件に戻す）</div>
        ${rows}
      </div></span>`;
};
window.nnDefChk=function(e,k){
  if(defFil.has(k))defFil.delete(k); else defFil.add(k);
  buildChips(); render();
  /* 開いたままにする（lfChk と同じ作法） */
  const wrap=document.querySelector('#chips .dfil[data-k="defect"]');
  if(wrap){ wrap.classList.add('open'); lfOpen='defect'; nnShowPortal(wrap.querySelector('.dfmenu'), wrap.querySelector('button'), 0); }
};

/* 初期表示に反映（このスクリプトは本文の初回描画より後に読まれるため、1回描き直す） */
try{ buildChips(); render(); }catch(_){}
})();
</script>
<script id="nn-fil17-js">
/* ★2026-08-17b 「並び替え」チップは絞り込みではないので、いちばん右端へ動かす。
   （不具合チップは nn-defect-js が末尾に足すため、そのあとで並べ直す） */
(function(){
  const orig=window.buildChips;
  if(!orig)return;
  window.buildChips=function(){
    orig.apply(this,arguments);
    const w=document.getElementById('chips'); if(!w)return;
    const pf=w.querySelector('.dfil[data-k="profit"]');
    if(pf) w.appendChild(pf);
  };
  /* ★初回：nn-defect-js が読み込み時に1回描いているので、その分もここで並べ直す */
  window.buildChips();
})();
</script>

<style id="nn-glossbar">
/* ★2026-08-08 進捗・予算のバーを「筒（つつ）状の光沢バー」にする（本人指示）
   ・足りない部分＝黒い筒の中（内側に濃い影を入れて丸みを出す）
   ・満たしている部分＝光沢のある緑。予算のバーと超過しているものは赤。
   ・筒の丸みは、バー全体にかぶせる白いつや（::after）で出している。

   直した場所（現場記録帳の中の「進捗・予算」のバーだけ）
     .prog / .pline .prog … 一覧の「進捗／予算消化」・要対応のミニバー
     .sc-prog .bar        … 施工中の現場（ダッシュボード）の進捗
     .ptrack              … 物件詳細の予実（費目ごとの実績）
     .pace .pt2           … 物件詳細の「工事の進み／予算の減り」
     .houbar              … 工法別の比率

   ★費目の積み上げバー（.cbar）と月別グラフ（.bars2）は触っていない。
     あちらは「色で費目を見分ける」ためのもので、黒＋緑にすると意味が消えるため。 */

/* ---- バー本体（足りない部分＝黒） ----
   ★2026-08-08g パワプロの評価バーと同じ「タッチ」に（本人の指示）。
     ・つやを ぼんやりした重ねもの から、上下ではっきり分かれる二段のつやへ
       （上半分＝明るい／真ん中でスパッと切り替わる／下端に反射のもどり）
     ・まわりに くっきりした濃い輪郭 を入れる
     ・光の広がり（グロー）はやめる。ゲームのバーはにじまない */
.prog,
.pline .prog,
.sc-prog .bar,
.ptrack,
.pace .pt2,
.houbar{
  position:relative !important;
  background:linear-gradient(180deg,
      #454d47 0%, #2a312c 46%,
      #0a0d0a 47%, #030503 88%, #12160f 100%) !important;
  border:1.5px solid #05070a !important;
  border-radius:0 !important;
  overflow:hidden !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),
             inset 0 -1px 0 rgba(255,255,255,.10),
             0 1px 0 rgba(255,255,255,.55);
}

/* ---- 満たしている部分（緑） ----
   inline の background より強くするため !important を付けている。 */
.prog>i,
.pline .prog i,
.sc-prog .bar i,
.ptrack i,
.pace .pt2 i,
.houbar i{
  background:linear-gradient(180deg,
      #d3ffab 0%, #7ee05c 46%,
      #22a63a 47%, #0c6f22 88%, #1b8f2e 100%) !important;
  border-radius:0 !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.18);
}

/* ---- 予算のバー・超過しているものは赤 ---- */
.prog.bud>i,
.pline .prog.bud i,
.ptrack i[style*="f0a99c"],
.pace .pt2 i[style*="f0a99c"],
.pace .pt2 i[style*="ebc98a"]{
  background:linear-gradient(180deg,
      #ffd0bd 0%, #ff8862 46%,
      #e02a1a 47%, #920f11 88%, #b81a15 100%) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.18);
}

/* ---- 上半分のつや（バー全体にかぶせる。真ん中でスパッと切れる） ----
   ★ぼかした白をかぶせるとにじんで見えるので、上半分だけ薄く白を乗せて
     真ん中で切る。パワプロのバーはこの「切れ目」がはっきりしている。 */
.prog::after,
.pline .prog::after,
.sc-prog .bar::after,
.ptrack::after,
.pace .pt2::after,
.houbar::after{
  content:''; position:absolute; left:0; right:0; top:0; height:46%;
  background:linear-gradient(180deg,
      rgba(255,255,255,.30) 0%, rgba(255,255,255,.10) 100%);
  border-radius:0; pointer-events:none; z-index:1;
}

/* ---- 黒い筒の上でも数字が読めるように（白文字＋濃い影） ---- */
.pline .pv,
.houbar b{
  z-index:2;
  color:#fff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.85) !important;
}
/* 予算が進捗を追い越しているとき。赤い筒の上でも黒い筒の上でも目立つ黄色にする
   （赤っぽい色にすると、赤いバーの上で沈んで読めなくなる） */
.pline .pv.ov{ color:#ffdf6b !important; }

/* ---- 予実の「見積」の位置を示す縦線は、黒地でも見えるよう黄色に ---- */
.ptrack u{ background:#ffd76a !important; box-shadow:0 0 0 1px rgba(0,0,0,.55); z-index:2; }

/* ---- 「工事の進み／予算の減り」の%の札はつやの上に ---- */
.pace .pt2 b{ z-index:3; }
</style>

<style id="nn-housort">
/* ★2026-08-08h 工法別 受注・利益：いま何で並べているかを分かるようにする（本人の指示）
   ・見出しの下に「並び順」「バーの比率」を帯で出す
   ・並び替え中の列は、見出しも中身も黄色くして一目で分かるようにする
   ・比率バーは元から「選んだ列の比率」だったが、それが伝わる見出しに変えた */

/* --- 見出しの下の帯 --- */
.housort{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:0 0 7px;
  font-size:11.5px; line-height:1.5;}
.housort .hsl{color:var(--ink-sub); font-weight:800;}

<style id="nn-pczoom">
/* ★2026-08-11a パソコンの「表示の大きさ」をモニターに関わらずそろえる（本人の指示）
   ------------------------------------------------------------------
   同じ拡大100%でも、大きいモニター（横に広い）ほど1画面に入るpxが増えるので、
   文字やボタンが相対的に小さく見える。そこで
     倍率 ＝ 画面の横幅 ÷ 1600px（1.00〜1.60の範囲）
   を html に zoom でかけ、どのモニターでも同じ見え方になるようにした。
   ★スマホ（data-nnphone="1"）は今までどおり。倍率はかけない。
   ★2026-08-11b：手動の倍率ボタンは削除（パソコンはブラウザの拡大縮小が使えるため）。 */
</style>
<script id="nn-pczoom-js">
(function(){
  if(document.documentElement.getAttribute('data-nnphone')==='1'){ window.nnPZ=1; return; }
  var BASE=1600, MINZ=1.00, MAXZ=1.60;
  function autoZ(){
    var z=(window.innerWidth||1600)/BASE;
    z=Math.round(z*20)/20;                       /* 0.05きざみ */
    return Math.min(MAXZ, Math.max(MINZ, z));
  }
  function apply(){
    var z=autoZ();
    window.nnPZ=z;
    document.documentElement.style.zoom = (z===1 ? '' : z);
    document.documentElement.style.setProperty('--nnpzr', z);
    document.documentElement.setAttribute('data-nnpz', z===1 ? 'off' : 'on');
    try{ if(window.nnFillBottom) window.nnFillBottom(); }catch(e){}
    try{ if(window.nnFitMapApp) window.nnFitMapApp(); }catch(e){}
    try{ if(window.nnSecRefresh) window.nnSecRefresh(); }catch(e){}
  }
  apply();
  addEventListener('resize', apply);
})();
</script>

<script id="nn-inline-edit">
/* ============ 一覧カードのその場編集（2026-08-13a） ============
   ・囲み（.ebox）をタップ → その場が入力欄になり、Enter か外タップで確定
   ・状態（.stsel）と工法はプルダウン
   ・確定すると props を直接書き換えて recalcProp → 一覧・集計とも反映
   ・保存の永続化は既存の編集フォームと同じ「ページを開いている間」
   ★カードの「1回目タップ=黄色選択」より先に captureフェーズで受け取り、
     編集のタップがカードの選択・移動として扱われないよう stopPropagation する */
(function(){
'use strict';
/* ---- 既存の状態の選択肢（2026-08-13f） ---- */
window.NN_KIZON=['不明','露出アスファルト防水','押えコンクリート','改質アスファルトシート',
  '塩ビシート防水','ゴムシート防水','ウレタン塗膜防水','FRP防水','金属屋根','モルタル・土間','新設（既存なし）'];
window.NN_KIND=['新築','改修','増改築','部分補修'];
window.NN_KOUZOU=['RC','S','ALC','W','RCS'];

/* ---- 写真：長押しでスマホの写真を取り込む ----
   ★写真はそのままだと保存容量をすぐ超えるので、横640pxのJPEGに縮めてから保存する。
     それでも入りきらない端末があるので、失敗しても画面には出るようにしてある。 */
const PHKEY='nn_kirokucho_photo_v1';
let PH={}; try{ PH=JSON.parse(localStorage.getItem(PHKEY)||'{}'); }catch(_){ PH={}; }
window.nnPhotoOf=p=>PH[p.code]||null;
function savePh(){ try{ localStorage.setItem(PHKEY, JSON.stringify(PH)); return true; }
  catch(_){ return false; } }
function shrink(file, cb){
  const fr=new FileReader();
  fr.onload=()=>{ const im=new Image();
    im.onload=()=>{
      const W=640, sc=Math.min(1, W/im.width);
      const c=document.createElement('canvas');
      c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.75));
    };
    im.onerror=()=>cb(null); im.src=fr.result; };
  fr.onerror=()=>cb(null);
  fr.readAsDataURL(file);
}
/* 写真を大きく見る（＋ボタン） */
window.nnPhotoZoom=function(pid){
  if(event&&event.stopPropagation)event.stopPropagation();
  const p=props.find(x=>x.id===pid); if(!p)return;
  const src=nnPhotoOf(p); if(!src){ toast('この物件にはまだ写真が入っていません'); return; }
  const old=document.getElementById('nnPhotoBig'); if(old)old.remove();
  const ov=document.createElement('div'); ov.id='nnPhotoBig';
  ov.innerHTML='<img src="'+src+'" alt=""><button class="cl" title="閉じる">✕</button>'
    +'<div class="cap">'+String(p.name).replace(/</g,'&lt;')+'</div>';
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',onKey); };
  const onKey=e=>{ if(e.key==='Escape')close(); };
  ov.addEventListener('click',close);
  document.addEventListener('keydown',onKey);
  document.body.appendChild(ov);
};
/* ドラッグ＆ドロップでも写真を入れられる（パソコン向け） */
(function(){
  const find=e=>e.target.closest&&e.target.closest('#list .pcard .pph');
  document.addEventListener('dragover',e=>{
    const t=find(e); if(!t)return;
    e.preventDefault(); t.classList.add('drop');
  });
  document.addEventListener('dragleave',e=>{ const t=find(e); if(t)t.classList.remove('drop'); });
  document.addEventListener('drop',e=>{
    const t=find(e); if(!t)return;
    e.preventDefault(); t.classList.remove('drop');
    const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(!f){ toast('画像ファイルをドラッグしてください'); return; }
    if(!/^image\//.test(f.type)){ toast('画像ファイルではありません'); return; }
    nnPhotoFile(+t.dataset.pid, f);
  });
})();
/* ★label から呼ばれる。ブラウザが開いた選択窓の結果を受け取るだけなので、iPhoneでも確実。 */
window.nnPhotoFile=function(pid, f){
  const p=props.find(x=>x.id===pid); if(!p||!f)return;
  shrink(f,dataUrl=>{
    if(!dataUrl){ toast('この写真は読み込めませんでした'); return; }
    PH[p.code]=dataUrl;
    const ok2=savePh();
    render();
    toast(ok2?'写真を入れました（＋で大きく見られます）'
             :'写真を入れました（保存容量がいっぱいのため、この画面を開いている間だけ有効です）');
  });
};
window.nnPhotoSet=function(pid, inp){
  const f=inp&&inp.files&&inp.files[0]; if(!f)return;
  nnPhotoFile(pid, f); inp.value='';
};
/* 提出書類のボタン */
window.nnDoc=function(pid,kind){
  event&&event.stopPropagation&&event.stopPropagation();
  const p=props.find(x=>x.id===pid); if(!p)return;
  if(kind==='houkoku'){
    if(typeof exportPDF==='function'){ exportPDF(pid); return; }
    toast('物件報告書はこの物件では出せません'); return;
  }
  if(kind==='other'){ selectedId=pid; curTab='保管資料'; showView('list'); openDetailFull(); return; }
  if(kind==='zumen'){ selectedId=pid; curTab='作成図面'; showView('list'); openDetailFull(); return; }
  if(kind==='photos'){ selectedId=pid; curTab='写真'; showView('list'); openDetailFull(); return; }

/* 長押し（0.5秒）で写真を選ぶ。指を動かしたら取り消し。
   ★長押しの直後のタップがカードの選択・移動にならないよう、印を付けて1回だけ止める。 */
(function(){
  let tm=null, el=null, sx=0, sy=0, lpReady=null;
  const cancel=()=>{ clearTimeout(tm); tm=null; if(el)el.classList.remove('lp'); el=null;
    if(lpReady){ lpReady.classList.remove('lp'); lpReady=null; } };
  document.addEventListener('pointerdown',e=>{
    const t=e.target.closest&&e.target.closest('#list .pcard .pph'); if(!t)return;
    const card=t.closest('.pcard'); if(!card)return;

  /* ★2026-08-13k ここで capture の stopPropagation をしてはいけない。

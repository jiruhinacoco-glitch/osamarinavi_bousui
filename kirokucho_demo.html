<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="納まりナビ">
<link rel="stylesheet" href="common.css">
<style>
/* ホーム画面起動（スタンドアロン）時：ステータスバー下への潜り込みを回避 */
header{padding-top:calc(5px + env(safe-area-inset-top)) !important;}
</style>
<title>納まりナビ – 現場記録帳（デモ）</title>
<style>
/* ============================================================
   納まりナビ 現場記録帳 デモ
   ------------------------------------------------------------
   ■ アイコン差し替えについて
   下の ICONS 定義（<script>内の const ICONS）に絵文字/SVGを
   置いています。本番ではここを
     ICONS.home = '<img src="./icons/home.png">'
   のように、佐野さん自作のアイコン画像パスに差し替えるだけです。
   ============================================================ */
:root{
  /* 共通カラーパレットは common.css に移動（--green-deep 等） */
  --profit:#0a6bd6;
  --st-hikiai:#8a63c9; --st-mitsumori:#3d8fd1; --st-chosa:#2aa198;
  --st-juchu:#d1862a; --st-sekou:#d9a520; --st-kansei:#3a9e52;
  --hou-as:#8c2f2f; --hou-x:#1f66c0; --hou-pq:#5c6670; --hou-asi:#a04a20;
  --radius:10px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
}
/* ---------- ヘッダー ---------- */
header{
  background:linear-gradient(135deg,var(--green-deep),var(--green));
  color:#fff; display:flex; align-items:center; gap:14px; padding:10px 18px; flex:none;
}
header .hicon{font-size:22px;}
header h1{font-size:21px; font-weight:800; letter-spacing:.06em;}
header .count{margin-left:auto; font-size:16px; font-weight:700; opacity:.95;}
button.new-btn{
  background:#fff; color:var(--green-deep); border:2px solid #b8e6c9; border-radius:8px;
  font-size:15px; font-weight:800; padding:9px 18px; cursor:pointer; letter-spacing:.05em;
}
button.new-btn:hover{background:#dff5e7;}
/* ---------- 検索・絞り込みバー ---------- */
.toolbar{
  display:flex; align-items:center; gap:10px; padding:8px 18px; background:#dfe3db;
  border-bottom:1px solid var(--line); flex:none; flex-wrap:wrap;
}
.search{flex:0 1 340px; position:relative;}
.search input{
  width:100%; padding:7px 10px 7px 30px; border:1px solid var(--line); border-radius:8px;
  font-size:15px; background:#fff;
}
.search::before{content:"🔍"; position:absolute; left:8px; top:6px; font-size:13px; opacity:.55;}
.chips{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap;}
.chip{position:relative;}
.chip>button{
  background:#3c4440; color:#fff; border:0; border-radius:6px; padding:6px 12px;
  font-size:13.5px; font-weight:700; cursor:pointer; letter-spacing:.03em;
}
.chip>button.active{background:var(--green);}
.chip .menu{
  display:none; position:absolute; top:calc(100% + 4px); right:0; z-index:30;
  background:#fff; border:1px solid var(--line); border-radius:8px; min-width:160px;
  box-shadow:0 6px 18px rgba(0,0,0,.18); max-height:240px; overflow:auto;
}
.chip .menu.open{display:block;}
.chip .menu div{padding:10px 14px; font-size:14.5px; cursor:pointer; white-space:nowrap;}
.chip .menu div:hover{background:var(--green-lite);}
.chip .menu div.sel{background:var(--green); color:#fff;}
/* ---------- 本体2ペイン ---------- */
main{flex:1; display:flex; min-height:0;}
/* 左：物件リスト */
#list{
  flex:0 0 46%; max-width:640px; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px;
}
.pcard{
  background:var(--card); border:1px solid var(--line); border-left:5px solid var(--line);
  border-radius:var(--radius); padding:10px 14px; cursor:pointer; transition:box-shadow .12s;
}
.pcard:hover{box-shadow:0 3px 10px rgba(0,0,0,.10);}
.pcard.sel{border-left-color:var(--green); box-shadow:0 0 0 2px var(--green-lite),0 3px 10px rgba(0,0,0,.10);}
.pcard .row1{display:flex; align-items:baseline; gap:10px;}
.pcard h3{font-size:16.5px; font-weight:800; flex:1; line-height:1.35;}
.pcard .area{font-size:13.5px; color:var(--ink-sub); white-space:nowrap;}
.pcard .roofs{margin:6px 0 4px; display:flex; flex-direction:column; gap:3px;}
.roofline{font-size:13.5px; color:var(--ink-sub); display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center;}
.badge{
  display:inline-block; color:#fff; border-radius:4px; padding:2px 8px; font-size:12px; font-weight:800; letter-spacing:.04em;
}
.b-as{background:var(--hou-as);} .b-x{background:var(--hou-x);}
.b-pq{background:var(--hou-pq);} .b-asi{background:var(--hou-asi);}
.pcard .row3{display:flex; align-items:center; gap:10px; margin-top:5px; font-size:13.5px; color:var(--ink-sub); flex-wrap:wrap;}
.status{border-radius:5px; padding:3px 10px; font-size:12.5px; font-weight:800; color:#fff;}
.pcard .money{margin-left:auto; text-align:right;}
.pcard .money .order{font-size:15px; font-weight:800;}
.pcard .money .profit{font-size:14.5px; font-weight:800; color:var(--profit);}
/* 右：詳細 */
#detail{flex:1; min-width:0; overflow-y:auto; background:#f7f8f5; border-left:1px solid var(--line);}
.dhead{padding:14px 18px 0;}
.dhead .t{display:flex; align-items:baseline; gap:12px;}
.dhead h2{font-size:19px; font-weight:800; flex:1;}
.dhead .meta{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; font-size:14px; color:var(--ink-sub); align-items:center;}
.dhead .meta b{color:var(--ink); font-size:15px;}
.dhead .profit{color:var(--profit); font-weight:800;}
/* タブ */
.tabs{display:flex; gap:2px; margin:12px 18px 0; border-bottom:2px solid var(--line); flex-wrap:wrap;}
.tabs button{
  border:0; background:transparent; padding:10px 18px; font-size:15px; font-weight:700; color:var(--ink-sub);
  cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px;
}
.tabs button.on{color:var(--green-deep); border-bottom-color:var(--green);}
.tabbody{padding:14px 18px 90px;}
/* 概要グリッド */
.g-kpi{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:12px;}
.kpi{background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px;}
.kpi .l{font-size:12.5px; color:var(--ink-sub); font-weight:700;}
.kpi .v{font-size:18px; font-weight:800; margin-top:2px;}
.kpi.hl{border-color:var(--profit); box-shadow:inset 0 0 0 1px var(--profit);}
.kpi.hl .v{color:var(--profit);}
.g-two{display:grid; grid-template-columns:1fr 300px; gap:14px; align-items:start;}
@media(max-width:1100px){.g-two{grid-template-columns:1fr;}}
.panel{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:12px;}
.panel h4{font-size:13px; font-weight:800; color:var(--green-deep); margin-bottom:8px; letter-spacing:.04em;}
.kv{display:grid; grid-template-columns:120px 1fr; gap:6px 10px; font-size:14.5px;}
.kv dt{color:var(--ink-sub); font-weight:700;}
.kv dd{font-weight:600;}
.tantou{background:#8a7a2a; color:#fff; border-radius:4px; padding:2px 9px; font-size:12.5px; font-weight:700; margin-left:6px;}
.rooftbl{width:100%; border-collapse:collapse; font-size:14px;}
.rooftbl th,.rooftbl td{border:1px solid var(--line); padding:7px 9px; text-align:left;}
.rooftbl th{background:var(--green-lite); font-weight:800;}
.kabuse{background:#3c4440; color:#fff; border-radius:4px; padding:2px 8px; font-size:12px; font-weight:700;}
/* ドーナツ */
.donut-wrap{display:flex; gap:12px; align-items:center;}
.legend{font-size:13.5px; display:flex; flex-direction:column; gap:5px;}
.legend .li{display:flex; align-items:center; gap:6px;}
.legend .sw{width:12px; height:12px; border-radius:3px; flex:none;}
/* 写真・資料 placeholder */
.ph-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px;}
.ph{aspect-ratio:4/3; background:#e4e7e0; border:1px dashed #b9c0b5; border-radius:8px;
  display:flex; align-items:center; justify-content:center; font-size:26px; color:#93a09a;}
.hint{font-size:13.5px; color:var(--ink-sub); margin-top:10px; line-height:1.7;}
/* 人工テーブル */
.jin-tbl{width:100%; border-collapse:collapse; font-size:14.5px;}
.jin-tbl th,.jin-tbl td{border:1px solid var(--line); padding:8px 10px;}
.jin-tbl th{background:var(--green-lite); font-weight:800;}
.jin-tbl td.num{text-align:right; font-variant-numeric:tabular-nums;}
.jin-tbl tfoot td{font-weight:800; background:#f2f4ef;}
.addrow{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;}
.addrow input{padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:15px;}
.addrow input.dt{width:130px;} .addrow input.n{width:80px;} .addrow input.m{flex:1; min-width:140px;}
.addrow button{background:var(--green); color:#fff; border:0; border-radius:6px; padding:10px 18px; font-weight:800; cursor:pointer;}
/* 工程バー */
.gantt{display:flex; flex-direction:column; gap:8px;}
.gr{display:grid; grid-template-columns:130px 1fr; gap:8px; align-items:center; font-size:12.5px;}
.gbar{height:18px; border-radius:5px; background:var(--green-lite); position:relative; overflow:hidden;}
.gbar>i{position:absolute; top:0; bottom:0; border-radius:5px; background:var(--green);}
/* エクスポート */
.exp-btns{display:flex; gap:10px; flex-wrap:wrap;}
.exp-btns button{background:#fff; border:2px solid var(--green); color:var(--green-deep);
  border-radius:8px; padding:10px 18px; font-size:14px; font-weight:800; cursor:pointer;}
.exp-btns button:hover{background:var(--green-lite);}
/* 下部ナビ */
nav{
  flex:none; background:#202623; display:flex; gap:4px; padding:6px 8px; overflow-x:auto;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
}
nav .ni{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfd6d1;
  font-size:12px; font-weight:700; padding:5px 13px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
nav .ni .ic{font-size:23px; line-height:1;}
nav .ni:hover{background:#333b37;}
nav .ni.on{background:var(--green); color:#fff;}
/* --- モバイル対応：ナビのあふれスクロール・縮小・セーフエリア --- */
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
nav::-webkit-scrollbar{display:none;}
@media(max-width:700px){
  nav .ni{padding:4px 8px; font-size:10px; gap:1px;}
  nav .ni .ic{font-size:19px;}
}

/* モーダル */
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100;}
.modal-bg.open{display:flex;}
.modal{background:#fff; border-radius:12px; width:min(520px,92vw); padding:20px 22px; max-height:88vh; overflow:auto;}
.modal h3{font-size:16px; font-weight:800; color:var(--green-deep); margin-bottom:14px;}
.modal label{display:block; font-size:14px; font-weight:700; color:var(--ink-sub); margin:10px 0 3px;}
.modal input,.modal select{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:7px; font-size:16px;}
.modal .btns{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
.modal .btns .cancel{background:#eee; border:0; border-radius:7px; padding:9px 16px; font-weight:700; cursor:pointer;}
.modal .btns .ok{background:var(--green); color:#fff; border:0; border-radius:7px; padding:9px 20px; font-weight:800; cursor:pointer;}
.empty{padding:40px 20px; text-align:center; color:var(--ink-sub); font-size:14px;}
/* 追加工事 */
.ex-tbl{width:100%; border-collapse:collapse; font-size:14px; margin-bottom:12px;}
.ex-tbl th,.ex-tbl td{border:1px solid var(--line); padding:8px 10px;}
.ex-tbl th{background:#fdeee0; font-weight:800; color:#8a4a12;}
.ex-tbl td.num{text-align:right; font-variant-numeric:tabular-nums;}
.ex-status{display:inline-block; border-radius:5px; padding:3px 10px; font-size:12px; font-weight:800; color:#fff; white-space:nowrap;}
.exs-hassei{background:#8a8f88;} .exs-nemawashi{background:#3d8fd1;} .exs-koushou{background:#d9a520;}
.exs-kaishu{background:#3a9e52;} .exs-fuseiritsu{background:#b0392f;}
.ex-summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-bottom:14px;}
.ex-sum-card{border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff;}
.ex-sum-card .l{font-size:11px; color:var(--ink-sub); font-weight:700;}
.ex-sum-card .v{font-size:15px; font-weight:800; margin-top:2px;}
.ex-sum-card.warn{border-color:#d9a520; background:#fffaf0;} .ex-sum-card.warn .v{color:#a06a00;}
.ex-sum-card.good{border-color:#3a9e52; background:#f3fbf5;} .ex-sum-card.good .v{color:#1e7a3a;}
.ex-sum-card.risk{border-color:#b0392f; background:#fdf2f1;} .ex-sum-card.risk .v{color:#a02a20;}
.kpi.warn2{border-color:#d9a520; box-shadow:inset 0 0 0 1px #d9a520;} .kpi.warn2 .v{color:#a06a00;}
/* リストカードの追加工事フラグ */
.exflag{display:inline-flex; align-items:center; gap:3px; background:#fdeee0; color:#8a4a12; border:1px solid #e8c090;
  border-radius:5px; padding:2px 9px; font-size:12px; font-weight:800;}
/* ---------- ダッシュボード ---------- */
#dashboard{flex:1; overflow-y:auto; padding:10px 14px 90px; display:none;}
.dash-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:10px;}
.dk{background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 12px;}
.dk .l{font-size:12px; color:var(--ink-sub); font-weight:700;}
.dk .v{font-size:19px; font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums;}
.dk .s{font-size:12px; color:var(--ink-sub); margin-top:2px;}
.dk.green{border-color:var(--green); background:#f3faf5;} .dk.green .v{color:var(--green-deep);}
.dk.blue .v{color:var(--profit);}
.dk.warn{border-color:#d9a520; background:#fffaf0;} .dk.warn .v{color:#a06a00;}
.dash-grid{display:grid; grid-template-columns:1.15fr 1fr; gap:10px;}
@media(max-width:1150px){.dash-grid{grid-template-columns:1fr;}}
.dpanel{background:#fff; border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:10px;}
.dpanel h4{font-size:13.5px; font-weight:800; color:var(--green-deep); margin-bottom:10px; letter-spacing:.04em; display:flex; align-items:center; gap:8px;}
.dpanel h4 .cta{margin-left:auto; font-size:11.5px; color:var(--profit); cursor:pointer; font-weight:700;}
.mini-tbl{width:100%; border-collapse:collapse; font-size:14px;}
.mini-tbl th,.mini-tbl td{border-bottom:1px solid var(--line); padding:8px 9px; text-align:left;}
.mini-tbl th{font-size:11px; color:var(--ink-sub); font-weight:800; background:transparent;}
.mini-tbl td.num{text-align:right; font-variant-numeric:tabular-nums;}
.mini-tbl tr.click{cursor:pointer;}
.mini-tbl tr.click:hover td{background:var(--green-lite);}
.alert-row{display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid #e8c090; background:#fffaf3;
  border-radius:8px; margin-bottom:8px; cursor:pointer; font-size:12.5px;}
.alert-row:hover{background:#fdeee0;}
.alert-row .amt{margin-left:auto; font-weight:800; color:#a06a00; white-space:nowrap;}
.alert-row .nm{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bars{display:flex; align-items:flex-end; gap:10px; height:120px; padding:4px 2px 0;}
.bars .bcol{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0;}
.bars .bar{width:70%; background:linear-gradient(180deg,var(--green),#1e5c3a); border-radius:4px 4px 0 0;}
.bars .bl{font-size:10.5px; color:var(--ink-sub); white-space:nowrap;}
.bars .bv{font-size:10px; font-weight:800; color:var(--green-deep); white-space:nowrap;}
.go-list-btn{display:block; width:100%; text-align:center; background:var(--green); color:#fff; border:0;
  border-radius:10px; padding:13px; font-size:15px; font-weight:800; cursor:pointer; letter-spacing:.05em; margin-top:4px;}
.go-list-btn:hover{background:var(--green-deep);}
.back-dash{background:#3c4440; color:#fff; border:0; border-radius:6px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer;}
.back-dash:hover{background:var(--green-deep);}
/* ドロップゾーン */
.dropzone{
  border:2px dashed #9db8a6; border-radius:10px; background:#f2f8f4; padding:22px 14px;
  text-align:center; color:#4a6b57; font-size:13.5px; font-weight:700; margin-bottom:12px; transition:background .12s,border-color .12s;
}
.dropzone.over{background:#dff2e6; border-color:var(--green);}
.dropzone small{display:block; font-weight:500; color:var(--ink-sub); margin-top:4px;}
.dropzone .pick{color:var(--green-deep); text-decoration:underline; cursor:pointer;}
/* 写真サムネイル */
.ph-grid .thumb{aspect-ratio:4/3; border-radius:8px; overflow:hidden; border:1px solid var(--line); position:relative; cursor:pointer; background:#000;}
.ph-grid .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.ph-grid .thumb .nm{position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); color:#fff; font-size:10.5px; padding:2px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
/* 資料リスト */
.doc-list{display:flex; flex-direction:column; gap:8px;}
.doc{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 12px;}
.doc .dic{font-size:20px;}
.doc .nm{flex:1; font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.doc .sz{font-size:11.5px; color:var(--ink-sub); white-space:nowrap;}
.doc button{background:var(--green-lite); border:1px solid var(--green); color:var(--green-deep); border-radius:6px; padding:5px 12px; font-size:12px; font-weight:800; cursor:pointer;}
/* トースト */
#toast{position:fixed; left:50%; bottom:78px; transform:translateX(-50%) translateY(20px); background:#1e2a24; color:#fff;
  padding:10px 18px; border-radius:9px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:all .25s; z-index:200; max-width:86vw;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
/* ---------- モバイル対応（900px以下） ---------- */
.back-list{display:none;}
@media(max-width:900px){
  header{padding:10px 12px; gap:10px; flex-wrap:wrap;}
  header h1{font-size:18px;}
  header .count{font-size:13px;}
  button.new-btn{font-size:13.5px; padding:8px 12px;}
  .toolbar{padding:8px 10px;}
  .search{flex:1 1 100%;}
  .chips{margin-left:0; width:100%;}
  #list{flex:1 1 100%; max-width:none; padding:10px;}
  #mainview.show-detail #list{display:none;}
  #mainview:not(.show-detail) #detail{display:none;}
  #detail{border-left:0;}
  .back-list{display:inline-block; background:#3c4440; color:#fff; border:0; border-radius:7px;
    padding:9px 16px; font-size:14.5px; font-weight:700; cursor:pointer; margin-bottom:10px;}
  .dhead{padding:12px 12px 0;}
  .tabbody{padding:12px 12px 90px;}
  .tabs{margin:12px 12px 0; overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs button{white-space:nowrap; padding:10px 13px; font-size:14px;}
  .rooftbl,.jin-tbl,.ex-tbl{display:block; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch;}
  .addrow input,.addrow select,.addrow button{flex:1 1 100%; width:100%;}
  .addrow input.dt,.addrow input.n,.addrow input.m{width:100%; flex:1 1 100%;}
  .search input,.addrow input,.addrow select{font-size:16px;} /* iOSの自動ズーム防止 */
  .dash-kpis{grid-template-columns:repeat(2,1fr); gap:8px;}
  .dk{padding:10px 12px;} .dk .v{font-size:20px;}
  #dashboard{padding:12px 10px 90px;}
  .g-kpi{grid-template-columns:repeat(2,1fr);}
  .g-two{grid-template-columns:1fr;}
  .donut-wrap{flex-wrap:wrap;}
  .alert-row{flex-wrap:wrap;}
  .alert-row .nm{white-space:normal; flex:1 1 100%;}
  .pcard .money{margin-left:0; text-align:left; flex:1 1 100%;}

}

  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.8);}
}
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;

  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .3s ease-out forwards;
}
.tapfx::after{

}

/* ---------- 添付ファイル（写真・保管資料・図面） ---------- */
props.forEach(p=>p.files=[]);
props.forEach(p=>{p.kind = p.name.includes('新築') ? '新築' : '改修';});
const MAKER={'改質アス':'田島','熱アス':'田島','ウレタン塗膜':'ディック','超速硬化型ウレタン':'ディック','塩ビシート':'アーキヤマデ','他防水':'—'};
props.forEach(p=>{p.maker=MAKER[p.hou]||'—';});
const PROG={1:[33,'2026/9/12'], 8:[10,'2026/8/1'], 13:[82,'2026/8/8']};
props.forEach(p=>{if(PROG[p.id]){p.prog=PROG[p.id][0]; p.yotei=PROG[p.id][1];}});
function catOf(name){
  const e=name.split('.').pop().toLowerCase();
  if(['jpg','jpeg','png','gif','webp','heic','bmp'].includes(e))return'photo';
  if(['dwg','jww','dxf'].includes(e))return'zumen';
  return'doc'; // pdf/xlsx/docx/その他 → 保管資料
}
const CAT_LABEL={photo:'写真',zumen:'作成図面',doc:'保管資料'};
function docIcon(name){
  const e=name.split('.').pop().toLowerCase();
  if(e==='pdf')return'📕'; if(['xlsx','xls','csv'].includes(e))return'📊';
  if(['dwg','jww','dxf'].includes(e))return'📐'; if(['doc','docx'].includes(e))return'📘'; return'📄';
}
function toast(msg){const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2600);}
function handleFiles(pid, fileList){
  const p=props.find(x=>x.id===pid); if(!p)return;
  const summary={photo:0,doc:0,zumen:0};
  [...fileList].forEach(f=>{
    const cat=catOf(f.name);
    const rec={name:f.name, size:f.size, cat, url:URL.createObjectURL(f), date:new Date().toLocaleDateString('ja-JP')};
    p.files.push(rec); summary[cat]++;
  });
  const parts=Object.entries(summary).filter(([k,v])=>v>0).map(([k,v])=>`${CAT_LABEL[k]}へ${v}件`);
  toast('自動振り分けしました → '+parts.join('／'));
  renderDetail();
}
function wireDrop(el, pid){
  el.addEventListener('dragover',e=>{e.preventDefault(); el.classList.add('over');});
  el.addEventListener('dragleave',()=>el.classList.remove('over'));
  el.addEventListener('drop',e=>{e.preventDefault(); el.classList.remove('over'); if(e.dataTransfer.files.length)handleFiles(pid,e.dataTransfer.files);});
}
function pickFiles(pid){
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true;
  inp.onchange=()=>handleFiles(pid,inp.files); inp.click();
}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';}

/* ---------- 絞り込みチップ ---------- */
const FILTERS=[
 {key:'year',label:'年度別',opts:p=>[...new Set(props.map(x=>x.date.slice(0,4)))].sort().reverse(),test:(p,v)=>p.date.startsWith(v)},
 {key:'moto',label:'元請別',opts:p=>[...new Set(props.map(x=>x.moto))],test:(p,v)=>p.moto===v},
 {key:'st',label:'ステータス別',opts:p=>['引合いあり','見積済','調査済','受注済','施工中','完成済'],test:(p,v)=>p.status===v},
 {key:'hou',label:'防水種別',opts:p=>['熱アス','改質アス','ウレタン塗膜','超速硬化型ウレタン','塩ビシート','他防水'],test:(p,v)=>p.hou===v},
 {key:'profit',label:'利益別',opts:p=>['利益額が大きい順','利益率が高い順'],test:()=>true},
 {key:'area',label:'地域別',opts:p=>[...new Set(props.map(x=>x.addr.match(/^[^市]+市|^[^町]+町/)?.[0]||'その他'))],test:(p,v)=>p.addr.startsWith(v)},
];
const filterState={};

function buildChips(){
  const wrap=document.getElementById('chips'); wrap.innerHTML='';
  FILTERS.forEach(f=>{
    const c=document.createElement('div'); c.className='chip';
    const b=document.createElement('button'); b.textContent=f.label;
    const m=document.createElement('div'); m.className='menu';
    b.onclick=e=>{e.stopPropagation(); document.querySelectorAll('.menu').forEach(x=>{if(x!==m)x.classList.remove('open');}); m.classList.toggle('open');};
    c.append(b,m); wrap.append(c);
    f._btn=b; f._menu=m;
    rebuildMenu(f);
  });
  document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open')));
}
function rebuildMenu(f){
  const m=f._menu; m.innerHTML='';
  const clear=document.createElement('div'); clear.textContent='（解除）';
  clear.onclick=()=>{delete filterState[f.key]; f._btn.classList.remove('active'); render();};
  m.append(clear);
  f.opts().forEach(v=>{
    const d=document.createElement('div'); d.textContent=v;
    if(filterState[f.key]===v)d.classList.add('sel');
    d.onclick=()=>{filterState[f.key]=v; f._btn.classList.add('active'); rebuildMenu(f); render();};
    m.append(d);
  });
}

/* ---------- ユーティリティ ---------- */
const yen=n=>n?('¥'+n.toLocaleString('ja-JP')+'-'):'—';
const profitOf=p=>{const c=p.mat+p.jin+p.keihi+p.other; return p.order? p.order-c : null;};
const profitRate=p=>{const pr=profitOf(p); return (pr!=null&&p.order&&(p.mat+p.jin+p.keihi+p.other)>0)? (pr/p.order*100):null;};
const EX_ST_CLS={'発生':'exs-hassei','打診中':'exs-nemawashi','交渉中':'exs-koushou','回収済み':'exs-kaishu','不成立':'exs-fuseiritsu'};
const exPending=p=>(p.extras||[]).filter(e=>e.status==='発生'||e.status==='打診中'||e.status==='交渉中').reduce((s,e)=>s+(e.amt||0),0);
const exCollected=p=>(p.extras||[]).filter(e=>e.status==='回収済み').reduce((s,e)=>s+(e.amt||0),0);
const exOpenCount=p=>(p.extras||[]).filter(e=>e.status!=='回収済み'&&e.status!=='不成立').length;

/* ---------- リスト描画 ---------- */
let selectedId=props[0].id;
function filtered(){
  const q=document.getElementById('q').value.trim();
  let arr=props.filter(p=>{
    if(q && !(p.name.includes(q)||p.addr.includes(q)))return false;
    for(const f of FILTERS){const v=filterState[f.key]; if(v && f.key!=='profit' && !f.test(p,v))return false;}
    return true;
  });
  const pf=filterState['profit'];
  if(pf==='利益額が大きい順')arr=[...arr].sort((a,b)=>(profitOf(b)??-1)-(profitOf(a)??-1));
  if(pf==='利益率が高い順')arr=[...arr].sort((a,b)=>(profitRate(b)??-1)-(profitRate(a)??-1));
  return arr;
}
function render(){
  const arr=filtered();
  document.getElementById('cnt').textContent=props.length;
  const list=document.getElementById('list'); list.innerHTML='';
  if(!arr.length){list.innerHTML='<div class="empty">該当する物件がありません。検索条件を変えてみてください。</div>';}
  arr.forEach(p=>{
    const pr=profitOf(p);
    const el=document.createElement('div');
    el.className='pcard'+(p.id===selectedId?' sel':'');
    el.onclick=()=>{selectedId=p.id; render(); if(isMobile())document.getElementById('mainview').classList.add('show-detail');};
    el.innerHTML=`
      <div class="row1"><h3>${p.name}</h3><span class="area">総面積：${p.roofs.reduce((s,r)=>s+r.hiraba+r.tachi+r.yaku,0).toLocaleString()}㎡</span></div>
      <div class="roofs">${p.roofs.map(r=>`
        <div class="roofline"><b>${r.n}</b>：平場 ${r.hiraba}㎡ <span class="badge ${badgeCls(r.hCode)}">${r.hCode}</span>
        　立上り＋天端：${r.tachi}㎡ <span class="badge ${badgeCls(r.tCode)}">${r.tCode}</span>
        ${r.yaku?`　役物：${r.yaku}㎡ <span class="badge ${badgeCls(r.yCode)}">${r.yCode}</span>`:''}</div>`).join('')}
      </div>

/* ---------- ドーナツチャート（SVG） ---------- */
function donut(p){
  const pr=profitOf(p);
  const items=[
    ['材料費',p.mat,'#3a9e52'],['人件費',p.jin,'#e07b2a'],['諸経費',p.keihi,'#7a5cc9'],['その他',p.other,'#c9a63c'],
    ['利益',Math.max(pr??0,0),'#2456b8']
  ].filter(x=>x[1]>0);
  const total=items.reduce((s,x)=>s+x[1],0);
  if(!total)return '<p class="hint">受注金額・コストが未入力のため、構成グラフはまだ表示できません。</p>';
  let acc=0; const R=52, C=2*Math.PI*R;
  const segs=items.map(x=>{
    const frac=x[1]/total, off=C*acc; acc+=frac;
    return `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${x[2]}" stroke-width="26"
      stroke-dasharray="${C*frac} ${C-C*frac}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
  }).join('');
  return `<div class="donut-wrap">
    <svg width="140" height="140" viewBox="0 0 140 140">${segs}
      <text x="70" y="66" text-anchor="middle" font-size="12" font-weight="800" fill="#222">利益率</text>
      <text x="70" y="82" text-anchor="middle" font-size="14" font-weight="800" fill="#2456b8">${profitRate(p)!=null?profitRate(p).toFixed(1)+'%':'—'}</text>
    </svg>
    <div class="legend">${items.map(x=>`<div class="li"><span class="sw" style="background:${x[2]}"></span>${x[0]}　¥${x[1].toLocaleString()}-</div>`).join('')}</div>
  </div>`;
}

/* ---------- 工程ガント：ヘルパー ---------- */
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d); x.setDate(x.getDate()+n); return x;};
function ensureGantt(p){
  if(p.gantt)return;
  const base=(p.genba&&!p.genba.includes('予定'))?new Date(p.genba):new Date();
  const end=p.yotei?new Date(p.yotei):addD(base,45);
  const s0=addD(base,-14); const total=Math.max(20,(end-s0)/864e5);
  const defs=[['現調・見積',0,0.12],['材料手配',0.08,0.24],['下地処理・撤去',0.22,0.40],['防水施工',0.38,0.86],['検査・引渡し',0.86,1.0]];
  p.gantt=defs.map(([n,a,b])=>({name:n,start:isoD(addD(s0,Math.round(total*a))),end:isoD(addD(s0,Math.round(total*b)))}));
}
function gUpd(pid,idx,k,v){const p=props.find(x=>x.id===pid); p.gantt[idx][k]=v; if(typeof saveSched==='function')saveSched(); renderDetail();}
function gDel(pid,idx){const p=props.find(x=>x.id===pid); p.gantt.splice(idx,1); if(typeof saveSched==='function')saveSched(); renderDetail();}
function gAdd(pid){const p=props.find(x=>x.id===pid);
  const n=document.getElementById('g_n').value.trim(), s1=document.getElementById('g_s').value, e1=document.getElementById('g_e').value;
  if(!n||!s1||!e1){alert('工程名・開始日・終了日を入力してください');return;}
  p.gantt.push({name:n,start:s1,end:e1,memo:''}); if(typeof saveSched==='function')saveSched(); toast('工程を追加しました：'+n); renderDetail();}
function exportAll(pid){exportCSV(pid); exportPDF(pid);}

/* 天気リンク先（tenki.jp）：過去日はその日の実況天気ページ、本日以降は2週間天気ページ */
const WX_SRC={
 '札幌':{fc:'https://tenki.jp/forecast/1/2/1400/1100/10days.html',
         past:(y,m,d)=>`https://tenki.jp/past/${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}/weather/1/2/47412/`,
         label:'札幌'},
 '東京':{fc:'https://tenki.jp/forecast/3/16/4410/13101/10days.html',
         past:(y,m,d)=>`https://tenki.jp/past/${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}/weather/3/16/47662/`,
         label:'東京（大手町）'}
};
const wxCity=p=>(p.addr.startsWith('東京')||p.addr.startsWith('神奈川'))?'東京':'札幌';
function wxUrl(city,dt){
  const t0=new Date(); t0.setHours(0,0,0,0);
  const d=new Date(dt); d.setHours(0,0,0,0);
  return d<t0 ? WX_SRC[city].past(d.getFullYear(),d.getMonth()+1,d.getDate()) : WX_SRC[city].fc;
}
/* 日別の天気（日付＋都市から生成する表示用データ。過去=実況、本日〜13日後=予報、それ以降=なし） */
const WX_ICONS=[['☀️',0],['🌤️',10],['⛅',30],['☁️',40],['🌦️',60],['🌧️',80]];
const WX_MB={'札幌':[0,1,5,11,17,21,25,26,22,16,9,2],'東京':[10,11,14,19,23,26,31,33,29,23,18,13]};
function wxHash(s){let h=7;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}
function wxOf(city,dt){
  const t0=new Date(); t0.setHours(0,0,0,0);
  const d=new Date(dt); d.setHours(0,0,0,0);
  const diff=Math.round((d-t0)/864e5);
  if(diff>13)return null;
  const h=wxHash(city+isoD(d));
  const [ic,p0]=WX_ICONS[h%WX_ICONS.length];
  const base=WX_MB[city][d.getMonth()];
  const hi=base+((h>>3)%5)-1, lo=hi-7-((h>>5)%3);
  return {i:ic,p:Math.min(90,p0+((h>>7)%2)*10),h:hi,l:lo,past:diff<0};
}

/* 元請（総合工程表）の初期データを自社の防水施工日程から生成 */
function ensureMotoGantt(p){
  if(p.motoGantt)return;
  ensureGantt(p);
  const b=p.gantt.find(r=>r.name==='防水施工')||p.gantt[Math.min(3,p.gantt.length-1)];
  const S=new Date(b.start), E=new Date(b.end);
  const R=(n,base1,off1,base2,off2)=>({name:n,start:isoD(addD(base1,off1)),end:isoD(addD(base2,off2)),memo:''});
  p.motoGantt = p.kind==='新築' ? [
    R('躯体工事',S,-55,S,-12),
    R('設備基礎工事',S,-18,S,-4),
    R('防水工事',S,0,E,0),
    R('断熱・保護コンクリート',E,-2,E,12),
    R('外装仕上工事',E,6,E,26),
    R('設備工事',E,10,E,30),
    R('検査・引渡し',E,28,E,34),
  ] : [
    R('足場仮設工事',S,-38,S,-24),
    R('補修工事',S,-26,S,-8),
    R('シーリング工事',S,-12,S,2),
    R('外壁塗装工事',S,-4,S,14),
    R('付帯塗装工事',S,10,E,-6),
    R('防水工事',S,0,E,0),
    R('設備工事',E,-4,E,10),
  ];
}
const isBousuiRow=n=>(n||'').includes('防水');

/* 工程データの保存・復元（このブラウザに自動保存。編集内容はいつでも見返せます） */
const SCHED_KEY='nn_kirokucho_sched_v2';
function saveSched(){
  try{
    const o={};
    props.forEach(p=>{ if(p.gantt||p.motoGantt) o[p.id]={g:p.gantt||null,m:p.motoGantt||null}; });
    localStorage.setItem(SCHED_KEY,JSON.stringify(o));
  }catch(e){}
}
function loadSched(){
  try{
    const o=JSON.parse(localStorage.getItem(SCHED_KEY)||'{}');
    props.forEach(p=>{ const s=o[p.id]; if(s){ if(s.g)p.gantt=s.g; if(s.m)p.motoGantt=s.m; } });
  }catch(e){}
}
loadSched();

/* ガント描画（全行編集可：工程名・開始・終了・メモ・追加・削除） */
function schedGantt(rows,opts){
  opts=opts||{};
  let min=null,max=null;
  rows.forEach(r=>{const a=new Date(r.start),b2=new Date(r.end); if(!min||a<min)min=a; if(!max||b2>max)max=b2;});
  if(!min){min=new Date(); max=addD(min,30);}
  min=addD(min,-2); max=addD(max,2);
  const days=[]; for(let t=new Date(min); t<=max && days.length<170; t=addD(t,1)) days.push(new Date(t));
  const todayIso=isoD(new Date());
  const wd=['日','月','火','水','木','金','土'];
  const monthCells=[]; let cur=null,cnt=0;
  days.forEach(dt=>{const key=dt.getFullYear()+'年'+(dt.getMonth()+1)+'月'; if(key!==cur){if(cur)monthCells.push([cur,cnt]); cur=key; cnt=1;}else cnt++;});
  monthCells.push([cur,cnt]);
  const L=opts.listKey, pid=opts.pid;
  const wxSrc=opts.city?WX_SRC[opts.city]:null;
  const wxRow=wxSrc?`<tr class="hd-wx">
      <th class="gname" style="font-size:12px; font-weight:800;">
        天気（${WX_SRC[opts.city].label}）
        <div style="font-size:10.5px; font-weight:700; color:var(--ink-sub);">過去＝実況／本日から2週間＝予報。<br>クリックでその日の天気ページへ（tenki.jp）</div>
      </th>
      ${days.map(dt=>{const w=wxOf(opts.city,dt); const iso=isoD(dt);
        if(!w)return `<th class="wxc na" title="2週間より先の予報はまだ提供されていません">—</th>`;
        const url=wxUrl(opts.city,dt);
        const tip=w.past
          ? `${dt.getMonth()+1}/${dt.getDate()}の実況天気（tenki.jp）を開く｜最高${w.h}℃／最低${w.l}℃／降水${w.p}%`
          : `2週間天気（tenki.jp）を開く｜${dt.getMonth()+1}/${dt.getDate()} 予報：最高${w.h}℃／最低${w.l}℃／降水${w.p}%`;
        return `<th class="wxc ${w.p>=60?'rain':''} ${w.past?'past':''} ${iso===todayIso?'gtoday':''}" title="${tip}">
          <a href="${url}" target="_blank" rel="noopener">${w.i}<span class="pp">${w.p}%</span></a></th>`;}).join('')}
    </tr>`:'';
  return `<div class="gwrap sched ${schedZoom==='wide'?'zoom-wide':''}"><table class="gtbl">
    <thead>
      <tr><th class="gname">${opts.head||'工程／開始・終了'}</th>${monthCells.map(m=>`<th colspan="${m[1]}">${m[0]}</th>`).join('')}</tr>
      <tr class="hd-day"><th class="gname"></th>${days.map(dt=>{const iso=isoD(dt);const w=dt.getDay();return `<th class="${w===6?'sat':w===0?'sun':''} ${iso===todayIso?'gtoday':''}">${dt.getDate()}</th>`;}).join('')}</tr>
      <tr class="hd-wd"><th class="gname"></th>${days.map(dt=>{const iso=isoD(dt);const w=dt.getDay();return `<th class="${w===6?'sat wd-sat':w===0?'sun wd-sun':''} ${iso===todayIso?'gtoday':''}">${wd[w]}</th>`;}).join('')}</tr>
      ${wxRow}
    </thead><tbody>
    ${rows.map((r,idx)=>{
      const red=opts.moto&&isBousuiRow(r.name);
      return `<tr>
      <td class="gname" draggable="true" ondragstart="gDS(${pid},'${L}',${idx})" ondragover="event.preventDefault()" ondrop="gDR(${pid},'${L}',${idx})">
        <div class="grow-edit">
          <input type="text" class="gname-in ${red?'rowlbl-red':''}" value="${(r.name||'').replace(/"/g,'&quot;')}"
            onchange="gUpdS(${pid},'${L}',${idx},'name',this.value)">
          <span class="del" onclick="gDelS(${pid},'${L}',${idx})" title="この工程を削除">✕</span>
        </div>
        <div class="grow-edit" style="margin-top:3px">
          <input type="date" value="${r.start}" onchange="gUpdS(${pid},'${L}',${idx},'start',this.value)">
          <input type="date" value="${r.end}" onchange="gUpdS(${pid},'${L}',${idx},'end',this.value)">
        </div></td>
      ${days.map(dt=>{const iso=isoD(dt);const w=dt.getDay();
        const on=iso>=r.start&&iso<=r.end;
        const fc=on?(red?'fill red':(opts.blue?'fill blue':'fill')):'';
        const cmv=((r.cm||{})[iso]||'').replace(/"/g,'&quot;');
        return `<td class="gd ${fc} ${w===6?'sat':w===0?'sun':''} ${iso===todayIso?'gtoday':''}" onclick="cellMemo(${pid},'${L}',${idx},'${iso}')"${cmv?` title="${cmv}"`:''}>${cmv?'<span class=\'cmk\'>！</span>':''}</td>`;}).join('')}
    </tr>`;}).join('')}
    </tbody></table></div>
  <div class="gedit">
    <input type="text" id="ga_n_${pid}_${L}" placeholder="工程名">
    <input type="date" id="ga_s_${pid}_${L}"><input type="date" id="ga_e_${pid}_${L}">
    <button onclick="gAddS(${pid},'${L}')">工程を追加</button>
  </div>`;
}
function gUpdS(pid,list,idx,k,v){

}
function gDelS(pid,list,idx){

function gAddS(pid,list){

  const s1=document.getElementById(`ga_s_${pid}_${list}`).value;

let schedZoom='month';
function zoomSet(z){schedZoom=z;renderSched(view);}
const cmHidden=new Set();
function cmToggle(key){cmHidden.has(key)?cmHidden.delete(key):cmHidden.add(key);renderSched(view);}
function memoList(p,list){
  const items=[];
  (p[list]||[]).forEach(r=>Object.entries(r.cm||{}).forEach(([iso,t])=>items.push({iso,name:r.name,t})));
  if(!items.length)return '';
  items.sort((a,b)=>a.iso.localeCompare(b.iso));
  const wd=['日','月','火','水','木','金','土'];
  const key=p.id+'_'+list, hid=cmHidden.has(key);
  return `<div class="cmlist">
    <div class="cml-head"><span class="cmk">！</span>マスのメモ（${items.length}件）
      <span class="cml-tgl" onclick="cmToggle('${key}')">${hid?'表示する':'一時的に隠す'}</span></div>
    ${hid?'':`<ul>${items.map(m=>{const d=new Date(m.iso);
      return `<li><span class="cmk">！</span><b>${d.getMonth()+1}/${d.getDate()}(${wd[d.getDay()]})</b><span class="pn">［${m.name}］</span>${m.t}</li>`;}).join('')}</ul>`}
  </div>`;
}
let _dragRow=null;
function gDS(pid,l,i){_dragRow={pid,l,i};}
function gDR(pid,l,i){
  if(!_dragRow||_dragRow.pid!==pid||_dragRow.l!==l){_dragRow=null;return;}
  const p=props.find(x=>x.id===pid); const a=p[l];
  const[mv]=a.splice(_dragRow.i,1); a.splice(i,0,mv);
  _dragRow=null; saveSched(); renderSched(view);
}
function cellMemo(pid,l,idx,iso){
  const p=props.find(x=>x.id===pid); const r=p[l][idx];
  r.cm=r.cm||{};
  const v=prompt(iso.replaceAll('-','/')+'　'+r.name+'\nメモ（空欄で削除）',r.cm[iso]||'');
  if(v===null)return;
  if(v.trim()==='')delete r.cm[iso]; else r.cm[iso]=v.trim();
  saveSched(); renderSched(view);
}

  const codes=[...new Set(p.roofs.flatMap(r=>[r.hCode,r.tCode,r.yCode]).filter(Boolean))];

  return `<div class="sc-head">
    <div style="min-width:230px"><h3>${p.name}</h3><div class="addr">${p.addr}</div></div>
    <span class="m">総面積<br><b>${area.toLocaleString()}㎡</b></span>
    <span class="m">${p.maker}</span>
    <span>${codes.map(c=>`<span class="badge ${badgeCls(c)}">${c}</span>`).join(' ')}</span>
    ${pend?`<span class="sc-exflag">追加工事 未回収 ¥${pend.toLocaleString()}-</span>`:''}
    <span class="m">完成予定<br><b>${p.yotei||'—'}</b></span>
    <span class="sc-prog"><span class="bar"><i style="width:${p.prog||0}%"></i></span>${p.prog||0}%</span>
    <span class="m">${p.moto}${p.tantou?'<br>'+p.tantou+' 様':''}</span>

/* ---------- タップ演出（shiyo_toroku基準：発光＋タップ音） ---------- */
(function(){
  /* ---------- ゲーム風タップ音（Web Audio合成・音源ファイル不要） ---------- */
  let AC=null;
  function ctx(){
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  function tapSound(){
    try{
      const c=ctx(), t=c.currentTime;
      // 明るい「ピコッ」：矩形波の短い上昇ブリップ
      const o=c.createOscillator(), g=c.createGain();
      o.type='square';
      o.frequency.setValueAtTime(620,t);
      o.frequency.exponentialRampToValueAtTime(1040,t+0.035);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.16,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.10);
      // 下支えの「ポッ」：サイン波の短い下降
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(300,t);
      o2.frequency.exponentialRampToValueAtTime(170,t+0.055);
      g2.gain.setValueAtTime(0.10,t);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
      o2.connect(g2).connect(c.destination);
      o2.start(t); o2.stop(t+0.08);
    }catch(e){}
  }

  /* ---------- タッチ発光 ---------- */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    el.style.left=x+'px'; el.style.top=y+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 340);
  }

  /* ---------- イベント委譲 ----------
     発光＝画面のどこを触っても出す（触った場所のフィードバック）
     音　＝押せる要素（ボタン・ナビ・チップ・行）に当たったときだけ鳴らす */
  const PRESSABLE='button, .ni, .chip>button, .mk, .mrow, .tabs button, #viewtabs button, .btn-ok, .btn-ghost, .sortbtn, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    const hit=e.target.closest(PRESSABLE);
    if(hit && !hit.disabled && !hit.classList.contains('soon')){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();

function renderDash(){
  const d=document.getElementById('dashboard');
  document.getElementById('cnt').textContent=props.length;
  const P=props.filter(inRange);
  const withOrder=P.filter(p=>p.order>0);
  const totalOrder=withOrder.reduce((s,p)=>s+p.order,0);
  const totalProfit=P.reduce((s,p)=>{const pr=profitOf(p);return s+(pr&&(p.mat+p.jin+p.keihi+p.other)>0?pr:0);},0);
  const costedOrder=P.filter(p=>p.order&&(p.mat+p.jin+p.keihi+p.other)>0).reduce((s,p)=>s+p.order,0);
  const avgRate=costedOrder?(totalProfit/costedOrder*100):0;
  const sekou=P.filter(p=>p.status==='施工中');
  const pendAll=P.reduce((s,p)=>s+exPending(p),0);
  const pendCnt=P.reduce((s,p)=>s+exOpenCount(p),0);
  const fmtYMD=v=>v||'—';

  const alerts=[];
  P.forEach(p=>(p.extras||[]).forEach(e=>{if(e.status!=='回収済み'&&e.status!=='不成立')alerts.push({p,e});}));
  alerts.sort((a,b)=>(b.e.amt||0)-(a.e.amt||0));

  const today=new Date(); const notices=[];
  P.forEach(p=>{
    if(p.status==='施工中'&&p.yotei){
      const days=Math.round((new Date(p.yotei)-today)/86400000);
      if(days>=0&&days<=45)
        notices.push({warn:exOpenCount(p)>0,t:`⏰ <b>${p.name}</b>：完成予定 ${p.yotei}（あと${days}日）${exOpenCount(p)?'。<b>追加工事の精算交渉は完成前に。</b>':''}`});
    }

  const byM={}; withOrder.forEach(p=>{const m=p.date.slice(0,7);(byM[m]=byM[m]||[]).push(p);});
  const months=Object.keys(byM).sort().slice(-8);

  const H=210;

    const co=isJu?ls.filter(p=>p.order&&(p.mat+p.jin+p.keihi+p.other)>0).reduce((s,p)=>s+p.order,0):0;
    return {st,n:ls.length,mit,ju:isJu?mit:0,prof,rate:co?prof/co*100:null,isJu};
  });

  const chk=stRows.filter(r=>stChecked.has(r.st)&&r.n>0);

  let acc=0; const R=60,C=2*Math.PI*R,CX=100,CY=100;

    const pct=Math.round(f*100);

      <text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff" style="text-shadow:0 1px 2px rgba(0,0,0,.5)">${label}</text>`;

  const houRows=Object.entries(byHou).map(([h,o])=>({h,order:o.order,profit:o.profit,rate:o.co?o.profit/o.co*100:null,n:o.n})).sort((a,b)=>(b.rate??-1)-(a.rate??-1));
  if(!houRows.some(r=>r.h==='他防水'))houRows.push({h:'他防水',order:0,profit:0,rate:null,n:0});

  const byMoto={}; withOrder.forEach(p=>{

    o.order+=p.order; o.n++;
    o.area+=p.roofs.reduce((s,x)=>s+x.hiraba+x.tachi+x.yaku,0);
  });
  const motoRows=Object.entries(byMoto).sort((a,b)=>b[1].order-a[1].order).slice(0,5);

    ex:{th:'<th>追加工事</th>',td:p=>{const pend=exPending(p);return `<td class="num">${pend?`<span class="exflag">⚠ ${yen(pend)}</span>`:'—'}</td>`;}},
    yotei:{th:'<th>完成予定</th>',td:p=>`<td>${fmtYMD(p.yotei)}</td>`},
    prog:{th:'<th>進捗</th>',td:p=>`<td><div class="progwrap"><div class="prog" style="flex:1"><i style="width:${p.prog||0}%"></i></div><b>${p.prog!=null?p.prog+'%':'—'}</b></div></td>`},
    moto:{th:'<th>元請／担当者</th>',td:p=>`<td>${p.moto}<br>${p.tantou?p.tantou+' 様':''}</td>`},
    order:{th:'<th style="text-align:right">受注金額</th>',td:p=>`<td class="num">${yen(p.order)}</td>`},
    rate:{th:'<th style="text-align:right">利益率</th>',td:p=>{const r=profitRate(p);return `<td class="num">${r!=null?r.toFixed(1)+'%':'—'}</td>`;}},
  };
  const sekouCols=COLS.sekou.filter(c=>c.on);

  const stCell={
    tag:{th:'<th>ステータス</th>',td:r=>`<td><label style="display:flex;align-items:center;gap:6px;cursor:pointer" onclick="event.stopPropagation()"><input type="checkbox" ${stChecked.has(r.st)?'checked':''} onchange="toggleStChk('${r.st}')"><span class="sttag" style="background:${STC[r.st]}" onclick="goStatusList('${r.st}')" onmouseenter="stTip(event,'${r.st}')" onmousemove="tipMove(event)" onmouseleave="tipHide()">${r.st}</span></label></td>`},
    n:{th:'<th style="text-align:right">件数</th>',td:r=>`<td class="num">${r.n}件</td>`},
    mit:{th:'<th style="text-align:right">見積金額</th>',td:r=>`<td class="num">${r.st==='引合いあり'?'—':(r.mit?yen(r.mit):'—')}</td>`},
    ju:{th:'<th style="text-align:right">受注金額</th>',td:r=>`<td class="num">${r.isJu&&r.ju?yen(r.ju):'—'}</td>`},
    prof:{th:'<th style="text-align:right">利益額</th>',td:r=>`<td class="num">${r.isJu&&r.prof?yen(r.prof):'—'}</td>`},
    rate:{th:'<th style="text-align:right">利益率</th>',td:r=>`<td class="num">${r.rate!=null?r.rate.toFixed(1)+'%':'—'}</td>`},
  };
  const stCols=COLS.stt.filter(c=>c.on);

  const houCell={
    icon:{th:'<th></th>',td:r=>`<td class="hicon-cell"><img src="./icons/${HOU_IMG[r.h]||'hou_other'}.png" alt="" style="height:22px;vertical-align:middle" onerror="this.outerHTML=''"></td>`},
    name:{th:'<th>工法</th>',td:r=>`<td>${houLabel(r.h)}</td>`},
    order:{th:'<th style="text-align:right">受注額</th>',td:r=>`<td class="num">${yen(r.order)}</td>`},
    profit:{th:'<th style="text-align:right">利益額</th>',td:r=>`<td class="num">${r.profit?yen(r.profit):'—'}</td>`},
    rate:{th:'<th style="text-align:right">平均利益率</th>',td:r=>`<td class="num"><b>${r.rate!=null?r.rate.toFixed(1)+'%':'—'}</b></td>`},
    n:{th:'<th style="text-align:right">実績数</th>',td:r=>`<td class="num">${r.n}件</td>`},
  };
  const houCols=COLS.hou.filter(c=>c.on);

  const wRows=[
    {area:'札幌市（発寒・厚別）', today:'☀ 晴れ 27℃', tom:'🌧 雨 22℃', warn:true},
    {area:'東京都（大手町）',     today:'☀ 晴れ 33℃', tom:'⛅ 晴のち曇 31℃', warn:false},
  ];

  d.innerHTML=`
    <div class="range-bar">📅 対象期間：
      <input type="date" id="rg_f" value="${dashRange.from}"> 〜 <input type="date" id="rg_t" value="${dashRange.to}">
      <button onclick="applyRange()">期間設定</button>
      ${(dashRange.from||dashRange.to)?'<button class="ghost" onclick="clearRange()">全期間に戻す</button>':''}
      <span style="margin-left:auto; font-weight:500; color:var(--ink-sub); font-size:12.5px">${(dashRange.from||dashRange.to)?`表示中：${dashRange.from||'最初'} 〜 ${dashRange.to||'現在'}（${P.length}件）`:'全期間を表示中'}</span>
    </div>

    <div class="kpi-row">
      <div class="sk" style="border-top-color:#1e5c3a" onclick="showView('list')"><div class="l">全物件</div><div class="v">${P.length}件</div></div>
      ${['完成済','施工中','受注済','調査済','見積済','引合いあり'].map(st=>`
        <div class="sk" style="border-top-color:${STC[st]}" onclick="goStatusList('${st}')"><div class="l">${st}</div><div class="v">${stCount[st]}件</div></div>`).join('')}
      <div class="dkm green"><div class="l">受注総額</div><div class="v">¥${(totalOrder/10000).toLocaleString()}万</div><div class="s">受注金額のある${withOrder.length}件の合計</div></div>
      <div class="dkm blue"><div class="l">利益予定総額</div><div class="v">¥${(totalProfit/10000).toLocaleString()}万</div><div class="s">コスト入力済み物件の合計</div></div>
      <div class="dkm blue"><div class="l">平均利益率</div><div class="v">${avgRate.toFixed(1)}%</div><div class="s">受注額加重平均</div></div>
      <div class="dkm ${pendAll>0?'warn':''}"><div class="l">追加工事 未回収</div><div class="v">¥${(pendAll/10000).toLocaleString()}万</div><div class="s">${pendCnt}件が交渉待ち</div></div>
    </div>

    <div class="dash-top" style="grid-template-columns:1.1fr 1fr 0.9fr;">
      <div class="dpanel" style="border-color:#e8c090; margin-bottom:0;">
        <h4>⚠ 追加工事 未回収アラート<span class="cta">クリックで追加工事タブへ</span>${zBtn()}</h4>
        <div class="scrollbox">
        ${alerts.length?alerts.map(a=>`<div class="alert-row" onclick="goPropertyExtras(${a.p.id})">
          <span class="ex-status ${EX_ST_CLS[a.e.status]}">${a.e.status}</span>
          <span class="nm">${a.p.name}<br><span style="font-weight:500;color:var(--ink-sub)">${a.e.content}</span></span>
          <span class="amt">${yen(a.e.amt)}</span></div>`).join('')
        :'<p class="hint">現在、未回収の追加工事はありません。</p>'}
        </div>
      </div>
      <div class="dpanel" style="margin-bottom:0;">
        <h4>📌 要フォロー案件${zBtn()}</h4>
        <div class="scrollbox">
        ${notices.length?notices.map(n=>`<div class="notice ${n.warn?'warn':''}">${n.t}</div>`).join('')
        :'<p class="hint">現在、フォローが必要な案件はありません。</p>'}
        </div>
      </div>
      <div class="dpanel" style="margin-bottom:0;">
        <h4>⛅ 現場の天気（施工中）${zBtn()}</h4>
        ${wRows.map(w=>`<div class="notice ${w.warn?'warn':''}" style="align-items:center">
          <span style="flex:1"><b>${w.area}</b><br>今日：${w.today}　明日：${w.tom}</span></div>`).join('')}
        ${wRows.some(w=>w.warn)?'<div class="notice warn">🌧 <b>明日、札幌エリアは降雨予報。</b>屋外防水工程の可否を前日中に判断してください。</div>':''}
        
      </div>
    </div>
    <div style="height:10px"></div>

    <div class="dash-grid">
      <div>
        <div class="dpanel"><h4>施工中の現場<span class="cta" onclick="showView('list')">一覧へ →</span>${colBtn('sekou')}${zBtn()}</h4>
          ${sekou.length?`<div style="overflow-x:auto"><table class="mini-tbl">
          <tr>${sekouCols.map(c=>sekouCell[c.id].th.replace('</th>',sortBtn('sekou',c.id)+'</th>')).join('')}</tr>
          ${applySort(sekou,'sekou',SEKOU_GET).map(p=>`<tr class="click" onclick="goProperty(${p.id})">${sekouCols.map(c=>sekouCell[c.id].td(p)).join('')}</tr>`).join('')}
          </table></div>`
          :'<p class="hint">施工中の現場はありません。</p>'}
        </div>
        <div class="dpanel"><h4>月別 受注金額の推移<span class="cta">バーに触れると物件別の内訳</span>${zBtn()}</h4>
          <div class="chart-legend">
            <span><span class="sw" style="background:#1e5c3a"></span>新築・増築・改築工事等</span>
            <span><span class="sw" style="background:#8fc7a2"></span>改修・修繕・補修工事等</span>
          </div>
          <div class="bars-scroll"><div class="bars2" style="min-width:${months.length*95}px">${months.map(m=>{
            const list=[...byM[m]].sort((a,b)=>b.order-a.order);
            const tot=list.reduce((s,p)=>s+p.order,0);
            return `<div class="bcol2">
              <span class="bv2">¥${Math.round(tot/10000).toLocaleString()}万</span>
              <div class="stack" style="height:${Math.max(10,tot/maxM*H)}px">
                ${list.map(p=>`<div class="seg gloss" style="height:${(p.order/tot*100).toFixed(1)}%;background-color:${p.kind==='新築'?'#1e5c3a':'#8fc7a2'}"
                  onmouseenter="segTip(event,${p.id})" onmousemove="tipMove(event)" onmouseleave="tipHide()" onclick="goProperty(${p.id})"></div>`).join('')}
              </div>
              <span class="bl2">${m.slice(2).replace('/','年')}月</span></div>`;}).join('')}
          </div></div>
        </div>
      </div>
      <div>
        <div class="dpanel"><h4>ステータス分布<span class="cta">タグに触れると物件表示・クリックで絞り込み一覧へ</span>${colBtn('stt')}${zBtn()}</h4>
          <div class="stflex">
            <div class="tblside" style="overflow-x:auto"><table class="mini-tbl st-tbl">
            <tr>${stCols.map(c=>stCell[c.id].th.replace('</th>',sortBtn('stt',c.id)+'</th>')).join('')}</tr>
            ${applySort(stRows,'stt',STT_GET).map(r=>`<tr>${stCols.map(c=>stCell[c.id].td(r)).join('')}</tr>`).join('')}
            <tr style="font-weight:800;background:#f2f4ef"><td>全物件</td>${stCols.slice(1).map(c=>{
              if(c.id==='n')return `<td class="num">${P.length}件</td>`;
              if(c.id==='mit')return `<td class="num">${yen(totalOrder)}</td>`;
              if(c.id==='ju')return `<td class="num">${yen(stRows.filter(r=>r.isJu).reduce((s,r)=>s+r.ju,0))}</td>`;
              if(c.id==='prof')return `<td class="num">${yen(totalProfit)}</td>`;
              if(c.id==='rate')return `<td class="num">${avgRate.toFixed(1)}%</td>`;
              return '<td></td>';}).join('')}</tr>
            </table></div>
            <div style="text-align:center; flex:1; min-width:275px">
              <svg width="265" height="265" viewBox="0 0 200 200">${stSegs}
                <text x="100" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#222">表示中</text>
                <text x="100" y="116" text-anchor="middle" font-size="19" font-weight="800" fill="#1e5c3a">${chkTotal}件</text></svg>
              <p class="hint" style="margin-top:2px">表の✓と連動</p>
            </div>
          </div>
        </div>
        <div class="dpanel"><h4>工法別 受注・利益${colBtn('hou')}${zBtn()}</h4>
          <div style="overflow-x:auto"><table class="mini-tbl">
          <tr>${houCols.map(c=>houCell[c.id].th.replace('</th>',sortBtn('hou',c.id)+'</th>')).join('')}</tr>
          ${applySort(houRows,'hou',HOU_GET).map(r=>`<tr>${houCols.map(c=>houCell[c.id].td(r)).join('')}</tr>`).join('')}
          </table></div>
        </div>
        <div class="dpanel"><h4>元請別 受注順位${zBtn()}</h4>
          <table class="mini-tbl"><tr><th>順位</th><th>元請</th><th style="text-align:right">件数</th><th style="text-align:right">施工面積</th><th style="text-align:right">受注総額</th></tr>
          ${motoRows.map((r,i)=>`<tr><td class="num"><b>${i+1}位</b></td><td>${r[0]}</td><td class="num">${r[1].n}件</td><td class="num">${r[1].area.toLocaleString()}㎡</td><td class="num">${yen(r[1].order)}</td></tr>`).join('')}</table>
        </div>
      </div>
    </div>
    <button class="go-list-btn" onclick="showView('list')">📋 個別の現場記録へ →</button>`;
}

/* ---------- 左枠リサイザー ---------- */
(function(){
  const rz=document.getElementById('resizer'), list=document.getElementById('list');
  let drag=false;
  rz.addEventListener('mousedown',e=>{drag=true; rz.classList.add('on'); e.preventDefault();});
  addEventListener('mousemove',e=>{if(!drag)return;
    const w=Math.min(Math.max(e.clientX,300), innerWidth*0.68);
    list.style.flex='0 0 '+w+'px'; list.style.maxWidth=w+'px';});
  addEventListener('mouseup',()=>{drag=false; rz.classList.remove('on');});
})();

buildChips(); buildNav(); showView('dash');
</script>

<script>
/* ============================================================
   スマホ表示モード切替
   ・一覧モード（既定）：デスクトップレイアウトを縮小して全体表示。
     ピンチ（指を広げる）でいつでも拡大可能。
   ・モバイル表示：従来のレスポンシブ表示。
   右下の丸ボタンで切替。設定は端末に記憶され全ページ共通。
   ============================================================ */
(function(){
  const KEY='nn_view_mode', VW=980;
  const vp=document.querySelector('meta[name="viewport"]');
  const phone=Math.min(screen.width,screen.height)<700;
  function getMode(){ try{return localStorage.getItem(KEY)||'ichiran';}catch(e){return 'ichiran';} }
  function apply(m){
    if(m==='ichiran'){ vp.setAttribute('content','width='+VW+', user-scalable=yes'); }
    else{ vp.setAttribute('content','width=device-width, initial-scale=1.0, user-scalable=yes'); }
    try{localStorage.setItem(KEY,m);}catch(e){}
    const b=document.getElementById('vmToggle');
    if(b){
      b.textContent=(m==='ichiran'?'📱 モバイル表示':'🗂 一覧表示');
      /* 一覧モードは全体が縮小されるためボタンは大きめに作る */
      b.style.fontSize=(m==='ichiran'?'26px':'13px');
      b.style.padding=(m==='ichiran'?'14px 22px':'8px 14px');
      b.style.bottom=(m==='ichiran'?'120px':'72px');
    }
  }
  window.nnToggleView=function(){ apply(getMode()==='ichiran'?'mobile':'ichiran'); };
  if(!phone){ vp.setAttribute('content','width=device-width, initial-scale=1.0, user-scalable=yes'); return; }
  function mkBtn(){
    if(document.getElementById('vmToggle'))return;
    const b=document.createElement('button'); b.id='vmToggle';
    b.setAttribute('style','position:fixed;right:10px;bottom:72px;z-index:9999;'
      +'background:#1e5c3a;color:#fff;border:2px solid rgba(255,255,255,.65);'
      +'border-radius:999px;font-weight:800;letter-spacing:.03em;'
      +'box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer;opacity:.93;');
    b.onclick=window.nnToggleView;
    document.body.appendChild(b);
    apply(getMode());
  }
  apply(getMode());
  if(document.body) mkBtn(); else document.addEventListener('DOMContentLoaded',mkBtn);
})();
</script>

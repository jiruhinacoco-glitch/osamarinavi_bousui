})();
const num=v=>{const x=parseFloat(String(v).replace(/[^\d.\-]/g,'')); return isNaN(x)?0:x;};
function commit(p,f,val){
  const src=p.a||p.y;   /* 表示しているコストの出どころ（実績があれば実績） */
  if(f==='name'){ const v=val.trim(); if(v)p.name=v; }
  else if(f==='addr'){ const v=val.trim(); if(v){p.addr=v;
    p.area=(p.addr.match(/^東京都[^区]+区|^[^市]+市|^[^町]+町/)||['その他'])[0];} }
  else if(f==='moto'){ const v=val.trim(); if(v)p.moto=v; }
  else if(f==='tan'){ p.tan=Math.max(0,Math.round(num(val))); }
  else if(f==='m'){ p.m=Math.max(0,num(val)); if(p.roofs&&p.roofs[0])p.roofs[0].hiraba=p.m; }
  else if(f==='order'){ p.order=Math.max(0,Math.round(num(val))); }
  else if(f==='mat'){ if(src){src[0]=Math.max(0,Math.round(num(val)));} }
  else if(f==='jin'){ if(src){src[1]=Math.max(0,Math.round(num(val)));} }
  else if(f==='hoka'){ if(src){src[2]=Math.max(0,Math.round(num(val))-(src[3]||0));} }
  if(src){ p.mat=src[0]; p.jin=src[1]; p.other=src[2]; p.keihi=src[3]; }
  if(typeof recalcProp==='function')recalcProp(p);
  dashDirty=true; if(typeof buildChips==='function')buildChips();
  if(typeof lfCounts==='function')lfCounts();
  toast('保存しました（この画面での変更はサンプルのため、再読み込みで元に戻ります）');
  render();
  if(document.getElementById('mainview').classList.contains('show-detail'))renderDetail();
}
function commitSel(p,f,val){
  if(f==='kizon'||f==='kind'||f==='kouzou'||f==='kbn'){
    p[f]=val;
    dashDirty=true; if(typeof buildChips==='function')buildChips();
    toast('保存しました（この画面での変更はサンプルのため、再読み込みで元に戻ります）');
    render(); return;
  }
  if(f==='status'){ p.status=val; p.stRaw=ST_INV[val]||'hikiai'; }
  else if(f==='kouhou'){ p.kouhou=val; p.hou=HOU_MAP(val); p.spec=CODE_MAP(val);
    const mk=KO_MASTER[val]; if(mk){p.maker=mkShort(mk[0]); p.makerFull=mk[0]; p.sozai=mk[1]; p.shiire=mk[0];}
    if(p.roofs&&p.roofs[0])p.roofs[0].hCode=p.spec; }
  if(typeof recalcProp==='function')recalcProp(p);
  dashDirty=true; if(typeof buildChips==='function')buildChips();
  if(typeof lfCounts==='function')lfCounts();
  toast('保存しました（この画面での変更はサンプルのため、再読み込みで元に戻ります）');
  render();
}
function startEdit(box){
  /* ★2026-08-13f 編集中の囲みから別の囲みへ直接タップしたとき、
     外を押した扱いで先に render() が走り、この box が作り直されて「もう画面に無い」ことがある。
     そのままだと2つ目が開かないので、同じ物件・同じ項目の生きている囲みを取り直す。 */
  if(!document.body.contains(box)){
    const c0=box.closest('.pcard'), pid=c0&&c0.dataset.pid, f0=box.dataset.f;
    const live=pid&&f0&&document.querySelector('#list .pcard[data-pid="'+pid+'"] [data-f="'+f0+'"]');
    if(!live)return; box=live;
  }
  if(box.querySelector('input,select,textarea'))return;      /* すでに編集中 */
  const card=box.closest('.pcard'); if(!card)return;
  const p=props.find(x=>x.id===+card.dataset.pid); if(!p)return;
  const f=box.dataset.f;
  /* プルダウン型（状態・工法・既存防水・区分・構造体） */
  if(f==='status'||f==='kouhou'||f==='kizon'||f==='kind'||f==='kouzou'||f==='kbn'){
    const sel=document.createElement('select');
    const opts=f==='status'
      ? Object.keys(ST_INV)
      : f==='kizon' ? NN_KIZON
      : f==='kind'  ? NN_KIND
      : f==='kouzou'? NN_KOUZOU
      : f==='kbn'   ? ['材工','材のみ','工のみ']
      : [...new Set([...Object.keys(KO_MASTER), ...props.map(x=>x.kouhou).filter(Boolean)])];
    opts.forEach(o=>{const op=document.createElement('option'); op.value=op.textContent=o; sel.appendChild(op);});
    sel.value=f==='status'?p.status:f==='kizon'?(p.kizon||'不明'):f==='kind'?(p.kind||'改修'):f==='kouzou'?(p.kouzou||'RC'):f==='kbn'?(p.kbn||'材工'):(p.kouhou||'');
    /* ★2026-08-14d 項目名（左の緑のラベル）を消さないこと。
       innerHTML='' で作り直すと「既存」「区分」「構造」が消え、
       選んでいる間だけ何の欄か分からなくなっていた（本人の指摘）。 */
    const lb0=box.querySelector('i');
    box.innerHTML=''; if(lb0)box.appendChild(lb0); box.appendChild(sel); sel.focus();
    /* ★2026-08-15e 1クリックで選択肢まで開く（本人の指摘「2度目のクリックでようやく出る」）。
       focus() だけではプルダウンは開かない。showPicker() は「利用者の操作の中」でしか
       呼べないが、ここは click ハンドラの中なので使える。無い端末では今までどおり
       （もう1回タップで開く）。 */
    try{ if(sel.showPicker)sel.showPicker(); }catch(_){}
    let done=false;
    sel.onchange=()=>{done=true; commitSel(p,f,sel.value);};
    /* ★Escで取り消せるようにする（入力欄と動きをそろえる） */
    sel.onkeydown=e2=>{ if(e2.key==='Escape'){ done=true; render(); } };
    sel.onblur=()=>{ if(!done)render(); };
    return;
  }
  /* メモ（複数行） */
  if(f==='tb'){
    const ta=document.createElement('textarea');
    ta.value=p.tb||'';
    const lb=box.querySelector('b');
    box.innerHTML=''; if(lb)box.appendChild(lb); box.appendChild(ta); ta.focus();
    let done=false;
    const fin=ok2=>{ if(done)return; done=true;
      if(ok2){ p.tb=ta.value.trim()||null;
        toast('保存しました（この画面での変更はサンプルのため、再読み込みで元に戻ります）'); }
      render();
      if(document.getElementById('mainview').classList.contains('show-detail'))renderDetail(); };
    ta.onkeydown=e=>{ if(e.key==='Escape')fin(false); };
    ta.onblur=()=>fin(true);
    return;
  }
  /* 入力型 */
  const NUMF=['tan','m','order','mat','jin','hoka'];
  const cur = f==='name'?p.name : f==='addr'?p.addr : f==='moto'?p.moto
    : f==='tan'?(p.tan||0) : f==='m'?(p.m||0) : f==='order'?(p.order||0)
    : f==='mat'?(p.mat||0) : f==='jin'?(p.jin||0) : (p.other||0)+(p.keihi||0);
  const inp=document.createElement('input');
  inp.type='text';
  if(NUMF.includes(f))inp.inputMode='decimal';      /* iPhoneで数字キーパッド */
  inp.value=cur;
  const w=Math.max(60,Math.min(320,box.getBoundingClientRect().width));
  /* ★項目名（左の緑のラベル）はそのまま残す（§97 と同じ理由） */
  const lb1=box.querySelector('i');
  box.innerHTML=''; if(lb1)box.appendChild(lb1); box.appendChild(inp); box.style.minWidth=w+'px';
  inp.focus(); inp.select();
  let done=false;
  const fin=ok2=>{ if(done)return; done=true; if(ok2)commit(p,f,inp.value); else render(); };
  inp.onkeydown=e=>{ if(e.key==='Enter')fin(true); else if(e.key==='Escape')fin(false); };
  inp.onblur=()=>fin(true);
}
/* カードの選択処理（#list の pointerdown / click）より先に受け取る */
document.addEventListener('pointerdown',e=>{
  /* 編集中に外を押したら、そこで確定させる。
     ★絞り込みチップは pointerdown で preventDefault するため、押してもフォーカスが
       移らず blur が起きない＝確定されないことがあった。ここで自分で blur を呼ぶ。 */
  const act=document.activeElement;
  if(act && /^(TEXTAREA|INPUT|SELECT)$/.test(act.tagName)
     && act.closest('#list .pcard .ebox, #list .pcard .stsel')
     && !(e.target && act.parentElement && act.parentElement.contains(e.target))){
    act.blur();
  }
  const t=e.target.closest&&e.target.closest('#list .pcard .ebox, #list .pcard .stsel, #list .pcard .pexrow');
  if(t)e.stopPropagation();

document.addEventListener('click',e=>{
  let t=e.target.closest&&e.target.closest('#list .pcard .ebox, #list .pcard .stsel');
  /* ★2026-08-15e 既存・区分・構造は、囲みの少し外（アイコンや行の余白）を押しても開く。
     行（.pexrow）ごと受けて、中の囲みに渡す。囲みを狙い損ねて
     「カードが黄色になるだけ」だったのを無くす。 */
  if(!t){
    const row=e.target.closest&&e.target.closest('#list .pcard .pexrow');
    if(row)t=row.querySelector('.ebox');
  }
  if(!t)return;
  e.stopPropagation(); e.preventDefault();
  startEdit(t);
},true);
})();

    im.onload =()=>{ KI_STATE[code]='ok'; kiSchedule(); };
    im.onerror=()=>{ KI_STATE[code]='ng'; };
    im.src=nnKiconFile({spec:code});
  }
  /* ★2026-08-14f 既存防水・区分・構造体の絵の枠（絵はこれから作る）。
     置き場所は icons/<種類>_<キー>.png（例 icons/kizon_enbi.png）。
     背景透過PNG・高さ168px・幅は絵なり。工法アイコンと同じ規格。
     ★絵があるかは「キーごとに1回だけ」確かめる（100件ぶん404を取りに行かない）。 */
  const EX_KEY={
    kizon:{'不明':'fumei','露出アスファルト防水':'as_roshutsu','押えコンクリート':'osae',
      '改質アスファルトシート':'kaishitsu','塩ビシート防水':'enbi','ゴムシート防水':'gomu',
      'ウレタン塗膜防水':'ure','FRP防水':'frp','金属屋根':'kinzoku','モルタル・土間':'mortar',
      '新設（既存なし）':'shinsetsu'},
    kind:{'新築':'shinchiku','改修':'kaishu','増改築':'zoukaichiku','部分補修':'bubun'},
    kouzou:{'RC':'rc','S':'s','ALC':'alc','W':'w','RCS':'rcs'},
  };
  const EX_STATE={};
  function exProbe(url){
    if(EX_STATE[url])return;
    EX_STATE[url]='wait';
    const im=new Image();
    im.onload =()=>{ EX_STATE[url]='ok'; kiSchedule(); };
    im.onerror=()=>{ EX_STATE[url]='ng'; };
    im.src=url;
  }
  window.nnExIconState=EX_STATE;
  window.nnExIconFile=function(kind,val){
    const k=(EX_KEY[kind]||{})[val];
    return k ? './icons/'+kind+'_'+k+'.png' : '';
  };
  window.nnExIcon=function(kind,val){
    const f=nnExIconFile(kind,val);
    if(!f) return '<span class="exicon" title="'+esc(val)+'"></span>';
    exProbe(f);
    if(EX_STATE[f]==='ok')
      return '<span class="exicon has" title="'+esc(val)+'"><img src="'+f+'" alt="" loading="lazy" draggable="false"></span>';
    return '<span class="exicon" title="'+esc(val)+'"></span>';
  };
  window.nnKiconState=KI_STATE;
  window.nnKiconHtml=function(p){
    const k=nnKouKey(p);
    if(!k.key) return '<span class="kicon" title="工法アイコン"><span>—</span></span>';
    kiProbe(k.key);
    const cap=esc(k.label), ttl=esc((p&&p.kouhou)||k.label);
    if(KI_STATE[k.key]==='ok')
      return '<span class="kicon has" title="'+ttl+'"><span>'+cap+'</span>'
        +'<img src="'+nnKiconFile(k.key)+'" alt="" loading="lazy" draggable="false"></span>';
    return '<span class="kicon" title="'+ttl+'"><span>'+cap+'</span></span>';
  };
  /* 保管済みの写真を集める（カードの現場写真＋「写真」タブの写真） */
  /* ★2026-08-14d メインの現場写真は入れない。
     入れると「メインの写真」と「10枚の1枚目」が同じ絵になって意味がない（本人の指摘）。
     ここに並ぶのは「写真」タブに保管した写真だけ。 */
  window.nnShotList=function(p){
    const out=[];
    try{ (p.files||[]).filter(f=>f.cat==='photo').forEach(f=>out.push({url:f.url, name:f.name||'写真'})); }catch(_){}
    return out;
  };
  window.nnShotRow=function(p,where){
    /* ★2026-08-17a PC・スマホとも「1本の帯」に統一（PC10枚／スマホ5枚）。
       置き場所は提出書類と同じ行（.rfiles）。旧 where 引数は廃止（呼ぶ側は1か所だけ）。 */
    const N=PHONE?5:10;
    if(where==='docs') return '';   /* 旧仕様の呼び出しが残っていても二重に出さない */
    const sh=nnShotList(p).slice(0,N);
    let g='';
    for(let i=0;i<N;i++){
      const it=sh[i];
      /* ★★2026-08-17d 実機（iOS）で謎の「1」がマスの間に出続けた（3回目の指摘）。
         「1」＝この物件の番号（p.id=1）。マスのHTMLには onclick="nnShotAdd(1)" のように
         物件番号が埋め込まれており、実機ではこれが何らかの形で文字として漏れていた。
         → **マスの中に「動く文字」を一切書かない**（番号・物件id・処理を属性にも入れない）。
           押したときの処理は #list でまとめて受ける（下の delegation）。
           これで、どの端末がどう解釈しても文字が生まれようがない。 */
      g += it
        ? '<span class="psh has" data-i="'+i+'" title="写真を大きく見る">'
          +'<img src="'+esc(String(it.url).replace(/["'<>\s]/g,''))+'" alt="" loading="lazy" onerror="nnShotBad(this)">'
          +(PHONE?'':'<i>'+(i+1)+'</i>')+'</span>'
        : '<span class="psh" data-i="'+i+'" title="ここに写真を入れる">'
          +(PHONE?'':'写真'+(i+1))+'</span>';
    }
    return '<div class="prow pshots"><div class="pshgrid">'+g+'</div>'
      +'<button class="pshmore" type="button" title="写真をすべて見る">他</button></div>';
  };
  /* マス・「他」ボタンの押下は1か所で受ける（マスのHTMLに処理を書かないため） */
  document.addEventListener('click',function(e){
    const s2=e.target.closest&&e.target.closest('#list .pcard .rfiles .psh, #list .pcard .rfiles .pshmore');
    if(!s2)return;
    const card=s2.closest('.pcard'); if(!card)return;
    const pid=+card.dataset.pid;
    if(s2.classList.contains('pshmore')){ nnDoc(pid,'photos'); return; }
    if(s2.classList.contains('has')) nnShotZoom(pid, +(s2.dataset.i||0));
    else nnShotAdd(pid);
  });
  /* 写真が読めなかった枠を「空き枠」に戻す（番号だけが残るのを防ぐ）。
     押したときの動きは delegation が .has の有無で見分けるので、ここでは外すだけでよい */
  window.nnShotBad=function(img){
    const s=img&&img.parentNode; if(!s)return;
    s.classList.remove('has'); s.innerHTML=''; s.title='ここに写真を入れる';
  };
  /* 空いている枠を押したら、その場で写真を足す（詳細ページへは飛ばさない）。
     ★中身は「写真」タブのドラッグ＆ドロップと同じ処理（handleFiles）なので、
       入れた写真はそのまま「写真」タブにも並ぶ。 */
  window.nnShotAdd=function(pid){
    if(window.event&&window.event.stopPropagation)window.event.stopPropagation();
    if(typeof pickFiles==='function') pickFiles(pid);
  };
  /* 写真を大きく見る（一覧の＋と同じライトボックス） */
  window.nnShotZoom=function(pid,i){
    if(window.event&&window.event.stopPropagation)window.event.stopPropagation();
    const p=props.find(x=>x.id===pid); if(!p)return;
    const it=nnShotList(p)[i]; if(!it){ toast('この写真は開けませんでした'); return; }
    const old=document.getElementById('nnPhotoBig'); if(old)old.remove();
    const ov=document.createElement('div'); ov.id='nnPhotoBig';
    ov.innerHTML='<img src="'+esc(it.url)+'" alt=""><button class="cl" title="閉じる">✕</button>'
      +'<div class="cap">'+esc(p.name)+'　'+esc(it.name)+'</div>';
    const close=()=>{ ov.remove(); document.removeEventListener('keydown',onKey); };
    const onKey=e=>{ if(e.key==='Escape')close(); };
    ov.addEventListener('click',close);
    document.addEventListener('keydown',onKey);
    document.body.appendChild(ov);
  };
  /* ★写真の枠がカードの選択にならないようにする指定は、
     「選択する側」（document capture の受け口）に書いてある。
     ここで stopPropagation してはいけない（§92：目的の onclick にも届かなくなる）。 */

  /* ★2026-08-14b スマホ：写真そのものをタップしたら「大きく表示」だけ。
     選択窓を開くのは下の帯（label）に限る＝指が当たっただけで
     iPhoneの写真の選択画面が出てしまうのを防ぐ。 */
  if(PHONE) document.addEventListener('click',e=>{
    const ph=e.target.closest&&e.target.closest('#list .pcard .pph.has'); if(!ph)return;
    if(e.target.closest('.phfull, .phcap, .phzoom, .phinp'))return;   /* 帯と＋は今までどおり */
    const card=ph.closest('.pcard'); if(!card)return;
    e.preventDefault();
    if(window.nnPhotoZoom) nnPhotoZoom(+card.dataset.pid);
  });
})();
</script>

<script id="nn-faceform-js">
(function(){
  const g=k=>document.getElementById(k);
  const num=v=>(+v||0).toLocaleString();
  /* 1行つくる（d があれば中身を入れる） */
  window.nnFFAdd=function(d){
    d=d||{};
    const box=g('f_faceRows'); if(!box)return;
    const row=document.createElement('div'); row.className='ffrow';
    const kos=Object.keys(KO_MASTER);
    if(d.ko && kos.indexOf(d.ko)<0) kos.push(d.ko);   /* 見本の工法名（記号なし表記）も選べるように */
    row.innerHTML=
      '<span class="ffno"></span>'
      +'<input class="ffn" placeholder="例：A棟 屋上・塔屋・ハト小屋" value="'+String(d.n||'').replace(/"/g,'&quot;')+'">'
      +'<select class="ffk">'+kos.map(k=>'<option>'+k+'</option>').join('')+'</select>'
      +'<input class="ffq" type="number" inputmode="decimal" placeholder="数量" value="'+(d.q!=null?d.q:'')+'">'
      +'<select class="ffu"><option>㎡</option><option>m</option></select>'
      +'<button type="button" class="ffx" onclick="this.closest(\'.ffrow\').remove(); nnFFSync();">✕</button>';
    row.querySelector('.ffk').value=d.ko||kos[0];
    row.querySelector('.ffu').value=d.un||'㎡';
    row.querySelectorAll('input,select').forEach(e=>{
      e.addEventListener('input',nnFFSync); e.addEventListener('change',nnFFSync);
    });
    box.appendChild(row); nnFFSync();
  };
  /* いま入っている行を集める（部位名も数量も空の行は数えない） */
  window.nnFFCollect=function(){
    const out=[];
    document.querySelectorAll('#f_faceRows .ffrow').forEach(r=>{
      const n=r.querySelector('.ffn').value.trim();
      const q=+r.querySelector('.ffq').value||0;
      if(!n && !q) return;
      const ko=r.querySelector('.ffk').value;
      out.push({n:n||('部位'+(out.length+1)), ko,
        sp:(typeof CODE_MAP==='function'?CODE_MAP(ko):'—')||'—',
        q, un:r.querySelector('.ffu').value});
    });
    return out;
  };
  /* 合計を出し、上の「数量」「単位」「工法」を自動にする／行が無ければ手入力に戻す */
  window.nnFFSync=function(){
    const rows=nnFFCollect();
    document.querySelectorAll('#f_faceRows .ffno').forEach((e,i)=>e.textContent=(i+1));
    const sum=g('f_faceSum'), fm=g('f_m'), fu=g('f_un'), fk=g('f_ko');
    if(!sum||!fm)return;
    if(!rows.length){
      sum.textContent='';
      fm.readOnly=false; fm.classList.remove('ffauto');
      fu.disabled=false; fu.classList.remove('ffauto');
      fk.disabled=false; fk.classList.remove('ffauto');
      return;
    }
    /* 単位ごとの合計と、いちばん面積の大きい工法 */
    const units={}, kos={};
    rows.forEach(f=>{ units[f.un]=(units[f.un]||0)+f.q; kos[f.ko]=(kos[f.ko]||0)+f.q; });
    const main=Object.keys(kos).sort((a,b)=>kos[b]-kos[a])[0];
    const us=Object.keys(units);
    const headU=units['㎡']!==undefined?'㎡':us[0];
    const rest=us.filter(u=>u!==headU).map(u=>'＋'+num(units[u])+u).join('');
    const nko=Object.keys(kos).length;
    sum.textContent='合計 '+num(units[headU])+headU+rest+'（'+rows.length+'面'
      +(nko>1?'・'+nko+'工法':'')+'）→ 一覧には「内訳」ボタン付きで出ます';
    /* 数量＝合計・工法＝主たる工法。手で直せない（内訳と食い違うと集計が壊れるため） */
    fm.value=units[headU]; fm.readOnly=true; fm.classList.add('ffauto');
    fu.value=headU; fu.disabled=true; fu.classList.add('ffauto');
    if([...fk.options].some(o=>o.value===main)===false){
      const o=document.createElement('option'); o.textContent=main; fk.appendChild(o);
    }
    fk.value=main; fk.disabled=true; fk.classList.add('ffauto');
  };
  /* フォームを開いたとき：保存済みの内訳を行に入れる（無ければ空） */
  const _open=window.openModal;
  window.openModal=function(id){
    _open(id);
    const box=g('f_faceRows'); if(box)box.innerHTML='';
    const p=id?props.find(x=>x.id===id):null;
    const a=(p&&window.nnFaceList)?nnFaceList(p.name):null;
    if(a)a.forEach(f=>nnFFAdd(f));
    nnFFSync();
  };
  /* 保存：本体の保存が通ったら（＝窓が閉じたら）内訳も保存する */
  const _save=window.saveProperty;
  window.saveProperty=function(){
    const oldName=editId?((props.find(x=>x.id===editId)||{}).name||null):null;
    const rows=nnFFCollect();
    _save();
    if(document.getElementById('modalbg').classList.contains('open'))return; /* 中断（名前未入力など） */
    const nm=g('f_name').value.trim();
    if(!nm)return;
    if(window.nnFacesSave){
      nnFacesSave(nm, rows, oldName);
      if(window.nnFacesReload)nnFacesReload();
    }
    /* 一覧・ダッシュボードに反映（本体の保存と同じ分岐） */
    if(view==='dash'){ if(typeof renderDash==='function')renderDash(); }
    else if(typeof render==='function')render();
  };
})();
</script>

<script id="nn-cvwin-js">
/* ============ 画面から離れたカードだけ「後回し」にする（2026-08-16w） ============
   ★以前は全カードに content-visibility:auto を付けていたため、
     画面のすぐ下のカードが**灰色の空白**のまま見えていた（本人の指摘）。
     組み立ての途中が見えると、文字が見え隠れしたり並びが違って見える。
   ★ここでは「画面から1200px以上離れているか」を IntersectionObserver で見て、
     離れているカードにだけ `.nnoff`（＝後回し）を付ける。近くのカードは必ず組み立てる。
     ★たて画面は幅980を0.40倍に縮めて出しているので、画面の高さは CSS で約2100px ある
       （＝1画面に約10件）。逃げしろ（rootMargin）はそれに合わせて2000pxにしてある。
   ★100件ぶん見張っても軽い（位置の計算はブラウザ側でまとめて行われる）。 */
(function(){
  var io=null, tm=null;
  /* ★一覧は「中がスクロールする箱」の中にある。その箱を root にしないと、
     箱に切り取られて**逃げしろ（rootMargin）がまったく効かない**（実測：1枚も外れなかった）。 */
  function scroller(el){
    /* ★自分自身から見ること（#list そのものがスクロールする箱だった）。
       親から見はじめると見つからず、逃げしろが1枚も効かなかった。 */
    for(var n=el; n && n!==document.body; n=n.parentElement){
      var ov=getComputedStyle(n).overflowY;
      if(ov==='auto'||ov==='scroll') return n;
    }
    return null;
  }
  function ensure(){
    if(io || !('IntersectionObserver' in window)) return io;
    var rt=scroller(document.getElementById('list'));
    io=new IntersectionObserver(function(es){
      var opened=[];
      for(var i=0;i<es.length;i++){
        var el=es[i].target;
        if(es[i].isIntersecting){ el.classList.remove('nnoff'); opened.push(el); }
        else el.classList.add('nnoff');
      }
      /* 組み立てられた直後のカードは、物件名の文字合わせ（nn-ttlfit-js）を通す。
         ★1コマ待ってから測ること（外した直後はまだ大きさが決まっていない）。 */
      if(opened.length && window.nnTtlFitCard)
        requestAnimationFrame(function(){ opened.forEach(function(c){ nnTtlFitCard(c); }); });
    },{root:rt||null, rootMargin:'2000px 0px 2000px 0px', threshold:0});
    return io;
  }
  function scan(){
    var o=ensure(); if(!o) return;                    /* 使えない端末では全部そのまま組み立てる */
    var cs=document.querySelectorAll('#list .pcard');
    for(var i=0;i<cs.length;i++){
      if(cs[i]._nncv) continue;
      cs[i]._nncv=1;
      if(i>=4) cs[i].classList.add('nnoff');          /* 最初の4件は必ず出す（開いた瞬間の空白よけ） */
      o.observe(cs[i]);
    }
    if(window.nnTtlFitAll) nnTtlFitAll();             /* 組み立て済みのカードの物件名を枠に合わせる */
  }
  /* ★見張りを始めるのは「画面に出したあと」＝2コマ待ってから。
     すぐ始めると、位置がまだ決まっていない状態で判定され、
     **1枚も組み立てられないまま**になる（実測：96/100件が後回しのまま残った）。 */
  window.nnCvScan=function(){ clearTimeout(tm);
    tm=setTimeout(function(){ requestAnimationFrame(function(){ requestAnimationFrame(scan); }); },0); };
  /* 一覧を作り直すたびに見張り直す（作り直すとカードは別物になる） */
  var mo=new MutationObserver(function(){ window.nnCvScan(); });
  function start(){
    var l=document.getElementById('list');
    if(!l){ setTimeout(start,300); return; }
    mo.observe(l,{childList:true});
    window.nnCvScan();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
})();
</script>
<script id="nn-ttlfit-js">
/* ============ 物件名を必ず枠に入れる（2026-08-16z・本人のルール） ============
   物件名の枠は「情報の枠の半分」が上限（CSSの max-width:50%）。
   それより長い名前は **2行にせず、文字を小さくして丸ごと入れる**。
   ・測り方＝「中身の幅（scrollWidth）÷ 見えている幅（clientWidth）」で縮める倍率を出す
   ・下限は8px（いちばん長い名前でもこの手前で収まることを実測済み）
   ・呼びどころ＝一覧の組み立て後（nn-cvwin-js の scan）と、後回しカードが

(function(){
  window.nnTtlFitCard=function(c){
    var t=c&&c.querySelector&&c.querySelector('.rhead .ebox.ttl'); if(!t)return;
    if(!t.offsetWidth)return;                        /* まだ組み立てられていない（.nnoff） */
    t.style.fontSize='';                             /* いったん標準の大きさに戻して測る */
    if(t.scrollWidth<=t.clientWidth+1)return;        /* 収まっている＝そのまま */
    var fs=parseFloat(getComputedStyle(t).fontSize)||14;
    var nf=Math.max(8, Math.floor(fs*(t.clientWidth-2)/t.scrollWidth*10)/10);
    t.style.fontSize=nf+'px';
    var guard=6;                                     /* 丸め誤差ぶんの追い込み */
    while(guard-- && nf>8 && t.scrollWidth>t.clientWidth+1){
      nf=Math.max(8, nf-0.5); t.style.fontSize=nf+'px';
    }
  };
  window.nnTtlFitAll=function(){
    document.querySelectorAll('#list .pcard:not(.nnoff)').forEach(function(c){ nnTtlFitCard(c); });
  };
  var tm=null;
  addEventListener('resize',function(){ clearTimeout(tm); tm=setTimeout(function(){ nnTtlFitAll(); },250); });
  addEventListener('orientationchange',function(){ clearTimeout(tm); tm=setTimeout(function(){ nnTtlFitAll(); },400); });
})();
</script>
<script id="nn-modaldraft-js">
/* ★2026-08-15e 一覧カードの「詳細へ」ボタン（2回タップの代わりの分かりやすい入口） */
window.nnGoDetail=function(pid){
  selectedId=pid;
  if(window.nnSfx)nnSfx('move');
  openDetailFull();
};
(function(){
  /* ★下書き：新規登録の入力を、打つそばから自動で保存する（0.4秒ごとにまとめて）。
     ✕やキャンセルで閉じても消えず、次に「＋新規作成」を開くと復元される。
     編集（既存物件）は対象外＝今までどおり。保存に成功したら下書きは消す。 */
  const KEY='nn_kirokucho_draft_v1';
  const g=k=>document.getElementById(k);
  const FIELDS=['f_name','f_addr','f_moto','f_st','f_ko','f_m','f_un','f_kizon','f_kind','f_kouzou',
    'f_tan','f_amt','f_kb','f_cb','f_fb','f_fy','f_sb','f_nb','f_sh',
    'f_y0','f_y1','f_y2','f_y3','f_a0','f_a1','f_a2','f_a3','f_p','f_nin','f_tb'];
  function snap(){
    const o={v:{}, faces:(window.nnFFCollect?nnFFCollect():[])};
    FIELDS.forEach(k=>{ const e=g(k); if(e)o.v[k]=e.value; });
    return o;
  }
  function hasBody(o){
    return !!(o && (Object.keys(o.v||{}).some(k=>String(o.v[k]||'').trim()!=='' &&
      ['f_st','f_ko','f_un','f_kizon','f_kind','f_kouzou'].indexOf(k)<0) || (o.faces||[]).length));
  }
  function loadD(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
  function saveD(){
    if(editId)return;                       /* 編集は下書きの対象外 */
    const o=snap();
    if(!hasBody(o)){ try{localStorage.removeItem(KEY);}catch(e){} info(''); return; }
    try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){}
    const t=new Date();
    info('✓ 下書きを自動保存（'+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+'）');
  }
  function info(t){ const e=g('f_draftInfo'); if(e)e.textContent=t; }
  window.nnDraftClear=function(){ try{localStorage.removeItem(KEY);}catch(e){} };
  window.nnDraftSaveClose=function(){
    if(editId){ closeModal(); return; }     /* 編集中はただ閉じる（本体は「保存する」で） */
    saveD();
    toast('下書きを保存しました。次に「＋新規作成」を開くと続きから入力できます');
    closeModal();
  };
  /* 打つそばから保存（0.4秒のまとめ）。#modalbg の中の入力すべてを1か所で拾う */
  let tm=0;
  ['input','change'].forEach(ev=>{
    document.getElementById('modalbg').addEventListener(ev,()=>{
      if(!document.getElementById('modalbg').classList.contains('open'))return;
      clearTimeout(tm); tm=setTimeout(saveD,400);
    });
  });
  /* 開いたとき：新規なら下書きを復元 */
  const _open=window.openModal;
  window.openModal=function(id){
    _open(id);
    info('');
    const bt=g('f_draftBtn');
    if(bt)bt.style.display=id?'none':'';    /* 下書きボタンは新規のときだけ */
    if(id)return;
    const d=loadD(); if(!hasBody(d))return;
    FIELDS.forEach(k=>{ const e=g(k); if(e && d.v[k]!==undefined)e.value=d.v[k]; });
    const box=g('f_faceRows'); if(box)box.innerHTML='';
    (d.faces||[]).forEach(f=>nnFFAdd(f));
    if(window.nnFFSync)nnFFSync();
    info('✓ 前回の下書きを復元しました');
    toast('前回の下書きを復元しました（最初からにするときは入力を消してください）');
  };
  /* 保存に成功したら下書きを消す（窓が閉じた＝成功。§109と同じ判定） */
  const _save=window.saveProperty;
  window.saveProperty=function(){
    const wasNew=!editId;
    _save();
    if(document.getElementById('modalbg').classList.contains('open'))return;
    if(wasNew)nnDraftClear();
  };
})();
</script>

<script id="nn-trail-js">
/* ============================================================
   指をなぞると光がついてくる（2026-08-19b・本人の指示）
   線を引く・頂点をつまむ等の細かい操作で「いま指がどこにあるか」が分かるようにする。
   ・画面いっぱいの透明なキャンバスを1枚だけ用意し、指が触れている間だけ描く
   ・座標は clientX/Y をそのまま「画面の実px」として使う（表示倍率 zoom の影響を受けない）
   ・pointer-events:none なので、下のボタンや作図の邪魔は一切しない
   ============================================================ */
(function(){
"use strict";
var cv=null, ctx=null, pts=[], raf=null, active=false, lastT=0;
var LIFE=420;                     /* 光が消えるまで(ms) */
function make(){
  if(cv)return;
  cv=document.createElement('canvas');
  cv.id='nnTrail';
  cv.style.cssText='position:fixed; left:0; top:0; width:100%; height:100%;'
    +'pointer-events:none; z-index:9997;';
  document.body.appendChild(cv);
  ctx=cv.getContext('2d');
}
function fit(){
  var r=cv.getBoundingClientRect();
  var d=Math.min(2, window.devicePixelRatio||1);
  var w=Math.round(r.width*d), h=Math.round(r.height*d);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  return {r:r, k:cv.width/(r.width||1)};   /* k＝画面px→キャンバスpxの倍率（＝dpr） */
}
function draw(){
  if(!cv){ raf=null; return; }
  var g=fit(), k=g.k, now=performance.now();
  ctx.clearRect(0,0,cv.width,cv.height);
  /* 寿命の切れた点を落とす */
  while(pts.length && now-pts[0].t>LIFE) pts.shift();
  if(pts.length>=2){
    /* しっぽ：新しいほど太く明るい */
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var age=(now-b.t)/LIFE; if(age<0)age=0; if(age>1)age=1;
      var al=(1-age)*0.85;
      ctx.strokeStyle='rgba(255,217,77,'+al.toFixed(3)+')';
      ctx.lineWidth=(2.5+6*(1-age))*k;
      ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.shadowColor='rgba(255,180,40,'+(al*0.9).toFixed(3)+')';
      ctx.shadowBlur=9*k*(1-age);
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
    }
    ctx.shadowBlur=0;
  }
  /* 指の先の光 */
  if(active && pts.length){
    var p=pts[pts.length-1];
    var gr=ctx.createRadialGradient(p.x*k,p.y*k,0, p.x*k,p.y*k,9*k);
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.45,'rgba(255,217,77,.80)');
    gr.addColorStop(1,'rgba(255,157,30,0)');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(p.x*k,p.y*k,9*k,0,7); ctx.fill();
  }
  if(active || pts.length){ raf=requestAnimationFrame(draw); }
  else { raf=null; ctx.clearRect(0,0,cv.width,cv.height); }
}
function add(e){
  var now=performance.now();
  if(now-lastT<8) return;          /* 詰めすぎない */
  lastT=now;
  pts.push({x:e.clientX, y:e.clientY, t:now});
  if(pts.length>90) pts.shift();
  if(!raf) raf=requestAnimationFrame(draw);
}
addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse' && e.buttons===0) return;
  make(); active=true; pts.length=0; add(e);
},true);
addEventListener('pointermove',function(e){
  if(!active)return;
  add(e);
},true);
function end(){ active=false; if(!raf&&cv) raf=requestAnimationFrame(draw); }
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  addEventListener(ev,end,true);
});
})();
</script>

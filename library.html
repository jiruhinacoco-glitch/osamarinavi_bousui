<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<script id="nn-phonemark">
/* ============================================================
   ★端末そのものの幅を見て <html> に data-nnphone="1" を付ける。
     （縮小表示のページでは CSS から見た画面幅が常に980pxになるため、
       「スマホのときだけ」の指定を画面幅で書くと絶対に効かない）
   ============================================================ */
(function(){try{
  var d = Math.min(screen.width||0, screen.height||0);
  if(d && d < 700) document.documentElement.setAttribute('data-nnphone','1');
}catch(e){}})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="納まりナビ">
<link rel="manifest" href="./manifest.json">
<title>納まりナビ – ライブラリ</title>
<link rel="stylesheet" href="common.css">
<style>
/* ============================================================
   納まりナビ ライブラリ（納まり事例集）
   記録帳＝現場単位の縦アーカイブ／ライブラリ＝納まり単位の横断資産
   デザイン言語は各デモと共通（緑ヘッダー／下部ナビ）
   ============================================================ */
:root{
  /* 共通カラーパレットは common.css に移動（--green-deep 等） */
  /* ゲーム風ヘッダー/ナビ用（zairyo基準） */
  --green-hi:#48c274; --green-edge:#124a28;
  --yellow:#ffd94d; --yellow-deep:#f0b400; --warn-deep:#b0392f;
  --stroke-g: 0 1px 1px rgba(18,74,40,.55);
  --profit:#0a6bd6; --warn:#b0392f; --gold:#8a7a2a;
  --c-as:#8c2f2f; --c-kai:#c05a20; --c-gs:#2a7a8c; --c-tm:#1f66c0;
  --radius:10px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); height:100vh; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
.num{font-variant-numeric:tabular-nums;}
/* ---------- ヘッダー ---------- */
header{padding-top:calc(5px + env(safe-area-inset-top)) !important;}
/* 横画面（スマホ）：上部の帯（ヘッダー）を非表示にして表示領域を広げる
   ※タップ高速化とノッチ左右の余白は、文末の nn-tap / nn-safearea ブロック参照 */
@media (orientation:landscape) and (max-height:500px){
  header{display:none !important;}
}
header{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
    linear-gradient(180deg, var(--green-hi), var(--green) 55%, var(--green-deep));
  color:#fff; display:flex; align-items:center; gap:10px; padding:5px 13px; flex:none;
  border-bottom:2px solid var(--green-edge);
  box-shadow:0 2px 0 rgba(0,0,0,.08);
  position:relative; z-index:20;
}
header .hicon{font-size:19px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));}
header h1{
  font-size:17px; font-weight:900; letter-spacing:.04em;
  text-shadow:var(--stroke-g);
}
header .count{margin-left:auto; font-size:12.5px; font-weight:700; white-space:nowrap; text-shadow:0 1px 0 rgba(0,0,0,.3);}
header .count .np{
  background:linear-gradient(180deg,#ff6a55,var(--warn-deep));
  border:1.5px solid #7d251c; border-radius:999px; padding:1px 8px; margin-left:7px; font-size:11px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 1px 0 #5e1a13;
}
button.new-btn{
  background:linear-gradient(180deg,#ffffff,#e8f5ec);
  color:var(--green-deep); border:1.5px solid var(--green-deep); border-radius:8px;
  font-size:12.5px; font-weight:700; padding:4px 10px; cursor:pointer; letter-spacing:.02em; white-space:nowrap;
  font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 var(--green-edge);
  transition:transform .06s, box-shadow .06s;
}
button.new-btn:hover{background:linear-gradient(180deg,#ffffff,#d7efdf);}
button.new-btn:active{transform:translateY(2px); box-shadow:inset 0 2px 0 rgba(255,255,255,.9), 0 0 0 var(--green-edge);}
/* ---------- 検索バー ---------- */
.searchbar{padding:10px 14px 8px; background:var(--paper); flex:none;}
.searchbar .box{
  display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--line);
  border-radius:10px; padding:4px 6px 4px 12px; max-width:760px; margin:0 auto;
}
.searchbar .box:focus-within{border-color:var(--green);}
.searchbar .ai{font-size:15px;}
.searchbar input{flex:1; border:0; outline:none; font-size:15px; padding:7px 0; background:none; min-width:60px;}
.searchbar button{background:var(--green); color:#fff; border:0; border-radius:7px; padding:8px 16px; font-size:13.5px; font-weight:800; cursor:pointer; white-space:nowrap;}
.searchbar .exs{max-width:760px; margin:7px auto 0; display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.searchbar .exs::-webkit-scrollbar{display:none;}
.searchbar .ex{flex:none; font-size:12px; font-weight:700; color:var(--green-deep); background:var(--green-lite); border:1px solid #b8dcc4; border-radius:14px; padding:4px 12px; cursor:pointer; white-space:nowrap;}
.searchbar .ex:hover{background:#d8ecdf;}
/* ---------- 絞り込みチップ ---------- */
.filterbar{display:flex; gap:6px; padding:0 14px 9px; background:var(--paper); flex:none; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; align-items:center;}
.filterbar::-webkit-scrollbar{display:none;}
.filterbar .fl{flex:none; font-size:11.5px; font-weight:800; color:var(--ink-sub); white-space:nowrap;}
.filterbar select{flex:none; padding:6px 8px; border:1.5px solid var(--line); border-radius:8px; font-size:12.5px; font-weight:800; background:#fff; color:var(--ink);}
.filterbar select:focus{border-color:var(--green); outline:none;}
.filterbar .clear{flex:none; font-size:12px; font-weight:800; color:var(--warn); cursor:pointer; text-decoration:underline; white-space:nowrap; margin-left:2px;}
/* ---------- 本体 ---------- */
main{flex:1; overflow-y:auto; background:#f7f8f5; border-top:1px solid var(--line);}
.wrap{max-width:980px; margin:0 auto; padding:12px 12px 100px;}
.result-note{font-size:12.5px; color:var(--ink-sub); font-weight:700; margin:2px 2px 10px; line-height:1.7;}
.result-note b{color:var(--green-deep);}
/* ---------- カードグリッド ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px;}
.card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer;
  display:flex; flex-direction:column; transition:box-shadow .12s, border-color .12s;
}
.card:hover{border-color:var(--green); box-shadow:0 3px 10px rgba(42,122,79,.14);}
.thumb{
  height:110px; display:flex; align-items:center; justify-content:center; font-size:34px; position:relative;
  background:linear-gradient(135deg,#dfe7e0,#c8d6cc);
}
.thumb.t-as{background:linear-gradient(135deg,#e8d5cd,#caa79a);}
.thumb.t-ur{background:linear-gradient(135deg,#d4e2ee,#a9c4dd);}
.thumb.t-en{background:linear-gradient(135deg,#d7e6ea,#a8c8d1);}
.thumb .cgtag{position:absolute; right:6px; bottom:6px; background:rgba(30,92,58,.92); color:#fff; font-size:10.5px; font-weight:800; border-radius:4px; padding:2px 7px;}
.thumb .pctag{position:absolute; left:6px; bottom:6px; background:rgba(32,38,35,.8); color:#fff; font-size:10.5px; font-weight:800; border-radius:4px; padding:2px 7px;}
.thumb .warnflag{position:absolute; left:6px; top:6px; background:#fbe9e7; color:var(--warn); border:1px solid #e8b0a8; font-size:10.5px; font-weight:800; border-radius:4px; padding:2px 7px;}
.card .cb{padding:9px 11px 10px; display:flex; flex-direction:column; gap:5px; flex:1;}
.card .tt{font-weight:800; font-size:13.5px; line-height:1.45;}
.card .tags{display:flex; gap:4px; flex-wrap:wrap;}
.tag{display:inline-block; border-radius:4px; padding:2px 7px; font-size:10.5px; font-weight:800; white-space:nowrap;}
.tag.bui{background:var(--green-lite); color:var(--green-deep); border:1px solid #b8dcc4;}
.tag.kou{background:#eef0ea; color:var(--ink-sub); border:1px solid var(--line);}
.tag.kbn-kai{background:#fdeee0; color:#8a4a12; border:1px solid #e8c090;}
.tag.kbn-shin{background:#e7f0fb; color:var(--profit); border:1px solid #b9d3f0;}
.tag.share{background:#f3edda; color:var(--gold); border:1px solid #dcd0a0;}
.card .foot{margin-top:auto; display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-sub); font-weight:700;}
.card .foot .reuse{margin-left:auto; color:var(--green-deep);}
/* ---------- 詳細 ---------- */
.detail-top{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
.back-list{background:none; border:0; color:var(--green-deep); font-size:13.5px; font-weight:800; cursor:pointer; padding:4px 0;}
.panel{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; margin-bottom:12px;}
.panel h4{font-size:13px; font-weight:800; color:var(--green-deep); margin-bottom:9px; letter-spacing:.04em; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.panel h4 .sub{font-weight:700; color:var(--ink-sub); font-size:11.5px;}
.dhead h2{font-size:18.5px; font-weight:800; line-height:1.5;}
.dhead .meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center;}
.dhead .src{font-size:12.5px; color:var(--ink-sub); font-weight:700; margin-top:8px; line-height:1.8;}
.dhead .src a{color:var(--profit); font-weight:800; text-decoration:underline; cursor:pointer;}
/* 写真ストリップ */
.photos{display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px;}
.photos .ph{
  flex:none; width:132px; height:99px; border-radius:8px; border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  font-size:26px; cursor:pointer; position:relative;
  background:linear-gradient(150deg,#e6ebe4,#cbd7cd);
}
.photos .ph small{font-size:10px; font-weight:800; color:#3c4440; background:rgba(255,255,255,.75); border-radius:4px; padding:1px 7px;}
.photos .ph:hover{border-color:var(--green);}
.photos .add{background:#fff; border:2px dashed #b5c2b8; color:var(--ink-sub); font-size:13px; font-weight:800;}
/* 3DCGビューア枠 */
.cgbox{
  border-radius:10px; border:1px solid var(--line); height:210px; position:relative; overflow:hidden;
  background:radial-gradient(ellipse at 55% 35%, #3c4a54, #232b31 75%);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:#dfe7ea;
}
.cgbox .obj{font-size:52px; animation:rot 7s linear infinite; display:inline-block;}
@keyframes rot{0%{transform:rotateY(0) rotateX(8deg);}100%{transform:rotateY(360deg) rotateX(8deg);}}
.cgbox .cap{font-size:12px; font-weight:800; letter-spacing:.05em; opacity:.85;}
.cgbox .ctrl{position:absolute; bottom:8px; right:8px; display:flex; gap:6px;}
.cgbox .ctrl button{background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:6px; padding:5px 11px; font-size:11.5px; font-weight:800; cursor:pointer;}
.cgbox .ctrl button:hover{background:rgba(255,255,255,.26);}
.cgbox .nocg{font-size:13px; font-weight:800; opacity:.8;}
/* 工程リスト */
.steps-list{display:flex; flex-direction:column; gap:6px;}
.step{
  display:flex; gap:10px; align-items:flex-start; background:#fbfcfa; border:1px solid #e5eae3;
  border-radius:8px; padding:8px 11px; transition:background .25s, border-color .25s;
}
.step .no{flex:none; width:23px; height:23px; border-radius:50%; background:var(--green-lite); color:var(--green-deep); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px;}
.step .bd{font-size:13.5px; line-height:1.65;}
.step .bd b{font-weight:800;}
.step .bd small{display:block; color:var(--ink-sub); font-size:11.5px; font-weight:700;}
.step.hl{background:var(--green-lite); border-color:var(--green);}
.step.hl .no{background:var(--green); color:#fff;}
/* 注意点パネル（ここが金） */
.caution{background:#fdf6f5; border:1.5px solid #e8b0a8; border-radius:var(--radius); padding:13px 14px; margin-bottom:12px;}
.caution h4{font-size:13px; font-weight:800; color:var(--warn); margin-bottom:9px; letter-spacing:.04em;}
.caution ul{list-style:none; display:flex; flex-direction:column; gap:7px;}
.caution li{font-size:13.5px; line-height:1.7; padding-left:22px; position:relative;}
.caution li::before{content:"⚠️"; position:absolute; left:0; font-size:12px; top:2px;}
.caution li b{color:var(--warn);}
/* アクション */
.actrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.btn-ok{background:var(--green); color:#fff; border:0; border-radius:7px; padding:12px 24px; font-size:14.5px; font-weight:800; cursor:pointer; letter-spacing:.04em;}
.btn-ok:hover{background:var(--green-deep);}
.btn-ghost{background:#fff; border:2px solid var(--green); color:var(--green-deep); border-radius:7px; padding:10px 16px; font-size:13.5px; font-weight:800; cursor:pointer;}
.btn-ghost:hover{background:var(--green-lite);}
.btn-mini{background:#fff; border:1.5px solid var(--green); color:var(--green-deep); border-radius:6px; padding:6px 12px; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap;}
.btn-mini:hover{background:var(--green-lite);}
.hint{font-size:12.5px; color:var(--ink-sub); line-height:1.75;}
.empty{padding:40px 16px; text-align:center; color:var(--ink-sub); font-size:14px; line-height:2;}
/* 類似納まり */
.similar{display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px;}
.similar .sm{flex:none; width:168px; background:#fbfcfa; border:1px solid var(--line); border-radius:8px; padding:9px 10px; cursor:pointer; font-size:12px; font-weight:800; line-height:1.5;}
.similar .sm:hover{border-color:var(--green); background:var(--green-lite);}
.similar .sm small{display:block; color:var(--ink-sub); font-weight:700; font-size:10.5px; margin-top:3px;}
/* ---------- モーダル ---------- */
.modal-bg{display:none; position:fixed; inset:0; background:rgba(20,26,22,.5); z-index:60; align-items:center; justify-content:center; padding:14px;}
.modal-bg.open{display:flex;}
.modal{background:#fff; border-radius:12px; max-width:520px; width:100%; max-height:88dvh; overflow-y:auto; padding:18px;}
.modal h3{font-size:16px; font-weight:800; color:var(--green-deep); margin-bottom:12px;}
.modal .mrow2{display:flex; gap:10px; margin-top:14px; justify-content:flex-end; flex-wrap:wrap;}
.modal .pick{display:flex; flex-direction:column; gap:8px;}
.modal .pick .gc{border:1.5px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; font-size:13.5px; font-weight:800; line-height:1.6;}
.modal .pick .gc:hover{border-color:var(--green); background:var(--green-lite);}
.modal .pick .gc small{display:block; font-weight:700; color:var(--ink-sub); font-size:11.5px;}
.regform{display:grid; grid-template-columns:88px 1fr; gap:9px 10px; align-items:center; font-size:13.5px;}
.regform label{font-weight:800; color:var(--ink-sub);}
.regform input,.regform select,.regform textarea{padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; font-family:inherit;}
.regform input:focus,.regform select:focus,.regform textarea:focus{border-color:var(--green); outline:none;}
.regform textarea{grid-column:1/-1; min-height:64px; resize:vertical;}
.regform .full{grid-column:1/-1;}
/* ---------- トースト ---------- */
#toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(20px);
  background:#202623; color:#fff; padding:11px 20px; border-radius:9px; font-size:14px; font-weight:700;
  opacity:0; pointer-events:none; transition:.25s; z-index:99; max-width:90vw; text-align:center; line-height:1.6;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
/* ---------- 下部ナビ ---------- */
nav{
  flex:none;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,#1f5c36,#153f25);
  display:flex; gap:3px; padding:2px 7px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:calc(2px + env(safe-area-inset-bottom)); /* 端末下端の見切れ防止（rev.04 ③） */
  border-top:2px solid #0d2a18;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
}
nav::-webkit-scrollbar{display:none;}
nav .ni{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfe6d6;
  font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;
  transition:transform .06s;
}
nav .ni .ic{font-size:19px; line-height:1; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));}
nav .ni:hover{background:rgba(255,255,255,.10);}
nav .ni:active{transform:translateY(1px);}
nav .ni.on{
  background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));
  color:#4d3a00; border:1.5px solid #a87f00;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #7d5f00;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
/* ---------- 画像アイコンボタン（ナビ改修指示書 Step3） ---------- */
nav .ni .ic img, nav#nav .ni .ic img{height:44px; display:block;}
nav .ni.hasimg, nav#nav .ni.hasimg{padding:0 3px; margin-top:-13px;}
nav .ni.hasimg > span:last-child, nav#nav .ni.hasimg > span:last-child{display:none;}
nav .ni.hasimg .ic, nav#nav .ni.hasimg .ic{filter:none;}
nav .ni.hasimg.on, nav#nav .ni.hasimg.on{background:none; border:none; box-shadow:none; text-shadow:none;
  filter:drop-shadow(0 0 5px #ffd23f) drop-shadow(0 0 2px #ffd23f);
  transform:scale(1.14);
  transform-origin:center bottom;
  z-index:2; position:relative;
}
nav .ni.hasimg, nav#nav .ni.hasimg{transition:transform .15s ease-out, filter .15s ease-out;}
nav .ni.hasimg:hover, nav#nav .ni.hasimg:hover{transform:scale(1.06);}
nav .ni.hasimg.on:hover, nav#nav .ni.hasimg.on:hover{transform:scale(1.14);}
nav, nav#nav{overflow:visible; padding-top:2px;}
@media (max-width:760px){
  nav, nav#nav{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; justify-content:flex-start;}
  nav::-webkit-scrollbar, nav#nav::-webkit-scrollbar{display:none;}
  nav .ni .ic img, nav#nav .ni .ic img{height:38px;}
  nav .ni.hasimg, nav#nav .ni.hasimg{margin-top:0;}
  nav .ni:first-child, nav#nav .ni:first-child{margin-left:0;}
  nav .ni:last-child, nav#nav .ni:last-child{margin-right:0;}
}
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
/* ---------- タップ演出（shiyo_toroku基準：タッチ発光） ---------- */
@keyframes tapfx-glow{
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
  60%{opacity:.7;}
  100%{opacity:0; transform:translate(-50%,-50%) scale(2.1);}
}
@keyframes tapfx-ring{
  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.45);}
}
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);
  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .55s ease-out forwards;
}
.tapfx::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:2px solid rgba(255,217,77,.9);
  animation:tapfx-ring .55s ease-out forwards;
}
/* ---------- モバイル ---------- */
@media (max-width:640px){
  :root{font-size:14px;}
  header h1{font-size:18px;}
  header .count{display:none;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:8px;}
  .thumb{height:92px; font-size:28px;}
  .wrap{padding:10px 8px 100px;}
  nav .ni{padding:4px 8px; font-size:10px; gap:1px;}
  nav .ni .ic{font-size:19px;}
}
</style>

/* ページ移動：押した瞬間に画面がフェードし始めるので「固まった」感じがなくなる */
window.nnGoPage=function(url){
  /* ★指を離した瞬間（＝タップした瞬間）に、画面いちばん上へ細い進行バーを出す。
     次のページが出来上がるまでの数百ミリ秒、「反応した」ことが必ず目に見える。
     画面は隠さないので、前の画面はそのまま見えたまま。 */
  try{
    if(!document.getElementById('nnbar')){
      const bar=document.createElement('div'); bar.id='nnbar'; bar.innerHTML='<i></i>';
      document.body.appendChild(bar);
      setTimeout(()=>{try{bar.remove();}catch(_){}} ,4000);   /* 念のための自動消去 */
    }
  }catch(_){}
  document.body.classList.add('nn-leaving');
  location.href=url;
};
/* ★先読みの fetch は削除（2026-07-28）。
   ページは端末に保存済みなので先読みの意味がなく、指が触れた瞬間に
   別の取得処理を走らせることで、肝心の画面移動と処理を取り合っていた。 */
function buildNav(){
  const n=document.getElementById('nav');
  n.innerHTML=NAV.map(([k,l])=>{
    const suf=(k===NAV_ACTIVE)?'_on':'';
    return `<div class="ni ${k===NAV_ACTIVE?'on':''}" onclick="navGo('${k}','${l}')">
      <span class="ic"><img src="./icons/nav_${k}${suf}.png" alt="${l}"
        onload="this.closest('.ni').classList.add('hasimg')"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='./icons/nav_${k}.png';}
                 else{this.outerHTML=ICONS['${k}']||'▫️';}"></span><span>${l}</span></div>`;
  }).join('');
  /* あふれ時：アクティブなボタンを中央に
     ★位置の計測（scrollWidth や getBoundingClientRect）は「画面をいったん組み上げる」
       処理なので、ここで行うと画面が出るまでの待ち時間が伸びる。
       画面を出したあと（次の描画のタイミング）にまわす。 */
  addEventListener('load',()=>{
    const on=n.querySelector('.ni.on');
    if(on && n.scrollWidth>n.clientWidth){
      const d=on.getBoundingClientRect().left-n.getBoundingClientRect().left;
      n.scrollLeft+=d-(n.clientWidth-on.offsetWidth)/2;
    }
  },{once:true});
}
buildNav();

/* ---------- タップ演出（shiyo_toroku基準：発光＋タップ音） ---------- */
(function(){
  /* ---------- ゲーム風タップ音（Web Audio合成・音源ファイル不要） ---------- */
  let AC=null;
  function ctx(){
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  function tapSound(){
    try{
      const c=ctx(), t=c.currentTime;
      // やわらかい水滴風の「ぽん」：低めのサイン波2音（耳に優しい音量）
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(523,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.06,t+0.010);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.15);
      // 軽く上に抜ける倍音
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(784,t);
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.03,t+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
      o2.connect(g2).connect(c.destination);
      o2.start(t+0.005); o2.stop(t+0.12);
    }catch(e){}
  }

  /* ---------- タッチ発光 ---------- */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    /* ★2026-08-13j パソコンの表示倍率（zoom）で割ること。
       clientX/Y は倍率を**かけた後**のpx、style.left/top は倍率を**かける前**のpx。
       割らないと、大きいモニターほど発光が右下の見当違いな場所に出る（§61の落とし穴）。 */
    const _z=window.nnPZ||1;
    el.style.left=(x/_z)+'px'; el.style.top=(y/_z)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 600);
  }

  /* ---------- イベント委譲 ----------
     発光＝画面のどこを触っても出す（触った場所のフィードバック）
     音　＝押せる要素（ボタン・ナビ・チップ・行）に当たったときだけ鳴らす */
  const PRESSABLE='button, .chip>button, .mk, .mrow, .tabs button, #viewtabs button, .btn-ok, .btn-ghost, .sortbtn, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    /* ★下部ナビは専用の音（nav_move.wav）を鳴らすので、ここでは鳴らさない。
       [onclick] にナビも含まれてしまい、1回のタップで2種類の音が重なって
       「ココンコン」と聞こえていた原因。 */
    const tc=(e.target&&e.target.closest)?e.target:null;
    const hit=(!tc||tc.closest('nav .ni'))?null:tc.closest(PRESSABLE);
    if(hit && !hit.disabled && !hit.classList.contains('soon')){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();

try{ const _r=JSON.parse(localStorage.getItem('nn_lib_reuse')||'{}');
     if(_r && typeof _r==='object' && !Array.isArray(_r)) reuseAdd=_r; }catch(e){}
/* ★2026-08-24v 端末の保存がいっぱいだと localStorage.setItem は例外を投げる。
   受け止めていないと、そこで処理が止まり、利用者には「保存されたつもり」で
   中身だけが消える（いちばん怖い失敗）。受け止めて、理由を知らせる。 */
function nnSet(key, value){
  try{ localStorage.setItem(key, value); return true; }
  catch(err){
    try{ alert('端末の保存容量がいっぱいで保存できませんでした。\n'
      +'古い写真を削除するか、ホームの「設定」からデータを書き出してください。'); }catch(e){}
    return false;
  }
}
function save(){ nnSet('nn_lib_items',JSON.stringify(userItems)); nnSet('nn_lib_reuse',JSON.stringify(reuseAdd)); }
const allItems=()=>[...userItems,...SEED];
const reuseOf=it=>(it.reuse||0)+(reuseAdd[it.id]||0);

/* ================= 検索（AI検索デモ：現場言葉→タグ・本文マッチ） =================
   本実装ではClaude APIで意図解釈→タグ/本文の意味検索。デモは同義語辞書＋部分一致で模擬 */
const SYN={
 'パラペット':['パラペット','立上り','天端'], '低い':['H不足','H250','高さ'],
 'トーチ':['AS-T1','トーチ'], '端末':['端末','押え金物','口開き'],
 '配管':['貫通配管','配管'], '密集':['密集','狭小','ピッチ'],
 'ドレン':['ドレン'], '改修':['改修'],
 '架台':['架台','キュービクル','脚'], '脚':['脚部','脚'],
 '目地':['伸縮目地','目地','ジョイント'], '動く':['挙動','PC板'],
 'ハト小屋':['ハト小屋'], '脱気':['脱気筒'], '入隅':['出入隅','入隅','コーナー'],
 '塩ビ':['塩ビ'], 'ウレタン':['ウレタン','X-1','X-2'], '笠木':['笠木'],
};
let searchState=null; /* {q, ids:[...]} */
function itemText(it){
  return [it.title, it.bui.join(' '), it.kou, it.kbn, it.taishitsu,
    (it.steps||[]).map(s=>s.t+' '+(s.m||'')).join(' '), (it.caution||[]).join(' ')].join(' ');
}
function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(!q){ searchState=null; render(); return; }
  const terms=[];
  Object.keys(SYN).forEach(k=>{ if(q.includes(k)) terms.push(...SYN[k]); });
  if(!terms.length) terms.push(q);
  const scored=allItems().map(it=>{
    const txt=itemText(it);
    let sc=0; terms.forEach(t=>{ if(txt.includes(t))sc++; });
    if(txt.includes(q))sc+=2;
    return {it,sc};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  searchState={q, ids:scored.map(x=>x.it.id)};
  render();
  if(!scored.length) toast('該当する納まりが見つかりませんでした。<br>言い回しを変えるか、絞り込みをお試しください');
}
function clearFilter(){
  document.getElementById('q').value=''; searchState=null;
  ['f-bui','f-kou','f-kbn'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-sort').value='new'; render();
}

/* ================= フィルタ初期化 ================= */
(function(){
  const b=document.getElementById('f-bui'); BUI.forEach(x=>{const o=document.createElement('option');o.textContent=x;b.append(o);});
  const k=document.getElementById('f-kou'); KOU.forEach(x=>{const o=document.createElement('option');o.textContent=x;k.append(o);});
})();

/* ================= 状態・レンダリング ================= */
let detailId=null;
function render(){
  document.getElementById('hcount').textContent=`登録 ${allItems().length}件`;
  const c=document.getElementById('content');
  if(window.nnLibChips)nnLibChips();                    /* 絞り込みチップ（件数つき）を作り直す */
  if(detailId){ renderDetail(c); return; }
  renderGrid(c);
  if(window.nnLibCountShow)nnLibCountShow(filtered().length, allItems().length);
  window.scrollTo(0,0);
}

function filtered(){
  let list=allItems();
  if(window.nnLibPass)list=list.filter(nnLibPass);      /* チップ（複数選べる絞り込み） */
  const fb=document.getElementById('f-bui').value;
  const fk=document.getElementById('f-kou').value;
  const fkb=document.getElementById('f-kbn').value;
  if(fb)list=list.filter(it=>it.bui.includes(fb));
  if(fk)list=list.filter(it=>it.kou===fk);
  if(fkb)list=list.filter(it=>it.kbn===fkb);
  if(searchState){ const order=searchState.ids; list=list.filter(it=>order.includes(it.id)); list.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id)); return list; }
  const s=(window.nnLibSort&&nnLibSort())||document.getElementById('f-sort').value;
  if(s==='reuse')list.sort((a,b)=>reuseOf(b)-reuseOf(a));
  else if(s==='warn')list.sort((a,b)=>(b.warn?1:0)-(a.warn?1:0));
  else list.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return list;
}

function renderGrid(c){
  const list=filtered();
  const note = searchState
    ? `<div class="result-note">✨「<b>${esc(searchState.q)}</b>」の検索結果：${list.length}件　<span style="cursor:pointer;text-decoration:underline;color:var(--warn)" onclick="clearFilter()">検索を解除</span><br><span style="font-weight:600">※本実装ではClaudeが意図を解釈し、タグ・工程・注意点まで含めた意味検索を行います（現デモは簡易マッチ）</span></div>`
    : `<div class="result-note lead">現場で撮った写真と、納まりナビで作った納まりCG・工程をひとつのカードにして保管。<b>現場が終わってもノウハウは会社に残ります。</b></div>`;
  if(!list.length){ c.innerHTML=note+'<div class="empty">条件に合う納まりがありません。<br>絞り込みを解除するか、「＋ 納まりを登録」から追加してください。</div>'; return; }
  /* ★2026-08-06j カード → 一覧（行）形式。
     写真が主役のページなので、行の左に大きめのサムネイルを置いて絵は残す。
     行をタップすると今までどおり詳細（openDetail）が全画面で開く。 */
  /* ★2026-08-18a 行を現場記録帳の作法に統一（白地・1px枠・角0・区分色の縦棒・記号バッジ）。
     サムネイルは見本の納まり模式図（icons/lib_th_<id>.png）。ユーザー登録分など絵が無いときは
     onerror で📷の枠に戻る。工法の記号（AS-T1等）は色付きバッジで見分ける。 */
  const spec=k=>{const m=String(k).match(/^([A-Z]+[A-Z0-9-]*)\s+(.*)$/); return m?{sp:m[1],nm:m[2]}:{sp:'',nm:k};};
  const spCls=sp=>/^AS/.test(sp)?'b-as':(/^X/.test(sp)?'b-x':(/^S/.test(sp)?'b-s':'b-etc'));
  c.innerHTML = note + `<div class="llist">`+ list.map(it=>{
    const k=spec(it.kou);
    return `
    <div class="lr2 ${it.kbn==='改修'?'k-kai':'k-shin'}" onclick="openDetail('${it.id}')">
      <div class="l2th"><img src="${it.thumb||('./icons/lib_th_'+it.id+'.png')}" alt=""
          onerror="this.parentElement.classList.add('noimg');this.remove()">
        <span class="pc">📷${(it.photos||[]).length}</span>
        ${it.cg?'<span class="cg">3DCG</span>':''}
      </div>
      <div class="l2bd">
        <div class="l2tt">${esc(it.title)}</div>
        <div class="l2tags">
          ${it.warn?'<span class="tag lwarn">⚠ 注意あり</span>':''}
          ${k.sp?`<span class="l2sp ${spCls(k.sp)}">${esc(k.sp)}</span>`:''}
          <span class="tag kou">${esc(k.nm||it.kou)}</span>
          ${it.bui.slice(0,3).map(b=>`<span class="tag bui">${esc(b)}</span>`).join('')}
          <span class="tag ${it.kbn==='改修'?'kbn-kai':'kbn-shin'}">${esc(it.kbn)}</span>
          ${it.share==='private'?'<span class="tag share">🔒</span>':''}
        </div>
      </div>
      <div class="l2mt">
        <span class="d">${esc(String(it.date).slice(0,7).replace('-','/'))}</span>
        <span class="re">↺ ${reuseOf(it)}回</span>
        <span class="ar">›</span>
      </div>
    </div>`;}).join('') + `</div>`;
}

/* ================= 詳細 ================= */
function openDetail(id){ detailId=id; render(); }
function similarOf(it){
  return allItems().filter(x=>x.id!==it.id &&
    (x.bui.some(b=>it.bui.includes(b)) || x.kou===it.kou))
    .sort((a,b)=>reuseOf(b)-reuseOf(a)).slice(0,4);
}
function renderDetail(c){

  c.innerHTML=`
  <div class="detail-top"><button class="back-list" onclick="detailId=null;render()">← ライブラリ一覧へ戻る</button></div>
  <div class="panel dhead">
    <h2>${esc(it.title)}</h2>
    <div class="meta">
      ${it.bui.map(b=>`<span class="tag bui">${esc(b)}</span>`).join('')}
      <span class="tag kou">${esc(it.kou)}</span>
      <span class="tag ${it.kbn==='改修'?'kbn-kai':'kbn-shin'}">${esc(it.kbn)}</span>

      ${it.share==='private'
        ?`<span class="tag share" style="cursor:pointer" onclick="toggleShare('${it.id}')">🔒 自分のみ（タップで社内共有）</span>`

    </div>
    <div class="src">出典現場：<a onclick="toast('現場記録帳の該当物件を開きます（記録帳デモと連動想定）')">${esc(it.src)}</a>　｜　登録日 ${esc(it.date)}　｜　↺ 転用 ${reuseOf(it)}回</div>
  </div>

  <div class="panel">
    <h4>📷 現場写真 <span class="sub">本実装：カメラ撮影→Claude Visionが部位を自動判定してタグ付け（現調/施工中/完了も自動分類）</span></h4>
    <div class="photos">
      ${(it.photos||[]).map(p=>`<div class="ph" onclick="toast('写真ビューア（デモでは省略）')">📷<small>${esc(p)}</small></div>`).join('')}
      <div class="ph add" onclick="toast('カメラ起動 or 記録帳の写真から選択（本実装）')">＋ 追加</div>
    </div>
  </div>

  <div class="panel">
    <h4>🧊 納まりCG <span class="sub">図面/積算・工法選択で作成した3DCGがここに紐づきます</span></h4>
    ${it.cg?`
    <div class="cgbox">
      <span class="obj">🏗️</span>
      <span class="cap">Three.js 3Dビューア（デモではプレースホルダ表示）</span>
      <div class="ctrl">
        <button onclick="playSteps()">▶ 工程を順に表示</button>
        <button onclick="toast('全画面ビューア（本実装：ピンチ回転・断面表示）')">⛶ 全画面</button>
      </div>
    </div>`:`
    <div class="cgbox"><span class="nocg">この納まりはまだCG未作成です</span>
      <div class="ctrl"><button onclick="toast('図面/積算デモへ（工法選択→3DCG生成）')">＋ CGを作成する</button></div>
    </div>`}
  </div>

  <div class="panel">
    <h4>🛠️ 施工工程 <span class="sub">「▶ 工程を順に表示」でCGと同期して順送りされる想定</span></h4>

        <span class="no">${i+1}</span>

    </div>
  </div>

  ${(it.caution&&it.caution.length)?`
  <div class="caution">

      :'<div class="hint">類似の登録はまだありません。</div>'}
  </div>

  <div class="panel">
    <div class="actrow">
      <button class="btn-ok" style="flex:1;min-width:190px" onclick="openReuse('${it.id}')">↺ この納まりを現場に転用</button>
      <button class="btn-ghost" onclick="toast('納まりカードPDFを出力しました（本実装）<br>写真＋CG＋工程＋注意点が1枚に。元請への提案資料にそのまま使えます')">📄 PDF出力</button>
      <button class="btn-mini" onclick="toast('共有リンクをコピーしました（本実装：社内メンバー・手間請けの割当情報として閲覧可）')">🔗 共有リンク</button>
    </div>
    <div class="hint" style="margin-top:9px">※ 転用すると、この納まりのCG・工程・注意点が対象現場の記録帳「保管資料」にコピーされ、割付図・見積の下敷きにできます。</div>
  </div>`;
  window.scrollTo(0,0);
}

/* 工程順送りハイライト（工程アニメの体験用） */
let playTm=null;
function playSteps(){
  const it=allItems().find(x=>x.id===detailId); if(!it)return;
  clearInterval(playTm);
  let i=-1;
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('hl'));
  playTm=setInterval(()=>{
    i++;
    if(i>=(it.steps||[]).length){ clearInterval(playTm); setTimeout(()=>document.querySelectorAll('.step').forEach(s=>s.classList.remove('hl')),900); return; }
    document.querySelectorAll('.step').forEach(s=>s.classList.remove('hl'));
    const el=document.getElementById('st'+i);
    if(el){ el.classList.add('hl'); el.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  },1000);
  toast('▶ 本実装ではCGの工程アニメと同期して再生されます');
}

function toggleShare(id){
  const u=userItems.find(x=>x.id===id);
  if(u){ u.share=u.share==='private'?'company':'private'; save(); }
  else{ const s=SEED.find(x=>x.id===id); if(s) s.share=s.share==='private'?'company':'private'; }
  render();
  toast('共有範囲を変更しました');
}

/* ================= 転用モーダル ================= */
function openReuse(id){
  const it=allItems().find(x=>x.id===id); if(!it)return;
  const bg=document.getElementById('modal'), b=document.getElementById('modalBody');
  b.innerHTML=`<h3>↺ 転用先の現場を選ぶ</h3>
    <div class="hint" style="margin-bottom:10px">「${esc(it.title)}」のCG・工程・注意点を、選んだ現場の記録帳（保管資料）にコピーします。</div>
    <div class="pick">
      ${GENBA.map(g=>`<div class="gc" onclick="doReuse('${it.id}','${g.id}')">${esc(g.name)}<small>${esc(g.st)}</small></div>`).join('')}
    </div>
    <div class="mrow2"><button class="btn-ghost" onclick="closeModal()">キャンセル</button></div>`;
  bg.classList.add('open');
}
function doReuse(id,gid){
  reuseAdd[id]=(reuseAdd[id]||0)+1; save(); closeModal(); render();
  const g=GENBA.find(x=>x.id===gid);
  toast(`↺「${esc(g.name)}」に転用しました<br>記録帳の保管資料に納まりカードが追加されます`);
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

/* ================= 新規登録 ================= */
function openReg(){
  const bg=document.getElementById('modal'), b=document.getElementById('modalBody');
  b.innerHTML=`<h3>＋ 納まりを登録</h3>
    <div class="hint" style="margin-bottom:11px">本実装では、カメラ撮影→Claude Visionが部位・区分を自動サジェストし、確認するだけで登録できます（撮ったら8割終わり）。</div>
    <div class="regform">
      <label>タイトル</label><input id="r-title" placeholder="例：笠木ジョイント下の口開き補修">
      <label>部位</label><select id="r-bui">${BUI.map(x=>`<option>${x}</option>`).join('')}</select>
      <label>工法</label><select id="r-kou">${KOU.map(x=>`<option>${x}</option>`).join('')}</select>
      <label>区分</label><select id="r-kbn"><option>改修</option><option>新築</option></select>
      <label>躯体・下地</label><input id="r-tai" placeholder="例：RC造・既存シート撤去">
      <label>出典現場</label><input id="r-src" placeholder="例：〇〇ビル改修（2026/7）">
      <label class="full">⚠️ 注意点・しくじりメモ（任意・でも一番大事）</label>
      <textarea id="r-caution" placeholder="例：この納まりは〇〇すると漏る／□□を先に確認しないと手戻りになる"></textarea>
    </div>
    <div class="mrow2">
      <button class="btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn-ok" onclick="doReg()">登録する</button>
    </div>`;
  bg.classList.add('open');
}
function doReg(){
  const title=document.getElementById('r-title').value.trim();
  if(!title){ toast('タイトルを入力してください'); return; }
  const it={ id:uid(), title,
    bui:[document.getElementById('r-bui').value],
    kou:document.getElementById('r-kou').value,
    kbn:document.getElementById('r-kbn').value,
    taishitsu:document.getElementById('r-tai').value||'—',
    src:document.getElementById('r-src').value||'（未記入）',
    date:new Date().toISOString().slice(0,10),
    reuse:0, share:'private', cg:false,
    warn:!!document.getElementById('r-caution').value.trim(),
    photos:['現調写真（デモ）'],
    steps:[{t:'（工程は後から追記できます）', m:'—'}],
    caution:document.getElementById('r-caution').value.trim()?[esc(document.getElementById('r-caution').value.trim())]:[] };
  userItems.unshift(it); save(); closeModal();
  detailId=it.id; render();
  toast('登録しました（🔒自分のみ）。<br>内容を確認して社内共有に切り替えられます');
}

/* ★2026-07-28 表示を速くする：一覧の組み立ては「画面の枠を出したあと」に回す。
   同時にやると、全部の配置計算が終わるまで画面が出ず、

   端末には速さのためページを保存しているので、こちらで直しても
   古いものが出続けることがある。そこで ver.txt（数バイト）だけを

const NN_VER='2026-08-28k';
/* ============ 表示にかかった時間の記録（原因調査用・2026-07-28） ============
   スマホの実機でどこに時間がかかっているかを数字で出す。
   ・net  ＝ページを要求してから最初の返事が来るまで（通信の待ち）
   ・recv ＝中身を受け取り終わるまで
   ・build＝受け取ってから組み立て終わるまで（解析・JS実行）

addEventListener('load',()=>{setTimeout(()=>{

   ・毎回「新しい版が出ていないか」を確認する（r.update()）
   ・新しい版に切り替わったら、その場で1回だけ自動で読み込み直す
     （＝「再読み込み2回」が不要になり、直したことが必ず反映される） */
/* ★2026-07-28 検証：サービスワーカーを一時的に止める
   ホーム(37KB)も現場記録帳(300KB)も、どちらもタップから約0.9秒。
   中身の重さが10倍近く違うのに時間が同じ＝ページの組み立てではなく、
   移動のたびにかかる「決まった待ち時間」がある、ということ。
   iPhoneのSafariでは、この保存の仕組み（サービスワーカー）が
   眠っていると、移動のたびに起こす時間が数百ミリ秒かかることが知られている。
   → いったん止めて、これが原因かを確かめる。
   NN_USE_SW を true に戻せば、オフライン対応ごと元に戻せる。 */
const NN_USE_SW=false;
if('serviceWorker' in navigator){
  if(NN_USE_SW){
    let nnReloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(nnReloaded)return; nnReloaded=true; location.reload();
    });
    addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(r=>{
        try{r.update();}catch(_){}
        if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage('nn-precache');
      }).catch(()=>{});

    addEventListener('load',async()=>{
      try{
        const rs=await navigator.serviceWorker.getRegistrations();
        if(rs.length){
          await Promise.all(rs.map(r=>r.unregister()));
          if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));}
          if(!sessionStorage.getItem('nnSwOff')){ sessionStorage.setItem('nnSwOff','1'); location.reload(); }

      }catch(_){}
    });
  }
}

     → 装置は「画面のどこかを最初に触った時点」で作って動かしておく。

    const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t);        /* ラの音・単純でやわらかい */
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.38,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.07);
  }

  /* ★2026-07-31 「鳴ったり鳴らなかったり」の直し方
     iPhoneは、ページを開いた直後の音の装置が「止まった状態」で始まる。
     動き出す（resume）のは少し後なので、押してすぐ画面が変わると
     音が鳴る前に前のページが消えてしまう＝無音になっていた。
     そこで
       ・鳴らせたかどうかを返す（true＝すぐ鳴った）
       ・すぐ鳴らせなかったときは、動き出したら鳴らす（nnSoundReady で待てる）
     ようにして、ナビ側が「音が出るのを待ってから画面を移る」ようにした。 */
  window.nnSoundReady=null;
  window.nnMoveSound=function(){
    const now=Date.now(); if(now-last<160)return true; last=now;   /* 連続再生を抑える */
    try{
      const c=ensureRunning(); if(!c)return true;
      if(c.state==='running'){ beep(c); return true; }
      /* まだ動いていない：起こしてから鳴らす。ナビ側はこれを待てる */
      window.nnSoundReady=new Promise(function(res){
        let done=false;
        const fin=function(){ if(done)return; done=true; res(); };
        /* ★2026-08-26b 「起きてから鳴らす」だと、起きるのが遅い回は画面が変わって
           鳴らずじまいだった。止まった装置への予約は動き出した瞬間に鳴るので、
           先に鳴る予約だけ入れておく（＝鳴ったり鳴らなかったりの残りを解消）。 */
        try{ beep(c); }catch(_){}
        try{ const p=c.resume(); if(p&&p.then) p.then(fin, fin); else fin(); }catch(_){ fin(); }
        setTimeout(fin, 120);      /* 起きなくても待たせすぎない */
      });
      return false;
    }catch(_){ return true; }
  };
})();
</script>
<script>
/* ============ ナビ：指を触れたまま移動できる操作（2026-07-28 改） ============
   ・指を置いた瞬間にアイコンが光って音が鳴る
   ・そのまま 0.09秒 指が止まっていれば、離すのを待たずに移動する（＝速い）
   ・押したまま横へなぞると指の下のアイコンが反応し、離した先へ移動する
   ・アイコンの外で離せば移動しない（やめられる）
   ============================================================ */
(function(){
  const nav=document.getElementById('nav')||document.querySelector('nav');
  if(!nav)return;
  let dragging=false, cur=null;
  const itemAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('nav .ni'):null; };
  let lastSnd=0;
  function focus(ni){
    if(ni===cur)return;
    if(!ni)return;                     /* アイコンの隙間に指がかかっても、直前の選択を保つ
                                          （指のわずかな揺れで音が連発するのを防ぐ） */
    if(cur)cur.classList.remove('press');
    cur=ni; cur.classList.add('press');
    /* 音を鳴らす。すぐ鳴らせなかったときは、移動を少しだけ待つ（下の go を参照） */
    sndNow=true;
    if(window.nnMoveSound)try{ sndNow=(nnMoveSound()!==false); }catch(_){}
    /* ★先読みの fetch は削除（2026-07-28）。移動処理と取り合って遅くなっていた。 */
  }
  /* ★ここが「遅い」の正体だった（2026-07-28 画面録画の実測で判明）
     以前は「指を離したとき」に初めて移動していた。画面録画を1コマずつ調べると、
     アイコンが光ってから画面が変わるまで約0.9秒、その間まったく何も起きていない。
     ＝ページの読み込みが遅いのではなく、指を離すまで移動を始めていなかった。
     そこで「指を置いて 0.09秒たっても動かさなければ、離すのを待たずに移動する」
     方式にした。なぞって選び直したい場合（指を動かした場合）は今までどおり、
     指を離した先のアイコンへ移動する。 */
  const HOLD_MS=90;          /* この時間だけ指が止まっていたら、離すのを待たずに移動 */
  const MOVE_PX=10;          /* この距離より動いたら「なぞり操作」とみなす */
  let goTm=0, downPt=null, gone=false;
  let sndNow=true;
  function go(t){
    if(gone)return;
    if(!t||t.classList.contains('on'))return;
    const m=(t.getAttribute('onclick')||'').match(/navGo\('([^']*)'\s*,\s*'([^']*)'\)/);
    if(!(m&&typeof navGo==='function'))return;
    gone=true;
    /* ★音がすぐ鳴ったときは今までどおり即移動（速さは変えない）。
       鳴らなかったときだけ、音が出るのを最大0.16秒待ってから移動する。 */
    if(sndNow || !window.nnSoundReady){ navGo(m[1],m[2]); return; }
    let moved=false;
    const jump=function(){ if(moved)return; moved=true; navGo(m[1],m[2]); };
    try{ window.nnSoundReady.then(function(){ setTimeout(jump, 30); }); }catch(_){}
    setTimeout(jump, 160);
  }
  function cancelHold(){ if(goTm){clearTimeout(goTm); goTm=0;} }
  nav.addEventListener('pointerdown',e=>{
    const ni=e.target.closest&&e.target.closest('.ni'); if(!ni)return;
    dragging=true; cur=null; gone=false; downPt=[e.clientX,e.clientY]; focus(ni);
    try{nav.setPointerCapture(e.pointerId);}catch(_){}
    cancelHold();
    goTm=setTimeout(()=>{ goTm=0; go(cur); }, HOLD_MS);
  });
  nav.addEventListener('pointermove',e=>{
    if(!dragging)return;
    if(downPt && Math.abs(e.clientX-downPt[0])+Math.abs(e.clientY-downPt[1])>MOVE_PX) cancelHold();
    focus(itemAt(e.clientX,e.clientY));
  });
  function finish(e){
    if(!dragging)return;
    dragging=false; cancelHold();
    const t=cur; if(cur){cur.classList.remove('press'); cur=null;}
    go(t);
  }
  nav.addEventListener('pointerup',finish);
  nav.addEventListener('pointercancel',()=>{dragging=false; cancelHold(); if(cur){cur.classList.remove('press'); cur=null;}});
  /* 上の処理で移動するので、通常のクリックは止める（二重に移動しないように） */
  nav.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); },true);
})();
</script>

<script id="nn-fillh-js">
/* ============================================================
   画面のいちばん下まで使い切る（2026-07-29）
   ・--nnvh ＝ 実際に見えている画面の高さ
   ・表示中の画面（一覧・ダッシュボード等）の下に余りがあれば、そのぶん伸ばす
   　（すき間があるときだけ動くので、余りが無ければ何もしない）
   ============================================================ */
(function(){
  var VIEWS = null;
  /* ホーム画面のアイコンから起動しているか（＝全画面のアプリとして開いているか） */
  function isStandalone(){
    try{
      if(navigator.standalone === true) return true;
      return matchMedia('(display-mode: standalone)').matches
          || matchMedia('(display-mode: fullscreen)').matches;
    }catch(e){ return false; }
  }
  /* 画面のいちばん下に貼っておく、見えない1pxの目印。
     ★iPhoneをたてに持つと、端末が申告してくる「画面の高さ」が
       実際に見えている高さより小さいことがある（このページのように
       画面を縮めて表示していると起きる）。その申告値をそのまま使うと、
       画面の下のほうに何も置かれない帯（すき間）が残ってしまう。
       目印は画面の下端に貼り付いているので、その位置を測れば
       「本当の下端」が分かる。 */
  var probe = null;
  function probeBottom(){
    if(!probe || !probe.parentNode){
      probe = document.createElement('div');
      probe.id = 'nnBtmProbe';
      probe.setAttribute('style','position:fixed;left:0;bottom:0;width:1px;height:1px;'
        + 'pointer-events:none;opacity:0;z-index:-1;');
      (document.body || document.documentElement).appendChild(probe);
    }
    return probe.getBoundingClientRect().bottom;
  }
  function pageH(){
    var vv = window.visualViewport;
    var h = innerHeight;
    /* 文字入力でキーボードが出ると visualViewport は小さくなるので、大きいほうを採る */
    if(vv && vv.height > h) h = vv.height;
    /* 目印のほうが下にあれば、そちらが本当の下端。
       ブラウザで開いているときは下のバーの分だけ縮むのが正しいので、この直しは
       ホーム画面から起動したときだけ効かせる。あり得ない大きさは念のため採らない。 */
    if(isStandalone()){
      var t = probeBottom();
      if(t > h + 1 && t < h * 3) h = t;
      /* ★2026-08-27a ホーム画面起動＝全画面なので、画面そのもの（screen）の高さが本当の高さ。
         申告(innerHeight)・visualViewport・目印のすべてが小さいまま嘘をつく端末があり
         （実機スクショの実測：中身が60pt短く、その下にページの背景色が塗られていた）、
         その場合は screen だけが正しい。
         ・iPhoneの screen は向きに関係なく「たて向きの値」なので、よこ向きは短い方を使う
         ・縮小して表示するページ（width=980）ではCSSのpxと合わないが、
           そのときは h が screen よりずっと大きいので下の条件に入らない（保護） */
      var scH = (innerWidth > innerHeight) ? Math.min(screen.width, screen.height)
                                           : Math.max(screen.width, screen.height);
      var scW = (innerWidth > innerHeight) ? Math.max(screen.width, screen.height)
                                           : Math.min(screen.width, screen.height);
      /* ★2026-08-27h 縮小して表示するページ（width=980）は、CSSのpxと画面のptが合わない。
         「画面の1pt＝CSSの何px」（innerWidth÷画面の幅）を掛けて、CSSのpxに直してから比べる。
         等倍のページでは innerWidth＝画面の幅なので倍率1＝今までと同じ。
         （直す前は pt のまま比べていたため、縮小ページだけこの直しが一度も効かず、
         　下に約60ptの帯が残っていた＝実機で発生） */
      var sc = (scW > 0) ? scH * (innerWidth / scW) : scH;

    }
    return Math.round(h);
  }

     この処理は画面の高さを測り直すので、そのたびに**画面ぜんぶの置き場所の計算**が走る。
     ・窓の大きさ ・下部ナビの出入り ・表示中の画面 ・表示倍率
     のどれも変わっていなければ、測らずにそのまま戻る（見え方は今までどおり）。
     中身の高さが変わったときは、呼ぶ側が fill(true) で「必ず測る」と伝える。 */
  var _fsig='';
  function fillSig(){
    var vv=window.visualViewport, nav=document.getElementById('nav');
    var s=[window.innerWidth, window.innerHeight,
           vv?Math.round(vv.width)+'x'+Math.round(vv.height):'-',
           nav?(nav.style.marginBottom+'|'+nav.style.transform+'|'+nav.className):'-',
           window.nnPZ||1];
    /* ★2026-08-26b ホーム画面から起動したiPhoneは、innerHeight が実際より小さい値の
       まま変わらないことがある（§5-2）。本当の下端（目印）は起動の少し後に伸びるが、
       申告値だけを見る合図では「変わっていない」ことになり、
       「変わったときだけ測る」（2026-08-24ab）が一度も測り直さない
       ＝画面の下に黒い帯が残っていた（実機で発生）。目印も合図に入れる。 */
    if(isStandalone()) s.push(Math.round(probeBottom()));
    if(VIEWS) for(var i=0;i<VIEWS.length;i++){
      var e=document.getElementById(VIEWS[i]);
      s.push(e?(e.className+'/'+(e.style.display||'')):'-');
    }
    return s.join(',');
  }
  function fill(force){
    if(!force){ var sg=fillSig(); if(sg===_fsig) return; _fsig=sg; }
    else _fsig=fillSig();

       innerHeight（実画面のpx）をそのまま使うと body の高さが倍率ぶん大きくなる。
       倍率で割って「CSSのpx」に直す。 */
    var _z = window.nnPZ || 1;
    var pb = pageH() / _z;
    document.documentElement.style.setProperty('--nnvh', pb + 'px');
    /* ★2026-08-27h 下部ナビが position:fixed のページ（国交省仕様・現場マップ）では、
       ナビは「申告された画面の下端」に貼り付く。ホーム画面起動のiPhoneが高さを
       実際より小さく申告したままだと（§221）、ナビの下に帯が残る＝CSSでは直せない。
       本当の高さ（pb）との差のぶんだけ下へずらして、本当の下端に貼り直す。
       ふつうの端末・ふつうのページでは差が0なので何も変わらない。 */
    try{
      var _nv=document.getElementById('nav');
      if(_nv && getComputedStyle(_nv).position==='fixed'){
        var _d=Math.round(pb - innerHeight/_z);
        _nv.style.bottom=(_d>2)? (-_d+'px') : '';
      }
      /* ▲（ナビを出すボタン）も fixed なので、同じ差のぶん下げる（負の margin で押し下げる） */
      var _vt=document.getElementById('navShowTab');
      if(_vt){ var _d2=Math.round(pb - innerHeight/_z);
        _vt.style.marginBottom=(_d2>2)? (-_d2+'px') : ''; }
    }catch(_){}
    if(_z !== 1){                      /* 倍率をかけているときは下の余白うめをしない（パソコン用） */
      if(VIEWS) VIEWS.forEach(function(id){ var e=document.getElementById(id); if(e) e.style.minHeight=''; });
      return;
    }
    if(!VIEWS) return;
    var v = null;
    for(var i=0;i<VIEWS.length;i++){
      var e = document.getElementById(VIEWS[i]);
      if(e && e.offsetParent !== null){ v = e; break; }
    }
    if(!v) return;
    /* 下部ナビが場所を取っている高さ（自動で隠れているときは 0） */
    var navOcc = 0;
    var nav = document.getElementById('nav');
    if(nav){
      var ns = getComputedStyle(nav);
      if(ns.display !== 'none' && ns.position !== 'fixed' && ns.position !== 'absolute'){
        var mb = parseFloat(nav.style.marginBottom || '0') || 0;   /* 隠れているときは負の値 */
        navOcc = Math.max(0, nav.offsetHeight + mb);
      }
    }
    if(v.style.minHeight) v.style.minHeight = '';      /* いったん元に戻して測る */
    var r = v.getBoundingClientRect();
    var gap = (pb - navOcc) - r.bottom;                 /* 下に余っている高さ */
    if(gap > 2) v.style.minHeight = Math.round(r.height + gap) + 'px';
  }
  fill(true);
  addEventListener('load', function(){ fill(true); });
  /* ★2026-08-26b 起動直後は画面の高さが何度か変わる（起動アニメ・申告の遅れ）。
     合図が同じでも、最初だけは念のため測り直す（3回だけ・そのあとは今までどおり） */
  [300,1200,3000].forEach(function(t){ setTimeout(function(){ fill(true); }, t); });
  addEventListener('resize', function(){ fill(true); });
  addEventListener('orientationchange', function(){ setTimeout(function(){ fill(true); }, 300); });
  setInterval(fill, 800);        /* ナビの自動開閉・画面の切替に追従する */
  window.nnFillBottom = fill;
})();
</script>

<script id="nn-hdr-std-js">
/* 倍率 --nnhm を計算して渡す（＝そのページの組み立て幅 ÷ 980） */
(function(){
  function set(){
    try{
      /* ★パソコンでは倍率1（＝今までどおり）にすること。
         パソコンのブラウザは viewport の width=980 指定を無視するため、
         画面を縮めて表示していない。ここで innerWidth/980 を掛けると
         ヘッダーだけ1.5倍に膨らんでしまう。 */
      var dev = Math.min(screen.width || 0, screen.height || 0);
      var phone = dev && dev < 700;
      var m = phone ? ((innerWidth || 980) / 980) : 1;
      if(!(m > 0.05 && m < 4)) m = 1;              /* あり得ない値は採らない */
      document.documentElement.style.setProperty('--nnhm', m.toFixed(4));
      /* ノッチの逃げの割り増し（＝そのページの縮小率の逆数）。
         いま向いている方の画面の幅で計算すること。 */
      var pr = true;
      try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = innerHeight > innerWidth; }
      var scr = pr ? Math.min(screen.width||0, screen.height||0) : Math.max(screen.width||0, screen.height||0);
      var saf = (phone && scr > 0) ? ((innerWidth || scr) / scr) : 1;
      if(!(saf > 0.5 && saf < 5)) saf = 1;
      document.documentElement.style.setProperty('--nnsaf', saf.toFixed(4));
    }catch(e){}
  }
  set();
  addEventListener('resize', set);
  addEventListener('orientationchange', function(){ setTimeout(set, 300); });
  addEventListener('load', set, {once:true});
})();
</script>

}
function closeMenu(){ open=null; const p=document.getElementById('nnLibPortal'); if(p)p.classList.remove('open');
  document.querySelectorAll('#lchips .lfil>button.open').forEach(b=>b.classList.remove('open')); }
window.nnLibCloseMenu=closeMenu;
document.addEventListener('pointerdown',e=>{
  if(Date.now()-(window.__nnLibTap||0)<60)return;
  if(e.target.closest&&(e.target.closest('#nnLibPortal')||e.target.closest('#lchips')))return;
  closeMenu();
});
function showMenu(key, btn, html){
  const p=portal(); p.innerHTML=html; p.classList.add('open');
  const b=btn.getBoundingClientRect();
  p.style.maxHeight=Math.max(140,Math.min(320, innerHeight-b.bottom-16))+'px';
  p.style.top=Math.min(b.bottom+4, innerHeight-160)+'px';
  p.style.left=Math.max(6, Math.min(b.left, innerWidth-p.offsetWidth-6))+'px';
  open=key;
}
window.nnLibToggle=function(e,key){
  e.stopPropagation(); if(e.preventDefault)e.preventDefault();
  window.__nnLibTap=Date.now();
  const btn=e.target.closest('.lfil').querySelector('button');
  if(open===key){ closeMenu(); return; }
  closeMenu(); btn.classList.add('open');
  showMenu(key, btn, menuHTML(key));
};
function counts(f){
  const m=new Map();
  (typeof allItems==='function'?allItems():[]).forEach(it=>{
    (f.vals(it)||[]).forEach(v=>{ if(v==null||v==='')return; m.set(v,(m.get(v)||0)+1); });
  });
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
function menuHTML(key){
  if(key==='sort'){
    return '<div class="dfclear" onclick="nnLibSetSort(\'new\')">✕ 並びを既定（新しい順）に戻す</div>'
      + SORTS.map(([v,lb])=>'<div class="dfrow'+(sortKey===v?' sel':'')+'" onclick="nnLibSetSort(\''+v+'\')"><span class="vn">'+lb+'</span></div>').join('');
  }
  const f=FIL.find(x=>x.k===key); if(!f)return '';
  const rows=counts(f).map(([v,c],i)=>
    '<label class="dfrow"><input type="checkbox" '+(sel[key].has(v)?'checked':'')+
    ' onchange="nnLibChk(\''+key+'\',this.getAttribute(\'data-v\'))" data-v="'+String(v).replace(/"/g,'&quot;')+'">'+
    '<span class="vn">'+v+'</span><span class="vc">'+c+'件</span></label>').join('');
  return '<div class="dfclear" onclick="nnLibClear(\''+key+'\')">✕ すべて解除（全件に戻す）</div>'+rows;
}
window.nnLibChk=function(key,v){
  if(sel[key].has(v))sel[key].delete(v); else sel[key].add(v);
  render();
  /* 開いたままにする */
  const btn=document.querySelector('#lchips .lfil[data-k="'+key+'"] button');
  if(btn){ btn.classList.add('open'); showMenu(key, btn, menuHTML(key)); }
};
window.nnLibClear=function(key){ sel[key].clear(); closeMenu(); render(); };
window.nnLibSetSort=function(v){ sortKey=v; closeMenu(); render(); };
window.nnLibClearAll=function(){ FIL.forEach(f=>sel[f.k].clear()); sortKey='new'; closeMenu(); render(); };

/* --- チップを作り直す（件数つき） --- */
window.nnLibChips=function(){
  const wrap=document.getElementById('lchips'); if(!wrap)return;
  const any=FIL.some(f=>sel[f.k].size)||sortKey!=='new';
  wrap.innerHTML=FIL.map(f=>
    '<span class="lfil" data-k="'+f.k+'"><button type="button" class="'+(sel[f.k].size?'on':'')+'"'+
    ' onpointerdown="nnLibToggle(event,\''+f.k+'\')" onclick="event.preventDefault();event.stopPropagation();">'+
    f.label+(sel[f.k].size?'<b>'+sel[f.k].size+'</b>':'')+'<span class="car">▼</span></button></span>').join('')
    +'<span class="lfil" data-k="sort"><button type="button" class="'+(sortKey!=='new'?'on':'')+'"'+
    ' onpointerdown="nnLibToggle(event,\'sort\')" onclick="event.preventDefault();event.stopPropagation();">'+
    '並び<span class="car">▼</span></button></span>'
    +(any?'<span class="lfil"><button type="button" onclick="nnLibClearAll()">✕ 解除</button></span>':'');
};
/* 既存の「クリア」からも解除できるように */
const oldClear=window.clearFilter;
window.clearFilter=function(){ FIL.forEach(f=>sel[f.k].clear()); sortKey='new'; closeMenu(); if(oldClear)oldClear(); else render(); };
addEventListener('resize',closeMenu);
try{ render(); }catch(_){}
})();
</script>

<style id="nn-pczoom">
/* ★2026-08-11a パソコンの「表示の大きさ」をモニターに関わらずそろえる（本人の指示）

   同じ拡大100%でも、大きいモニター（横に広い）ほど1画面に入るpxが増えるので、

     倍率 ＝ 画面の横幅 ÷ 1600px（1.00〜1.60の範囲）

</style>
<script id="nn-pczoom-js">
(function(){
  if(document.documentElement.getAttribute('data-nnphone')==='1'){ window.nnPZ=1; return; }
  var BASE=1600, MINZ=1.00, MAXZ=1.60;
  function autoZ(){
    var z=(window.innerWidth||1600)/BASE;
    z=Math.round(z*20)/20;                       /* 0.05きざみ */
    return Math.min(MAXZ, Math.max(MINZ, z));
  }
  function apply(){
    var z=autoZ();
    window.nnPZ=z;
    document.documentElement.style.zoom = (z===1 ? '' : z);
    document.documentElement.style.setProperty('--nnpzr', z);
    document.documentElement.setAttribute('data-nnpz', z===1 ? 'off' : 'on');
    try{ if(window.nnFillBottom) window.nnFillBottom(); }catch(e){}
    try{ if(window.nnFitMapApp) window.nnFitMapApp(); }catch(e){}
    try{ if(window.nnSecRefresh) window.nnSecRefresh(); }catch(e){}
  }
  apply();
  addEventListener('resize', apply);
})();
</script>

html[data-nnphone="1"] .proc-card > h4{
  padding-bottom:4px !important; margin-bottom:6px !important; }
</style>
<script id="nn-httl-js">
/* 見出しの文字だけを span.httl で包む。
   ★右端に置く補助の文字（.r／.cta など）は包まない＝タグの外に残す。
   ★中身を作り直すページ（国交省仕様・ライブラリ等）があるので、
     作り直されたら包み直す（MutationObserver・0.2秒のまとめ）。 */
(function(){
  var SEL='.panel > h4, .wr-box > h4, .dpanel > h4, .proc-card > h4, .notebox-h > h4';
  var STOP=/(^|\s)(r|cta|zx|colgear|sub|hcount|tag)(\s|$)/;
  function wrap(h){
    if(h.getAttribute('data-nnht')==='1') return;
    if(h.querySelector('.httl')){ h.setAttribute('data-nnht','1'); return; }
    var kids=[].slice.call(h.childNodes);
    var sp=document.createElement('span'); sp.className='httl';
    for(var i=0;i<kids.length;i++){
      var n=kids[i];
      if(n.nodeType===1 && STOP.test(' '+String(n.className||'')+' ')) break;
      sp.appendChild(n);
    }
    if(!String(sp.textContent||'').trim()){        /* 包むものが無いときは何もしない */
      while(sp.firstChild) h.insertBefore(sp.firstChild, h.firstChild);
      return;
    }
    h.insertBefore(sp, h.firstChild);
    h.setAttribute('data-nnht','1');
  }
  function run(){ try{ [].forEach.call(document.querySelectorAll(SEL), wrap); }catch(e){} }
  if(document.readyState==='loading') addEventListener('DOMContentLoaded',run); else run();
  addEventListener('load',function(){ setTimeout(run,200); });
  try{
    var t=null;
    new MutationObserver(function(){ if(t)return; t=setTimeout(function(){ t=null; run(); },200); })
      .observe(document.body,{childList:true,subtree:true});
  }catch(e){}
})();
</script>

<script id="nn-trail-js">
/* ============================================================
   指をなぞると光がついてくる（2026-08-19b・本人の指示）
   線を引く・頂点をつまむ等の細かい操作で「いま指がどこにあるか」が分かるようにする。
   ・画面いっぱいの透明なキャンバスを1枚だけ用意し、指が触れている間だけ描く
   ・座標は clientX/Y をそのまま「画面の実px」として使う（表示倍率 zoom の影響を受けない）
   ・pointer-events:none なので、下のボタンや作図の邪魔は一切しない
   ============================================================ */
(function(){
"use strict";
var cv=null, ctx=null, pts=[], raf=null, active=false, lastT=0;
var LIFE=420;                     /* 光が消えるまで(ms) */
function make(){
  if(cv)return;
  cv=document.createElement('canvas');
  cv.id='nnTrail';
  cv.style.cssText='position:fixed; left:0; top:0; width:100%; height:100%;'
    +'pointer-events:none; z-index:9997;';
  document.body.appendChild(cv);
  ctx=cv.getContext('2d');
}
function fit(){
  var r=cv.getBoundingClientRect();
  /* ★2026-08-26b にじむ光なので等倍で十分。2倍だと描く画素が4倍になり、
     指を置いている間ずっとその分の仕事が挟まっていた（ラグの一因）。 */
  var d=1;
  var w=Math.round(r.width*d), h=Math.round(r.height*d);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  return {r:r, k:cv.width/(r.width||1)};   /* k＝画面px→キャンバスpxの倍率（＝dpr） */
}
function draw(){
  if(!cv){ raf=null; return; }
  var g=fit(), k=g.k, now=performance.now();
  ctx.clearRect(0,0,cv.width,cv.height);
  /* 寿命の切れた点を落とす */
  while(pts.length && now-pts[0].t>LIFE) pts.shift();
  if(pts.length>=2){
    /* しっぽ：新しいほど太く明るい */
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var age=(now-b.t)/LIFE; if(age<0)age=0; if(age>1)age=1;
      var al=(1-age)*0.85;
      /* ★2026-08-26b shadowBlur（にじみ）は1本ごとにぼかし計算が走って重いのでやめ、
         「太く薄い線＋細く明るい線」の2度がきで同じ見え方にする */
      ctx.strokeStyle='rgba(255,180,40,'+(al*0.30).toFixed(3)+')';
      ctx.lineWidth=(7+12*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
      ctx.strokeStyle='rgba(255,217,77,'+al.toFixed(3)+')';
      ctx.lineWidth=(2.5+6*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
    }
  }
  /* 指の先の光 */
  if(active && pts.length){
    var p=pts[pts.length-1];
    var gr=ctx.createRadialGradient(p.x*k,p.y*k,0, p.x*k,p.y*k,9*k);
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.45,'rgba(255,217,77,.80)');
    gr.addColorStop(1,'rgba(255,157,30,0)');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(p.x*k,p.y*k,9*k,0,7); ctx.fill();
  }
  if(active || pts.length){ raf=requestAnimationFrame(draw); }
  else { raf=null; ctx.clearRect(0,0,cv.width,cv.height); }
}
function add(e){
  var now=performance.now();
  if(now-lastT<8) return;          /* 詰めすぎない */
  lastT=now;
  pts.push({x:e.clientX, y:e.clientY, t:now});
  if(pts.length>90) pts.shift();
  if(!raf) raf=requestAnimationFrame(draw);
}
var downX=0, downY=0, movedOn=false;
addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse' && e.buttons===0) return;
  /* ★2026-08-26b タップ（動かさない指）では何も描かない。
     以前は押した瞬間から画面いっぱいのキャンバスを毎コマ描き直していて、
     ボタンを押すたびにその仕事が挟まっていた（ラグの一因）。
     7px以上なぞったときだけ描き始める（なぞりの光は今までどおり）。 */
  active=true; movedOn=false; downX=e.clientX; downY=e.clientY;
},true);
addEventListener('pointermove',function(e){
  if(!active)return;
  if(!movedOn){
    if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)<7) return;
    movedOn=true; make(); pts.length=0;
    pts.push({x:downX, y:downY, t:performance.now()});
  }
  add(e);
},true);
function end(){ active=false; movedOn=false; if(!raf&&cv&&pts.length) raf=requestAnimationFrame(draw); }
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  addEventListener(ev,end,true);
});
})();
</script>

<script id="nn-persist-js">
/* ★2026-08-20a データ保全：ブラウザに「この保存は消さないで」と頼む。
   頼んでおくと、端末の容量が逼迫したときに localStorage が自動削除されにくくなる
   （iOS/Android とも対応。使えない環境では黙って何もしない）。 */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
</script>

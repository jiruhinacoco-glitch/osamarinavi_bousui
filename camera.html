<style>
/* ============================================================
   納まりナビ カメラ
   撮影 → エッジを引く（角度認識）→ 防水材をエッジに沿って適用
   デザイン言語は各デモと共通（緑ヘッダー／下部ナビ）
   ============================================================ */
:root{
  /* 共通カラーパレットは common.css に移動（--green-deep 等） */
  /* ゲーム風ヘッダー/ナビ用（zairyo基準） */
  --green-hi:#48c274; --green-edge:#124a28;
  --yellow:#ffd94d; --yellow-deep:#f0b400; --warn-deep:#b0392f;
  --stroke-g: 0 1px 1px rgba(18,74,40,.55);
  --profit:#0a6bd6; --warn:#b0392f; --gold:#8a7a2a;
  --radius:10px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); height:100vh; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
.num{font-variant-numeric:tabular-nums;}
header{padding-top:calc(5px + env(safe-area-inset-top)) !important;}
/* 横画面（スマホ）：上部の帯（ヘッダー）を非表示にして表示領域を広げる
   ※タップ高速化とノッチ左右の余白は、文末の nn-tap / nn-safearea ブロック参照 */
@media (orientation:landscape) and (max-height:500px){
  header{display:none !important;}
}
header{
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
    linear-gradient(180deg, var(--green-hi), var(--green) 55%, var(--green-deep));
  color:#fff; display:flex; align-items:center; gap:10px; padding:5px 13px; flex:none;
  border-bottom:2px solid var(--green-edge);
  box-shadow:0 2px 0 rgba(0,0,0,.08);
  position:relative; z-index:20;
}
header .hicon{font-size:19px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));}
header h1{
  font-size:17px; font-weight:900; letter-spacing:.04em;
  text-shadow:var(--stroke-g);
}
header .sub{margin-left:auto; font-size:12px; font-weight:700; opacity:.9; white-space:nowrap; text-shadow:0 1px 0 rgba(0,0,0,.3);}
/* ---------- ステップバー ---------- */
.steps{display:flex; margin:10px 12px 0; background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; flex:none;}
.steps div{flex:1; text-align:center; padding:8px 4px; font-size:12px; font-weight:800; color:var(--ink-sub); background:#f0f2ee; border-right:1px solid var(--line); white-space:nowrap;}
.steps div:last-child{border-right:0;}
.steps div.on{background:var(--green); color:#fff;}
.steps div.ok{background:var(--green-lite); color:var(--green-deep);}
/* ---------- 本体 ---------- */
main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.wrap{max-width:760px; margin:0 auto; padding:10px 12px 110px;}
.panel{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; margin-bottom:11px;}
.panel h4{font-size:13px; font-weight:800; color:var(--green-deep); margin-bottom:9px; letter-spacing:.04em; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.panel h4 .s{font-weight:700; color:var(--ink-sub); font-size:11.5px;}
.hint{font-size:12.5px; color:var(--ink-sub); line-height:1.75;}
.btn-ok{background:var(--green); color:#fff; border:0; border-radius:8px; padding:13px 24px; font-size:15px; font-weight:800; cursor:pointer; letter-spacing:.04em;}
.btn-ok:hover{background:var(--green-deep);}
.btn-ok:disabled{background:#a8b5ad; cursor:not-allowed;}
.btn-ghost{background:#fff; border:2px solid var(--green); color:var(--green-deep); border-radius:8px; padding:11px 16px; font-size:13.5px; font-weight:800; cursor:pointer;}
.btn-ghost:hover{background:var(--green-lite);}
.btn-mini{background:#fff; border:1.5px solid var(--line); color:var(--ink); border-radius:6px; padding:7px 13px; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap;}
.btn-mini:hover{border-color:var(--green); color:var(--green-deep);}
.btn-mini.warn{color:var(--warn); border-color:#e8b0a8;}
/* ---------- 撮影入口 ---------- */
.shoot{
  display:flex; flex-direction:column; align-items:center; gap:14px; padding:34px 16px;
  background:#fff; border:1px solid var(--line); border-radius:var(--radius); text-align:center;
}
.shoot .big{
  width:96px; height:96px; border-radius:50%; background:linear-gradient(135deg,var(--green-deep),var(--green));
  color:#fff; font-size:42px; border:5px solid #cfe6d7; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(30,92,58,.3);
}
.shoot .big:active{transform:scale(.95);}
.shoot .tt{font-size:16px; font-weight:800;}
/* ---------- キャンバス ---------- */
.canvas-wrap{position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#1c2320; touch-action:none;}
#cv{display:block; width:100%; touch-action:none; cursor:crosshair;}
.cv-tools{
  position:absolute; top:8px; left:8px; right:8px; display:flex; gap:6px; flex-wrap:wrap; pointer-events:none;
}
.cv-tools button{pointer-events:auto; background:rgba(32,38,35,.85); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:7px; padding:7px 13px; font-size:12px; font-weight:800; cursor:pointer;}
.cv-tools button:hover{background:rgba(42,122,79,.9);}
.cv-tools .sp{flex:1;}
.cv-guide{
  position:absolute; bottom:8px; left:8px; right:8px; text-align:center; pointer-events:none;
  color:#fff; font-size:12.5px; font-weight:800; text-shadow:0 1px 4px rgba(0,0,0,.8); line-height:1.6;
}
/* ---------- 材料パレット ---------- */
.mats{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px;}
.mat{
  border:2px solid var(--line); border-radius:9px; padding:10px 11px; cursor:pointer; background:#fff;
  display:flex; flex-direction:column; gap:5px;
}
.mat:hover{border-color:#9cc7ab;}
.mat.on{border-color:var(--green); background:var(--green-lite);}
.mat .sw{height:16px; border-radius:4px;}
.mat .nm{font-size:12.5px; font-weight:800; line-height:1.4;}
.mat .ds{font-size:10.5px; color:var(--ink-sub); font-weight:700;}
/* スライダー行 */
.sl-row{display:flex; align-items:center; gap:10px; margin-top:10px; font-size:12.5px; font-weight:800; color:var(--ink-sub); flex-wrap:wrap;}
.sl-row input[type=range]{flex:1; min-width:120px; accent-color:var(--green);}
.sl-row .v{min-width:52px; text-align:right; color:var(--ink); font-weight:800;}
.side-tgl{display:flex; gap:6px;}
.side-tgl button{border:1.5px solid var(--line); background:#fff; border-radius:6px; padding:6px 11px; font-size:12px; font-weight:800; cursor:pointer; color:var(--ink-sub);}
.side-tgl button.on{border-color:var(--green); background:var(--green-lite); color:var(--green-deep);}
/* 角度・レイヤー */
.angles{display:flex; gap:6px; flex-wrap:wrap;}
.angles .ag{background:#202623; color:#fff; border-radius:6px; padding:5px 11px; font-size:12px; font-weight:800;}
.angles .ag small{opacity:.8; font-weight:700;}
.layers{display:flex; flex-direction:column; gap:6px;}
.lyr{display:flex; align-items:center; gap:9px; background:#fbfcfa; border:1px solid #e5eae3; border-radius:8px; padding:8px 11px; font-size:13px; font-weight:800;}
.lyr .sw{width:26px; height:13px; border-radius:3px; flex:none;}
.lyr small{color:var(--ink-sub); font-weight:700;}
.lyr .del{margin-left:auto; color:var(--warn); cursor:pointer; font-size:15px; padding:0 4px;}
.actrow{display:flex; gap:9px; flex-wrap:wrap; margin-top:4px;}
/* 未来機能チップ */
.future{display:flex; gap:6px; flex-wrap:wrap;}
.future span{background:#f3edda; color:var(--gold); border:1px dashed #dcd0a0; border-radius:14px; padding:5px 13px; font-size:11.5px; font-weight:800;}
/* ---------- トースト ---------- */
#toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(20px);
  background:#202623; color:#fff; padding:11px 20px; border-radius:9px; font-size:14px; font-weight:700;
  opacity:0; pointer-events:none; transition:.25s; z-index:99; max-width:90vw; text-align:center; line-height:1.6;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
/* ---------- 下部ナビ ---------- */
nav{
  flex:none;
  background:
    repeating-linear-gradient(-55deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px),
    linear-gradient(180deg,#1f5c36,#153f25);
  display:flex; gap:3px; padding:2px 7px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:calc(2px + env(safe-area-inset-bottom)); /* 端末下端の見切れ防止（rev.04 ③） */
  border-top:2px solid #0d2a18;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
}
nav::-webkit-scrollbar{display:none;}
nav .ni{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:#cfe6d6;
  font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;
  transition:transform .06s;
}
nav .ni .ic{font-size:19px; line-height:1; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));}
nav .ni:hover{background:rgba(255,255,255,.10);}
nav .ni:active{transform:translateY(1px);}
nav .ni.on{
  background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));
  color:#4d3a00; border:1.5px solid #a87f00;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #7d5f00;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
/* ---------- 画像アイコンボタン（ナビ改修指示書 Step3） ---------- */
nav .ni .ic img, nav#nav .ni .ic img{height:44px; display:block;}
nav .ni.hasimg, nav#nav .ni.hasimg{padding:0 3px; margin-top:-13px;}
nav .ni.hasimg > span:last-child, nav#nav .ni.hasimg > span:last-child{display:none;}
nav .ni.hasimg .ic, nav#nav .ni.hasimg .ic{filter:none;}
nav .ni.hasimg.on, nav#nav .ni.hasimg.on{background:none; border:none; box-shadow:none; text-shadow:none;
  filter:drop-shadow(0 0 5px #ffd23f) drop-shadow(0 0 2px #ffd23f);
  transform:scale(1.14);
  transform-origin:center bottom;
  z-index:2; position:relative;
}
nav .ni.hasimg, nav#nav .ni.hasimg{transition:transform .15s ease-out, filter .15s ease-out;}
nav .ni.hasimg:hover, nav#nav .ni.hasimg:hover{transform:scale(1.06);}
nav .ni.hasimg.on:hover, nav#nav .ni.hasimg.on:hover{transform:scale(1.14);}
nav, nav#nav{overflow:visible; padding-top:2px;}
@media (max-width:760px){
  nav, nav#nav{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; justify-content:flex-start;}
  nav::-webkit-scrollbar, nav#nav::-webkit-scrollbar{display:none;}
  nav .ni .ic img, nav#nav .ni .ic img{height:38px;}
  nav .ni.hasimg, nav#nav .ni.hasimg{margin-top:0;}
  nav .ni:first-child, nav#nav .ni:first-child{margin-left:0;}
  nav .ni:last-child, nav#nav .ni:last-child{margin-right:0;}
}
nav .ni:first-child{margin-left:auto;}
nav .ni:last-child{margin-right:auto;}
/* ---------- タップ演出（shiyo_toroku基準：タッチ発光） ---------- */
@keyframes tapfx-glow{
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
  60%{opacity:.7;}
  100%{opacity:0; transform:translate(-50%,-50%) scale(2.1);}
}
@keyframes tapfx-ring{
  0%{opacity:.7; transform:scale(.5);}
  100%{opacity:0; transform:scale(1.45);}
}
.tapfx{
  position:fixed; z-index:9998; pointer-events:none;
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,217,77,.85) 35%, rgba(255,157,30,.35) 65%, transparent 75%);
  transform:translate(-50%,-50%) scale(1);
  animation:tapfx-glow .55s ease-out forwards;
}
.tapfx::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:2px solid rgba(255,217,77,.9);
  animation:tapfx-ring .55s ease-out forwards;
}
@media (max-width:640px){
  :root{font-size:14px;}
  header h1{font-size:18px;}
  header .sub{display:none;}
  .wrap{padding:8px 8px 110px;}
  nav .ni{padding:4px 8px; font-size:10px; gap:1px;}
  nav .ni .ic{font-size:19px;}
}

<script>
/* ================= 下部ナビ（各デモページと共通） ================= */
const NAV=[['home','ホーム'],['kiroku','現場記録帳'],['map','現場マップ'],['hacchu','発注'],['kokkou','国交省仕様'],['camera','カメラ'],
           ['library','ライブラリ'],['zumen','図面/積算'],['shiyou','仕様・材料']];
/* rev.04 ②：用語集・設定はナビから削除（ホームの右側ボタンと同じ扱い） */
const NAV_LINKS={home:'./index.html', kiroku:'./kirokucho_demo.html', map:'./genba_map_v36.html', hacchu:'./hacchu.html', kokkou:'./kokkosho.html',
                 camera:'./camera.html', library:'./library.html', yougo:'./yougo.html',
                 zumen:'./zumen_sekisan.html',
                 zairyo:'./zairyo_toroku.html', shiyou:'./shiyo_toroku.html'};
const NAV_ACTIVE='camera';
const ICONS={header:'📷', home:'🏠', kiroku:'📋', map:'🗺️', hacchu:'📝', kokkou:'📗', camera:'📷',
  library:'📁', zumen:'📐', zairyo:'🧱', shiyou:'📚', yougo:'📖', settei:'⚙️'};
function navGo(k,label){
  if(k===NAV_ACTIVE)return;
  if(NAV_LINKS[k]){ nnGoPage(encodeURI(NAV_LINKS[k])); }
  else alert('「'+label+'」は準備中です');
}
/* ページ移動：押した瞬間に画面がフェードし始めるので「固まった」感じがなくなる */
window.nnGoPage=function(url){
  /* ★指を離した瞬間（＝タップした瞬間）に、画面いちばん上へ細い進行バーを出す。
     次のページが出来上がるまでの数百ミリ秒、「反応した」ことが必ず目に見える。
     画面は隠さないので、前の画面はそのまま見えたまま。 */
  try{
    if(!document.getElementById('nnbar')){
      const bar=document.createElement('div'); bar.id='nnbar'; bar.innerHTML='<i></i>';
      document.body.appendChild(bar);
      setTimeout(()=>{try{bar.remove();}catch(_){}} ,4000);   /* 念のための自動消去 */
    }
  }catch(_){}
  document.body.classList.add('nn-leaving');
  location.href=url;
};
/* ★先読みの fetch は削除（2026-07-28）。
   ページは端末に保存済みなので先読みの意味がなく、指が触れた瞬間に
   別の取得処理を走らせることで、肝心の画面移動と処理を取り合っていた。 */
function buildNav(){
  const n=document.getElementById('nav');
  n.innerHTML=NAV.map(([k,l])=>{
    const suf=(k===NAV_ACTIVE)?'_on':'';
    return `<div class="ni ${k===NAV_ACTIVE?'on':''}" onclick="navGo('${k}','${l}')">
      <span class="ic"><img src="./icons/nav_${k}${suf}.png" alt="${l}"
        onload="this.closest('.ni').classList.add('hasimg')"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='./icons/nav_${k}.png';}
                 else{this.outerHTML=ICONS['${k}']||'▫️';}"></span><span>${l}</span></div>`;
  }).join('');
  /* あふれ時：アクティブなボタンを中央に
     ★位置の計測（scrollWidth や getBoundingClientRect）は「画面をいったん組み上げる」
       処理なので、ここで行うと画面が出るまでの待ち時間が伸びる。
       画面を出したあと（次の描画のタイミング）にまわす。 */
  addEventListener('load',()=>{
    const on=n.querySelector('.ni.on');
    if(on && n.scrollWidth>n.clientWidth){
      const d=on.getBoundingClientRect().left-n.getBoundingClientRect().left;
      n.scrollLeft+=d-(n.clientWidth-on.offsetWidth)/2;
    }
  },{once:true});
}
buildNav();

/* ---------- タップ演出（shiyo_toroku基準：発光＋タップ音） ---------- */
(function(){
  /* ---------- ゲーム風タップ音（Web Audio合成・音源ファイル不要） ---------- */
  let AC=null;
  function ctx(){
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }   // iOSは初回タップで解放
    return AC;
  }
  function tapSound(){
    try{
      const c=ctx(), t=c.currentTime;
      // やわらかい水滴風の「ぽん」：低めのサイン波2音（耳に優しい音量）
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(523,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.06,t+0.010);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.15);
      // 軽く上に抜ける倍音
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine';
      o2.frequency.setValueAtTime(784,t);
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.03,t+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
      o2.connect(g2).connect(c.destination);
      o2.start(t+0.005); o2.stop(t+0.12);
    }catch(e){}
  }

  /* ---------- タッチ発光 ---------- */
  function glow(x,y){
    const el=document.createElement('div');
    el.className='tapfx';
    /* ★2026-08-13j パソコンの表示倍率（zoom）で割ること。
       clientX/Y は倍率を**かけた後**のpx、style.left/top は倍率を**かける前**のpx。
       割らないと、大きいモニターほど発光が右下の見当違いな場所に出る（§61の落とし穴）。 */
    const _z=window.nnPZ||1;
    el.style.left=(x/_z)+'px'; el.style.top=(y/_z)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 600);
  }

  /* ---------- イベント委譲 ----------
     発光＝画面のどこを触っても出す（触った場所のフィードバック）
     音　＝押せる要素（ボタン・ナビ・チップ・行）に当たったときだけ鳴らす */
  const PRESSABLE='button, .chip>button, .mk, .mrow, .tabs button, #viewtabs button, .btn-ok, .btn-ghost, .sortbtn, a, [onclick]';
  let last=0;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    glow(e.clientX, e.clientY);
    /* ★下部ナビは専用の音（nav_move.wav）を鳴らすので、ここでは鳴らさない。
       [onclick] にナビも含まれてしまい、1回のタップで2種類の音が重なって
       「ココンコン」と聞こえていた原因。 */
    const tc=(e.target&&e.target.closest)?e.target:null;
    const hit=(!tc||tc.closest('nav .ni'))?null:tc.closest(PRESSABLE);
    if(hit && !hit.disabled && !hit.classList.contains('soon')){
      const now=Date.now();
      if(now-last>70){ last=now; tapSound(); }   // 連打の二重発音を抑制
    }
  }, {passive:true});
})();

/* ★2026-08-24ae 写真の読み込みを軽くした。
   以前は「ファイル全体を文字（base64）にしてから画像にする」やり方で、
   いまのスマホの写真（1枚10MB超）だと文字と画像で二重に記憶を食い、
   古い端末では**落ちる**ことがあった。
   ・createImageBitmap（ブラウザが直に読む道）を使う＝文字を作らない
   ・大きすぎる写真は横4000pxまでに落とす（画面に出す大きさは1200px前後なので見え方は同じ）
   ・使えない端末では、これまでどおりの道に落ちる（そのときも文字ではなく一時のURLを使う） */
const NN_IMG_MAX=4000;
function nnUseImage(src, w, h, close){
  if(w>NN_IMG_MAX){
    const sc=NN_IMG_MAX/w;
    const c=document.createElement('canvas');
    c.width=Math.round(w*sc); c.height=Math.round(h*sc);
    c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    if(close){ try{ src.close(); }catch(_){} }
    img=c;
  }else img=src;
  resetWork(); setStep(2);
}
function loadFile(f){
  if(!f)return;
  const legacy=()=>{
    const u=URL.createObjectURL(f);
    const im=new Image();
    im.onload=()=>{ nnUseImage(im, im.width, im.height, false); try{URL.revokeObjectURL(u);}catch(_){} };
    im.onerror=()=>{ try{URL.revokeObjectURL(u);}catch(_){} if(window.toast)toast('この写真は読み込めませんでした'); };
    im.src=u;
  };
  if(window.createImageBitmap){
    let done=false;
    try{
      createImageBitmap(f).then(bm=>{ done=true; nnUseImage(bm, bm.width, bm.height, true); })
                          .catch(()=>{ if(!done) legacy(); });
      return;
    }catch(_){ /* 下の道へ */ }
  }
  legacy();
}

/* サンプル画像（屋上パラペット入隅を手続き描画：デスクトップ確認用） */
function loadSample(){
  const w=1200,h=880;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  /* 空 */
  const sky=g.createLinearGradient(0,0,0,h*.34);
  sky.addColorStop(0,'#b8cfdd'); sky.addColorStop(1,'#dfe9ee');
  g.fillStyle=sky; g.fillRect(0,0,w,h*.34);
  /* パラペット外壁（奥） */
  g.fillStyle='#b9b2a6'; g.fillRect(0,h*.30,w,h*.09);
  /* パラペット天端 */
  g.fillStyle='#cfc9bd'; g.beginPath();
  g.moveTo(0,h*.39); g.lineTo(w,h*.39); g.lineTo(w,h*.335); g.lineTo(0,h*.335); g.closePath(); g.fill();
  /* パラペット立上り内側 */
  const wall=g.createLinearGradient(0,h*.39,0,h*.62);
  wall.addColorStop(0,'#c4beb2'); wall.addColorStop(1,'#a8a296');
  g.fillStyle=wall; g.fillRect(0,h*.39,w,h*.23);
  /* 立上りの汚れ・クラック */
  g.strokeStyle='rgba(90,84,74,.35)'; g.lineWidth=2;
  for(let i=0;i<6;i++){ const x=100+i*190; g.beginPath(); g.moveTo(x,h*.40); g.lineTo(x+18,h*.60); g.stroke(); }
  /* 平場（手前へパース） */
  const fl=g.createLinearGradient(0,h*.62,0,h);
  fl.addColorStop(0,'#8f8d84'); fl.addColorStop(1,'#6f6d66');
  g.fillStyle=fl; g.fillRect(0,h*.62,w,h*.38);
  /* 入隅ライン */
  g.strokeStyle='rgba(50,46,40,.6)'; g.lineWidth=4;
  g.beginPath(); g.moveTo(0,h*.62); g.lineTo(w,h*.62); g.stroke();
  /* 平場の目地 */
  g.strokeStyle='rgba(60,58,52,.4)'; g.lineWidth=3;
  [.72,.84].forEach(y=>{ g.beginPath(); g.moveTo(0,h*y); g.lineTo(w,h*y); g.stroke(); });
  g.beginPath(); g.moveTo(w*.5,h*.62); g.lineTo(w*.5,h); g.stroke();
  /* ドレン */
  g.fillStyle='#4a4844'; g.beginPath(); g.ellipse(w*.78,h*.86,46,20,0,0,7); g.fill();
  g.fillStyle='#2e2c29'; g.beginPath(); g.ellipse(w*.78,h*.86,30,12,0,0,7); g.fill();
  const im=new Image(); im.onload=()=>{ img=im; resetWork(); setStep(2); };
  im.src=c.toDataURL('image/jpeg',.9);
}

/* ================= キャンバス ================= */
function setupCanvas(){
  cv=document.getElementById('cv'); if(!cv||!img)return;
  ctx=cv.getContext('2d');
  DPR=Math.min(window.devicePixelRatio||1,2);
  const cw=cv.parentElement.clientWidth;
  const scale=cw/img.width;
  const ch=Math.round(img.height*scale);
  const oldW=cv.dataset.w?+cv.dataset.w:0;
  cv.width=Math.round(cw*DPR); cv.height=Math.round(ch*DPR);
  cv.dataset.w=cv.width;
  cv.style.height=ch+'px';
  /* ★窓の大きさや向きが変わったら、打った点も同じ割合で追従させる（ズレたまま残さない） */
  if(oldW && oldW!==cv.width){
    const k=cv.width/oldW;
    pts.forEach(p=>{p.x*=k; p.y*=k;});
    layers.forEach(l=>l.pts.forEach(p=>{p.x*=k; p.y*=k;}));
  }
  /* ★配線は1つの要素につき1回だけ（resize経由で setupCanvas が再走しても二重にしない） */
  if(!cv._wired){ wireCanvas(); cv._wired=true; }
  drawCv(); updateGuide();
}
addEventListener('resize',()=>{ if(document.getElementById('cv')&&img){ setupCanvas(); } });
/* ★2026-08-14m クリックした場所と打点がズレる不具合の修正。
   以前は (clientX-左端)×DPR としていたが、パソコンは表示倍率（zoom・§61）がかかるため
   倍率ぶん右下にズレて「クリックしたところからエッジが始まらない」状態だった。
   「キャンバスの中の画素数 ÷ 見た目の大きさ」で換算すれば、倍率・DPR・縮尺のどれが
   変わっても必ず指した場所に打てる（図面・積算 §24 と同じ式）。 */
function cvPos(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height)};
}
/* 画面上の px をキャンバス内の px に直す係数（当たり判定の半径などに使う） */
function cvK(){ const r=cv.getBoundingClientRect(); return cv.width/(r.width||1); }

/* ---- 操作（図面・積算と同じ作法）----
   パソコン：マウスを動かすと予告線 → クリックで打点／頂点はつかんで動かせる／右クリック＝1点戻す
   スマホ　：指を置くと右上に赤い照準 → 動かして狙い → 離した位置に打点（指で隠れない） */
const AIM_DX=36, AIM_DY=-52;              /* 照準は指の右上（画面px） */
let cvHover=null;                          /* マウスの現在地（キャンバス座標） */
let cvAim=null;                            /* 照準の現在地（キャンバス座標） */
let cvDrag=null;                           /* つかんでいる頂点 {i, touch} */
function nearPt(pos){
  const R=16*cvK();                        /* 画面16px相当 */
  let best=-1, bd=R*R;
  pts.forEach((p,i)=>{ const d=(p.x-pos.x)**2+(p.y-pos.y)**2; if(d<bd){bd=d; best=i;} });
  return best;
}
function wireCanvas(){
  cv.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(e.pointerType==='touch'){
      const raw=cvPos(e);
      const k=cvK();
      const pos={x:raw.x+AIM_DX*k, y:raw.y+AIM_DY*k};
      const hit=edgeDone?-1:nearPt(raw);
      if(hit>=0){ cvDrag={i:hit, touch:true}; cvAim=null; }
      else if(!edgeDone){ cvAim=pos; }
      try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    }else{
      if(edgeDone)return;
      const pos=cvPos(e);
      if(e.button===2)return;               /* 右クリックは contextmenu 側で処理 */
      const hit=nearPt(pos);
      if(hit>=0){ cvDrag={i:hit, touch:false}; }
      else{ pts.push(pos); }
    }
    drawCv(); updateGuide();
  });
  cv.addEventListener('pointermove',e=>{
    const raw=cvPos(e);
    if(e.pointerType==='touch'){
      const k=cvK();
      if(cvDrag){ pts[cvDrag.i]={x:raw.x+AIM_DX*k, y:raw.y+AIM_DY*k}; }
      else if(cvAim){ cvAim={x:raw.x+AIM_DX*k, y:raw.y+AIM_DY*k}; }
      else return;
    }else{
      if(cvDrag){ pts[cvDrag.i]=raw; }
      else { cvHover=edgeDone?null:raw; }
    }
    drawCv();
  });
  const up=e=>{
    if(e.pointerType==='touch'){
      if(cvAim && !edgeDone){
        /* キャンバスの中だけ打点（照準が上へ出たときは打たない） */
        if(cvAim.x>=0&&cvAim.y>=0&&cvAim.x<=cv.width&&cvAim.y<=cv.height) pts.push(cvAim);
      }
      cvAim=null;
    }
    cvDrag=null;
    drawCv(); updateGuide();
  };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',()=>{ cvHover=null; drawCv(); });
  /* 右クリック＝1点戻す（図面・積算と同じ） */
  cv.addEventListener('contextmenu',e=>{ e.preventDefault(); if(!edgeDone&&pts.length){ pts.pop(); drawCv(); updateGuide(); } });
}
function undoPt(){ if(edgeDone){toast('確定済みです。「エッジをやり直す」を使ってください');return;} pts.pop(); drawCv(); updateGuide(); }
function clearEdge(){ pts=[]; edgeDone=false; setStep(2); }
function newEdge(){ pts=[]; edgeDone=false; setStep(2); }
function finishEdge(){
  if(pts.length<2){ toast('2点以上タップしてエッジを引いてください'); return; }
  edgeDone=true; setStep(3);
  toast('✔ エッジを認識しました。<br>下から防水材を選んで適用してください');
}
function updateGuide(){
  const g=document.getElementById('guide'); if(!g)return;
  if(edgeDone){ g.innerHTML=''; return; }
  const PH=document.documentElement.getAttribute('data-nnphone')==='1';
  g.innerHTML = pts.length===0
    ? (PH?'<b>指を置くと右上に赤い照準</b>が出ます。動かして狙い、<b>離すと始点</b>が打たれます'
         :'納めたいラインの<b>始点をクリック</b>してください（例：入隅に沿って）')
    : pts.length===1
    ? (PH?'同じように<b>次の点</b>を。点は<b>つまんで動かして</b>直せます'
         :'続けて<b>次の点をクリック</b>（点は<b>つかんで動かせます</b>／右クリック＝1点戻す）')
    : (PH?'点を追加 →「✔ エッジ確定」で角度を認識します（点はつまんで修正可）'
         :'点を追加 →「✔ エッジ確定」で角度を認識します（右クリック＝1点戻す）');
}

/* ---- 角度計算 ---- */
function vertexAngles(){
  const out=[];
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    const v1={x:a.x-b.x,y:a.y-b.y}, v2={x:c.x-b.x,y:c.y-b.y};
    const d=(v1.x*v2.x+v1.y*v2.y)/(Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y));
    const deg=Math.round(Math.acos(Math.max(-1,Math.min(1,d)))*180/Math.PI);
    out.push({i,deg});
  }
  return out;
}
function angleLabel(deg){
  if(deg>=170)return '平場通し';
  if(deg>=60&&deg<=120)return '入隅／出隅';
  if(deg<60)return '鋭角（要役物検討）';
  return '緩折れ';
}

/* ---- 描画本体 ---- */
function drawCv(){
  if(!ctx||!img)return;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(img,0,0,cv.width,cv.height);
  /* 適用済みレイヤー */
  layers.forEach(l=>drawMat(l.pts,l.matId,l.w*DPR,l.alpha,l.side));
  /* プレビュー：エッジ確定済みなら現在の材料を薄く重ねる */
  if(edgeDone&&pts.length>=2) drawMat(pts,curMat,curW*DPR,curAlpha*.55,curSide,true);
  /* エッジ線と点（★2026-08-14m mapryのスキャンのような「白く光る線」に。
     ①白のにじむ光 ②白の下地 ③芯の色（作図中=赤／確定=黄）の3層で、
     写真のどんな色の上でも線がくっきり浮かぶ。 */
  if(pts.length){
    ctx.save();
    ctx.lineJoin='round'; ctx.lineCap='round';
    const path=()=>{ ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y); };
    if(pts.length>=2){
      ctx.shadowColor='rgba(255,255,255,.95)'; ctx.shadowBlur=10*DPR;
      ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=5.5*DPR; path(); ctx.stroke();
      ctx.shadowBlur=0;
      ctx.strokeStyle=edgeDone?'rgba(255,235,59,.95)':'rgba(255,64,64,.95)';
      ctx.lineWidth=2.4*DPR; path(); ctx.stroke();
    }
    /* 予告線（マウスの現在地／スマホの照準まで。次の辺がどこに引かれるかが見える） */
    const tgt=cvAim||cvHover;
    if(!edgeDone && tgt){
      ctx.setLineDash([7*DPR,6*DPR]);
      ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2.6*DPR;
      ctx.beginPath(); ctx.moveTo(pts[pts.length-1].x,pts[pts.length-1].y); ctx.lineTo(tgt.x,tgt.y); ctx.stroke();
      ctx.setLineDash([]);
    }
    pts.forEach((p,i)=>{
      /* 白いリング＋色の芯（光の線の上でも頂点が見分けられる） */
      ctx.fillStyle='rgba(255,255,255,.95)';
      ctx.beginPath(); ctx.arc(p.x,p.y,7*DPR,0,7); ctx.fill();
      ctx.fillStyle=i===0?'#ff5252':(edgeDone?'#ffeb3b':'#2a7a4f');
      ctx.beginPath(); ctx.arc(p.x,p.y,4.2*DPR,0,7); ctx.fill();
      ctx.strokeStyle='#202623'; ctx.lineWidth=1.2*DPR; ctx.stroke();
    });
    /* 角度バッジ */
    if(pts.length>=3){
      ctx.font=`800 ${12*DPR}px sans-serif`;
      vertexAngles().forEach(({i,deg})=>{
        const b=pts[i], txt=deg+'°';
        const w=ctx.measureText(txt).width+12*DPR;
        ctx.fillStyle='rgba(32,38,35,.88)';
        ctx.beginPath(); ctx.roundRect(b.x+8*DPR,b.y-24*DPR,w,18*DPR,4*DPR); ctx.fill();
        ctx.fillStyle='#ffeb3b'; ctx.fillText(txt,b.x+14*DPR,b.y-10*DPR);
      });
    }
    ctx.restore();
  }
  /* 赤い照準（スマホ：指の右上。離すとこの位置に打点される） */
  if(cvAim){
    ctx.save();
    const r=12*DPR;
    ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=3.2*DPR;
    ctx.beginPath(); ctx.arc(cvAim.x,cvAim.y,r,0,7); ctx.stroke();
    ctx.strokeStyle='rgba(230,42,26,.95)'; ctx.lineWidth=1.8*DPR;
    ctx.beginPath(); ctx.arc(cvAim.x,cvAim.y,r,0,7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cvAim.x-r*1.7,cvAim.y); ctx.lineTo(cvAim.x-r*.55,cvAim.y);
    ctx.moveTo(cvAim.x+r*.55,cvAim.y); ctx.lineTo(cvAim.x+r*1.7,cvAim.y);
    ctx.moveTo(cvAim.x,cvAim.y-r*1.7); ctx.lineTo(cvAim.x,cvAim.y-r*.55);
    ctx.moveTo(cvAim.x,cvAim.y+r*.55); ctx.lineTo(cvAim.x,cvAim.y+r*1.7);
    ctx.stroke();
    ctx.restore();
  }
  renderAngles();
}
function renderAngles(){
  const p=document.getElementById('anglePanel'), box=document.getElementById('angles');
  if(!p||!box)return;
  const ags=vertexAngles();
  if(!edgeDone||!ags.length){ p.style.display='none'; return; }
  p.style.display='block';
  box.innerHTML=ags.map(a=>`<span class="ag">頂点${a.i}：${a.deg}°<small>（${angleLabel(a.deg)}）</small></span>`).join('')
    ;
}

/* ---- オフセットパス（左右展開用） ---- */
function offsetPath(path, off){
  if(off===0)return path;
  const out=[];
  for(let i=0;i<path.length;i++){
    const p=path[i];
    const a=path[Math.max(0,i-1)], b=path[Math.min(path.length-1,i+1)];
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    out.push({x:p.x+(-dy/len)*off, y:p.y+(dx/len)*off});
  }
  return out;
}
function strokePath(path){
  ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y);
  for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);
}

/* ---- 材料描画（2Dなりに「らしく」） ---- */
function drawMat(path, matId, w, alpha, side, preview){
  if(path.length<2)return;
  const m=matById(matId);
  const off=side*(w/2);
  const p=offsetPath(path,off);
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.lineCap='butt';

  if(m.type==='sheet'){
    /* 本体：エッジで折れる帯（miterで折り目が立つ） */
    ctx.lineJoin='miter'; ctx.miterLimit=6;
    ctx.strokeStyle=m.base; ctx.lineWidth=w;
    strokePath(p); ctx.stroke();
    /* 表面のハイライト（厚み感） */
    ctx.globalAlpha=alpha*.5;
    ctx.strokeStyle=m.top; ctx.lineWidth=w*.55;
    strokePath(offsetPath(path,off-w*.16)); ctx.stroke();
    /* ラップライン（シート重ね目：進行方向に直交する線を等間隔で） */
    ctx.globalAlpha=alpha*.85;
    ctx.strokeStyle=m.lap; ctx.lineWidth=2.2*DPR;
    drawTicks(p,w,110*DPR);
    /* 折り目強調：頂点に短い稜線 */
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=2*DPR;
    for(let i=1;i<p.length-1;i++) drawNormalTick(p,i,w);
  }
  else if(m.type==='coat'){
    /* 2層塗り：外側をぼかし、内側を濃く */
    ctx.lineJoin='round';
    ctx.shadowColor=m.base; ctx.shadowBlur=w*.5;
    ctx.strokeStyle=m.base; ctx.lineWidth=w;
    strokePath(p); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.globalAlpha=alpha*.8;
    ctx.strokeStyle=m.base; ctx.lineWidth=w*.66;
    strokePath(p); ctx.stroke();
    /* 塗りムラ表現：うっすら明るい筋 */
    ctx.globalAlpha=alpha*.3;
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=w*.14;
    strokePath(offsetPath(path,off-w*.18)); ctx.stroke();
  }
  else if(m.type==='bead'){
    /* シールビード：本体＋艶ハイライト */
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=w+3*DPR;
    strokePath(p); ctx.stroke();
    ctx.strokeStyle=m.base; ctx.lineWidth=w;
    strokePath(p); ctx.stroke();
    ctx.globalAlpha=alpha*.75;
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=Math.max(1.5*DPR,w*.22);
    strokePath(offsetPath(path,off-w*.22)); ctx.stroke();
  }
  else if(m.type==='metal'){
    /* 押え金物：メタリック帯＋ビス点＋上端シール */
    ctx.lineJoin='miter';
    ctx.strokeStyle='#7c848a'; ctx.lineWidth=w;
    strokePath(p); ctx.stroke();
    ctx.strokeStyle='#d7dde2'; ctx.lineWidth=w*.4;
    strokePath(offsetPath(path,off-w*.2)); ctx.stroke();
    /* ビス（@450イメージで等間隔の点） */
    ctx.fillStyle='#31373b';
    eachAlong(p,90*DPR,(x,y)=>{ ctx.beginPath(); ctx.arc(x,y,Math.max(2.2*DPR,w*.12),0,7); ctx.fill(); });
    /* 上端シールライン */
    ctx.strokeStyle='rgba(230,226,216,.9)'; ctx.lineWidth=3*DPR; ctx.lineCap='round';
    strokePath(offsetPath(path,off-w*.62)); ctx.stroke();
  }

  if(preview){ /* プレビュー枠 */
    ctx.globalAlpha=.9; ctx.setLineDash([6*DPR,5*DPR]);
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5*DPR;
    strokePath(offsetPath(path,off-w/2)); ctx.stroke();
    strokePath(offsetPath(path,off+w/2)); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}
/* パスに沿って等間隔で直交チック（ラップライン） */
function drawTicks(p,w,pitch){
  eachAlong(p,pitch,(x,y,nx,ny)=>{
    ctx.beginPath();
    ctx.moveTo(x+nx*w/2,y+ny*w/2);
    ctx.lineTo(x-nx*w/2,y-ny*w/2);
    ctx.stroke();
  });
}
function drawNormalTick(p,i,w){
  const a=p[i-1],b=p[i];
  const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len;
  ctx.beginPath();
  ctx.moveTo(b.x+nx*w/2,b.y+ny*w/2);
  ctx.lineTo(b.x-nx*w/2,b.y-ny*w/2);
  ctx.stroke();
}
function eachAlong(p,pitch,fn){
  let rem=pitch*.5;
  for(let i=1;i<p.length;i++){
    const a=p[i-1],b=p[i];
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len,ny=dx/len;
    let d=rem;
    while(d<len){
      fn(a.x+dx*d/len, a.y+dy*d/len, nx, ny);
      d+=pitch;
    }
    rem=d-len;
  }
}

/* ================= 適用・レイヤー ================= */
function pickMat(id){ curMat=id; curW=matById(id).defW; render(); }
function applyMat(){
  if(!edgeDone||pts.length<2){ toast('先にエッジを確定してください'); return; }
  layers.push({id:uid(), pts:pts.map(p=>({x:p.x,y:p.y})), matId:curMat, w:curW, alpha:curAlpha, side:curSide});
  const m=matById(curMat);
  toast(`✔ ${esc(m.nm)}をエッジに適用しました<br>続けて別の材料も重ねられます（例：端末に押え金物）`);
  render();
  /* ★2026-09-23ak スマホでは写真が画面の上に流れていて、当てた結果が見えなかった → 写真まで戻す */
  try{ const c=document.getElementById('cv'); if(c){ const r=c.getBoundingClientRect(); if(r.bottom<60||r.top>document.documentElement.clientHeight-60)c.scrollIntoView({block:'start',behavior:'smooth'}); } }catch(_){}
}
function delLayer(i){ layers.splice(i,1); render(); }

/* ================= 保存 ================= */
function savePng(){
  if(!cv)return;
  const a=document.createElement('a');
  a.href=cv.toDataURL('image/jpeg',.92);
  a.download='osamari_'+new Date().toISOString().slice(0,10)+'.jpg';
  a.click();
  toast('💾 画像を保存しました');
}
function saveToLib(){
  const usedMats=[...new Set(layers.map(l=>matById(l.matId).nm))];
  const mainKou=matById(layers[0].matId).kou;
  const ags=vertexAngles();
  const it={ id:uid(),
    title:'カメラ納まり：'+usedMats.join('＋'),
    bui:[ags.some(a=>a.deg>=60&&a.deg<=120)?'出入隅':'平場'],
    kou:mainKou, kbn:'改修', taishitsu:'現場撮影（カメラ機能）',
    src:'カメラ撮影（'+new Date().toISOString().slice(0,10)+'）',
    date:new Date().toISOString().slice(0,10),
    reuse:0, share:'private', cg:false, warn:false,
    photos:['カメラ撮影＋材料オーバーレイ'],
    steps:layers.map((l,i)=>({t:matById(l.matId).nm+'をエッジに沿って適用（幅'+l.w+'）', m:matById(l.matId).nm})),
    caution:[] };
  try{
    let arr=[]; try{ const _a=JSON.parse(localStorage.getItem('nn_lib_items')||'[]');
      /* ★2026-08-24z 壊れた保存で落ちないように。★ag 1件ずつが箱であることまで確かめる */
      if(Array.isArray(_a)) arr=_a.filter(r=>r&&typeof r==='object'&&!Array.isArray(r)); }catch(_){}
    arr.unshift(it);
/* ★2026-08-24v 端末の保存がいっぱいだと localStorage.setItem は例外を投げる。
   受け止めていないと、そこで処理が止まり、利用者には「保存されたつもり」で
   中身だけが消える（いちばん怖い失敗）。受け止めて、理由を知らせる。 */
function nnSet(key, value){
  try{ localStorage.setItem(key, value); return true; }
  catch(err){
    try{ alert('端末の保存容量がいっぱいで保存できませんでした。\n'
      +'古い写真を削除するか、ホームの「設定」からデータを書き出してください。'); }catch(e){}
    return false;
  }
}
    nnSet('nn_lib_items',JSON.stringify(arr));
    toast('🗂 ライブラリに保存しました<br>「ライブラリ」ページの一覧に追加されています');
  }catch(e){ toast('保存に失敗しました（ストレージ容量）'); }
}

/* roundRect polyfill（古いSafari用） */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this;
  };
}

render();
</script>

(function(){

  }
  function show(){

    tab.style.display='none'; arm();
  }
  function arm(){ clearTimeout(t); t=setTimeout(hide,5000); }
  tab.addEventListener('click',show);
  nav.addEventListener('pointerdown',arm,{passive:true});

<script>
/* ページ移動を通信ゼロで一瞬にする（サービスワーカーで全ページを端末に常駐させる） */
/* ============ 版チェック（2026-07-28） ============
   端末には速さのためページを保存しているので、こちらで直しても
   古いものが出続けることがある。そこで ver.txt（数バイト）だけを
   毎回見に行き、公開版と違っていたら保存分を捨てて1回だけ読み直す。
   ★公開のたびに ver.txt と、下の NN_VER を同じ文字に更新すること。 */
const NN_VER='2026-10-11a';
/* ============ 表示にかかった時間の記録（原因調査用・2026-07-28） ============
   スマホの実機でどこに時間がかかっているかを数字で出す。
   ・net  ＝ページを要求してから最初の返事が来るまで（通信の待ち）
   ・recv ＝中身を受け取り終わるまで
   ・build＝受け取ってから組み立て終わるまで（解析・JS実行）
   ・paint＝画面に中身が出たとき
   結果はホーム画面の左上に出る。原因が分かったらこの仕組みごと外す。 */
addEventListener('load',()=>{setTimeout(()=>{
  try{
    const n=performance.getEntriesByType('navigation')[0]; if(!n)return;
    const fcp=performance.getEntriesByType('paint').filter(p=>p.name==='first-contentful-paint')[0];
    const rs=performance.getEntriesByType('resource');
    let slow=null, rkb=0, fontMs=0, fontN=0;
    rs.forEach(r=>{ rkb+=(r.transferSize||0);
      if(!slow||r.duration>slow.duration)slow=r;
      if(/fonts\.(googleapis|gstatic)/.test(r.name)){fontN++; fontMs=Math.max(fontMs, Math.round(r.responseEnd));}});
    const rec={p:(location.pathname.split('/').pop()||'index').replace('.html','').slice(0,8),
      net:Math.round(n.responseStart), recv:Math.round(n.responseEnd),
      build:Math.round(n.domContentLoadedEventEnd), paint:fcp?Math.round(fcp.startTime):-1,
      load:Math.round(n.loadEventEnd), kb:Math.round((n.transferSize||0)/1024),
      res:rs.length, rkb:Math.round(rkb/1024), fn:fontN, fms:fontMs,
      sl:slow?((slow.name.split('/').pop()||'').slice(0,14)+':'+Math.round(slow.duration)):''};
    const a=JSON.parse(sessionStorage.getItem('nnPerf')||'[]'); a.push(rec);
    sessionStorage.setItem('nnPerf',JSON.stringify(a.slice(-7)));
  }catch(_){}
},400);});
const NN_PAGES=['./index.html','./kirokucho_demo.html','./zumen_sekisan.html','./genba_map_v36.html','./hacchu.html',
  './kokkosho.html','./camera.html','./library.html','./shiyo_toroku.html','./zairyo_toroku.html','./yougo.html','./common.css'];
window.nnVerNow=NN_VER;
(async function(){
  try{
    const r=await fetch('./ver.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const v=(await r.text()).trim();
    window.nnVerNew=v;
    if(!v || v===NN_VER)return;
    /* ★2026-07-28 修正：以前は保存分を消して読み直すだけだったが、
       Safari自身が持っている一時保存（HTTPキャッシュ）は消えないため、
       読み直しても古いページが出続けて更新が止まることがあった。
       全ページを cache:'reload' で取り直してから読み直す。 */
    const n=parseInt(sessionStorage.getItem('nnUpdN_'+v)||'0',10);
    if(n>=2)return;                                   /* 失敗が続いたら止める安全弁 */
    sessionStorage.setItem('nnUpdN_'+v,String(n+1));
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    await Promise.all(NN_PAGES.map(u=>fetch(u,{cache:'reload'}).catch(()=>{})));
    location.reload();
  }catch(_){}
})();
</script>
<script>
/* ★2026-07-28：更新が端末に届かない問題への対策
   ・毎回「新しい版が出ていないか」を確認する（r.update()）
   ・新しい版に切り替わったら、その場で1回だけ自動で読み込み直す
     （＝「再読み込み2回」が不要になり、直したことが必ず反映される） */
/* ★2026-07-28 検証：サービスワーカーを一時的に止める
   ホーム(37KB)も現場記録帳(300KB)も、どちらもタップから約0.9秒。
   中身の重さが10倍近く違うのに時間が同じ＝ページの組み立てではなく、
   移動のたびにかかる「決まった待ち時間」がある、ということ。
   iPhoneのSafariでは、この保存の仕組み（サービスワーカー）が
   眠っていると、移動のたびに起こす時間が数百ミリ秒かかることが知られている。
   → いったん止めて、これが原因かを確かめる。
   NN_USE_SW を true に戻せば、オフライン対応ごと元に戻せる。 */
const NN_USE_SW=false;
if('serviceWorker' in navigator){
  if(NN_USE_SW){
    let nnReloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(nnReloaded)return; nnReloaded=true; location.reload();
    });
    addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(r=>{
        try{r.update();}catch(_){}
        if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage('nn-precache');
      }).catch(()=>{});
    });
  }else{
    /* すでに入っている分を取り除き、保存分も消す（1回だけ読み直す） */
    addEventListener('load',async()=>{
      try{
        const rs=await navigator.serviceWorker.getRegistrations();
        if(rs.length){
          await Promise.all(rs.map(r=>r.unregister()));
          if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));}
          if(!sessionStorage.getItem('nnSwOff')){ sessionStorage.setItem('nnSwOff','1'); location.reload(); }
        }
      }catch(_){}
    });
  }
}
</script>
<script>
/* ============ ナビの操作音（2026-07-28 作り直し） ============
   ★以前は <audio> を2個ずつ用意して音源ファイル(nav_move.wav)を
     読ませていたが、iPhoneでは音声部品の準備が重く、しかも
     いつ終わるか読めないため、画面が出るまでの待ち時間に影響していた。
     → 音源ファイルをやめ、その場で音を合成する方式（Web Audio）に変更。
       ファイル読み込みゼロ・部品ゼロ・音は今までと同じ「やわらかい1音」。
   ============================================================ */
(function(){
  /* ★2026-07-28 音が出たり出なかったりした原因
     ①音の装置(AudioContext)を「ナビを最初に押したとき」に作っていた。
       iPhoneでは作った直後は停止状態で、動き出すまでに少し時間がかかるため、
       その1回目の音が鳴らないことがあった。
     ②画面移動が0.09秒後に始まるので、音が長いと途中で切れていた。
     → 装置は「画面のどこかを最初に触った時点」で作って動かしておく。
       音は0.07秒に短くして、移動が始まる前に鳴り終わるようにする。 */
  let AC=null, last=0;
  function make(){
    if(AC)return AC;
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    try{ AC=new C(); }catch(_){ return null; }
    /* 無音を1粒だけ鳴らして、iPhoneの音の仕組みを起こしておく */
    try{ const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
         s.buffer=b; s.connect(AC.destination); s.start(0); }catch(_){}
    return AC;
  }
  /* ★2026-08-26b 起こしても動かないままの装置がある（電話・他アプリへの切り替えで
     iPhoneが音の仕組みごと止めることがあり、resume が効かない）。
     1秒たっても動かなければ、利用者の操作の中で装置を作り直す
     （作り直しは操作の中なら必ず動く＝§89「操作そのものの中で呼ぶ」と同じ決まり）。 */
  let deadSince=0;
  function ensureRunning(){
    let c=make(); if(!c)return null;
    if(c.state!=='running'){
      try{ c.resume(); }catch(_){}
      if(!deadSince) deadSince=Date.now();
      else if(Date.now()-deadSince>1000){
        try{ c.close(); }catch(_){}
        AC=null; deadSince=0; c=make();
        if(c && c.state!=='running'){ try{ c.resume(); }catch(_){} }
      }
    } else deadSince=0;
    return c;
  }
  function unlock(){ ensureRunning(); }
  addEventListener('pointerdown',unlock,{passive:true,capture:true});
  addEventListener('touchstart',unlock,{passive:true,capture:true});
  /* 画面が戻ってきたときは、止まっている音の装置を起こし直す
     （iPhoneは他のアプリに切り替えると止めることがある） */
  function wake(){ const c=AC; if(c && c.state!=='running'){ try{c.resume();}catch(_){} } }
  addEventListener('pageshow', wake);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) wake(); });

  /* 実際に音を出す部分。ここは「装置が動いている」ときだけ呼ぶ */
  function beep(c){
    const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t);        /* ラの音・単純でやわらかい */
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.38,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.07);
  }

  /* ★2026-07-31 「鳴ったり鳴らなかったり」の直し方
     iPhoneは、ページを開いた直後の音の装置が「止まった状態」で始まる。
     動き出す（resume）のは少し後なので、押してすぐ画面が変わると
     音が鳴る前に前のページが消えてしまう＝無音になっていた。
     そこで
       ・鳴らせたかどうかを返す（true＝すぐ鳴った）
       ・すぐ鳴らせなかったときは、動き出したら鳴らす（nnSoundReady で待てる）
     ようにして、ナビ側が「音が出るのを待ってから画面を移る」ようにした。 */
  window.nnSoundReady=null;
  window.nnMoveSound=function(){
    const now=Date.now(); if(now-last<160)return true; last=now;   /* 連続再生を抑える */
    try{
      const c=ensureRunning(); if(!c)return true;
      if(c.state==='running'){ beep(c); return true; }
      /* まだ動いていない：起こしてから鳴らす。ナビ側はこれを待てる */
      window.nnSoundReady=new Promise(function(res){
        let done=false;
        const fin=function(){ if(done)return; done=true; res(); };
        /* ★2026-08-26b 「起きてから鳴らす」だと、起きるのが遅い回は画面が変わって
           鳴らずじまいだった。止まった装置への予約は動き出した瞬間に鳴るので、
           先に鳴る予約だけ入れておく（＝鳴ったり鳴らなかったりの残りを解消）。 */
        try{ beep(c); }catch(_){}
        try{ const p=c.resume(); if(p&&p.then) p.then(fin, fin); else fin(); }catch(_){ fin(); }
        setTimeout(fin, 120);      /* 起きなくても待たせすぎない */
      });
      return false;
    }catch(_){ return true; }
  };
})();
</script>
<script>
/* ============ ナビ：指を触れたまま移動できる操作（2026-07-28 改） ============
   ・指を置いた瞬間にアイコンが光って音が鳴る
   ・そのまま 0.09秒 指が止まっていれば、離すのを待たずに移動する（＝速い）
   ・押したまま横へなぞると指の下のアイコンが反応し、離した先へ移動する
   ・アイコンの外で離せば移動しない（やめられる）

(function(){
  const nav=document.getElementById('nav')||document.querySelector('nav');
  if(!nav)return;
  let dragging=false, cur=null;
  const itemAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('nav .ni'):null; };
  let lastSnd=0;
  function focus(ni){
    if(ni===cur)return;
    if(!ni)return;                     /* アイコンの隙間に指がかかっても、直前の選択を保つ
                                          （指のわずかな揺れで音が連発するのを防ぐ） */
    if(cur)cur.classList.remove('press');
    cur=ni; cur.classList.add('press');
    /* 音を鳴らす。すぐ鳴らせなかったときは、移動を少しだけ待つ（下の go を参照） */

    if(window.nnMoveSound)try{ sndNow=(nnMoveSound()!==false); }catch(_){}
    /* ★先読みの fetch は削除（2026-07-28）。移動処理と取り合って遅くなっていた。 */
  }
  /* ★ここが「遅い」の正体だった（2026-07-28 画面録画の実測で判明）
     以前は「指を離したとき」に初めて移動していた。画面録画を1コマずつ調べると、
     アイコンが光ってから画面が変わるまで約0.9秒、その間まったく何も起きていない。
     ＝ページの読み込みが遅いのではなく、指を離すまで移動を始めていなかった。
     そこで「指を置いて 0.09秒たっても動かさなければ、離すのを待たずに移動する」
     方式にした。なぞって選び直したい場合（指を動かした場合）は今までどおり、
     指を離した先のアイコンへ移動する。 */
  const HOLD_MS=90;          /* この時間だけ指が止まっていたら、離すのを待たずに移動 */
  const MOVE_PX=10;          /* この距離より動いたら「なぞり操作」とみなす */
  let goTm=0, downPt=null, gone=false;
  let sndNow=true;
  function go(t){
    if(gone)return;
    if(!t||t.classList.contains('on'))return;
    const m=(t.getAttribute('onclick')||'').match(/navGo\('([^']*)'\s*,\s*'([^']*)'\)/);
    if(!(m&&typeof navGo==='function'))return;
    gone=true;
    /* ★音がすぐ鳴ったときは今までどおり即移動（速さは変えない）。
       鳴らなかったときだけ、音が出るのを最大0.16秒待ってから移動する。 */
    if(sndNow || !window.nnSoundReady){ navGo(m[1],m[2]); return; }
    let moved=false;
    const jump=function(){ if(moved)return; moved=true; navGo(m[1],m[2]); };
    try{ window.nnSoundReady.then(function(){ setTimeout(jump, 30); }); }catch(_){}
    setTimeout(jump, 160);
  }
  function cancelHold(){ if(goTm){clearTimeout(goTm); goTm=0;} }
  nav.addEventListener('pointerdown',e=>{
    const ni=e.target.closest&&e.target.closest('.ni'); if(!ni)return;
    dragging=true; cur=null; gone=false; downPt=[e.clientX,e.clientY]; focus(ni);
    try{nav.setPointerCapture(e.pointerId);}catch(_){}
    cancelHold();
    goTm=setTimeout(()=>{ goTm=0; go(cur); }, HOLD_MS);
  });
  nav.addEventListener('pointermove',e=>{
    if(!dragging)return;
    if(downPt && Math.abs(e.clientX-downPt[0])+Math.abs(e.clientY-downPt[1])>MOVE_PX) cancelHold();
    focus(itemAt(e.clientX,e.clientY));
  });
  function finish(e){
    if(!dragging)return;
    dragging=false; cancelHold();
    const t=cur; if(cur){cur.classList.remove('press'); cur=null;}
    go(t);
  }
  nav.addEventListener('pointerup',finish);
  nav.addEventListener('pointercancel',()=>{dragging=false; cancelHold(); if(cur){cur.classList.remove('press'); cur=null;}});
  /* 上の処理で移動するので、通常のクリックは止める（二重に移動しないように） */
  nav.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); },true);
})();
</script>

<style id="nn-fillh">
/* ============================================================
   画面のいちばん下まで使い切る（2026-07-29）
   ------------------------------------------------------------
   これまでアプリの高さは 100dvh（＝画面の高さ）で指定していたが、
   iPhoneをたてに持つと、この値が実際に見えている高さより小さくなり、
   画面の下のほうに、何も置かれない帯（すき間）ができていた。
   下の script で「実際に見えている高さ」を測って --nnvh に入れ、
   それをアプリの高さに使う。
   ※ズレが無いときは今までと同じ値になるので、見た目は変わらない。
   ============================================================ */
body{ height:var(--nnvh,100dvh) !important; }
</style>
<script id="nn-fillh-js">
/* ============================================================
   画面のいちばん下まで使い切る（2026-07-29）
   ・--nnvh ＝ 実際に見えている画面の高さ
   ・表示中の画面（一覧・ダッシュボード等）の下に余りがあれば、そのぶん伸ばす
   　（すき間があるときだけ動くので、余りが無ければ何もしない）
   ============================================================ */
(function(){
  var VIEWS = null;
  /* ホーム画面のアイコンから起動しているか（＝全画面のアプリとして開いているか） */
  function isStandalone(){
    try{
      if(navigator.standalone === true) return true;
      return matchMedia('(display-mode: standalone)').matches
          || matchMedia('(display-mode: fullscreen)').matches;
    }catch(e){ return false; }
  }
  /* 画面のいちばん下に貼っておく、見えない1pxの目印。
     ★iPhoneをたてに持つと、端末が申告してくる「画面の高さ」が
       実際に見えている高さより小さいことがある（このページのように
       画面を縮めて表示していると起きる）。その申告値をそのまま使うと、
       画面の下のほうに何も置かれない帯（すき間）が残ってしまう。
       目印は画面の下端に貼り付いているので、その位置を測れば
       「本当の下端」が分かる。 */
  var probe = null;
  function probeBottom(){
    if(!probe || !probe.parentNode){
      probe = document.createElement('div');
      probe.id = 'nnBtmProbe';
      probe.setAttribute('style','position:fixed;left:0;bottom:0;width:1px;height:1px;'
        + 'pointer-events:none;opacity:0;z-index:-1;');
      (document.body || document.documentElement).appendChild(probe);
    }
    return probe.getBoundingClientRect().bottom;
  }
  /* ★★2026-09-07e 指で拡大しても画面が崩れないように「組み立ての大きさ」で測る（§319）。
     iPhoneは指で拡大すると innerWidth・innerHeight まで**いま見えている範囲**の大きさに
     変わる（パソコンのブラウザは変わらない）。それをそのまま画面の高さ・縮小率に使うと、
     拡大した分だけ中身が短く・小さくなり、下に何も無い帯が出る＝「ズームすると見切れる」。
     documentElement の clientWidth/clientHeight は**拡大しても変わらない**ので、こちらで測る。 */
  function LW(){ var d=document.documentElement; return (d&&d.clientWidth)||window.innerWidth; }
  function LH(){ var d=document.documentElement; return (d&&d.clientHeight)||window.innerHeight; }
  function isZoomed(){ var vv=window.visualViewport; return !!(vv && vv.width < LW()*0.96); }
  function pageH(){
    var vv = window.visualViewport;
    var h = LH();
    /* 文字入力でキーボードが出ると visualViewport は小さくなるので、大きいほうを採る
       （★指で拡大している間は小さくなって当たり前なので、そのときは見ない） */
    if(vv && !isZoomed() && vv.height > h) h = vv.height;
    /* 目印のほうが下にあれば、そちらが本当の下端。
       ブラウザで開いているときは下のバーの分だけ縮むのが正しいので、この直しは
       ホーム画面から起動したときだけ効かせる。あり得ない大きさは念のため採らない。 */
    if(isStandalone()){
      var t = probeBottom();
      if(t > h + 1 && t < h * 3) h = t;
      /* ★2026-08-27a ホーム画面起動＝全画面なので、画面そのもの（screen）の高さが本当の高さ。
         申告(innerHeight)・visualViewport・目印のすべてが小さいまま嘘をつく端末があり
         （実機スクショの実測：中身が60pt短く、その下にページの背景色が塗られていた）、
         その場合は screen だけが正しい。
         ・iPhoneの screen は向きに関係なく「たて向きの値」なので、よこ向きは短い方を使う
         ・縮小して表示するページ（width=980）ではCSSのpxと合わないが、
           そのときは h が screen よりずっと大きいので下の条件に入らない（保護） */
      var scH = (LW() > LH()) ? Math.min(screen.width, screen.height)
                              : Math.max(screen.width, screen.height);
      var scW = (LW() > LH()) ? Math.max(screen.width, screen.height)
                              : Math.min(screen.width, screen.height);
      /* ★2026-08-27h 縮小して表示するページ（width=980）は、CSSのpxと画面のptが合わない。
         「画面の1pt＝CSSの何px」（innerWidth÷画面の幅）を掛けて、CSSのpxに直してから比べる。
         等倍のページでは innerWidth＝画面の幅なので倍率1＝今までと同じ。
         （直す前は pt のまま比べていたため、縮小ページだけこの直しが一度も効かず、
         　下に約60ptの帯が残っていた＝実機で発生） */
      var sc = (scW > 0) ? scH * (LW() / scW) : scH;
      if(sc > h + 1 && sc < h * 1.6) h = sc;
    }
    return Math.round(h);
  }
  /* ★2026-08-24aa 0.8秒ごとの見直しは「変わったときだけ」にする。
     この処理は画面の高さを測り直すので、そのたびに**画面ぜんぶの置き場所の計算**が走る。
     ・窓の大きさ ・下部ナビの出入り ・表示中の画面 ・表示倍率
     のどれも変わっていなければ、測らずにそのまま戻る（見え方は今までどおり）。
     中身の高さが変わったときは、呼ぶ側が fill(true) で「必ず測る」と伝える。 */
  var _fsig='';
  function fillSig(){
    var vv=window.visualViewport, nav=document.getElementById('nav');
    var s=[LW(), LH(),
           /* ★指で拡大している間は vv の大きさが刻々と変わるので、合図には「拡大中」とだけ入れる */
           isZoomed()?'zoom':(vv?Math.round(vv.width)+'x'+Math.round(vv.height):'-'),
           nav?(nav.style.marginBottom+'|'+nav.style.transform+'|'+nav.className):'-',
           window.nnPZ||1];
    /* ★2026-08-26b ホーム画面から起動したiPhoneは、innerHeight が実際より小さい値の
       まま変わらないことがある（§5-2）。本当の下端（目印）は起動の少し後に伸びるが、
       申告値だけを見る合図では「変わっていない」ことになり、
       「変わったときだけ測る」（2026-08-24ab）が一度も測り直さない
       ＝画面の下に黒い帯が残っていた（実機で発生）。目印も合図に入れる。 */
    if(isStandalone()) s.push(Math.round(probeBottom()));
    if(VIEWS) for(var i=0;i<VIEWS.length;i++){
      var e=document.getElementById(VIEWS[i]);
      s.push(e?(e.className+'/'+(e.style.display||'')):'-');
    }
    return s.join(',');
  }
  function fill(force){
    if(!force){ var sg=fillSig(); if(sg===_fsig) return; _fsig=sg; }
    else _fsig=fillSig();
    /* ★2026-08-11a パソコンで表示倍率（zoom）をかけているときは、
       innerHeight（実画面のpx）をそのまま使うと body の高さが倍率ぶん大きくなる。
       倍率で割って「CSSのpx」に直す。 */
    var _z = window.nnPZ || 1;
    var pb = pageH() / _z;
    document.documentElement.style.setProperty('--nnvh', pb + 'px');
    /* ★2026-08-27h 下部ナビが position:fixed のページ（国交省仕様・現場マップ）では、
       ナビは「申告された画面の下端」に貼り付く。ホーム画面起動のiPhoneが高さを
       実際より小さく申告したままだと（§221）、ナビの下に帯が残る＝CSSでは直せない。
       本当の高さ（pb）との差のぶんだけ下へずらして、本当の下端に貼り直す。
       ふつうの端末・ふつうのページでは差が0なので何も変わらない。 */
    try{
      var _nv=document.getElementById('nav');
      if(_nv && getComputedStyle(_nv).position==='fixed'){
        /* ★2026-09-13u 差は「本当の下端 − fixed の下端が実際に来る場所（目印）」で取る。
           以前は申告された高さ（LH）との差だったため、①申告は正しいのに fixed だけ上に
           止まる端末では押し下げが 0 で帯の下に空きが残り、②申告が小さい端末では
           逆に押し下げ過ぎて2段目が画面の外へ出た（本人の実機）。 */
        var _d=Math.round(pb - probeBottom()/_z);
        _nv.style.bottom=(_d>2)? (-_d+'px') : '';
      }
      /* ▲（ナビを出すボタン）も fixed なので、同じ差のぶん下げる（負の margin で押し下げる） */
      var _vt=document.getElementById('navShowTab');
      if(_vt){ var _d2=Math.round(pb - probeBottom()/_z);
        _vt.style.marginBottom=(_d2>2)? (-_d2+'px') : ''; }
    }catch(_){}
    if(_z !== 1){                      /* 倍率をかけているときは下の余白うめをしない（パソコン用） */
      if(VIEWS) VIEWS.forEach(function(id){ var e=document.getElementById(id); if(e) e.style.minHeight=''; });
      return;
    }
    if(!VIEWS) return;
    var v = null;
    for(var i=0;i<VIEWS.length;i++){
      var e = document.getElementById(VIEWS[i]);
      if(e && e.offsetParent !== null){ v = e; break; }
    }
    if(!v) return;
    /* 下部ナビが場所を取っている高さ（自動で隠れているときは 0） */
    var navOcc = 0;
    var nav = document.getElementById('nav');
    if(nav){
      var ns = getComputedStyle(nav);
      if(ns.display !== 'none' && ns.position !== 'fixed' && ns.position !== 'absolute'){
        var mb = parseFloat(nav.style.marginBottom || '0') || 0;   /* 隠れているときは負の値 */
        navOcc = Math.max(0, nav.offsetHeight + mb);
      }
    }
    if(v.style.minHeight) v.style.minHeight = '';      /* いったん元に戻して測る */
    var r = v.getBoundingClientRect();
    var gap = (pb - navOcc) - r.bottom;                 /* 下に余っている高さ */
    if(gap > 2) v.style.minHeight = Math.round(r.height + gap) + 'px';
  }
  fill(true);
  addEventListener('load', function(){ fill(true); });
  /* ★2026-08-26b 起動直後は画面の高さが何度か変わる（起動アニメ・申告の遅れ）。
     合図が同じでも、最初だけは念のため測り直す（3回だけ・そのあとは今までどおり） */
  [300,1200,3000].forEach(function(t){ setTimeout(function(){ fill(true); }, t); });
  addEventListener('resize', function(){ fill(true); });
  addEventListener('orientationchange', function(){ setTimeout(function(){ fill(true); }, 300); });
  setInterval(fill, 800);        /* ナビの自動開閉・画面の切替に追従する */
  window.nnFillBottom = fill;
})();
</script>

<style id="nn-hdr-std">
/* ============================================================
   上ヘッダーの大きさを全ページでそろえる（2026-07-30／基準＝現場記録帳）
   ------------------------------------------------------------
   ★ページごとに「画面の縮み方」が違うのが原因だった。
     現場記録帳・国交省仕様・仕様登録・材料登録は、幅980で組み立てて
     端末の幅に合わせて約0.40倍に縮めて表示している。
     ライブラリ・カメラ・発注・用語集・現場マップは縮めず等倍で表示している。
     だから同じ「64px」と書いても、前者では画面上25pt・後者では64ptになり、
     ページを移動するたびにヘッダーの厚みが2.5倍も上下していた。
     （実測：現場記録帳45pt ／ ライブラリ・カメラ・発注・用語集・現場マップ99pt）

   直し方：現場記録帳の数値に「そのページの倍率」を掛けて指定する。
     倍率 --nnhm ＝ そのページの組み立て幅 ÷ 980（現場記録帳の組み立て幅）
     ・幅980のページ  → 1.00（今までどおり）
     ・等倍のページ    → 約0.40（縮めていない分だけ小さく指定する）
   これで、どのページでも画面上は同じ大きさで表示される。
   たて・よこを回しても自動で計算し直すので、向きが変わってもそろう。
   ============================================================ */
/* ★`header` だけだと、現場マップの `header#topbar`（ID付き＝より強い指定）に負ける。
   ID付きの書き方も並べて書くこと。 */
header, header#topbar{
  /* ★2026-09-13u env() は実際の画面のpx。縮める倍率 --nnhm ではなく、左右と同じ --nnsaf で割り増す */
  padding-top:calc(5px * var(--nnhm,1) + env(safe-area-inset-top,0px) * var(--nnsaf,1)) !important;
  padding-bottom:calc(5px * var(--nnhm,1)) !important;
  /* ★左右は「ノッチ（丸角）の逃げ」を足す。
     よこ向きのiPhoneは左右に59ptの使えない帯ができるため、
     これを入れないと両端のボタンが隠れて押せなくなる。
     ★逃げの量は --nnsaf で割り増しする。env() が返す値は
       「組み立てたときの px」なので、画面を0.40倍に縮めるページでは
       そのまま使うと0.40倍に縮んでしまい、ノッチを避けきれない。 */
  padding-left:calc(11px * var(--nnhm,1) + env(safe-area-inset-left,0px) * var(--nnsaf,1)) !important;
  padding-right:calc(11px * var(--nnhm,1) + env(safe-area-inset-right,0px) * var(--nnsaf,1)) !important;
  gap:calc(10px * var(--nnhm,1)) !important;
}
/* ★h1と.hiconの「文字の大きさ」も掛け算すること。
   これを忘れると、中の画像は小さくなっても文字の行の高さが元のままで、
   箱だけ大きく残って帯が厚くなる（実際にライブラリで18pt残った）。 */
/* 画像がまだ無いページ（文字の見出し）が、画像の見出しと同じくらいの
   大きさに見えるようにする。画像のページは line-height:1 なので影響なし。 */
header h1{font-size:calc(30px * var(--nnhm,1)) !important; line-height:1 !important;}
header h1 img{height:calc(36px * var(--nnhm,1)) !important;}
header .hicon{font-size:calc(19px * var(--nnhm,1)) !important; line-height:1 !important;}

<script id="nn-hdr-std-js">
/* 倍率 --nnhm を計算して渡す（＝そのページの組み立て幅 ÷ 980） */
(function(){
  function set(){
    try{
      /* ★パソコンでは倍率1（＝今までどおり）にすること。
         パソコンのブラウザは viewport の width=980 指定を無視するため、
         画面を縮めて表示していない。ここで innerWidth/980 を掛けると
         ヘッダーだけ1.5倍に膨らんでしまう。 */
      var dev = Math.min(screen.width || 0, screen.height || 0);
      var phone = dev && dev < 700;
  /* ★★2026-09-07e 指で拡大しても画面が崩れないように「組み立ての大きさ」で測る（§319）。
     iPhoneは指で拡大すると innerWidth・innerHeight まで**いま見えている範囲**の大きさに
     変わる（パソコンのブラウザは変わらない）。それをそのまま画面の高さ・縮小率に使うと、
     拡大した分だけ中身が短く・小さくなり、下に何も無い帯が出る＝「ズームすると見切れる」。
     documentElement の clientWidth/clientHeight は**拡大しても変わらない**ので、こちらで測る。 */
  function LW(){ var d=document.documentElement; return (d&&d.clientWidth)||window.innerWidth; }
  function LH(){ var d=document.documentElement; return (d&&d.clientHeight)||window.innerHeight; }
      var m = phone ? ((LW() || 980) / 980) : 1;
      if(!(m > 0.05 && m < 4)) m = 1;              /* あり得ない値は採らない */
      document.documentElement.style.setProperty('--nnhm', m.toFixed(4));
      /* ノッチの逃げの割り増し（＝そのページの縮小率の逆数）。
         いま向いている方の画面の幅で計算すること。 */
      var pr = true;
      try{ pr = matchMedia('(orientation:portrait)').matches; }catch(e){ pr = LH() > LW(); }
      var scr = pr ? Math.min(screen.width||0, screen.height||0) : Math.max(screen.width||0, screen.height||0);
      var saf = (phone && scr > 0) ? ((LW() || scr) / scr) : 1;
      if(!(saf > 0.5 && saf < 5)) saf = 1;
      document.documentElement.style.setProperty('--nnsaf', saf.toFixed(4));
    }catch(e){}
  }
  set();
  addEventListener('resize', set);
  addEventListener('orientationchange', function(){ setTimeout(set, 300); });
  addEventListener('load', set, {once:true});
})();
</script>

<style id="nn-pczoom">
/* ★2026-08-11a パソコンの「表示の大きさ」をモニターに関わらずそろえる（本人の指示）
   ------------------------------------------------------------------
   同じ拡大100%でも、大きいモニター（横に広い）ほど1画面に入るpxが増えるので、
   文字やボタンが相対的に小さく見える。そこで
     倍率 ＝ 画面の横幅 ÷ 1600px（1.00〜1.60の範囲）
   を html に zoom でかけ、どのモニターでも同じ見え方になるようにした。
   ★スマホ（data-nnphone="1"）は今までどおり。倍率はかけない。
   ★2026-08-11b：手動の倍率ボタンは削除（パソコンはブラウザの拡大縮小が使えるため）。 */
</style>
<script id="nn-pczoom-js">
(function(){
  if(document.documentElement.getAttribute('data-nnphone')==='1'){ window.nnPZ=1; return; }
  var BASE=1600, MINZ=1.00, MAXZ=1.60;
  function autoZ(){
    var z=(window.innerWidth||1600)/BASE;
    z=Math.round(z*20)/20;                       /* 0.05きざみ */
    return Math.min(MAXZ, Math.max(MINZ, z));
  }
  function apply(){
    var z=autoZ();
    window.nnPZ=z;
    document.documentElement.style.zoom = (z===1 ? '' : z);
    document.documentElement.style.setProperty('--nnpzr', z);
    document.documentElement.setAttribute('data-nnpz', z===1 ? 'off' : 'on');
    try{ if(window.nnFillBottom) window.nnFillBottom(); }catch(e){}
    try{ if(window.nnFitMapApp) window.nnFitMapApp(); }catch(e){}
    try{ if(window.nnSecRefresh) window.nnSecRefresh(); }catch(e){}
  }
  apply();
  addEventListener('resize', apply);
})();
</script>

<script id="nn-httl-js">
/* 見出しの文字だけを span.httl で包む。
   ★右端に置く補助の文字（.r／.cta など）は包まない＝タグの外に残す。
   ★中身を作り直すページ（国交省仕様・ライブラリ等）があるので、
     作り直されたら包み直す（MutationObserver・0.2秒のまとめ）。 */
(function(){
  var SEL='.panel > h4, .wr-box > h4, .dpanel > h4, .proc-card > h4, .notebox-h > h4';
  /* ★2026-10-03h 補足の .s も包まない。包むと斜めの枠の中で横一列のままになり、スマホで③の見出しが枠ごとカードの右へはみ出していた */
  var STOP=/(^|\s)(r|cta|zx|colgear|sub|hcount|tag|s)(\s|$)/;
  function wrap(h){
    if(h.getAttribute('data-nnht')==='1') return;
    if(h.querySelector('.httl')){ h.setAttribute('data-nnht','1'); return; }
    var kids=[].slice.call(h.childNodes);
    var sp=document.createElement('span'); sp.className='httl';
    for(var i=0;i<kids.length;i++){
      var n=kids[i];
      if(n.nodeType===1 && STOP.test(' '+String(n.className||'')+' ')) break;
      sp.appendChild(n);
    }
    if(!String(sp.textContent||'').trim()){        /* 包むものが無いときは何もしない */
      while(sp.firstChild) h.insertBefore(sp.firstChild, h.firstChild);
      return;
    }
    h.insertBefore(sp, h.firstChild);
    h.setAttribute('data-nnht','1');
  }
  function run(){ try{ [].forEach.call(document.querySelectorAll(SEL), wrap); }catch(e){} }
  if(document.readyState==='loading') addEventListener('DOMContentLoaded',run); else run();
  addEventListener('load',function(){ setTimeout(run,200); });
  try{
    var t=null;
    new MutationObserver(function(){ if(t)return; t=setTimeout(function(){ t=null; run(); },200); })
      .observe(document.body,{childList:true,subtree:true});
  }catch(e){}
})();
</script>

  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);}
/* ★2026-10-08i 色・配置は現場記録帳に合わせる（本人）：クリーム地・緑の見出し帯・オレンジの決定ボタン・灰色の控えボタン・角3px・ぼかした影なし */
#osv.on{display:flex;}
#osv .ph{position:relative; flex:1 1 auto; min-width:0; min-height:0; background:#1e2420; overflow:hidden;}
#osv canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}
#osv .pn{flex:0 0 300px; display:flex; flex-direction:column; gap:8px; padding:10px; background:var(--paper,#f3efdd); border-left:3px solid var(--green-deep,#1c6b3c); min-height:0;}
html[data-nnphone="1"] #osv{flex-direction:column;}
html[data-nnphone="1"] #osv .pn{flex:0 0 46%; border-left:0; border-top:3px solid var(--green-deep,#1c6b3c);}
@media (orientation:landscape){ html[data-nnphone="1"] #osv{flex-direction:row;} html[data-nnphone="1"] #osv .pn{flex:0 0 38%; border-top:0; border-left:3px solid var(--green-deep,#1c6b3c);} }
#osv button{font-family:inherit; cursor:pointer;}
#osv .pn > *{flex:0 0 auto;}   /* ボタンが縮んで潰れないように（一覧だけが伸び縮みする） */
#osv .bar{display:flex; gap:6px;}
#osv .bar button{flex:1; border-radius:3px; font-weight:900; font-size:13px; padding:6px 4px;
  background:linear-gradient(180deg,#f2f2ee,#dcdcd4); border:1.5px solid #a9a99f; color:#333; box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 2px 0 #8b8b81;}
#osv .ttl{display:flex; align-items:center; gap:6px; background:linear-gradient(180deg,#22804a,#1c6b3c); padding:4px 4px 4px 10px; border-radius:3px;}
#osv .ttl b{flex:1; color:#fff; font-size:14px; font-weight:900; letter-spacing:.03em;}
#osv .ttl button{border:1.5px solid #fff; background:transparent; color:#fff; font-size:11.5px; font-weight:900; padding:3px 7px; border-radius:3px;}
/* 仕様の一覧 */
#osv .pn > .spl{flex:1 1 auto;}
#osv .chips{display:flex; flex-wrap:wrap; gap:4px;}
#osv .chips button{border:1.5px solid #747e77; border-radius:3px; background:#fff; color:#222826; font-size:11.5px; font-weight:900; padding:3px 7px;}
#osv .chips button.on{background:linear-gradient(180deg,#22804a,#1c6b3c); border-color:#124a28; color:#fff;}
#osv .spl{flex:1 1 auto; min-height:0; overflow-y:auto; background:#fff; border:2px solid #747e77; border-radius:3px; -webkit-overflow-scrolling:touch; touch-action:pan-y;}
#osv .spl table{width:100%; border-collapse:collapse; color:var(--ink,#222826); font-size:13px;}
#osv .spl th{position:sticky; top:0; background:linear-gradient(180deg,#22804a,#1c6b3c); color:#fff; font-weight:900; padding:6px 4px; font-size:12px; z-index:1;}
#osv .spl td{border-top:1px solid var(--line,#d7dcd4); padding:3px 4px; text-align:center; font-weight:700;}
#osv .spl tr.on td{background:#fff3c4;}
#osv .spl tr.on td:first-child{box-shadow:inset 4px 0 0 #e07800;}
#osv .spl td img{width:40px; height:30px; object-fit:contain; display:block; margin:auto;}
#osv .go{min-height:44px; border-radius:3px; color:#fff; font-size:16px; font-weight:900; padding:10px 8px; line-height:1.35; letter-spacing:.03em;
  background:linear-gradient(180deg,#ff9d1e,#e07800); border:1.5px solid #b35f00; text-shadow:0 1px 0 rgba(0,0,0,.3); box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 3px 0 #b35f00;}
#osv .go:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 1px 0 #b35f00;}
#osv .go:disabled{background:#c9c9c1; border-color:#a9a99f; color:#f4f4f0; box-shadow:0 3px 0 #8b8b81; text-shadow:none;}
/* 該当材料 */
#osv .pn > .mg{flex:1 1 auto;}
#osv .mg{flex:1 1 auto; min-height:0; overflow-y:auto; background:#fff; border:2px solid #747e77; border-radius:3px; padding:10px 6px 6px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px 6px; align-content:start; touch-action:pan-y;}
#osv .mt{position:relative; border:2px solid #c9d2c6; border-radius:3px; background:#fbfaf4; padding:4px 2px 2px; color:var(--ink,#222826); font-size:10.5px; font-weight:900; display:flex; flex-direction:column; align-items:center; gap:2px; min-height:0;}
#osv .mt img{width:100%; height:44px; object-fit:contain;}
#osv .mt span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
#osv .mt.sel{border-color:#e07800; background:#fff3c4;}
#osv .mt.done{border-color:var(--green,#2e9e58);}
#osv .mt i{position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-style:normal; font-size:9.5px; color:#fff; padding:0 4px; white-space:nowrap; border-radius:2px;}
#osv .mt.sel i{background:#e07800;} #osv .mt.done:not(.sel) i{background:var(--green,#2e9e58);}
#osv .sh{display:flex; gap:8px;}
#osv .sh button{flex:1; border-radius:3px; color:#fff; font-weight:900; font-size:14px; padding:7px 4px;
  background:linear-gradient(180deg,#22804a,#1c6b3c); border:1.5px solid #124a28; box-shadow:0 2px 0 #124a28;}
#osv .sh .line{flex:0 0 56px; background:#06c755; border-color:#04933f; box-shadow:0 2px 0 #04933f;}
/* 写真の上の札（記録帳の札と同じ：白地・濃い灰の枠・角3px） */
#osv .lg{position:absolute; left:10px; top:10px; display:flex; flex-direction:column; gap:6px; pointer-events:none;}
#osv .lg div{background:#fff; color:#222826; border:2px solid #747e77; font-size:12px; font-weight:900; padding:3px 10px; border-radius:3px; display:flex; align-items:center; gap:8px;}
#osv .lg u{display:inline-block; width:36px; height:4px; text-decoration:none;}
#osv .bd{position:absolute; right:10px; top:8px; display:none; flex-direction:column; align-items:flex-end; gap:4px; pointer-events:none; max-width:42%;}
#osv .bd .cd{display:flex; border:2px solid #124a28; border-radius:3px; overflow:hidden;}
#osv .bd .cd b{background:#fff; color:#1c6b3c; font-size:20px; font-weight:900; padding:1px 10px;}
#osv .bd .cd em{background:linear-gradient(180deg,#22804a,#1c6b3c); color:#fff; font-style:normal; font-size:16px; font-weight:900; padding:3px 8px;}
#osv .bd .nm{background:#fff; color:#222826; border:1.5px solid #747e77; border-radius:3px; font-size:11px; font-weight:900; padding:1px 8px;}
#osv .bd table{background:#fff; color:#222; border-collapse:collapse; font-size:9.5px; max-width:100%; border:1.5px solid #747e77;}
#osv .bd td{border:1px solid #b9c4b4; padding:1px 4px; line-height:1.3;}
#osv .bd tr:first-child td{background:#e2f6e9; color:#1c6b3c; font-weight:900;}
#osv .bd tr.hl td{background:#fff3c4; font-weight:900;}
#osv .tl{position:absolute; left:10px; top:50%; transform:translateY(-50%); display:none; flex-direction:column; gap:8px;}
#osv .tl button{width:44px; height:44px; border:2px solid #747e77; border-radius:3px; background:#fff; color:#222; font-size:20px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-direction:column; line-height:1; box-shadow:0 2px 0 #8b8b81;}
#osv .tl button u{display:block; width:28px; height:5px; margin-top:3px;}
#osv .tl button.on{border-color:#1aa3e8; background:#e6f5fd;}
#osv .hs{position:absolute; display:none; flex-direction:column; pointer-events:auto;}
#osv .hs div{display:flex; background:#fff; border:2px solid #747e77; border-radius:3px 3px 0 0;}
#osv .hs div b{background:#e0102a; color:#fff; font-size:12px; font-weight:900; padding:4px 6px;}
#osv .hs select{border:0; font:inherit; font-size:14px; font-weight:900; padding:2px 4px;}
#osv .hs button{border:2px solid #b35f00; border-top:0; border-radius:0 0 3px 3px; background:linear-gradient(180deg,#ff9d1e,#e07800); color:#fff; font-weight:900; font-size:13px; padding:4px;}
#osv .ins{position:absolute; right:0; bottom:0; width:30%; max-width:240px; display:none; border:2px solid #747e77; background:#fff; pointer-events:none;}
#osv .ins b{display:block; text-align:center; color:#fff; background:linear-gradient(180deg,#22804a,#1c6b3c); font-size:11px; font-weight:900; padding:1px;}
#osv .ins img{display:block; width:100%;}
#osv .msg{position:absolute; left:50%; bottom:12px; transform:translateX(-50%); background:rgba(0,0,0,.72); color:#fff; font-size:13px; font-weight:800; padding:6px 12px; border-radius:6px; pointer-events:none; white-space:nowrap; display:none;}
</style>

/* ---------- 画面の大きさ（写真は枠に収める） ---------- */
var FIT={s:1,x:0,y:0};
function fit(){
  var r=$('osPh').getBoundingClientRect(), d=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*d)); cv.height=Math.max(1,Math.round(r.height*d));
  if(!S.W){ FIT={s:1,x:0,y:0}; return; }
  var s=Math.min(r.width/S.W, r.height/S.H);
  FIT={s:s, x:(r.width-S.W*s)/2, y:(r.height-S.H*s)/2, d:d};
}
function toImg(cx,cy){ var r=cv.getBoundingClientRect(); return {x:(cx-r.left-FIT.x)/FIT.s, y:(cy-r.top-FIT.y)/FIT.s}; }
function toScr(p){ return {x:FIT.x+p.x*FIT.s, y:FIT.y+p.y*FIT.s}; }
/* ---------- 形を作る（すべて写真の画素で持つ） ---------- */
function unit(a,b){ var dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1; return {x:dx/l,y:dy/l,l:l}; }
function add(p,v,k){ return {x:p.x+v.x*k, y:p.y+v.y*k}; }
/* 増貼り材：対象エッジの角ごとに、床の2枚（それぞれのエッジから外へ）と立上りの2枚（エッジから上へ） */
function patchPolys(){
  var e=S.edge, P=[]; if(e.length<2) return P;
  var up={x:0,y:-1};
  if(e.length===2){
    var u=unit(e[0],e[1]), n={x:u.y,y:-u.x}; if(n.y<0){ n.x=-n.x; n.y=-n.y; }   /* 床側＝画面の下向き */
    var s=Math.min(u.l*0.18, S.H*0.08);
    P.push({f:'w',p:[e[0],e[1],add(e[1],up,s),add(e[0],up,s)]});
    P.push({f:'f',p:[e[0],e[1],add(e[1],n,s),add(e[0],n,s)]});
    return P;
  }
  for(var i=1;i<e.length-1;i++){
    var V0=e[i], d1=unit(V0,e[i-1]), d2=unit(V0,e[i+1]);
    var s2=Math.min(d1.l,d2.l)*0.32; s2=Math.min(s2, S.H*0.11);
    var h=s2*0.95;
    P.push({f:'w',p:[V0,add(V0,d1,s2),add(add(V0,d1,s2),up,h),add(V0,up,h)]});
    P.push({f:'w',p:[V0,add(V0,d2,s2),add(add(V0,d2,s2),up,h),add(V0,up,h)]});
    P.push({f:'f',p:[V0,add(V0,d1,s2),add(add(V0,d1,s2),d2,-s2),add(V0,d2,-s2)]});
    P.push({f:'f',p:[V0,add(V0,d2,s2),add(add(V0,d2,s2),d1,-s2),add(V0,d1,-s2)]});
  }
  return P;
}
function hPx(mm){ return Math.min(S.H*0.25, S.H*0.07*mm/50); }
function volPolys(pts,mm){
  var h=hPx(mm), top=pts.map(function(p){ return {x:p.x,y:p.y-h}; }), out=[];
  for(var i=0;i<pts.length;i++){ var j=(i+1)%pts.length; out.push({f:'s',p:[pts[i],pts[j],top[j],top[i]]}); }
  out.push({f:'t',p:top}); return out;
}
/* ---------- 描く ---------- */
function poly(c,ps,fill,stroke,lw,k,ox,oy){
  if(!ps.length) return; c.beginPath(); ps.forEach(function(p,i){ var x=ox+p.x*k, y=oy+p.y*k; if(i)c.lineTo(x,y); else c.moveTo(x,y); }); c.closePath();
  if(fill){ c.fillStyle=fill; c.fill(); } if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw; c.lineJoin='round'; c.stroke(); }
}
function line(c,ps,col,lw,k,ox,oy,close){
  if(ps.length<2) return; c.beginPath(); ps.forEach(function(p,i){ var x=ox+p.x*k, y=oy+p.y*k; if(i)c.lineTo(x,y); else c.moveTo(x,y); }); if(close)c.closePath();
  c.strokeStyle=col; c.lineWidth=lw; c.lineCap='round'; c.lineJoin='round'; c.stroke();
}
function cen(ps){ var x=0,y=0; ps.forEach(function(p){x+=p.x;y+=p.y;}); return {x:x/ps.length,y:y/ps.length}; }
function drawObj(c,o,k,ox,oy,pre){
  var m=MK[o.k], lw=Math.max(2,3*(k<1?1:k)/ (k<1?1:k));
  lw=pre?3:2;
  if(o.sh==='patch'){ o.polys.forEach(function(q){ poly(c,q.p,pre?(q.f==='w'?'rgba(255,225,0,.18)':'rgba(255,225,0,.12)'):m.fc, pre?m.ln:'rgba(0,0,0,.55)', lw,k,ox,oy); }); }
  else if(o.sh==='volume'){
    if(o.h==null){ line(c,o.pts,m.ln,3,k,ox,oy,o.closed); if(o.closed) poly(c,o.pts,'rgba(232,40,80,.35)',m.ln,3,k,ox,oy); }
    else volPolys(o.pts,o.h).forEach(function(q){ poly(c,q.p, pre?'rgba(232,40,80,.32)':m.fc, pre?m.ln:'rgba(120,110,0,.75)', 2,k,ox,oy); });
  }
  else if(o.sh==='area'){ if(o.closed) poly(c,o.pts, pre?'rgba(255,255,255,.15)':m.fc, pre?m.ln:'rgba(0,0,0,.35)', lw,k,ox,oy); else line(c,o.pts,m.ln,3,k,ox,oy,false); }
  else if(o.sh==='line'){ line(c,S.edge,pre?m.ln:m.fc,(pre?6:9),k,ox,oy,false); }
  else if(o.sh==='point'){ var im=icon(m.ic), z=S.H*0.12*k; if(o.at&&im.complete&&im.naturalWidth){ var w=z*im.naturalWidth/im.naturalHeight; c.drawImage(im,ox+o.at.x*k-w/2,oy+o.at.y*k-z/2,w,z); if(pre){ c.strokeStyle=m.ln; c.lineWidth=2; c.strokeRect(ox+o.at.x*k-w/2,oy+o.at.y*k-z/2,w,z);} } }
  /* 点の目印（かいている途中） */
  if(pre && o.pts && !o.closed){ o.pts.forEach(function(p){ c.fillStyle=m.ln; c.beginPath(); c.arc(ox+p.x*k,oy+p.y*k,5,0,7); c.fill(); }); }
}
function label(c,o,k,ox,oy,fs){
  var pts=o.sh==='patch'?[].concat.apply([],o.polys.map(function(q){return q.p;})):o.sh==='line'?S.edge:o.sh==='point'?[o.at]:o.pts;
  if(!pts||!pts.length) return; var p=cen(pts), x=ox+p.x*k, y=oy+p.y*k, tx=x+60*fs/12, ty=y-30*fs/12, t=MK[o.k].lb;
  c.font='900 '+fs+'px sans-serif'; var w=c.measureText(t).width+14, h=fs+10;
  c.strokeStyle='#111'; c.lineWidth=1.5; c.beginPath(); c.moveTo(x,y); c.lineTo(tx,ty); c.stroke();
  c.fillStyle='#fff'; c.fillRect(tx,ty-h/2,w,h); c.strokeRect(tx,ty-h/2,w,h); c.fillStyle='#111'; c.textBaseline='middle'; c.fillText(t,tx+7,ty+1);
}
function scene(c,k,ox,oy,exp){
  if(!S.img) return;
  c.drawImage(S.img,ox,oy,S.W*k,S.H*k);
  S.objs.forEach(function(o){ drawObj(c,o,k,ox,oy,false); });
  if(S.edge.length) line(c,S.edge,EDGE,exp?Math.max(4,S.W/240):5,k,ox,oy,false);
  if(S.edgeOn) S.edge.forEach(function(p){ c.fillStyle=EDGE; c.beginPath(); c.arc(ox+p.x*k,oy+p.y*k,6,0,7); c.fill(); c.strokeStyle='#fff'; c.lineWidth=2; c.stroke(); });
  if(S.cur && !exp) drawObj(c,S.cur,k,ox,oy,true);
  S.objs.forEach(function(o){ label(c,o,k,ox,oy,exp?Math.max(14,Math.round(S.W/60)):13); });
}
function draw(){
  var d=FIT.d||window.devicePixelRatio||1; ctx.setTransform(d,0,0,d,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  scene(ctx,FIT.s,FIT.x,FIT.y,false); legend(); hs();
}
/* ---------- 写真の上の札 ---------- */
function legend(){
  var h='';
  if(S.phase==='edit'){ h+='<div>対象エッジ <u style="background:'+EDGE+'"></u></div>';
    var k=S.cur&&S.cur.k; if(k&&MK[k].lg) h+='<div>'+MK[k].lg+' <u style="background:'+MK[k].ln+'"></u></div>'; }
  $('osLg').innerHTML=h;
  var rows=$('osSt').rows; for(var i=0;i<rows.length;i++) rows[i].classList.toggle('hl', S.hl>=0 && i-1===S.hl);
}
function hs(){
  var el=$('osHs'), o=S.cur;
  if(!o||o.sh!=='volume'||!o.closed){ el.style.display='none'; return; }
  var mx=-1e9,my=1e9; o.pts.forEach(function(p){ var q=toScr(p); if(q.x>mx)mx=q.x; if(q.y<my)my=q.y; });
  var r=$('osPh').getBoundingClientRect(), w=150;
  el.style.display='flex'; el.style.left=Math.max(4,Math.min(r.width-w-60, mx+12))+'px'; el.style.top=Math.max(60,Math.min(r.height-70, my+20))+'px';
  $('osHok').textContent=(o.h==null?'確定':'確定済（高さを変える）');
}
function msg(t){ var m=$('osMsg'); m.textContent=t; m.style.display=t?'block':'none'; clearTimeout(msg.t); if(t) msg.t=setTimeout(function(){ m.style.display='none'; },2600); }
/* ---------- 右の操作パネル ---------- */
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function panel(){
  var p=$('osPn'), top='<div class="bar"><button type="button" data-a="back">↩ 戻る</button><button type="button" data-a="retake">📷 撮り直す</button></div>';
  if(S.phase==='spec'){
    var chips='<div class="chips">'+KINDS.map(function(k){ return '<button type="button" data-k="'+esc(k)+'"'+(k===KF?' class="on"':'')+'>'+esc(k)+'</button>'; }).join('')+'</div>';
    var rows=SP.map(function(x,i){ if(KF!=='すべて'&&x.k!==KF&&S.sp!==x) return ''; return '<tr data-i="'+i+'"'+(S.sp===x?' class="on"':'')+'><td><img src="./icons/kou_'+x.ic+'.png?v='+V+'" alt=""></td><td>'+esc(x.k)+'</td><td>'+esc(x.c)+'</td></tr>'; }).join('');
    p.innerHTML=top+chips+'<div class="spl"><table><thead><tr><th></th><th>防水種別</th><th>仕様番号</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      +'<button type="button" class="go" data-a="make"'+(S.sp?'':' disabled')+'>選択した仕様で<br>納まりを作成する</button>';
  }else{
    var tiles=S.mats.map(function(m,i){ var d=MK[m.k], cls=(S.cur&&S.cur.k===m.k?' sel':'')+(S.done[m.k]?' done':'');
      return '<button type="button" class="mt'+cls+'" data-m="'+i+'"><i>'+(S.cur&&S.cur.k===m.k?'選択中':S.done[m.k]?'実行済':'')+'</i><img src="./icons/'+(m.alt||d.ic)+'.png?v='+V+'" alt=""><span>'+esc(d.lb)+'</span></button>'; }).join('');
    p.innerHTML=top+'<div class="ttl"><b>'+esc(S.sp.c)+'該当材料</b><button type="button" data-a="ins">既存写真</button><button type="button" data-a="spec">仕様</button></div>'
      +'<div class="mg">'+tiles+'</div><button type="button" class="go" data-a="run">実行</button>'
      +'<div class="sh"><button type="button" data-a="send">✉ 送信</button><button type="button" class="line" data-a="line">LINE</button></div>';
  }
}
function setSpec(sp){
  S.sp=sp; S.mats=matsOf(sp); S.hl=-1;
  $('osCd').textContent=sp.c; $('osNm').textContent='-'+(sp.s||sp.n)+'-';
  $('osSt').innerHTML='<tr><td>工程</td><td>材料・工法</td></tr>'+sp.st.map(function(w,i){ return '<tr><td>'+(i+1)+'</td><td>'+esc(w.length>26?w.slice(0,26)+'…':w)+'</td></tr>'; }).join('');

function phase(ph){

  $('osPen').classList.toggle('on',S.edgeOn); panel(); draw();

function pickMat(i){
  var m=S.mats[i], d=MK[m.k];

    if(S.edge.length<2){ S.cur=null; msg('先に対象エッジ（青）を引いてください'); S.edgeOn=true; $('osPen').classList.add('on'); panel(); draw(); return; }
    S.cur={k:m.k,sh:d.sh,polys:d.sh==='patch'?patchPolys():null};
    msg('「実行」で'+d.lb+'を当てます');
  }else if(d.sh==='point'){ S.cur={k:m.k,sh:'point',at:null}; msg('置く場所をタップしてください'); }
  else{ S.cur={k:m.k,sh:d.sh,pts:[],closed:false,h:null}; msg(d.sh==='volume'?'範囲の角を順にタップ（最初の点に戻ると閉じます）':'塗る（張る）範囲の角を順にタップ（最初の点に戻ると閉じます）'); }

}
function run(){

  if(o.sh==='volume'&&o.h==null){ msg('高さを選んで「確定」を押してください'); return; }
  if(o.sh==='point'&&!o.at){ msg('置く場所をタップしてください'); return; }
  if(o.sh==='patch') o.polys=patchPolys();

function undo(){
  var o=S.cur;

  if(o&&o.at){ o.at=null; draw(); return; }
  if(S.edgeOn&&S.edge.length){ S.edge.pop(); draw(); return; }
  if(S.objs.length){ var r=S.objs.pop(); if(!S.objs.some(function(x){return x.k===r.k;})) delete S.done[r.k]; panel(); draw(); return; }

}
/* ---------- 写真の上のタップ ---------- */
cv.addEventListener('pointerdown',function(e){

$('osPen').addEventListener('click',function(){ S.edgeOn=!S.edgeOn; if(S.edgeOn){ S.cur=null; S.hl=-1; panel(); msg('対象エッジ（青）：タップで点を足す'); } this.classList.toggle('on',S.edgeOn); draw(); });
$('osUndo').addEventListener('click',undo);
$('osHok').addEventListener('click',function(){ var o=S.cur; if(o&&o.sh==='volume'&&o.closed){ o.h=+$('osH').value; msg('「実行」で'+MK[o.k].lb+'を当てます'); draw(); } });
$('osH').addEventListener('change',function(){ var o=S.cur; if(o&&o.h!=null){ o.h=+this.value; draw(); } });
$('osPn').addEventListener('click',function(e){

/* ---------- 共有（画像にして送る） ---------- */

    g.fillStyle='#fff'; g.fillRect(S.W-w-12,12,w,fs+14); g.fillStyle='#111'; g.textBaseline='middle'; g.fillText(t,S.W-w,12+(fs+14)/2);
    var n=S.sp.s||S.sp.n; g.font='900 '+Math.round(fs*0.6)+'px sans-serif'; var w2=g.measureText(n).width+16; g.fillStyle='#fff'; g.fillRect(S.W-w2-12,fs+30,w2,fs*0.6+10); g.fillStyle='#111'; g.fillText(n,S.W-w2-4,fs+30+(fs*0.6+10)/2); }

window.nnOsExport=function(){ return exportCanvas().toDataURL('image/jpeg',0.9); };
function share(kind){

  c.toBlob(function(b){
    var f=null; try{ f=new File([b],name,{type:'image/jpeg'}); }catch(_){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:'納まりイメージ',text:text}).catch(function(){}); return; }
    var u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); },60000);
    if(kind==='line') window.open('https://line.me/R/msg/text/?'+encodeURIComponent(text+'（画像は保存しました。トークに添付してください）'),'_blank');
    else location.href='mailto:?subject='+encodeURIComponent('納まりイメージ '+(S.sp?S.sp.c:''))+'&body='+encodeURIComponent(text+'\n（画像は保存しました。添付してください）');
  },'image/jpeg',0.9);
}
/* ---------- 開く・閉じる ---------- */
function open(src){
  var im=new Image(); im.onload=function(){
    /* 大きい写真は横1600pxまでに縮める（重さ対策） */
    var k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    var im2=new Image(); im2.onload=function(){
      S.img=im2; S.W=c.width; S.H=c.height; S.src=im2.src; S.edge=[]; S.objs=[]; S.cur=null; S.done={}; S.ins=false; S.edgeOn=false;
      $('osInsImg').src=im2.src; $('osIns').style.display='none';
      $('osv').classList.add('on'); document.documentElement.classList.add('nn-os-open');

}
window.nnOsOpen=open;
function close(){ $('osv').classList.remove('on'); document.documentElement.classList.remove('nn-os-open'); }
window.nnOsClose=close;
window.nnOsState=function(){ return S; };
function shoot(){ var i=$('osCam'); i.value=''; i.click(); }
$('osCam').addEventListener('change',function(){ var f=this.files&&this.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ open(r.result); }; r.readAsDataURL(f); });

addEventListener('resize',function(){ if($('osv').classList.contains('on')){ fit(); draw(); } });
})();

<script id="nn-trail-js">
/* ============================================================
   指をなぞると光がついてくる（2026-08-19b・本人の指示）
   線を引く・頂点をつまむ等の細かい操作で「いま指がどこにあるか」が分かるようにする。
   ・画面いっぱいの透明なキャンバスを1枚だけ用意し、指が触れている間だけ描く
   ・座標は clientX/Y をそのまま「画面の実px」として使う（表示倍率 zoom の影響を受けない）
   ・pointer-events:none なので、下のボタンや作図の邪魔は一切しない
   ============================================================ */
(function(){
"use strict";
var cv=null, ctx=null, pts=[], raf=null, active=false, lastT=0;
var LIFE=420;                     /* 光が消えるまで(ms) */
function make(){
  if(cv)return;
  cv=document.createElement('canvas');
  cv.id='nnTrail';
  cv.style.cssText='position:fixed; left:0; top:0; width:100%; height:100%;'
    +'pointer-events:none; z-index:9997;';
  document.body.appendChild(cv);
  ctx=cv.getContext('2d');
}
function fit(){
  var r=cv.getBoundingClientRect();
  /* ★2026-08-26b にじむ光なので等倍で十分。2倍だと描く画素が4倍になり、
     指を置いている間ずっとその分の仕事が挟まっていた（ラグの一因）。 */
  var d=1;
  var w=Math.round(r.width*d), h=Math.round(r.height*d);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  return {r:r, k:cv.width/(r.width||1)};   /* k＝画面px→キャンバスpxの倍率（＝dpr） */
}
function draw(){
  if(!cv){ raf=null; return; }
  var g=fit(), k=g.k, now=performance.now();
  ctx.clearRect(0,0,cv.width,cv.height);
  /* 寿命の切れた点を落とす */
  while(pts.length && now-pts[0].t>LIFE) pts.shift();
  if(pts.length>=2){
    /* しっぽ：新しいほど太く明るい */
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var age=(now-b.t)/LIFE; if(age<0)age=0; if(age>1)age=1;
      var al=(1-age)*0.85;
      /* ★2026-08-26b shadowBlur（にじみ）は1本ごとにぼかし計算が走って重いのでやめ、
         「太く薄い線＋細く明るい線」の2度がきで同じ見え方にする */
      ctx.strokeStyle='rgba(255,180,40,'+(al*0.30).toFixed(3)+')';
      ctx.lineWidth=(7+12*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
      ctx.strokeStyle='rgba(255,217,77,'+al.toFixed(3)+')';
      ctx.lineWidth=(2.5+6*(1-age))*k;
      ctx.beginPath(); ctx.moveTo(a.x*k,a.y*k); ctx.lineTo(b.x*k,b.y*k); ctx.stroke();
    }
  }
  /* 指の先の光 */
  if(active && pts.length){
    var p=pts[pts.length-1];
    var gr=ctx.createRadialGradient(p.x*k,p.y*k,0, p.x*k,p.y*k,9*k);
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.45,'rgba(255,217,77,.80)');
    gr.addColorStop(1,'rgba(255,157,30,0)');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(p.x*k,p.y*k,9*k,0,7); ctx.fill();
  }
  if(active || pts.length){ raf=requestAnimationFrame(draw); }
  else { raf=null; ctx.clearRect(0,0,cv.width,cv.height); }
}
function add(e){
  var now=performance.now();
  if(now-lastT<8) return;          /* 詰めすぎない */
  lastT=now;
  pts.push({x:e.clientX, y:e.clientY, t:now});
  if(pts.length>90) pts.shift();
  if(!raf) raf=requestAnimationFrame(draw);
}
var downX=0, downY=0, movedOn=false;
addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse' && e.buttons===0) return;
  /* ★2026-08-26b タップ（動かさない指）では何も描かない。
     以前は押した瞬間から画面いっぱいのキャンバスを毎コマ描き直していて、
     ボタンを押すたびにその仕事が挟まっていた（ラグの一因）。
     7px以上なぞったときだけ描き始める（なぞりの光は今までどおり）。 */
  active=true; movedOn=false; downX=e.clientX; downY=e.clientY;
},true);
addEventListener('pointermove',function(e){
  if(!active)return;
  if(!movedOn){
    if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)<7) return;
    movedOn=true; make(); pts.length=0;
    pts.push({x:downX, y:downY, t:performance.now()});
  }
  add(e);
},true);
function end(){ active=false; movedOn=false; if(!raf&&cv&&pts.length) raf=requestAnimationFrame(draw); }
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  addEventListener(ev,end,true);
});
})();
</script>

<script id="nn-navfit-js">
/* 下部ナビ（緑の帯）を、中のアイコンより低くしない（2026-09-13u）
   帯の高さを決めるCSSが複数あり、端末で勝ち負けが変わって1段ぶんの高さになると
   2段目が切れる（本人の実機）。中身を実測して足りない分だけ min-height を足す。
   ★余白や位置には触らない（足りているときは何もしない）。 */
(function(){
  function nav(){ return document.getElementById('nav') || document.querySelector('body>nav'); }
  function fit(){
    try{
      var n=nav(); if(!n) return;
      var cs=getComputedStyle(n); if(cs.display==='none') return;
      /* スマホのグリッドはCSSで段数と安全領域を確保。旧補正を回転後に残さない。 */
      if(cs.display==='grid'){ n.style.removeProperty('min-height'); return; }
      var r=n.getBoundingClientRect(); if(!(r.width>r.height)) return;   /* 横長の帯のときだけ */
      var top=1e9,bot=-1e9,k=0,list=n.querySelectorAll('.ni');
      for(var i=0;i<list.length;i++){ var q=list[i].getBoundingClientRect(); if(q.height<2)continue;
        k++; if(q.top<top)top=q.top; if(q.bottom>bot)bot=q.bottom; }
      if(!k) return;
      var need=(bot-top)+(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0)
              +(parseFloat(cs.borderTopWidth)||0)+(parseFloat(cs.borderBottomWidth)||0);
      var cur=parseFloat(n.style.minHeight)||0;
      if(need>r.height+1 && need>8 && need<800 && Math.ceil(need)!==cur)
        n.style.setProperty('min-height',Math.ceil(need)+'px','important');
    }catch(e){}
  }
  function soon(){ try{ requestAnimationFrame(function(){ setTimeout(fit,0); }); }catch(e){ setTimeout(fit,0); } }
  soon();
  addEventListener('load',function(){ soon(); setTimeout(fit,400); },{once:true});
  addEventListener('resize',soon);
  addEventListener('orientationchange',function(){ setTimeout(fit,320); });
  try{ var n0=nav(); if(n0) n0.addEventListener('load',soon,true); }catch(e){}
  try{ var mo=new MutationObserver(soon), t=nav(); if(t) mo.observe(t,{childList:true,subtree:true}); }catch(e){}
})();
</script>
<script id="nn-persist-js">
/* ★2026-08-20a データ保全：ブラウザに「この保存は消さないで」と頼む。
   頼んでおくと、端末の容量が逼迫したときに localStorage が自動削除されにくくなる
   （iOS/Android とも対応。使えない環境では黙って何もしない）。 */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
</script>
<style id="nn-httl-img">
/* ============================================================
   ★2026-08-30g 見出しの平行四辺形を、本人がパワポで作ったフレームの画像に差し替えた（§256）
   ------------------------------------------------------------
   ・形 ＝ icons/httl_frame.png を**3分割（border-image）**で使う。
     左の斜めの端／右の斜めの端 は伸びず、**まん中だけ**が伸びる。
     ＝どんな長さの見出しでも、端の傾き（26.8度）と濃い緑の三角が1画素も崩れない。
     ★右の端を 500px と広く取ってあるのは、濃い緑の三角（左端 x=925）を
       まるごと「伸びない側」に入れるため。ここを狭くすると三角の角度が変わる。
   ・文字 ＝ Noto Sans JP Black（見出しに出る文字だけに絞った 52KB）。
     ★本人がパワポで使った HGP創英角ゴシックUB は Office 専用で、iPhone に無く、
       許諾上ウェブにも載せられない。いちばん近い無料（SIL OFL）の書体に置き換えた。
     ★font-display:swap ＝ 読み終わるまでは端末の書体で出るので、
       表示が1msも遅れない（2026-07-28 の速度の決着を守る）。
   ・色は本人の絵の実測：文字 #502126／フチ 白／枠 #502126（8px＝高さの3.1%）
   ============================================================ */
@font-face{
  font-family:'NNHead';
  src:url('./fonts/notosansjp-black.woff2') format('woff2');  /* 版名は nn-httl-img-js が付け直す（§66） */
  font-weight:400 900; font-style:normal; font-display:swap;
}
.httl{
  font-family:'NNHead','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif !important;
  font-weight:900 !important;
  color:#502126 !important;
  /* 白いフチ。paint-order で**外側**に付く（付けないと字の中に食い込んで細く見える） */
  -webkit-text-stroke:1px #fff !important;
  paint-order:stroke fill;
  text-shadow:none !important;
  letter-spacing:.02em !important;
}
/* 平行四辺形の本体＝本人の画像。CSSで描いていた地・枠・影は全部やめる */
.httl::before{
  transform:none !important;
  background:none !important;
  border-radius:0 !important;
  box-shadow:none !important;
  /* ★em は「その要素の font-size」が基準。現場記録帳には昔の「●」印の指定
     （.httl::before{font-size:9px}）が残っていて、そのままでは端の幅が半分になる。
     見出しの文字の大きさを基準にしたいので、必ず inherit を書くこと。 */
  font-size:inherit !important;
  border-style:solid !important;
  border-color:transparent !important;
  border-width:0 4.4em 0 1.35em !important;
  border-image:var(--nnhttl, url('./icons/httl_frame.png')) 0 500 0 150 fill / 0 4.4em 0 1.35em / 0 stretch !important;
}
html[data-nnphone="1"] .httl{ -webkit-text-stroke-width:.8px !important; }
/* イラストは平行四辺形の内側に。左端は斜めなので、少し右へ寄せないと枠からはみ出す */
.httl > img.hpic{ left:7px !important; }
html[data-nnphone="1"] .httl > img.hpic{ left:5px !important; }
</style>
<script id="nn-httl-img-js">
/* ★同じ名前で絵を差し替えたときのために、URLに版名を付ける（§66の罠）。
   JSが動かなくてもCSS側の予備（版名なしのURL）で出る。 */
(function(){ try{
  var v=(typeof NN_VER!=='undefined'&&NN_VER)?('?v='+NN_VER):'';
  document.documentElement.style.setProperty('--nnhttl',"url('./icons/httl_frame.png"+v+"')");
  /* ★2026-08-31b 書体も同じ名前のまま中身を差し替える（文字を足したとき）。
     版名を付けた @font-face を後ろから足して、古い書体が使われ続けるのを防ぐ。 */
  if(v){ var st=document.createElement('style');
    st.textContent="@font-face{font-family:'NNHead';src:url('./fonts/notosansjp-black.woff2"+v
      +"') format('woff2');font-weight:400 900;font-style:normal;font-display:swap;}";
    document.head.appendChild(st); }
}catch(_){}})();
</script>

<style id="nn-navedge">
/* ============================================================
   選択中のナビが画面の端で切れていた（2026-09-07・§320）
   ------------------------------------------------------------
   選ばれているボタンは 1.25倍に大きくなる（§11）。
   大きくなるぶんは左右へ均等に広がるので、**端のボタンだけ画面の外へ出て切れる**。
   実測：たて向き 2.2px／パソコン（左のたて帯・幅86px）5.5px。
   場所は1pxも動かさずに直したいので、**倍率だけ帯に収まる値に下げる**。
   （1.25→1.18／PCは 1.25→1.10。見た目の「選ばれている感じ」は変わらない）
   ============================================================ */
nav .ni.hasimg.on, nav#nav .ni.hasimg.on{transform:scale(1.18) !important;}
nav .ni.hasimg.on:hover, nav#nav .ni.hasimg.on:hover{transform:scale(1.18) !important;}
html:not([data-nnphone="1"]) nav .ni.hasimg.on,
html:not([data-nnphone="1"]) nav#nav .ni.hasimg.on{transform:scale(1.10) !important;}
html:not([data-nnphone="1"]) nav .ni.hasimg.on:hover,
html:not([data-nnphone="1"]) nav#nav .ni.hasimg.on:hover{transform:scale(1.10) !important;}
